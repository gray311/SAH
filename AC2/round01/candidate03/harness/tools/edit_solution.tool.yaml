type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. For this task, you often need to COMPLETELY RECONSTRUCT the
  function definition:

  - Replace the random initialization with a structured construction (piecewise, spline, mixture)

  - Prefer SEARCH/REPLACE for small hyperparameter changes; full rewrite for new function class

  - Keep the run() entry point signature identical'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
