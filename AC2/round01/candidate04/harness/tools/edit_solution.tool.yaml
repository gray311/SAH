type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. For this task, **complete rewrites** are preferred when trying
  new function families.

  Format: full ```python block with new implementation, or targeted diffs for parameter tuning.

  Preserves imports and fixed entry function outside the block.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
