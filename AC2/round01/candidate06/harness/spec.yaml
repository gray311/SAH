schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis, harmonic analysis, and mathematical discovery.
  Your mission: Surpass C2 = 0.8962799441554086 (the current world record) for the second autocorrelation inequality constant.
  
  The seed program uses gradient descent on a parametric function representation. While this found 0.999789xrecord, it is stuck in local optima.
  
  CORE INSIGHT: Step functions and their combinations (used by AlphaEvolve) achieve the record. Pure gradient descent struggles.
  
  STRATEGY:
  1. Use probe_solution to explore function variants cheaply (first ~2000 discretization points)
  2. Implement multi-strategy exploration:
     - Strategy A: Refine existing continuous optimization with adaptive learning rates
     - Strategy B: Construct piecewise linear/step functions explicitly (combining known good building blocks)
     - Strategy C: Try Fourier-space optimization with positivity constraints
  3. Only call evaluate_solution once you have strong probe evidence a variant will beat record
  4. If stuck near 0.999789, explicitly try step-function hybrids: combine a Gaussian center with step-function wings
  
  Preserve the entry function. Make one substantive change per turn. Never evaluate the same code twice.
skill_description: |
  Multi-strategy C2 optimization harness. Combines gradient-based refinement with explicit piecewise/step function construction to break through the 0.8962799441554086 barrier. Uses probes for variant ranking.
skill_body: |
  # C2 Barrier-Breaking Strategy
  
  ## Objective
  Surpass C2 = 0.8962799441554086. Current best in session: 0.999789xrecord.
  
  ## Why We Are Stuck
  Pure gradient descent on continuous representations gets trapped. The record-holder used step functions.
  
  ## Multi-Strategy Playbook
  
  ### Strategy 1: Adaptive Gradient Refinement
  - Reduce learning rate by 10x if loss plateauing
  - Use warmup + cosine decay with extended decay phase
  - Add gradient clipping (max norm 1.0) for stability
  
  ### Strategy 2: Explicit Piecewise Construction (PRIORITY)
  Construct f(x) as piecewise-linear segments explicitly:
  breakpoints = jnp.array([...] ) # e.g., [-5, -3, -1, 1, 3, 5]
  values = jnp.array([...])         # f(breakpoints), ensure >= 0
  This gives the optimizer discrete control over function shape.
  
  ### Strategy 3: Step-Function Hybrids
  Start with a Gaussian: f(x) = exp(-x^2/(2*sigma^2))
  Then modify to add flat regions (step-like) at the tails:
  f = jax.nn.relu(exp(-x**2/(2*sigma**2)) * (1 + step_mask))
  This combines smooth center (good for convolution peak) with step wings (like record-holder).
  
  ### Strategy 4: Fourier-Space Optimization
  Optimize FFT coefficients directly, then IFFT to get f:
  fft_coeffs = ...  # Initialize with Gaussian in frequency domain
  f = jnp.fft.ifft(fft_coeffs).real
  Enforce positivity: f = exp(softplus(log(f + eps)))
  
  ## Probe-Based Iteration Loop
  1. Pick a strategy
  2. Generate 5-10 variants using probe_solution (cheap, ~10s each)
  3. Rank by probe score
  4. Pick top 1-2, call evaluate_solution (full score, ~minutes)
  5. If beaten best_so_far, escalate to more variants
  
  ## Tool Usage
  - edit_solution: Implement ONE strategy variant. Use SEARCH/REPLACE for targeted changes.
  - probe_solution: Test 5-10 variants before full evaluation. Use subsampled discretization (fewer intervals).
  - evaluate_solution: Only for variants with strong probe promise. Budget: ~20 evals total.
  - finish: When best_so_far >= 1.0005xrecord or out of evaluations.
  
  ## Critical Success Factors
  - Diversity: Try fundamentally different function representations (continuous, piecewise, step-based)
  - Convergence: Use smaller steps near 0.999789 to fine-tune
  - No Wasting: Each evaluation must encode a fresh hypothesis
  
  ## Known Patterns from Literature
  - AlphaEvolve record: step functions (piecewise constant)
  - Symmetry: Even functions (f(x) = f(-x)) reduce complexity
  - Normalization: int f appears in denominator, so scale matters
tool_descriptions:
  edit_solution: |
    Change the EVOLVE-BLOCK code. Prefer targeted SEARCH/REPLACE diffs for small changes.
    Key change areas: (1) Learning rate schedule parameters, (2) Function construction logic, (3) Discretization resolution.
    For piecewise/step strategies, completely rewrite the function definition section.
  evaluate_solution: |
    Full evaluation on the complete problem. Returns combined_score (higher is better), validity, error, best_so_far, and evaluations_left.
    Budget: ~20 total. Each call costs 1. Use sparingly - only after probe-based ranking.
  probe_solution: |
    CHEAP evaluation on first ~2000 discretization points. Returns approximate C2 ratio.
    Does NOT consume evaluation budget. Use this to rank 5-10 variants before any full evaluation.
    Scores are approximate but relative ordering is usually reliable for selection.
  finish: |
    End the session. The best-scoring version is submitted automatically. Call when:
    - evaluations_left == 0, or
    - best_so_far >= 1.0005xrecord (~0.8973), or
    - confident no improvement possible.
sampling:
  temperature: 0.4
  top_p: 0.8
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 10000
new_tools:
  - name: construct_step_variant
    description: |
      Build a piecewise step function variant with specified breakpoints and heights.
      Returns a function that is constant between breakpoints (step function).
      Ideal for testing the step function approach that achieved the record.
      Call this to generate diverse step-function candidates for probe testing.
    input_schema:
      type: object
      properties:
        num_steps:
          type: integer
          description: Number of steps in the piecewise function
        seed:
          type: integer
          description: Random seed for breakpoint/height generation
    implementation_py: |
      def run(ctx, args):
          import jax.numpy as jnp
          import jax.random as jrandom
          import jax
          
          num_steps = args.get("num_steps", 20)
          seed = args.get("seed", 42)
          num_intervals = ctx.hypers.get("num_intervals", 50)
          
          key = jrandom.PRNGKey(seed)
          # Generate random breakpoints symmetric around 0
          half_steps = num_steps // 2
          endpoints_left = -jnp.linspace(0.5, 5.0, half_steps + 1)
          endpoints_right = jnp.linspace(-5.0, -0.5, half_steps)
          endpoints = jnp.concatenate([endpoints_left, endpoints_right])
          endpoints = jnp.sort(endpoints)
          
          # Generate heights (must be non-negative)
          heights_key = jrandom.fold_in(key, 1)
          heights = jrandom.uniform(heights_key, (num_steps,))
          heights = jnp.maximum(heights, 1e-6)
          
          result = {
              "type": "step_function",
              "num_steps": num_steps,
              "breakpoints": endpoints.tolist(),
              "heights": heights.tolist(),
              "note": "Step function variant - tested with probe_solution to rank before full eval"
          }
          return result
  - name: hybrid_gaussian_step
    description: |
      Build a hybrid function: Gaussian center + step-function wings.
      Combines smooth peak (good for convolution) with flat tails (like record-holder).
      Call this to test the AlphaEvolve-style hybrid approach.
    input_schema:
      type: object
      properties:
        sigma:
          type: number
          description: Gaussian width parameter
        step_width:
          type: number
          description: Width of step regions at tails
        step_height:
          type: number
          description: Height of step regions
    implementation_py: |
      def run(ctx, args):
          import jax.numpy as jnp
          import jax
          
          sigma = args.get("sigma", 1.0)
          step_width = args.get("step_width", 2.0)
          step_height = args.get("step_height", 0.5)
          
          def hybrid_func(x):
              gaussian = jax.nn.exp(-x**2 / (2 * sigma**2))
              step_mask = jnp.abs(x) > step_width
              hybrid = jax.nn.relu(gaussian + step_mask * (step_height - gaussian))
              return hybrid
          
          result = {
              "type": "hybrid_gaussian_step",
              "sigma": sigma,
              "step_width": step_width,
              "step_height": step_height,
              "note": "Hybrid approach - smooth center, step wings. Good for exploring near-record solutions."
          }
          return result
remove_tools: []
new_skills:
  - name: barrier-breaking-c2
    description: |
      Strategy for surpassing C2 = 0.8962799441554086 using multi-method exploration.
      Combines gradient refinement with explicit step/piecewise constructions.
    body: |
      # Barrier-Breaking C2 Strategy
      ## Current State
      - Best achieved: 0.999789xrecord (approx 0.89627)
      - Target: > 1.0000xrecord (> 0.8962799441554086)
      
      ## Why Gradient Descent Alone Fails
      - Continuous representations smooth out the sharp features that achieve the record
      - The record-holder (AlphaEvolve) used step functions
      - Need to explicitly construct or discover step-like behavior
      
      ## Actionable Strategies
      ### 1. Explicit Piecewise Construction
      Replace continuous function with explicit breakpoints/heights:
      - Use SEARCH/REPLACE to change the function definition
      - Test with 10-20 breakpoints (adjustable)
      - Probes: 5 variants with different breakpoint distributions
      
      ### 2. Hybrid Gaussian-Step
      Combine smooth center with step wings:
      - Start: f(x) = exp(-x^2/(2*sigma^2))
      - Modify: f(x) = max(gaussian, step_height) for |x| > step_width
      - Parameters: sigma in [0.5, 2.0], step_width in [1.0, 3.0], step_height in [0.1, 1.0]
      
      ### 3. Fourier-Positivity Optimization
      - Initialize FFT coefficients from a Gaussian in frequency domain
      - Enforce positivity after IFFT: f = exp(softplus(log(f + eps)))
      - Optimizes coefficients directly
      
      ### 4. Learning Rate Adaptation
      If stuck: reduce LR by 10x, extend warmup to 2000 steps
      - Use: optax.chain(optax.scale(0.1), optax.adam(learning_rate=...))
      
      ## Evaluation Protocol
      1. Pick a strategy
      2. Generate 5-10 variants with probe_solution
      3. Rank by probe score
      4. Evaluate top 1-2 with evaluate_solution
      5. If no improvement after 3 full evals, change strategy
      
      ## Success Metrics
      - combined_score > 1.0000 (definitive improvement)
      - combined_score > 1.0005 (safe margin)
new_middlewares:
  - name: remind_probe_first
    hook: before_model
    description: |
      Remind the solver to use probe_solution before expensive evaluate_solution calls.
      Critical for budget efficiency: rank many variants cheaply, confirm best ones.
    implementation_py: |
      def before_model(hook_input):
          return "Remember: Use probe_solution to rank 5-10 variants BEFORE calling evaluate_solution. Budget is expensive - rank many, evaluate few."
