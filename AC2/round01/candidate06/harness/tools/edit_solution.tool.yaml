type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. Prefer targeted SEARCH/REPLACE diffs for small changes.

  Key change areas: (1) Learning rate schedule parameters, (2) Function construction logic, (3) Discretization
  resolution.

  For piecewise/step strategies, completely rewrite the function definition section.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
