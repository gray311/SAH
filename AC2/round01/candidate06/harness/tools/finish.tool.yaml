type: tool
name: finish
description: 'End the session. The best-scoring version is submitted automatically. Call when:

  - evaluations_left == 0, or

  - best_so_far >= 1.0005xrecord (~0.8973), or

  - confident no improvement possible.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
