type: tool
name: hybrid_gaussian_step
description: 'Build a hybrid function: Gaussian center + step-function wings.

  Combines smooth peak (good for convolution) with flat tails (like record-holder).

  Call this to test the AlphaEvolve-style hybrid approach.'
input_schema:
  type: object
  properties:
    sigma:
      type: number
      description: Gaussian width parameter
    step_width:
      type: number
      description: Width of step regions at tails
    step_height:
      type: number
      description: Height of step regions
