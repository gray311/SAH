type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. Use targeted SEARCH/REPLACE diffs for small changes. Formats:
  (1) diff blocks with exact SEARCH lines matching current code, or (2) full rewrite. Only modify inside
  EVOLVE-BLOCK; imports and fixed entry are preserved.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
