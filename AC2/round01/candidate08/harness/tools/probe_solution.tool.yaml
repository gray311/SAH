type: tool
name: probe_solution
description: Cheap evaluation on subsampled data. Returns approximate score that is NOT comparable to
  full scores. Use to rank 3-5 variants BEFORE calling evaluate_solution. Separate budget of ~30 probes.
  Fast (~10s vs minutes). DO NOT submit a solution based solely on probe scores.
