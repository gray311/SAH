type: tool
name: probe_solution
description: Cheaply score the CURRENT program on SUBSAMPLED data (~10s vs minutes). Fast (~10s per probe),
  separate budget (e.g., 30 probes available), NOT evaluated through full evaluation budget. Scores are
  approximate and NOT directly comparable to full evaluation scores — use this to rapidly rank multiple
  variants (e.g., 5-10 function representations, 20-50 parameterizations each), then confirm the top 3-5
  candidates with evaluate_solution. Do not use probes instead of evaluate_solution for final verification;
  use probes to explore MORE candidates before committing eval budget.
input_schema:
  type: object
  properties: {}
  additionalProperties: false
