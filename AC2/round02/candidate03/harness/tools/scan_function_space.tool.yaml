type: tool
name: scan_function_space
description: 'Analyze the current function representation in the EVOLVE-BLOCK and recommend alternative
  exploration directions.

  Reports: detected function class (piecewise-linear, piecewise-constant, Gaussian mixture, B-spline,
  exponential, Fourier),

  parameter count estimate, numerical stability, and 3-5 alternative representations to try next.

  Call at the start to identify your current position in function space, and after each phase to ensure
  diversity.'
