type: tool
name: edit_solution
description: 'Change the code inside the EVOLVE-BLOCK region. CRITICAL: If the current code uses piecewise-linear
  initialization, you must replace it with a different function representation (step functions, Gaussian
  mixtures, etc.). For small changes, use SEARCH/REPLACE. For major representation changes, provide the
  full new EVOLVE-BLOCK body. The fixed entry function outside the block must be preserved.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
