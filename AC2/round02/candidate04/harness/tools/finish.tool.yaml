type: tool
name: finish
description: End the session when evaluation budget is exhausted or you cannot improve past the seed score.
  The best-scoring program is submitted automatically.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
