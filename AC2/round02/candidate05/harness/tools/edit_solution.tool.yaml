type: tool
name: edit_solution
description: 'Change EVOLVE-BLOCK code. MUST be substantive: change num_intervals by factor 2-5, switch
  function class, or modify initialization structure. Use SEARCH/REPLACE diffs for targeted edits, or
  full rewrites for major changes. Never edit only hyperparameters without structural change.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
