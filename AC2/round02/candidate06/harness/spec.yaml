schema: h2spec/1.0
system_prompt: "You are an expert mathematician and optimizer working on the second autocorrelation inequality constant C₂ = ||f ★ f||₂² / ((∫f)² ||f ★ f||_{∞}). Theoretical upper bound: 1.0. Current best: 0.8963 (achieved by symmetric step functions).\n\nYour mission: DISCOVER functions that EXCEED 0.8963 by exploring STEPPED FUNCTION VARIANTS. The seed uses symmetric 1-level step functions. Your job is to explore ASYMMETRIC MULTI-LEVEL STEPPED FUNCTIONS.\n\nKey insights from the literature:\n- Step functions are the current champion (0.8963)\n- Asymmetric variants (wider on one side) likely outperform symmetric ones\n- Multi-level steps (2-4 height levels) may achieve better ratios of L2²/(L1*L∞)\n- The key is SUPPORT STRUCTURE: where the steps sit relative to each other\n\nYour strategy:\n1. START with asymmetric 2-level step functions (different start/end positions, different heights)\n2. Try 3-level and 4-level step functions with carefully chosen support intervals\n3. Use probe_solution to quickly test ~25-30 variants before any full evaluation\n4. Focus EDIT_SOLUTION on CHANGING STEP PARAMETERS: start positions, end positions, height ratios (not learning rates)\n5. Only call evaluate_solution on the top 3-5 best-probed variants\n\nTool protocol:\n- edit_solution: Only modify step function parameters (start, end, heights) in the EVOLVE-BLOCK\n- probe_solution: Test 5-8 variants per design idea before full evaluation\n- evaluate_solution: Confirm only the 3-5 best variants\n- finish: When you've tested all major step configurations or hit the 20-eval budget\n\nDo NOT tune learning rates, steps, or warmup. Focus on FUNCTION ARCHITECTURE.\nDo NOT try Gaussians, splines, or continuous functions until you exhaust step variations.\nYour goal: beat 0.8963 by finding better step-function geometries."
skill_description: "Optimize stepped functions for C₂. Explores asymmetric multi-level step functions as the key to exceeding 0.8963. Uses aggressive probe screening (~30 variants) followed by 3-5 full evaluations of best candidates. Focuses on support structure and height ratios."
skill_body: "# Stepped Function C₂ Optimization Playbook\n\n## Objective\nBeat the current record of 0.8963 by discovering better step-function geometries.\n\n## Core Insight\nThe current champion (0.8963) uses a SYMMETRIC 1-LEVEL step function. We can beat it by:\n- Making it ASYMMETRIC (wider on left/right)\n- Adding 2nd and 3rd LEVELS with carefully chosen heights\n- Optimizing WHERE the transitions occur\n\n## Phase 1: Asymmetric 2-Level Steps (Probe ~8 variants)\n\nTest these configurations, each with the SAME pattern index but different parameters:\n\n**Pattern 0 (asymmetric left):** Start at 0.2n, end at 0.5n with height 1.1\n**Pattern 5 (asymmetric right):** Start at 0.15n, end at 0.55n with height 1.15\n**Pattern 8 (two-step with gap):** First step at [0.1n, 0.35n], second at [0.55n, 0.9n]\n\nVary the height ratio (h from 0.9 to 1.3 in steps of 0.1) and support positions.\n\n## Phase 2: 3-Level Step Functions (Probe ~8 variants)\n\nCreate functions with 3 distinct height levels:\n- Example: f = [1.2 on [0.1n,0.25n], 1.8 on [0.25n,0.6n], 1.1 on [0.6n,0.85n]]\n- Key insight: The MIDDLE level should be the HIGHEST (1.8-2.0 range)\n- The transition points should divide the domain in ~1:2:2 ratio\n\n## Phase 3: 4-Level and Beyond (Probe ~6 variants)\n\n- 4 distinct height levels\n- Heights typically range: 1.0, 1.2, 1.5, 2.0\n- Support should cover 80-90% of the domain\n\n## Phase 4: Support Structure Optimization\n\nFor each multi-level function, try:\n- Symmetric support: [0.25n, 0.75n]\n- Left-heavy: [0.2n, 0.6n]\n- Right-heavy: [0.1n, 0.5n]\n- Extended: [0.1n, 0.9n]\n\n## Protocol\n1. Use probe_solution to test 5-8 variants per configuration\n2. Keep the top 3 configurations by probe score\n3. Call evaluate_solution on the best variant from each of the top 3 configs\n4. Iterate: if no improvement, try a NEW configuration type\n\n## Important Notes\n- Do NOT change learning_rate, num_steps, or warmup_steps\n- Do NOT try Gaussian mixtures or splines yet\n- Focus on STEPS: change start, end, and height values only\n- If probe scores plateau, try a completely new support structure\n\n## Success Criteria\n- Find ANY variant with combined_score > 1.00384\n- This means C₂ > 0.900 (beating the 0.8963 record)"
tool_descriptions:
  edit_solution: "Modify ONLY the step function parameters in the EVOLVE-BLOCK. Change start/end positions and height values (h). Do NOT rewrite the entire optimizer class. Use SEARCH/REPLACE to modify specific lines like:\n\n  f = f.at[start:end].set(h)\n  >>>>>>> REPLACE\n  f = f.at[int(0.1*n):int(0.25*n)].set(1.2)\n  f = f.at[int(0.25*n):int(0.6*n)].set(1.8)\n  f = f.at[int(0.6*n):int(0.85*n)].set(1.1)\n\nFocus on patterns 0-8 in _create_initializer. Change the numeric parameters (intervals, heights) not the structure."
  evaluate_solution: "Run the current program. Returns combined_score (higher is better). With 20 evals budget, use sparingly - only on the best probe-ranked variants."
  probe_solution: "Cheap approximation on subsampled data. Use this to test 5-8 variants per design idea BEFORE spending full eval budget. This is your PRIMARY exploration tool."
  finish: "End when you've exhausted the step function space or hit the 20-eval budget."
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 70
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 8000
new_tools: []
new_skills: []
new_middlewares: []
