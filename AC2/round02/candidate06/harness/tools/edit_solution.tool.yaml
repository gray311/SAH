type: tool
name: edit_solution
description: "Modify ONLY the step function parameters in the EVOLVE-BLOCK. Change start/end positions\
  \ and height values (h). Do NOT rewrite the entire optimizer class. Use SEARCH/REPLACE to modify specific\
  \ lines like:\n\n  f = f.at[start:end].set(h)\n  >>>>>>> REPLACE\n  f = f.at[int(0.1*n):int(0.25*n)].set(1.2)\n\
  \  f = f.at[int(0.25*n):int(0.6*n)].set(1.8)\n  f = f.at[int(0.6*n):int(0.85*n)].set(1.1)\n\nFocus on\
  \ patterns 0-8 in _create_initializer. Change the numeric parameters (intervals, heights) not the structure."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
