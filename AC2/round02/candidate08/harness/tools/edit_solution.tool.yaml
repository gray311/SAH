type: tool
name: edit_solution
description: Change code in EVOLVE-BLOCK. Use SEARCH/REPLACE for small edits; full rewrite for structural
  changes. Score with probe or evaluate.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
