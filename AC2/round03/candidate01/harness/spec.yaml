new_middlewares:
- name: enforce_diversification
  hook: before_model
  description: middleware that enforces function family diversification
  implementation_py: |
    def before_model(hook_input):
        state = hook_input.get("state", {})
        iteration = state.get("iteration", 0)
        family_streak = state.get("family_streak", 0)
        
        if iteration >= 5 and family_streak >= 5:
            families_explored = state.get("families_explored", [])
            if len(families_explored) < 3:
                return "DIVERSIFICATION_STALLED: You've been exploring the same function family for 5 iterations. Call structural_probe and switch to a DIFFERENT function family (not parameter tuning). Use probe_solution to test 8+ variants of a new family before evaluating."
            elif len(families_explored) >= 3:
                return "DIVERSIFICATION_STALLED: You've explored 3+ families but not improved. Re-examine your strategy - are you tuning or exploring? Switch to a completely different function class."
        
        return None
