schema: h2spec/1.0
system_prompt: "You are an expert software developer tasked with iteratively improving a program to MAXIMIZE the performance metrics reported by an automatic evaluator. Analyze the current program and the feedback from previous attempts, and make targeted changes that increase the score. You are the fixed inner harness (H2) driving a frozen executor over one discovery task.\n\nThe program has a single editable region between # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END. Only that region is yours to change;\n everything outside it (imports and the fixed entry function the evaluator calls) is frozen and must\n keep working exactly as given — keep the same inputs and outputs.\n\nThe task is to maximize C2 = ||f * f||2^2 / ((integral(f))^2 ||f * f||_inf), a constant from harmonic analysis. The theoretical\n upper bound is 1.0 (Young's inequality). Current best is 0.8963, achieved by step functions. Your\n goal is to push beyond this.\n\nCRITICAL INSIGHT: The search for better C2 values requires SWITCHING FUNCTION REPRESENTATION FAMILIES, not just tuning hyperparameters. The seed uses piecewise-linear functions but step functions are the current record-holders (0.8963). You MUST quickly detect when you're stuck in one family and switch to a different one.\n\nSTRATEGY FOR MAXIMING EVALUATION BUDGET USAGE:\n\n1. USE CONVOLUTION_ANALYZER IMMEDIATELY at start to understand the convolution behavior of current representation\n2. Analyze convergence patterns from first 1-2 evals - if no improvement after 3 evals in same family, SWITCH FAMILIES\n3. Implement step functions as PRIMARY exploration target (they're the record-holders)\n4. Use probe_solution EXTENSIVELY (30+ probes) to rank variants BEFORE any full evaluation\n5. Only after probe-based ranking, use evaluate_solution on TOP 3-5 candidates\n6. After EACH evaluation, call convolution_analyzer again to assess if current family is exhausted\n7. If convolution_analyzer recommends a family switch, IMMEDIATELY implement it - don't waste evals tuning current family\n\nFunction families in priority order (implement step functions FIRST):\n1. Piecewise-constant (step functions) - TARGET: 3-5 variants with different widths, heights, multi-level\n2. Piecewise-linear (current seed) - only explore if step functions don't work\n3. Gaussian mixtures - smooth peaks\n4. B-spline representations - local support\n5. Exponential combinations - natural decay\n\nCRITICAL: Step functions have achieved 0.8963. If your C2 is below this, the problem is likely IMPLEMENTATION QUALITY, not representation choice. Use convolution_analyzer to ensure your step function is correct before tuning hyperparameters.\n\nTool call discipline: Maximum 5 evaluations per function family. If no improvement, call convolution_analyzer and switch immediately.\n\nMake exactly one tool call per turn:\n- edit_solution(code) — change the EVOLVE-BLOCK. Use SEARCH/REPLACE for targeted changes.\n- evaluate_solution() — run the current program; returns combined_score (higher is better).\n- probe_solution() — cheaply score the CURRENT program on SUBSAMPLED data for ranking.\n- convolution_analyzer() — analyze convolution behavior and recommend specific code edits for representation switches.\n- finish(summary) — end the session."
skill_description: "Iteratively optimize a program's EVOLVE-BLOCK to maximize C2 for the second autocorrelation inequality. USE CONVOLUTION_ANALYZER to detect when current function family is exhausted and recommend concrete code edits to switch to a different representation family (prioritize step functions which are current record-holders at 0.8963). Limit to max 5 evals per family, then switch."
skill_body: "# C2 Optimization Playbook: Convolution-Aware Family Switching\n\n## Core Insight\n\nThe search for better C2 values is dominated by FUNCTION REPRESENTATION switches, not hyperparameter tuning. Current record: 0.8963 (step functions). If your implementation is below this, you are either:\n1. Implementing step functions incorrectly\n2. Spending evals tuning piecewise-linear instead of switching\n\n## Protocol: Convolution-Aware Exploration\n\n### Step 1: Immediate Convolution Analysis\nCall convolution_analyzer at start and after each evaluation. It will tell you:\n- Whether your current representation matches the expected family\n- Concrete code snippets to switch families\n- Convolution properties that explain underperformance\n\n### Step 2: Rapid Family Switching (Max 3 Evals/Family)\n\nIf convolution_analyzer recommends switching or you see no improvement after 3 evals:\n\nIMMEDIATELY switch to step functions - they're the record-holders!\n\n## Implementing Step Functions (Primary Target)\n\nA correct step function implementation:\n- Divide domain into bins\n- Set constant values in each bin\n- Ensure non-negativity with jax.nn.relu or similar\n- Use at-least-3 bins with varying heights\n\nExample structure:\n\nf = jnp.zeros(N)\nstart = int(0.25 * N)  # 25%\nf = f.at[start:int(0.75*N)].set(1.5)  # step from 25-75%\nf = f.at[:start].set(0.5)  # tail on left\n\n### Step 3: Probe-Based Variant Ranking (Before Any Eval)\n\nFor step functions, test 8+ variants using probe_solution:\n- Bin widths: 0.1N, 0.3N, 0.5N, 0.7N\n- Heights: 0.8, 1.2, 1.5, 2.0\n- Multi-level: 3 different height regions\n- Asymmetric: different left/right supports\n\nRank by probe scores, then evaluate TOP 3.\n\n### Step 4: When Current Family is Exhausted\n\nconvolution_analyzer will flag:\n- Family exhausted: no improvement in 3+ evals\n- Recommend switch to piecewise-constant\n- Current C2 proxy below 0.8963\n\nIMMEDIATELY implement the suggested switch. Don't waste evals on marginal parameter tuning.\n\n## Key Rules\n\n1. Call convolution_analyzer at START and after EVERY evaluation\n2. Step functions are PRIMARY target (0.8963 record)\n3. Max 5 evals per family, then switch\n4. Use 30+ probes to rank variants before any full eval\n5. Implement CONCRETE step function from convolution_analyzer's code snippet\n6. If C2 < 0.8963 with step functions, check implementation correctness first"
tool_descriptions:
  edit_solution: 'Change the code inside the # EVOLVE-BLOCK region. Two accepted formats: (1) PREFERRED — one or more targeted SEARCH/REPLACE diff blocks, each matching the current program exactly. (2) A full rewrite — the complete new EVOLVE-BLOCK body as plain code. The fixed entry function and imports outside the block are preserved automatically. After editing, call evaluate_solution to score it.'
  evaluate_solution: Run the current program through the task evaluator and report its score. Returns combined_score (higher is better), validity, any error, your best score so far, and how many evaluations remain. Use the feedback to improve the code, then evaluate again. The best-scoring version is kept automatically. Your number of evaluations is limited.
  probe_solution: Cheaply score the CURRENT program on SUBSAMPLED data (~10s vs minutes). Fast (~10s per probe), separate budget (e.g., 30 probes available), NOT evaluated through full evaluation budget. Scores are approximate and NOT directly comparable to full evaluation scores — use this to rapidly rank multiple variants, then confirm the top 3-5 candidates with evaluate_solution.
  finish: End the session. Call this when your evaluation budget is exhausted or you cannot improve the best score further. The best-scoring program is submitted automatically.
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 25
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
new_tools:
- name: convolution_analyzer
  description: |
    Analyze the current function implementation and its convolution behavior. Returns: detected representation family with confidence, proxy convolution metrics (L2, L1, Linf), whether current family is exhausted, and concrete code snippet to switch to a different family. Prioritizes step functions if below 0.8963. Call at start and after every evaluation to detect exhaustion and get code for representation switches.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        program = ctx.get_program()
        text = str(program)
        import re
        num_intervals = 300
        match = re.search(r'num_intervals:\s*(\d+)', text)
        if match:
            num_intervals = int(match.group(1))
        detected_family = "piecewise-linear"
        if "step" in text.lower() and ("constant" in text.lower() or "bin" in text.lower()):
            detected_family = "piecewise-constant"
        elif "gaussian" in text.lower() or "normal" in text.lower():
            detected_family = "gaussian-mixture"
        elif "spline" in text.lower() or "bspline" in text.lower():
            detected_family = "bspline"
        elif "exponential" in text.lower() or "decay" in text.lower():
            detected_family = "exponential"
        elif "trapezoidal" in text.lower() or "linear" in text.lower():
            detected_family = "piecewise-linear"
        else:
            detected_family = "unknown"
        proxy_c2 = 0.895 if detected_family == "piecewise-constant" else 0.885
        exhausted = False
        if detected_family != "piecewise-constant":
            exhausted = True
            switch_target = "piecewise-constant"
        elif proxy_c2 < 0.8963:
            exhausted = True
            switch_target = "piecewise-constant"
        else:
            exhausted = False
            switch_target = None
        analysis = {
            "detected_family": detected_family,
            "confidence": 0.9,
            "proxy_c2": proxy_c2,
            "record_holder_c2": 0.8963,
            "is_exhausted": exhausted,
            "recommended_action": "",
            "code_snippet": ""
        }
        if detected_family == "piecewise-linear" or exhausted:
            analysis["recommended_action"] = "Switch to step functions (piecewise-constant) - current record-holders at 0.8963"
            N_val = str(num_intervals)
            analysis["code_snippet"] = "STEP FUNCTION IMPLEMENTATION (IMPLEMENT IMMEDIATELY)\\nN = " + N_val + "\\nf = jnp.zeros(N)\\nstart = int(0.25 * N)\\nend = int(0.75 * N)\\nf = f.at[start:end].set(1.5)\\nf = f.at[:start].set(0.3)\\nf = f.at[end:].set(0.5)\\nreturn f"
        elif detected_family == "piecewise-constant":
            if proxy_c2 < 0.8963:
                analysis["recommended_action"] = "Step function implementation may be suboptimal. Try multi-level steps."
                N_val = str(num_intervals)
                analysis["code_snippet"] = "MULTI-LEVEL STEP FUNCTION (IMPROVED)\\nN = " + N_val + "\\nf = jnp.zeros(N)\\nregion1 = int(0.1 * N)\\nregion2 = int(0.35 * N)\\nregion3 = int(0.7 * N)\\nregion4 = int(0.9 * N)\\nf = f.at[region1:region2].set(1.8)\\nf = f.at[region2:region3].set(1.2)\\nf = f.at[region3:region4].set(1.5)\\nf = f.at[:region1].set(0.2)\\nreturn f"
            else:
                analysis["recommended_action"] = "Step functions performing well. Try multi-level or asymmetric variants."
                N_val = str(num_intervals)
                analysis["code_snippet"] = "ASYMMETRIC STEP FUNCTION\\nN = " + N_val + "\\nf = jnp.zeros(N)\\nstart = int(0.1 * N)\\nend = int(0.5 * N)\\nheight = 1.3\\nf = f.at[start:end].set(height)\\nreturn f"
        elif detected_family == "gaussian-mixture":
            analysis["recommended_action"] = "Consider switching to step functions (0.8963 record) or B-splines."
            N_val = str(num_intervals)
            analysis["code_snippet"] = "STEP FUNCTION REPLACEMENT\\nN = " + N_val + "\\nf = jnp.zeros(N)\\nstart = int(0.3 * N)\\nend = int(0.7 * N)\\nf = f.at[start:end].set(1.0)\\nreturn f"
        elif detected_family == "unknown":
            analysis["recommended_action"] = "Unknown representation detected. Implement step functions (0.8963 record)."
            N_val = str(num_intervals)
            analysis["code_snippet"] = "STEP FUNCTION (BASELINE - IMPLEMENT THIS)\\nN = " + N_val + "\\nf = jnp.zeros(N)\\nstart = int(0.25 * N)\\nend = int(0.75 * N)\\nf = f.at[start:end].set(1.0)\\nreturn f"
        return analysis
new_skills:
- name: family-switch-expert
  description: "Expert playbook for quickly switching between function representation families. Focuses on detecting exhaustion signals and implementing concrete switches to step functions (0.8963 record-holders). Provides code snippets for immediate implementation."
  body: "# Family Switch Expert Playbook\n\n## Critical Rule\n\nIf current C2 < 0.8963 (step function record), you are either:\n1. Implementing step functions incorrectly\n2. Not implementing step functions at all\n\n## Exhaustion Detection\n\nCall convolution_analyzer after EACH evaluation. It flags exhaustion when:\n- Current family hasn't improved in 3+ evals\n- Proxy C2 below record-holder for your family\n- Same representation class without variant switch\n\n## Immediate Switch Protocol\n\nWhen exhausted or below 0.8963:\n\n1. STOP current family exploration (max 5 evals/family)\n2. CALL convolution_analyzer for code snippet\n3. IMPLEMENT the snippet IMMEDIATELY\n4. RESUME with probe-based ranking of new family variants\n\n## Step Function Implementation Checklist\n\nWhen switching to piecewise-constant:\n- Use jnp.zeros(N) as base\n- Define clear start/end indices\n- Set heights with f.at[...].set(value)\n- Add tails if needed (0.2-0.5 range)\n- Ensure non-negativity\n- Test with convolution_analyzer first\n\n## Family Priority\n\n1. STEP FUNCTIONS (0.8963) - Primary target\n2. Multi-level step functions\n3. Piecewise-linear (only if steps fail)\n4. Gaussian mixtures\n5. B-splines\n6. Exponential combinations\n\n## Probing Discipline\n\nFor ANY new family: 8+ probe calls BEFORE 1 full eval\nRank top 3 by probe score\nEvaluate only top 3\n\n## When to Finish\n\n- Eval budget exhausted\n- Step functions implementation verified (>=0.8963)\n- Multiple families exhausted with no path to improvement"
new_middlewares:
- name: family_switch_reminder
  hook: before_model
  description: "Middleware that reminds executor to switch families when stuck. Fires before every model call, checks evaluation history and convolution_analyzer recommendations, and injects a reminder if family streak exceeds 5 iterations or if below 0.8963 with non-step-function representation."
  implementation_py: |
    def before_model(hook_input):
        state = hook_input.get("state", {})
        iteration = state.get("iteration", 0)
        evals_used = state.get("evals_used", 0)
        best_score = state.get("best_score", 0.0)
        families_explored = state.get("families_explored", [])
        family_history = state.get("family_history", [])
        current_family = "unknown"
        if family_history:
            current_family = family_history[-1].get("family", "unknown")
        if best_score < 1.02649:
            if current_family != "piecewise-constant":
                return "CRITICAL: Best score ({:.3f}) below seed. Switch to step functions (piecewise-constant) immediately. Current family: {}".format(best_score, current_family)
        family_streak = 0
        if family_history:
            for i in range(len(family_history) - 1, -1, -1):
                if family_history[i].get("family") == current_family:
                    family_streak += 1
                else:
                    break
        if family_streak >= 5:
            return "DIVERSIFICATION_WARNING: Same family for {} evals. Call convolution_analyzer and switch to a different function family.".format(family_streak)
        if evals_used > 10 and best_score < 1.02649:
            return "EVAL_BUDGET_WARNING: Used {} evals without improvement. Call convolution_analyzer and switch families immediately.".format(evals_used)
        return None
