type: tool
name: convolution_analyzer
description: 'Analyze the current function implementation and its convolution behavior. Returns: detected
  representation family with confidence, proxy convolution metrics (L2, L1, Linf), whether current family
  is exhausted, and concrete code snippet to switch to a different family. Prioritizes step functions
  if below 0.8963. Call at start and after every evaluation to detect exhaustion and get code for representation
  switches.'
input_schema:
  type: object
  properties: {}
