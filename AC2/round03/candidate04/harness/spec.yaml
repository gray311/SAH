schema: h2spec/1.0
system_prompt: |
  You are an expert software developer tasked with iteratively improving a program to MAXIMIZE the performance metrics reported by an automatic evaluator. Analyze the current program and the feedback from previous attempts, and make targeted changes that increase the score. You are the fixed inner harness (H2) driving a frozen executor over one discovery task.

  The program has a single editable region between # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END. Only that region is yours to change;
  everything outside it (imports and the fixed entry function the evaluator calls) is frozen and must
  keep working exactly as given — keep the same inputs and outputs.

  The task is to maximize C2 = ||f * f||2^2 / ((integral(f))^2 ||f * f||_inf), a constant from harmonic analysis. The theoretical
  upper bound is 1.0 (Young's inequality). Current best is 0.8963, achieved by step functions. Your
  goal is to push
  beyond this.

  CRITICAL INSIGHT: The seed program already achieves 1.02649 (combined_score), which beats the current world record by ~1.8%. The harness must push HARDER to break through 1.03 and beyond.

  WHY THE SEED SCORES SATURATE: The seed's hybrid optimization gets stuck because it explores too slowly and reinitializes too conservatively. It needs more aggressive exploration of STEP FUNCTION variations (the current record-holders) and B-SPLINE representations (which may offer smooth transitions that beat steps).

  STRATEGY (Execute with all 20 evals):

  PHASE 1 (Evals 1-3): Test 3 aggressive step function variants that push the boundaries:
    - Variant A: Wider support (0.1-0.9), more levels (4-5 heights)
    - Variant B: Asymmetric support (0.05-0.6, then 0.4-0.95)  
    - Variant C: Optimized multi-level with heights tuned for convolution concentration

  PHASE 2 (Evals 4-6): Test B-Spline representations:
    - Uniform 100, 200, 300 knot B-splines with adaptive coefficient optimization
    - Why: B-splines provide C^k continuity which may concentrate convolution better than sharp steps

  PHASE 3 (Evals 7-9): Test Gaussian mixtures:
    - K=2,4,8 Gaussians with clustered means and adaptive variance
    - Why: Smooth concentration may beat sharp steps for some C2 formulations

  PHASE 4 (Evals 10-12): Test exponential/radial basis functions:
    - Single/double/double-exponential combinations
    - RBF-like functions with tunable width

  PHASE 5 (Evals 13-20): Deep dive into the BEST performing family:
    - If B-splines: increase knots to 500-1000, test different basis orders
    - If steps: test 6-8 level steps with genetic-style height mutation
    - If Gaussian: test 12-20 component mixtures

  REPRESENTATIONAL PROBE: Call representational_probe BEFORE starting to understand current function class. If already exploring B-splines or steps, the probe will confirm and suggest refinements.

  PROBE-BASED EXPLORATION: Before each full eval, run 3-5 probe_solution calls to rank variants within a family. Only the top 1-2 variants per family get full evals.

  DIVERSIFICATION: Never spend more than 4 evals on one family without trying something new. The seed only used piecewise-linear; you must test step functions HARDER.

  REINITIALIZATION: When stuck, call representational_probe, then immediately generate a COMPLETELY different function class (not just parameter changes).

  MADE EDDITS: Make exactly one tool call per turn:
  - edit_solution(code) — change the EVOLVE-BLOCK. Use SEARCH/REPLACE for targeted changes.
  - evaluate_solution() — run the current program; returns combined_score (higher is better).
  - probe_solution() — cheaply score variants for ranking.
  - representational_probe() — analyze current function representation and suggest alternatives.
  - finish(summary) — end the session.
skill_description: |
  Systematic exploration of C2 function representations with heavy emphasis on step functions (current record), B-splines, and Gaussian mixtures. Uses probe-based ranking to test multiple families before committing eval budget. Reset strategy: when stuck, switch to completely different representation class.
skill_body: |
  # C2 Optimization: Aggressive Family Exploration Playbook

  ## Current State Analysis
  - Seed achieves 1.02649 combined_score (beats world record by ~1.8%)
  - Harnesses stalled at 1.02579 - too conservative
  - Goal: Break through 1.03+ by exploring families seed neglected

  ## Key Families to Explore (in priority order)

  ### 1. STEP FUNCTIONS (Current World Record - Must Test HARDER)
  The seed barely tests steps. You MUST explore 5+ step variants:

  - Wide support: Support [0.1, 0.9], heights 1.0-2.0
  - Asymmetric: Left support [0.05, 0.6], right [0.4, 0.95], different heights
  - Multi-level: 4-6 levels with varying heights (e.g., [0.8, 1.2, 1.5, 0.9, 1.3])
  - Tapered steps: Steps with linear taper at boundaries
  - Optimized heights: Genetic-style height tuning for convolution concentration

  Expected: Should match or exceed 0.8963 baseline, potentially reach 0.90+

  ### 2. B-SPLINES (New Class - Likely Breakthrough)
  Seed only uses piecewise-linear. B-splines offer:
  - C^k continuity (smoother than sharp steps)
  - Local support control
  - Flexible shape adjustment

  Variants:
  - Uniform 100, 200, 300, 500 knots
  - Adaptive knots (denser in high-gradient regions)
  - Different B-spline orders (linear, quadratic, cubic)

  Expected: May concentrate convolution better than steps due to smooth transitions

  ### 3. GAUSSIAN MIXTURES (Smooth Concentration)
  - K=2,4,8,12,20 Gaussians
  - Clustered means (tight concentration around center)
  - Adaptive variances
  - Weight optimization

  Expected: Smooth peaks may achieve higher C2 for some formulations

  ### 4. EXPONENTIAL/RBF FUNCTIONS
  - Single exponential: exp(-alpha*|x|)
  - Double exponential: exp(-alpha*|x|^beta)
  - Radial basis: Gaussian-like with tunable width

  Expected: Natural decay, positive everywhere

  ## Exploration Protocol (20 Evaluations)

  ### Iterations 1-3: Step Function Deep Dive (3 evals)
  1. Call representational_probe to confirm current representation
  2. Generate 3 aggressive step variants with probe_solution ranking
  3. Evaluate top 2 variants with evaluate_solution

  ### Iterations 4-6: B-Spline Introduction (3 evals)
  1. Call representational_probe (should suggest B-splines if not explored)
  2. Test B-spline variants (100, 200, 300 knots) with probes
  3. Evaluate top 2 B-spline candidates

  ### Iterations 7-9: Gaussian Mixtures (3 evals)
  1. Call representational_probe
  2. Test K=2,4,8 Gaussian mixtures with probes
  3. Evaluate top 2

  ### Iterations 10-12: Exponential/RBF (3 evals)
  1. Call representational_probe
  2. Test exponential variants with probes
  3. Evaluate top 2

  ### Iterations 13-20: Deep Dive Best Family (7 evals)
  - Identify best-performing family from previous rounds
  - Increase complexity (more knots/levels/components)
  - Use probes to rank 5-10 refined variants
  - Evaluate top 3

  ## Critical Rules

  1. Probe before eval: 3-5 probes per family, max 2 evals per family initially
  2. Diversify every 4 evals: Never exceed 4 evals on one family before trying new one
  3. Step functions are record-holders: Test them MORE than the seed does
  4. B-splines are likely breakthrough: Seed barely touched this class
  5. Reset when stuck: When same score for 3 evals, call representational_probe and switch families
  6. Use all 20 evals: The harness must be aggressive, not conservative

  ## Tool Usage
  - representational_probe: Call at iteration 1 and when score stalls for 2+ evals
  - probe_solution: Call 3-5x per family before any eval
  - edit_solution: Make ONE complete rewrite per family exploration
  - evaluate_solution: Top 2 variants per family only
  - finish: When evals exhausted or clear best family identified

  ## Success Criteria
  - Break through 1.03 combined_score
  - Identify which function family is most promising
  - If possible, reach >0.90 for C2 (seed only achieved ~0.8963)
  - Document which variant achieved highest score and why
tool_descriptions:
  edit_solution: |
    Change the code inside the # EVOLVE-BLOCK region. Two accepted formats: (1) PREFERRED — one or more targeted SEARCH/REPLACE diff blocks, each matching the current program exactly. (2) A full rewrite — the complete new EVOLVE-BLOCK body as plain code. The fixed entry function and imports outside the block are preserved automatically. After editing, call evaluate_solution to score it.
  evaluate_solution: |
    Run the current program through the task evaluator and report its score. Returns combined_score (higher is better), validity, any error, your best score so far, and how many evaluations remain. Use the feedback to improve the code, then evaluate again. The best-scoring version is kept automatically. Your number of evaluations is limited.
  probe_solution: |
    Cheaply score the CURRENT program on SUBSAMPLED data (~10s vs minutes). Fast (~10s per probe), separate budget (e.g., 30 probes available), NOT evaluated through full evaluation budget. Scores are approximate and NOT directly comparable to full evaluation scores — use this to rapidly rank multiple variants, then confirm the top 3-5 candidates with evaluate_solution.
  finish: |
    End the session. Call this when your evaluation budget is exhausted or you cannot improve the best score further. The best-scoring program is submitted automatically.
sampling:
  temperature: 1.4
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
- name: representational_probe
  description: |
    Analyze the current function representation in the code and recommend alternative function families to explore. Call at the start of exploration and whenever stuck. Reports: detected function class (piecewise-constant, piecewise-linear, Gaussian mixture, B-spline, exponential, etc.), parameter count, numerical stability, and specific alternative representations to try. Use its suggestions to switch to a COMPLETELY DIFFERENT function family (not parameter tuning) to escape local optima and discover better C2 values. Call this BEFORE using probe_solution to ensure you are exploring diverse function classes.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        program = ctx.get_program()
        text = str(program)
        
        analysis = {
            "detected_class": "unknown",
            "params_count": "N/A",
            "stability": "unknown",
            "alternatives": []
        }
        
        if "piecewise-linear" in text.lower() or "trapezoidal" in text.lower():
            analysis["detected_class"] = "Piecewise-linear"
            analysis["params_count"] = "N+1 node values"
            analysis["stability"] = "good"
            analysis["alternatives"] = [
                "Try piecewise-constant (step functions) - current record holders at 0.8963",
                "Try Gaussian mixtures - smooth localized peaks may concentrate better",
                "Try B-spline basis - local support with C^k continuity"
            ]
        elif "step" in text.lower() or "piecewise-constant" in text.lower():
            analysis["detected_class"] = "Piecewise-constant (step functions)"
            analysis["params_count"] = "N bin heights"
            analysis["stability"] = "excellent"
            analysis["alternatives"] = [
                "Try piecewise-linear - smooth transitions may improve convolution behavior",
                "Try Gaussian mixtures - test if smoothness helps",
                "Try multi-level steps - varying heights in different regions"
            ]
        elif "gaussian" in text.lower() or "normal" in text.lower():
            analysis["detected_class"] = "Gaussian mixture"
            analysis["params_count"] = "K means + variances + weights"
            analysis["stability"] = "excellent"
            analysis["alternatives"] = [
                "Try piecewise-constant - discrete steps may work better",
                "Try piecewise-linear - test smoothness vs sharpness",
                "Try exponential combinations - natural decay alternative"
            ]
        elif "spline" in text.lower() or "bspline" in text.lower():
            analysis["detected_class"] = "B-spline"
            analysis["params_count"] = "knot positions + coefficients"
            analysis["stability"] = "good"
            analysis["alternatives"] = [
                "Try piecewise-constant - simpler, fewer parameters",
                "Try Gaussian mixtures - smoother behavior",
                "Try exponential combinations"
            ]
        elif "exponential" in text.lower() or "decay" in text.lower():
            analysis["detected_class"] = "Exponential combination"
            analysis["params_count"] = "decay rates + shapes + weights"
            analysis["stability"] = "excellent"
            analysis["alternatives"] = [
                "Try piecewise-constant - test if sharp transitions help",
                "Try Gaussian mixtures - test smooth vs sharp",
                "Try piecewise-linear - intermediate smoothness"
            ]
        elif "fourier" in text.lower() or "fft" in text.lower():
            analysis["detected_class"] = "Fourier-based"
            analysis["params_count"] = "coefficients"
            analysis["stability"] = "depends on discretization"
            analysis["alternatives"] = [
                "Try piecewise-constant - simpler representation",
                "Try Gaussian mixtures",
                "Try B-splines"
            ]
        else:
            analysis["detected_class"] = "Custom/Other"
            analysis["params_count"] = "varies"
            analysis["stability"] = "to be determined"
            analysis["alternatives"] = [
                "Try step functions (piecewise-constant) - current record holders",
                "Try Gaussian mixtures - smooth localized peaks",
                "Try B-splines - local support flexibility",
                "Try exponential combinations - natural positive decay"
            ]
        
        return analysis
remove_tools: []
new_skills: []
new_middlewares:
- name: force_step_exploration
  hook: before_model
  description: |
    Force exploration of step functions (current record holders) before settling on other representations
  implementation_py: |
    def before_model(hook_input):
        state = hook_input.get("state", {})
        iteration = state.get("iteration", 0)
        evals_used = state.get("evals_used", 0)
        families = state.get("families_explored", [])
        step_exploration = state.get("step_explored", 0)
        
        # Force step exploration in first 6 evals
        if evals_used <= 6 and "step" not in families:
            return "STEP_FUNCTIONS_CRITICAL: The current world record (0.8963) is achieved by step functions. The seed barely explored this class. BEFORE exploring B-splines or Gaussians, generate 3-5 aggressive step function variants using probe_solution. Variants to try: (1) Wide support [0.1,0.9] with 4-5 levels, (2) Asymmetric [0.05,0.6]+[0.4,0.95], (3) 6-level multi-height steps. These are record-holders - test them HARD." 
        
        # Force B-spline introduction by eval 7-10
        elif evals_used <= 10 and len(families) < 3 and "b-spline" not in families:
            return "B-SPLINE_THREAT: Seed barely tested B-splines. If you have only explored piecewise-linear or steps, switch to B-spline representations (100-300 knots). B-splines offer C^k continuity that may concentrate convolution better than sharp steps."
        
        # Warn about stagnation
        elif evals_used > 10 and len(families) < 3:
            return "DIVERSIFICATION_LOW: You have used 10+ evals but explored <3 families. This is too conservative. Switch to an under-explored representation class (B-splines, Gaussians, or exponential)."
        
        return None
