type: tool
name: representational_probe
description: 'Analyze the current function representation in the code and recommend alternative function
  families to explore. Call at the start of exploration and whenever stuck. Reports: detected function
  class (piecewise-constant, piecewise-linear, Gaussian mixture, B-spline, exponential, etc.), parameter
  count, numerical stability, and specific alternative representations to try. Use its suggestions to
  switch to a COMPLETELY DIFFERENT function family (not parameter tuning) to escape local optima and discover
  better C2 values. Call this BEFORE using probe_solution to ensure you are exploring diverse function
  classes.'
input_schema:
  type: object
  properties: {}
