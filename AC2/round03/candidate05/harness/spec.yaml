schema: h2spec/1.0
system_prompt: "You are an expert software developer tasked with iteratively improving a program to MAXIMIZE the performance metrics reported by an automatic evaluator.\n\nThe program has a single editable region between # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END. Only that region is yours to change; everything outside it is frozen.\n\nThe task is to maximize C2 = ||f * f||2^2 / ((integral(f))^2 ||f * f||_inf). Theoretical upper bound is 1.0 (Young's inequality). Current best is 0.8963 with step functions.\n\nCRITICAL: Only 20 full evaluations. Use probe_solution liberally.\n\nCURRENT STATUS: Seed uses piecewise-linear, achieved ~1.026. This is optimized - DO NOT TUNE FURTHER.\n\nSTRATEGY: SWITCH to new function families using ready-made templates.\n1. Stop tuning piecewise-linear\n2. Switch to: A) Multi-level steps, B) Gaussian mixtures, or C) Exponential mixtures\n3. For each family: probe 5 variants, evaluate top 2\n4. If no improvement after 2 evals, switch to different family\n\nTEMPLATE: Multi-level steps\nf = jnp.zeros(n)\nf = f.at[int(0.15*n):int(0.35*n)].set(1.0)\nf = f.at[int(0.35*n):int(0.55*n)].set(2.0)\nf = f.at[int(0.55*n):int(0.75*n)].set(1.5)\nf = f.at[int(0.75*n):int(0.95*n)].set(0.8)\n\nTEMPLATE: Gaussian mixtures\nK = 5\nmeans = jnp.array([0.1, 0.3, 0.5, 0.7, 0.9])\nsigmas = jnp.array([0.05, 0.08, 0.06, 0.07, 0.09])\nf = jnp.zeros(n)\nfor k in range(K):\n    gaussian = jnp.exp(-0.5 * ((jnp.arange(n) - means[k] * n) / sigmas[k])**2)\n    f = f + 0.5 * gaussian\n\nMAKING EDITS:\n- To switch families: DELETE _create_initializer and paste new template\n- ALWAYS use probe_solution to rank 5+ variants before evaluate_solution\n- NEVER evaluate same family more than 2 times without trying something new\n\nTool usage:\n- edit_solution: Replace _create_initializer with template\n- probe_solution: Test 5-10 variants of new function class\n- evaluate_solution: ONLY top 2 from probe\n- finish: When exhausted or stuck\n\nStep functions achieved 0.8963. Try multi-level steps FIRST."
skill_description: "Maximize C2 for second autocorrelation. Seed optimized piecewise-linear. SWITCH to multi-level steps or Gaussian mixtures using templates. Probe 5+ variants before evaluating. Max 2 evals per family."
skill_body: "# C2 Family Switch Protocol\n\n## Objective\nBeat 0.8963 record. Current best: ~0.914 with piecewise-linear.\n\n## Critical Insight\nYou optimized piecewise-linear. DO NOT tune it further. SWITCH to new function families.\n\n## Protocol\n\n### Step 1: Choose Family\nUse one of these templates:\n\nA. Multi-level steps:\n```\ndef _create_initializer(self, key, pattern_idx):\n    n = self.hypers.num_intervals\n    f = jnp.zeros(n)\n    if pattern_idx == 0:\n        f = f.at[int(0.15*n):int(0.35*n)].set(1.0)\n        f = f.at[int(0.35*n):int(0.55*n)].set(2.0)\n        f = f.at[int(0.55*n):int(0.75*n)].set(1.5)\n        f = f.at[int(0.75*n):int(0.95*n)].set(0.8)\n    return f\n```\n\nB. Gaussian mixtures:\n```\ndef _create_initializer(self, key, pattern_idx):\n    n = self.hypers.num_intervals\n    K = 3 if pattern_idx < 3 else 5\n    means = jnp.linspace(0.1, 0.9, K)\n    sigmas = jnp.ones(K) * (0.05 + pattern_idx * 0.02)\n    f = jnp.zeros(n)\n    for k in range(K):\n        gaussian = jnp.exp(-0.5 * ((jnp.arange(n) - means[k] * n) / sigmas[k])**2)\n        f = f + 0.5 * gaussian\n    return f\n```\n\n### Step 2: Probe 5 Variants\nCreate variants by changing parameters. Call probe_solution on each.\n\n### Step 3: Evaluate Top 2\nPick 2 highest-probe variants. Call evaluate_solution on each.\n\n### Step 4: Decision\nImprovement? Deepen. No improvement? SWITCH to different family.\n\n## Rules\n- 5+ probes per family\n- Max 2 evals per family\n- Switch families immediately on stagnation\n\n## Tools\n| Tool | When |\n|------|------|\n| edit_solution | Replace _create_initializer with template |\n| probe_solution | Rank variants |\n| evaluate_solution | Confirm top 2 only |\n| finish | When exhausted |\n\n## Success Path\n1. Replace _create_initializer with steps template\n2. Probe 5 variants\n3. Evaluate top 2\n4. If no improvement: switch to Gaussian mixtures\n5. Repeat"
tool_descriptions:
  edit_solution: 'Change code in EVOLVE-BLOCK. Replace _create_initializer method with templates from system_prompt. After editing, call probe_solution to rank variants before evaluating. Only 20 evals total.'
  evaluate_solution: 'Run full evaluation. Returns combined_score. USE SPARINGLY - only after 5+ probes. Budget 20. Track scores.'
  probe_solution: 'Cheap approximate evaluation on subsampled data (~10s, 30 probes available). USE TO RANK 5-10 VARIANTS BEFORE EVALUATING. Always probe before evaluate.'
  finish: 'End when evals exhausted or no improvement. Best program submitted automatically.'
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 15
  max_tokens: 14336
agent:
  max_iterations: 45
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 6000
new_tools:
- name: code_snippet_generator
  description: |
    Generate ready-to-use function templates for switching function families. Call BEFORE editing. Returns parameterized variants of steps, gaussians, or exponentials. Reduces burden of writing code from scratch.
  input_schema:
    type: object
    properties:
      family:
        type: string
        description: Function family (steps, gaussian, exponential)
      n_variants:
        type: integer
        default: 5
        description: Number of variants to generate
  implementation_py: |
    def run(ctx, args):
        family = args.get("family", "steps")
        n_variants = args.get("n_variants", 5)
        snippets = []
        for i in range(n_variants):
            if family == "steps":
                var_code = """def _create_initializer(self, key, pattern_idx):
    n = self.hypers.num_intervals
    f = jnp.zeros(n)
    if pattern_idx == 0:
        f = f.at[int(0.15*n):int(0.35*n)].set(1.0)
        f = f.at[int(0.35*n):int(0.55*n)].set(2.0)
        f = f.at[int(0.55*n):int(0.75*n)].set(1.5)
        f = f.at[int(0.75*n):int(0.95*n)].set(0.8)
    elif pattern_idx == 1:
        f = f.at[int(0.1*n):int(0.3*n)].set(1.2)
        f = f.at[int(0.3*n):int(0.5*n)].set(2.5)
        f = f.at[int(0.5*n):int(0.7*n)].set(1.3)
        f = f.at[int(0.7*n):int(0.9*n)].set(0.9)
    return f"""
                snippets.append(("steps_" + str(i), var_code))
            elif family == "gaussian":
                K_val = 3 if i < 3 else 5
                sigma_base = 0.07
                var_code = """def _create_initializer(self, key, pattern_idx):
    n = self.hypers.num_intervals
    K = {K_val}
    means = jnp.linspace(0.1, 0.9, K)
    sigmas = jnp.ones(K) * ({sigma_base + i * 0.02})
    f = jnp.zeros(n)
    for k in range(K):
        gaussian = jnp.exp(-0.5 * ((jnp.arange(n) - means[k] * n) / sigmas[k])**2)
        f = f + 0.5 * gaussian
    return f""".format(K_val=K_val, sigma_base=sigma_base)
                snippets.append(("gaussian_" + str(i), var_code))
            elif family == "exponential":
                rates_list = [0.5, 1.0, 2.0] if i < 3 else [0.3, 0.8, 1.5, 2.5, 3.0]
                rates_str = str(rates_list)
                var_code = """def _create_initializer(self, key, pattern_idx):
    n = self.hypers.num_intervals
    K = {K_val}
    rates = jnp.array({rates_str})
    f = jnp.zeros(n)
    for rate in rates[:K]:
        exponential = jnp.exp(-rate * (jnp.arange(n) - 0.5 * n))
        f = f + 0.3 * exponential
    return f""".format(K_val=i+1, rates_str=rates_str)
                snippets.append(("exponential_" + str(i), var_code))
        return {"snippets": snippets, "family": family, "n_variants": n_variants}
new_skills:
- name: family-switch-protocol
  description: "Protocol for switching function families in C2 optimization. Uses code_snippet_generator for templates. Strict 2-eval limit per family. Switch on stagnation."
  body: "# C2 Family Switch Protocol\n\n## Core Principle\nSTOP tuning piecewise-linear. SWITCH to new families using code_snippet_generator.\n\n## Protocol\n\n### Step 1: Generate Templates\nCall code_snippet_generator with family=\"steps\" or family=\"gaussian\".\n\n### Step 2: Insert Template\nCopy first template. Delete old _create_initializer. Paste new one.\n\n### Step 3: Create Variants\nUse variant_parameter_tweaker for 3-5 parameter variants.\n\n### Step 4: Probe All\nCall probe_solution on each variant. Rank them.\n\n### Step 5: Evaluate Top 2\nPick 2 highest. Call evaluate_solution.\n\n### Step 6: Decision\nImprovement? Deepen. No improvement? SWITCH families.\n\n## Rules\n- 5+ probes per family\n- Max 2 evals per family\n- Switch on stagnation\n- Use code_snippet_generator before editing\n\n## Tools\n| Tool | Purpose |\n|------|--------|\n| code_snippet_generator | Generate templates |\n| variant_parameter_tweaker | Create variants |\n| probe_solution | Rank variants |\n| evaluate_solution | Confirm top 2 |\n\n## Expected Flow\n1. Generate templates\n2. Insert and tweak\n3. Probe variants\n4. Evaluate top 2\n5. Switch if no improvement"
new_middlewares:
- name: strict_family_switch_enforcer
  hook: before_model
  description: Enforces family switching. Alerts on stagnation, low eval budget without improvement, or evals without enough probes.
  implementation_py: |
    def before_model(hook_input):
        state = hook_input.get("state", {})
        iteration = state.get("iteration", 0)
        evals_used = state.get("evals_used", 0)
        evals_remaining = 20 - evals_used
        recent_improvement = state.get("recent_improvement", True)
        last_family = state.get("last_family", "unknown")
        
        if evals_remaining <= 3 and not recent_improvement:
            return "CRITICAL: Only " + str(evals_remaining) + " evals left with no improvement on " + last_family + ". SWITCH to DIFFERENT function family using code_snippet_generator."
        
        if iteration >= 10 and not recent_improvement:
            return "DANGER: Iteration " + str(iteration) + " with no improvement since " + last_family + ". Use code_snippet_generator to switch families. Probe 5+ variants before evaluating next."
        
        if evals_used <= 2 and iteration >= 3:
            return "REMINDER: Few evals used but may be skipping probes. Remember: 5+ probes, max 2 evals per family. Use probe_solution to rank before evaluating!"
        
        return None
