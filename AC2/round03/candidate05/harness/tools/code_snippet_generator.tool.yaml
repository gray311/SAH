type: tool
name: code_snippet_generator
description: Generate ready-to-use function templates for switching function families. Call BEFORE editing.
  Returns parameterized variants of steps, gaussians, or exponentials. Reduces burden of writing code
  from scratch.
input_schema:
  type: object
  properties:
    family:
      type: string
      description: Function family (steps, gaussian, exponential)
    n_variants:
      type: integer
      default: 5
      description: Number of variants to generate
