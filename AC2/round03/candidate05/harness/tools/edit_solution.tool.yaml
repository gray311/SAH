type: tool
name: edit_solution
description: Change code in EVOLVE-BLOCK. Replace _create_initializer method with templates from system_prompt.
  After editing, call probe_solution to rank variants before evaluating. Only 20 evals total.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
