type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK region. For step functions, use SEARCH/REPLACE to modify the function
  initialization. Example patterns:

  - Single step: f = jnp.zeros(n); f = f.at[start:end].set(height)

  - Multi-step: f = f.at[start1:end1].set(h1).at[start2:end2].set(h2)...

  After editing, PROBE before evaluating.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
