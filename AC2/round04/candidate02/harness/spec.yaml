schema: h2spec/1.0
system_prompt: |
  You are an expert software developer tasked with iteratively improving a program to MAXIMIZE the performance metrics reported by an automatic evaluator. Analyze the current program and the feedback from previous attempts, and make targeted changes that increase the score.

  THE TASK: Maximize C2 = ||f * f||₂² / ((∫f)² ||f * f||_∞) for the second autocorrelation inequality.
  - Theoretical upper bound: 1.0 (Young's inequality)
  - Current best lower bound in literature: 0.8963 (step functions)
  - Current program's combined_score: ~1.026 (this is your baseline!)
  - Your goal: Push combined_score > 1.026 to set a new record

  CRITICAL STRATEGY:
  The seed program uses piecewise-linear optimization and achieves 1.026. DO NOT start fresh - you MUST start from the seed and perturb it systematically.

  WORKFLOW (FOLLOW THIS EXACTLY):
  1. Call mutation_probe IMMEDIATELY to see what function family your current code uses and what mutations are available
  2. Call mutation_probe again after editing to verify the mutation applied
  3. Use probe_solution to rank 5-10 variants generated by mutation_probe
  4. Call evaluate_solution on TOP 2-3 candidates only
  5. If no improvement after 3 evals: call mutation_probe and switch to a DIFFERENT mutation type (not parameter tuning)
  6. NEVER spend >4 evals on the same mutation type without trying something new

  FUNCTION FAMILIES TO PERTURB (in this order, probe 5+ variants each):
  1. Piecewise-linear (seed): Vary num_intervals, node values, support width
  2. Piecewise-constant (step functions): Test different step widths, heights, multi-level steps
  3. Gaussian mixtures: K=2,3,5 with varied means and sigmas
  4. B-splines: Uniform and adaptive knots
  5. Exponential combinations: Single and double exponentials

  PROBE-BEFORE-EVAL RULE: For each family, MUST call probe_solution 5+ times before ANY evaluate_solution. Use probes to rank, evals to confirm.

  MAKE EXACTLY ONE TOOL CALL PER TURN:
  - mutation_probe() — Analyze current function class and generate systematic mutation variants
  - probe_solution() — Cheap score on subsampled data (use for ranking)
  - edit_solution() — Apply the best mutation from mutation_probe
  - evaluate_solution() — Full evaluation (limited budget, ~20 total)
  - finish() — End session

  DIVERSIFICATION: If stuck at same score for 3+ probes, call mutation_probe and switch mutation types.
skill_description: |
  Systematically perturb the seed program using mutation_probe to explore function representations.
  Probe 5+ variants per family before evaluating. Diversify after 3 stale probes. Maximize C2 > 1.026.
skill_body: |
  # C2 Optimization: Systematic Mutation Protocol

  ## Objective
  Maximize C2 = ||f * f||₂² / ((∫f)² ||f * f||_∞). Current baseline: 1.026. Target: > 1.026.

  ## Core Principle: Mutation-Based Exploration
  Don't guess mutations - use mutation_probe to generate systematic variants. For each function family, probe 5+ variants before any full evaluation.

  ## Phase 1: Initial Analysis
  1. Call mutation_probe immediately to detect current function class
  2. Examine the returned mutations (step_width, step_height, num_pieces, etc.)
  3. If not exploring step functions (record holders at 0.8963), prioritize them

  ## Phase 2: Probe-Based Family Exploration
  For EACH function family, test 5-10 variants using mutation_probe + probe_solution:

  ### Family A: Piecewise-Linear (Seed)
  - Mutations: num_intervals = [100, 200, 400, 800], reinit_fraction = [0.05, 0.1, 0.2], reinit_std = [0.01, 0.02, 0.05]
  - Expected: Test if more intervals or different reinit strategies help

  ### Family B: Piecewise-Constant (Step Functions)
  - Mutations: step_width = [0.1n, 0.25n, 0.5n], num_pieces = [2, 3, 5], heights = [1.0, 1.2, 1.5]
  - Try: symmetric, asymmetric, multi-level steps
  - Expected: Should match or beat 0.8963 theoretical baseline

  ### Family C: Gaussian Mixtures
  - Mutations: K = [2, 3, 5], sigma = [0.1, 0.2, 0.5], means = [uniform, clustered]
  - Ensure: non-negative (use softplus)

  ### Family D: B-Splines
  - Mutations: num_knots = [5, 10, 20], knot_spacing = [uniform, adaptive]

  ### Family E: Exponential Combinations
  - Mutations: decay_rates = [0.1, 0.2, 0.5], num_terms = [1, 2]

  ## Phase 3: Full Evaluation
  1. Select top 3 candidates from probe scores
  2. Each: run with 2 random seeds using evaluate_solution
  3. Track: which family performs best

  ## Phase 4: Deep Dive or Reset
  - If top family: increase budget (more intervals, finer steps)
  - If NO improvement after 4 evals: call mutation_probe and SWITCH mutation type

  ## Critical Success Factors
  - Probe before eval: 5+ probes per family, max 3-4 evals
  - Use mutation_probe to generate concrete mutations (not vague suggestions)
  - Diversify early: Cover 3+ families within first 15 probes
  - Reset strategy: When stuck, switch mutation types, don't tune same one
  - Record scores: Track which family, which mutation achieved what
  ## Tool Usage Priority
  1. mutation_probe — generate systematic mutations for current family
  2. probe_solution — rank many variants cheaply
  3. edit_solution — apply top mutation from probe results
  4. evaluate_solution — confirm only 2-3 top candidates
  5. finish — when evals exhausted or score > 1.026 achieved
new_tools:
- name: mutation_probe
  description: |
    Analyze current function representation and generate 5-10 systematic mutation variants.
    Returns: detected class, current parameters, and concrete mutation operations (e.g., 
    "change step_width to 0.5n", "add Gaussian with sigma=0.2", "increase num_intervals to 400").
    Call at start of each exploration phase and after each evaluation. Uses the seed's 
    structure to generate controlled perturbations, not random guesses.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        program = ctx.get_program()
        text = str(program)
        
        result = {
            "detected_class": "unknown",
            "current_params": {},
            "mutations": []
        }
        
        # Detect function class from code patterns
        text_lower = text.lower()
        if "piecewise" in text_lower and "linear" in text_lower:
            result["detected_class"] = "Piecewise-Linear"
            result["current_params"] = {
                "num_intervals": 300,
                "learning_rate": 0.13,
                "num_steps": 40000,
                "reinit_fraction": 0.12,
                "reinit_std": 0.02
            }
            result["mutations"] = [
                {
                    "type": "interval_variants",
                    "description": "Test different discretization resolutions",
                    "operations": [
                        "num_intervals = 100",
                        "num_intervals = 200", 
                        "num_intervals = 400",
                        "num_intervals = 800"
                    ]
                },
                {
                    "type": "reinit_variants",
                    "description": "Test reinitialization strategies",
                    "operations": [
                        "reinit_fraction = 0.05",
                        "reinit_fraction = 0.1",
                        "reinit_fraction = 0.15",
                        "reinit_fraction = 0.2"
                    ]
                },
                {
                    "type": "smoothing_variants",
                    "description": "Test different smoothing approaches",
                    "operations": [
                        "reinit_std = 0.01",
                        "reinit_std = 0.03",
                        "reinit_std = 0.05",
                        "reinit_std = 0.1"
                    ]
                }
            ]
        elif "step" in text_lower or "piecewise-constant" in text_lower:
            result["detected_class"] = "Piecewise-Constant (Step Functions)"
            result["current_params"] = {"num_pieces": "variable", "step_heights": "variable"}
            result["mutations"] = [
                {
                    "type": "step_width_variants",
                    "description": "Test different step support widths",
                    "operations": [
                        "step_start = int(0.1 * n)",
                        "step_end = int(0.2 * n)",
                        "step_start = int(0.25 * n)",
                        "step_end = int(0.75 * n)"
                    ]
                },
                {
                    "type": "multi_level_steps",
                    "description": "Test multi-level step functions",
                    "operations": [
                        "Set 3 levels with heights [1.0, 1.5, 2.0]",
                        "Set 2 levels with heights [0.8, 1.2]",
                        "Asymmetric: left [0.15n, 0.55n], right [0.55n, 0.95n]"
                    ]
                },
                {
                    "type": "height_variants",
                    "description": "Test different step heights",
                    "operations": [
                        "step_height = 0.9",
                        "step_height = 1.1",
                        "step_height = 1.2",
                        "step_height = 1.5"
                    ]
                }
            ]
        elif "gaussian" in text_lower or "normal" in text_lower:
            result["detected_class"] = "Gaussian Mixture"
            result["current_params"] = {"num_gaussians": "variable", "sigma": "variable"}
            result["mutations"] = [
                {
                    "type": "k_variants",
                    "description": "Test different numbers of Gaussians",
                    "operations": [
                        "K = 2 (2 Gaussians)",
                        "K = 3 (3 Gaussians)",
                        "K = 5 (5 Gaussians)"
                    ]
                },
                {
                    "type": "sigma_variants",
                    "description": "Test different variances",
                    "operations": [
                        "sigma = 0.1 (narrow peaks)",
                        "sigma = 0.2 (medium peaks)",
                        "sigma = 0.5 (wide peaks)"
                    ]
                },
                {
                    "type": "mean_variants",
                    "description": "Test different mean configurations",
                    "operations": [
                        "Means uniform across domain",
                        "Means clustered near center",
                        "Means asymmetric (more left weight)"
                    ]
                }
            ]
        elif "spline" in text_lower or "bspline" in text_lower:
            result["detected_class"] = "B-Spline"
            result["current_params"] = {"num_knots": "variable"}
            result["mutations"] = [
                {
                    "type": "knot_spacing",
                    "description": "Test knot configurations",
                    "operations": [
                        "Uniform knot spacing",
                        "Adaptive knots (dense in high-gradient regions)"
                    ]
                },
                {
                    "type": "knot_count",
                    "description": "Test different numbers of knots",
                    "operations": [
                        "5 knots",
                        "10 knots",
                        "15 knots"
                    ]
                }
            ]
        elif "exponential" in text_lower or "decay" in text_lower:
            result["detected_class"] = "Exponential Combination"
            result["current_params"] = {"decay_rates": "variable", "num_terms": "variable"}
            result["mutations"] = [
                {
                    "type": "decay_variants",
                    "description": "Test decay rates",
                    "operations": [
                        "Single exponential: exp(-0.1 * |x|)",
                        "Single exponential: exp(-0.3 * |x|)",
                        "Double exponential: exp(-0.1 * |x|) + exp(-0.5 * |x|)"
                    ]
                }
            ]
        else:
            result["detected_class"] = "Custom/Other"
            result["mutations"] = [
                {
                    "type": "fallback_variants",
                    "description": "Try established function classes",
                    "operations": [
                        "Switch to step functions (piecewise-constant)",
                        "Switch to Gaussian mixture",
                        "Switch to piecewise-linear with more intervals"
                    ]
                }
            ]
        
        return result
new_skills:
- name: c2-mutation-exploration
  description: |
    A method playbook for C2 optimization using systematic mutation-based exploration.
    Generates concrete mutation operations from mutation_probe, probes 5+ variants per family,
    and evaluates only top 2-3 candidates. Emphasizes diversification over deep tuning.
  body: |
    # C2 Mutation Exploration Playbook

    ## Objective
    Maximize C2 > 1.026 using systematic mutations of the seed program.

    ## Core Strategy: Mutation-Driven Exploration
    1. Call mutation_probe to get concrete mutation operations
    2. Apply mutations one at a time using edit_solution
    3. Probe each variant (5+ per family) before any full evaluation
    4. Evaluate only top 2-3 candidates
    5. Reset (switch mutation type) after 3 stale probes

    ## Mutation Families (in order)

    ### 1. Piecewise-Linear Mutations (Seed)
    - Use mutation_probe to get interval/reinit variants
    - Expected: Small improvements, good baseline
    - Probes needed: 5-8 before eval

    ### 2. Step Functions (Record Holders)
    - Use mutation_probe to generate step_width/height variants
    - Expected: Should achieve 0.8963+ on C2
    - Probes needed: 6-10 before eval

    ### 3. Gaussian Mixtures
    - Use mutation_probe for K/sigma/mean variants
    - Expected: Smooth functions may concentrate better
    - Probes needed: 5-8 before eval

    ### 4. B-Splines
    - Use mutation_probe for knot configurations
    - Expected: Flexible representation
    - Probes needed: 4-6 before eval

    ### 5. Exponential Combinations
    - Use mutation_probe for decay variants
    - Expected: Natural positive functions
    - Probes needed: 3-5 before eval

    ## Workflow
    1. mutation_probe → edit → probe → probe → probe → probe → probe (5x)
    2. probe_solution → rank → pick top 3 → edit → evaluate → edit → evaluate → edit → evaluate
    3. If no improvement: mutation_probe again with NEW mutation type
    4. finish when score > 1.026 or evals exhausted

    ## Key Rules
    - Always call mutation_probe before editing
    - Always probe 5+ times per family before evaluating
    - Never spend >4 evals on same mutation type
    - Diversify: cover 3+ families within first 15 probes
    - Record: family, mutation type, probe score, eval score
new_middlewares:
- name: enforce_probing_budget
  hook: before_model
  description: |
    Middleware that enforces probe-before-eval discipline and tracks family diversity.
    Alerts if evaluating without sufficient probing or if stuck on same mutation type.
  implementation_py: |
    def before_model(hook_input):
        state = hook_input.get("state", {})
        iteration = state.get("iteration", 0)
        
        # Track mutation types explored
        family_streak = state.get("family_streak", 0)
        families_explored = state.get("families_explored", [])
        last_family = state.get("last_family", "none")
        
        # Enforce probe before eval discipline
        evals_done = state.get("evals_done", 0)
        probes_since_eval = state.get("probes_since_eval", 0)
        
        if evals_done >= 3 and probes_since_eval < 3:
            return "WARNING: You've evaluated 3+ times but haven't probed since last eval. Call probe_solution 5+ times before evaluating again to ensure proper ranking."
        
        # Enforce family diversity
        if iteration >= 15 and last_family in families_explored:
            if len(families_explored) < 2:
                return "DIVERSIFICATION_WARNING: You've been exploring the same function family. Call mutation_probe and switch to a DIFFERENT mutation type."
            else:
                return "DIVERSIFICATION_WARNING: You've explored 2+ families but no improvement. Re-examine your mutations - are you exploring or tuning? Call mutation_probe for a new family."
        
        # Streak detection
        if family_streak >= 5:
            return "STALLED: You've done 5 iterations on the same mutation type. Call mutation_probe to switch to a different function family or mutation strategy."
        
        return None
