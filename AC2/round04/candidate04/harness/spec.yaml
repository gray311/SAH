schema: h2spec/1.0
system_prompt: |
  You are an expert software developer tasked with iteratively improving a program to MAXIMIZE
  the performance metrics reported by an automatic evaluator. Analyze the current program and the feedback
  from previous attempts, and make targeted changes that increase the score. You are the fixed inner
  harness (H2) driving a frozen executor over one discovery task.

  The program has a single editable region between # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END. Only that region is yours to change;
  everything outside it (imports and the fixed entry function the evaluator calls) is frozen and must
  keep working exactly as given — keep the same inputs and outputs.

  The task is to maximize C2 = ||f * f||2^2 / ((integral(f))^2 ||f * f||_inf), a constant from harmonic analysis. The theoretical
  upper bound is 1.0 (Young's inequality). Current best is 0.8963, achieved by step functions. Your goal is to push
  beyond this.

  CRITICAL INSIGHT: The record-holder (0.8963) uses STEP FUNCTIONS, not the current piecewise-linear optimizer. You MUST create step function variants to beat the record.

  STRATEGY: Use the create_step_function_variant tool to generate CONCRETE step function code snippets. Then probe these variants to find the best one, then evaluate. Do NOT just tune piecewise-linear parameters — you need discontinuous step functions.

  FUNCTION FAMILIES TO EXPLORE (in order of priority):
  1. STEP FUNCTIONS: Create variants using create_step_function_variant. These are the current record-holders.
  2. Piecewise-linear: Current seed approach (may not beat step functions)
  3. Gaussian mixtures: Smooth, localized peaks
  4. B-spline representations: Local support, C^k continuity
  5. Exponential combinations: Natural decay

  CRITICAL WORKFLOW:
  1. Call create_step_function_variant to generate 5-10 step function variants
  2. Call probe_solution on each variant to rank them cheaply
  3. Select top 3 variants, call evaluate_solution on each (with different seeds)
  4. If no improvement after 5 evals, call create_step_function_variant again with different parameters
  5. NEVER spend eval budget tuning piecewise-linear parameters without first trying step functions

  Strategic directions:
  - STEP FUNCTIONS ARE YOUR BEST BET: They achieve 0.8963, the current record
  - Use create_step_function_variant to get ready-to-use step function code
  - Diverse step parameters: different widths, heights, multi-level steps, asymmetric steps
  - Probe many step variants before evaluating (use the cheap probe budget)
  - After each eval, extract what worked and generate new step variants with those features

  Tool usage priority:
  1. create_step_function_variant — generate concrete step function code (YOUR PRIMARY TOOL)
  2. probe_solution — rank step function variants cheaply
  3. evaluate_solution — confirm top step function candidates
  4. representational_probe — only if you need to understand current state
  5. finish — when evals exhausted or no improvement possible
sampling:
  temperature: 1.4
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 10000
new_tools:
- name: create_step_function_variant
  description: |
    Generate concrete step function code variants that can beat the 0.8963 record. Step functions
    (piecewise-constant) are the current record-holders. This tool generates ready-to-use function
    definitions with different parameters: step widths, heights, number of levels, symmetry. Use this
    tool first to explore step functions, then probe the generated variants to rank them before
    spending full evaluations. Call with specific parameters or use default diverse parameters.
    Expected to return multiple code snippets implementing different step function configurations.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import re
        
        # Get num_intervals from program or default to 300
        program_text = str(ctx.get_program())
        num_intervals = 300
        if 'num_intervals' in program_text:
            match = re.search(r'num_intervals:\s*(\d+)', program_text)
            if match:
                num_intervals = int(match.group(1))
        
        # Generate diverse step function variants
        variants = []
        
        # Variant 1: Single wide step
        variants.append('Single wide step function\nstart = int(0.2 * {n})\nend = int(0.8 * {n})\nh = 1.2\nf = jnp.zeros({n})\nf = f.at[start:end].set(h)'.format(n=num_intervals))
        
        # Variant 2: Multi-level step (3 levels)
        variants.append('Multi-level step function (3 levels)\nn = {n}\nf = jnp.zeros(n)\nf = f.at[int(0.1*n):int(0.25*n)].set(1.0)\nf = f.at[int(0.25*n):int(0.5*n)].set(2.0)\nf = f.at[int(0.5*n):int(0.75*n)].set(1.5)\nf = f.at[int(0.75*n):int(0.9*n)].set(0.8)'.format(n=num_intervals))
        
        # Variant 3: Asymmetric step
        variants.append('Asymmetric step function\nstart = int(0.15 * {n})\nend = int(0.45 * {n})\nh_left = 1.3\nf = jnp.zeros({n})\nf = f.at[start:end].set(h_left)'.format(n=num_intervals))
        
        # Variant 4: Multiple narrow steps
        variants.append('Multiple narrow steps\nn = {n}\nf = jnp.zeros(n)\nf = f.at[int(0.2*n):int(0.25*n)].set(1.5)\nf = f.at[int(0.35*n):int(0.4*n)].set(2.0)\nf = f.at[int(0.5*n):int(0.55*n)].set(1.8)\nf = f.at[int(0.65*n):int(0.7*n)].set(2.2)'.format(n=num_intervals))
        
        # Variant 5: Two-level step with gap
        variants.append('Two-level step with gap\nn = {n}\nf = jnp.zeros(n)\nf = f.at[int(0.1*n):int(0.35*n)].set(1.8)\nf = f.at[int(0.45*n):int(0.8*n)].set(1.2)'.format(n=num_intervals))
        
        return {"variants": variants}
new_skills:
- name: step-function-optimization
  description: Playbook for optimizing C2 using step functions (the current record-holders at 0.8963). Focus on diverse step configurations, multi-level steps, and asymmetric patterns.
  body: |
    # Step Function Optimization Playbook for C2

    ## Core Principle
    Step functions (piecewise-constant) are the CURRENT RECORD-HOLDERS at 0.8963. The piecewise-linear seed may not beat them. You MUST create and explore step functions aggressively.

    ## Step 1: Generate Step Variants
    Use create_step_function_variant to generate 5-10 concrete step function code snippets with different parameters:
    - Single wide steps
    - Multi-level steps (2-4 height levels)
    - Asymmetric steps
    - Narrow multiple steps
    - Steps with gaps

    ## Step 2: Probe Before Evaluate
    For each generated variant:
    1. Call edit_solution to replace the EVOLVE-BLOCK with the variant
    2. Call probe_solution to get a cheap score (~10s, doesn't use eval budget)
    3. Track the probe scores
    4. Probe 5-10 variants BEFORE spending any full evaluations

    ## Step 3: Full Evaluation on Top Candidates
    Select top 3 variants from probe scores:
    1. Each: run with MULTIPLE random seeds (2-3 per candidate)
    2. Use evaluate_solution for these only
    3. Total: 3-5 evaluations maximum
    4. Track: which step configuration achieved the best C2

    ## Step 4: Iterate on Successful Patterns
    If a step configuration works:
    - Vary its parameters (width, height, number of levels)
    - Generate new variants with successful patterns
    - Continue probing before evaluating

    ## Critical Rules
    1. STEP FUNCTIONS FIRST: Create step variants before refining piecewise-linear
    2. PROBE LIBERALLY: Use 8-10 probes per step configuration family
    3. LIMITED EVALS: Max 3-5 full evaluations, pick the best probed candidates
    4. DIVERSIFY: Try wide steps, narrow steps, multi-level, asymmetric
    5. RESET: If stuck at same score for 3 evals, generate completely new step variants

    ## Expected Results
    - Should find step function variant > 0.8963
    - Probe scores should correlate reasonably well with full evals
    - Success requires exploring the step function space, not just piecewise-linear
    ## Tool Usage Priority
    1. create_step_function_variant — generate step function code (PRIMARY)
    2. probe_solution — rank step variants cheaply (USE LIBERALLY!)
    3. edit_solution — implement step variants from tool output
    4. evaluate_solution — confirm top candidates only (LIMITED BUDGET!)
    5. finish — when evals exhausted or beat 0.8963
new_middlewares:
- name: enforce_step_first
  hook: before_model
  description: Enforce that step functions are explored first (they're the record-holders) before tuning piecewise-linear parameters
  implementation_py: |
    def before_model(hook_input):
        state = hook_input.get("state", {})
        iteration = state.get("iteration", 0)
        last_tool = state.get("last_tool", "")
        
        # If we've been iterating on piecewise-linear without trying steps
        if last_tool in ["edit_solution", "probe_solution"] and iteration >= 3:
            program = hook_input.get("program", "")
            if "piecewise-linear" in str(program).lower() and "step" not in str(program).lower():
                return "STEP_FUNCTION_REQUIRED: You've been optimizing piecewise-linear functions. The record-holders (0.8963) use STEP FUNCTIONS. Call create_step_function_variant to generate step function variants immediately. Don't keep tuning piecewise-linear parameters!"
        
        return None
