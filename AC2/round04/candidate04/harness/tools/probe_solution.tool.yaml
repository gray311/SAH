type: tool
name: probe_solution
description: Cheaply score the CURRENT program on SUBSAMPLED data (~10s vs minutes). Fast (~10s per probe),
  separate budget (e.g., 30 probes available), NOT evaluated through full evaluation budget. Scores are
  approximate and NOT directly comparable to full evaluation scores — use this to rapidly rank multiple
  variants, then confirm the top 3-5 candidates with evaluate_solution.
