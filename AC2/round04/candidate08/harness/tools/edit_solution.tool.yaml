type: tool
name: edit_solution
description: Copy a template pattern from skill_body (A-H), modify ONE parameter (h, start, end), replace
  the matching lines in _create_initializer. Make small, targeted changes.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
