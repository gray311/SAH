type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. Format: (1) PREFERRED - one or more SEARCH/REPLACE
  diff blocks matching the current program exactly, or (2) a full rewrite of the EVOLVE-BLOCK body. Imports
  outside the block are preserved automatically. After editing, call probe_solution to verify the edit
  applied correctly.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
