type: tool
name: probe_solution
description: Score the CURRENT program on subsampled data (~10s). Fast, separate budget (~30 probes available),
  NOT the main evaluation budget. Scores are approximate and not directly comparable to evaluate_solution
  scores - use to verify an edit applied, not to rank variants. Call after edit_solution to confirm your
  change took effect.
