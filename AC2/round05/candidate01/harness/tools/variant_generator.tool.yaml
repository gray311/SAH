type: tool
name: variant_generator
description: 'Generate 10-20 function variants by perturbing parameters (step_width, step_height, K, sigma,
  knots, etc.) for a specified function family. Returns a list of variant specifications that you can
  use to guide edit_solution. Supports families: step, gaussian, bspline, exponential, or auto for all.'
input_schema:
  type: object
  properties:
    family:
      type: string
      default: auto
    num_variants:
      type: integer
      minimum: 5
      maximum: 50
      default: 15
    coarse_grid_resolution:
      type: integer
      minimum: 50
      maximum: 500
      default: 200
