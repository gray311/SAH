type: tool
name: edit_solution
description: 'Change the code inside # EVOLVE-BLOCK. Two formats: (1) SEARCH/REPLACE diff blocks matching
  current program, or (2) full rewrite of EVOLVE-BLOCK. Preserves imports and entry function. After editing,
  call probe_solution or evaluate_solution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
