type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. Create step functions by:

  - Using jnp.where or jnp.piecewise to define piecewise-constant regions

  - Specify exact intervals: e.g., f = jnp.where(x < -1, 0, jnp.where(x < 1, 1.5, 0))

  - Or modify the initialization: create arrays with flat regions at specific heights

  - Key: make it TRUE step functions (constant over intervals), not linear ramps'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
