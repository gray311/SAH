type: tool
name: edit_solution
description: 'Replace code in the EVOLVE-BLOCK region. To replace _create_step_initializer:

  - Delete the old method (find lines with def _create_step_initializer)

  - Insert new code at same location with same signature

  - New code should: create zeros array of size num_intervals, set specific regions to heights'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
