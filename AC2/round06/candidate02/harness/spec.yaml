schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization. Your task: maximize C2 = ||f * f||_2^2 / ((int_f)^2 ||f * f||_inf) for the second autocorrelation inequality.

  - Theoretical upper bound: 1.0 (Young's inequality)
  - Current best in literature: 0.8963 (achieved by step functions)
  - Current program's combined_score: 1.026 (your baseline)
  - Target: surpass 1.026

  CRITICAL: Step functions are theoretical champions. Use step_config_generator to create TRUE piecewise-constant functions (not linear ramps).

  STRATEGY:
  1. Call step_config_generator FIRST to get structured step parameters (intervals, heights)
  2. Edit to create TRUE step functions using those parameters
  3. Probe 3-5 variants, then evaluate top 2 only (max 4 evals)
  4. Diversify: try symmetric, asymmetric, 2-step, 3-step, 4-step configurations

  TOOLS:
  - step_config_generator: Get step function configuration (intervals, heights, symmetry)
  - edit_solution: Create TRUE step functions from step_config_generator output
  - probe_solution: Cheap ranking (~10s, separate budget)
  - evaluate_solution: Only for top candidates (max ~4 total)
  - finish: When done

  WORKFLOW: step_config_generator -> edit to TRUE step function -> probe -> repeat 3-5x -> evaluate top 2
skill_description: Step function optimization for C2 maximization. Use step_config_generator to create TRUE piecewise-constant functions (not linear). Probe 3-5 variants, evaluate top 2. Maximize C2 > 1.026.
skill_body: |
  # Step Function Optimization for C2 Maximization

  ## Objective
  Maximize C2 = ||f * f||_2^2 / ((int_f)^2 ||f * f||_inf). Current baseline: 1.026. Target: > 1.026.

  ## Why Step Functions?
  - Theoretical record holders at 0.8963
  - Simple: piecewise-constant (not linear!)
  - Easy to parameterize with step_config_generator

  ## Workflow

  ### Step 1: Get Configuration
  CALL step_config_generator FIRST to get:
  - intervals: list of (start, end, height)
  - num_steps: number of step regions
  - params: heights, widths, symmetry

  ### Step 2: Create TRUE Step Function
  Use edit_solution with step_config_generator output to create TRUE piecewise-constant function:
  - Use jnp.piecewise or jnp.where
  - Specify exact intervals and heights
  - NOT linear ramps - must be constant over intervals

  ### Step 3: Probe & Rank
  - Call probe_solution on 3-5 step variants
  - Rank by probe score
  - Only evaluate TOP 2

  ### Step 4: Diversify Configurations
  Try different configurations:
  - Symmetric vs asymmetric
  - 2-step, 3-step, 4-step
  - Different heights: 1.0, 1.5, 1.2, 1.0, 1.3, etc.

  ## Critical Rules
  - MAX 4 full evaluations
  - ALWAYS use step_config_generator first
  - Probe 3-5 before any eval
  - Edit to create TRUE step functions (constant, not linear)
  - finish when done
new_tools:
  - name: step_config_generator
    description: Generate diverse step function configurations for C2 optimization. Returns structured parameters (intervals, heights, symmetry) for creating TRUE piecewise-constant functions.
    input_schema:
      type: object
      properties:
        num_steps:
          type: integer
          description: Number of steps. Range 2-10.
        symmetric:
          type: boolean
          description: Whether function is symmetric around 0.
        base_height:
          type: number
          description: Base height scale.
        peak_position:
          type: number
          description: Center of main peak from -1 to 1.
    implementation_py: |
      def run(ctx, args):
          import random
          config = args
          num_steps = config.get("num_steps", random.randint(3, 5))
          symmetric = config.get("symmetric", True)
          base_height = config.get("base_height", 1.0)
          peak_position = config.get("peak_position", 0.0)
          
          # Generate structured step configuration
          if symmetric:
              # Symmetric step function centered at peak_position
              half_width = random.uniform(0.3, 0.5)
              # Inner height (main plateau)
              inner_height = base_height * random.uniform(1.0, 1.5)
              # Outer heights (wings)
              outer_height = base_height * random.uniform(0.5, 0.8)
              
              intervals = [
                  (-half_width - random.uniform(0.1, 0.2), -half_width + random.uniform(0.1, 0.2), outer_height),
                  (-half_width + random.uniform(0.1, 0.2), half_width - random.uniform(0.1, 0.2), inner_height),
                  (half_width - random.uniform(0.1, 0.2), half_width + random.uniform(0.1, 0.2), outer_height)
              ]
              
              # Add optional outer wings if more steps needed
              if num_steps >= 4:
                  wing_width = random.uniform(0.15, 0.25)
                  wing_height = base_height * random.uniform(0.3, 0.5)
                  intervals = [
                      (-half_width - wing_width - random.uniform(0.1, 0.15), -half_width - wing_width + random.uniform(0.1, 0.15), wing_height),
                      (-half_width - random.uniform(0.1, 0.2), -half_width + random.uniform(0.1, 0.2), outer_height),
                      (-half_width + random.uniform(0.1, 0.2), half_width - random.uniform(0.1, 0.2), inner_height),
                      (half_width - random.uniform(0.1, 0.2), half_width + random.uniform(0.1, 0.2), outer_height),
                      (half_width + random.uniform(0.1, 0.15), half_width + wing_width - random.uniform(0.1, 0.15), wing_height)
                  ]
              
              return {
                  "type": "symmetric",
                  "intervals": intervals,
                  "num_steps": len(intervals),
                  "params": {
                      "inner_height": inner_height,
                      "outer_height": outer_height,
                      "wing_height": wing_height if num_steps >= 4 else None,
                      "half_width": half_width
                  },
                  "peak_position": peak_position
              }
          else:
              # Asymmetric step function with peak at peak_position
              step_width = random.uniform(0.12, 0.18)
              centers = []
              heights = []
              
              # Create 2-4 asymmetric peaks
              if num_steps == 2:
                  # Single asymmetric peak
                  center = peak_position + random.uniform(-0.3, 0.3)
                  height = base_height * random.uniform(1.0, 1.5)
                  centers.append(center)
                  heights.append(height)
              elif num_steps == 3:
                  # Three peaks
                  base_center = peak_position
                  offsets = [-0.25, 0.0, 0.25]
                  for offset in offsets:
                      c = base_center + offset
                      h = base_height * random.uniform(0.8, 1.4)
                      centers.append(c)
                      heights.append(h)
              elif num_steps == 4:
                  # Four peaks with main peak at center
                  centers = [peak_position - 0.35, peak_position - 0.15, peak_position + 0.15, peak_position + 0.35]
                  heights = [base_height * 0.7, base_height * 1.3, base_height * 1.3, base_height * 0.7]
              else:
                  # 5 steps: bimodal
                  centers = [peak_position - 0.4, peak_position - 0.2, peak_position + 0.2, peak_position + 0.4]
                  heights = [base_height * 0.8, base_height * 1.2, base_height * 1.2, base_height * 0.8]
              
              intervals = [(c - step_width, c + step_width, h) for c, h in zip(centers, heights)]
              
              return {
                  "type": "asymmetric",
                  "intervals": intervals,
                  "num_steps": len(intervals),
                  "params": {
                      "centers": centers,
                      "heights": heights,
                      "step_width": step_width
                  },
                  "peak_position": peak_position
              }
new_skills:
  - name: true-step-function-creation
    description: Playbook for creating TRUE piecewise-constant step functions using step_config_generator. Step functions must be CONSTANT over intervals, not linear ramps.
    body: |
      # Creating TRUE Step Functions for C2 Maximization

      ## Critical: Step vs Linear

      The seed program uses piecewise-LINEAR optimization. Step functions must be PIECEWISE-CONSTANT (flat over intervals, not sloped).

      ## Using step_config_generator

      1. CALL step_config_generator FIRST to get structured parameters
      2. Extract intervals: list of (start, end, height) tuples
      3. Create function with jnp.piecewise or jnp.where:
         - jnp.piecewise(x, [conditions], [values])
         - Or chain jnp.where for simpler cases
      4. Ensure function is CONSTANT over each interval (no linear ramps)

      ## Example Edit from step_config_generator Output

      If step_config_generator returns:
        intervals: [(-0.4, -0.2, 0.7), (-0.2, 0.2, 1.3), (0.2, 0.4, 0.7)]

      Edit to create:
        def create_step_function(x, intervals):
            # Piecewise-constant function
            f = jnp.zeros_like(x)
            for (start, end, height) in intervals:
                mask = (x > start) & (x < end)
                f = f.at[mask].set(height)
            return f

      Or using jnp.piecewise:
        conditions = [(x > start_1) & (x < end_1), (x > start_2) & (x < end_2), ...]
        values = [h1, h2, h3, 0.0]  # 0 outside intervals
        f = jnp.piecewise(x, conditions, values)

      ## Probe-Before-Eval Protocol

      1. Get 3-5 configurations from step_config_generator
      2. Create step functions, probe each
      3. Rank by probe score
      4. Evaluate top 2 only (max 4 evals total)

      ## Common Mistakes to Avoid

      - Using linear interpolation instead of constant values
      - Not using step_config_generator (random perturbations don't work)
      - Evaluating before probing (wastes precious evals)
      - Creating too many evals (max ~4, use probes for ranking)
new_middlewares:
  - name: enforce_step_function_creation
    hook: before_model
    description: Enforce that solver uses step_config_generator and creates TRUE step functions (not linear). Warn if attempting to modify seed's linear optimization without using step_config_generator.
    implementation_py: |
      def before_model(hook_input):
          state = hook_input.get("state", {})
          iteration = state.get("iteration", 0)
          
          # Track if step_config_generator was used
          used_step_config = state.get("used_step_config", False)
          last_tool = state.get("last_tool", "unknown")
          
          # After first few iterations, enforce using step_config_generator
          if iteration >= 3 and not used_step_config:
              return "WARNING: You haven't used step_config_generator yet. The seed program uses piecewise-LINEAR optimization but step functions must be PIECEWISE-CONSTANT. Call step_config_generator to get structured step parameters before editing."
          
          # Warn if editing without using step_config_generator output
          if iteration >= 5 and last_tool in ["edit_solution"] and not used_step_config:
              return "WARNING: You edited without using step_config_generator. The seed's linear optimization won't work for step functions. Use step_config_generator first to get TRUE step parameters."
          
          # Track progress
          if last_tool == "step_config_generator":
              state["used_step_config"] = True
          
          return None
