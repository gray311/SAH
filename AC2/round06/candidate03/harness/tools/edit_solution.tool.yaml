type: tool
name: edit_solution
description: 'Edit _create_step_initializer to create step variants.

  Use: f = f.at[int(0.15*n):int(0.25*n)].set(1.2)

  Change heights: h = 1.3 instead of 1.0

  Multiple .at[].set() for multi-peak functions'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
