type: tool
name: step_config_generator
description: Generate step function configurations systematically. Returns intervals and heights for constructing
  piecewise-constant functions. Call once at start to get initial configuration, then call again with
  different parameters for diverse exploration.
input_schema:
  type: object
  properties:
    num_steps:
      type: integer
      description: Number of steps in the function (2-10)
    symmetric:
      type: boolean
      description: Whether the function is symmetric around 0
    base_height:
      type: number
      description: Base height for steps (default 1.0)
