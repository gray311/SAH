type: tool
name: edit_solution
description: 'Change the code inside the EVOLVE-BLOCK region. Create new initialization functions:


  - Add new methods to C2Optimizer for different function families

  - Use jax.numpy operations to create continuous functions

  - Patch into the existing _create_multi_start method


  Examples:

  - Smooth steps: f = jnp.piecewise with linear transitions

  - Plateau: left_slope + flat + right_slope

  - Multi-hump: concatenate multiple peaks'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
