type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. To vary hyperparameters:

  - Modify OptimizerHyperparameters fields: num_intervals, learning_rate, num_steps, warmup_steps, stagnation_window,
  reinit_fraction, reinit_std, reinit_interval

  - Or modify _create_multi_start(num_starts=...) to change number of initializations

  - Key: Keep the multi-start framework intact, just tune its parameters'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
