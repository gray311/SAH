type: tool
name: hyperparameter_sweeper
description: Generate diverse hyperparameter configurations for the multi-start optimizer. Each call with
  seed_num returns a config specifying num_intervals, learning_rate, stagnation_window, reinit_fraction,
  num_steps, and reinit_std. Call with seed_num=0,1,2,3,4 to get 5 diverse configs. Use these configs
  to guide probe-based evaluation.
input_schema:
  type: object
  properties:
    seed_num:
      type: integer
      description: Random seed for config generation (0-99)
