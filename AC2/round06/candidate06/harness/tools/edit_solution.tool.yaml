type: tool
name: edit_solution
description: 'Change code in EVOLVE-BLOCK. To create step functions:


  - Use jnp.where for simple cases: f = jnp.where((x > -w) & (x < w), h, 0)

  - Use jnp.piecewise for multi-step: jnp.piecewise(x, [bins], [heights])

  - Direct array construction: f = jnp.zeros(n); f[start:end] = h


  KEY: Create piecewise-CONSTANT functions (flat regions), NOT linear ramps. The seed''s _create_step_initializer
  is close; create variants with different:

  - num_intervals support width

  - step heights (0.8 to 2.0)

  - number of steps (2, 3, 4, 5)

  - symmetry (centered vs asymmetric)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
