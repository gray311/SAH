type: tool
name: step_pattern_generator
description: 'Generate diverse step function configurations. Returns numpy-compatible arrays for piecewise-constant
  functions. Varies: number of steps, widths, heights, symmetry, multi-peak patterns. Call to create concrete
  step functions to test.'
input_schema:
  type: object
  properties:
    num_steps:
      type: integer
      description: Number of step regions (2-6)
    symmetric:
      type: boolean
      description: Symmetric around x=0
    height_range:
      type: object
      description: min/max height for steps
      properties:
        min:
          type: number
        max:
          type: number
