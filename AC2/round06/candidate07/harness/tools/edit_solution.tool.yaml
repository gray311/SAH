type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to create TRUE step functions (piecewise-constant). Use jnp.piecewise:


  Example: f = jnp.piecewise(x, [x < -1, (-1) <= x < 1, x >= 1], [0.0, 1.5, 0.0])


  Or manual construction: f = jnp.zeros(n); f = f.at[start:end].set(1.0)


  Key: FLAT regions (constant), not linear ramps. Avoid jax.nn.relu which creates non-linearities.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
