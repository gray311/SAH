type: tool
name: edit_solution
description: Change optimizer hyperparameters in the EVOLVE-BLOCK:\n   - Modify OptimizerHyperparameters
  class fields\n   - Change num_intervals, learning_rate, num_steps, warmup_steps\n   - Tune reinit_fraction
  and reinit_std for better exploration\n   - Use concrete values, e.g., num_intervals=350, learning_rate=0.125,
  num_steps=40000
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
