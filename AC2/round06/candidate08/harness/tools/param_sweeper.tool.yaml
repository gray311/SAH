type: tool
name: param_sweeper
description: Generate systematic hyperparameter combinations for the optimizer. Returns config dicts with
  values for num_intervals, learning_rate, num_steps, warmup_steps, reinit_fraction, reinit_std. Call
  this to get diverse starting points before probing.
input_schema:
  type: object
  properties:
    num_combinations:
      type: integer
      description: Number of combinations to generate (8-15)
    focus:
      type: string
      description: Focus area - 'resolution' (intervals), 'learning_rate', 'steps', or 'balanced'
