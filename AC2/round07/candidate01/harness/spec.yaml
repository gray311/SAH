schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization. Your task: maximize
  C2 = ||f * f||_2^2 / ((int_f)^2 ||f * f||_inf) for the second autocorrelation inequality.

  - Theoretical upper bound: 1.0 (Young's inequality)
  - Current best in literature: 0.8963 (achieved by step functions)
  - Target: surpass 0.8963

  CRITICAL: Step functions must be PIECEWISE-CONSTANT (flat over intervals), NOT linear ramps.
  The seed program uses piecewise-LINEAR initialization. Your edits MUST create TRUE step functions.

  STRATEGY:

  1. Call analyze_step_structure FIRST to understand current function structure
  2. Call step_config_generator to get structured step parameters
  3. Edit to create TRUE step functions using those parameters (not linear ramps!)
  4. Call analyze_step_structure AGAIN to verify you created step functions
  5. Probe variants, evaluate only top 2 (max ~4-6 evals)

  WORKFLOW: analyze_step_structure -> step_config_generator -> edit to TRUE step -> analyze_step_structure -> probe -> repeat -> evaluate

  TOOLS:
  - analyze_step_structure: Analyze current function to detect if step or linear
  - step_config_generator: Generate structured step function parameters
  - edit_solution: Create TRUE step functions (CONSTANT, not linear)
  - probe_solution: Cheap ranking (~10s, separate budget)
  - evaluate_solution: Only for top candidates
  - finish: End when done
skill_description: C2 maximization via TRUE step functions. Must verify edits create piecewise-constant functions, not linear ramps.
skill_body: |
  # C2 Maximization: TRUE Step Functions

  ## Critical Distinction

  - Seed uses PIECEWISE-LINEAR optimization (fails)
  - You need PIECEWISE-CONSTANT step functions (succeeds)
  - Step functions are FLAT over intervals, not sloped

  ## Workflow

  ### Step 1: Analyze Current Structure
  CALL analyze_step_structure to detect if current code creates:
  - Linear ramps (bad)
  - Piecewise-constant steps (good)
  
  Typical analysis output:
  - function_type: "linear" or "step"
  - num_regions: number of distinct regions
  - is_piecewise_constant: true/false

  ### Step 2: Generate Step Configuration
  CALL step_config_generator with appropriate parameters:
  - num_steps: 2-6 steps (more complex = better?)
  - symmetric: true/false (try both)
  - base_height: 1.0-2.0
  
  ### Step 3: Edit to TRUE Step Function
  Use edit_solution to create piecewise-CONSTANT function:
  - Use jnp.piecewise: f = jnp.piecewise(x, [cond1, cond2, ...], [h1, h2, ...])
  - Use jnp.where chains: f = jnp.where(cond1, h1, jnp.where(cond2, h2, 0))
  - Key: VALUES are CONSTANTS, not linear functions of x

  ### Step 4: Verify with analyze_step_structure
  Call analyze_step_structure again. If is_piecewise_constant is false, EDIT AGAIN.

  ### Step 5: Probe & Evaluate
  - Probe 3-5 variants to rank them
  - Evaluate only TOP 2 (max ~4 evals)
  - If no improvement, try different num_steps or symmetric settings

  ## Common Mistakes

  - Creating linear ramps instead of flat regions
  - Not verifying with analyze_step_structure before eval
  - Creating too many evals (use probes for ranking)
  - Using seed's initialization patterns (they're linear!)
tool_descriptions:
  edit_solution: |
    Change code in EVOLVE-BLOCK. Create TRUE step functions that are CONSTANT over intervals:
    - Use jnp.piecewise(x, [conditions], [constant_values]) where values are numbers, not functions
    - Example: f = jnp.piecewise(x, [x < -1, (x >= -1) & (x < 1), x >= 1], [0, 1.5, 0])
    - DO NOT use linear interpolation: avoid jnp.linspace, np.linspace, or functions like lambda x: x
    - DO NOT modify seed's _create_step_initializer which creates linear ramps - completely rewrite with piecewise
  evaluate_solution: |
    Run full evaluator. Returns combined_score. Use sparingly (max ~20 total). Only evaluate after probing and verifying step structure.
  probe_solution: |
    Cheap score on subsampled data (~10s). Separate budget (~30). Use for ranking variants. NOT comparable to full scores.
  finish: |
    End the session. Call when budget exhausted or no improvement possible.
sampling:
  temperature: 0.95
  top_p: 0.95
  top_k: 40
  max_tokens: 16000
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 15000
new_tools:
  - name: analyze_step_structure
    description: |
      Analyze the current function implementation to detect whether it creates TRUE step functions
      (piecewise-constant) or linear ramps. Returns diagnostic info: function_type, num_regions,
      is_piecewise_constant, estimated_num_steps. Use this BEFORE and AFTER edits to verify
      you're creating step functions, not linear ramps. This tool is CHEAP - use it liberally.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          code = ctx.get_program()
          # Look for jnp.piecewise, jnp.where patterns that indicate step functions
          has_piecewise = 'jnp.piecewise' in code or 'piecewise' in code.lower()
          has_where_steps = 'jnp.where' in code
          
          # Check for linear patterns (slope terms like x, or linear expressions)
          linear_indicators = [
              'jnp.where' in code and ('x <' in code or 'x >' in code or 'x <= ' in code),
              'x *' in code or '+ x' in code or '- x' in code,
          ]
          
          # Extract function type based on patterns
          if has_piecewise and not ('jnp.linspace' in code or 'np.linspace' in code):
              func_type = 'step'
              is_step = True
          elif 'jnp.linspace' in code or 'np.linspace' in code:
              func_type = 'linear'
              is_step = False
          elif any('jnp.where' in line and 'jnp.where' in ctx.get_program() for line in code.split('\n')[:10]):
              # Check if where statements create constants or linear functions
              func_type = 'step' if 'constant' in ctx.get_program().lower() else 'unknown'
              is_step = True
          elif 'lambda x' in code or 'x**' in code:
              func_type = 'nonlinear'
              is_step = False
          else:
              func_type = 'unknown'
              is_step = None
          
          # Estimate number of steps/regions
          import re
          regions = re.findall(r'x\s*[><=]\s*[0-9.-]+', code)
          num_regions = len(set(regions)) if regions else 0
          num_steps = num_regions // 2 if num_regions > 0 else 0
          
          return {
              'function_type': func_type,
              'is_piecewise_constant': is_step if is_step is not None else False,
              'num_regions': num_regions,
              'estimated_num_steps': num_steps,
              'has_piecewise': has_piecewise,
              'has_linear': any('x*' in line or '+x' in line or '-x' in line 
                              for line in code.split('\n') if 'where' in line.lower())
          }
new_skills:
  - name: step-function-verification
    description: |
      Playbook for verifying TRUE step function creation. Use analyze_step_structure to confirm
      edits create piecewise-constant functions before expensive evaluation.
    body: |
      # Step Function Verification Playbook

      ## Critical: Detect Linear vs Step Functions

      The seed program creates PIECEWISE-LINEAR functions. You need PIECEWISE-CONSTANT steps.

      ### Step 1: Initial Analysis
      Call analyze_step_structure immediately after loading the seed:
      - Should report function_type: "unknown" or "linear"
      - is_piecewise_constant should be False or None
      - This confirms the seed uses linear optimization

      ### Step 2: After Each Edit
      After calling edit_solution, call analyze_step_structure:
      - Look for function_type: "step" or is_piecewise_constant: True
      - Check num_regions and estimated_num_steps (should match your intended steps)
      - If is_piecewise_constant is False, EDIT AGAIN with jnp.piecewise

      ### Step 3: Pattern Recognition

      Good step function indicators:
      - 'jnp.piecewise(x, [cond1, cond2, ...], [h1, h2, ...])' where h1, h2 are constants
      - Multiple 'jnp.where' chains with constant values
      - No linear expressions like '+ x', '- x', '* x' in the function body

      Bad indicators (linear ramps):
      - 'jnp.linspace' or 'np.linspace'
      - 'lambda x: x' or similar
      - Linear expressions in where conditions

      ### Step 4: Before Evaluation
      NEVER evaluate without first calling analyze_step_structure!
      - If function_type is not "step", discard and re-edit
      - Waste ~10s of analysis is better than wasting an eval on linear functions
      - Only evaluate if is_piecewise_constant: True

      ### Step 5: Iterative Refinement
      1. Generate config with step_config_generator
      2. Edit to create step function
      3. Verify with analyze_step_structure
      4. If wrong, go back to step 2
      5. Once verified as step function, probe and then evaluate

      ## Checklist

      - [ ] Called analyze_step_structure after edit
      - [ ] function_type shows "step"
      - [ ] is_piecewise_constant: True
      - [ ] num_regions matches intended step count
      - [ ] Only then call probe/evaluate
new_middlewares:
  - name: enforce_step_verification
    hook: before_model
    description: |
      Middleware that enforces using analyze_step_structure to verify step function creation.
      Prevents wasting evaluations on linear ramps by requiring verification.
    implementation_py: |
      def before_model(hook_input):
          state = hook_input.get("state", {})
          iteration = state.get("iteration", 0)
          last_tool = state.get("last_tool", "unknown")
          used_verify = state.get("used_verify", 0)
          
          # After first edit, require verification
          if iteration >= 2 and last_tool == "edit_solution" and used_verify < 1:
              return "CRITICAL: You edited but haven't verified the step function structure. Call analyze_step_structure immediately to confirm you created TRUE step functions (not linear ramps) before evaluating!"
          
          # Warn if about to evaluate without verification
          if last_tool == "evaluate_solution" and used_verify == 0:
              return "WARNING: You're about to evaluate without verifying step structure. Did you call analyze_step_structure and confirm is_piecewise_constant: True?"
          
          # Track verification attempts
          if last_tool == "analyze_step_structure":
              used_verify += 1
              state["used_verify"] = used_verify
          
          return None
