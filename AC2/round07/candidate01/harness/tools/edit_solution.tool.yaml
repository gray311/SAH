type: tool
name: edit_solution
description: 'Change code in EVOLVE-BLOCK. Create TRUE step functions that are CONSTANT over intervals:

  - Use jnp.piecewise(x, [conditions], [constant_values]) where values are numbers, not functions

  - Example: f = jnp.piecewise(x, [x < -1, (x >= -1) & (x < 1), x >= 1], [0, 1.5, 0])

  - DO NOT use linear interpolation: avoid jnp.linspace, np.linspace, or functions like lambda x: x

  - DO NOT modify seed''s _create_step_initializer which creates linear ramps - completely rewrite with
  piecewise'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
