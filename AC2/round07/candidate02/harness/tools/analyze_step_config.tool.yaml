type: tool
name: analyze_step_config
description: 'Analyze the current best step function, extract its step parameters (intervals, heights,
  widths),

  and suggest targeted improvements. Returns: peak_height, plateau_start, plateau_end, plateau_width,

  outer_wings, improvement_suggestions (list of specific changes to try like "INCREASE_PEAK_HEIGHT:

  from 1.4 to 1.7" or "WIDEN_PLATEAU: extend from 0.3 to 0.5"). Call this FIRST to understand

  the current best, and AFTER each evaluation to guide iterative refinement.'
input_schema:
  type: object
  properties: {}
