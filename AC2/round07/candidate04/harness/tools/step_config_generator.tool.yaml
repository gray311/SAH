type: tool
name: step_config_generator
description: Generate diverse step function configurations for C2 optimization. Returns structured parameters
  (intervals, heights, symmetry) for creating TRUE piecewise-constant functions.
input_schema:
  type: object
  properties:
    num_steps:
      type: integer
      description: Number of steps. Range 2-10.
    symmetric:
      type: boolean
      description: Whether function is symmetric around 0.
    base_height:
      type: number
      description: Base height scale.
    peak_position:
      type: number
      description: Center of main peak from -1 to 1.
