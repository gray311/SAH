type: tool
name: parameterize_pattern
description: 'Take a seed pattern index and return parameterized variants by perturbing heights, widths,

  and symmetry. Returns a structured output with variants for each pattern, enabling systematic

  exploration of the 14+ pre-engineered step patterns in the seed.'
input_schema:
  type: object
  properties:
    pattern_idx:
      type: integer
      description: Pattern index from seed's _create_step_initializer (0-13+)
    height_scale:
      type: number
      description: Scale all heights by this factor (0.8-1.5 recommended)
    width_scale:
      type: number
      description: Scale all interval widths by this factor (0.9-1.1 recommended)
    symmetry_var:
      type: number
      description: Asymmetry shift (-0.3 to 0.3, or 0 for symmetric)
