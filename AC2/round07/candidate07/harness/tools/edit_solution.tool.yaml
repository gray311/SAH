type: tool
name: edit_solution
description: 'Change the code inside the EVOLVE-BLOCK region. The seed''s approach is too slow.

  Instead of optimizing with 35000 gradient steps, completely replace the solution

  with a step function created by generate_complete_step_function.


  Generate a complete function using jnp.piecewise:

  f = jnp.piecewise(x, [cond1, cond2, cond3, ...], [h1, h2, h3, ...])


  The conditions define intervals, heights are constant over each interval.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
