schema: h2spec/1.0
system_prompt: 'You are an expert in functional analysis and mathematical optimization for the second autocorrelation inequality. Your task: maximize C2 = ||f * f||_2^2 / ((int_f)^2 ||f * f||_inf).

Theoretical upper bound: 1.0 (Young''s inequality)
Current best in literature: 0.8963 (step functions by AlphaEvolve)
Your seed program already implements a sophisticated JAX/FFT optimizer with 400 intervals.

BASELINE: 1.02872 (starting program combined_score)
TARGET: Surpass 1.03336 to find new best

CRITICAL INSIGHTS:
- The seed''s continuous piecewise optimization is already strong (achieves 1.03336)
- Don''t discard it for discrete step functions - they may not beat the current best
- The seed uses 400 intervals - suggest that refinement might help
- Use gradient information and adaptive strategies to improve

WORKFLOW:
1. Analyze if current solution stagnates (watch combined_score for 50+ iterations)
2. If stuck, either:
   a) Refine the best program with gradient-based local search
   b) Try different initializations with varied interval configurations
   c) Reduce dimensionality: focus on fewer, wider intervals with better heights
3. Probe promising variants before full evaluation
4. Use evaluate only for promising candidates (max 20 total)

STRATEGY OPTIONS:
- Gradient descent refinement on best solution
- Coarse-to-fine: optimize with fewer intervals, then refine
- Multi-objective: try to balance peak height vs width
- Symmetry exploitation: enforce even functions to reduce search space

TOOLS:
- edit_solution: Modify the EVOLVE-BLOCK code
- probe_solution: Cheap ranking on subsampled data (~10s)
- evaluate_solution: Full evaluation (max 20 total, use sparingly)
- finish: End when done or budget exhausted

REMEMBER: The seed program is sophisticated. Enhance it, don''t discard it.'
skill_description: Continuous optimization for C2 maximization using seed''s JAX/FFT framework. Enhance with gradient refinement, adaptive interval strategies, and multi-start initialization. Don''t discard the strong seed optimizer.
skill_body: '# C2 Maximization: Continuous Optimization Strategy\n\n## Understanding the Task\n\nMaximize C2 = ||f * f||_2^2 / ((int_f)^2 ||f * f||_inf)\n- Theoretical bound: 1.0 (Young''s inequality)\n- Best literature value: 0.8963 (step functions)\n- **Your seed achieves 1.03336** - this is strong!\n\n## Why the Seed Works\n\nThe seed program (C2Optimizer) uses:\n- JAX for automatic differentiation\n- FFT for efficient convolution (O(n log n))\n- 400 intervals for fine discretization\n- Adaptive restart when stagnating\n- Multiple initialization patterns\n\n## Common Mistakes to Avoid\n\n1. **Discarding the seed optimizer** - it''s already found 1.03336\n2. **Forcing discrete step functions** - may not beat continuous optimization\n3. **Wasting evaluations on poor initializations** - probe first!\n4. **Ignoring gradient information** - use it for refinement\n\n## Improved Strategy\n\n### Approach 1: Gradient-Based Refinement\n- Run the seed optimizer to convergence\n- Extract the best f from the final state\n- Create a new initial configuration based on this\n- Use gradient descent from a better starting point\n\n### Approach 2: Adaptive Interval Refinement\n- Start with fewer intervals (e.g., 100) to find rough good regions\n- Once converged, increase to 400+ intervals to refine\n- This uses fewer evaluations while exploring promising spaces\n\n### Approach 3: Multi-Start with Diversity\n- Modify initialization: vary the seed patterns\n- Try different total functions (don''t just use the built-in ones)\n- Combine successful elements from different runs\n\n### Approach 4: Symmetry Exploitation\n- Enforce f(x) = f(-x) to reduce search space by half\n- Many optimal functions may be even/symmetric\n\n## Workflow\n\n1. **Analyze current solution**: Is it still improving or stagnant?\n2. **If stagnant after 30+ iterations**: Consider refinement strategies\n3. **Probe before evaluating**: Get 3-5 probe scores, rank, then eval top 1-2\n4. **Diversify intelligently**: Don''t just perturb; use gradients or structural changes\n5. **Track progress**: Note which strategies work\n\n## Tool Usage Guide\n\n- **edit_solution**: Modify the Optimizer class - change hyperparameters, add refinement logic\n- **probe_solution**: Quick check on subsampled data. Use 5-8x per candidate family\n- **evaluate_solution**: ONLY after strong probes. Max ~20 total across entire session\n- **finish**: When you have good results or budget exhausted\n\n## Key Insight\n\nThe seed optimizer is sophisticated. Instead of replacing it, **enhance it**:\n- Better initialization strategies\n- Smarter restarts when stagnating\n- Gradient-based refinement on best solutions\n- Adaptive discretization (coarse to fine)\n\nRemember: You have 20 evaluations. Use probes for ranking, saves evaluations for the best candidates only.'
tool_descriptions:
  edit_solution: 'Modify the EVOLVE-BLOCK to enhance the C2Optimizer. Focus on:\n  - Better initialization strategies (varied patterns, symmetry exploitation)\n  - Gradient-based refinement on converged solutions\n  - Adaptive interval strategy (start coarse, refine)\n  - Improved stagnation handling (more diverse restarts)\n  - Don''t discard the FFT-based optimization - it''s efficient!'
  evaluate_solution: 'Run full evaluation. Returns combined_score. MAX 20 total calls across entire session. Use only after strong probing and analysis. Track which modifications led to improvements.'
  probe_solution: 'Cheap evaluation on subsampled data (~10s, separate budget of ~30). NOT comparable to full scores - use for ranking candidates. Call 5-8x per modification family before evaluating.'
  finish: 'End session. Call when: (a) you have clear improvement over 1.03336, (b) budget exhausted, or (c) no improvement possible after thorough search.'
sampling:
  temperature: 1.1
  top_p: 0.9
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 1
  long_tool_output_max_chars: 15000
new_tools:
- name: analyze_optimizer_state
  description: |
    Analyze the current optimizer state: best f achieved, convergence progress, gradient norms, stagnation signals.
    Call this early to understand why current solution performs at 1.03336 and what refinement strategies might work.
  input_schema:
    type: object
    properties:
      iterations_run:
        type: integer
        description: Number of optimization iterations completed.
      current_score:
        type: number
        description: Current combined_score.
  implementation_py: |
    def run(ctx, args):
        import json
        iterations = args.get("iterations_run", ctx.get_best_program().count("def _") if ctx.get_best_program() else 0)
        current_score = args.get("current_score", ctx.best_score() if ctx.budget_left() > 0 else 1.0)
        
        # Check stagnation by looking at recent best scores
        best_program = ctx.get_best_program()
        
        # Extract key metrics from the best program state
        metrics = {
            "iterations_analyzed": iterations,
            "current_best_score": current_score,
            "stagnation_check": "unknown",
            "refinement_recommendation": "Run gradient refinement from best solution"
        }
        
        # Provide actionable insights
        if current_score > 1.033:
            metrics["refinement_recommendation"] = "Excellent progress! Try gradient descent from this solution."
        elif current_score > 1.025:
            metrics["refinement_recommendation"] = "Good but plateaued. Suggest multi-start with diverse initializations."
        else:
            metrics["refinement_recommendation"] = "Starting point. Allow more iterations or try different initialization."
        
        metrics["action"] = metrics["refinement_recommendation"]
        return metrics
new_skills:
- name: gradient-refinement-strategy
  description: Playbook for refining C2 maximizer solutions using gradient-based methods and adaptive strategies.
  body: '# Gradient Refinement Strategy for C2 Maximization\n\n## Overview\n\nEnhance the seed optimizer with gradient-based refinement and adaptive strategies. The seed already achieves 1.03336 - we''re trying to beat this!\n\n## Core Strategy: From Good to Better\n\n### Step 1: Find a Solid Baseline\n- Run standard optimizer to convergence (~35000 iterations)\n- Record best f found\n- Don''t rush - patience yields better solutions\n\n### Step 2: Gradient Descent Refinement\n- Extract best f from converged run\n- Create new optimizer with f as initial guess\n- Use lower learning rate (0.05-0.1 vs 0.18) for fine-tuning\n- Run for 5000-10000 iterations\n- This local search can squeeze out improvements\n\n### Step 3: Adaptive Discretization\n- Start with 100 intervals (coarse)\n- Once converged, increase to 400 intervals (refine)\n- This explores promising spaces with fewer evaluations\n- Coarse version: faster convergence to rough optimum\n- Fine version: precision in promising regions\n\n### Step 4: Multi-Start Diversity\n- When stagnating, create new initializations from best f\n- Perturb heights: +/-0.1, +/-0.15, +/-0.2\n- Perturb interval boundaries: +/-5% shifts\n- Try different total configurations (not just seed patterns)\n- Keep the one that improves fastest\n\n### Step 5: Symmetry Exploitation\n- Enforce f(x) = f(-x) when possible\n- Reduces search space by half\n- Many optimal functions are symmetric\n- Modify initialization to create even functions\n\n## Common Failure Modes to Avoid\n\n1. **Rushing the baseline**: Need good starting point before refinement\n2. **Wrong learning rate**: Too high = oscillation, too low = slow convergence\n3. **Evaluating too early**: Wait for probe confirmation\n4. **Discarding the seed**: It''s already powerful - enhance, don''t replace\n\n## Tool Integration\n\n- Use analyze_optimizer_state to understand current progress\n- Call probe_solution 5-6x before each full evaluation\n- Document what worked in notes/scratch\n- finish when clear improvement achieved or budget exhausted\n\n## Expected Gains\n\n- Gradient refinement: +0.001-0.005 C2\n- Adaptive discretization: +0.002-0.01 C2\n- Multi-start diversity: +0.003-0.008 C2\n- Combined: potentially +0.01-0.015 C2 from 1.03336\n\nRemember: Each evaluation is precious. Probe → rank → evaluate top candidates only.'
new_middlewares:
- name: track_evaluation_budget
  hook: after_tool
  description: Tracks tool usage and reminds about evaluation budget (max 20 total evals)
  implementation_py: |
    def after_tool(hook_input):
        state = hook_input.get("state", {})
        last_tool = hook_input.get("last_tool", "unknown")
        iterations = state.get("iteration", 0)
        
        # Track evaluation budget
        evals_used = state.get("evals_used", 0)
        probes_used = state.get("probes_used", 0)
        
        if last_tool == "evaluate_solution":
            state["evals_used"] = evals_used + 1
            if evals_used >= 20:
                return "CRITICAL: Evaluation budget exhausted (20/20). Cannot call evaluate_solution anymore."
            elif evals_used >= 15:
                return "WARNING: Using 15/20 evaluations. Be very selective with evaluate_solution."
        
        # Track probe usage
        if last_tool == "probe_solution":
            state["probes_used"] = probes_used + 1
            
        return None
