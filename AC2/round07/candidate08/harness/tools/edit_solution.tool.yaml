type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK to enhance the C2Optimizer. Focus on:\n  - Better initialization
  strategies (varied patterns, symmetry exploitation)\n  - Gradient-based refinement on converged solutions\n  -
  Adaptive interval strategy (start coarse, refine)\n  - Improved stagnation handling (more diverse restarts)\n  -
  Don't discard the FFT-based optimization - it's efficient!
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
