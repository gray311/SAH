type: tool
name: edit_solution
description: 'Change code in EVOLVE-BLOCK. Modify function architecture to explore novel approaches:


  - Try mixture models: weighted combinations of gaussians, steps, splines

  - Try multi-scale: coarse grid init, then refine

  - Try Fourier-based: optimize frequency coefficients

  - Try splines: piecewise polynomial with optimized knots


  Key: Break from seed''s step-function-only approach. Mix and match bases.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
