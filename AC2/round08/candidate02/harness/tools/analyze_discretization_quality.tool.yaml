type: tool
name: analyze_discretization_quality
description: 'Analyze the current discretization setup and provide numerical quality assessment.

  Extracts num_intervals from code, checks for padding/normalization, and recommends improvements.

  Returns current_intervals, recommended_intervals, has_padding (bool), has_normalization (bool),

  discretization_quality_score (0-10). Use this BEFORE edits to ensure numerical accuracy.

  This tool helps decide whether to increase/decrease resolution and whether to add stability fixes.

  Very cheap to run - call multiple times during exploration.'
input_schema:
  type: object
  properties: {}
