type: tool
name: edit_solution
description: 'Change code in EVOLVE-BLOCK. You can modify:

  - Discretization: num_intervals (200-2000)

  - Learning rate and steps: lr (0.01-1.0), num_steps (1000-100000)

  - Initialization: _create_step_initializer, or entirely new function representations

  - Optimization strategy: gradient steps, annealing schedules


  For new function representations:

  - Gaussian: f = jnp.exp(-((x - mu)/sigma)**2)

  - Spline: Use B-spline basis with optimized coefficients

  - Piecewise polynomial: f = jnp.piecewise(x, [xids], [poly1, poly2, ...])


  Always ensure f(x) >= 0 and use numerical stability practices (padding, normalization).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
