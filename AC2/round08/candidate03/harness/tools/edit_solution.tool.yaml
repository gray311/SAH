type: tool
name: edit_solution
description: 'Change code in EVOLVE-BLOCK. Create DIVERSE function types beyond the seed''s step functions.
  Try:

  - B-splines: use splrep/splev with optimized knots

  - Fourier basis: sum of cosines with softplus for non-negativity

  - Polynomial decay: (1 - |x|/R)^alpha

  - Gaussian mixtures: weighted sum of Gaussians

  - Hybrid: step function with smooth tails

  Key: VARY THE FUNCTION CLASS, not just step-function parameters'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
