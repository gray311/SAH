type: tool
name: edit_solution
description: 'Edit code to implement a NEW function class. Use generate_function_candidate''s output as
  guide.


  For splines: Use cubic B-spline basis with optimized control points

  For mixtures: Weighted sum of basis functions with positive weights

  For polynomials: Truncated polynomial with positivity constraints


  Key: The function must be non-negative (use softplus, square, or exp transformations).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
