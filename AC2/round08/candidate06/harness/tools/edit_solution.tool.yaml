type: tool
name: edit_solution
description: 'Edit the optimizer strategy. DO NOT just verify step functions - try completely different
  approaches:


  - Evolutionary search: rewrite to use population-based mutation/crossover


  - Alternative representations: spline optimization, Gaussian mixtures


  - Coarse-to-fine refinement: start with fewer intervals, then refine


  - Evolutionary local search: structured mutations on existing patterns


  - Key: Break from the seed''s gradient-based approach entirely'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
