type: tool
name: edit_solution
description: 'Modify optimizer hyperparameters in OptimizerHyperparameters class and step function

  patterns in _create_step_initializer. Key changes:

  - Increase reinit_fraction (0.25-0.40) to reset more of the function

  - Increase reinit_std (0.035-0.08) for larger perturbations

  - Increase num_intervals (600-800) for finer step structures

  - Adjust num_steps (45000-55000) for more refinement

  - Modify step heights in _create_step_initializer (try 1.8-2.2 range)

  - Add new pattern variants with more peaks or asymmetric shapes

  CRITICAL: Don''t create basic step functions - the seed already does this! Focus on

  PARAMETER MUTATIONS to escape local optima.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
