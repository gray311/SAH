type: tool
name: generate_parameter_mutations
description: 'Generate 3-5 structured parameter mutation suggestions to escape local optima.

  Given current hyperparameters and optional notes about current performance, returns

  mutations focused on: (1) boosting reinit_fraction for escape, (2) increasing

  num_intervals for finer structure, (3) adjusting step heights/patterns.

  Input: current parameters as dict, notes on stagnation. Output: list of mutation dicts

  with description, parameter changes, and reasoning.'
input_schema:
  type: object
  properties:
    current_params:
      type: object
      description: Current hyperparameters
    notes:
      type: string
      description: Optional notes about current performance or issues
