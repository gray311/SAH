type: tool
name: edit_solution
description: 'Change code in EVOLVE-BLOCK. Create TRUE step functions that are CONSTANT over intervals
  using jnp.piecewise:


  - Generate random step config: num_steps (3-8), symmetric (true/false), heights array (0.5-2.5)

  - Create domain: x = jnp.linspace(-10, 10, num_intervals)

  - Define conditions: boundaries at fixed fractions (e.g., [-0.75, -0.25, 0.25, 0.75] for 4 steps)

  - Use: f = jnp.piecewise(x, [x < -0.75, (x >= -0.75) & (x < -0.25), (x >= -0.25) & (x < 0.25), x >=
  0.25], [h1, h2, h3, h4])

  - h1, h2, h3, h4 MUST be constant numbers, NOT functions of x

  - Delete the seed''s _create_step_initializer entirely - it creates linear ramps!

  - Rewrite _objective_fn to work with the new step function interface'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
