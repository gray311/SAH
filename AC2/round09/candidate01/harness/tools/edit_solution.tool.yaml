type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. Use SEARCH/REPLACE diffs for targeted changes or full rewrites
  for major structural changes.

  The EVOLVE-BLOCK defines OptimizerHyperparameters and C2Optimizer class. Keep the outer structure intact.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
