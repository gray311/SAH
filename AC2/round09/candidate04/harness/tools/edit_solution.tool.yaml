type: tool
name: edit_solution
description: Change the EVOLVE-BLOCK code. Use SEARCH/REPLACE diffs for small changes (preferred) or full
  rewrite for major redesign. Preserve imports and entry function outside the block.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
