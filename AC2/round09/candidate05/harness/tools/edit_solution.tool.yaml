type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK. For exploring new function families, DO A FULL REWRITE of the function
  construction part. Keep imports and the entry function intact.

  Format: Complete new EVOLVE-BLOCK as plain Python code, or targeted diffs for small fixes.

  CRITICAL: When trying new families (splines, mixtures, hybrids), rewrite the function constructor entirely.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
