type: tool
name: internal_search
description: 'Perform a bounded internal search within a function family to find optimal parameters.

  Call this after writing a new function construction but before full evaluation.

  Returns the best config found and its probe score.'
input_schema:
  type: object
  properties:
    family:
      type: string
    n_search:
      type: integer
      minimum: 5
      maximum: 10
