type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK step function parameters. Target: heights, widths, positions of
  steps.

  Use SEARCH/REPLACE diffs. Test small changes first (±5-10%). Preserve working patterns.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
