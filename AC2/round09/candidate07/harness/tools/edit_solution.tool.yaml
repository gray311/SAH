type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. Format: (1) SEARCH/REPLACE blocks with
  EXACT

  original lines, or (2) single-line modifications. For hyperparameter tuning, prefer changing

  ONE numerical value with minimal surrounding changes. NEVER rewrite the whole region.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
