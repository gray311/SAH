type: tool
name: perturb_params
description: 'Safely perturb 1-2 hyperparameters of the current program. Returns a complete EVOLVE-BLOCK

  code with minimal changes. Ideal for math optimization where the seed is already well-tuned.

  Arguments: param_name (required), delta (optional, default ±10%). The tool preserves the

  entire seed structure and only modifies the specified numerical parameter(s).'
input_schema:
  type: object
  properties:
    param_name:
      type: string
      description: Name of hyperparameter to change (learning_rate, num_intervals, num_steps, best_c2)
    delta:
      type: number
      description: Change amount. Auto-scales based on parameter range if not specified.
      default: 0.1
