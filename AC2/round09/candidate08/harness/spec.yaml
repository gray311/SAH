schema: h2spec/1.0
system_prompt: "You are an expert in mathematical discovery and optimization. The goal is to MAXIMIZE the C2 constant for the second autocorrelation inequality: ||f ★ f||₂² ≤ C₂ ||f ★ f||₁ ||f ★ f||_{∞}.

The seed program achieves 0.8962799441554086 using multi-level step functions. To surpass this, you must explore fundamentally different function families beyond step functions.

STRATEGY: Run diverse function family experiments. The current step-function approach is the champion - to beat it, try entirely different mathematical constructions:
1. Spline-based functions (B-splines, cubic splines)
2. Fourier-transform optimized functions (optimizing Fourier coefficients with positivity constraints)
3. Neural network parameterizations (simple MLPs with activation functions)
4. Mixture models (weighted combinations of Gaussians, exponentials)
5. Piecewise polynomial functions (not just constants)

Each evaluation is expensive (~minutes). Use your limited budget wisely:
- Run 2-3 diverse experiments per evaluation, not incremental tweaks
- If an approach doesn't beat seed in <30% time, abandon it
- Always report actual c2 values, not relative improvements

Key mathematical insight: Step functions work because they concentrate mass in specific regions. To beat them, you need functions with smoother transitions or multi-scale features that better balance the L2, L1, and L∞ norms in the convolution.

Remember: The seed uses JAX + FFT convolution. Your edits must be JAX-compatible. Preserving the exact API structure is critical."
skill_description: "Mathematical discovery: Explore diverse function families (splines, Fourier, mixtures, splines) to find novel constructions that surpass the step-function champion for the second autocorrelation inequality constant C2."
skill_body: "# Mathematical Discovery Strategy

## Objective
Maximize C2 = ||f ★ f||₂² / ((∫f)² ||f ★ f||_{∞}) by discovering novel function families beyond the current step-function champion.

## Core Principle
The seed's step functions achieve 0.8962799441554086. To beat this, you need function families with fundamentally different properties:
- **Smoother transitions**: Reduce oscillations in convolution
- **Multi-scale features**: Balance local and global mass distribution
- **Asymmetric designs**: Exploit non-symmetric optimal configurations

## Strategy: Diversity Over Incrementalism
Each evaluation costs precious budget. Do NOT make small incremental edits. Instead:

1. **Experiment 1: Spline-based functions**
   - Replace step heights with cubic spline coefficients
   - Use scipy.interpolate.CubicSpline for smooth transitions
   - Optimize 5-10 spline control points instead of hundreds of step levels

2. **Experiment 2: Fourier optimization**
   - Optimize Fourier coefficients directly
   - Enforce positivity in spatial domain via phase constraints
   - Use only 10-20 Fourier modes for efficiency

3. **Experiment 3: Gaussian mixture**
   - Construct f(x) = Σ w_i * exp(-(x-μ_i)²/(2σ_i²))
   - Optimize weights, centers, and widths
   - Start with 3-5 components, refine to 8-12

4. **Experiment 4: Piecewise polynomial**
   - Instead of constant steps, use quadratic or cubic segments
   - Ensure C² continuity at boundaries
   - Optimize breakpoints and coefficients

## Implementation Guidelines
- Always use jax.jit for convolutions
- Keep discretization at ~400 intervals (seed's choice)
- Use jax.nn.softplus for positivity constraints
- Parallelize experiments internally if possible
- Report actual c2 values in comments

## Success Criteria
Any c2 > 0.8962799441554086 is a breakthrough. Aim for combined_score > 1.02."
tool_descriptions:
  edit_solution: 'Change the code inside the EVOLVE-BLOCK region. For this task, you can either: (1) Send targeted SEARCH/REPLACE diffs for small changes, OR (2) Send a complete new EVOLVE-BLOCK when trying a new function family (e.g., switching from step functions to splines). The fixed imports and entry function must remain compatible. When trying new mathematical families, a full rewrite is often necessary.'
  evaluate_solution: 'Run the current program through the evaluator. Returns combined_score (higher better), validity, errors, and budget remaining. Use sparingly - each call costs precious time. Only run when you have a complete, testable hypothesis.'
  probe_solution: 'NOT AVAILABLE for this task - the evaluator is too specialized. Use evaluate_solution for all scoring.'
  finish: 'End the session when you have exhausted your evaluation budget or cannot beat the seed score of 0.8962799441554086.'
sampling:
  temperature: 1.0
  top_p: 0.9
  top_k: 50
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
new_tools:
  - name: generate_function_family
    description: |
      Generate a completely new function family configuration from scratch.
      Supports: splines, Fourier, Gaussian mixtures, piecewise polynomials.
      Returns a ready-to-implementation specification including function definition,
      parameter ranges, and optimization strategy.
    input_schema: {type: object, properties: {
      family: {type: string, enum: ["spline", "fourier", "gaussian_mixture", "piecewise_poly"]},
      seed_variation: {type: integer, minimum: 0, maximum: 10000}
    }}
    implementation_py: |
      def run(ctx, args):
          import random
          family = args.get("family", "gaussian_mixture")
          seed = args.get("seed_variation", 0)
          random.seed(seed)
          
          families = {
              "spline": {
                  "type": "cubic_spline",
                  "params": {
                      "num_control_points": random.choice([8, 10, 12]),
                      "num_intervals": ctx.hypers.num_intervals if hasattr(ctx, 'hypers') else 400,
                      "continuity": "c2"
                  },
                  "hint": "Use scipy.interpolate.CubicSpline with these control points. Ensure f(x) >= 0 everywhere."
              },
              "fourier": {
                  "type": "fourier_optimized",
                  "params": {
                      "num_modes": random.choice([10, 15, 20]),
                      "optimization_method": "coordinate_descent",
                      "positivity_constraint": "via_phase"
                  },
                  "hint": "Optimize Fourier coefficients. Enforce positivity in spatial domain using phase constraints."
              },
              "gaussian_mixture": {
                  "type": "gaussian_mixture",
                  "params": {
                      "num_components": random.choice([5, 7, 9, 12]),
                      "activation": "softplus"
                  },
                  "hint": "f(x) = Σ w_i * exp(-((x-μ_i)/σ_i)²). Optimize w, μ, σ with softplus for positivity."
              },
              "piecewise_poly": {
                  "type": "piecewise_polynomial",
                  "params": {
                      "degree": random.choice([2, 3]),
                      "num_pieces": random.choice([6, 8, 10]),
                      "continuity": "c2"
                  },
                  "hint": "Use piecewise quadratic/cubic polynomials. Ensure C² continuity at breakpoints."
              }
          }
          
          config = families[family]
          return {
              "family": config["type"],
              "params": config["params"],
              "hint": config["hint"],
              "note": "This is a complete function family specification. Use this to replace the entire EVOLVE-BLOCK."
          }
new_skills:
  - name: exploration-strategy
    description: "Exploration over exploitation: Try completely new function families rather than incremental step-function edits."
    body: "# Exploration Strategy for C2 Optimization

## Why Diversity Matters
The seed uses sophisticated step functions achieving 0.89628. To beat this, we need **orthogonal search directions** - fundamentally different mathematical constructions.

## Experiment Families

### 1. Spline Functions
- **Idea**: Replace discontinuous steps with smooth cubic splines
- **Implementation**: Use scipy.interpolate.CubicSpline
- **Advantage**: Smoother convolution, less oscillation
- **Try**: 8-12 control points, optimize positions and heights

### 2. Fourier-Based Construction
- **Idea**: Optimize in Fourier space, transform back
- **Implementation**: Modify FFT convolution with coefficient optimization
- **Advantage**: Exploits spectral properties of optimal functions
- **Try**: 10-20 Fourier modes with positivity constraints

### 3. Gaussian Mixtures
- **Idea**: f(x) = Σ w_i * N(x; μ_i, σ_i)
- **Implementation**: Parametric mixture model
- **Advantage**: Smooth, analytically tractable, positive by construction
- **Try**: 5-12 components, optimize all parameters

### 4. Piecewise Polynomials
- **Idea**: Quadratic/cubic segments instead of constants
- **Implementation**: Define breakpoints, fit polynomials per segment
- **Advantage**: More flexible than steps, smoother than raw polynomials
- **Try**: 2nd or 3rd degree, 6-10 pieces

## Execution Protocol
1. Generate a complete function family (use generate_function_family tool)
2. Implement the full EVOLVE-BLOCK from scratch
3. Evaluate (costs ~1 eval)
4. If c2 > 0.89628, try to refine (add 2-3 more parameters)
5. If no improvement in 2 tries, abandon and try new family

## Avoid These Pitfalls
- Don't tweak step heights by 0.01 - trivial edits won't beat 0.89628
- Don't run the same family twice without modification
- Don't exceed 30% time per experiment (abort and retry)"
new_middlewares:
  - name: explore_warning
    hook: before_model
    description: "Warn against incremental edits when diverse exploration is needed."
    implementation_py: |
      def before_model(hook_input):
          current_score = hook_input.get("best_score", 0.0)
          if current_score <= 1.0:  # Haven't beaten seed's normalized score
              return "⚠️ SCORE NOT YET ABOVE BASELINE (1.03431). STOP making incremental edits. You need a COMPLETELY new function family: try splines, Fourier optimization, or Gaussian mixtures. The seed's step functions are optimal - beat them with orthogonal mathematical structures."
          return None
