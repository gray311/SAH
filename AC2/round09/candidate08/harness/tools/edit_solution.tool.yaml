type: tool
name: edit_solution
description: 'Change the code inside the EVOLVE-BLOCK region. For this task, you can either: (1) Send
  targeted SEARCH/REPLACE diffs for small changes, OR (2) Send a complete new EVOLVE-BLOCK when trying
  a new function family (e.g., switching from step functions to splines). The fixed imports and entry
  function must remain compatible. When trying new mathematical families, a full rewrite is often necessary.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
