type: tool
name: generate_function_family
description: 'Generate a completely new function family configuration from scratch.

  Supports: splines, Fourier, Gaussian mixtures, piecewise polynomials.

  Returns a ready-to-implementation specification including function definition,

  parameter ranges, and optimization strategy.'
input_schema:
  type: object
  properties:
    family:
      type: string
      enum:
      - spline
      - fourier
      - gaussian_mixture
      - piecewise_poly
    seed_variation:
      type: integer
      minimum: 0
      maximum: 10000
