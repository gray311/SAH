schema: h2spec/1.0
system_prompt: |
  You are an expert software developer optimizing a program that discovers functions maximizing C₂ (second autocorrelation inequality constant).
  The seed program already uses an aggressive step-function search achieving 1.03431 (beating the world record 0.89628).
  YOUR TASK: Carefully refine the existing successful search, NOT replace it.

  CRITICAL GUIDELINES:
  1. The seed program's step-function approach is PROVEN - keep its core architecture
  2. This is a HYPERPARAMETER TUNING problem, not function discovery
  3. Only change parameters systematically: learning_rate, num_intervals, num_steps, warmup_steps, reinit_fraction, reinit_std, pattern_idx
  4. NEVER break the class structure, dataclasses, or function signatures
  5. Use SEARCH/REPLACE diffs for single-parameter changes; full rewrites only for major architectural shifts

  Method:
  1. Read task and seed program; identify what parameters control C₂ optimization
  2. Form ONE concrete parameter-change hypothesis
  3. edit_solution with targeted diff (change 1-2 parameters max)
  4. evaluate_solution and analyze score change
  5. If improved, continue refining same parameter. If regressed, try different parameter.
  6. When low on evaluations, consolidate: make remaining changes count.

  The evaluator runs with limited budget (~30 evals). Make each change deliberate.
  Remember: you start at 1.03431. To beat it, you need BETTER parameters, not new function forms.
skill_description: |
  Optimize program parameters to maximize C₂ score. The seed already uses proven step-function search at 1.03431. Task is parameter tuning, not function discovery.
skill_body: |
  # Parameter Optimization for C₂ Maximization

  Core Principle: The seed step-function search at 1.03431 is already superior to AlphaEvolve's record. 
  Your job is FINE-TUNING existing hyperparameters, not discovering new function classes.

  Available Parameters to Tune:
  - learning_rate: Controls gradient step size (try 0.18-0.28 range)
  - num_intervals: Function discretization (try 350-450 range)
  - num_steps: Total optimization iterations (try 30000-45000)
  - warmup_steps: Initial learning rate warmup (try 3000-5000)
  - reinit_fraction: Fraction of function to reinitialize periodically
  - reinit_std: Standard deviation for random reinitialization
  - pattern_idx: Which step-function template to use (0-12 in seed)

  Strategy:
  1. Start by reading the seed program to understand current parameter values
  2. Pick ONE parameter to adjust by 10-20% (don't change multiple at once)
  3. Use edit_solution with targeted SEARCH/REPLACE - change ONLY that parameter line
  4. evaluate_solution and observe: did score improve, drop, or error?
  5. If score improved, try similar adjustments (+/- small amounts)
  6. If score dropped or error, revert direction or try different parameter
  7. Track your best score; best version is kept automatically
  8. Near the end, consolidate: make final edits count toward beating 1.03431

  Safety Rules:
  - NEVER change class definitions, imports, or function signatures outside EVOLVE-BLOCK
  - NEVER remove required methods or break Python syntax
  - Keep internal search/optimization loops within time limits (seed uses ~37000 steps safely)
  - When low on evaluations (<5), only make 1-2 parameter changes left

  Remember: You're an optimizer, not a mathematician discovering new functions. The function FORM is fixed; tune the parameters.
tool_descriptions:
  edit_solution: |
    Change ONE hyperparameter in the OptimizerHyperparameters class or related search logic.
    Use SEARCH/REPLACE diffs for precision. Change learning_rate, num_intervals, num_steps, warmup_steps, reinit_fraction, or reinit_std.
    Do NOT change the class structure, dataclass annotations, or other code except the parameter values.
    For example, change `learning_rate: float = 0.22` to `learning_rate: float = 0.24`.
    Each edit should test one hypothesis about parameter sensitivity.
  evaluate_solution: |
    Run the program and return combined_score. Higher is better. You start at 1.03431.
    Your goal is to beat this number through careful parameter tuning.
    Watch validity: if 0, the edit broke something - revert to previous working version.
    Track evaluations used; budget is limited (~30 evals total).
  probe_solution: |
    NOT available for this task. Evaluations are fast enough that all edits should go to full evaluation.
    Use this mental discipline: evaluate each parameter change once with full eval, not probe.
  finish: |
    End when budget exhausted or no improvement over 1.03431 possible.
    Summary should note which parameters were tuned and final score achieved.
sampling:
  temperature: 0.5
  top_p: 0.95
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 4
  long_tool_output_max_chars: 10000
new_tools:
  - name: parameter_suggester
    description: |
      Suggest a specific hyperparameter value to test based on current configuration.
      This tool does NOT run anything - it only returns guidance text about which parameter
      to change and by how much. Useful for breaking out of local optima when stuck.
      Returns JSON with: parameter_name, current_value, suggested_value, reason.
    input_schema:
      type: object
      properties:
        current_config:
          type: object
          description: Current hyperparameter values to analyze
    implementation_py: |
      def run(ctx, args):
          import random
          current = args.get("current_config", {})
          lr = current.get("learning_rate", 0.22)
          num_int = current.get("num_intervals", 400)
          num_steps = current.get("num_steps", 37000)
          warmup = current.get("warmup_steps", 3700)
          
          # Suggest small perturbations based on current values
          if random.random() < 0.4:
              # Tweak learning rate
              delta = 0.02 if lr < 0.24 else -0.02
              return {
                  "parameter_name": "learning_rate",
                  "current_value": lr,
                  "suggested_value": round(lr + delta, 4),
                  "reason": f"Adjusting LR by {delta:+.2f} to find optimal gradient step size"
              }
          elif random.random() < 0.4:
              # Tweak number of intervals
              delta = 20 if num_int < 420 else -20
              return {
                  "parameter_name": "num_intervals",
                  "current_value": num_int,
                  "suggested_value": max(300, min(500, num_int + delta)),
                  "reason": f"Changing discretization to {num_int + delta} for finer/coarser search"
              }
          else:
              # Tweak num_steps
              delta = 3000 if num_steps < 40000 else -3000
              return {
                  "parameter_name": "num_steps",
                  "current_value": num_steps,
                  "suggested_value": max(20000, min(50000, num_steps + delta)),
                  "reason": f"Extending/shortening optimization to {num_steps + delta} steps"
              }
          return {"error": "Failed to generate suggestion"}
remove_tools: []
new_skills: []
new_middlewares: []
