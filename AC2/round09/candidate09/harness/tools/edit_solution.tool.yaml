type: tool
name: edit_solution
description: 'Change ONE hyperparameter in the OptimizerHyperparameters class or related search logic.

  Use SEARCH/REPLACE diffs for precision. Change learning_rate, num_intervals, num_steps, warmup_steps,
  reinit_fraction, or reinit_std.

  Do NOT change the class structure, dataclass annotations, or other code except the parameter values.

  For example, change `learning_rate: float = 0.22` to `learning_rate: float = 0.24`.

  Each edit should test one hypothesis about parameter sensitivity.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
