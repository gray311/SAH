type: tool
name: parameter_suggester
description: 'Suggest a specific hyperparameter value to test based on current configuration.

  This tool does NOT run anything - it only returns guidance text about which parameter

  to change and by how much. Useful for breaking out of local optima when stuck.

  Returns JSON with: parameter_name, current_value, suggested_value, reason.'
input_schema:
  type: object
  properties:
    current_config:
      type: object
      description: Current hyperparameter values to analyze
