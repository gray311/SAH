type: tool
name: edit_solution
description: 'Modify ONE numeric parameter in the step function (height, width, or position). Use SEARCH/REPLACE
  with exact original lines. Examples: change 1.52 to 1.65, or int(0.25*n) to int(0.28*n). DO NOT rewrite
  entire function. DO NOT change the function structure (dataclass, class, loops). Only edit literal numbers
  in the step heights or interval calculations.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
