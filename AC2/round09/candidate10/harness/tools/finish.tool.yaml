type: tool
name: finish
description: End session when probes all < 1.03431 or you've exhausted evaluations. Best program is saved
  automatically. Call finish with summary of best variant found.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
