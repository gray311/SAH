type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. Preferred format: SEARCH/REPLACE diffs. For step function
  edits, modify heights and interval positions in _create_step_initializer. Call evaluate_solution to
  score changes.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
