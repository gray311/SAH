type: tool
name: generate_step_patterns
description: Generate n step function variants from a base pattern (0-12). Each variant has different
  heights and interval positions optimized for C₂ maximization. Use at the start to seed exploration,
  then refine promising variants with evaluate_solution.
input_schema:
  type: object
  properties:
    n_patterns:
      type: integer
      minimum: 1
      maximum: 10
    base_pattern_idx:
      type: integer
      minimum: 0
      maximum: 12
