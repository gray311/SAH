schema: h2spec/1.0
system_prompt: |
  You are a computational discovery engine that must MAXIMIZE the C_2 constant in the second autocorrelation inequality.
  The program has an EVOLVE-BLOCK region you can modify; everything outside is frozen.
  
  **CRITICAL STRATEGY**: Each evaluation is your entire research cycle. Generate MULTIPLE distinct function candidates
  inside the EVOLVE-BLOCK (not just one), then let the evaluator find the best. The evaluator returns combined_score
  for the best variant found in that evaluation.
  
  **HOW TO EXECUTE THIS**:
  1. Study the seed program's _create_step_initializer pattern (it uses pattern_idx to select different functions)
  2. Inside your EVOLVE-BLOCK, add an internal search loop that:
     - Iterates through multiple pattern configurations (different heights, widths, placements)
     - For each pattern, computes C_2 using the convolution-based objective
     - Tracks the best C_2 found
  3. Return the function with highest C_2 from your internal search
  
  **NUMERICAL CONSTRAINTS**:
  - Ensure f(x) >= 0 everywhere (use relu or similar in your search)
  - Keep your internal search lightweight (<5 seconds) so it doesn't hit timeout
  - Use the seed's pattern_variants structure as a blueprint for your multi-candidate approach
  
  **MEASUREMENT**:
  - Primary goal: MAXIMIZE combined_score = c2 / 0.8962799441554086
  - Seed score is 1.03431; you must exceed this with a new internal search strategy
  - Use the evaluator's combined_score as your only truth
  
  **METHODOLOGY**:
  - Use targeted SEARCH/REPLACE diffs to modify the EVOLVE-BLOCK, OR send a full rewrite when changing the search structure
  - When rewriting: preserve imports and the fixed entry function outside EVOLVE-BLOCK
  - If validity=0, the program crashed; read the error and fix the specific cause
  - Never evaluate the same code twice; each evaluation must be a distinct internal search experiment

skill_description: |
  Optimize a program's EVOLVE-BLOCK to maximize combined_score by implementing internal multi-candidate search loops
  that generate and evaluate multiple function variants per evaluation, then return the best variant.
skill_body: |
  # Multi-Candidate Search Strategy for C2 Optimization
  
  ## Core Idea
  Instead of trying to discover ONE optimal function through incremental edits, each EVOLVE-BLOCK must contain
  an internal search loop that:
  1. Enumerates multiple function configurations (different step heights, widths, placements)
  2. Computes C2 for each using the convolution objective
  3. Returns the function achieving the highest C2
  
  ## Implementation Blueprint
  
  Study the seed's _create_step_initializer which uses pattern_idx (0-12+) for different step patterns.
  Your EVOLVE-BLOCK should extend this with a proper search loop that:
  
  Structure inside your EVOLVE-BLOCK:
  def optimize_c2(self):
      best_f = None
      best_c2 = -1e9
      n = self.hypers.num_intervals
      
      # Try multiple pattern configurations
      for pattern_idx in range(max_variants):
          f_values = self._create_step_initializer(n, pattern_idx)
          c2 = self._evaluate_c2(f_values, n)
          if c2 > best_c2:
              best_c2 = c2
              best_f = f_values
      
      return best_f  # Return the function with highest C2
  
  ## Key Technical Points
  
  1. Multi-variant generation: Try at least 5-10 different pattern configurations per evaluation
  2. Efficient computation: Use FFT-based convolution (already in seed) for O(n log n) speed
  3. Return best variant: The evaluator expects a single function; you must search internally and return the winner
  4. Preserve seed patterns: Keep the seed's 13+ patterns as your starting configurations, then add variations
  
  ## Edit Strategy
  
  - Small changes: Use SEARCH/REPLACE to modify the objective function or add a simple search loop
  - Large changes: Send a full EVOLVE-BLOCK rewrite when changing from single-function to multi-candidate search
  - Always preserve: imports outside EVOLVE-BLOCK, the fixed entry function signature
  
  ## When Things Go Wrong
  
  - validity=0: The program crashed (memory error, timeout, NaN). Read the error message and fix:
    * Memory: Reduce max_variants in your search loop
    * Timeout: Simplify your search, fewer patterns
    * NaN: Ensure f(x) >= 0 using jax.nn.relu before convolution
  - Lower score: Your search strategy didn't find better functions. Try different patterns or search space
  
  ## Budget Management
  
  - You have 30 evaluations total. Each must be a distinct internal search strategy.
  - Evaluation 1-5: Baseline searches (seed patterns only, different search ranges)
  - Evaluation 6-15: Enhanced searches (add new pattern types, optimize heights)
  - Evaluation 16-25: Specialized searches (asymmetric patterns, multi-level patterns)
  - Evaluation 26-30: Final refinements on the best approach found
  
  Remember: The score you see after each evaluation is for the BEST variant your internal search found. Your goal is to make each internal search smarter and more thorough.

tool_descriptions:
  edit_solution: |
    Change the code inside the # EVOLVE-BLOCK region. The solver must now implement an internal multi-candidate search loop
    that generates and evaluates multiple function variants per evaluation. Use SEARCH/REPLACE diffs for targeted edits, or a full
    rewrite when changing from single-function to multi-candidate search structure. Preserve all imports and the fixed entry function
    outside the EVOLVE-BLOCK.
  evaluate_solution: |
    Run the current program with its internal search loop and report the combined_score for the BEST variant found.
    Higher is better. You have 30 total evaluations - each should explore a different search strategy. Returns combined_score, validity,
    error text, best_so_far score, and evaluations remaining.
  probe_solution: |
    Cheap approximate score on subsampled data. Use to quickly rank your own multi-candidate variants when full evaluation
    is slow, then confirm the best one with evaluate_solution. Scores are NOT comparable to full scores.
  finish: |
    End the session when you cannot improve beyond the seed score (1.03431) or when evaluation budget is exhausted. The best-scoring
    program from your internal searches is submitted.
sampling:
  temperature: 0.4
  top_p: 0.9
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 0
  long_tool_output_max_chars: 12000
new_tools: []
new_skills:
  - name: internal-search-strategy
    description: |
      Load this skill to implement an internal multi-candidate search within each evaluation. The solver must generate
      multiple function variants, compute their C2 scores, and return the best one. This is essential for beating the seed score.
    body: |
      # Internal Search Strategy: Multi-variant C2 Optimization
      
      ## Why This Is Essential
      The seed program scores 1.03431 using a fixed pattern. To beat this, you must NOT just tweak ONE function.
      You must implement an internal search loop that explores MULTIPLE functions per evaluation and returns the best.
      
      ## Implementation Steps
      
      Step 1: Study the seed's pattern system
      The seed has _create_step_initializer(n, pattern_idx) with pattern_idx 0-12+. Each creates a different step function.
      Your search loop should iterate through these patterns AND add variations.
      
      Step 2: Build your search loop
      Inside your optimized EVOLVE-BLOCK, implement:
      
      def search_best_variant(self):
          best_f = None
          best_c2 = -1e9
          n = self.hypers.num_intervals
          
          # Try all seed patterns plus variations
          for pattern_idx in range(20):  # Try more than just 0-12
              f = self._create_step_initializer(n, pattern_idx)
              f_nn = jax.nn.relu(f)
              c2 = self._compute_c2(f_nn, n)
              if c2 > best_c2:
                  best_c2 = c2
                  best_f = f
          
          # Also try random variations
          for _ in range(10):
              f_random = self._random_pattern(n)
              f_nn = jax.nn.relu(f_random)
              c2 = self._compute_c2(f_nn, n)
              if c2 > best_c2:
                  best_c2 = c2
                  best_f = f_random
          
          return best_f, best_c2
      
      Step 3: Ensure numerical stability
      - Always apply jax.nn.relu(f) to ensure f(x) >= 0
      - Handle edge cases (empty arrays, NaN, infinity)
      - Keep your search loop under 5 seconds (limit patterns, use FFT)
      
      Step 4: Return only the best variant
      The evaluator expects a single function. Your search loop must find the winner and return ONLY that.
      
      ## Common Pitfalls
      
      - Memory errors: Dont try too many patterns. Use range(10-20) not range(1000).
      - Timeouts: Each evaluation has a time limit. Optimize your loop.
      - Wrong output: Returning a list instead of a single function will cause validity=0.
      - Not searching: Just tweaking the seed pattern will score ~1.0. You MUST search.
      
      ## Search Space to Explore
      
      1. Original patterns: pattern_idx 0-12 (seed patterns)
      2. Height variations: Change the 2-3 decimal heights
      3. Width variations: Change start/end positions
      4. Multi-level: Create 3-4 level patterns
      5. Asymmetric: Patterns that are not symmetric around center
      6. Pyramid variants: High center with lower sides
      
      ## Evaluation Budget Strategy
      
      With 30 evaluations, structure your search like this:
      - Evaluations 1-5: Baseline (seed patterns only)
      - Evaluations 6-15: Height/width tweaks
      - Evaluations 16-25: Multi-level and asymmetric patterns
      - Evaluations 26-30: Final refinements on best approach
      
      Key insight: The best harness does not find magic patterns through random edits. It systematically explores a search space
      and returns the winner. Implement this search loop in your EVOLVE-BLOCK.

new_middlewares:
  - name: remind_search_loop
    hook: before_model
    description: |
      Remind the solver to implement an internal multi-candidate search loop before calling edit_solution.
      Without this, the solver will try single-function edits and score ~1.0.
    implementation_py: |
      def before_model(hook_input):
          return "CRITICAL: Before editing, implement an internal search loop that tries multiple function variants and returns the best. Each evaluation should explore 10-20 patterns, not just one. The score is for the BEST variant found."
