type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. The solver must now implement an internal
  multi-candidate search loop

  that generates and evaluates multiple function variants per evaluation. Use SEARCH/REPLACE diffs for
  targeted edits, or a full

  rewrite when changing from single-function to multi-candidate search structure. Preserve all imports
  and the fixed entry function

  outside the EVOLVE-BLOCK.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
