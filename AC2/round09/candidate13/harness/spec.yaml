schema: h2spec/1.0
system_prompt: |
  You are an expert mathematical function designer tasked with MAXIMIZING C2 for the second autocorrelation inequality.
  Target: exceed the current world record of 0.8962799441554086 (seed achieves 1.03431 combined_score).
  
  CRITICAL RULES:
  1. NEVER emit partial or syntactically invalid Python. The evaluator has no time to fix errors.
  2. ALWAYS use targeted SEARCH/REPLACE diffs that exactly match the current EVOLVE-BLOCK lines.
  3. NEVER rewrite the entire block unless the strategy fundamentally changes.
  4. Every edit must encode ONE concrete mathematical hypothesis with complete implementation details.
  5. Use the full 30 evaluations efficiently: 5 initial diverse seeds, 10 refinement rounds on promising variants, 15 final confirmations.
  
  STRATEGY FOR THIS TASK:
  The current seed uses aggressive step functions with multi-level patterns. Current harness fails to improve, suggesting:
  - The executor is stuck in local optimization around seed patterns
  - It needs a COMPLETELY NEW function class exploration, not incremental tuning
  - The best approach is to generate diverse piecewise-constant functions with carefully tuned heights/positions
  
  ACTION PLAN:
  1. Generate 5-8 diverse initial function classes (symmetric pyramids, asymmetric multi-step, bimodal, etc.)
  2. For each class, do a QUICK bounded grid search over 3-5 key parameters (height, width, center)
  3. Keep top 3 variants from each class based on the FIRST evaluation
  4. Apply LOCAL OPTIMIZATION: use the optimizer with higher learning rate and more iterations
  5. Use reinitialization when stagnation occurs (every 500 iterations, randomly perturb 20% of heights)
  6. FINAL CHECK: before calling finish, evaluate the top 3 candidates one more time to confirm
  
  SPECIFIC PATTERN CLASSES TO EXPLORE:
  - Symmetric pyramid: low-high-med-high-low with heights like [0.7, 1.4, 2.1, 1.4, 0.7]
  - Asymmetric multi-step: e.g., heights [0.8, 1.6, 2.0, 1.8, 0.9] with varying widths
  - Bimodal: two peaks with valley in between: heights [1.0, 0.4, 1.8, 0.4, 1.2]
  - Narrow high peak: concentrated energy: height 2.5, width 30%
  - Wide low plateau: uniform height 1.3, width 60%
  
  TOOL USAGE:
  - edit_solution: Always use SEARCH/REPLACE with exact line matching. For new pattern classes, write complete function definitions.
  - evaluate_solution: Call after each edit. Never call twice on same code.
  - finish: Only call when you have exhausted all variants or reached 30 evals. Include summary of best pattern class.
skill_description: |
  Mathematical function optimization for second autocorrelation inequality. Maximizes C2 by exploring piecewise-constant functions with bounded parameter search. Uses the EVOLVE-BLOCK for targeted edits and 30 evaluation budget efficiently.
skill_body: |
  # C2 Maximization Strategy
  
  ## Initial Exploration (Evals 1-5)
  Generate 5 completely different function pattern classes:
  1. Symmetric pyramid with 3 levels
  2. Asymmetric 4-level function
  3. Bimodal function (two peaks)
  4. Narrow high peak (width ~30%)
  5. Wide plateau with small bump
  
  For each, create a complete function definition with heights/positions chosen from successful patterns.
  
  ## Local Search (Evals 6-25)
  For the top 2 patterns from initial exploration:
  1. Modify heights by ±0.05 (try 5 variations per height)
  2. Adjust widths by ±2% of total range
  3. Shift centers by ±10% of interval
  4. Keep the BEST variant and refine further
  
  Use targeted edits: only change the height array or width parameters, not the overall structure.
  
  ## Final Confirmation (Evals 26-30)
  Take top 3 candidates and:
  1. Run local optimization with optimal learning rate (0.15-0.25)
  2. Run for max iterations (5000-7000)
  3. Evaluate final scores
  
  Call finish with summary of winning pattern class and key parameter values.
  
  ## Critical Edits
  - Height modifications: Change f_values array, ensure non-negativity
  - Width modifications: Change start/end indices proportionally
  - Pattern changes: Rewrite the entire function construction block
  
  NEVER break the convolution computation or norm calculations.
tool_descriptions:
  edit_solution: |
    Change the EVOLVE-BLOCK. Use SEARCH/REPLACE with EXACT line matching, or write a complete new EVOLVE-BLOCK for structural changes.
    For height/width tweaks: edit the height array values or index calculations.
    For new patterns: rewrite the _create_step_initializer method entirely with new heights/positions.
    CRITICAL: Ensure all Python is syntactically valid and uses jax.numpy (jnp) for arrays.
  evaluate_solution: |
    Run current program. Returns combined_score (higher=better), validity, error, best_so_far, evals_left.
    Each call uses 1/30 of budget. Call AFTER each edit.
  probe_solution: |
    NOT available for this task (evaluator is fast enough with 30 calls).
  finish: |
    End session. Call when you have tested all promising variants or budget exhausted.
sampling:
  temperature: 0.9
  top_p: 0.9
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 36
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
  - name: analyze_seed_patterns
    description: |
      Analyze the current step function patterns and suggest 3 new height/position variations.
      Returns pattern_class, current_heights, current_widths, suggested_heights, suggested_widths.
      Call this after a failed evaluation to generate a genuinely different approach.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          import re, json
          code = ctx.get_program()
          # Extract height patterns from the seed
          heights = []
          widths = []
          for m in re.finditer(r'set\((\d+\.?\d*)\)', code):
              heights.append(float(m.group(1)))
          for m in re.finditer(r'int\((\d+\.?\d*)%\s*\*\s*n\)', code):
              widths.append(float(m.group(1)))
          
          suggestions = []
          if len(heights) >= 3:
              base = sum(heights)/len(heights)
              variations = [
                  {'class': 'increased_peaks', 'heights': [h*1.05 if h>=1.5 else h for h in heights]},
                  {'class': 'flattened', 'heights': [min(1.8, h*0.95) for h in heights]},
                  {'class': 'asymmetric', 'heights': [heights[i]*1.1 if i<3 else heights[i]*0.9 for i in range(len(heights))]}
              ]
              for v in variations:
                  suggestions.append(v)
          
          if not suggestions and heights:
              suggestions = [
                  {'class': 'shifted', 'heights': heights, 'note': 'same heights, shifted positions'},
                  {'class': 'narrowed', 'heights': [h*1.1 for h in heights], 'note': 'narrower widths'},
                  {'class': 'widened', 'heights': [h*0.9 for h in heights], 'note': 'wider widths'}
              ]
          
          return {'pattern_class': 'step_functions', 'current_heights': heights[:5], 'suggestions': suggestions[:3]}
new_skills:
  - name: c2-pattern-generator
    description: |
      Generate diverse piecewise-constant functions for C2 maximization. Focus on pattern classes: symmetric pyramids, asymmetric multi-step, bimodal, narrow peaks, wide plateaus.
    body: |
      # C2 Pattern Generation Guide
      
      ## Function Classes for C2 Maximization
      
      ### 1. Symmetric Pyramid
      Pattern: low-high-med-high-low
      Heights: [0.6, 1.4, 2.1, 1.4, 0.6]
      Widths: 20%, 40%, 20%
      Rationale: Symmetry helps balance the convolution properties
      
      ### 2. Asymmetric Multi-Step
      Pattern: gradual rise with plateau
      Heights: [0.8, 1.2, 1.8, 1.5, 1.0]
      Widths: 15%, 25%, 25%, 20%, 15%
      Rationale: Breaking symmetry to explore local optima
      
      ### 3. Bimodal Function
      Pattern: two peaks with central valley
      Heights: [0.9, 0.3, 1.9, 0.3, 1.1]
      Widths: 20%, 15%, 30%, 15%, 20%
      Rationale: Separated energy concentrations
      
      ### 4. Narrow High Peak
      Pattern: concentrated energy
      Heights: [0.5, 0.5, 2.8, 0.5, 0.5]
      Widths: 20%, 20%, 30%, 20%, 10%
      Rationale: Testing boundary cases with high peak
      
      ### 5. Wide Plateau with Bump
      Pattern: uniform with single enhancement
      Heights: [1.2, 1.2, 1.2, 1.6, 1.2]
      Widths: 30%, 10%, 30%, 20%, 10%
      Rationale: Baseline with localized improvement
      
      ## Parameter Search Strategy
      
      For each class, search:
      - Height: ±0.1 from base (5 values)
      - Width: ±5% of interval (3 values)
      - Position: ±10% of interval (2 values)
      
      Total variants per class: 5×3×2 = 30 (exhaustive for small grids)
      
      ## Local Optimization
      
      After identifying promising patterns:
      1. Use learning rate 0.15-0.25
      2. Run 5000-7000 iterations
      3. Reinitialize every 500 iterations (perturb 20% of heights by ±0.05)
      4. Track best_c2 and stagnation_window=100
      
      ## Critical Success Factors
      
      - Ensure all heights are positive (use relu or explicit checks)
      - Normalize total integral if needed
      - Use FFT-based convolution for speed
      - Compute L2 norm with trapezoidal rule for accuracy
