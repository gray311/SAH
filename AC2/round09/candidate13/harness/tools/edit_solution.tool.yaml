type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK. Use SEARCH/REPLACE with EXACT line matching, or write a complete
  new EVOLVE-BLOCK for structural changes.

  For height/width tweaks: edit the height array values or index calculations.

  For new patterns: rewrite the _create_step_initializer method entirely with new heights/positions.

  CRITICAL: Ensure all Python is syntactically valid and uses jax.numpy (jnp) for arrays.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
