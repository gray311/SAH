type: tool
name: edit_solution
description: 'Replace the EVOLVE-BLOCK with a COMPLETE new step function pattern design. For small changes,
  use targeted SEARCH/REPLACE modifying heights, widths, or positions. For major improvements, rewrite
  the entire pattern structure.

  Example: Change heights from [1.42] to [1.52], or add a second peak, or reduce intervals from 400 to
  200.

  ALWAYS ensure valid Python syntax and preserve the class structure.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
