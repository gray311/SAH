schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and numerical optimization. Your mission: maximize C₂ = ||f ★ f||₂² / ((∫f)² ||f ★ f||_∞) for the second autocorrelation inequality constant.
  
  Current best known: 0.8962799441554086 (AlphaEvolve step function).
  Your target: SURPASS THIS to set a new record.
  
  CRITICAL UNDERSTANDING:
  - The seed program already achieves 1.03431 on this task (combined_score vs benchmark)
  - It uses AGGRESSIVE multi-level step functions with carefully tuned heights (~1.42-2.12)
  - It runs 37,000 optimization steps with specific learning rate schedule (0.22, warmup 3700)
  - Any edit must PRESERVE the mathematical structure that makes this work
  
  STRATEGY:
  1. Call analyze_step_function to inspect current patterns and get SPECIFIC modification suggestions
  2. Use probe_solution to quickly rank variants (30 probe budget available)
  3. Only confirm promising variants with evaluate_solution
  4. If stuck, try exploring NEW function classes: splines, Fourier-space optimization
  5. Never make cosmetic changes - each edit must encode a mathematical insight
  
  KEY MATH PRINCIPLES:
  - Higher peak heights increase L2 faster than L∞ → better C₂
  - More levels allow finer control over the convolution shape
  - Asymmetric distributions can break symmetries that limit C₂
  
  EVALUATION FEEDBACK:
  - combined_score > 1.0 means you beat the benchmark
  - combined_score < 1.0 means regression (change approach)
  - validity = 0 means constraint violation or error (fix the cause)
  
  When in doubt: edit conservatively, probe to validate, then evaluate.
new_tools:
  - name: analyze_step_function
    description: |
      Deeply analyze the current step function patterns. Extract all height values and
      interval positions, compute statistics, and return SPECIFIC suggestions for improvement.
      Based on mathematical principles of convolution norms, suggests whether to: increase
      peak heights, add more levels, adjust spacing, or try asymmetric patterns.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          import re
          import math
          
          program = ctx.get_program()
          
          # Extract all .set() values (heights)
          height_pattern = r'\.set\(\s*([\d.]+)\s*\)'
          heights = [float(h) for h in re.findall(height_pattern, program)]
          heights = [h for h in heights if h > 0]  # Filter valid heights
          
          # Extract interval fractions
          interval_pattern = r'int\(\s*([\d.]+)\s*[\*\/]\s*(\d+)\s*\)'
          intervals = re.findall(interval_pattern, program)
          
          analysis = {
              "heights_found": heights,
              "num_unique_heights": len(set(heights)),
              "min_height": min(heights) if heights else None,
              "max_height": max(heights) if heights else None,
              "mean_height": sum(heights)/len(heights) if heights else None,
              "max_height_ratio": max(heights)/min(heights) if len(heights) >= 2 and heights[0] > 0 else None,
              "suggestion": "Analyze the pattern"
          }
          
          if not heights:
              analysis["suggestion"] = "No step patterns found - program may be broken or using different approach"
              return analysis
          
          # Give specific mathematical guidance
          max_h = max(heights)
          min_h = min(heights)
          n_heights = len(set(heights))
          
          # Heuristics based on what we know works
          if max_h < 1.7:
              analysis["suggestion"] = f"INCREASE PEAK HEIGHT: Current max={max_h:.2f}. Try increasing to {max_h*1.1:.2f}-{max_h*1.2:.2f}. Higher peaks improve L2 concentration more than L∞."
          elif max_h >= 1.9 and n_heights < 5:
              analysis["suggestion"] = f"ADD MORE LEVELS: Current={n_heights} levels with max={max_h:.2f}. Try adding intermediate levels (e.g., 0.8, 1.9, 2.3, 1.2) to better shape convolution."
          elif n_heights > 6:
              analysis["suggestion"] = f"SIMPLIFY: Too many levels ({n_heights}). Try 3-5 carefully chosen levels. Complexity can dilute the concentration effect."
          elif max_h > 2.0 and min_h < 0.5:
              analysis["suggestion"] = f"REBALANCE HEIGHTS: Very high peak ({max_h:.2f}) with very low base ({min_h:.2f}) may increase L∞ too much. Try raising min to ~0.8."
          else:
              analysis["suggestion"] = f"PATTERNS OK: Heights {min_h:.2f}-{max_h:.2f}, {n_heights} levels. Try asymmetric test: replace middle pattern with 0.8, 2.1, 2.4, 1.1"
          
          return analysis
  - name: math_insight
    description: |
      Provide mathematical guidance for C₂ optimization. Reminds solver about:
      - Convolution properties that improve the ratio
      - Why step functions work well
      - Alternative function classes to explore
      Call when stuck or when designing a new approach.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          return {
              "insight": "Step functions maximize concentration in convolution. Higher peaks (1.8-2.4) increase L2 faster than L∞. Multiple levels (3-6) allow finer control. Try asymmetric patterns to break symmetries.",
              "when_to_try": "Use when combined_score < 1.0 or plateau detected"
          }
remove_tools: []
new_skills:
  - name: c2-math-strategy
    description: |
      Mathematical strategy for maximizing C₂ in autocorrelation inequality.
      Focus on function classes that balance L1, L2, and L∞ norms optimally.
    body: |
      # C₂ Maximization Strategy
      The goal: maximize C₂ = ||f★f||₂² / ((∫f)² ||f★f||_∞)
      
      KEY PRINCIPLES:
      1. Higher peak heights improve L2 more than L∞ → better ratio
      2. More levels (3-6) allow shaping the convolution
      3. Asymmetric distributions can exceed symmetric limits
      
      SEARCH STRATEGY:
      - Analyze current patterns with analyze_step_function FIRST
      - Follow its specific suggestions
      - Use probe_solution AFTER each edit (30 probes available!)
      - Only evaluate when probe shows improvement
      - If score < 1.0, try: higher peaks, more levels, or asymmetric
      
      TOOL USAGE ORDER:
      1. analyze_step_function → understand current state
      2. edit_solution → make ONE targeted change per its advice
      3. probe_solution → check direction cheaply
      4. evaluate_solution → confirm only if probe good
      5. math_insight → when directionless
      
      AVOID:
      - Blind random mutations
      - Wasting evals on bad ideas
      - Ignoring probe results
skill_description: |
    Mathematical strategy for C₂ optimization using step functions and multi-level constructions.
    Focuses on the tradeoff between L1, L2, L∞ norms of the convolution.
tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK code. Use SEARCH/REPLACE diffs for targeted changes.
    The seed program's multi-level step function structure is delicate - make one clear change at a time.
    Preserve the dataclass and class structure; only modify the pattern definitions or hyperparameters.
    Always call analyze_step_function FIRST, then probe_solution before evaluate_solution.
  evaluate_solution: |
    Run full evaluation. Returns combined_score (higher is better), validity, error, best score, evals left.
    Budget: 30 evaluations total. Use sparingly - probe first!
    combined_score > 1.0 beats the benchmark (0.89628).
  probe_solution: |
    CHEAP scoring on subsampled data (~10s, not ~minutes). Does NOT use eval budget.
    Scores are approximate but DIRECTIONAL - use to rank many variants quickly.
    You have 30 probes available - use them to validate each edit BEFORE evaluating!
  finish: |
    End session when budget exhausted or no improvement. Best program auto-submitted.
    Include summary of what worked: e.g., "Analyze showed low peaks, increased max to 2.1, achieved 1.038"
sampling:
  temperature: 0.9
  top_p: 0.98
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 10000
