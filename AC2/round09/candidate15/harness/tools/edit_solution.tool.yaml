type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK code. Use SEARCH/REPLACE diffs for targeted changes.

  The seed program''s multi-level step function structure is delicate - make one clear change at a time.

  Preserve the dataclass and class structure; only modify the pattern definitions or hyperparameters.

  Always call analyze_step_function FIRST, then probe_solution before evaluate_solution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
