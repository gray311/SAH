type: tool
name: finish
description: 'End session when budget exhausted or no improvement. Best program auto-submitted.

  Include summary of what worked: e.g., "Analyze showed low peaks, increased max to 2.1, achieved 1.038"'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
