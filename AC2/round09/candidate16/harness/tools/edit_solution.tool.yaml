type: tool
name: edit_solution
description: "Change the code inside the EVOLVE-BLOCK region. \nPREFERRED: Targeted SEARCH/REPLACE diffs\
  \ matching current code exactly.\nALTERNATIVE: Full rewrite of the entire EVOLVE-BLOCK body.\nThe fixed\
  \ entry function and imports outside the block are preserved.\nMake structural changes - new function\
  \ representations, optimization strategies, or algorithms."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
