schema: h2spec/1.0
system_prompt: 'You are an expert mathematical programmer optimizing step functions to maximize C2 = ||f★f||_2^2 / ((int f)^2 ||f★f||_infty) in the second autocorrelation inequality.

Current best: 1.03492 (combined_score). The seed uses 450-interval multi-level step functions with heights like 0.6-2.1.

CRITICAL INSIGHT: Small parameter tweaks have saturated the local optimum. You must explore STRUCTURALLY DIFFERENT pattern classes.

Strategy:

1. FIRST: Call generate_pattern_variants to systematically sample 50+ diverse step function patterns (single-peak, multi-peak, plateau, staircase, asymmetric, pyramid, etc.). This is your PRIMARY tool for search.

2. RANK via probe: Use probe_solution on the top 10 patterns to rank them cheaply.

3. EVALUATE: Only call evaluate_solution on the top 2-3 ranked patterns.

4. ITERATE: If eval improves, build on it with generate_pattern_variants. If not, try fundamentally different pattern families.

5. DIVERSITY: Systematically explore: (a) fewer wider steps, (b) more numerous narrow steps, (c) asymmetric designs, (d) plateau functions, (e) multi-peak configurations.

6. COMPLEXITY BUDGET: Start with 300-500 intervals. If stuck, try 600-800 intervals for finer resolution.

Key: PATTERNS > PARAMETERS. The best C2 comes from discovering new structural configurations, not tweaking heights of existing patterns.'
skill_description: 'Optimize C2 via STRUCTURAL pattern exploration. Call generate_pattern_variants to sample diverse step function architectures, rank via probe, evaluate top candidates.'
skill_body: '# C2 Step Function Optimization - Structural Pattern Search

Goal: Beat 1.03492 by discovering NEW pattern classes, not tweaking existing ones.

## Phase 1: Pattern Generation

1. Call generate_pattern_variants to generate 50-100 diverse patterns.
   - Request variety: single_peak, multi_peak, plateau, staircase, asymmetric, pyramid
   - Vary interval counts: 300, 450, 600, 800
   - Vary height ranges: try both high-peaks (1.5-2.5) and moderate-peaks (1.0-1.5)

2. Review the generated patterns. Note structural differences:
   - Number of level changes
   - Peak-to-base height ratio
   - Peak width (fraction of domain)
   - Symmetry/asymmetry

## Phase 2: Probing and Ranking

3. For the top 10 structurally different patterns:
   - Call probe_solution on each
   - Rank by probe score (higher is better)
   - This costs ~10 probes but saves evaluation budget

4. If probe scores are similar, still proceed to eval - small differences matter.

## Phase 3: Evaluation and Iteration

5. Evaluate the top 2-3 patterns from Phase 2.
   - Record the best full score
   - Note which pattern class won

6. If best score < 1.03492:
   - Regenerate patterns with MORE variety
   - Try different interval counts
   - Try completely different pattern families

7. If best score > 1.03492:
   - Run another generate_pattern_variants with the winning pattern as seed
   - Make focused mutations around the winner

## Pattern Classes to Explore

- Single Peak: One high plateau in the center
- Multi-Peak: 2-4 peaks of varying heights
- Plateau: Wide flat regions with transitions
- Staircase: Monotonic increase/decrease with steps
- Asymmetric: Different left/right asymmetries
- Pyramid: Triangular-like with rising/falling edges
- Winged: Central peak with side shoulders

## Key Principles

- STRUCTURE drives C2 more than exact heights
- Budget: 30 evals - spend wisely. 10 probes + 3 evals is ideal per iteration
- If 5 iterations with no improvement, try a COMPLETELY different approach
- Diversity is key - do not get stuck in one pattern family'
tool_descriptions:
  edit_solution: 'Change the EVOLVE-BLOCK step function. You can replace entire patterns or make SEARCH/REPLACE diffs. For best results, use generate_pattern_variants to create complete new patterns.'
  evaluate_solution: 'Run full evaluation. Returns combined_score. Budget: 30 evals total. Only evaluate patterns that ranked high in probing.'
  probe_solution: 'Quick approximate score on subsampled data. Use to rank multiple patterns cheaply. Scores are approximate but good for relative ranking.'
  finish: 'End when you have a score > 1.03492 or after exhausting the pattern search strategy with no improvement.'
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 15000
new_tools:
  - name: generate_pattern_variants
    description: 'Generate 50-100 diverse step function patterns with varying structures (single-peak, multi-peak, plateau, staircase, asymmetric, pyramid). Specify desired structural variety. Patterns use 300-800 intervals and heights in [0.5, 2.5]. Call at the START of search to explore the pattern space.'
    input_schema:
      type: object
      properties:
        variety:
          type: string
          description: 'Type of variety: diverse, focused_single_peak, multi_peak, plateau, asymmetric'
        num_patterns:
          type: integer
          minimum: 30
          maximum: 100
          default: 70
        min_intervals:
          type: integer
          minimum: 200
          maximum: 800
          default: 300
        max_intervals:
          type: integer
          minimum: 300
          maximum: 1000
          default: 800
    implementation_py: |
      def run(ctx, args):
          import random, re
          variety = args.get("variety", "diverse")
          num_patterns = args.get("num_patterns", 70)
          min_int = args.get("min_intervals", 300)
          max_int = args.get("max_intervals", 800)
          
          # Extract the seed program's pattern creation logic
          prog = ctx.get_program()
          if "# EVOLVE-BLOCK" not in prog:
              return {"note": "no evolve block", "patterns": []}
          
          # Pattern class definitions (pattern: (name, heights_list, starts_list, ends_list))
          pattern_defs = [
              ("single_peak", [1.5], [0.25], [0.75]),
              ("multi_3peak", [0.9, 1.8, 0.9], [0.15, 0.25], [0.25, 0.40, 0.70, 0.85]),
              ("plateau", [1.4], [0.20], [0.80]),
              ("staircase_4", [0.7, 1.2, 1.7, 1.0], [0.06, 0.20, 0.35, 0.64], [0.20, 0.35, 0.64, 0.94]),
              ("asymmetric_3", [0.8, 2.0, 0.8], [0.12, 0.28], [0.28, 0.50, 0.80, 0.88]),
              ("pyramid_5", [0.7, 1.5, 2.1, 1.5, 0.7], [0.06, 0.19, 0.40, 0.60, 0.80], [0.19, 0.40, 0.60, 0.80, 0.94]),
              ("winged", [0.8, 2.0, 0.8], [0.15, 0.30], [0.30, 0.50, 0.70, 0.85]),
              ("tall_narrow", [2.2], [0.22], [0.78]),
              ("bimodal", [1.0, 1.9, 1.0], [0.20, 0.40], [0.40, 0.55, 0.75, 0.80]),
          ]
          
          codes = []
          for _ in range(num_patterns):
              n_intervals = random.randint(min_int, max_int)
              choice_idx = random.randint(0, len(pattern_defs) - 1)
              name, heights, starts, ends = pattern_defs[choice_idx]
              
              # Build code to create this pattern using jax
              lines = ['# Pattern: {} (intervals: {})'.format(name, n_intervals)]
              lines.append('f = jnp.zeros({})'.format(n_intervals))
              for i, (start, end, h) in enumerate(zip(starts, ends, heights)):
                  s_idx = int(start * n_intervals)
                  e_idx = int(end * n_intervals)
                  lines.append('f = f.at[{}:{}.].set({:.2f})'.format(s_idx, e_idx, h))
              codes.append('\n'.join(lines))
          
          return {
              "num_patterns_generated": len(codes),
              "variety": variety,
              "patterns": codes,
              "note": "Copy pattern code into EVOLVE-BLOCK and run probe/evaluate on them."
          }
new_skills:
  - name: pattern-exploration-strategy
    description: 'Exploration strategy for C2 optimization. Generate diverse patterns, probe rank, evaluate top. Systematically explore pattern space.'
    body: |
      # Pattern Exploration Strategy for C2 Optimization

      ## Overview
      Goal: Beat 1.03492 by discovering NEW step function structures.
      Small parameter tweaks will not work - we need STRUCTURAL diversity.

      ## Phase 1: Generate Pattern Library

      1. Call generate_pattern_variants with variety="diverse"
         - Generates 50-100 patterns across all major pattern classes
         - Patterns vary in: number of levels, peak shapes, symmetry, interval count

      2. Review the output patterns
         - Note: peak positions, heights, widths
         - Identify structurally distinct patterns

      ## Phase 2: Probe-Based Ranking

      3. Extract top patterns by visual inspection or diversity criteria
         - Pick patterns that look structurally different
         - Do not pick too many similar patterns

      4. Probe the candidates:
         - For each candidate, copy its code structure to EVOLVE-BLOCK
         - Call probe_solution
         - Record probe scores

      5. Rank and filter:
         - Sort by probe score (descending)
         - Keep top 5-10 for evaluation
         - If scores are close, still keep them - small differences matter

      ## Phase 3: Full Evaluation

      6. Evaluate top patterns:
         - Replace each top pattern sequentially in EVOLVE-BLOCK
         - Call evaluate_solution
         - Track which pattern gives the best combined_score

      7. Analyze results:
         - If best > 1.03492: record winning pattern structure
         - If best <= 1.03492: go back to Phase 1 with different variety

      ## Phase 4: Iteration

      8. Build on winners:
         - If you found a pattern > 1.03492, regenerate with focused variety
         - Probe and evaluate as before

      9. Change strategy if stuck:
         - After 5 iterations with no improvement, try completely different classes

      ## Budget Management

      - 30 evals total: 10 probes + 3 evals per iteration
      - 6-8 iterations should use most of the budget
      - Do not spend 5 evals on one pattern - probe first!
new_middlewares:
  - name: enforce_pattern_explore
    hook: before_model
    description: 'Before generating new patterns, ensure diversity. Remind solver to explore different pattern classes.'
    implementation_py: |
      def before_model(hook_input):
          iteration = hook_input.get("iteration", 0)
          best_score = hook_input.get("best_combined_score", None)
          evals_left = hook_input.get("evals_left", None)
          
          if iteration <= 2:
              return "Early search: Generate DIVERSE patterns across all classes (single_peak, multi_peak, plateau, staircase, asymmetric, pyramid). Do not focus on one pattern type yet. Use generate_pattern_variants with variety='diverse'."
          elif evals_left and evals_left > 20:
              return "You have many evals left. Generate patterns with varied interval counts (300-800) and different structural families. Probe rank before evaluating."
          elif iteration >= 40:
              return "Late search: Try focused pattern generation. If you have not found a pattern > 1.03492, your strategy needs fundamental change. Consider completely different pattern classes."
          else:
              return None
