type: tool
name: edit_solution
description: Change the EVOLVE-BLOCK step function. You can replace entire patterns or make SEARCH/REPLACE
  diffs. For best results, use generate_pattern_variants to create complete new patterns.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
