type: tool
name: generate_pattern_variants
description: Generate 50-100 diverse step function patterns with varying structures (single-peak, multi-peak,
  plateau, staircase, asymmetric, pyramid). Specify desired structural variety. Patterns use 300-800 intervals
  and heights in [0.5, 2.5]. Call at the START of search to explore the pattern space.
input_schema:
  type: object
  properties:
    variety:
      type: string
      description: 'Type of variety: diverse, focused_single_peak, multi_peak, plateau, asymmetric'
    num_patterns:
      type: integer
      minimum: 30
      maximum: 100
      default: 70
    min_intervals:
      type: integer
      minimum: 200
      maximum: 800
      default: 300
    max_intervals:
      type: integer
      minimum: 300
      maximum: 1000
      default: 800
