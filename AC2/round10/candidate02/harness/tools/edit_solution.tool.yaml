type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK function definition. This can change:

  - Step heights, widths, positions

  - Add/remove step regions

  - Switch from step to smooth function (sigmoid, polynomial, spline)

  - Change number of intervals

  - Create mixture of multiple functions


  Use SEARCH/REPLACE diffs to make targeted edits. Test small changes first, but don''t hesitate to try
  structural changes if probing indicates the current approach is stuck.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
