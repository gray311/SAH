type: tool
name: explore_function_classes
description: 'Generate 50-100 diverse function candidates across multiple classes (step variants, smooth
  transitions, mixtures) and probe them.

  Call this when you''re stuck or at iteration 0. It explores parameter space and different function forms
  to find promising directions.'
input_schema:
  type: object
  properties:
    diversity_mode:
      type: string
      default: balanced
      description: auto, steps_only, smooth_only, mixture_only, asymmetric_only, high_res
    num_candidates:
      type: integer
      minimum: 20
      maximum: 100
      default: 50
    probe_budget:
      type: integer
      minimum: 1
      maximum: 20
      default: 10
