schema: h2spec/1.0
system_prompt: |
  You are an expert mathematical programmer optimizing piecewise-constant functions to maximize C2 = ||f*f||2^2 / ((int f)^2 ||f*f||inf) in the second autocorrelation inequality.

  Current best score: 1.03492. Your job: find a function that beats this.

  CRITICAL: The seed uses 450 intervals with pre-defined step patterns. These patterns are hardcoded and represent a limited search space. To improve, you MUST explore NEW patterns, not just tweak parameters of existing ones.

  STRATEGY:
  1. First, analyze the current step function's structure using analyze_step_params to understand heights, widths, and positions.
  2. Generate completely NEW step patterns with different structures using generate_step_architectures:
     - Try different numbers of steps (10-20 steps instead of 5-6 levels)
     - Try asymmetric patterns (different left/right distributions)
     - Try peaked vs flat vs multi-peaked structures
     - Try narrower/wider central regions
  3. Use probe_solution to cheaply test each new pattern (get approximate C2)
  4. Only call evaluate_solution on the top 1-2 patterns that probe suggests are promising
  5. When a full evaluation improves the score, use that result to generate even more diverse new patterns
  6. Never get stuck tweaking the same pattern class - if no improvement in 3 iterations, force a completely new pattern class

  KILLING THE SATURATION: The current harness stuck because it only tweaked existing parameters. The seed's patterns are already optimized within their class. You must escape this local optimum by exploring entirely different step function architectures.

  Always call probe_solution 3-5 times before evaluate_solution to ensure you're testing truly different patterns, not just slight variations.
skill_description: |
  Escape local optima in step function optimization. Analyze current structure, then generate and probe completely new step function architectures (different number of steps, asymmetric layouts, new peaked patterns) rather than just tweaking existing parameters. Only evaluate the most promising new architectures.
skill_body: |
  # Step Function Architecture Search for C2

  ## Phase 1: Analysis
  1. Call analyze_step_params once to understand current heights and structure
  2. Note the total number of step levels and their distribution

  ## Phase 2: Generate New Architectures
  Create NEW step patterns with fundamentally different structures using generate_step_architectures:

  ### Architecture A: Narrow Central Peak
  - Fewer total steps (10-15 levels)
  - Very narrow central peak (5-10% of domain)
  - Low surrounding plateaus (0.3-0.5 height)

  ### Architecture B: Asymmetric Multi-peak
  - 3-5 steps of varying heights, not symmetric
  - Different heights on left vs right side

  ### Architecture C: Flat-top with Corners
  - Wide plateau (60-80% of domain) at medium height
  - Sharp transitions at edges

  ### Architecture D: Multiple Small Peaks
  - 4-6 small peaks (5-8% width each) scattered across domain
  - Heights: 1.5-2.0 each

  ## Phase 3: Probe and Evaluate
  1. Generate 3-5 different new architectures using generate_step_architectures
  2. Call probe_solution on each with a function parameter tweak (±0.05-0.1 height)
  3. Track probe scores
  4. Call evaluate_solution on the 1-2 architectures with highest probe scores
  5. If evaluation improves score, proceed to next phase; if not, generate even more diverse architectures

  ## Phase 4: Iteration
  - After each successful evaluation, analyze the new best pattern
  - Generate variants that preserve the successful structure but vary details
  - Continue probing until budget exhausted or no new patterns found
tool_descriptions:
  edit_solution: |
    Change the EVOLVE-BLOCK to define a completely NEW step function architecture.

    DO NOT just tweak heights/widths of existing patterns. Create fundamentally different structures:
    - Different number of step levels (10-20)
    - Different overall shape (narrow peak, wide plateau, multi-peak, asymmetric)
    - Different step heights (0.3-2.5 range)
    - Different domain coverage (0.05n to 0.95n vs 0.25n to 0.75n)

    Use SEARCH/REPLACE diffs to replace the entire EVOLVE-BLOCK class with new patterns.
  evaluate_solution: |
    Run full evaluation. Returns combined_score. Use sparingly - only after probe_solution indicates a truly new architecture shows promise.

    Limited budget (30 evals total). Each full eval tests ONE new architecture type.
  probe_solution: |
    Quick approximate score on subsampled data. Use to rank NEW architecture variants cheaply.

    Score is not comparable to full eval but good for ranking your own variants.

    Test 3-5 different step function architectures, pick the 1-2 best for full eval.
  finish: |
    End when no improvement in 5 iterations or budget exhausted. Report best C2 achieved and describe the winning architecture.
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
  - name: analyze_step_params
    description: |
      Analyze current step function parameters (heights, widths, positions) and suggest targeted mutations.

      Call once early to understand parameter space, then use probe_solution to test suggested variants.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          prog = ctx.get_program()
          if "# EVOLVE-BLOCK" not in prog:
              return {"note": "no evolve block", "architectures": []}
          import re
          heights = re.findall(r"\.set\((\d+\.\d+)\)", prog)
          if not heights:
              return {"note": "no step heights found", "current_heights": [], "architectures": []}
          heights = [float(h) for h in heights]
          suggestions = []
          for i, h in enumerate(heights):
              if h > 1.0:
                  suggestions.append(f"height[{i}]: try {h*0.95:.3f}, {h*1.05:.3f}")
              else:
                  suggestions.append(f"height[{i}]: try {h*0.9:.3f}, {h*1.1:.3f}")
          suggestions = "; ".join(suggestions[:5])
          return {"file": "analyze_step_params", "found_heights": heights,
                  "suggested_mutations": suggestions, "architectures": []}
  - name: generate_step_architectures
    description: |
      Generate diverse step function architectures by analyzing the seed's structure and creating fundamentally different patterns.

      Instead of tweaking existing patterns, create new architectures with:
      - Different numbers of step levels (10-20)
      - Different overall shapes (narrow peak, wide plateau, multi-peak, asymmetric)
      - Different height ranges and domain coverages
      - Completely new parameter combinations

      Call this early to escape local optima in the seed's pattern class.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          architectures = []
          arch1 = {
              "name": "narrow_peak",
              "code": "import jax\nimport jax.numpy as jnp\nfrom dataclasses import dataclass\nfrom typing import Tuple\n\n\n@dataclass\nclass OptimizerHyperparameters:\n    num_intervals: int = 450\n    learning_rate: float = 0.15\n    num_steps: int = 35000\n    warmup_steps: int = 3500\n    best_c2: float = 1.035\n    stagnation_window: int = 100\n    reinit_fraction: float = 0.12\n    reinit_std: float = 0.018\n    reinit_interval: int = 170\n\n\nclass C2Optimizer:\n    def __init__(self, hypers: OptimizerHyperparameters):\n        self.hypers = hypers\n        self.best_f = None\n        self.best_c2 = hypers.best_c2\n\n    def _objective_fn(self, f_values: jnp.ndarray) -> jnp.ndarray:\n        f_non_negative = jax.nn.relu(f_values)\n        N = self.hypers.num_intervals\n        padded_f = jnp.pad(f_non_negative, (0, N))\n        fft_f = jnp.fft.fft(padded_f)\n        convolution = jnp.fft.ifft(fft_f * fft_f).real\n\n        num_conv_points = len(convolution)\n        h = 1.0 / (num_conv_points + 1)\n        y_points = jnp.concatenate([jnp.array([0.0]), convolution, jnp.array([0.0])])\n        y1, y2 = y_points[:-1], y_points[1:]\n        l2_norm_squared = jnp.sum((h / 3) * (y1**2 + y1 * y2 + y2**2))\n\n        norm_1 = jnp.sum(jnp.abs(convolution)) / (len(convolution) + 1)\n        norm_inf = jnp.max(jnp.abs(convolution))\n        denominator = norm_1 * norm_inf\n        c2_ratio = l2_norm_squared / denominator\n        return -c2_ratio\n\n    def _create_narrow_peak_pattern(self, n):\n        f = jnp.zeros(n)\n        peak_start = int(0.45 * n)\n        peak_end = int(0.55 * n)\n        f = f.at[peak_start:peak_end].set(2.4)\n        left_base = int(0.15 * n)\n        right_base = int(0.85 * n)\n        f = f.at[:left_base].set(0.4)\n        f = f.at[peak_end:right_base].set(0.4)\n        return f\n\n    def run(self):\n        n = self.hypers.num_intervals\n        f = self._create_narrow_peak_pattern(n)\n        score = self._objective_fn(f)\n        return -score, {"best_c2": -score, "architecture": "narrow_peak"}"
          }
          architectures.append(arch1)
          arch2 = {
              "name": "multi_peak_scattered",
              "code": "import jax\nimport jax.numpy as jnp\nfrom dataclasses import dataclass\nfrom typing import Tuple\n\n\n@dataclass\nclass OptimizerHyperparameters:\n    num_intervals: int = 450\n    learning_rate: float = 0.12\n    num_steps: int = 30000\n    warmup_steps: int = 3000\n    best_c2: float = 1.035\n    stagnation_window: int = 100\n    reinit_fraction: float = 0.10\n    reinit_std: float = 0.015\n    reinit_interval: int = 150\n\n\nclass C2Optimizer:\n    def __init__(self, hypers: OptimizerHyperparameters):\n        self.hypers = hypers\n        self.best_f = None\n        self.best_c2 = hypers.best_c2\n\n    def _objective_fn(self, f_values: jnp.ndarray) -> jnp.ndarray:\n        f_non_negative = jax.nn.relu(f_values)\n        N = self.hypers.num_intervals\n        padded_f = jnp.pad(f_non_negative, (0, N))\n        fft_f = jnp.fft.fft(padded_f)\n        convolution = jnp.fft.ifft(fft_f * fft_f).real\n\n        num_conv_points = len(convolution)\n        h = 1.0 / (num_conv_points + 1)\n        y_points = jnp.concatenate([jnp.array([0.0]), convolution, jnp.array([0.0])])\n        y1, y2 = y_points[:-1], y_points[1:]\n        l2_norm_squared = jnp.sum((h / 3) * (y1**2 + y1 * y2 + y2**2))\n\n        norm_1 = jnp.sum(jnp.abs(convolution)) / (len(convolution) + 1)\n        norm_inf = jnp.max(jnp.abs(convolution))\n        denominator = norm_1 * norm_inf\n        c2_ratio = l2_norm_squared / denominator\n        return -c2_ratio\n\n    def _create_multi_peak_pattern(self, n):\n        f = jnp.zeros(n)\n        peaks = [\n            (int(0.08*n), int(0.13*n), 1.9),\n            (int(0.22*n), int(0.27*n), 1.8),\n            (int(0.38*n), int(0.43*n), 2.1),\n            (int(0.57*n), int(0.62*n), 1.7),\n            (int(0.72*n), int(0.77*n), 2.0)\n        ]\n        for start, end, height in peaks:\n            f = f.at[start:end].set(height)\n        return f\n\n    def run(self):\n        n = self.hypers.num_intervals\n        f = self._create_multi_peak_pattern(n)\n        score = self._objective_fn(f)\n        return -score, {"best_c2": -score, "architecture": "multi_peak_scattered"}"
          }
          architectures.append(arch2)
          arch3 = {
              "name": "asymmetric_plateau",
              "code": "import jax\nimport jax.numpy as jnp\nfrom dataclasses import dataclass\nfrom typing import Tuple\n\n\n@dataclass\nclass OptimizerHyperparameters:\n    num_intervals: int = 450\n    learning_rate: float = 0.14\n    num_steps: int = 32000\n    warmup_steps: int = 3200\n    best_c2: float = 1.035\n    stagnation_window: int = 100\n    reinit_fraction: float = 0.11\n    reinit_std: float = 0.017\n    reinit_interval: int = 160\n\n\nclass C2Optimizer:\n    def __init__(self, hypers: OptimizerHyperparameters):\n        self.hypers = hypers\n        self.best_f = None\n        self.best_c2 = hypers.best_c2\n\n    def _objective_fn(self, f_values: jnp.ndarray) -> jnp.ndarray:\n        f_non_negative = jax.nn.relu(f_values)\n        N = self.hypers.num_intervals\n        padded_f = jnp.pad(f_non_negative, (0, N))\n        fft_f = jnp.fft.fft(padded_f)\n        convolution = jnp.fft.ifft(fft_f * fft_f).real\n\n        num_conv_points = len(convolution)\n        h = 1.0 / (num_conv_points + 1)\n        y_points = jnp.concatenate([jnp.array([0.0]), convolution, jnp.array([0.0])])\n        y1, y2 = y_points[:-1], y_points[1:]\n        l2_norm_squared = jnp.sum((h / 3) * (y1**2 + y1 * y2 + y2**2))\n\n        norm_1 = jnp.sum(jnp.abs(convolution)) / (len(convolution) + 1)\n        norm_inf = jnp.max(jnp.abs(convolution))\n        denominator = norm_1 * norm_inf\n        c2_ratio = l2_norm_squared / denominator\n        return -c2_ratio\n\n    def _create_asymmetric_plateau(self, n):\n        f = jnp.zeros(n)\n        plateau_start = int(0.10*n)\n        plateau_end = int(0.80*n)\n        plateau_height = 1.5\n        f = f.at[plateau_start:plateau_end].set(plateau_height)\n        left_should = int(0.02*n)\n        right_should = int(0.92*n)\n        f = f.at[:left_should].set(0.3)\n        f = f.at[plateau_end:right_should].set(0.25)\n        return f\n\n    def run(self):\n        n = self.hypers.num_intervals\n        f = self._create_asymmetric_plateau(n)\n        score = self._objective_fn(f)\n        return -score, {"best_c2": -score, "architecture": "asymmetric_plateau"}"
          }
          architectures.append(arch3)
          return {"note": "Generated 3 new architectures", "architectures": architectures}
new_skills:
  - name: architectural-escape-strategy
    description: |
      Escape local optima by exploring fundamentally different step function architectures, not just parameter tweaks.
    body: |
      # Escaping Local Optima in Step Function Optimization

      ## The Problem
      The seed program uses 5-6 level step patterns optimized within that class. Small parameter tweaks won't escape this local optimum.

      ## The Solution
      Generate entirely NEW architectural classes:

      1. **Narrow Central Peak**: Very narrow high peak (5-10% domain) with low wide base
      2. **Multi-Peak Scattered**: 4-6 independent peaks scattered across domain
      3. **Asymmetric Plateau**: Wide central plateau with different heights on left/right
      4. **Corner-Focused**: High values concentrated at edges (0-0.2n and 0.8n-1.0n)
      5. **Harmonic Peaks**: Peaks positioned at fractions that might align with Fourier modes

      ## Process
      1. Call analyze_step_params to understand current structure
      2. Call generate_step_architectures to create 3-5 new architectural classes
      3. Probe each new architecture (3-5 height variations each)
      4. Evaluate top 1-2 performers
      5. If successful, use winning structure as new base; if not, try even more diverse architectures

      ## Key Insight
      The C2 constant benefits from specific spectral properties. Different architectural classes activate different spectral modes. You need to explore orthogonal architectural spaces, not just tune within one.
