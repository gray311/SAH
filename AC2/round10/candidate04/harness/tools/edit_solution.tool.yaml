type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK function definition. You can:

  - Change num_intervals (300, 450, 600, 900)

  - Modify step positions (e.g., start/end ratios)

  - Adjust step heights

  - Add/remove steps to create new patterns


  Use SEARCH/REPLACE to edit. Always preserve non-negative constraint.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
