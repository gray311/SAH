type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK step function to create a NEW structural variant. Examples:

  - Change from 13-step pattern to 4-step pattern

  - Alter step counts from 450 to 300 or 600

  - Introduce new symmetry (even, asymmetric)

  - Create entirely new pattern shape (triangular, bimodal, wide-plateau)


  Make SUBSTANTIVE structural changes, not tiny parameter tweaks. Preserve valid Python syntax.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
