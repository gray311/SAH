schema: h2spec/1.0
system_prompt: |
  You are a mathematical discovery engine tasked with finding novel functions that beat the current C₂ record of 0.8962799441554086.
  
  CRITICAL INSIGHT: The seed program achieves 1.03492 using step functions from AlphaEvolve. Small parameter tweaks won't improve this - we need to explore NEW function families entirely.
  
  Your mission: Discover function classes beyond step functions that achieve higher C₂ values.
  
  Strategy:
  1. **Explore function families systematically**: Test different mathematical representations (splines, polynomial pieces, Fourier-based functions, Gaussian mixtures, piecewise polynomials)
  2. **Use probe_solution to benchmark entire function classes**: Before investing eval budget, probe multiple implementations of the same family to find the best variant
  3. **Only commit to full evaluation** when probe results show clear promise (>1.02 or >5% improvement over best)
  4. **When progress stalls for 10 iterations**: Try a completely new function representation
  5. **Leverage structural insights**: Exploit symmetry, consider boundary conditions, test asymmetric patterns
  
  Target: Achieve combined_score > 1.04 (C₂ > 0.935) by discovering novel function structures.
  
  Key families to explore:
  - Spline functions (C³ continuous pieces)
  - Piecewise polynomial functions (quadratic, cubic pieces)
  - Fourier-mixed representations
  - Gaussian mixture models with adaptive widths
  - Asymmetric multi-level step functions
  - Polynomial decay functions with optimized exponents
skill_description: |
  Explore novel function families for C₂ optimization. Systematically test splines, polynomials, Fourier mixes, and asymmetric patterns. Use probes to benchmark entire families before committing eval budget to full evaluation.
skill_body: |
  # C₂ Function Discovery Strategy
  
  ## Core Principle
  The seed's step functions achieve 0.8962799441554086. To beat this, we must explore FUNCTION CLASSES beyond step functions, not just tune step parameters.
  
  ## Function Families to Explore (in priority order)
  
  1. **C³ Continuous Splines**
     - Use cubic splines with optimized knot positions
     - Ensure C³ continuity for smoothness benefits
     - Test 5-7 knot configurations
  
  2. **Piecewise Polynomial Functions**
     - Quadratic or cubic pieces with optimized coefficients
     - Test 3-5 pieces with varying widths
     - Preserve non-negativity constraint
  
  3. **Fourier-Based Representations**
     - Optimize Fourier coefficients with positivity constraints
     - Test different frequency combinations
     - Use IFFT to reconstruct real-valued functions
  
  4. **Gaussian Mixture Models**
     - Sum of Gaussians with optimized means, variances, weights
     - Test 2-5 components
     - Exploit smoothness advantages
  
  5. **Asymmetric Multi-Level Steps**
     - Beyond symmetric peaks: try left/right asymmetric patterns
     - Test plateau variants with sloped transitions
     - Consider non-uniform step heights
  
  ## Search Protocol
  
  ### Phase 1: Family Benchmarking (Probes Only)
  - For each new family, implement 3-5 variants
  - Probe all variants (cheap, ~10s each)
  - Track best probe score per family
  - Identify families with promise (>1.02 combined_score)
  
  ### Phase 2: Commitment (Full Evaluations)
  - Pick top 2 families by probe performance
  - Implement 2-3 refined variants per family
  - Full evaluate these candidates
  - Re-rank by actual scores
  
  ### Phase 3: Iteration
  - Build on successful families
  - If stall for 8 iterations: abandon current family, try next
  - Budget ending (<5 evals): try one last family-wide search
  
  ## Mutation Guidelines by Family
  
  ### Splines
  - Move knots by ±5% of domain
  - Adjust piece heights by ±10%
  - Test knot spacing ratios: [0.2,0.4,0.6], [0.25,0.5,0.75], etc.
  
  ### Polynomials
  - Test degrees 2-4
  - Vary piece widths: [30%,40%,30%], [25%,50%,25%], etc.
  - Optimize coefficients with initial guess from step function
  
  ### Gaussian Mixtures
  - Test 2, 3, 4 component combinations
  - Vary width ratios: [0.5,1.5], [1.0,2.0], [1.0,1.5,1.0]
  - Optimize mean spacing
  
  ## When to Abandon a Family
  - After probing 5+ variants with no >1.02 score
  - After 2 full evaluations with no improvement
  - After 10 total iterations without progress
  
  ## Success Criteria
  - Combined score > 1.04 (C₂ > 0.935)
  - Or >5% improvement over seed (combined > 1.085)
  - New function class discovered with publishable C₂ value
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to implement a new function family or refine existing parameters.
    
    For **new families**: Replace step function patterns with spline definitions, polynomial pieces, Gaussian mixes, or Fourier coefficients.
    
    For **refinement**: Adjust knot positions, polynomial coefficients, Gaussian parameters, or Fourier weights.
    
    Guidelines:
    - Keep changes structural, not just parametric
    - Maintain non-negativity: use softplus, exp, or squared forms
    - Preserve the dataclass hyperparameter structure
    - Test 2-3 variants per family before committing
  evaluate_solution: |
    Run full evaluation on your function. Returns combined_score.
    
    Budget: 30 evaluations total. Use wisely!
    
    Call this ONLY after:
    - Probing multiple variants from the same family
    - Identifying the best probe candidate
    - Confirming it's top-ranked across families
    
    Track your best score. Revert if score drops significantly.
  probe_solution: |
    Quick approximate evaluation on subsampled data. Perfect for family benchmarking!
    
    Use probes to:
    1. Test 3-5 variants within a function family (~10s each, no real budget cost)
    2. Compare families before investing full evals
    3. Rank variants internally
    
    Probe scores are approximate but GOOD for ranking your own variants.
    
    Strategy: Probe all variants of a family, pick best, then full-evaluate.
  finish: |
    End when you've exhausted the function family search space or budget runs out.
    
    Report:
    - Best C₂ achieved
    - Function family discovered
    - Key insights for future search
    - Why other families failed
    
    Don't give up! A family might need 2-3 attempts to find the optimal configuration.
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 18000
new_tools:
  - name: analyze_seed_patterns
    description: |
      Analyze the current step function patterns in the seed program to understand what makes them work.
      
      Identifies key parameter values (heights, positions, widths) and suggests:
      1. Small refinements to existing patterns
      2. Structural modifications (asymmetry, additional pieces)
      3. Alternative patterns from the same family
      
      Call this early to establish a baseline understanding, then use probe_solution to test suggestions.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          prog = ctx.get_program()
          
          # Extract key parameters from the seed program
          import re
          
          result = {
              "analysis": "Analyzing seed step function patterns...",
              "patterns_found": [],
              "suggestions": []
          }
          
          # Find step height patterns like .set(1.42)
          height_matches = re.findall(r'\.set\((\d+\.\d+)\)', prog)
          if height_matches:
              heights = [float(h) for h in height_matches]
              result["found_heights"] = heights
              result["patterns_found"].append({
                  "type": "step_heights",
                  "values": heights,
                  "count": len(heights)
              })
              
              # Suggest refinements
              for h in heights:
                  if h > 1.5:
                      result["suggestions"].append(
                          f"Consider asymmetric heights: try {h-0.2:.2f} and {h+0.2:.2f} for adjacent steps"
                      )
              
          # Find interval patterns
          interval_matches = re.findall(r'int\(int\((\d+\.\d+).*?/.*?\.set', prog)
          
          # Check for symmetry
          if height_matches:
              mid_idx = len(height_matches) // 2
              left_half = height_matches[:mid_idx]
              right_half = height_matches[mid_idx:]
              if abs(float(left_half[-1]) - float(right_half[0])) < 0.01:
                  result["patterns_found"].append({
                      "type": "symmetric",
                      "note": "Detected symmetric pattern around center"
                  })
              else:
                  result["patterns_found"].append({
                      "type": "asymmetric_potential",
                      "note": "Consider asymmetric variants"
                  })
          
          # Suggest structural changes
          result["suggestions"].extend([
              "Try asymmetric step patterns (different left/right heights)",
              "Test plateau variants with sloped transitions",
              "Explore multi-level steps with 4-5 height levels",
              "Consider narrowing the central peak while extending wings",
              "Test polynomial smoothing at step boundaries"
          ])
          
          result["recommendation"] = (
              f"Start with {len(height_matches)}-height asymmetric variants, then"
              " probe 3-5 variants before full evaluation."
          )
          
          return result
new_skills:
  - name: c2-family-exploration
    description: |
      Playbook for discovering new function families that beat the current C₂ record.
      
      Use this when: progress stalls, seed is already optimized, or you need to explore beyond step functions.
      
      Key principle: Systematic family exploration beats random parameter tuning.
    body: |
      # C₂ Function Family Discovery Playbook
      
      ## Why This Matters
      The seed achieves 0.8962799441554086 using step functions. To beat this, we must find NEW function classes.
      
      ## Step 1: Analyze Current Patterns
      Use analyze_seed_patterns to understand:
      - What heights work best
      - Symmetric vs asymmetric patterns
      - Current interval usage
      
      ## Step 2: Probe-Based Family Benchmarking
      For each candidate family, implement 3-5 variants and probe ALL of them.
      
      Example families:
      - Splines: 5, 7, 9 knots at different positions
      - Polynomials: degree 2, 3, 4 pieces
      - Gaussian mixes: 2, 3, 4 components
      - Asymmetric steps: left=1.2, right=1.8; left=0.8, right=2.0
      
      ## Step 3: Commit to Full Evaluation
      After probing:
      - Pick top 2 families
      - Implement 2-3 refined variants each
      - Full evaluate these candidates
      - Re-rank by actual scores
      
      ## Step 4: Iterate Within Best Family
      Once you find a promising family:
      - Refine parameters systematically
      - Try boundary conditions
      - Explore asymmetric variants
      - Only abandon after 2-3 failed attempts
      
      ## When to Switch Families
      - After 10 iterations with no improvement
      - If best probe score < 1.02 for current family
      - If 2 full evals fail to improve
      
      ## Success Metrics
      - Combined score > 1.04
      - New C₂ record > 0.935
      - Publishable function class
      
      ## Key Insight
      Random mutation within a family has diminishing returns. **Family exploration** is the breakthrough strategy.
tool_descriptions:
  edit_solution: 'Change the EVOLVE-BLOCK step function parameters. Target: heights, widths, positions of steps.

    Use SEARCH/REPLACE diffs. Test small changes first (±5-10%). Preserve working patterns.'
  evaluate_solution: 'Run full evaluation. Returns combined_score. Only call when probe indicates strong improvement.

    Limited budget (30 evals total). Track best score.'
  probe_solution: 'Quick approximate score on subsampled data. Use to rank parameter variants cheaply.

    Score is not comparable to full eval but good for ranking your own variants.

    Test multiple parameter sets, pick best for full eval.'
  finish: End when no improvement or budget exhausted. Report best C₂ achieved.
new_middlewares:
  - name: family_exploration_reminder
    hook: before_model
    description: |
      Middleware reminder to explore new function families when progress stalls.
      
      Fires before each model generation to keep the solver on track for family-level exploration.
    implementation_py: |
      def before_model(hook_input):
          return ("Consider exploring a NEW function family: splines, piecewise polynomials,\
      Gaussian mixtures, or Fourier representations. The seed's step functions are likely at a local optimum.\
      Use probe_solution to benchmark variants before full evaluation.")
