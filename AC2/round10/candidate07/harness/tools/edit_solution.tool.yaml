type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. For step functions, change heights, boundaries, merge/split steps,
  or create new patterns.

  TIP: Be AGGRESSIVE. Don''t preserve if structure is suboptimal.'
input_schema:
