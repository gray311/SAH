schema: h2spec/1.0
system_prompt: |
  You are a world-class mathematician optimizing functions to maximize C2 = ||f*f||2^2 / ((int f)^2 ||f*f||inf) in the second autocorrelation inequality.

  Current best: 1.03492 achieved by seed step functions with multi-level patterns (heights 1.40-2.30).

  CRITICAL: The seed is already at a local optimum. You MUST explore NEW function architectures, not just tweak parameters.

  Strategy:

  1. Use analyze_step_params FIRST to understand current parameter landscape. If heights are in 1.0-2.5 range, try COMPLETELY different classes:

  2. Try these FUNCTION CLASSES (not parameter tweaks!):
     - Ultra-narrow high-peaked spikes: Concentrate mass in tiny central regions (width 5-15%, height 3-5)
     - Bi-modal/dual-peaked: Two distinct high peaks (each 20-30% width) with deep valley between
     - Asymmetric cascades: Ramps up gradually, peaks sharply, decays slowly
     - Plateau-with-shoulders: Wide central plateau (40-60%) with rounded shoulders
     - Oscillatory dampened: Alternating high/low bands that decay toward edges
     - Tri-modal with gaps: Three separated peaks (15% width each, 40% gap between)
     - Spline-inspired: Smooth transitions between levels (not abrupt steps)

  3. Use probe_solution to test 5-10 ARCHITECTURAL variants per run, not just parameter tweaks.

  4. Structure your edits: DELETE the entire EVOLVE-BLOCK and rewrite with a new pattern class entirely.

  5. Only call evaluate_solution when you have a coherent new architecture to test (not after minor tweaks).

  6. If stuck at 1.03492, FORCE a complete restart: change to a completely different function class with no relation to seed patterns.

  7. Preserve: non-negativity (use jax.nn.relu), fixed interval count (450 is good), FFT-based convolution.

  Key insight: The seed's step patterns are HARDWIRED LOCAL OPTIMA. You must escape by changing FUNCTION ARCHITECTURE, not parameters.
skill_description: Escape local optima by exploring new function architectures (spikes, bi-modal, cascades, plateaus) beyond seed step patterns. Use probes to compare architectures, not parameters.
skill_body: |
  C2 Architecture Search - Escape Local Optima

  ## Diagnosis

  The seed achieves 1.03492 with heights 1.40-2.30. Small changes won't improve. Try DIFFERENT ARCHITECTURES.

  ## Architecture Classes

  A. Ultra-Narrow High Spikes
  Code: f = jnp.zeros(n); f = f.at[int(0.42*n):int(0.58*n)].set(4.0)
  Width 15-25%, Height 3.0-5.0

  B. Bi-Modal Dual Peaks
  Code: f = jnp.zeros(n); f.at[int(0.18*n):int(0.32*n)].set(2.2); f.at[int(0.68*n):int(0.82*n)].set(2.2)
  Two 16-20% peaks, 40% gap, Height 2.0-3.0

  C. Asymmetric Cascade
  Code: f.at[0:0.25n].set(1.0); f.at[0.25n:0.35n].set(3.5); f.at[0.35n:0.5n].set(2.0)
  25% rise, 10% peak (3.5), 15% decay

  D. Plateau with Shoulders
  Code: f.at[0:0.15n].set(1.5); f.at[0.15n:0.85n].set(2.5); f.at[0.85n:1.0n].set(1.5)
  15% shoulder, 50% plateau, 15% shoulder

  E. Tri-Modal with Gaps
  Code: f.at[0.05n:0.15n].set(2.0); f.at[0.25n:0.35n].set(2.0); f.at[0.65n:0.75n].set(2.0)
  Three 10% peaks, 20% gaps

  ## Execution Protocol

  1. Call analyze_step_params at start
  2. If heights in 1.0-2.5 range, you are stuck
  3. Use probe_solution to test 5-10 DIFFERENT architectures
  4. Pick best probe result
  5. Only call evaluate_solution on best architecture
  6. If no improvement, FORCE new architecture class
  7. Never tweak seed parameters - DELETE and rewrite
tool_descriptions:
  edit_solution: |
    Rewrite the ENTIRE EVOLVE-BLOCK with a NEW function architecture. Not parameter tweaks - DELETE and rebuild.

    Try: ultra-narrow spikes (width 15-25%, height 3-5), bi-modal dual peaks (two 16-20% peaks with 40% gap), asymmetric cascades, plateaus with shoulders, tri-modal with gaps.

    Use SEARCH/REPLACE to delete old EVOLVE-BLOCK and insert new architecture. Preserve: jnp.zeros(n), jax.nn.relu, interval count 450.
  evaluate_solution: Run full evaluation. Limited budget (30 evals). Only call after testing multiple architectures with probe_solution and picking the best architecture class.
  probe_solution: |
    Quick approximate score on subsampled data. Use to RANK DIFFERENT ARCHITECTURES cheaply.

    Test 5-10 architecture classes (not parameter variants). Score is not comparable to full eval but good for ranking architectures.

    Compare: ultra-narrow spike vs bi-modal vs cascade vs plateau vs tri-modal. Pick winner for full eval.
  finish: End when no improvement or budget exhausted. Report best C2 achieved. Report which architecture class succeeded.
sampling:
  temperature: 0.6
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
- name: suggest_architecture
  description: |
    Suggest a NEW function architecture class that differs from seed patterns. Call when heights are in 1.0-2.5 range or score stalls.

    This tool outputs a COMPLETE architectural blueprint to replace the EVOLVE-BLOCK, not parameter tweaks.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import random
        import re

        prog = ctx.get_program()
        heights = []
        h_matches = re.findall(r'\.set\((\d+\.\d+)\)', prog)
        if h_matches:
            try:
                heights = [float(h) for h in h_matches[:5]]
            except:
                heights = []

        if heights and all(0.8 <= h <= 2.8 for h in heights):
            arch_types = [
                ("ultra-narrow-spike", "Width 15-25%, height 3-5, central spike"),
                ("bi-modal", "Two 16-20% peaks with 40% gap, height 2.0-3.0 each"),
                ("asymmetric-cascade", "25% rise, 10% sharp peak (3.5), 15% decay"),
                ("plateau-shoulders", "15% shoulder, 50% plateau (2.5), 15% shoulder"),
                ("tri-modal", "Three 10% peaks with 20% gaps, height 1.8-2.5"),
            ]
            random.shuffle(arch_types)
            return {
                "recommendation": "FORCE architecture change - you are in seed basin",
                "current_heights": heights,
                "suggest_try_first": arch_types[0][0],
                "description": arch_types[0][1],
                "example": arch_types[0][0]
            }
        else:
            return {
                "recommendation": "Continue with current architecture or try alternative",
                "current_heights": heights,
                "suggest_try_first": "maintain",
                "description": "Heights suggest you may be exploring new space",
                "example": "no change needed"
            }
new_skills:
- name: escape-local-optima
  description: |
    Escape the seed's local optimum by exploring new function architectures. The seed is at 1.03492; small tweaks won't improve. Try ultra-narrow spikes, bi-modal peaks, cascades, plateaus, tri-modal patterns.
  body: |
    Escape Local Optima: Architecture Exploration

    ## Why the Seed is Stuck

    The seed achieves 1.03492 with heights 1.40-2.30. These are carefully optimized local optima. Small parameter changes cannot escape. You must try ENTIRELY DIFFERENT FUNCTION ARCHITECTURES.

    ## Architecture Escape Plan

    ### Phase 1: Diagnosis
    1. Call suggest_architecture tool
    2. Check current_heights output
    3. If heights in 0.8-2.8 range - FORCE architecture change
    4. If heights outside range - continue with current approach

    ### Architecture Classes

    A. Ultra-Narrow High Spikes
    f = jnp.zeros(n)
    f = f.at[int(0.42*n):int(0.58*n)].set(4.0)
    Width: 15-25%, Height: 3.0-5.0
    Why: Sharp peaks can increase L2 norm relative to denominator

    B. Bi-Modal Dual Peaks
    f = jnp.zeros(n)
    f = f.at[int(0.18*n):int(0.32*n)].set(2.2)
    f = f.at[int(0.68*n):int(0.82*n)].set(2.2)
    Two 16-20% peaks, 40% gap, Height: 2.0-3.0
    Why: Separated mass can favor L2 norm

    C. Asymmetric Cascade
    f = f.at[int(0.0*n):int(0.25*n)].set(1.0)
    f = f.at[int(0.25*n):int(0.35*n)].set(3.5)
    f = f.at[int(0.35*n):int(0.5*n)].set(2.0)
    25% rise, 10% peak (3.5), 15% decay
    Why: Asymmetric shapes can exploit convolution

    D. Plateau with Shoulders
    f = f.at[int(0.0*n):int(0.15*n)].set(1.5)
    f = f.at[int(0.15*n):int(0.85*n)].set(2.5)
    f = f.at[int(0.85*n):int(1.0*n)].set(1.5)
    15% shoulder, 50% plateau, 15% shoulder
    Why: Broad mass increases L2 relative to Linf

    ## Execution Protocol

    When to Use
    - suggest_architecture returns FORCE architecture change
    - Score stalled at 1.03492 for 2+ iterations
    - probe_solution shows no improvement
    - Budget > 15 evals remaining

    Testing Procedure
    Per Architecture Class:
    1. Use suggest_architecture for blueprint
    2. Delete entire EVOLVE-BLOCK
    3. Insert new architecture code
    4. Call probe_solution to get approximate score
    5. Repeat for 3-5 DIFFERENT architecture classes
    6. Pick best probe result
    7. Call evaluate_solution ONCE on best architecture

    Architecture Rotation
    - Iteration 0-2: Try class A
    - Iteration 3-5: Try class B
    - Iteration 6-8: Try class C
    - Continue rotating

    ## Key Rules

    1. NEVER tweak parameters of seed architecture - DELETE and rewrite entirely
    2. Test architectures in parallel - don't exhaust one before trying another
    3. Use probes to compare architectures - not parameters within one architecture
    4. One full eval per best architecture - budget is limited (30 evals)
    5. If no improvement after 2 architecture classes, FORCE next class immediately
    6. Track which architecture class you last tried - don't repeat failed classes
new_middlewares:
- name: force_architecture_change
  hook: before_model
  description: Force architecture rotation when score stagnates at 1.03492
  implementation_py: |
    def before_model(hook_input):
        last_score = hook_input.get('last_score', 0.0)
        evals_used = hook_input.get('evals_used', 0)

        if last_score <= 1.0350 and evals_used < 25:
            return "STUCK: Score <= 1.0350. You are in the seed's local optimum. FORCE a completely new architecture class (ultra-narrow spike, bi-modal, cascade, plateau, or tri-modal). DELETE the EVOLVE-BLOCK and write entirely new function architecture. Do NOT tweak parameters."

        if evals_used > 20:
            return "BUDGET WARNING: Try one more new architecture class with probe before final eval. Don't waste remaining evals on parameter tweaks."

        return None
