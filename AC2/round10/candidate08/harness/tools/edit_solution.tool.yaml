type: tool
name: edit_solution
description: 'Rewrite the ENTIRE EVOLVE-BLOCK with a NEW function architecture. Not parameter tweaks -
  DELETE and rebuild.


  Try: ultra-narrow spikes (width 15-25%, height 3-5), bi-modal dual peaks (two 16-20% peaks with 40%
  gap), asymmetric cascades, plateaus with shoulders, tri-modal with gaps.


  Use SEARCH/REPLACE to delete old EVOLVE-BLOCK and insert new architecture. Preserve: jnp.zeros(n), jax.nn.relu,
  interval count 450.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
