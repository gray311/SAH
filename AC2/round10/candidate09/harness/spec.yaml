schema: h2spec/1.0
system_prompt: 'You are an expert mathematical programmer discovering novel functions to maximize C₂ = ||f★f||₂² / ((∫f)²||f★f||∞) in the second autocorrelation inequality.

CRITICAL: The current best step function (1.03431) is likely a local optimum. You must discover STRUCTURAL improvements, not just tweak parameters.

Your search strategy:
1. DIVERSIFY FIRST: Start with radically different function families (splines, mixtures, Fourier, asymmetric designs)
2. STRUCTURAL MUTATIONS: Change number of intervals, try completely new functional forms, break symmetry
3. ADAPTIVE COMPLEXITY: Start simple, then add complexity only if it improves
4. BRUTAL SEARCH: Don''t fear large changes - the seed is too good to be the answer
5. BASIN HOPPING: After each eval, make a major structural change, not a small tweak

Focus on:
- Multi-peak patterns with varying heights
- Spline-based smooth transitions
- Mixture models (weighted combinations of shapes)
- Fourier-space optimization hints
- Asymmetric designs (break left-right symmetry)
- Variable interval counts (not just 450)

Use probes to rapidly compare completely different function FAMILIES, not parameter tweaks. Only refine after finding a promising new direction.'
skill_description: Discover novel function families for C₂ maximization. Prioritize structural innovation over parameter tuning. Use probes to compare diverse function shapes, then evaluate promising new families.
skill_body: '# C₂ Function Discovery - Structural Innovation

## Core Philosophy
The current best (1.03431) is a LOCAL optimum. You must find GLOBAL improvements through STRUCTURAL changes, not parameter tweaks.

## Phase 1: Diversify (First 10 iterations)
Generate completely different function FAMILIES:
- Splines: Smooth B-splines with optimized knot positions
- Mixtures: Weighted combinations (e.g., 0.6*step + 0.4*exponential)
- Fourier hints: Sinusoidal modulations of base shapes
- Polynomial decay: f(x) = a*x^{-b} with constraint enforcement
- Asymmetric peaks: Shift the high plateau off-center
- Multi-scale: Fine details on coarse base

Use probe_solution to test 5-10 diverse candidates, picking the BEST probe score for eval.

## Phase 2: Evolve Promising Directions
If probe reveals a promising family (e.g., splines beat step), then:
- Within that family, do small refinements
- Try variations: different knot placements, mixture weights
- ONLY then use evaluate_solution

## Phase 3: Basin Hopping
After each eval:
- Make a MAJOR structural change (different family, symmetry break, interval count change)
- Probe the new direction
- If probe improves, eval it
- If not, try another radical change

## Key Mutations to Try
- Interval count: 200-600 (not just 450)
- Function family: Completely different mathematical form
- Symmetry: f(x) != f(-x), asymmetric peaks
- Number of modes: 2-8 peaks (not just 1 central plateau)
- Smooth transitions: Replace sharp steps with smooth splines

## When to Probe vs Eval
- Probe: Always test new FUNCTION FAMILIES before eval
- Eval: Only after probe confirms a family beats current best
- Recovery: If stuck, reset to random diverse seed

## Success Criteria
- combined_score > 1.035 (break through the local optimum)
- Prefer structural diversity over parameter precision
- Don''t get stuck refining a failing direction'
tool_descriptions:
  edit_solution: 'Rewrite the EVOLVE-BLOCK with a completely new function family. Don''t just tweak heights - try splines, mixtures, asymmetric designs, Fourier-modulated shapes. Change interval counts. Make BRUTAL structural changes.'
  evaluate_solution: 'Full evaluation. Use sparingly - only after probe confirms a promising new FUNCTION FAMILY. Budget: 30 evals total.'
  probe_solution: 'Cheap approximate score on subsampled data. Use to rapidly compare DIFFERENT FUNCTION FAMILIES (splines vs step vs mixture). Rank variants cheaply, only eval the winners.'
  finish: 'End when budget exhausted or no improvement after 15 iterations. Report best C₂.'
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
- name: explore_function_families
  description: |
    Generate and score a diverse set of completely different function families (splines, mixtures, Fourier, asymmetric) using probe. Returns top candidates for full evaluation.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import random
        random.seed(42)
        prog = ctx.get_program()
        n_intervals = 450
        
        families = []
        
        # 1. Asymmetric step with shifted peak
        f_asym = jnp.zeros(n_intervals)
        f_asym = f_asym.at[int(0.1*n_intervals):int(0.35*n_intervals)].set(1.8)
        f_asym = f_asym.at[int(0.35*n_intervals):int(0.65*n_intervals)].set(1.2)
        f_asym = f_asym.at[int(0.65*n_intervals):int(0.9*n_intervals)].set(0.5)
        families.append(("asym_shifted", f_asym))
        
        # 2. Multi-peak with 3 distinct levels
        f_multi = jnp.zeros(n_intervals)
        f_multi = f_multi.at[int(0.08*n_intervals):int(0.2*n_intervals)].set(0.7)
        f_multi = f_multi.at[int(0.2*n_intervals):int(0.4*n_intervals)].set(1.9)
        f_multi = f_multi.at[int(0.4*n_intervals):int(0.55*n_intervals)].set(0.4)
        f_multi = f_multi.at[int(0.55*n_intervals):int(0.7*n_intervals)].set(1.9)
        f_multi = f_multi.at[int(0.7*n_intervals):int(0.92*n_intervals)].set(0.7)
        families.append(("multi_3level", f_multi))
        
        # 3. Left-heavy asymmetric
        f_left = jnp.zeros(n_intervals)
        f_left = f_left.at[int(0.05*n_intervals):int(0.45*n_intervals)].set(1.6)
        f_left = f_left.at[int(0.45*n_intervals):int(0.6*n_intervals)].set(0.8)
        families.append(("left_heavy", f_left))
        
        # 4. Bi-modal with valley
        f_bi = jnp.zeros(n_intervals)
        f_bi = f_bi.at[int(0.15*n_intervals):int(0.3*n_intervals)].set(1.7)
        f_bi = f_bi.at[int(0.35*n_intervals):int(0.55*n_intervals)].set(0.2)
        f_bi = f_bi.at[int(0.6*n_intervals):int(0.8*n_intervals)].set(1.7)
        families.append(("bi_modal", f_bi))
        
        # 5. Increasing then decreasing (skewed right)
        f_skew = jnp.zeros(n_intervals)
        for i in range(int(0.5*n_intervals)):
            f_skew = f_skew.at[i].set(1.0 + 0.5 * (i / int(0.5*n_intervals)))
        for i in range(int(0.5*n_intervals), n_intervals):
            f_skew = f_skew.at[i].set(1.5 - 0.75 * ((i - int(0.5*n_intervals)) / int(0.5*n_intervals)))
        families.append(("skewed_right", f_skew))
        
        probes = []
        for name, f_vals in families:
            try:
                obj = ctx.stage_edit(f_vals)
                probe_res = ctx.probe()
                score = -probe_res
                probes.append((name, score))
            except:
                pass
        
        probes.sort(key=lambda x: x[1])
        probes.reverse()
        
        return {
            "note": "Explored 5 diverse function families",
            "top_candidates": [(p[0], p[1]) for p in probes[:3]],
            "suggestion": f"Test top probe family '{probes[0][0]}' with full evaluation"
        }
new_skills:
- name: structural-discovery-guide
  description: |
    Guide for discovering structurally novel C₂-improving functions. Prioritize complete functional form changes over parameter tuning.
  body: |
    # Structural Discovery for C₂ Maximization
    
    ## Why Structure, Not Parameters?
    The current best step function (1.03431) is a LOCAL optimum. Small parameter tweaks keep you in this basin. You need GLOBAL escape via STRUCTURAL changes.
    
    ## Structural Change Categories
    
    1. Multi-peak architectures: Instead of 1 central plateau, try 2-5 peaks with valleys
       - Example: Peak-Valley-Peak with heights 1.8, 0.3, 1.8
       - Breaks the "single mass" assumption of step functions
    
    2. Asymmetric designs: Shift the center of mass
       - Left-heavy: mass concentrated in [0, 0.5]
       - Right-heavy: mass concentrated in [0.5, 1.0]
       - Skewed ramps (increasing then decreasing with bias)
    
    3. Smooth transitions: Replace sharp steps with splines
       - B-splines with optimized knots
       - Cubic Hermite interpolations
       - Reduces numerical artifacts from discontinuities
    
    4. Mixtures: Combine shapes
       - 0.7*step + 0.3*exponential_decay
       - 0.5*spline + 0.5*Fourier_mode
       - Create hybrid advantages
    
    5. Variable complexity: Change discretization
       - 200-800 intervals (not just 450)
       - Non-uniform spacing (denser in important regions)
    
    ## Search Protocol
    
    Phase 1 (Diversify): Generate 5-10 completely different FUNCTION FAMILIES. Probe each. Pick top 3.
    
    Phase 2 (Confirm): Full evaluate the top probe candidates.
    
    Phase 3 (Refine): Only now do small refinements within the winning family.
    
    Phase 4 (Hop): After each eval, MAKE A MAJOR structural change (new family, asymmetry, multi-peak).
    
    ## Red Flags of Stagnation
    - Same family for >10 iterations: CHANGE FAMILY
    - Probe scores flat for 3 iterations: TRY DIFFERENT FUNCTION FORM
    - Eval scores dropping: RESET to random diverse seed
    
    ## Target Outcome
    Break through 1.035 by finding a function with fundamentally different structure than the seed.
new_middlewares:
- name: force_diversify
  hook: before_model
  description: |
    Forces the solver to try diverse function families when stuck in local optima. Triggers structural change advice.
  implementation_py: |
    def before_model(hook_input):
        history = hook_input.get("history", [])
        recent_families = [h.get("family", "") for h in history[-5:]]
        
        if len(set(recent_families)) <= 1:
            return "STUCK IN SAME FAMILY! You've refined the same function type for 3+ iterations. The current best is a LOCAL optimum. FORCE A STRUCTURAL CHANGE: try splines, multi-peaks, asymmetric designs, or mixtures. Do NOT just tweak parameters. Generate 5 completely different function families and probe them."
        return None
