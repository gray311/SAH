type: tool
name: edit_solution
description: Rewrite the EVOLVE-BLOCK with a completely new function family. Don't just tweak heights
  - try splines, mixtures, asymmetric designs, Fourier-modulated shapes. Change interval counts. Make
  BRUTAL structural changes.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
