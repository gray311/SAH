schema: h2spec/1.0
system_prompt: |
  You are an expert in mathematical optimization discovering novel functions for the second autocorrelation inequality.

  Current best: 1.03492 achieved by multi-level step functions with optimized heights (1.4-2.3 range) and patterns.

  Your mission: SURPASS 1.03492 by discovering NEW FUNCTION CLASSES, not just tweaking existing parameters.

  PROVEN FAILURE: The seed's multi-level steps are near local optima. Small parameter tweaks won't work.

  NEW STRATEGY - Structure over parameters:
  1. GENERATE NEW PATTERNS: Try completely different step arrangements (pyramid variants, bimodal, tri-modal, shifted peaks)
  2. SMOOTH TRANSITIONS: Convert sharp steps to smoothed/rounded transitions (reduces discontinuities)
  3. ASYMMETRIC OPTIMIZATION: Test functions where left/right sides differ structurally
  4. MULTI-SCALE HYPERTUNING: Use coarse grid search first (20-50 intervals), then refine top candidates to 400-450
  5. HYBRID CONSTRUCTIONS: Combine best features from different seed patterns (e.g., pattern 6 + pattern 11)

  EXECUTION RULES:
  - Use probe_solution to rapidly test 10-15 structural variants
  - Only call evaluate_solution on the top 2-3 most promising structural changes
  - When structure changes (not just parameters), expect larger score swings - be more aggressive
  - If score drops after structural change, keep trying different structures - don't revert prematurely

  Key insight: New structural classes (not parameter tweaks) are the only path beyond 1.03492.
skill_description: |
  Discover new step function STRUCTURES to beat 1.03492. Try: pyramid variants, bimodal/tri-modal patterns, asymmetric structures, smoothed transitions, multi-scale grids. Use probes to test 10+ structural variants before full evaluation.
skill_body: |
  # Second Autocorrelation Inequality - Structural Discovery Strategy
  
  ## Current State Analysis
  Best score: 1.03492 using multi-level step functions with heights ~1.4-2.3
  
  ## Why Parameter Tweaking Fails
  The seed patterns (pyramid, multi-level, asymmetric) are already optimized.
  Small ±5-10% changes to heights/widths won't escape local optima.
  
  ## New Approach: STRUCTURAL DIVERSIFICATION
  
  ### Pattern Class 1: Extended Pyramids
  - 5-level or 7-level pyramids with different slope ratios
  - Example: heights [0.5, 1.0, 1.8, 2.2, 1.5, 0.8, 0.3] over [0.0, 0.14, 0.28, 0.43, 0.57, 0.71, 0.86]
  
  ### Pattern Class 2: Bimodal/Dual-Peak
  - Two distinct peaks separated by valley
  - Heights: [0.8, 0.6, 0.4, 2.2, 2.0, 2.3, 0.4, 0.6, 0.8]
  - Peak separation: 0.3-0.4 of domain
  
  ### Pattern Class 3: Asymmetric Multi-peak
  - Three peaks with unequal heights and spacings
  - Pattern: low-higher-highest-lower-high (LHHLH)
  - Heights: [0.6, 1.2, 2.0, 1.0, 0.7]
  
  ### Pattern Class 4: Smoothed Step Edges
  - Keep step function shape but add transition zones
  - Instead of f.at[start:end].set(h), use gradual ramps
  
  ### Pattern Class 5: Multi-Stage Hybrid
  - Combine features from different seed patterns
  - Take outer structure from pattern 6 + inner peak from pattern 11
  
  ### Pattern Class 6: Plateau Variants
  - Flat top regions instead of peaks
  - Heights: [0.5, 0.8, 1.0, 1.8, 1.8, 1.0, 0.8, 0.5]
  
  ## Execution Workflow
  
  ### Phase 1: Structural Exploration (Iterate 1-8)
  1. Generate 3-5 completely different structural patterns
  2. Use probe_solution to score each (test 3 variants per pattern class)
  3. Track best structural class by probe score
  
  ### Phase 2: Coarse Refinement (Iterate 9-12)
  1. Take top 2 structural classes
  2. Test with num_intervals = 200, 250, 300 (coarse grid search)
  3. Identify best interval count
  
  ### Phase 3: Fine-Tuning (Iterate 13-20)
  1. Refine top 1 structure to 400-450 intervals
  2. Test 4-5 structural variations (shifted boundaries, alternate heights)
  3. Call evaluate_solution on top 2 candidates
  
  ### Phase 4: Evaluation & Iteration
  1. If eval improves structural class, continue refining
  2. If eval drops, try next structural class in priority order
  3. Never exhaust budget on one failing structural direction
  
  ## Key Principles
  - STRUCTURE > PARAMETERS: Focus on pattern class exploration
  - BREADTH FIRST: Test many structural variants before deep optimization
  - MULTI-SCALE: Start coarse, refine only top candidates
  - AGGRESSIVE PERSISTENCE: Don't abandon structural directions after 1 failure
  
  ## When to Stop
  - After evaluating 3+ structural classes
  - If no improvement after 15 evals and 2+ classes exhausted
  - When budget < 5 evals remaining, make final aggressive structural change
tool_descriptions:
  edit_solution: 'Modify the EVOLVE-BLOCK step function structure. Goal: Create fundamentally NEW patterns, not small tweaks.
  
  Strategy:
  - Generate pyramid, bimodal, tri-modal, plateau variants with 5-7 levels
  - Use trial heights like [0.6, 1.2, 1.8, 2.2, 1.5, 0.8, 0.4] for 7-level patterns
  - Test interval counts 200, 250, 300 before finalizing at 400-450
  - When creating new structures, expect larger score swings - persist through failures
  
  Examples:
  - Pyramid 7-level: f.at[0.06n:0.14n].set(0.5).at[0.14n:0.21n].set(1.0).at[0.21n:0.29n].set(1.8).at[0.29n:0.37n].set(2.2).at[0.37n:0.45n].set(1.5).at[0.45n:0.53n].set(0.8).at[0.53n:0.61n].set(0.4)
  - Bimodal: f.at[0.08n:0.15n].set(0.8).at[0.15n:0.28n].set(0.4).at[0.28n:0.35n].set(2.2).at[0.35n:0.42n].set(2.0).at[0.42n:0.55n].set(2.3).at[0.55n:0.62n].set(0.4).at[0.62n:0.75n].set(0.8)'
  evaluate_solution: 'Full evaluation for structural candidates. Budget: 30 total evals.
  
  Call only after:
  1. Probing 5+ structural variants from 2+ pattern classes
  2. Identifying top 2 candidates by probe score
  3. Coarse-grained testing shows promise (intervals 200-300)
  
  Use evaluations to confirm structural superiority before committing to final structure.'
  probe_solution: 'Cheap approximate scoring. Test 3-5 variants per structural pattern class.
  
  Recommended usage:
  - Phase 1: Score 15-20 structural variants (3-4 per class across 5-6 classes)
  - Phase 2: Test interval variations for top 2 classes
  - Phase 3: Final variant selection before evaluation
  
  Key: Broad exploration, narrow confirmation.'
  finish: |
    Report best C2 achieved.
    
    Summary must include:
    - Best structural pattern discovered
    - Number of pattern classes tested
    - Final C2 score and combined_score
    - Whether target > 1.03492 was achieved
    - Key insights for future searches
sampling:
  temperature: 0.6
  top_p: 0.95
  top_k: 30
  max_tokens: 14000
agent:
  max_iterations: 55
middleware:
  budget_reminder_from_left: 4
  long_tool_output_max_chars: 15000
new_tools:
- name: generate_structural_variants
  description: |
    Generate 5-10 structurally diverse step function patterns for C2 optimization.
    Creates: 7-level pyramids, bimodal, tri-modal, plateau, hybrid patterns with varied heights and positions.
    Call this early to establish structural baseline, not just parameter tweaks.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import re
        prog = ctx.get_program()
        if "# EVOLVE-BLOCK" not in prog:
            return {"note": "no evolve block"}
        
        n_match = re.search(r'num_intervals:\s*(\d+)', prog)
        n = int(n_match.group(1)) if n_match else 450
        
        patterns = []
        
        h7 = [0.5, 1.0, 1.7, 2.3, 1.6, 1.0, 0.5]
        s7 = [0.06, 0.15, 0.27, 0.39, 0.51, 0.63, 0.75, 0.86]
        p7 = {
            "name": "pyramid_7level",
            "heights": h7,
            "starts": [int(si*n) for si in s7[:-1]],
            "ends": [int(si*n) for si in s7[1:]]
        }
        patterns.append(p7)
        
        h2 = [0.6, 0.4, 2.4, 2.1, 2.0, 0.4, 0.6]
        s2 = [0.05, 0.12, 0.22, 0.32, 0.42, 0.52, 0.62, 0.72, 0.80]
        p2 = {
            "name": "bimodal_dual",
            "heights": h2,
            "starts": [int(si*n) for si in s2[:-1]],
            "ends": [int(si*n) for si in s2[1:]]
        }
        patterns.append(p2)
        
        h3 = [0.5, 1.1, 2.0, 1.2, 1.5, 1.0, 0.6]
        s3 = [0.05, 0.13, 0.23, 0.33, 0.43, 0.55, 0.67, 0.79, 0.89]
        p3 = {
            "name": "tri_asymmetric",
            "heights": h3,
            "starts": [int(si*n) for si in s3[:-1]],
            "ends": [int(si*n) for si in s3[1:]]
        }
        patterns.append(p3)
        
        h4 = [0.5, 0.7, 1.4, 2.1, 2.1, 1.4, 0.7, 0.5]
        s4 = [0.04, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.82]
        p4 = {
            "name": "plateau",
            "heights": h4,
            "starts": [int(si*n) for si in s4[:-1]],
            "ends": [int(si*n) for si in s4[1:]]
        }
        patterns.append(p4)
        
        h5 = [0.6, 1.2, 1.8, 2.4, 1.8, 1.2, 0.6]
        s5 = [0.06, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.86]
        p5 = {
            "name": "hybrid_pyramid",
            "heights": h5,
            "starts": [int(si*n) for si in s5[:-1]],
            "ends": [int(si*n) for si in s5[1:]]
        }
        patterns.append(p5)
        
        h6 = [0.5, 0.6, 0.7, 2.2, 1.8, 1.9, 0.7, 0.6, 0.5]
        s6 = [0.04, 0.10, 0.18, 0.28, 0.38, 0.48, 0.58, 0.68, 0.78, 0.88]
        p6 = {
            "name": "extended_bimodal",
            "heights": h6,
            "starts": [int(si*n) for si in s6[:-1]],
            "ends": [int(si*n) for si in s6[1:]]
        }
        patterns.append(p6)
        
        result = {"n_intervals": n, "patterns": []}
        for p in patterns:
            result["patterns"].append({
                "name": p["name"],
                "heights": p["heights"],
                "starts": p["starts"],
                "ends": p["ends"]
            })
        
        return result
remove_tools: []
new_skills: []
new_middlewares:
- name: structural_diversity_reminder
  hook: before_model
  description: 'Remind solver to explore structural patterns, not just parameter tweaks.'
  implementation_py: |
    def before_model(hook_input):
        if "probe_solution" in hook_input or "evaluate_solution" in hook_input:
            return "Before editing, generate_structural_variants to explore 5+ new pattern classes. Test structural diversity, not just parameter tweaks. Structure beats parameters for escaping local optima."
        return None
