type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK step function structure. Goal: Create fundamentally NEW patterns,
  not small tweaks.

  Strategy: - Generate pyramid, bimodal, tri-modal, plateau variants with 5-7 levels - Use trial heights
  like [0.6, 1.2, 1.8, 2.2, 1.5, 0.8, 0.4] for 7-level patterns - Test interval counts 200, 250, 300 before
  finalizing at 400-450 - When creating new structures, expect larger score swings - persist through failures

  Examples: - Pyramid 7-level: f.at[0.06n:0.14n].set(0.5).at[0.14n:0.21n].set(1.0).at[0.21n:0.29n].set(1.8).at[0.29n:0.37n].set(2.2).at[0.37n:0.45n].set(1.5).at[0.45n:0.53n].set(0.8).at[0.53n:0.61n].set(0.4)
  - Bimodal: f.at[0.08n:0.15n].set(0.8).at[0.15n:0.28n].set(0.4).at[0.28n:0.35n].set(2.2).at[0.35n:0.42n].set(2.0).at[0.42n:0.55n].set(2.3).at[0.55n:0.62n].set(0.4).at[0.62n:0.75n].set(0.8)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
