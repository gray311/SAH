type: tool
name: finish
description: 'Report best C2 achieved.


  Summary must include:

  - Best structural pattern discovered

  - Number of pattern classes tested

  - Final C2 score and combined_score

  - Whether target > 1.03492 was achieved

  - Key insights for future searches'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
