type: tool
name: edit_solution
description: 'Change function parameters or representation. Use SEARCH/REPLACE diffs.


  For step functions: adjust heights, widths, positions.

  For splines: modify coefficients, knots.

  For mixtures: adjust weights, means, variances.


  Always ensure f(x) ≥ 0. Test changes with probe_solution first.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
