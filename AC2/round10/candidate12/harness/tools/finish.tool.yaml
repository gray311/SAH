type: tool
name: finish
description: 'End when budget exhausted or no improvement for 5 iterations.

  Report: best C₂ score, function class used, number of evals/probes.

  If C₂ > 0.89628 (new record achieved), this is a breakthrough.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
