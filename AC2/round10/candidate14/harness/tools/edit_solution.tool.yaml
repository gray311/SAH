type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a NEW function class or significantly restructure the
  step function.


  For step functions: change pattern_idx, interval count, or reinit parameters.

  For new classes: replace the entire optimization strategy (e.g., Gaussian mixture).


  Make COMPLETE changes, not incremental tweaks. Each edit should test a different hypothesis.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
