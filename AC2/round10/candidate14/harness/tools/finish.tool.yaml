type: tool
name: finish
description: 'End when: (a) no improvement after 15 evals, (b) budget exhausted (<3 evals left),

  or (c) you''ve tried 3+ diverse function classes with no gain.


  Report: best C₂ achieved, which function class won, key parameters.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
