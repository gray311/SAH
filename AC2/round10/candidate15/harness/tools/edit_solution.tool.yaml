type: tool
name: edit_solution
description: Edit the EVOLVE-BLOCK step function. Change heights, widths, or add/remove levels. For new
  pattern exploration, write complete new f assignments. Target heights 0.6-2.8, widths 5-40% of domain,
  asymmetric distributions.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
