schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization, specializing in discovering functions that maximize C₂ = ||f★f||₂² / ((∫f)²||f★f||∞).
  
  Current best: 1.03492 (seed program uses 13 sophisticated multi-level step patterns).
  Your mission: BEAT this by discovering NEW pattern classes or substantially improving existing ones.
  
  Critical insight: The seed's patterns are locally optimized for simple mutations. You MUST:
  1. ANALYZE the current pattern structure to find weak points (where ||f★f||∞ might be inflated or ||f★f||₂² might be low)
  2. PROPOSE and test ENTIRELY NEW pattern classes: (a) asymmetric multi-peaked functions, (b) spline-like smooth transitions, (c) irregular step patterns that exploit the convolution's structure
  3. Use pattern_searcher to generate mathematically-grounded mutation candidates, not random tweaks
  
  Strategy:
  - Call pattern_searcher ONCE at start to understand current pattern's structure
  - Each iteration: generate 2-3 diverse pattern proposals via pattern_searcher
  - Test with evaluate_solution (probe wastes budget on this task)
  - When improving, drill deeper into that pattern class
  - Don't settle on small tweaks - aim for fundamentally different architectures
  
  Failure modes to avoid:
  - X: Getting stuck making tiny adjustments that don't improve C₂
  - X: Assuming step functions are optimal - explore smooth transitions
  - X: Using same pattern types repeatedly - force diversity with pattern_searcher's suggestions
skill_description: |
  Mathematically-grounded pattern discovery for C₂ maximization. Use pattern_searcher to analyze current patterns and propose new pattern classes (asymmetric multi-peaks, spline transitions, irregular configurations). Focus on discovering entirely new architectures rather than small parameter tweaks.
skill_body: |
  # C₂ Maximizer: Pattern Discovery Protocol
  
  ## Core Principle
  The seed program's 13 step patterns are already locally optimized. Small mutations won't help. You MUST discover NEW pattern architectures.
  
  ## Phase 1: Structural Analysis (first iteration)
  1. Call pattern_searcher to understand current best pattern's structure
  2. Identify where ||f★f||∞ is maximized and ||f★f||₂² could be increased
  3. Note: asymmetry, discontinuity locations, and relative heights affect C₂ differently
  
  ## Phase 2: Pattern Generation
  Generate diverse new patterns by:
  
  **New Pattern Classes to Explore**:
  - **Asymmetric multi-peaks**: Unequal peak heights/positions (e.g., 0.6, 1.8, 0.3 heights)
  - **Spline transitions**: Smoothly connect steps with quadratic/exponential transitions
  - **Tailored asymmetry**: Shift the "center of mass" of the pattern
  - **Multi-mode peaks**: 3+ peaks with varying separations
  - **Truncated/power functions**: Instead of hard steps, use piecewise power-law decays
  
  ## Phase 3: Evaluation Strategy
  - Each pattern proposal: call evaluate_solution ONCE (probe is unreliable on this delicate problem)
  - Track which pattern CLASS improves, not just individual parameters
  - If a class works: generate more variants in that class
  - If all fail: go back to pattern_searcher for new directions
  
  ## Phase 4: Iteration
  1. Analyze → 2. Generate diverse candidates → 3. Evaluate each → 4. Drill down or diversify
  
  Key: Think mathematically about WHY a pattern should improve C₂, not just "try a different number."
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to implement a new pattern. Target:
    - Entirely new step configurations with different heights/positions
    - Pattern classes: asymmetric multi-peaks, spline-like transitions, irregular structures
    - Use SEARCH/REPLACE to rewrite the _create_step_initializer method
    
    Priority: Generate COMPLEX new patterns (3+ levels, asymmetric, varied heights) rather than small tweaks.
  evaluate_solution: |
    Full evaluation. Returns combined_score. Call ONCE per pattern proposal.
    Budget: 30 evals total. Each eval is precious - ensure the edit is ready to test.
  probe_solution: |
    Approximate score on subsampled data. UNRELIABLE for this task due to numerical sensitivity.
    Only use if you're comparing very similar variants. Otherwise, skip probe and go straight to evaluation.
  finish: |
    Report the best C₂ achieved and the pattern class that produced it.
sampling:
  temperature: 0.15
  top_p: 0.85
  top_k: 15
  max_tokens: 14336
agent:
  max_iterations: 65
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
  - name: pattern_searcher
    description: |
      Mathematically analyze the current step pattern and propose 3-5 new pattern configurations.
      Call once early, then use these proposals to guide evaluations. Focus on: (1) asymmetry,
      (2) multi-peaked structures, (3) smooth transitions, (4) irregular step placements.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import re
          prog = ctx.get_program()
          if "# EVOLVE-BLOCK" not in prog:
              return {"note": "no evolve block"}
          
          # Extract heights from patterns like f.at[...].set(1.42)
          heights = re.findall(r'\.set\((\d+\.\d+)\)', prog)
          heights = [float(h) for h in heights if h]
          
          if not heights:
              return {"note": "could not parse heights", "proposals": []}
          
          # Analyze current pattern characteristics
          max_h = max(heights)
          min_h = min(heights)
          h_range = max_h - min_h
          avg_h = sum(heights) / len(heights)
          
          # Generate diverse new pattern proposals
          proposals = []
          
          # Proposal 1: Asymmetric three-peak pattern
          if h_range > 0.1:
              proposals.append({
                  "name": "asymmetric_3peak",
                  "description": "Three peaks with unequal heights and positions to break symmetry",
                  "heights": [min_h * 0.7, max_h * 1.35, min_h * 0.9, max_h * 1.1, min_h * 0.6],
                  "rationale": "Asymmetry in peak structure may reduce ||f★f||∞ while maintaining ||f★f||₂²"
              })
          
          # Proposal 2: Smooth transition pattern (mimicking spline behavior)
          proposals.append({
              "name": "smooth_transition",
              "description": "Step pattern with gradual transitions using exponential-like behavior",
              "heights": [avg_h * 1.2, avg_h * 0.8, avg_h * 1.4, avg_h * 0.6, avg_h * 1.1],
              "rationale": "Smoother transitions in convolution may improve L2 norm without increasing infinity norm"
          })
          
          # Proposal 3: Irregular multi-level pattern
          proposals.append({
              "name": "irregular_multi",
              "description": "Irregularly spaced multi-level steps with varying widths",
              "heights": [max_h * 0.8, max_h * 1.45, avg_h * 0.7, max_h * 1.25, avg_h * 0.9],
              "rationale": "Irregular spacing may avoid constructive interference in convolution peaks"
          })
          
          # Proposal 4: Centered asymmetric pattern
          if len(heights) >= 3:
              proposals.append({
                  "name": "centered_asymmetric",
                  "description": "Central peak dominates with asymmetric side peaks",
                  "heights": [avg_h * 0.6, max_h * 1.55, avg_h * 0.5, max_h * 1.3, avg_h * 0.4],
                  "rationale": "Dominant central peak with smaller asymmetric wings may optimize the ratio"
              })
          
          # Proposal 5: Staircase variant
          proposals.append({
              "name": "staircase_asymmetric",
              "description": "Asymmetric staircase with increasing/decreasing steps",
              "heights": [avg_h * 0.75, avg_h * 0.85, avg_h * 0.95, avg_h * 1.1, avg_h * 1.25, avg_h * 1.0],
              "rationale": "Monotonic (or near-monotonic) step structure may improve convolution properties"
          })
          
          return {
              "analysis": {
                  "height_range": h_range,
                  "avg_height": avg_h,
                  "max_height": max_h,
                  "current_proposals_count": len(heights)
              },
              "proposals": proposals
          }
new_skills:
  - name: pattern-evolution-strategy
    description: |
      Systematic approach to discovering new C₂-optimizing patterns. Analyze current patterns, propose new architectures (asymmetric, multi-peak, smooth transitions), evaluate, and iterate.
    body: |
      # Pattern Evolution Strategy for C₂ Maximization
      
      ## Overview
      The seed program's multi-level step patterns are locally optimized. Small tweaks won't help. You need to discover NEW pattern architectures.
      
      ## Phase 1: Analyze Current Pattern
      1. Call pattern_searcher to understand the current best pattern's structure
      2. Note key features: peak heights, spacing, symmetry, number of levels
      3. Identify where the current pattern might be suboptimal
      
      ## Phase 2: Generate New Pattern Classes
      Don't just tweak parameters - create NEW architectures:
      
      **Exploration Direction 1: Asymmetric Multi-Peaks**
      - Create 3-5 peaks with intentionally unequal heights
      - Example pattern: [0.6h, 1.5h, 0.5h, 1.3h, 0.4h] where h = average height
      - Rationale: Breaking symmetry may reduce the infinity norm of the convolution
      
      **Exploration Direction 2: Smooth Transitions**
      - Replace hard steps with piecewise exponential or quadratic transitions
      - Example: use soft+ for transitions: f(x) = exp(-α|x - x₀|) scaled appropriately
      - Rationale: Smooth functions may have better convolution properties
      
      **Exploration Direction 3: Centered Dominant Peak**
      - One tall central peak with smaller asymmetric side peaks
      - Example: [0.4h, 1.6h, 0.3h, 1.4h, 0.3h]
      - Rationale: Concentrating mass may optimize the ratio
      
      **Exploration Direction 4: Irregular Spacing**
      - Non-uniform interval placements
      - Example: vary interval widths by 15-25%
      - Rationale: Avoids constructive interference in convolution
      
      ## Phase 3: Evaluate and Iterate
      1. For each new pattern class, generate 2-3 concrete implementations
      2. Evaluate each with evaluate_solution (probe is unreliable)
      3. If a class improves: generate more variants in that class
      4. If all fail: analyze why and try a different architectural direction
      
      ## Key Principles
      - Diversity > refinement: New architectures beat better parameters
      - One eval at a time: Don't generate 10 variants; test one, learn, then try another
      - Math matters: Understand WHY a pattern should work before implementing it
new_middlewares:
  - name: prioritize_evaluate
    hook: before_model
    description: |
      Remind the agent to skip probe and go straight to evaluation. Probe is unreliable for this task.
    implementation_py: |
      def before_model(hook_input):
          return "Skip probe_solution. Call evaluate_solution directly for each new pattern proposal. Probe scores are unreliable for this mathematically delicate problem."
