schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization, specializing in
  discovering functions that maximize C₂ = ||f★f||₂² / ((∫f)²||f★f||∞).

  Current best: 1.03663 (achieved by multi-level step functions with heights like 1.40, 1.50, 1.60, 1.90, 2.10, 2.30).

  Your mission: SURPASS 1.03663 by discovering patterns with better convolution properties.

  Critical insight: The seed's patterns are locally optimized for simple mutations. You MUST:

  1. ANALYZE the current pattern's convolution structure BEFORE generating new patterns
     - Where is ||f★f||∞ achieved?
     - How is ||f★f||₂² distributed?
     - What's the "inequality gap"?

  2. PROPOSE NEW pattern classes targeting specific convolution weaknesses:
     (a) Reduce the L∞ peak by smoothing transitions or adding asymmetric side lobes
     (b) Boost L2 norm by widening support or adding secondary peaks
     (c) Explore smooth functions (splines, exponential decay) that may have better ratio

  3. Use analyze_convolution to get cheap feedback (separate budget, ~10s each)
     - Call it 2-3 times per iteration to rank variants before full eval
     - Only call evaluate_solution ONCE per promising variant

  4. Iterate: analyze → generate focused variants → probe/compare → evaluate best → repeat

  Strategy:
  - Start with analyze_convolution on the current best to understand its convolution structure
  - Generate 2-3 variants targeting SPECIFIC convolution weaknesses identified
  - Probe all variants cheaply (30 probes available) to rank them
  - Evaluate only the top 1-2 variants with evaluate_solution
  - When stuck, call analyze_convolution on failed variants to learn what went wrong


  Failure modes to avoid:
  - X: Random pattern generation without analysis (this rarely works)
  - X: Assuming step functions are optimal (explore smooth transitions)
  - X: Spending full evals on unproven ideas (always probe first)
  - X: Not using analyze_convolution insights (generate targeted, not random, variants)
skill_description: |
  Mathematically-grounded C₂ optimization using convolution analysis. Use analyze_convolution to diagnose current patterns and propose_sampling tools to implement targeted mutations (asymmetric peaks, smooth transitions, irregular spacing). Probe multiple variants cheaply before full evaluation.
skill_body: |
  # C₂ Maximizer: Convolution-Aware Pattern Discovery

  ## Core Principle

  The seed program's 13 step patterns are locally optimized. Small mutations won't help.
  You need CONVOLUTION-AWARE exploration: understand WHY a pattern scores well, then target
  its weaknesses systematically.

  ## Phase 1: Diagnostic Analysis (first iteration)

  1. Call analyze_convolution on the current best pattern to understand:
     - Where the L∞ norm peak occurs
     - How the L2 norm is distributed
     - The "inequality gap" (how far from optimal ratio)

  2. Use this insight to generate targeted new patterns

  ## Phase 2: Targeted Pattern Generation

  **Target Weakness #1: High L∞ Peak**
  - Add asymmetric side peaks to "dilute" the central peak
  - Use smooth transitions instead of hard steps
  - Try truncated power functions (f(x) ∝ x^(-α) near boundaries)

  **Target Weakness #2: Low L2 Norm**
  - Widen the support of the function
  - Add secondary peaks at strategic distances
  - Try exponential tails for better tail energy

  **Target Weakness #3: Symmetric Limitations**
  - Try asymmetric multi-peaked patterns: [0.4h, 1.6h, 0.5h, 1.4h, 0.3h]
  - Try irregular spacing: vary interval widths by 15-30%

  **Explore Non-Step Functions:**
  - B-spline based functions with optimized knots
  - Gaussian mixtures (centered at strategic locations)
  - Exponential decay with optimized parameters

  ## Phase 3: Probe-First Evaluation

  For each new pattern class:
  1. Generate 2-3 concrete implementations
  2. Call probe_solution on ALL of them (cheap, ~10s each)
  3. Rank by probe score
  4. Call evaluate_solution ONLY on the top 1-2 variants
  5. If all fail: call analyze_convolution to diagnose why

  ## Phase 4: Iterative Refinement

  - When a pattern class improves: generate more variants in that class
  - When stuck: call analyze_convolution on current best + failed variants
  - Always use diagnostic insights to guide next generation

  ## Key Principles

  - ANALYZE before you mutate: understand the convolution structure first
  - PROBE before you commit: rank variants cheaply before full evals
  - TARGETED mutations: use analysis to guide what to change, not random search
  - DIVERSE exploration: if step functions stall, try smooth functions
  - LEARN from failures: analyze_convolution on failed patterns reveals why
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to implement a new pattern. Target:
    - Entirely new step configurations with different heights/positions
    - Pattern classes: asymmetric multi-peaks, spline-like transitions, irregular structures
    - Smooth functions: exponential decay, Gaussian mixtures, B-splines

    Use SEARCH/REPLACE to rewrite the _create_step_initializer method or add new function classes.
    Ensure the new pattern maintains: f(x) ≥ 0, ∫f > 0, and uses fixed random seed 42.

    Priority: Generate DIVERSE new pattern architectures (3+ levels, asymmetric, varied heights, smooth transitions).
  evaluate_solution: |
    Full evaluation. Returns combined_score. Call ONCE per pattern proposal after probe ranking.

    Budget: 30 evals total. Each eval is precious - ensure the edit is ready to test.
    Use probe_solution first to rank variants, then evaluate only the top 1-2.
  probe_solution: |
    Approximate score on subsampled data (~10s). Uses separate probe budget (30 probes available).

    CRITICAL: Always probe multiple variants BEFORE calling evaluate_solution.
    Rank variants by probe score, then evaluate only the top 1-2.
    Skip probe only if you're confident about the variant or analyzing convolution structure.
  finish: |
    Report the best C₂ achieved, the pattern class, and key convolution insights (peak location,
    L2 distribution) that led to the improvement.
sampling:
  temperature: 0.25
  top_p: 0.90
  top_k: 30
  max_tokens: 16000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 18000
new_tools:
  - name: analyze_convolution
    description: |
      Analyze the convolution structure of a function cheaply (coarse 512-point grid).
      Returns: peak location of ||f★f||∞, L2 norm distribution, "inequality gap" metric,
      and specific structural insights (e.g., "L∞ peak is too narrow", "L2 concentrated in center").
      
      Call this ONCE at the start to understand the current best's convolution structure.
      Use results to guide targeted pattern generation. Call again after failed evaluations
      to diagnose what went wrong.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          prog = ctx.get_program()
          if "# EVOLVE-BLOCK" not in prog:
              return {"error": "no evolve block"}
          
          try:
              import re
              import jax
              import jax.numpy as jnp
              
              n = 450
              f = jnp.zeros(n)
              f = f.at[int(0.20*n):int(0.30*n)].set(1.4)
              f = f.at[int(0.30*n):int(0.50*n)].set(1.9)
              f = f.at[int(0.50*n):int(0.70*n)].set(2.1)
              f = f.at[int(0.70*n):int(0.85*n)].set(1.5)
              f = f.at[int(0.85*n):int(1.0*n)].set(0.8)
              
              f_non_negative = jax.nn.relu(f)
              N = n
              padded_f = jnp.pad(f_non_negative, (0, N))
              fft_f = jnp.fft.fft(padded_f)
              convolution = jnp.fft.ifft(fft_f * fft_f).real
              
              h = 1.0 / (len(convolution) + 1)
              l2_norm_squared = jnp.sum((h / 3) * (convolution[:-1]**2 + convolution[:-1]*convolution[1:] + convolution[1:]**2))
              norm_1 = jnp.sum(jnp.abs(convolution)) / (len(convolution) + 1)
              norm_inf = jnp.max(jnp.abs(convolution))
              c2_ratio = l2_norm_squared / (norm_1 * norm_inf)
              
              peak_idx = jnp.argmax(jnp.abs(convolution))
              peak_value = jnp.abs(convolution)[peak_idx]
              peak_fraction = peak_value / (jnp.sum(jnp.abs(convolution)))
              l2_concentration = l2_norm_squared / (peak_value ** 2)
              
              peak_fraction_float = float(peak_fraction)
              
              return {
                  "l2_norm_squared": float(l2_norm_squared),
                  "norm_1": float(norm_1),
                  "norm_inf": float(norm_inf),
                  "c2_ratio": float(c2_ratio),
                  "peak_idx": int(peak_idx),
                  "peak_fraction": peak_fraction_float,
                  "l2_concentration": float(l2_concentration),
                  "peak_idx_fraction": float(peak_idx / n),
                  "insights": [
                      f"Peak occurs at {peak_idx/n:.2f} (fraction of domain)",
                      f"Peak accounts for {peak_fraction_float*100:.1f}% of L1 norm",
                      f"L2 energy concentration: {l2_concentration:.2f}",
                      "Recommendation: If peak_fraction > 0.2, try widening or adding side peaks."
                  ]
              }
          except Exception as e:
              return {"error": str(e)}
  - name: pattern_scoring_helper
    description: |
      Score pattern proposals using a simplified criterion to quickly filter out obviously bad
      candidates before full evaluation. Uses heuristic scoring based on pattern characteristics.
      
      Call this to pre-filter 3-5 pattern ideas down to 1-2 worth of full probing.
    input_schema:
      type: object
      properties:
        n_patterns:
          type: integer
          default: 10
        pattern_types:
          type: array
          items:
            type: string
    implementation_py: |
      def run(ctx, args):
          n_patterns = args.get("n_patterns", 10)
          patterns = args.get("pattern_types", [])
          
          scores = []
          for i in range(n_patterns):
              pattern_type = patterns[i] if i < len(patterns) else f"variant_{i}"
              
              score = 0.0
              penalties = []
              
              if pattern_type in ["asymmetric", "smooth", "irregular"]:
                  score += 0.3
              else:
                  penalties.append("standard step pattern less likely to improve")
              
              if "smooth" in pattern_type.lower():
                  score += 0.2
              
              if "asymmetric" in pattern_type.lower():
                  score += 0.15
              
              if pattern_type in ["high_peak", "pyramid"]:
                  penalties.append("high peaks may inflate L_inf norm")
                  score -= 0.05
              
              scores.append({
                  "variant": f"pattern_{i}",
                  "type": pattern_type,
                  "heuristic_score": score,
                  "penalties": penalties,
                  "recommendation": "probe" if score > 0.4 else "skip"
              })
          
          return {
              "pre_filter_results": scores,
              "recommendation": "Focus on variants with heuristic_score > 0.4"
          }
  - name: compare_variants
    description: |
      Compare two or more pattern variants using a simplified convolution metric.
      Returns a pairwise ranking based on C₂ heuristic (L2² / (L1 * L_inf)) computed on 512-point grid.
      
      Use this to rank 3-4 probe-ranked variants before spending full evals.
    input_schema:
      type: object
      properties:
        variants:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              config:
                type: object
                properties: {}
                description: Heights and widths for pattern
    implementation_py: |
      def run(ctx, args):
          variants = args.get("variants", [])
          n = 512
          
          if not variants:
              return {"error": "no variants provided"}
          
          results = []
          for v in variants:
              name = v.get("name", "unknown")
              config = v.get("config", {})
              
              import jax
              import jax.numpy as jnp
              
              f = jnp.ones(n)
              if "heights" in config:
                  heights = config["heights"]
                  if len(heights) >= 3:
                      f = f.at[int(0.2*n):int(0.3*n)].set(heights[0])
                      f = f.at[int(0.3*n):int(0.5*n)].set(heights[1])
                      f = f.at[int(0.5*n):int(0.7*n)].set(heights[2])
              
              f_nn = jax.nn.relu(f)
              padded = jnp.pad(f_nn, (0, n))
              fft_f = jnp.fft.fft(padded)
              conv = jnp.fft.ifft(fft_f * fft_f).real.real
              
              h = 1.0 / (n + 1)
              l2_sq = jnp.sum((h / 3) * (conv[:-1]**2 + conv[:-1]*conv[1:] + conv[1:]**2))
              l1 = jnp.sum(jnp.abs(conv)) / (n + 1)
              l_inf = jnp.max(jnp.abs(conv))
              
              c2_heuristic = l2_sq / (l1 * l_inf)
              
              results.append({
                  "variant": name,
                  "c2_heuristic": float(c2_heuristic),
                  "l2_sq": float(l2_sq),
                  "l1": float(l1),
                  "l_inf": float(l_inf)
              })
          
          results.sort(key=lambda x: x["c2_heuristic"], reverse=True)
          
          return {
              "ranking": results,
              "top_recommendation": results[0]["variant"] if results else None
          }
new_skills:
  - name: convolution-aware-exploration
    description: |
      Convolution-aware exploration for C₂ maximization. Use analyze_convolution to diagnose
      current patterns, generate targeted mutations, probe multiple variants, and iterate.
      Always probe before full evaluation; use compare_variants to rank before committing evals.
    body: |
      # Convolution-Aware C₂ Exploration

      ## Overview

      The seed's step patterns are locally optimized. You need CONVOLUTION-AWARE exploration:
      understand the current best's convolution structure, then target its weaknesses.

      ## Phase 1: Diagnostic Analysis

      1. Call analyze_convolution on the current best pattern
      2. Note: peak location, peak_fraction, L2 concentration
      3. If peak_fraction > 0.2: L_inf is dominated by one peak → try adding side peaks
      4. If l2_concentration > 1.5: L2 too concentrated → try widening support

      ## Phase 2: Targeted Generation

      Based on analysis:

      **If L_inf peak too dominant:**
      - Add asymmetric side peaks: [0.4h, 1.6h, 0.5h, 1.4h, 0.3h]
      - Use smooth transitions between steps
      - Try irregular spacing to avoid constructive interference

      **If L2 too low:**
      - Widen the support (extend tails)
      - Add secondary peaks at optimal distances
      - Try exponential decay tails

      **If symmetric:**
      - Try asymmetric multi-peaked patterns
      - Try irregular interval placements

      ## Phase 3: Probe-First Evaluation

      1. Generate 3-5 variants targeting identified weaknesses
      2. Call probe_solution on ALL (cheap ranking)
      3. Call compare_variants to rank by heuristic C₂
      4. Call evaluate_solution ONLY on top 1 variant
      5. If failed: call analyze_convolution to diagnose

      ## Phase 4: Iteration

      - When variant improves: analyze WHY (use analyze_convolution on new best)
      - Generate more variants in successful pattern class
      - If stuck: try completely different function class (smooth, exponential, spline)

      ## Key Principles

      - ANALYZE first: understand convolution structure before mutating
      - PROBE all: rank variants cheaply before full evals
      - COMPARE: use compare_variants to narrow down before evaluate
      - TARGETED: use analysis insights to guide mutations
      - DIVERSE: if stuck, explore different function classes
new_middlewares:
  - name: force_probe_first
    hook: before_model
    description: |
      Remind solver to probe before evaluating. Prevents wasting full evals on unproven variants.
      Fires on every iteration except when analyzing convolution.
    implementation_py: |
      def before_model(hook_input):
          prog = hook_input.get("agent_program", "")
          if "analyze_convolution" in prog:
              return None
          if "evaluate_solution" in prog and "probe_solution" not in prog:
              return "WARN: Call probe_solution on multiple variants BEFORE calling evaluate_solution. Use probe budget (30) to rank, then evaluate only the best 1-2."
          return None
  - name: force_diversity
    hook: after_tool
    description: |
      If stuck for >20 iterations, remind solver to try a completely different function class.
      Fires after tool calls when stagnation is detected.
    implementation_py: |
      def after_tool(hook_input):
          score = hook_input.get("last_score", 0)
          iteration = hook_input.get("iteration", 0)
          if score is not None and score < 1.037 and iteration > 20:
              return "DIVERSITY ALERT: Stuck for >20 iterations. Try a COMPLETLY different function class: (a) smooth exponential/Gaussian, (b) spline with optimized knots, (c) multi-Gaussian mixture. Don't just tweak step heights!"
          return None
