type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a new pattern. Target:

  - Entirely new step configurations with different heights/positions

  - Pattern classes: asymmetric multi-peaks, spline-like transitions, irregular structures

  - Smooth functions: exponential decay, Gaussian mixtures, B-splines


  Use SEARCH/REPLACE to rewrite the _create_step_initializer method or add new function classes.

  Ensure the new pattern maintains: f(x) ≥ 0, ∫f > 0, and uses fixed random seed 42.


  Priority: Generate DIVERSE new pattern architectures (3+ levels, asymmetric, varied heights, smooth
  transitions).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
