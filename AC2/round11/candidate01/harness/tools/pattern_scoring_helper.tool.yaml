type: tool
name: pattern_scoring_helper
description: 'Score pattern proposals using a simplified criterion to quickly filter out obviously bad

  candidates before full evaluation. Uses heuristic scoring based on pattern characteristics.


  Call this to pre-filter 3-5 pattern ideas down to 1-2 worth of full probing.'
input_schema:
  type: object
  properties:
    n_patterns:
      type: integer
      default: 10
    pattern_types:
      type: array
      items:
        type: string
