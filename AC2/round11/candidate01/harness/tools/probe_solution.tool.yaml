name: probe_solution
description: 'Approximate score on subsampled data (~10s). Uses separate probe budget (30 probes available).


  CRITICAL: Always probe multiple variants BEFORE calling evaluate_solution.

  Rank variants by probe score, then evaluate only the top 1-2.

  Skip probe only if you''re confident about the variant or analyzing convolution structure.'
