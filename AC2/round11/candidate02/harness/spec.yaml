schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization, specializing in discovering functions that maximize C₂ = ||f★f||₂² / ((∫f)²||f★f||∞).

  Current best: 1.03663 (seed program uses 13 sophisticated multi-level step patterns).

  Your mission: BEAT this by discovering NEW pattern classes or substantially improving existing ones.

  Critical insight: The seed's patterns are locally optimized for simple mutations. You MUST:

  1. USE c2_mutation_engine to get CONCRETE, NUMBERED mutation proposals (not symbolic expressions)

  2. PROPOSE and test ENTIRELY NEW pattern classes: (a) asymmetric multi-peaked functions, (b) spline-like smooth transitions, (c) irregular step patterns

  3. Call c2_mutation_engine FIRST to get concrete numbers, then implement ONE edit, then evaluate

  Strategy:

  - Call c2_mutation_engine ONCE at start to get concrete mutation candidates

  - Each iteration: implement ONE mutation from the engine's concrete proposal

  - Test with evaluate_solution (probe wastes budget on this task)

  - When improving, drill deeper into that pattern class

  - Don't settle on small tweaks - aim for fundamentally different architectures


  Failure modes to avoid:

  - X: Getting stuck making tiny adjustments that don't improve C₂

  - X: Implementing symbolic expressions without concrete numbers

  - X: Using same pattern types repeatedly - force diversity
skill_description: Mathematically-grounded pattern discovery for C₂ maximization. Use c2_mutation_engine to get concrete mutation proposals with actual numbers (not symbolic expressions like "min_h * 0.7"). Focus on discovering entirely new architectures rather than small parameter tweaks.
skill_body: |
  # C₂ Maximizer: Concrete Mutation Protocol


  ## Core Principle

  The seed program's 13 step patterns are already locally optimized. Small mutations won't help. You need CONCRETE mutation operators that generate actual numbers.


  ## Phase 1: Get Concrete Mutations (first iteration)

  1. Call c2_mutation_engine to get CONCRETE numerical mutation proposals

  2. The engine will return actual numbers like: heights=[0.82, 1.97, 0.71, ...], not symbolic expressions

  3. Choose ONE mutation proposal that looks promising


  ## Phase 2: Implement the Mutation

  Using the concrete numbers from c2_mutation_engine:

  - Rewrite the _create_step_initializer method with the actual numbers
  - Target: complex new patterns (3+ levels, asymmetric, varied heights)
  - Use SEARCH/REPLACE to update the height values in each pattern variant


  ## Phase 3: Evaluation Strategy

  - Each implemented pattern: call evaluate_solution ONCE (probe is unreliable)

  - Track which pattern CLASS improves, not just individual parameters

  - If a class works: generate more variants in that class using c2_mutation_engine

  - If all fail: call c2_mutation_engine again for new directions


  ## Phase 4: Iteration

  1. Call c2_mutation_engine for concrete numbers → 2. Implement ONE mutation → 3. Evaluate → 4. Drill down or diversify

  Key: Work with CONCRETE numbers, not symbolic expressions. The c2_mutation_engine will give you actual height values like 1.47, 2.33, 0.89, etc.
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to implement a new pattern. Use CONCRETE numbers from c2_mutation_engine:

    - Update height values in _create_step_initializer with actual numbers (e.g., .set(1.47) not .set(min_h*1.5))

    - Target: complex new patterns (3+ levels, asymmetric, varied heights)

    - Use SEARCH/REPLACE to rewrite the _create_step_initializer method

    - Priority: Generate COMPLEX new patterns rather than small tweaks.
  evaluate_solution: |
    Full evaluation. Returns combined_score. Call ONCE per pattern proposal.

    Budget: 30 evals total. Each eval is precious - ensure the edit uses concrete numbers from c2_mutation_engine.
  probe_solution: |
    Approximate score on subsampled data. UNRELIABLE for this task due to numerical sensitivity.

    Only use if you are comparing very similar variants. Otherwise, skip probe and go straight to evaluation.
  finish: |
    Report the best C₂ achieved and the pattern class that produced it.
sampling:
  temperature: 0.22
  top_p: 0.9
  top_k: 25
  max_tokens: 14336
agent:
  max_iterations: 70
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
- name: c2_mutation_engine
  description: |
    Parse current step patterns, extract actual numerical heights, and generate 4-6 CONCRETE mutation proposals with actual numbers (not symbolic expressions). Returns ready-to-implement height arrays for each pattern variant.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import re
        prog = ctx.get_program()
        
        if "# EVOLVE-BLOCK" not in prog:
            return {"error": "no evolve block", "proposals": []}
        
        # Extract all actual numerical height values from the program
        # Pattern: .set(NUMBER) where NUMBER is like 1.40, 2.30, etc.
        heights = re.findall(r'\.set\((\d+\.\d+)\)', prog)
        heights = [float(h) for h in heights if h]
        
        if len(heights) < 3:
            return {"error": "could not parse sufficient heights", "proposals": []}
        
        # Analyze current pattern characteristics
        max_h = max(heights)
        min_h = min(heights)
        avg_h = sum(heights) / len(heights)
        h_std = (sum((h - avg_h)**2 for h in heights) / len(heights)) ** 0.5
        
        proposals = []
        
        # Proposal 1: Amplified asymmetry - increase contrast between peaks
        prop1_heights = [avg_h * 0.55, max_h * 1.60, avg_h * 0.40, max_h * 1.40, avg_h * 0.30]
        proposals.append({
            "name": "amplified_asymmetry",
            "description": "Extreme asymmetry with very high central peak and small wings",
            "heights": prop1_heights,
            "rationale": f"Increasing height contrast (max: {max_h:.2f}, min: {min_h:.2f}) to reduce convolution infinity norm",
            "concrete_values": prop1_heights
        })
        
        # Proposal 2: Broaden the peak distribution - wider spread
        num_levels = min(13, len(heights))
        center_idx = num_levels // 2
        prop2_heights = []
        for i in range(num_levels):
            if i == center_idx:
                prop2_heights.append(max_h * 1.55)
            elif i == center_idx - 1 or i == center_idx + 1:
                prop2_heights.append(avg_h * 1.25)
            else:
                prop2_heights.append(avg_h * 0.65)
        proposals.append({
            "name": "broadened_distribution",
            "description": "Broader peak distribution with smoother height transitions",
            "heights": prop2_heights,
            "rationale": "Spreading mass across more levels may improve the L2 to infinity ratio",
            "concrete_values": prop2_heights
        })
        
        # Proposal 3: Multiple small peaks (anti-constructive interference)
        prop3_heights = [avg_h * 1.3, avg_h * 0.7, avg_h * 1.45, avg_h * 0.6, avg_h * 1.35, avg_h * 0.75]
        proposals.append({
            "name": "multiple_small_peaks",
            "description": "Multiple moderate peaks instead of one dominant peak",
            "heights": prop3_heights,
            "rationale": "Distributed peaks may avoid constructive interference at convolution infinity",
            "concrete_values": prop3_heights
        })
        
        # Proposal 4: Steep central peak with gradual wings
        prop4_heights = [avg_h * 0.75, avg_h * 1.3, max_h * 1.70, avg_h * 0.95, avg_h * 0.80]
        proposals.append({
            "name": "steep_peak_gentle_wings",
            "description": "Sharp central peak with gradually tapering wings",
            "heights": prop4_heights,
            "rationale": f"Concentrating mass centrally (max_h: {max_h:.2f}) while softening edges",
            "concrete_values": prop4_heights
        })
        
        # Proposal 5: Offset pyramid - asymmetric pyramid structure
        if len(heights) >= 5:
            prop5_heights = [avg_h * 0.60, avg_h * 1.20, max_h * 1.45, avg_h * 0.90, avg_h * 0.55]
            proposals.append({
                "name": "offset_pyramid",
                "description": "Asymmetric pyramid with the tallest peak offset to the left",
                "heights": prop5_heights,
                "rationale": "Offset peak structure may exploit convolution asymmetry",
                "concrete_values": prop5_heights
            })
        
        # Proposal 6: Very high narrow peak strategy
        prop6_heights = [avg_h * 0.50, avg_h * 0.85, max_h * 1.95, avg_h * 0.70, avg_h * 0.55]
        proposals.append({
            "name": "narrow_high_peak",
            "description": "Very tall narrow central peak with minimal wings",
            "heights": prop6_heights,
            "rationale": f"Extremely high peak (target: ~{max_h * 1.95:.2f}) to maximize L2 contribution",
            "concrete_values": prop6_heights
        })
        
        # Summary stats
        return {
            "analysis": {
                "height_range": max_h - min_h,
                "avg_height": avg_h,
                "max_height": max_h,
                "min_height": min_h,
                "std_dev": h_std,
                "current_heights_count": len(heights)
            },
            "num_proposals": len(proposals),
            "proposals": proposals
        }
new_skills:
- name: concrete-mutation-protocol
  description: Systematic protocol for using c2_mutation_engine to get concrete numerical mutations and implement them.
  body: |
    # Concrete Mutation Protocol for C₂ Maximization


    ## Overview

    The c2_mutation_engine tool will give you CONCRETE numerical proposals (actual height values like 1.47, 2.33, 0.89), not symbolic expressions.


    ## Step 1: Call c2_mutation_engine

    Call c2_mutation_engine at the start to get 4-6 concrete mutation proposals. Each proposal includes:
    - A name for the pattern class
    - Concrete height values (actual numbers)
    - A rationale explaining why it should work


    ## Step 2: Choose and Implement ONE Proposal

    Select ONE proposal that looks most promising. Then:

    1. Find all occurrences of .set(NUMBER) in the _create_step_initializer method
    2. Replace the numbers with the concrete values from your chosen proposal
    3. Ensure the pattern structure (interval percentages) makes sense
    4. Use edit_solution to apply the changes


    ## Step 3: Evaluate

    Call evaluate_solution ONCE to test the implemented mutation.


    ## Step 4: Iterate

    - If successful: call c2_mutation_engine again, refine the winning direction
    - If unsuccessful: try a different proposal, or explore a new pattern class

    ## Key Principle

    WORK WITH CONCRETE NUMBERS. The c2_mutation_engine gives you actual values like [0.82, 1.97, 0.71], not expressions like [min_h*0.7, max_h*1.35]. Use the actual numbers directly in your edits.
new_middlewares:
- name: enforce_concrete
  hook: before_model
  description: middleware that enforces use of concrete numbers from c2_mutation_engine
  implementation_py: |
    def before_model(hook_input):
        return "CRITICAL: Use concrete numerical heights (e.g., .set(1.47)) from c2_mutation_engine proposals, NOT symbolic expressions (e.g., .set(min_h*1.5)). The engine returns actual numbers like [0.82, 1.97, 0.71]. Implement with those exact values."
