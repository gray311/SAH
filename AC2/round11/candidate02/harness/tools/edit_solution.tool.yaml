type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a new pattern. Use CONCRETE numbers from c2_mutation_engine:


  - Update height values in _create_step_initializer with actual numbers (e.g., .set(1.47) not .set(min_h*1.5))


  - Target: complex new patterns (3+ levels, asymmetric, varied heights)


  - Use SEARCH/REPLACE to rewrite the _create_step_initializer method


  - Priority: Generate COMPLEX new patterns rather than small tweaks.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
