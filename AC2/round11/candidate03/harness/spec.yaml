schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization, specializing in discovering functions that maximize C₂ = ||f★f||₂² / ((∫f)²||f★f||∞).

  Current best: 1.03663 (seed program uses 13 sophisticated multi-level step patterns).

  Your mission: BEAT this by discovering NEW pattern classes or substantially improving existing ones.

  Critical insight: The seed's patterns are locally optimized. Small mutations won't help. You MUST:

  1. ANALYZE the current pattern heights and structure to understand what makes them work

  2. Use pattern_mutator to generate mathematically-grounded mutation candidates for the SAME pattern class (don't jump to entirely new architectures - refine working patterns first)

  3. After exhausting improvements in a pattern class, then explore completely new pattern types

  4. Use probe_solution sparingly - this task's evaluator is sensitive to numerical precision. Focus on diverse, well-separated variants.

  Strategy:

  - Call pattern_mutator ONCE at start to get initial mutation proposals

  - Each iteration: ask pattern_mutator for 2-3 mutations, test with evaluate_solution

  - Track which MUTATION TYPE improves (e.g., "asymmetric_height_variation", "expanded_width", "center_of_mass_shift")

  - When a mutation type works, generate more variants of that type

  - Only after trying multiple mutation types fail, then try entirely new architectures

  Failure modes to avoid:

  - X: Making tiny parameter tweaks that don't change the function meaningfully

  - X: Jumping to new architectures without first exhausting improvements in current pattern

  - X: Overfitting to one successful mutation type without trying alternatives'
skill_description: Mathematically-grounded pattern mutation for C₂ maximization. Use pattern_mutator to analyze current patterns and generate improved variants within the same pattern class. Focus on systematic refinements before exploring entirely new architectures.
skill_body: '# C₂ Maximizer: Systematic Pattern Mutation Protocol

  ## Core Principle

  Don''t jump to entirely new architectures. The seed''s 13 step patterns work - refine them systematically. Use pattern_mutator to generate mathematically-informed mutations.

  ## Phase 1: Initial Analysis (first iteration)

  1. Call pattern_mutator ONCE to analyze current best pattern and get mutation proposals

  2. Understand the pattern class (number of levels, height distribution, spacing)

  3. Note: pattern_mutator will categorize your current pattern and suggest mutation types

  ## Phase 2: Systematic Mutation

  Generate mutations in this order of sophistication:


  **Mutation Type 1: Height Perturbation**

  - Slightly adjust peak heights (±0.05-0.15) to optimize the L2/∞ ratio
  - Try one high peak increased, others decreased (and vice versa)

  **Mutation Type 2: Width Expansion/Contraction**

  - Expand or contract specific intervals by 5-10%
  - Expanding the "core" interval often increases ||f★f||₂² without increasing ||f★f||∞

  **Mutation Type 3: Center of Mass Shift**

  - Shift the entire pattern left or right by 2-3% of the domain
  - Can break symmetry and reduce constructive interference

  **Mutation Type 4: Asymmetric Height Variation**

  - Take a symmetric pattern and make heights asymmetric (e.g., 1.40, 1.45, 1.35)
  - Breaking exact symmetry can improve the ratio

  **Mutation Type 5: Intermediate Level Adjustment**

  - For multi-level patterns, adjust intermediate levels
  - Try: increase the "wings" relative to the "core"

  ## Phase 3: Exploration Strategy

  1. For each mutation type, generate 2-3 concrete implementations
  2. Evaluate each with evaluate_solution (probe is unreliable)
  3. Track which mutation TYPE improves
  4. If a mutation type works: generate more variants in that class
  5. If all mutations fail for a pattern class: try the next mutation type
  6. Only after trying 3-4 mutation types without success, consider new architectures

  ## Phase 4: Architecture Exploration (last resort)

  If all mutation types exhaust on current pattern:

  - Generate entirely new pattern classes (asymmetric multi-peaks, smooth transitions)
  - But only AFTER exhausting refinements of current working patterns

  Key: Systematic refinement beats random exploration. One mutation at a time.'
tool_descriptions:
  edit_solution: 'Modify the EVOLVE-BLOCK to implement a pattern mutation. Target:

    - Use SEARCH/REPLACE to adjust heights, widths, or positions of existing steps

    - Start with small perturbations (±0.05-0.15 on heights, ±5-10% on widths)

    - For "asymmetric" mutations, change heights to be slightly unequal (e.g., 1.40 → 1.40, 1.48, 1.32)

    - For "width" mutations, change interval boundaries by 5-10% (e.g., 0.25n → 0.26n)

    - For "center shift", adjust all start/end points by a constant offset'
  evaluate_solution: 'Full evaluation. Returns combined_score. Call ONCE per mutation variant.

    Budget: 30 evals total. Each eval tests one concrete mutation - ensure it''s ready to test.'
  probe_solution: 'Approximate score on subsampled data. SKIP for this task.

    This task''s evaluator is numerically sensitive. Probe scores are unreliable and will mislead you.

    Call evaluate_solution directly for each variant. You have 30 evals - use them wisely, not precisely.'
  finish: Report the best C₂ achieved and the mutation type that produced it.
sampling:
  temperature: 0.25
  top_p: 0.80
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 20000
new_tools:
- name: pattern_mutator
  description: |
    Analyze the current step pattern and generate 3-5 mathematically-informed mutation proposals.
    Call once at start, then again when improvement stalls. Focus on: (1) height perturbation,
    (2) width expansion/contraction, (3) center of mass shift, (4) asymmetric variation,
    (5) intermediate level adjustment. Returns concrete height/width changes for the solver.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import re
        prog = ctx.get_program()
        if "# EVOLVE-BLOCK" not in prog:
            return {"note": "no evolve block", "proposals": []}
        
        # Extract all height values and their contexts from patterns like f.at[...].set(1.42)
        height_matches = re.findall(r'\\.set\\((\\d+\\.\\d+)\\)', prog)
        height_matches += re.findall(r'set\\((\\d+\\.\\d+)\\)', prog)  # Alternative format
        heights = [float(h) for h in height_matches if h and h.replace('.','').isdigit() or re.match(r'^\\d+\\.\\d+$', h)]
        
        if not heights:
            return {"note": "could not parse heights", "proposals": []}
        
        # Analyze pattern characteristics
        avg_h = sum(heights) / len(heights)
        std_h = (sum((h - avg_h)**2 for h in heights) / len(heights)) ** 0.5
        min_h = min(heights)
        max_h = max(heights)
        h_range = max_h - min_h
        h_variance = std_h / avg_h if avg_h > 0 else 0
        
        # Categorize current pattern
        num_levels = len(heights)
        pattern_type = "unknown"
        if h_range < 0.1:
            pattern_type = "nearly_uniform"
        elif h_range < 0.3:
            pattern_type = "moderate_variation"
        else:
            pattern_type = "high_variation"
        
        # Generate mutation proposals
        proposals = []
        
        # Proposal 1: Height perturbation (increase one peak, decrease others)
        peak_idx = heights.index(max_h) if heights else 0
        proposals.append({
            "mutation_type": "height_perturbation",
            "description": "Increase main peak by 0.08, decrease others by 0.04 to optimize L2/∞ ratio",
            "changes": {
                "peak_increase": 0.08,
                "others_decrease": 0.04,
                "target_indices": [peak_idx],
                "affected_count": 1
            },
            "rationale": "Higher peak increases ||f★f||₂²; decreasing side peaks reduces potential ||f★f||∞ spikes"
        })
        
        # Proposal 2: Width expansion on core interval
        proposals.append({
            "mutation_type": "width_expansion",
            "description": "Expand the central interval by 8% to increase convolution support",
            "changes": {
                "target": "central_interval",
                "expansion_fraction": 0.08,
                "expected_effect": "increases_L2_norm"
            },
            "rationale": "Wider core increases overlap region in convolution, boosting L2 norm without necessarily increasing infinity norm"
        })
        
        # Proposal 3: Center of mass shift
        proposals.append({
            "mutation_type": "center_shift",
            "description": "Shift all interval boundaries right by 0.02 (2% of domain)",
            "changes": {
                "shift_direction": "right",
                "shift_fraction": 0.02,
                "all_intervals": True
            },
            "rationale": "Breaking perfect symmetry can reduce constructive interference at certain points, lowering ||f★f||∞"
        })
        
        # Proposal 4: Asymmetric height variation
        if pattern_type in ["moderate_variation", "high_variation"]:
            proposals.append({
                "mutation_type": "asymmetric_variation",
                "description": "Make heights asymmetric: apply +6% to some, -4% to others",
                "changes": {
                    "asymmetry_direction": "alternating",
                    "perturbation_positive": 0.06,
                    "perturbation_negative": -0.04,
                    "apply_to": "all_levels_alternating"
                },
                "rationale": "Asymmetric patterns break exact symmetry, potentially reducing ||f★f||∞ while maintaining ||f★f||₂²"
            })
        
        # Proposal 5: Intermediate level adjustment (for multi-level patterns)
        if num_levels >= 4:
            proposals.append({
                "mutation_type": "intermediate_adjustment",
                "description": "Increase intermediate levels by 0.05, keep core peaks unchanged",
                "changes": {
                    "target": "intermediate_levels",
                    "increase_amount": 0.05,
                    "preserve": "main_peaks"
                },
                "rationale": "Higher intermediate levels increase convolution support without dominating the infinity norm"
            })
        
        return {
            "analysis": {
                "num_levels": num_levels,
                "avg_height": avg_h,
                "height_range": h_range,
                "pattern_type": pattern_type,
                "std_dev_ratio": h_variance
            },
            "proposals": proposals
        }
new_skills:
- name: systematic-mutation-protocol
  description: Systematic approach to refining existing patterns. Generate mutations, evaluate, and iterate before exploring new architectures.
  body: '# Systematic Mutation Protocol for C₂ Maximization

  ## Overview

  Don''t jump to entirely new architectures. The seed''s patterns work - refine them systematically using pattern_mutator.

  ## Mutation Types (in order of preference)

  ### 1. Height Perturbation
  - Increase one peak by 0.08-0.10
  - Decrease all other peaks by 0.04-0.06
  - Rationale: High peak boosts L2 norm; lower sides reduce infinity norm risk

  ### 2. Width Expansion
  - Expand the central/core interval by 5-10%
  - Keep other intervals unchanged
  - Rationale: Wider core increases convolution overlap, boosting L2 norm

  ### 3. Center of Mass Shift
  - Shift all interval boundaries right or left by 0.01-0.03 (1-3%)
  - Apply uniformly to all intervals
  - Rationale: Breaks perfect symmetry, can reduce constructive interference

  ### 4. Asymmetric Variation
  - Apply +6% to half the levels, -4% to the other half
  - Alternating pattern or based on position
  - Rationale: Asymmetry breaks exact symmetry, may reduce ||f★f||∞

  ### 5. Intermediate Level Adjustment
  - Increase intermediate levels by 0.05-0.08
  - Keep main peaks unchanged
  - Rationale: Higher intermediates increase convolution support without dominating infinity norm

  ## Execution Strategy

  1. Call pattern_mutator once at start
  2. Pick first proposal, implement with edit_solution
  3. Evaluate with evaluate_solution
  4. If improvement: generate more variants of that mutation type
  5. If no improvement after 2-3 variants: try next mutation type
  6. Only after trying 3-4 mutation types without success, explore new architectures

  ## Key Principle

  Systematic refinement > random exploration. Exhaust the current pattern''s potential before abandoning it.'
new_middlewares:
- name: mutation_cycle_reminder
  hook: before_model
  description: Middleware that reminds the solver to follow the systematic mutation cycle
  implementation_py: |
    def before_model(hook_input):
        return "Follow the mutation cycle: (1) Get mutation from pattern_mutator, (2) Implement ONE mutation with edit_solution, (3) Evaluate with evaluate_solution, (4) Repeat with same mutation type until no improvement, (5) Then try next mutation type. Don''t switch types mid-stream."
- name: diversity_enforcement
  hook: before_model
  description: Middleware that enforces trying different mutation types if stuck
  implementation_py: |
    def before_model(hook_input):
        return "If you''ve tried 2+ variants of the same mutation type without improvement, try a DIFFERENT mutation type next. Explore the full set before concluding a pattern class is exhausted."
