type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a new pattern. Replace or extend the _create_step_initializer
  method with code synthesized by pattern_synth.


  Target architectures:

  - Asymmetric multi-peaked functions (3-5 peaks, unequal heights)

  - Smooth transition patterns (exponential/quadratic between steps)

  - Irregular step placements (non-uniform interval widths)

  - Bi-modal or tri-modal distributions


  Use SEARCH/REPLACE to rewrite the pattern definition section.

  Ensure f(x) >= 0 and all constraints are satisfied.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
