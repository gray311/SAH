type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK with a SMALL, targeted parameter change. Focus on ONE pattern class
  and vary ONE parameter at a time. Example: change a peak height from 1.40 to 1.42, or shift an interval
  from 0.25*n to 0.24*n. Keep edits minimal and focused.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
