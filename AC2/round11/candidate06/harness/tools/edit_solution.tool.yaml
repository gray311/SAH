type: tool
name: edit_solution
description: 'Make ONE focused refinement to a step pattern.


  Choose one existing pattern (likely idx 2-12) and modify exactly ONE thing:

  - Change one peak height by ±0.05 to ±0.15

  - Shift one interval boundary by ±2-5%

  - Make one pair of symmetric peaks asymmetric

  - Adjust one peak width by ±2-5%


  DO NOT modify multiple parameters. DO NOT create new pattern architectures.


  Success: Small, incremental improvement that can be built upon.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
