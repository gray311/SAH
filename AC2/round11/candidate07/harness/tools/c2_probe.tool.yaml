type: tool
name: c2_probe
description: 'Fast approximate C2 scoring. Computes ||f★f||₂² / ((∫f)²||f★f||∞) on a subsampled grid (80
  points) in ~10ms.

  Uses separate budget of 30 probes (independent of 30 full evaluations). Scores are approximate but preserve

  relative ordering well enough to filter 10-20 candidates. Call c2_probe on multiple variants, keep the
  top 2-3,

  then call evaluate_solution on those. This enables rapid exploration that full evaluations alone cannot
  support.

  Not ideal for: Final certification (use evaluate_solution for that).'
