type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a new pattern. Target:

  - Entirely new step configurations with different heights/positions

  - Pattern classes: asymmetric multi-peaks, spline-like transitions, irregular structures

  - Use SEARCH/REPLACE to rewrite the _create_step_initializer method

  Priority: Generate COMPLEX new patterns (3+ levels, asymmetric, varied heights) rather than small

  tweaks. After editing, call c2_probe before calling evaluate_solution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
