type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a new pattern. Use patterns generated by arithmetic_pattern_generator.


  Priority: Generate COMPLETE patterns with 3-7 distinct levels using exact height ratios and positions
  from the generator.


  Target: Entirely new step configurations with specific mathematical constructions.


  Use SEARCH/REPLACE to rewrite the _create_step_initializer method.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
