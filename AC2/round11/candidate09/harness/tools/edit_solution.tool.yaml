type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to tune parameters of an existing step pattern.


  Target changes:

  - HEIGHT adjustments: ±0.02 to ±0.10 per step

  - WIDTH adjustments: shift boundaries by ±2% to ±5% of interval


  Method:

  - Use SEARCH/REPLACE on the _create_step_initializer method

  - Change numbers in f.at[...].set(XX.XX) calls

  - Change interval calculations like int(0.25*n) to int(0.27*n)


  Do NOT change:

  - Number of steps or pattern structure

  - Use softplus/exponential (the codebase only does hard steps)


  Priority: Small, plausible tweaks that could improve C₂. Test one variant, learn, refine.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
