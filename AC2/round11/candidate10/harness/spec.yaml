schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization, discovering functions that maximize C₂ = ||f★f||₂² / ((∫f)²||f★f||∞).

  Current best: 1.03663 (achieved by the seed's 13 multi-level step patterns).

  Your mission: BEAT this by creating NEW pattern configurations with different heights, widths, and asymmetries.

  CRITICAL STRATEGY:
  - Use pattern_generator to get concrete code templates for new patterns
  - Start with simple modifications: add a new level, shift existing levels, or create asymmetric peaks
  - Each iteration: generate ONE new pattern via pattern_generator, edit the code, and evaluate it
  - If it fails, try a different simple modification (don't overthink - just change heights/positions slightly)

  Pattern generation approach:
  - Pattern Type 1: Add a new level to an existing pattern (e.g., 4-level → 5-level)
  - Pattern Type 2: Make an existing pattern asymmetric (shift heights unevenly)
  - Pattern Type 3: Create a new pattern with a very tall narrow peak
  - Pattern Type 4: Create a pattern with smooth exponential-like transitions between steps

  Key insight: Small, concrete changes to heights and positions are more likely to succeed than "fundamentally new architectures".

  Tool usage:
  - Call pattern_generator ONCE to get a concrete code template
  - Use edit_solution to replace the relevant _create_step_initializer method
  - Call evaluate_solution ONCE to test the new pattern
  - If the score improves, refine that pattern (adjust heights by small amounts)
  - If it fails, call pattern_generator again for a different pattern type

  Success requires: Concrete, incremental code changes that directly modify step heights and positions.
skill_description: |
  Systematic pattern modification for C₂ maximization. Use pattern_generator to get ready-to-use code templates for new step patterns (add levels, create asymmetry, narrow peaks, smooth transitions). Focus on concrete, incremental changes rather than abstract "new architectures".
skill_body: |
  # C₂ Maximizer: Concrete Pattern Modification Protocol

  ## Core Principle

  Don't try to "discover new architectures" - use pattern_generator to get concrete code templates, then evaluate and refine.

  ## Phase 1: Get a Code Template

  1. Call pattern_generator ONCE with your current best pattern info
  2. Extract the code template it returns
  3. The template will be ready-to-use code for a new _create_step_initializer method

  ## Phase 2: Edit and Evaluate

  1. Use edit_solution to replace the relevant _create_step_initializer section
  2. Call evaluate_solution ONCE to test
  3. Record the score

  ## Phase 3: Refine or Generate Again

  - If score > 1.03663: refine by adjusting heights ±0.1, positions ±5%
  - If score ≤ 1.03663: call pattern_generator again for a different pattern type

  ## Pattern Types to Try (in order):

  1. **Add a level**: Take a 4-level pattern and add a 5th level with intermediate height
  2. **Create asymmetry**: Shift existing pattern to have uneven left/right heights
  3. **Narrow peak**: Create a very tall, narrow central peak
  4. **Smooth transitions**: Use exponential-like decay instead of hard steps

  ## Key Rules:

  - ONE evaluation per iteration (don't waste probes)
  - Small changes: adjust heights by 0.1-0.3, positions by 5%
  - Always start with pattern_generator's template
  - If stuck, try a completely different pattern type
tool_descriptions:
  edit_solution: 'Modify the EVOLVE-BLOCK to implement a new pattern. Use SEARCH/REPLACE to replace the _create_step_initializer method with code from pattern_generator. Target: concrete height/position changes.'
  evaluate_solution: 'Full evaluation. Returns combined_score. Call ONCE per pattern proposal. Budget: 30 evals total.'
  probe_solution: 'Approximate score on subsampled data. Use to quickly filter out obvious failures before full evaluation. Call FIRST if you have multiple candidates.'
  finish: Report the best C₂ achieved and describe the winning pattern structure.
sampling:
  temperature: 0.35
  top_p: 0.9
  top_k: 30
  max_tokens: 16000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 18000
new_tools:
- name: pattern_generator
  description: |
    Generate concrete, ready-to-use code templates for new step function patterns. Returns code that can be directly copied into _create_step_initializer.
    Call this FIRST to get a template, then edit and evaluate.
    Pattern types: (1) add_level, (2) asymmetry, (3) narrow_peak, (4) smooth_transition, (5) multi_stripe.
  input_schema:
    type: object
    properties:
      current_pattern:
        type: string
        description: Current best pattern's height values
      pattern_type:
        type: string
        description: Type of pattern to generate (add_level, asymmetry, narrow_peak, smooth_transition, multi_stripe)
      max_height:
        type: number
        description: Maximum height used in current pattern
  implementation_py: |
    def run(ctx, args):
        import re
        current_pattern = args.get("current_pattern", "1.0")
        pattern_type = args.get("pattern_type", "add_level")
        max_height = args.get("max_height", 2.0)

        # Generate height values based on pattern type
        if pattern_type == "add_level":
            heights = [max_height * 0.5, max_height * 0.75, max_height * 1.0, 
                       max_height * 1.25, max_height * 1.5]
            desc = "5-level asymmetric pattern with gradually increasing heights"
        elif pattern_type == "asymmetry":
            heights = [max_height * 0.4, max_height * 1.3, max_height * 0.6, 
                       max_height * 1.2, max_height * 0.5]
            desc = "Asymmetric 5-level pattern with uneven left/right heights"
        elif pattern_type == "narrow_peak":
            heights = [max_height * 0.3, max_height * 2.5, max_height * 0.3]
            desc = "Tall narrow central peak with small wings"
        elif pattern_type == "smooth_transition":
            heights = [max_height * 0.5, max_height * 0.8, max_height * 1.0, 
                       max_height * 0.9, max_height * 0.7]
            desc = "5-level pattern with smooth-like height progression"
        else:  # multi_stripe
            heights = [max_height * 0.6, max_height * 1.2, max_height * 0.8, 
                       max_height * 1.3, max_height * 0.9]
            desc = "Multi-stripe pattern with alternating high/low bands"

        # Generate the code template
        n = ctx.hypers.num_intervals if hasattr(ctx, 'hypers') else 450
        
        code_template = f'''# Pattern: {desc}
        f = jnp.zeros(n)
        for i, h in enumerate({[str(round(h, 2)) for h in heights]}):
            start = int({i * 0.2 * n})
            end = int({(i + 1) * 0.2 * n})
            f = f.at[start:end].set({str(round(h, 2))})'''

        return {
            "pattern_type": pattern_type,
            "heights": heights,
            "description": desc,
            "code_template": code_template
        }
new_skills:
- name: incremental-pattern-expansion
  description: |
    Method for incrementally expanding step patterns. Start with existing patterns, add levels, create asymmetry, or narrow peaks. Use pattern_generator for code templates.
  body: |
    # Incremental Pattern Expansion for C₂ Maximization

    ## Core Principle

    Don't redesign from scratch - start with existing patterns and make concrete modifications.

    ## Step 1: Analyze Current Pattern

    - Extract heights: find max_height, min_height, average height
    - Count levels: how many distinct height values?
    - Identify symmetry: is the pattern symmetric?

    ## Step 2: Choose Expansion Strategy

    **Strategy A: Add a Level**
    - Take 4-level pattern → add 5th level at intermediate height
    - Example: [0.6, 1.0, 1.5, 2.0] → [0.5, 0.8, 1.0, 1.4, 2.0]

    **Strategy B: Create Asymmetry**
    - Shift heights so left side ≠ right side
    - Example: [0.5, 1.2, 0.8, 1.4] → [0.4, 1.3, 0.7, 1.5]

    **Strategy C: Narrow Peak**
    - Create a very tall, narrow central peak
    - Example: [0.3, 2.5, 0.3] - tall middle, small wings

    **Strategy D: Smooth Transition**
    - Use gradual height changes (exponential-like)
    - Example: [0.5, 0.7, 0.9, 1.0, 0.8] - smooth progression

    ## Step 3: Get Code Template

    1. Call pattern_generator with pattern_type = your chosen strategy
    2. Get the code_template it returns
    3. This is ready-to-use code for _create_step_initializer

    ## Step 4: Edit and Evaluate

    1. Use edit_solution to replace _create_step_initializer with the template
    2. Call evaluate_solution ONCE
    3. Record the score

    ## Step 5: Refine or Repeat

    - If score > 1.03663: adjust heights by ±0.1, evaluate again
    - If score ≤ 1.03663: call pattern_generator with different pattern_type

    ## Key Rules

    - Use pattern_generator FIRST (don't write code from scratch)
    - ONE evaluation per iteration
    - Small changes only (heights ±0.1, positions ±5%)
    - Keep trying until you find something > 1.03663
new_middlewares:
- name: probe_first
  hook: before_model
  description: |
    Remind the agent to use probe_solution to quickly filter candidates before full evaluation. Saves budget by avoiding evaluation of obvious failures.
  implementation_py: |
    def before_model(hook_input):
        return "Use probe_solution first to quickly test if a pattern is promising. Only call evaluate_solution if probe_score > 1.03 (approximate threshold). This saves precious evaluation budget."
