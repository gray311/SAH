type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a new pattern. Use SEARCH/REPLACE to replace the _create_step_initializer
  method with code from pattern_generator. Target: concrete height/position changes.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
