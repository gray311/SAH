new_middlewares:
- name: enforce_analysis_first
  hook: before_model
  description: |
    Middleware that reminds the solver to analyze before modifying. Prevents blind regeneration of the same patterns.
  implementation_py: |
    def before_model(hook_input):
        return "IMPORTANT: Call analyze_convolution_structure FIRST before any edits. Analyze the current best's convolution structure to find where ||f★f||∞ is concentrated and where ||f★f||₂² can be increased. Do NOT regenerate the same 13 seed patterns blindly."
