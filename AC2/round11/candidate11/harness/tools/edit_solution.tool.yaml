type: tool
name: edit_solution
description: "Modify the EVOLVE-BLOCK to implement a new function. Priority order:\n\n1. If the current\
  \ best is a step pattern and analyze_convolution_structure was called: \n   - Use the analysis to reconfigure\
  \ step heights and positions\n   - Target: Reduce ||f★f||∞ while maintaining/increasing ||f★f||₂²\n\n\
  2. If step patterns are failing: Switch to continuous representations\n   - Exponential decay: f(x)\
  \ = A * exp(-α|x - μ|)\n   - Quadratic spline: Piecewise quadratic with optimized breakpoints\n   -\
  \ Gaussian mixture: Sum of weighted Gaussians\n\n3. Use SEARCH/REPLACE to completely rewrite _create_step_initializer\
  \ or _objective_fn as needed\n\nConcrete parameters to adjust based on convolution analysis:\n- Height\
  \ ratios: Target 0.4:1.6:0.3:1.4:0.3 for asymmetric patterns\n- Interval positions: Shift away from\
  \ the infinity norm peak location\n- Transition smoothness: Add exponential ramps instead of hard steps"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
