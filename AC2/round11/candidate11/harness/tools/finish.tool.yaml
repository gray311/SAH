type: tool
name: finish
description: Report the best C₂ achieved, the function representation class (step, spline, exponential,
  etc.), and the key parameters that led to the best score.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
