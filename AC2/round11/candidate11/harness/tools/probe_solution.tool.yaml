name: probe_solution
description: 'Approximate score on subsampled data. LESS RELIABLE than on typical tasks due to convolution''s
  numerical sensitivity.


  Consider: For C₂ maximization, the structure matters more than the score magnitude. If two functions
  have similar structures, probe can help rank them. If structures are different, evaluate_solution is
  needed to understand which architecture is promising.'
