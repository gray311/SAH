schema: h2spec/1.0
system_prompt: |
  You are optimizing C₂ = ||f★f||₂² / ((∫f)²||f★f||∞). The seed program has 13 multi-level step patterns achieving 1.03663.
  
  CRITICAL: DO NOT try to invent entirely new pattern classes. Instead, use iterative hill-climbing on EXISTING patterns.
  
  Strategy:
  1. Pick ONE pattern from the 13 seed patterns (start with pattern 6 or 11, which have multiple levels)
  2. Make a SMALL targeted mutation: adjust ONE height parameter by ±0.05-0.1, OR shift ONE boundary by ±2-3 intervals
  3. Evaluate immediately. If improved, continue mutating the SAME pattern for 2-3 more iterations.
  4. If no improvement after 3 iterations, pick a DIFFERENT pattern and repeat.
  5. Never generate 5+ level patterns in one edit. Add complexity gradually.
  
  Why this works: Small, incremental changes are more likely to improve C₂ than radical redesigns. The seed patterns are well-optimized; perturb them carefully.
  
  Budget: 30 evals. Use 2-3 evals per pattern exploration, then switch patterns.
  
  Pattern types to start with: pattern 6 (four-level), pattern 11 (pyramid), pattern 3 (multi-level asymmetric)

skill_description: |
  Iterative hill-climbing optimization: Mutate one parameter at a time, evaluate, continue on improvement. Start from proven seed patterns, add complexity gradually. Avoid radical redesigns.
skill_body: |
  # Iterative Hill-Climbing for C₂ Optimization
  
  ## Core Principle
  Start from the 13 proven seed patterns. Make small, targeted mutations. Evaluate. Repeat on improvements.
  
  ## Phase 1: Initialize (iterations 1-2)
  1. Pick pattern 6 (four-level: heights 0.70, 1.30, 1.70, 1.00) OR pattern 11 (pyramid)
  2. Document its current heights and boundary positions
  
  ## Phase 2: Iterative Mutation (iterations 3-30)
  For EACH evaluation:
  - MUTATION A (height adjustment): Pick one height value and change by +0.05, +0.10, -0.05, or -0.10
  - MUTATION B (boundary shift): Pick one boundary and shift by +2, +3, -2, or -3 intervals (num_intervals=450)
  - MUTATION C (peak split): If a wide plateau exists, split it into two levels with a small gap
  
  Rules:
  - Change ONLY ONE parameter per edit
  - Never create patterns with >5 levels in one step
  - If C₂ improves: apply another small mutation to SAME pattern next
  - If C₂ worsens: try a different mutation on SAME pattern (don't switch patterns yet)
  - After 3 failed attempts on a pattern: pick a new pattern
  
  ## Phase 3: Escalation (only after 10+ evals on one pattern)
  If stuck with high C₂:
  - Split a plateau into 2-3 smaller levels
  - Introduce asymmetry in a symmetric pattern
  - Only then try completely new architectural features
  
  ## Key: Small steps. One change at a time. Learn from each evaluation before moving on.
tool_descriptions:
  edit_solution: |
    Make ONE small, targeted change to a step pattern:
    - Height adjustment: Modify ONE .set(value) to change value by ±0.05-0.1
    - Boundary shift: Modify ONE [start:end] to shift start or end by ±2-3 intervals
    - NEVER edit all heights or create 5+ levels in one edit
    - Stay within [0.5, 2.5] for heights to maintain numerical stability
    - Pattern 6 or 11 are good starting points
  evaluate_solution: |
    Full evaluation. Returns combined_score. Each eval tests ONE mutation.
    Use results to decide next mutation direction.
  probe_solution: |
    UNRELIABLE for this task. Skip probe. Always use evaluate_solution.
  finish: |
    Report best C₂ and which seed pattern served as the base.
sampling:
  temperature: 0.35
  top_p: 0.9
  top_k: 30
  max_tokens: 14336
agent:
  max_iterations: 65
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
