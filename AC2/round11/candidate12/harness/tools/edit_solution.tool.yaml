type: tool
name: edit_solution
description: 'Make ONE small, targeted change to a step pattern:

  - Height adjustment: Modify ONE .set(value) to change value by ±0.05-0.1

  - Boundary shift: Modify ONE [start:end] to shift start or end by ±2-3 intervals

  - NEVER edit all heights or create 5+ levels in one edit

  - Stay within [0.5, 2.5] for heights to maintain numerical stability

  - Pattern 6 or 11 are good starting points'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
