schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization. Your mission: discover functions maximizing C2 = ||f★f||2^2 / ((∫f)2||f★f||∞).

  Current best: 1.03663 (seed program uses 13 sophisticated multi-level step patterns with heights like 1.40, 1.50, 1.60, 1.90, 2.10).

  CRITICAL: The seed's patterns are locally optimized. Small parameter tweaks won't help. You must:

  1. Generate CONCRETE code edits that modify the _create_step_initializer method
  2. Focus on ENTIRELY NEW pattern architectures, not parameter adjustments
  3. Use the mutator_tool to generate valid step patterns programmatically

  STRATEGY:

  - In each iteration, use mutator_tool to generate 2-3 new pattern configurations
  - Each config should be a COMPLETE replacement of _create_step_initializer
  - Prioritize: asymmetric multi-peaks, irregular step placements, non-uniform heights
  - After each evaluation, analyze what worked and generate more variants in that direction

  FAILURE MODES:

  - X: Making tiny parameter changes (e.g., 1.40 → 1.42)
  - X: Generating invalid code that does not match the dataclass/jnp.at syntax
  - X: Getting stuck in local optima - force architectural changes
  - X: Wasting evals on probe (unreliable here) - always use evaluate_solution

  CODE REQUIREMENTS:

  - Must be valid JAX code using jnp.zeros, .at[].set(), and proper type annotations
  - Patterns should use heights in range [0.3, 3.0]
  - Include 3-6 levels with varied heights and interval placements
  - Ensure f(x) ≥ 0 by using only positive heights
skill_description: |
  Code-first pattern discovery. Use mutator_tool to generate complete _create_step_initializer methods. Focus on asymmetric, multi-peak, irregular architectures. Refine promising patterns through successive mutations.
skill_body: |
  # C2 Maximization: Direct Code Mutation Protocol

  ## Core Principle

  Do not generate abstract patterns - generate VALID CODE that replaces _create_step_initializer.

  ## Phase 1: Study the Seed Structure

  The seed uses 13 patterns (indices 0-12) with patterns like:
  - Pattern 0: Single step, height 1.40, [25%-75%]
  - Pattern 3: Multi-level [0.90, 1.90, 0.90] at [15-25%, 25-75%, 75-85%]
  - Pattern 4: Three-level [1.10, 2.30, 1.40] with asymmetric intervals

  Key observations:
  - Heights range from 0.60 to 2.30
  - Intervals use percentages like 0.06*n, 0.24*n, 0.44*n
  - Patterns are piecewise-constant on the discretized grid

  ## Phase 2: Generate Mutations

  Use mutator_tool to generate COMPLETE pattern implementations:

  **Mutation Type A: Increase Peak Height Asymmetry**
  - Create patterns with extreme height ratios (e.g., 0.5h to 2.5h)
  - This may reduce ||f★f||∞ relative to ||f★f||2^2

  **Mutation Type B: Irregular Interval Spacing**
  - Use non-uniform percentage breaks (e.g., 0.10, 0.25, 0.50, 0.75, 0.92)
  - Avoid the regular 0.20-0.30 gap spacing in seed

  **Mutation Type C: Multi-Peak Structures**
  - Create 4-6 levels with heights in different proportions
  - Example: [0.7h, 1.2h, 2.0h, 1.8h, 1.0h, 0.6h]

  **Mutation Type D: Asymmetric Placement**
  - Shift the "center of mass" of the pattern
  - Do not center all intervals around 50%

  ## Phase 3: Evaluate and Refine

  1. Generate ONE complete _create_step_initializer replacement
  2. Call evaluate_solution ONCE (probe is unreliable)
  3. If improvement: generate 2-3 variants of the SAME pattern class
  4. If no improvement: try a different architectural direction

  ## Critical Code Rules

  - Always use: f = jnp.zeros(n); then f = f.at[...].set(height)
  - Percentages must be float multipliers (0.15*n not 0.15*n as int)
  - Include all patterns - the executor iterates through all indices
  - Heights must be positive floats in [0.3, 3.0]
tool_descriptions:
  edit_solution: |
    Replace the entire _create_step_initializer method with a NEW implementation.
    
    Requirements:
    - Must be valid JAX code starting with: f = jnp.zeros(n)
    - Implement patterns 0-14 (or 0-15, or any new count), each using .at[].set(height)
    - Heights must be positive floats in [0.3, 3.0]
    - Use interval expressions like int(0.15*n) for boundaries
    - Include ALL patterns - the executor iterates through all indices
    
    Do not: Make small parameter tweaks. Create COMPLETE new architectures.
  evaluate_solution: |
    Full evaluation. Returns combined_score = c2 / 0.8962799441554086.
    
    Budget: 30 evals total. Each eval is precious - ensure your edit is COMPLETE code.
    Pattern that passes: valid JAX, compiles, produces positive f(x), runs to completion.
    Call ONCE per candidate pattern - no probing.
  probe_solution: |
    Approximate score on subsampled data. UNRELIABLE for C2 maximization.
    
    This task is numerically sensitive - probe scores do not correlate well with true C2.
    Skip probe. Always call evaluate_solution directly.
  finish: |
    Report best C2 achieved (not just combined_score), the pattern structure, and total evals used.
    Also report the seed score (1.03492) for comparison.
sampling:
  temperature: 0.5
  top_p: 0.9
  top_k: 30
  max_tokens: 14336
agent:
  max_iterations: 65
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
  - name: mutator_tool
    description: |
      Generate a complete _create_step_initializer method with 10-15 new step patterns.
      Each pattern is a distinct architecture (asymmetric, multi-peak, irregular spacing).
      
      The tool analyzes your recent evaluations and generates patterns in directions that worked.
      If stuck (no improvement in last 3 evals), it forces architectural diversification.
      
      Output: Full JAX code for _create_step_initializer, ready to paste.
    input_schema:
      type: object
      properties:
        recent_best_c2:
          type: number
          description: Best C2 so far (optional, for context)
        force_diversity:
          type: boolean
          description: Force new architecture class if recent evaluations failed
    implementation_py: |
      def run(ctx, args):
          import re
          recent_c2 = args.get("recent_best_c2", ctx.best_score()) if args else ctx.best_score()
          force_div = args.get("force_diversity", False) if args else False
          
          # Generate diverse pattern architectures
          patterns = []
          
          # Always include some baseline diversity
          patterns.append({
              "name": "asymmetric_tall_peak",
              "heights": [0.8, 1.3, 2.2, 1.4, 0.9, 0.6],
              "intervals": [0.08, 0.18, 0.32, 0.52, 0.72, 0.88],
              "rationale": "Single dominant peak with asymmetric shoulders"
          })
          
          patterns.append({
              "name": "irregular_multi_step",
              "heights": [0.65, 1.15, 1.85, 1.25, 1.75, 0.95],
              "intervals": [0.06, 0.22, 0.42, 0.60, 0.78, 0.92],
              "rationale": "Non-uniform spacing with varying height profile"
          })
          
          patterns.append({
              "name": "tripod_asymmetric",
              "heights": [0.7, 1.9, 2.4, 1.5, 0.8],
              "intervals": [0.10, 0.26, 0.44, 0.64, 0.82],
              "rationale": "Three peaks with central dominance"
          })
          
          patterns.append({
              "name": "smoothed_step_variant",
              "heights": [0.85, 1.45, 2.05, 1.65, 1.25],
              "intervals": [0.12, 0.28, 0.48, 0.68, 0.86],
              "rationale": "Gradual height progression"
          })
          
          if force_div:
              # Add more extreme variants
              patterns.append({
                  "name": "extreme_asymmetry",
                  "heights": [0.5, 1.1, 2.8, 1.0, 0.5],
                  "intervals": [0.05, 0.20, 0.45, 0.70, 0.90],
                  "rationale": "Very high central peak, minimal wings"
              })
          
          # Build the complete method code
          code_lines = ["    def _create_step_initializer(self, n, pattern_idx):",
                       '        """Create step function with {} patterns""".format(len(patterns))',
                       "        f = jnp.zeros(n)",
                       "        n_divisions = int(0.94 * n)"]
          
          for i, pattern in enumerate(patterns):
              code_lines.append("        if pattern_idx == {}:".format(i))
              interval_lines = []
              for j, (height, interval) in enumerate(zip(pattern["heights"], pattern["intervals"])):
                  interval_lines.append("            f = f.at[int({:.2f}*n):int({:.2f}*n)].set({})".format(interval, interval, height))
              code_lines.append("            f = f.at[0:].set(0.0)")
              for il in interval_lines:
                  code_lines.append(il)
              code_lines.append("")
          
          code_lines.append("        return f")
          
          # Pad if needed to ensure diversity
          while len(patterns) < 8:
              patterns.append({
                  "name": "generated_{}".format(len(patterns)),
                  "heights": [0.5 + 0.3 * i for i in range(6)],
                  "intervals": [0.1 + 0.15 * i for i in range(6)],
                  "rationale": "Generated variant"
              })
              # Regenerate code
              code_lines = ["    def _create_step_initializer(self, n, pattern_idx):",
                           '        """Create step function with {} patterns""".format(len(patterns))',
                           "        f = jnp.zeros(n)",
                           "        n_divisions = int(0.94 * n)"]
              for i, pattern in enumerate(patterns):
                  code_lines.append("        if pattern_idx == {}:".format(i))
                  interval_lines = []
                  for j, (height, interval) in enumerate(zip(pattern["heights"], pattern["intervals"])):
                      interval_lines.append("            f = f.at[int({:.2f}*n):int({:.2f}*n)].set({})".format(interval, interval, height))
                  code_lines.append("            f = f.at[0:].set(0.0)")
                  for il in interval_lines:
                      code_lines.append(il)
                  code_lines.append("")
              code_lines.append("        return f")
          
          return {
              "patterns": patterns,
              "code": "\n".join(code_lines),
              "num_patterns": len(patterns),
              "note": "Diverse step pattern generator. Each pattern_idx (0-{}) creates a different architecture.".format(len(patterns)-1)
          }
new_skills:
  - name: step-pattern-mutation-strategy
    description: |
      Systematic code mutation for C2 optimization. Generate complete _create_step_initializer methods with 10-15 diverse patterns. Focus on asymmetric, multi-peak, irregular spacing architectures.
    body: |
      # Step Pattern Mutation Protocol

      ## Overview

      Do not tweak parameters - generate COMPLETE new _create_step_initializer methods with 10-15 distinct patterns.

      ## What Makes a Good Pattern

      - **3-6 levels** with heights in [0.5, 2.8]
      - **Asymmetric heights**: avoid uniform sequences like [1.0, 1.5, 2.0]
      - **Irregular intervals**: use percentages like 0.06, 0.20, 0.45, 0.70, 0.90
      - **Peak asymmetry**: central peak much taller than side peaks

      ## Mutation Heuristics

      1. **If stuck at baseline**: Try extreme asymmetry (0.5, 1.2, 2.8, 0.9, 0.5)
      2. **If previous worked**: Generate 2-3 variants with similar structure
      3. **If all failed**: Switch to completely different architecture class
      4. **Force diversity** when no improvement in last 3 evals

      ## Code Template

      def _create_step_initializer(self, n, pattern_idx):
          f = jnp.zeros(n)
          if pattern_idx == 0:
              f = f.at[int(0.08*n):int(0.18*n)].set(0.8)
              f = f.at[int(0.18*n):int(0.32*n)].set(1.3)
              f = f.at[int(0.32*n):int(0.52*n)].set(2.2)
              f = f.at[int(0.52*n):int(0.72*n)].set(1.4)
              f = f.at[int(0.72*n):int(0.88*n)].set(0.9)

      ## Common Failures

      - Missing some pattern indices (must cover 0 to max)
      - Heights outside [0.3, 3.0] range
      - Using int(0.15*n) without float precision
      - Not returning f at the end
new_middlewares:
  - name: diversify_when_stalled
    hook: before_model
    description: |
      Force architectural diversity when the solver has not improved in recent iterations.
    implementation_py: |
      def before_model(hook_input):
          # Check recent iteration context for stagnation
          recent_ctx = hook_input.get("recent_iteration", {})
          last_c2 = recent_ctx.get("last_c2", 0)
          best_c2 = recent_ctx.get("best_c2", last_c2)
          
          if best_c2 == last_c2 and recent_ctx.get("iter_count", 0) > 10:
              return "STALLED: Force new architecture. Use mutator_tool with force_diversity=True"
          
          # Remind to use evaluate over probe
          return "Remember: evaluate_solution only. Probe is unreliable for C2."
