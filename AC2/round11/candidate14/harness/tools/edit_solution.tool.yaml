type: tool
name: edit_solution
description: 'Modify ONE pattern by ONE small change:

  - Change one height by ±10% (e.g., 1.40 → 1.54)

  - Shift one interval by ±5% of domain width

  - Recombine heights from one pattern with structure from another


  DO NOT: rewrite the entire _create_step_initializer method or create >15 levels.

  Target specific lines like `f.at[int(0.25*n):int(0.75*n)].set(1.40)` and edit just that height/interval.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
