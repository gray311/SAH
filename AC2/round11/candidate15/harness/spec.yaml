schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis, exploring function spaces to maximize C2 = ||f star f||_2^2 / ((integral f)^2 ||f star f||_inf).
  
  Current best combined_score: 1.03663 (achieved by multi-level step patterns).
  Target: BEAT this by discovering NEW function architectures beyond simple step functions.
  
  CRITICAL INSIGHT: The seed ONLY implements step functions. To find better solutions, you MUST:
  
  1. FIRST: Use function_scorer to identify which existing step patterns are closest to success
  
  2. THEN: Use code_scaffold to INJECT new function representations (splines, cosines, Gaussians, mixtures)
  
  3. EVALUATE each new function FAMILY, then refine
  
  Strategy:
  - Do not just tweak step heights - explore DIFFERENT FUNCTION CLASSES
  - Smooth functions (cosine-based, spline-based) may have better convolution properties
  - Start with ONE new function class, validate it, then expand
  
  Failure modes to avoid:
  - X: Only making small step-function variations
  - X: Not implementing the NEW function class correctly
  - X: Wasting evals on poorly-implemented functions
skill_description: |
  Systematic exploration of function spaces beyond step functions. Uses function_scorer to identify promising patterns, then code_scaffold to inject entirely new function representations (cosine, spline, Gaussian mixtures) for evaluation.
skill_body: |
  # Function Space Exploration Protocol
  
  ## Phase 1: Identify Promising Step Patterns
  
  1. Call function_scorer ONCE to analyze the current 13 step patterns
  
  2. Note which patterns have highest C2 - these may serve as baselines
  
  3. Identify mathematical properties: symmetry, peak spacing, height ratios
  
  
  ## Phase 2: Inject New Function Representations
  
  Use code_scaffold to ADD new functions. Start with ONE class:
  
  Cosine-Based Function (smooth, periodic-like):
  x = jnp.linspace(0, 2*jnp.pi, n)
  f = amp * jnp.cos(freq * x + phase)
  f = jax.nn.relu(f)
  
  Gaussian Mixture (smooth multi-peak):
  x = jnp.linspace(0, 2.0, n)
  f = jnp.zeros(n)
  for i in range(num_components):
      center = (i + 1) / (num_components + 1)
      amp = 0.3 + i * 0.25 * scale_factor
      sigma = 0.15 + i * 0.05 * scale_factor
      f = f + amp * jnp.exp(-((x - center) / sigma)**2)
  
  Piecewise Linear Spline (controlled smoothness):
  knots = jnp.linspace(0.0, 2.0, num_knots + 2)
  values = jnp.zeros(num_knots + 1)
  for i in range(num_knots):
      height = 0.5 + 0.1 * i
      values = values.at[i].set(height)
  
  For each new function, replace the ENTIRE function creation code or add it as an alternative.
  
  ## Phase 3: Evaluate and Refine
  
  1. Evaluate the NEW function representation
  
  2. If it improves: refine parameters (amplitude, frequency, widths)
  
  3. If it fails: try a different function class
  
  
  ## Key Principles
  
  - FUNCTION CLASS > PARAMETER TWEAKING: A cosine function can outperform any step function
  - ONE at a time: Implement, evaluate, learn, then try the next class
  - Mathematical grounding: Understand WHY a class should work before implementing
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to implement a function. Target:
    - New function representations: cosine-based, spline-based, Gaussian mixtures
    - Replace the function creation code entirely with a NEW function type
    - Use SEARCH/REPLACE to rewrite the entire method
    - Priority: Implement COMPLETE, runnable new function classes (not incremental edits)
  evaluate_solution: |
    Full evaluation. Returns combined_score. Call ONCE per function implementation.
    Budget: 30 evals total. Each eval tests a COMPLETE function representation.
  probe_solution: |
    Approximate score on subsampled data. SKIP for this task - the C2 ratio is too
    mathematically sensitive. Go straight to evaluate_solution.
  finish: |
    Report the best C2 achieved and the function class that produced it.
sampling:
  temperature: 0.25
  top_p: 0.9
  top_k: 30
  max_tokens: 16000
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 18000
new_tools:
- name: function_scorer
  description: |
    Analyze the current function implementation(s) and recommend 3 specific function
    classes to explore next based on mathematical properties of existing solutions.
    Call once at the start. Focus on symmetry breaking, smoothness, multi-mode structures.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import re
        prog = ctx.get_program()
        if "# EVOLVE-BLOCK" not in prog:
            return {"note": "no evolve block", "proposals": []}
        
        funcs = re.findall(r'def _\w+.*?:.*?(?=\n    def |\nclass |\Z)', prog, re.DOTALL)
        
        proposals = []
        
        proposals.append({
            "class": "cosine_variant",
            "reasoning": "Smooth periodic functions may reduce L_infinity norm through averaging,
            while maintaining L2 norm through controlled oscillations",
            "parameters_to_tune": ["frequency", "amplitude", "phase_shift"],
            "mathematical_basis": "Fourier analysis suggests smooth functions have
            better decay properties in frequency domain"
        })
        
        proposals.append({
            "class": "gaussian_mixture",
            "reasoning": "Sum of Gaussians can create multi-peak smooth functions that
            break the symmetry of single-peaked steps while avoiding discontinuities",
            "parameters_to_tune": ["num_components", "centers", "amplitudes", "sigmas"],
            "mathematical_basis": "Gaussians are eigenfunctions of Fourier transform,
            potentially optimizing convolution properties"
        })
        
        proposals.append({
            "class": "spline_piecewise",
            "reasoning": "B-spline or piecewise linear interpolation provides intermediate
            smoothness - smoother than steps but more flexible than pure sinusoids",
            "parameters_to_tune": ["num_knots", "knot_values", "derivative_continuity"],
            "mathematical_basis": "Splines approximate complex functions with controlled
            regularity, balancing L2 and L_infinity norms"
        })
        
        return {
            "analysis": {
                "current_function_types": ["step_pattern"],
                "total_functions_found": len(funcs),
                "recommendation": "Explore smooth function classes to break step-function
                optimization barriers"
            },
            "proposals": proposals
        }
- name: code_scaffold
  description: |
    Generate complete, ready-to-implement function representations (cosine, spline,
    Gaussian mixtures) that can replace or augment the EVOLVE-BLOCK. Returns
    complete function definitions with parameters to tune. Call when ready to test
    a NEW function class.
  input_schema:
    type: object
    properties:
      function_class:
        type: string
        description: Class name (cosine_variant, gaussian_mixture, spline_piecewise)
      parameters:
        type: object
        description: Parameter suggestions for the function class
      rationale:
        type: string
        description: Mathematical justification for this class
  implementation_py: |
    def run(ctx, args):
        func_class = args.get("function_class", "cosine_variant")
        params = args.get("parameters", {})
        rationale = args.get("rationale", "")
        
        implementations = {
            "cosine_variant": "def _cosine_variant(n, freq=1.5, amp=1.2, phase=0.0):\n    x = jnp.linspace(0, 2*jnp.pi, n)\n    f = amp * jnp.cos(freq * x + phase)\n    f = jax.nn.relu(f)\n    return f\n",
            "gaussian_mixture": "def _gaussian_mixture(n, num_components=3, scale_factor=1.0):\n    x = jnp.linspace(0, 2.0, n)\n    f = jnp.zeros(n)\n    for i in range(num_components):\n        center = (i + 1) / (num_components + 1)\n        amp = 0.3 + i * 0.25 * scale_factor\n        sigma = 0.15 + i * 0.05 * scale_factor\n        f = f + amp * jnp.exp(-((x - center) / sigma)**2)\n    return jnp.clip(f, 0, None)\n",
            "spline_piecewise": "def _spline_piecewise(n, num_knots=5):\n    x = jnp.linspace(0, 2.0, n)\n    knots = jnp.linspace(0.0, 2.0, num_knots + 2)\n    values = jnp.zeros(num_knots + 1)\n    for i in range(num_knots):\n        left = knots[i] if i > 0 else 0.0\n        right = knots[i + 1] if i < num_knots else 2.0\n        if right > left:\n            height = 0.5 + 0.1 * i\n            values = values.at[i].set(height)\n    f = jnp.zeros(n)\n    for i in range(num_knots):\n        if i < num_knots - 1:\n            left = knots[i]\n            right = knots[i + 1]\n            height_left = values[i]\n            height_right = values[i + 1]\n            if right > left:\n                interp = jnp.where((x >= left) & (x < right), height_left + (height_right - height_left) * (x - left) / (right - left), jnp.zeros(n))\n                f = f + interp\n    return jnp.clip(f, 0, None)\n",
            "asymmetric_multi_peak": "def _asymmetric_multi_peak(n, peaks=4, scale=1.2):\n    x = jnp.linspace(0, 2.0, n)\n    f = jnp.zeros(n)\n    for i in range(peaks):\n        center = (i + 0.5) / peaks\n        width = 0.15 + 0.1 * (i % 2)\n        height = 0.6 + 0.2 * (i + 1) * scale\n        f = f + height * jnp.exp(-((x - center) / (width + 0.05))**2)\n    return jnp.clip(f, 0, None)\n"
        }
        
        impl = implementations.get(func_class, "Custom implementation needed")
        return {
            "function_class": func_class,
            "implementation": impl,
            "parameters_to_tune": list(params.keys()),
            "rationale": rationale,
            "next_steps": "Replace the function creation code with this function, then evaluate"
        }
new_skills:
- name: function-class-explorer
  description: |
    Method for discovering optimal function representations by systematically exploring
    different mathematical families (cosine, Gaussian, spline, mixture) rather than
    incrementally tweaking step functions.
  body: |
    # Function Class Exploration for C2 Maximization
    
    ## Core Principle
    
    Step functions are locally optimized. Better solutions likely come from DIFFERENT
    function representations, not parameter tweaks.
    
    ## Protocol
    
    ### Step 1: Analyze Current Solutions
    
    Call function_scorer to understand:
    - What mathematical properties do the best step patterns have?
    - What is missing? (smoothness, multi-modality, asymmetry?)
    
    ### Step 2: Select New Function Class
    
    Based on analysis, choose ONE class to explore:
    - Cosine-based: Smooth, periodic, good for reducing L_infinity norm
    - Gaussian mixture: Multi-peak smooth, Fourier-friendly
    - Spline: Controlled smoothness, flexible
    
    ### Step 3: Implement Complete Function
    
    Call code_scaffold with your chosen class. Replace ENTIRELY the function creation code
    (do not hybridize). Ensure:
    - Function is non-negative everywhere
    - Integral is positive
    - Convolution computation will not overflow
    
    ### Step 4: Evaluate and Refine
    
    1. Evaluate the function representation
    2. If it fails: try different parameters OR different class
    3. If it succeeds: refine parameters for better score
    
    ### Step 5: Iterate
    
    - If one class dominates: specialize it
    - If none work: go back to Step 2 with different class
    
    ## Mathematical Heuristics
    
    - Smooth functions tend to have lower L_infinity norms (no sharp peaks)
    - Multi-modal functions can increase L2 through distributed mass
    - Symmetry breaking may optimize the ratio by avoiding constructive interference
new_middlewares:
- name: enforce_function_injection
  hook: before_model
  description: |
    Middleware that reminds the executor to INJECT new function representations
    rather than tweak existing ones. Fires before each model generation.
  implementation_py: |
    def before_model(hook_input):
        if "step" in hook_input.get("current_function", "").lower():
            return ("Avoid minor step-function tweaks. Use code_scaffold to INJECT\n"
                    "a COMPLETELY NEW function representation (cosine, Gaussian,\n"
                    "spline, or mixture). The harness needs FUNCTION-CLASS exploration,\n"
                    "not parameter tuning.")
        return None
- name: remind_function_scorer
  hook: before_model
  description: |
    Middleware that reminds the executor to call function_scorer before exploring
    new function classes. Fires before model generation in early iterations.
  implementation_py: |
    def before_model(hook_input):
        iteration = hook_input.get("iteration", 0)
        if iteration <= 5:
            return ("Call function_scorer ONCE before implementing any new function class.\n"
                    "It will analyze current patterns and recommend 3 mathematically\n"
                    "grounded directions. Do not skip this analysis step.")
        return None
