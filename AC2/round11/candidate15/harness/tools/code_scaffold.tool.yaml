type: tool
name: code_scaffold
description: 'Generate complete, ready-to-implement function representations (cosine, spline,

  Gaussian mixtures) that can replace or augment the EVOLVE-BLOCK. Returns

  complete function definitions with parameters to tune. Call when ready to test

  a NEW function class.'
input_schema:
  type: object
  properties:
    function_class:
      type: string
      description: Class name (cosine_variant, gaussian_mixture, spline_piecewise)
    parameters:
      type: object
      description: Parameter suggestions for the function class
    rationale:
      type: string
      description: Mathematical justification for this class
