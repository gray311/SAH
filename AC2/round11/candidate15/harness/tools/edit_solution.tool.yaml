type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a function. Target:

  - New function representations: cosine-based, spline-based, Gaussian mixtures

  - Replace the function creation code entirely with a NEW function type

  - Use SEARCH/REPLACE to rewrite the entire method

  - Priority: Implement COMPLETE, runnable new function classes (not incremental edits)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
