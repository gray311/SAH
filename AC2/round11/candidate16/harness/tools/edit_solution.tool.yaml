type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a mutated pattern. Target:

  - Concrete, valid Python edits to the _create_step_initializer method

  - Apply ONE of these mutation types: height adjustment, position shift, width change, or wing addition

  - Use SEARCH/REPLACE to update the specific pattern code, not generate entire method


  Example: Change pattern 12''s central height from 2.10 to 2.20:

  - Find: f = f.at[int(0.40*n):int(0.60*n)].set(2.10)

  - Replace with: f = f.at[int(0.40*n):int(0.60*n)].set(2.20)


  ALWAYS use integer arithmetic for interval calculations (int(0.25*n), not 0.25*n).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
