type: tool
name: hybrid_evaluator
description: 'Run a quick approximate C₂ evaluation on a subset of convolution points to rank mutations
  before full evaluation.

  Returns estimated C₂ score and improvement flag. Call on 2-3 mutations before spending a full evaluation
  budget.

  Note: Scores are approximate and not directly comparable to full scores, but relative rankings are useful.'
input_schema:
  type: object
  properties:
    variant_code:
      type: string
      description: The full code variant to evaluate
