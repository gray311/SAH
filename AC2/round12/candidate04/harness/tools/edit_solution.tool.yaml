type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a function. You may:

  - Replace entire step pattern definitions with new function classes

  - Implement B-splines: define basis functions and compute coefficients

  - Implement Gaussian mixtures: sum of weighted Gaussians

  - Implement smoothstep: use sigmoid/softplus for smooth transitions

  - Implement piecewise polynomials: define polynomial segments with continuity

  Focus on clean, complete implementations that define f(x) over the discretization grid.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
