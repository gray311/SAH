type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a new function template or variant. Target:


  - For smooth functions: implement Gaussian mixtures with different means/variances, exponential decays
  with modulating terms

  - For multi-peak patterns: create 2-4 distinct peaks with varying heights/widths (e.g., peaks at 0.2,
  0.4, 0.6, 0.8 with heights 1.0, 1.5, 1.3, 1.2)

  - For piecewise polynomials: define cubic/quintic segments with continuity constraints

  - For asymmetric constructions: deliberately break symmetry (e.g., left side decays slower than right
  side)

  - Use SEARCH/REPLACE with explicit numerical values, not relative changes'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
