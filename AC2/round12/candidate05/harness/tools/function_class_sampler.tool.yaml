type: tool
name: function_class_sampler
description: 'Generate 5 diverse function class templates for C₂ maximization. Each template describes
  a new function architecture (not a mutation of existing steps).


  Classes to sample from:

  - Smooth functions: Gaussian mixtures, exponential decays with modulation, sigmoid-based constructions

  - Multi-peak patterns: 2-4 distinct peaks with varying heights and widths

  - Asymmetric constructions: Functions breaking left-right symmetry

  - Piecewise polynomial: Cubic/quintic segments with continuity

  - Mixed constructions: Combinations of different function types


  Each proposal includes: class name, structural description, parameter ranges, and a concrete implementation
  sketch.'
input_schema:
  type: object
  properties: {}
