type: tool
name: probe_solution
description: 'Approximate score on subsampled data. USE AGGRESSIVELY for initial screening.


  This task has 30 probe budget - use it to screen 5-10 variants quickly, then evaluate the top 2-3 with
  full evaluation.


  Probe scores are approximate but sufficient for ranking variants within a function class.


  Call probe for: (1) initial function class variants, (2) when choosing between multiple promising candidates.


  Call evaluate only for top-ranked variants (2-3 per function class max).'
