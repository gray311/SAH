schema: h2spec/1.0
system_prompt: |
  C2 optimization expert. Current best: 1.03841 via step patterns. Target: beat 0.8962799441554086.
  
  CRITICAL: With only 30 evals, maximize exploration per eval. DO NOT refine one pattern sequentially.
  
  STRATEGY: Generate 5-10 diverse function architectures per eval (narrow spikes, wide plateaus, bimodal, multi-peak, smooth curves). Submit ONE edit with ALL variants and internal selection. Call evaluate_solution ONCE per edit.
  
  Failure modes: tiny tweaks, sequential mutation generation, relying on pattern_mutator.
  
  Key: Each eval tests many architectures. Track winner, then deepen in that direction later.
skill_description: |
  Multi-variant search. Generate 5-10 diverse architectures per eval, implement all together with internal selection, evaluate once.
skill_body: |
  # Multi-Variant Search Protocol

  ## Per-Eval Strategy

  Generate 5-10 CONCRETE variants:
  1. Seed pattern variants: heights 1.4-1.8, widths at 20/30/40/60/80 percentiles
  2. New architectures: narrow spike, wide plateau, bimodal, trimodal, smooth Gaussian, polynomial decay, asymmetric

  Implementation: Define all variants, use internal argmax selection, evaluate best only.

  Iteration: If architecture A wins, next eval: 60% from class A, 40% exploratory.

  Key: BREADTH first, then DEPTH.
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK to define 5-10 variants with internal selection. Submit ONE edit testing all variants simultaneously.
  evaluate_solution: |
    Full eval of one edit (must contain multiple variants). Call ONCE per edit. Budget: 30 total.
  probe_solution: |
    SKIP. Use only evaluate_solution.
  finish: |
    Report best C2 and winning architecture type.
sampling:
  temperature: 0.6
  top_p: 0.9
  top_k: 40
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 20000
new_tools:
- name: variant_generator
  description: |
    Generate 3-5 diverse architecture specifications. Focus on architectural diversity.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import random
        random.seed(42)
        variants = []
        arch_types = ["narrow_spike", "wide_plateau", "bimodal", "trimodal", "smooth_gaussian"]
        for arch in arch_types:
            variants.append({"arch": arch, "params": {"width": 0.2 if "narrow" in arch else 0.7, "height": 1.4 if "low" in arch else 2.0}})
        variants.append({"arch": "extreme", "params": {"width": 0.15, "height": 3.0}})
        return {"variants": variants}
new_skills:
- name: broad-exploration
  description: |
    Test 5-10 diverse architectures per eval with internal selection.
  body: |
    # Broad Exploration Protocol

    ## Core Principle

    Each eval must test 5-10 diverse architectures. Don't refine one pattern.

    ## Categories

    1. Peak shapes: narrow, wide, medium
    2. Multi-peak: bimodal, trimodal, quad-modal
    3. Smooth: Gaussian, spline
    4. Asymmetric: left-skewed, right-skewed
    5. Extreme: very narrow/high/width

    ## Workflow

    1. Generate 5-10 variants across categories
    2. Implement with internal argmax selection
    3. Evaluate once, record winner's architecture class
    4. Next eval: mix 60% from winner class, 40% exploratory

    You have 30 evals = 200+ variant tests. Maximize this.
new_middlewares:
- name: diversity_reminder
  hook: before_model
  description: |
    Force diversity in each eval.
  implementation_py: |
    def before_model(hook_input):
        return "Generate 5-10 diverse architectures THIS EVAL. Test breadth, not depth. Submit multi-variant search."
