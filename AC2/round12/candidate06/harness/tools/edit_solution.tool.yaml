type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK to define 5-10 variants with internal selection. Submit ONE edit testing
  all variants simultaneously.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
