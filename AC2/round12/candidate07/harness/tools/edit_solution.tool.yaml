type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a COMPLETE structural change. Target:

  - Recombine heights/widths from different seed patterns (e.g., use peak heights from pattern 2, widths
  from pattern 7)

  - Make BIG changes (heights ±0.15-0.30, widths ±10-25%)

  - Create entirely new multi-level structures (3-5 levels)

  - Ensure the edit is COMPLETE - the code must run without errors

  - For recombination: copy and paste existing pattern structures, just change the values'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
