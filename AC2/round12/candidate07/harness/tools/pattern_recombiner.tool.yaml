type: tool
name: pattern_recombiner
description: 'Analyze the 13 seed step patterns and generate 2-3 COMPLETELY NEW pattern proposals by RECOMBINING
  elements from different patterns (not just tweaking one).


  For each proposal: (1) Take peaks/levels from 2-3 different seed patterns, (2) Create a novel 3-5 level
  structure, (3) Try asymmetric or wider-core variants.


  Returns complete, ready-to-implement patterns with heights and widths.'
input_schema:
  type: object
  properties: {}
