type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a DRASTIC structural mutation. Target: - Merge or split
  intervals to change the number of levels - Reverse the pattern (swap start/end, reverse height order)
  - Invert heights: h_new = max_height - h_old + 0.01 - Swap adjacent levels or rotate the height sequence
  - Create complementary patterns with (total_width - current_width) intervals'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
