type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a COMPLETE function definition from scratch.

  Choose a function class (spline, Gaussian mixture, Fourier, etc.) and implement: - Complete function
  definition (no references to external patterns) - Proper convolution computation with FFT - Correct
  normalization and non-negativity constraints

  Ensure the function is COMPLETE and runnable - no dependencies on undefined patterns.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
