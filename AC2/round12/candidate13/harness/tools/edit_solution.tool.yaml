type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement exactly ONE mutation. Target:

  - ONLY change one parameter (one height, one width, or one boundary) per edit

  - Use the exact SEARCH/REPLACE code provided by mutation_verifier

  - Do NOT combine multiple mutations (e.g., don''t change both height AND width)

  - After edit, call evaluate_solution to test THIS single mutation'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
