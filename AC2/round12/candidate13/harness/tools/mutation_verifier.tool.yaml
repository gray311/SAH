type: tool
name: mutation_verifier
description: 'Validate a mutation proposal before editing. Checks: (1) syntax validity of proposed edit,

  (2) semantic meaning (change is >5% of parameter range), (3) type consistency (matches requested mutation
  type).

  Returns either error message or exact SEARCH/REPLACE code for edit_solution. Call this BEFORE every
  edit.'
input_schema:
  type: object
  properties:
    mutation_type:
      type: string
    proposed_change:
      type: string
