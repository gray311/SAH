type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a pattern mutation. Target LARGE changes:


  - HEIGHT SCALING: Multiply all heights by a factor of 1.08-1.20 (e.g., 2.20 → 2.55, 1.20 → 1.32)


  - WIDTH SCALING: Change interval boundaries by 15-25% (e.g., 0.25n → 0.30n for expansion)


  - LEVEL COUNT: Add or remove a level. Example: convert 5-level [0.60, 1.20, 2.20, 1.20, 0.60] to 6-level
  by splitting one interval and adding a new height level.


  - STRUCTURAL CHANGES: Take a symmetric pattern and create a new asymmetric variant, OR take a 5-level
  pattern and create a 6-level or 4-level version.


  - CRITICAL: Changes must be SUBSTANTIAL. ±0.05 on heights and ±5% on widths are too small to escape
  local optima.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
