schema: h2spec/1.0
system_prompt: |
  You are a mathematical optimizer specializing in discovering functions that maximize C₂ = ||f★f||₂² / ((∫f)²||f★f||∞).
  
  Current best: 1.03841 (seed program uses 13 sophisticated multi-level step patterns with heights 0.60-2.30).
  
  Critical insight: The seed's patterns are near a local optimum. Small tweaks (±0.04 on heights) won't escape it.
  You MUST make BOLD changes to break free:
  
  1. Instead of one mutation type at a time, apply COMBINATIONS: e.g., (height_increase + width_expansion + center_shift) in a single edit.
  2. Target the HIGH-PEAK regime explicitly: create variants with central heights 1.75-2.10 and asymmetric wings.
  3. Use MEDIUM-BOLD changes: height adjustments of 0.10-0.20, width changes of 8-15%, not tiny 0.04 perturbations.
  4. Limit your search: evaluate only 4-6 diverse variants per attempt (not 10+), then move to a new approach.
  5. Track your best by MUTATION COMBINATION, not by individual variant.
  
  Concrete mutation combinations to try:
  - Combination A: Increase central peak by 0.15, expand central width by 10%, shift entire pattern right by 0.02
  - Combination B: Make pattern highly asymmetric: central height 2.0, left wings 0.8, right wings 1.0
  - Combination C: Two high peaks approach: 1.8 at 25%, 1.8 at 75%, with smaller wings at 8%, 12%, 18%, 24%, 30%, 70%, 85%, 92%
  
  Strategy:
  - Start with 2-3 bold combination edits (not gradual refinements)
  - Evaluate each once (use your 30 evals wisely)
  - If none improve by >0.0005, try a completely different architectural approach
  - Remember: the path to 1.05+ likely requires breaking the multi-level step paradigm entirely
skill_description: |
  Bold combination mutations for C₂ maximization. Instead of gradual single-parameter tweaks, apply coordinated changes (height+width+position together) that break out of local optima. Target high-peak regimes and asymmetric architectures.
skill_body: |
  # Bold Combination Mutation Protocol

  ## Why This Works

  The seed's 13 step patterns are near a local optimum. The C₂ landscape is extremely flat at this precision (differences of 0.0001 matter). Single-parameter tweaks can't escape. You need coordinated changes that break the optimization basin entirely.

  ## Mutation Strategy: Combinations, Not Singles

  Don't try one change at a time. Apply 3-4 coordinated mutations in a single edit:

  ### Combination Type 1: High-Peak + Width + Shift
  - Increase central peak by 0.15-0.20 (from 1.6 to 1.75-1.80)
  - Expand central interval by 10-12%
  - Shift entire pattern right by 0.02-0.03
  - Rationale: Higher peak boosts L2 norm; wider support increases overlap; asymmetry breaks perfect interference

  ### Combination Type 2: Extreme Asymmetry
  - Central peak: 2.0-2.2
  - Left wings (2 levels): 0.7, 0.9
  - Right wings (2 levels): 0.9, 1.0
  - Rationale: Breaking symmetry reduces infinity norm at expensive points while maintaining L2

  ### Combination Type 3: Double-High-Peak Architecture
  - Two prominent peaks at 25% and 75%: both 1.8-1.9
  - Four small wings: 8%, 12%, 18%, 24% at 0.7, and 85%, 92%, 94%, 96% at 0.6-0.7
  - Rationale: Multiple high peaks can beat single-peak architectures through constructive interference patterns

  ### Combination Type 4: Smooth Transition Multi-Level
  - Keep 13-level structure but with gradual height changes (not flat steps)
  - Heights: 0.65 to 0.75 to 0.85 to 0.95 to 1.1 to 1.3 to 1.5 to 1.65 to 1.8 to 1.65 to 1.5 to 1.3 to 1.1 to 0.95 to 0.85 to 0.75 to 0.65
  - Rationale: Smooth transitions might reduce high-frequency artifacts in convolution

  ## Execution Plan

  1. Attempt 1-2: Pick Combination Type 1, implement with edit_solution, evaluate once
  2. Attempt 3-4: Pick Combination Type 2, implement, evaluate once
  3. Attempt 5-6: Pick Combination Type 3 or 4, implement, evaluate once
  4. Decision: If best improvement < 0.0005, discard the entire multi-level paradigm and explore smooth functions or Fourier-space approaches
  5. Never spend 5+ evals on variants of the same combination

  ## Key Differences from Seed

  - Seed: 13 flat steps with tiny perturbations
  - You: 3-5 coordinated changes per edit, larger changes (0.15+ on heights), focus on HIGH-PEAK regime
  - Seed: 13 patterns tried sequentially
  - You: 4-6 bold combinations tried in parallel, then abandon and explore new paradigm

  ## When to Abandon Current Approach

  After 6 evals with no improvement > 0.0005 over seed, try:
  - Smooth Bell curves (Gaussian-like) with optimized sigma and amplitude
  - Piecewise-linear triangles instead of rectangles
  - Fourier-synthesis functions with 3-5 harmonics
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to implement a BOLD combination mutation.
    
    Do NOT make tiny single-parameter changes. Apply 3-4 coordinated mutations together:
    
    Examples:
    - Height increase: change a peak from 1.60 to 1.75 or 1.80 (+0.15 to +0.20)
    - Width expansion: change interval from 0.25n-0.75n to 0.23n-0.77n (expand by 8-12%)
    - Center shift: change all start points by +0.02n (2% right shift)
    - Asymmetry: change symmetric heights 0.90, 1.90, 0.90 to 0.80, 2.10, 1.00
    
    For multi-level patterns, apply changes to MULTIPLE levels simultaneously (not just one).
    For high-peak regime, ensure central peaks reach 1.75-2.10.
    
    Target: A complete new variant that combines 3-4 different changes.
  evaluate_solution: |
    Full evaluation. Returns combined_score.
    
    Budget: 30 evals total. Each edit uses ONE eval.
    
    Strategy: Evaluate only 4-6 diverse combination variants, then move to a new approach.
    Don't waste evals on similar variants.
  probe_solution: |
    Approximate score. SKIP for this task.
    
    The evaluator is numerically sensitive. Probe scores are unreliable and will mislead you.
    Call evaluate_solution directly for each variant.
  finish: |
    Report the best C₂ achieved and the combination of mutations that produced it.
sampling:
  temperature: 0.5
  top_p: 0.9
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 20000
