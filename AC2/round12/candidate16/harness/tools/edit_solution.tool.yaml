type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a BOLD combination mutation.


  Do NOT make tiny single-parameter changes. Apply 3-4 coordinated mutations together:


  Examples:

  - Height increase: change a peak from 1.60 to 1.75 or 1.80 (+0.15 to +0.20)

  - Width expansion: change interval from 0.25n-0.75n to 0.23n-0.77n (expand by 8-12%)

  - Center shift: change all start points by +0.02n (2% right shift)

  - Asymmetry: change symmetric heights 0.90, 1.90, 0.90 to 0.80, 2.10, 1.00


  For multi-level patterns, apply changes to MULTIPLE levels simultaneously (not just one).

  For high-peak regime, ensure central peaks reach 1.75-2.10.


  Target: A complete new variant that combines 3-4 different changes.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
