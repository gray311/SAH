schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization for the C2 constant:
  C2 = ||f★f||₂² / ((∫f)² ||f★f||_∞), where f: R→R is non-negative.

  Current best: 0.8962799441554086 (step function by AlphaEvolve, reported as combined_score 1.03841).

  Your mission: FIND A COMPLETELY NEW FUNCTION CLASS that beats the step-function record.

  Critical insight: The step-function solutions are LOCAL optima. To break through, you MUST explore
  DIFFERENT function architectures entirely, not just refine existing patterns.

  Strategy:
  1. FIRST: Call analyze_convolution to understand the structure of your current best solution.
     This reveals the Fourier spectrum and convolution characteristics.
  2. Based on the analysis, generate mutations that:
     - Target weak frequencies in the Fourier domain
     - Modify the shape to reduce ||f★f||_∞ while maintaining ||f★f||₂²
     - Exploit symmetries or break them strategically
  3. For each proposed mutation:
     - Call probe_solution to quickly rank (30-probe budget is YOUR ADVANTAGE!)
     - Only evaluate top candidates with evaluate_solution
  4. If stuck after 10 iterations, call analyze_convolution on the new best and try a different approach.

  Exploration Strategy:
  - Parallel exploration beats sequential refinement
  - Use probes to filter before spending full evaluations
  - After exhausting probes for a function class, try a completely new architecture

  Function constraints: f(x)>=0, ∫f>0, numerically stable convolution.

  Tools:
  - edit_solution: implement your chosen function
  - evaluate_solution: full score, budget-limited (use sparingly)
  - probe_solution: approx score on 10% subsample, 30-budget, FAST. USE THIS TO RANK BEFORE EVALUATE.
  - analyze_convolution: NEW! Analyze your best solution's convolution structure
  - generate_candidates: get diverse function proposals across multiple families
skill_description: |
  Mathematically-grounded pattern mutation for C2 maximization with structural analysis. Use analyze_convolution to understand current patterns' Fourier characteristics, then generate targeted mutations. Leverage probes for rapid filtering before full evaluation.
skill_body: |
  # C2 Maximizer: Structural Analysis and Targeted Mutation Protocol

  ## Core Principle

  Step functions achieve C2 approximately 0.8963 because their convolutions have specific spectral properties. To beat them, you need to:
  1. Understand what makes the current best work (via analyze_convolution)
  2. Find directions that reduce the denominator while increasing the numerator

  ## Phase 1: Structural Analysis (First 1-2 iterations)

  1. Call analyze_convolution ONCE on your current best solution
  2. Study the output:
     - Frequency spectrum: Where is energy concentrated?
     - Peak location: Where is the infinity norm achieved?
     - Width characteristics: How broad is the convolution?
  3. Form hypotheses about improvement directions

  ## Phase 2: Targeted Mutation Generation

  Based on your analysis, generate mutations in this priority order:

  Mutation Type A: Peak Reduction
  - If the convolution has a sharp peak, try functions with smoother transitions
  - Reduce local maxima by 5-15% in the original function

  Mutation Type B: Width Expansion
  - Expand the core region by 10-20% to broaden the convolution's main lobe
  - This can increase the L2 norm squared without significantly increasing the infinity norm

  Mutation Type C: Spectral Hole Filling
  - If analysis shows certain frequencies have low energy, add oscillatory components
  - Try multiplying the base function by one plus a cosine term

  Mutation Type D: Asymmetric Perturbation
  - Break symmetries by making heights asymmetric
  - Shift patterns left or right by 2-3% of domain

  ## Phase 3: Probe-Based Filtering

  1. Generate 3-5 mutations of the same type
  2. Call probe_solution for each (you have 30 probes)
  3. Keep only those with probe greater than current best
  4. Call evaluate_solution once per promising candidate

  ## Phase 4: Iteration and Restart

  If no improvement after 10 iterations:
  1. Call analyze_convolution on the current best
  2. Try a completely different function class

  ## Key Rule: Probes First, Evaluations Last

  - You have 30 probes and only 30 full evaluations
  - Use probes to filter five to ten mutations down to three to five promising ones
  - Never call evaluate_solution on a mutation you haven't probed first
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to implement your chosen mutation or new function class.

    Strategies:
    - For height mutations: use SEARCH/REPLACE to adjust specific step heights
    - For width mutations: change interval boundaries by 10-20%
    - For new function classes: rewrite the entire function definition
    - For asymmetric mutations: make adjacent heights unequal

    Ensure the function is non-negative and has a well-defined convolution.
  evaluate_solution: |
    Full evaluation. Returns combined_score.

    Budget: 30 evals total. Call only after probe_solution confirms the variant is promising.
    Each call tests one concrete function - ensure it is complete and valid.
  probe_solution: |
    Approximate score on 10% subsampled data. FAST and separate from evaluation budget.

    You have 30 probes. Use them to:
    1. Rank multiple mutations quickly
    2. Filter out unpromising variants before spending full evaluations
    3. Explore many directions cheaply

    Call probe_solution for each mutation variant before calling evaluate_solution.
    If probe is less than current best, skip full evaluation.
  finish: |
    Report the best C2 achieved and the function class that produced it.
sampling:
  temperature: 0.8
  top_p: 0.9
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
new_tools:
- name: analyze_convolution
  description: |
    Analyze the Fourier spectrum and convolution characteristics of your current best solution.
    Returns frequency spectrum, peak analysis, spectral gaps, and shape metrics. Use this to guide mutations.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import math
        import numpy as np
        import jax.numpy as jnp

        best_code = ctx.get_best_program()
        if not best_code or "f_values" not in best_code:
            return {"note": "No best program with f_values to analyze"}

        try:
            exec_globals = {}
            code_obj = compile(best_code, "<string>", "exec")
            code_obj(exec_globals)

            f_values = exec_globals.get("f_values")
            if f_values is None:
                return {"note": "Could not find f_values in best program"}

            if not isinstance(f_values, np.ndarray):
                f_values = np.array(f_values)

            N = len(f_values)

            padded_f = jnp.pad(f_values, (0, N))
            fft_f = jnp.fft.fft(padded_f)
            convolution = jnp.fft.ifft(fft_f * fft_f).real
            convolution_np = np.real(convolution)

            h = 1.0 / (N + 1)

            l2_norm_sq = float(np.sum((h / 3) * (convolution_np[:-1] ** 2 + convolution_np[:-1] * convolution_np[1:] + convolution_np[1:] ** 2)))
            norm_1 = float(np.sum(np.abs(convolution_np)) / (N + 1))
            norm_inf = float(np.max(np.abs(convolution_np)))

            freq_spectrum = np.abs(np.fft.fft(convolution_np))
            freq_indices = np.arange(len(freq_spectrum))
            sorted_indices = np.argsort(freq_spectrum)
            dominant_freqs = [int(i) for i in sorted_indices[-10:]]
            spectral_gaps = [int(i) for i in sorted_indices[:10]]

            peak_loc = int(np.argmax(np.abs(convolution_np)))
            peak_val = float(np.max(np.abs(convolution_np)))
            peak_width = int(np.sum(np.abs(convolution_np) > 0.5 * peak_val))
            mid = N // 2
            symmetry = float(np.mean(convolution_np[:mid])) / (np.mean(convolution_np[mid:]) + 1e-10)

            return {
                "convolution_peak_location": peak_loc,
                "peak_value": peak_val,
                "peak_width_points": peak_width,
                "num_intervals": N,
                "dominant_frequencies": dominant_freqs,
                "spectral_gaps": spectral_gaps,
                "symmetry_ratio": symmetry,
                "l2_norm_squared": l2_norm_sq,
                "norm_1": norm_1,
                "norm_inf": norm_inf,
                "suggested_mutations": [
                    "Fill spectral gaps at frequencies " + str(spectral_gaps[:5]) + " with low-amplitude oscillatory components",
                    "Consider asymmetric perturbation to break symmetry (current ratio: " + str(symmetry) + ")",
                    "Widen the function core region to broaden the convolution peak - current width: " + str(peak_width) + " points"
                ]
            }
        except Exception as e:
            import traceback
            error_msg = "Analysis failed: " + str(e) + "\n" + traceback.format_exc()
            return {"error": error_msg, "note": "Could not analyze convolution, try manually"}
new_skills:
- name: convolution-aware-mutation
  description: |
    Use convolution analysis to guide mutations. Analyze spectral gaps and peak concentration,
    then generate mutations targeting weak frequencies or reducing peak sharpness. Combine with probe-based filtering.
  body: |
    # Convolution-Aware Mutation Protocol for C2 Maximization

    ## Understanding Step-Function Optima

    Step functions achieve C2 approximately 0.8963 because their convolutions have:
    - Sharp, concentrated peaks which increase the infinity norm
    - Energy concentrated in low frequencies
    - Symmetric structure creating constructive interference

    To beat this, target:
    1. Spectral gaps: Add oscillatory components at frequencies with low energy
    2. Peak concentration: Broaden the convolution's main lobe
    3. Symmetry breaking: Introduce asymmetric features

    ## Mutation Generation from analyze_convolution Output

    After calling analyze_convolution on your best solution:

    If spectral_gaps detected (low-energy frequencies):
    - Add oscillatory component: multiply base by one plus a cosine term
    - Use amplitude 0.1 to 0.3 for subtle but effective modification
    - Try 2-3 different gap frequencies from the list

    If peak_width less than N over 4 (sharp peak):
    - Expand the core region by 15-25%
    - Change interval boundaries
    - Smooth transitions with linear ramps

    If symmetry_ratio approximately 1.0 (too symmetric):
    - Make heights asymmetric
    - Shift one side by 2-3% of domain

    ## Probe-First Workflow

    1. Call analyze_convolution once early
    2. Generate 3-5 mutations based on analysis insights
    3. Call probe_solution for each mutation
    4. Keep only mutations with probe greater than current best
    5. Call evaluate_solution once per remaining candidate
    6. If no improvement after 5 evals, re-analyze and try different mutation types

    ## Key Insights

    Small targeted mutations beat random exploration.
    Probes are your advantage: 30 probes to filter before 30 evaluations.
    Analyze early to understand convolution structure.
    Iterate by re-analyzing when stuck.
new_middlewares:
- name: probe_reminder
  hook: before_tool
  description: |
    Middleware that reminds the solver to use probes before full evaluations,
    preventing wasteful evaluation budget expenditure.
  implementation_py: |
    def before_tool(hook_input):
        tool_name = hook_input.get("tool_name", "")
        if tool_name == "evaluate_solution":
            best_score = hook_input.get("best_score", 1.0)
            evals_left = 30 - hook_input.get("evals_used", 0)
            probes_left = 30 - hook_input.get("probes_used", 0)
            return "Have you called probe_solution first? You have " + str(probes_left) + " probes to filter candidates before spending " + str(evals_left) + " evaluations. Only evaluate if probe > " + str(best_score) + "!"
        return None
- name: analyze_first_reminder
  hook: before_model
  description: |
    Middleware that reminds the solver to analyze the convolution structure early,
    enabling informed mutation strategies rather than blind exploration.
  implementation_py: |
    def before_model(hook_input):
        iteration = hook_input.get("iteration", 0)
        tools_called = hook_input.get("tools_called", [])
        if iteration <= 2 and "analyze_convolution" not in tools_called:
            return "Early in search: Call analyze_convolution to understand your best solution's structure before generating mutations. This guides targeted improvements!"
        return None
