type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement your chosen mutation or new function class.


  Strategies:

  - For height mutations: use SEARCH/REPLACE to adjust specific step heights

  - For width mutations: change interval boundaries by 10-20%

  - For new function classes: rewrite the entire function definition

  - For asymmetric mutations: make adjacent heights unequal


  Ensure the function is non-negative and has a well-defined convolution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
