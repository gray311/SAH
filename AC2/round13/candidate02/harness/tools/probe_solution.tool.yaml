type: tool
name: probe_solution
description: 'Approximate score on 10% subsampled data. FAST and separate from evaluation budget.


  You have 30 probes. Use them to:

  1. Rank multiple mutations quickly

  2. Filter out unpromising variants before spending full evaluations

  3. Explore many directions cheaply


  Call probe_solution for each mutation variant before calling evaluate_solution.

  If probe is less than current best, skip full evaluation.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
