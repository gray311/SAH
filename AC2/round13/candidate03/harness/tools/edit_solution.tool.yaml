type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a function variant. Target:


  - Use the code snippet from generate_candidates as a template

  - For refinements, make small parameter changes (5-15% on heights/widths, 10-20% on mixing weights)

  - For hybrids, combine successful elements from different families

  - Ensure f(x) >= 0 and numerical stability'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
