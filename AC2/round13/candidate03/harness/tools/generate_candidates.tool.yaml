type: tool
name: generate_candidates
description: 'Generate 4-6 diverse function proposals across DIFFERENT mathematical families.


  Call this:

  - At iteration 1 to start exploration

  - When stuck (after failed evaluations on current family)

  - When you want to try families you haven''t explored


  Families available:

  - Gaussian mixtures (smooth, multi-peaked)

  - B-spline basis (flexible smooth transitions)

  - Piecewise-linear (controlled smoothness)

  - Oscillatory with decay (structured convolutions)

  - Multi-level asymmetric steps (refined step functions)

  - Exponential decay mixtures

  - Fractal/self-similar constructions


  Returns ready-to-edit code snippets for each family.'
input_schema:
  type: object
  properties: {}
