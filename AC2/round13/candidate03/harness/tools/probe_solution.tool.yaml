type: tool
name: probe_solution
description: 'Approximate score on subsampled data. FAST, separate budget (30 probes).


  RELIABLE for RANKING: Use this to ORDER proposals by promise.


  Strategy: For each new function proposal, call probe_solution before evaluate_solution.

  This filters out unpromising variants and saves expensive full evaluations.


  Call probe for every new variant. You have 30 probes - use them WISELY but AGGRESSIVELY.

  If probe score < current best, SKIP full evaluation.'
