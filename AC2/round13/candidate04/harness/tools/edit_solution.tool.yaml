type: tool
name: edit_solution
description: Implement a COMPLETE function from generate_candidates. Replace the entire EVOLVE-BLOCK with
  the new code. Do NOT edit the seed incrementally.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
