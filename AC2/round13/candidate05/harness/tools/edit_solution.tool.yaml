type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a step-function mutation.


  FOCUS: Make ONE small change to your current pattern.


  Options:

  - HEIGHT: Change one level''s value by ±0.02 to ±0.08 (e.g., 1.40 → 1.35 or 1.48)

  - WIDTH: Shift one interval boundary by ±2% to ±5% (e.g., 0.25n → 0.26n)

  - POSITION: Shift all boundaries by ±1-2% to move center of mass

  - ASYMMETRY: For symmetric patterns, make heights slightly unequal (e.g., 1.90 → 1.88 or 1.92)


  DO NOT: Change multiple features at once. DO NOT switch to smooth functions.


  Use the step pattern structure from _create_step_initializer (patterns 0-12 shown in seed).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
