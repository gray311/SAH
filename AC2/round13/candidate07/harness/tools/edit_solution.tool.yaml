type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement ONE mutation variant. Target:

  - Use SEARCH/REPLACE to adjust heights by ±0.02-0.08, widths by ±3-8%, or introduce asymmetry

  - Change only ONE aspect per edit (don''t combine multiple mutations)

  - Ensure f(x) ≥ 0 and ∫f > 0'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
