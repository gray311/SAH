type: tool
name: edit_solution
description: "Implement a COMPLETE function (or minor mutation) for C_2 optimization.\n\nFor NEW function\
  \ families (Gaussian mixtures, B-spline, oscillatory, etc.), write \nCOMPLETE code from scratch that:\n\
  - Uses appropriate mathematical library (jax/numpy/scipy)\n- Ensures f(x) >= 0 (use softplus, exp, or\
  \ relu transformations)\n- Has proper convolution computation via FFT\n- Returns a ready-to-evaluate\
  \ function\n\nFor small mutations of existing good functions:\n- Use SEARCH/REPLACE to adjust heights\
  \ (+/-0.05-0.15), widths (+/-5-10%), or positions\n- Keep the overall function structure intact\n\n\
  CRITICAL: Do NOT patch step functions into Gaussian functions. For new families, \nwrite complete implementations."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
