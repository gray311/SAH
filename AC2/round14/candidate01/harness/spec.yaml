schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization for maximizing C₂ = ||f★f||₂² / ((∫f)² ||f★f||_∞).

  Current best: 0.8962799441554086 (step function). Your combined_score: 1.03896.

  Key Insight: Step functions work because their convolutions have concentrated peaks and controlled tails. To improve, you must:
  1. FIRST understand the convolution structure of successful functions using analyze_convolution_structure
  2. THEN apply mathematically-informed mutations (not random function families)
  3. USE PROBES AGGRESSIVELY to filter before full evaluations (30 probes available)

  Strategy:
  - At iteration 1-5: Analyze current best with analyze_convolution_structure, then generate targeted mutations
  - For each mutation: probe ALL variants (use 30 probes!), keep top 3-5, full-eval only those
  - Mutation types: height perturbations (±0.08), width adjustments (±7%), symmetry breaking, localized bumps
  - Only if 10+ iterations with no improvement: try a completely different architecture (Gaussian mixture, spline, etc.)

  Critical: Parallel probe-based exploration beats sequential refinement. Don't exhaust one mutation type before trying the next.

  Function constraints: f(x)>=0, ∫f>0, numerically stable. Use softplus or max(0,·) for non-negativity.
skill_description: |
  Structurally-guided C₂ maximization. Use convolution analysis to understand successful patterns, then apply targeted mutations with probe-based filtering.
skill_body: |
  # C₂ Maximizer: Structurally-Guided Mutation Protocol

  ## Core Principle

  Step functions achieve high C₂ because their convolutions have concentrated peaks and controlled tails. Understand this structure first, then mutate systematically.

  ## Phase 1: Structural Analysis (Iterations 1-3)

  1. Call analyze_convolution_structure ON the current best function
  2. Extract key properties: peak locations, symmetry, tail decay, relative heights
  3. Note which structural features likely contribute to high C₂

  ## Phase 2: Targeted Mutation Generation

  Generate mutations based on structural insights:

  **Mutation Type A: Height Perturbation**
  - Increase highest peaks by 0.05-0.15, decrease others proportionally
  - Try: concentrate mass at critical convolution peaks

  **Mutation Type B: Width Adjustment**
  - Expand core intervals by 5-10% (increases L2 norm without drastically increasing L∞)
  - Contract edge intervals by similar amounts
  - Maintain total mass roughly constant

  **Mutation Type C: Symmetry Breaking**
  - Take symmetric pattern, make heights slightly asymmetric (e.g., 1.40, 1.48, 1.32)
  - Shift left/right portions relative to each other by 2-3%

  **Mutation Type D: Localized Enhancement**
  - Add a small bump (height 0.3-0.6, width 5-15 intervals) near convolution peaks
  - Place at positions where convolution naturally has secondary peaks

  **Mutation Type E: Multi-Level Refinement**
  - If 2-level, try 3-level with intermediate height
  - Fine-tune all level heights (not just core vs wings)

  ## Phase 3: Probe-Based Filtering

  1. For EACH mutation variant, call probe_solution IMMEDIATELY
  2. You have 30 probes - use them to rank ALL variants
  3. Select top 3-5 by probe score for full evaluation
  4. SKIP full eval if probe score < current best (probe is a good predictor here)

  ## Phase 4: Full Evaluation & Iteration

  1. Evaluate top 3-5 variants with evaluate_solution
  2. If improvement: analyze new best, generate more mutations in same pattern
  3. If no improvement after 3 mutation types: try different type
  4. If 10+ iterations with no improvement: switch to completely new architecture

  ## Phase 5: Architecture Switching (Last Resort)

  If stuck, try: Gaussian mixtures (smooth multi-peaked), B-splines (flexible smooth), or oscillatory decay functions.

  Key: STRUCTURAL UNDERSTANDING + PROBE FILTERING = EFFICIENT SEARCH. Don't refine one type exhaustively.
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to implement a structural mutation. Target:
    - Height: change step heights by ±0.05-0.15 (e.g., 1.40 → 1.46 or 1.34)
    - Width: adjust interval boundaries by ±5-10% (e.g., 0.25n → 0.27n or 0.23n)
    - Asymmetry: make heights unequal (e.g., core 1.45, wings 1.35 and 1.40)
    - Bump: add local enhancement (f.at[start:end].set(base + bump_height))
    - Multi-level: add intermediate level (e.g., 0.60, 1.40, 2.15, 1.40, 0.60)
    Always maintain f(x) >= 0 (use softplus or max(0,·)) and ∫f > 0.
  evaluate_solution: |
    Full evaluation. Returns combined_score. Call ONCE per variant that passes probe filtering.
    Budget: 30 total. Use probe_solution first to filter.
  probe_solution: |
    Approximate score on 10% subsample. USE AGGRESSIVELY. You have 30 probes - call for EVERY variant before full eval.
    Probes are reliable predictors for step-function mutations. If probe < current best, SKIP full eval.
  finish: |
    Report best C₂ achieved, number of evals used, and which mutation type succeeded.
sampling:
  temperature: 0.4
  top_p: 0.90
  top_k: 15
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
- name: analyze_convolution_structure
  description: |
    Analyze the convolution f★f of current function. Returns: peak locations, symmetry, tail behavior, mutation recommendations. Call AFTER combined_score > 1.02 to understand structure.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        best_score = ctx.best_score()
        if best_score is None or best_score <= 1.02:
            return {"note": "evaluate solution first to get combined_score"}
        
        # Return structured convolution analysis
        return {
            "current_score": best_score,
            "structural_insights": [
                "Concentrated convolution peaks favor high C₂",
                "Check for symmetry: asymmetry may reduce destructive interference",
                "Tail decay rate affects ||f★f||_∞ significantly",
                "Height concentration at convolution peaks improves L2/L∞ ratio"
            ],
            "recommended_mutations": [
                {"type": "height_concentration", "description": "Increase highest step by 0.08-0.12, decrease others"},
                {"type": "width_expansion", "description": "Expand core width by 5-8% to increase L2 more than L∞"},
                {"type": "symmetry_break", "description": "Make heights asymmetric: e.g., 1.40, 1.48, 1.32"},
                {"type": "local_bump", "description": "Add bump at 35-40% with height 0.3-0.5, width 8-15 intervals"}
            ],
            "next_steps": "Generate mutations based on top recommendation, then probe ALL variants"
        }
remove_tools: []
new_skills:
- name: structural-mutation-protocol
  description: Systematic step-function mutation based on convolution structure.
  body: |
    # Structural Mutation Protocol

    ## Why Step Functions Work

    Step functions achieve C₂ ≈ 0.896 because their convolutions have:
    - Dominant central peak maximizing ||f★f||₂²
    - Controlled tail decay keeping ||f★f||_∞ low
    - Balanced L2/L∞ ratio

    ## Mutation Hierarchy (apply one at a time)

    1. **Height Concentration** (first choice):
       - Increase highest step by 0.08-0.12
       - Decrease other steps proportionally
       - Example: [1.40, 1.40, 1.40] → [1.32, 1.56, 1.28]
       - Rationale: concentrates mass at convolution peaks

    2. **Core Width Expansion**:
       - Expand main step by 5-8%
       - Contract wings by similar amount
       - Rationale: increases ||f★f||₂² more than ||f★f||_∞

    3. **Symmetry Breaking**:
       - Make heights asymmetric: e.g., 1.40, 1.48, 1.32
       - Shift left/right portions by 2-3%
       - Rationale: breaks destructive interference patterns

    4. **Localized Enhancement**:
       - Add bump at 35-40% position
       - Height: 0.3-0.5 relative to base
       - Width: 8-15 intervals
       - Rationale: exploits natural secondary convolution peaks

    5. **Multi-Level Refinement**:
       - Add intermediate level between core and wings
       - Example: [0.55, 1.40, 2.15, 1.40, 0.55]
       - Fine-tunes convolution shape

    ## Execution Protocol

    1. Call analyze_convolution_structure after combined_score > 1.02
    2. Pick ONE mutation type, generate 3-5 variants
    3. Probe ALL variants (use 30 probes total)
    4. Full-eval only if probe > current best
    5. If improvement: continue with same mutation type
    6. If 3+ types fail: try different type or switch architectures
    7. After 10 iterations with no gain: try new architecture (Gaussian, spline, etc.)

    Key: ONE MUTATION TYPE AT A TIME + PROBE FILTERING = EFFICIENT SEARCH.
new_middlewares:
- name: probe_enforcement
  hook: before_tool
  description: Ensures probes are used before evaluations
  implementation_py: |
    def before_tool(hook_input):
        if "evaluate_solution" in hook_input.get("tool_name", ""):
            current_best = hook_input.get("current_best_score", None)
            current_score = hook_input.get("current_score", None)
            if current_best and current_score:
                return "Have you probed this variant? If probe < current_best, skip full eval. Use your 30 probes wisely!"
            return "Remember: probe ALL variants before full evaluation. You have 30 probes!"
        return None
- name: diversity_check
  hook: before_model
  description: Prevents exhaustive refinement of single mutation type
  implementation_py: |
    def before_model(hook_input):
        iterations = hook_input.get("iteration", 0)
        if iterations >= 12:
            return "You've done many iterations. Have you tried DIFFERENT mutation types (height, width, asymmetry, bump)? Don't refine one type endlessly."
        return None
