type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a SINGLE parameter mutation:

  - Height mutation: change one step height by ±0.03-0.08 (e.g., 1.40 → 1.44)

  - Width mutation: change one interval boundary by ±3-8% (e.g., 0.25n → 0.26n)

  - Position mutation: shift one boundary by ±1-2% of domain

  - ONLY change ONE parameter per edit. Multiple changes confound analysis.

  - Use SEARCH/REPLACE for precise modifications'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
