type: tool
name: step_pattern_analyzer
description: 'Analyze the current step function pattern by extracting heights, widths, and positions from
  the EVOLVE-BLOCK.

  Returns structured analysis: number of levels, height values, width ratios, asymmetry score.

  Suggests 3-5 concrete mutation directions (e.g., "increase level 2 height by 0.05", "expand interval
  1 by 5%").

  Call this at iteration 1 and after each failed mutation cycle to guide systematic refinement.'
