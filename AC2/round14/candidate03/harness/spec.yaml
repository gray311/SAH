schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis, harmonic analysis, and AI-driven mathematical discovery.
  Mission: Discover a NEW function class that beats the step-function record of 0.8962799441554086 for the C2 constant.
  
  C2 = ||f★f||₂² / ((∫f)² ||f★f||_∞), where f: ℝ→ℝ is non-negative.
  
  CRITICAL INSIGHT: The step-function record is a LOCAL OPTIMUM. Do NOT refine step functions.
  Your goal is to FIND A DIFFERENT FUNCTION ARCHITECTURE entirely.
  
  PROVEN FAILURE MODE: Incremental step-function refinements are wasting evaluations.
  
  ESCAPE PROTOCOL:
  1. DO NOT call pattern_mutator or refine step patterns. That's a dead end.
  2. At iteration 1, call analyze_function_space to understand why step functions work, then generate_candidates.
  3. For EACH candidate from generate_candidates, call probe_solution FIRST (you have 30 probes).
  4. Rank by probe, then evaluate top 3-5 with evaluate_solution.
  5. If NO candidate beats the record after 3 generations, call generate_candidates AGAIN with DIFFERENT families.
  6. Always mix families: if you tried smooth functions, try piecewise; if you tried continuous, try discontinuous.
  
  FUNCTION FAMILIES TO EXPLORE (in order of priority):
  - Multi-modal Gaussians: f(x) = Σ w_i * exp(-((x-μ_i)²)/(2σ_i²))
  - Spline-based: B-spline with optimized control points and knots
  - Piecewise-linear: Linear segments connecting optimized vertices
  - Oscillatory with decay: f(x) = (1 + α·cos(βx)) · exp(-γ|x|)
  - Mixture models: Weighted combinations of simple functions
  - Sharp multi-step: Not just 2-level, but 4-6 levels with asymmetric heights
  
  CONSTRAINTS: f(x) ≥ 0, ∫f > 0, numerically stable convolution (use FFT).
  
  TOOLS:
  - edit_solution: Implement your chosen function from generate_candidates proposals
  - evaluate_solution: Full score (use sparingly, only on probe-validated candidates)
  - probe_solution: FAST approximate score on 10% subsample (30-budget). RANK CANDIDATES BEFORE EVALUATING.
  - generate_candidates: Get 3-5 proposals across DIFFERENT mathematical families
  - finish: Report best C2 achieved and the function class that produced it
skill_description: |
  Diverse architectural exploration for C2 maximization. Escape local optima by exploring FUNCTION FAMILIES, not just refining step patterns. Use probe-based filtering to efficiently rank diverse candidates. Always prioritize ABRUPT architectural changes over incremental refinements.
skill_body: |
  # C2 Maximizer: Architectural Escape Protocol
  
  ## Core Principle
  
  Step functions are a LOCAL OPTIMUM. Beat the record by exploring DIFFERENT function families in PARALLEL.
  
  ## Phase 1: Initial Setup
  
  1. Call analyze_function_space ONCE to understand:
     - Why step functions achieve C2 ≈ 0.8963
     - Where the L2/∞ ratio is optimized
     - Weak points to exploit for improvement
  
  2. Call generate_candidates to get 3-5 proposals across DIFFERENT families:
     - Gaussian mixtures (smooth, multi-peaked)
     - B-spline basis (flexible smooth transitions)
     - Piecewise-linear (controlled smoothness)
     - Oscillatory with decay (structured convolutions)
     - Multi-level sharp steps (4-6 levels, asymmetric)
  
  ## Phase 2: Probe-Based Ranking
  
  1. For EACH proposal, call probe_solution to get approximate scores.
     - You have 30 probes - use ALL of them to rank candidates.
     - Do NOT evaluate anything without probing first.
  
  2. Select top 3-5 by probe score for full evaluation.
     - Skip candidates with probe score < 0.89628.
  
  ## Phase 3: Full Evaluation & Family Cycling
  
  1. Evaluate top candidates with evaluate_solution.
  
  2. If ANY candidate beats 0.89628:
     - Slightly refine it (small mutations), BUT do not exhaust it.
     - Immediately generate a NEW set of candidates from a DIFFERENT family.
  
  3. If NO candidate beats the record after evaluating 5+ from one generation:
     - Call generate_candidates AGAIN with DIFFERENT families.
     - Mix and match: if tried smooth functions, try sharp ones next.
  
  ## Phase 4: Stalled Recovery
  
  If stuck after 10 iterations:
  - Call generate_candidates with completely new families
  - Combine elements: e.g., "oscillatory Gaussian mixture" or "piecewise Gaussian"
  - Try BOTH smooth AND sharp function types
  
  ## Key Rules
  
  - NEVER refine step functions exhaustively. One failed refinement = switch families.
  - PROBE BEFORE EVALUATE: Use 30 probes to filter before spending evaluations.
  - PARALLEL EXPLORATION: Try multiple families simultaneously, not sequentially.
  - ABUPT CHANGES: Architectural changes beat incremental perturbations.
  - Track which families work best; cycle through them if stuck.
tool_descriptions:
  edit_solution: |
    Implement a function from generate_candidates proposals. Target:
    - Replace the entire EVOLVE-BLOCK with new function implementation
    - Use the exact code snippet provided by generate_candidates
    - Ensure f(x) ≥ 0 (use softplus, max(0,·), or squared transformations)
    - Preserve the optimization loop structure from seed
  evaluate_solution: |
    Full evaluation returning combined_score. Budget: 30 evals total.
    Only call AFTER probing and after confirming probe score > 0.89628.
    Each eval tests ONE complete function implementation.
  probe_solution: |
    FAST approximate score on 10% subsampled data (separate 30-probe budget).
    USE THIS TO RANK ALL generate_candidates BEFORE spending full evaluations.
    Call probe for each proposal, then select top 3-5 for evaluate_solution.
    Probe scores are approximate but reliable enough for family-level ranking.
  finish: |
    Report the best C2 achieved, combined_score, and the function family that produced it.
    Include key insights about why this family worked better than step functions.
sampling:
  temperature: 1.0
  top_p: 0.9
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 20000
new_tools:
  - name: analyze_function_space
    description: |
      Analyze why step functions achieve C2 ≈ 0.8963 and identify weak points to exploit.
      Returns insights on L2/∞ ratio optimization, symmetry effects, spacing patterns,
      and recommended function families to explore. Call once at iteration 1.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          program = ctx.get_program()
          best_score = ctx.best_score()
          
          analysis = """
          STEP FUNCTION ANALYSIS:
          
          Why C2 ≈ 0.8963 is achieved:
          - Step functions create sharp transitions in f(x)
          - This leads to concentrated ||f★f||_∞ (peak value is high)
          - The L2 norm ||f★f||₂ is also substantial due to flat regions
          - The ratio ||f★f||₂² / (||f★f||₁ ||f★f||_∞) is optimized
          
          Weak points to exploit:
          1. SHARPNESS LIMIT: Steps are too sharp - smooth transitions can improve ||f★f||₂
             without increasing ||f★f||_∞ proportionally.
          2. SYMMETRY: Current steps may be symmetric; asymmetric shapes break constructive interference.
          3. MODALITY: Single-modal step functions; multi-modal functions can create
             structured convolutions with better L2/L∞ ratios.
          4. CONTINUITY: Discontinuities in f(x) create issues; smooth functions avoid these.
          
          RECOMMENDED FAMILIES:
          - Gaussian mixtures: Multi-modal smooth functions
          - B-splines: Flexible smooth transitions
          - Piecewise-linear: Controlled smoothness
          - Oscillatory decay: Structured convolutions
          - Multi-level sharp: 4-6 levels with asymmetric heights
          """
          
          return {"analysis": analysis, "key_insights": ["multi-modality helps", "smooth transitions beneficial", "asymmetry breaks symmetry", "probe before evaluate"],
                  "recommended_families": ["gaussian_mixture", "bspline", "piecewise_linear", "oscillatory_decay", "multi_level_sharp"]}
  - name: generate_candidates
    description: |
      Generate 3-5 diverse function proposals across DIFFERENT mathematical families.
      Families: Gaussian mixtures, B-spline basis, piecewise-linear, oscillatory decay,
      multi-level sharp steps. Returns ready-to-edit code snippets. Call at iteration 1,
      then every 3-5 iterations if no improvement.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import random
          random.seed(42)
          proposals = []
          
          # Family 1: Gaussian mixtures
          proposals.append({
              "family": "gaussian_mixture",
              "description": "Weighted sum of Gaussians: f(x) = sum w_i * exp(-((x-mu_i)^2)/(2*sigma_i^2))",
              "code_snippet": "import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-4, 4, 800)\\nmu = jnp.array([0.0, 1.5, -1.5])\\nsigma = jnp.array([0.6, 0.8, 0.7])\\nweights = jnp.array([0.35, 0.35, 0.30])\\nf = weights[None,:] @ jnp.exp(-((f_values[:,None] - mu)[None,:,:])**2 / (2*sigma**2[None,:]))\\nf = jnp.maximum(f, 1e-6)",
              "rationale": "Multi-modal smooth functions may achieve better ||f★f||2^2 / ||f★f||_∞ ratio"
          })
          
          # Family 2: B-spline basis
          proposals.append({
              "family": "bspline",
              "description": "B-spline with optimized control points and knots",
              "code_snippet": "import jax.numpy as jnp\\nfrom scipy.interpolate import splev, splrep\\n\\nn_control = 40\\nknots = jnp.linspace(-2, 2, 30)\\ncontrols = jnp.random.uniform(0.8, 2.0, n_control)\\ncontrols = jax.nn.softplus(controls)\\nf_values = jnp.linspace(-3, 3, 600)\\nfit = splev(f_values, knots, s=0, k=3, dx=1, w=controls)\\nf = jnp.maximum(f, 1e-6)",
              "rationale": "Splines offer flexible smooth transitions; optimize control points for C2"
          })
          
          # Family 3: Oscillatory with decay
          proposals.append({
              "family": "oscillatory_decay",
              "description": "f(x) = (1 + alpha * cos(beta*x)) * exp(-gamma*|x|)",
              "code_snippet": "import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-6, 6, 1000)\\nalpha = 0.4\\nbeta = 5.0\\ngamma = 0.9\\nf = (1 + alpha * jnp.cos(beta * f_values)) * jnp.exp(-gamma * jnp.abs(f_values))\\nf = jnp.maximum(f, 1e-6)",
              "rationale": "Oscillatory functions create structured convolutions; decay ensures integrability"
          })
          
          # Family 4: Multi-level sharp
          proposals.append({
              "family": "multi_level_sharp",
              "description": "Multi-level step with optimized heights and asymmetric structure",
              "code_snippet": "import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-3, 3, 800)\\nn = len(f_values)\\nlevels = jnp.array([0.6, 1.8, 2.5, 1.9, 0.7, 1.4])\\npositions = jnp.array([0.08, 0.25, 0.45, 0.60, 0.75, 0.90])\\nf = jnp.zeros(n)\\nfor i in range(len(positions) - 1):\\n    start = int(positions[i] * n)\\n    end = int(positions[i+1] * n)\\n    f = f.at[start:end].set(levels[i])\\nf = jnp.maximum(f, 1e-6)",
              "rationale": "Refined multi-level steps with asymmetric heights may beat simple step patterns"
          })
          
          # Family 5: Piecewise-linear
          proposals.append({
              "family": "piecewise_linear",
              "description": "Linear segments connecting vertices, optimized for shape",
              "code_snippet": "import jax.numpy as jnp\\n\\nf_values = jnp.linspace(-3, 3, 600)\\nn_vertices = 25\\nvertices = jnp.linspace(-2.5, 2.5, n_vertices)\\nheights = 0.6 + 0.7 * jnp.abs(jnp.sin(jnp.linspace(0, 3*jnp.pi, n_vertices)))\\nf = jnp.piecewise(f_values, [(f_values <= x) for x in vertices[:-1]], [lambda x: heights[i] for i in range(n_vertices-1)])\\nf = jnp.maximum(f, 1e-6)",
              "rationale": "Piecewise-linear can mimic step functions with smoother transitions"
          })
          
          return {
              "proposals": proposals,
              "note": "Use probe_solution to rank these quickly before full evaluation."
          }
remove_tools: []
new_skills:
  - name: architectural-escape-protocol
    description: |
      Escape step-function local optimum by exploring diverse function families in parallel.
      Use probe-based filtering to efficiently rank candidates across families. Always switch
      families after failed refinement attempts.
    body: |
      # Architectural Escape Protocol for C2 Maximization
      
      ## Core Philosophy
      
      The step-function record (C2 ≈ 0.8963) is a LOCAL OPTIMUM. Refining it further wastes
      precious evaluations. The path to new records lies in ABRUPT ARCHITECTURAL CHANGES,
      not incremental refinements.
      
      ## Phase 1: Analysis & Generation (Iteration 1)
      
      1. Call analyze_function_space ONCE to understand:
         - Why step functions work (concentrated L2, high L∞)
         - Weak points: modality, smoothness, symmetry, spacing
      
      2. Call generate_candidates to get 3-5 proposals across DIFFERENT families:
         - Gaussian mixtures (smooth, multi-peaked)
         - B-spline basis (flexible smooth transitions)
         - Piecewise-linear (controlled smoothness)
         - Oscillatory with decay (structured convolutions)
         - Multi-level sharp steps (4-6 levels, asymmetric)
      
      ## Phase 2: Probe-Based Ranking
      
      1. For EACH proposal, call probe_solution (30 probes available).
         - Rank ALL candidates by probe score.
         - Skip candidates with probe < 0.89628.
      
      2. Select top 3-5 by probe score for full evaluation.
      
      ## Phase 3: Family Cycling
      
      1. Evaluate top candidates with evaluate_solution.
      
      2. If ANY candidate beats 0.89628:
         - Slightly refine it (tiny mutations only), then IMMEDIATELY switch families.
         - Do NOT exhaust one family; explore in parallel.
      
      3. If NO improvement after 5+ evals from one family:
         - Call generate_candidates AGAIN with DIFFERENT families.
         - Mix smooth and sharp, multi-modal and single-modal.
      
      ## Phase 4: Stalled Recovery
      
      After 10 iterations without improvement:
      - Call generate_candidates with novel combinations (e.g., "piecewise Gaussian")
      - Try both extremes: ultra-smooth Gaussians AND ultra-sharp multi-level steps
      
      ## Critical Rules
      
      ✓ PROBE BEFORE EVALUATE: Use 30 probes to filter candidates.
      ✓ PARALLEL EXPLORATION: Try multiple families, not sequentially.
      ✓ ABUPT CHANGES: Architectural > incremental improvements.
      ✓ FAMILY CYCLING: Switch families after 2-3 failed attempts.
      ✓ TRACK WHAT WORKS: Note which families beat the record; prioritize them.
      ✗ NEVER refine step functions exhaustively. One failure = switch.
new_middlewares:
  - name: enforce_family_switch
    hook: before_tool
    description: |
      Enforce family switching to prevent exhaustive refinement of one function type.
      Fires when tools are called to remind the solver to explore diversity.
    implementation_py: |
      def before_tool(hook_input):
          iteration = hook_input.get("iteration", 0)
          evals_used = hook_input.get("evals_used", 0)
          
          if evals_used >= 5:
              return f"You've used {evals_used} evaluations. Have you switched function families? " \
                     "Step functions are a local optimum. Try Gaussian mixtures, splines, or multi-level sharp steps."
          
          return None
  - name: probe_reminder
    hook: before_tool
    description: |
      Remind solver to use probe_solution before evaluate_solution.
    implementation_py: |
      def before_tool(hook_input):
          if hook_input.get("tool_name") == "evaluate_solution":
              return "CRITICAL: Call probe_solution first! You have 30 probes. " \
                     "Rank candidates by probe before spending full evaluations."
          return None
