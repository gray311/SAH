type: tool
name: edit_solution
description: 'Implement a function from generate_candidates proposals. Target:

  - Replace the entire EVOLVE-BLOCK with new function implementation

  - Use the exact code snippet provided by generate_candidates

  - Ensure f(x) ≥ 0 (use softplus, max(0,·), or squared transformations)

  - Preserve the optimization loop structure from seed'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
