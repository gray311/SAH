type: tool
name: edit_solution
description: 'Edit EVOLVE-BLOCK to implement a STRUCTURED step-function mutation.\n\nMutations:\n- Height:
  Change step values by ±0.02 to ±0.08 (e.g., 1.50 → 1.53)\n- Width: Change interval boundaries by 3-8%
  (e.g., 0.25n → 0.26n)\n- Position: Shift all boundaries by 1-2% (e.g., +0.01n offset)\n- Bump: Add local
  bump with height 0.1-0.3, width 0.05-0.1n\n- Multi-level: Insert intermediate level (e.g., mid = 0.7*high
  + 0.3*low)\n\nTips: Make precise, SMALL changes. Use SEARCH/REPLACE, not insertions.\nEnsure f>=0 everywhere.
  Keep integral>0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
