schema: h2spec/1.0
system_prompt: "You are an expert in functional analysis and mathematical optimization for the C₂ constant:
  C₂ = ||f★f||₂² / ((∫f)² ||f★f||_∞), where f: R→R is non-negative.

Current best: 0.8962799441554086 (step function by AlphaEvolve, reported as combined_score 1.03896).

Your mission: FIND COMPLETELY NEW FUNCTION ARCHITECTURES that beat the step-function record.

CRITICAL STRATEGY: The step-function record is a LOCAL optimum. To break through, you MUST generate diverse function families and RANK THEM WITH PROBES before spending full evaluations.

PARALLEL EXPLORATION PROTOCOL:

1. ITERATION 1: Call generate_candidates to get 5-7 diverse function proposals across DIFFERENT families (Gaussian mixtures, B-splines, piecewise-linear, oscillatory with decay, multi-level steps, convolution kernels, etc.).

2. PROBE-RANK PHASE: Use probe_solution (30-budget, FAST, approximate) to score ALL proposals. This is your PRIMARY ranking mechanism. Do NOT do full evaluations yet.

3. SELECT TOP CANDIDATES: Choose top 3-4 by probe score for full evaluation with evaluate_solution.

4. PARALLEL PIPELINE: While waiting for evaluations to complete, generate MORE diverse candidates from NEW families.

5. WINNER REFINEMENT: ONLY after a proposal beats the record, do small refinements. Don't exhaust a winner—keep exploring parallel paths.

6. DIVERSITY CHECK: Every 5 iterations, explicitly call generate_candidates to ensure you're exploring fresh families, not just variations of what you've tried.

Constraints: f(x)≥0 everywhere, ∫f>0, numerically stable convolution, avoid overflow.

Tool usage: probe_solution for ranking (30 budget), evaluate_solution for confirmation (sparse use), generate_candidates for diversity."
skill_description: Diverse architecture exploration with probe-based ranking. Generate function proposals across multiple families, rank with cheap probes, evaluate only winners.
skill_body: "# Diverse Architecture Exploration Protocol for C₂ Maximization

## Core Principle

The step-function record (1.03896) is a LOCAL optimum. To beat it, you must EXPLOR DIVERSE FUNCTION ARCHITECTURES in PARALLEL, using probes to efficiently rank before spending full evaluations.

## Phase 1: Diverse Generation (Every Iteration)

1. Call generate_candidates to get 5-7 proposals across DIFFERENT mathematical families:
   - Gaussian mixtures (smooth multi-peaked functions)
   - B-spline basis (flexible smooth curves)
   - Piecewise-linear (controlled smoothness)
   - Oscillatory with exponential decay (structured convolutions)
   - Multi-level asymmetric steps (refined step patterns)
   - Convolution kernel designs (direct optimization of f★f)
   - Wavelet-like functions (localized frequency content)

2. For each proposal, review the code snippet and mental model of the function shape.

## Phase 2: Probe-Based Ranking (Critical Phase)

1. You have 30 PROBE budget—use it AGGRESSIVELY. Probes are:
   - 10x faster than full evaluation (~10s vs ~100s)
   - Separate budget (30 probes, not counted against 30 evals)
   - Approximate but sufficient for RANKING proposals

2. Call probe_solution for EACH proposal (5-7 probes per iteration).
   - If a proposal's probe score < current best, SKIP full evaluation
   - If probe score > current best, proceed to Phase 3

3. After probing all proposals, select TOP 3-4 by probe score for full evaluation.

## Phase 3: Full Evaluation & Winner Tracking

1. Call evaluate_solution for each top proposal.
2. Track which proposals beat the current best.
3. ONLY if a proposal beats the record:
   - Note the successful family/architecture
   - Make 1-2 small refinements (don't over-exploit)
   - Immediately return to Phase 1 with NEW families

4. If NO proposal beats the record after 3-4 full evaluations:
   - This is NORMAL—step functions are a strong local optimum
   - Call generate_candidates AGAIN with a focus on underexplored families
   - Continue the parallel pipeline

## Phase 4: Diversity Maintenance

1. Every 5 iterations, explicitly generate candidates from families you haven't tried recently.
2. If you've only tried smooth functions, try sharp ones (steps, wavelets).
3. If you've only tried symmetric functions, try asymmetric designs.
4. Vary: number of peaks, decay rates, oscillation frequencies, knot placements.

## Key Rules

- PARALLEL EXPLORATION > SEQUENTIAL REFINEMENT
- USE PROBES TO RANK—don't waste full evals on weak candidates
- DIVERSITY > OPTIMIZATION: exploring new families beats refining dead ends
- Expected outcome: Within 15-20 iterations, one family should beat the record"
tool_descriptions:
  edit_solution: 'Modify the EVOLVE-BLOCK to implement a function from the proposed family. 
    - Use SEARCH/REPLACE to insert the code snippet from generate_candidates
    - Ensure f(x) >= 0 (use softplus, exponential, or explicit max with small epsilon)
    - Ensure numerical stability (avoid huge coefficients, check for overflow)
    - Test that the function shape matches the mental model (plot mentally: single peak? multi-peaked? oscillatory? decaying?)'
  evaluate_solution: 'Full evaluation on the complete function. Returns combined_score. 
    Budget: 30 total evaluations. Call ONLY for top 3-4 proposals that passed probe ranking.
    Each full eval tests one concrete function—ensure it''s complete and ready.'
  probe_solution: 'Approximate score on 10% subsampled data. CRITICAL: USE THIS TO RANK PROPOSALS.
    - 30-probe budget (separate from eval budget)
    - ~10s per probe vs ~100s for full eval
    - Scores are approximate but sufficient for ranking
    - Strategy: Probe ALL generated proposals, then evaluate only top 3-4 by probe score
    - If probe score < current best, skip full evaluation and try a different proposal'
  finish: 'Report the best C₂ achieved, which function family produced it, and the combined_score.'
sampling:
  temperature: 1.1
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
new_tools:
- name: generate_architectures
  description: 'Generate 5-7 diverse function architectures for C2 maximization across underexplored mathematical families. Produces complete, ready-to-edit code snippets. Focus on DIFFERENT architectures each call: convolution kernels, wavelet-like functions, mixture models with custom bases, radial basis functions, etc.'
  input_schema:
    type: object
    properties: {}
  implementation_py: "def run(ctx, args):\n    import random\n    random.seed(42 + hash(ctx.get_iteration()) % 1000)\n    \n    architectures = []\n    \n    # Architecture 1: Custom convolution kernel\n    architectures.append({\n        \"family\": \"custom_convolution_kernel\",\n        \"description\": \"Directly optimize a kernel designed for favorable convolution properties\",\n        \"code_snippet\": \"import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-3, 3, 600)\\n# Triangular envelope with central peak and asymmetric wings\\ncenter = 0.0\\nwidth_left = 1.8\\nwidth_right = 2.2\\nf = jnp.zeros_like(f_values)\\nf_center = int(len(f_values) * 0.5)\\nfor i, x in enumerate(f_values):\\n    if x < center:\\n        f = f.at[i].set(width_left * (center - x) / width_left)\\n    else:\\n        f = f.at[i].set(width_right * (x - center) / width_right)\\nf = jnp.maximum(f, 1e-6)\",\n        \"rationale\": \"Direct kernel design may achieve better ||f★f||2^2 / ||f★f||_∞ ratio than generic function families\"\n    })\n    \n    # Architecture 2: Wavelet-like with decay\n    architectures.append({\n        \"family\": \"wavelet_decay\",\n        \"description\": \"Localized wavelet basis with exponential decay for structured convolution\",\n        \"code_snippet\": \"import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-5, 5, 800)\\n# Morlet-like wavelet with envelope\\nalpha = 1.0\\nbeta = 6.0\\ngamma = 0.5\\nwavelet = jnp.exp(-alpha * (f_values**2)) * jnp.cos(beta * f_values)\\nf = (wavelet + 0.3) * jnp.exp(-gamma * jnp.abs(f_values))\\nf = jnp.maximum(f, 1e-6)\",\n        \"rationale\": \"Wavelets provide localized frequency content; decay ensures integrability and numerical stability\"\n    })\n    \n    # Architecture 3: Mixture of exponentials\n    architectures.append({\n        \"family\": \"exponential_mixture\",\n        \"description\": \"Weighted sum of exponential decay functions with different rates\",\n        \"code_snippet\": \"import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-3, 3, 600)\\nrates = jnp.array([0.5, 1.0, 2.0, 3.0])\\nweights = jnp.array([0.25, 0.35, 0.25, 0.15])\\nf = weights[None,:] @ jnp.exp(-rates * jnp.abs(f_values[:,None]))\\nf = jnp.maximum(f, 1e-6)\",\n        \"rationale\": \"Mixture of exponentials creates rich convolution structures with tunable smoothness\"\n    })\n    \n    # Architecture 4: Radial basis combination\n    architectures.append({\n        \"family\": \"rbf_combination\",\n        \"description\": \"Radial basis functions centered at multiple points\",\n        \"code_snippet\": \"import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-3, 3, 600)\\ncenters = jnp.array([-1.5, 0.0, 1.5])\\nscales = jnp.array([1.2, 0.8, 1.0])\\nweights = jnp.array([0.3, 0.4, 0.3])\\nf = jnp.zeros_like(f_values)\\nfor c, s, w in zip(centers, scales, weights):\\n    f = f + w * jnp.exp(-((f_values - c)**2) / (2 * s**2))\\nf = jnp.maximum(f, 1e-6)\",\n        \"rationale\": \"RBFs provide localized peaks; combinations create multi-modal functions with favorable convolution properties\"\n    })\n    \n    # Architecture 5: Polynomial envelope with oscillation\n    architectures.append({\n        \"family\": \"polynomial_envelope_osc\",\n        \"description\": \"Polynomial envelope modulating oscillatory function\",\n        \"code_snippet\": \"import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-3, 3, 600)\\n# Envelope: 1 - (x/3)^4 (quartic decay, very smooth)\\n# Oscillation: cos with controlled frequency\\nenv = 1 - ((f_values / 3.0)**4)\\nos = 1 + 0.5 * jnp.cos(4.0 * f_values)\\nf = (env + 0.2) * os\\nf = jnp.maximum(f, 1e-6)\",\n        \"rationale\": \"Polynomial envelopes provide ultra-smooth decay; oscillation creates structured convolution\"\n    })\n    \n    # Architecture 6: Asymmetric multi-step (optimized from seed)\n    architectures.append({\n        \"family\": \"asymmetric_multistep\",\n        \"description\": \"Multi-level step function with carefully chosen asymmetric heights\",\n        \"code_snippet\": \"import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-3, 3, 600)\\nn = len(f_values)\\n# Asymmetric multi-level: left side higher, right side lower\\nlevels = [0.0, 2.2, 1.6, 1.1, 0.6, 0.0]\\npositions = jnp.array([0.0, 0.12, 0.28, 0.45, 0.65, 0.90, 1.0])\\nf = f_values\\nfor i in range(len(positions) - 1):\\n    start = int(positions[i] * n)\\n    end = int(positions[i+1] * n)\\n    f = f.at[start:end].set(levels[i])\\nf = jnp.maximum(f, 1e-6)\",\n        \"rationale\": \"Asymmetric multi-level steps may break symmetry constraints of optimal step function\"\n    })\n    \n    # Architecture 7: Convex combination of Gaussians with varying widths\n    architectures.append({\n        \"family\": \"heteroscedastic_gaussian\",\n        \"description\": \"Sum of Gaussians with deliberately different widths (heteroscedastic)\",\n        \"code_snippet\": \"import jax.numpy as jnp\\nimport jax\\n\\nf_values = jnp.linspace(-3, 3, 600)\\n# Different widths: broad, medium, narrow\\ncenters = jnp.array([-1.0, 0.0, 1.0])\\nwidths = jnp.array([1.5, 0.8, 0.3])\\nweights = jnp.array([0.2, 0.5, 0.3])\\nf = jnp.zeros_like(f_values)\\nfor c, w, wt in zip(centers, widths, weights):\\n    f = f + wt * jnp.exp(-((f_values - c)**2) / (2 * w**2))\\nf = jnp.maximum(f, 1e-6)\",\n        \"rationale\": \"Heteroscedastic widths create multi-scale features that may optimize the C2 ratio differently than homoscedastic mixtures\"\n    })\n    \n    return {\n        \"architectures\": architectures,\n        \"note\": \"Each architecture is ready to edit. Call probe_solution to rank before full evaluation.\"\n    }\n"
new_skills:
- name: probe-first-exploration
  description: Parallel diverse generation with aggressive probe ranking. Use probes to filter before full evals.
  body: "# Probe-First Diverse Exploration for C₂ Maximization

## Core Principle

With only 30 full evaluations and 30 probes available, the optimal strategy is:
1. GENERATE diverse architectures
2. RANK with PROBES (cheap, separate budget)
3. EVALUATE only top candidates
4. REPEAT with new families

This avoids wasting full evals on weak proposals.

## Phase 1: Aggressive Diverse Generation

Every iteration (or when stuck):
- Call generate_architectures for 5-7 proposals
- Ensure diversity: check you're not repeating the same family type
- If you've tried all smooth families, try sharp ones (steps, wavelets)
- Vary: number of components, decay rates, symmetry, polynomial degrees

## Phase 2: Probe-First Ranking (DO NOT SKIP)

1. Call probe_solution for EACH proposal (5-7 probes per iteration)
2. Probes are YOUR PRIMARY ranking mechanism:
   - 10x faster than full evaluation
   - 30-probe budget (separate from 30 evals)
   - Approximate scores sufficient for ranking
3. If probe score < current best (1.03896), SKIP full evaluation
4. Select TOP 3-4 by probe score for Phase 3

## Phase 3: Strategic Full Evaluation

1. Evaluate only the 3-4 highest-probe-score proposals
2. Track which family/architecture beats the record
3. If NO winner after 3-4 evals: return to Phase 1 with FRESH families
4. If a winner is found: make 1-2 small refinements, then immediately return to Phase 1

## Phase 4: Diversity Maintenance

- Every 5 iterations: explicitly generate from underexplored families
- Diversity checklist: smooth vs. sharp, symmetric vs. asymmetric, single vs. multi-peaked, decaying vs. non-decaying
- If stuck for 10 iterations: call generate_architectures again with focus on completely new families

## Expected Outcome

Within 15-20 iterations, one architecture family should beat the step-function record. The key is PARALLEL EXPLORATION with PROBE-GATING to avoid evaluation budget exhaustion on dead-end families."
new_middlewares:
- name: probe_reminder
  hook: before_tool
  description: 'Middleware reminder to use probe_solution before evaluate_solution'
  implementation_py: "def before_tool(hook_input):\n    tool = hook_input.get('tool_name', '')\n    if tool == 'evaluate_solution':\n        return 'REMINDER: Have you called probe_solution for this variant first? Use the 30-probe budget to rank before spending full evaluations!'\n    return None\n\ndef after_tool(hook_input):\n    tool = hook_input.get('tool_name', '')\n    if tool == 'probe_solution':\n        probe_count = hook_input.get('probe_count', 0)\n        remaining = 30 - probe_count\n        if remaining > 0:\n            return f'Probes remaining: {remaining}. Use them to rank other proposals before full evaluation!'\n    return None"
- name: diversity_guard
  hook: before_model
  description: 'Prevents extended exploration of a single family type; forces diversity check every 8 iterations'
  implementation_py: "def before_model(hook_input):\n    iteration = hook_input.get('iteration', 0)\n    last_family = hook_input.get('last_family', 'unknown')\n    \n    if iteration > 0 and iteration % 8 == 0:\n        return 'DIVERSITY CHECK: You are at iteration ' + str(iteration) + '. Have you explored completely different function families in the past 8 iterations? Try new architectures (wavelets, RBFs, custom kernels, etc.) if you have been refining the same type.'\n    elif iteration >= 12:\n        return 'You have done many iterations. Ensure you are exploring DIVERSE function families, not just variations of one type.'\n    return None"
