type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a function from the proposed family. - Use SEARCH/REPLACE
  to insert the code snippet from generate_candidates - Ensure f(x) >= 0 (use softplus, exponential, or
  explicit max with small epsilon) - Ensure numerical stability (avoid huge coefficients, check for overflow)
  - Test that the function shape matches the mental model (plot mentally: single peak? multi-peaked? oscillatory?
  decaying?)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
