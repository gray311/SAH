name: probe_solution
description: 'Approximate score on 10% subsampled data. CRITICAL: USE THIS TO RANK PROPOSALS. - 30-probe
  budget (separate from eval budget) - ~10s per probe vs ~100s for full eval - Scores are approximate
  but sufficient for ranking - Strategy: Probe ALL generated proposals, then evaluate only top 3-4 by
  probe score - If probe score < current best, skip full evaluation and try a different proposal'
