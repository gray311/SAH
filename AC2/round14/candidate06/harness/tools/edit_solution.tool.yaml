type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK with SMALL, targeted mutations:\n\n  - Height: change by ±0.01-0.05
  (e.g., 1.45 → 1.47)\n  - Width: change boundaries by ±2-5% (e.g., 0.22n → 0.23n)\n  - Add bump: insert
  a small range of indices with height 0.05-0.10\n  - Make asymmetric: change one side to 1.40, other
  to 1.45\n\n  Use SEARCH/REPLACE, keep the rest identical.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
