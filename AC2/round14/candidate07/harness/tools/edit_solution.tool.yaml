type: tool
name: edit_solution
description: 'Implement a function with a SPECIFIC new architecture. Choose ONE type and execute: - Multi-modal:
  Define 2-4 bumps at different positions (e.g., Gaussian mix or piecewise steps) - Ramp: Create triangular/trapezoidal
  shape with linear segments - Oscillatory: Use (1+alpha*cos(beta*x)) * exp(-gamma*|x|) formula - B-spline:
  Use scipy.interpolate.splev with optimized knots/controls

  IMPORTANT: This is NOT a step-function refinement. Implement the chosen architecture from scratch.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
