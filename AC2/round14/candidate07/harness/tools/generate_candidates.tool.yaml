type: tool
name: generate_candidates
description: 'Generate 3-5 diverse function proposals across DIFFERENT mathematical architectures for
  C2 maximization.


  Architectures to explore:

  1. Multi-modal: Gaussians mixture, piecewise bumps at asymmetric positions

  2. Ramp functions: Triangular, trapezoidal, piecewise-linear shapes

  3. Oscillatory with decay: (1+αcos(βx))·exp(-γ|x|)

  4. B-spline basis: Spline with optimized control points and knots


  Each proposal includes ready-to-edit code. Use probe_solution to rank before full evaluation.'
