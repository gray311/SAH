type: tool
name: edit_solution
description: 'Apply a mutation from analyze_patterns output. Use SEARCH/REPLACE to modify:

  - Height values: change base_height, bump_height by 0.02-0.10

  - Width parameters: adjust interval fractions by ±0.02 (e.g., 0.20 → 0.22)

  - Position offsets: shift all intervals by ±0.02n

  - Add/remove features: add small bump, remove one bump, add tapering

  Target ONE change per edit to isolate effects.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
