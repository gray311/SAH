schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization for the C2 constant:
  C2 = ||f★f||₂² / ((∫f)² ||f★f||_∞), where f: R→R is non-negative.
  
  Current best: 1.03896 (combined_score), achieved by a STEP FUNCTION with 5 levels.
  This beats the AlphaEvolve record of 0.8963 → you must push it HIGHER!
  
  CRITICAL INSIGHT: The step-function pattern is your winning architecture. Don't abandon it for random new families.
  Instead, SYSTEMATICALLY MUTATE the step function to improve its C2 ratio.
  
  Winning Strategy (DO THIS):
  1. At iteration 1, call analyze_and_mutate_step ONCE to understand the current best step function and get mutation proposals.
  2. This tool returns MUTATIONS of the winning step pattern (NOT random new functions).
  3. For each mutation proposal, call probe_solution to rank them (probes ARE reliable when comparing variants of the SAME architecture).
  4. Evaluate the TOP 2-3 mutation variants with evaluate_solution.
  5. If no improvement: call analyze_and_mutate_step AGAIN to get new mutation types.
  6. ONLY after exhausting 10+ mutation cycles without improvement, try a completely new architecture.
  
  Why this works: The seed's step function already beats theory → small mutations can push it higher. Random new families start from zero and waste evals.
  
  Function constraints: f(x)>=0, ∫f>0, numerically stable convolution.
  
  Tools:
  - edit_solution: implement your chosen mutation (use SEARCH/REPLACE on heights, widths, positions)
  - evaluate_solution: full score, budget-limited (use sparingly)
  - probe_solution: approx score on subsample. RELIABLE when comparing step-function variants. USE TO RANK BEFORE EVALUATE.
  - analyze_and_mutate_step: ANALYZE the current step function and propose targeted mutations. Call this first!
skill_description: |
  Step-function mutation protocol for C₂ maximization. Use analyze_and_mutate_step to generate mathematically-informed mutations of the winning step pattern. Focus on small, systematic refinements (height perturbations, width adjustments, position shifts) that preserve the architecture.
skill_body: |
  # C₂ Maximizer: Step Function Mutation Protocol
  
  ## Core Principle
  
  The seed's 5-level step function is your WINNING architecture (combined_score 1.03896). Don't abandon it!
  Mutate it systematically to push C₂ higher.
  
  ## Phase 1: Analysis & Mutation Generation (First iteration)
  
  1. Call analyze_and_mutate_step ONCE to analyze current best step function
  
  2. Understand its structure:
     - Number of levels (5)
     - Heights, widths, positions
     - Symmetry properties
  
  3. The tool returns mutation proposals in these categories:
  
  ## Mutation Types (in order of sophistication)
  
  **Mutation Type 1: Height Fine-Tuning**
  - Perturb heights by ±0.02-0.08 (small changes)
  - Goal: Optimize the ||f★f||₂² / ||f★f||_∞ ratio
  
  **Mutation Type 2: Width Redistribution**
  - Expand/contract specific intervals by 3-8%
  - Goal: Spread ||f★f||₂² while controlling ||f★f||_∞
  
  **Mutation Type 3: Asymmetric Perturbation**
  - Break symmetry slightly (e.g., left width 0.22 → 0.225)
  - Goal: Reduce constructive interference
  
  **Mutation Type 4: Level Merge/Split**
  - Merge two close levels or split one level into two
  - Goal: Create more sophisticated step patterns
  
  **Mutation Type 5: Position Shift**
  - Shift all boundaries by ±2% of domain
  - Goal: Change the effective support
  
  ## Phase 2: Probe-Based Selection
  
  1. For each mutation type, generate 2-3 concrete implementations
  
  2. Call probe_solution for EACH to rank them
  
  3. Select TOP 2 by probe score for full evaluation
  
  4. If probe scores are similar (<2% difference), try a different mutation type
  
  ## Phase 3: Full Evaluation & Iteration
  
  1. Evaluate top variants with evaluate_solution
  
  2. If improvement: repeat Phase 1-2 with the new best
  
  3. If no improvement after 10 mutation cycles: try a new architecture
  
  ## Key Rules
  
  - MUTATE THE WINNING PATTERN, don't replace it
  - Use probes to filter (they're reliable for same-architecture variants)
  - Small mutations first, then larger ones
  - Track which mutation type works best
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to implement a mutation from analyze_and_mutate_step.
    
    Target mutations:
    - Height perturbations: change level values by ±0.02-0.08
    - Width adjustments: change interval boundaries by ±3-8%
    - Asymmetric changes: make left/right widths different
    - Level splits: split a high level into two with different heights
    - Position shifts: shift all boundaries by ±2%
    
    Use SEARCH/REPLACE to modify:
    - The level heights array
    - The position/boundary calculations
    - The conditional logic for asymmetric patterns
    
    Start with SMALL perturbations (±0.02-0.05 on heights, ±3% on widths).
  evaluate_solution: |
    Full evaluation. Returns combined_score. Call ONCE per mutation variant after probing.
    
    Budget: 30 evals total. Use probe_solution to filter first, then evaluate the TOP 2-3 variants.
  probe_solution: |
    Approximate score on subsampled data. RELIABLE when comparing variants of the SAME architecture (step functions).
    
    Strategy:
    1. After calling analyze_and_mutate_step, you get 5 mutation proposals
    2. Call probe_solution for EACH to rank them
    3. Select TOP 2 by probe score for full evaluation
    4. If probe scores are similar (<5% difference), try a different mutation type
    
    You have 30 probes - use them to avoid wasting full evaluations on bad mutations.
  finish: |
    Report the best C₂ achieved (combined_score), the mutation type that produced it,
    and the number of iterations. Example: "Best combined_score: 1.052, achieved by 'asymmetric_perturbation' after 8 iterations."
sampling:
  temperature: 0.4
  top_p: 0.9
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 18000
new_tools:
- name: analyze_and_mutate_step
  description: |
    Analyze the current step-function parameters and propose targeted mutations. Returns mutation proposals with code snippets for height fine-tuning, width redistribution, asymmetric perturbations, level mergesplits, and position shifts. Call this first to understand and improve the winning architecture.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import re
        import random
        
        code = ctx.get_program()
        lines = code.split('\n')
        n = 600
        
        # Extract actual step levels from the EVOLVE-BLOCK
        levels_found = []
        
        for line in lines:
            if '.set(' in line and 'jnp.array' in line:
                try:
                    match = re.search(r'set\((\d+\.?\d*)', line)
                    if match:
                        levels_found.append(float(match.group(1)))
                except:
                    pass
        
        # Default to reasonable step function levels if not found
        if not levels_found:
            levels_found = [1.0, 1.4, 2.0, 1.4, 1.0]
        
        # Generate 5 mutation proposals
        mutations = [
            {
                "type": "height_fine_tuning",
                "description": "Perturb heights by ±0.02-0.05",
                "rationale": "Fine-tune the L2/inf ratio with small changes",
                "code_snippet": "import jax.numpy as jnp\nimport random\nrandom.seed(42)\nf_values = jnp.linspace(-3, 3, {n})\nf = jnp.zeros({n})\nlevels = jnp.array({levels_found})\nfor i in range(len(levels)):\n    delta = random.uniform(-0.04, 0.04)\n    levels = levels.at[i].set(levels[i] + delta)\npositions = jnp.linspace(-1, 1, 6)\nfor i in range(len(positions) - 1):\n    start = int((positions[i] + 1) / 2 * {n})\n    end = int((positions[i+1] + 1) / 2 * {n})\n    f = f.at[start:end].set(levels[i])\nf = jnp.maximum(f, 1e-6)",
                "mutation_params": {"delta_range": [-0.04, 0.04]}
            },
            {
                "type": "width_redistribution",
                "description": "Redistribute interval widths by ±3%",
                "rationale": "Expand core intervals to increase L2 norm",
                "code_snippet": "import jax.numpy as jnp\nimport random\nrandom.seed(42)\nf_values = jnp.linspace(-3, 3, {n})\nf = jnp.zeros({n})\nlevels = jnp.array({levels_found})\npositions = jnp.linspace(-1, 1, 6)\nfor i in range(len(positions) - 1):\n    # Expand middle intervals, contract outer ones\n    if 1 <= i <= 3:\n        delta = random.uniform(0.02, 0.04)\n        positions = positions.at[i+1].set(positions[i+1] + delta)\n    else:\n        delta = random.uniform(-0.02, -0.04)\n        positions = positions.at[i+1].set(positions[i+1] + delta)\nfor i in range(len(positions) - 1):\n    start = int((positions[i] + 1) / 2 * {n})\n    end = int((positions[i+1] + 1) / 2 * {n})\n    f = f.at[start:end].set(levels[i])\nf = jnp.maximum(f, 1e-6)",
                "mutation_params": {"width_delta": [-0.04, 0.04]}
            },
            {
                "type": "asymmetric_perturbation",
                "description": "Break symmetry by making left/right widths different",
                "rationale": "Reduce constructive interference from perfect symmetry",
                "code_snippet": "import jax.numpy as jnp\nf_values = jnp.linspace(-3, 3, {n})\nf = jnp.zeros({n})\n# Asymmetric widths: left narrower, right wider\nleft_width = 0.22 * {n}\nright_width = 0.28 * {n}\nplateau = {n} - left_width - right_width\nf = f.at[0:left_width].set(levels[0])\nf = f.at[{n}-right_width:{n}].set(levels[4])\nf = f.at[left_width:{n}-right_width].set(levels[2])\nf = jnp.maximum(f, 1e-6)",
                "mutation_params": {"left_width_frac": 0.22, "right_width_frac": 0.28}
            },
            {
                "type": "level_split",
                "description": "Split the highest level into two",
                "rationale": "Create more sophisticated step pattern with 6 levels",
                "code_snippet": "import jax.numpy as jnp\nimport random\nrandom.seed(42)\nf_values = jnp.linspace(-3, 3, {n})\nf = jnp.zeros({n})\nlevels = jnp.array({levels_found})\npositions = jnp.linspace(-1, 1, 7)  # 6 intervals for split\nfor i in range(len(positions) - 1):\n    start = int((positions[i] + 1) / 2 * {n})\n    end = int((positions[i+1] + 1) / 2 * {n})\n    if i == 2:\n        mid = (start + end) // 2\n        f = f.at[start:mid].set(levels[2] + 0.08)\n        f = f.at[mid:end].set(levels[2] + 0.12)\n    else:\n        f = f.at[start:end].set(levels[i])\nf = jnp.maximum(f, 1e-6)",
                "mutation_params": {"split_level": 2, "delta1": 0.08, "delta2": 0.12}
            },
            {
                "type": "position_shift",
                "description": "Shift all boundaries by +2% of domain",
                "rationale": "Change effective support, possibly reducing ||f★f||_inf",
                "code_snippet": "import jax.numpy as jnp\nf_values = jnp.linspace(-3, 3, {n})\nf = jnp.zeros({n})\nlevels = jnp.array({levels_found})\npositions = jnp.linspace(-1, 1, 6) + 0.04  # Shift right\nfor i in range(len(positions) - 1):\n    start = int((positions[i] + 1) / 2 * {n})\n    end = int((positions[i+1] + 1) / 2 * {n})\n    f = f.at[start:end].set(levels[i])\nf = jnp.maximum(f, 1e-6)",
                "mutation_params": {"shift": 0.04}
            }
        ]
        
        return {"mutations": mutations, "note": "Use probe_solution to rank these mutations before full evaluation. Probes are reliable for comparing step-function variants."}
new_skills: []
new_middlewares:
- name: probe_reminder
  hook: before_tool
  description: Remind solver to use probe_solution before evaluate_solution
  implementation_py: |
    def before_tool(hook_input):
        if "evaluate_solution" in str(hook_input).lower():
            return "IMPORTANT: Have you called probe_solution for this variant first? Use probes to filter before spending full evaluations. You have 30 probes!"
        return None
