type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a mutation from analyze_and_mutate_step.


  Target mutations:

  - Height perturbations: change level values by ±0.02-0.08

  - Width adjustments: change interval boundaries by ±3-8%

  - Asymmetric changes: make left/right widths different

  - Level splits: split a high level into two with different heights

  - Position shifts: shift all boundaries by ±2%


  Use SEARCH/REPLACE to modify:

  - The level heights array

  - The position/boundary calculations

  - The conditional logic for asymmetric patterns


  Start with SMALL perturbations (±0.02-0.05 on heights, ±3% on widths).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
