type: tool
name: finish
description: 'Report the best C₂ achieved (combined_score), the mutation type that produced it,

  and the number of iterations. Example: "Best combined_score: 1.052, achieved by ''asymmetric_perturbation''
  after 8 iterations."'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
