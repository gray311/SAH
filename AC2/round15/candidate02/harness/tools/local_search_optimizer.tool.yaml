type: tool
name: local_search_optimizer
description: 'Perform bounded internal search to escape local optima. Generates 5-10 variants of the current
  best function, probes them cheaply, and returns the best. Designed for this C₂ maximization task where
  the step-function record is a local optimum.


  How it works:

  1. Retrieves current best function via ctx.get_best_program()

  2. Generates 5-10 variants by perturbing heights, widths, positions (seed program has C2Optimizer class)

  3. Uses probe_solution to rank all variants (30 probe budget for this tool)

  4. Returns the best variant with its probe score

  5. The variant is ready for full evaluation if probe score > current best


  When to call: Always at iteration 1, and after each diverse proposal generation.


  Returns: {"best_variant": "code", "best_probe_score": float, "num_variants": int}'
input_schema:
  type: object
  properties:
    num_variants:
      type: integer
      default: 10
    perturbation_strength:
      type: float
      default: 0.1
