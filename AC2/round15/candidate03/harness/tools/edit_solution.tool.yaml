type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK with SMALL search/replace mutations: - Height: change step values
  by ±0.02 to ±0.08 (e.g., 1.50 → 1.54 or 1.46) - Width: shift boundaries by 3-8% (e.g., 0.25n → 0.27n,
  0.75n → 0.72n) - Asymmetry: make left/right steps different (e.g., left=1.52, right=1.48) - Multi-level:
  adjust intermediate heights relative to core - Keep edits focused and incremental'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
