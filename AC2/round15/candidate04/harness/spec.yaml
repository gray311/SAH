schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization for the C₂ constant:
  C₂ = ||f★f||₂² / ((∫f)² ||f★f||_∞), where f: R→R is non-negative.

  Current best: 0.8962799441554086 (step function by AlphaEvolve, reported as combined_score 1.03841).

  **Your mission: FIND A COMPLETELY NEW FUNCTION CLASS that beats the step-function record.**

  Critical insight: The step-function solutions are LOCAL optima. To break through, you MUST
  implement concrete SEARCH/REPLACE edits that transform the seed code into new architectures.

  **Execution Protocol:**

  1. At iteration 1, call get_mutation_template to get a ready-to-execute template for ONE new function
     family (Gaussian mixtures, piecewise-linear, oscillatory decay, or asymmetric multi-level steps).

  2. Call edit_solution with the EXACT SEARCH/REPLACE code that replaces the seed's EVOLVE-BLOCK
     with the new architecture. The edit must be VALID Python code.

  3. Call evaluate_solution ONCE per mutation to confirm. If it beats the record, you've succeeded.
     If not, generate a DIFFERENT template and try again.

  4. Never call probe_solution — the evaluator is numerically sensitive; use evaluate_solution directly.

  5. If stuck after 15 iterations: call get_mutation_template again for a NEW function family.

  6. Constraints: f(x)≥0, ∫f>0, numerically stable convolution. Use jnp.maximum or softplus for positivity.

  Tools:
  - edit_solution: Replace the EVOLVE-BLOCK with your new function implementation. The edit must be
    syntactically valid Python that produces a non-negative function.
  - evaluate_solution: Full evaluation. Returns combined_score. Call ONCE per mutation variant.
  - finish: Report the best C₂ achieved and the function family.
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
  - name: get_mutation_template
    description: |
      Return a ready-to-execute mutation template for ONE new function family. Provides guidance
      on the architecture to implement and how to edit the seed code. Call this ONCE per iteration.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import random
          random.seed(42)
          template_idx = args.get("template_idx", 0)
          
          templates = [
              {
                  "family": "gaussian_mixture",
                  "rationale": "Smooth multi-peaked Gaussian mixtures create better L2/∞ ratios than steps."
              },
              {
                  "family": "piecewise_linear",
                  "rationale": "Piecewise linear with optimized vertices creates structured patterns."
              },
              {
                  "family": "oscillatory_decay",
                  "rationale": "Oscillatory functions with decay create structured convolutions."
              },
              {
                  "family": "asymmetric_multi_level",
                  "rationale": "Asymmetric multi-level steps break symmetry for better ratios."
              }
          ]
          
          template = templates[template_idx % len(templates)]
          return {
              "family": template["family"],
              "template_idx": template_idx,
              "rationale": template["rationale"],
              "edit_instruction": "Replace the seed's EVOLVE-BLOCK with a complete implementation of this function family using jax.numpy. Ensure the code is valid Python."
          }
remove_tools:
  - probe_solution
new_skills:
  - name: concrete-mutation-protocol
    description: Execute templates as SEARCH/REPLACE edits to transform the seed code into new architectures.
    body: |
      # Concrete Mutation Protocol for C₂ Maximization
      
      ## Core Principle
      
      Don't just talk about exploration. ACTUALLY EXECUTE mutations by replacing the seed's EVOLVE-BLOCK
      with complete, syntactically valid Python code for a new function architecture.
      
      ## Phase 1: Template Selection (Each Iteration)
      
      1. Call get_mutation_template to get ONE template for a DIFFERENT function family than you've tried.
      
      2. Try these families:
         - Gaussian mixtures: f(x) = sum w_i * exp(-((x-mu_i)^2)/(2*sigma_i^2))
         - Piecewise-linear: Linear segments connecting optimized vertices
         - Oscillatory with decay: f(x) = (1 + alpha*cos(beta*x)) * exp(-gamma*|x|)
         - Asymmetric multi-level steps: Multiple levels with broken symmetry
      
      ## Phase 2: Concrete Execution
      
      1. Generate a SEARCH/REPLACE edit that:
         - Finds "# EVOLVE-BLOCK-START" in the seed
         - Replaces everything to "# EVOLVE-BLOCK-END" with your new implementation
         - Ensures result is VALID Python defining C2Optimizer._objective_fn
      
      2. Call edit_solution with the COMPLETE replacement code. Do NOT make small tweaks —
         REPLACE the entire function architecture.
      
      ## Phase 3: Evaluation
      
      1. Call evaluate_solution ONCE to test your mutation.
      
      2. If combined_score > 1.03896: You've beaten the record!
      
      3. If combined_score ≤ 1.03896: Generate a NEW template (different family) and try again.
      
      ## Critical Rules
      
      - NEVER refine one function type for 5+ iterations without trying a new architecture
      - NEVER use probe_solution — evaluator is numerically sensitive
      - ALWAYS call get_mutation_template before editing
      - The edit must be complete, valid Python — ensure it works before submitting
tool_descriptions:
  edit_solution: |
    Replace the EVOLVE-BLOCK with a complete new function implementation. The replacement
    must be VALID Python code that defines C2Optimizer with _objective_fn. Use get_mutation_template to
    get guidance on the architecture (Gaussian mixtures, piecewise-linear, oscillatory decay,
    asymmetric multi-level steps). Make a COMPLETE replacement, not a small tweak.
  evaluate_solution: |
    Full evaluation. Returns combined_score. Call ONCE per mutation variant. Budget: 30 evals.
    Each eval tests one concrete architecture replacement.
  finish: |
    Report the best C₂ achieved and the function family that produced it.
