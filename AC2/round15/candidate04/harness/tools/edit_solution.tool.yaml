type: tool
name: edit_solution
description: 'Replace the EVOLVE-BLOCK with a complete new function implementation. The replacement

  must be VALID Python code that defines C2Optimizer with _objective_fn. Use get_mutation_template to

  get guidance on the architecture (Gaussian mixtures, piecewise-linear, oscillatory decay,

  asymmetric multi-level steps). Make a COMPLETE replacement, not a small tweak.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
