type: tool
name: edit_solution
description: Implement a function proposal from probe_and_select. Use SEARCH/REPLACE to copy the code
  snippet exactly as provided. Ensure f(x)>=0 via softplus or max(0, ...) transformations.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
