schema: h2spec/1.0
system_prompt: |
  You are optimizing for C₂ = ||f★f||₂² / ((∫f)² ||f★f||_∞), the second autocorrelation inequality constant.
  Current best: 0.8962799441554086 (step functions, combined_score=1.03896).
  
  CRITICAL: The seed program starts near a LOCAL optimum for step functions. To beat it, you MUST abandon step-function refinement and explore ENTIRELY DIFFERENT function families immediately.
  
  Strategy: PARALLEL ARCHITECTURAL SEARCH
  
  1. ITERATION 0: Call generate_candidates to get 5 diverse function proposals across DIFFERENT families (Gaussian mixtures, B-spline basis, piecewise-linear, oscillatory decay, multi-level asymmetric steps).
  
  2. PROBE-FIRST FILTERING: Use probe_solution (30-budget, ~10x faster than full eval) to rank all 5 proposals. ONLY call evaluate_solution on the top 2-3 that exceed current best by probe.
  
  3. PARALLEL EVALUATION: Evaluate top proposals with evaluate_solution. If none beat the record, GENERATE A NEW SET of candidates from a different angle (don't refine losers).
  
  4. NO SEQUENTIAL REFINEMENT: Never spend >2 iterations on a single family without trying another. If a family fails to improve after 1 probe+1 eval, abandon it immediately.
  
  5. STAGNATION RECOVERY: After 5 iterations with no improvement, call generate_candidates again with a different "flavor" (e.g., if last used smooth functions, try sharp ones).
  
  Function constraints: f(x)≥0, ∫f>0, numerically stable convolution.
  
  Tools:
  - edit_solution: Implement code from generate_candidates output
  - evaluate_solution: Full score (30 budget, call sparingly)
  - probe_solution: Approx score on subsample (30 budget, FAST - USE TO FILTER BEFORE EVAL)
  - generate_candidates: Get 5 diverse proposals across families
skill_description: Parallel architectural search across function families with probe-based filtering. Explore Gaussian mixtures, splines, oscillatory decay, and multi-level steps in parallel. Abandon failing families immediately.
skill_body: |
  # C₂ Optimizer: Parallel Architectural Search Protocol
  
  ## Core Principle
  
  The step-function record is a LOCAL optimum. Break through by exploring DIFFERENT function architectures in PARALLEL with PROBE-BASED FILTERING.
  
  ## Phase 1: Diverse Generation (Iteration 0)
  
  1. CALL generate_candidates IMMEDIATELY to get 5 proposals across families:
     - Gaussian mixtures (smooth, multi-peaked)
     - B-spline basis (flexible smooth transitions)  
     - Piecewise-linear (controlled smoothness)
     - Oscillatory with decay (structured convolutions)
     - Multi-level asymmetric steps (refined steps)
  
  2. EXPECTATION: At least one family should beat the step-function record.
  
  ## Phase 2: Probe-Based Ranking
  
  1. For each of the 5 proposals, call probe_solution to get approximate scores.
  
  2. You have 30 probes - use ALL of them to rank proposals.
  
  3. Select TOP 2-3 by probe score for full evaluation. SKIP families with low probe scores.
  
  ## Phase 3: Full Evaluation
  
  1. For each top proposal, call evaluate_solution ONCE to confirm.
  
  2. If a proposal beats the record (combined_score > 1.03896): 
     - Keep it as current best
     - Generate NEW candidates from a DIFFERENT angle (don't over-refine)
     - You have 27-28 evals remaining - use them to explore more families
  
  3. If NO proposal beats the record:
     - Generate a NEW set of candidates (don't refine losers)
     - Try completely different families
  
  ## Phase 4: Rapid Family Switching
  
  - Never spend >2 iterations on a single family without trying another.
  - If probe+eval fails to improve, ABANDON that family immediately.
  - Parallel exploration > sequential refinement.
  
  ## Phase 5: Stagnation Recovery
  
  After 5 iterations with no improvement:
  - Call generate_candidates again
  - Try opposite "flavor" (smooth↔sharp, symmetric↔asymmetric)
  - Mix elements from multiple successful proposals
  
  ## Key Rules
  
  1. PROBE FIRST, then EVALUATE (30 probes available!)
  2. PARALLEL exploration of 5+ families at iteration 0
  3. ABANDON failing families immediately (don't refine losers)
  4. ONE eval per promising proposal, then move on
  5. The goal is to find ANY function class that beats step functions
tool_descriptions:
  edit_solution: 'Implement code from generate_candidates output. Copy the code_snippet directly or make minimal adjustments. Do NOT try to improve on-the-fly - use the proposal as-is.'
  evaluate_solution: 'Full evaluation. Returns combined_score. Budget: 30 total. Call ONCE per proposal that passed probe filtering. Each eval tests one concrete function - ensure it''s ready to test.'
  probe_solution: 'Approximate score on subsampled data (~10s vs minutes). Budget: 30 probes, separate from eval budget. FAST - USE THIS TO RANK ALL 5 PROPOSALS BEFORE SPENDING EVALS. Call probe_solution for each candidate first, then evaluate only top 2-3 by probe score.'
  finish: 'Report the best combined_score achieved and which function family produced it.'
sampling:
  temperature: 1.1
  top_p: 0.9
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 0
  long_tool_output_max_chars: 20000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares: []
