type: tool
name: edit_solution
description: Implement code from generate_candidates output. Copy the code_snippet directly or make minimal
  adjustments. Do NOT try to improve on-the-fly - use the proposal as-is.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
