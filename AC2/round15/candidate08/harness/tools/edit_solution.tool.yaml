type: tool
name: edit_solution
description: 'Implement a COMPLETE function architecture from generate_candidates. Do NOT edit existing
  code incrementally.

  Generate new f(x) that matches the candidate''s family exactly (e.g., full Gaussian mixture code, not
  "adjust this parameter").

  Use jax/jax.numpy for efficiency. Ensure f(x) ≥ 0 and ∫f > 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
