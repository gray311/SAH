type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a step-pattern mutation. Target:

  - Use SEARCH/REPLACE to adjust height values (±0.02-0.08), interval widths (±3-8%), or positions (±2-4%)

  - For height mutations: change specific level heights (e.g., level 2: 1.40 → 1.44)

  - For width mutations: adjust interval boundaries (e.g., int(0.30*n) → int(0.32*n))

  - For hybrid mutations: splice together segments from different seed patterns

  - Keep f(x) ≥ 0: ensure all heights are positive'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
