type: tool
name: probe_solution
description: 'Approximate score on subsampled data (10% sample). FAST, separate 30-probe budget, NOT comparable
  to full scores.


  USE THIS STRATEGY:

  1. Generate 10-15 mutations

  2. Call probe_solution for all 10-15 to rank them

  3. Call evaluate_solution only for top 3-5 by probe score

  4. This filters out bad mutations before spending precious evals


  PROBE SCORING IS RELIABLE FOR RANKING RELATIVE ORDER WITHIN A BATCH.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
