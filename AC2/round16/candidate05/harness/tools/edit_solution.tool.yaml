type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. Implement ONE of these mutation types:\n\n1. HEIGHT: Change one peak
  by ±0.03 to ±0.08 (e.g., 1.50 → 1.55). Target your highest-scoring pattern.\n\n2. WIDTH: Change one
  interval boundary by +3% to +6% (e.g., 0.22n → 0.26n). Expand the core.\n\n3. ASYMMETRY: Make heights
  asymmetric: [h, h+δ, h-δ] where δ∈[0.03,0.08].\n\n4. BUMP: For patterns with bumps, adjust bump_height
  by +0.05 to +0.10, or bump_width by -5%.\n\n5. NEW ARCHITECTURE: For iterations 26+, implement a new
  function family (Gaussian, B-spline, oscillatory) using appropriate JAX code.\n\nUse JAX array mutation:
  f = f.at[start:end].set(value). Ensure f ≥ 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
