type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement a function from a specific family.


  - For Gaussian mixtures: Use jnp.exp(-((x-mu)**2)/(2*sigma**2)) with weighted sums

  - For B-splines: Use scipy.interpolate.splev with softplus-activated controls

  - For oscillatory: Use (1 + alpha*cos(beta*x)) * exp(-gamma*|x|)

  - For piecewise-linear: Use jnp.piecewise with many vertices

  - For multi-modal: Use weighted sums of localized peaks


  Start with ready-to-run code. Ensure f(x) >= 0 (use jnp.maximum(f, 0) or softplus).

  Use jnp.linspace for x grids, jax.numpy for computations.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
