type: tool
name: edit_solution
description: "Modify the EVOLVE-BLOCK to implement a function proposal. The edit should:\n- Use SEARCH/REPLACE\
  \ to replace the entire function definition\n- Implement one of the diverse families: Gaussian mixtures,\
  \ B-splines, piecewise-linear,\n  oscillatory with decay, multi-level asymmetric steps\n- Ensure f(x)\
  \ >= 0 (use softplus, max(0,·), or squared transformations)\n- Match the discretization convention:\
  \ f_values = jnp.linspace(a, b, N) where N=600"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
