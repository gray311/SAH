schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and harmonic analysis for maximizing C₂ = ||f★f||₂² / ((∫f)² ||f★f||_∞).
  
  Current best: 0.8962799441554086 (step function, combined_score 1.03896).
  
  CRITICAL INSIGHT: Step functions are deeply local optima. To beat them, you MUST work in function spaces that are MATHEMATICALLY ORTHOGONAL to steps - NOT mutations of steps, not even smooth transitions.
  
  STRATEGY: Spectral Methods & Variational Search
  1. At iteration 1, generate candidates from these DISTINCT function spaces:
     - FOURIER eigenfunctions: f(x) = sum c_k * sin(kπx/L) with optimized coefficients
     - LAGUERRE polynomials: f(x) = sum a_n * L_n(αx²) * exp(-αx²/2)
     - HANKEL-transformed functions: radial basis in disguise
     - VARIATIONAL trial functions: f_λ(x) from calculus of variations optimality conditions
     - DENSE-SPARSE HYBRIDS: Continuous regions interspersed with sharp features (not step patterns)
  
  2. For each candidate, CALL evaluate_solution DIRECTLY. Do NOT use probes to filter.
  
  3. After exhausting one function space (no improvement after 3 evals), switch to a completely different space.
  
  4. Key mathematical insight: The C₂ constant is tied to spectral properties. Explore functions whose Fourier transforms have specific spectral shapes (band-limited, sparse in frequency, etc.).
  
  5. Constraints: f(x) ≥ 0, ∫f > 0, numerical stability in convolution via FFT.

skill_description: Spectral variational search for C₂ maximization. Use mathematically orthogonal function spaces (Fourier eigenfunctions, Laguerre polynomials, variational trial functions) rather than mutating step patterns.
skill_body: |
  # Spectral Variational Protocol for C₂ Maximization
  
  ## Core Principle
  
  Step functions are local optima. To break through, work in FUNCTION SPACES that are mathematically orthogonal to steps - not smooth steps, but fundamentally different representations.
  
  ## Function Space Hierarchy (try in order, exhaust each before moving on)
  
  ### Space 1: Fourier Eigenfunctions
  f(x) = Σ_{k=1}^K c_k * φ_k(x) where φ_k are orthonormal basis functions (sine/cosine, Laguerre, Hermite)
  - Start with K=3-5 terms
  - Optimize coefficients c_k to maximize C₂
  - Ensure f(x) ≥ 0 via softplus/post-processing
  
  ### Space 2: Variational Trial Functions
  Use known optimality conditions from calculus of variations:
  - Euler-Lagrange solutions for C₂ optimization
  - Ansatz: f(x) = exp(-V(x)) where V(x) solves a variational problem
  - Try: f(x) = (1 + α cos(βx))ⁿ * exp(-γ|x|) for n=2,3,...
  
  ### Space 3: Dense-Sparse Hybrids
  Not step functions, but structured sparsity:
  - f(x) = base_envelope(x) * (1 + sparse_features(x))
  - base_envelope: smooth Gaussian or exponential decay
  - sparse_features: localized bumps at optimized positions (not fixed step edges)
  
  ### Space 4: Hankel/Radial Functions
  - f(x) = g(|x|) where g is optimized for radial symmetry
  - Relate to spherical harmonics in higher dimensions
  
  ### Space 5: Hermite-Gaussian Functions
  - Eigenfunctions of the Fourier transform
  - Natural for convolution-optimized functions
  
  ## Exploration Protocol
  
  1. Pick ONE function space from the hierarchy above
  2. Generate 2-3 concrete implementations in that space
  3. Evaluate each with evaluate_solution (NO PROBES - they are unreliable)
  4. If no improvement after 3 evals: switch to a different space
  5. Keep track of which space is most promising
  
  ## Key Mathematical Insights
  
  - The C₂ constant is tied to spectral properties of f★f
  - Fourier-domain optimization may reveal structure hidden in real space
  - Variational methods can give analytic hints about optimal shapes
  - Smooth functions with "bump" features (not steps) may achieve better L₂/∞ ratios

tool_descriptions:
  edit_solution: 'Edit the EVOLVE-BLOCK to implement a function from a SPECTRAL or VARIATIONAL space. Options:
    - Fourier eigenfunction expansion: f(x) = Σ c_k * sin(kπx/L)
    - Laguerre polynomial mixture: f(x) = Σ a_n * L_n(αx²) * exp(-αx²/2)
    - Variational ansatz: f(x) = (1 + α*cos(βx))^n * exp(-γ|x|)
    - Dense-sparse hybrid: f(x) = exp(-γ|x|) * (1 + Σ b_j * exp(-((x-x_j)/σ_j)²))
    Ensure f(x) ≥ 0 and use reasonable parameter ranges.'
  evaluate_solution: 'Full evaluation. Returns combined_score. Call directly on each candidate - do NOT use probes to filter. You have 30 evaluations to exhaust diverse function spaces.'
  probe_solution: 'Approximate score on subsampled data. SKIP this task - probes are unreliable and will mislead you. Always use evaluate_solution directly.'
  finish: Report the function space type, key parameters, and best C₂ achieved.
sampling:
  temperature: 1.0
  top_p: 0.9
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
- name: spectral_candidate_generator
  description: |
    Generate 3-5 candidates from MATHEMATICALLY DISTINCT spectral/variational function spaces.
    Spaces: Fourier eigenfunctions, Laguerre polynomials, variational trial functions,
    Hankel radial functions, dense-sparse hybrids. Each candidate is complete code ready for evaluation.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import random
        random.seed(42)
        proposals = []
        
        # Space 1: Fourier eigenfunctions (sine series)
        proposals.append({
            "family": "fourier_eigen",
            "description": "Fourier sine series: f(x) = sum c_k * sin(k*pi*(x+L/2)/L), optimized coefficients",
            "code_snippet": "import jax.numpy as jnp\\nimport jax\\nf_values = jnp.linspace(-3, 3, 600)\\nL = 6.0\\nK = 5\\nks = jnp.arange(1, K+1)\\nweights = jnp.exp(-jnp.sqrt(ks))\\nc = jnp.zeros_like(ks)\\nc = c.at[0].set(1.0)\\nc = c.at[1:4].set(0.3 + 0.2 * random.random(3))\\nc = c.at[4:].set(0.15 + 0.05 * random.random(len(c)))\\nf = (c[None,:] * jnp.sin(ks[None,:] * jnp.pi * (f_values + L/2) / L)).sum(axis=0)\\nf = jnp.maximum(f, 1e-6)\\nf = f / jnp.max(f)",
            "rationale": "Eigenfunctions of convolution operators may optimize spectral ratios"
        })
        
        # Space 2: Laguerre polynomial mixture
        proposals.append({
            "family": "laguerre",
            "description": "Laguerre polynomials with exponential weight: f(x) = sum a_n * L_n(alpha*x^2) * exp(-alpha*x^2/2)",
            "code_snippet": "import jax.numpy as jnp\\nimport jax\\nf_values = jnp.linspace(-3, 3, 600)\\nalpha = 0.8 + 0.3 * random.random()\\nn_terms = 4\\nfrom scipy.special import eval_laguerre\\nL_vals = jnp.stack([eval_laguerre(alpha * f_values**2 / 2, i) for i in range(n_terms)], axis=0)\\ncoeffs = jnp.random.uniform(0.3, 1.5, n_terms)\\ncoeffs = coeffs / jnp.sum(coeffs)\\nf = (coeffs[None,:] * L_vals).sum(axis=0)\\nf = f * jnp.exp(-alpha * f_values**2 / 2)\\nf = jnp.maximum(f, 1e-6)",
            "rationale": "Laguerre basis is natural for functions on semi-infinite domains with decay"
        })
        
        # Space 3: Variational modulated envelope
        proposals.append({
            "family": "variational_modulated",
            "description": "f(x) = (1 + alpha*cos(beta*x))^n * exp(-gamma*|x|), variational trial function",
            "code_snippet": "import jax.numpy as jnp\\nimport jax\\nf_values = jnp.linspace(-5, 5, 800)\\nn = random.choice([2, 3, 4])\\nalpha = 0.2 + 0.3 * random.random()\\nbeta = 2.0 + 3.0 * random.random()\\ngamma = 0.5 + 0.5 * random.random()\\nf = (1 + alpha * jnp.cos(beta * f_values))**n * jnp.exp(-gamma * jnp.abs(f_values))\\nf = jnp.maximum(f, 1e-6)",
            "rationale": "Variational trial functions from calculus of variations may capture optimal shape"
        })
        
        # Space 4: Dense-sparse hybrid
        proposals.append({
            "family": "dense_sparse_hybrid",
            "description": "f(x) = base_exp + sum localized Gaussian bumps at optimized positions",
            "code_snippet": "import jax.numpy as jnp\\nimport jax\\nf_values = jnp.linspace(-4, 4, 700)\\nbase = jnp.exp(-0.6 * jnp.abs(f_values))\\nnum_bumps = 3\\nbump_centers = f_values[jnp.linspace(-0.3, 0.3, num_bumps)]\\nbump_widths = jnp.array([0.4, 0.5, 0.35])\\nfor i in range(num_bumps):\\n    dist = jnp.abs(f_values[:,None] - bump_centers[i][None])\\n    f = f + 0.4 * jnp.exp(-dist**2 / bump_widths[i]**2)\\nf = jnp.maximum(f, 1e-6)\\nf = f / jnp.max(f)",
            "rationale": "Localized features on smooth background may improve L2/infinity ratio better than steps"
        })
        
        # Space 5: Hermite-Gaussian
        proposals.append({
            "family": "hermite_gaussian",
            "description": "Hermite-Gaussian: f(x) = sum a_n * H_n(sqrt(alpha)*x) * exp(-alpha*x^2/2)",
            "code_snippet": "import jax.numpy as jnp\\nimport jax\\nf_values = jnp.linspace(-3, 3, 600)\\nalpha = 0.7 + 0.3 * random.random()\\nfrom scipy.special import hermite\\nn_terms = 4\\nH_polys = [hermite(i) for i in range(n_terms)]\\nH_vals = jnp.stack([H_polys[i](jnp.sqrt(alpha) * f_values) for i in range(n_terms)], axis=0)\\ncoeffs = jnp.random.uniform(0.2, 1.2, n_terms)\\ncoeffs = coeffs / jnp.sum(coeffs)\\nf = (coeffs[None,:] * H_vals).sum(axis=0)\\nf = f * jnp.exp(-alpha * f_values**2 / 2)\\nf = jnp.maximum(f, 1e-6)\\nf = f / jnp.max(f)",
            "rationale": "Hermite functions are eigenfunctions of Fourier transform, natural for convolution problems"
        })
        
        return {
            "proposals": proposals,
            "note": "Evaluate each candidate DIRECTLY with evaluate_solution. Do NOT use probes."
        }
new_skills:
- name: orthogonal-search-protocol
  description: |
    Systematically explore mathematically orthogonal function spaces without probe-based filtering.
    Exhaust each space before moving to the next. NEVER use unreliable probes.
  body: |
    # Orthogonal Search Protocol for C₂ Maximization
    
    ## Core Principle
    
    Step functions are local optima in a specific function space. To beat them, you MUST work in SPACES that are mathematically orthogonal to steps - not smooth steps, but fundamentally different representations.
    
    ## The Function Space Hierarchy
    
    Work through these spaces sequentially, exhausting each before moving on:
    
    ### 1. Fourier Eigenfunction Space
    - Represent f as linear combination of sine/cosine eigenfunctions
    - Optimize coefficients, not positions of "steps"
    - Key insight: Convolution becomes multiplication in Fourier space
    
    ### 2. Laguerre Polynomial Space
    - Natural for functions with exponential decay
    - Orthogonal basis for weighted L² spaces
    - Try: f(x) = sum a_n * L_n(alpha*x²) * exp(-alpha*x²/2)
    
    ### 3. Variational Trial Space
    - Use ansatz functions from calculus of variations
    - Example: f(x) = (1 + alpha*cos(beta*x))^n * exp(-gamma*|x|)
    - These satisfy optimality conditions for certain energy functionals
    
    ### 4. Hermite-Gaussian Space
    - Eigenfunctions of the Fourier transform
    - Natural for convolution-optimized functions
    - Try: f(x) = sum a_n * H_n(sqrt(alpha)*x) * exp(-alpha*x²/2)
    
    ### 5. Dense-Sparse Hybrid Space
    - Smooth envelope with localized feature bumps
    - NOT step functions - bumps have smooth transitions
    - Try: base_exp(x) + sum b_j * exp(-((x-x_j)/sigma_j)²)
    
    ## Execution Protocol
    
    1. Pick ONE function space from the hierarchy
    2. Generate 2-3 concrete implementations in that space
    3. Evaluate EACH with evaluate_solution (NO PROBES)
    4. If no improvement after 3 evals: switch to next space
    5. Track which space is most promising
    6. After exhausting all 5 spaces, consider mixed-space candidates
    
    ## Critical Rules
    
    - NEVER use probe_solution - it is UNRELIABLE and will mislead
    - NEVER refine a step pattern - completely abandon that space
    - NEVER stay in one space for more than 3 evals
    - ALWAYS try a mathematically distinct space when stalling
    - Use temperature >= 1.0 for broad exploration
    
    ## Mathematical Intuition
    
    The C₂ constant is tied to spectral properties. Functions whose Fourier transforms have specific structures (band-limited, sparse, etc.) may achieve better ratios. Think in terms of SPECTRAL SHAPES, not real-space steps.

new_middlewares:
- name: force_new_space
  hook: before_model
  description: |
    Middleware that forces switching function spaces after 3 evals without improvement.
    Prevents stagnation in one function family.
  implementation_py: |
    def before_model(hook_input):
        iteration = hook_input.get("iteration", 0)
        consecutive_same_space = hook_input.get("consecutive_same_space", 0)
        if consecutive_same_space >= 3:
            spaces = ["fourier", "laguerre", "variational", "hermite", "dense_sparse"]
            current = hook_input.get("current_space", "")
            idx = spaces.index(current) if current in spaces else 0
            next_space = spaces[(idx + 1) % len(spaces)]
            return "SWITCH TO NEW FUNCTION SPACE: " + next_space.upper() + ". You've exhausted " + current + " after 3 evals. Do not refine the same type."
        return None
- name: no_probe_reminder
  hook: before_tool
  description: |
    Middleware that warns against using unreliable probes.
    Probes are known to be inaccurate for this task's evaluator.
  implementation_py: |
    def before_tool(hook_input):
        if "probe_solution" in hook_input.get("tool_name", ""):
            return "CRITICAL WARNING: probe_solution is UNRELIABLE for this task. Do NOT use it to filter candidates. Always call evaluate_solution directly. Using probes wastes evaluation budget on false positives/negatives."
        return None
