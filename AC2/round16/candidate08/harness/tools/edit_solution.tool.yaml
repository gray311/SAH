type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to implement a function from a SPECTRAL or VARIATIONAL space. Options:
  - Fourier eigenfunction expansion: f(x) = Σ c_k * sin(kπx/L) - Laguerre polynomial mixture: f(x) = Σ
  a_n * L_n(αx²) * exp(-αx²/2) - Variational ansatz: f(x) = (1 + α*cos(βx))^n * exp(-γ|x|) - Dense-sparse
  hybrid: f(x) = exp(-γ|x|) * (1 + Σ b_j * exp(-((x-x_j)/σ_j)²)) Ensure f(x) ≥ 0 and use reasonable parameter
  ranges.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
