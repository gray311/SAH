type: tool
name: edit_solution
description: "Edit the EVOLVE-BLOCK. For new architectures: implement Gaussian mixtures, B-splines, \n\
  oscillatory decay, or piecewise-linear functions. For mutations: small changes (+/-5% width, +/-0.05\
  \ height).\nAlways ensure f >= 0 using jax.nn.softplus or max(0,·). Use JAX array mutation: f = f.at[start:end].set(value)."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
