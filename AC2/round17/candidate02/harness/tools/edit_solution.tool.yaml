type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. Implement: 1. Tiny mutation: ±0.02 height, ±2% width (only on proven
  good functions) 2. New architecture: Gaussian mixture, B-spline, oscillatory, piecewise-linear 3. Hybrid:
  Combine families (e.g., "oscillatory step pattern") Always use JAX mutability: f = f.at[start:end].set(value).
  Ensure f ≥ 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
