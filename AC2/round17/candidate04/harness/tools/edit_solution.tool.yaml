type: tool
name: edit_solution
description: 'Implement a function from generate_candidates proposals, OR make tiny mutations (<=3) on
  a current winner.


  Families to implement:

  1. Gaussian mixture: weighted sum of Gaussians with optimized mu, sigma, weights

  2. B-spline: control points with softplus positivity, optimize knots

  3. Piecewise-linear: linear segments connecting optimized vertices

  4. Oscillatory decay: (1 + alpha * cos(beta*x)) * exp(-gamma*|x|)

  5. Multi-level steps: asymmetric heights/positions at different levels


  Use JAX mutability: f = f.at[start:end].set(value). Ensure f >= 0. For new architectures, write complete
  implementation from generate_candidates snippet.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
