type: tool
name: finish
description: Report best combined_score achieved, the winning function family (Gaussian/B-spline/oscillatory/etc.),
  and key parameters. Explain why it beat step functions.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
