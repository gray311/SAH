type: tool
name: edit_solution
description: 'Implement a concrete function from a generate_candidates proposal, or refine within a winning
  family.


  For new architecture: use the exact code from proposal, ensuring f ≥ 0 via softplus or max(0,·).


  For refinement: modify parameters of winning family (e.g., change Gaussian μ values, adjust B-spline
  controls, vary oscillatory α/β/γ).


  Use JAX array mutation: f = f.at[start:end].set(value).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
