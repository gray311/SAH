type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK for PARAMETER VARIATIONS or NEW ARCHITECTURES:\n\nPHASE 1 (exploration):\n-
  Implement completely new function families if generate_candidates fails or needs fresh proposals.\n-
  Families: Gaussian mixtures, B-spline, piecewise-linear, oscillatory decay, multi-level steps, hybrid
  combinations.\n- Use JAX: f = f.at[start:end].set(value) for mutations.\n\nPHASE 2/3 (refinement):\n-
  Small parameter variations: adjust coefficients by ±5-10%.\n- Combine successful elements from different
  families.\n- Local optimization: refine promising regions.\n- Ensure f ≥ 0 (use jax.nn.softplus or max(0,·)).\n\nExamples:\n-
  Gaussian: vary μ by ±0.3, σ by ±0.15, weights by ±0.1\n- B-spline: adjust control points by ±10%, vary
  knots by ±5%\n- Oscillatory: vary α∈[0.2,0.5], β∈[3,6], γ∈[0.6,1.2]\n- Step patterns: adjust interval
  widths by ±3%, heights by ±0.05.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
