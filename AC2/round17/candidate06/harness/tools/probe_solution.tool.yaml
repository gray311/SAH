type: tool
name: probe_solution
description: 'Approximate score on 10% subsampled data. FAST (10s vs minutes) and budget-efficient (30
  probes total).\n\nUSE THIS TO RANK ALL VARIANTS BEFORE full evaluation.\nIn Phase 1: probe 3-5 initial
  candidates + 2-3 variants each = 15-25 probes.\nIn Phase 2: probe 2-3 variants per family = 10-15 probes.\nIn
  Phase 3: probe 2-3 deep refinement variants = 5-10 probes.\nTotal: stay within 30 probes.\n\nOnly evaluate
  variants with probe scores above current best.'
