type: tool
name: edit_solution
description: 'Implement a function implementation for ONE of these families:

  1. Gaussian mixture: Define f_values = jnp.linspace(-5, 5, 800), set mu, sigma, weights, compute weighted
  Gaussian sum 2. B-spline: Use splev/splrep with knots and softplus-processed controls 3. Oscillatory
  decay: f = (1 + α*cos(βx)) * exp(-γ*|x|), ensure positivity 4. Multi-level steps: Define positions and
  asymmetric heights, use f.at[] to set levels 5. Piecewise-polynomial: Higher-order smooth transitions
  between vertices

  Ensure f ≥ 0 using jnp.maximum(f, 1e-8). Use full resolution (n=600-800 points).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
