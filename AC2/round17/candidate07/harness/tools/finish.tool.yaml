type: tool
name: finish
description: 'Report: best combined_score achieved, function family (Gaussian/B-spline/oscillatory/multi-level),
  and the key design choice (e.g., "Gaussian with 5 peaks at [-2,-0.5,0.3,1.0,2.0], σ=[0.4,0.5,0.6,0.4,0.5]").'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
