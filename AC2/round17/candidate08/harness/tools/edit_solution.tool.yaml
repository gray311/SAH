type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. TWO USE CASES:\n\n1. FINE-TUNING: Small perturbations on promising
  proposals (height ±0.03-0.08, width ±3-6%, bump height ±0.05).\n\n2. STRUCTURAL CHANGE: Major architectural
  modifications:\n   - Add/remove peaks (for Gaussian/B-spline: change number of centers or control points)\n   -
  Switch families (step → oscillatory, unimodal → multimodal)\n   - Alter decay rates or oscillation frequencies\n   -
  Combine successful elements from different proposals\n\nUse JAX array mutation: f = f.at[start:end].set(value).
  Ensure f ≥ 0.\nFor structural changes, completely rewrite the function definition if needed.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
