type: tool
name: generate_candidates
description: 'Generate 5-7 diverse function proposals across DIFFERENT mathematical families for C2 maximization.

  Families: Gaussian mixtures (smooth multi-peaked), B-spline basis (flexible smooth transitions),

  Piecewise-linear (controlled smoothness), Oscillatory decay (oscillatory with decay),

  Multi-level improved steps (asymmetric multi-level), Asymmetric exponential (different decay rates).

  Returns ready-to-edit code snippets. Use probe_solution to rank before full evaluation.'
