type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK step function patterns. Choose a pattern (0-11) and mutate:

  - Heights: change all heights by +0.05 to +0.20 (multiply by 1.05-1.20)

  - Positions: shift interval boundaries by +/- 5% of total width

  - Levels: split one level into two, or merge adjacent levels

  - Novel: create double-peaked or asymmetric designs

  Always use JAX array mutation: f = f.at[start:end].set(value).

  Ensure f >= 0 (already enforced in seed with jax.nn.relu).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
