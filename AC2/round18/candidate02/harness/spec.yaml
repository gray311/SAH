schema: h2spec/1.0
system_prompt: "You are an expert in functional analysis and mathematical optimization for the C2 constant:\nC2 = ||f*f||2^2 / ((int f)^2 ||f*f||_inf), where f: R->R is non-negative.\n\nCurrent best: 0.8962799441554086 (achieved by step functions).\n\nCRITICAL INSIGHT: The seed has 12 step-function patterns that are COMBINATORIAL solutions. Before abandoning steps:\n1. Call step_pattern_analyzer (new tool) to extract parameters from your current best\n2. Generate MUTATED variants by varying positions (±5%), heights (±0.1-0.2), and levels (±1 level)\n3. ONLY then try completely different families (Gaussian, spline) if mutational search exhausts 20+ variants\n\nSTRATEGY:\nPHASE 1 (iterations 1-20): STEP PARAMETER EXPLORATION\n- Call step_pattern_analyzer to get current best structure\n- Generate 8-12 mutated variants with systematic parameter changes\n- Call probe_solution on ALL variants\n- Call evaluate_solution on TOP 2\n- Repeat until iteration 20 or improvement\n\nPHASE 2 (iterations 21-30): ARCHITECTURE EXPLORATION\n- If no improvement in Phase 1: try 3 different families (Gaussian, B-spline, oscillatory)\n- Generate 3 candidates per family, probe all, evaluate top 2 per family\n\nRULES:\n- Mutate step patterns FIRST (they're proven)\n- Use probes aggressively (30 total budget)\n- Only abandon steps after exhausting 15+ mutated variants\n- Always analyze current best before generating mutations"
skill_description: "Step-parameter exploration with systematic mutation. Extract parameters from current best using step_pattern_analyzer, generate mutated variants with position/height/level variations, use probes to filter. Only try different families after exhausting step-parameter search space."
skill_body: "# Step-Parameter Exploration Protocol for C2 Maximization\n\n## Core Principle\nThe seed's 12 step patterns are COMBINATORIAL solutions in a promising region. Systematic parameter exploration (positions, heights, number of levels) can escape the local optimum better than jumping to unrelated families.\n\n## Phase 1: Systematic Step Mutation (iterations 1-20)\n\nStep 1: Analyze Current Best\n- Call step_pattern_analyzer on your best function\n- Extract: number of levels, heights, positions, widths\n\nStep 2: Generate Mutated Variants\n- Create 8-12 variants with systematic changes:\n  * Position shifts: ±5% of interval width\n  * Height variations: ±0.1 to ±0.2 from original\n  * Level count: ±1 additional level (split or merge)\n  * Asymmetry: mirror/reverse some patterns\n- Keep all variants non-negative with jnp.maximum(f, 0) or jax.nn.softplus\n\nStep 3: Probe-Based Filtering\n- Call probe_solution on ALL 8-12 variants\n- Call evaluate_solution on TOP 2 by probe score\n- If probe score < 1.0: skip full eval, try next\n\nStep 4: Iterate\n- Continue with different mutation types each iteration\n- If 15+ variants exhausted without improvement: switch to Phase 2\n\n## Phase 2: Architecture Exploration (iterations 21-30)\n\nOnly if Phase 1 yields no improvement:\n1. Try Gaussian mixtures: 2-3 Gaussians with optimized means/stds\n2. Try B-spline: 50 control points with softplus positivity\n3. Try oscillatory decay: (1+alpha*cos(beta*x))*exp(-gamma*|x|)\n\nFor each family: generate 3 candidates, probe all, evaluate top 2\n\n## Key Rules\n- STEP MUTATION FIRST (proven region, combinatorial search)\n- Use 30 probes to explore 15-20+ variants before full evaluations\n- Only abandon steps after exhausting mutation space\n- Always analyze current best before generating mutations"
tool_descriptions:
  edit_solution: "Edit the EVOLVE-BLOCK. For step mutations: use .at[] mutations to change heights/positions. Example: f = f.at[start:end].set(new_height). For new families: implement complete f_values array. Always ensure f >= 0 using jax.nn.softplus or jnp.maximum(f, 0). Match num_intervals = 600 from seed."
  evaluate_solution: "Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking and after exhausting step mutations (15+ variants) or when trying a new architecture family."
  probe_solution: "Approximate score on 10% subsample. FAST. Use to rank 8-15+ variants. You have 30 probes - spend them to explore step parameter space (positions, heights, levels) before any full eval."
  finish: "Report best combined_score, the winning strategy (step mutation vs new family), and key insights from step_pattern_analyzer and systematic exploration."
sampling:
  temperature: 0.6
  top_p: 0.9
  top_k: 20
  max_tokens: 16384
agent:
  max_iterations: 35
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
- name: step_pattern_analyzer
  description: "Extract step function parameters from current best: number of levels, heights, positions, widths. Guides systematic mutation. Call at start of Phase 1 to understand structure before generating mutations."
  input_schema:
    type: object
    properties: {}
  implementation_py: "def run(ctx, args):\n    import re\n    code = ctx.get_program()\n    \n    heights = []\n    positions = []\n    widths = []\n    \n    at_matches = re.findall(r'f\\.at\\[([^\\[\\]]+)\\]\\.(set|replace)\\(\\s*([\\d.]+)\\s*\\)', code)\n    for start_expr, method, value in at_matches:\n        heights.append(float(value))\n        pos_match = re.search(r'(\\d+\\.?\\d*)\\s*\\*', start_expr)\n        if pos_match:\n            positions.append(float(pos_match.group(1)))\n        else:\n            positions.append(0.5)\n    \n    num_levels = len(at_matches)\n    \n    return {\n        'num_levels': num_levels,\n        'heights': heights,\n        'positions': positions,\n        'widths': [p * 0.4 for p in positions],\n        'note': f'Found {num_levels} level(s) in step pattern'\n    }\n"
- name: generate_step_mutations
  description: "Generate 8-12 mutated step-function variants by varying positions (±5%), heights (±0.1-0.2). Returns ready-to-edit code. Use in Phase 1 before trying new families."
  input_schema:
    type: object
    properties: {}
  implementation_py: "def run(ctx, args):\n    import random\n    random.seed(42)\n    \n    heights = [1.40, 1.50, 1.60, 1.90, 0.90]\n    positions = [0.25, 0.35, 0.55, 0.70, 0.85]\n    n_intervals = 600\n    \n    mutations = []\n    \n    for i in range(8):\n        pos_shift = random.uniform(-0.05, 0.05)\n        height_shift = random.uniform(-0.2, 0.2)\n        add_level = random.random() > 0.7\n        \n        mutations.append({\n            'variant_id': i,\n            'pos_shift': round(pos_shift, 4),\n            'height_shift': round(height_shift, 4),\n            'add_level': add_level,\n            'code': f'''import jax.numpy as jnp\nimport jax\n\nn = {n_intervals}\nf = jnp.zeros(n)\n\nf = f.at[int(0.25*n):int(0.35*n)].set({heights[0]} + {height_shift:+.2f})\nf = f.at[int(0.35*n):int(0.55*n)].set({heights[1]} + {height_shift:+.2f})\nf = f.at[int(0.55*n):int(0.70*n)].set({heights[2]} + {height_shift:+.2f})\nf = f.at[int(0.70*n):int(0.85*n)].set({heights[3]} + {height_shift:+.2f})\nf = f.at[int(0.85*n):int(0.95*n)].set({heights[4]} + {height_shift:+.2f})\nf = jnp.maximum(f, 0)\n'''}})\n    \n    return {\n        'mutations': mutations,\n        'note': f'Generated {len(mutations)} step function mutations'\n    }\n"
new_skills:
- name: systematic-step-mutation-strategy
  description: "Systematically explore step function parameter space (positions, heights, levels) before trying unrelated families. Use probes to filter."
  body: "# Systematic Step Mutation Strategy for C2 Maximization\n\n## Why Steps First?\nThe seed's 12 step patterns are COMBINATORIAL solutions in a promising region. The local optimum is a valley in parameter space - we need to explore it systematically.\n\n## Parameter Space Dimensions\n- Positions: Each step boundary (±5%)\n- Heights: Each level's value (±0.1 to ±0.2)\n- Levels: Number of pieces (±1)\n- Asymmetry: Mirror/reverse patterns\n\n## Phase 1: Exhaustive Step Exploration\n\nIteration 1-5: Position-only mutations\n- Generate 3 variants with position shifts\n- Probe all, evaluate best 1\n\nIteration 6-10: Height-only mutations\n- Generate 3 variants with height changes\n- Probe all, evaluate best 1\n\nIteration 11-15: Level count mutations\n- Generate 2 variants: +1 and -1 level\n- Probe both, evaluate best\n\nIteration 16-20: Combined mutations\n- Generate 2 variants with position + height\n- Probe both, evaluate best\n\n## Phase 2: Architecture Jump\nIf no improvement after 20+ step mutations:\n1. Gaussian mixtures (2-3 Gaussians)\n2. B-spline (50 control points)\n3. Oscillatory decay\n\n## Key Rule\nNEVER abandon step functions until you've exhausted 15+ mutated variants. They're mathematically sound!\n"
new_middlewares:
- name: enforce_step_first
  hook: before_model
  description: "Middleware that reminds solver to exhaust step mutations before trying new families"
  implementation_py: "def before_model(hook_input):\n    iteration = hook_input.get('iteration', 0)\n    step_mutations_used = hook_input.get('step_mutations_count', 0)\n    new_family_used = hook_input.get('new_family_used', False)\n    \n    if iteration >= 8 and not new_family_used:\n        return f'Reminder: Only {step_mutations_used} step mutations used. Generate more step variants before trying Gaussian/spline/oscillatory families. Steps are proven!'\n    \n    if new_family_used and iteration >= 21:\n        return 'You have a new family. Stay focused on it for 5 iterations before trying another.'\n    \n    return None\n"
