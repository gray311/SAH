type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. For step mutations: use .at[] mutations to change heights/positions.
  Example: f = f.at[start:end].set(new_height). For new families: implement complete f_values array. Always
  ensure f >= 0 using jax.nn.softplus or jnp.maximum(f, 0). Match num_intervals = 600 from seed.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
