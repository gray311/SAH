schema: h2spec/1.0
system_prompt: "You are optimizing C₂ = ||f★f||₂² / ((∫f)² ||f★f||_∞) for f≥0.\n\nCurrent best: 0.8962799441554086.\n\nYOUR METHOD: Mutate the 12 step patterns in the seed's _create_step_initializer method.\n\nSTRATEGY - SYSTEMATIC PERTURBATION:\n\nSTEP 1: Read the current best step pattern (which of the 12 patterns is being used).\nSTEP 2: Choose ONE perturbation from this menu:\n  - Height: ±0.10 to ±0.25 (adjust peak heights)\n  - Width: ±5% to ±15% of current interval (shift start/end boundaries)\n  - Asymmetry: Swap left/right bounds by ±10%\n  - Split: Divide one level into two with new intermediate height\n  - Merge: Combine adjacent levels into one\n  - Shift: Move all levels left/right by ±10% of domain\nSTEP 3: Generate 3-5 variants with DIFFERENT perturbations.\nSTEP 4: Call probe_solution on ALL variants (cost: 1 probe per variant).\nSTEP 5: Call evaluate_solution on TOP 2 by probe score.\nSTEP 6: If no improvement after 3 iterations: try perturbation type from a different menu item.\n\nRULES:\n- Edit the EVOLVE-BLOCK: modify NUM_INTERVALS, LEARNING_RATE, NUM_STEPS, or REINIT_* params\n- Or edit the _create_step_initializer method: change pattern heights, start/end positions\n- Always ensure f≥0 (seed already does this with jnp.maximum)\n- Use 30 probes to explore 8-15 variants before spending full evaluations\n- Call evaluate_solution only on top 1-2 variants per iteration\n- If probe score ≈1.0: your perturbation is ineffective; try different type\n- Don't change 3+ parameters at once; one change per variant\n\nWHY THIS WORKS: Small, targeted perturbations have explored the step-function landscape more thoroughly than random architectures."
skill_description: "Systematic step-function perturbation. Mutate heights, widths, and asymmetries of existing patterns with probe-guided ranking."
skill_body: "# Systematic Step-Function Perturbation Protocol\n\n## Core Principle\nThe 12 step patterns in the seed cover diverse architectures. Instead of inventing new families, systematically PERTURB these proven patterns.\n\n## Perturbation Menu (choose 1-2 per variant)\n\n1. HEIGHT ADJUSTMENT\n   - High peak patterns (1.50, 1.60, 1.90, 2.30, 2.80, 2.50): try ±0.10 to ±0.25\n   - Medium peaks (1.40, 1.20, 1.00, 0.90): try ±0.05 to ±0.15\n   - Rationale: Optimal peak heights balance L2 norm vs sup norm\n\n2. WIDTH ADJUSTMENT\n   - Narrow peaks (<0.25 width): widen by +10% to +20%\n   - Wide peaks (>0.50 width): narrow by -10% to -15%\n   - Rationale: Optimal support width for convolution energy concentration\n\n3. ASYMMETRY MODULATION\n   - Symmetric patterns: add slight asymmetry (shift left/right bounds by ±8%)\n   - Asymmetric patterns: try reverse asymmetry or increase by ±10%\n   - Rationale: Asymmetry may improve L2/sup ratio\n\n4. LEVEL SPLIT/MERGE\n   - 2-level patterns: try splitting into 3 with intermediate height\n   - 4-5 level patterns: try merging adjacent levels\n   - Rationale: Optimal number of levels for this inequality\n\n5. POSITION SHIFT\n   - Centered patterns: shift all levels ±10% from center\n   - Offset patterns: shift toward center or further out\n   - Rationale: Optimal support location in domain\n\n## Execution Flow\n\nIteration 1-5 (Exploration):\n- Read current best: which pattern? what heights? where are bounds?\n- Generate 4 variants: one from each of 4 different perturbation types\n- Probe all 4 (4 probes)\n- Evaluate top 2 (2 evals)\n- Keep best, abandon rest\n\nIteration 6-15 (Refinement):\n- Focus on best perturbation type from Phase 1\n- Generate 3 variants with SMALLER perturbations (±5% instead of ±10%)\n- Probe all 3 (3 probes)\n- Evaluate top 1 (1 eval)\n- Switch to different perturbation type if no improvement\n\nIteration 16-30 (Final Push):\n- Try extreme perturbations: ±25% height, ±20% width\n- Or combine 2 perturbation types (e.g., height + asymmetry)\n- Probe all, evaluate top 1-2\n\n## Key Rules\n- NEVER change more than 2 parameters per variant\n- Probe ALL variants before any full evaluation\n- If probe score <1.0: skip full eval, try different perturbation\n- After 3 iterations with same perturbation type: switch type\n- Always document: \"Pattern X, perturbation: height +0.15, width -10%\" in scratch"
tool_descriptions:
  edit_solution: "Edit the EVOLVE-BLOCK region. Options:\n1) Change NUM_INTERVALS (600→700, 500, 800), LEARNING_RATE (0.1→0.2), NUM_STEPS (10000→30000)\n2) Edit _create_step_initializer: change pattern heights by ±0.10 to ±0.25, change start/end indices by ±5% of n\n3) Add a new pattern: define a new elif branch with 2-4 level structure\nCRITICAL: Ensure f is non-negative (use jnp.maximum(f, 0) if modifying)\nExample: 'start = int(0.30 * n)' → 'start = int(0.35 * n)' (increase by 17%)"
  evaluate_solution: "Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking. Evaluate top 1-2 variants. If probe <1.0, skip."
  probe_solution: "Approximate score on 10% subsample. FAST (~10s vs minutes). Use to rank 5-15 variants before full eval. You have 30 probes - spend them to explore perturbations thoroughly."
  finish: "Report best combined_score, the winning perturbation type, and final pattern parameters."
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
