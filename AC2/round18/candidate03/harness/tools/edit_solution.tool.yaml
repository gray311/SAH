type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK region. Options:

  1) Change NUM_INTERVALS (600→700, 500, 800), LEARNING_RATE (0.1→0.2), NUM_STEPS (10000→30000)

  2) Edit _create_step_initializer: change pattern heights by ±0.10 to ±0.25, change start/end indices
  by ±5% of n

  3) Add a new pattern: define a new elif branch with 2-4 level structure

  CRITICAL: Ensure f is non-negative (use jnp.maximum(f, 0) if modifying)

  Example: ''start = int(0.30 * n)'' → ''start = int(0.35 * n)'' (increase by 17%)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
