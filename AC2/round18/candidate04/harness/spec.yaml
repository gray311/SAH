schema: h2spec/1.0
system_prompt: |
  You are an expert in mathematical optimization for the C2 constant.
  C2 = ||f*f||_2^2 / ((∫f)^2 ||f*f||_∞), where f: ℝ→ℝ is non-negative.
  
  CURRENT BEST: 0.8962799441554086 (step functions)
  GOAL: Surpass this with novel step-function topologies.
  
  CRITICAL INSIGHT: The seed program contains 11 diverse step-function patterns.
  Do NOT abandon step functions for incompatible families (Gaussian/B-spline) that
  won't integrate with the seed's FFT-based optimizer. Instead, systematically
  explore the step-function design space:
  
  PHASE 1 (iterations 1-18): DIVERSE STEP-TOPOLOGY GENERATION
  1. Analyze the current best's pattern structure
  2. Generate 5 variants with MODIFIED step patterns:
     - Change number of levels (2-7 levels)
     - Vary heights asymmetrically (0.3 to 3.0)
     - Shift positions (±10% from pattern centers)
     - Introduce multiple peaks or gaps
  3. Use probe_solution on ALL 5 variants (5 probes = 5/30 budget)
  4. Evaluate top 2 by probe score
  5. If either beats record: switch to Phase 2. If not: generate 5 MORE variants
  
  PHASE 2 (iterations 19-30): FOCUSED REFINEMENT
  1. Take the best step-function architecture from Phase 1
  2. Generate 3 variants with SMALL mutations:
     - Height adjustments: ±0.15
     - Width adjustments: ±5% of segment length
     - Level reordering
  3. Probe all, evaluate top 1-2
  4. If no improvement after 5 iterations: return to Phase 1
  
  RULES:
  - ALL functions must be NON-NEGATIVE step functions (use jnp.maximum(f, 0))
  - Edit ONLY the pattern definitions in _create_step_initializer
  - Never change the FFT-based evaluation structure
  - Use 30 probes to explore 10-15+ step-topology variants before full evals
  
  TOOL USAGE:
  - step_topology_generator: Generate valid step-function variants
  - probe_solution: Rank variants cheaply (use heavily!)
  - evaluate_solution: Only on top 1-2 by probe
skill_description: |
  Systematic step-function topology exploration. Generate diverse multi-level
  step patterns, use probes to filter before full evaluation. Stay within the
  step-function paradigm that achieves the current record.
skill_body: |
  # C2 Maximizer: Step-Function Topology Exploration Protocol
  
  ## Core Principle
  The current best (0.8962799441554086) is achieved by step functions.
  Abandoning to incompatible families wastes evaluation budget.
  Systematically explore the step-function design space instead.
  
  ## Architecture Families (ALL valid step functions)
  
  1. **Multi-peak variants**
     - Wide base with narrow high peak
     - Narrow base with wide high peak
     - Asymmetric single peaks
  
  2. **Multi-level structures** (2-7 levels)
     - Linear progression: ascending/descending steps
     - Symmetric peaks: plateau with higher center
     - Asymmetric peaks: higher left/right side
     - Multiple isolated peaks
  
  3. **Gap-based structures**
     - Central gap with elevated sides
     - Alternating high/low segments
     - Nested gaps
  
  4. **Triangle-like steps**
     - Rising then falling steps
     - Plateau peaks
  
  ## Execution Protocol
  
  ### Phase 1: Diverse Topology Generation (iterations 1-18)
  
  Step 1: Analyze Current Best
  - Note: How many levels? Where are peaks? Symmetric/asymmetric?
  - If all levels similar: introduce height variation
  - If single peak: try multi-peak
  - If symmetric: try asymmetric
  
  Step 2: Generate 5 DIVERSE Step Variants
  Use step_topology_generator to create variants with:
  - Different number of levels (2-7)
  - Heights in range [0.3, 3.0] (ensure non-negative)
  - Positions shifted ±10% from centers
  - Completely different topologies (not just parameter tweaks)
  
  Step 3: Probe-Based Filtering
  - Call probe_solution on ALL 5 variants (5 probes)
  - Skip full eval if probe score < 1.0 (worse than seed)
  - Evaluate top 2 by probe score
  
  Step 4: Iterate
  - If neither beats record: generate 5 MORE diverse variants
  - Continue until iteration 18 or improvement
  
  ### Phase 2: Focused Refinement (iterations 19-30)
  
  Only if Phase 1 found improvement:
  1. Analyze best variant's structure
  2. Generate 3 variants with SMALL mutations:
     - Height: ±0.15
     - Width: ±5% of segment
     - Reorder levels
  3. Probe all, evaluate top 1
  4. If no improvement after 5 iterations: return to Phase 1
  
  ## Key Rules
  - PARALLEL DIVERSITY > SEQUENTIAL REFINEMENT
  - Use 30 probes to explore 10-15+ step-topology variants
  - NEVER change FFT-based evaluation structure
  - If iteration 15+: ensure maximum topology diversity (not minor tweaks)
  - All functions must be non-negative step functions
tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK. Replace or extend the _create_step_initializer function
    with new step-function pattern definitions. All functions must be non-negative
    step functions. Keep the FFT-based evaluation structure unchanged.
    Example: Define multiple if pattern_idx branches with different level configurations.
    Use jnp.zeros(n) and f.at[start:end].set(value) for array mutations.
  evaluate_solution: |
    Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking.
    Evaluate top 1-2 variants by probe score. If probe < 1.0, skip full eval.
  probe_solution: |
    Approximate score on 10% subsample. FAST. Use to rank 5-10+ variants before full eval.
    You have 30 probes - spend them to explore diverse step topologies, not to confirm one candidate.
  finish: |
    Report best combined_score, the winning step-function topology (e.g., "5-level asymmetric peak"),
    and key insights from convolution analysis.
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
- name: step_topology_generator
  description: |
    Generate 5 diverse step-function topology variants by modifying the seed's
    _create_step_initializer patterns. Creates valid JAX code for multi-level
    step functions with varied heights, positions, and level counts (2-7 levels).
    Call this to explore diverse step topologies within the current paradigm.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import random
        random.seed(42)
        
        proposals = []
        n_intervals = 600
        
        # Family 1: Multi-peak with varying heights
        proposals.append({
            'family': 'multi_peak_asymmetric',
            'description': 'Multiple peaks with asymmetric heights',
            'code_snippet': 'import jax.numpy as jnp\\n\\ndef _create_step_initializer(n, pattern_idx):\\n    f = jnp.zeros(n)\\n    if pattern_idx == 0:\\n        f = f.at[int(0.15*n):int(0.25*n)].set(1.20)\\n        f = f.at[int(0.25*n):int(0.40*n)].set(2.50)\\n        f = f.at[int(0.40*n):int(0.50*n)].set(1.20)\\n        f = f.at[int(0.50*n):int(0.60*n)].set(2.50)\\n        f = f.at[int(0.60*n):int(0.75*n)].set(1.20)\\n    elif pattern_idx == 1:\\n        f = f.at[int(0.10*n):int(0.30*n)].set(1.50)\\n        f = f.at[int(0.30*n):int(0.45*n)].set(3.00)\\n        f = f.at[int(0.45*n):int(0.70*n)].set(1.50)\\n    elif pattern_idx == 2:\\n        f = f.at[int(0.08*n):int(0.20*n)].set(0.80)\\n        f = f.at[int(0.20*n):int(0.35*n)].set(2.00)\\n        f = f.at[int(0.35*n):int(0.55*n)].set(1.80)\\n        f = f.at[int(0.55*n):int(0.75*n)].set(2.00)\\n        f = f.at[int(0.75*n):int(0.92*n)].set(0.80)\\n    elif pattern_idx == 3:\\n        f = f.at[int(0.12*n):int(0.18*n)].set(0.70)\\n        f = f.at[int(0.18*n):int(0.28*n)].set(1.50)\\n        f = f.at[int(0.28*n):int(0.72*n)].set(2.50)\\n        f = f.at[int(0.72*n):int(0.82*n)].set(1.50)\\n        f = f.at[int(0.82*n):int(0.88*n)].set(0.70)\\n    elif pattern_idx == 4:\\n        f = f.at[int(0.15*n):int(0.25*n)].set(1.00)\\n        f = f.at[int(0.25*n):int(0.35*n)].set(2.20)\\n        f = f.at[int(0.35*n):int(0.50*n)].set(1.00)\\n        f = f.at[int(0.50*n):int(0.70*n)].set(2.20)\\n        f = f.at[int(0.70*n):int(0.85*n)].set(1.00)\\n    return f',
            'rationale': 'Multiple peaks may concentrate L2 norm better than single peaks'
        })
        
        # Family 2: Wide base with narrow peaks
        proposals.append({
            'family': 'wide_base_narrow_peak',
            'description': 'Wide base supporting narrow high peaks',
            'code_snippet': 'import jax.numpy as jnp\\n\\ndef _create_step_initializer(n, pattern_idx):\\n    f = jnp.zeros(n)\\n    if pattern_idx == 0:\\n        f = f.at[int(0.10*n):int(0.90*n)].set(1.00)\\n        f = f.at[int(0.35*n):int(0.65*n)].set(2.80)\\n    elif pattern_idx == 1:\\n        f = f.at[int(0.08*n):int(0.92*n)].set(0.90)\\n        f = f.at[int(0.30*n):int(0.70*n)].set(3.00)\\n    elif pattern_idx == 2:\\n        f = f.at[int(0.12*n):int(0.88*n)].set(1.10)\\n        f = f.at[int(0.32*n):int(0.68*n)].set(2.60)\\n    return f',
            'rationale': 'Wide base stabilizes integral while narrow peaks boost sup ratio'
        })
        
        # Family 3: Asymmetric multi-level
        proposals.append({
            'family': 'asymmetric_multi_level',
            'description': 'Asymmetric step structures with varying segment heights',
            'code_snippet': 'import jax.numpy as jnp\\n\\ndef _create_step_initializer(n, pattern_idx):\\n    f = jnp.zeros(n)\\n    if pattern_idx == 0:\\n        levels = [0.60, 1.30, 2.00, 1.50, 1.00]\\n        positions = [0.06, 0.22, 0.40, 0.60, 0.82]\\n        for i in range(len(positions) - 1):\\n            start = int(positions[i] * n)\\n            end = int(positions[i+1] * n)\\n            f = f.at[start:end].set(levels[i])\\n    elif pattern_idx == 1:\\n        levels = [0.50, 1.00, 2.30, 1.70, 1.20, 0.80]\\n        positions = [0.05, 0.20, 0.35, 0.50, 0.70, 0.88]\\n        for i in range(len(positions) - 1):\\n            start = int(positions[i] * n)\\n            end = int(positions[i+1] * n)\\n            f = f.at[start:end].set(levels[i])\\n    return f',
            'rationale': 'Asymmetric structures may optimize L2/sup balance differently'
        })
        
        # Family 4: Gap-based structures
        proposals.append({
            'family': 'gap_based',
            'description': 'Structures with gaps or low regions separating peaks',
            'code_snippet': 'import jax.numpy as jnp\\n\\ndef _create_step_initializer(n, pattern_idx):\\n    f = jnp.zeros(n)\\n    if pattern_idx == 0:\\n        f = f.at[int(0.08*n):int(0.20*n)].set(1.20)\\n        f = f.at[int(0.20*n):int(0.28*n)].set(0.30)\\n        f = f.at[int(0.28*n):int(0.40*n)].set(2.50)\\n        f = f.at[int(0.40*n):int(0.48*n)].set(0.30)\\n        f = f.at[int(0.48*n):int(0.70*n)].set(2.50)\\n    elif pattern_idx == 1:\\n        f = f.at[int(0.05*n):int(0.15*n)].set(1.00)\\n        f = f.at[int(0.15*n):int(0.25*n)].set(0.40)\\n        f = f.at[int(0.25*n):int(0.35*n)].set(2.80)\\n        f = f.at[int(0.35*n):int(0.65*n)].set(0.40)\\n        f = f.at[int(0.65*n):int(0.95*n)].set(1.00)\\n    return f',
            'rationale': 'Gaps reduce sup norm while maintaining L2 through separated peaks'
        })
        
        # Family 5: Triangle-like stepped functions
        proposals.append({
            'family': 'triangle_stepped',
            'description': 'Rising then falling step sequences (triangle-like)',
            'code_snippet': 'import jax.numpy as jnp\\n\\ndef _create_step_initializer(n, pattern_idx):\\n    f = jnp.zeros(n)\\n    if pattern_idx == 0:\\n        levels = [0.50, 1.00, 1.80, 2.50, 1.80, 1.00, 0.50]\\n        positions = [0.05, 0.18, 0.32, 0.47, 0.63, 0.78, 0.95]\\n        for i in range(len(positions) - 1):\\n            start = int(positions[i] * n)\\n            end = int(positions[i+1] * n)\\n            f = f.at[start:end].set(levels[i])\\n    elif pattern_idx == 1:\\n        levels = [0.40, 0.80, 1.40, 2.20, 1.40, 0.80, 0.40]\\n        positions = [0.03, 0.16, 0.30, 0.44, 0.56, 0.70, 0.84, 0.97]\\n        for i in range(len(positions) - 1):\\n            start = int(positions[i] * n)\\n            end = int(positions[i+1] * n)\\n            f = f.at[start:end].set(levels[i])\\n    return f',
            'rationale': 'Symmetric triangle-like structures may optimize convolution symmetry'
        })
        
        return {
            'proposals': proposals,
            'note': 'All variants are non-negative step functions compatible with seed optimizer'
        }
