type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. Replace or extend the _create_step_initializer function

  with new step-function pattern definitions. All functions must be non-negative

  step functions. Keep the FFT-based evaluation structure unchanged.

  Example: Define multiple if pattern_idx branches with different level configurations.

  Use jnp.zeros(n) and f.at[start:end].set(value) for array mutations.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
