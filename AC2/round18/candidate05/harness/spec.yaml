schema: h2spec/1.0
system_prompt: "You are an expert in functional analysis and mathematical optimization for the C2 constant.\n\nCurrent best: 0.8962799441554086 (achieved by step functions).\n\nSEED SCORE: 1.042 - The seed's step patterns are promising. Systematically explore step-function space with VALID edits.\n\nSTRATEGY - SYSTEMATIC STEP-FUNCTION SEARCH:\n\nPHASE 1 (iterations 1-12): STRUCTURED STEP-VARIATION\n1. From current best, generate 3 variants with controlled mutations:\n   - Height: +/-10% on selected steps\n   - Position: +/-5% on selected boundaries  \n   - Width: +/-10% on selected intervals\n2. Use probe_solution on ALL 3 variants\n3. Use evaluate_solution on TOP 2 by probe score\n4. Update best and generate fresh variants (don't mutate same code repeatedly)\n\nPHASE 2 (iterations 13-24): COMBINATORIAL EXPLORATION\n1. From Phase 1 best, try COMBINATIONS of mutations\n2. Generate 4 variants\n3. Probe all, evaluate top 2\n4. If no improvement after 5 iterations: switch to Phase 3\n\nPHASE 3 (iterations 25-30): FINETUNING\n1. Fine perturbations: +/-3% height, +/-2% position\n2. Generate 2 variants, probe, evaluate top 1\n3. If stuck: reset to seed, try Phase 1 again\n\nCRITICAL: All edits MUST be valid Python. Use .at syntax correctly: f.at[int(a):int(b)].set(c). Ensure f >= 0."
skill_description: "Systematic step-function search. Seed achieves 1.042 - explore step-space with valid, executable edits. Use controlled perturbations, probe filtering, iterative refinement."
skill_body: "# Systematic Step-Function Search\n\n## Core Insight\nSeed achieves 1.042 with step functions - architecture is viable. Don't abandon for untested families. Systematically perturb parameters with VALID edits.\n\n## Phase 1: Structured Variation (iterations 1-12)\n\nStep 1: Analyze Current Best\n- Examine best function: how many steps, what heights, where boundaries?\n- Pattern: f = f.at[int(0.10*n):int(0.30*n)].set(h1).at[int(0.30*n):int(0.50*n)].set(h2)...]\n\nStep 2: Generate 3 Controlled Variants\n\n   Variant A (Height):\n   - Pick one step: new_h = h * 0.9 OR h * 1.1\n   - Code: f = f.at[start:end].set(new_h)\n\n   Variant B (Position):\n   - Shift boundary: int(0.30*n) -> int(0.27*n) or int(0.33*n)\n   - Code: f = f.at[int(0.27*n):int(0.73*n)].set(h)\n\n   Variant C (Width/Interval):\n   - Adjust interval: if end-start=200, try 180 or 220\n\nStep 3: Probe-Based Filtering\n- Call probe_solution on ALL 3 variants\n- Skip full eval if probe < 1.0\n- Evaluate TOP 2 by probe\n\nStep 4: Iterative Refinement\n- Best program becomes new base\n- Generate fresh variants from it\n- Repeat until iteration 12 or improvement\n\n## Phase 2: Combinatorial (iterations 13-24)\n1. Take best from Phase 1\n2. Generate 4 variants: combinations of height+pos, pos+width, etc.\n3. Probe all, evaluate top 2\n4. If no improvement after 5 iterations: Phase 3\n\n## Phase 3: Finetuning (iterations 25-30)\n1. Fine perturbations: +/-3% height, +/-2% position\n2. Generate 2 variants\n3. Probe, evaluate top 1\n4. If stuck: reset to seed\n\n## Valid Edit Syntax\n- CORRECT: f.at[int(0.25*n):int(0.75*n)].set(1.40)\n- WRONG: f.at[0.25*n:0.75*n].set(1.40)  # needs int()\n- ALWAYS add: f = jax.numpy.maximum(f, 0.001) for non-negativity\n\n## Execution\n- After each eval, update best_f\n- Generate next variants from current best, not seed\n- Use all 30 probes before full evals"
tool_descriptions:
  edit_solution: "Edit the EVOLVE-BLOCK using valid Python. Step functions: use f.at[int(start):int(end)].set(value). Example: 'f = f.at[int(0.25*n):int(0.75*n)].set(1.40)'. Ensure all bounds use int(). Add f = jax.numpy.maximum(f, 0.001) for non-negativity."
  evaluate_solution: "Full evaluation. Budget: 30. Call ONLY after probe_solution >= 1.0. Evaluate top 1-2 variants."
  probe_solution: "Approximate score. FAST. Rank 3-10+ variants before full eval. 30 probes for 10+ step variations."
  finish: Report best combined_score, winning parameters (heights, positions), insights.
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 35
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
- name: mutate_step_params
  description: "Apply controlled mutations to step-function: height (+/-10%), position (+/-5% of n), width (+/-10% of interval). Returns 3 valid Python variants. Uses .at syntax correctly."
  input_schema:
    type: object
    properties: {}
  implementation_py: "def run(ctx, args):\n    best = ctx.get_best_program()\n    if not best:\n        return {\"error\": \"No best program\", \"variants\": []}\n    \n    import re\n    \n    # Parse existing .at mutations to understand structure\n    muts = []\n    for line in best.split('\\\\n'):\n        if '.at[' in line and '.set(' in line and 'f = ' in line:\n            # Extract pattern: f.at[int(X):int(Y)].set(Z)\n            match = re.search(r'f\\.at\\(int\\(([\\d\\s\\.]+),\\s*([\\d\\s\\.]+)\\)\\):int\\(([\\d\\s\\.]+),\\s*([\\d\\s\\.]+)\\)\\)\\.set\\(([\\d\\.]+)\\)', line)\n            if match:\n                start1, end1, start2, end2, height = match.groups()\n                muts.append({\n                    'start1': float(start1), 'end1': float(end1),\n                    'start2': float(start2), 'end2': float(end2),\n                    'height': float(height), 'line': line\n                })\n    \n    if not muts:\n        # Fallback: assume simple structure, generate from scratch\n        n = ctx.hypers.get('num_intervals', 600)\n        variants = []\n        heights = [1.40, 1.50, 1.60]\n        for i, h in enumerate(heights):\n            code = f'import jax.numpy as jnp\\\\nf = jnp.zeros(n)\\\\nf = f.at[int(0.{i*25}:int(0.{(i+1)*25}) * n)].set({h})\\\\nf = jnp.maximum(f, 0.001)'\n            variants.append({'variant': f'base_h{h}', 'code': code})\n        return {'variants': variants, 'note': 'Fallback patterns'}\n    \n    variants = []\n    \n    # Variant 1: Height up 10%\n    m = muts[0]\n    new_h = m['height'] * 1.10\n    code1 = m['line'].replace(f'set({m[\"height\"]})', f'set({new_h})')\n    variants.append({'variant': 'height_up', 'code': code1})\n    \n    # Variant 2: Height down 10%\n    m = muts[0]\n    new_h2 = m['height'] * 0.90\n    code2 = m['line'].replace(f'set({m[\"height\"]})', f'set({new_h2})')\n    variants.append({'variant': 'height_down', 'code': code2})\n    \n    # Variant 3: Position shift (shrink interval by 5%)\n    m = muts[0]\n    new_start1 = m['start1'] * 0.95\n    new_end1 = m['end1'] * 0.95\n    code3 = m['line'].replace(f'int({m[\"start1\"]}):int({m[\"end1\"]})', f'int({new_start1}):int({new_end1})')\n    variants.append({'variant': 'position_shrink', 'code': code3})\n    \n    return {\n        'variants': variants,\n        'note': 'All variants use valid .at syntax with int() casts. Apply to current best.'\n    }\n"
new_skills:
- name: systematic-step-explore
  description: "Exploit step-function architecture (seed=1.042). Use controlled, valid edits to explore parameter space."
  body: "# Systematic Step-Function Exploration\n\n## Core Principle\nSeed achieves 1.042 - step functions work. Systematically perturb parameters with VALID Python syntax. Don't abandon for untested families.\n\n## Mutation Types\n1. HEIGHT: h -> h*0.9 or h*1.1\n2. POSITION: int(0.30*n) -> int(0.27*n) or int(0.33*n)\n3. WIDTH: adjust interval size by +/-10%\n\n## Execution\n1. After eval, get best program\n2. Call mutate_step_params to get 3 variants\n3. Probe all, evaluate top 2\n4. Best becomes new base\n\n## Valid Syntax\n- CORRECT: f.at[int(0.25*n):int(0.75*n)].set(1.40)\n- WRONG: f.at[0.25*n:0.75*n].set(1.40)\n- ALWAYS: f = jax.numpy.maximum(f, 0.001)\n\n## Flow\n- Phase 1 (1-12): structured variation\n- Phase 2 (13-24): combinations\n- Phase 3 (25-30): finetuning\n- Reset to seed if stuck"
new_middlewares:
- name: enforce_valid_syntax
  hook: before_model
  description: "Ensure edits use valid .at syntax with int() casts."
  implementation_py: "def before_model(hook_input):\n    iteration = hook_input.get('iteration', 0)\n    if iteration > 0:\n        return 'Reminder: Use f.at[int(start):int(end)].set(val) syntax. Ensure int() casts on all bounds.'\n    return None"
