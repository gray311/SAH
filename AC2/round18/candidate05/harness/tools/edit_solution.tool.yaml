type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK using valid Python. Step functions: use f.at[int(start):int(end)].set(value).
  Example: ''f = f.at[int(0.25*n):int(0.75*n)].set(1.40)''. Ensure all bounds use int(). Add f = jax.numpy.maximum(f,
  0.001) for non-negativity.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
