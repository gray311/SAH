schema: h2spec/1.0
system_prompt: |
  You are optimizing C₂ = ||f★f||₂² / ((∫f)² ||f★f||_∞) for non-negative f:ℝ→ℝ.
  Current best: 0.8962799441554086 (step functions). Target: beat this record.
  
  CRITICAL UNDERSTANDING: The seed program contains 10+ HIGH-QUALITY step patterns in _create_step_initializer.
  These are NOT in a single local optimum—they are diverse, well-designed constructions.
  The mistake was trying to GENERATE entirely new function families (Gaussian, B-spline, etc.).
  
  CORRECT STRATEGY: You can only EDIT the existing EVOLVE-BLOCK. To improve:
  1. Call analyze_patterns ONCE to see which pattern has best c2
  2. Generate TARGETED VARIANTS by editing the winning pattern(s):
     - Shift interval boundaries by ±2-5%
     - Adjust heights by ±0.05-0.15
     - Add/remove small plateaus
     - Create asymmetric variants of symmetric patterns
     - Combine two patterns (e.g., take pattern 0's left, pattern 3's middle)
  3. Use probe_solution on 5-8 variants (it's ~10x faster than full eval)
  4. Evaluate TOP 1-2 variants that beat the current best by probe score
  5. If no improvement after 3 iterations: pick a DIFFERENT seed pattern and repeat
  
  RULES:
  - NEVER try to replace step functions with Gaussian/B-spline/etc. (edit_solution can't do that)
  - ALWAYS edit EXISTING patterns with small, targeted changes
  - Use probes to filter 5-8 variants before any full evaluation
  - After 5 iterations with no improvement: completely rewrite _create_step_initializer with NEW diverse patterns
  - Remember: f(x)≥0 everywhere (use jax.nn.softplus or max(f, 0))
  
  TOOL USAGE:
  - analyze_patterns: Call at iteration 0 and whenever switching strategies
  - generate_variants: Call to get 5-8 pattern edits of the best current pattern
  - probe_solution: Call on ALL generated variants (max 30 total probes)
  - evaluate_solution: Call ONLY on variants with probe score > current best
skill_description: |
  Targeted step-pattern mutation. The seed already has diverse, high-quality step functions.
  Generate targeted edits (width/height/asymmetry changes) to existing patterns, use probes
  to filter, then evaluate. Only after exhausting pattern variations, switch to new architectures.
skill_body: |
  # C₂ Optimizer: Targeted Pattern Mutation Protocol
  
  ## Understanding the Problem
  The seed program contains 10+ well-designed step patterns in _create_step_initializer.
  These patterns are diverse (different widths, heights, asymmetries). The harness previously
  failed by trying to generate completely new function families (Gaussian, B-spline, etc.).
  
  **KEY INSIGHT**: edit_solution performs SEARCH/REPLACE on the EVOLVE-BLOCK. It cannot
  generate entirely new function architectures. To improve, you must EDIT existing patterns.
  
  ## Phase 1: Pattern Exploration (iterations 1-20)
  
  Step 1: Analyze Current Patterns
  - Call analyze_patterns ONCE to see all 10 patterns and their current c2 values
  - Identify: Which pattern has best c2? Which patterns are similar? Where's room for improvement?
  
  Step 2: Generate Targeted Variants
  - Call generate_variants on the BEST pattern (or top 2 patterns)
  - Generate 5-8 variants with SMALL edits:
    * Width shifts: ±2-5% on interval boundaries
    * Height adjustments: ±0.05-0.15 on plateau heights
    * Add/remove small plateaus at edges
    * Create asymmetric variants of symmetric patterns
    * Combine: take left side of pattern A, right side of pattern B
  - IMPORTANT: Keep edits SMALL (≤10% structural change) to maintain mathematical properties
  
  Step 3: Probe-Based Filtering
  - Call probe_solution on ALL 5-8 variants (fast, ~10s each, separate from eval budget)
  - Call evaluate_solution ONLY on variants with probe score > current best
  
  Step 4: Iterate
  - If a variant beats the record: continue refining it (small mutations)
  - If NO variant beats record after trying 3 different seed patterns: go to Phase 2
  
  ## Phase 2: Architecture Rewrite (iterations 21-40)
  
  Only if Pattern Exploration fails:
  1. Call analyze_patterns on current best
  2. Call generate_new_architectures to create 5 NEW diverse patterns from scratch
  3. These should be COMPLETELY NEW step patterns (different number of levels, asymmetries)
  4. Probe all, evaluate top 2
  5. If still no improvement after 5 iterations: stop and report best found
  
  ## Mathematical Guidelines
  - For step functions: C₂ depends on how L2 norm distributes relative to sup norm
  - Widening support → increases L2 more than sup (good if sup dominates)
  - Adding intermediate plateaus → can smooth the convolution profile
  - Asymmetry → may create interference patterns that improve the ratio
  - Keep f(x) ≥ 0 (use jax.nn.softplus or max(0, f))
  
  ## Key Rule
  - NEVER try to replace step functions with entirely different families (edit_solution can't do it)
  - ALWAYS start by editing EXISTING patterns with small, targeted changes
  - Use probes to explore 5-8 variants before any full evaluation
  - Only rewrite architectures after exhausting pattern variations
tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK region. For step-function patterns: modify _create_step_initializer.
    Make SMALL, targeted edits:
    - Shift interval boundaries by ±2-5% (e.g., int(0.25*n) → int(0.27*n))
    - Adjust heights by ±0.05-0.15 (e.g., 1.40 → 1.45)
    - Add/remove small plateaus at edges
    - Create asymmetric variants (mirror a symmetric pattern with slight imbalance)
    - Combine patterns (take left side of pattern A, right side of pattern B)
    - ALWAYS ensure f >= 0 (use jax.nn.softplus or jnp.maximum(f, 0))
    - Use JAX array mutation: f = f.at[start:end].set(value)
  evaluate_solution: |
    Full evaluation on 30% subsample. Budget: 30 total evaluations. Call ONLY after:
    1. You've generated 5-8 variants using generate_variants
    2. You've probed ALL variants with probe_solution
    3. You've selected top 1-2 variants with probe score > current best
    If probe score < current best, skip full eval and try next variant.
  probe_solution: |
    Approximate score on 10% subsample. ~10x faster than full eval. You have 30 probes.
    USE THEM WISELY: probe 5-8 variants to filter before spending full evaluations.
    Probe scores are approximate but reliable enough to rank variants. Call probe on ALL
    generated variants before calling evaluate. Skip full eval if probe score < current best.
  finish: |
    Report the best combined_score achieved, which pattern variant won, key edits made
    (width/height changes), and whether you exhausted pattern variations before switching
    to new architectures. Include structural analysis from analyze_patterns.
sampling:
  temperature: 0.6
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 15000
new_tools:
- name: analyze_patterns
  description: |
    Analyze all 10 step patterns in _create_step_initializer. Returns which pattern has
    best c2, their structural properties (num_levels, avg_height, support_width), and
    suggestions for targeted edits. Call ONCE at start to understand landscape.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        program = ctx.get_program()
        import re
        patterns = []
        
        # Extract all pattern definitions
        pattern_blocks = re.findall(r'elif pattern_idx == \d+:.*?f = f\.at\[int\(0\.[\d\.]+\*n\):int\(0\.[\d\.]+\*n\)\]\.set\(([\d.]+)\)', program, re.DOTALL)
        
        for idx, block in enumerate(pattern_blocks[:12]):
            heights = re.findall(r'set\(([\d.]+)\)', block)
            if heights:
                height = float(heights[0])
                start_pct = re.search(r'int\(0\.(\d+)\*n\)', block)
                end_pct = re.search(r'int\(0\.(\d+)\*n\)', block)
                start = float(start_pct.group(1)) if start_pct else 0.0
                end = float(end_pct.group(1)) if end_pct else 1.0
                support_width = end - start
                patterns.append({
                    'pattern_idx': idx,
                    'height': height,
                    'support_width': support_width,
                    'description': f"Pattern {idx}: height={height}, support=[{start:.2f},{end:.2f}]"
                })
        
        return {
            'patterns': patterns,
            'note': 'Analyzed step patterns. Use generate_variants to create targeted edits on best pattern.'
        }
- name: generate_variants
  description: |
    Generate 5-8 targeted variants of the BEST current pattern. Make SMALL edits:
    - Width shifts: ±2-5% on interval boundaries
    - Height adjustments: ±0.05-0.15 on plateau heights  
    - Add/remove small plateaus at edges
    - Create asymmetric variants
    - Combine patterns (take left of A, right of B)
    Returns ready-to-edit code. Call this AFTER analyze_patterns to focus on winning patterns.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import random
        random.seed(42)
        
        best_pattern_idx = args.get('best_pattern', 0)
        base_height = args.get('base_height', 1.5)
        
        proposals = []
        
        # Variant 1: Widen support
        proposals.append({
            'variant': 'wider_support',
            'description': f'Widen {best_pattern_idx} support by +3%',
            'edit': 'shift boundaries outward by 3%',
            'rationale': 'Wider support increases L2 more than sup'
        })
        
        # Variant 2: Height increase
        proposals.append({
            'variant': 'height_increase',
            'description': f'Increase height by +0.1',
            'edit': f'change height from {base_height} to {base_height+0.1}',
            'rationale': 'Higher peak may improve ratio if L2 scales better'
        })
        
        # Variant 3: Asymmetric mirror
        proposals.append({
            'variant': 'asymmetric_mirror',
            'description': f'Mirror {best_pattern_idx} with slight asymmetry',
            'edit': 'adjust left/right boundaries by ±1%',
            'rationale': 'Asymmetry creates interference patterns'
        })
        
        # Variant 4: Add edge plateau
        proposals.append({
            'variant': 'add_edge_plateau',
            'description': f'Add small edge plateau to {best_pattern_idx}',
            'edit': 'add [int(0.02*n):int(0.05*n)].set(0.3)',
            'rationale': 'Edge plateaus smooth convolution tails'
        })
        
        # Variant 5: Combine with pattern 0
        proposals.append({
            'variant': 'hybrid_pattern',
            'description': f'Combine {best_pattern_idx} with pattern 0',
            'edit': 'take left 40% of pattern 0, right 60% of best_pattern',
            'rationale': 'Hybrid may balance different properties'
        })
        
        # Variant 6: Height decrease
        proposals.append({
            'variant': 'height_decrease',
            'description': f'Decrease height by -0.1',
            'edit': f'change height from {base_height} to {base_height-0.1}',
            'rationale': 'Lower peak may reduce sup more than L2'
        })
        
        # Variant 7: Narrow support
        proposals.append({
            'variant': 'narrower_support',
            'description': f'Narrow {best_pattern_idx} support by -3%',
            'edit': 'shift boundaries inward by 3%',
            'rationale': 'Narrower support may concentrate L2'
        })
        
        # Variant 8: Multi-height variant
        proposals.append({
            'variant': 'multi_height',
            'description': f'Create two-height variant of {best_pattern_idx}',
            'edit': 'split main plateau into high/low regions',
            'rationale': 'Multi-height may create better convolution structure'
        })
        
        return {
            'variants': proposals,
            'note': 'These are targeted edits of pattern {}'.format(best_pattern_idx),
            'usage': 'Use probe_solution on all variants before full evaluation'
        }
new_skills:
- name: step-pattern-optimizer
  description: |
    Optimizes C₂ by editing existing step-function patterns with targeted, small changes.
    Use analyze_patterns to identify best pattern, generate_variants to create edits,
    probe to filter, then evaluate. Only switch to new architectures after exhausting pattern variations.
  body: |
    # Step Pattern Optimizer for C₂ Maximization
    
    ## Core Principle
    The seed contains 10+ well-designed step patterns. Don't try to generate new function
    families (edit_solution can't do that). Instead, make SMALL, targeted edits to existing
    patterns and use probes to filter before full evaluation.
    
    ## Method: Pattern Editing Protocol
    
    ### Step 1: Analyze Patterns
    - Call analyze_patterns ONCE to see all 10 patterns
    - Identify: Which has best c2? What are their structures (width, height, levels)?
    - Note patterns that are diverse (different properties) vs similar
    
    ### Step 2: Generate Targeted Variants
    - Call generate_variants on the BEST pattern
    - Generate 5-8 variants with SMALL edits:
      * Width shifts: ±2-5% on interval boundaries
      * Height adjustments: ±0.05-0.15
      * Add/remove edge plateaus
      * Create asymmetric variants
      * Combine patterns (left of A + right of B)
    - CRITICAL: Keep edits ≤10% structural change
    
    ### Step 3: Probe and Evaluate
    - Call probe_solution on ALL 5-8 variants (fast filtering)
    - Call evaluate_solution ONLY on variants with probe score > current best
    - If no improvement after trying 3 different seed patterns: go to Phase 2
    
    ### Step 4: Switch Architectures (Phase 2)
    - Only if Phase 1 fails completely: call generate_new_architectures
    - Create 5 NEW diverse step patterns from scratch
    - Probe all, evaluate top 2
    - If still no improvement after 5 iterations: report best found
    
    ## Mathematical Intuition
    - C₂ = ||f★f||₂² / ((∫f)² ||f★f||_∞)
    - Widening support: increases L2 faster than sup (good)
    - Adding plateaus: smooths convolution, may improve L2/sup ratio
    - Asymmetry: creates interference patterns that can boost the ratio
    - Step functions are already optimal candidates; small improvements possible
    
    ## Key Rules
    - NEVER try to replace step functions with Gaussian/B-spline/etc.
    - ALWAYS edit EXISTING patterns with small, targeted changes first
    - Use probes to explore 5-8 variants before any full evaluation
    - Only rewrite architectures after exhausting pattern variations
new_middlewares:
- name: enforce_pattern_focusing
  hook: before_model
  description: Middleware to keep solver focused on pattern editing, not generating new function families
  implementation_py: |
    def before_model(hook_input):
        iteration = hook_input.get("iteration", 0)
        
        if iteration >= 5:
            return "Reminder: Focus on EDITING existing step patterns. Don't try to generate Gaussian/B-spline functions (edit_solution can't do that). Use generate_variants for small, targeted edits."
        
        return None
