type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK region. For step-function patterns: modify _create_step_initializer.

  Make SMALL, targeted edits:

  - Shift interval boundaries by ±2-5% (e.g., int(0.25*n) → int(0.27*n))

  - Adjust heights by ±0.05-0.15 (e.g., 1.40 → 1.45)

  - Add/remove small plateaus at edges

  - Create asymmetric variants (mirror a symmetric pattern with slight imbalance)

  - Combine patterns (take left side of pattern A, right side of pattern B)

  - ALWAYS ensure f >= 0 (use jax.nn.softplus or jnp.maximum(f, 0))

  - Use JAX array mutation: f = f.at[start:end].set(value)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
