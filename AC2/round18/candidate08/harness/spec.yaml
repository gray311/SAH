schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization for the C2 constant.
  C2 = ||f*f||2^2 / ((int f)^2 ||f*f||_inf), where f: R->R is non-negative.
  
  Current best: 0.8962799441554086 (step functions achieve ~1.042 combined_score).
  
  CRITICAL INSIGHT: The seed's 11 step patterns are diverse but confined to a specific architecture family.
  Small mutations within step functions CAN escape the local optimum if done systematically.
  
  STRATEGY - PARAMETER SPACE EXPLORATION WITHIN STEP FUNCTIONS:
  
  PHASE 1 (iterations 1-20): SYSTEMATIC STEP FUNCTION PARAMETER TUNING
  1. Analyze current best's pattern structure (how many levels, where peaks are)
  2. Generate 3 variants by mutating: peak heights (+/-0.1-0.2), interval positions (+/-5%), 
     and symmetry breaking (shift left/right by 0.02-0.05 fraction)
  3. Probe ALL 3 variants
  4. Evaluate TOP 2 by probe score
  5. Keep improving variant for 2-3 more iterations, then generate new mutation direction
  
  PHASE 2 (iterations 21-30): HYBRID APPROACHES
  1. Take best step function from Phase 1
  2. Add small Gaussian perturbations to peaks: f(x) = step_func(x) + 0.05*exp(-((x-mu)^2)/(2*sigma^2))
  3. Probe variants, evaluate best
  4. If no improvement: try multi-scale steps (coarse outer, fine inner regions)
  
  RULES:
  - Systematically vary ONE parameter at a time to understand its effect
  - Use probes to filter 3-5 variants before full eval (budget: 30 evals total)
  - Track which mutations helped (height ↑, width ↑, asymmetry) for informed next steps
  - NEVER jump to completely different architectures - refine what works!
  
  TOOL USAGE:
  - edit_solution: Replace EVOLVE-BLOCK with complete program. Mutate pattern indices, heights, positions.
  - probe_solution: Fast scoring on 10% subsample. Call on all 3-5 variants before full eval.
  - evaluate_solution: Full evaluation. Call on max 2 best probe candidates per iteration.
  - generate_candidates: Create diverse step function variations (use for inspiration, not direct editing)
skill_description: |
  Systematic parameter space exploration within step function architecture. Mutate heights, positions,
  and symmetry systematically. Add small Gaussian perturbations in Phase 2. Use probes to filter variants.
skill_body: |
  # C2 Maximizer: Systematic Step Function Parameter Tuning
  
  ## Core Principle
  Step functions work (1.042 combined_score). Escaping the local optimum requires systematic
  parameter exploration, not architecture jumps.
  
  ## Parameter Mutation Operators
  
  ### 1. Height Mutation
  - Change step heights by +/- 0.05 to 0.15 (5-15% variation)
  - Try: lower peaks reduce ||f*f||_inf while maintaining L2
  - Try: higher peaks increase ||f*f||_inf but may hurt L2/inf ratio
  - Test pattern_idx=1 (height 1.50) at 1.45, 1.55, 1.60, 1.35
  
  ### 2. Position Mutation
  - Shift interval boundaries by +/- 2-5% of n_intervals
  - Try: narrow the central peak (reduces ||f*f||_inf)
  - Try: widen the support (increases integral, affects denominator)
  - Test: move start from 0.25n to 0.23n, 0.27n, 0.20n
  
  ### 3. Asymmetry Introduction
  - Make left and right sides different
  - Try: left side height = base*0.9, right side = base*1.1
  - Try: asymmetric peak widths (narrow left, wide right)
  
  ### 4. Multi-peak Patterns
  - Create 2-3 distinct peaks with controlled spacing
  - Pattern: low-high-low (like Gaussian) but with steps
  - Pattern: high-low-high (two peaks, one valley)
  
  ## Execution Flow
  
  Iteration 1-5 (Parameter Sensitivity):
  1. Pick a base pattern (e.g., pattern_idx=2 with height 1.60)
  2. Generate 3 height variants: 1.55, 1.60, 1.65
  3. Probe all 3, evaluate best
  4. Record which direction helped
  
  Iteration 6-15 (Combined Mutations):
  1. Take winning variant from previous phase
  2. Apply one more mutation: position shift OR asymmetry
  3. Generate 3 new variants
  4. Probe all, evaluate top 2
  
  Iteration 16-25 (Refinement):
  1. If height mutation helped: try finer granularity (±0.02)
  2. If position helped: try multi-scale (coarse outer, fine inner)
  3. If stuck: try new base pattern with different structure
  
  Iteration 26-30 (Hybrid):
  1. Take best step function
  2. Add small Gaussian: f = step + 0.03*exp(-((x-0.25n)^2)/(2*(0.1n)^2))
  3. Probe variants, evaluate best
  
  ## Key Rules
  - Systematic exploration beats random jumps
  - Track mutation effects: height↑? position shift? asymmetry?
  - Use 20-25 probes to explore 8-12 variants before full evaluations
  - Evaluate max 1-2 candidates per iteration (save budget)
  - If iteration 15+ with no improvement: try new base pattern with different structure
tool_descriptions:
  edit_solution: "Replace EVOLVE-BLOCK with complete program. Implement step function with mutated parameters.
    Use jax.nn.softplus for positivity. For pattern mutations: change start/end positions, heights,
    or add asymmetry. Example: f = f.at[start:end].set(new_height). Always ensure f >= 0."
  evaluate_solution: "Full evaluation. Budget: 30 total. Call ONLY on top 1-2 variants ranked by probe_solution.
    Probe first to filter out weak candidates."
  probe_solution: "Approximate score on 10% subsample. FAST (10s vs minutes for full eval). Use to rank 3-5
    variants before full eval. You have ~25 probe budget - spend wisely to explore parameter space,
    not to confirm one candidate. Probe score > 1.0 suggests promising variant."
  finish: "Report best combined_score, winning parameter configuration (heights, positions, symmetry),
    and key mutation insights (which parameter changes helped). List 3-5 best step function variants."
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
  - name: mutate_step_pattern
    description: |
      Generate 3 step function variants by mutating a base pattern's heights, positions, and symmetry.
      Base pattern is provided in args['base_pattern']. Returns complete code for each variant ready for edit_solution.
    input_schema:
      type: object
      properties:
        base_pattern:
          type: object
          properties:
            pattern_idx:
              type: integer
            heights:
              type: array
              items:
                type: number
            positions:
              type: array
              items:
                type: number
            num_intervals:
              type: integer
    implementation_py: |
      def run(ctx, args):
          import math
          base = args.get('base_pattern', {})
          n = base.get('num_intervals', 600)
          pattern_idx = base.get('pattern_idx', 0)
          heights = base.get('heights', [1.0, 2.0, 1.0])
          positions = base.get('positions', [0.25, 0.5, 0.75])
          
          variants = []
          
          # Variant 1: Height perturbation
          if pattern_idx < len(heights):
              new_heights = list(heights)
              noise = [0.95, 1.0, 1.05]
              idx = pattern_idx % len(noise)
              new_heights[pattern_idx] = new_heights[pattern_idx] * noise[idx]
              new_positions = list(positions)
              variants.append({
                  'type': 'height_mut', 'name': f'height_{noise[idx]:.2f}x',
                  'heights': new_heights, 'positions': new_positions, 'pattern_idx': pattern_idx
              })
          
          # Variant 2: Position perturbation
          if len(positions) > 1:
              new_positions = list(positions)
              shift = 0.02 + 0.03 * (pattern_idx % 2)  # 0.02 or 0.03
              new_positions[pattern_idx % len(new_positions)] = min(0.85, max(0.15, new_positions[pattern_idx % len(new_positions)] + shift))
              variants.append({
                  'type': 'pos_mut', 'name': f'pos_shift_{shift:.2f}',
                  'heights': heights, 'positions': new_positions, 'pattern_idx': pattern_idx
              })
          
          # Variant 3: Asymmetry
          asym_heights = list(heights)
          asym_positions = list(positions)
          center = len(asym_heights) // 2
          if center > 0:
              asym_heights[center] = heights[center] * 1.08  # slightly higher center
              asym_positions[center] = positions[center] * 0.98  # slightly shifted
          variants.append({
              'type': 'asym_mut', 'name': 'asymmetry',
              'heights': asym_heights, 'positions': asym_positions, 'pattern_idx': pattern_idx + 2 if pattern_idx < 9 else pattern_idx
          })
          
          return {'variants': variants, 'note': 'Use edit_solution to implement each variant fully'}
