type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with complete program. Implement step function with mutated parameters.
  Use jax.nn.softplus for positivity. For pattern mutations: change start/end positions, heights, or add
  asymmetry. Example: f = f.at[start:end].set(new_height). Always ensure f >= 0.'
input_schema:
