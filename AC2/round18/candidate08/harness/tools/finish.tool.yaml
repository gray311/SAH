type: tool
name: finish
description: Report best combined_score, winning parameter configuration (heights, positions, symmetry),
  and key mutation insights (which parameter changes helped). List 3-5 best step function variants.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
