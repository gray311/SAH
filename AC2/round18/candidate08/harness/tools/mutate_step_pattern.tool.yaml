type: tool
name: mutate_step_pattern
description: 'Generate 3 step function variants by mutating a base pattern''s heights, positions, and
  symmetry.

  Base pattern is provided in args[''base_pattern'']. Returns complete code for each variant ready for
  edit_solution.'
input_schema:
  type: object
  properties:
    base_pattern:
      type: object
      properties:
        pattern_idx:
          type: integer
        heights:
          type: array
          items:
            type: number
        positions:
          type: array
          items:
            type: number
        num_intervals:
          type: integer
