description: Approximate score on 10% subsample. FAST (10s vs minutes for full eval). Use to rank 3-5
  variants before full eval. You have ~25 probe budget - spend wisely to explore parameter space, not
  to confirm one candidate. Probe score > 1.0 suggests promising variant.
