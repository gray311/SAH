type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. For structural variants: perturb seed step patterns by changing peak
  heights (+/-0.1), widths (+/-0.05 fraction), and positions (+/-0.03 fraction). Use jax.nn.softplus or
  max(0,·) for non-negativity. Example: if seed has height 1.50 at [0.25*600:0.75*600], try 1.45 and 1.55
  variants.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
