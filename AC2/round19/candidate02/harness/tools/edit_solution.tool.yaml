type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK''s OptimizerHyperparameters dataclass. Change: num_intervals (200-1000),
  learning_rate (0.01-0.3), num_steps (5000-50000), warmup_steps, best_c2, stagnation_window, reinit_fraction
  (0.05-0.2), reinit_std (0.01-0.05), reinit_interval (50-300). Always ensure f >= 0. Use JAX array mutation.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
