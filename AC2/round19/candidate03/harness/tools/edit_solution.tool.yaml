type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to create STEP functions. Use jax.numpy.at for efficient assignment.

  Examples:

  - Single level: f = f.at[int(0.2*n):int(0.8*n)].set(1.5)

  - Multi-level: Loop over level positions and heights: for i in range(num_levels): f = f.at[start:end].set(heights[i])

  - Ensure non-negativity: f = jnp.maximum(f, 0) or use jax.nn.relu

  - Use patterns: Pyramid (low-high-low), Mountain (low-low-high-low-low), Asymmetric (varied heights)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
