type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK''s compute_function using parameters from propose_function_family.

  - For Gaussian: implement weighted sum of jnp.exp with the given mus, sigmas, weights

  - For Oscillatory: implement (1 + alpha*cos(beta*x)) * exp(-gamma*abs(x))

  - For Piecewise-Linear: use jnp.piecewise with given vertices and heights

  - For Multi-Step: use .at indexing to set step levels at given positions

  - Ensure f(x) >= 0 with jnp.maximum(f, 1e-10)

  - Keep function signature: compute_function(x_values)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
