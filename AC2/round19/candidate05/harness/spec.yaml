schema: h2spec/1.0
system_prompt: "You are optimizing C2 = ||f★f||₂² / ((∫f)² ||f★f||_∞) for non-negative f: ℝ→ℝ.\n\nBEST KNOWN: 0.89628 (step functions).\n\nCRITICAL: The seed's step patterns ARE the right direction. Don't abandon them for Gaussians/splines.\n\nYOUR STRATEGY - STEP-FUNCTION SPACE EXPLORATION:\n\nPHASE 1 (iterations 1-12): DIVERSE STEP-VARIANT DISCOVERY\n1. Analyze current best's structure (note peak positions, height ratios, support width)\n2. Generate 3-5 STEP-FUNCTION variants with DIFFERENT:\n   - Peak/step positions (try 0.2-0.8 range variations)\n   - Height configurations (try 1.3-2.5 range)\n   - Number of levels (2-6 levels)\n   - Asymmetry (shift left/right support)\n3. For each variant: use probe_solution first (cheap, separate budget)\n4. Only full-evaluate TOP 2 by probe score\n5. If both fail probe > 1.0: generate fresh variants (don't mutate further)\n\nPHASE 2 (iterations 13-30): PRECISION STEP TUNING\n1. Take best architecture from Phase 1 (if it beat record)\n2. Make SMALL targeted mutations:\n   - Height: +/-0.1 per level\n   - Positions: +/-2% of interval count\n   - Add/remove ONE level\n   - Slight asymmetry adjustment\n3. Probe all variants, evaluate top 1\n4. If stuck for 3 iterations: restart Phase 1 with new random seeds\n\nKEY RULES:\n- STAY IN STEP-FUNCTION SPACE - it's the current champion\n- ALWAYS PROBE BEFORE FULL EVAL (use 30 probe budget aggressively)\n- If probe < 1.0, SKIP full eval and try next variant\n- After iteration 10: if no improvement, generate COMPLETELY NEW step patterns (not mutations)\n- Use all 30 probes to explore 15-20 variants before exhausting full evals"
skill_description: "Step-function space exploration: systematically explore diverse step patterns, use probes to rank before full eval. Stay in step-function space - it's the current champion."
skill_body: "# Step-Function C2 Optimizer Protocol\n\n## Core Principle\nStep functions are the current champion (0.89628). Don't abandon them. Systematically explore the step-function space with diverse patterns and probe-based filtering.\n\n## Phase 1: Diverse Step Discovery (iterations 1-12)\n\nStep 1: Analyze Current Best\n- Note: peak positions (as fraction of [0,1]), height values, number of levels, support width\n- Question: What structural feature might be limiting it?\n\nStep 2: Generate Diverse Step Variants\nCreate 3-5 completely different step functions:\n\nVariation A - Different Peak Position:\n  Move the high step to different positions: [0.25, 0.30, 0.35] × [0.65, 0.75, 0.85]\n\nVariation B - Different Height Configurations:\n  Try heights in range [1.3, 2.5]. Example: [0.7, 1.5, 2.0, 1.5, 0.7]\n\nVariation C - Different Number of Levels:\n  2-level, 3-level, 4-level, 5-level, 6-level functions\n  Example 4-level: [0.1, 0.3, 0.5, 0.7, 0.9] with heights [0.6, 1.3, 2.0, 1.3, 0.6]\n\nVariation D - Asymmetric Support:\n  Shift support to left or right: [0.05-0.8] or [0.2-0.95]\n\nVariation E - Multi-Peak Structure:\n  Two high regions separated by valley: [0.0-0.3]=a, [0.3-0.4]=high, [0.4-0.6]=low, [0.6-0.9]=high, [0.9-1.0]=a\n\nStep 3: Probe-Based Filtering\n- Call probe_solution on ALL generated variants (use your 30 probe budget)\n- Record probe scores relative to seed (1.0 = seed score)\n- Skip any with probe < 0.95 (too weak to warrant full eval)\n\nStep 4: Full Evaluation\n- Evaluate TOP 2 by probe score\n- If either beats 0.89628: proceed to Phase 2\n- If neither beats: generate FRESH variants (not mutations) and repeat\n\n## Phase 2: Precision Tuning (iterations 13-30)\n\nOnly if a variant beat the record:\n1. Analyze the winning architecture\n2. Generate 3 variants with SMALL mutations:\n   - Height: +/-0.05 per level\n   - Positions: +/-2% of num_intervals\n   - Add ONE level or remove ONE level\n3. Probe all, evaluate TOP 1\n4. If no improvement after 3 iterations: restart Phase 1 with new random seeds\n\n## Critical Rules\n- STAY IN STEP-FUNCTION SPACE - proven it works\n- PROBE BEFORE FULL EVAL - 30 probes, use them to explore 15-20 variants\n- If probe < 1.0, SKIP full eval\n- After iteration 10 with no improvement: generate COMPLETELY NEW patterns\n- Maximum 2 full evals per iteration cycle"
tool_descriptions:
  edit_solution: "Edit the EVOLVE-BLOCK to create STEP-FUNCTION variants. Use pattern-based editing:\n  - Vary peak positions: change start/end indices as fractions of num_intervals\n  - Vary heights: try values 1.2-2.5 for high steps, 0.5-1.0 for low steps\n  - Add/remove levels: create multi-level step functions with 2-6 levels\n  - Create asymmetric support: shift intervals to [0.05-0.8] or [0.2-0.95]\n  Always use: f = f.at[start:end].set(height) with jax array mutation.\n  Ensure f >= 0 everywhere.\n  Example: for 600 intervals, a 5-level function might be:\n    f = jnp.zeros(600)\n    f = f.at[120:180].set(0.7)\n    f = f.at[180:300].set(1.5)\n    f = f.at[300:420].set(2.0)\n    f = f.at[420:540].set(1.5)\n    f = f.at[540:600].set(0.7)"
  evaluate_solution: "Full evaluation. Budget: 30 total evaluations. Call ONLY after probe_solution has ranked candidates and you have identified the TOP 1-2 by probe score. If any candidate has probe score < 1.0 (worse than seed), SKIP full eval and try another variant. This saves precious evaluations."
  probe_solution: "Approximate score on 10% subsample. FAST (~10s vs minutes for full eval). Separate budget of 30 probes. USE AGGRESSIVELY:\n  - Call probe_solution on EVERY variant you generate\n  - With 30 probes, you can explore 15-20 variants before any full eval\n  - Only full-evaluate TOP 2 by probe score\n  - If probe score < 1.0, skip full eval entirely\n  - This is how you find the winner without wasting evaluations"
  finish: Report best combined_score achieved, the winning step-function architecture (peak positions, height configuration, number of levels), and key insights about what made it successful vs seed patterns.
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  max_tokens: 12288
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
