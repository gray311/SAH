type: tool
name: edit_solution
description: "Edit the EVOLVE-BLOCK to create STEP-FUNCTION variants. Use pattern-based editing:\n  -\
  \ Vary peak positions: change start/end indices as fractions of num_intervals\n  - Vary heights: try\
  \ values 1.2-2.5 for high steps, 0.5-1.0 for low steps\n  - Add/remove levels: create multi-level step\
  \ functions with 2-6 levels\n  - Create asymmetric support: shift intervals to [0.05-0.8] or [0.2-0.95]\n\
  \  Always use: f = f.at[start:end].set(height) with jax array mutation.\n  Ensure f >= 0 everywhere.\n\
  \  Example: for 600 intervals, a 5-level function might be:\n    f = jnp.zeros(600)\n    f = f.at[120:180].set(0.7)\n\
  \    f = f.at[180:300].set(1.5)\n    f = f.at[300:420].set(2.0)\n    f = f.at[420:540].set(1.5)\n  \
  \  f = f.at[540:600].set(0.7)"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
