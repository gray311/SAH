type: tool
name: probe_solution
description: "Approximate score on 10% subsample. FAST (~10s vs minutes for full eval). Separate budget\
  \ of 30 probes. USE AGGRESSIVELY:\n  - Call probe_solution on EVERY variant you generate\n  - With 30\
  \ probes, you can explore 15-20 variants before any full eval\n  - Only full-evaluate TOP 2 by probe\
  \ score\n  - If probe score < 1.0, skip full eval entirely\n  - This is how you find the winner without\
  \ wasting evaluations"
