type: tool
name: edit_solution
description: 'Edit EVOLVE-BLOCK. Mutate seed''s step patterns: change heights by +/-0.05-0.2, shift boundaries
  by +/-5%, add/remove levels, create asymmetric patterns. Ensure f >= 0 using jax.nn.softplus or max(0,·).
  Example: f = f.at[start:end].set(new_height). For new patterns, modify multiple levels.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
