type: tool
name: mutate_seed_patterns
description: 'Generate 3-5 mutations of the seed''s 12 step patterns. Each mutation makes DISTINCT changes:

  - Height perturbation: +/-0.05-0.2 on peak/valley heights

  - Position shift: move boundaries by +/-5%

  - Level merging: combine adjacent levels

  - Level splitting: add new level between existing ones

  - Asymmetry: make left/right different

  Call when starting Phase 1 or after full eval fails.'
