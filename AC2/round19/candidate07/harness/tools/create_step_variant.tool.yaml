type: tool
name: create_step_variant
description: 'Generate ONE simple step-function variant by modifying heights, positions, or adding/removing
  one level.

  Takes current best''s pattern structure and applies small mutations. Returns valid, runnable code.

  Call this to explore within the proven step-function family.'
input_schema:
  type: object
  properties:
    mutation_type:
      type: string
      enum:
      - height_adjust
      - position_shift
      - add_level
      - remove_level
      - recenter
    intensity:
      type: number
      description: Mutation intensity (0.1-0.3 for small changes)
