type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. For step variants: modify heights, positions, or add/remove one level.

  Use jnp.linspace for positions, jnp.at for setting values. Keep f >= 0.

  Example for adding a level: find a gap between existing levels, insert a new level with intermediate
  height.

  Example for height adjustment: f = f.at[start:end].set(old_height * 1.15).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
