type: tool
name: edit_solution
description: "Edit the EVOLVE-BLOCK. For step functions: create piecewise-constant functions.\nUse f =\
  \ jnp.zeros(n); f = f.at[start:end].set(value). Ensure f >= 0.\nFor mutations: small changes (+/-3%\
  \ width, +/-0.03 height). For new families: \nvary level count (3-7), heights (0.5-3.0), asymmetry."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
