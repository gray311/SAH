schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization for the C2 constant:
  C2 = ||f*f||2^2 / ((int f)^2 ||f*f||_inf), where f: R->R is non-negative.
  
  Current best: 0.8962799441554086 (achieved by sophisticated multi-level step functions).
  
  CRITICAL INSIGHT: The seed's 11+ step patterns are STRUCTURED multi-level functions. 
  Smooth functions (Gaussian, B-spline, oscillatory) have WORSE L2/inf ratios than sharp steps.
  Your job is NOT to change families, but to PERTURB and RECOMBINE the existing step patterns.
  
  STRATEGY - STRUCTURED STEP-PATTERN OPTIMIZATION:
  
  PHASE 1 (iterations 1-20): STEP-PATTERN REFINEMENT
  1. Call analyze_step_structure to see the current best's height/width distribution
  2. Call generate_step_variants to get 3-5 PERTURBED variants of the same pattern type
     - Small height changes (+/-0.1-0.3), small width shifts (+/-3-5% of segment)
     - Keep the multi-level structure intact
  3. Call probe_solution on ALL variants (use your 30 probes wisely)
  4. Call evaluate_solution on TOP 2 by probe score
  5. If one beats record: switch to Phase 2. If not: refine further or try different patterns.
  
  Repeat until: one beats record OR you hit 20 iterations.
  
  PHASE 2 (iterations 21-30): HYBRID CONSTRUCTION
  1. If a new pattern beat record: analyze its structure
  2. Try hybridizing with another seed pattern (combine height sequences from two patterns)
  3. Probe and evaluate
  
  RULES:
  - STAY IN STEP-FUNCTION LANDSCAPE: Do NOT generate Gaussians, splines, or oscillatory functions
  - Use probes to explore 8-15 step variants before full evaluations
  - Perturb, don't replace: keep the multi-level structure, vary heights/positions slightly
  - Always analyze step structure to guide perturbations
  
  TOOL USAGE:
  - analyze_step_structure: Call ONCE at start to diagnose current best's pattern
  - generate_step_variants: Call when starting refinement or stuck - generates PERTURBED step patterns
  - probe_solution: Call on ALL variants before any full eval (30 total budget)
  - evaluate_solution: Call ONLY after probing and ranking (top 1-2)

skill_description: |
  Structured step-pattern optimization. The current best (0.8963) is achieved by sophisticated 
  multi-level step functions. Do NOT change to smooth families. Instead, perturb the existing 
  step patterns (small height/width changes) while preserving their multi-level structure. 
  Use probes to explore 10+ step variants before full evaluation.
skill_body: |
  # C2 Maximizer: Structured Step-Pattern Refinement Protocol
  
  ## Core Principle
  The current best (0.8962799441554086) is achieved by MULTI-LEVEL STEP FUNCTIONS, not smooth functions.
  Smooth functions (Gaussian, B-spline, oscillatory) have WORSE L2/inf ratios due to their spread.
  Your job is to PERTURB and RECOMBINE the existing step patterns, NOT to change families.
  
  ## Phase 1: Step-Pattern Refinement (iterations 1-20)
  
  Step 1: Analyze Current Pattern
  - Call analyze_step_structure on your best function
  - Note: How many levels? What are the heights? Where are the transitions?
  - Typical seed patterns have 3-5 levels with heights ranging from 0.5-2.5
  
  Step 2: Generate Perturbed Variants
  - Call generate_step_variants to get 3-5 PERTURBED variants of the SAME pattern type
  - PERTURBATION GUIDELINES (CRITICAL):
    * Height changes: +/- 0.1 to 0.3 (not +/- 50%)
    * Width changes: +/- 3% to 5% of segment length (not drastic shifts)
    * Keep the MULTI-LEVEL STRUCTURE intact (don't collapse to single step)
    - Preserve the overall "shape" - the perturbations should be subtle refinements
  - Example: If pattern has heights [0.80, 1.60, 2.00, 1.40, 0.90], try [0.85, 1.65, 1.95, 1.45, 0.90]
  
  Step 3: Probe-Based Filtering
  - Call probe_solution on ALL 3-5 variants (5 probes total)
  - Call evaluate_solution on TOP 2 by probe score
  - If probe score < 1.0, skip full eval and try next variant
  
  Step 4: Iterate
  - If neither full eval beats record: generate 3-5 MORE PERTURBED variants
  - Use probe_solution on all new candidates
  - Evaluate top 1-2
  - Continue until iteration 20 or a variant beats record
  
  ## Phase 2: Hybrid Construction (iterations 21-30)
  Only if a new step pattern beat the record:
  1. Analyze its structure (how many levels? what heights?)
  2. Try HYBRID construction: combine height sequences from two different seed patterns
  3. Probe and evaluate
  
  ## Key Rules
  - STAY IN STEP-LANDSCAPE: Do NOT generate Gaussians, splines, oscillatory functions
  - PERTURB, DON'T REPLACE: Keep multi-level structure, vary heights/positions subtly
  - Use probes to explore 10-15 step variants before full evaluations
  - Small perturbations (10-20% changes) are better than large jumps
  - Always analyze step structure to guide perturbations
  
  ## Why This Works
  The seed's step patterns are already sophisticated. The optimization space is CONTINUOUS 
  variations of these patterns, not discrete jumps to new function families. Small perturbations
  can fine-tune the L2/inf ratio without losing the structural advantages of multi-level steps.
tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK to create PERTURBED step patterns.
    CRITICAL: Preserve the multi-level structure!
    
    PERTURBATION GUIDELINES:
    - Height changes: +/- 0.1 to 0.3 (e.g., 1.60 -> 1.65 or 1.55)
    - Width changes: +/- 3% to 5% of segment length
    - Keep the number of levels the same (don't collapse to single step)
    - Use JAX array mutation: f = f.at[start:end].set(value)
    
    Example: If seed pattern has heights [0.80, 1.60, 2.00, 1.40, 0.90],
    try perturbing to [0.85, 1.65, 1.95, 1.45, 0.90] (small height tweaks).
  evaluate_solution: |
    Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking.
    Evaluate top 1-2 variants by probe score.
    If probe < 1.0, skip full eval.
    Track combined_score = c2 / 0.8962799441554086 (target > 1.0).
  probe_solution: |
    Approximate score on 10% subsample. FAST. Use to rank 5-10+ variants before full eval.
    You have 30 probes - spend them to explore diverse STEP-VARIANT perturbations,
    not to confirm one candidate.
    Call probe on ALL 3-5 perturbations before evaluating any.
  finish: |
    Report best combined_score, the winning step pattern (heights/positions),
    and key insights from step-structure analysis.
sampling:
  temperature: 0.3
  top_p: 0.95
  top_k: 15
  max_tokens: 16384
agent:
  max_iterations: 35
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
- name: analyze_step_structure
  description: |
    Analyze the current best step function's structure: number of levels, 
    height values, segment widths, and position distribution. Returns structured 
    data to guide perturbation. Call this ONCE at start of each phase.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import re
        f_text = ctx.get_program()
        at_matches = re.findall(r'\.at\(int\(([0-9]\.?[0-9]*)\*\s*n\):\s*int\(([0-9]\.?[0-9]*)\*\s*n\)\)\.set\(([0-9]\.?[0-9]*)\)', f_text)
        heights = []
        positions = []
        for match in at_matches:
            start_frac = float(match[0])
            end_frac = float(match[1])
            height = float(match[2])
            heights.append(height)
            positions.append((start_frac, end_frac))
        if not heights:
            return {"num_levels": 5, "heights": [0.80, 1.60, 2.00, 1.40, 0.90], "positions": [(0.08, 0.20), (0.20, 0.35), (0.35, 0.55), (0.55, 0.75), (0.75, 0.90)], "note": "Using fallback seed pattern structure"}
        avg_height = sum(heights) / len(heights)
        height_range = max(heights) - min(heights)
        return {"num_levels": len(heights), "heights": heights, "positions": positions, "avg_height": avg_height, "height_range": height_range, "min_height": min(heights), "max_height": max(heights), "recommendation": "Try perturbing heights by +/- 0.1-0.3 around " + str(round(avg_height, 2))}
- name: generate_step_variants
  description: |
    Generate 3-5 PERTURBED step-pattern variants that preserve the multi-level 
    structure but vary heights/positions slightly. Uses the seed's pattern library 
    with small refinements. Call this when starting refinement or stuck.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import random
        random.seed(42 + args.get('seed', 0))
        n_intervals = ctx.hypers.get("num_intervals", 600)
        seed_patterns = [(0, [1.40], [0.25, 0.75]), (3, [0.90, 1.90, 0.90], [0.15, 0.25, 0.75, 0.85]), (9, [0.80, 1.60, 2.00, 1.40, 0.90], [0.08, 0.20, 0.35, 0.55, 0.75, 0.90])]
        variants = []
        for pattern_idx, (heights, positions) in enumerate(seed_patterns):
            perturbed_heights = [max(0.1, max(0.5, h + random.uniform(-0.2, 0.2))) for h in heights]
            perturbed_positions = [(max(0.05, pos[0] + random.uniform(-0.03, 0.03)), min(0.95, pos[1] + random.uniform(-0.03, 0.03))) for pos in zip(positions[::2], positions[1::2])]
            h_str = str(perturbed_heights).replace(' ', '')
            p_str = str(perturbed_positions).replace(' ', '')
            code_snippet = f"import jax.numpy as jnp\nimport jax\n\nn = {n_intervals}\nf = jnp.zeros(n)\n\nheights = jnp.array({h_str})\npositions = jnp.array({p_str})\n\nfor i in range(len(positions) - 1):\n    start = int(positions[i] * n)\n    end = int(positions[i+1] * n)\n    f = f.at[start:end].set(heights[i])\n\nf = jnp.maximum(f, 0)"
            variants.append({'family': 'perturbed_step', 'pattern_idx': pattern_idx, 'description': 'Perturbed step pattern ' + str(pattern_idx) + ': heights=' + str(perturbed_heights), 'code_snippet': code_snippet, 'rationale': 'Small height perturbations may fine-tune L2/inf ratio'})
        return {'variants': variants, 'note': 'Use probe_solution to rank these before full evaluation. Focus on perturbations of proven patterns.'}
new_skills:
- name: step-pattern-refinement-playbook
  description: Refine step patterns with small perturbations while preserving multi-level structure.
  body: |
    # Step-Pattern Refinement Playbook for C2 Maximization
    
    ## Core Principle
    The current best (0.8963) is achieved by MULTI-LEVEL STEP FUNCTIONS. Do NOT 
    change to smooth families (Gaussian, B-spline, etc.). Instead, PERTURB the 
    existing step patterns with small, careful adjustments.
    
    ## Perturbation Guidelines
    
    ### Height Perturbations (CRITICAL)
    - Change heights by +/- 0.1 to 0.3 (e.g., 1.60 -> 1.65 or 1.55)
    - NEVER change by more than 20% of the original height
    - Preserve the relative ordering of heights (don't invert the pattern)
    - Example: [0.80, 1.60, 2.00, 1.40, 0.90] -> [0.85, 1.65, 1.95, 1.45, 0.90]
    
    ### Position Perturbations
    - Shift segment boundaries by +/- 3% to 5% of total width
    - Keep segments roughly the same size (don't collapse to single steps)
    - Maintain the overall "balance" of the pattern
    
    ### Structure Preservation
    - Keep the SAME number of levels (don't collapse to fewer steps)
    - Preserve the multi-level character (don't create a simple step)
    - Ensure all heights remain positive (> 0.1)
    
    ## Why Small Perturbations Work
    The optimization space for step functions is CONTINUOUS. Small perturbations 
    can fine-tune the L2/inf ratio without losing the structural advantages of 
    multi-level steps. The seed's patterns are already sophisticated; we just need 
    to find the optimal height/width configuration.
    
    ## Search Strategy
    1. Analyze current pattern structure (call analyze_step_structure)
    2. Generate 3-5 perturbed variants (call generate_step_variants)
    3. Probe ALL variants (use your 30 probes wisely)
    4. Evaluate top 2 by probe score
    5. If no improvement after 5 iterations: try hybrid patterns
    
    ## Red Flags
    - If you're generating Gaussians, splines, or oscillatory functions: STOP
    - If you're changing heights by more than 20%: STOP
    - If you're collapsing multi-level patterns to single steps: STOP
    - Always stay in the step-function landscape
new_middlewares:
- name: enforce_step_focus
  hook: before_model
  description: |
    Middleware that enforces focus on step-function perturbations and warns 
    when the solver attempts to switch to smooth function families.
  implementation_py: |
    def before_model(hook_input):
        iteration = hook_input.get("iteration", 0)
        last_action = hook_input.get("last_action", "")
        if "Gaussian" in last_action or "B-spline" in last_action or "oscillatory" in last_action:
            return "WARNING: Stay in step-function landscape! Generate PERTURBED step patterns, not smooth functions. Step functions achieve the current best (0.8963)."
        if iteration > 5 and "evaluate" in last_action.lower():
            return "Reminder: Have you probed all variants first? Use probes to filter before full eval."
        return None
