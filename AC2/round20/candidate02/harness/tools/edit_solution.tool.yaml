type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to generate step patterns. Use jnp.at[].set() for interval modifications.

  For tail exploration: change num_intervals, adjust pattern heights, or modify start/end positions.

  Examples:

  - Extended support: f = jnp.linspace(-4, 4, num_intervals)

  - Asymmetric: start at 0.15*n instead of 0.25*n

  - Double-tailed: add small tails at both ends with heights 0.3-0.5'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
