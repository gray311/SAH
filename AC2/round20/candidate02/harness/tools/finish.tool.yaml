type: tool
name: finish
description: Report best combined_score, the winning step pattern type (e.g., "extended_tail", "asymmetric",
  "double_tailed"), and insights about tail behavior.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
