type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. Start with precision changes:

  - Increase num_intervals: 800, 1000, or 1200

  - Try Simpson''s integration: h/3 * (y1^2 + y1*y2 + y2^2) if not already used

  - Small shape mutations: shift step boundaries by ±2%, adjust heights by ±0.05

  - Use JAX array mutation: f = f.at[start:end].set(value)

  - Ensure f >= 0 via jax.nn.softplus or max(0,·)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
