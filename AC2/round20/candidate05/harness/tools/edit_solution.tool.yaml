type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. For mutations: modify step boundaries, heights, add side lobes.

  Use f.at[start:end].set(value) for region edits.

  For restarts: use jnp.piecewise or explicit function definitions.

  Ensure f >= 0 everywhere using max(0,·) or jax.nn.softplus.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
