type: tool
name: edit_solution
description: 'Execute ONE SPECIFIC EDIT. Give complete code with one concrete change. Example: f = f.at[int(0.25*n):int(0.75*n)].set(1.55).
  NOT generic instructions. Ensure f >= 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
