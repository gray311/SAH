schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis and mathematical optimization for the C2 constant:
  C2 = ||f*f||2^2 / ((int f)^2 ||f*f||_inf), where f: R->R is non-negative.

  Current best: 0.8962799441554086 (achieved by step functions).
  Target: surpass 0.8962799441554086.

  CRITICAL INSIGHT: The seed's 5 step patterns may be in the same local optimum,
  BUT the executor's editing capability is limited. You cannot reliably generate
  Gaussian mixtures, B-splines, or other complex function families from scratch
  via edit_solution - these edits will break the program structure.

  STRATEGY - SYSTEMATIC STEP-FUNCTION PARAMETER EXPLORATION:

  PHASE 1 (iterations 1-20): PARAMETER SPACE SEARCH WITHIN STEPS
  1. Call analyze_step_structure to understand the current best's parameters
  2. Call generate_step_variants to create 3-5 variants with controlled changes:
     - Move step boundaries by ±2% of interval
     - Adjust heights by ±0.1
     - Modify number of intervals by ±5%
     - Try different asymmetric patterns
  3. Call probe_solution on ALL variants (3-5 probes)
  4. Call evaluate_solution on TOP 2 by probe score
  5. Track which parameters moved in improving variants

  PHASE 2 (iterations 21-30): GRADIENT-ASCENT-LIKE REFINEMENT
  1. Take the best variant from Phase 1
  2. Generate 3 variants with SMALL targeted changes based on Phase 1 learning
  3. Probe all, evaluate top 1
  4. If no improvement: reset to seed and try a DIFFERENT initial pattern

  RULES:
  - Stay within step-function architecture - edit boundaries and heights systematically
  - Use parameter space exploration, not architectural jumps
  - If stuck for 5 iterations: reset to seed with a different pattern
  - Always analyze step structure before generating variants
  - Probes are your friends - use all 30 probes to explore parameter space

  TOOL USAGE:
  - analyze_step_structure: Parse current best to extract step boundaries and heights
  - generate_step_variants: Create controlled parameter variations
  - probe_solution: Use on ALL candidates before full eval
  - evaluate_solution: Only on top 1-2 after probing
skill_description: |
  Systematic step-function parameter exploration. Within the working step-function
  framework, explore parameter space (boundaries, heights, asymmetry) using probes to
  rank variants before full evaluation. Reset to different patterns when stuck.
skill_body: |
  # C2 Maximizer: Systematic Step-Function Parameter Exploration

  ## Core Principle
  Rather than attempting to generate new function families (which requires complex
  code that easily breaks), focus on systematic parameter space exploration within
  the step-function framework. The current best is a step function - perturb its
  parameters and use probes to guide the search.

  ## Phase 1: Parameter Space Exploration (iterations 1-20)

  Step 1: Analyze Current Structure
  - Call analyze_step_structure on your best function
  - Extract: step boundaries, heights, number of intervals
  - Compute statistics: mean height, max height, boundary spacing

  Step 2: Generate Controlled Variants
  - Call generate_step_variants with 3-5 variants:
    * Variant A: Shift all boundaries by +2% of their position
    * Variant B: Shift all boundaries by -2% of their position
    * Variant C: Increase middle heights by +0.1, decrease by -0.1 elsewhere
    * Variant D: Increase number of intervals by +10% (if feasible)
    * Variant E: Create asymmetric variant (mirror current and adjust heights)

  Step 3: Probe-Based Filtering
  - Call probe_solution on ALL variants (3-5 probes total)
  - Rank by probe score
  - Call evaluate_solution on TOP 2 by probe score
  - If probe score < 1.0: skip full eval

  Step 4: Learn and Iterate
  - Track which parameter changes led to improvement
  - If both full evals fail: try different starting pattern (different pattern_idx)
  - Continue until iteration 20 or improvement

  ## Phase 2: Gradient-Ascent Refinement (iterations 21-30)

  1. Take best variant from Phase 1
  2. Generate 3 variants with SMALL changes:
     - Boundary shifts of ±1%
     - Height adjustments of ±0.05
     - Try reversing asymmetry
  3. Probe all, evaluate top 1
  4. If no improvement after 5 iterations: go back to Phase 1 with new pattern

  ## Key Rules
  - PARAMETER PERTURBATION > ARCHITECTURAL JUMPS
  - Use 30 probes to explore 10-15+ parameter configurations
  - If iteration 10-15 without improvement: reset to seed with different pattern
  - Always analyze step structure to guide perturbations
tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK to create step-function variants. ONLY modify:
    1. Step boundaries: change start/end indices by ±2-10% of their current value
    2. Heights: change by ±0.05 to ±0.15, keeping f(x) >= 0
    3. Number of intervals: can add/remove up to 50 intervals, keep structure
    
    RULES:
    - Use jax.numpy array mutation: f = f.at[start:end].set(value)
    - Maintain the class structure exactly (don't remove/change imports or methods)
    - Keep all 12+ step patterns or variations of them
    - Use softplus or max(0,·) if creating new functions
    - If adding/removing intervals, maintain the at[] mutation pattern
    
    DO NOT:
    - Change imports or class names
    - Remove any helper methods
    - Introduce syntax errors
    - Try to implement Gaussian/B-spline/etc. from scratch
  evaluate_solution: |
    Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking.
    Evaluate top 1-2 variants by probe score. If probe < 1.0, skip full eval.
    Report combined_score and whether it beats 0.8962799441554086.
  probe_solution: |
    Approximate score on 10% subsample. FAST. Use to rank 5-10+ variants before
    full eval. You have 30 probes - spend them to explore parameter space,
    not to confirm one candidate. Call on ALL generated variants before any
    full evaluation.
  finish: |
    Report best combined_score, the winning parameter configuration (boundary shifts,
    height adjustments), and key insights from exploration.
sampling:
  temperature: 0.3
  top_p: 0.95
  top_k: 15
  max_tokens: 12000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools:
- name: analyze_step_structure
  description: |
    Parse the current best step-function program to extract step boundaries,
    heights, and structure. Returns a structured description to guide
    perturbation. Call this BEFORE generate_step_variants.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        # Get the current best program
        program = ctx.get_best_program()
        
        # Extract key parameters (simplified heuristic parsing)
        structure = {
            "num_intervals": 600,
            "base_heights": None,
            "boundaries": None,
            "pattern_type": "unknown"
        }
        
        # Look for pattern indicators in the code
        if "pattern_idx == 0" in program:
            structure["pattern_type"] = "single_step"
        elif "pattern_idx == 1" in program:
            structure["pattern_type"] = "higher_peak"
        elif "pattern_idx == 3" in program:
            structure["pattern_type"] = "multi_level_centered"
        
        # Extract heights from the code
        import re
        height_matches = re.findall(r'\.set\(([\d.]+)\)', program)
        structure["extracted_heights"] = [float(h) for h in height_matches]
        
        # Calculate statistics
        if structure["extracted_heights"]:
            structure["min_height"] = min(structure["extracted_heights"])
            structure["max_height"] = max(structure["extracted_heights"])
            structure["avg_height"] = sum(structure["extracted_heights"]) / len(structure["extracted_heights"])
        
        return {
            "structure": structure,
            "note": "Use this to guide boundary and height perturbations"
        }

- name: generate_step_variants
  description: |
    Generate 3-5 step-function variants with controlled parameter changes:
    - Boundary shifts (±2-5% of current position)
    - Height adjustments (±0.05 to ±0.15)
    - Asymmetric variations
    - Interval count adjustments (±10%)
    Return ready-to-edit code snippets. Call after analyze_step_structure.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import random
        random.seed(42)
        variants = []
        
        # Get current best to understand structure
        program = ctx.get_best_program()
        
        # Variant 1: Shift boundaries up by 2%
        variants.append({
            "name": "boundary_shift_up",
            "description": "Shift all step boundaries up by 2% of their position",
            "modification": "boundaries_shifted_up_2pct",
            "rationale": "Test if wider/fatter steps improve C2"
        })
        
        # Variant 2: Shift boundaries down by 2%
        variants.append({
            "name": "boundary_shift_down",
            "description": "Shift all step boundaries down by 2% of their position",
            "modification": "boundaries_shifted_down_2pct",
            "rationale": "Test if narrower/tighter steps improve C2"
        })
        
        # Variant 3: Height perturbation
        variants.append({
            "name": "height_perturb",
            "description": "Increase heights by +0.1, decrease by -0.1 alternately",
            "modification": "alt_heights_perturbed",
            "rationale": "Test if different height ratios improve C2"
        })
        
        # Variant 4: Asymmetric variation
        variants.append({
            "name": "asymmetric_variant",
            "description": "Create asymmetric version with reversed structure",
            "modification": "asymmetric_reversed",
            "rationale": "Test if asymmetry helps C2"
        })
        
        # Variant 5: More intervals (if feasible)
        variants.append({
            "name": "more_intervals",
            "description": "Increase intervals by 10% for finer resolution",
            "modification": "intervals_increased_10pct",
            "rationale": "Test if finer resolution captures optimal shape"
        })
        
        return {"variants": variants, "note": "Use probe_solution to rank before full eval"}
new_skills:
- name: parameter-space-expert
  description: |
    Expert in systematic parameter space exploration within step-functions.
    Focus on boundary shifts, height adjustments, and structural variations.
  body: |
    # Parameter Space Expert for Step-Function C2 Optimization

    ## Core Strategy
    Instead of architectural jumps (which break code), systematically explore
    the parameter space of step functions:
    1. Boundary perturbations: ±2-5% of current positions
    2. Height adjustments: ±0.05 to ±0.15
    3. Asymmetry variations: mirror and invert structures
    4. Resolution changes: ±10% intervals

    ## When to Apply
    - Always at start of Phase 1
    - After each failed evaluation
    - When probe scores plateau

    ## Parameter Sensitivity
    - Boundaries: ±2% affects convolution support, ±5% affects peak placement
    - Heights: +0.1 increases L2 norm, -0.1 may reduce ||f*f||_inf
    - Asymmetry: Can break symmetry to improve norm ratios
    - Intervals: Finer resolution may capture optimal features

    ## Failure Recovery
    If stuck for 5 iterations:
    1. Reset to seed with different pattern_idx
    2. Try reverse parameter changes
    3. Call analyze_step_structure on new base
    4. Generate fresh variants

    ## Key Insight
    Small, systematic parameter changes within step functions are MORE LIKELY
    to succeed than generating new function families (which requires perfect code generation).
    Use all 30 probes to explore parameter space thoroughly.
new_middlewares:
- name: enforce_parameter_perturbation
  hook: before_tool
  description: |
    Middleware that enforces parameter-space exploration within step functions.
    Prevents architectural jumps that break code.
  implementation_py: |
    def before_tool(hook_input):
        iteration = hook_input.get("iteration", 0)
        tool_name = hook_input.get("tool_name", "")
        
        # Prevent architectural jumps
        if tool_name == "edit_solution":
            if "Gaussian" in hook_input.get("context", "") or "B-spline" in hook_input.get("context", ""):
                return "Warning: Don't try Gaussian/B-spline! Use parameter perturbations within step functions only."
        
        # Encourage analysis before generation
        if tool_name == "generate_step_variants":
            return "Reminder: Call analyze_step_structure first to understand current parameters!"
        
        return None
