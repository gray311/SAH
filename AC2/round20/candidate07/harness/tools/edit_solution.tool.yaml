type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to create step-function variants. ONLY modify:

  1. Step boundaries: change start/end indices by ±2-10% of their current value

  2. Heights: change by ±0.05 to ±0.15, keeping f(x) >= 0

  3. Number of intervals: can add/remove up to 50 intervals, keep structure


  RULES:

  - Use jax.numpy array mutation: f = f.at[start:end].set(value)

  - Maintain the class structure exactly (don''t remove/change imports or methods)

  - Keep all 12+ step patterns or variations of them

  - Use softplus or max(0,·) if creating new functions

  - If adding/removing intervals, maintain the at[] mutation pattern


  DO NOT:

  - Change imports or class names

  - Remove any helper methods

  - Introduce syntax errors

  - Try to implement Gaussian/B-spline/etc. from scratch'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
