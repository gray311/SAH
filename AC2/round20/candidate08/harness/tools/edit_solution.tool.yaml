type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK step function pattern.

  For height change: change the .set(1.50) to .set(1.60)

  For width change: change start/end indices (e.g., int(0.25*n) to int(0.23*n))

  For asymmetry: change interval boundaries asymmetrically.

  Always ensure f >= 0. Use JAX array mutation: f = f.at[start:end].set(value).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
