type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by creating structural mutations: (1) change number of intervals,
  (2) merge/split intervals, (3) reassign height values to pieces. Example: for a 11-interval function,
  try 9 or 13 intervals. To merge: combine two adjacent intervals into one with average height. To split:
  divide an interval into two with heights from a predefined set (1.0, 1.5, 2.0, 2.5). Ensure f >= 0 everywhere.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
