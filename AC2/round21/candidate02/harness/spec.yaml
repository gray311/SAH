schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis for C2 maximization.

  Current best: 0.8962799441554086 (step functions by AlphaEvolve).

  CRITICAL INSIGHT: The seed defines 12 hardcoded step patterns using fraction-based intervals.
  Your harness must EXPLORE NEW ARCHITECTURES, not just tweak parameters. Use synthesize_step_function
  (new tool) to generate valid step functions from structured templates - this is your primary tool for discovery.

  STRATEGY - ARCHITECTURE-DRIVEN SEARCH:

  PHASE 1 (iterations 1-12): STRUCTURAL DIVERSITY
  1. Call synthesize_step_function with DIFFERENT ARCHITECTURES:
     - Templates: "high-narrow-peak", "dual-peaks", "plateau-center", "asymmetric-triple", "step-symmetric"
  2. Call probe_solution on 4-6 architectural variants (use 60% of 30 probes)
  3. Evaluate TOP 1 by probe score

  PHASE 2 (iterations 13-22): GRADIENT + STRUCTURE HOPPING
  1. If stuck, call synthesize_step_function with "gradient-perturbed" template
  2. Try structure hops: split peaks, merge adjacent, add/remove levels
  3. Always probe 3-4 variants before full eval

  PHASE 3 (iterations 23-30): AGGRESSIVE RESTRUCTURING
  1. If no improvement, try completely new architectures: Gaussian-like smooth steps,
     piecewise linear, or multi-modal distributions
  2. Keep best c2 but restructure from scratch

  RULES:
  - NEVER rely on analyzing_seed_code (it won't work)
  - ALWAYS use synthesize_step_function with structured templates
  - Use probes to explore 5-8 variants before any full eval

  TOOL USAGE:
  - edit_solution: Modify step function parameters in the EVOLVE-BLOCK
  - evaluate_solution: Full evaluation. Call ONLY after probe_solution ranking.
  - probe_solution: Approximate score on 10% subsample. FAST. You have 30 probes.
  - finish: Report best combined_score with winning architecture description
  - synthesize_step_function: Generate a valid step function array from a structured template.
    Call with template name and optional parameters. Returns complete step function array.
skill_description: Architecture-driven step function optimization. Use synthesize_step_function to explore new function architectures beyond the seed's 12 patterns. Leverage probe budget to screen structural variants before full eval.
skill_body: |
  # Architecture-Driven C2 Optimization

  ## Core Principle

  The seed has 12 hardcoded step patterns defined by fraction-based intervals. The harness parser
  cannot extract these formulas. You must use synthesize_step_function to systematically explore
  NEW ARCHITECTURES: different numbers of peaks, asymmetric patterns, varying widths, etc.

  ## Phase 1: Structural Diversity (iterations 1-12)

  ### Step 1: Template Synthesis
  Call synthesize_step_function with these templates (choose 4-6):

  Template A: "high-narrow-peak"
  - Single tall narrow peak at center
  - Width: 20% of domain, height: 2.0

  Template B: "dual-peaks-symmetric"
  - Two equal peaks separated by valley
  - Each peak: 25% width, height: 1.8
  - Valley: 30% of domain

  Template C: "plateau-center"
  - Flat plateau in center with lower shoulders
  - Plateau: 40% width, height: 1.5
  - Shoulders: 30% each side, height: 0.8

  Template D: "asymmetric-triple"
  - Three peaks with different heights and widths
  - Left: 20% width, height: 1.3
  - Center: 30% width, height: 2.2
  - Right: 25% width, height: 1.6

  Template E: "step-symmetric"
  - Multi-level symmetric steps
  - 4 levels: 0.6, 1.0, 1.4, 1.8 (outer to inner)
  - Each level: 20% of domain

  Template F: "gradient-perturbed"
  - Take a base pattern and perturb intervals by ±0.05
  - Perturb heights by ±0.15

  ### Step 2: Probe & Evaluate
  - Call probe_solution on ALL 4-6 variants (6 probes)
  - Rank by probe score
  - Call evaluate_solution on TOP 1 only

  ## Phase 2: Gradient + Structure Hopping (iterations 13-22)

  ### Step 1: Structure Hopping
  If stuck, try these structure hops:
  - Split the tallest peak into two
  - Merge adjacent peaks into one wider peak
  - Add a new peak in the lowest valley
  - Remove the smallest peak entirely

  ### Step 2: Template Variation
  Call synthesize_step_function with modified templates:
  - Change peak heights: multiply by 0.8, 1.0, 1.2
  - Change peak widths: multiply by 0.7, 0.9, 1.1
  - Change peak positions: shift by ±10% of domain

  ### Step 3: Probe & Evaluate
  - Probe 3-4 variants
  - Evaluate best

  ## Phase 3: Aggressive Restructuring (iterations 23-30)

  ### Step 1: New Architectures
  Try completely new function families:
  - Gaussian-like smooth steps (using softplus transformations)
  - Piecewise linear functions
  - Multi-modal distributions (3-5 peaks)

  ### Step 2: Final Push
  - Keep best c2 but restructure from scratch
  - Probe 2, evaluate best
  - Submit if c2 > 0.8962799441554086

  ## Key Rules
  - NEVER call analyze_step_parameters (it doesn't work on this code)
  - ALWAYS use synthesize_step_function with structured templates
  - Use probes aggressively: 5-8 probes before any full eval
  - If iteration 12+ with no improvement: try "structure-hop" templates
tool_descriptions:
  edit_solution: |
    Edit step function parameters: adjust interval start/end fractions (e.g., change int(0.25*n) to int(0.28*n)), modify heights, or shift peak positions. Use JAX array mutation: f = f.at[start:end].set(value). For new architectures: use synthesize_step_function instead.
  evaluate_solution: |
    Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking. Evaluate top 1 variant (if probe >= 1.0) or skip. Phase 3: evaluate both reinitialized candidates.
  probe_solution: |
    Approximate score on 10% subsample. FAST. You have 30 probes - spend them to explore 6-8 architectural variants before full eval. Use probes to screen templates, not just parameter tweaks.
  finish: |
    Report best combined_score, the winning architecture (template name, peak heights, widths, positions), and key insights from structural exploration.
sampling:
  temperature: 1.1
  top_p: 0.98
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
  - name: synthesize_step_function
    description: |
      Generate a valid step function array from a structured template. Use this to systematically
      explore new function architectures beyond the seed's 12 patterns. Templates include:
      "high-narrow-peak" (single tall narrow peak), "dual-peaks-symmetric" (two equal peaks),
      "plateau-center" (flat center plateau), "asymmetric-triple" (three varied peaks),
      "step-symmetric" (multi-level symmetric steps), "gradient-perturbed" (perturbed intervals).
      Optional parameters: height_scale (0.8-1.2), width_scale (0.7-1.1), position_offset (-0.15 to 0.15).
      Always probe 4-6 synthesized variants before full evaluation.
    input_schema:
      type: object
      properties:
        template:
          type: string
          description: Template name (e.g., "high-narrow-peak", "dual-peaks-symmetric")
        height_scale:
          type: number
          description: Scale heights by this factor (default 1.0)
        width_scale:
          type: number
          description: Scale interval widths by this factor (default 1.0)
        position_offset:
          type: number
          description: Shift peak positions by this fraction of domain (default 0.0)
    implementation_py: |
      def run(ctx, args):
          import math
          template = args.get("template", "high-narrow-peak")
          height_scale = args.get("height_scale", 1.0)
          width_scale = args.get("width_scale", 1.0)
          position_offset = args.get("position_offset", 0.0)
          
          # Default to 600 intervals if not available
          if not hasattr(ctx, '_num_intervals'):
              ctx._num_intervals = 600
          n = ctx._num_intervals
          f = ctx.stage_edit(f"jnp.zeros({n})")
          
          # Parse template and generate step function
          if template == "high-narrow-peak":
              start_frac = 0.25 + position_offset * 0.5
              end_frac = 0.75 - position_offset * 0.5
              start = int(n * start_frac)
              end = int(n * end_frac)
              height = 2.0 * height_scale
              f = f.at[start:end].set(height)
          
          elif template == "dual-peaks-symmetric":
              left_start = int(n * 0.15)
              left_end = int(n * 0.40)
              right_start = int(n * 0.60)
              right_end = int(n * 0.85)
              height = 1.8 * height_scale
              f = f.at[left_start:left_end].set(height)
              f = f.at[right_start:right_end].set(height)
          
          elif template == "plateau-center":
              shoulder_start = int(n * 0.1)
              shoulder_end = int(n * 0.9)
              plateau_start = int(n * 0.25)
              plateau_end = int(n * 0.75)
              shoulder_height = 0.8 * height_scale
              plateau_height = 1.5 * height_scale
              f = f.at[shoulder_start:shoulder_end].set(shoulder_height)
              f = f.at[plateau_start:plateau_end].set(plateau_height)
          
          elif template == "asymmetric-triple":
              left_start = int(n * 0.05)
              left_end = int(n * 0.25)
              center_start = int(n * 0.25)
              center_end = int(n * 0.55)
              right_start = int(n * 0.55)
              right_end = int(n * 0.80)
              left_height = 1.3 * height_scale
              center_height = 2.2 * height_scale
              right_height = 1.6 * height_scale
              f = f.at[left_start:left_end].set(left_height)
              f = f.at[center_start:center_end].set(center_height)
              f = f.at[right_start:right_end].set(right_height)
          
          elif template == "step-symmetric":
              levels = [0.6, 1.0, 1.4, 1.8]
              start_fractions = [0.0 + position_offset, 0.2, 0.4 + position_offset, 0.6, 0.8]
              end_fractions = [0.2 + position_offset, 0.4, 0.6 + position_offset, 0.8, 1.0 - position_offset]
              for i, (start_frac, end_frac) in enumerate(zip(start_fractions, end_fractions)):
                  start = int(n * start_frac)
                  end = int(n * end_frac)
                  f = f.at[start:end].set(levels[i] * height_scale)
          
          elif template == "gradient-perturbed":
              # Perturb intervals by ±0.05 and heights by ±0.15
              perturbation = 0.05 * (1 - abs(position_offset) / 0.3)
              start_p = int(n * (0.15 + perturbation))
              left_end_p = int(n * (0.40 - perturbation))
              right_start_p = int(n * (0.60 - perturbation))
              right_end_p = int(n * (0.85 + perturbation))
              height_p = 1.8 * height_scale * (1 + 0.15 * math.sin(position_offset * 10))
              f = f.at[start_p:left_end_p].set(height_p)
              f = f.at[right_start_p:right_end_p].set(height_p)
          
          else:
              # Default: high-narrow-peak
              start = int(n * 0.25)
              end = int(n * 0.75)
              height = 2.0 * height_scale
              f = f.at[start:end].set(height)
          
          return {"function": str(f), "template": template, "n_intervals": n}
new_skills:
  - name: architecture-exploration-protocol
    description: Systematic exploration of step function architectures using synthesize_step_function templates. Avoid parsing weak points.
