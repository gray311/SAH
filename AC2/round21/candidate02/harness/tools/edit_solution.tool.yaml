type: tool
name: edit_solution
description: 'Edit step function parameters: adjust interval start/end fractions (e.g., change int(0.25*n)
  to int(0.28*n)), modify heights, or shift peak positions. Use JAX array mutation: f = f.at[start:end].set(value).
  For new architectures: use synthesize_step_function instead.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
