type: tool
name: synthesize_step_function
description: 'Generate a valid step function array from a structured template. Use this to systematically

  explore new function architectures beyond the seed''s 12 patterns. Templates include:

  "high-narrow-peak" (single tall narrow peak), "dual-peaks-symmetric" (two equal peaks),

  "plateau-center" (flat center plateau), "asymmetric-triple" (three varied peaks),

  "step-symmetric" (multi-level symmetric steps), "gradient-perturbed" (perturbed intervals).

  Optional parameters: height_scale (0.8-1.2), width_scale (0.7-1.1), position_offset (-0.15 to 0.15).

  Always probe 4-6 synthesized variants before full evaluation.'
input_schema:
  type: object
  properties:
    template:
      type: string
      description: Template name (e.g., "high-narrow-peak", "dual-peaks-symmetric")
    height_scale:
      type: number
      description: Scale heights by this factor (default 1.0)
    width_scale:
      type: number
      description: Scale interval widths by this factor (default 1.0)
    position_offset:
      type: number
      description: Shift peak positions by this fraction of domain (default 0.0)
