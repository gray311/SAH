type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by modifying the C2Optimizer''s parameters:

  (1) Adjust f_values array using JAX mutation: f = f.at[start:end].set(value)

  (2) Modify optimizer hyperparameters: num_intervals, learning_rate, num_steps

  (3) For gradient steps: new_f = best_f + learning_rate * gradient

  (4) For hybrid generation: combine patterns by mixing intervals and heights

  Ensure f >= 0 using jax.nn.relu or exponential transformations.

  WORK DIRECTLY WITH JAX ARRAYS - do not parse code strings.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
