type: tool
name: generate_hybrid_functions
description: 'Generate novel hybrid step functions by combining seed patterns in new ways.

  Creates 5-6 variants with varied pattern mixes, heights (1.2-2.5), interval widths,

  and gap sizes. Uses JAX array operations on ctx.get_best_program() output.

  Call ONCE per iteration to explore function-space beyond the seed''s 12 patterns.

  Returns function arrays as lists that the executor can convert to JAX arrays.'
