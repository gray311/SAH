type: tool
name: probe_solution
description: 'Approximate score on 10% subsampled data. FAST (~10s vs minutes for full eval).

  Separate budget of 30 probes.

  Phase 1: probe 5-6 hybrid variants aggressively.

  Phase 2: probe 3 gradient variants.

  Phase 3: probe 2 discretization variants.

  Use probe scores to rank before spending full evaluations.'
