type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by implementing a function from a specific family:

  - Step functions: Use jnp.at[] mutation on intervals

  - Gaussian mixtures: f(x) = sum(w_i * exp(-((x - mu_i)/sigma_i)^2)) with optimized params

  - B-splines: Use scipy.interpolate.Basis with optimized knot positions and coefficients

  - Hybrid: Combine step base with Gaussian tails at boundaries

  Always ensure f >= 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
