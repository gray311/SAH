type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by changing interval count, peak heights, or pattern combinations.
  For interval changes: adjust num_intervals parameter. For pattern changes: modify start/end indices
  in _create_step_initializer. For hybrid functions: multiply step output by Gaussian envelope (use JAX:
  f * jnp.exp(-x^2/100)).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
