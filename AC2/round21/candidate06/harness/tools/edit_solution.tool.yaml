type: tool
name: edit_solution
description: 'Edit EVOLVE-BLOCK to construct NEW function family. Options: Gaussian mixture f(x) = sum
  w_i exp(-(x-c_i)^2/2s_i^2), piecewise linear between knots. Ensure f(x) >= 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
