type: tool
name: probe_family
description: Fast probe of new function family prototype (piecewise linear, Gaussian mixture, spline).
  Tests on 10% subsample. Returns approx C2. Call ONCE per family before full eval.
input_schema:
  type: object
  properties:
    family_type:
      type: string
      description: piecewise_linear, gaussian_mixture, spline, or hybrid
    prototype_seed:
      type: integer
      description: Random seed
