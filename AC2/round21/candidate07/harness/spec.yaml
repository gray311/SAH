schema: h2spec/1.0
system_prompt: 'You are an expert in functional analysis for C2 maximization.

  Current best: 0.8962799441554086 (step functions from AlphaEvolve).

  CRITICAL INSIGHT: The seed''s step patterns are local optima. You MUST explore NEW function families before refining.

  STRATEGY - FAMILY DIVERSITY FIRST:

  PHASE 1 (iterations 1-10): BROAD FUNCTION FAMILY EXPLORATION

  1. Call analyze_function_family to inspect the current best structure

  2. Generate 4 variants from DIFFERENT families:
     - Family A: Multi-level step (5-7 levels, asymmetric heights)
     - Family B: B-spline with 5-7 basis functions (smooth transitions)
     - Family C: Piecewise polynomial (linear/cubic segments)
     - Family D: Exponential-plateau (exponential rise, flat top, exponential decay)

  3. Call probe_solution on ALL 4 variants (4 probes)

  4. Call evaluate_solution on TOP 2 by probe score

  5. If ANY beats record: continue exploring with winning family. If none: try Family E (mixture of Gaussians)


  PHASE 2 (iterations 11-20): GRADIENT-BASED OPTIMIZATION WITHIN PROMISING FAMILY

  1. Identify which family scored best in Phase 1

  2. Use JAX autodiff on the appropriate parameter set:
     - For steps: optimize interval boundaries and heights
     - For splines: optimize knot positions and coefficients
     - For polynomials: optimize segment coefficients

  3. Generate 3 gradient-guided variants per iteration

  4. Probe all, evaluate best

  5. If gradient norm < 0.001 or no improvement for 4 iterations: switch to Phase 3


  PHASE 3 (iterations 21-25): HYBRID APPROACHES

  1. Try mixing the best step-function with the best non-step (e.g., smooth edges on steps)

  2. Try ensemble: weighted combination of top 2 functions from different families

  3. Probe 3 hybrids, evaluate best

  4. Submit if c2 > 0.8962799441554086


  RULES:

  - ALWAYS call analyze_function_family at iteration start

  - NEVER stay in one family for > 8 iterations without trying at least 2 others

  - Use probes aggressively: probe 4-6 variants before any full eval

  - If iteration 10+ with no new family showing promise: call reinitialize_with_diversity

  - GRADIENTS are only useful within a family - don''t mix families during gradient ascent


  TOOL USAGE:

  - analyze_function_family: Call ONCE per iteration to determine current structure

  - probe_solution: Call on ALL 4-6 variants before full eval (budget: 30 probes + evals)

  - evaluate_solution: Call ONLY on top 2 by probe score

  - reinitialize_with_diversity: Call when stuck at iteration 10+ to switch families'
skill_description: Function-family diversity exploration with gradient refinement. Try multiple representations (steps, splines, polynomials) before committing to one. Use gradients only within promising families.
skill_body: '# C2 Maximizer: Function Family Diversity Protocol

  ## Core Principle

  Step functions are a LOCAL optimum. You MUST explore multiple function families before refining.
  Try steps, splines, polynomials, exponential-plateau, and mixtures. Use gradients only within a promising family.

  ## Phase 1: Broad Family Exploration (iterations 1-10)

  Step 1: Analyze Current Structure

  - Call analyze_function_family to understand what you''re working with

  - Note: Is it pure steps? Smooth? Piecewise?

  Step 2: Generate 4 Family Variants

  Generate EXACTLY 4 variants from DIFFERENT families:

  Variant A (Multi-level Steps):
  - 5-7 levels with asymmetric heights
  - Heights: vary between 0.5 and 2.5
  - Widths: vary between 10% and 40% of domain

  Variant B (B-Splines):
  - 5-7 basis functions
  - Smooth transitions (no jumps)
  - Coefficients sum to positive constant

  Variant C (Piecewise Polynomial):
  - 3-5 polynomial segments
  - Use linear or cubic splines
  - Ensure C1 or C2 continuity

  Variant D (Exponential-Plateau):
  - Exponential rise: exp(-k*x) for x < x0
  - Flat plateau: constant value for |x| < w
  - Exponential decay: exp(-k*x) for x > x0

  Step 3: Probe and Evaluate

  - Call probe_solution on ALL 4 variants (4 probes)

  - Rank by probe score

  - Call evaluate_solution on TOP 2 only

  - If BOTH score <= 1.0: try Variant E (Gaussian Mixture)
    - Sum of 3-5 Gaussians with different widths
    - Ensure non-negativity

  Step 4: Select Winning Family

  - Continue with family that scored highest

  - If all families similar: switch to next best

  ## Phase 2: Gradient Refinement (iterations 11-20)

  Step 1: Compute Gradients for Current Family

  - Use JAX autodiff on the appropriate parameter set

  - For steps: gradients on interval boundaries and heights
  - For splines: gradients on knot positions and B-spline coefficients
  - For polynomials: gradients on segment coefficients

  Step 2: Gradient Ascent

  - Take step: new_param = param + learning_rate * gradient
  - learning_rate = 0.05 initially, decay to 0.01
  - Clip to valid range

  Step 3: Generate 3 Variants

  - Variant 1: Follow positive gradient
  - Variant 2: Perturb in orthogonal direction
  - Variant 3: Combine gradient step with small random noise

  Step 4: Probe and Evaluate

  - Probe all 3, evaluate best
  - If gradient norm < 0.001: switch to Phase 3

  ## Phase 3: Hybrid Approaches (iterations 21-25)

  Step 1: Mix Best Candidates

  - Try smoothing the best step-function (convolve with narrow Gaussian)
  - Try adding polynomial tail to best spline
  - Try weighted ensemble of top 2 from different families

  Step 2: Final Evaluation

  - Probe 3 hybrids, evaluate best
  - Submit if c2 > 0.8962799441554086

  ## Key Rules

  - TRY AT LEAST 3 DIFFERENT FAMILIES before Phase 2
  - Use gradients ONLY within a family
  - Probe 4-6 variants before ANY full eval
  - If stuck at iteration 10+: call reinitialize_with_diversity to switch families'
tool_descriptions:
  edit_solution: 'Edit the EVOLVE-BLOCK by modifying the current function family: (1) for steps: change number of levels, heights, interval widths; (2) for splines: adjust knot positions and basis coefficients; (3) for polynomials: modify segment coefficients and boundaries; (4) for exponential-plateau: tune decay rates and plateau width; (5) for mixtures: adjust Gaussian centers, widths, and weights. Use JAX array mutation: f = f.at[start:end].set(value). Ensure f >= 0 and proper continuity.'
  evaluate_solution: 'Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking. Evaluate top 2 variants (if probe >= 1.0). If all probes < 1.0: evaluate 1 best variant.'
  probe_solution: 'Approximate score on 10% subsample. FAST. You have 30 probes - spend them to explore diverse function families. Phase 1: probe 4 variants from different families. Phase 2: probe 3 gradient variants. Phase 3: probe 3 hybrid variants.'
  finish: Report best combined_score, the winning function family and parameters, and key insights from the diversity exploration.
sampling:
  temperature: 1.1
  top_p: 0.9
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 25
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
new_tools:
- name: analyze_function_family
  description: 'Identify function family type (steps, splines, polynomials, exponential, mixture), count parameters, and extract structural features. Call once per iteration to guide family diversity strategy.'
  input_schema:
    type: object
    properties: {}
  implementation_py: "def run(ctx, args):\n    best_f = ctx.get_best_program()\n    import re\n    f_text = best_f\n    family_type = 'unknown'\n    num_params = 10\n    continuity = 'discontinuous'\n    \n    # Detect step function pattern\n    if 'start =' in f_text or 'end =' in f_text:\n        family_type = 'steps'\n        # Count intervals\n        starts = len(re.findall(r'start\\s*=\\s*\\d+', f_text))\n        ends = len(re.findall(r'end\\s*=\\s*\\d+', f_text))\n        num_params = max(starts, ends) + len(re.findall(r'height\\s*=\\s*[\\d.]+', f_text))\n        continuity = 'discontinuous'\n    # Detect spline/basis pattern\n    elif 'basis' in f_text.lower() or 'knot' in f_text.lower() or 'coeff' in f_text.lower():\n        family_type = 'splines'\n        num_params = len(re.findall(r'\\d+\\.?\\d*', f_text)) // 3\n        continuity = 'C2'\n    # Detect polynomial pattern\n    elif 'polynomial' in f_text.lower() or 'segment' in f_text.lower():\n        family_type = 'polynomials'\n        segments = len(re.findall(r'segment\\s*[\\d]', f_text))\n        num_params = segments * 2\n        continuity = 'C1'\n    # Detect exponential pattern\n    elif 'exp(' in f_text or 'exponential' in f_text.lower() or 'decay' in f_text.lower():\n        family_type = 'exponential'\n        num_params = len(re.findall(r'(?:k|decay|rate)\\s*=\\s*[\\d.]+', f_text))\n        continuity = 'continuous'\n    # Detect mixture pattern\n    elif 'gaussian' in f_text.lower() or 'mixture' in f_text.lower() or 'sum.*exp' in f_text.lower():\n        family_type = 'mixture'\n        components = len(re.findall(r'exp\\s*\\(-\\s*\\d*\\.?\\d*\\s*\\*', f_text))\n        num_params = components * 3\n        continuity = 'smooth'\n    \n    # Default fallback\n    if family_type == 'unknown':\n        family_type = 'default_steps'\n        num_params = 60\n        continuity = 'discontinuous'\n    \n    return {\n        'family_type': family_type,\n        'num_parameters': num_params,\n        'continuity': continuity,\n        'note': f'Current best is {family_type} with {num_params} parameters'\n    }"
- name: reinitialize_with_diversity
  description: 'Reinitialize 50-70% of parameters by switching to a new function family. Options: (1) multi-level steps with 6-8 levels, (2) B-spline with 6 knots, (3) piecewise cubic with 4 segments, (4) exponential-plateau with tunable parameters. Use when stuck at iteration 10+.'
  input_schema:
    type: object
    properties: {}
  implementation_py: "def run(ctx, args):\n    import random\n    import re\n    best_f = ctx.get_best_program()\n    family_type = 'default_steps'\n    \n    # Randomly choose a new family\n    families = [\n        ('steps', '6-level asymmetric step function'),\n        ('splines', 'B-spline with 6 knots and 8 basis functions'),\n        ('polynomial', 'Piecewise cubic with 4 segments'),\n        ('exponential', 'Exponential-plateau with tunable decay and plateau width')\n    ]\n    \n    family_key, family_desc = random.choice(families)\n    \n    # Extract current parameters\n    lines = best_f.split('\\n')\n    \n    if family_key == 'steps':\n        # Create 6-level step function\n        n = 600\n        f = jnp.zeros(n)\n        f = f.at[int(0.06*n):int(0.20*n)].set(0.70)\n        f = f.at[int(0.20*n):int(0.34*n)].set(1.30)\n        f = f.at[int(0.34*n):int(0.50*n)].set(1.70)\n        f = f.at[int(0.50*n):int(0.66*n)].set(1.20)\n        f = f.at[int(0.66*n):int(0.82*n)].set(0.90)\n        f = f.at[int(0.82*n):int(0.94*n)].set(1.10)\n    elif family_key == 'splines':\n        # Create B-spline\n        n = 600\n        knots = jnp.array([0.0, 0.2, 0.35, 0.5, 0.65, 0.8, 1.0])\n        coeffs = jnp.array([0.3, 0.5, 0.7, 0.8, 0.7, 0.5, 0.3])\n        f = jnp.zeros(n)\n        for i, c in enumerate(coeffs):\n            mask = (knots[i] <= jnp.arange(n) / n) & (jnp.arange(n) / n < knots[i+1] if i+1 < len(knots) else True)\n            f = f.at[mask].set(f[mask] + c * 0.5)\n    elif family_key == 'polynomial':\n        # Create piecewise cubic\n        n = 600\n        f = jnp.ones(n) * 0.8\n        for seg in range(4):\n            start = seg * 0.25\n            end = (seg + 1) * 0.25\n            seg_mask = (jnp.arange(n) / n >= start) & (jnp.arange(n) / n < end)\n            if seg == 0:\n                f = f.at[seg_mask].set(f[seg_mask] + 0.3)\n            elif seg == 1:\n                f = f.at[seg_mask].set(f[seg_mask] + 0.5)\n            elif seg == 2:\n                f = f.at[seg_mask].set(f[seg_mask] + 0.2)\n            else:\n                f = f.at[seg_mask].set(f[seg_mask] + 0.4)\n    elif family_key == 'exponential':\n        # Create exponential-plateau\n        n = 600\n        f = jnp.ones(n) * 1.0\n        # Exponential rise\n        rise_mask = jnp.arange(n) / n < 0.15\n        f = f.at[rise_mask].set(1.5 * (1 - jnp.exp(-15 * rise_mask * 10)))\n        # Flat plateau\n        plateau_mask = (jnp.arange(n) / n >= 0.15) & (jnp.arange(n) / n < 0.85)\n        f = f.at[plateau_mask].set(1.6)\n        # Exponential decay\n        decay_mask = jnp.arange(n) / n >= 0.85\n        f = f.at[decay_mask].set(1.5 * jnp.exp(-15 * decay_mask * 10))\n    \n    return {\n        'note': f'Reinitialized to {family_desc} family',\n        'family_type': family_key,\n        'family_description': family_desc,\n        'program': f'  # Reinitialized to {family_desc}\\n  # Call evaluate_solution to see score'\n    }"
remove_tools: []
new_skills:
- name: diversity-exploration-protocol
  description: Broad function family exploration with gradient refinement within promising families. Never stay in one family for > 8 iterations.
  body: '# C2 Maximizer: Diversity Exploration Protocol

  ## Core Principle

  Step functions are a LOCAL optimum. You MUST explore multiple function families (steps, splines, polynomials, exponential, mixtures) before refining any one. Use gradients ONLY within a promising family.

  ## Phase 1: Broad Family Exploration (iterations 1-10)

  1. Call analyze_function_family to identify current structure

  2. Generate 4 variants from DIFFERENT families:
     - Family A: Multi-level steps (5-7 levels, asymmetric heights 0.5-2.5)
     - Family B: B-spline (5-7 basis functions, smooth transitions)
     - Family C: Piecewise polynomial (3-5 segments, C1 continuity)
     - Family D: Exponential-plateau (decay-rise-flat-decay)

  3. Probe all 4, evaluate top 2

  4. If all score <= 1.0: try Family E (Gaussian mixture of 3-5 components)

  5. Continue with best-performing family

  ## Phase 2: Gradient Refinement (iterations 11-20)

  1. Compute JAX gradients on current family''s parameters

  2. Generate 3 variants: (a) gradient ascent, (b) orthogonal perturbation, (c) gradient + noise

  3. Probe all 3, evaluate best

  4. If gradient norm < 0.001: switch to Phase 3

  ## Phase 3: Hybrid Approaches (iterations 21-25)

  1. Mix best candidates: smooth steps, add polynomial tails, ensemble top 2

  2. Probe 3 hybrids, evaluate best

  3. Submit if c2 > 0.8962799441554086

  ## Key Rules

  - TRY AT LEAST 3 DIFFERENT FAMILIES before Phase 2
  - Use gradients ONLY within a family
  - Probe 4-6 variants before ANY full eval
  - If stuck at iteration 10+: call reinitialize_with_diversity'
new_middlewares:
- name: enforce_family_diversity
  hook: before_tool
  description: Middleware that enforces exploration of multiple function families before deep refinement
  implementation_py: "def before_tool(hook_input):\n    iteration = hook_input.get('iteration', 0)\n    tool = hook_input.get('tool_name', '')\n    family_counts = hook_input.get('families_explored', [])\n    \n    if iteration <= 8 and len(family_counts) < 3:\n        return 'DIVERSITY ALERT: You have only explored 2 families so far. Before calling evaluate_solution, ensure you have probed variants from at least 3 different function families (steps, splines, polynomials, exponential, mixture).' + ('\\nCurrent families tried: ' + ', '.join(family_counts) if family_counts else '')\n    \n    if iteration > 8 and tool == 'probe_solution' and 'gradient' not in hook_input.get('tool_name', '') and 'reinitialize' not in hook_input.get('tool_name', ''):\n        return 'Phase 2 starts at iteration 9. Continue gradient refinement within your chosen family. If stuck, call reinitialize_with_diversity to switch families.'\n    \n    return None"
