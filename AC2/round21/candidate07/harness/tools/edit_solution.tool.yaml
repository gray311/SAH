type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by modifying the current function family: (1) for steps: change number
  of levels, heights, interval widths; (2) for splines: adjust knot positions and basis coefficients;
  (3) for polynomials: modify segment coefficients and boundaries; (4) for exponential-plateau: tune decay
  rates and plateau width; (5) for mixtures: adjust Gaussian centers, widths, and weights. Use JAX array
  mutation: f = f.at[start:end].set(value). Ensure f >= 0 and proper continuity.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
