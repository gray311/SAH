type: tool
name: edit_solution
description: 'Edit step function parameters or structure. For pattern_idx-based edits: call probe_new_pattern
  with a new pattern_idx value first. For structural edits: (1) split a peak into two by adding midpoint
  value, (2) merge peaks by averaging heights, (3) adjust support ratio by expanding/contracting interval
  boundaries, (4) add asymmetric wings by extending support with small values. Use JAX array mutation:
  f = f.at[start:end].set(value). Ensure f >= 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
