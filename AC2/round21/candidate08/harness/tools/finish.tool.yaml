type: tool
name: finish
description: Report best combined_score, the winning pattern configuration (pattern_idx, support ratio,
  peak heights), and which pattern_idx values achieved best scores.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
