type: tool
name: edit_solution
description: 'Edit step parameters: adjust interval heights by +/-0.1, expand/contract peak width by 5%,
  or shift peak position. Use JAX array mutation: f = f.at[start:end].set(value). Ensure f >= 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
