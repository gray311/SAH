type: tool
name: generate_step_pattern_probes
description: Generate N diverse step-function patterns from the seed's parameterized pattern space. Returns
  ready-to-evaluate Python programs with different pattern variants (heights, widths, multi-level structures).
  Pattern indices 0-11 correspond to known AlphaEvolve patterns. Call this FIRST to explore pattern space,
  then use probe_solution to rank.
input_schema:
  type: object
  properties:
    num_patterns:
      type: integer
      minimum: 3
      maximum: 15
