schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis for C2 maximization.

  Current best: 0.8962799441554086 (step functions).

  CRITICAL INSIGHT: The seed''s 600-interval step functions are over-parameterized. Tiny mutations in large arrays are noisy and ineffective.

  STRATEGY - STRUCTURAL SEARCH WITH ADAPTIVE RESOLUTION:

  PHASE 1 (iterations 1-10): ARCHITECTURE DIVERSIFICATION

  1. Call analyze_function_structure to understand the JAX representation of your best function

  2. Generate variants from DIFFERENT architectural patterns:
     - Pattern A: Reduce intervals (downsample to 200-300) and coarsen the representation
     - Pattern B: Increase intervals (upsample to 1000+) and smooth the signal
     - Pattern C: Try different step-height configurations (more levels, asymmetric)

  3. Call probe_solution on ALL 4-5 variants

  4. Call evaluate_solution on TOP 1 by probe score

  5. If beats record: continue with refined architecture. If not: try next architectural pattern


  PHASE 2 (iterations 11-20): STRUCTURED REFINEMENT

  1. Use analyze_function_structure to identify the dominant frequency components in your function

  2. Generate 3 variants based on spectral insights:
     - Variant 1: Boost high-frequency components (add rapid oscillations)
     - Variant 2: Smooth low-frequency components (increase interval count for smoother signal)
     - Variant 3: Rebalance the function''s mass distribution

  3. Probe all, evaluate best

  4. If no improvement in 5 iterations: switch to Phase 3


  PHASE 3 (iterations 21-30): EXTREME DIVERSIFICATION

  1. Try completely different function representations:
     - 150-interval coarse step function
     - 250-interval with asymmetric distribution
     - Gaussian-like smooth function

  2. Probe 3, evaluate best

  3. Submit if beats record


  TOOL USAGE:

  - analyze_function_structure: Call ONCE per iteration to understand your best function''s JAX representation
  - probe_solution: Call on ALL 4-5 variants before full eval
  - evaluate_solution: Call ONLY on top 1 by probe score
  - finish: Report the architectural insights that led to improvement
skill_description: 'Structural search with adaptive resolution. Start with architecture diversity (interval count, height patterns), then refine based on spectral insights. Avoid over-parameterized 600-interval representations.'
skill_body: '# C2 Maximizer: Structural Search Protocol

## Core Principle

The seed''s 600-interval step functions are over-parameterized. Effective changes are STRUCTURAL (interval count, height distribution), not microscopic. DIVERSIFY architecture first.

## Phase 1: Architecture Diversification (iterations 1-10)

Step 1: Analyze Current Structure
- Call analyze_function_structure to extract: interval count, unique height values, peak positions, symmetry

Step 2: Generate Architectural Variants
Generate EXACTLY 4-5 variants, each with a DIFFERENT structural pattern:

Variant A (Downsample):
- Reduce to 200-250 intervals
- Maintain relative peak positions
- Keep height distribution similar

Variant B (Upsample):
- Increase to 800-1000 intervals
- Smooth the signal by interpolating between current steps
- Test if finer resolution helps

Variant C (Multi-Level):
- Create 4-5 height levels instead of 2-3
- Distribute heights asymmetrically (e.g., 0.8, 1.4, 2.0, 1.0)
- Test if complexity helps

Variant D (Narrow Peak):
- Reduce support to 30% of domain
- Increase peak height to 2.0-2.5
- Test if concentration helps

Variant E (Symmetric Break):
- Break symmetry: left peak height != right peak height
- Test 0.7-0.8 on left, 1.0-1.2 on right

Step 3: Probe and Evaluate
- Call probe_solution on ALL 4-5 variants
- Rank by probe score
- Call evaluate_solution on TOP 1 only
- If probe score < 1.0: skip full eval, try next architectural pattern

## Phase 2: Spectral Refinement (iterations 11-20)

Step 1: Analyze Function Structure
- Call analyze_function_structure again
- Note dominant frequency, smoothness, asymmetry

Step 2: Spectrally-Guided Variants
Generate 3 variants:

Variant 1 (High-Frequency Boost):
- Add rapid oscillations within intervals
- Use JAX to create fine-scale variations

Variant 2 (Low-Frequency Smoothing):
- Increase interval count to 1200+
- Smooth by low-pass filtering

Variant 3 (Mass Redistribution):
- Shift mass from center to edges or vice versa
- Test both directions

Step 3: Probe and Evaluate
- Probe both, evaluate best
- If gradient-like improvement stalls: switch to Phase 3

## Phase 3: Extreme Diversification (iterations 21-30)

Step 1: Try Extreme Architectures
- 150-interval coarse function
- Asymmetric multi-level (3-4 peaks of varying heights)
- Gaussian-like smooth function (continuous approximation)

Step 2: Final Evaluation
- Probe 3, evaluate best
- Submit if c2 > 0.8962799441554086

## Key Rules
- DIVERSIFY architecture: don''t stay in one parameter regime
- Avoid 600-interval if it failed - try 200, 800, or 1200
- Use structural insights, not parameter tweaks
- Probes are cheap: explore 4-5 variants before each full eval'
tool_descriptions:
  edit_solution: 'Edit the EVOLVE-BLOCK with STRUCTURAL changes: (1) change interval count (200-1200), (2) reshape step heights to create multi-level patterns, (3) adjust peak positions by 10-20% of domain, (4) smooth signals by upsampling with interpolation. Use JAX array mutation: f = f.at[start:end].set(value). For structural reshaping: create new interval arrays, then recompute step values.'
  evaluate_solution: 'Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking. Evaluate top 1 variant (if probe >= 1.0) or skip. Phase 3: evaluate best of 3 extreme architectures.'
  probe_solution: 'Approximate score on 10% subsample. FAST. You have 30 probes - spend them to explore 4-5 architectural variants before full eval. Phase 1: probe 4-5 architectural variants. Phase 2: probe 3 spectral variants. Phase 3: probe 3 extreme architectures.'
  finish: 'Report best combined_score, the winning architectural configuration (interval count, height levels, symmetry), and key insights from structural search.'
sampling:
  temperature: 1.0
  top_p: 0.9
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
- name: analyze_function_structure
  description: |
    Analyze the JAX array representation of the current best function to extract structural properties: interval count, unique height values with their positions, peak positions, symmetry (left vs right), and support width. Returns a summary for guiding architectural mutations. Call this ONCE per iteration.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        best_f = ctx.get_best_program()
        lines = best_f.split('\n')
        
        num_intervals = 600
        heights = []
        intervals = []
        in_block = False
        
        for line in lines:
            if 'f = jnp.zeros' in line or 'f_values' in line:
                import re
                match = re.search(r'jnp\.zeros\s*\(\s*(\d+)\s*\)', line)
                if match:
                    num_intervals = int(match.group(1))
            
            if '.set(' in line or '.at[' in line:
                match = re.search(r'\.set\s*\(\s*([\d.]+)\s*\)', line)
                if match:
                    h = float(match.group(1))
                    heights.append(h)
        
        unique_heights = sorted(list(set([round(h, 2) for h in heights])))
        peak_positions = []
        if len(heights) >= 2:
            max_h = max(heights)
            peaks = [i for i, h in enumerate(heights) if abs(h - max_h) < 0.1]
            if peaks:
                peak_positions.append(len(peaks))
        
        symmetry = "unknown"
        if len(heights) >= 10:
            left_half = heights[:len(heights)//2]
            right_half = heights[len(heights)//2:]
            if len(left_half) == len(right_half):
                left_avg = sum(left_half) / len(left_half)
                right_avg = sum(right_half) / len(right_half)
                if abs(left_avg - right_avg) < 0.1:
                    symmetry = "symmetric"
                else:
                    symmetry = "asymmetric"
        
        return {
            "num_intervals": num_intervals,
            "unique_heights": unique_heights,
            "peak_count": peak_positions[0] if peak_positions else 1,
            "symmetry": symmetry,
            "total_unique_values": len(unique_heights),
            "note": f"Analysis of {num_intervals}-interval function with {len(unique_heights)} unique heights, {symmetry}"
        }
new_skills:
- name: architectural-search-protocol
  description: 'Structural search with adaptive resolution. Diversify function architecture (interval count, height patterns) before refining.'
  body: '# C2 Maximizer: Architectural Search Protocol\n\n## Core Principle\n600-interval step functions are over-parameterized. Effective changes are STRUCTURAL: vary interval count (200-1200), reshape height distributions, change symmetry. DIVERSIFY architecture first.\n\n## Phase 1: Architecture Diversification (iterations 1-10)\n\n1. Call analyze_function_structure to get: interval count, height levels, symmetry\n\n2. Generate 4-5 ARCHITECTURAL variants:\n   - A: Downsample to 200-250 intervals\n   - B: Upsample to 800-1000 intervals with smoothing\n   - C: Multi-level (4-5 heights, asymmetric)\n   - D: Narrow peak (30% support, height 2.0-2.5)\n   - E: Asymmetric (left!=right peak heights)\n\n3. Probe all 4-5, evaluate best\n\n4. If no improvement: try next architectural pattern\n\n## Phase 2: Spectral Refinement (iterations 11-20)\n\n1. Analyze function structure again\n2. Generate 3 spectral variants:\n   - High-frequency boost (fine-scale oscillations)\n   - Low-frequency smoothing (increase intervals, interpolate)\n   - Mass redistribution (center vs edges)\n\n3. Probe, evaluate best\n\n## Phase 3: Extreme Diversification (iterations 21-30)\n\n1. Try: 150-interval coarse, asymmetric multi-peak, Gaussian-like\n2. Probe 3, evaluate best, submit\n\n## Key Rules\n- DIVERSIFY: don''t stay in one architectural regime\n- Avoid 600-interval - try 200, 800, 1200\n- Structural insights > parameter tweaks\n- Probes are cheap: 4-5 probes before each full eval'
new_middlewares:
- name: force_architectural_change
  hook: before_model
  description: 'Remind the solver to diversify architecture when stuck in one parameter regime.'
  implementation_py: |
    def before_model(hook_input):
        iteration = hook_input.get('iteration', 0)
        if iteration > 5:
            return 'Remember: You have been in one architectural regime. Diversify interval count (try 200, 800, or 1200) or height patterns (more levels, asymmetry). Structural diversity > parameter tweaks.'
        return None
