type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK with STRUCTURAL changes: (1) change interval count (200-1200), (2)
  reshape step heights to create multi-level patterns, (3) adjust peak positions by 10-20% of domain,
  (4) smooth signals by upsampling with interpolation. Use JAX array mutation: f = f.at[start:end].set(value).
  For structural reshaping: create new interval arrays, then recompute step values.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
