schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis for C2 maximization.

  Current best: 0.8962799441554086 (step functions).

  BREAKTHROUGH INSIGHT: The seed provides 12 hand-crafted step patterns. The key to beating the record is NOT to refine parameters one-at-a-time, but to EXHAUSTIVELY enumerate structural variants internally, then evaluate only the best few.

  STRATEGY - INTERNAL VARIANT GENERATION:

  PHASE 1 (iterations 1-12): INTERNAL ENUMERATION + PROBE-RANKING

  1. Call enumerate_step_variants to generate 40-50 step-function variants by:
     - Varying heights: {0.90, 1.20, 1.50, 1.80, 2.00} for each interval
     - Shifting boundaries by +/-(5-10%) of domain
     - Mixing patterns: combine left/right halves of different seed patterns
     - Creating asymmetries: split symmetric patterns unevenly

  2. From the generated variants, SELECT TOP 6 by probing (call probe_solution on each)

  3. Evaluate the TOP 2 by probe score

  4. If EITHER beats record: proceed to Phase 2. If not: try more variants in next iteration

  PHASE 2 (iterations 13-20): DIVERSIFIED PARAMETER SEARCH

  1. Call enumerate_step_variants again, but this time focus on:
     - Multi-peak configurations (2-4 peaks instead of single peak)
     - Gaussian-like step functions (taller center, gradually decreasing sides)
     - Asymmetric distributions (left-skewed vs right-skewed)

  2. Probe all generated variants, evaluate top 3

  3. Keep best and explore new variants in parallel

  PHASE 3 (iterations 21-25): AGGRESSIVE STRUCTURAL DIVERSIFICATION

  1. Generate radical variants: 3-5 peaks, wider base with narrow peak, step-Gaussian hybrids

  2. Probe top 4, evaluate best

  3. Submit if c2 > 0.8962799441554086

  RULES:

  - ALWAYS call enumerate_step_variants at start of iteration to get many candidates
  - NEVER edit_solution a single variant and evaluate - that's too slow
  - Use probes to rank 40+ variants before spending evals
  - If stuck at iteration 10+: try radical structural changes (multi-peak, asymmetric)
  - If still stuck at iteration 15+: try gradient refinement on the best variant found

  TOOL USAGE:

  - enumerate_step_variants: Call ONCE per iteration to generate 40-50 internal variants
  - probe_solution: Call on TOP 6-8 variants from enumerate output
  - evaluate_solution: Call on TOP 2 by probe score
  - finish: Submit with winning variant parameters
skill_description: Internal variant enumeration for step-function optimization. Generate 40-50 structural variants, probe-rank them, evaluate only the best few. Focus on multi-peak, asymmetric, and height-diverse configurations.
skill_body: |
  # C2 Maximizer: Internal Variant Enumeration Protocol

  ## Core Principle

  The seed provides 12 step patterns as a STARTING POINT. The harness must generate MANY variants internally (40-50) by varying heights, boundaries, and peak configurations. Only the top few (by probe) should receive full evaluation. This maximizes the chance of discovering a high-scoring variant.

  ## Phase 1: Broad Enumeration (iterations 1-12)

  ### Step 1: Generate Variants

  Call enumerate_step_variants with these strategies:

  **Height Variation:**
  - For each of the 12 seed patterns, try heights: 0.80, 1.00, 1.20, 1.40, 1.60, 1.80, 2.00
  - This gives 12 x 7 = 84 height variations

  **Boundary Shifting:**
  - For each pattern, shift all interval boundaries by -10%, 0%, +10% of domain
  - This gives 84 x 3 = 252 boundary-shifted variants

  **Hybrid Patterns:**
  - Take left 50% of pattern 0 and right 50% of pattern 11
  - Take left 30% of pattern 3 and right 70% of pattern 9
  - Create 10 hybrid patterns x 3 height options = 30 hybrids

  **Total: ~282 variants. Select TOP 40 for probing.**

  ### Step 2: Probe-Rank and Evaluate

  - Call probe_solution on each of the 40 variants
  - Rank by probe score
  - Call evaluate_solution on TOP 2
  - If EITHER beats current best: proceed to Phase 2. If not: continue enumeration in next iteration.

  ## Phase 2: Divergent Search (iterations 13-20)

  ### New Variant Types

  **Multi-Peak Configurations:**
  - Split single-peak patterns into 2, 3, or 4 peaks
  - Pattern 0 (single peak) -> split into 2 peaks: heights 1.2, 1.4
  - Pattern 11 (already multi-peak) -> try 3 and 4 peaks

  **Asymmetric Distributions:**
  - Left-skewed: tall on left, short on right
  - Right-skewed: short on left, tall on right
  - Try 3 variations of each

  **Gaussian-Like Steps:**
  - Peak at center (50%), taper to sides: 2.0, 1.5, 1.0, 0.8, 0.6
  - Peak at 40%: 1.8, 2.2, 1.5, 1.0, 0.7

  Generate ~50 new variants, probe all, evaluate top 3.

  ## Phase 3: Radical Divergence (iterations 21-25)

  ### Extreme Variations

  **5-Peak Configurations:**
  - Distribute 5 peaks across the domain with varied heights
  - Pattern: 1.0, 1.8, 1.4, 2.0, 1.2

  **Wide Base, Narrow Peak:**
  - Broad base height 1.0 with narrow central peak 2.5
  - Narrow base with broad shoulder

  **Step-Gaussian Hybrid:**
  - Step-like on one side, Gaussian decay on other

  Generate 30 radical variants, probe top 6, evaluate best. Submit if improvement.

  ## Key Rules

  - GENERATE 40+ VARIANTS internally per iteration
  - PROBE all 40+ to rank before evaluating
  - EVALUATE only TOP 2-3 by probe score
  - VARY HEIGHTS across a wide range 0.80-2.00
  - EXPLORE MULTI-PEAK configurations aggressively
  - USE SYMMETRY-BREAKING: left-skewed vs right-skewed distributions
tool_descriptions:
  edit_solution: 'Edit a single variant step parameters: adjust interval boundaries by +/-(5%) of domain, modify heights by +/-(0.1-0.2), or change peak width. Use JAX array mutation: f = f.at[start:end].set(value). Ensure f >= 0.'
  evaluate_solution: 'Full evaluation. Budget: 30 total. Call ONLY on top 2 variants after probe ranking.'
  probe_solution: 'Approximate score on 10% subsample. FAST. You have 30 probes. Call this on 6-8 variants from enumerate_step_variants output to rank them before full evaluation.'
  finish: 'Report best combined_score, winning variant structure (peak heights, interval counts, asymmetry), and the enumeration strategy that discovered it.'
new_tools:
- name: enumerate_step_variants
  description: 'Generate 40-50 step-function variants internally. Vary heights across 0.80-2.00, shift boundaries +/-(10%), create hybrid patterns from multiple seeds, and generate multi-peak configs. Return variant parameters as a list. Call this ONCE per iteration to get many candidates for probing.'
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        best_f = ctx.get_best_program()
        variants = []
        heights = [0.80, 1.00, 1.20, 1.40, 1.60, 1.80, 2.00]
        pattern_configs = [{"peak_fraction": 0.25, "width_fraction": 0.5, "heights": h} for h in heights]
        for i, cfg in enumerate(pattern_configs[:15]):
            variants.append({"type": "single_peak", "peak_fraction": cfg["peak_fraction"], "width_fraction": cfg["width_fraction"], "heights": cfg["heights"], "num_intervals": 600})
        multi_peak_configs = [{"peaks": [(0.15, 1.20), (0.45, 2.00), (0.80, 1.30)], "num_intervals": 600}, {"peaks": [(0.10, 1.00), (0.35, 2.50), (0.50, 2.50), (0.65, 1.00), (0.90, 1.00)], "num_intervals": 600}, {"peaks": [(0.20, 0.90), (0.40, 2.80), (0.60, 0.90)], "num_intervals": 600}, {"peaks": [(0.15, 1.10), (0.30, 2.30), (0.49, 1.40), (0.70, 1.40), (0.85, 1.10)], "num_intervals": 600}]
        for i, cfg in enumerate(multi_peak_configs):
            height_multipliers = [0.9, 1.0, 1.1, 1.2]
            for hm in height_multipliers:
                new_peaks = [(h * hm, p) for h, p in cfg["peaks"]]
                variants.append({"type": "multi_peak", "peaks": new_peaks, "num_intervals": cfg["num_intervals"]})
        asym_configs = [{"left_height": 1.0, "right_height": 1.8, "split": 0.4, "num_intervals": 600}, {"left_height": 1.2, "right_height": 2.2, "split": 0.35, "num_intervals": 600}, {"left_height": 1.5, "right_height": 2.5, "split": 0.3, "num_intervals": 600}, {"left_height": 1.8, "right_height": 3.0, "split": 0.25, "num_intervals": 600}, {"left_height": 2.0, "right_height": 2.8, "split": 0.4, "num_intervals": 600}]
        for cfg in asym_configs:
            variants.append({"type": "asymmetric", "left_height": cfg["left_height"], "right_height": cfg["right_height"], "split": cfg["split"], "direction": "left_skewed", "num_intervals": cfg["num_intervals"]})
            variants.append({"type": "asymmetric", "left_height": cfg["right_height"], "right_height": cfg["left_height"], "split": cfg["split"], "direction": "right_skewed", "num_intervals": cfg["num_intervals"]})
        gaussian_configs = [{"peak_height": 2.0, "base_height": 0.8, "peak_width": 0.4}, {"peak_height": 1.8, "base_height": 0.6, "peak_width": 0.5}, {"peak_height": 2.2, "base_height": 0.7, "peak_width": 0.35}, {"peak_height": 2.5, "base_height": 0.5, "peak_width": 0.3}, {"peak_height": 1.6, "base_height": 0.9, "peak_width": 0.55}]
        for cfg in gaussian_configs:
            variants.append({"type": "gaussian_like", "peak_height": cfg["peak_height"], "base_height": cfg["base_height"], "peak_width": cfg["peak_width"], "num_intervals": 600})
        wide_base_configs = [{"base_height": 1.0, "peak_height": 2.5, "peak_width": 0.2}, {"base_height": 0.8, "peak_height": 2.8, "peak_width": 0.15}, {"base_height": 1.2, "peak_height": 2.3, "peak_width": 0.25}, {"base_height": 0.9, "peak_height": 3.0, "peak_width": 0.1}, {"base_height": 1.1, "peak_height": 2.6, "peak_width": 0.18}]
        for cfg in wide_base_configs:
            variants.append({"type": "wide_base", "base_height": cfg["base_height"], "peak_height": cfg["peak_height"], "peak_width": cfg["peak_width"], "num_intervals": 600})
        return {"variants": variants[:45], "note": "Generated 45 diverse step-function variants for internal enumeration"}
