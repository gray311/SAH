type: tool
name: edit_solution
description: 'Edit a single variant step parameters: adjust interval boundaries by +/-(5%) of domain,
  modify heights by +/-(0.1-0.2), or change peak width. Use JAX array mutation: f = f.at[start:end].set(value).
  Ensure f >= 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
