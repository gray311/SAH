type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to implement a DIFFERENT function architecture or radical parameter
  changes:

  - Step to Gaussian mixture: replace step intervals with Gaussian components

  - Step to spline: replace constant intervals with B-spline basis functions

  - Multi-level step: use f.at[start:end].set(value) for multiple segments with different heights

  - Gaussian mixture: sum of Gaussian functions with optimized centers, widths, weights

  - For ANY edit: ensure f >= 0 (use jax.nn.relu, softplus, or exp transformations)

  - For multi-level steps: create multiple interval assignments with varying heights'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
