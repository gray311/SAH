type: tool
name: edit_solution
description: 'Generate diverse step functions: change (1) num_intervals (400,600,800), (2) peak shape
  (single/trapezoid/Gaussian-like/two-peak), (3) multi-peak config. Use jax.numpy array mutation. Ensure
  f >= 0, sum(f) > 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
