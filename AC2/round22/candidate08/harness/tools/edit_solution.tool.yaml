type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by modifying step parameters systematically. Options: (1) increase
  peak height by 5%, (2) widen peak by shifting start/end indices inward by 2%, (3) narrow peak by shifting
  inward by 3% and boost height by 0.15, (4) create asymmetric 2-peak configuration. Use JAX array mutation:
  f = f.at[start:end].set(value). For pattern-level changes: switch to a different pattern index from
  the seed (patterns 0-11).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
