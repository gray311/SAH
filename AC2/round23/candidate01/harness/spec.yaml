schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis for C2 maximization.

  Current best: 0.8962799441554086 (step functions).

  CRITICAL INSIGHT: The seed's step patterns use ratio-based structures. You MUST analyze interval-to-height ratios before mutating.

  STRATEGY - RATIO-AWARE REFINEMENT:

  PHASE 1 (iterations 1-12): RATIO-STRUCTURE EXPLORATION

  1. Call analyze_ratio_structure ONCE per iteration to extract interval widths and height ratios

  2. Generate 3 variants with guided mutations based on ratio analysis:
     (a) narrow intervals with tall heights by 10%, (b) widen valleys by 15%, (c) create new peaks in wide valleys

  3. Call probe_solution on ALL 3 variants

  4. Call evaluate_solution on TOP 1 by probe score

  5. If beats record: continue Phase 1. If no improvement after 3 iterations: switch to Phase 2.

  PHASE 2 (iterations 13-22): GRADIENT-BASED STRUCTURAL OPTIMIZATION

  1. Use JAX autodiff to compute gradients of C2 w.r.t. interval parameters

  2. Generate 2 variants following gradient ascent

  3. Probe all, evaluate best

  4. If gradient norm < 0.001 or no improvement in 5 iterations: reinitialize 50% of parameters with ratio-guided reinit

  5. Continue until iteration 22 or evaluation budget exhausted

  PHASE 3 (iterations 23-30): AGGRESSIVE ARCHITECTURE SEARCH

  1. If stuck, keep best c2 but try new architectural patterns:
     - Split one tall peak into two medium peaks
     - Merge adjacent valleys
     - Try asymmetric three-peak configuration

  2. Call probe_solution on 2 variants

  3. Evaluate best

  4. Submit if beats record

  RULES:

  - ALWAYS call analyze_ratio_structure before any mutation - it extracts actual interval/height values

  - Use probes to explore 5-6 variants before any full eval

  - If iteration 12+ with no improvement: switch to Phase 2

  - JAX autodiff enables gradient ascent; use it before reinitializing

  TOOL USAGE:

  - analyze_ratio_structure: Call ONCE per iteration - extracts interval widths, height ratios, and suggests mutations

  - probe_solution: Call on ALL 3-5 variants before full eval (budget: 30 probes + evals)

  - evaluate_solution: Call ONLY on top 1-2 by probe score

  - reinitialize_parameters: Call when stuck (iteration 12+)
skill_description: Ratio-aware refinement for step-function optimization. Extract interval/height ratios, analyze structure, generate targeted mutations. Use analyze_ratio_structure to understand current best before mutating.
skill_body: '# C2 Maximizer: Ratio-Aware Refinement Protocol

  ## Core Principle

  Step function performance depends on ratio properties: interval width ratios and height-to-width ratios. Analyze these ratios before mutating - theoretical optimality suggests certain ratio patterns.

  ## Phase 1: Ratio-Structure Exploration (iterations 1-12)

  Step 1: Analyze Ratio Structure

  - Call analyze_ratio_structure ONCE per iteration

  - This tool extracts: interval widths, height values, width ratios, height ratios

  Step 2: Generate Ratio-Guided Mutations

  Generate EXACTLY 3 variants:

  Mutation A (Narrow Tall Peaks):

  - Find the narrowest interval with height > 1.3

  - Narrow it by 10% and increase height by 0.1

  - Rationale: Narrow tall peaks concentrate convolution mass

  Mutation B (Widen Valleys):

  - Find a valley (low-height interval between peaks)

  - Widen it by 15% and decrease height by 0.1

  - Rationale: Wider valleys smooth the convolution, improving L2 norm

  Mutation C (Add Peak in Wide Valley):

  - Find the widest valley

  - Create a new peak in the center with height = valley_height + 0.5

  - Rationale: Multi-peak configurations beat single-peak step functions

  Step 3: Probe and Evaluate

  - Call probe_solution on ALL 3 variants (3 probes total)

  - Rank by probe score

  - Call evaluate_solution on TOP 1 only

  Step 4: Iterate

  - If beats record: continue with refined parameters

  - If no improvement after 3 iterations: switch to Phase 2

  ## Phase 2: JAX Gradient-Based Optimization (iterations 13-22)

  Step 1: Compute Gradients

  - Use JAX autodiff: @jax.grad on the -c2_ratio objective

  - Compute gradient w.r.t. each parameter

  Step 2: Gradient-Ascent Step

  - Take gradient step: new_param = param + 0.05 * gradient

  - Clip parameters to valid range

  Step 3: Variants from Gradients

  Generate 2 variants:

  - Variant 1: Follow positive gradient direction

  - Variant 2: Follow negative gradient direction

  Step 4: Probe and Evaluate

  - Probe both, evaluate best

  - If gradient norm < 0.001: switch to Phase 3

  ## Phase 3: Architecture Search (iterations 23-30)

  Step 1: Try New Architectures

  If stuck, keep best c2 but try architectural changes:

  - Split Peak: Take one tall peak, split into two peaks with 0.7 * original height each

  - Merge Valleys: Merge two adjacent valley intervals into one

  - Three-Peak Asymmetric: Create three peaks with heights 1.2, 1.8, 1.0

  Step 2: Final Evaluation

  - Probe both variants

  - Evaluate best

  - Submit if c2 > 0.8962799441554086

  ## Key Rules

  - ALWAYS call analyze_ratio_structure before mutation

  - Use probes to filter: 5-6 probes before any full eval

  - If iteration 12+ with no improvement: switch to Phase 2'
tool_descriptions:
  edit_solution: 'Edit the EVOLVE-BLOCK by modifying step parameters based on ratio analysis. To narrow interval: use f = f.at[start:end-5%].set(height+0.1). To widen valley: f = f.at[valley_start:valley_end+15%].set(height-0.1). Ensure f >= 0.'
  evaluate_solution: 'Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking. Evaluate top 1 variant (if probe >= 1.0) or skip.'
  probe_solution: 'Approximate score on 10% subsample. FAST. You have 30 probes - spend them to explore 5-6 targeted mutations before full eval.'
  finish: 'Report best combined_score, the winning parameter configuration (interval boundaries, heights), and key insights from ratio analysis and gradient optimization.'
sampling:
  temperature: 0.9
  top_p: 0.9
  top_k: 25
  max_tokens: 16384
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
- name: analyze_ratio_structure
  description: 'Extract structural ratio features from current best step function: interval widths, height values, and key ratios (width/width, height/height, peak/valley). Parse f = f.at[start:end].set(height) patterns. Returns num_intervals, interval_widths (normalized to [0,1]), heights, peak_info (peak indices and widths), and ratio_features. Call ONCE per iteration to guide ratio-aware mutations.'
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import re
        best_f = ctx.get_best_program()
        lines = best_f.split('\n')
        
        interval_pattern = r'f\s*=\s*f\.at\(\s*int\(\s*([\d.]+)\s*\*\s*n\):\s*int\(\s*([\d.]+)\s*\*\s*n\)\s*\)\.set\(\s*([\d.]+)\s*\)'
        
        interval_widths = []
        heights = []
        peak_indices = []
        
        for line in lines:
            match = re.search(interval_pattern, line)
            if match:
                start_frac = float(match.group(1))
                end_frac = float(match.group(2))
                height = float(match.group(3))
                
                width = end_frac - start_frac
                interval_widths.append(width)
                heights.append(height)
                
                if height > 1.3:
                    peak_indices.append((start_frac + end_frac) / 2)
        
        n_intervals = len(interval_widths)
        if n_intervals == 0:
            return {
                "error": "Could not parse step function intervals",
                "num_intervals": 60,
                "interval_widths": [1.0/n_intervals]*n_intervals,
                "heights": [1.0]*n_intervals,
                "peak_indices": [],
                "peak_info": {},
                "ratio_features": {}
            }
        
        total_width = sum(interval_widths)
        interval_widths = [w / total_width for w in interval_widths]
        
        if peak_indices:
            peak_widths = []
            for i, (start, end) in enumerate(zip(peak_indices[:-1], peak_indices[1:])):
                peak_widths.append(end - start)
        else:
            peak_widths = interval_widths
        
        avg_width_ratio = 1.0
        if len(interval_widths) > 1:
            widths_sorted = sorted(interval_widths)
            avg_width_ratio = sum(widths_sorted[i]/widths_sorted[i+1] for i in range(len(widths_sorted)-1)) / max(len(widths_sorted)-1, 1)
        
        height_contrast = 0.0
        if heights:
            max_h = max(heights)
            min_h = min(heights)
            height_contrast = (max_h - min_h) / max_h if max_h > 0 else 0.0
        
        valley_ratio = 0.0
        if peak_indices and interval_widths:
            avg_peak_width = sum(peak_widths) / len(peak_widths) if peak_widths else 1.0
            avg_valley_width = sum([w for i, w in enumerate(interval_widths) if not (i in peak_indices)] if peak_indices else []) / max(len(interval_widths)-len(peak_indices), 1)
            valley_ratio = avg_valley_width / avg_peak_width if avg_peak_width > 0 else 0.0
        
        max_height = max(heights) if heights else 0.0
        
        return {
            "num_intervals": n_intervals,
            "interval_widths": interval_widths,
            "heights": heights,
            "peak_indices": peak_indices,
            "peak_info": {
                "num_peaks": len(peak_indices),
                "avg_peak_width": sum(peak_widths) / len(peak_widths) if peak_widths else 1.0,
                "tallest_height": max_height
            },
            "ratio_features": {
                "avg_width_ratio": avg_width_ratio,
                "height_contrast": height_contrast,
                "valley_ratio": valley_ratio,
                "num_intervals": n_intervals
            }
        }
new_skills:
- name: ratio-structure-refinement
  description: Step-function refinement using ratio-aware mutations. Analyze interval/height ratios with analyze_ratio_structure, then mutate based on theoretical optimality conditions.
  body: '# Ratio-Aware Refinement Protocol for Step Functions

  ## Core Principle

  Step function performance depends on ratio properties: interval width ratios and height-to-width ratios. Theoretical analysis suggests narrow tall peaks and smooth valleys optimize the convolution. Analyze ratios FIRST, then mutate.

  ## Phase 1: Ratio-Guided Mutations (iterations 1-12)

  1. Call analyze_ratio_structure to get interval_widths, heights, and ratio_features

  2. Generate 3 ratio-guided mutations:

     Mutation A (Narrow Tall Peaks):
     - Find interval with width < 0.12 and height > 1.3
     - Narrow by 10%: new_end = old_start + 0.9*(old_end - old_start)
     - Increase height by 0.1

     Mutation B (Widen Valleys):
     - Find valley interval (height < 1.0)
     - Widen by 15%: new_end = old_end + 0.15*(domain_width)
     - Decrease height by 0.1

     Mutation C (Add Peak in Valley):
     - Find widest valley (height < 1.0, width > 0.12)
     - Add new peak at center with height = valley_height + 0.5

  3. Probe all 3, evaluate best

  4. If no improvement after 3 iterations: switch to Phase 2

  ## Phase 2: JAX Gradient Optimization (iterations 13-22)

  1. Use @jax.grad on -c2_ratio to get gradients

  2. Take step: new_param = param + 0.05 * gradient

  3. Clip to valid range

  4. Probe 2 variants (ascent and descent), evaluate best

  5. If gradient norm < 0.001: switch to Phase 3

  ## Phase 3: Architecture Search (iterations 23-30)

  1. Keep best c2, try architectural changes:
     - Split one tall peak into two with height = 0.7*original
     - Merge two adjacent valleys
     - Try asymmetric three-peak: heights 1.2, 1.8, 1.0

  2. Probe both variants, evaluate best

  3. Submit if c2 > 0.8962799441554086

  ## Key Rule

  ALWAYS call analyze_ratio_structure BEFORE mutation. The tool understands the actual structure, not just estimated parameters.'
new_middlewares:
- name: enforce_ratio_first
  hook: before_tool
  description: Middleware that enforces calling analyze_ratio_structure before mutation tools
  implementation_py: |
    def before_tool(hook_input):
        tool = hook_input.get('tool_name', '')
        iteration = hook_input.get('iteration', 0)
        last_ratio_call = hook_input.get('last_ratio_call', -1)
        
        if tool in ['edit_solution', 'probe_solution', 'evaluate_solution'] and iteration < 12:
            if last_ratio_call < iteration - 1:
                return 'Error: You must call analyze_ratio_structure at the start of each iteration before mutating.'
        
        probes_used = hook_input.get('probes_used', 0)
        if probes_used >= 25:
            return 'Critical: Only 5 probes left. Evaluate a promising variant soon.'
        
        return None
