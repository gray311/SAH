type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by modifying step parameters based on ratio analysis. To narrow interval:
  use f = f.at[start:end-5%].set(height+0.1). To widen valley: f = f.at[valley_start:valley_end+15%].set(height-0.1).
  Ensure f >= 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
