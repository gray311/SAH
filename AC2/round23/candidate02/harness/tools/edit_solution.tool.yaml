type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by (1) recombining step patterns: merge adjacent peaks, swap heights,
  or create asymmetric variants; (2) smooth transitions: widen peaks by 10%, create piecewise-linear segments;
  (3) adjust spectral properties: flatten high-frequency oscillations by broadening peaks and reducing
  contrast.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
