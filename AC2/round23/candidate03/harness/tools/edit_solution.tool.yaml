type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by generating a COMPLETE new step-function specification. Specify:
  number of levels (2-6), peak positions (as fractions of domain), heights for each level. Ensure f >=
  0. Generate diverse multi-level, asymmetric, or multi-modal patterns. Use more intervals for high-resolution
  variants.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
