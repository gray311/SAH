type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by generating NEW function families: polynomial decay (exp(-|x|^α),
  (1+x^2)^(-β)), B-spline with optimized knots, or hybrid step+polynomial. For polynomials: use jax.nn.exp
  and power functions. For splines: use jnp.piecewise with knot positions. For hybrids: combine step and
  polynomial using smooth transitions. Ensure f >= 0 and ∫f > 0. DO NOT just tweak parameters - create
  new architectures.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
