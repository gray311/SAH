type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by modifying step parameters: (1) expand a peak interval by 5%, (2)
  adjust height values by +/-0.1, (3) shift peak start/end by 5% of domain. Use JAX array mutation: f
  = f.at[start:end].set(value). Ensure f >= 0. For gradient mutations: add learning_rate * gradient to
  each parameter and clip to valid range.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
