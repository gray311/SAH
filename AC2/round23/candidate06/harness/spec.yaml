schema: h2spec/1.0
system_prompt: |
  You are a world-class expert in functional analysis, harmonic analysis, and numerical optimization for C2 maximization.
  
  Current best: 0.8962799441554086 (step functions). Target: SURPASS THIS.
  
  CRITICAL INSIGHT: Step functions saturate at ~0.89628. To improve, you must EXPLORE NEW FUNCTION CLASSES, not just refine parameters.
  
  STRATEGY - FUNCTION-CLASS ESCAPE:
  
  PHASE 1 (iterations 1-10): HYBRID CONSTRUCTION
  1. Call analyze_structure to inspect the best function's spectral properties
  2. Construct hybrid variants: (a) smooth step edges with sigmoid-like transitions, (b) multi-scale step combinations, (c) truncated polynomial-modulated steps
  3. Probe all 3 variants
  4. Evaluate top 1
  
  PHASE 2 (iterations 11-20): FOURIER-SPACE REFINEMENT
  1. Work in Fourier domain: optimize Fourier coefficients with positivity constraint on inverse
  2. Generate variants by adjusting low-frequency dominance vs high-frequency content
  3. Probe and evaluate best
  
  PHASE 3 (iterations 21-30): AGGRESSIVE ARCHITECTURE SEARCH
  1. If no improvement, completely rearchitect: try spline-like smooth functions, mixture-of-gaussians, or asymmetric multi-peak constructions
  2. Probe 2-3 radical designs, evaluate best
  
  RULES:
  - Call analyze_structure BEFORE each edit phase
  - Use probes to test 4-6 variants before any full eval
  - Never get stuck refining parameters - escape to new function families at iteration 10+ if plateaued
  
  TOOL USAGE:
  - analyze_structure: Call ONCE per iteration to extract spectral shape, edge sharpness, multi-scale features (new tool)
  - probe_solution: Call on ALL 3-5 variants (budget: 30 probes total)
  - evaluate_solution: Call ONLY on top 1 by probe (unless Phase 3 where probe 2 then eval best)
skill_description: |
  Function-class escape protocol for C2 maximization. Hybrid construction, Fourier-space refinement, and architectural search. Escape step-function local optimum.
skill_body: |
  # C2 Maximizer: Function-Class Escape Protocol
  
  ## Core Principle
  Step functions saturate at ~0.89628. Escape to HYBRID functions: smooth transitions, multi-scale superposition, or Fourier-optimized designs.
  
  ## Phase 1: Hybrid Construction (iterations 1-10)
  
  Step 1: Analyze Structure
  - Call analyze_structure on best function
  - Extract: peak positions, edge sharpness, scale content
  
  Step 2: Generate Hybrids
  Create EXACTLY 3 variants:
  
  Variant A (Smooth Edges):
  - Replace sharp step edges with sigmoid transitions
  - Use: f = sigmoid(-2.0*(x - edge_pos) / smooth_width)
  - smooth_width = peak_width * 0.1
  
  Variant B (Multi-scale):
  - Superimpose scaled copies of base pattern
  - f = base + 0.3 * scale(base, scale=2.0)
  - Add low-frequency component
  
  Variant C (Polynomial Modulation):
  - Multiply step by smooth decay envelope
  - f = step * (1 - |x-center|/L)^p, p=1.0-2.0
  
  Step 3: Probe and Evaluate
  - Probe all 3 variants
  - Evaluate top 1
  - If no improvement after 3 iterations: switch to Phase 2
  
  ## Phase 2: Fourier-Space Refinement (iterations 11-20)
  
  Step 1: Fourier Analysis
  - Analyze current best in frequency domain
  - Identify dominant frequencies
  
  Step 2: Fourier Optimization
  - Generate variants by: (a) boost low-frequency content, (b) add controlled high-frequency modulation, (c) phase-shift components
  - Ensure inverse FFT stays non-negative
  
  Step 3: Probe and Evaluate
  - Probe 2 Fourier variants
  - Evaluate best
  - If plateaued: switch to Phase 3
  
  ## Phase 3: Architectural Search (iterations 21-30)
  
  Step 1: Radical Re-architecture
  - Try: spline-like smooth functions, mixture-of-components, asymmetric multi-peak
  - Complete reimagining, not parameter tweaks
  
  Step 2: Final Evaluation
  - Probe 2-3 radical designs
  - Evaluate best, submit if c2 > 0.8962799441554086
  
  ## Key Rules
  - Call analyze_structure EVERY iteration
  - NEVER stay in parameter-refinement mode - escape to new function families
  - Use probes aggressively: 4-6 probes before any eval
  - At iteration 10+: if plateaued, switch phases immediately
  - Temperature 1.0 encourages diverse architectural exploration
tool_descriptions:
  edit_solution: 'Edit the EVOLVE-BLOCK by constructing HYBRID functions: (1) smooth step edges using sigmoid-like transitions: f = sigmoid(edge_pos + x/scale), (2) multi-scale superposition: add scaled copies of the base pattern at different resolutions, (3) polynomial modulation: multiply step by (1 - |x|/L)^p for smooth decay. Use JAX: f_edge = jax.nn.sigmoid(-2.0*(x-edge_pos)/smooth_width). For multi-scale: f = base + 0.3*scale(base, scale=2). Ensure f >= 0 everywhere.'
  evaluate_solution: 'Full C2 evaluation. Budget: 30. Call ONLY after probe_solution ranking. Phase 1-2: evaluate top 1. Phase 3: evaluate best of 2 radical designs.'
  probe_solution: 'Approximate C2 on 10% subsample. FAST. You have 30 probes. Phase 1: probe 3 hybrids. Phase 2: probe 2 Fourier variants. Phase 3: probe 3 radical designs. Always probe before full eval.'
  finish: 'Report best combined_score, winning function class (hybrid/Fourier/radical), and key structural changes that beat 0.8962799441554086.'
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 15000
new_tools:
  - name: analyze_structure
    description: |
      Extract structural properties from best function: spectral shape, edge positions, smoothness, multi-scale content. Call once per iteration to guide hybrid construction.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          best_prog = ctx.get_best_program()
          lines = best_prog.split('\n')
          
          struct = {
              'peak_width': 0.0,
              'edge_positions': [],
              'smoothness_estimate': 0.0,
              'dominant_scale': 1.0,
              'num_peaks': 1
          }
          
          import re
          # Extract interval patterns and infer structure
          in_interval = False
          peaks = []
          edges = []
          
          for i, line in enumerate(lines):
              if 'start =' in line or 'int(' in line:
                  if '0.' in line or 'int(' in line:
                      try:
                          match = re.search(r'[0-9.]+', line)
                          if match:
                              pos = float(match.group()) / 100.0
                              edges.append(pos)
                      except:
                          pass
              
              if 'height' in line.lower():
                  try:
                      match = re.search(r'[0-9.]+', line)
                      if match:
                          h = float(match.group())
                          peaks.append(h)
                  except:
                      pass
          
          struct['edge_positions'] = edges[:5] if edges else [0.25, 0.75]
          struct['smoothness_estimate'] = 0.9 if len(edges) < 4 else 0.5
          
          if peaks:
              struct['dominant_scale'] = max(peaks)
              struct['num_peaks'] = len([p for p in peaks if p > struct['dominant_scale'] * 0.9])
          
          if len(edges) >= 2:
              spread = max(edges) - min(edges) if edges else 0.5
              struct['peak_width'] = spread * 0.6 if spread > 0 else 0.3
          
          return struct
new_skills:
  - name: hybrid-construction-protocol
    description: |
      Protocol for constructing hybrid functions: smooth edges, multi-scale superposition, polynomial modulation. Escape step-function local optimum.
    body: |
      # Hybrid Construction Protocol for C2 Maximization
      
      ## Core Idea
      Step functions saturate. Escape by blending smooth transitions with step-like structure.
      
      ## Construction Templates
      
      Template A: Smooth-Edge Steps
      - Replace sharp jumps with sigmoid: f(x) = sigmoid(-2.0*(x - edge) / width)
      - Width = 5-10% of peak region
      - Preserves step-like concentration while adding smoothness
      
      Template B: Multi-Scale Superposition
      - f_total = base_pattern + alpha * scaled(base, scale=2.0) + beta * scaled(base, scale=0.5)
      - alpha, beta ∈ [0.1, 0.4]
      - Combines coarse and fine structure
      
      Template C: Polynomial-Modulated Steps
      - f(x) = step(x) * (1 - |x - center|/L)^p
      - p ∈ [1.0, 2.5] controls decay smoothness
      - Creates natural envelope around step region
      
      ## Execution Flow
      1. Call analyze_structure to get current peak width, edges
      2. Choose template based on structure: smooth if edges sharp, superposition if single peak
      3. Generate 3 variants using different parameter settings
      4. Probe all 3, evaluate best
      
      ## Key Rules
      - Always smooth, never sharper (sharper = worse than step already)
      - Multi-scale beats single-scale
      - Probe before evaluating (30 probe budget total)
new_middlewares:
  - name: enforce_hybrid_escape
    hook: before_model
    description: |
      Middleware that reminds executor to escape step-function paradigm if plateaued. Fires every turn.
    implementation_py: |
      def before_model(hook_input):
          iteration = hook_input.get('iteration', 0)
          improvement_count = hook_input.get('improvement_count', 0)
          
          if iteration >= 10 and improvement_count < 2:
              return 'WARNING: No improvement after 10 iterations. ESCAPE step-function paradigm - try smooth edges, multi-scale superposition, or Fourier optimization.'
          
          if iteration >= 20 and improvement_count < 5:
              return 'CRITICAL: Still plateaued. AGGRESSIVE ARCHITECTURE SEARCH PHASE - completely rearchitect function class.'
          
          return None
