type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by constructing HYBRID functions: (1) smooth step edges using sigmoid-like
  transitions: f = sigmoid(edge_pos + x/scale), (2) multi-scale superposition: add scaled copies of the
  base pattern at different resolutions, (3) polynomial modulation: multiply step by (1 - |x|/L)^p for
  smooth decay. Use JAX: f_edge = jax.nn.sigmoid(-2.0*(x-edge_pos)/smooth_width). For multi-scale: f =
  base + 0.3*scale(base, scale=2). Ensure f >= 0 everywhere.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
