schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis for C2 maximization.

  Current best: 0.8962799441554086 (step functions).

  CRITICAL INSIGHT: The seed's step patterns are PARAMETERIZED but not EXHAUSTIVE. You MUST generate NEW step configurations with varied structures, not just tweak existing ones.

  STRATEGY - STEP-CONFIGURATION GENERATION:

  PHASE 1 (iterations 1-12): BROAD STEP-PATTERN EXPLORATION

  1. Call gen_step_config to create COMPLETE step function configurations with diverse structures:
     - Vary: number of levels (2-6), peak heights (0.5-3.0), peak widths (10-40% of domain), asymmetries
     - Patterns to try: single peak, dual peaks, multi-level steps, asymmetric wide/narrow bases
   
  2. Generate 5-8 variants with different architectures
   
  3. Call probe_solution on ALL variants (5-8 probes)
   
  4. Call evaluate_solution on TOP 1 by probe score

  5. If beats record: continue Phase 1. If no improvement after 5 iterations: switch to Phase 2

  PHASE 2 (iterations 13-22): GRADIENT-LIKE LOCAL SEARCH

  1. Generate 3 variants with small perturbations around best parameters from Phase 1
   
  2. Probe all, evaluate best
   
  3. If gradient appears flat (no improvement for 4 iterations): try opposite perturbations or Phase 3

  PHASE 3 (iterations 23-30): AGGRESSIVE DIVERSIFICATION

  1. Generate completely new configurations:
     - Multi-peak functions with 2-4 distinct peaks
     - Asymmetric functions (wide base, narrow peak OR narrow base, wide peak)
     - Oscillatory patterns (alternating high/low levels)
     - Three-level and four-level functions

  2. Probe 4-5 variants, evaluate best
   
  3. Submit if c2 > 0.8962799441554086

  RULES:
  - ALWAYS generate COMPLETE new configurations (do not try to extract and tweak parameters)
  - Use probes to explore 5-8 variants before ANY full eval
  - If iteration 12+ with no improvement: switch to Phase 2 (local search)
  - Variety is key: explore different numbers of peaks, different height ranges, different asymmetries
skill_description: |
  Step-function configuration generation for C2 maximization. Generate diverse architectures: multi-level steps, asymmetric patterns, multi-peak functions. Use probes to screen before full evaluation.
skill_body: |
  # C2 Maximizer: Step-Configuration Generation Protocol

  ## Core Principle

  Step functions have rich ARCHITECTURAL VARIATIONS beyond small parameter tweaks. Generate COMPLETE new configurations with:
  - Different numbers of levels (2-6)
  - Varied peak heights (0.5-3.0)
  - Different peak positions and widths
  - Asymmetric patterns
  - Multi-peak structures

  ## Phase 1: Broad Architecture Exploration (iterations 1-12)

  Step 1: Generate Diverse Configurations

  Create 5-8 step functions with VARYING structures:
  - Pattern A (Single Peak): Height 1.2-2.5, position center, width 30-40%, base 0.6-1.0
  - Pattern B (Dual Peaks): Two peaks at 0.25 and 0.75, heights 1.5-2.5 each, base 0.7-1.2
  - Pattern C (Multi-Level): 3-4 levels with heights e.g. 0.8, 1.6, 2.0, 1.3
  - Pattern D (Asymmetric): Wide base 60-70% with narrow high peak 15-20%

  Step 2: Probe and Evaluate

  - Call probe_solution on ALL 5-8 variants
  - Rank by probe score
  - Call evaluate_solution on TOP 1 only
  - Continue generating new configs if no improvement

  ## Phase 2: Local Refinement (iterations 13-22)

  Step 1: Perturb Best Configuration

  Take best parameters from Phase 1:
  - Vary peak heights by +/-0.1-0.2
  - Shift peak positions by +/-5%
  - Adjust widths by +/-3%

  Step 2: Generate 3 Perturbations
  - Variant 1: Increase heights, keep positions
  - Variant 2: Decrease heights, widen peaks
  - Variant 3: Asymmetric perturbation

  Step 3: Probe and Evaluate
  - Probe all 3, evaluate best

  ## Phase 3: Aggressive Diversification (iterations 23-30)

  Step 1: Generate Novel Architectures
  - 2-peak with very different heights (e.g. 1.0 and 2.8)
  - 3-peak symmetric pattern
  - Oscillating levels (high-low-high-low)
  - Narrow spike on wide base

  Step 2: Final Evaluation
  - Probe 4-5 variants, evaluate best
  - Submit if c2 > 0.8962799441554086

  ## Key Rule

  GENERATE COMPLETE NEW CONFIGURATIONS every iteration. Do not try to extract parameters from existing code.
tool_descriptions:
  edit_solution: |
    Generate a COMPLETE step function configuration. Define number of intervals (600), interval boundaries as fractions of domain, heights for each interval (0.5-3.0). Use JAX array mutation. Ensure diversity: vary levels, peak heights, positions, asymmetries.
  evaluate_solution: |
    Full evaluation of C2 score. Budget: 30 total. Call ONLY after probe_solution ranking. Evaluate top 1 variant or best probe candidate. In Phase 3, evaluate best of 4-5 probed variants.
  probe_solution: |
    Approximate score on 10% subsample. FAST. You have 30 probes. PHASE 1: probe 5-8 variants (rank architectures). PHASE 2: probe 3 perturbation variants. PHASE 3: probe 4-5 diverse variants. Use probes to filter before any full eval.
  finish: |
    Report best combined_score, winning step function (levels, boundaries as fractions, heights), and insights on what architecture performed best.
sampling:
  temperature: 1.2
  top_p: 0.98
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
- name: gen_step_config
  description: |
    Generate a COMPLETE step function from scratch. Create NEW architecture with 2-6 levels, varied heights (0.5-3.0), varied peak positions, varied widths. Patterns: single/dual/multi-peak, asymmetric, multi-level. Output as complete JAX array.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import random
        random.seed(ctx.budget_left() * 17)
        N = 600
        
        patterns = [
            (lambda: (int(0.25*N), int(0.75*N), 2.0, 0.8)),
            (lambda: (int(0.15*N), int(0.35*N), 1.8), (int(0.65*N), int(0.85*N), 1.8), 0.9),
            (lambda: (int(0.1*N), int(0.3*N), 1.2), (int(0.3*N), int(0.7*N), 2.4), (int(0.7*N), int(0.9*N), 1.2)),
            (lambda: (int(0.05*N), int(0.75*N), 0.8), (int(0.75*N), int(0.9*N), 2.8)),
            (lambda: (int(0.1*N), int(0.25*N), 1.5), (int(0.25*N), int(0.35*N), 2.8), (int(0.35*N), int(0.45*N), 1.5), (int(0.55*N), int(0.65*N), 2.8), (int(0.65*N), int(0.8*N), 1.5))
        ]
        
        f = jnp.zeros(N)
        random_choice = random.choice(patterns)
        
        if len(random_choice) == 4:
            start, end, height, base = random_choice[0]() if callable(random_choice[0]) else random_choice
            f = f.at[start:end].set(height)
            f = f.at[:start] + f.at[end:].set(base)
        elif len(random_choice) == 6:
            s1, e1, h1, s2, e2, h2 = random_choice[0]() if callable(random_choice[0]) else (random_choice[0], random_choice[1], random_choice[2], random_choice[3], random_choice[4], random_choice[5])
            base = 0.7 + random.random() * 0.3
            f = f.at[s1:e1].set(h1)
            f = f.at[s2:e2].set(h2)
            f = f.at[:s1] + f.at[e1:s2] + f.at[e2:].set(base)
        elif len(random_choice) == 9:
            s1, e1, h1, s2, e2, h2, s3, e3, h3 = random_choice[0]() if callable(random_choice[0]) else (random_choice[0], random_choice[1], random_choice[2], random_choice[3], random_choice[4], random_choice[5], random_choice[6], random_choice[7], random_choice[8])
            base = 0.5 + random.random() * 0.4
            f = f.at[s1:e1].set(h1)
            f = f.at[s2:e2].set(h2)
            f = f.at[s3:e3].set(h3)
            f = f.at[:s1] + f.at[e1:s2] + f.at[e2:s3] + f.at[e3:].set(base)
        
        heights = f[f > 0].copy()
        for i in range(len(heights)):
            if heights[i] > 1.0:
                heights[i] = heights[i] + random.gauss(0, 0.15)
            elif heights[i] < 1.0:
                heights[i] = heights[i] + random.gauss(0, 0.15)
            heights[i] = max(0.3, min(3.0, heights[i]))
        
        f = f.at[f > 0].set(heights)
        
        return {'config': f.astype(jnp.float32), 'pattern_type': random.choice(['single', 'dual', 'multi', 'asymmetric', 'multi-peak'])}
new_skills:
- name: step-architecture-explorer
  description: |
    Generate diverse step-function architectures for C2 maximization. Explore multi-level, asymmetric, and multi-peak configurations. Use probes to screen before evaluation.
  body: |
    # Step Architecture Explorer for C2 Maximization

    ## Core Strategy

    Generate COMPLETE NEW step function configurations each iteration. Do NOT tweak existing parameters. Explore architectural diversity:

    ### Pattern Library

    1. Single Peak: Width 30-40%, height 1.5-2.5, base 0.6-1.0
    2. Dual Peaks: Two peaks at 25% and 75%, heights 1.5-2.5 each, base 0.7-1.2
    3. Multi-Level (3-4 levels): Heights e.g. 0.8, 1.6, 2.4, 1.2
    4. Asymmetric: Wide base 60-70% + narrow high peak 15-20%
    5. Multi-Peak: 2-4 distinct peaks with varying heights

    ## Phase Guidelines

    Phase 1 (iterations 1-12): Generate 5-8 diverse architectures, probe all, evaluate best.
    Phase 2 (iterations 13-22): Generate 3 perturbations of best config, probe all, evaluate best.
    Phase 3 (iterations 23-30): Generate 4-5 novel architectures, probe, evaluate best.

    ## Key Principle

    ARCHITECTURAL DIVERSITY > PARAMETER TWEAKING. Each configuration should explore a different structural hypothesis.
new_middlewares:
- name: enforce_probe_diversity
  hook: before_tool
  description: middleware to enforce probing diverse architectures before evaluation
  implementation_py: |
    def before_tool(hook_input):
        tool = hook_input.get('tool_name', '')
        iteration = hook_input.get('iteration', 0)
        probes_used = hook_input.get('probes_used', 0)
        patterns_used = hook_input.get('patterns_used', [])
        
        if tool == 'evaluate_solution' and probes_used < 4:
            return 'Critical: Probe at least 4 diverse architectures before full eval.'
        
        if iteration <= 12 and probes_used >= 3 and len(patterns_used) < 3:
            return 'Reminder: Ensure 3+ different pattern types in probes.'
        
        if iteration >= 15 and probes_used < 2:
            return 'Iteration 15+: Probe aggressively before eval. Use gen_step_config for new patterns.'
        
        return None
