type: tool
name: edit_solution
description: 'Generate a COMPLETE step function configuration. Define number of intervals (600), interval
  boundaries as fractions of domain, heights for each interval (0.5-3.0). Use JAX array mutation. Ensure
  diversity: vary levels, peak heights, positions, asymmetries.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
