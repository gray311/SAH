type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK by changing: (1) num_intervals (try 400, 600, 800, 900), (2) step
  pattern type (1-peak, 2-peak, 3-peak, asymmetric), (3) peak heights and widths. Use JAX array mutation
  syntax: f = f.at[start:end].set(value). For multi-peak: create multiple intervals with different heights.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
