type: tool
name: compare_architectures
description: 'Rapidly score 4-5 function families using probes. Returns probe scores for each family,

  helping identify which architecture is most promising. Call this early (iteration 1)

  and if stuck. Each family uses 1 probe, total probes = number of families.'
input_schema:
  type: object
  properties:
    families:
      type: array
      items:
        type: string
  default:
    families:
    - step
    - smoothed_step
    - gaussian_mixture
    - bspline
    - polynomial
