type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to implement a function from any family:

  - Step functions: use _create_step_initializer with adjusted indices/heights

  - Gaussian mixtures: define f(x) = sum w_i * exp(-(x-mu_i)^2/(2*sigma_i^2))

  - B-splines: use scipy.interpolate.BSpline with optimized knots

  - Smoothed steps: convolve step function with Gaussian kernel (sigma = 0.05-0.2)

  - Polynomial bases: define piecewise polynomial in [a,b], zero elsewhere

  Ensure f(x) >= 0 via softplus or exponential transformation if needed.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
