type: tool
name: generate_smoothed_variant
description: 'Generate a Gaussian-smoothed variant of the current best function. Convolve with

  Gaussian kernel (sigma = 0.05-0.5) to improve numerical stability and explore smooth

  alternatives to hard step functions.'
input_schema:
  type: object
  properties:
    sigma:
      type: number
  default:
    sigma: 0.1
