type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to implement a new function family. For splines: import scipy.interpolate
  and create BSpline with knots. For mixtures: define sum of Gaussians with learned mu/sigma. For learned:
  small MLP with ReLU/tanh. Ensure f(x) >= 0 by using softplus, exp, or squaring. Replace the C2Optimizer
  class entirely with new implementation matching the target family.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
