type: tool
name: explore_function_family
description: Generate a COMPLETE alternative function representation from a new family (spline, mixture,
  learned, hybrid). Returns structured parameters to guide code generation. Call this ONCE per family
  exploration to get concrete knot/weight configurations.
input_schema:
  type: object
  properties:
    family_type:
      type: string
      enum:
      - spline
      - mixture
      - learned
      - hybrid
      default: spline
    num_components:
      type: integer
      default: 5
