type: tool
name: finish
description: Report best combined_score, the winning function family type and key parameters (knots for
  spline, mu/sigma for mixture, architecture for learned), and why this family beat step functions.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
