schema: h2spec/1.0
system_prompt: |
  You are an expert in functional analysis for C2 maximization.

  Current best: 0.8962799441554086 (step functions). Target: SURPASS it.

  FAILURE DIAGNOSIS: Refining existing step parameters has FAILED. The seed patterns are local optima.
  YOU MUST EXPLORE NEW ARCHITECTURES, not just tweak parameters.

  STRATEGY - ARCHITECTURE-LEVEL EXPLORATION:

  PHASE 1 (iterations 1-12): PARALLEL ARCHITECTURE SEEDING
  1. Call explore_architectures to generate diverse candidate families (5-8 variants)
     - Multi-modal patterns (2+ distinct peaks)
     - Asymmetric distributions (left-heavy vs right-heavy)
     - Adaptive-resolution designs (coarse-fine structure)
     - Boundary-optimized variants (mass concentration at edges)
  2. Rank by probe_solution score
  3. Evaluate TOP 2 by probe
  4. If BOTH fail to improve, proceed to Phase 2

  PHASE 2 (iterations 13-24): GRADIENT ESCAPE + REDESIGN
  1. If stuck, call reinitialize_with_architectures (not reinitialize_parameters)
  2. Try: (a) bimodal step function, (b) piecewise-linear instead of step
  3. Use JAX gradients only on variants that already beat seed
  4. Probe all, evaluate best

  PHASE 3 (iterations 25-30): AGGRESSIVE ARCHITECTURE SWAP
  1. Keep best c2 but completely redesign function class
  2. Options: triangular spikes, plateau-step hybrid
  3. Probe 3, evaluate best
  4. Submit if c2 > 0.8962799441554086

  RULES:
  - NEVER stay in one architecture family for >5 iterations
  - ALWAYS call explore_architectures at iteration 1, 8, and 20
  - Use probes aggressively: 5-8 probes before any full eval
  - When stuck (no improvement >5 iterations): SWAP architecture, don't tune

  TOOL USAGE:
  - explore_architectures: Call ONCE every 7 iterations to generate diverse families
  - probe_solution: Call on ALL 5-8 variants before any full eval
  - evaluate_solution: Call ONLY on top 1-2 by probe
skill_description: Architecture-level exploration for C2 maximization. Generate diverse function families (multi-modal, asymmetric, adaptive), test them in parallel, and commit to the best.
skill_body: |
  # C2 Maximizer: Architecture-Level Exploration Protocol

  ## Core Principle
  The current best step pattern is a LOCAL OPTIMUM. Small parameter tweaks won't escape.

  ## Phase 1: Parallel Architecture Seeding (iterations 1-12)

  Step 1: Generate Diverse Architectures
  - Call explore_architectures to create 5-8 structurally distinct candidates
  - Required architectural diversity:
    * Multi-modal: 2+ distinct peaks with different widths
    * Asymmetric: mass concentrated on left or right half of domain
    * Adaptive-resolution: coarse discretization at tails, fine near peaks

  Step 2: Rapid Probe-Based Screening
  - Call probe_solution on ALL 5-8 variants (this is cheap!)
  - Rank by probe score
  - Call evaluate_solution on TOP 2 only

  ## Phase 2: Gradient Escape + Redesign (iterations 13-24)

  Step 1: If Stuck, Redesign
  - Call reinitialize_with_architectures
  - Try: bimodal, piecewise-linear

  Step 2: JAX Gradients Only on Promising Variants
  - @jax.grad only if c2 already beats seed
  - Take 2 steps (ascent + orthogonal descent)

  ## Phase 3: Aggressive Architecture Swap (iterations 25-30)

  Step 1: Complete Redesign
  - Triangular spikes, plateau-step hybrid

  Step 2: Final Selection
  - Probe 3, evaluate best
  - Submit if c2 > 0.8962799441554086

tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK. For step functions: modify interval boundaries, adjust heights.
    For other architectures: triangular peaks (linear rise/fall), bimodal (two separate regions),
    adaptive-resolution (coarse at tails, fine near peaks). Ensure f >= 0.
  evaluate_solution: |
    Full evaluation on best variant. Budget: 30 total. Call after probe ranking.
  probe_solution: |
    Approximate score on 10% subsample. FAST (10s). You have 30 probes.
    Use to screen 5-8 architectural variants before full eval.
  finish: |
    Report best c2, function class, and architectural innovations that beat seed.
sampling:
  temperature: 1.2
  top_p: 0.9
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 35
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 20000
new_tools:
  - name: explore_architectures
    description: |
      Generate 5-8 structurally diverse function architectures to escape local optima.
      Creates: multi-modal (2+ peaks), asymmetric distributions, adaptive-resolution
      designs, boundary-optimized variants, and triangular peaks.
      Returns code snippets for the EVOLVE-BLOCK. Call at iterations 1, 8, 20.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import random
          best_f = ctx.get_best_program()
          lines = best_f.split('\n')
          
          architectures = [
              '# Triangular peak\nimport jax.numpy as jnp\nf = jnp.zeros(600)\nps = int(0.35*600)\npe = int(0.50*600)\nh = 1.85\nf = f.at[ps:ps+10].set(h * jnp.linspace(0, 1, 10))\nf = f.at[ps+10:pe-10].set(h)\nf = f.at[pe-10:pe].set(h * jnp.linspace(1, 0, 10))',
              '# Bimodal steps\nimport jax.numpy as jnp\nf = jnp.zeros(600)\nf = f.at[int(0.15*600):int(0.28*600)].set(1.40)\nf = f.at[int(0.42*600):int(0.55*600)].set(1.70)',
              '# Asymmetric - mass on left\nimport jax.numpy as jnp\nf = jnp.zeros(600)\nf = f.at[int(0.05*600):int(0.18*600)].set(1.20)\nf = f.at[int(0.18*600):int(0.35*600)].set(2.00)\nf = f.at[int(0.35*600):int(0.60*600)].set(0.80)',
              '# Adaptive - coarse tails, fine peaks\nimport jax.numpy as jnp\nf = jnp.zeros(600)\nf = f.at[int(0.00*600):int(0.05*600)].set(0.40)\nf = f.at[int(0.95*600):int(1.00*600)].set(0.40)\npr = int(0.20*600)\nf = f.at[pr:pr+120].set(1.90)',
              '# Plateau with steep edges\nimport jax.numpy as jnp\nf = jnp.zeros(600)\nf = f.at[int(0.20*600):int(0.30*600)].set(1.30)\nf = f.at[int(0.30*600):int(0.70*600)].set(2.50)\nf = f.at[int(0.70*600):int(0.80*600)].set(1.30)\nf = f.at[int(0.80*600):int(0.95*600)].set(0.50)'
          ]
          
          random.seed(42)
          
          return {'architectures': architectures, 'note': 'Diverse architectures generated. Select by probe scores.'}
  - name: reinitialize_with_architectures
    description: |
      Generate 3-5 completely new function architectures (not parameter tweaks):
      bimodal steps, piecewise-linear, triangular peaks, plateau-step hybrids.
      Returns code snippets.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          return {
              'architectures': [
                  '# Piecewise-linear\nimport jax.numpy as jnp\nf = jnp.zeros(600)\nf = f.at[int(0.05*600):int(0.35*600)].set(jnp.linspace(0.5, 2.2, 300))\nf = f.at[int(0.35*600):int(0.65*600)].set(jnp.linspace(2.2, 0.5, 300))',
                  '# Multi-level asymmetric\nimport jax.numpy as jnp\nf = jnp.zeros(600)\nf = f.at[int(0.02*600):int(0.10*600)].set(1.10)\nf = f.at[int(0.10*600):int(0.25*600)].set(2.10)\nf = f.at[int(0.25*600):int(0.45*600)].set(1.80)\nf = f.at[int(0.45*600):int(0.65*600)].set(1.20)\nf = f.at[int(0.65*600):int(0.92*600)].set(0.70)',
                  '# Double triangular with gap\nimport jax.numpy as jnp\nf = jnp.zeros(600)\nf = f.at[int(0.10*600):int(0.20*600)].set(jnp.linspace(0.3, 1.9, 100))\nf = f.at[int(0.20*600):int(0.30*600)].set(jnp.linspace(1.9, 0.3, 100))\nf = f.at[int(0.55*600):int(0.65*600)].set(jnp.linspace(0.3, 1.9, 100))\nf = f.at[int(0.65*600):int(0.75*600)].set(jnp.linspace(1.9, 0.3, 100))'
              ],
              'note': 'Completely new architectures. Use probes to select best.'
          }
new_skills:
  - name: architecture-escape-protocol
    description: Escape local optima by generating and testing diverse function architectures in parallel. Use probes to screen, evaluate top candidates.
    body: |
      # Architecture Escape Protocol

      ## Problem
      Parameter tuning is STUCK. The seed step pattern is a local optimum.

      ## Solution
      Generate diverse architectures, test in parallel with probes, commit to best.

      ## When to Use
      - At iteration 1: Always start with architecture diversity
      - At iteration 8: If no improvement after 7 iterations
      - At iteration 20: Final escape attempt

      ## Procedure
      1. Call explore_architectures or reinitialize_with_architectures
      2. Generate 5-8 diverse candidates
      3. Probe ALL on 10% subsample (cheap!)
      4. Rank by probe score
      5. Evaluate top 1-2
      6. If beats seed: refine that architecture
      7. If fails: try different architecture class

      ## Architecture Classes
      - Multi-modal: 2+ peaks with different widths
      - Asymmetric: mass concentrated on one side
      - Adaptive-resolution: coarse tails, fine peaks
      - Boundary-optimized: mass at domain edges
      - Triangular: linear rise/fall instead of flat tops
      - Piecewise-linear: continuous slopes instead of steps

      ## Success Criteria
      - c2 > 0.8962799441554086
      - combined_score > 1.0
new_middlewares:
  - name: force_architecture_diversity
    hook: before_model
    description: Force architecture exploration when stuck in local optima.
    implementation_py: |
      def before_model(hook_input):
          iteration = hook_input.get('iteration', 0)
          improvement = hook_input.get('improvement_count', 0)
          
          if iteration % 7 == 0 and iteration > 0 and improvement < 1:
              return 'STUCK ALERT: You have been stuck for 7 iterations. CALL explore_architectures or reinitialize_with_architectures to generate new function classes. DO NOT just tune parameters.'
          
          if iteration >= 20 and improvement == 0:
              return 'FINAL ESCAPE: Try completely new architectures (bimodal, piecewise-linear, triangular). Parameter tuning has failed.'
          
          return None
  - name: enforce_probe_first
    hook: before_tool
    description: Enforce probe usage before full evaluation.
    implementation_py: |
      def before_tool(hook_input):
          tool = hook_input.get('tool_name', '')
          probes_left = hook_input.get('probes_left', 30)
          
          if tool == 'evaluate_solution' and probes_left > 5:
              return 'Warning: You still have probes. Use probe_solution to screen 5+ variants before this full eval.'
          
          if tool == 'edit_solution' and probes_left > 10:
              return 'Consider: You have probes left. Edit, then probe before evaluating.'
          
          return None
