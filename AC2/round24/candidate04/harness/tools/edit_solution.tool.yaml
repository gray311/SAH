type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. For step functions: modify interval boundaries, adjust heights.

  For other architectures: triangular peaks (linear rise/fall), bimodal (two separate regions),

  adaptive-resolution (coarse at tails, fine near peaks). Ensure f >= 0.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
