schema: h2spec/1.0
system_prompt: 'You are an expert in functional analysis for C2 maximization.

  Current best: 0.8962799441554086 (step functions by AlphaEvolve).

  CRITICAL INSIGHT: The current harness tried refining step parameters, but got stuck.
  NEW STRATEGY: Don''t tune - redesign. Try fundamentally different step function architectures:
  - Different total interval counts (try 400, 800, 1200)
  - Different symmetry properties (even functions: f(x)=f(-x))
  - Different peak-to-base ratios and multi-level structures

  Phase 1: Architecture Exploration (iterations 1-10)
  - Call design_step_architecture to generate NEW step function families
  - Try 2-3 different architectures with varying interval counts and symmetries
  - Probe all variants, evaluate best

  Phase 2: Iteration Budget Expansion (iterations 11-20)
  - If Phase 1 found improvement: refine the winner with small perturbations
  - If stuck: try more architectural variants with different seeds

  Phase 3: Aggressive Search (iterations 21-30)
  - Mix architectures: odd-symmetry peaks, asymmetric multi-level, etc.
  - Evaluate aggressively if probes show promise

  TOOL USAGE:
  - design_step_architecture: Generate COMPLETELY NEW step function with different architecture
  - probe_solution: Use heavily to rank 5-8 architectural variants before evals
  - evaluate_solution: Only on top 1-2 by probe score
  - edit_solution: Start from scratch with new architecture, don''t incrementally modify'
skill_description: Architectural exploration over step function designs. Generate different interval counts, symmetries, and multi-level structures. Don''t refine - redesign.
skill_body: '# C2 Maximizer: Architectural Exploration Protocol

## Core Principle

The current best (0.8962799441554086) uses specific step patterns. Instead of refining them,
generate NEW architectures: different interval counts, symmetries, and peak structures.

## Phase 1: Architecture Generation (iterations 1-10)

Step 1: Generate New Architectures

- Call design_step_architecture with parameters:
  - num_intervals: try [400, 600, 800, 1200]
  - symmetry: ["even", "none", "asymmetric"]
  - num_levels: [3, 4, 5]
  - target_peak_height: [1.5, 2.0, 2.5]

Step 2: Generate 3-4 Architectural Variants

- Variant A: Even symmetry, 5 levels, 800 intervals
- Variant B: Asymmetric, 3 levels, 400 intervals
- Variant C: High peak (2.8), narrow support, 600 intervals

Step 3: Probe and Evaluate

- Probe ALL variants (3-4 probes)
- Evaluate TOP 1 only
- If beats record: continue Phase 1. If not: try different architectural params.

## Phase 2: Refinement (iterations 11-20)

Step 1: If improvement found, refine

- Take best from Phase 1
- Small perturbations: adjust peak width by 5%, height by 0.05
- Probe 2 variants, evaluate best

Step 2: If no improvement after 3 iterations:

- Generate new architecture with different seed
- Continue Phase 1

## Phase 3: Aggressive Search (iterations 21-30)

Step 1: Mix and match

- Odd-symmetry peaks
- Wide base with narrow spike
- Multiple narrow peaks

Step 2: Evaluate aggressively

- If probe shows promise, evaluate immediately
- Use remaining evals to explore diverse architectures

## Key Rules

- GENERATE NEW ARCHITECTURES, don''t refine old ones
- Use probes to filter: 5-8 probes before any full eval
- Call design_step_architecture every iteration with varied parameters
- Start from scratch: don''t incrementally edit, fully redesign'
tool_descriptions:
  edit_solution: 'Generate a NEW step function from scratch. Call design_step_architecture first to get architecture specs, then implement with different interval counts, symmetries, or peak structures. Don''t incrementally modify - redesign.'
  evaluate_solution: 'Full evaluation. Budget: 30 total. Call ONLY after probe_solution ranking. Evaluate top 1 variant (if probe >= 1.0).'
  probe_solution: 'Approximate score on 10% subsample. FAST. You have 30 probes - use them to explore 8-12 architectural variants. Call design_step_architecture to generate variants, then probe them.'
  finish: Report best combined_score, the winning step function architecture (num_intervals, symmetry, num_levels, peak_heights), and key architectural insights.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 30
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
new_tools:
- name: design_step_architecture
  description: 'Generate a COMPLETELY NEW step function architecture: different num_intervals, symmetry (even/odd/asymmetric), num_levels, and peak configurations. This is for architectural exploration, not refinement.'
  input_schema:
    type: object
    properties:
      num_intervals:
        type: integer
        description: 'Total intervals (try 400, 600, 800, 1200)'
      symmetry:
        type: string
        enum: [even, odd, asymmetric, none]
      num_levels:
        type: integer
        description: 'Number of distinct height levels (3-5)'
      target_peak_height:
        type: number
        description: 'Target for highest peak height'
  implementation_py: "def run(ctx, args):\n    import random\n    # Generate architectural parameters for a NEW step function\n    params = {\n        'num_intervals': args.get('num_intervals', 600),\n        'symmetry': args.get('symmetry', 'asymmetric'),\n        'num_levels': args.get('num_levels', 4),\n        'target_peak_height': args.get('target_peak_height', 2.2)\n    }\n    \n    # Generate new architecture\n    num_int = params['num_intervals']\n    n_levels = params['num_levels']\n    \n    # Generate interval boundaries based on symmetry\n    if params['symmetry'] == 'even':\n        # Symmetric around center\n        boundaries = [0.0]\n        for i in range(1, n_levels // 2 + 1):\n            w = 0.2 * i / (n_levels // 2)\n            boundaries.extend([0.5 - w, 0.5 + w])\n        boundaries.append(1.0)\n        boundaries = sorted(set(boundaries))\n    elif params['symmetry'] == 'odd':\n        # Odd symmetry (antisymmetric peaks)\n        boundaries = [0.0, 0.25, 0.75, 1.0]\n    elif params['symmetry'] == 'asymmetric':\n        # Random asymmetric partition\n        import random\n        r = sorted([random.random() for _ in range(n_levels + 1)])\n        boundaries = [0.0] + r + [1.0]\n    else:\n        # Uniform partition\n        boundaries = [i / n_levels for i in range(n_levels + 1)]\n    \n    # Generate height levels (non-negative, varying)\n    heights = []\n    base_height = 0.6\n    peak_height = params['target_peak_height']\n    \n    # Assign heights with variation\n    for i in range(n_levels):\n        if i == n_levels // 2:  # Middle level is peak\n            heights.append(peak_height)\n        else:\n            # Random base with small noise\n            heights.append(base_height + random.uniform(-0.2, 0.3))\n    \n    # Generate the step function code structure\n    return {\n        'architecture': 'step_function',\n        'num_intervals': num_int,\n        'boundaries': boundaries,\n        'heights': heights,\n        'symmetry': params['symmetry'],\n        'levels': n_levels,\n        'note': f'Generated new architecture with {n_levels} levels, {params[\"symmetry\"]} symmetry'\n    }\n"
remove_tools: []
new_skills:
- name: architecture-exploration-protocol
  description: Step function architectural exploration. Generate different interval counts, symmetries, and multi-level structures. Don''t refine - explore new designs.
  body: '# C2 Maximizer: Architectural Exploration Protocol

## Core Principle

Don''t refine the current best step patterns - generate NEW architectures with different structures.

## Phase 1: Architecture Generation (iterations 1-10)

Step 1: Call design_step_architecture with varied parameters

- Variant A: num_intervals=800, symmetry=even, num_levels=5, target_peak_height=2.0
- Variant B: num_intervals=400, symmetry=asymmetric, num_levels=3, target_peak_height=2.5
- Variant C: num_intervals=600, symmetry=asymmetric, num_levels=4, target_peak_height=2.2

Step 2: Generate 3-4 architectural variants total

Step 3: Probe ALL variants (3-4 probes)

Step 4: Evaluate TOP 1 only

## Phase 2: Iteration (iterations 11-20)

Step 1: If Phase 1 found improvement: refine with small perturbations

Step 2: If no improvement: generate new architecture with different params

## Phase 3: Aggressive Search (iterations 21-30)

Step 1: Try odd-symmetry, wide-base narrow-spine, multi-peak structures

Step 2: Evaluate aggressively on promising probes

## Key Rules

- GENERATE NEW ARCHITECTURES from design_step_architecture
- Use probes to filter: 5-8 probes before any full eval
- Vary num_intervals [400, 600, 800, 1200], symmetry, num_levels [3-5]
- Start from scratch: don''t incrementally edit'
new_middlewares:
- name: enforce_architectural_diversity
  hook: before_model
  description: 'Remind solver to try different architectural parameters to avoid saturation.'
  implementation_py: "def before_model(hook_input):\n    iteration = hook_input.get('iteration', 0)\n    probes_used = hook_input.get('probes_used', 0)\n    \n    # Ensure diversity in architecture exploration\n    if iteration > 0 and probes_used % 5 == 0:\n        return 'Reminder: Try different num_intervals or symmetry for diversity.'\n    \n    if iteration >= 10 and probes_used < 5:\n        return 'Budget alert: Probe more architectural variants before full evals.'\n    \n    return None"
