type: tool
name: design_step_architecture
description: 'Generate a COMPLETELY NEW step function architecture: different num_intervals, symmetry
  (even/odd/asymmetric), num_levels, and peak configurations. This is for architectural exploration, not
  refinement.'
input_schema:
  type: object
  properties:
    num_intervals:
      type: integer
      description: Total intervals (try 400, 600, 800, 1200)
    symmetry:
      type: string
      enum:
      - even
      - odd
      - asymmetric
      - none
    num_levels:
      type: integer
      description: Number of distinct height levels (3-5)
    target_peak_height:
      type: number
      description: Target for highest peak height
