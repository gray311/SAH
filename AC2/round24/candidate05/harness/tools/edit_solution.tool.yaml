type: tool
name: edit_solution
description: Generate a NEW step function from scratch. Call design_step_architecture first to get architecture
  specs, then implement with different interval counts, symmetries, or peak structures. Don't incrementally
  modify - redesign.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
