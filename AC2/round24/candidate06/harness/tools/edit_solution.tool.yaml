type: tool
name: edit_solution
description: "Edit the EVOLVE-BLOCK to create DIVERSE step function architectures:\n\n1. HYBRID PATTERN:\
  \ Extract heights from pattern_A (pattern_idx=i) and pattern_B (pattern_idx=j).\n   Create a new pattern\
  \ that uses heights from both, with indices from the more promising one.\n   \n2. ASYMMETRY FLIP: If\
  \ pattern is symmetric, create asymmetric variant:\n   Left half at different height than right half.\n\
  \   \n3. PEAK MULTIPLICATION: If pattern has single peak, split it into 2-3 peaks.\n   \n4. HEIGHT EXTREMES:\
  \ Rescale heights to emphasize extremes:\n   - Find max height H_max, min height H_min in pattern\n\
  \   - New heights: H_max * 1.5 (or cap at 3.5), H_min * 0.3 (or floor at 0.1)\n   \n5. MULTI-PATTERN\
  \ MERGE: For multi-level patterns, take heights from pattern_i[0:4] and\n   pattern_j[4:8], interleaving\
  \ or concatenating.\n\nUse JAX array mutation: f = f.at[start:end].set(value). Ensure f >= 0.\n\nExample:\
  \ Creating hybrid from pattern_idx=3 and pattern_idx=4:\n  Pattern 3: [0.90, 1.90, 0.90] over [0.15-0.25,\
  \ 0.25-0.75, 0.75-0.85]\n  Pattern 4: [1.10, 2.30, 1.40] over [0.11-0.21, 0.21-0.49, 0.49-0.71]\n  Hybrid:\
  \ Use heights [1.10, 2.30, 1.40] but with pattern 3's indices."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
