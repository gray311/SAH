type: tool
name: evaluate_solution
description: 'Full evaluation with C2 score computation. Budget: 30 total evaluations.


  Call ONLY when:

  - Probe scores show clear winner (top 2 by probe)

  - Structural variant shows promise (combined_score > 1.02 in probe)

  - Final iteration before submission


  Expected output: c2 value, combined_score, convergence status.

  If c2 > 0.8962799441554086: this is a new world record.


  Phase 1: Evaluate top 2 probes. Phase 2: Evaluate best. Phase 3: Evaluate best of 3.'
