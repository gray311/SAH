type: tool
name: hybridize_patterns
description: 'Combine 2-3 patterns into a novel architecture. This is your PRIMARY mutation operator.


  Strategies:

  - HEIGHT MERGE: Take heights from pattern_A[i] and pattern_B[i], alternate or average

  - RANGE SWAP: Use heights from A with ranges from B (tests height independence)

  - ASYMMETRY INJECTION: Take symmetric pattern, make it asymmetric by shifting one side

  - MULTI-LEVEL CONCAT: Take first 2 levels from A, last 2 levels from B, create 4-level


  Call when: You have best pattern(s) and want to explore new architectures.'
input_schema:
  type: object
  properties:
    pattern_a_idx:
      type: integer
      description: Index of first pattern (0-11)
    pattern_b_idx:
      type: integer
      description: Index of second pattern (0-11, can equal pattern_a_idx)
    strategy:
      type: string
      enum:
      - height_merge
      - range_swap
      - asymmetry_injection
      - multi_level_concat
    seed_ratio:
      type: number
      description: Random seed for any stochastic mixing (default 42)
