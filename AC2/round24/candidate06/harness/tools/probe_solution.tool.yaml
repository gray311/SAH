type: tool
name: probe_solution
description: 'Approximate C2 score on 10% subsample. FAST (~10s vs ~5min for full eval).


  You have 30 probes total. USE THEM AGGRESSIVELY to explore diverse architectures.


  Strategy:

  - Phase 1 (iterations 1-12): Probe ALL 4-6 candidates before any eval

  - Phase 2 (iterations 13-20): Probe ALL 3 structural variants

  - Phase 3 (iterations 21-30): Probe ALL 3-5 rearchitecture candidates


  Rank by probe score, evaluate top 1-2. Never evaluate without probing first.


  Note: Probe scores are approximate and NOT comparable to full scores, but RANKING is reliable.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
