type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to generate new function families:

  (1) Gaussian mixture: f(x) = Sum w_i * exp(-(x-μ_i)^2/(2σ^2)) with JAX optimization

  (2) Spline: piecewise linear with k breakpoints at specified positions, heights optimized

  (3) Hybrid: steps at edges with smooth tanh transitions

  For step patterns: call scan_pattern_variants to find best pattern_idx, then modify pattern parameters
  (widen peaks, add new levels)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
