type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to construct new function architectures:

  - Gaussian hybrids: combine step function with exp(-x^2) decay

  - Spline-based: use piecewise polynomial with continuous derivatives

  - Polynomial cutoff: step function x (1 + e·x^2) for smooth transitions

  - Mixed architectures: step base + smooth boundary layers

  Use JAX array mutation: f = f.at[start:end].set(value) or blend existing with new terms.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
