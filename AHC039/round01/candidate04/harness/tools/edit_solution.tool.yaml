type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK region. Use SEARCH/REPLACE diffs targeting the search loop,

  mutation operators, or scoring logic. Or send full new CPP_CODE for major rewrites.

  Must preserve the fixed entry function outside EVOLVE-BLOCK.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
