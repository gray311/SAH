type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK C++ code. Use targeted SEARCH/REPLACE for small changes,

  or full rewrite for structural changes. Keep the fixed structure: # EVOLVE-BLOCK-START,

  CPP_CODE triple-quoted string, # EVOLVE-BLOCK-END. The evaluator calls main() which

  reads input and outputs polygon vertices. Preserve this contract.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
