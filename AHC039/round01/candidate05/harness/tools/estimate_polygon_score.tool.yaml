type: tool
name: estimate_polygon_score
description: 'Quickly estimate a polygon''s score by sampling points and checking if they are inside.

  Uses a grid-based subsampling approach for speed. Returns approximate score and variance estimate.

  Call this when you need to compare multiple polygon candidates before full evaluation.'
input_schema:
  type: object
  properties:
    vertices:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
    sample_density:
      type: integer
      default: 50
      description: How many points to sample (lower equals faster but noisier)
