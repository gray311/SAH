type: tool
name: finish
description: 'End the session. Submit your best-scoring program (automatically retained).

  Call when evaluations run out or you cannot improve further. Include a brief summary.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
