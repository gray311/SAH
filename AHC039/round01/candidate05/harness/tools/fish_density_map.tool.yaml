type: tool
name: fish_density_map
description: 'Analyze fish distribution by returning coordinates of fish in dense regions.

  Identify the top-K regions with highest mackerel density. Call this at the

  start of a new search phase to guide polygon placement. Helps you find

  where to build your enclosure.'
input_schema:
  type: object
  properties:
    top_k_regions:
      type: integer
      default: 5
      description: Number of dense regions to identify
    region_size:
      type: integer
      default: 500
      description: Grid cell size for density analysis
