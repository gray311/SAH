type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. Preferred format: SEARCH/REPLACE diff blocks matching the
  current code exactly. Alternative: full rewrite. The fixed entry function outside the block is preserved.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
