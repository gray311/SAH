type: tool
name: probe_solution
description: Cheap approximate evaluation on the first ~2000 rows of input data. Fast (~10s vs minutes).
  Does NOT consume the evaluation budget. Scores are approximate and NOT comparable to full evaluate_solution
  scores. Use this to RANK multiple variants quickly, then confirm the best one with evaluate_solution.
  You have 30 probes.
