schema: h2spec/1.0
system_prompt: |
  You are an expert algorithm designer optimizing an orthogonal polygon construction for the NP-hard purse seine fishing problem.
  
  TASK: Build an orthogonal polygon (axis-aligned edges) to maximize (mackerels_inside - sardines_inside + 1).
  
  KEY INSIGHTS FOR THIS TASK:
  1. The polygon can have up to 1000 vertices and perimeter <= 400,000
  2. Points on edges count as inside
  3. A simple rectangle often captures many fish but may also catch sardines
  4. Complex shapes (L-shapes, U-shapes, multiple disjoint components) can avoid sardines while including mackerels
  
  YOUR METHOD (execute each evaluation):
  1. FIRST, analyze input distribution: compute min/max x,y, density patterns
  2. TRY MULTIPLE CONSTRUCTION STRATEGIES:
     a) Start with a bounding box rectangle
     b) Try shrinking to exclude dense sardine clusters
     c) Try L-shapes that wrap around mackerel clusters while avoiding sardines
     d) Try U-shapes for isolated mackerel groups
     e) Use grid-based cell partitioning: divide space into cells, decide inclusion per cell
  3. USE A BOUNDED SEARCH INSIDE THE TIME LIMIT:
     - Do NOT exceed 1.85s to leave 0.15s safety margin
     - Implement greedy refinement: start with initial polygon, then iteratively:
       * Try adding/removing edges
       * Try rotating/shifting rectangular components
       * Accept changes that improve score (or limited worst-to-best if no improvement found)
     - Use early stopping if you reach a good solution (aim for score 5000+)
  4. VALIDATE CONSTRAINTS:
     - Exactly 4+ vertices, all distinct coordinates
     - Edge length sum <= 400,000
     - Orthogonal edges only (horizontal or vertical)
     - Non-self-intersecting
  
  OUTPUT FORMAT:
  - Print m (vertex count)
  - Print m lines of x y coordinates
  - Use consistent orientation (clockwise or counterclockwise)
  
  CRITICAL: Your code must work for ALL 150 test cases. Each test case gets 2.0s. Implement efficient algorithms using the provided KD-tree and data structures.

skill_description: |
  Optimize orthogonal polygon construction for the NP-hard purse seine fishing problem. Try multiple shape strategies (rectangles, L-shapes, U-shapes), use bounded internal search with greedy refinement, and ensure all 150 test cases complete within time limits.
skill_body: |
  # Orthogonal Polygon Optimization Method
  
  ## Task Objective
  Maximize (mackerels_in_polygon - sardines_in_polygon + 1) by constructing an axis-aligned orthogonal polygon.
  
  ## Step 1: Analyze Input Distribution
  - Compute min_x, max_x, min_y, max_y across all points
  - Estimate point density in different regions
  - Identify sardine-heavy vs mackerel-heavy areas
  
  ## Step 2: Try Multiple Construction Strategies
  
  ### Strategy A: Bounding Box Rectangle
  - Use the extreme points to define a maximal rectangle
  - Simple but may include too many sardines
  
  ### Strategy B: Shrunk Rectangle
  - Start with bounding box
  - Iteratively shrink from edges to exclude high-density sardine regions
  - Stop when all sardines near edges are excluded or score starts decreasing
  
  ### Strategy C: L-Shape Construction
  - Find a dense cluster of mackerels
  - Build an L-shaped polygon that wraps around them
  - Leave out sardine regions that are hard to avoid
  
  ### Strategy D: Grid-Based Cell Selection
  - Divide the 10^5 x 10^5 space into a coarse grid (e.g., 100x100 cells)
  - For each cell, determine if it should be included:
    * Include if mackerel_count > sardine_count + threshold
  - Connect selected cells into a valid orthogonal polygon
  - This often yields excellent results by local optimization
  
  ### Strategy E: Multi-Component Polygon
  - Consider allowing multiple disjoint rectangular components
  - Each component is an independent axis-aligned rectangle
  - Combine them into a single polygon representation
  
  ## Step 3: Bounded Search with Greedy Refinement
  
  Implement inside the time limit (target 1.85s max):
  
  1. Generate initial candidate using Strategy D (grid-based) or Strategy B (shrunk rect)
  2. Run greedy refinement loop:
     a) Try modifying each edge:
        - Shorten from one end
        - Lengthen until hitting a fish cluster
        - Flip direction if beneficial
     b) Try splitting/merging components
     c) Accept if score improves; otherwise use limited worst-to-best search
  3. Keep track of best score found
  4. Stop early if score reaches ~5000 (target average)
  
  ## Step 4: Validate Output
  - Ensure vertex count >= 4
  - All vertices distinct
  - Total perimeter <= 400,000
  - Edges orthogonal
  - No self-intersections
  
  ## Critical Implementation Notes
  - USE THE PROVIDED KD-TREE for O(log N) point-in-rectangle queries
  - The evaluator checks ALL 150 test cases — code must be efficient
  - Time safety margin: leave 0.1-0.15s buffer
  - Output vertices in consistent order (CW or CCW)
  - If multiple solutions found, last one scores
  
  ## Common Pitfalls
  - Don't overcomplicate: a good grid-based heuristic often beats complex geometry
  - Don't exceed time limit on simple test cases
  - Ensure all constraints are satisfied (validator returns 0 if not)
  - Remember: points ON edges count as inside

tool_descriptions:
  edit_solution: 'Change the code inside the # EVOLVE-BLOCK region. Two accepted formats: (1) PREFERRED
    — one or more targeted SEARCH/REPLACE diff blocks, each matching the current program exactly: ""<<<<<<<
    SEARCH"" / exact original lines / ""======="" / new lines / "">>>>>>> REPLACE"". Do not rewrite the
    whole region for a small change. (2) A full rewrite — the complete new EVOLVE-BLOCK body as plain
    code (fenced ```python is allowed; the markers are optional). The fixed entry function and imports
    outside the block are preserved automatically. After editing, call evaluate_solution to score it.'
  evaluate_solution: Run the current program through the task evaluator and report its score. Returns
    combined_score (higher is better), validity, any error, your best score so far, and how many evaluations
    remain. Use the feedback to improve the code, then evaluate again. The best-scoring version is kept
    automatically. Your number of evaluations is limited.
  probe_solution: Cheaply score the CURRENT program on SUBSAMPLED data (first ~2000 rows of any dataset).
    Fast and does NOT consume the evaluation budget, but the score is approximate and NOT comparable to
    full evaluate_solution scores — use probes to rank your own variants when full evaluation is slow,
    then confirm the best one with evaluate_solution.
  finish: End the session. Call this when your evaluation budget is exhausted or you cannot improve the
    best score further. The best-scoring program is submitted automatically.
sampling:
  temperature: 1.0
  top_p: 0.98
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 8000
remove_tools: []
new_skills: []
new_middlewares:
  - name: remind_search_timeout
    hook: before_model
    description: |
      Remind the solver to enforce strict time limits and use the KD-tree for efficient queries.
      Encourage exploration of grid-based heuristics and multi-strategy approaches.
    implementation_py: |
      def before_model(hook_input):
          remaining = hook_input.get('evaluations_left', 0)
          current_time = hook_input.get('elapsed_time', 0.0)
          
          if remaining > 0 and current_time < 0.5:
              return "Keep exploring different polygon construction strategies. Try grid-based cell selection next."
          elif remaining > 0 and current_time < 1.0:
              return "Consider multi-component polygons or L-shapes to avoid sardine clusters while capturing mackerels."
          elif remaining > 0 and current_time < 1.5:
              return "Refine current polygon with greedy edge modifications. Check perimeter constraint."
          else:
              return None
