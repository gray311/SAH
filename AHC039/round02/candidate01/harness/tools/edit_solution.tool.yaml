type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK C++ code. Use SEARCH/REPLACE for small changes, full

  rewrite for major strategy shifts. After editing, call probe_solution to quickly

  assess the variant before using evaluate_solution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
