type: tool
name: finish
description: 'Submit your best solution when score >2.5 is verified with evaluate_solution,

  or when evaluation budget is exhausted. Include brief summary of approach.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
