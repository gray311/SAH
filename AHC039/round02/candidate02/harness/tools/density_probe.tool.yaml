type: tool
name: density_probe
description: 'Compute approximate mackerel-sardine density inside the current polygon using subsampled
  data (~2000 fish).

  Returns net_density (mackerels - sardines in subsample), mackerels_subsampled, sardines_subsampled,
  and time_ms.

  Does NOT consume the evaluation budget (uses separate probe budget of ~30 calls).

  Scores are approximate and NOT comparable to evaluate_solution results.

  Use to: (1) quickly rank candidate polygon shapes, (2) verify your edits improved net density, (3) explore
  many variants before confirming with evaluate_solution.

  Ideal for tasks with slow full evaluators — iterate with probes, confirm winners with evaluate_solution.'
input_schema:
  type: object
  properties: {}
