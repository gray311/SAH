type: tool
name: edit_solution
description: 'Change the C++ code in the EVOLVE-BLOCK region (# EVOLVE-BLOCK-START to # EVOLVE-BLOCK-END).

  Use targeted SEARCH/REPLACE diffs when possible. Only the EVOLVE-BLOCK is editable; imports and entry
  function are frozen.

  After editing, call density_probe or evaluate_solution to score it.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
