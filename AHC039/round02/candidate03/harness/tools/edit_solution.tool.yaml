type: tool
name: edit_solution
description: 'Change the C++ code in the EVOLVE-BLOCK region between # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END.
  Format: SEARCH/REPLACE diff blocks (precise line matching) OR full rewrite of the block. The fixed main()
  entry point and imports are preserved. After editing, call evaluate_solution to score.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
