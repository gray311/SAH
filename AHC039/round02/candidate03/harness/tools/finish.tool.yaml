type: tool
name: finish
description: 'End the optimization session. The best-scoring program is auto-submitted. Call when: (1)
  Budget exhausted, (2) No improvement after 2 diverse attempts, (3) Strategy converged. Provide one-line
  summary of winning approach.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
