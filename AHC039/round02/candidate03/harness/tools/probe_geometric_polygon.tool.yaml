type: tool
name: probe_geometric_polygon
description: "FAST geometric probe for orthogonal polygons: runs a lightweight C++ solver on \nSUBSAMPLED\
  \ data (2000 mackerels + 2000 sardines) to quickly construct bounding-box\northogonal polygons and return\
  \ approximate scores. Uses greedy grid-sweep to test\ndifferent construction parameters without consuming\
  \ evaluation budget. Scores are\napproximate and NOT comparable to evaluate_solution, but sufficient\
  \ to rank variants\nand eliminate bad strategies before full scoring. Ideal for: (1) initial variant\n\
  comparison, (2) parameter sensitivity testing, (3) perimeter constraint exploration."
