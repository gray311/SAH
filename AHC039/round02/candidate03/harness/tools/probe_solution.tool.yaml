type: tool
name: probe_solution
description: 'FAST geometric probe: evaluates your current program on the FIRST ~2000 fish from each input
  (subsampling by position). Returns approximate score for ranking purposes ONLY. Does NOT consume evaluation
  budget. Scores are approximate and NOT comparable to full eval. USE THIS TO: (1) Compare multiple construction
  variants quickly, (2) Rank parameters, (3) Filter before calling evaluate_solution. Expected: 5-10 probe
  calls per full eval. Call when time is tight or testing many ideas.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
