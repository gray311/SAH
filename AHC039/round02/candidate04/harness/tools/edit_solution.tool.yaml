type: tool
name: edit_solution
description: 'Change the C++ code in # EVOLVE-BLOCK region. Use targeted SEARCH/REPLACE diffs.

  Keep all imports, main() structure, and external functions intact. Only modify

  internal implementation in EVOLVE-BLOCK. Each diff must match original lines exactly.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
