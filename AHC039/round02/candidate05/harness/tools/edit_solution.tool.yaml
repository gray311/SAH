type: tool
name: edit_solution
description: 'Modify code inside # EVOLVE-BLOCK region. Preferred: targeted SEARCH/REPLACE diffs

  matching current code exactly. For polygon search, add new construction methods

  or validation logic inside the search loop. Preserve the C++ structure and entry

  point - only change the internal algorithm between EVOLVE-BLOCK markers.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
