type: tool
name: quick_perimeter_check
description: 'Fast-only perimeter calculation for polygon vertices (no full validation).

  Returns: perimeter (int), status (string). Use during search loop to prune

  expensive full validations. Status is "ok", "over_budget", or "unknown".'
input_schema:
  type: object
  properties:
    vertices:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
