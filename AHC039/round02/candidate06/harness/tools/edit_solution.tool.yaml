type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK (code between markers). For this polygon-discovery task:

  - ADD a search loop with vertex modifications (swap/add/remove/move)

  - Use time-based stopping (run ~1.8s)

  - Track best polygon found

  - Keep all existing code (KD-tree, timer, geometry) intact

  - Do NOT output static polygons - the evaluator REQUIRES active search'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
