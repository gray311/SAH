type: tool
name: finish
description: 'End the session. Call this when you have exhausted iterations, run out of evaluations,

  or cannot improve further. The best-scoring program is automatically submitted.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
