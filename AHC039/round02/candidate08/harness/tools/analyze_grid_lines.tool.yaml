type: tool
name: analyze_grid_lines
description: 'Analyze the solver''s current code to identify how it extracts and uses grid lines

  from mackerel positions. Returns analysis templates and recommendations for

  axis-aligned polygon construction. Guides the solver to: 1) get unique coords,

  2) count fish per line, 3) select optimal lines. Call this FIRST in the workflow.


  The tool examines the code structure and returns: extraction template,

  counting template, selection strategy, and common pitfalls to avoid.'
input_schema:
  type: object
  properties: {}
