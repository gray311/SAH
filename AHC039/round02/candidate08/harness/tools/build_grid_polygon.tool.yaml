type: tool
name: build_grid_polygon
description: "Generate multiple axis-aligned polygon candidates from candidate grid lines.\nInput: grid_x\
  \ (list of x coords), grid_y (list of y coords), k (top-k lines),\n        shape (rectangle|lshape|union).\n\
  Returns: list of polygon vertex lists with perimeter validation.\n\nTemplates included: bounding box,\
  \ L-shaped union, multi-rectangle union.\nAll candidates respect constraints (perimeter <=400000, vertices\
  \ <=1000)."
input_schema:
  type: object
  properties:
    grid_x:
      type: array
    grid_y:
      type: array
    k:
      type: integer
    shape:
      type: string
