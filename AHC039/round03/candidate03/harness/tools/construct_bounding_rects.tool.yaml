type: tool
name: construct_bounding_rects
description: 'Build a candidate polygon as the bounding box of a coordinate subset.

  Takes parameters for which x/y ranges to include. Returns polygon vertices.'
input_schema:
  type: object
  properties:
    x_min:
      type: integer
    x_max:
      type: integer
    y_min:
      type: integer
    y_max:
      type: integer
