type: tool
name: construct_striped_polygon
description: 'Build a polygon with multiple vertical/horizontal stripes to capture mackerel clusters.

  Takes stripe specifications. Returns union of all stripes as orthogonal polygon.'
input_schema:
  type: object
  properties:
    stripes:
      type: array
      items:
        type: object
        properties:
          x1:
            type: integer
          x2:
            type: integer
          y1:
            type: integer
          y2:
            type: integer
