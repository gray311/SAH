type: tool
name: edit_solution
description: 'Change the C++ code inside # EVOLVE-BLOCK. For this geometric search task: Prefer modifying
  the polygon construction algorithm, not just output values. Use SEARCH/REPLACE to change the search
  loop, not unrelated code. Preserve all includes and the main() structure. Use proper C++ escaping: write
  \\n for newlines in string literals.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
