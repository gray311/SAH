type: tool
name: estimate_polygon_score
description: A fast O(1) estimator that predicts a polygon's score from its vertices without running the
  full evaluator. It counts how many fish lie inside the polygon by checking grid cells, then approximates
  (mackerels - sardines + 1). Call this to quickly rank 10+ polygon candidates before spending a full
  probe or evaluate. NOT comparable to actual scores, but good for relative ranking during search.
input_schema:
  type: object
  properties:
    polygon:
      type: string
      description: 'JSON array of vertices: [[x1,y1], [x2,y2], ...]'
