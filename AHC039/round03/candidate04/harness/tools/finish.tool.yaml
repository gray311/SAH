type: tool
name: finish
description: 'Submit the final harness when: (1) score plateaus for 3+ iterations, (2) 15+ evaluations
  used, or (3) you have a clear hypothesis but no budget. Summarize the winning approach.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
