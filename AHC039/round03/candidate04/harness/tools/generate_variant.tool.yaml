type: tool
name: generate_variant
description: 'Generate a new polygon variant by applying a specific transformation to the current polygon.
  Supports: expand, contract, rotate, shift, add_vertex, remove_vertex. The solver should call this to
  explore the search space systematically. Then rank the variants with estimate_polygon_score, then validate
  with probe_solution.'
input_schema:
  type: object
  properties:
    polygon:
      type: string
      description: Current polygon vertices as JSON
    operation:
      type: string
      description: expand|contract|rotate|shift|add_vertex|remove_vertex
    direction:
      type: string
      description: n|s|e|w|diagonal
      default: diagonal
