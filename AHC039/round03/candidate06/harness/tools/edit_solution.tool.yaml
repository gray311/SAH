type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK region (between markers). Preferred: targeted SEARCH/REPLACE diffs.

  For this task, focus on modifying: (1) the main search/algorithm logic, (2) heuristic parameters,

  (3) clustering or expansion rules. Keep input parsing and output format unchanged.

  After editing, call probe_solution to rank variants before full evaluation.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
