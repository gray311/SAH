type: tool
name: finish
description: 'Submit when you''ve exhausted improvements. The best-scoring program (from evaluations)
  is submitted automatically.

  Call this with ~1-2 evaluations left to verify your final solution.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
