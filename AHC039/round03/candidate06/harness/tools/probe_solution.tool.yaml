name: probe_solution
description: 'Run a subsampled version (~2000 fish per test case) of the C++ program.

  Fast (seconds vs minutes), does NOT use evaluation budget, has 30-probe limit.

  Scores are approximate but consistent - use to rank algorithm variants.

  Ideal for: (1) comparing different search strategies, (2) tuning parameters, (3) finding bugs.'
