type: tool
name: construct_orthogonal_polygon
description: 'Generate an axis-aligned orthogonal polygon on fish coordinates. Strategy: scan fish, group
  by y-bands, and construct a perimeter-constrained polygon that hugs high-density regions. Returns a
  list of vertices as integers. Call once per candidate polygon.'
input_schema:
  type: object
  properties:
    max_vertices:
      type: integer
      description: Max vertices allowed (default 1000)
    max_perimeter:
      type: integer
      description: Max perimeter allowed (default 400000)
    top_k:
      type: integer
      description: Number of candidates (default 5)
    use_probes:
      type: boolean
      description: Probe each candidate (default false)
    probe_budget:
      type: integer
      description: Probes per candidate (default 1)
