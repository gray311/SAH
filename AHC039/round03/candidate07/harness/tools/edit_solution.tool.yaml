type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. Two formats: (1) PREFERRED — targeted
  SEARCH/REPLACE diff blocks matching the current program exactly. (2) Full rewrite as plain code. Can
  insert calls to new_tools like construct_orthogonal_polygon. Fixed entry function and imports outside
  the block are preserved.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
