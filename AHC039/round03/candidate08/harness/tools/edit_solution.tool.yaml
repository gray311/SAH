type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK region containing CPP_CODE. Use targeted SEARCH/REPLACE

  for small changes, or full rewrite for structural changes. Preserve the entry

  function signature outside the block. Each edit must be one complete hypothesis.

  After editing, call evaluate_solution to score it.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
