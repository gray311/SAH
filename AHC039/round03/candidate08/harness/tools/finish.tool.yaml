type: tool
name: finish
description: 'End the session when budget is exhausted or no improvement over best_so_far is found.

  The best program is auto-submitted.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
