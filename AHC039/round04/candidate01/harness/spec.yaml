schema: h2spec/1.0
system_prompt: "You are an expert C++ developer specializing in computational geometry and algorithm optimization. Your task is to iteratively improve a polygon-construction program that maximizes the score: (mackerels_inside - sardines_inside + 1).

CRITICAL UNDERSTANDING:
- This is an NP-hard geometric construction problem, NOT a simple optimization.
- You must build VALID axis-aligned polygons (edges parallel to x or y axis).
- Validity is binary: invalid polygons score 0. Most random edits break validity.
- With N=5000 fish of each type, you need DATA-INFORMED strategies, not random mutations.

METHOD - DATA-FIRST GEOMETRIC CONSTRUCTION:
1. FIRST, use analyze_geometric_potential to understand the fish distribution.
   - This tool reports the bounding box, density hotspots, and suggests candidate shapes.
   - CALL THIS BEFORE EVERY MAJOR POLYGON RECONSTRUCTION.
2. SECOND, design a COMPLETE new polygon based on the analysis.
   - Common successful patterns: large rectangles avoiding sardine clusters,
     L or U shapes that wrap around mackerel groups, plus-shaped polygons.
   - Always verify: vertex count <= 1000, perimeter <= 400000, no self-intersection.
3. THIRD, if stuck at the same score, try a DIFFERENT polygon topology entirely.
   - Don't tweak the same base design. Change rectangular to L-shape to plus-shape.
4. FOURTH, keep time-based search loops SHORT. The C++ program must finish in ~1.5s.
   - Use bounded internal searches with hard iteration limits.
   - Greedy construction beats complex probabilistic methods here.

VALIDITY CHECKLIST (fail fast):
- Every edge must be axis-aligned (delta_x=0 or delta_y=0 only)
- Vertices must form a simple polygon (no self-intersection)
- Minimum 4 vertices, maximum 1000 vertices
- Total perimeter <= 400000
- All coordinates in [0, 100000]

After editing, always check if the new code would produce valid output before evaluating.
Call evaluate_solution sparingly - focus on getting the C++ code right first."
skill_description: "Construct axis-aligned polygons to maximize (mackerels - sardines) score. This is a geometric construction problem requiring data-informed design, not blind optimization. Use analyze_geometric_potential to understand fish distribution, then construct complete polygon strategies based on identified patterns. Prioritize validity (invalid equals score zero) over small incremental changes. Common winning shapes: rectangles, L-shapes, plus-shapes, or nested regions that trap mackerel clusters while excluding sardines."
skill_body: "# Axis-Aligned Polygon Construction for Fish Capture

## Problem Understanding
You're building a C++ program that reads 5000 mackerels and 5000 sardines, then outputs vertices of an axis-aligned polygon that maximizes: (mackerels_inside - sardines_inside + 1).

## Key Insights
1. Validity is everything: Invalid polygons (self-intersection, wrong edge orientation, >1000 vertices, perimeter >400000) get score 0.
2. Data informs design: Use analyze_geometric_potential FIRST to see where fish cluster.
3. Think in shapes, not points: Design complete polygons (rectangles, L-shapes, plus-shapes) rather than iterating vertex-by-vertex.
4. Time is tight: Your C++ search loops must complete in ~1.5 seconds. Simple greedy construction beats complex methods.

## Polygon Shape Strategies
### Rectangle Strategy
- Find bounding box of mackerel cluster
- Expand slightly or shrink to exclude sardines
- Check perimeter constraint: 2 times width plus height must be <= 400000

### L-Shape Strategy
- Two rectangles joined at a corner
- Can wrap around irregular mackerel groups
- Six vertices minimum

### Plus-Shape Strategy
- Central rectangle with four arms
- Good for linear mackerel arrangements
- 8 to 12 vertices

### Nested Avoidance Strategy
- Build polygon that avoids known sardine locations
- Start with large polygon, carve out sardine zones

## Implementation Checklist
1. Use analyze_geometric_potential to get bbox, density map, sardine locations
2. Choose a polygon shape based on distribution
3. Construct vertices ensuring: axis-aligned edges, no intersections, valid count and perimeter
4. Build C++ code with fast greedy construction plus optional bounded local search
5. Output vertices in order (clockwise or counter-clockwise), ensure all coordinates are integers in [0, 100000]

## Common Pitfalls
- Forgetting axis-alignment constraint (edges must be purely horizontal or vertical)
- Creating self-intersecting polygons
- Exceeding vertex or perimeter limits
- Timeouts from overly complex C++ code
- Not reading fish data before constructing polygon"
tool_descriptions:
  edit_solution: "Change the code inside the # EVOLVE-BLOCK region. For this geometric problem, prefer complete rewrites over diffs when changing polygon strategies. The structure is fundamental: how you read fish data, how you compute candidate polygons, and how you validate constraints. A small diff that tweaks an existing invalid polygon will score zero. When stuck, rewrite the whole EVOLVE-BLOCK with a new shape strategy."
  evaluate_solution: "Run the current program through the task evaluator. Returns combined_score (higher is better), validity (zero if invalid polygon), error messages, best_so_far score, and evaluations remaining. For this task: score zero usually means invalid polygon. Use this sparingly."
  probe_solution: "Cheap approximate evaluation on approximately 2000 rows. Not useful for polygon construction since validity is binary and subsampling may exclude critical fish. Use evaluate_solution for final scoring only."
  finish: "End the session when you have a working solution or exhausted evaluations. Call with summary of polygon strategy and final score."
new_tools:
- name: analyze_geometric_potential
  description: "Analyze the fish distribution to inform polygon construction. Reads all input data and returns: global_bbox, mackerel_bbox, sardine_bbox, mackerel_density grid heatmap, sardine locations list, overlap count, and suggested shapes list. CALL THIS FIRST before designing any polygon. Essential for data-informed design and avoiding invalid polygons."
  input_schema: {type: object, properties: {}}
  implementation_py: "def run(ctx, args):\n    fish_files = ctx.list_task_inputs()\n    if not fish_files:\n        return {\"error\": \"no task inputs found\"}\n    mackerels = []\n    sardines = []\n    mackerel_file = fish_files[0]\n    data_m = ctx.read_input_df(mackerel_file, nrows=10000)\n    for idx, row in data_m.iterrows():\n        mackerels.append({\"x\": int(row.x), \"y\": int(row.y)})\n    if len(fish_files) > 1:\n        sardine_file = fish_files[1]\n        data_s = ctx.read_input_df(sardine_file, nrows=10000)\n        for idx, row in data_s.iterrows():\n            sardines.append({\"x\": int(row.x), \"y\": int(row.y)})\n    elif len(mackerels) >= 5000:\n        sardines = [{\"x\": int(data_m.iloc[idx].x), \"y\": int(data_m.iloc[idx].y)} for idx in range(5000, 10000)]\n    if len(mackerels) < 5000:\n        return {\"error\": \"insufficient data\", \"mackerel_count\": len(mackerels), \"sardine_count\": len(sardines)}\n    m_x = [m[\"x\"] for m in mackerels]\n    m_y = [m[\"y\"] for m in mackerels]\n    s_x = [s[\"x\"] for s in sardines]\n    s_y = [s[\"y\"] for s in sardines]\n    global_bbox = {\"min_x\": min(m_x), \"max_x\": max(m_x), \"min_y\": min(m_y), \"max_y\": max(m_y)}\n    mackerel_bbox = {\"min_x\": min(m_x), \"max_x\": max(m_x), \"min_y\": min(m_y), \"max_y\": max(m_y)}\n    sardine_bbox = {\"min_x\": min(s_x), \"max_x\": max(s_x), \"min_y\": min(s_y), \"max_y\": max(s_y)}\n    grid_size = 4\n    range_x = max(1, global_bbox[\"max_x\"] - global_bbox[\"min_x\"])\n    range_y = max(1, global_bbox[\"max_y\"] - global_bbox[\"min_y\"])\n    cell_width = range_x / grid_size\n    cell_height = range_y / grid_size\n    density = {}\n    for m in mackerels:\n        gx = int((m[\"x\"] - global_bbox[\"min_x\"]) / cell_width)\n        gy = int((m[\"y\"] - global_bbox[\"min_y\"]) / cell_height)\n        key = (gx, gy)\n        density[key] = density.get(key, 0) + 1\n    mackerel_density = dict(sorted(density.items(), key=lambda x: -x[1])[:16])\n    sardine_locations = [s[\"x\"] for s in sardines] + [s[\"y\"] for s in sardines]\n    overlap_cells = set()\n    for m in mackerels:\n        for s in sardines:\n            if abs(m[\"x\"] - s[\"x\"]) < 100 and abs(m[\"y\"] - s[\"y\"]) < 100:\n                gx = int((m[\"x\"] - global_bbox[\"min_x\"]) / cell_width)\n                gy = int((m[\"y\"] - global_bbox[\"min_y\"]) / cell_height)\n                overlap_cells.add((gx, gy))\n                break\n    overlap_count = len(overlap_cells)\n    suggested_shapes = []\n    bb_area = range_x * range_y\n    mackerel_spread = max(m_x) - min(m_x) if m_x else 0\n    sardine_spread = max(s_x) - min(s_x) if s_x else 0\n    if overlap_count == 0:\n        suggested_shapes.append(\"large_rect\")\n        suggested_shapes.append(\"tight_rect\")\n    elif overlap_count > 0:\n        suggested_shapes.append(\"avoidance_shape\")\n        suggested_shapes.append(\"plus_shape\")\n    if max(mackerel_density.values(), default=0) > bb_area / 2:\n        suggested_shapes.append(\"cluster_rect\")\n    if len(sardine_locations) > 0:\n        suggested_shapes.append(\"sardine_avoidance\")\n    return {\"global_bbox\": global_bbox, \"mackerel_bbox\": mackerel_bbox, \"sardine_bbox\": sardine_bbox, \"mackerel_density\": mackerel_density, \"sardine_locations\": sardine_locations, \"overlap_count\": overlap_count, \"overlap_cells\": list(overlap_cells), \"suggested_shapes\": suggested_shapes, \"data_loaded\": True}"
new_skills:
- name: geometric-construction-playbook
  description: "Specialized playbook for constructing valid axis-aligned polygons in fish-capture problems. Use when stuck at low scores or when current polygon strategy fails. This playbook guides complete redesigns rather than incremental edits."
  body: "# Geometric Polygon Construction Playbook\n\n## Phase 1: Data Analysis (MANDATORY FIRST STEP)\nBefore writing any C++ code, you MUST call analyze_geometric_potential.\n- Review the returned bbox values\n- Examine mackerel_density: which grid cells have high mackerel concentration?\n- Check sardine_locations: where are sardines clustered?\n- Read suggested_shapes: what does the tool recommend?\n\n## Phase 2: Choose Construction Strategy\nBased on Phase 1 analysis:\n\n### Strategy A: Tight Rectangle (best when sardines are outside mackerel cluster)\n- Use mackerel_bbox directly or slightly expanded\n- Polygon: 4 vertices at min_x, min_y, max_x, min_y, max_x, max_y, min_x, max_y\n- Perimeter: 2 times width plus height must be <= 400000\n- C++: read all mackerels, compute min/max x/y, output 4 vertices\n\n### Strategy B: Avoidance Shape (when sardines overlap mackerel area)\n- Build polygon that goes around sardine clusters\n- Example: Start at top-left, go right past first sardine column, down, left past second, etc.\n- Polygon: 6 to 10 vertices tracing around high-density sardine zones\n- C++: sort sardines by x, create zigzag polygon that indents at sardine positions\n\n### Strategy C: Plus Shape (for linear or clustered mackerels)\n- Central rectangle with 4 arms extending in cardinal directions\n- Total 8 vertices: center plus 4 corner adjustments\n- Good when mackerels form a cross or plus pattern\n- C++: compute center, measure arm lengths in each direction\n\n### Strategy D: Multi-Rectangle Union (for irregular clusters)\n- 2 to 4 separate rectangles arranged to capture disjoint mackerel groups\n- Output as a single polygon with notches or use approximation\n- Caution: may violate simplicity if rectangles too far apart\n\n## Phase 3: Validate Before Submitting\nCheck your C++ code produces:\n1. At least 4 vertices, at most 1000\n2. Perimeter calculation <= 400000\n3. All coordinates integers in [0, 100000]\n4. Axis-aligned edges only (each edge has delta_x equals zero or delta_y equals zero)\n5. No self-intersection (simple polygon)\n\n## Phase 4: C++ Implementation Tips\n- Use greedy construction: compute bbox or centroid, build polygon directly\n- No need for complex search if construction is simple\n- Hardcode safe perimeter checks\n- Use integer arithmetic only (avoid floating point)\n- Time limit: keep entire main function under 1.5 seconds\n- Read all fish data in O of N, compute bbox in O of N, output in O of 1 or O of V\n\n## Common Failures to Avoid\n- Forgetting axis-alignment: ensure each consecutive pair of vertices shares either x or y\n- Self-intersection: don't create twisted polygons\n- Perimeter overflow: calculate 2 times width plus height and verify < 400000\n- Timeouts: simple construction beats complex optimization here\n- Invalid coordinates: clamp all values to [0, 100000]\n\n## Testing Your Strategy\n1. Analyze with analyze_geometric_potential first\n2. Pick one strategy (don't try all simultaneously)\n3. Write minimal C++ that implements just that strategy\n4. Evaluate, score approximately 2 to 5 equals valid construction improving on seed\n5. Only then iterate within the strategy"
new_middlewares:
- name: validity_checkpoint
  hook: before_model
  description: "Remind the solver to prioritize geometric validity over optimization. This task scores zero on invalid polygons, so most random edits fail. The middleware injects a warning before generation to keep the focus on correct construction."
  implementation_py: "def before_model(hook_input):\n    best_score = hook_input.get('best_score', 0)\n    if best_score < 5:\n        return 'WARNING: Current score is low (<5). Most edits will score zero if they break polygon validity. Call analyze_geometric_potential FIRST. Design a COMPLETE new polygon shape, not a small edit.'\n    return None"
