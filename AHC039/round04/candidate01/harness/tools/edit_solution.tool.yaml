type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. For this geometric problem, prefer complete
  rewrites over diffs when changing polygon strategies. The structure is fundamental: how you read fish
  data, how you compute candidate polygons, and how you validate constraints. A small diff that tweaks
  an existing invalid polygon will score zero. When stuck, rewrite the whole EVOLVE-BLOCK with a new shape
  strategy.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
