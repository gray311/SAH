type: tool
name: edit_solution
description: 'Change the C++ code in the EVOLVE-BLOCK. Make SPECIFIC, targeted edits:

  - Modify search loop logic, not just variables

  - Adjust mutation strategies, not formatting

  - Fix constraint violations (perimeter, vertex count, axis-alignment)

  - Each edit should be ONE clear improvement idea

  Use SEARCH/REPLACE format for precision.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
