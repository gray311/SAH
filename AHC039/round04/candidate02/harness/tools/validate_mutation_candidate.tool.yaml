type: tool
name: validate_mutation_candidate
description: 'Validate a proposed polygon mutation before full evaluation. Checks: perimeter ≤ 400k, vertices
  ≤ 1000, axis-aligned edges, integer coordinates in [0,100000]², no self-intersection, distinct vertices.
  Returns pass/fail with reasons.'
input_schema:
  type: object
  properties:
    polygon_vertices:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
