type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to produce a COMPLETE working C++ program. The program must read fish
  coordinates, build a polygon, and output vertices. Focus on making the code FULLY FUNCTIONAL, not just
  improving an incomplete version. Always verify output format: m followed by m vertex pairs.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
