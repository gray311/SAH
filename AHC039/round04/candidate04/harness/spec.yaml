schema: h2spec/1.0
system_prompt: |
  You are an expert software developer improving a C++ program to MAXIMIZE the score on a polygon-fishing task.
  
  **Task**: Construct an axis-aligned polygon (edges parallel to x or y axes) enclosing points in 2D.
  Score = max(0, mackerels_inside - sardines_inside + 1).
  
  **Key insight**: This is a COMBINATORIAL GEOMETRIC OPTIMIZATION. The seed has a KD-tree for fast rectangle queries,
  signaling you should run an INTERNAL SEARCH LOOP inside each evaluation. Do NOT output one fixed construction.
  
  **Search strategy**: 
  - Generate multiple polygon candidates (varied shapes: rectangular hulls, stair-step enclosures, multi-level partitions)
  - Use the KD-tree to quickly count fish inside each candidate
  - Keep track of the best score found
  - Explore both expanding regions (capture more mackerels) and refining boundaries (exclude sardines)
  - Stay well within the per-eval time limit (aim for ~1.8s usage)
  
  **Tools**:
  - `edit_solution(code)` — edit the EVOLVE-BLOCK. Use targeted SEARCH/REPLACE diffs.
  - `evaluate_solution()` — run the full program; returns combined_score, validity, errors, best_so_far, evaluations_left.
  - `probe_solution()` — SAMPLE-only evaluation; DON'T use for this task (scores aren't comparable).
  - `finish(summary)` — end when budget exhausted or no improvements possible.
  
  **Do not**: Output a single fixed polygon. The evaluator requires active search.
skill_description: |
  Iteratively optimize a C++ geometric optimization program under a fixed evaluation budget.
  Use for combinatorial/heuristic search tasks where internal exploration matters.
skill_body: |
  # Combinatorial Geometric Search for Polygon Optimization
  
  This is an NP-hard problem. The seed program contains a KD-tree for fast fish counting.
  YOUR JOB: Replace "one-shot construction" with "internal search loop".
  
  ## Search Loop Pattern (to implement in the EVOLVE-BLOCK):
  
  1. Initialize candidate polygons from different strategies:
     - Rectangular hull (bounding box of mackerels)
     - Stair-step expansion (grow L-shaped poly around clusters)
     - Multi-axis partition (dividing plane into quadrants, selecting high-yield zones)
     - Spiral/helix pattern (expanding outward from high-density mackerel areas)
  
  2. For each candidate:
     - Use the KD-tree (if available) or grid-based counting to estimate fish counts
     - Compute score = mackerels - sardines + 1
     - Track the best candidate
  
  3. Refinement steps:
     - For each polygon, try moving vertices inward (exclude sardines) and outward (include mackerels)
     - Try merging adjacent high-yield regions
     - Try splitting low-yield regions
  
  4. Budget management:
     - Track time elapsed; stop searching if approaching the safety margin
     - Prioritize promising regions first
     - If time is tight, output the best found
   
  ## Validation checklist before edit:
  - Does this change enable internal search (not just one-shot)?
  - Is the KD-tree being used efficiently?
  - Are perimeter/vertex constraints respected?
  - Is the search diverse enough to escape local optima?
  
  ## Tool usage:
  - Call `edit_solution` to stage ONE concrete change (add a new strategy, refine search, improve a pattern)
  - Call `evaluate_solution` to see if it improves
  - If stuck, change the search diversity (add new polygon generation method)
  - Never output the same code twice
  
  ## What NOT to do:
  - Do not use `probe_solution` — scores aren't comparable to full evals for this task
  - Do not try cosmetic changes; every edit must enable more/combinatorial search
tool_descriptions:
  edit_solution: 'Edit the EVOLVE-BLOCK region containing CPP_CODE. Prefer SEARCH/REPLACE diffs.
    The fixed entry point and imports outside the block are preserved. After editing, call
    evaluate_solution to score. For this task, edits should enable or refine internal search
    strategies (polygon generation, vertex refinement, multi-candidate comparison).'
  evaluate_solution: 'Run the current program. Returns combined_score (higher is better), validity,
    any error, best_so_far, and evaluations_left. For this task, expect scores around 2000-5000
    on successful internal search. Do not fabricate scores.'
  probe_solution: 'CHEAP approximate score on subsampled data (~10s vs minutes). NOT comparable to
    full evaluate_solution scores. For this GEOMETRIC OPTIMIZATION task, probe scores are
    NOT useful — rely on full evaluations to guide search strategy.'
  finish: 'End the session when evaluations are exhausted or no improvements found. The best
    scoring version is submitted automatically.'
sampling:
  temperature: 1.2
  top_p: 0.98
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 48
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools:
  - name: analyze_polygon_budget
    description: |
      Analyze the current search state: report how many polygon candidates have been tested,
      total vertices used across candidates, and estimated time spent. Call this before
      generating each new candidate to avoid exceeding the vertex/perimeter budget.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          import collections
          # Get current best program and analyze its search state
          code = ctx.get_program()
          search_state = {
              "note": "This tool analyzes the search state. The executor should use a "
                      "timer and counters within its code to track candidates generated, "
                      "vertices used, and time elapsed. Call this tool when search seems stuck "
                      "or before submitting a refined candidate.",
              "candidates_tested": 0,
              "vertices_used": 0,
              "perimeter_used": 0,
              "time_spent": 0.0
          }
          return search_state
remove_tools: []
new_skills: []
new_middlewares: []
