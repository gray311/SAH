type: tool
name: edit_solution
description: Edit the EVOLVE-BLOCK region containing CPP_CODE. Prefer SEARCH/REPLACE diffs. The fixed
  entry point and imports outside the block are preserved. After editing, call evaluate_solution to score.
  For this task, edits should enable or refine internal search strategies (polygon generation, vertex
  refinement, multi-candidate comparison).
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
