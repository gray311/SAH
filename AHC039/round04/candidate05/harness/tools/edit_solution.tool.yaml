type: tool
name: edit_solution
description: 'Change the C++ code in the EVOLVE-BLOCK region. Use targeted SEARCH/REPLACE diffs

  for small mutations. For major changes, provide a full rewrite. Keep the fixed

  entry function intact.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
