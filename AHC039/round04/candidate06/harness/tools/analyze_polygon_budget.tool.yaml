type: tool
name: analyze_polygon_budget
description: 'Calculate perimeter and vertex count for a polygon candidate. Validate constraints (perimeter
  ≤ 400,000, vertices ≤ 1000).

  Call this before building final polygon to catch constraint violations early.'
input_schema:
  type: object
  properties:
    vertices:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
