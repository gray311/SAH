type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. Two formats:

  (1) PREFERRED — targeted SEARCH/REPLACE diffs matching current code exactly.

  (2) Full rewrite — entire EVOLVE-BLOCK as new code.

  Preserves all imports, functions, and main() outside the block.

  For this task: edit polygon construction logic, search parameters, or evaluation order.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
