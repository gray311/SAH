type: tool
name: edit_solution
description: 'Change the code in the EVOLVE-BLOCK region. Either:

  (1) SEARCH/REPLACE diff blocks matching current code exactly, or

  (2) Full rewrite of the EVOLVE-BLOCK body.

  Always call evaluate_solution after editing.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
