type: tool
name: probe_solution
description: 'Run a CHEAP approximate evaluation on ~2000 rows of the dataset.

  Fast (~10s), does NOT consume evaluation budget, but scores are

  approximate. Use this to rank multiple variants before evaluating

  any one variant fully. Generate 3-5 variants, probe all, then

  evaluate only the best 1-2.'
