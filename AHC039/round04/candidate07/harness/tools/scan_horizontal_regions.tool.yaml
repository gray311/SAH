type: tool
name: scan_horizontal_regions
description: 'Perform a horizontal sweep-line analysis to find promising y-bands.

  For each unique y-coordinate in the fish data, count mackerels and sardines.

  Returns a list of {y, mackerel_count, sardine_count, ratio} entries,

  sorted by ratio descending. Use this to identify regions with high

  mackerel density relative to sardines. Call this once at program start.

  Input: none (uses program''s access to fish data internally)

  Output: list of band descriptors for polygon construction'
input_schema:
  type: object
  properties: {}
