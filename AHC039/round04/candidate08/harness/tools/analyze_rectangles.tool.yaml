type: tool
name: analyze_rectangles
description: 'Probe a polygon on subsampled data (~2000 fish). Uses KD-tree for fast rectangle queries.

  Returns approximate score (mackerels - sardines + 1) per test case on sample.


  **Key uses:**

  - Rank 3-5 geometric approaches (rectangle vs strip vs nested) before full eval

  - Verify polygon validity (score=0 means invalid)

  - Quick iteration without consuming evaluation budget


  **Scoring on sample:**

  - 4000-5000: Excellent coverage, likely near-optimal

  - 2000-4000: Good coverage, worth investigating

  - <1000: Poor coverage or potential issues

  - 0: Invalid polygon (constraint violation)


  Does NOT consume the 20 full evaluation budget - you have 30 probe budget.'
input_schema:
  type: object
  properties: {}
