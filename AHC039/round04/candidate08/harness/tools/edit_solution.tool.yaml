type: tool
name: edit_solution
description: "Change the EVOLVE-BLOCK containing C++ code. For geometric problems, prefer:\n- Targeted\
  \ diffs: Fix the polygon constructor, strip builder, or rectangle merger\n- Full rewrites: When switching\
  \ to a new geometric approach (e.g., rectangles → strips)\n\nPreserve: Fixed entry function, imports,\
  \ and program structure. Only the EVOLVE-BLOCK changes.\n\nOutput format must remain:\n  m\n  x0 y0\n\
  \  ...\n  x{m-1} y{m-1}\n\nAfter editing, call analyze_rectangles (probe) before evaluate_solution (full\
  \ eval)."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
