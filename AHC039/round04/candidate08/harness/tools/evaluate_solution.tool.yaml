type: tool
name: evaluate_solution
description: 'Run the C++ program on the task evaluator. Returns:

  - combined_score: Total score across 150 test cases (max possible ≈ 750,000)

  - validity: 1 if all constraints satisfied, 0 otherwise (0 means score 0)

  - error: Compiler/runtime error if any


  **Budget**: 20 evaluations max. Use probes first!


  A score of 5000 per test case × 150 cases = 750,000 is the theoretical maximum

  (all mackerels, no sardines). Your seed scores ~2.5, suggesting the evaluator

  reports normalized score (score / max_possible).'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
