type: tool
name: check_polygon
description: 'For a given polygon, quickly check: 1) if perimeter <= 400000, 2) if it''s non-self-intersecting
  (approx), 3) return early on violation. Avoid running full point-in-polygon scoring — just check constraints.
  Use O(m log m) or O(m) for non-intersection check with a simple sweep-line on vertices only.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: 'The full EVOLVE-BLOCK C++ code as a string. The tool will search for the polygon vertex
        list (the "vertices" or "poly" vector of Points) inside that code.

        '
