type: tool
name: edit_solution
description: 'Modify the C++ EVOLVE-BLOCK. For this task, changes should implement:

  1. Pre-call analyze_fish_layout in main

  2. Generate polygon candidates from its bounding boxes

  3. Use KD-tree for efficient range queries

  4. Score all candidates, output the best'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
