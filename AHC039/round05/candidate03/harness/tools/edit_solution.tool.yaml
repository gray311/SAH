type: tool
name: edit_solution
description: 'Change the code in # EVOLVE-BLOCK. Use SEARCH/REPLACE diffs for small changes, or full rewrite
  for structural changes. The fixed entry point (main with CPP_CODE variable) must stay intact. After
  editing, call evaluate_solution to score.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
