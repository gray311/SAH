type: tool
name: edit_solution
description: Modify the C++ code in the EVOLVE-BLOCK region. Keep the fixed entry function and preserve
  KD-tree structures if useful. Each edit should implement ONE concrete geometric strategy (e.g., change
  bounding box logic, try multiple seed points, vary cluster merging). Prefer targeted SEARCH/REPLACE
  diffs.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
