type: tool
name: analyze_fish_distribution
description: 'Analyze the spatial distribution of mackerels vs sardines in the input.

  Returns cluster information including: bounding boxes of dense regions,

  mackerel-rich vs sardine-rich areas, and suggested polygon sub-regions.

  This helps guide where to focus the polygon construction to maximize

  mackerel capture while minimizing sardine capture.

  IMPORTANT: This is a PRE-EVAL tool - it uses ctx methods but does NOT

  call ctx.evaluate(), so it does not consume your evaluation budget.'
input_schema:
  type: object
  properties: {}
