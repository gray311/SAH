type: tool
name: edit_solution
description: Edit the EVOLVE-BLOCK region in the C++ code. Use SEARCH/REPLACE diffs for targeted changes,
  or full rewrites for major changes. Preserve the fixed entry function and external structure.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
