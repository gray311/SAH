type: tool
name: edit_solution
description: 'Modify C++ code in EVOLVE-BLOCK. Use SEARCH/REPLACE diffs or full rewrites.

  Entry function and imports outside the block are preserved.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
