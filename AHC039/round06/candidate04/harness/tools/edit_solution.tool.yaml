type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. Two accepted formats: (1) PREFERRED —
  one or more targeted SEARCH/REPLACE diff blocks. (2) A full rewrite — the complete new EVOLVE-BLOCK
  body. The fixed entry function and imports outside the block are preserved automatically.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
