type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK region. Prefer targeted SEARCH/REPLACE diffs over full rewrites.

  The program must implement a complete C++ solution with an internal bounded search loop.

  Focus on algorithmic improvements: change the search strategy, add grid analysis, or

  optimize the validity checks. Each edit should be a concrete hypothesis about better polygon construction.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
