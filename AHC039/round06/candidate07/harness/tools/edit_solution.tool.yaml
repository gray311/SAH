type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK region. Use SEARCH/REPLACE diffs for targeted edits, or full rewrite
  for major changes.

  Keep the fixed entry point (main()) and preserve program structure.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
