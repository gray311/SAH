type: tool
name: edit_solution
description: 'Change code in EVOLVE-BLOCK region. Use SEARCH/REPLACE diffs for targeted edits.

  After editing, call evaluate_solution to score. Best version is automatically kept.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
