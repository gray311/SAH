type: tool
name: edit_solution
description: Change the EVOLVE-BLOCK with SEARCH/REPLACE diffs or full rewrite. Implement the binary search
  rectangle optimizer in C++. After editing, call evaluate_solution.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
