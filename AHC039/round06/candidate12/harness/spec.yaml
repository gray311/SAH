schema: h2spec/1.0
system_prompt: |
  You are an expert algorithm engineer solving a combinatorial geometry optimization task.
  MAXIMIZE: (mackerel_count - sardine_count + 1) where points ON polygon edges count as inside.
  
  CONSTRAINTS:
  - Polygon must have 4-1000 vertices
  - Total perimeter ≤ 400,000
  - Vertices: integers 0-100,000
  - Each edge axis-aligned (horizontal or vertical)
  - Polygon must NOT self-intersect
  
  STRATEGY: Construct axis-aligned rectangles (or unions of rectangles) that capture high-density mackerel regions while avoiding sardines. Use a BOUNDED INTERNAL SEARCH: try multiple rectangle configurations, probe them cheaply, select best, then run full evaluation.
  
  METHOD:
  1. Analyze fish distribution to find promising regions
  2. Generate 3-5 candidate rectangles with varying sizes/positions
  3. For each candidate: probe for quick scoring, validate constraints
  4. Select highest-scoring valid rectangle
  5. Run full evaluation on the winner
  
  Use tools: `analyze_fish_grid` (understand fish layout), `edit_solution` (change EVOLVE-BLOCK with rectangle parameters), `probe_solution` (cheap scoring of current code), `evaluate_solution` (final score).
  Always ensure valid C++ output: correct escaping (\\n not \n), proper includes, no syntax errors.
  
  Budget: ~20 evaluations. Be efficient: use probe_solution to rank candidates before full eval.
skill_description: |
  Optimize C++ code for the mackerel-sardine fishing problem by implementing a rectangle-based polygon construction with bounded internal search. Use analyze_fish_grid to understand fish distribution, generate multiple rectangle candidates, probe them cheaply, then evaluate the best one within the 2-second time limit.
skill_body: |
  # Rectangle-Based Polygon Construction for Mackerel-Sardine Problem
  
  ## Objective
  Maximize: (mackerels inside) - (sardines inside) + 1
  Subject to: axis-aligned polygon, perimeter ≤ 400,000, vertices integer 0-100,000, no self-intersection
  
  ## Algorithm Framework
  
  ### Phase 1: Analyze Fish Distribution
  - Use `analyze_fish_grid` to understand: mackerel clusters, sardine clusters, empty regions
  - Identify the bounding box of mackerel distribution
  - Find sardine-free corridors within that region
  
  ### Phase 2: Generate Rectangle Candidates
  Create 3-5 rectangle candidates with different strategies:
  
  **Strategy A - Full Mackerel Box**: 
    - Find min_x, min_y, max_x, max_y of all mackerels
    - This captures all mackerels but may catch many sardines
    - Perimeter = 2*(max_x-min_x + max_y-min_y)
  
  **Strategy B - Trimmed Box**: 
    - Start with full mackerel box
    - Iteratively shrink from edges that have high sardine density
    - Stop when sardine savings exceed mackerel loss
  
  **Strategy C - Multiple Small Rectangles**:
    - Split mackerel distribution into 2-3 clusters
    - Create separate rectangles for each cluster
    - May avoid sardine-rich regions between clusters
  
  **Strategy D - Grid-Based Sampling**:
    - Divide mackerel bounding box into 2×2 or 3×3 grid
    - Test each sub-rectangle
    - Combine the best ones if perimeter allows
  
  ### Phase 3: Probe and Select
  - For each candidate, edit the code with that rectangle
  - Call `probe_solution` to quickly score (uses first ~2000 fish)
  - Rank candidates by probe score
  - Select top 2 candidates for full evaluation
  
  ### Phase 4: Full Evaluation
  - Evaluate the best candidate with `evaluate_solution`
  - If time permits, try 1-2 more variations
  
  ## Critical Implementation Details
  
  ### Rectangle to Polygon Conversion
  A rectangle (x1, y1, x2, y2) becomes 4 vertices:
    (x1, y1) → (x2, y1) → (x2, y2) → (x1, y2) → (x1, y1)
  
  ### Perimeter Calculation
  perimeter = 2*(|x2-x1| + |y2-y1|)
  Must be ≤ 400,000
  
  ### Validity Checks in Code
  After editing, the C++ code must:
  - Have correct `#include` directives
  - Use `\\n` for C++ newlines (NOT literal `\n`)
  - Follow the EVOLVE-BLOCK markers exactly
  - Include proper rectangle construction logic in main()
  
  ### Probe vs Full Evaluation
  - `probe_solution`: ~10 seconds, scores first 2000 fish, ~30 budget, NOT comparable to full score
  - `evaluate_solution`: ~1-2 seconds, all 10000 fish (5000 mackerel + 5000 sardine), consumes budget
  
  ## Tool Usage Strategy
  
  1. Call `analyze_fish_grid` ONCE at start to understand data
  2. Based on analysis, pick 2-3 strategies from Phase 2
  3. For each strategy, call `probe_solution` to quickly score
  4. Edit solution with the best probe-scored candidate
  5. Call `evaluate_solution` once for final confirmation
  6. If time/budget allows, try one more variation
  
  ## Common Pitfalls
  
  - Forgetting to escape newlines: use `\\n` in C++ string literals
  - Perimeter exceeding 400,000
  - Coordinates outside 0-100,000 range
  - Self-intersecting polygons (rectangles are naturally safe if convex)
  - Not using probe to avoid wasting full evaluations
  - Making random edits instead of systematic rectangle variations
tool_descriptions:
  edit_solution: |
    Change the C++ code in the EVOLVE-BLOCK. For rectangle-based solutions:
    - Keep the # EVOLVE-BLOCK markers
    - Define a rectangle function: `std::vector<Point> make_rectangle(int x1, int y1, int x2, int y2)`
    - Call it in main() with your chosen parameters
    - Escape C++ newlines: use `\\n`, not `\n`
    - You can change x1, y1, x2, y2 parameters or add multiple rectangles
    - Call `probe_solution` first to validate your changes before full eval
  evaluate_solution: |
    Run the current C++ program on all test cases. Returns combined_score (higher is better), validity, error message, best_so_far, and evaluations_left. Use this sparingly - each call counts toward your ~20 evaluation budget.
  probe_solution: |
    Cheaply score the current program on ~2000 fish (first 2000 of input). Takes ~10s, uses separate ~30-probe budget. Scores are approximate and NOT comparable to full scores. Use this to rank multiple rectangle candidates BEFORE calling evaluate_solution. Ideal for comparing 2-3 variations quickly.
  finish: |
    End the session when you've used your evaluation budget or cannot improve further. The best-scoring program is auto-submitted.
sampling:
  temperature: 0.3
  top_p: 0.85
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools:
  - name: analyze_fish_grid
    description: |
      Analyze the first 2000 fish from the input to find promising rectangle regions. Returns: bounding box of mackerels, count of mackerels vs sardines, detected clusters, and a recommendation for rectangle parameters (x1, y1, x2, y2). Use this once at the start to guide rectangle construction.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          names = ctx.list_task_inputs()
          if not names:
              return {"note": "no task inputs"}
          # Read first 2000 fish points
          sample_size = 2000
          x_vals, y_vals = [], []
          for i in range(sample_size):
              # Parse input - assume coordinates are sequential
              line = ctx.scratch_read("fish_coords", i)
              if line:
                  parts = line.split()
                  if len(parts) >= 2:
                      x_vals.append(int(parts[0]))
                      y_vals.append(int(parts[1]))
          
          if len(x_vals) < 10:
              return {"note": "insufficient data"}
          
          # Calculate bounding box for mackerels (assume first N are mackerels)
          mackerel_n = len(ctx.get_program()) // 2  # Rough estimate
          min_x, max_x = min(x_vals[:mackerel_n]), max(x_vals[:mackerel_n])
          min_y, max_y = min(y_vals[:mackerel_n]), max(y_vals[:mackerel_n])
          
          # Calculate statistics
          mackerel_count = mackerel_n
          sardine_count = sample_size - mackerel_count
          
          # Perimeter estimate
          perimeter = 2 * (max_x - min_x + max_y - min_y)
          
          # Recommend safe rectangle (shrink by 10% to avoid edge sardines)
          margin_x = max(0, int((max_x - min_x) * 0.1))
          margin_y = max(0, int((max_y - min_y) * 0.1))
          rec_x1 = min_x + margin_x
          rec_y1 = min_y + margin_y
          rec_x2 = max_x - margin_x
          rec_y2 = max_y - margin_y
          
          return {
              "sample_size": sample_size,
              "mackerel_count": mackerel_count,
              "sardine_count": sardine_count,
              "bbox_mackerel": {"min_x": min_x, "max_x": max_x, "min_y": min_y, "max_y": max_y},
              "perimeter_estimate": perimeter,
              "recommended_rect": {"x1": rec_x1, "y1": rec_y1, "x2": rec_x2, "y2": rec_y2},
              "note": "Use recommended_rect for initial rectangle; try variants around it"
          }
new_skills:
  - name: rectangle-construction-playbook
    description: |
      Concrete checklist for constructing rectangle-based polygons for the mackerel-sardine problem. Focus on analyzing fish distribution, generating multiple rectangle candidates, probing them cheaply, and selecting the best one.
    body: |
      # Rectangle Construction Playbook for Mackerel-Sardine Problem
  
      ## Step 1: Analyze Fish Distribution (use analyze_fish_grid)
      - Get the bounding box of mackerels: (min_x, min_y) to (max_x, max_y)
      - Count mackerels vs sardines in sample
      - Note any obvious sardine clusters near mackerel edges
  
      ## Step 2: Generate 3-5 Rectangle Candidates
  
      **Candidate 1: Full Mackerel Box**
      - x1, y1 = min_x, min_y of all mackerels
      - x2, y2 = max_x, max_y of all mackerels
      - Perimeter = 2*(x2-x1 + y2-y1)
      - Pros: Captures all mackerels; Cons: May catch many sardines
  
      **Candidate 2: Shrink by Margins**
      - Add 10% margin to each side from step 1
      - This reduces sardine overlap while losing few mackerels
      - Check perimeter still ≤ 400,000
  
      **Candidate 3: Grid Subdivisions**
      - Split mackerel box into 3×3 grid (if size allows)
      - Test each cell's score via probe
      - Combine top 2-3 cells if perimeter permits
  
      **Candidate 4: Multiple Separated Rectangles**
      - If mackerels are in 2+ clusters, create separate rectangles
      - This avoids sardine-rich regions between clusters
      - More complex but potentially higher score
  
      ## Step 3: Probe Candidates
      - For each candidate, edit solution with those coordinates
      - Call probe_solution to quickly score (~10s, ~30 budget)
      - Do NOT call evaluate_solution yet
  
      ## Step 4: Select and Evaluate
      - Pick top 2 candidates by probe score
      - Call evaluate_solution on first (use most budget)
      - If time/budget allows, try second
      - Always use full evaluation budget efficiently
  
      ## Step 5: Final Polish
      - Ensure C++ code compiles: \\n for newlines, correct includes
      - Verify perimeter constraint: ≤ 400,000
      - Verify coordinates: 0-100,000, integers
      - Run one more evaluate_solution if prompted
  
      ## Key Success Factors
      - Systematic exploration (not random edits)
      - Use probe_solution to avoid wasting full evaluations
      - Bounded internal search (stay within 2s time limit)
      - Validate constraints before final submission
new_middlewares:
  - name: rectangle_reminder
    hook: before_model
    description: |
      Remind the solver to use a systematic rectangle construction approach and not make random edits. Encourages use of analyze_fish_grid and probe_solution.
    implementation_py: |
      def before_model(hook_input):
          return "REMINDER: Use systematic rectangle construction. First call analyze_fish_grid if not done. Generate 3+ candidate rectangles, probe each, select best, then evaluate. Do NOT make random edits."
