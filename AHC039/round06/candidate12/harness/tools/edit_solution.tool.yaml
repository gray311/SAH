type: tool
name: edit_solution
description: 'Change the C++ code in the EVOLVE-BLOCK. For rectangle-based solutions:

  - Keep the # EVOLVE-BLOCK markers

  - Define a rectangle function: `std::vector<Point> make_rectangle(int x1, int y1, int x2, int y2)`

  - Call it in main() with your chosen parameters

  - Escape C++ newlines: use `\\n`, not `\n`

  - You can change x1, y1, x2, y2 parameters or add multiple rectangles

  - Call `probe_solution` first to validate your changes before full eval'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
