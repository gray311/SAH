type: tool
name: probe_solution
description: Cheaply score the current program on ~2000 fish (first 2000 of input). Takes ~10s, uses separate
  ~30-probe budget. Scores are approximate and NOT comparable to full scores. Use this to rank multiple
  rectangle candidates BEFORE calling evaluate_solution. Ideal for comparing 2-3 variations quickly.
