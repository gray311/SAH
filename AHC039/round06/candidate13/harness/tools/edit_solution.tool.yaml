type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK region containing the C++ polygon constructor.

  PREFERRED: Use targeted SEARCH/REPLACE diffs to modify specific functions.

  Full rewrites allowed for major strategy changes.

  Keep the fixed entry function and imports outside the block unchanged.

  Each call generates one candidate version for subsequent probing/evaluation.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
