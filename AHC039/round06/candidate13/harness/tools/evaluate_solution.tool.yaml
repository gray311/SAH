type: tool
name: evaluate_solution
description: 'Run the current program on ALL 150 test cases. Returns combined_score (average per test,
  higher=better),

  validity (1=valid output, 0=invalid/error), error message, best_so_far score, and evals_remaining.

  CONSUMES 1 evaluation call from your 30-call budget.

  Use sparingly - rank candidates with probe_solution first.'
