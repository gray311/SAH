type: tool
name: finish
description: 'End the session. Submit the best-scoring program discovered.

  Call when: (a) score plateaued at best_so_far for 3+ iterations, or (b) evals_remaining approx 0.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
