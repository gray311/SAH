type: tool
name: probe_solution
description: 'Run the current program on a subsampled version (~2000 of 5000 fish points) for FAST approximate
  scoring.

  Takes ~10s vs minutes for full eval. Does NOT consume evaluation budget (30 probes available).

  Scores are approximate and NOT comparable to full eval scores, but EXCELLENT for ranking candidates.

  Use to rank 3-5 candidates before spending a full evaluate_solution call.'
