schema: h2spec/1.0
system_prompt: "You are an expert competitive programmer optimizing a C++ polygon construction solver.\n\nTASK: Given N mackerels (type 1) and N sardines (type -1), construct an axis-aligned polygon that maximizes (mackerels_inside - sardines_inside + 1).\n\nCONSTRAINTS:\n- Max 1000 vertices, max perimeter 400000\n- Edges must be axis-aligned (horizontal or vertical only)\n- Coordinates: integers 0-100000\n- No self-intersections\n- Output format: m (vertex count), then m lines of (x y)\n\nSTRATEGY:\n1. The seed code has good structure - KD-tree for fast fish queries and timer for bounded search\n2. Start with bounding box of all mackerels, then try variations\n3. Key improvements to try: (a) larger rectangles covering more mackerels, (b) sardine-avoiding shapes, (c) better search bounds\n4. Time-bound search: each eval must complete in ~1.0-1.5s (0.1s safety margin from 2.0s limit)\n5. If score drops, REVERT to best_so_far and try a DIFFERENT polygon construction approach\n\nMETHOD:\n- Call analyze_fish to understand spatial distribution patterns\n- Edit to try: different rectangle sizes/positions, multi-rectangle unions, centroid-based construction\n- Always ensure code compiles and runs within time limit\n- Use SEARCH/REPLACE for targeted changes; full rewrite only for major strategy shifts\n- Budget: ~30 evals. Each edit should be a clear hypothesis about better polygon construction.\n- Call analyze_fish after major strategy changes to re-evaluate approach."
tool_descriptions:
  edit_solution: 'Modify the C++ EVOLVE-BLOCK region. Use targeted SEARCH/REPLACE for small changes (e.g., modifying polygon construction algorithm, search loop bounds, or scoring logic). Preserve the fixed entry function and output format. Each edit should implement ONE concrete hypothesis about better polygon construction. Code must compile and run within 1.9s.'
  evaluate_solution: 'Run the C++ program on all 150 test cases. Returns combined_score (higher is better), validity (0 if constraint violated or error), any error message, best_score_so_far, and evaluations_remaining. Budget: 30 evaluations. Each evaluation ~0.8-1.8s time.'
  probe_solution: 'Quickly score the CURRENT program on subsampled data (~10s). Does NOT consume the evaluation budget. Scores are approximate and NOT comparable to full evaluate_solution scores. Use this to rank your own code variants before committing to a full evaluation.'
  finish: 'End the session. Call this when your evaluation budget is exhausted or you cannot improve the best score. The best-scoring program is submitted automatically.'
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 30
  max_tokens: 10240
agent:
  max_iterations: 36
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools:
  - name: analyze_fish
    description: |
      Analyze the spatial distribution of fish in the current task instance. Returns bounding box 
      of all fish, centroid calculations for mackerels and sardines, and a specific recommendation 
      for initial polygon construction. This helps guide where to place your axis-aligned polygon 
      to maximize mackerel capture while minimizing sardine capture. Call once at the start to 
      plan your approach, then again after major strategy changes.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          try:
              # Access the program's best solution to understand what we're working with
              best_code = ctx.get_best_program()
              
              # The task is to find optimal axis-aligned polygon
              # Return heuristic guidance based on typical task characteristics
              
              return {
                  "task_type": "fish_polygon_optimization",
                  "recommended_approach": "bounding_box_with_sardine_exclusion",
                  "heuristic": "Start with minimal bounding box of mackerels, then expand to cover more while avoiding sardine clusters",
                  "key_strategies": [
                      "1. Bounding box of all mackerels - covers 100% of mackerels",
                      "2. Centroid-centered rectangle - balances coverage",
                      "3. L-shaped polygon - excludes sardine regions",
                      "4. Multi-rectangle union - flexible coverage with perimeter constraints"
                  ],
                  "constraints_reminder": {
                      "max_vertices": 1000,
                      "max_perimeter": 400000,
                      "edge_alignment": "axis_parallel_only",
                      "coordinate_range": "0_to_100000"
                  }
              }
          except Exception as e:
              return {
                  "error": str(e),
                  "recommended_approach": "bounding_box_with_sardine_exclusion",
                  "heuristic": "Start with minimal bounding box of mackerels"
              }
new_skills:
  - name: polygon-construction-checklist
    description: |
      Practical checklist for constructing axis-aligned polygons to maximize mackerel - sardine score in the fishery task. Use this when designing/editing C++ code.
    body: |
      # Axis-Aligned Polygon Construction - Practical Guide

      ## Understanding the Problem
      - Score = max(0, mackerels_inside - sardines_inside + 1)
      - Each mackerel captured: +1 point
      - Each sardine captured: -1 point (released back)
      - Goal: maximize the net difference (a - b + 1 where a=mackerels, b=sardines)

      ## Initial Strategy: Bounding Box of Mackerels
      1. Find min_x, max_x, min_y, max_y of ALL mackerels (not all fish)
      2. Create rectangle: vertices at (min_x, min_y), (max_x, min_y), (max_x, max_y), (min_x, max_y)
      3. This rectangle covers 100% of mackerels but may also catch sardines
      4. Calculate score and use as your baseline

      ## Optimization: Avoid Sardines
      1. Consider "L-shaped" or "U-shaped" polygons that wrap around sardine clusters
      2. Use multiple smaller rectangles instead of one large rectangle
      3. Test two variants: (a) full mackerel rectangle, (b) sardine-excluding variant
      4. Choose the one with better score

      ## Time Management (CRITICAL)
      - Total time limit: 2.0 seconds with 0.1s safety margin
      - Each evaluation should complete in 0.8-1.5 seconds
      - If code approaches timeout, output current best polygon immediately
      - Use simple data structures: std::vector instead of heavy containers
      - Limit search iterations: 10-50 max (not 1000+)
      - Add early exit if time limit approached

      ## Polygon Validity Checks
      - Edges must be axis-aligned (dx=0 OR dy=0, not both nonzero)
      - Max 1000 vertices (4-1000 is acceptable)
      - Max perimeter 400,000 (calculate before output)
      - No self-intersection (axis-aligned rectangles don't intersect themselves)
      - All vertices must have distinct coordinates

      ## Common C++ Patterns
      ```cpp
      // Simple axis-aligned rectangle
      std::vector<Point> poly = {
          {min_x, min_y}, 
          {max_x, min_y}, 
          {max_x, max_y}, 
          {min_x, max_y}
      };
      // Check perimeter
      long long perim = 2LL * (max_x - min_x) + 2LL * (max_y - min_y);
      if (perim > 400000) { /* adjust coordinates */ }
      ```

      ## Recovery When Score Drops
      1. Note the current score and validity
      2. REVERT to best_so_far program immediately
      3. Try a DIFFERENT polygon construction strategy entirely
      4. Don't keep tweaking the same failing approach
      5. Use analyze_fish to understand what went wrong

      ## Search Loop Design
      - Outer loop: try different polygon shapes/strategies (5-10 variants)
      - For each variant, construct polygon and evaluate
      - Keep track of best score and corresponding polygon
      - Use timer to ensure each eval completes in time
      - If time limit approached, output current best immediately

      ## Quick Score Estimation (for debugging)
      - Manually calculate expected score from your polygon
      - Check: does polygon cover all known mackerel coordinates?
      - Check: how many sardine coordinates fall inside?
      - This helps diagnose if C++ implementation is correct
