type: tool
name: edit_solution
description: Modify the C++ EVOLVE-BLOCK region. Use targeted SEARCH/REPLACE for small changes (e.g.,
  modifying polygon construction algorithm, search loop bounds, or scoring logic). Preserve the fixed
  entry function and output format. Each edit should implement ONE concrete hypothesis about better polygon
  construction. Code must compile and run within 1.9s.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
