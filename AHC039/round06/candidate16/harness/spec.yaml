      // Returns 6 vertices: bounding box minus bottom-left or top-right corner
  }

  // Local refinement: try edge perturbations
  vector<Point> refine_polygon(const vector<Point>& poly, int max_delta) {
      // Try moving each edge by ±delta, keep best
  }
  ```

  ## Common Pitfalls
  - Don't search indefinitely - use timeout!
  - Don't forget to output a VALID polygon (non-self-intersecting, axis-aligned)
  - Don't hardcode a single polygon - search actively
  - Don't ignore sardines - subtracting them hurts score significantly
  - Watch perimeter constraint (400,000 max)

  ## Evaluation Feedback Loop
  - If validity=0: fix the polygon construction bug
  - If score < expected: try different polygon shapes
  - If timeout: reduce search iterations or use faster counting
  - If score > baseline: exploit by refining further
tool_descriptions:
  edit_solution: |
    Change the C++ code in the EVOLVE-BLOCK. Targeted SEARCH/REPLACE diffs preferred.
    For this task, focus on: adding spatial indexing, refining polygon search loop,
    adding L-shaped/stepped polygon constructors. Keep EVOLVE-BLOCK markers and I/O format.
  evaluate_solution: |
    Run the C++ program. Returns combined_score (higher is better for mackerels-sardines+1),
    validity (0 if polygon invalid or program errors), and remaining evaluations (budget=30).
    Each evaluation runs the full 2.0s search. Use feedback to improve polygon construction.
  probe_solution: |
    NOT useful for this task - evaluation is fast enough with grid counting. Full scores are needed.
  finish: |
    End when you find a consistently high-scoring polygon or exhaust the 30 evaluations.
