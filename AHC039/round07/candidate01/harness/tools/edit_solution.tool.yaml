type: tool
name: edit_solution
description: 'Modify C++ code in EVOLVE-BLOCK. Focus on:

  1. Adding cluster analysis at startup

  2. Implementing stepped polygon constructor

  3. Adding L-shaped polygon variant

  4. Implementing time-based search loop (0.1s analysis, 1.5s refinement)

  5. Grid-based fast counting for rapid scoring

  Always preserve EVOLVE-BLOCK markers and exact I/O format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
