type: tool
name: quick_score_rect
description: 'Quickly score a rectangular polygon using grid approximation (not full eval).

  Returns approximate (mackerels - sardines) count for a given bounding box.

  Use for rapid comparison of multiple rectangle candidates before full evaluation.'
input_schema:
  type: object
  properties:
    min_x:
      type: integer
    max_x:
      type: integer
    min_y:
      type: integer
    max_y:
      type: integer
