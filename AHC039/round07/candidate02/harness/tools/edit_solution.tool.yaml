type: tool
name: edit_solution
description: 'Modify the C++ code to implement rectangle-union search.

  Key changes:

  - Add Rectangle struct and list

  - Implement grid-based fish counting

  - Implement expand-outwards rectangle construction

  - Implement hill climbing loop to optimize rectangle combinations

  - Ensure output format: num_rectangles, then each rectangle as x1 y1 x2 y2, then convert to polygon
  vertices


  Preserve EVOLVE-BLOCK markers. Search actively within time limit.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
