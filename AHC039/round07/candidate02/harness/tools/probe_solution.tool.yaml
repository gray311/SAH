type: tool
name: probe_solution
description: 'Quick approximate scoring for a rectangle configuration.

  Uses 20% subsample of fish for fast counting (~10s vs 20s for full eval).

  Separate budget of 30 probes available.


  Use probe_solution to:

  - Rank multiple rectangle combinations before full evaluation

  - Test small modifications without consuming full eval budget

  - Quickly eliminate poor configurations'
