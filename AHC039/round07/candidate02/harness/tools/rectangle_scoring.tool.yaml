type: tool
name: rectangle_scoring
description: 'Score a specific rectangle union configuration.

  Validates constraints, counts fish in each rectangle, computes total score.

  Use to evaluate candidate rectangle combinations before full evaluation.'
input_schema:
  type: object
  properties:
    rectangles:
      type: array
      items:
        type: object
        properties:
          x1:
            type: integer
          y1:
            type: integer
          x2:
            type: integer
          y2:
            type: integer
