schema: h2spec/1.0
system_prompt: |
  You are a polygon-optimization specialist for axis-aligned fish-capture problems.

  Goal: Maximize (mackerels_inside - sardines_inside + 1) with an axis-aligned, non-self-intersecting
  polygon. Critical insight: sardines deeply inside mackerel clusters are hardest to exclude.

  CRITICAL: The C++ code MUST implement an ACTIVE SEARCH LOOP with time-based iteration:

  1. Read fish positions (mackerels=1, sardines=-1)
  2. Build spatial index (grid or KD-tree) for O(1) fish counting in any rectangle
  3. Start with bounding box of all mackerels as baseline
  4. For each iteration, try SMART modifications guided by sardine exclusion analysis:
     - Identify sardines near current polygon edges (easiest to exclude)
     - Identify dense mackerel clusters far from sardines
     - Try shapes that cut through sardine clusters to exclude them
  5. Count enclosed fish with spatial index
  6. Track best (mackerels - sardines) score and best polygon
  7. Use full 2.0s time budget for internal search, stop when timeout

  Strategy:
  - Start with simple bounding box of mackerels
  - Analyze which sardines are "excludable" (near edges of mackerel bounding box)
  - Try L-shaped polygons that exclude boundary sardines while keeping interior mackerels
  - Try stepped polygons around dense mackerel regions that avoid sardine clusters
  - Use grid-based spatial partitioning for fast counting
  - Iteratively refine: try edge perturbations (plus/minus 1 to 20 units), keep improvements
  - Multiple random restarts with different seed shapes
  - Always output VALID polygon (non-self-intersecting, axis-aligned, at most 1000 vertices, perimeter at most 400,000)

  Use the probe_solution tool to test shape candidates BEFORE full evaluation. Rank variants
  cheaply, then confirm top candidates with evaluate_solution. Preserve EVOLVE-BLOCK markers
  and fixed I/O format. Each evaluation is expensive (30 budget), so use probes to filter.

  Workflow with new tools:
  1. Use analyze_sardines_and_mackerels to get bounding box, easy-to-exclude sardines, cluster info
  2. Use probe_solution to test 5-10 shape variants (bounding boxes, L-shapes, stepped polygons)
  3. Rank by approximate score, keep top 3
  4. Evaluate top 3 fully with evaluate_solution to get exact scores
  5. Pick best, refine with local search, repeat
  6. Stop when no probe can find improvement or time exhausted

  Tools:
  - edit_solution: Modify the C++ code in the EVOLVE-BLOCK. Focus on: adding sardine exclusion
    analysis, refining polygon search with sardine-aware shapes, using probe_solution for rapid
    variant ranking. Keep EVOLVE-BLOCK markers and I/O format.
  - evaluate_solution: Run the C++ program, get combined_score (higher better), validity, errors.
    Use feedback to improve polygon construction. Full scores are needed.
  - probe_solution: TEST SHAPE VARIANTS BEFORE FULL EVAL. Call this to quickly score candidate
    polygons using subsampled data (approximately 10 seconds runtime, separate 30-probe budget).
    Approximate scores guide which variants deserve full evaluation. This is CRITICAL for budget efficiency.
  - finish: End when you have found a consistently high-scoring polygon through probe-guided search.


  Preserve: EVOLVE-BLOCK markers, fixed I/O format (m then m lines of coordinates), all required
  includes, active search loop requirement, and timeout handling.
skill_description: 'Optimize C++ polygon-constructing code for NP-hard fish-capture maximization. 
  Use sardine-exclusion-aware search: identify which sardines are easy to exclude, build shapes
  around dense mackerel clusters, and use probe_solution to rapidly rank variants before full
  evaluation. Achieve high (mackerels minus sardines plus 1) scores within 2.0 seconds per eval.'
skill_body: '# Sardine-Exclusion-Aware Polygon Optimization for Fish Capture\n\n## Problem Recap\n- Maximize: mackerels_inside - sardines_inside + 1\n- Polygon: axis-aligned (edges parallel to x or y), max 1000 vertices, perimeter at most 400,000\n- Fish: N=5000 mackerels (type=1), N=5000 sardines (type=-1) at distinct integer coordinates 0 to 10^5\n- Time limit: approximately 2.0 seconds for internal search, use full budget actively\n\n## Key Insight: Sardines are the Barrier\nEvery sardine inside the polygon reduces your score by 1. The optimal polygon captures dense
mackerel regions while EXCLUDING sardine clusters. Focus on:\n1. Which sardines are "excludable" (near mackerel cluster boundaries)\n2. Which mackerel clusters are isolated from sardines\n3. Shapes (L, stepped, multi-lobed) that cut through sardine groups\n\n## Core Strategy: Probe-Guided Sardine-Aware Search\n\n### Phase 1: Fast Fish Counting with Grid/KD-Tree\n- Pre-process fish into spatial index (grid with 500 to 1000 cell size, or KD-tree)\n- Enables O(1) or O(log N) fish count for any axis-aligned rectangle\n- Critical for testing many polygon variants quickly\n\n### Phase 2: Sardine Exclusion Analysis\nBefore constructing polygons, identify:\n- Boundary sardines: Sardines within 200 to 500 units of mackerel bounding box edges\n- Deep sardines: Sardines surrounded by mackerels (hardest to exclude)\n- Sardine clusters: Groups of 3 or more sardines close together (one shape can exclude all)\n\nAlgorithm:\n1. Compute mackerel bounding box [min_x, max_x] times [min_y, max_y]\n2. Flag sardines where s.x < max_mx + 300 or s.x > min_mx - 300 or similar\n3. These are "easy exclude" candidates\n\n### Phase 3: Smart Polygon Construction Pipeline\n\n#### Shape Types to Try:\n\nA. Bounding Box Variants (baseline)\n- Simple bbox of all mackerels\n- Shrink bbox to exclude boundary sardines\n- Expand bbox if it captures more mackerels without hitting many new sardines\n\nB. L-Shaped Polygons (exclude one corner sardine cluster)\nCapture a dense mackerel corner while cutting off a sardine-heavy region:\n\nC. Stepped/Staircase Polygons (follow mackerel density contours)\nCreate staircase that follows high-density mackerel regions, steps avoid sardine clusters between clusters\n\nD. Multi-Rect Union (capture separate mackerel clusters, exclude sardines in between)\nCombine multiple rectangles with gaps where sardines live, must ensure non-self-intersecting output\n\n### Phase 4: Iterative Refinement with Probe Guidance\n\n1. Generate candidate shapes: bbox, L-shapes, stepped, multi-rect (3 to 5 per shape type)\n2. Probe all candidates: Use probe_solution to get approximate scores in approximately 10 seconds each\n3. Rank by probe score: Keep top 3\n4. Full evaluate top 3: Get exact scores, pick best\n5. Local refinement: From best polygon, try edge perturbations (plus/minus 1 to 20 units)\n   Each perturbation: check validity, count fish (use spatial index), keep if improves\n6. Repeat: Continue refinement loop until 1.5 seconds elapsed or no improvement for 0.2 seconds\n\n### Phase 5: Time Budget Management (critical!)\n- Total time: 2.0 seconds, use approximately 1.8 seconds for search (0.1 second safety margin)\n- Breakdown:\n  - 0.1 seconds: Setup (read input, build spatial index)\n  - 0.3 seconds: Initial bbox plus 3 variants (probe)\n  - 0.5 seconds: Full evaluate top 2, pick best\n  - 1.0 seconds: Iterative refinement loop (edge perturbations)\n  - 0.1 seconds: Final output generation\n- Early termination: If score stops improving for 0.15 seconds, finalize current best\n- Always output VALID polygon on exit\n\n## Common Pitfalls\n- Do not hardcode a single polygon - implement ACTIVE search loop\n- Do not ignore sardine exclusion - they can make or break your score\n- Do not use full evaluation for every variant - use probe_solution for ranking\n- Do not forget perimeter constraint - check after each polygon construction\n- Do not over-complexify - simple bbox plus smart refinements often beat complex shapes'
tool_descriptions:
  edit_solution: |
    Modify the C++ code in the EVOLVE-BLOCK. Targeted SEARCH/REPLACE diffs focused on:
    - Adding sardine exclusion analysis functions
    - Implementing probe-guided variant ranking
    - Refining polygon construction with L-shapes/stepped patterns
    - Ensuring active search loop with 2.0 seconds time budget
    Preserve EVOLVE-BLOCK markers, I/O format, and all required includes.
  evaluate_solution: |
    Run the C++ program to get combined_score (mackerels minus sardines plus 1, higher better),
    validity (0 if polygon invalid/errors), and remaining evaluations (budget=30). Each run executes
    the full 2.0 seconds search inside the program. Use results to guide next edits.
  probe_solution: |
    RAPID VARIANT SCORING TOOL. Call this to approximate scores of candidate polygons
    using subsampled data (approximately 10 seconds runtime, separate 30-probe budget). Scores are approximate and NOT
    comparable to full scores, but useful for ranking variants before full evaluation. This is
    CRITICAL for budget efficiency - test 5 to 10 shapes cheaply, then evaluate top 3 fully.
  finish: |
    End the search when you have exhausted the probe-guided improvement cycle or hit a clear
    optimum. Summarize best polygon found with its approximate score.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 30
  max_tokens: 14336
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 12000
new_tools:
  - name: analyze_sardines_and_mackerels
    description: |
      Analyze fish distribution to identify excludable sardines (near mackerel cluster edges),
      dense mackerel regions, and sardine clusters. Returns: (1) mackerel bounding box,
      (2) list of sardines within 300 to 500 units of bbox edges (easy to exclude),
      (3) count of sardines per cluster (for multi-rect exclusion), (4) recommended polygon
      shape family (bbox, L-shape, stepped, or multi-rect) based on analysis.
      Call this ONCE at the start to guide search strategy. Runtime: approximately 0.1 seconds.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          mackerels = []
          sardines = []
          names = ctx.list_task_inputs()
          if not names:
              return {"note": "no inputs"}
          # Read mackerels (first N) and sardines (next N)
          df = ctx.read_input_df(names[0], nrows=10000)
          df['type'] = [1 if i < 5000 else -1 for i in range(len(df))]
          mackerels = df[df['type'] == 1][['x', 'y']].values.tolist()
          sardines = df[df['type'] == -1][['x', 'y']].values.tolist()
          
          # Compute mackerel bounding box
          if not mackerels:
              return {"note": "no mackerels", "bbox": [0,0,0,0], "easy_sardines": [], 
                      "cluster_count": 0, "recommended_shape": "bbox"}
          mackerels_x = [p[0] for p in mackerels]
          mackerels_y = [p[1] for p in mackerels]
          min_mx, max_mx = min(mackerels_x), max(mackerels_x)
          min_my, max_my = min(mackerels_y), max(mackerels_y)
          bbox = [min_mx, min_my, max_mx, max_my]
          
          # Find sardines near bbox edges (margin = 300)
          easy_sardines = []
          margin = 300
          for s in sardines:
              sx, sy = s[0], s[1]
              if (sx < max_mx + margin or sx > min_mx - margin or
                  sy < max_my + margin or sy > min_my - margin):
                  easy_sardines.append(s)
          
          # Simple cluster analysis: group sardines by proximity
          clusters = []
          used = [False] * len(sardines)
          for i, s in enumerate(sardines):
              if used[i]:
                  continue
              cluster = [s]
              used[i] = True
              for j in range(i+1, len(sardines)):
                  if not used[j]:
                      dist = ((s[0]-sardines[j][0])**2 + (s[1]-sardines[j][1])**2)**0.5
                      if dist < 800:
                          cluster.append(sardines[j])
                          used[j] = True
              if len(cluster) >= 2:
                  clusters.append(cluster)
          
          # Recommend shape based on analysis
          if len(easy_sardines) > len(sardines) * 0.3:
              recommended = "L-shape"
          elif len(clusters) > 3:
              recommended = "multi-rect"
          elif len(mackerels) > 3000:
              recommended = "stepped"
          else:
              recommended = "bbox"
          
          return {"bbox": bbox, "easy_sardines": easy_sardines, 
                  "cluster_count": len(clusters), 
                  "recommended_shape": recommended}
new_skills:
  - name: sardine-aware-polygon-search
    description: 'Search strategy for axis-aligned fish-capture: identify excludable sardines,
    build shapes around dense mackerel clusters, use probe_solution for rapid variant ranking,
    and iteratively refine toward maximum (mackerels minus sardines plus 1) score.'
    body: |
      # Sardine-Aware Polygon Search Method
  
      ## Core Principle
      The score is mackerels_inside - sardines_inside + 1. Every sardine inside reduces your
      score. The optimal strategy is to capture dense mackerel regions while EXCLUDING sardine
      clusters. Focus on sardines near polygon boundaries (easy to exclude) vs. deep inside
      mackerel clusters (hard to exclude).
  
      ## Search Pipeline
  
      ### Step 1: Analyze Fish Distribution
      - Compute mackerel bounding box [min_x, max_x] times [min_y, max_y]
      - Identify "easy exclude" sardines: those within 300 to 500 units of bbox edges
      - Identify sardine clusters (3 or more sardines within 800 units): one shape can exclude all
      - Determine recommended polygon shape:
        - Many boundary sardines (greater than 30 percent) -> L-shape polygons
        - Multiple sardine clusters (greater than 3) -> Multi-rectangle with gaps
        - Dense mackerels (greater than 3000) -> Stepped/staircase polygons
        - Otherwise -> Simple bounding box
  
      ### Step 2: Generate Candidate Shapes
      - Bounding box variants: simple bbox, shrunk bbox, expanded bbox
      - L-shaped polygons: capture corner, cut off sardine-heavy region
      - Stepped polygons: staircase following mackerel density contours
      - Multi-rectangle union: capture separate clusters with gaps for sardines
  
      ### Step 3: Probe-Guided Ranking
      - Generate 5 to 10 candidate shapes (2 to 3 per type)
      - Use probe_solution to test all (approximate score in approximately 10 seconds each)
      - Rank by probe score, keep top 3
      - Use evaluate_solution for top 3 to get exact scores
      - Pick best, continue to refinement
  
      ### Step 4: Iterative Refinement
      - From best polygon, try edge perturbations plus/minus 1 to 20 units
      - Check validity (perimeter at most 400,000, non-self-intersecting)
      - Count fish using spatial index (O(1) with grid)
      - Keep modifications that improve score
      - Run multiple random restarts (3 to 5 different seed shapes)
      - Early termination: if no improvement for 0.15 seconds, finalize
      - Continue until 1.8 seconds elapsed (0.1 second safety margin)
  
      ### Step 5: Final Output
      - Output valid polygon: m on first line, then m lines of (x y)
      - Ensure: m at most 1000, perimeter at most 400,000, axis-aligned, non-self-intersecting
      - If multiple solutions, last one wins
  
      ## Key Tips
      - Use grid-based spatial indexing (CELL_SIZE=500) for O(1) fish counting
      - Always validate perimeter constraint after construction
      - Sardines near polygon edges are your best target for exclusion
      - Do not over-complexify: bbox plus smart refinements often win
      - Use probe_solution to filter variants before full evaluation
      - Log intermediate results with ctx.log() for debugging
remove_tools: []
