type: tool
name: analyze_sardines_and_mackerels
description: 'Analyze fish distribution to identify excludable sardines (near mackerel cluster edges),

  dense mackerel regions, and sardine clusters. Returns: (1) mackerel bounding box,

  (2) list of sardines within 300 to 500 units of bbox edges (easy to exclude),

  (3) count of sardines per cluster (for multi-rect exclusion), (4) recommended polygon

  shape family (bbox, L-shape, stepped, or multi-rect) based on analysis.

  Call this ONCE at the start to guide search strategy. Runtime: approximately 0.1 seconds.'
input_schema:
  type: object
  properties: {}
