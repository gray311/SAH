type: tool
name: edit_solution
description: 'Modify the C++ code. Focus on:

  - Adding region identification logic (find dense mackerel clusters)

  - Region-based polygon construction (not just global bounding boxes)

  - Edge refinement that targets individual fish

  - L-shaped and stepped polygon variants

  - Faster spatial queries (grid indexing instead of full KD-tree traversal)

  Keep EVOLVE-BLOCK markers and proper I/O format. Each edit should be ONE concrete improvement.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
