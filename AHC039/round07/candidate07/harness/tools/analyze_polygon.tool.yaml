type: tool
name: analyze_polygon
description: 'Analyze current best polygon to find edges with high sardine density or low mackerel density.

  Returns per-edge statistics and a recommended mutation that shifts the edge to improve

  (mackerels - sardines) score. Call this before each edit to guide the search direction.

  Cheap to run, does not consume evaluation budget.'
