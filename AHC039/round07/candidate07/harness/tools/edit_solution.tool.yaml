type: tool
name: edit_solution
description: 'Modify the C++ code in the EVOLVE-BLOCK. Use one concrete mutation at a time:

  - Add KD-tree scoring if missing

  - Add analyze_polygon tool for edge analysis

  - Refine polygon construction to use local search

  - Improve mutation strategy (e.g., biased toward mackerel-rich edges)

  Keep EVOLVE-BLOCK markers and I/O format intact.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
