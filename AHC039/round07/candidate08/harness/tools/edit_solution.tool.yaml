type: tool
name: edit_solution
description: 'Modify the C++ code in EVOLVE-BLOCK. Implement the grid-based search strategy with:

  1. Grid setup and fast scoring (O(grid_cells) vs O(N))

  2. Multiple polygon constructors (bounding boxes, L-shapes, stepped, hull-like)

  3. Local optimization loop with edge perturbations (±1 to ±50)

  4. Multi-restart mechanism (10-20 diverse starting polygons)


  Use probe_polygon tool to rank candidates before full evaluation. Each edit should be a concrete implementation
  step.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
