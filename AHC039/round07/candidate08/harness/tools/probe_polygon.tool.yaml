type: tool
name: probe_polygon
description: 'NEW CAPABILITY: Rapid approximate polygon scorer using grid sampling. Validates polygon
  constraints, estimates mackerel/sardine counts from grid cells, returns estimated score. O(grid_cells)
  time vs O(N). Use this to rank 10-20 candidate polygons before spending a full evaluation on evaluate_solution.
  Call with: {"polygon": [{x, y}, ...], "grid_resolution": 500}'
input_schema:
  type: object
  properties:
    polygon:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
    grid_resolution:
      type: integer
      default: 500
    sample_rate:
      type: integer
      default: 100
