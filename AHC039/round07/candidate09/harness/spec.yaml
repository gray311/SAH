schema: h2spec/1.0
system_prompt: |
  You are a polygon-optimization specialist for axis-aligned fish-capture problems.

  Goal: Maximize (mackerels_inside - sardines_inside + 1) with an axis-aligned, non-self-intersecting
  polygon.

  CRITICAL INSIGHT: The optimal polygon strategy is NOT incremental refinement. You must:
  1. Analyze fish distribution to identify dense mackerel clusters
  2. Identify sardine clusters that should be "bitten out" from the polygon
  3. Construct polygons with multiple rectangular components (L-shapes, stepped shapes)
  4. Use the 2.0s budget for STRUCTURAL changes, not edge perturbations

  Strategy:

  - **Phase 1 (0.2s)**: Read all fish positions, build a spatial index
  - **Phase 2 (0.5s)**: Identify mackerel-dense regions and sardine-dense regions
  - **Phase 3 (1.2s)**: Construct candidate polygons:
      * Base: bounding box of all mackerels
      * Variant A: Add "bite-outs" near sardine clusters (indent edges)
      * Variant B: Create multi-rectangular shapes around separate mackerel clusters
      * Variant C: Stepped polygons that follow mackerel density contours
  - **Phase 4 (0.1s)**: Count fish in each variant, keep best
  - **Always ensure**: polygon is valid (non-self-intersecting, axis-aligned, <=1000 vertices, perimeter <=400k)

  Do NOT output a fixed/static polygon. The search must construct MULTIPLE candidate structures
  and select the best one based on fish count scoring.

  Tools:
  - edit_solution: Modify the C++ code in the EVOLVE-BLOCK. Focus on:
      * Adding cluster analysis code
      * Implementing bite-out/stepped polygon constructors
      * Adding multi-variant comparison logic
  - evaluate_solution: Run the program, get combined_score (higher better)
  - probe_solution: Use to test polygon variants quickly before full eval
  - finish: End when you've tried diverse polygon structures

  Key rule: Each evaluation should encode a DIFFERENT structural approach, not just tweak parameters.
skill_description: |
  Optimize C++ polygon-constructing code for NP-hard fish-capture maximization using CLUSTER-BASED
  structural search. Build polygons that create bite-outs around sardine clusters and form multi-rectangular
  shapes around mackerel clusters. Use spatial analysis to guide construction, not incremental refinement.
skill_body: |
  # Cluster-Based Polygon Optimization for Fish Capture

  ## Problem Recap
  - Maximize: mackerels_inside - sardines_inside + 1
  - Polygon: axis-aligned (edges parallel to x or y), max 1000 vertices, perimeter ≤ 400,000
  - N = 5000 mackerels, N = 5000 sardines at distinct integer coordinates
  - Time limit: ~2.0s per evaluation for internal search

  ## Core Strategy: Cluster Analysis + Structural Construction

  ### Step 1: Build Spatial Index (0.2s)
  - Read all fish positions
  - Build grid or KD-tree for O(1) fish counting in any rectangle
  - This enables fast scoring of candidate polygons

  ### Step 2: Identify Clusters (0.3s)
  - **Mackerel clusters**: Find regions with high mackerel density
  - **Sardine clusters**: Find regions with high sardine density (these are "costs")
  - Use distance-based clustering: if fish within 500-1000 units, they form a cluster

  ### Step 3: Construct Candidate Polygons (0.8s)
  Build 3-5 structurally different polygons:

  **Base Polygon**: Bounding box of all mackerels
  - Simple rectangle covering all mackerel x-range and y-range
  - Count fish, record score

  **Bite-Out Polygons**: For each sardine cluster:
  - Start with base polygon
  - Identify the sardine cluster's bounding box
  - Create an indentation (bite-out) in one edge to exclude sardines
  - Cost: adds 2-4 vertices, may slightly reduce mackerel capture
  - Net effect: if sardines > mackerels in that region, score improves

  **Multi-Rectangular Polygons**: For separated mackerel clusters:
  - If mackerels form 2+ distinct clusters, create separate rectangles
  - Connect them with narrow corridors (if needed for validity)
  - Can capture high-density regions while avoiding sparse (sardine-rich) areas

  **Stepped Polygons**: Follow density contours:
  - Create staircase-like edges around dense mackerel regions
  - Each "step" adds 2 vertices
  - Better captures irregular density distributions than simple rectangles

  ### Step 4: Score and Select (0.4s)
  - Count fish in each candidate polygon
  - Score = mackerels - sardines + 1
  - Keep the best-scoring valid polygon
  - Output its vertices

  ## Implementation Patterns

  ```cpp
  // Grid-based cluster detection
  void detect_clusters(const vector<Fish>& fish, int grid_size, 
                       vector<vector<int>>& cluster_ids) {
      // Group fish by grid cell, merge adjacent cells with same dominant species
  }

  // Bite-out construction
  vector<Point> make_bite_out_polygon(const vector<Point>& base, 
                                      const vector<Point>& bite_rect,
                                      int edge_side) {
      // Insert vertices to create indentation on the specified edge
      // Example: on top edge, create a downward-pointing rectangle
  }

  // Stepped polygon from density contours
  vector<Point> make_stepped_polygon(const vector<vector<int>>& density_grid,
                                     int max_steps_per_side) {
      // Traverse density grid, create staircase following high-density regions
  }

  // Multi-rectangular construction
  vector<Point> make_multi_rect_polygon(
      const vector<Cluster>& mackerel_clusters,
      const vector<Point>& connect_points) {
      // Build separate rectangles for each cluster, connect with corridors
  }
  ```

  ## Evaluation Feedback

  - If score < expected for bite-out: the sardine cluster may be too sparse
  - If multi-rect doesn't help: mackerels may be in one large cluster
  - If stepped fails: simple bounding box may already be optimal for that distribution
  - Always ensure polygon validity: no self-intersections, axis-aligned edges
tool_descriptions:
  edit_solution: |
    Modify the C++ code in the EVOLVE-BLOCK. Focus on:
    1. Adding cluster detection code (grid-based or density-based)
    2. Implementing bite-out polygon constructor (indent edges near sardines)
    3. Adding multi-rectangular/stepped polygon constructors
    4. Creating multi-variant comparison loop that tests 3-5 structurally different polygons
    5. Ensuring all polygons are valid (axis-aligned, no self-intersection, perimeter <= 400k)
    Preserve EVOLVE-BLOCK markers and fixed I/O format.
  evaluate_solution: |
    Run the C++ program. Returns combined_score (higher better for mackerels-sardines+1),
    validity (0 if polygon invalid or program errors), and remaining evaluations (budget=30).
    Each evaluation runs the full 2.0s search with cluster-based structural construction.
  probe_solution: |
    QUICK approximation: count fish in a candidate polygon using a subsampled grid (~10s).
    Use this to rapidly compare 5-10 structural variants before committing to full eval.
    Probes are cheap (separate budget of 30) and give approximate scores - not comparable to full scores.
    Call probe when testing multiple bite-out positions or stepped configurations.
  finish: |
    End when you've tried diverse structural approaches (base, 3+ bite-outs, multi-rect, stepped)
    and the best probe/full evaluation converges, or when you've used ~25 of 30 evaluations.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 30
  max_tokens: 14336
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 12000
new_tools:
  - name: analyze_fish_clusters
    description: |
      Analyze fish distribution to identify mackerel clusters and sardine clusters.
      Returns cluster centers, densities, and bounding boxes for each cluster.
      Call this early to guide polygon construction - it identifies WHERE to build
      and WHERE to bite-out.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          mackerel_pos = []
          sardine_pos = []
          
          for i in range(5000):
              x, y = ctx.get_program_state().get_fish_pos(i, type='mackerel')
              mackerel_pos.append((x, y))
          
          for i in range(5000):
              x, y = ctx.get_program_state().get_fish_pos(5000 + i, type='sardine')
              sardine_pos.append((x, y))
          
          grid_size = 500
          grid = {}
          
          for x, y in mackerel_pos:
              gx, gy = x // grid_size, y // grid_size
              key = (gx, gy)
              grid[key] = grid.get(key, {'m': 0, 's': 0})
              grid[key]['m'] += 1
          
          for x, y in sardine_pos:
              gx, gy = x // grid_size, y // grid_size
              key = (gx, gy)
              grid[key] = grid.get(key, {'m': 0, 's': 0})
              grid[key]['s'] += 1
          
          mackerel_clusters = []
          sardine_clusters = []
          visited = set()
          
          for (gx, gy), data in grid.items():
              if data['m'] > 5 or data['s'] > 5:
                  cluster_cells = []
                  queue = [(gx, gy)]
                  while queue:
                      cx, cy = queue.pop(0)
                      if (cx, cy) in visited:
                          continue
                      visited.add((cx, cy))
                      cluster_cells.append((cx, cy))
                      
                      for dx, dy in [(0,1),(0,-1),(1,0),(-1,0)]:
                          nx, ny = cx + dx, cy + dy
                          if (nx, ny) in grid and (grid[(nx,ny)]['m'] > 5 or grid[(nx,ny)]['s'] > 5):
                              if (nx, ny) not in visited:
                                  queue.append((nx, ny))
                  
                  if cluster_cells:
                      min_x = min(gx * grid_size for gx, gy in cluster_cells)
                      max_x = max((gx + 1) * grid_size for gx, gy in cluster_cells)
                      min_y = min(gy * grid_size for gx, gy in cluster_cells)
                      max_y = max((gy + 1) * grid_size for gx, gy in cluster_cells)
                      center_x = (min_x + max_x) // 2
                      center_y = (min_y + max_y) // 2
                      
                      total_m = sum(grid[(gx, gy)]['m'] for gx, gy in cluster_cells)
                      total_s = sum(grid[(gx, gy)]['s'] for gx, gy in cluster_cells)
                      
                      mackerel_clusters.append({
                          'center': (center_x, center_y),
                          'bbox': (min_x, min_y, max_x, max_y),
                          'mackerels': total_m,
                          'sardines': total_s,
                          'dominant': 'mackerel' if total_m > total_s else 'sardine'
                      })
          
          return {
              'mackerel_clusters': sorted(mackerel_clusters, key=lambda c: c['mackerels'], reverse=True)[:10],
              'sardine_clusters': sardine_clusters[:10],
              'note': 'Use mackerel clusters to build polygon areas, sardine clusters to create bite-outs'
          }
new_skills:
  - name: cluster-structural-search
    description: |
      Method for constructing polygons using cluster analysis: identify dense mackerel regions,
      create bite-outs around sardine clusters, and test multiple structural variants.
    body: |
      # Cluster-Based Structural Search for Fish Capture

      ## Overview
      This skill guides construction of polygons that strategically capture mackerel clusters
      while excluding sardine clusters through bite-out operations.

      ## Phase 1: Cluster Analysis
      1. Build a spatial grid (e.g., 500x500 cells for 0-100000 coordinate range)
      2. Count mackerels and sardines in each cell
      3. Identify clusters: groups of adjacent cells with high fish density
      4. Compute cluster bounding boxes and centers

      ## Phase 2: Polygon Construction Strategies

      ### Strategy A: Base Bounding Box
      - Compute bounding box of ALL mackerels
      - Create simple rectangle: [min_x, max_x] x [min_y, max_y]
      - Score: baseline for comparison

      ### Strategy B: Bite-Out Polygons
      For each significant sardine cluster:
      1. Start with base polygon
      2. Find the edge of base polygon closest to sardine cluster
      3. Create an indentation (bite-out) that excludes the sardine cluster
         - Example: if sardines are near the right edge, create a leftward indentation
      4. The bite-out adds 2-4 vertices but may reduce mackerel capture slightly
      5. Net score = mackerels - sardines + 1; bite-out is worth it if sardines saved > mackerels lost

      ### Strategy C: Multi-Rectangular Polygons
      If mackerels form 2+ distinct clusters:
      1. Create separate rectangle for each mackerel cluster
      2. Connect rectangles with narrow corridors (1-2 units wide) if needed
      3. This captures high-density regions while avoiding sparse (sardine-rich) areas between clusters

      ### Strategy D: Stepped Polygons
      For irregular density distributions:
      1. Traverse the density grid from dense to sparse regions
      2. Create staircase-like edges following density contours
      3. Each "step" adds 2 vertices and better captures irregular shapes

      ## Phase 3: Variant Comparison
      1. Score each candidate polygon (mackerels - sardines + 1)
      2. Use probeSolution for quick approximation of variants
      3. Select best-scoring valid polygon for full evaluation
      4. If all variants score similarly, try different bite-out positions

      ## Implementation Notes
      - Always ensure polygon validity: axis-aligned, no self-intersection, <= 1000 vertices, perimeter <= 400k
      - Bite-out depth: typically 100-500 units (adjust based on sardine cluster size)
      - Multi-rect connectivity: corridors should be at least 1 unit wide for validity
      - Prioritize bite-outs where sardine density significantly exceeds mackerel density
new_middlewares:
  - name: remind_structural_diversity
    hook: before_model
    description: |
      Remind the solver to try structurally different polygon types in each evaluation.
      Prevents getting stuck on incremental refinements of the same polygon type.
    implementation_py: |
      def before_model(hook_input):
          eval_num = hook_input.get('iteration', 0)
          eval_total = hook_input.get('max_iterations', 60)
          
          approaches = [
              "Try a base bounding box variant",
              "Try bite-out variants near top sardine clusters",
              "Try multi-rectangular shape for separated mackerel clusters",
              "Try stepped polygon following density contours",
              "Try a different bite-out position on left/right/bottom/top edge",
              "Try combining bite-out with stepped edges",
          ]
          
          approach = approaches[eval_num % len(approaches)]
          return f"STRUCTURAL DIVERSITY REMINDER: This is evaluation {eval_num+1}/{eval_total}. Try {approach}. Do NOT just perturb edge positions - create a structurally different polygon."
