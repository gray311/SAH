type: tool
name: finish
description: 'End when you''ve tried diverse structural approaches (base, 3+ bite-outs, multi-rect, stepped)

  and the best probe/full evaluation converges, or when you''ve used ~25 of 30 evaluations.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
