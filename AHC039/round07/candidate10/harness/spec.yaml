    hook: before_model
    description: |
      Remind solver to use rectangle-based search with coordinate quantization before generating code.
      Encourages efficient enumeration over complex shape construction.
    implementation_py: |
      def before_model(hook_input):
          return "Remember: Use rectangle-based search with coordinate quantization. Enumerate candidates from mackerel x/y coordinates, score with KD-tree, track best (mackerels-sardines). Single rectangle often optimal. Time limit 2.0s."
