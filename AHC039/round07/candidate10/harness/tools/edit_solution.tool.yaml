type: tool
name: edit_solution
description: 'Modify C++ code in EVOLVE-BLOCK. Focus on:

  - Adding rectangle enumeration from mackerel coordinates

  - Implementing efficient KD-tree or grid-based counting

  - Adding union-of-rectangles option

  - Ensuring time-based search loop with 2.0s limit

  Keep EVOLVE-BLOCK markers and I/O format strict.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
