schema: h2spec/1.0
system_prompt: |
  You are solving an NP-hard fish-capture optimization problem.
  Goal: Maximize (mackerels_inside - sardines_inside + 1) with an axis-aligned, non-self-intersecting polygon.
  
  KEY INSIGHT: The optimal solution is NOT a single complex polygon. It is the UNION of multiple small axis-aligned rectangles, each with positive (mackerels - sardines).
  
  YOUR TASK: Implement a RECTANGLE-DECOMPOSITION algorithm in C++:
  
  1. Pre-process all fish into a grid or hash table for O(1) counting.
  
  2. Enumerate candidate rectangles efficiently:
     - Consider all pairs of mackerels as potential opposite corners
     - OR use a grid-based approach: for each grid cell, compute net score
     - OR use the "maximal empty rectangle" variant: expand from each mackerel
  
  3. For each candidate rectangle, compute its score (mackerels - sardines).
  
  4. Greedily select rectangles with positive score, ensuring non-overlapping (or minimally overlapping).
  
  5. Union the selected rectangles into a valid axis-aligned polygon (output vertices).
  
  6. Optimize: You have 2.0s per evaluation. Use early termination, efficient data structures, and pruning.
  
  CRITICAL: Each evaluation must run a complete rectangle-search algorithm, NOT a local refinement of one polygon. The search space is too large for hill climbing — use enumeration + greedy selection.
  
  Tools:
  - edit_solution: Modify C++ code to implement the rectangle-decomposition algorithm. Focus on: grid-based enumeration, efficient scoring, greedy rectangle union.
  - evaluate_solution: Run and get combined_score. Use to verify algorithm correctness.
  - finish: When algorithm consistently finds high-scoring unions.
  
  Preserve EVOLVE-BLOCK markers and I/O format. Time budget is critical — optimize inner loops.
skill_description: |
  Implement rectangle-decomposition algorithm for fish-capture optimization. The optimal solution is a union of multiple small axis-aligned rectangles with positive (mackerels - sardines) scores. Use grid-based enumeration and greedy selection to maximize total score within 2.0s.
skill_body: |
  # Rectangle-Decomposition Algorithm for Fish Capture
  
  ## Core Insight
  The optimal polygon is NOT a single complex shape. It is the UNION of multiple small axis-aligned rectangles, each capturing more mackerels than sardines.
  
  ## Algorithm Steps
  
  ### Step 1: Fast Fish Lookup
  - Create a 2D grid (or hash map) where each cell stores (mackerel_count, sardine_count)
  - Use coordinate compression if grid is too large
  - Query time: O(1) for any rectangle
  
  ### Step 2: Enumerate Candidate Rectangles
  Options (choose one):
  - Grid-sweep: For each grid cell, compute net score. Grow rectangles from positive cells.
  - Corner-pair: Consider all O(N²) pairs of mackerels as opposite corners. Evaluate each.
  - Expand-from-mackerel: For each mackerel, expand in 4 directions until hitting a sardine or boundary.
  
  ### Step 3: Greedy Rectangle Selection
  - Sort rectangles by net score (descending)
  - Select rectangles greedily, skipping those that would make total score worse
  - Handle overlaps: either exclude overlapping areas or use inclusion-exclusion
  
  ### Step 4: Convert to Polygon
  - The union of rectangles is an orthogonal polygon
  - Compute vertices of the union (max 1000 vertices)
  - Output in order
  
  ### Step 5: Time Budget Management
  - Use 1.5s for search, 0.5s for polygon construction
  - Prune early if no positive-score rectangles found
  - Use parallel processing if possible
  
  ## C++ Implementation Tips
  
  // Grid-based approach
  struct Cell { int mackerels; int sardines; };
  std::vector<Cell> grid(MAX_COORD / CELL_SIZE + 1);
  
  // Fast query
  int query_rect(int x1, int y1, int x2, int y2) {
      int sum_m = 0, sum_s = 0;
      for (int x = x1; x <= x2; x += CELL_SIZE) {
          for (int y = y1; y <= y2; y += CELL_SIZE) {
              sum_m += grid[x][y].mackerels;
              sum_s += grid[x][y].sardines;
          }
      }
      return sum_m - sum_s;
  }
  
  // Rectangle enumeration
  std::vector<Rectangle> enumerate_rectangles() {
      std::vector<Rectangle> candidates;
      for (int i = 0; i < num_cells; i++) {
          if (grid[i].net_score > 0) {
              Rectangle r = expand_from_cell(i);
              candidates.push_back(r);
          }
      }
      return candidates;
  }
  
  // Greedy selection
  RectangleUnion select_best_union(const std::vector<Rectangle>& candidates) {
      std::sort(candidates.begin(), candidates.end(), [](auto& a, auto& b){
          return (a.m - a.s) > (b.m - b.s);
      });
      // Greedy selection with overlap handling
      ...
  }
  
  ## Common Pitfalls
  - Don't enumerate ALL O(N²) corner pairs — too slow
  - Don't forget to handle overlaps in rectangle union
  - Ensure output polygon is valid (non-self-intersecting, axis-aligned)
  - Time limit is tight — optimize inner loops heavily
  - Use coordinate compression if needed
  
  ## Evaluation Feedback
  - If score ≈ seed: your enumeration is too coarse; refine grid size
  - If score < expected: fix overlap handling or selection strategy
  - If timeout: reduce enumeration candidates or use smarter pruning
  - If score > 5000: you may have found the optimal solution
tool_descriptions:
  edit_solution: |
    Modify C++ code to implement rectangle-decomposition algorithm. Key changes:
    1. Add grid/hashing for O(1) fish counting
    2. Implement rectangle enumeration (grid-sweep or corner-pair)
    3. Implement greedy rectangle selection with overlap handling
    4. Convert rectangle union to valid polygon output
    Focus on time efficiency — 2.0s per evaluation. Preserve EVOLVE-BLOCK markers.
  evaluate_solution: |
    Run C++ program. Returns combined_score (higher better), validity, and remaining evals (30 budget).
    Each run should implement rectangle-decomposition search within 2.0s. Use feedback to tune enumeration strategy.
  probe_solution: |
    Not applicable — full evaluation needed for accurate (mackerels - sardines) score. Grid counting makes full eval fast.
  finish: |
    End when rectangle-decomposition algorithm consistently finds high-scoring unions (target: >5000 per test case).
sampling:
  temperature: 0.3
  top_p: 0.95
  top_k: 10
  max_tokens: 8192
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
  - name: analyze_rectangles
    description: |
      Quick analysis of rectangle-scoring strategy. Returns recommended enumeration approach (grid-sweep vs corner-pair) based on data distribution. Call once at search start.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          names = ctx.list_task_inputs()
          if not names:
              return {"note": "no inputs"}
          df = ctx.read_input_df(names[0], nrows=5000)
          x = df.iloc[:, 0]
          y = df.iloc[:, 1]
          x_min, x_max = int(x.min()), int(x.max())
          y_min, y_max = int(y.min()), int(y.max())
          cell_size = max(100, (x_max - x_min) / 200)
          if (x_max - x_min) / cell_size < 50 and (y_max - y_min) / cell_size < 50:
              approach = "corner-pair"
              candidates = (x_max - x_min) * (y_max - y_min)
          else:
              approach = "grid-sweep"
              candidates = ((x_max - x_min) / cell_size) * ((y_max - y_min) / cell_size)
          return {
              "approach": approach,
              "candidate_count": int(candidates),
              "cell_size": cell_size,
              "x_range": [x_min, x_max],
              "y_range": [y_min, y_max],
              "recommendation": f"Use {approach} with ~{int(candidates)} candidates"
          }
remove_tools: []
new_skills:
  - name: rectangle-decomposition-strategy
    description: |
      Guide C++ implementation of rectangle-decomposition algorithm for fish-capture. Enumerate candidate rectangles, score each, greedily select positive-score rectangles, union them.
    body: |
      # Rectangle-Decomposition Strategy for Fish Capture
      
      ## Problem
      Maximize: mackerels_inside - sardines_inside + 1
      
      ## Key Insight
      The optimal solution is a UNION of multiple small axis-aligned rectangles, each with positive net score. Not a single complex polygon!
      
      ## Algorithm Overview
      
      ### Phase 1: Fast Fish Lookup
      struct Cell { int m, s; };
      std::vector<Cell> grid(MAX_X / CELL_SIZE + 1, MAX_Y / CELL_SIZE + 1);
      
      ### Phase 2: Enumerate Candidates
      Option A: Grid-Sweep (recommended for sparse data)
      std::vector<Rectangle> candidates;
      for (int cy = 0; cy < grid.size(); cy++) {
          for (int cx = 0; cx < grid[cy].size(); cx++) {
              if (grid[cy][cx].m > grid[cy][cx].s) {
                  Rectangle r = expand(cell_to_rect(cx, cy));
                  candidates.push_back(r);
              }
          }
      }
      
      Option B: Corner-Pair (for dense clusters)
      std::vector<Rectangle> candidates;
      for (auto& m : mackerels) {
          for (auto& m2 : mackerels) {
              Rectangle r({std::min(m.x, m2.x), std::min(m.y, m2.y),
                           std::max(m.x, m2.x), std::max(m.y, m2.y)});
              if (score(r) > 0) candidates.push_back(r);
          }
      }
      
      ### Phase 3: Greedy Selection
      std::sort(candidates.begin(), candidates.end(), 
                [](const Rect& a, const Rect& b) { return (a.m - a.s) > (b.m - b.s); });
      
      std::vector<Rectangle> selected;
      for (const auto& r : candidates) {
          if (can_add_without_negating_score(selected, r)) {
              selected.push_back(r);
          }
      }
      
      ### Phase 4: Union to Polygon
      - Compute union of selected rectangles
      - Extract vertices of orthogonal polygon
      - Output in order
      
      ### Phase 5: Time Budget
      - 1.5s: enumeration + selection
      - 0.5s: polygon construction + output
      
      ## Optimization Tips
      - Use coordinate compression if grid too large
      - Prune rectangles that are subsets of already-selected ones
      - Use integer arithmetic where possible
      - Early exit if total time budget exceeded
new_middlewares:
  - name: rectangle_search_reminder
    hook: before_model
    description: |
      Remind solver to use rectangle-decomposition strategy with efficient enumeration.
    implementation_py: |
      def before_model(hook_input):
          return "RECTANGLE-DECOMPOSITION STRATEGY: Enumerate candidate rectangles using grid-sweep or corner-pair, score each with fast lookup, greedily select positive-score rectangles, union them into a valid polygon. Time budget: 2.0s. Target score >5000 per test case."
