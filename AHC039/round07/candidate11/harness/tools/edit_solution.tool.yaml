type: tool
name: edit_solution
description: 'Modify C++ code to implement rectangle-decomposition algorithm. Key changes:

  1. Add grid/hashing for O(1) fish counting

  2. Implement rectangle enumeration (grid-sweep or corner-pair)

  3. Implement greedy rectangle selection with overlap handling

  4. Convert rectangle union to valid polygon output

  Focus on time efficiency — 2.0s per evaluation. Preserve EVOLVE-BLOCK markers.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
