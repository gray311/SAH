name: probe_solution
description: 'Quick approximate score for axis-aligned rectangles using subsampled fish data (~10s vs
  minutes for full eval).

  Separate budget of ~30 probes. Scores are approximate but useful for ranking rectangle candidates before
  full evaluation.

  Call this during Phase 1 (rectangle scanning) and Phase 2 (L-shape variants) to quickly filter candidates.'
