type: tool
name: scan_rectangles
description: 'Sample and score multiple random rectangles covering the coordinate space. Returns the top-k
  rectangles

  by approximate mackerel-sardine score. Use this for Phase 1 rapid scanning to find mackerel-rich regions.

  Each rectangle uses approximate counting (faster than full eval).'
input_schema:
  type: object
  properties:
    count:
      type: integer
      minimum: 10
      maximum: 200
    k:
      type: integer
      minimum: 1
      maximum: 20
