type: tool
name: analyze_polygon
description: 'Approximate polygon score using 5% random sample of all fish.

  Returns estimated (mackerels - sardines + 1). Takes 10ms vs 2s for full eval.

  Separate budget of 100 probes. Use this to RANK thousands of polygon candidates

  quickly, then call evaluate_solution on top 3-5. Critical for efficient search

  when evaluator is slow or budget is limited.

  Implementation samples 500 random fish indices, counts type=1 (mackerel) and

  type=-1 (sardine) inside polygon, returns sum + 1.'
input_schema:
  type: object
  properties:
    sample_frac:
      type: number
      default: 0.05
