type: tool
name: edit_solution
description: 'Modify the C++ code in the EVOLVE-BLOCK. For this task, implement PROBE-FIRST strategy:

  1. Add analyze_polygon tool with 5% fish sampling (approximate score in 10ms)

  2. Rewire main loop to: generate candidates -> probe all -> eval top-5 -> refine best

  3. Add KD-tree construction for O(log N) rectangle queries

  4. Ensure time budget: 0.1s setup, 0.5s generate, 0.8s probe, 0.6s refine

  Preserve EVOLVE-BLOCK markers and fixed I/O format (m then vertices).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
