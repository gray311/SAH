type: tool
name: finish
description: "End when: (1) 3 consecutive probe cycles show <0.5% improvement, or\n          (2) current\
  \ score >= 5000 (likely near-optimal), or\n          (3) time budget <0.2s remaining."
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
