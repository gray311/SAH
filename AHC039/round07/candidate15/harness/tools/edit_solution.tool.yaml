type: tool
name: edit_solution
description: 'Edit the C++ EVOLVE-BLOCK. Add grid-based fish counting, implement rect/l_shape/stepped
  polygon constructors, add iterative refinement loop. Preserve EVOLVE-BLOCK markers and I/O format. Each
  edit should add ONE concrete improvement: e.g. "add grid index", "add l_shape function", "add refinement
  loop". Start with the simplest working solution, then iteratively improve.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
