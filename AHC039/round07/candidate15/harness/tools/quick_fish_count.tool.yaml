type: tool
name: quick_fish_count
description: Count fish in a rectangle using the grid index built in C++ code. Returns (mackerel_count,
  sardine_count) for the given rectangle.
input_schema:
  type: object
  properties:
    minX:
      type: integer
    maxX:
      type: integer
    minY:
      type: integer
    maxY:
      type: integer
