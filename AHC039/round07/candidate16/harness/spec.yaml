schema: h2spec/1.0
system_prompt: |
  You are an expert C++ polygon optimizer for fish-capture problems.
  
  TASK: Maximize (mackerels_inside - sardines_inside + 1) using an axis-aligned, non-self-intersecting polygon.
  
  CRITICAL RULES:
  The C++ code MUST compile and run without errors.
  The code MUST output exactly: m\n a0 b0\n a1 b1\n ... (no extra text).
  The polygon must have 4-1000 vertices, perimeter <= 400000, integer coords 0-100000.
  Edges must be axis-aligned (horizontal or vertical only).
  
  KEY INSIGHT: The seed C++ code is INCOMPLETE and doesn't compile. You MUST fix it first before searching.
  
  SEARCH STRATEGY: Fix the code, then implement grid-based rectangle search.
  
  STEP 1: Fix compilation errors in the EVOLVE-BLOCK
    - Check for missing #includes, semicolons, parentheses
    - Ensure main() returns int
    - Ensure output format is correct
    
  STEP 2: Implement fast grid-based fish counting
    - Use CELL_SIZE = 50 for grid
    - Build grid once at startup
    - Count fish in any rectangle in O(1) per cell covered
    
  STEP 3: Generate candidate rectangles
    - Find mackerel centroid
    - Try 200+ rectangles with various offsets and sizes
    - Keep top 3 by estimated score
    
  STEP 4: Evaluate and output best
    - Use evaluate_solution for final candidates only
    - Output best rectangle vertices
    
  When to use tools:
  edit_solution: Fix compilation errors first, then implement grid search.
  evaluate_solution: Only for final 1-2 candidates after probe-style testing.
  probe_solution: Can be used for fast scoring if available (~10s per probe).
  
  NEVER output a fixed/static polygon. Always search.
skill_description: |
  Fix and optimize C++ code for fish-capture optimization. Focus on compiling first, then implement grid-based rectangle search. Use evaluate_solution sparingly.
skill_body: |
  # Fixing and Optimizing C++ for Fish Capture
  
  ## Critical: Fix Compilation First
  The seed C++ code may have errors. Check:
  - All #includes present: iostream, vector, algorithm, chrono, random, set, etc.
  - main() returns int
  - Output format: exactly m\n coords (no extra text)
  - No syntax errors in loops, conditionals, function calls
  
  ## Grid-Based Fish Counting
  Code pattern:
  const int CELL_SIZE = 50;
  vector<vector<int>> grid(2001, vector<int>(2001, 0));
  
  // Build grid
  for (const auto& f : all_fish_structs) {
      int gx = min(2000, f.p.x / CELL_SIZE + 1);
      int gy = min(2000, f.p.y / CELL_SIZE + 1);
      grid[gx][gy] += f.type;
  }
  
  // Count in rectangle
  int count_rect(int minx, int maxx, int miny, int maxy) {
      int sum = 0;
      for (int x = minx; x <= maxx; x += CELL_SIZE) {
          for (int y = miny; y <= maxy; y += CELL_SIZE) {
              sum += grid[x/CELL_SIZE][y/CELL_SIZE];
          }
      }
      return sum;
  }
  
  ## Rectangle Search
  1. Find mackerel centroid: sum all mackerel x, divide by count
  2. Generate candidates:
     for (dx = -200 to 200 step 50) {
       for (dy = -200 to 200 step 50) {
         for (size in {200, 300, 400}) {
           minx = cx + dx - size/2, maxx = cx + dx + size/2
           miny = cy + dy - size/2, maxy = cy + dy + size/2
           score = count_rect(minx, maxx, miny, maxy)
           if (perimeter_ok) candidates.add(score, minx, maxx, miny, maxy)
         }
       }
     }
  3. Sort by score descending, keep top 3
  4. Evaluate top 3 with evaluate_solution
  5. Output best
  
  ## Common Bugs
  - Wrong output format: must be exactly m\n coords
  - Perimeter > 400000: check before output
  - Coordinates out of range: clamp to 0-100000
  - Not compiling: check all brackets, semicolons, function signatures
  
  ## Evaluation Strategy
  - Use probe_solution if available for fast scoring during search
  - Use evaluate_solution only for final 1-2 candidates
  - If validity=0, fix the C++ code and retry
  - If score < expected, try different search parameters
tool_descriptions:
  edit_solution: |
    Modify the C++ code in EVOLVE-BLOCK. Focus on:
    1. Fixing C++ syntax/compilation errors
    2. Changing search strategy (e.g., grid size, candidate generation)
    3. Improving probe vs full eval balance
    Always keep EVOLVE-BLOCK markers and exact output format: m\n coords...
  evaluate_solution: |
    Run the C++ program. Returns combined_score, validity (0-1), errors, and remaining evals (budget=30).
    Full evaluation takes ~2s and gives accurate score. Use only for final candidates.
  probe_solution: |
    Run a fast approximate evaluation using grid counting (~10s). Returns (mackerels-sardines) for a given polygon.
    Uses cell size 50 for speed. Takes ~10s. Does NOT consume full eval budget.
    Great for testing 10-50 candidate rectangles during search.
  finish: |
    End when you find a consistently high-scoring polygon or exhaust budget.
    Typical flow: probe 20+ candidates, evaluate top 3, finish with best.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
  - name: analyze_mackerel_clusters
    description: |
      Find dense mackerel clusters and suggest promising rectangle locations.
      Analyzes mackerel positions to find regions with high density.
      Returns cluster centers and sizes for candidate generation.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          # Get program to find mackerel positions
          prog = ctx.get_program()
          
          # This is a hint for the C++ code to analyze clusters
          # The C++ implementation should:
          # 1. Group mackerels by 50x50 grid cells
          # 2. Find cells with most mackerels
          # 3. Return cluster centers for candidate generation
          
          # For now, return a note guiding the C++ code
          return {
              "note": "C++ code should: 1) Group mackerels by 50x50 grid cells, 2) Find top dense cells, 3) Use their centers as rectangle candidates",
              "cluster_centers": [],
              "suggested_offsets": [-200, -150, -100, -50, 0, 50, 100, 150, 200]
          }
new_skills: []
new_middlewares:
  - name: fix_compile_first
    hook: before_model
    description: |
      Remind the solver to fix compilation errors before attempting search.
      This prevents wasting evaluations on broken C++ code.
    implementation_py: |
      def before_model(hook_input):
          reminder = "CHECK: Does the C++ code compile? Fix syntax errors, missing includes, and output format before searching. Output must be exactly: m\\n coords..."
          return reminder
