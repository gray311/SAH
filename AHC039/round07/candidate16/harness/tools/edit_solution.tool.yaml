type: tool
name: edit_solution
description: 'Modify the C++ code in EVOLVE-BLOCK. Focus on:

  1. Fixing C++ syntax/compilation errors

  2. Changing search strategy (e.g., grid size, candidate generation)

  3. Improving probe vs full eval balance

  Always keep EVOLVE-BLOCK markers and exact output format: m\n coords...'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
