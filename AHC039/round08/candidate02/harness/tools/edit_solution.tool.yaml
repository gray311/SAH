type: tool
name: edit_solution
description: 'Modify the C++ EVOLVE-BLOCK with complete two-phase search code.


  MUST include:

  1. Phase 1: Compute global bounding box, 2x2 blocks (top 5), centroid, edge-filtered box

  2. Phase 2: For each anchor, generate tight box, holed box, L-shape

  3. Phase 3: Hill climb edges ±1..15, 2 refinement rounds

  4. Phase 4: 3 random restarts, output best


  Preserve EVOLVE-BLOCK markers and exact I/O format. Code must run in <2s.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
