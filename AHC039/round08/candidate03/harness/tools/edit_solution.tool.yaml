type: tool
name: edit_solution
description: 'Replace the EVOLVE-BLOCK with a complete C++ program implementing probe-driven polygon search.

  Must include: 500x500 spatial hash grid, 4 polygon patterns (bounding box, notched, multi-room, spiral),

  probe-driven refinement (6 variations per edge), evaluation of top 3 candidates, fine-grained hill climb,

  and 3-5 random restarts. Preserve EVOLVE-BLOCK markers and exact I/O format. Program must run in <1.8s.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
