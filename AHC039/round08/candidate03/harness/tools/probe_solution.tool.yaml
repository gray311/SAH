type: tool
name: probe_solution
description: 'Get an approximate score in ~0.1s using spatial hashing. Perfect for rapidly testing polygon
  variants.

  Call this 3-5 times per polygon during refinement. Do NOT use full evaluation for iteration.

  The probe uses a 500x500 hash grid and counts fish in O(number of grid cells) time.'
