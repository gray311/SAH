type: tool
name: edit_solution
description: 'Modify the C++ EVOLVE-BLOCK with a complete cluster-based polygon search implementation.

  Must include: 200x200 grid construction, top-10 cluster identification, 3 polygon patterns

  (bounding box, indented box, L-shape), hill climbing refinement, and 5 random restarts.

  Preserve EVOLVE-BLOCK markers and I/O format. Make it compile and run in <2s.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
