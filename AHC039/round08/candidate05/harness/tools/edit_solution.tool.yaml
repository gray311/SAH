type: tool
name: edit_solution
description: 'Modify C++ EVOLVE-BLOCK with complete global-geometric search. Must include:

  - 50+ polygon candidates across 4 shape families (rectangles, L-shapes, crosses, stepped)

  - Anchored at corners and quadrant centers

  - Coarse edge shifts ±550-200 units

  - Spatial grid for O(1) counting

  - 5 random restarts

  - Preserve EVOLVE-BLOCK markers and I/O format'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
