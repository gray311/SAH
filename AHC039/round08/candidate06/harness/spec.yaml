schema: h2spec/1.0
system_prompt: "You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).\n\nCRITICAL: The C++ code MUST implement a FAST, FOCUSED SEARCH that completes in <1.5s:\n\n1. Parse all fish positions into two lists: mackerels (type=1) and sardines (type=-1)\n2. Find the bounding box of ALL mackerels (minX, maxX, minY, maxY)\n3. For EACH corner of this bounding box, check if it's far from sardines\n4. Construct 4 candidate polygons: one for each corner (top-left, top-right, bottom-left, bottom-right)\n   - Each polygon is a simple rectangle or L-shape that captures that corner's mackerel region\n   - Explicitly exclude any sardine within 100 units by shifting the polygon edge\n5. For each candidate, count mackerels and sardines in O(N) time\n6. Also try 3 random perturbations of the bounding box (shift edges by ±50 to ±200)\n7. Run 3 random restarts with different corner selections\n8. Output the single best valid polygon\n\nSearch MUST use efficient O(N) counting. Use std::vector and simple loops. Avoid complex data structures.\nStop only when all 15 candidates evaluated or timeout.\n\nTools:\n- edit_solution: Modify C++ EVOLVE-BLOCK with complete, fast polygon search code\n- evaluate_solution: Run program, get score (mackerels-sardines+1)\n- probe_solution: NOT useful - full eval needed\n- finish: Submit when you've encoded a working 4-corner + perturbations strategy"
skill_description: Fast 4-corner search with sardine exclusion. Find mackerel-dense corners of bounding box, construct corner-specific polygons, exclude nearby sardines, perturb edges, run 3 restarts. O(N) counting.
skill_body: "# Fast 4-Corner Polygon Optimization\n\n## Strategy: Corner-Focused Search with Sardine Exclusion\n\n### Phase 1: Parse and Compute Bounding Box\n- Separate fish into mackerels and sardines\n- Compute global mackerel bounding box (minX, maxX, minY, maxY)\n- This gives us the overall search region\n\n### Phase 2: 4 Corner Candidates\nFor each corner (top-left, top-right, bottom-left, bottom-right):\n- Extract the corner region (e.g., top-left: [minX, maxX/2] × [minY, maxY/2])\n- Check for sardines in a 100-unit buffer around the corner\n- If sardines present, shift the corner region inward to exclude them\n- Create a rectangle or L-shape polygon for that corner\n- Count mackerels and sardines in O(N) time\n\n### Phase 3: Edge Perturbations\nFor the best corner candidate:\n- Try shifting each edge by ±50, ±100, ±150, ±200 units\n- Keep shifts that maintain validity and improve score\n- Generate 3-5 perturbed variants\n\n### Phase 4: 3 Random Restarts\n- Repeat Phases 2-3 with 3 different random perturbations of the initial bounding box\n- Each restart picks a random corner to focus on\n- Track the best polygon across all restarts\n\n### Phase 5: Output Best\n- Output the single best valid polygon (max mackerels - sardines + 1)\n\n## C++ Implementation Notes\n- Use std::vector<Point> for mackerels and sardines\n- Simple loops for O(N) counting\n- No complex data structures (KD-trees, grids)\n- Total time: <1.5s with 15 candidates\n- Use fast I/O: ios::sync_with_stdio(false); cin.tie(nullptr);"
tool_descriptions:
  edit_solution: 'Modify the C++ EVOLVE-BLOCK with a complete 4-corner polygon search implementation. Must include: parse fish into mackerel/sardine lists, compute global bounding box, generate 4 corner candidates with sardine exclusion, perturb edges, 3 random restarts, O(N) counting. Preserve EVOLVE-BLOCK markers and I/O format. Make it compile and run in <1.5s.'
  evaluate_solution: 'Run the C++ program. Returns combined_score (mackerels-sardines+1), validity (0 if invalid), and remaining evaluations (budget=30). Each run spends up to 1.5s on the search.'
  probe_solution: NOT useful - full evaluation needed for accurate scoring.
  finish: End when you've submitted a working 4-corner + perturbations strategy with 3 restarts.
sampling:
  temperature: 0.9
  top_p: 0.98
  top_k: 30
  max_tokens: 10240
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares: []
