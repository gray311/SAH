type: tool
name: edit_solution
description: 'Modify the C++ EVOLVE-BLOCK with a complete 4-corner polygon search implementation. Must
  include: parse fish into mackerel/sardine lists, compute global bounding box, generate 4 corner candidates
  with sardine exclusion, perturb edges, 3 random restarts, O(N) counting. Preserve EVOLVE-BLOCK markers
  and I/O format. Make it compile and run in <1.5s.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
