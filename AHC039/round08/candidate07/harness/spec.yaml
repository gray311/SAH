schema: h2spec/1.0
system_prompt: "You are a C++ polygon optimizer for axis-aligned fish capture (maximize mackerels - sardines + 1).\n\nCORE STRATEGY: Try multiple explicit polygon patterns with local edge refinement.\n\n1. SPATIAL SETUP: Use 100x100 grid (cell_size=1000) for O(1) rectangle queries. Build grid at startup.\n\n2. PATTERN GENERATION: For EACH of these patterns, generate candidates:\n   - RECTANGLE: Find best bounding box around a 5x5 cell window\n   - L-SHAPE: Two connected rectangles forming an L, parameterized by corner position\n   - U-SHAPE: Three rectangles forming a U, exclude one side\n   - STEPPED: Sequence of up/down steps, parameterized by step height/width\n   - TIGHT-BOX: For each high-density cell, tight box around its fish\n\n3. FOR EACH PATTERN:\n   - Sample 20-30 random instances\n   - For each instance, do local edge optimization: try shifting each edge by -20 to +20 (step 5)\n   - Keep best valid polygon per pattern\n\n4. OUTPUT: The single best polygon across all patterns\n\nCRITICAL: Code must include all pattern generators, grid-based scoring, and local optimization loops. Time budget: ~1.5s for search, 0.5s margin. Preserve EVOLVE-BLOCK markers and exact I/O format (m then m vertices)."
skill_description: "Optimize via multi-pattern search: rectangle, L-shape, U-shape, stepped polygons with local edge refinement. Uses 100x100 grid for fast scoring. Sample 30+ candidates per pattern, optimize edges locally, output best valid polygon."
skill_body: "# Multi-Pattern Polygon Optimization\n\n## Strategy: Generate multiple explicit polygon patterns, optimize edges locally, return best.\n\n### Phase 1: Grid Setup\n- Build 100x100 grid over [0,100000]² (cell_size=1000)\n- For each cell, count mackerels (M) and sardines (S)\n- Precompute prefix sums for O(1) rectangle queries\n\n### Phase 2: Pattern Generation\n\n**Pattern A: Rectangle**\n- Slide a window over 5x5 cells (≈5000×5000 area)\n- For each window, find tight bounding box of all fish inside\n- Score = rectangle_score(minX, minY, maxX, maxY)\n\n**Pattern B: L-Shape**\n- Choose corner (cx, cy) in grid\n- Choose arm widths (w1, w2) in cells (1-10 each)\n- Form L: two rectangles sharing a corner\n- Score using grid prefix sums\n\n**Pattern C: U-Shape**\n- Similar to L but with three arms\n- Can exclude a sardine-rich region while keeping fish-rich areas\n\n**Pattern D: Stepped Polygon**\n- Start from a dense cell, step up/down/left/right\n- Each step adds a segment, keep if score improves\n- Limit to 10-15 segments\n\n### Phase 3: Local Edge Optimization\nFor each candidate polygon:\n- For each edge (4-20 edges):\n  - Try shifting inward by +5, +10, +15, +20 units\n  - Try shifting outward by -5, -10, -15, -20 units\n  - Recompute score using grid query\n  - Keep shift that improves score\n- Repeat 2 rounds\n\n### Phase 4: Random Restarts\n- Run Phases 2-3 with 10 different random seeds (different window starts)\n- Track best polygon across all runs\n\n## C++ Implementation\n- Use fixed 100x100 grid array\n- Precompute 2D prefix sums for O(1) rectangle queries\n- All patterns must produce valid axis-aligned polygons\n- Output: m (vertices), then m lines of (x, y)"
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with multi-pattern C++ code. Must include: 100x100 grid with prefix sums, 4 polygon patterns (rectangle, L-shape, U-shape, stepped), local edge optimization (±5 to ±20 per edge), 10 random restarts. Output format: m vertices. Compile in <2s.'
  evaluate_solution: 'Run C++ program, return score (mackerels-sardines+1), validity, evals left (budget=30). Each run ≤2s.'
  probe_solution: 'Not useful - exact scoring required.'
  finish: 'End when multi-pattern code is submitted.'
sampling:
  temperature: 0.9
  top_p: 0.98
  top_k: 30
  max_tokens: 10000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 12000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares: []
