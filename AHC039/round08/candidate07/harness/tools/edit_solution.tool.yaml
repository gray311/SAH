type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with multi-pattern C++ code. Must include: 100x100 grid with prefix
  sums, 4 polygon patterns (rectangle, L-shape, U-shape, stepped), local edge optimization (±5 to ±20
  per edge), 10 random restarts. Output format: m vertices. Compile in <2s.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
