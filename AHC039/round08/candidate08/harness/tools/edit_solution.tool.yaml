type: tool
name: edit_solution
description: 'Modify the C++ EVOLVE-BLOCK with a complete multi-scale sliding window polygon search implementation.

  Must include: 50x50 fine grid, top-50 cluster expansion, per-cluster 4 polygon variants, polygon merging
  across clusters, per-edge refinement with 6-step gradient search, and 10 random restarts.

  Preserve EVOLVE-BLOCK markers and I/O format. Each edit encodes ONE complete search strategy.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
