type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with coordinate projection + binary search. Include: 2D coordinate
  compression, sparse prefix sum grid, systematic search over x-y boundary pairs. Preserve EVOLVE-BLOCK
  markers and I/O format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
