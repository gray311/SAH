type: tool
name: edit_solution
description: 'Modify the C++ EVOLVE-BLOCK with complete multi-shape global search implementation.

  Must include: 200x200 grid, 20-30 random seeds, 4-5 polygon shapes per seed (rectangle, L-shape, frame,
  multi-rectangle), hill climbing edge shifts ±5..50, and 10 random restarts.

  Preserve EVOLVE-BLOCK markers and I/O format. Make it compile and run in <2s.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
