type: tool
name: edit_solution
description: 'Modify the C++ EVOLVE-BLOCK with a complete global coordinate-space polygon search.


  Must include: 2D grid (cell_size=200), high-density region identification, greedy rectangle expansion

  with perimeter-aware stopping, multi-shape combination, hill climbing with boundary smoothing,

  and 4 time-bounded strategies.


  Preserve EVOLVE-BLOCK markers and exact I/O format. Each edit encodes ONE search strategy improvement.


  Time budget: 2.0s total. Each strategy ~0.4s. Stop when time limit reached.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
