type: tool
name: edit_solution
description: 'Replace the EVOLVE-BLOCK with complete targeted single-fish capture code. Must include:
  (1) fish parsing into coordinate arrays, (2) isolation detection (sardine distance > 300), (3) tight
  box generation around isolated mackerels, (4) controlled expansion while excluding sardines, (5) optional
  box combination, (6) hill climbing refinement, (7) 10 random restarts. Preserve EVOLVE-BLOCK markers
  and exact I/O format (m vertices, then each vertex). Code must compile and run in <2s.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
