type: tool
name: finish
description: Submit when you have a working isolated-fish search that targets mackerels with no nearby
  sardines, generates tight boxes, expands while excluding sardines, and uses random restarts.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
