type: tool
name: build_rectangle
description: Build a large axis-aligned rectangle from a seed cell by expanding in 4 cardinal directions.
  Avoid regions with high sardine density. Returns rectangle vertices and score.
input_schema:
  type: object
  properties:
    seed_cell:
      type: object
      properties:
        row:
          type: integer
        col:
          type: integer
    max_perimeter:
      type: integer
      default: 400000
    expansion_factor:
      type: integer
      default: 200
