type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing regional rectangle strategy:

  1. Build 50x50 grid (cell_size=2000), count M/S per cell

  2. Find top 20 cells with highest positive score

  3. From each, build large axis-aligned rectangles

  4. Combine 2-5 rectangles into single polygon

  5. Refine edge positions with ±100..300 shifts

  6. Run 25-30 restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
