type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct rectangle search:

  1. Build 100001x100001 prefix sum grids for mackerels and sardines

  2. Extract top 200 unique x and y coordinates with mackerels

  3. Generate all rectangle combinations, filter by perimeter <= 400,000

  4. Score each with O(1) prefix sum queries

  5. Local optimization with boundary adjustments ±1, ±5, ±10

  6. Output best rectangle as 4 vertices'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
