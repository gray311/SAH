type: tool
name: find_best_rectangle
description: 'Search for optimal axis-aligned rectangle using grid-based O(1) counting.

  Takes unique coordinates from mackerel positions, generates rectangle candidates,

  scores with prefix sum grid, returns best rectangle within perimeter constraint.

  Call this at the start to find the optimal bounding rectangle.'
input_schema:
  type: object
  properties:
    max_coords:
      type: integer
      default: 200
      description: Number of top coordinates to consider
