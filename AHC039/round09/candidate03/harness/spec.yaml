schema: h2spec/1.0
system_prompt: "You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).\n\nOPTIMAL STRATEGY: Direct pair-based rectangle search.\n\nMETHOD:\n1. Read all mackerel and sardine coordinates from input\n2. For each pair of mackerels (i,j) where i<j:\n   - Compute minimal axis-aligned rectangle: x_min=min(x_i,x_j), x_max=max(x_i,x_j), y_min=min(y_i,y_j), y_max=max(y_i,y_j)\n   - Count mackerels and sardines inside this rectangle (inclusive boundaries)\n   - Score = mackerels_count - sardines_count + 1\n   - If score > best_score, update best polygon\n3. Also try rectangles around single mackerels (x_min=x_i, x_max=x_i+1, y_min=y_i, y_max=y_i+1) to ensure valid 4-vertex polygon\n4. Output the best rectangle found\n5. Ensure: 4 vertices, integer coords in [0,100000], no self-intersection (rectangle is always valid), perimeter <= 400,000\n\nTIME BUDGET: < 2.0s. With N=5000 mackerels, N^2/2 = ~12.5M pairs. Use early termination: stop if time remaining < 0.1s and best_score is good. Use randomized pair selection with bias toward high-scoring pairs.\n\nKEY INSIGHT: Simple rectangles are faster to construct and validate than complex multi-lobed polygons. Many 2-mackerel rectangles with 0 sardines give score=3.\n\nAvoid the flawed corridor expansion approach - it wastes time building invalid or suboptimal polygons."
skill_description: "Direct pair-based rectangle search: pick mackerel pairs, build minimal enclosing rectangle, count fish, score. Simple, fast, valid polygons."
skill_body: "# Pair-Based Rectangle Optimization Strategy\n\n## Core Idea\nInstead of building complex multi-lobed polygons, focus on simple rectangles that enclose exactly 2 mackerels with 0 sardines. Score = 2 - 0 + 1 = 3.\n\n## Algorithm\n1. Parse all fish coordinates from input\n2. For each pair of mackerels:\n   - Compute bounding rectangle: x_min=min(x1,x2), x_max=max(x1,x2), y_min=min(y1,y2), y_max=max(y1,y2)\n   - Ensure rectangle is valid (not degenerate, within bounds)\n   - Count mackerels and sardines inside (inclusive)\n   - Score = m - s + 1\n3. Track best rectangle across all pairs\n4. Also try single-mackerel degenerate rectangles (width/height = 1) as fallback\n5. Output best valid rectangle (4 vertices)\n\n## Implementation Details\n- Use O(N^2) pair enumeration but with random sampling to save time\n- Use coordinate compression or grid for O(1) point-in-rectangle queries if needed\n- Early termination when time budget exhausted\n- Always output 4-vertex axis-aligned rectangle\n- Validate perimeter <= 400,000 (always true for N=5000, coords <= 100000)\n\n## Why This Works\n- Simple geometry: rectangles never self-intersect\n- Fast construction: O(1) per pair\n- Many successful cases: with random fish distribution, many 2-mackerel pairs have no sardines nearby\n- Score = 3 is achievable and stable\n- Within all constraints: 4 vertices, integer coords, valid perimeter\n\n## Time Optimization\n- Random sample pairs instead of exhaustive enumeration\n- Use spatial indexing for faster containment checks\n- Early stop when time < 0.1s\n- Parallel pair processing if beneficial\n\n## Fallback\nIf no 2-mackerel rectangle found with 0 sardines, try:\n- Single mackerel with 1x1 rectangle (score = 1-0+1 = 2)\n- Multiple small clusters\n- Always ensure valid 4-vertex output"
new_tools:
- name: evaluate_rectangle
  description: 'Evaluate a candidate rectangle by counting mackerels and sardines inside (inclusive boundaries). Returns score, m_count, s_count, and validity check.'
  input_schema:
    type: object
    properties:
      x_min:
        type: integer
      x_max:
        type: integer
      y_min:
        type: integer
      y_max:
        type: integer
  implementation_py: 'def run(ctx, args):\n    x_min = args.get("x_min", 0)\n    x_max = args.get("x_max", 100000)\n    y_min = args.get("y_min", 0)\n    y_max = args.get("y_max", 100000)\n    \n    # Parse program to extract fish positions\n    program_text = ctx.get_program()\n    mackerels = []\n    sardines = []\n    for line in program_text.split("\\n"):\n        line = line.strip()\n        if line.startswith("fish[") or "mackerel" in line.lower() or "sardine" in line.lower():\n            try:\n                # Extract coordinates from fish definition\n                if "x" in line and "y" in line:\n                    parts = line.replace("(", "").replace(")", "").replace("\\n", "").replace(" ", "").split(",")\n                    if len(parts) >= 2:\n                        x, y = int(parts[0]), int(parts[1])\n                        if "mackerel" in line.lower():\n                            mackerels.append((x, y))\n                        else:\n                            sardines.append((x, y))\n            except:\n                continue\n    \n    # Count fish inside rectangle (inclusive boundaries)\n    m_count = 0\n    s_count = 0\n    for (x, y) in mackerels:\n        if x_min <= x <= x_max and y_min <= y <= y_max:\n            m_count += 1\n    for (x, y) in sardines:\n        if x_min <= x <= x_max and y_min <= y <= y_max:\n            s_count += 1\n    \n    score = max(0, m_count - s_count + 1)\n    \n    # Validate rectangle\n    valid = True\n    errors = []\n    if x_min < 0 or x_max > 100000:\n        valid = False\n        errors.append("coords out of bounds")\n    if x_min > x_max or y_min > y_max:\n        valid = False\n        errors.append("invalid rectangle bounds")\n    perimeter = 2 * ((x_max - x_min) + (y_max - y_min))\n    if perimeter > 400000:\n        valid = False\n        errors.append("perimeter exceeds limit")\n    \n    return {\n        "x_min": x_min, "x_max": x_max, "y_min": y_min, "y_max": y_max,\n        "m_count": m_count, "s_count": s_count, "score": score,\n        "valid": valid, "errors": errors if not valid else []\n    }'
new_skills:
- name: rectangle-search-strategy
  description: Use pair-based rectangle search to find 2-mackerel, 0-sardine rectangles. Simple, fast, valid polygons.
  body: '# Pair-Based Rectangle Search Strategy\n\n## Core Principle\nFind rectangles that enclose exactly 2 mackerels with 0 sardines. Score = 2 - 0 + 1 = 3.\n\n## Algorithm Steps\n\n### Step 1: Parse Input\n- Extract all mackerel coordinates: (x_m1, y_m1), (x_m2, y_m2), ...\n- Extract all sardine coordinates: (x_s1, y_s1), (x_s2, y_s2), ...\n- Store in lists for efficient querying\n\n### Step 2: Generate Rectangle Candidates\nFor each pair of mackerels (i, j) where i < j:\n- x_min = min(x_mi, x_mj)\n- x_max = max(x_mi, x_mj)\n- y_min = min(y_mi, y_mj)\n- y_max = max(y_mi, y_mj)\n- Ensure x_max >= x_min and y_max >= y_min (degenerate if equal, use width=1)\n- Check if rectangle is within bounds [0, 100000]\n\n### Step 3: Score Each Rectangle\nFor each candidate rectangle:\n- Count mackerels inside (inclusive: x_min <= x <= x_max, y_min <= y <= y_max)\n- Count sardines inside (inclusive)\n- Score = m_count - s_count + 1\n- If score > best_score, update best rectangle\n\n### Step 4: Randomized Sampling\n- With 2.0s time budget, cannot enumerate all N^2/2 pairs (12.5M)\n- Use random sampling: pick K pairs uniformly at random\n- Use bias: prefer pairs with closer coordinates (smaller rectangles)\n- Early termination: when time < 0.1s, return best found\n\n### Step 5: Fallback Strategies\nIf no good rectangle found:\n- Try single mackerel with 1x1 rectangle: score = 1 - 0 + 1 = 2\n- Try pairs with 1 sardine: score = 2 - 1 + 1 = 2\n- Always output valid 4-vertex rectangle\n\n### Step 6: Output\n- Output m=4\n- Output 4 vertices: (x_min, y_min), (x_max, y_min), (x_max, y_max), (x_min, y_max)\n- Ensure clockwise or counterclockwise order\n\n## Key Advantages\n- Simple geometry: rectangles never self-intersect\n- Fast construction: O(1) per pair\n- Many successful cases expected\n- Achievable score >= 3\n- Within all constraints\n\n## Implementation Notes\n- Use std::vector for fish storage\n- Use randomized pair selection with time-based early exit\n- Include bounds checking for all coordinates\n- Handle degenerate rectangles (width=0 or height=0) by expanding to 1\n- Always output exactly 4 vertices for axis-aligned rectangle'
new_middlewares:
- name: focus_on_rectangles
  hook: before_model
  description: remind solver to use simple rectangle construction instead of complex corridors
  implementation_py: 'def before_model(hook_input):\n    return "Focus on simple 2-mackerel rectangles with 0 sardines. Score = 3. Use randomized pair sampling, early termination at 0.1s. Output 4-vertex axis-aligned rectangle."'
