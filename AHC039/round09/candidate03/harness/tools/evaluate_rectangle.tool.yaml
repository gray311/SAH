type: tool
name: evaluate_rectangle
description: Evaluate a candidate rectangle by counting mackerels and sardines inside (inclusive boundaries).
  Returns score, m_count, s_count, and validity check.
input_schema:
  type: object
  properties:
    x_min:
      type: integer
    x_max:
      type: integer
    y_min:
      type: integer
    y_max:
      type: integer
