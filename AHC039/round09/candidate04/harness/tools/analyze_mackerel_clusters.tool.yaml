type: tool
name: analyze_mackerel_clusters
description: 'Analyze mackerel positions to find dense clusters and their minimum enclosing rectangles
  (MERs).

  Groups mackerels within 2000 units, computes MER for each cluster, counts sardines in each MER,

  and ranks clusters by score (mackerels - sardines).'
input_schema:
  type: object
  properties:
    distance_threshold:
      type: integer
      default: 2000
