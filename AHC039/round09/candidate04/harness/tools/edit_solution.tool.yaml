type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based optimization:


  1. Parse fish positions, group mackerels into clusters (distance <= 2000)

  2. For each cluster, compute MER and score = mackerels - sardines_in_MER

  3. Take top clusters, build polygon as union of their MERs

  4. Merge overlapping MERs to minimize perimeter

  5. Local edge optimization with ±1, ±2, ±5 shifts, 2 rounds

  6. Run 10-15 restarts with different cluster combinations

  7. Output best polygon


  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
