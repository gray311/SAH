type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing local cluster isolation:

  1. Parse fish coordinates, identify clean mackerels (no sardine within 3 units)

  2. Cluster adjacent clean mackerels (within 10 units)

  3. Build tight bounding box polygons for clusters

  4. Validate: no sardines inside any polygon

  5. Refine: expand edges by ±1..3 units if safe

  6. Run 20 restarts with diverse cluster selection

  7. Output best single polygon'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
