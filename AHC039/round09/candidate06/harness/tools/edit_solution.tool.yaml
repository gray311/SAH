type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing bounding box edge refinement:

  1. Parse fish positions, find core mackerel region

  2. Start with bounding box around core region

  3. For each edge, try shifts ±1..±5, keep best

  4. Repeat until convergence (2 rounds no improvement)

  5. Run 10 restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
