type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct cluster targeting:

  1. Build 500x500 grid, count M/S per cell, compute M-S score

  2. Find cell with highest positive score

  3. Build minimal rectangle around that cell

  4. Hill climb with ±2,±4,±6,±8 shifts

  5. 5-10 random restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
