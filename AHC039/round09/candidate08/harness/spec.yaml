schema: h2spec/1.0
system_prompt: "You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).\n\nCRITICAL STRATEGY: Build rectangles around mackerel clusters, avoiding sardine-rich areas.\n\nSEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):\n\n1. CLUSTER DETECTION:\n   - Read all fish coordinates from input\n   - Identify mackerel clusters: groups of mackerels within 200 coordinate units of each other\n   - For each cluster, compute the minimal axis-aligned bounding box (min_x, min_y, max_x, max_y)\n   - Count mackerels and sardines inside each cluster's bounding box\n\n2. CLUSTER RANKING:\n   - Score each cluster: (mackerels_in_box - sardines_in_box + 1) / mackerels_in_box * 100\n   - Select top 10 clusters with highest positive score and sufficient mackerel count (>=3)\n\n3. RECTANGLE CONSTRUCTION:\n   - For each selected cluster, create a rectangle using its bounding box coordinates\n   - Ensure rectangle has 4 vertices: (min_x, min_y), (max_x, min_y), (max_x, max_y), (min_x, max_y)\n   - Merge overlapping rectangles if needed to form a single polygon\n   - If rectangles do not overlap, create separate valid polygons for each (output the one with highest score)\n\n4. VALIDATION AND OUTPUT:\n   - Ensure polygon has 4-1000 vertices, perimeter <= 400,000, coordinates in [0, 100000]\n   - Output format: m (vertex count) followed by m lines of x y\n   - Use multiple random restarts (15-20) with different cluster selection strategies\n\n5. KEY DIFFERENCE from grid approach:\n   - Work with actual fish coordinates, not grid cells\n   - Focus on mackerel density, not M-S ratio per arbitrary cell\n   - Build minimal-perimeter rectangles around dense clusters\n\nTools:\n- edit_solution: Replace EVOLVE-BLOCK with C++ implementing cluster-based rectangle construction\n- evaluate_solution: Run C++ program, get score\n- probe_solution: Use cluster-based scoring to rank candidates\n- finish: Submit when you have encoded a working cluster-based approach with 15-20 restarts\n\nPreserve EVOLVE-BLOCK markers, exact I/O format (m then vertices), and ensure <2.0s execution.\n\nKEY INNOVATION: Replace grid-based corridor expansion with direct cluster detection and bounding box construction around mackerel-rich regions."
skill_description: Cluster-based rectangle construction. Find mackerel clusters within 200 units, compute bounding boxes, score by (M-S+1)/M ratio, select top 10 clusters, build rectangles, merge or output best single polygon. 15-20 restarts.
skill_body: "# Cluster-Based Rectangle Construction Strategy\n\n## Core Idea\n\nInstead of grid-based approximation, directly work with fish coordinates to find dense mackerel clusters and build minimal-perimeter rectangles around them.\n\n## Phase 1: Cluster Detection\n- Read all fish coordinates from input (5000 mackerels + 5000 sardines)\n- Identify clusters: groups of mackerels where pairwise distance <= 200 units\n- Use hierarchical clustering: start with each mackerel as its own cluster, merge clusters within 200 units\n- Limit to clusters with >= 3 mackerels to avoid noise\n\n## Phase 2: Bounding Box Computation\n- For each cluster, compute minimal axis-aligned bounding box:\n  - min_x = minimum x-coordinate in cluster\n  - min_y = minimum y-coordinate in cluster\n  - max_x = maximum x-coordinate in cluster\n  - max_y = maximum y-coordinate in cluster\n\n## Phase 3: Cluster Scoring\n- For each bounding box, count mackerels and sardines inside\n- Score = (mackerels - sardines + 1) / mackerels * 100\n- Select top 10 clusters with highest positive score and mackerel count >= 3\n\n## Phase 4: Rectangle Construction\n- Convert each selected cluster into a 4-vertex rectangle\n- If rectangles overlap significantly, merge them into a single polygon\n- If rectangles are separate, choose the one with highest individual score\n\n## Phase 5: Validation\n- Ensure polygon has 4-1000 vertices (rectangles have exactly 4)\n- Ensure perimeter <= 400,000 (each edge <= 100,000, so 4*4*100,000 = 1,600,000 max, but we select high-density clusters which will be smaller)\n- Ensure all coordinates in [0, 100000]\n- Use KVH validator for self-intersection check (trivial for rectangles)\n\n## Phase 6: Multiple Restarts\n- Run 15-20 restarts with different:\n  - Random perturbations to cluster distance threshold (150-250)\n  - Different cluster merging strategies\n  - Different selection criteria (top 5 vs top 10)\n- Output the best polygon across all restarts\n\n## Key Success Factors\n- Direct coordinate analysis is more accurate than grid approximation\n- Focus on mackerel density, not arbitrary M-S ratios\n- Minimal-perimeter rectangles maximize the score\n- Multiple restarts explore diverse cluster configurations\n- 15-20 restarts provides sufficient diversity while staying under 2.0s time limit"
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based rectangle construction:\n\n1. Read fish coordinates, identify mackerel clusters within 200 units\n\n2. For each cluster, compute minimal axis-aligned bounding box\n\n3. Count M and S inside each bounding box, score = (M - S + 1) / M * 100\n\n4. Select top 10 clusters with positive score and M >= 3\n\n5. Convert to rectangles, merge if overlapping, or select best single rectangle\n\n6. Output valid polygon (4 vertices), ensure perimeter <= 400,000\n\n7. Run 15-20 restarts, output best result\n\nEnsure <2.0s execution, valid output format (m then vertices).'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: Use cluster-based scoring. For a given rectangle candidate, count M and S inside, return (M - S + 1) / M * 100. Use to rank candidates before full eval.
  finish: End when you have submitted a working cluster-based rectangle construction with 15-20 restarts.
