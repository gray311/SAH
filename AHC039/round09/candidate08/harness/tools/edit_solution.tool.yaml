type: tool
name: edit_solution
description: Replace EVOLVE-BLOCK with C++ implementing cluster-based rectangle construction:\n\n1. Read
  fish coordinates, identify mackerel clusters within 200 units\n\n2. For each cluster, compute minimal
  axis-aligned bounding box\n\n3. Count M and S inside each bounding box, score = (M - S + 1) / M * 100\n\n4.
  Select top 10 clusters with positive score and M >= 3\n\n5. Convert to rectangles, merge if overlapping,
  or select best single rectangle\n\n6. Output valid polygon (4 vertices), ensure perimeter <= 400,000\n\n7.
  Run 15-20 restarts, output best result\n\nEnsure <2.0s execution, valid output format (m then vertices).
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
