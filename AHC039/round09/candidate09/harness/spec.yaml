schema: h2spec/1.0
system_prompt: "You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).\n\nCRITICAL STRATEGY: Cluster-based rectangular construction with strategic inter-cluster connections.\n\nSEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):\n\n1. CLUSTER DETECTION:\n   - Read all mackerel coordinates\n   - Use DBSCAN-like clustering with radius=8000 to group nearby mackerels\n   - For each cluster, compute its bounding box\n\n2. RECTANGULAR CONSTRUCTION:\n   - For each cluster, create a minimal axis-aligned rectangle covering it\n   - Rectangle vertices: (min_x, min_y), (max_x, min_y), (max_x, max_y), (min_x, max_y)\n   - Score = mackerels_in - sardines_in + 1\n   - Filter: only keep rectangles with positive score\n\n3. INTER-CLUSTER CONNECTIONS:\n   - Sort remaining rectangles by score descending\n   - Try connecting adjacent rectangles (sharing edge or close proximity)\n   - When connecting, compute the combined polygon score\n   - Allow connection even if connecting through low-score regions IF it enables capturing more fish\n   - Maximum 5 rectangles per polygon\n\n4. PERIMETER VALIDATION:\n   - Ensure total perimeter <= 400,000\n   - Each rectangle should have perimeter <= 300,000 to allow connections\n\n5. MULTIPLE RESTARTS:\n   - Run 20 restarts with different random seeds\n   - Each restart: regenerate clusters with slight perturbations\n   - Try different connection strategies (greedy, best-first)\n   - Track best polygon across all restarts\n\n6. VALIDATION:\n   - Output valid polygon (4-1000 vertices, integer coords, no self-intersection)\n   - Use a simple self-intersection check (no edge crossings)\n\nTools:\n- edit_solution: Replace EVOLVE-BLOCK with complete C++ implementation of cluster-based rectangular construction\n- evaluate_solution: Run C++ program, get score\n- probe_solution: NOT useful - full evaluation needed\n- finish: Submit when you have encoded a working cluster-based rectangular construction with 20 restarts\n\nPreserve EVOLVE-BLOCK markers, exact I/O format (m then vertices), and ensure <2.0s execution.\n\nKEY DIFFERENCE from seed: Use clustering to find natural mackerel groupings, build rectangles around them, and strategically connect high-value rectangles while accepting some sardine penalty for connection benefits."
skill_description: Cluster-based rectangular construction. Detect mackerel clusters via proximity, build axis-aligned rectangles around each, strategically connect adjacent high-value rectangles, multiple restarts.
skill_body: "# Cluster-Based Rectangular Construction Strategy\n\n## Phase 1: Cluster Detection\n- Read all mackerel coordinates from input\n- Use proximity-based clustering (radius ~8000) to group nearby mackerels\n- Each cluster represents a potential polygon region\n\n## Phase 2: Rectangle Construction\nFor each cluster:\n- Compute bounding box: (min_x, min_y) to (max_x, max_y)\n- Create axis-aligned rectangle with 4 vertices\n- Count mackerels and sardines inside rectangle\n- Score = mackerels - sardines + 1\n- Keep only rectangles with positive score\n\n## Phase 3: Strategic Connections\n- Sort rectangles by score descending\n- For each pair of adjacent rectangles (share edge or close):\n  - Compute combined polygon (union of rectangles)\n  - Score the combined polygon\n  - If combined score > individual scores, keep connection\n- Maximum 5 rectangles per final polygon\n\n## Phase 4: Multiple Restarts\n- Run 20 restarts with different random seeds\n- Each restart:\n  * Slightly perturb cluster centers (add random offset)\n  * Re-run clustering and rectangle construction\n  * Try different connection strategies\n- Track best polygon across all restarts\n\n## C++ Implementation Notes\n- Use O(N log N) clustering via sort and sweep\n- Rectangle scoring via point-in-rectangle tests\n- Combined polygon scoring via vertex iteration\n- Total time per evaluation: < 2.0s\n- Include simple self-intersection check for polygon validity"
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based rectangular construction:

    1. Cluster mackerels by proximity (radius ~8000)

    2. Build axis-aligned rectangles around each cluster

    3. Score each rectangle (mackerels - sardines + 1)

    4. Connect adjacent high-value rectangles strategically

    5. Run 20 restarts, output best polygon

    Ensure <2.0s execution, valid output format.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - full evaluation needed for accurate scoring.
  finish: End when you have submitted a working cluster-based rectangular construction with 20 restarts.
sampling:
  temperature: 1.2
  top_p: 0.9
  top_k: 20
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
new_tools: []
new_skills: []
new_middlewares: []
