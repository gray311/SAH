type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based rectangular construction:

  1. Cluster mackerels by proximity (radius ~8000)

  2. Build axis-aligned rectangles around each cluster

  3. Score each rectangle (mackerels - sardines + 1)

  4. Connect adjacent high-value rectangles strategically

  5. Run 20 restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
