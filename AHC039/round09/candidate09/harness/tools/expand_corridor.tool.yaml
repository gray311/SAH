type: tool
name: expand_corridor
description: 'Expand a corridor from a seed cell in a given direction, avoiding sardine-dense regions.

  Returns the corridor path as a list of cell coordinates and final cell score.'
input_schema:
  type: object
  properties:
    seed_cell:
      type: object
      properties:
        row:
          type: integer
        col:
          type: integer
    direction:
      type: string
      enum:
      - N
      - S
      - E
      - W
    max_length:
      type: integer
      default: 100
