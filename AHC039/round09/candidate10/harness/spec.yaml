schema: h2spec/1.0
system_prompt: "You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).\n\nCRITICAL FAILURE ANALYSIS: The current harness strategy (grid-based corridor expansion) is failing because:\n1. Grid granularity (cell_size=500) is too coarse to capture the fine-grained fish distribution\n2. Corridor expansion creates thin rectangles that often fail to enclose enough fish\n3. The validator (KVH) may be rejecting valid polygons due to implementation bugs\n4. Hill climbing on edges is too slow and doesn't explore the search space well\n\nNEW STRATEGY: Use a DIRECT PACKING approach:\n\n1. SORTING-BASED BOUNDARY CONSTRUCTION:\n   - Sort all mackerels by x-coordinate, take top K (K=500)\n   - Sort all sardines by x-coordinate, take top K (K=500)\n   - Create a polygon that encloses the leftmost M mackerels while excluding the leftmost S sardines\n   - Use the bounding box of selected mackerels and expand/contract edges to avoid sardines\n\n2. SPECIFIC POLYGON CONSTRUCTION:\n   - Find min_x and max_x of top K mackerels\n   - Find min_y and max_y of top K mackerels\n   - Create a rectangle with corners at (min_x, min_y), (max_x, min_y), (max_x, max_y), (min_x, max_y)\n   - For each edge, check if any sardines are on it and adjust the edge position to exclude them\n   - Expand the rectangle in all 4 directions as long as it captures more mackerels and avoids sardines\n\n3. K-WAY CLUSTERING:\n   - Divide the 2D space into a 5x5 grid (20x20 cells)\n   - For each cell, count mackerels and sardines\n   - Select cells with positive score (M > S)\n   - For each selected cell, create a small rectangle that encloses the mackerels\n   - Combine these rectangles into a single polygon (union of convex hulls)\n\n4. ADVANCED HILL CLIMBING:\n   - Start with the initial polygon\n   - For each vertex, try perturbation in 8 directions (N, NE, E, SE, S, SW, W, NW)\n   - For each direction, try 3 distance values: 100, 200, 500 units\n   - Accept if the new polygon has higher score\n   - Repeat until no improvement or max iterations reached\n\n5. TIME-EFFICIENT IMPLEMENTATION:\n   - Pre-compute all fish positions into arrays\n   - Use binary search to quickly find which fish are inside/outside a polygon\n   - Cache polygon score computation\n   - Limit the number of hill climbing iterations per eval to keep total time < 2s\n\n6. VALIDATION:\n   - Always output a valid polygon (4-1000 vertices, integer coords, perimeter <= 400000)\n   - Use simple bounding box check before output\n   - Ensure no self-intersection (axis-aligned polygons are simpler)\n\nKEY DIFFERENCE from seed: Instead of grid-based corridor expansion, use direct packing of mackerel clusters with sardine-aware boundary adjustment."
skill_description: "Direct packing strategy for fish capture polygon. Sort mackerels and sardines, create bounding boxes around clusters, adjust boundaries to exclude sardines, use 5x5 cell clustering for multi-region capture, advanced hill climbing with 8-direction perturbations."
skill_body: "# Direct Packing Strategy for Fish Capture\n\n## Phase 1: Fish Data Loading and Pre-processing\n- Parse all fish positions from input\n- Store mackerels and sardines in separate arrays\n- Compute basic statistics (min/max x/y, total counts)\n\n## Phase 2: Cluster-Based Packing\n### Option A: K-Way Clustering (Primary Strategy)\n1. Divide [0,100000]x[0,100000] into a 5x5 grid (cell_size=20000)\n2. For each cell, count mackerels (M) and sardines (S)\n3. Select cells where M > S (positive score)\n4. For each selected cell:\n   - Find the bounding box of mackerels in that cell\n   - Create a rectangle that encloses these mackerels\n   - Expand the rectangle in all 4 directions as long as:\n     * New cells have M > S\n     * No sardines are on the boundary\n   - Store the rectangle as a candidate\n5. Combine all rectangles into a single polygon:\n   - Sort rectangles by their centroid\n   - Use a greedy approach to merge overlapping rectangles\n   - Ensure the final polygon has valid axis-aligned edges\n\n### Option B: K-Way Sorting (Secondary Strategy)\n1. Sort all mackerels by x-coordinate\n2. Take the top K mackerels (K=500) as the \"target cluster\"\n3. Find the bounding box of these K mackerels\n4. For each side of the bounding box:\n   - Check if any sardines are on that edge\n   - If yes, shift the edge to exclude sardines while still enclosing mackerels\n   - Expand the edge outward if it captures more mackerels\n5. Output the final polygon\n\n## Phase 3: Sardine-Aware Boundary Adjustment\nFor each edge of the polygon:\n- Check if any sardine lies on this edge (using integer arithmetic)\n- If a sardine is on the edge, shift the edge by 1 unit in the direction that excludes it\n- Repeat until no sardines are on any edge\n\n## Phase 4: Advanced Hill Climbing\nFor each vertex of the polygon (up to 1000):\n- Try perturbing in 8 directions: N, NE, E, SE, S, SW, W, NW\n- For each direction, try 3 distances: 100, 200, 500 units\n- Compute the score for each perturbed polygon\n- Accept the perturbation that gives the highest score\n- Repeat for up to 100 iterations or until no improvement\n\n## Phase 5: Multiple Restarts\n- Run 5-10 restarts with different strategies:\n  * Vary the clustering grid size (5x5, 10x10, 20x20)\n  * Vary the K value for top-K sorting\n  * Vary the initial polygon construction method\n- Track the best polygon across all restarts\n- Output the best polygon\n\n## Implementation Notes\n- Use efficient data structures for fish position lookups\n- Pre-compute fish positions into arrays for fast access\n- Use integer arithmetic for all coordinate calculations\n- Ensure the final polygon satisfies all constraints:\n  * 4 <= vertices <= 1000\n  * Integer coordinates in [0,100000]\n  * Perimeter <= 400000\n  * No self-intersection\n- Limit total execution time to < 2.0 seconds"
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing direct packing strategy:

    1. Parse all fish positions into mackerel and sardine arrays

    2. Implement K-way clustering (5x5 grid) to identify positive-score cells

    3. For each positive cell, create a bounding box around mackerels

    4. Adjust boundaries to exclude sardines on edges

    5. Combine rectangles into a single valid polygon

    6. Apply advanced hill climbing (8-direction, 3 distances per vertex)

    7. Run 5-10 restarts with different parameters

    8. Output best polygon ensuring <2.0s execution and valid output format.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - full evaluation needed for accurate scoring.
  finish: End when you have a working direct packing strategy with K-way clustering and advanced hill climbing.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 25
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares: []
