type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct packing strategy:

  1. Parse all fish positions into mackerel and sardine arrays

  2. Implement K-way clustering (5x5 grid) to identify positive-score cells

  3. For each positive cell, create a bounding box around mackerels

  4. Adjust boundaries to exclude sardines on edges

  5. Combine rectangles into a single valid polygon

  6. Apply advanced hill climbing (8-direction, 3 distances per vertex)

  7. Run 5-10 restarts with different parameters

  8. Output best polygon ensuring <2.0s execution and valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
