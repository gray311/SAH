type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct cluster-wrapping:

  1. Parse fish positions into spatial hash map

  2. Cluster mackerels by x and y proximity (±100)

  3. For each cluster, compute bounding box and sardine count

  4. Create rectangles for top clusters, expand with ±50..100

  5. Union top rectangles, validate output

  6. Output best polygon, <2.0s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
