type: tool
name: find_cluster
description: Find a mackerel cluster by grouping fish with similar coordinates, compute its bounding box
  and sardine count.
input_schema:
  type: object
  properties:
    cluster_type:
      type: string
      enum:
      - x_based
      - y_based
    width:
      type: integer
      default: 100
    height:
      type: integer
      default: 100
