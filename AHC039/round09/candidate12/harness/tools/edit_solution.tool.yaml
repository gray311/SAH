type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle enumeration with KD-tree scoring: 1.
  Build KD-tree from fish positions 2. For each restart, sample mackerel positions as centers 3. Enumerate
  rectangle sizes (500-10000 in steps) around each center 4. Use KD-tree to score each rectangle (O(log
  N) per query) 5. Track best rectangle across 20-25 restarts 6. Output best rectangle as 4-vertex polygon
  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
