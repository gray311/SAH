type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based polygon optimization:

  1. Build 1000x1000 grid, count mackerels per cell

  2. Find cells with >=3 mackerels, pick top 10

  3. For each, create bounding box polygon (4 vertices)

  4. Optimize each with edge expansion (-10, 0, +10)

  5. Run 50 trials, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
