type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing bounding box + sardine exclusion:

  1. Group mackerels into clusters (5000-unit threshold)

  2. Build bounding boxes for each cluster

  3. Union overlapping boxes

  4. Carve sardine exclusion holes (5x5 squares)

  5. Local edge optimization (+25, +50, +100 shifts, 5 rounds)

  6. 10 random restarts

  Ensure <2.0s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
