type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing grid-based rectangle exploration:


  1. Build 100x100 grid, count M/S per cell, compute M-S score


  2. Find ALL cells with positive score (candidate regions)


  3. From each candidate, expand in 4 directions to build maximal rectangles


  4. Try multiple rectangle sizes and boundary shifts (±1..3 units)


  5. Combine 2-3 rectangles into polygon if beneficial


  6. Deep hill climb with ±5..20 shifts, 5 rounds


  7. 25 random restarts, output best polygon


  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
