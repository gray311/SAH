type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing line-scanning with hole-filling:

  1. Parse mackerel/sardine coordinates into sets for O(1) lookup.

  2. Extract unique X and Y coordinates from mackerels.

  3. For each unique X, scan vertical segments between mackerel Y-coordinates.

  4. For each unique Y, scan horizontal segments between mackerel X-coordinates.

  5. Collect segments with positive net score (M - S > 0).

  6. Connect segments into orthogonal cycles using graph traversal.

  7. Validate each cycle (simple polygon, 4-1000 vertices, valid coords/perimeter).

  8. Perform local edge optimization (±10..±50 shifts, 3 rounds).

  9. Run 25 restarts with random threshold perturbations.

  10. Output best valid polygon.

  Ensure <2.0s execution and valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
