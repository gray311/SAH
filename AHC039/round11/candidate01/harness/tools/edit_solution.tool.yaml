type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing edge extension and hole-filling strategy:

  1. Build initial polygon from mackerel bounding box

  2. Extend each edge outward by 10-200 units

  3. Notch out rectangular regions around sardines

  4. Refine vertices by ±5-20 unit shifts

  5. Run 10-15 restarts, keep best

  Ensure <2.0s execution, valid polygon format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
