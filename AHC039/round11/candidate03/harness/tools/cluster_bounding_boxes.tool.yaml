type: tool
name: cluster_bounding_boxes
description: Analyze mackerel positions, group into clusters by distance, compute bounding boxes for each
  cluster, count sardines inside each box. Returns list of clusters with their bbox and scores.
input_schema:
  type: object
  properties:
    distance_threshold:
      type: integer
      default: 2000
    num_clusters:
      type: integer
      default: -1
