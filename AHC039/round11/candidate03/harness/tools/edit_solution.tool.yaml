type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing geometric clustering: 1. Parse fish positions
  2. Cluster mackerels by distance (~2000 units) 3. Compute bounding boxes for clusters 4. Count sardines
  in each box 5. Union boxes into stepped polygon 6. Try multiple thresholds and k values, output best'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
