type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing restart-based polygon optimization: try minimal
  rectangles at grid positions, expand each edge by 50-250 units, run 10-15 restarts with different seeds,
  output best polygon'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
