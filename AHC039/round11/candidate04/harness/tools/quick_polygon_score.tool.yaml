type: tool
name: quick_polygon_score
description: Score a polygon by counting fish inside it. Returns mackerel count, sardine count, and net
  score (m-s+1).
input_schema:
  type: object
  properties:
    vertices:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
      minItems: 4
      maxItems: 1000
    perimeter_limit:
      type: integer
      default: 400000
