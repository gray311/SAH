type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct fish density clustering:

  1. Parse all fish coordinates into mackerel and sardine lists 2. Compute adaptive cell_size based on
  coordinate range 3. Build grid, count M/S per cell 4. Identify mackerel clusters (M >= 2), create bounding
  boxes 5. Expand boxes into sardine-free regions 6. Run 20-30 restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
