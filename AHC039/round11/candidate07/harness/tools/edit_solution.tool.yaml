type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing quick rectangle search:

  1. Read fish, compute mackerel bounding box

  2. For each mackerel, score 50x50 rectangle centered on it

  3. Track top 10 rectangles by score (M - S + 1)

  4. Union top 3 into a valid polygon

  5. Minimal hill climbing (±50, ±100 shifts, 2 iterations)

  6. Output best valid polygon

  Must complete in < 1.8s, always produce valid output.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
