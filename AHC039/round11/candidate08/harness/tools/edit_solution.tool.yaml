type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing bounding-box refinement:

  1. Spatial hash mackerels into 500x500 buckets to find clusters 2. For each cluster, build a bounding
  box 3. Expand box in 4 directions while net mackerel-sardine gain > 0 4. Merge overlapping/adjacent
  boxes (within 2000 units) 5. Build polygon from merged boxes (x-order traversal) 6. Refine corners with
  ±5, ±10, ±20 shifts for 2-3 rounds 7. Run 10-15 restarts, output best polygon

  Ensure valid output format and <2.0s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
