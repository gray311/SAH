type: tool
name: edit_solution
description: "Replace EVOLVE-BLOCK with C++ implementing KD-tree based optimization:\n\n1. Build KD-tree\
  \ from fish positions (seed's infrastructure)\n\n2. Start with initial polygon: either global bounding\
  \ box OR mackerel-cluster bounding boxes\n\n3. Vertex refinement loop (50 iterations max):\n   - For\
  \ each vertex, try integer perturbations ±1..5 on perpendicular coordinate\n   - Score each variant\
  \ using KD-tree query\n   - Keep best perturbation\n\n4. Corner addition/removal: try splitting long\
  \ edges, merging collinear vertices\n\n5. Multi-lobe construction: identify separate mackerel clusters,\
  \ build lobes, combine\n\n6. Validate constraints: 4-1000 vertices, perimeter ≤400,000, coords in [0,100000],\
  \ no self-intersection\n\n7. Run 10-15 restarts, output best polygon\n\nEnsure <2.0s execution, valid\
  \ output format, integer coordinates only."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
