type: tool
name: finish
description: Submit when you have a working KD-tree based optimization with vertex refinement (±1..5 perturbations),
  corner adjustments, multi-lobe support, and 10-15 restarts. The strategy should improve over the seed's
  2.48436 score.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
