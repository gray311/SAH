schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  CRITICAL: The seed program uses a KD-tree for fast fish lookups. Build on this - don't reinvent spatial structures.
  
  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):
  
  1. FISH CLUSTER DETECTION:
     - Read all fish positions from input
     - Use existing KD-tree structure to efficiently query rectangular regions
     - Identify regions where mackerel_count > sardine_count
     - For each such region, compute the optimal bounding rectangle
  
  2. RECTANGLE CONSTRUCTION (simple & fast):
     - Start with the entire search space [0,100000]x[0,100000]
     - Query the KD-tree for all fish in this rectangle
     - Compute current score = mackerels - sardines + 1
     - If score > 0, keep it as candidate
  
  3. RECTANGLE SHRINKING/GROWING (fast local opt):
     - For the rectangle from step 2, try shrinking from each side:
       * Move left edge left/right by 100, 500, 1000, 2000, 5000
       * Move right edge left/right by same amounts
       * Move top edge up/down by same amounts  
       * Move bottom edge up/down by same amounts
     - For each shrink, query KD-tree and compute score
     - Keep shrink that improves score
  
  4. RECTANGLE MERGING:
     - If we find multiple good disjoint rectangles, consider merging them
     - Merging means creating a larger rectangle that contains both
     - This may include some sardines but can capture many more mackerels
  
  5. MULTIPLE RESTARTS (efficient):
     - Run 5-10 restarts with different random seeds
     - Each restart: start from a random 5000x5000 subregion, apply shrinking
     - Track best polygon across all restarts
  
  6. VALIDATION:
     - Ensure 4 <= vertices <= 1000 (rectangle has 4)
     - Perimeter <= 400,000 (rectangle of 100000x100000 = 800,000, so we need smaller)
     - Coordinates in [0,100000]
  
  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ using KD-tree based rectangle search
  - evaluate_solution: Run C++ program, get score
  - finish: Submit when you have a working rectangle optimization strategy

  KEY DIFFERENCE from seed: Focus on simple rectangle operations using existing KD-tree, not complex grid-based corridor expansion. The KD-tree in the seed is your friend - use it for O(log N) fish queries!
skill_description: |
  KD-tree based rectangle optimization. Use existing spatial index to find mackerel-dense regions, apply local rectangle shrinking, run 5-10 efficient restarts.
skill_body: |
  # KD-Tree Rectangle Optimization Strategy
  
  ## Phase 1: Region Analysis
  - The seed program builds a KD-tree on all fish positions
  - Query the KD-tree for fish in rectangular regions
  - Find rectangles where mackerel_count > sardine_count
  
  ## Phase 2: Rectangle Optimization
  For each candidate rectangle:
  - Query KD-tree to get exact fish counts
  - Compute score = mackerels - sardines + 1
  - Try shrinking each edge by 100, 500, 1000, 2000, 5000 units
  - Keep shrink that improves score
  - Repeat 2-3 rounds of shrinking
  
  ## Phase 3: Multiple Restarts
  - Run 5-10 restarts
  - Each restart starts with a random subregion (e.g., 20000x20000)
  - Apply rectangle shrinking optimization
  - Track best rectangle
  
  ## Phase 4: Output
  - Output the best rectangle as 4 vertices
  - Ensure validity: perimeter <= 400,000, coords in range
  
  ## Key Implementation Details
  - Use the existing KD-tree from the seed program
  - Rectangle query on KD-tree is O(log N + k) where k = fish count
  - Total time per evaluation: ~1.5s with careful implementation
  - Simpler than grid-based approach: no grid building, no corridor tracking
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing KD-tree rectangle optimization:
  
  1. Use existing KD-tree structure from seed
  
  2. Query rectangular regions for mackerel/sardine counts
  
  3. Apply edge shrinking by 100, 500, 1000, 2000, 5000 units
  
  4. Run 5-10 restarts from random subregions
  
  5. Output best rectangle (4 vertices)
  
  Ensure <2.0s execution, valid output format.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  finish: End when you have submitted a working KD-tree rectangle optimization with 5-10 restarts and edge shrinking.
  probe_solution: NOT useful - we need exact counts for accurate scoring with this strategy.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 15
  max_tokens: 10240
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools: []
new_skills: []
new_middlewares: []
