type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing KD-tree rectangle optimization:

  1. Use existing KD-tree structure from seed

  2. Query rectangular regions for mackerel/sardine counts

  3. Apply edge shrinking by 100, 500, 1000, 2000, 5000 units

  4. Run 5-10 restarts from random subregions

  5. Output best rectangle (4 vertices)

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
