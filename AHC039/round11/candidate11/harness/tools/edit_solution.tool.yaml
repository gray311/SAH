type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing population-based polygon search:

  1. Parse fish, build spatial index

  2. Initialize 5-10 diverse candidate polygons

  3. Search loop: evaluate, generate mutants (edge shifts, vertex ops), select elites

  4. Validate all polygons before output

  5. Output best valid polygon

  Must complete in <1.9s, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
