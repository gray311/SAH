type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with complete C++ implementation of grid-based polygon optimization:
  1. Build 500×500 grid with fish counts per cell 2. Precompute 2D prefix sums for O(1) rectangle queries
  3. Search all rectangles, find best by (M-S+1) 4. Implement iterative improvement (10000+ iterations)
  with edge perturbations 5. Output valid polygon (rectangle(s), ≤1000 vertices, perimeter ≤400000) Ensure
  <1.9s runtime and valid C++ syntax with escaped newlines.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
