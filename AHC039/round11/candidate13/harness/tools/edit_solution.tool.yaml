type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing KD-tree enhanced polygon optimization:

  1. Build KD-tree from all fish positions (mackerels and sardines)

  2. Generate polygons using multiple strategies: - Rectangle grid search with unique coords from fish
  - Expanding vertex method from seed mackerels - Shaped polygons (L, U, C) avoiding sardine clusters

  3. Deep search: 5-10 strategies, 5-15 restarts, edge perturbation ±5..15

  4. Exploit edge property: align edges to pass near mackerels

  5. Validate: 4-1000 vertices, valid coords, perimeter ≤ 400k, no self-intersection

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
