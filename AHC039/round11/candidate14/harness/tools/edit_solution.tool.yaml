type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct geometric envelope construction:

  1. Parse fish coordinates, find extremes and percentiles

  2. Test bounding box and sub-rectangles

  3. Refine edges by shifting based on fish density

  4. Combine rectangles if beneficial

  5. Output valid polygon


  Ensure: Valid polygon format, integer coords, no self-intersection, perimeter <= 400k.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
