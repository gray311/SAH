type: tool
name: test_rectangle
description: 'Evaluate a rectangle by counting fish inside. Takes (min_x, max_x, min_y, max_y)

  and returns (mackerel_count, sardine_count, score). Uses exact fish coordinates.

  Call this to enumerate candidate rectangles efficiently.'
input_schema:
  type: object
  properties:
    min_x:
      type: integer
    max_x:
      type: integer
    min_y:
      type: integer
    max_y:
      type: integer
