type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle optimization: 1. Parse fish coordinates,
  build KD-tree for fast range queries 2. Start with MBR of all fish 3. Generate 50-100 rectangles via
  vertex sampling, clustering, edge shifting 4. Score each using KD-tree rectangle query (M - S) 5. Hill
  climb top 10 with local edge refinements 6. Output best rectangle (4 vertices) satisfying constraints'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
