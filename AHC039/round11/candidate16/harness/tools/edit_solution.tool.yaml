type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing aggressive 8-direction corridor expansion:

  1. Build 200x200 grid, count M/S per cell, compute M-S score

  2. Find top 20 cells (include negative scores)

  3. From each, expand in 8 directions (including diagonals) with lenient criteria (M-S > -3)

  4. Use probe_corridor_combinations to test multiple corridor combinations

  5. Aggressive hill climb with shifts ±5, ±10, ±20, ±40, ±80, 5 rounds

  6. 25 phased restarts including vertex swaps

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
