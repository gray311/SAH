type: tool
name: probe_corridor_combinations
description: Probe multiple corridor combination configurations cheaply. Takes a seed cell and list of
  corridors, tests 10-15 different merge configurations, returns approximate M-S score for each without
  consuming full evaluation budget. Only the top 3 should proceed to full evaluation.
input_schema:
  type: object
  properties:
    seed_cell:
      type: object
      properties:
        row:
          type: integer
        col:
          type: integer
    corridors:
      type: array
      items:
        type: object
        properties:
          direction:
            type: string
            enum:
            - N
            - S
            - E
            - W
            - NE
            - NW
            - SE
            - SW
          length:
            type: integer
