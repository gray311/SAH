type: tool
name: count_fish_in_rect
description: 'Count mackerels and sardines in a rectangle using grid for O(1) queries. Fast scoring for
  polygon evaluation. Arguments: min_x, max_x, min_y, max_y. Returns: m_count, s_count, score (M-S).'
input_schema:
  type: object
  properties:
    min_x:
      type: integer
    max_x:
      type: integer
    min_y:
      type: integer
    max_y:
      type: integer
