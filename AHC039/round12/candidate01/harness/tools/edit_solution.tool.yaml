type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing grid-based initialization with fast scoring,
  polygon mutation for efficient edge-based optimization, multi-lobed polygons, 15-20 restarts.

  Steps: 1. Build 200x200 grid, find top 15 cells with positive M-S score 2. Convert cells to candidate
  polygons (bounding boxes) 3. Implement efficient edge mutation in C++ with fast scoring 4. Enable multi-lobed
  polygons (separate regions for each cluster) 5. Deep hill climb with ±5..20 shifts, 3 rounds 6. 15-20
  restarts, output best polygon'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
