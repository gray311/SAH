type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing fast KD-tree polygon optimization: 1. Build KD-tree,
  parse fish positions

  2. Generate 20-30 random rectangles per restart

  3. Score using quick_score_polygon tool

  4. Combine top rectangles, light adjustment ±10..20

  5. 6 restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
