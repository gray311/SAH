type: tool
name: quick_score_polygon
description: 'Fast approximate score for a polygon using KD-tree. Given polygon vertices,

  decompose into simple rectangles (O(V) where V is vertex count), query KD-tree

  for each rectangle to count mackerels and sardines in O(V * log N) total time.

  Returns score = M - S + 1. This is 100-1000x faster than full scan.'
input_schema:
  type: object
  properties:
    polygon:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
