type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing grid-based rectangle optimization:

  1. Build 200x200 grid, count M/S per cell 2. Compute 2D prefix sums for O(1) rectangle scoring 3. Enumerate
  rectangles anchored at high M-S cells 4. Filter by perimeter <= 400,000 and vertices <= 1000 5. Try
  edge tuning with ±5, ±10 adjustments 6. Run 10-15 random restarts, output best rectangle

  Ensure <2.0s execution, valid output format (4 vertices for rectangles).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
