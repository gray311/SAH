type: tool
name: score_rectangle
description: Score a rectangle using precomputed grid prefix sums. Returns (mackerel_count, sardine_count,
  net_score) for the given axis-aligned rectangle. Much faster than full evaluation - can be called many
  times during search. Use to quickly rank rectangle candidates before committing to full evaluation.
input_schema:
  type: object
  properties:
    min_x:
      type: integer
    min_y:
      type: integer
    max_x:
      type: integer
    max_y:
      type: integer
