type: tool
name: analyze_fish_clusters
description: 'Analyze fish distribution using KD-tree to find high-mackerel low-sardine regions.

  Returns candidate rectangle corners and their estimated scores.

  Use this tool once at startup to understand spatial distribution.'
input_schema:
  type: object
  properties:
    region_focus:
      type: string
      enum:
      - global
      - local
      - dense
      default: global
    num_candidates:
      type: integer
      default: 10
