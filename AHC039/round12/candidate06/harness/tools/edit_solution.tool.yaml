type: tool
name: edit_solution
description: 'Replace the EVOLVE-BLOCK with a COMPLETE, SYNTAX-CORRECT C++ program that:

  1. Reads N mackerels and N sardines from input

  2. Uses grid-based analysis to find optimal polygon region

  3. Outputs a valid axis-aligned polygon (4-1000 vertices, perimeter <= 400000)


  CRITICAL: Code must compile and run without errors. Use simple, tested patterns.

  Template-based generation is recommended - keep proven parts from seed, modify strategic parts.


  Output format: First line = vertex count, then each vertex as "x y" on separate lines.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
