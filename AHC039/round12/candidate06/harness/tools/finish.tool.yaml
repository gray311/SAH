type: tool
name: finish
description: 'Call finish when you have a working C++ program that consistently scores

  well above the seed (2.48436). The program should complete within 1.9s

  and produce valid output for all 150 test cases.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
