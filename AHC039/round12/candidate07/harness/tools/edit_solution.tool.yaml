type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct geometric clustering strategy:

  1. Parse fish coordinates, compute 100x100 density map

  2. Cluster mackerels by proximity, compute bounding rectangles

  3. Score rectangles, merge adjacent positive-score rectangles

  4. Build multi-lobed polygons, support ring patterns

  5. Vertex expansion hill climbing (add vertices at fish positions, expand edges)

  6. Run 8-10 diverse strategies per eval

  7. Output best valid polygon. Ensure <1.5s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
