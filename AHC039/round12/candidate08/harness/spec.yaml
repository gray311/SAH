schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).

  STRATEGY: Simple greedy expansion with KD-tree queries and local refinement.

  SEARCH METHOD (encode in EVOLVE-BLOCK C++ code):

  1. READ INPUT: Parse mackerel and sardine coordinates from stdin.

  2. BUILD KD-TREE: Build KD-tree on all fish points for O(log N) range queries.

  3. INITIAL POLYGON: Start with a minimal valid polygon (e.g., small rectangle around centroid).

  4. GREEDY EXPANSION: 
     - Query score for current polygon
     - Try expanding each edge by ±1, ±5, ±10 units
     - Keep expansion that improves score
     - Max 50 expansion steps total

  5. LOCAL HILL CLIMBING:
     - For each edge, try vertex perturbations ±2, ±5, ±10
     - Keep improvements
     - Max 10 iterations

  6. OUTPUT: Valid polygon (4-1000 vertices, perimeter ≤400000, coords in [0,100000]).

  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ implementation
  - evaluate_solution: Run C++ program, get score
  - finish: Submit when you have a working solution

  PRESERVE: EVOLVE-BLOCK markers, exact I/O format (m then vertices), <2.0s execution.
  Key: Simple is faster. Use existing KD-tree. Avoid complex grid/corridor logic.
skill_description: Simple greedy expansion with KD-tree queries, local hill climbing, 3-5 restarts.
skill_body: |
  # Simplified Polygon Optimization Strategy

  ## Phase 1: Input and Setup
  - Read N mackerels and N sardines from stdin
  - Store as Point structs with fish types

  ## Phase 2: KD-Tree Construction
  - Build KD-tree on all fish points (both mackerels and sardines)
  - Use KD-tree for efficient O(log N) range sum queries

  ## Phase 3: Initial Polygon
  - Compute centroid of all mackerels
  - Create minimal rectangle: [centroid.x-500, centroid.y-500] to [centroid.x+500, centroid.y+500]
  - Or use bounding box of top 100 mackerels

  ## Phase 4: Greedy Edge Expansion
  - For each of the 4 sides, try expanding outward by d ∈ {1, 5, 10} units
  - Query rectangle score using KD-tree
  - Keep expansion if score improves
  - Stop after 50 total expansion attempts

  ## Phase 5: Local Refinement
  - For each vertex, try perturbing by ±2, ±5, ±10 units
  - Query score, keep improvement
  - Repeat up to 10 iterations

  ## Phase 6: Multiple Restarts
  - Run 3-5 restarts with different starting seeds
  - Each restart: random centroid perturbation
  - Output best polygon

  ## Validation
  - Ensure 4 <= vertices <= 1000
  - Ensure perimeter <= 400,000
  - Ensure all coords in [0, 100000]
  - Use simple self-intersection check (O(n²) is fine for n=1000)

  ## C++ Implementation Tips
  - Use fast I/O (cin.tie(NULL), ios_base::sync_with_stdio(false))
  - KD-tree query: sum of mackerels - sum of sardines in rectangle
  - Score = max(0, mackerels - sardines + 1)
  - Keep time < 2.0s by limiting iterations
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing simple greedy expansion:
    1. Read fish coords, build KD-tree
    2. Start with minimal polygon around mackerel centroid
    3. Greedily expand edges by ±1,±5,±10 units
    4. Local hill climb with vertex perturbations ±2,±5,±10
    5. 3-5 restarts, output best polygon
    Ensure <2.0s execution, valid output format.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - full evaluation needed for accurate scoring.
  finish: End when you have a working simple greedy expansion solution with 3-5 restarts.
sampling:
  temperature: 0.9
  top_p: 0.85
  top_k: 15
  max_tokens: 10000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
