type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing simple greedy expansion: 1. Read fish coords,
  build KD-tree 2. Start with minimal polygon around mackerel centroid 3. Greedily expand edges by ±1,±5,±10
  units 4. Local hill climb with vertex perturbations ±2,±5,±10 5. 3-5 restarts, output best polygon Ensure
  <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
