type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing KD-tree enhanced polygon optimization:

  1. Build KD-tree from fish positions for O(log N) rectangle queries

  2. Add sparse 25x25 grid only at high-density mackerel regions (>3 mackerels)

  3. Run 5 restarts with 2-3 high-density cell seeds each

  4. For each edge, try shifts ±3, ±7, ±11 units

  5. Hill climb 2 rounds per candidate

  6. Validate: 4-1000 vertices, integer coords [0,100000], perimeter ≤400000, no self-intersection

  Ensure <2.0s execution. Enhance seed, don''t replace with slow grid.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
