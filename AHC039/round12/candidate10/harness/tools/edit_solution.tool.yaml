type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with rectangle-union strategy:

  1. Build 100x100 grid, use probe to estimate M-S per cell

  2. From top 30 cells, expand to rectangles (min 200x200)

  3. Limit to 5 disjoint rectangles (perimeter <= 400,000)

  4. Use probe to screen candidates, evaluate best

  5. KD-tree hill climbing for edge refinement

  6. 25 restarts, output best polygon

  Ensure <2.0s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
