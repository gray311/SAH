type: tool
name: edit_solution
description: "Replace EVOLVE-BLOCK with C++ implementing bounding-box KD-tree search:\n\n1. Parse fish\
  \ input, build KD-tree for spatial queries\n\n2. Compute initial mackerel bounding box\n\n3. Generate\
  \ 20-50 candidate rectangles by:\n   - Shrinking each edge by 10,20,50,100 units\n   - Expanding in\
  \ each direction\n   - Testing centered boxes\n   - Local refinements\n\n4. Use KD-tree rectangle query\
  \ for each candidate (count M, S)\n\n5. Output rectangle with best (M - S + 1) score\n\nEnsure <1.9s\
  \ execution, valid output format (m then vertices)."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
