schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).

  STRATEGY: Use grid-based local search with strategic polygon modifications.

  PHASE 1 - GRID SETUP:
  - Parse fish positions into a 200x200 grid (cell_size=500)
  - For each cell, compute M (mackerels), S (sardines), score = M - S

  PHASE 2 - POLYGON INITIALIZATION:
  - Start with a minimal valid polygon (4 vertices: a rectangle)
  - Center it on the highest-score positive cell
  - Ensure perimeter <= 400,000 and coords in [0,100000]

  PHASE 3 - LOCAL SEARCH (core innovation):
  For up to 500 iterations or until time:
    a) Try expanding polygon in each direction (N,S,E,W) by 1-20 units
    b) Try shrinking each edge
    c) Try rotating corners (90 degree pivots)
    d) Try "flip" moves: replace a vertex with a grid point that improves score
    e) For each candidate, use grid-based rectangle sum for fast scoring
    f) Accept if score improves
    g) Occasional random restart with 2-4 starting cells

  PHASE 4 - VALIDATION:
  - Output valid polygon (4-1000 vertices, axis-aligned edges)
  - Verify perimeter and coordinate constraints
  - Score = max(0, mackerels_inside - sardines_inside + 1)

  KEY: Use grid for O(1) cell queries, not point-by-point checks. Each evaluation ~1.5s.
skill_description: |
  Grid-based local search: build 200x200 grid, start minimal polygon on best cell, iteratively expand/shrink/rotate corners using grid queries for fast scoring, 500+ iterations, occasional restarts.
skill_body: |
  # Grid-Based Local Search Strategy

  ## Phase 1: Grid Construction
  - Divide 0-100000 range into 200x200 grid (500 units per cell)
  - Count mackerels (type=1) and sardines (type=-1) in each cell
  - Precompute prefix sums for O(1) rectangle queries
  - cell_score[r][c] = mackerels - sardines in that cell

  ## Phase 2: Initialization
  - Find the cell with maximum positive score (M - S > 0)
  - Create minimal polygon: a rectangle around that cell's boundaries
  - Rectangle: [cell_x, cell_x+500] x [cell_y, cell_y+500]
  - Verify: perimeter <= 400000, all coords valid

  ## Phase 3: Local Search Loop
  Iterate up to 500 times or until timeout (~1.5s):

  ### Move Types (try all, keep best):
  1. **Expand Edge**: For each of 4 edges, extend outward by 1-20 units
     - Query new rectangle area with grid
     - Check score improvement

  2. **Shrink Edge**: Contract each edge inward by 1-10 units
     - Useful for removing sardine-rich borders

  3. **Corner Rotation**: 90-degree pivot of corners
     - Change corner from (x,y) to adjacent grid point in another direction

  4. **Vertex Flip**: Replace each vertex with the grid center point that maximizes score
     - Smart local optimization

  ### Scoring:
  - Use grid-based rectangle sum: for polygon, decompose into grid-aligned rectangles
  - Sum M - S for all rectangles, add 1

  ### Restarts:
  - Every 100 iterations, do a random restart:
    - Pick 2-4 random cells
    - Build small polygons around them
    - Merge if beneficial

  ## Phase 4: Output
  - Ensure exactly 4-1000 vertices
  - Output in format: m\n x1 y1\n x2 y2\n ...
  - Always valid axis-aligned polygon
tool_descriptions:
  edit_solution: |
    Replace EVOLVE-BLOCK with C++ implementing grid-based local search:
    1. Build 200x200 grid with prefix sums for O(1) rectangle queries
    2. Start with minimal rectangle on best positive-score cell
    3. Local search: expand/shrink edges, rotate corners, flip vertices
    4. Grid-based scoring (not point-by-point)
    5. Occasional random restarts
    6. Validate output (4-1000 vertices, valid axis-aligned)
  evaluate_solution: |
    Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~1.5-2.0s search window.
  probe_solution: |
    NOT useful - exact scoring needed; skip to save tokens.
  finish: |
    End when you've encoded working grid-based local search with prefix sums and local moves.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
  max_tokens: 14336
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 18000
new_middlewares:
  - name: grid_search_reminder
    hook: before_model
    description: Force executor to use grid-based approach with prefix sums
    implementation_py: |
      def before_model(hook_input):
          return "Use grid prefix sums for O(1) rectangle queries. Search loop: expand/shrink edges, rotate corners, flip vertices. ~500 iterations, <1.5s."
