type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing grid-based local search:

  1. Build 200x200 grid with prefix sums for O(1) rectangle queries

  2. Start with minimal rectangle on best positive-score cell

  3. Local search: expand/shrink edges, rotate corners, flip vertices

  4. Grid-based scoring (not point-by-point)

  5. Occasional random restarts

  6. Validate output (4-1000 vertices, valid axis-aligned)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
