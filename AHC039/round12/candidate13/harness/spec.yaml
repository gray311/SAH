schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  STRATEGY: Direct vertex optimization with hill climbing.
  
  1. START WITH A BASE POLYGON:
     - Begin with a simple axis-aligned rectangle that captures initial fish
     - OR start with minimal 4-vertex polygon at safe coordinates
  
  2. HILL CLIMBING (Core loop):
     - For each vertex, try small coordinate perturbations (±1, ±2, ±5, ±10, ±20)
     - Create modified polygon, evaluate if valid
     - Keep changes that improve score
     - Limit total vertex moves per evaluation
  
  3. EXPAND POLYGON:
     - Try adding new vertices to create more complex shapes
     - Add vertex near high mackerel density, extend in cardinal directions
     - Ensure no self-intersection
  
  4. CONTRACT POLYGON:
     - Sometimes shrinking polygon removes sardines more effectively
     - Try reducing boundary to exclude sardine clusters
  
  5. MULTI-SEGMENT STRATEGY:
     - Sometimes optimal polygon is a union of several rectangles
     - Create separate rectangular regions for high-value mackerel areas
     - Connect them if beneficial
  
  6. VALIDATION:
     - Ensure 4-1000 vertices, perimeter ≤400,000, coords in [0,100000]
     - Verify no self-intersection
     - Output in correct format
  
  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ implementing direct vertex optimization
  - evaluate_solution: Run and score, use each eval wisely
  - finish: Submit when you have a working solution that improves on seed
skill_description: |
  Direct vertex hill climbing for axis-aligned polygons. Start with simple rectangle, perturb vertices, try expansion/contraction, use each evaluation wisely.
tool_descriptions:
  edit_solution: |
    Replace EVOLVE-BLOCK with C++ implementing direct vertex optimization:
    
    1. Start with simple polygon (rectangle or minimal valid shape)
    2. Hill climb: perturb vertices by ±1, ±2, ±5, ±10, ±20
    3. Try expansion: add vertices near mackerel clusters
    4. Try contraction: shrink to exclude sardines
    5. Consider multi-segment union of rectangles
    6. Validate: 4-1000 vertices, perimeter ≤400K, coords ≤100K, no self-intersection
    7. Use each of 30 evaluations wisely for quality variants
  evaluate_solution: |
    Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: |
    NOT available for this task - use full evaluation for accurate scoring.
  finish: |
    End when you have submitted a working solution that improves on seed score.
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
