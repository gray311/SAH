schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  CRITICAL INSIGHT: Use exact 2D prefix sums (integral image) for O(1) rectangle scoring.
  Grid-based approaches are too coarse and inaccurate for point fish locations.
  
  SEARCH METHOD:
  
  1. EXACT 2D PREFIX SUM CONSTRUCTION:
     - Build 2D prefix sum array over [0, 100000]x[0, 100000]
     - Each cell contains sum of fish in that unit square
     - mackerels contribute +1, sardines contribute -1 to prefix sum
     - Any axis-aligned rectangle score = sum of (mackerels - sardines) in O(1)
  
  2. RECTANGLE SEARCH STRATEGY:
     - Randomly sample 1000 rectangle corners from [0, 100000]x[0, 100000]
     - For each pair of corners (x1,y1) and (x2,y2), compute rectangle score using prefix sums
     - Keep rectangles with score > 0 and valid perimeter <= 400,000
     - Track best rectangle and top 50 candidates
  
  3. LOCAL OPTIMIZATION:
     - For each candidate rectangle, try corner perturbations: ±5, ±10, ±15, ±20 units
     - Keep perturbations that improve score while maintaining validity
     - Repeat 3 refinement rounds
  
  4. MULTI-RECTANGLE COMBINATIONS:
     - Try combining 2-3 non-overlapping rectangles if beneficial
     - Total perimeter must stay <= 400,000
     - Prefer large single rectangles over many small ones
  
  5. MULTIPLE RESTARTS:
     - Run 30 restarts with different random seeds
     - Each restart: build prefix sum, sample rectangles, optimize, combine
     - Output best polygon across all restarts
  
  6. VALIDATION:
     - Output valid axis-aligned polygon (rectangle or union of rectangles)
     - Ensure 4-1000 vertices, integer coords, no self-intersection, perimeter <= 400,000
  
  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ using 2D prefix sums
  - evaluate_solution: Run C++ program, get exact score
  - probe_solution: NOT useful - use exact prefix sum scoring instead
  - finish: Submit when you have working 2D prefix sum solution

skill_description: Exact 2D prefix sum for O(1) rectangle scoring. Sample random rectangles, optimize corners locally, combine if beneficial, 30 restarts.
skill_body: |
  # Exact 2D Prefix Sum Polygon Optimization
  
  ## Core Innovation: 2D Integral Image
  
  Replace grid-based approximation with EXACT 2D prefix sums for O(1) rectangle queries.
  
  ## Step 1: Build Prefix Sum Array
  
  - Create 2D array prefix[x][y] where prefix[x][y] = sum of all fish (mackerels +1, sardines -1)
    in rectangle [0,0] to [x,y]
  - Use standard 2D prefix sum formula:
    prefix[x][y] = fish[x][y] + prefix[x-1][y] + prefix[x][y-1] - prefix[x-1][y-1]
  - Initialize with 0s, build in O(W*H) where W,H = 100000
  
  ## Step 2: Query Rectangle Score
  
  - Rectangle [(x1,y1), (x2,y2)] score = prefix[x2][y2] - prefix[x1-1][y2] - prefix[x2][y1-1] + prefix[x1-1][y1-1]
  - O(1) query time
  
  ## Step 3: Rectangle Sampling
  
  - Generate 1000 random pairs of corners from [0, 100000]x[0, 100000]
  - For each pair, compute rectangle score using prefix sums
  - Filter: score > 0, perimeter = 2*(w+h) <= 400,000, area > 0
  
  ## Step 4: Local Corner Optimization
  
  - For each candidate rectangle, try perturbing each corner by ±5, ±10, ±15, ±20
  - Keep perturbations that improve score
  - Repeat 3 refinement rounds
  
  ## Step 5: Multi-Rectangle (Optional)
  
  - Try combining 2-3 non-overlapping rectangles
  - Ensure total perimeter constraint satisfied
  - Usually single large rectangle is best
  
  ## Step 6: Multiple Restarts
  
  - 30 restarts with different random seeds
  - Each restart independent: build prefix, sample, optimize
  - Track best polygon across all restarts
  
  ## Step 7: Output
  
  - Single rectangle: output 4 vertices in order
  - Multiple rectangles: output vertices of each, total vertices <= 1000
  - Perimeter <= 400,000, all coords in [0, 100000]

tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ using 2D prefix sums:
    1. Build 100000x100000 prefix sum array (mackerels +1, sardines -1)
    2. Sample 1000 random rectangles, score with O(1) prefix queries
    3. Local corner optimization with ±5..20 perturbations
    4. Optional: combine 2-3 rectangles if beneficial
    5. 30 restarts, output best polygon
    Ensure <2.0s execution, valid output format.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - exact prefix sum scoring is built into the program.
  finish: End when you have submitted a working 2D prefix sum solution with 30 restarts and local corner optimization.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
new_tools: []
new_skills: []
new_middlewares: []
