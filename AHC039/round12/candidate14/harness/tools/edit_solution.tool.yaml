type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ using 2D prefix sums: 1. Build 100000x100000 prefix sum array
  (mackerels +1, sardines -1) 2. Sample 1000 random rectangles, score with O(1) prefix queries 3. Local
  corner optimization with ±5..20 perturbations 4. Optional: combine 2-3 rectangles if beneficial 5. 30
  restarts, output best polygon Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
