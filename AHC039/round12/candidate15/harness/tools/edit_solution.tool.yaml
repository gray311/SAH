type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing local search:

  1. Generate baseline polygon from seed approach

  2. Extract vertices, probe perturbations (+1/-1..+10/-10) for each vertex

  3. Use probe_solution for fast ranking (30 probe budget)

  4. Fully evaluate top 3-5 candidates

  5. Deep refinement: edge shifts +1/-1..+10/-10, vertex insert/delete, corner rounding

  6. Strategic variations: outward expansion, hole carving, lobe merging (20 percent each)

  7. Output best validated polygon. Time < 2.0s.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
