type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing incremental local search:

  1. Parse seed polygon as baseline

  2. Build simple grid (or use KD-tree if already in seed) for fast score estimation

  3. For 5-10 starting configurations: - Perturb edge vertices by ±1..±5 (one at a time) - Validate each
  candidate (4-1000 vertices, perimeter, bounds) - Call probe_solution to rank candidates cheaply

  4. Call evaluate_solution on top 3-5 candidates that beat baseline

  5. Use best evaluated result as new baseline, repeat if time permits

  6. Output best polygon found'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
