schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  CRITICAL STRATEGY: Cluster-based polygon construction using KD-tree for efficient scoring.
  
  METHOD:
  
  1. READER PHASE: Parse input, build KD-tree of all fish points (5000 mackerels + 5000 sardines).
     Fish are given as: N fish at lines 0..N-1 (mackerels), lines N..2N-1 (sardines).
  
  2. CLUSTER IDENTIFICATION: Use the KD-tree to find 5-10 high-density fish clusters.
     For each candidate cluster, compute tight axis-aligned bounding box.
  
  3. POLYGON GENERATION: For each cluster's bounding box, generate multiple polygon variants:
     - Original rectangle
     - Rectangle shifted by ±10, ±20, ±30 pixels (staying in bounds)
     - Rectangle with aspect ratio variations
  
  4. PROBE SCREENING: For each candidate polygon, use probe_solution (if available) OR
     compute a quick bounding-box approximation: score ≈ count_fish_in_rect(bounds).
     Keep only candidates with probe score > 1.5.
  
  5. FINE TUNING: For promising candidates, perform vertex-level mutations:
     - Try shifting each vertex by ±5, ±10, ±15
     - Keep mutations that increase mackerels or decrease sardines
     - Iterate up to 3 refinement rounds
  
  6. MULTIPLE RESTARTS: Run 25 restarts with different random seeds.
     Each restart: pick 3-5 random seed points from KD-tree, find local cluster, build polygon.
  
  7. VALIDATION: Ensure polygon has 4-1000 vertices, perimeter ≤ 400,000, integer coordinates.
     Output format: first line = vertex count, then each vertex as "x y".
  
  TIME BUDGET: Complete all work in < 2.0 seconds. Prioritize probe screening to avoid costly evaluations.
  
  KEY DIFFERENCE from prior attempts: Use KD-tree for O(log N) fish queries, build polygons around actual fish clusters, use cheap probing to filter candidates before full evaluation.
skill_description: |
  Cluster-based polygon optimization. Use KD-tree to efficiently count fish in rectangles, identify dense clusters, generate bounding-box polygons, probe-screen candidates, fine-tune vertices, run 25 restarts.
skill_body: |
  # Cluster-Based Polygon Construction Strategy
  
  ## Phase 1: Data Loading and KD-Tree Construction
  - Parse input: first N lines are mackerels (type=1), next N lines are sardines (type=-1)
  - Build KD-tree with all 10,000 fish points for O(log N) rectangle queries
  - Use the existing KDNode structure but ensure it's properly populated
  
  ## Phase 2: Cluster Discovery
  - Sample 50 random points from KD-tree
  - For each sample point, find its cluster: all fish within 5000 pixels
  - Cluster scoring: mackerel_count - sardine_count
  - Select top 10 clusters by score (even if negative, they might become positive with better polygon)
  
  ## Phase 3: Bounding Box and Polygon Generation
  - For each cluster, compute tight axis-aligned bounding box [min_x, max_x, min_y, max_y]
  - Generate polygon candidates:
    * Original bounding box rectangle
    * 20 shifted rectangles: shift left/right/up/down by 10, 20, 30, 40 pixels
    * 10 rectangles with adjusted aspect ratios (maintain similar area)
  - Total candidates per cluster: ~31
  
  ## Phase 4: Probe-Based Screening (Critical)
  - For each candidate polygon, use probe_solution if available for fast approximate scoring
  - If probe not available: compute count_fish_in_rect via KD-tree rectangle query (much cheaper than full eval)
  - Use threshold: keep only candidates with estimated score > 1.5
  - Typical reduction: from 300+ candidates to 20-50
  
  ## Phase 5: Fine-Tuning
  - For each surviving candidate:
    * Extract all unique x and y coordinates from vertices
    * For each vertex, try shifts of ±5, ±10, ±15 pixels
    * Evaluate each shift using probe or KD-tree query
    * Keep best shift for each vertex
    * Repeat up to 3 rounds of refinement
  
  ## Phase 6: Multiple Restarts
  - Run 25 independent restarts with different random seeds
  - Each restart uses different random sampling for cluster discovery
  - Track best polygon across all restarts
  
  ## Phase 7: Output
  - Validate polygon constraints: 4-1000 vertices, perimeter ≤ 400,000, integer coords in [0,100000]
  - Output format: vertex_count followed by "x y" for each vertex
  
  ## Implementation Notes
  - KD-tree rectangle query is O(k + log N) where k is fish in rectangle - very fast
  - Probe budget: 30 probes per full evaluation - use them to screen many candidates
  - Total time budget: 2.0s - structure work to complete within this
  - Use static grid fallback if KD-tree proves too complex
tool_descriptions:
  edit_solution: |
    Replace EVOLVE-BLOCK with C++ implementing cluster-based polygon optimization:
    1. Load fish, build KD-tree
    2. Find 10 dense clusters via KD-tree sampling
    3. Generate ~31 polygon candidates per cluster (bounding box + shifts)
    4. Probe-screen candidates (keep score > 1.5)
    5. Fine-tune promising candidates with vertex shifts
    6. 25 random restarts, output best polygon
    Ensure <2.0s execution, valid output format.
  evaluate_solution: |
    Run C++ program. Returns score (mackerels-sardines+1), validity, remaining evaluations. Budget=30 full evals.
  probe_solution: |
    Cheap approximate evaluation (~10s, 30 budget). Use to screen polygon candidates before full evaluation.
  finish: |
    Submit when you have working cluster-based polygon optimizer with KD-tree, probe screening, and 25 restarts.
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 30
  max_tokens: 8192
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 10000
