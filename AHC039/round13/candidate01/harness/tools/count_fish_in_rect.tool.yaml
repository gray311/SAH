type: tool
name: count_fish_in_rect
description: 'Efficiently count mackerels and sardines in a rectangular region using KD-tree.

  Input: rectangle bounds [min_x, max_x, min_y, max_y].

  Output: dict with ''mackerel_count'', ''sardine_count'', ''net_score'' (M-S).

  Time: O(k + log N) where k is fish in rectangle. Much faster than full evaluation.'
input_schema:
  type: object
  properties:
    min_x:
      type: integer
    max_x:
      type: integer
    min_y:
      type: integer
    max_y:
      type: integer
