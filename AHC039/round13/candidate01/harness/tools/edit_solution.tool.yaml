type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based polygon optimization:

  1. Load fish, build KD-tree

  2. Find 10 dense clusters via KD-tree sampling

  3. Generate ~31 polygon candidates per cluster (bounding box + shifts)

  4. Probe-screen candidates (keep score > 1.5)

  5. Fine-tune promising candidates with vertex shifts

  6. 25 random restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
