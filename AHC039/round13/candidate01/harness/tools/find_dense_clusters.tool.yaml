type: tool
name: find_dense_clusters
description: 'Find dense fish clusters using KD-tree sampling.

  Input: max_clusters, search_radius.

  Output: list of clusters, each with center point and (M, S) counts within radius.

  Strategy: Sample random points, expand to find local clusters.'
input_schema:
  type: object
  properties:
    max_clusters:
      type: integer
      default: 10
    search_radius:
      type: integer
      default: 5000
