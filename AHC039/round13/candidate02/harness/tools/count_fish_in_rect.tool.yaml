type: tool
name: count_fish_in_rect
description: Count mackerels and sardines in axis-aligned rectangle [x1, y1] to [x2, y2]. Uses sorted
  lists + inclusion-exclusion for O(log N) query after O(N log N) setup. Returns counts of each type.
input_schema:
  type: object
  properties:
    x1:
      type: integer
    y1:
      type: integer
    x2:
      type: integer
    y2:
      type: integer
