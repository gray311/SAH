type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing geometric rectangle tiling:

  1. Read fish, build sorted lists and coarse grid

  2. Use count_fish_in_rect for any rectangle query (inclusion-exclusion)

  3. Generate candidate rectangles from grid, score with probe

  4. Combine rectangles into valid axis-aligned polygons

  5. Refine via expansion/contraction/split/merge

  6. Run 10-15 strategies, output best polygon

  Ensure <2.0s, valid output format (m vertices, integer coords).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
