type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing histogram-based polygon construction:

  1. Parse fish positions from input

  2. Build 2D density grid (M-S per cell)

  3. Find connected components of positive-density cells

  4. Compute bounding box for each component

  5. Evaluate each bounding box with exact counting

  6. Output best rectangle polygon

  Ensure < 0.5s execution, valid format (m then m vertices).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
