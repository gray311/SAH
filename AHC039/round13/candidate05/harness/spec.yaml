schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  OPTIMAL STRATEGY: Use coordinate-compressed grid with exact rectangle queries.
  
  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):
  
  1. COORDINATE COMPRESSION GRID:
     - Extract all unique x and y coordinates from fish positions
     - Create a compressed grid where each cell spans [x_i, x_{i+1}] x [y_j, y_{j+1}]
     - For each cell, count mackerels (M) and sardines (S) exactly
     - Build 2D prefix sum arrays for O(1) rectangle queries: count_rect(x1,y1,x2,y2)
  
  2. RECTANGLE SPLIT-AND-ENRICH:
     - Start with maximal bounding box [0, 100000] x [0, 100000]
     - Compute score = count_mackerel(bbox) - count_sardine(bbox) + 1
     - Iteratively split high-M/S-ratio rectangles and try recombining
     - For each rectangle, try shrinking each edge by 1-50 units to exclude sardines
     - Track best configuration
  
  3. RECTANGLE MERGING:
     - Allow multiple disjoint rectangles connected by thin corridors
     - Merge adjacent rectangles to reduce perimeter overhead
     - Ensure total perimeter ≤ 400,000 and vertices ≤ 1000
  
  4. DEEP LOCAL SEARCH:
     - For each rectangle edge, try all shifts from -50 to +50 (step=1)
     - Use prefix sum for O(1) scoring
     - Hill climb until no improvement
  
  5. MULTIPLE RESTARTS:
     - Run 30-40 restarts with different initial splits
     - Randomly select starting rectangles (top 20 by M-S ratio)
     - Different random seeds for edge shift order
  
  6. VALIDATION:
     - Output valid orthogonal polygon (4-1000 vertices, integer coords)
     - Ensure no self-intersection using standard polygon intersection check
     - Perimeter must be ≤ 400,000
  
  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with C++ implementing coordinate-compressed rectangle search
  - evaluate_solution: Run C++ program, get score (mackerels-sardines+1)
  - probe_solution: NOT useful - full evaluation needed
  - finish: Submit when you have encoded coordinate-compressed rectangle optimization with 30-40 restarts

skill_description: |
  Coordinate-compressed rectangle optimization. Build prefix-sum grid from fish positions, enable O(1) rectangle queries, iteratively split/shrink rectangles to maximize mackerel inclusion while excluding sardines, deep hill climb with fine-grained edge shifts, 30-40 restarts.
skill_body: |
  # Coordinate-Compressed Rectangle Optimization
  
  ## Phase 1: Coordinate Compression
  
  - Extract all unique x coordinates: X = sorted(set of all fish x)
  - Extract all unique y coordinates: Y = sorted(set of all fish y)
  - Create grid of size |X|-1 by |Y|-1 where cell (i,j) covers [X[i],X[i+1]] × [Y[j],Y[j+1]]
  - For each cell, count exact mackerels (M) and sardines (S) inside
  - Build 2D prefix sum array: P[i][j] = sum of all M and S in grid[0..i][0..j]
  - Rectangle query: count_rect(x1,y1,x2,y2) = P at transformed coords in O(1)
  
  ## Phase 2: Initial Bounding Box
  
  - Start with rectangle [0, 100000] × [0, 100000]
  - Score = count_mackerel(bbox) - count_sardine(bbox) + 1
  - If score ≤ 0, try shrinking to first quadrant or focus on fish distribution
  
  ## Phase 3: Rectangle Splitting and Shrinking
  
  For each rectangle in current solution:
  
  ### Shrinking Edges
  - For each edge (top, bottom, left, right), try shrinking inward by 1, 2, 3, 4, 5, 10, 20, 30, 40, 50 units
  - Use prefix sum for O(1) scoring of new rectangle
  - Keep configurations with improved score
  
  ### Splitting  
  - Consider splitting rectangle vertically at each grid x-boundary
  - Consider splitting rectangle horizontally at each grid y-boundary
  - If split improves total score (sum of both parts), keep the split
  
  ## Phase 4: Merging Rectangles
  
  - Find adjacent rectangles that share an edge
  - Try merging them (removing shared boundary from perimeter count)
  - If merged perimeter + sardine penalty < separate, merge
  
  ## Phase 5: Deep Hill Climbing
  
  For each edge of final configuration:
  - Try all integer positions from current -50 to current +50
  - Score each using O(1) rectangle query
  - Move to best position
  - Repeat 3-5 passes until convergence
  
  ## Phase 6: Multiple Restarts
  
  - Run 30-40 independent searches
  - Each restart:
    * Start from bounding box or random subset of rectangles
    * Random order of split/try operations
    * Different random seeds for tie-breaking
  - Output best polygon across all restarts
  
  ## Implementation Notes
  
  - Use coordinate compression to minimize grid size (at most 10000 unique coords per axis)
  - 2D prefix sum enables true O(1) rectangle counting
  - Time complexity: O(N log N) preprocessing + O(k·restarts) search where k is search iterations
  - Use fast I/O and efficient data structures
  - Include polygon self-intersection validation
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing coordinate-compressed rectangle optimization:
  
    1. Extract unique X and Y from fish, build compressed grid
  
    2. Count M and S in each grid cell exactly
  
    3. Build 2D prefix sums for O(1) rectangle queries
  
    4. Start with bounding box, iteratively shrink edges by 1-50 units
  
    5. Try splitting rectangles at grid boundaries
  
    6. Merge adjacent rectangles to reduce perimeter
  
    7. Deep hill climb: try all shifts -50 to +50 for each edge
  
    8. Run 30-40 restarts, output best polygon
  
    Ensure <2.0s execution, valid output format.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - full evaluation needed for accurate scoring.
  finish: End when you've submitted a working coordinate-compressed rectangle optimization with 30-40 restarts and deep hill climbing with -50 to +50 edge shifts.
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 50
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 20000
new_tools: []
new_skills: []
new_middlewares: []
