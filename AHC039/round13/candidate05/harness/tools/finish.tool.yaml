type: tool
name: finish
description: End when you've submitted a working coordinate-compressed rectangle optimization with 30-40
  restarts and deep hill climbing with -50 to +50 edge shifts.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
