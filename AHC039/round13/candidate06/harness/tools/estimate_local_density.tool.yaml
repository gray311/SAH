type: tool
name: estimate_local_density
description: 'Estimate fish density in a small region around a point. Returns counts of mackerels and
  sardines

  within a search radius, enabling local optimization decisions. Call before deciding to perturb

  a vertex or edge to understand the fish distribution nearby.'
input_schema:
  type: object
  properties:
    center_x:
      type: integer
    center_y:
      type: integer
    radius:
      type: integer
      default: 200
