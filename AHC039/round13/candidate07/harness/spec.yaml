schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).

  CRITICAL INSIGHT: The optimal solution is likely a UNION of axis-aligned rectangles that tightly bound mackerel clusters while avoiding sardines.

  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):

  1. FISH CLUSTERING:
     - Parse all fish coordinates from input
     - Group mackerels into spatial clusters (e.g., within 5000 units)
     - Group sardines similarly to identify "danger zones"

  2. RECTANGLE GENERATION:
     - For each mackerel cluster, compute tight axis-aligned bounding box
     - Generate candidate rectangles around each cluster
     - Filter: must have perimeter ≤ 400,000, vertices in [0,100000]

  3. RECTANGLE COMBINATION (Key Innovation):
     - Try combining 2-10 rectangles into a valid orthogonal polygon
     - Use bounding box of all rectangles as outer boundary
     - Cut out sardine-dense regions if needed
     - Ensure no self-intersection (orthogonal polygon rules)

  4. SCORE ESTIMATION:
     - For each candidate polygon, count enclosed mackerels and sardines
     - Use coordinate-based point-in-orthogonal-polygon test
     - Score = max(0, mackerels - sardines + 1)

  5. HILL CLIMBING:
     - For each edge of combined polygon, try small shifts (±5, ±10, ±20)
     - Keep shift that improves score
     - 2-3 refinement rounds per candidate

  6. MULTIPLE RESTARTS:
     - 5-10 restarts with different clusterings (vary clustering radius)
     - Track best polygon across all restarts
     - Output single best valid polygon

  7. VALIDATION:
     - Verify: 4-1000 vertices, perimeter ≤ 400,000, coords in range
     - Use ray-casting for point-in-polygon (orthogonal version)
     - Ensure no self-intersection

  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ implementing rectangle-based search
  - evaluate_solution: Run C++ program, get score (mackerels-sardines+1)
  - probe_solution: NOT useful - need exact counting
  - finish: Submit when you have working rectangle search

  PRESERVE: EVOLVE-BLOCK markers, exact I/O format (m then vertices), <2.0s execution
  KEY DIFFERENCE: Use rectangle bounding-box approach, NOT grid-based corridor expansion
skill_description: |
  Rectangle-based fish cluster search: identify mackerel clusters, generate bounding rectangles,
  combine rectangles into orthogonal polygon, filter by perimeter constraint, hill climb edge positions,
  5-10 restarts with varying clustering parameters.
skill_body: |
  # Rectangle-Based Fish Cluster Strategy

  ## Phase 1: Data Parsing and Clustering
  - Parse all fish coordinates from input file
  - Separate mackerels (type 1) and sardines (type -1)
  - Cluster mackerels: group those within distance D (e.g., 5000 units)
  - Identify cluster centroids and bounding boxes

  ## Phase 2: Rectangle Generation
  For each mackerel cluster:
  - Compute tight axis-aligned bounding box [min_x, max_x] × [min_y, max_y]
  - Generate candidate rectangles around cluster (slightly expanded)
  - Filter: perimeter = 2*(width+height) ≤ 400,000
  - Filter: all vertices in [0, 100000]

  ## Phase 3: Rectangle Combination
  - Try combining 1-5 rectangles
  - Create orthogonal polygon from union of rectangles
  - Use coordinate compression or bounding box as outer frame
  - Apply orthogonal polygon construction:
    * Collect all unique x and y coordinates from rectangles
    * Create grid of candidate vertices
    * Build polygon edges connecting corners
    * Simplify to minimal vertex set

  ## Phase 4: Score Computation
  For each polygon:
  - Implement orthogonal point-in-polygon test (ray casting)
  - Count enclosed mackerels
  - Count enclosed sardines
  - Score = max(0, mackerels - sardines + 1)

  ## Phase 5: Hill Climbing
  For each candidate polygon:
  - For each edge, try shifts: ±5, ±10, ±20 units
  - Keep shift improving score
  - Repeat 2-3 rounds
  - Track best variant

  ## Phase 6: Multiple Restarts
  - 5-10 restarts with different parameters:
    * Vary clustering distance D: 3000, 5000, 8000
    * Vary expansion factor: 1.0, 1.1, 1.2
    * Vary max rectangles: 2, 3, 5
  - Output single best valid polygon

  ## C++ Implementation Notes
  - Use efficient spatial indexing (grid or quadtree) for counting
  - O(1) point-in-polygon for orthogonal polygons
  - Pre-sort fish by coordinates for fast range queries
  - Total time < 2.0s with optimized algorithms
  - Handle edge cases: empty clusters, single rectangles, degenerate cases
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing rectangle-based search:

    1. Parse fish, cluster mackerels spatially

    2. Generate bounding rectangles around clusters

    3. Combine rectangles into orthogonal polygon

    4. Filter by perimeter ≤ 400,000, valid coordinates

    5. Count enclosed fish, compute score

    6. Hill climb edge positions (±5, ±10, ±20)

    7. 5-10 restarts with varying parameters, output best'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - exact counting needed for accurate scoring.
  finish: End when you have submitted working rectangle-based search with 5-10 restarts and hill climbing.
sampling:
  temperature: 1.3
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 20000
