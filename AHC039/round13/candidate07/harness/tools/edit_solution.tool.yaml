type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle-based search:

  1. Parse fish, cluster mackerels spatially

  2. Generate bounding rectangles around clusters

  3. Combine rectangles into orthogonal polygon

  4. Filter by perimeter ≤ 400,000, valid coordinates

  5. Count enclosed fish, compute score

  6. Hill climb edge positions (±5, ±10, ±20)

  7. 5-10 restarts with varying parameters, output best'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
