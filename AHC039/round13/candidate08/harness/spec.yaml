schema: h2spec/1.0
system_prompt: "You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1) by constructing an axis-aligned polygon.\n\nOPTIMAL STRATEGY: Mackerel Enclosure with Sardine Exclusion\n\nSEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):\n\n1. INITIALIZATION:\n   - Parse all N mackerel and N sardine coordinates from input\n   - Compute the minimal axis-aligned bounding box containing ALL mackerels\n   - This box guarantees capturing every mackerel (score baseline = N - sardines_in_box + 1)\n\n2. SARDINE EXCLUSION (core innovation):\n   - For each sardine currently inside the polygon:\n     * Calculate the minimum perimeter cost to exclude it\n     * An optimal exclusion is an L-shaped notch (4 vertices: 2 existing corners + 2 new)\n     * Notch geometry: From sardine position, go horizontally to edge, vertically inward, then horizontally to close\n     * Each notch adds 2 vertices and 2 * edge_length to perimeter\n   - Try excluding sardines starting from those closest to the current polygon boundary\n   - Greedily apply exclusions that reduce (mackerels - sardines) while perimeter <= 400,000 and vertices <= 1000\n\n3. POLYGON VALIDATION:\n   - Ensure vertices are sorted (clockwise or counterclockwise)\n   - Verify no self-intersection (axis-aligned rectangles cannot self-intersect if built correctly)\n   - Check: 4 <= vertices <= 1000, perimeter <= 400,000, all coords in [0,100000]\n\n4. MULTIPLE RESTARTS:\n   - Run 20-25 restarts\n   - Each restart: different random permutation of sardines for exclusion order\n   - Track best polygon across all restarts\n\n5. TIME EFFICIENCY:\n   - Precompute sardine positions in a hash set for O(1) membership testing\n   - For each sardine, compute minimal notch dimensions analytically\n   - Total time per eval: < 2.0s with O(N^2) or O(N log N) complexity\n\nTools:\n- edit_solution: Replace EVOLVE-BLOCK with complete C++ implementing mackerel enclosure + sardine exclusion\n- evaluate_solution: Run C++ program, get score, validity, remaining evaluations\n- probe_solution: NOT needed - exact evaluation required for this point-sensitive problem\n- finish: Submit when you have encoded working mackerel enclosure with sardine exclusion strategy\n\nPreserve EVOLVE-BLOCK markers, exact I/O format (m then vertices), and ensure <2.0s execution.\n\nKEY DIFFERENCE from seed: Instead of coarse grid-based corridors, use point-level sardine exclusion via L-shaped notches on a mackerel-bounding-box."
skill_description: Mackerel enclosure with point-level sardine exclusion. Start with bounding box of all mackerels, then greedily add L-shaped notches to exclude individual sardines from the inside while minimizing perimeter cost. Run 20-25 restarts with different sardine exclusion orders.
skill_body: "# Mackerel Enclosure with Sardine Exclusion Strategy\n\n## Core Insight\n\nThe optimal polygon starts by enclosing ALL mackerels, then strategically excludes sardines using minimal boundary modifications. This is fundamentally different from grid-based approaches because fish positions are exact points, not cell aggregates.\n\n## Phase 1: Initial Enclosure\n\n- Parse all fish coordinates\n- Compute minimal axis-aligned bounding box of all mackerels\n  * x_min = min(x_i for all mackerels)\n  * x_max = max(x_i for all mackerels)\n  * y_min = min(y_i for all mackerels)\n  * y_max = max(y_i for all mackerels)\n- Initial polygon: rectangle with 4 vertices at (x_min, y_min), (x_max, y_min), (x_max, y_max), (x_min, y_max)\n- Count sardines inside this box (points where x_min <= x <= x_max and y_min <= y <= y_max, including boundary)\n\n## Phase 2: Sardine Exclusion via L-Shaped Notches\n\nFor each sardine inside the polygon (process in priority order):\n\n1. **Check if exclusion is beneficial**: Only proceed if perimeter + cost <= 400,000 and vertices + 4 <= 1000\n\n2. **Compute minimal notch**: An L-shaped notch to exclude a sardine at (sx, sy) requires:\n   - Find the closest edge of the current polygon to (sx, sy)\n   - Create a notch that extends from that edge, going around the sardine\n   - Notch adds exactly 4 vertices (2 corner points + 2 vertices to close)\n   - Perimeter cost = 2 * (horizontal span + vertical span of notch)\n\n3. **Greedy selection**: \n   - Sort sardines by: distance to nearest polygon edge, or by ratio of perimeter cost to sardine value\n   - Apply exclusions in this order, stopping when:\n     * Budget exhausted (perimeter or vertex limit)\n     * No more beneficial exclusions\n\n## Phase 3: Priority-Driven Exclusion Order\n\nRun multiple restarts with different sardine processing orders:\n\n- **Random permutation**: Try each sardine in random order\n- **Distance-based**: Process sardines closest to boundary first\n- **Value-based**: Process sardines that cost least per unit of perimeter\n- **Hybrid**: Combine distance and value heuristics\n\n## Phase 4: Output Generation\n\n- Output polygon vertices in order (clockwise or counterclockwise)\n- Ensure all constraints satisfied before submission\n- Return single best polygon from all restarts\n\n## Complexity Analysis\n\n- Initial box: O(N) to find min/max coordinates\n- Sardine exclusion: O(N * M) worst case where M = number of sardines, but can be optimized with spatial indexing\n- Total per eval: O(N^2) for N=5000 is ~25M operations, fits in 2s with efficient C++\n\n## Key Advantages Over Grid-Based Methods\n\n1. **Point-level precision**: Decisions based on exact fish positions, not coarse cells\n2. **Minimal boundary modifications**: Each exclusion costs minimal perimeter\n3. **Guaranteed mackerel capture**: Starting with all mackerels eliminates trade-offs\n4. **Scalable**: Works even with dense fish clusters"
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing mackerel enclosure with sardine exclusion:

    1. Parse fish coordinates, compute bounding box of all mackerels

    2. Count sardines inside initial box

    3. For each sardine, compute minimal L-shaped notch to exclude it

    4. Greedily apply notches in best-first order until budget exhausted

    5. Run 20-25 restarts with different sardine exclusion orders

    6. Output best valid polygon (4-1000 vertices, perimeter <= 400000)'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations
    (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - exact evaluation needed for point-level optimization.
  finish: End when you have submitted working mackerel enclosure with sardine exclusion.
