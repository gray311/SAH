type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing mackerel enclosure with sardine exclusion:

  1. Parse fish coordinates, compute bounding box of all mackerels

  2. Count sardines inside initial box

  3. For each sardine, compute minimal L-shaped notch to exclude it

  4. Greedily apply notches in best-first order until budget exhausted

  5. Run 20-25 restarts with different sardine exclusion orders

  6. Output best valid polygon (4-1000 vertices, perimeter <= 400000)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
