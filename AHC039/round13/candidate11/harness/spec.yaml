schema: h2spec/1.0
system_prompt: "You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).\n\nCORE STRATEGY: Convex cluster approximation with rectangular bounding.\n\nSEARCH METHOD:\n\n1. CLUSTER MACKERELS: Parse input, group mackerels by coordinate proximity (same grid cell or adjacent cells). Identify the 20-30 most populated mackerel regions.\n\n2. REGION ANALYSIS: For each mackerel region, check sardine density. If sardines vastly outnumber mackerels, skip or shrink. If mackerel-dominant, proceed.\n\n3. RECTANGLE CONSTRUCTION: For each region, compute tightest bounding rectangle (min/max x,y). This gives a candidate polygon.\n\n4. OPTIMAL EXPANSION SHIFTS: For each edge of the bounding rectangle, try extending outward in 4 directions (±1, ±2, ±3, ±4 units) to capture adjacent mackerels while avoiding sardines.\n\n5. COMBINE CANDIDATES: Merge rectangles that don't overlap significantly, or select the single best. Use longest edge-first merging strategy.\n\n6. KNIFE-CUT REFINE: For any sardines inside, try \"cutting\" by expanding one adjacent edge outward to push them out (if space permits).\n\n7. DEEP SEARCH: For top 5-10 candidates per restart, perform 2-3 rounds of edge refinement with shifts ±1, ±2, ±3, ±4 units. Use rectangle-based scoring.\n\n8. RESTARTS: Run 10 restarts with different random seed selection and random initial perturbations (±100 to ±500 units to seed coordinates).\n\n9. VALIDATION: Ensure 4-1000 vertices, perimeter ≤400,000, all coords in [0,100000], no self-intersection.\n\n10. OPTIMIZE FOR SPEED: Minimize operations per evaluation. Use O(1) rectangle scoring via precomputed 2D prefix sums for fish counts.\n\nTools: edit_solution (write complete C++), evaluate_solution (run and score), probe_solution (NOT useful - full eval needed for accurate counts), finish (when ready).\n\nKEY DIFFERENCE: Use mackerel clustering + bounding rectangles + edge extension, NOT grid-based corridor expansion. Prioritize compact, dense polygon coverage over sparse corridors."
skill_description: Mackerel cluster approximation via bounding rectangles. Find dense mackerel regions, compute tight bounding boxes, extend edges to capture more mackerels while avoiding sardines, use 2D prefix sums for O(1) rectangle scoring, run 10 restarts with ±100..500 initial perturbations, deep refine top 5-10 with ±1..4 shifts.
skill_body: "# Mackerel Cluster Rectangle Strategy\n\n## Phase 1: Data Parsing and Clustering\n- Parse input: first N mackerels, next N sardines\n- Group mackerels into cells (e.g., 2000×2000 grid, cell_size=500)\n- Count mackerels per cell, identify top 30 cells\n\n## Phase 2: Region-to-Rectangle Conversion\nFor each top mackerel cell:\n- Find all mackerels in that cell and its 8 neighbors\n- Compute bounding box: (min_x, min_y) to (max_x, max_y)\n- This bounding box is a candidate polygon (4 vertices)\n\n## Phase 3: Sardine Exclusion Check\nFor each candidate rectangle:\n- Count sardines inside using 2D prefix sum (O(1) query)\n- Score = mackerels_inside - sardines_inside\n- If score < 0, discard or try shrinking\n\n## Phase 4: Edge Expansion (Key Innovation)\nFor each candidate rectangle, try expanding each edge:\n- For top edge: expand downward by d units (d=1,2,3,4), check new sardine count\n- For bottom edge: expand upward by d units\n- For left edge: expand rightward by d units  \n- For right edge: expand leftward by d units\n- Keep expansion that improves score (more mackerels, same or fewer sardines)\n\n## Phase 5: Knifing Sardines Out\nFor rectangles containing sardines:\n- Try pushing a single edge outward to \"cut\" the rectangle corner off\n- This removes sardines at the cost of potentially losing some mackerels\n- Net gain if sardines_removed > mackerels_lost\n\n## Phase 6: Rectangle Merging\n- If two rectangles are adjacent or nearly adjacent, merge them\n- Resulting polygon may have 6-8 vertices\n- Compute merged rectangle bounding box and re-score\n\n## Phase 7: Deep Refinement\nFor top 5-10 candidates:\n- For each of 4-8 edges: try shifts ±1, ±2, ±3, ±4 units\n- Use 2D prefix sums for instant rectangle scoring\n- Keep best variant\n- Repeat 2-3 refinement rounds\n\n## Phase 8: Multiple Restarts\n- Run 10 restarts with different seeds\n- Each restart: randomly perturb top cell selection by ±100 to ±500 units\n- Build rectangles from perturbed seeds\n- Merge, refine, output best\n\n## Performance Notes\n- Use 2D prefix sum array for O(1) fish count in any rectangle\n- Build prefix sum once: O(N) preprocessing, O(1) per query\n- Total per evaluation: <1.5s with 10 restarts and deep refinement\n- Output format: m (vertex count), then m lines of coordinates"
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing mackerel cluster rectangle strategy:

    1. Build 2D prefix sum arrays for O(1) fish counting

    2. Cluster mackerels into 2000×2000 grid cells, find top 30 by count

    3. For each, compute bounding rectangle of mackerel cluster

    4. Score using prefix sums (mackerels - sardines)

    5. Expand each edge by 1-4 units to capture more fish

    6. Try \"knifing\" sardines out via edge extensions

    7. Merge adjacent rectangles, refine top 5-10 with ±1..4 shifts, 2-3 rounds

    8. 10 restarts with ±100..500 seed perturbations

    Ensure <1.5s execution, valid polygon output.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~1.5s search window.
  probe_solution: NOT useful - full evaluation needed for accurate scoring.
  finish: End when you have a working mackerel cluster rectangle strategy with prefix sums and edge expansion.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 18000
