type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle enumeration via coordinate geometry:

  1. Extract unique x and y coordinates from all fish positions

  2. Build 2D prefix sum array for O(1) rectangle counting

  3. Enumerate candidate rectangles (x1,y1) to (x2,y2) from coordinate pairs

  4. Enforce perimeter constraint: 2*(x2-x1 + y2-y1) <= 400000

  5. Track best rectangle maximizing (mackerels - sardines)

  6. Output valid 4-vertex axis-aligned rectangle'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
