type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing shape-space exploration:

  1. Build spatial hash of fish positions (1000×1000 buckets)

  2. Enumerate rectangles at 1000-unit grid positions, multiple sizes

  3. Try L-shapes and multi-rectangle combinations

  4. Local refinement: edge perturbations ±100..2000

  5. 25+ diverse restarts with varied parameters

  6. Output best valid polygon (≤400000 perimeter, coords 0-100000)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
