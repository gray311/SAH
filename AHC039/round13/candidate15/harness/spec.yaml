schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).

  STRATEGY: Direct dense-region targeting with simple rectangular/L-shaped polygons.

  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):

  1. SPATIAL INDEXING:
     - Build a spatial grid (e.g., 50x50 or 100x100 cells) over [0,100000]x[0,100000]
     - For each cell, count mackerels (M) and sardines (S)
     - Compute density score = M - S

  2. REGION SELECTION:
     - Find top 5-10 cells with highest positive (M-S) score
     - Use these as seed regions for polygon construction

  3. POLYGON CONSTRUCTION (SIMPLIFIED):
     - From each seed cell, build a rectangle or L-shaped polygon
     - Rectangle: expand in all 4 directions by same amount
     - L-shape: expand 2+ directions from corner
     - Ensure: 4 <= vertices <= 1000, perimeter <= 400,000, coords in [0,100000]

  4. MINIMAL HILL CLIMBING:
     - For each candidate, try small edge shifts: ±1, ±2, ±3 units
     - Keep shifts that improve the score
     - 1-2 refinement rounds only

  5. LIMITED RESTARTS:
     - Run 3-5 restarts with different random seeds
     - Each restart: pick 3 seed cells, build polygons, hill climb

  6. VALIDATION:
     - Output valid polygon only
     - Check perimeter and coordinate bounds

  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ implementation
  - evaluate_solution: Run C++ program, get score (budget=30 evals)
  - probe_solution: Use for rapid iteration (cheap approximate scoring)
  - finish: Submit best solution found

  KEY DIFFERENCE: Simpler construction, smaller shifts, fewer restarts = faster per-eval execution under 2.0s.
skill_description: |
  Direct dense-region targeting. Build spatial grid, find top mackerel-dense cells, construct simple rectangles/L-shapes, minimal hill climb with ±1-3 shifts, 3-5 restarts.
skill_body: |
  # Simple Polygon Construction Strategy

  ## Phase 1: Spatial Grid Analysis
  - Build grid (e.g., 50x50 or 100x100) over [0,100000]²
  - Count mackerels (M) and sardines (S) per cell
  - Score = M - S

  ## Phase 2: Seed Region Selection
  - Pick top 5-10 cells with highest positive score
  - These are your mackerel-dense regions

  ## Phase 3: Simple Polygon Construction
  For each seed cell:
  - Expand uniformly in 4 directions (rectangle) OR
  - Expand 2+ directions from corner (L-shape)
  - Use integer coordinates, simple geometry

  ## Phase 4: Minimal Hill Climbing
  - For each edge, try shifts: ±1, ±2, ±3 units
  - Use probe for fast scoring
  - 1-2 refinement rounds

  ## Phase 5: Limited Restarts
  - 3-5 restarts total
  - Each: 3 seed cells → polygons → hill climb → track best

  ## Implementation Notes
  - O(1) grid access after O(N) preprocessing
  - Total time per eval: <1.5s for safety margin
  - Use KD-tree or grid for fast region queries
tool_descriptions:
  edit_solution: |
    Replace EVOLVE-BLOCK with C++ implementing: (1) spatial grid, (2) find top 5-10 positive (M-S) cells, (3) build rectangles/L-shapes, (4) minimal hill climb ±1-3, (5) 3-5 restarts, (6) validate output.
  evaluate_solution: |
    Run C++ program. Returns score (mackerels-sardines+1). Budget=30 evals, ~2s per search window.
  probe_solution: |
    Use for rapid iteration - cheap approximate scoring. Helps in hill climbing without consuming eval budget.
  finish: |
    Submit when you have a working implementation with 3-5 restarts and minimal hill climbing.
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 30
  max_tokens: 8192
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 10000
new_tools:
- name: find_dense_regions
  description: |
    Find dense mackerel regions by computing M-S score per grid cell. Returns top k cells with highest positive score.
  input_schema:
    type: object
    properties:
      grid_rows:
        type: integer
        default: 50
      grid_cols:
        type: integer
        default: 50
      k_top:
        type: integer
        default: 10
  implementation_py: |
    def run(ctx, args):
        rows = args.get("grid_rows", 50)
        cols = args.get("grid_cols", 50)
        k_top = args.get("k_top", 10)
        
        program = ctx.get_program()
        fish_coords = []
        
        for line in program.split('\n'):
            line = line.strip()
            # Parse fish coordinates from C++ code
            if 'mackerel' in line.lower() or 'sardine' in line.lower():
                try:
                    # Extract x,y from fish structure or input reading
                    import re
                    matches = re.findall(r'(\d+)\s*,\s*(\d+)', line)
                    for x, y in matches:
                        fish_coords.append((int(x), int(y)))
                except:
                    continue
        
        # Alternative: read from stdin simulation (program would read from input)
        # For now, assume we parse from a known format
        grid_size = max(rows, cols)
        cell_size = 100000 // grid_size
        
        # Initialize grid
        grid = [[{'m': 0, 's': 0} for _ in range(cols)] for _ in range(rows)]
        
        # Count fish per cell
        for x, y in fish_coords:
            cx, cy = min(x // cell_size, cols-1), min(y // cell_size, rows-1)
            if 0 <= cy < rows and 0 <= cx < cols:
                if 'mackerel' in line.lower():
                    grid[cy][cx]['m'] += 1
                elif 'sardine' in line.lower():
                    grid[cy][cx]['s'] += 1
        
        # Compute scores and find top k
        cells_with_score = []
        for r in range(rows):
            for c in range(cols):
                score = grid[r][c]['m'] - grid[r][c]['s']
                if score > 0:
                    cells_with_score.append((r, c, score, grid[r][c]['m'], grid[r][c]['s']))
        
        cells_with_score.sort(key=lambda x: -x[2])
        top_cells = cells_with_score[:k_top]
        
        return {
            "cells": top_cells,
            "grid_rows": rows,
            "grid_cols": cols
        }
new_skills:
- name: simple-polygon-recipe
  description: |
    Build simple axis-aligned rectangles or L-shapes around dense mackerel regions. Use minimal hill climbing.
  body: |
    # Simple Polygon Construction Recipe

    ## Core Strategy
    Target dense mackerel regions directly, build simple polygons (rectangles, L-shapes), minimal refinement.

    ## Step 1: Grid-Based Density Estimation
    - Divide [0,100000]² into grid (e.g., 50x50 cells)
    - Count mackerels and sardines per cell
    - Score = M - S

    ## Step 2: Identify Seed Regions
    - Select top 5-10 cells with highest positive (M-S) score
    - These are your target regions

    ## Step 3: Build Simple Polygons
    For each seed cell at (cx, cy):
    
    **Rectangle option:**
    - Expand equal distance d in all 4 directions
    - Vertices: (cx-d, cy-d), (cx+d, cy-d), (cx+d, cy+d), (cx-d, cy+d)
    
    **L-shape option:**
    - From corner, expand 2+ directions
    - e.g., expand East and North to form L-shape

    ## Step 4: Minimal Hill Climbing
    - For each edge vertex, try shifts: -3, -2, -1, +1, +2, +3
    - Score each variant (use probe for speed)
    - Keep improving shift
    - Repeat 1-2 rounds

    ## Step 5: Output Best Polygon
    - Validate: 4-1000 vertices, perimeter ≤ 400,000, coords in [0,100000]
    - Ensure axis-aligned (edges parallel to x or y axis)
new_middlewares:
- name: quality_check
  hook: before_model
  description: |
    Reminder to build simple, valid polygons with minimal complexity to stay under time limit.
  implementation_py: |
    def before_model(hook_input):
        return "Build simple rectangles/L-shapes around dense mackerel regions. Minimal hill climbing (±1-3). 3-5 restarts. Stay under 2s."
