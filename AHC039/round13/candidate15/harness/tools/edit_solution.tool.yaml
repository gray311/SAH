type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing: (1) spatial grid, (2) find top 5-10 positive
  (M-S) cells, (3) build rectangles/L-shapes, (4) minimal hill climb ±1-3, (5) 3-5 restarts, (6) validate
  output.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
