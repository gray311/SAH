type: tool
name: find_dense_regions
description: Find dense mackerel regions by computing M-S score per grid cell. Returns top k cells with
  highest positive score.
input_schema:
  type: object
  properties:
    grid_rows:
      type: integer
      default: 50
    grid_cols:
      type: integer
      default: 50
    k_top:
      type: integer
      default: 10
