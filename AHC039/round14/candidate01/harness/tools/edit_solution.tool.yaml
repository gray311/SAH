type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing spatial clustering + probe-guided search:

  1. Call find_fish_clusters once to identify mackerel-dense regions

  2. Build base axis-aligned rectangles around top clusters

  3. Expand rectangles using probe_solution for fast scoring

  4. Deep hill climb with ±10..50 edge shifts, 2 rounds

  5. 10-15 restarts, output best polygon

  Ensure <2.0s, valid format: m then m lines of "x y".'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
