type: tool
name: probe_union_rects
description: 'TASK-SPECIFIC PROBE: Compute approximate score for a union of

  axis-aligned rectangles. Given rectangle boundaries and fish

  positions, use spatial indexing (grid or quadtree) to count

  mackerels (type=1) and sardines (type=-1) in the union. Returns

  approximate (M, S, score=approx_M-approx_S). Fast (~10ms) and uses

  probe budget (50 total), NOT evaluation budget. Scores are

  approximate and NOT comparable to full evaluate_solution scores.

  Use to rapidly guide local search (expand/shrink rectangles,

  merge/split operations) without consuming expensive evaluations.'
input_schema:
  type: object
  properties:
    rectangles:
      type: array
      items:
        type: object
        properties:
          left:
            type: integer
          top:
            type: integer
          right:
            type: integer
          bottom:
            type: integer
        description: Axis-aligned rectangle with integer coordinates in [0, 100000]
