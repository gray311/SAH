type: tool
name: compute_polygon_score
description: 'Compute an approximate polygon score using a 2D spatial grid.

  Decompose the polygon into elementary rectangles, sum fish counts in each cell,

  return mackerels - sardines + 1. This is O(vertices) time vs O(N) for full evaluation.

  Use this for quick ranking of polygon variants before calling evaluate_solution.'
input_schema:
  type: object
  properties:
    vertices:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
    use_full_eval:
      type: boolean
      default: false
