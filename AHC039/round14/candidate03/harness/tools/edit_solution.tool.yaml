type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing spatial grid-based polygon optimization:

  1. Build 100x100 grid, count fish per cell

  2. Construct polygons using rectangles with lobes or morphological operations

  3. Score polygons in O(vertices) using grid (not O(N) points)

  4. Hill climb with edge shifts ±1,±2,±5

  5. 5-10 restarts, output best polygon

  Ensure <2.0s, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
