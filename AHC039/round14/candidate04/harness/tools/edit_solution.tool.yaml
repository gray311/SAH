type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ using exact spatial clustering + KD-tree:

  1. Read 2N fish positions (N mackerels, N sardines) exactly from input

  2. Build KD-tree for O(log N) rectangle range queries

  3. Use scan_mackerel_clusters to find dense mackerel regions

  4. Build axis-aligned rectangles around each region

  5. Query exact mackerel/sardine counts in each rectangle

  6. Combine regions into polygons, hill climb with ±10..50 shifts

  7. 30 restarts, output best valid polygon

  Ensure <2.0s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
