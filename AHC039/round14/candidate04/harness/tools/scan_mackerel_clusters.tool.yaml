type: tool
name: scan_mackerel_clusters
description: Scan input to identify mackerel-dense clusters. Reads all 2N fish coordinates, groups nearby
  mackerels using spatial hashing, returns cluster bounding boxes (min_x, max_x, min_y, max_y, mackerel_count)
  for candidate polygon construction.
input_schema:
  type: object
  properties:
    grid_resolution:
      type: integer
      description: Optional grid resolution for spatial hashing (10-1000), default 100
