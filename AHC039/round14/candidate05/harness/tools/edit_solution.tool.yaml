type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-aware rectangle packing:

  1. Build 50x50 grid, count M/S per cell, compute M-S score

  2. Find top 30 cells, group into clusters of nearby high-score cells

  3. For each cluster, create minimal bounding rectangle

  4. Select top 20 rectangles, merge overlapping ones

  5. Tune each rectangle boundary by ±5..±50 shifts using grid scoring

  6. Run 25-30 restarts, output best valid polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
