type: tool
name: edit_solution
description: "Replace EVOLVE-BLOCK with C++ implementing cluster-based bounding box optimization:\n  1.\
  \ Read N mackerels, N sardines from input\n  2. Cluster mackerels spatially (cell_size 200-500)\n  3.\
  \ For each cluster, build initial bounding box from min/max coords\n  4. For each edge, refine by shifting\
  \ to exclude nearby sardines while keeping mackerels\n  5. Handle multiple disjoint rectangles, try\
  \ merging if beneficial\n  6. Local optimization: try edge shifts ±5..±30, repeat 5-10 iterations\n\
  \  7. Multiple restarts (10-15) with varied parameters\n  8. Output valid polygon: vertex count, then\
  \ vertices\n  Ensure <1.8s execution, valid format, perimeter <= 400,000."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
