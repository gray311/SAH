type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing geometric local search:


  1. Generate diverse initial shapes (rectangle, cross, L/T-shapes, random polygons)

  2. Use KD-tree for fast O(log N) scoring of enclosed fish

  3. Apply local mutations: vertex perturbations +/- 5..20, edge modifications, vertex add/remove

  4. Run iterative refinement with population-based search (50 candidates, 5-10 iterations)

  5. Multi-restart (5-8) with different seeds

  6. Validate: 4-1000 vertices, perimeter <= 400000, coords [0,100000], no self-intersection

  7. Output best polygon, ensure <1.9s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
