type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing refined polygon optimization:


  1. Load and filter fish (mackerels vs sardines)


  2. Build fine 200x200 grid (cell_size=500), count M/S per cell


  3. Generate polygons from templates: rectangles, L-shapes, U-shapes


  4. Connect components with minimal corridors (M >= S only)


  5. Hill climb with targeted shifts ±1..5 units, 2-3 passes


  6. 20-25 restarts, output best valid polygon


  Ensure <2.0s execution, valid output format (m then vertices).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
