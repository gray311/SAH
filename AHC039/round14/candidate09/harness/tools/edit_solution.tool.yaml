type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ rectangle-first search: 1. Read fish, build KD-tree for O(log
  N) counting 2. Start from mackerel bounding box 3. Greedily shrink/expand edges 4. 25 iterations with
  random perturbations 5. Generate 15 random rectangles 6. Output best rectangle (4 vertices)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
