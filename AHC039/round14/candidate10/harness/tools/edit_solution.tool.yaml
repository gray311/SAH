type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct geometric optimization: 1. Read 5000 mackerels
  and 5000 sardines from stdin 2. Build 100x100 grid (cell_size=1000) with fish indices per cell 3. Find
  dense mackerel clusters (>=10 mackerels) 4. For each cluster, build polygon via expanding boundaries
  (±1..10 units) 5. Merge adjacent clusters for multi-lobed polygons 6. Refine edges with ±5..25 shifts,
  3-5 rounds 7. 10 restarts, output best polygon 8. Ensure <2.0s execution'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
