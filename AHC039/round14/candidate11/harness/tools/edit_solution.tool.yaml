type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct geometric search:

  1. Read fish coordinates directly (no grid)

  2. Generate 30-50 random axis-aligned rectangles

  3. For each, apply local vertex perturbation (±10..200)

  4. Try combining nearby rectangles

  5. Run 10-15 restarts, output best valid polygon

  Ensure <2.0s execution, valid output format (m then vertices).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
