schema: h2spec/1.0
system_prompt: "You are a C++ rectilinear polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).\n\nCRITICAL STRATEGY: Direct geometric construction and hill climbing on actual fish coordinates.\n\nSEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):\n\n1. READING INPUT:\n   - Parse all 10000 fish coordinates (N mackerels + N sardines)\n   - Store as arrays: mackerels[x][y] and sardines[x][y]\n   - No grid abstraction - work with exact coordinates\n\n2. GEOMETRIC CONSTRUCTION PHASES:\n   a. Bounding box analysis: find min/max x,y of each fish type\n   b. Rectilinear convex hull candidate: build minimal axis-aligned polygon containing all mackerels\n   c. Multi-rectangle approach: partition mackerels into dense clusters, build separate rectangles around each cluster\n   d. Custom shape generation: try combinations of horizontal/vertical rectangles to maximize coverage\n\n3. RECTANGLE PACKING STRATEGY:\n   - For each mackerel cluster (points within distance D), build minimal bounding rectangle\n   - For each rectangle, calculate expected mackerels (count within rectangle) and sardines\n   - Score = mackerels_in_rect - sardines_in_rect\n   - Combine rectangles: if non-overlapping, sum scores; if overlapping, compute union\n\n4. HILL CLIMBING ON POLYGON VERTICES:\n   - Start from candidate polygon (rectangle or multi-rectangle union)\n   - For each vertex: try moving in 4 directions by ±5, ±10, ±20, ±50 units\n   - For each edge: try length adjustments ±5, ±10, ±20\n   - Evaluate each variant using point-in-rectangle tests\n   - Keep moves that improve score\n   - Repeat 5-10 refinement iterations\n\n5. RANDOMIZED CONSTRUCTION VARIANTS:\n   - VARIANT A: Minimum bounding rectangle around ALL mackerels\n   - VARIANT B: Minimum bounding rectangle around top 50% densest mackerel clusters\n   - VARIANT C: L-shaped polygon around 2 clusters\n   - VARIANT D: U-shaped polygon (3 connected rectangles)\n   - VARIANT E: Random sampling - pick random vertex positions near mackerel centers\n   - Run 20-30 variants per evaluation, keep best\n\n6. VALIDATION:\n   - Output valid axis-aligned polygon (4-1000 vertices, integer coords 0-100000)\n   - Perimeter <= 400,000, no self-intersection\n   - Ensure at least 4 vertices forming a valid closed shape\n\nTools:\n- edit_solution: Replace EVOLVE-BLOCK with complete C++ implementing direct geometric construction\n- evaluate_solution: Run C++ program, get score (mackerels-sardines+1), validity\n- probe_solution: NOT available - only full evaluation works\n- finish: Submit when you have a working geometric optimizer with multiple construction strategies\n\nKEY DIFFERENCE from grid approaches: Direct coordinate processing, no grid abstraction, multiple geometric construction strategies, vertex-level hill climbing."
skill_description: Direct geometric construction. Parse fish coordinates, build rectangle candidates from mackerel clusters, hill climb vertices, try 20-30 variants per eval.
skill_body: "# Direct Geometric Polygon Construction Strategy\n\n## Phase 1: Input Processing\n- Read all fish coordinates into memory (mackerels and sardines separately)\n- Build dense representations: for each x coordinate, list of (y, type) pairs\n- Compute density maps: for each small region, count mackerels vs sardines\n\n## Phase 2: Multiple Construction Strategies\n\n### Strategy A: Global Bounding Box\n- Find min_x, max_x of all mackerels; min_y, max_y of all mackerels\n- Build single rectangle [min_x, max_x] x [min_y, max_y]\n- Extend outward if improving score (while avoiding sardines)\n\n### Strategy B: Cluster-Based Multi-Rectangle\n- Find connected clusters of mackerels (points within distance D=200)\n- For each cluster, build minimal bounding rectangle\n- Calculate score for each rectangle individually\n- Combine rectangles: start with best single, add second best if non-overlapping and improves total\n\n### Strategy C: L-Shaped Polygons\n- Pick 2 dense mackerel clusters\n- Build rectangles around each, then connect them into L-shape\n- Try both orientations\n\n### Strategy D: Randomized Vertex Placement\n- Sample random x values from mackerel x-coordinates\n- Sample random y values from mackerel y-coordinates\n- Form rectangles/polygons from these samples\n- Evaluate and keep best\n\n## Phase 3: Hill Climbing\nFor each candidate polygon:\n1. Extract vertices and edges\n2. For each vertex, try perturbations: ±5, ±10, ±20, ±50 in x or y direction\n3. For each edge, try extending/shrinking by ±5, ±10, ±20\n4. Use point-in-rectangle test: for each rectangle in polygon, check if each fish point is inside\n5. Score = (#mackerels inside) - (#sardines inside) + 1\n6. Keep all perturbations that improve score\n7. Repeat 5-10 iterations\n\n## Phase 4: Validation\n- Ensure 4 <= vertices <= 1000\n- All coordinates in [0, 100000]\n- Perimeter <= 400,000\n- No self-intersection (axis-aligned rectangles don't self-intersect if non-overlapping)\n- Output format: vertex count, then vertex coordinates\n\n## C++ Implementation Notes\n- Use direct coordinate arrays, no grid\n- Implement point-in-rectangle test efficiently\n- For multi-rectangle polygons, track which rectangles form the shape\n- Use std::vector for dynamic arrays\n- Implement multiple construction strategies and try all, keep best\n- Total time: < 2.0 seconds per evaluation"
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing direct geometric construction:\n\n  1. Parse all 10000 fish coordinates (no grid)\n  2. Build multiple polygon candidates: global bbox, cluster-based rectangles, L-shapes, random\n  3. For each candidate, perform vertex-level hill climbing (±5,±10,±20,±50)\n  4. Evaluate using point-in-rectangle tests\n  5. Keep best valid polygon, output in correct format\n  6. Ensure <2.0s execution'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT available - full evaluation needed for accurate scoring.
  finish: End when you have submitted a working direct geometric optimizer with multiple construction strategies and vertex-level hill climbing.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
  max_tokens: 14336
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 18000
new_tools: []
new_skills: []
new_middlewares: []
