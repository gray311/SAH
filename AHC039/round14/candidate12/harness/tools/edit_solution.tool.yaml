type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct geometric construction:\n\n  1. Parse
  all 10000 fish coordinates (no grid)\n  2. Build multiple polygon candidates: global bbox, cluster-based
  rectangles, L-shapes, random\n  3. For each candidate, perform vertex-level hill climbing (±5,±10,±20,±50)\n  4.
  Evaluate using point-in-rectangle tests\n  5. Keep best valid polygon, output in correct format\n  6.
  Ensure <2.0s execution'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
