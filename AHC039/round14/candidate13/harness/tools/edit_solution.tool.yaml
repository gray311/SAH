type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based rectangle optimization:

  1. Read mackerels, cluster by proximity (DBSCAN-like or centroid grouping) 2. Build bounding box rectangles
  for each cluster 3. For each rectangle, optimize corners to exclude sardines 4. Try merging adjacent
  rectangles 5. Deep local search: perturb corners ±3, ±7, ±15, ±30 units 6. 25-30 restarts with cluster
  perturbations 7. Output best valid polygon

  Ensure <1.9s execution, valid output (4-1000 vertices, coords [0,100000], perimeter <=400000).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
