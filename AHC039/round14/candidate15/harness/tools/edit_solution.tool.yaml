type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing coordinate-based polygon optimization: 1. Build
  KD-tree on 10000 fish points for spatial queries 2. Generate 15-20 diverse polygon candidates (rectangles,
  expansions, multi-lobed) 3. Use probe_solution for cheap scoring of all candidates 4. Evaluate top 1-3
  with evaluate_solution 5. Output best valid polygon (4-1000 vertices, perimeter<=400000, coords in [0,100000])
  Ensure <2.0s execution, valid output format, exploit probe budget for exploration.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
