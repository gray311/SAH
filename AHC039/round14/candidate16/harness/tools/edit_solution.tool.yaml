type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing coordinate-focused rectangle packing:

  1. Parse fish coordinates, build spatial index (grid cell_size=100)

  2. Find high-density mackerel cells (M>=3, S<=1)

  3. Generate axis-aligned rectangle candidates around these cells

  4. Combine multiple rectangles into valid polygons

  5. Local search: shift edges, merge/split rectangles

  6. 20-30 restarts, evaluate top candidates

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
