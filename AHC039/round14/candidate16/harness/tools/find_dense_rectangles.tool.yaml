type: tool
name: find_dense_rectangles
description: Find dense mackerel regions and generate candidate axis-aligned rectangles around them. Returns
  list of rectangles with their M, S counts and estimated scores.
input_schema:
  type: object
  properties:
    min_mackerels:
      type: integer
      default: 2
    max_sardines:
      type: integer
      default: 1
    max_perimeter:
      type: integer
      default: 400000
