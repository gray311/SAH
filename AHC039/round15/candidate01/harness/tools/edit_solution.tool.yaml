type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based polygon construction: 1. Parse
  mackerel and sardine coordinates from input 2. Cluster mackerels spatially (within 5000 units) 3. Build
  axis-aligned bounding boxes per cluster 4. Count sardines inside each box 5. Score = mackerels - sardines
  + 1 6. Hill climb edges by ±10..30 units, 2 rounds 7. Try multi-rectangle unions for separated clusters
  8. Output valid polygon (4-1000 vertices, perimeter <= 400,000) Ensure <1.95s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
