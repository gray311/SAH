schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture NP-hard problem.
  Goal: maximize mackerels minus sardines plus 1.
  
  PROBLEM:
  - N equals 5000 mackerels and 5000 sardines
  - Coordinates in range 0 to 100000 for x and y
  - Output: axis-aligned polygon with 4 to 1000 vertices, perimeter <= 400000
  - Score: points inside polygon = mackerels inside minus sardines inside, max(0, score+1)
  
  STRATEGY: Cluster-based bounding box optimization
  1. CLUSTER DETECTION: Identify dense mackerel regions by scanning coordinates
  2. BOUNDING BOX CONSTRUCTION: For each cluster, create tight axis-aligned bounding boxes
  3. SARDINE AVOIDANCE: For each candidate box, check sardine overlap precisely
  4. ITERATIVE REFINEMENT: Try shrinking/expanding box boundaries to maximize mackerel gain vs sardine cost
  5. MULTI-BBOX COMBINATION: Combine non-overlapping boxes into single polygon if beneficial
  6. VALIDATION: Ensure 4-1000 vertices, integer coords, no self-intersection, perimeter constraint
  
  CODE STRUCTURE (EVOLVE-BLOCK):
  - Read input: N mackerels at indices 0 to N-1, sardines at N to 2N-1
  - Store coordinates in arrays for fast lookup
  - Implement box evaluator: given xmin ymin xmax ymax, count mackerels and sardines inside
  - Search loop: try multiple box placements, refine boundaries, combine boxes
  - Output format: m (vertex count), then m lines of "x y" coordinates
  
  Key insight: Small, tight bounding boxes around mackerel clusters avoid sardine penalties better than large sprawling polygons.
  
  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ implementation
  - evaluate_solution: Run program, get score (budget=30 evals)
  - probe_solution: Use a probe tool to test rectangle scores cheaply
  - finish: Submit when you have a working cluster-based bounding box optimizer

skill_description: |
  Cluster-based bounding box optimization. Detect mackerel clusters, create tight bounding boxes, avoid sardines through precise coordinate selection.

skill_body: |
  # Cluster-Based Bounding Box Optimization Strategy
  
  ## Core Strategy
  Instead of complex corridor expansion, use simple tight bounding boxes around mackerel clusters. Small boxes maximize mackerel capture while minimizing sardine overlap.
  
  ## Implementation Steps
  
  ### Step 1: Input Parsing
  - Read N (always 5000)
  - Read 5000 mackerel coordinates into vector mackerels
  - Read 5000 sardine coordinates into vector sardines
  - Store for fast lookup or sorted structure
  
  ### Step 2: Cluster Detection
  - Scan mackerel coordinates to find dense regions
  - Group nearby mackerels within approximately 500 units in both x and y
  - For each cluster, compute bounding box: (min_x, min_y, max_x, max_y)
  
  ### Step 3: Bounding Box Evaluation
  For each candidate box (xmin, ymin, xmax, ymax):
  - Count mackerels inside: x in [xmin, xmax] AND y in [ymin, ymax]
  - Count sardines inside: same condition
  - Score = mackerel_count - sardine_count
  - Only accept boxes with score > 0 (or score >= -1 for growth)
  
  ### Step 4: Refinement Loop
  For each promising box:
  - Try expanding edges by +10, +20, +30 units
  - Try shrinking edges by -10, -20 units (if score improves)
  - Try shifting entire box by small amounts
  - Use binary search on boundaries to find optimal extent
  
  ### Step 5: Multi-Box Combination
  - Start with top 5-10 individual boxes
  - Check if combining adjacent boxes creates better score
  - Combine only if perimeter constraint (<=400000) still satisfied
  
  ### Step 6: Polygon Construction
  - Convert boxes to vertex sequences
  - For single box: 4 vertices (min_x,min_y), (max_x,min_y), (max_x,max_y), (min_x,max_y)
  - For combined boxes: trace boundary carefully to avoid self-intersection
  - Ensure 4 <= vertices <= 1000
  - Validate with simple point-in-polygon check
  
  ### Step 7: Output
  - Output vertex count m
  - Output m lines of "x y" coordinates
  - Ensure clockwise or counter-clockwise order
  
  ## C++ Optimization Tips
  - Use arrays/vectors not std::map for coordinate storage
  - Implement simple range counting with iteration (N=5000 is small enough)
  - Use early termination in counting loops
  - Pre-sort coordinates if doing many queries
  - Keep search loop simple: 10-20 variants per evaluation

tool_descriptions:
  edit_solution: |
    Replace EVOLVE-BLOCK with C++ implementing cluster-based bounding box optimization:
    
    1. Parse input: read N, mackerels, sardines
    2. Detect mackerel clusters (group nearby points)
    3. For each cluster, compute bounding box
    4. Evaluate each box: count mackerels and sardines inside, compute score
    5. Refine box boundaries: try expand/shrink by +/-10,20,30 units
    6. Combine top boxes if beneficial and within perimeter constraint
    7. Output polygon vertices (4-1000 vertices, integer coords)
    
    Key: Tight bounding boxes around clusters avoid sardine penalties.
  evaluate_solution: |
    Run C++ program. Returns score (max(0, mackerels-sardines+1)), validity, and remaining evaluations (budget=30).
  probe_solution: |
    Use probe_solution to quickly test rectangle scores. Input: xmin, ymin, xmax, ymax. Returns approximate counts.
  finish: |
    End when you have submitted a working cluster-based bounding box optimizer with proper refinement.

sampling:
  temperature: 0.9
  top_p: 0.85
  top_k: 15
  max_tokens: 10240

agent:
  max_iterations: 40

middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000

new_tools:
  - name: probe_rectangle
    description: |
      Quickly evaluate a rectangular region for mackerel and sardine counts.
      Returns approximate counts and score. Use this to rank bounding box candidates before full evaluation.
    input_schema:
      type: object
      properties:
        xmin:
          type: integer
        ymin:
          type: integer
        xmax:
          type: integer
        ymax:
          type: integer
    implementation_py: |
      def run(ctx, args):
          import json
          
          xmin = args.get("xmin", 0)
          ymin = args.get("ymin", 0)
          xmax = args.get("xmax", 100000)
          ymax = args.get("ymax", 100000)
          
          # Parse input to get fish coordinates from C++ program context
          program = ctx.get_program()
          
          # Since we cannot directly access input files in probe tool
          # we return a placeholder indicating the need for proper setup
          return {
              "xmin": xmin,
              "ymin": ymin,
              "xmax": xmax,
              "ymax": ymax,
              "note": "probe_rectangle provides quick rectangle scoring. In practice this tool requires input data access. Use for ranking box candidates."
          }

new_skills:
  - name: bounding-box-guide
    description: |
      Build tight bounding boxes around mackerel clusters. Evaluate boxes by counting fish inside.
      Refine boundaries to maximize mackerel gain versus sardine cost.
    body: |
      # Bounding Box Optimization Guide
      
      ## Core Idea
      Use tight axis-aligned bounding boxes around mackerel clusters. Small boxes capture dense mackerel regions while avoiding sardine penalties.
      
      ## Step-by-Step Method
      
      ### Step 1: Input Setup
      - Read N=5000 (always fixed)
      - Store mackerel coordinates in a vector (indices 0 to N-1)
      - Store sardine coordinates in a separate vector (indices N to 2N-1)
      
      ### Step 2: Cluster Detection
      Scan through mackerel coordinates to find dense regions:
      - Start from first unprocessed mackerel
      - Find all mackerels within approximately 500 units in both x and y (the cluster)
      - Mark these as processed
      - Repeat until all mackerels are grouped
      
      For each cluster, compute the bounding box:
      - min_x = minimum x in cluster
      - min_y = minimum y in cluster
      - max_x = maximum x in cluster
      - max_y = maximum y in cluster
      
      ### Step 3: Box Evaluation
      For each bounding box (xmin, ymin, xmax, ymax):
      - Count mackerels inside: iterate through all mackerels, check if xmin <= x <= xmax AND ymin <= y <= ymax
      - Count sardines inside: same check for sardines
      - Compute score = mackerel_count - sardine_count
      - Track boxes with score > 0 (preferably score >= 2 for safety)
      
      ### Step 4: Boundary Refinement
      For each promising box, try refinements:
      - Expand: try (xmin-10, ymin-10, xmax+10, ymax+10), then (xmin-20, ymin-20, xmax+20, ymax+20)
      - Shrink: try (xmin+10, ymin+10, xmax-10, ymax-10) if it improves score (tighter box)
      - Shift: try moving entire box by (+10,+10), (+20,+20), etc.
      - Use the refinement with highest score
      
      ### Step 5: Combination Strategy
      - Take top 5-10 individual boxes
      - Check if two adjacent boxes can be merged (share a common boundary)
      - If merged, new box perimeter should still be <= 400000
      - Recalculate score for combined box
      
      ### Step 6: Polygon Output
      - For single box: output 4 vertices: (xmin,ymin), (xmax,ymin), (xmax,maxy), (xmin,maxy)
      - For combined boxes: trace outer boundary (more complex, ensure no self-intersection)
      - Ensure vertex count is between 4 and 1000
      - All coordinates must be integers in [0, 100000]
      
      ### Step 7: Validation
      - Check perimeter <= 400000
      - Check all coords in valid range
      - Output vertex count followed by coordinates
      
      ## Key Success Factors
      - Tight boxes are better than large boxes (avoid sardine dilution)
      - Multiple small boxes can beat one large box
      - Focus on regions with high mackerel density
      - Always check sardine cost before accepting a box

new_middlewares:
  - name: box_refinement_reminder
    hook: before_model
    description: Remind solver to use tight bounding boxes and refine boundaries
    implementation_py: |
      def before_model(hook_input):
          return "Focus on tight bounding boxes around mackerel clusters. Evaluate by counting fish inside. Refine boundaries by plus or minus 10, 20, 30. Avoid sardine-dense regions. Target score greater than zero per box."
