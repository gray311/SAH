type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based bounding box optimization:


  1. Parse input: read N, mackerels, sardines

  2. Detect mackerel clusters (group nearby points)

  3. For each cluster, compute bounding box

  4. Evaluate each box: count mackerels and sardines inside, compute score

  5. Refine box boundaries: try expand/shrink by +/-10,20,30 units

  6. Combine top boxes if beneficial and within perimeter constraint

  7. Output polygon vertices (4-1000 vertices, integer coords)


  Key: Tight bounding boxes around clusters avoid sardine penalties.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
