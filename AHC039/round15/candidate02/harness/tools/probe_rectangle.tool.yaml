type: tool
name: probe_rectangle
description: 'Quickly evaluate a rectangular region for mackerel and sardine counts.

  Returns approximate counts and score. Use this to rank bounding box candidates before full evaluation.'
input_schema:
  type: object
  properties:
    xmin:
      type: integer
    ymin:
      type: integer
    xmax:
      type: integer
    ymax:
      type: integer
