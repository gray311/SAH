type: tool
name: count_fish_in_polygon
description: 'Count mackerels and sardines inside a given axis-aligned polygon using KD-tree spatial index.

  Returns exact counts (a, b) and score = a - b + 1. Call this before probe_solution for accurate ranking.'
input_schema:
  type: object
  properties:
    polygon:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
    use_kd_tree:
      type: boolean
      default: true
