type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing local search: start from seed/rectangle, perturb
  vertices ±1..50, rank with probe_solution (up to 30), evaluate top 3, 10 restarts.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
