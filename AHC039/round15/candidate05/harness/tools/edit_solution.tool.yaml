type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing coordinate-space search:

  1. Parse fish coordinates directly (no grid)

  2. Start with minimal 4-vertex rectangle around a mackerel

  3. Expand edges outward in 4 directions, checking score after each expansion

  4. Hill climb: keep expansions that improve M - S + 1

  5. Run 5-8 trials with different seed mackerels

  6. Output best polygon (4-1000 vertices, valid format)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
