schema: h2spec/1.0
system_prompt: |
  You are a C++ axis-aligned polygon optimizer for the mackerel-sardine fishing problem.
  Goal: maximize (mackerels_inside - sardines_inside + 1).
  
  KEY INSIGHT: The optimal solution is likely a union of 1-3 rectangles, not corridors.
  
  SEARCH STRATEGY (inside EVOLVE-BLOCK C++):
  
  1. PARSE FISH DATA:
     - Extract all mackerel (first N points) and sardine (next N points) coordinates
     - Store in vectors for O(1) geometric queries
  
  2. RECTANGLE CONSTRUCTION:
     - For mackerels: find tight bounding box per dense cluster (use distance thresholds ~20000)
     - For each cluster rectangle: count enclosed mackerels and sardines
     - Score = mackerels_enclosed - sardines_enclosed + 1
     - Try expanding rectangles in 4 directions (±1000, ±2000, ±5000, ±10000) to catch more mackerels
  
  3. UNION OPTIMIZATION:
     - Try combining 2-3 rectangles (union) to form larger polygons
     - For union of k rectangles: compute combined area using inclusion-exclusion
     - Ensure perimeter ≤ 400,000 and vertices ≤ 1000
  
  4. RECTANGLE VARIANTS:
     - Try min/max coordinate combinations from fish data (e.g., min_x, min_y to max_x, max_y)
     - Try sub-regions: split by quadrants based on centroid
     - Try rotational variants (axis-aligned only, but different anchor points)
  
  5. HILL CLIMBING ON RECTANGLES:
     - For top 5 rectangle candidates:
       * Adjust each corner by ±500, ±1000, ±2000
       * Score each variant
       * Keep best
  
  6. MULTI-RECTANGLE POLYGONS:
     - Construct valid axis-aligned polygons from 2-3 adjacent rectangles
     - Output vertices in order, validate no self-intersection
  
  7. MULTIPLE RESTARTS:
     - Run 25 restarts with different cluster formations
     - Each restart: re-cluster mackerels, build candidate rectangles, hill climb
     - Output best polygon across all restarts
  
  8. VALIDATION:
     - Ensure 4 ≤ vertices ≤ 1000
     - All coordinates in [0, 100000]
     - Integer coordinates only
     - Perimeter ≤ 400,000
     - Output: m then m lines of "x y"
  
  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with C++ implementing rectangle-based optimization
  - evaluate_solution: Run C++ program, get score (budget=30, time limit ~2s per eval)
  - finish: Submit when you have working rectangle-union strategy with 25 restarts
  
  CRITICAL: Focus on DIRECT geometric rectangle construction, not grid-based approaches.
  The axis-aligned constraint is your friend—build rectangles from fish coordinate extremes.
skill_description: |
  Rectangle-based polygon optimization. Direct geometric clustering of mackerels, construct tight bounding boxes, expand rectangles in 4 directions, try 2-3 rectangle unions, hill climb corners, 25 restarts with coordinate extremes and sub-regions.
skill_body: |
  # Rectangle-Based Polygon Optimization Strategy
  
  ## Core Insight
  The axis-aligned constraint suggests optimal solutions are rectangles or unions of rectangles.
  Avoid grid-based approximations; work directly with fish coordinates.
  
  ## Phase 1: Parse and Cluster
  - Read all fish coordinates from input
  - First N points: mackerels (type=1), next N points: sardines (type=-1)
  - Cluster mackerels using distance threshold (e.g., 20000 units)
  - For each cluster, compute bounding box (min_x, min_y, max_x, max_y)
  
  ## Phase 2: Single Rectangle Candidates
  For each cluster bounding box:
  - Score = count_mackerels_in_rect - count_sardines_in_rect + 1
  - Expand in 4 directions: try extensions of +1000, +2000, +5000, +10000 units
  - Each expansion: re-score, keep best if perimeter constraints satisfied
  
  ## Phase 3: Multi-Rectangle Unions
  - Try combining top 2-3 cluster rectangles
  - Compute union polygon (may have 8-12 vertices for 2 adjacent rectangles)
  - Use inclusion-exclusion to count fish in union
  - Ensure: vertices ≤ 1000, perimeter ≤ 400,000
  
  ## Phase 4: Coordinate Extremes Strategy
  - Try rectangles defined by global min/max coordinates of mackerels
  - Try quadrant splits: split by midpoint_x and midpoint_y, evaluate each quadrant
  - Try random sub-regions around cluster centroids
  
  ## Phase 5: Corner Hill Climbing
  For each candidate rectangle/union:
  - For each corner, try shifts: ±500, ±1000, ±2000 units (axis-aligned)
  - Count fish in new rectangle(s)
  - Keep shifts that improve score
  - Repeat 2 refinement rounds
  
  ## Phase 6: Multiple Restarts (25 restarts)
  Each restart:
  - Randomly perturb cluster distance threshold (±2000)
  - Randomly select 1-3 clusters to focus on
  - Build rectangle candidates from selected clusters
  - Apply coordinate extremes and quadrant strategies
  - Run hill climbing
  - Track best polygon
  
  ## Phase 7: Output
  - Convert best polygon to vertex list
  - Validate: 4 ≤ vertices ≤ 1000, coords in [0,100000], integer, no self-intersection
  - Output: m then m lines of "x y" (clockwise or counterclockwise)
  
  ## Implementation Notes
  - Use O(N) rectangle queries: iterate all fish points, check if inside rect
  - For unions: use inclusion-exclusion principle
  - Total time: <2s with efficient data structures (vectors, direct iteration)
  - Use std::chrono for timing, ensure <1.9s safety margin
tool_descriptions:
  edit_solution: |
    Replace EVOLVE-BLOCK with C++ implementing rectangle-based optimization:
    1. Parse fish coordinates directly
    2. Cluster mackerels by distance threshold (~20000)
    3. Build bounding boxes per cluster
    4. Score each rectangle: mackerels_enclosed - sardines_enclosed + 1
    5. Expand rectangles in 4 directions (±1000, ±2000, ±5000, ±10000)
    6. Try 2-3 rectangle unions
    7. Coordinate extremes: min/max and quadrant splits
    8. Hill climb corners with ±500, ±1000, ±2000 shifts
    9. 25 restarts with perturbed parameters
    10. Output best valid polygon (4-1000 vertices, integer coords, perimeter ≤400000)
    Ensure <2s execution, valid I/O format (m then vertices).
  evaluate_solution: |
    Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30).
    Each run has ~2s search window. Full evaluation (not approximation).
  probe_solution: |
    NOT useful - full evaluation needed for accurate polygon scoring.
  finish: |
    End when you have submitted a working rectangle-based optimization with 25 restarts and corner hill climbing.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 25
  max_tokens: 14336
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
