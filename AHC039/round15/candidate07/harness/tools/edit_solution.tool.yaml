type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct fish-coordinate bounding box expansion:
  1. Parse fish coordinates directly 2. Generate 5-10 candidates with different seeds and expansion strategies
  3. For each, expand bounding box of mackerels outward 4. Precise score = M - S + 1 5. Output best valid
  polygon with 4-1000 vertices, perimeter <= 400000'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
