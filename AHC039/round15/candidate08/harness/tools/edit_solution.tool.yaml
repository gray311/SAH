type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing seed-based local search:

  1. Parse fish coordinates, build hash sets

  2. Start with seed or simple bounding-box rectangle

  3. For each candidate, compute bounding-box score (fast)

  4. Local search: perturb vertices by ±5, ±10, ±15, keep improvements

  5. Try multiple shape families: rect, L-shape, U-shape, clusters

  6. Output best valid polygon (<2.0s)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
