type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle-based search: 1. Generate random rectangles
  in [0,100000]x[0,100000] 2. Refine each rectangle with local vertex perturbations (±5, ±10, ±15) 3.
  Try expanding to L-shapes or multi-lobed polygons 4. Hill climb with iterative improvement 5. Run 10-15
  restarts, output best valid polygon. Ensure <2.0s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
