type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing KD-tree based search: 1. Build KD-tree on fish
  positions 2. Implement query_rectangle using recursive traversal 3. Generate 8 seeds from mackerel clusters
  4. Perform vertex-level hill climbing (±1..±5 shifts, 50 iterations) 5. Output best valid polygon (4-1000
  vertices, perimeter<=400000, coords in [0,100000])'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
