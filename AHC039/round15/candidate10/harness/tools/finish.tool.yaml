type: tool
name: finish
description: End when you have submitted a working KD-tree based solution with vertex-level hill climbing
  and 5-8 restarts.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
