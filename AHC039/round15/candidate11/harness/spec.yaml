schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  CRITICAL: The seed is stuck at ~2.48. The previous grid-based approach (500-unit cells) is too coarse and fails to capture local density variations.
  
  NEW STRATEGY - Multi-Strategy Geometric Search with Fine-Grained Analysis:
  
  PHASE 1 - Direct Coordinate Analysis:
    - Parse fish coordinates directly from input (no coarse grid binning)
    - Build spatial index (hash map) for O(1) fish counting in rectangles
    - Compute 2D density: for each 1000x1000 cell, count mackerels vs sardines
  
  PHASE 2 - Multi-Construction Pipeline (5+ strategies per evaluation, <2.0s total):
    
    Strategy A - Cluster Bounding Boxes:
      * Group mackerels by clustering (points within 8000 units form a cluster)
      * For each cluster, compute bounding box and expand by 300-600 units
      * Create rectangle; estimate score using spatial index
      * Generate 2-3 such rectangles from distinct clusters
  
    Strategy B - Multi-Rectangle Union:
      * Pick 5-8 top mackerel coordinates (by local density)
      * Create separate 1200x1200 or 1800x1800 rectangles around each
      * Union them (output all vertices of all rectangles)
      * This creates multi-lobed polygon
  
    Strategy C - Directional Ridge Following:
      * Sort mackerels by x, find runs of 60+ consecutive within y-tolerance 4000
      * For each run, build long rectangle following the x-projection
      * Repeat for y-coordinate runs
      * Combine longest 2-3 ridges
  
    Strategy D - Dense Region Expansion:
      * Find regions with mackerel-to-sardine ratio > 1.5 in 1000x1000 cells
      * From each such region, expand in all 4 directions until ratio drops below 1.0
      * Form rectangle from expansion bounds
  
    Strategy E - Randomized Grid Exploration:
      * Generate 5 random points, for each try rectangle sizes: 800x800, 1200x1200, 1600x1600
      * Pick best rectangle by estimated score (area * density - estimated sardines)
  
  PHASE 3 - Aggressive Local Optimization:
    - For top 3 candidate polygons from above:
      * Try edge shifts of ±150, ±300, ±450, ±600 units (larger than previous ±25)
      * Use spatial index for fast score estimates
      * Keep best shifts per edge (up to 5 iterations)
  
  PHASE 4 - Validation and Output:
    - Ensure: 4 <= vertices <= 1000, perimeter <= 400,000, coords in [0,100000]
    - No self-intersection (use simple edge-crossing check)
    - Output single best polygon (or last one tried if tied)
  
  Tools:
    - edit_solution: Replace EVOLVE-BLOCK with complete C++ implementing multi-strategy search
    - evaluate_solution: Run C++ program, get score
    - probe_solution: NOT useful - need full evaluation for accurate scoring
    - finish: Submit when you have 5+ construction strategies with aggressive local search

skill_description: |
  Multi-strategy geometric search: direct coordinate analysis, cluster bounding boxes, 
  multi-rectangle unions, ridge following, dense region expansion, randomized exploration. 
  Aggressive local search with ±150..600 shifts. 5+ construction strategies per eval.
skill_body: |
  # Multi-Strategy Polygon Construction
  
  ## Core Insight
  
  The previous coarse grid (500-unit cells) failed to capture local density variations.
  Use direct coordinate analysis with 1000-unit cells and multiple construction strategies.
  
  ## Phase 1: Spatial Index Setup
  
  - Parse all fish coordinates into arrays
  - Build hash map: (x, y) -> fish type for O(1) lookups
  - Build 1000x1000 grid cells, each storing (mackerel_count, sardine_count)
  
  ## Phase 2: Five Construction Strategies
  
  ### Strategy A: Cluster Bounding Boxes
  - Cluster mackerels: points within 8000 units distance form same cluster
  - Use union-find or simple connected component
  - For each cluster: compute bbox, expand 300-600 units in all directions
  - Score = spatial_query(rect) - cost
  
  ### Strategy B: Multi-Rectangle Union  
  - Find 5-8 top mackerel locations by local density (count within 2000x2000)
  - Around each: create 1200x1200 or 1800x1800 rectangle
  - Output all vertices of all rectangles as single polygon
  
  ### Strategy C: Ridge Following
  - Sort mackerels by x-coordinate
  - Find runs: 60+ points where y differs by < 4000 between consecutive
  - Build long horizontal rectangle along run
  - Repeat for y-sorted, find vertical runs
  - Combine top 2-3 ridges
  
  ### Strategy D: Dense Region Expansion
  - Scan 1000x1000 grid cells
  - If (mackerels / max(sardines+1, 1)) > 1.5: expand
  - Expand 4-directionally while ratio > 1.0
  - Form bounding box rectangle
  
  ### Strategy E: Randomized Grid
  - Pick 5 random (x,y) in [0,100000]
  - For each: try rectangles 800x800, 1200x1200, 1600x1600 centered there
  - Score by density estimate, pick best
  
  ## Phase 3: Aggressive Local Search
  
  For each of top 3 candidate polygons:
  - Initialize best_poly = candidate
  - For iteration 1 to 4:
    * For each edge (p1, p2):
      - Try shifts of p1, p2 by ±150, ±300, ±450, ±600 in x and y
      - Estimate new score using spatial queries
      - Track best shift per edge
    * Apply best shifts to get refined polygon
  
  ## Phase 4: Validation
  
  - Check vertex count: 4 to 1000
  - Check perimeter: <= 400,000
  - Check coords: all in [0, 100000]
  - Check self-intersection: no crossing edges
  - Output best polygon (or last valid one)
  
  ## Time Budget
  
  Total per evaluation < 2.0 seconds. Strategies parallelizable.
  Use fast spatial queries (O(1) per cell with precomputed grids).
tool_descriptions:
  edit_solution: |
    Replace EVOLVE-BLOCK with C++ implementing:
    1. Direct coordinate parsing and spatial index (hash map + 1000-unit grid)
    2. Five construction strategies: cluster bboxes, multi-rect union, ridge following, 
       dense expansion, randomized grid
    3. Aggressive local search with ±150..600 shifts, 3-4 rounds
    4. Validation: vertex count, perimeter, coords, self-intersection
    5. Output best polygon
    
    Must be <2.0s, valid C++, correct I/O format (m then vertices).
  evaluate_solution: |
    Run C++ program. Returns score (mackerels-sardines+1), validity, remaining evals (budget=30).
    Each run has ~2.0s search window.
  probe_solution: |
    NOT useful - full evaluation needed for accurate scoring. The spatial index 
    heuristic cannot substitute for actual fish counting.
  finish: |
    Submit when you have implemented multi-strategy search with 5+ construction methods 
    and aggressive local optimization.
sampling:
  temperature: 0.9
  top_p: 0.85
  top_k: 15
  max_tokens: 14336
agent:
  max_iterations: 45
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 12000
