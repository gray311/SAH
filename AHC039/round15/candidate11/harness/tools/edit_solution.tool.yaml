type: tool
name: edit_solution
description: "Replace EVOLVE-BLOCK with C++ implementing:\n1. Direct coordinate parsing and spatial index\
  \ (hash map + 1000-unit grid)\n2. Five construction strategies: cluster bboxes, multi-rect union, ridge\
  \ following, \n   dense expansion, randomized grid\n3. Aggressive local search with ±150..600 shifts,\
  \ 3-4 rounds\n4. Validation: vertex count, perimeter, coords, self-intersection\n5. Output best polygon\n\
  \nMust be <2.0s, valid C++, correct I/O format (m then vertices)."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
