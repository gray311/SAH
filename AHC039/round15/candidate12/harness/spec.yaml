schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture (eft__ahc_simpletes__ahc039).
  Goal: maximize (mackerels_inside - sardines_inside + 1).
  
  METHOD: Direct point clustering + greedy polygon growth + local search.
  
  STEP 1 - PARSING:
  - Read 2N=10000 points: first N are mackerels (type=1), next N are sardines (type=-1)
  - Store in vectors for O(1) access
  
  STEP 2 - SPATIAL GRID FOR LOOKUP:
  - Build 1000x1000 grid (cell_size=100) over [0,100000]²
  - For each cell: count mackerels (M), sardines (S)
  - Compute cell_score = M - S
  
  STEP 3 - FIND SEED POINTS:
  - Identify top 8 cells with highest positive cell_score
  - Use these as polygon seed locations
  
  STEP 4 - GREEDY POLYGON CONSTRUCTION:
  - For each seed cell, create a minimal bounding box around all fish in nearby cells
  - Start with 4-vertex rectangle around seed cell
  - Try expanding in 4 cardinal directions (N,S,E,W) by adding vertices:
    * New vertex = (current_edge_endpoint_x, new_y) or (new_x, current_edge_endpoint_y)
    * For each expansion candidate, compute exact score (count fish in polygon)
    * Only expand if score increases AND perimeter <= 400000 AND vertices <= 1000
  - Combine expansions into valid axis-aligned polygon
  
  STEP 5 - EXACT SCORING:
  - Polygon score = count_mackerels_in_polygon - count_sardines_in_polygon + 1
  - Point-in-convex-polygon: for axis-aligned, check if point is within bounding box
  - For complex polygons: use ray casting or break into rectangles
  
  STEP 6 - LOCAL SEARCH (Hill Climbing):
  - For best polygon found, perform 2-3 rounds of local optimization:
    * For each edge, try small shifts: ±3, ±5, ±8, ±12 units
    * Compute exact score for each shifted polygon (rectangle intersection with fish)
    * Keep shifts that improve score
    * Repeat until no improvement
  
  STEP 7 - OUTPUT:
  - Output best polygon from all seeds and perturbations
  - Format: m (vertex count)\nx0 y0\nx1 y1\n...\n
  - Ensure: 4 <= vertices <= 1000, distinct coordinates, integer coords [0,100000]
  
  TIME BUDGET: 2.0s per evaluation. Prioritize speed: use arrays not vectors, avoid dynamic allocations.
skill_description: |
  Direct point clustering + greedy polygon growth. Build 1000x1000 grid for fast lookup, find mackerel-dense seeds, grow polygons by expanding edges while improving (M-S) score, refine with local edge perturbations ±3..8.
skill_body: |
  # Direct Clustering and Greedy Growth Method
  
  ## Phase 1: Parsing and Grid Setup
  - Read input: N=5000 mackerels, then N=5000 sardines
  - Store in std::array or std::vector<Point> for O(1) access
  - Build 1000x1000 spatial grid (cell_size=100)
  - For each fish, increment M or S count in corresponding cell
  - Compute cell_score = M - S for each cell
  
  ## Phase 2: Seed Selection
  - Find top 8 cells with positive cell_score
  - These are our starting locations for polygon construction
  
  ## Phase 3: Greedy Polygon Growth
  For each seed cell:
  - Start with minimal bounding box around fish in that cell (4 vertices)
  - Compute exact score for this initial polygon
  - Try expanding each of the 4 edges in outward direction:
    * For horizontal edge at y=Y from x=L to x=R:
      - Try new edge at y=Y+Δ for Δ in {+3,+5,+8}
      - Compute score of expanded polygon
      - Keep if score improves
    * Similarly for vertical edges
  - Continue expanding until: no improvement, perimeter > 400000, vertices > 1000
  - Track best polygon from this seed
  
  ## Phase 4: Exact Scoring
  - To count fish in polygon: iterate all 10000 fish points
  - For axis-aligned polygon: point is inside if it's within the boundary
  - Use simple point-in-polygon test (ray casting or sequential edge checks)
  
  ## Phase 5: Local Hill Climbing
  - For the best polygon from Phase 3:
    * For each vertex, try perturbing x or y by ±3, ±5, ±8
    * Ensure new coordinates in [0,100000]
    * Compute score for perturbed polygon
    * Apply improvement
    * Repeat 2 rounds
  
  ## Phase 6: Output Best
  - Output vertex count followed by vertices
  - Ensure valid format and constraints
  
  ## Performance Notes
  - Use flat arrays, avoid dynamic allocation
  - Pre-allocate buffers for grid, fish storage
  - Time-based early exit: if time < 0.25s, output current best
  - Target <1.8s per evaluation for safety margin
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing: (1) parse 10000 fish points, (2) build 1000x1000 grid for fast lookup, (3) find top 8 mackerel-dense seed cells, (4) greedily grow axis-aligned polygons by expanding edges while improving (M-S) score, (5) local hill climbing with ±3,±5,±8 edge perturbations, (6) output best valid polygon. Ensure <2.0s execution.'
  evaluate_solution: Run C++ program, returns score (mackerels-sardines+1), validity, and evals remaining (budget=30).
  probe_solution: Approximate evaluation on subsampled data; useful for rapid ranking during search.
  finish: Submit when you have a working solution with direct clustering and greedy growth.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 15
  max_tokens: 8192
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 10000
new_tools: []
new_skills: []
new_middlewares: []
