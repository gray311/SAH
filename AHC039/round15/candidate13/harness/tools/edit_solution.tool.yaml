type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ brute-force rectangle search: 1. Read exact fish coordinates,
  build position maps 2. Enumerate candidate rectangles from coordinate pairs 3. Score each by counting
  mackerels - sardines inside 4. Expand best rectangles in 4 directions 5. 5-8 restarts, output best valid
  polygon Ensure <1.8s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
