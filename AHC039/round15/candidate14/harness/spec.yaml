schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  CRITICAL STRATEGY: Build axis-aligned rectangles directly from mackerel clusters, avoiding sardine-dense regions.
  
  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):
  
  1. SPATIAL INDEXING:
     - Use a 500x500 sparse grid (cell_size=200) over [0,100000]x[0,100000]
     - For each cell, count mackerels (M) and sardines (S)
     - Compute cell score = M - S, and track extreme fish positions
  
  2. CLUSTER DETECTION:
     - Find all cells with M > 0
     - For each such cell, create a candidate rectangle: expand 200 units in each direction (bounded by [0,100000])
     - This gives roughly 400x400 candidate rectangles from each mackerel
  
  3. EVALUATION-ORDERING:
     - Sort candidates by: (M_upper_bound - S_upper_bound) / estimated_score_ratio
     - M_upper_bound: count of mackerels likely in expanded rectangle (use grid + margin buffer)
     - S_upper_bound: count of sardines likely in expanded rectangle
     - Pick top 50 candidates for full evaluation
  
  4. RECTANGLE CONSTRUCTION:
     - Each candidate is a rectangle: (min_x, min_y) to (max_x, max_y)
     - Ensure: 4 vertices, perimeter <= 400,000, coords in [0,100000], no self-intersection (trivial for rectangles)
  
  5. LOCAL SEARCH ON RECTANGLES:
     - For each candidate rectangle, try dimension perturbations:
       * Expand/contract each side by ±50, ±100, ±150 units
       * Keep changes that improve estimated M-S score
       * Max 3 refinement rounds
  
  6. MULTIPLE RESTARTS:
     - Run 25 restarts with different random seeds
     - Each restart: pick 10-15 random mackerel cells, build rectangle candidates, evaluate top 50, refine
     - Track best polygon across all restarts
  
  7. VALIDATION:
     - Output valid rectangle (4 vertices in order)
     - Use simple bounds check (no KVH needed for rectangles)
  
  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ implementing rectangle-based cluster optimization
  - evaluate_solution: Run C++ program, get score (mackerels-sardines+1), validity, and remaining evaluations (budget=30)
  - probe_solution: NOT useful - full evaluation needed for accurate rectangle scoring
  - finish: End when you've encoded working rectangle-based optimization with 25+ restarts
  
  Preserve EVOLVE-BLOCK markers, exact I/O format (m then vertices), and ensure <2.0s execution.
  
  KEY DIFFERENCE from seed: Direct rectangle construction from mackerel positions with spatial-indexed pre-filtering, avoiding inefficient corridor-based approaches.
skill_description: |
  Rectangle-based cluster optimization. Build 500x500 sparse grid, find mackerel-dense cells, create bounding box candidates expanded 200 units each way, evaluate top 50, local dimension search with ±50..150 perturbations, 25 restarts.
skill_body: |
  # Rectangle-Based Cluster Optimization Strategy
  
  ## Phase 1: Sparse Grid Construction
  - Use 500x500 grid with cell_size=200 (covers 0-100000)
  - For each cell, count mackerels (M) and sardines (S) from input
  - Compute cell score = M - S
  - Store all mackerel positions for rectangle construction
  
  ## Phase 2: Candidate Rectangle Generation
  For each mackerel cell with M > 0:
  - Create a base rectangle covering that cell
  - Expand each side by 200 units (bounded by [0,100000])
  - Estimate: M_count using grid cells inside rectangle, S_count similarly
  - Compute heuristic score = (estimated_M - estimated_S) / perimeter
  - Add to candidate pool
  
  ## Phase 3: Candidate Selection
  - Sort candidates by heuristic score (descending)
  - Pick top 50 candidates for full evaluation
  
  ## Phase 4: Full Evaluation and Refinement
  For each of top 50 candidates:
  - Count actual mackerels and sardines inside rectangle (O(N) scan)
  - Compute actual score = M - S + 1
  - Try dimension perturbations: expand/contract each side by ±50, ±100, ±150
    * Keep perturbation that improves actual score
    * Maintain bounds [0,100000] and perimeter <= 400,000
  - Repeat refinement up to 3 rounds
  
  ## Phase 5: Multiple Restarts
  - Run 25 restarts with different random seeds
  - Each restart: 
    * Pick 10-15 random mackerel positions
    * Build rectangle candidates from each (200-unit expansion)
    * Evaluate top 50 candidates with refinement
  - Track best rectangle across all restarts
  
  ## Phase 6: Output
  - Output best rectangle as 4 vertices in order (e.g., bottom-left, bottom-right, top-right, top-left)
  - Ensure valid format: 4 <= vertices <= 1000, integer coords, axis-aligned
  
  ## C++ Implementation Notes
  - Use fixed-size 500x500 grid for O(1) cell access
  - O(N) scan for rectangle evaluation (N=10000 fish)
  - Total time per evaluation: < 2.0s with efficient operations
  - Use std::random_device for seed generation
  - Rectangles are self-validating (no intersection checks needed)
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing rectangle-based cluster optimization:

    1. Build 500x500 sparse grid, count M/S per cell, compute M-S score

    2. For each mackerel cell, create rectangle candidate (200-unit expansion each way)

    3. Sort by heuristic (estimated_M - estimated_S) / perimeter, pick top 50

    4. Evaluate each: count actual fish inside, try dimension perturbations ±50..150

    5. Refinement loop up to 3 rounds, keep improvements

    6. 25 restarts, output best rectangle (4 vertices)

    Ensure <2.0s execution, valid output format.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - full evaluation needed for accurate rectangle scoring.
  finish: End when you have 25+ restarts with rectangle-based optimization and dimension perturbation refinement.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
  max_tokens: 14336
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 15000
new_tools: []
new_skills: []
new_middlewares:
- name: rectangle_search_reminder
  hook: before_model
  description: generated middleware rectangle_search_reminder
  implementation_py: "def before_model(hook_input):\n    return \"Use rectangle-based cluster optimization: from mackerel positions build 200-unit expansion rectangles, evaluate top 50 with actual scoring, try dimension perturbations ±50..150, run 25 restarts.\""
