type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle-based cluster optimization:

  1. Build 500x500 sparse grid, count M/S per cell, compute M-S score

  2. For each mackerel cell, create rectangle candidate (200-unit expansion each way)

  3. Sort by heuristic (estimated_M - estimated_S) / perimeter, pick top 50

  4. Evaluate each: count actual fish inside, try dimension perturbations ±50..150

  5. Refinement loop up to 3 rounds, keep improvements

  6. 25 restarts, output best rectangle (4 vertices)

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
