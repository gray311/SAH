schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).

  CRITICAL STRATEGY: Direct geometric local search with spatial indexing.

  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):

  1. SPATIAL INDEXING:
     - Build 2D grid over [0,100000]x[0,100000] but with FINE cells (50x50, cell_size=2000)
     - For each cell, count mackerels (M) and sardines (S)
     - Also maintain prefix sums for O(1) rectangle queries

  2. LOCAL SEARCH (key innovation over grid corridors):
     - Start from a small initial polygon (e.g., minimal bounding box around dense mackerel cluster)
     - For 200-300 iterations:
       * Try inserting a vertex at random grid cell boundary
       * Try deleting a vertex (if >4 vertices)
       * Try shifting an endpoint by 1-50 units in cardinal directions
       * Use prefix sum query to compute delta score in O(1)
       * Keep mutation if score improves

  3. VERTEX OPERATIONS:
     - Insert: add vertex at (rand_x, rand_y) where rand values are multiples of cell_size
     - Delete: remove random vertex
     - Shift: move endpoint by ±[1,5,10,20,40] units in x or y direction

  4. MULTI-PHASE REFINEMENT:
     - Phase 1: Coarse search (±1-50 shifts, 200 iterations)
     - Phase 2: Fine search (±1-10 shifts, 100 iterations)
     - Phase 3: Vertex count optimization (try 4, 5, 6, 8, 10, 12, 16 vertices)

  5. SINGLE HIGH-QUALITY POLYGON:
     - Instead of 15-20 restarts, do 1 focused optimization run
     - Invest time in thorough local search rather than many shallow attempts
     - Output the best polygon found

  6. VALIDATION:
     - Ensure 4 <= vertices <= 1000
     - Ensure perimeter <= 400,000
     - Ensure all coords in [0,100000]
     - Use simple self-intersection check (no two non-adjacent edges share points)

  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with C++ implementing direct geometric local search
  - evaluate_solution: Run C++ program, get score
  - probe_solution: NOT useful - full evaluation needed
  - finish: Submit when you have encoded working local search

  KEY DIFFERENCE from seed: Direct vertex manipulation with fine-grained shifts, spatial prefix sums for O(1) scoring, single focused optimization instead of many restarts.
skill_description: |
  Direct geometric local search. Build fine grid (50x50, cell_size=2000), use prefix sums for O(1) rectangle queries, perform iterative vertex insertion/deletion/shift with coarse then fine phases, optimize vertex count, single focused optimization.
skill_body: |
  # Direct Geometric Local Search Strategy

  ## Phase 1: Fine Grid Construction
  - Use 50x50 grid over [0,100000]x[0,100000] (cell_size=2000)
  - For each cell, count mackerels and sardines
  - Compute 2D prefix sums for O(1) rectangle score queries

  ## Phase 2: Initial Polygon
  - Find dense mackerel cluster (cell with highest M, or highest M-S)
  - Create minimal axis-aligned bounding box around it (4 vertices)

  ## Phase 3: Coarse Local Search (200 iterations)
  For each iteration:
  - Try vertex insertion: pick random grid boundary point, insert vertex, compute delta via prefix sum
  - Try vertex deletion: if >4 vertices, remove random vertex, compute delta
  - Try vertex shift: pick random endpoint, shift by ±[1,5,10,20,40] in x or y, compute delta
  - Keep best mutation if score improves

  ## Phase 4: Fine Local Search (100 iterations)
  - Same operations but with finer shifts: ±[1,2,3,4,5] units

  ## Phase 5: Vertex Count Optimization
  - Try polygons with 4, 5, 6, 8, 10, 12, 16 vertices
  - For each count, run local search from random seed
  - Keep best result

  ## Phase 6: Final Validation
  - Check perimeter <= 400,000
  - Check coords in [0,100000]
  - Check 4 <= vertices <= 1000
  - Check no self-intersection (non-adjacent edges don't share points)

  ## Key Success Factors
  - Fine grid (cell_size=2000) for accurate fish counting
  - Prefix sums for O(1) rectangle queries
  - Iterative local search beats grid-based corridor expansion
  - Single focused optimization invests more time per variant
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing direct geometric local search:

    1. Build 50x50 fine grid with prefix sums for O(1) rectangle queries

    2. Create initial 4-vertex polygon around dense mackerel cluster

    3. Coarse local search: insert/delete/shift vertices, shifts ±1,5,10,20,40, 200 iterations

    4. Fine local search: same ops, shifts ±1,2,3,4,5, 100 iterations

    5. Vertex count optimization: try 4,5,6,8,10,12,16 vertices

    6. Validate: perimeter, bounds, self-intersection

    Ensure <2.0s execution, valid output format.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - full evaluation needed for accurate scoring.
  finish: End when you have encoded a working direct geometric local search with fine grid, prefix sums, and iterative refinement.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
