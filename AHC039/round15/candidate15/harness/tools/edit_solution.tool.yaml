type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct geometric local search:

  1. Build 50x50 fine grid with prefix sums for O(1) rectangle queries

  2. Create initial 4-vertex polygon around dense mackerel cluster

  3. Coarse local search: insert/delete/shift vertices, shifts ±1,5,10,20,40, 200 iterations

  4. Fine local search: same ops, shifts ±1,2,3,4,5, 100 iterations

  5. Vertex count optimization: try 4,5,6,8,10,12,16 vertices

  6. Validate: perimeter, bounds, self-intersection

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
