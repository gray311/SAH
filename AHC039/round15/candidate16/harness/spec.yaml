schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  GEOMETRIC STRATEGY (coordinate-based, not grid-based):
  
  1. PARSE FISH COORDINATES:
     - Read all mackerel and sardine coordinates from input
     - Store in sorted arrays for fast query
  
  2. BUILD MACKEREL CLUSTERS:
     - Find mackerels within 5000 units of each other
     - Create tight bounding boxes around each cluster
  
  3. REFINED RECTANGLE SEARCH:
     - For each cluster bounding box, try expanding coordinates by ±100, ±200, ±500 units
     - Count mackerels and sardines in each candidate rectangle
     - Score = mackerels - sardines + 1
  
  4. COMBINATORIAL MERGING:
     - Try merging adjacent rectangles (union of two boxes)
     - For 3-4 rectangle unions, ensure valid simple polygon
  
  5. LOCAL OPTIMIZATION:
     - For promising rectangles, try edge shifts of ±50, ±100, ±200, ±500 units
     - Accept only if score improves
  
  6. MULTIPLE RESTARTS:
     - Run 10-15 restarts with different cluster selections
     - Each restart: pick 2-3 mackerels, build bounding box, refine
  
  7. VALIDATION:
     - Output 4-1000 vertices, perimeter ≤ 400,000, coords in [0,100000]
     - For rectangles: 4 vertices; for merged shapes: compute convex hull or custom polygon

  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with this coordinate-based strategy
  - evaluate_solution: Run and get score
  - probe_solution: NOT useful for this geometric search
  - finish: Submit when you have working rectangles
skill_description: Coordinate-based rectangle merging. Parse fish coords, build mackerel clusters as bounding boxes, refine edges locally, merge adjacent boxes, 10-15 restarts.
skill_body: |
  # Coordinate-Based Rectangle Optimization
  
  ## Phase 1: Coordinate Parsing
  - Extract all mackerel (type=1) and sardine (type=-1) coordinates
  - Store in sorted vectors for efficient range queries
  
  ## Phase 2: Cluster Detection
  - For each mackerel, find neighbors within 5000 units
  - Group into connected components (clusters)
  - For each cluster, compute tight bounding box (min_x, max_x, min_y, max_y)
  
  ## Phase 3: Rectangle Refinement
  For each cluster bounding box:
  - Try 9 coordinate variations per edge:
    * Left edge: min_x - 500, -200, -100, -50, 0, +50, +100, +200, +500
    * Right edge: max_x + 500, +200, +100, +50, 0, -50, -100, -200, -500
    * (Clamp to [0, 100000])
  - For each candidate rectangle, count fish using coordinate range queries
  - Score = mackerels - sardines + 1
  
  ## Phase 4: Combinatorial Merging
  - Sort clusters by position
  - Try merging adjacent clusters (union of bounding boxes)
  - For 2-3 cluster merges, compute resulting polygon (may need convex hull)
  - Score each merged shape
  
  ## Phase 5: Local Optimization
  For promising candidates:
  - Try edge shifts: ±50, ±100, ±200, ±500 units per edge
  - For rectangles: vary each of 4 edges independently
  - For complex shapes: vary each vertex
  - Keep best shift if score improves
  
  ## Phase 6: Multiple Restarts
  - Run 10-15 restarts with different seeds
  - Each restart: randomly select 2-3 mackerels as seed points
  - Build bounding box around seeds, refine, try 2-3 neighbor merges
  
  ## Phase 7: Output
  - For rectangles: output 4 vertices
  - For merged shapes: output simplified polygon (convex hull or manual simplification)
  - Ensure: 4 <= vertices <= 1000, perimeter <= 400,000, coords in [0,100000]
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with coordinate-based rectangle optimization:
    1. Parse fish coordinates directly (no grid)
    2. Build mackerel clusters via proximity (5000 unit threshold)
    3. Create bounding boxes around clusters
    4. Refine rectangle edges with ±50, ±100, ±200, ±500 shifts
    5. Merge adjacent rectangles, compute resulting polygons
    6. Local optimization with edge shifts
    7. 10-15 restarts from random mackerel seeds
    8. Output valid axis-aligned polygon (4-1000 vertices)'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - geometric search requires full evaluation.
  finish: End when you have submitted working coordinate-based rectangle optimization.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 15
  max_tokens: 8192
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 10000
new_tools:
- name: build_rectangle_candidates
  description: 'Generate candidate rectangles from mackerel seed points. For each seed, expand in all 4 directions to find rectangle corners that maximize mackerel inclusion while minimizing sardine inclusion.'
  input_schema:
    type: object
    properties:
      seed_x:
        type: integer
      seed_y:
        type: integer
      expansion_range:
        type: integer
        default: 2000
  implementation_py: |
    def run(ctx, args):
        import math
        
        seed_x = args.get("seed_x", 0)
        seed_y = args.get("seed_y", 0)
        expansion_range = args.get("expansion_range", 2000)
        
        # Parse program to get fish coordinates
        program_text = ctx.get_program()
        mackerels = []
        sardines = []
        
        lines = program_text.split('\n')
        fish_count = 0
        for line in lines:
            line = line.strip()
            # Look for fish coordinate patterns in CPP_CODE
            import re
            matches = re.findall(r'fish\[[^\]]+\]', line)
            if not matches:
                # Try to parse structured data
                try:
                    idx = line.index('fish[')
                    data_str = line[idx+5:].split(']')[0].strip()
                    parts = data_str.split(',')
                    if len(parts) >= 2:
                        x_str, y_str = parts[0], parts[1]
                        # Extract numbers
                        x_parts = re.findall(r'-?\d+', x_str)
                        y_parts = re.findall(r'-?\d+', y_str)
                        if x_parts and y_parts:
                            x = int(x_parts[0])
                            y = int(y_parts[0])
                            # Determine type from context (mackerel first, then sardine)
                            # This is approximate; actual type needs tracking
                            fish_count += 1
                            if fish_count <= 5000:
                                mackerels.append((x, y))
                            else:
                                sardines.append((x, y))
                except:
                    continue
        
        # If we couldn't parse, use approximation around seed
        if not mackerels or not sardines:
            # Fallback: generate candidate corners around seed
            candidates = []
            for dx in [0, expansion_range, expansion_range//2, expansion_range//4]:
                for dy in [0, expansion_range, expansion_range//2, expansion_range//4]:
                    for corner_type in ['tl', 'tr', 'bl', 'br']:
                        if corner_type == 'tl':
                            c_x = seed_x - dx
                            c_y = seed_y + dy
                        elif corner_type == 'tr':
                            c_x = seed_x + dx
                            c_y = seed_y + dy
                        elif corner_type == 'bl':
                            c_x = seed_x - dx
                            c_y = seed_y - dy
                        else:  # br
                            c_x = seed_x + dx
                            c_y = seed_y - dy
                        
                        c_x = max(0, min(100000, c_x))
                        c_y = max(0, min(100000, c_y))
                        
                        if c_x != seed_x or c_y != seed_y:
                            candidates.append((c_x, c_y))
            
            return {
                "seed": (seed_x, seed_y),
                "expansion_range": expansion_range,
                "candidates": candidates[:20],
                "note": "approximate - actual fish coords not parsed"
            }
        
        # Actually compute mackerel-sardine balance around seed
        # Find bounding box that contains this mackerel
        min_x, max_x, min_y, max_y = seed_x, seed_x, seed_y, seed_y
        
        # Expand to include nearby mackerels
        for mx, my in mackerels[:1000]:  # Sample first 1000 mackerels
            if abs(mx - seed_x) < expansion_range and abs(my - seed_y) < expansion_range:
                min_x = min(min_x, mx)
                max_x = max(max_x, mx)
                min_y = min(min_y, my)
                max_y = max(max_y, my)
        
        # Clamp to valid range
        min_x = max(0, min_x)
        max_x = min(100000, max_x)
        min_y = max(0, min_y)
        max_y = min(100000, max_y)
        
        # If collapsed, expand
        if min_x == max_x and min_y == max_y:
            min_x -= expansion_range
            min_y -= expansion_range
        
        min_x = max(0, min_x)
        max_x = min(100000, max_x)
        min_y = max(0, min_y)
        max_y = min(100000, max_y)
        
        if min_x > max_x or min_y > max_y:
            min_x, max_x = 0, 100000
            min_y, max_y = 0, 100000
        
        candidates = [
            (min_x, min_y), (max_x, min_y), (min_x, max_y), (max_x, max_y)
        ]
        
        return {
            "seed": (seed_x, seed_y),
            "bounding_box": (min_x, min_y, max_x, max_y),
            "candidates": candidates,
            "mackerel_count": len(mackerels),
            "sardine_count": len(sardines)
        }
new_skills:
- name: geometric-polygon-construction
  description: Construct axis-aligned polygons from mackerel clusters using coordinate-based rectangle merging and local edge refinement.
  body: |
    # Geometric Polygon Construction for Fish Capture
    
    ## Core Approach: Coordinate-Based Rectangle Merging
    
    Instead of grid abstraction, work directly with fish coordinates to build precise axis-aligned polygons.
    
    ## Step 1: Coordinate Parsing and Storage
    
    - Parse all mackerel (type=1) and sardine (type=-1) coordinates from input
    - Store in sorted vectors: vector<Point> mackerels, vector<Point> sardines
    - Each Point has x and y integer coordinates
    
    ## Step 2: Cluster Detection via Proximity
    
    - For each mackerel, find all mackerels within distance 5000 units (L2 or L infinity)
    - Use Union-Find or BFS to group into connected components (clusters)
    - For each cluster, compute tight bounding box:
      * min_x = min(x for x in cluster)
      * max_x = max(x for x in cluster)
      * min_y = min(y for y in cluster)
      * max_y = max(y for y in cluster)
    
    ## Step 3: Bounding Box Refinement
    
    For each cluster bounding box:
    
    a. Generate coordinate variations for each edge:
       - Left edge: try min_x - 500, -200, -100, -50, 0, +50, +100, +200, +500
       - Right edge: try max_x + 500, +200, +100, +50, 0, -50, -100, -200, -500
       - Bottom edge: try min_y - 500, -200, -100, -50, 0, +50, +100, +200, +500
       - Top edge: try max_y + 500, +200, +100, +50, 0, -50, -100, -200, -500
    
    b. For each candidate rectangle (ax, ay, bx, by):
       - Count mackerels: those with ax <= x <= bx and ay <= y <= by
       - Count sardines: those with ax <= x <= bx and ay <= y <= by
       - Score = mackerels - sardines + 1
    
    c. Keep rectangle with best score that satisfies constraints
    
    ## Step 4: Combinatorial Rectangle Merging
    
    - Sort clusters by their centroid position
    - Try merging adjacent clusters (horizontal or vertical proximity)
    - For 2-cluster merge: union of bounding boxes = larger rectangle
    - For 3-4 cluster merges: compute resulting polygon
      * Option A: Convex hull of all cluster bounding boxes
      * Option B: Custom axis-aligned union (may need non-convex polygon)
    
    For each merged shape:
    - Compute vertices (for convex hull: standard algorithm; for custom: trace boundary)
    - Count perimeter length
    - Count mackerels and sardines inside
    - Score = mackerels - sardines + 1
    
    ## Step 5: Local Edge Optimization
    
    For promising candidate polygons:
    
    a. For rectangles (4 edges):
       - Vary each edge independently by +/-50, +/-100, +/-200, +/-500 units
       - For each variant, recount fish and compute score
       - Keep best variant
    
    b. For complex polygons (n vertices):
       - Vary each vertex by +/-50, +/-100 units in perpendicular direction
       - Ensure edge alignment (x-axis or y-axis)
       - Recompute score for each variant
    
    c. Repeat until no improvement (1-2 rounds)
    
    ## Step 6: Multiple Restarts
    
    - Run 10-15 restarts with different seeds
    - Each restart:
      1. Randomly select 2-3 mackerels as seed points
      2. Build bounding box around seeds and nearby mackerels
      3. Refine edges with +/-50, +/-100, +/-200, +/-500 shifts
      4. Try merging with adjacent cluster bounding boxes
      5. Local optimization
      6. Score and track best
    
    ## Step 7: Output Validation
    
    - Output format:
      m
      x0 y0
      x1 y1
      ...
      x{m-1} y{m-1}
    
    - Constraints:
      * 4 <= m <= 1000 (number of vertices)
      * Perimeter <= 400,000
      * All coordinates in [0, 100000]
      * Integer coordinates
      * No self-intersection
    
    - For rectangles: 4 vertices at (min_x, min_y), (max_x, min_y), (max_x, max_y), (min_x, max_y)
    - For merged shapes: output simplified polygon ensuring axis-aligned edges
    
    ## Key Advantages Over Grid-Based Approach
    
    1. Precision: Works with exact coordinates, not coarse 500-unit cells
    2. Efficiency: O(N log N) for sorting, O(1) for rectangle queries after setup
    3. Flexibility: Can create complex polygon shapes, not just grid-aligned corridors
    4. Better Sardine Avoidance: Precise edge positioning minimizes sardine inclusion
new_middlewares:
- name: geometry_focus
  hook: before_model
  description: remind solver to use coordinate-based geometry, not grid abstraction
  implementation_py: |
    def before_model(hook_input):
        return "Use coordinate-based rectangle merging: parse fish coords directly, build mackerel clusters as bounding boxes, refine edges with +/-50..500 shifts, merge adjacent boxes, 10-15 restarts. Avoid grid abstraction."
