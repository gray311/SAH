type: tool
name: build_rectangle_candidates
description: Generate candidate rectangles from mackerel seed points. For each seed, expand in all 4 directions
  to find rectangle corners that maximize mackerel inclusion while minimizing sardine inclusion.
input_schema:
  type: object
  properties:
    seed_x:
      type: integer
    seed_y:
      type: integer
    expansion_range:
      type: integer
      default: 2000
