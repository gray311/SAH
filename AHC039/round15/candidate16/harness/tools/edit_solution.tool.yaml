type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with coordinate-based rectangle optimization: 1. Parse fish coordinates
  directly (no grid) 2. Build mackerel clusters via proximity (5000 unit threshold) 3. Create bounding
  boxes around clusters 4. Refine rectangle edges with ±50, ±100, ±200, ±500 shifts 5. Merge adjacent
  rectangles, compute resulting polygons 6. Local optimization with edge shifts 7. 10-15 restarts from
  random mackerel seeds 8. Output valid axis-aligned polygon (4-1000 vertices)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
