type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing smart rectangle expansion: 1. Build 200x200 grid,
  count M/S per cell, compute M-S score 2. Find top 10 cells with positive score 3. From each, expand
  4-directionally while M>=0 and S < M+2 4. Form bounding box and create rectangle 5. Try edge expansions
  by 20-100 units using grid queries 6. 25 restarts, output best rectangle Ensure <1.5s execution, valid
  output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
