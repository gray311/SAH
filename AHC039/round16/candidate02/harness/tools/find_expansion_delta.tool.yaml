type: tool
name: find_expansion_delta
description: Given a rectangle and a direction, compute the score delta from expanding the edge by given
  units using grid queries. Returns (delta_score, valid_expansion).
input_schema:
  type: object
  properties:
    rect:
      type: object
      properties:
        min_x:
          type: integer
        min_y:
          type: integer
        max_x:
          type: integer
        max_y:
          type: integer
    direction:
      type: string
      enum:
      - N
      - S
      - E
      - W
    expand_amount:
      type: integer
      default: 50
