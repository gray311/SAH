type: agent
name: inner_h2_candidate
description: Candidate H2 generated by the outer loop (M_phi + H1).
max_context_tokens: 131072
system_prompt: ./prompt.md
system_prompt_type: file
tool_call_mode: structured
max_iterations: 40
retry_attempts: 2
retry_backoff_max_seconds: 30
timeout: 600
llm_config:
  model: qwen3.5-9b
  base_url: http://127.0.0.1:8800/v1
  api_key: EMPTY
  api_type: openai_chat_completion
  max_tokens: 10240
  temperature: 0.9
  top_p: 0.85
  stream: false
sandbox_config:
  type: local
  work_dir: /tmp
tools:
- name: edit_solution
  yaml_path: ./tools/edit_solution.tool.yaml
  binding: inner.harness.tools.discovery:edit_solution
- name: evaluate_solution
  yaml_path: ./tools/evaluate_solution.tool.yaml
  binding: inner.harness.tools.discovery:evaluate_solution
- name: probe_solution
  yaml_path: ./tools/probe_solution.tool.yaml
  binding: inner.harness.tools.discovery:probe_solution
- name: finish
  yaml_path: ./tools/finish.tool.yaml
  binding: inner.harness.tools.discovery:finish
- name: analyze_fish_distribution
  yaml_path: ./tools/analyze_fish_distribution.tool.yaml
  binding: inner.harness.tools.custom_runtime:custom_tool
  extra_kwargs:
    py_path: /lustre/fsw/portfolios/av/projects/av_alpamayo_reasoning/users/yingzim/runs/self_adapt_harness/outer/round725/tasks/eft__ahc_simpletes__ahc039/cand02/custom_tools/analyze_fish_distribution.py
- name: spatial_cluster_refine
  yaml_path: ./tools/spatial_cluster_refine.tool.yaml
  binding: inner.harness.tools.custom_runtime:custom_tool
  extra_kwargs:
    py_path: /lustre/fsw/portfolios/av/projects/av_alpamayo_reasoning/users/yingzim/runs/self_adapt_harness/outer/round725/tasks/eft__ahc_simpletes__ahc039/cand02/custom_tools/spatial_cluster_refine.py
stop_tools:
- finish
skills:
- ./skills/discovery-optimization
- ./skills/spatial-polygon-strategy
middlewares:
- import: middlewares.cluster_focus_reminder:GeneratedMiddleware
  params: {}
- import: middlewares.budget_reminder:BudgetReminderMiddleware
  params:
    remind_from_left: 3
- import: middlewares.stall_restart:StallRestartMiddleware
  params:
    stall_after: 8
    max_restarts: 2
- import: nexau.archs.main_sub.execution.middleware.long_tool_output:LongToolOutputMiddleware
  params:
    max_output_chars: 12000
    head_lines: 40
    tail_lines: 20
    head_chars: 4000
    tail_chars: 4000
    bypass_tool_names:
    - finish
    - LoadSkill
- import: nexau.archs.main_sub.execution.middleware.round_and_token_reminder:RoundAndTokenReminderMiddleware
  params:
    max_context_tokens: 131072
    desired_max_tokens: 10240
tracers:
- import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
