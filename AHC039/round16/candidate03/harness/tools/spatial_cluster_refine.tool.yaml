type: tool
name: spatial_cluster_refine
description: 'Refine polygon edges based on cluster geometry. Takes a starting rectangle

  and tries edge adjustments to maximize mackerel capture while minimizing sardines.

  Returns refined vertices and estimated score improvement.'
input_schema:
  type: object
  properties:
    vertices:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
    direction:
      type: string
      enum:
      - N
      - S
      - E
      - W
    shift_amount:
      type: integer
      default: 20
