type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-focused strategy:

  1. Parse fish coordinates, build 200x200 grid, count M/S per cell

  2. Find top 20 mackerel-dense cells (M>=5), mark avoidance cells (S>5 or density<0.3)

  3. For each cluster center, expand minimally in 4 directions (cap 100 cells) to build enclosing rectangle

  4. Merge nearby rectangles (distance < 150 cells)

  5. Apply minimal refinement: ±10, ±20, ±30 shifts, accept only if score improves

  6. Run 8-10 restarts with random cluster subsets

  7. Validate output and print best polygon

  Ensure <2.0s execution, valid output format (m then m vertex pairs).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
