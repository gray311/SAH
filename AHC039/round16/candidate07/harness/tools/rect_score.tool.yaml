type: tool
name: rect_score
description: 'Answer O(1) score queries for any axis-aligned rectangle using 2D prefix sums.

  Precomputed at startup from fish coordinates. Returns {score, m_count, s_count, valid}.

  Score = max(0, mackerels_inside - sardines_inside + 1).'
input_schema:
  type: object
  properties:
    min_x:
      type: integer
    min_y:
      type: integer
    max_x:
      type: integer
    max_y:
      type: integer
