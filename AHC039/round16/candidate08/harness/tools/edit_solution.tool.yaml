type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle covering:

  1. Collect and sort unique x/y coordinates from input fish

  2. Build coordinate partitioning grid and 2D prefix sum array

  3. Search over all rectangle boundaries for max (M-S+1)

  4. Refine best rectangle boundaries by ±1..5 units

  5. Run 5-8 restarts with perturbations

  6. Output best rectangle as 4-vertex polygon

  Ensure <2.0s execution, valid format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
