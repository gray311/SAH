type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing single-rectangle optimization: Phase 1: 50-100
  random rectangles, score each by scanning all fish (O(N)) Phase 2: 50x50 grid (cell_size=2000), find
  top 10 cells, generate rectangles from neighbors Phase 3: perturb best rectangle corners by ±10, ±20,
  ±30 25 random restarts, output best 4-vertex rectangle. <1.9s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
