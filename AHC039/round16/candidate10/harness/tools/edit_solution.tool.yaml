type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle packing: 1. Parse fish coordinates
  (N mackerels, N sardines) 2. Sort fish by x-coordinate 3. For each x-range, find y-range maximizing
  M while avoiding S 4. Build valid axis-aligned rectangles (4-1000 vertices) 5. Ensure perimeter <= 400000,
  coords in [0,100000] 6. Output valid polygon or minimal rectangle if uncertain Ensure <2.0s execution,
  valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
