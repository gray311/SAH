type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based polygon construction:

  1. Parse fish coords, detect clusters via sliding windows

  2. Generate shapes: square, rectangle (4 aspect ratios), diamond (8 vertices), multi-cluster

  3. Size search: try 5 sizes (10k-30k) per shape

  4. Local refinement: edge expansion ±50..150

  5. Generate 8-12 diverse candidates, output best

  Ensure <1.5s execution, valid output format (m then vertices).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
