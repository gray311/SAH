type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing iterative polygon improvement:

  1. Build 200x200 grid, count M/S per cell, build 2D prefix sums for O(1) queries

  2. Start from mackerel bounding box (or default square if empty)

  3. Simulated annealing: 500 iterations, 5-10 mutations per iteration - Mutations: vertex insert/delete/shift,
  edge extension, rectangle merge - Score via grid query, accept if improves or with Boltzmann probability

  4. Local hill climb: edge extensions by 50-250, vertex jitter ±10-30

  5. Final validation and output

  Ensure <2.0s execution, valid output format, integer coords in [0,100000].'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
