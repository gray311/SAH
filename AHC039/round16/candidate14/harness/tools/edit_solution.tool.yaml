type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle-first search: 1. Build 100x100 grid,
  count M/S per cell, compute M-S score 2. From top 30 cells, generate 20 random rectangles per restart
  (100 total per restart) 3. Use probe_solution to rank all rectangles cheaply 4. Hill climb top 5 with
  ±5/±10 edge shifts 5. Evaluate the best rectangle of 30 restarts Ensure <2s per restart, use probes
  efficiently.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
