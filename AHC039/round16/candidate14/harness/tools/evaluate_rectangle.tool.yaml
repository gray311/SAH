type: tool
name: evaluate_rectangle
description: 'Evaluate an axis-aligned rectangle by computing exact mackerel and sardine counts inside
  it using spatial queries.

  Returns (mackerel_count, sardine_count, score = max(0, m - s + 1)).'
input_schema:
  type: object
  properties:
    rect:
      type: object
      properties:
        x1:
          type: integer
        y1:
          type: integer
        x2:
          type: integer
        y2:
          type: integer
