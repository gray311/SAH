schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  CRITICAL STRATEGY: Direct rectangle search with prefix-sum scoring.
  
  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):
  
  1. DATA LOADING & PREPROCESSING:
     - Read fish coordinates directly from input (10000 points: 5000 mackerels, 5000 sardines)
     - Build 50x50 grid (cell_size=2000) over [0,100000]x[0,100000]
     - For each cell, store list of fish coordinates (x,y,type) for exact counting
     - Also build prefix sum array for O(1) rectangle queries
  
  2. RECTANGLE GENERATION (core innovation):
     - For each cell with net positive fish count:
       * Generate candidate rectangles centered in the cell
       * Try sizes: 200x200, 400x400, 600x600, 800x800, 1000x1000, and combinations
       * Try offsets: center ±50, ±100, ±150 units in each direction
       * Clip coordinates to [0,100000]
       * Calculate perimeter constraint (<=400,000) and vertex count (4-1000)
  
  3. FAST SCORING:
     - Use prefix sum array to compute mackerels and sardines in any rectangle in O(1)
     - Score = max(0, mackerels - sardines + 1)
  
  4. LIMITED HILL CLIMBING:
     - For top 5 rectangles: shift edges by ±10, ±20 units
     - Recompute score using prefix sums
     - Keep best shift per edge
  
  5. MULTIPLE RESTARTS:
     - Run 10 restarts with different random seeds
     - Each restart: sample 5-8 dense cells, generate their rectangles, hill climb
     - Output best valid rectangle
  
  6. VALIDATION:
     - Ensure 4 vertices, distinct coordinates, perimeter <= 400,000, coords in [0,100000]
     - Use std::set to check vertex uniqueness
  
  Tools: edit_solution, evaluate_solution, probe_solution, finish.
skill_description: Direct rectangle search with 50x50 grid, prefix-sum O(1) scoring, diverse rectangle generation, limited hill climbing.
skill_body: |
  # Direct Rectangle Search for Polygon Optimization
  
  ## Phase 1: Data Loading and Prefix Sum Construction
  
  - Read all 10000 fish coordinates (5000 mackerels, 5000 sardines)
  - Build 50x50 grid (cell_size=2000) storing fish coordinates per cell
  - Build 2D prefix sum arrays: P_m[x][y] = mackerels in [0,x]x[0,y], similarly for sardines
  - O(1) query: sum in rectangle = P[y2][x2] - P[y1][x2] - P[y2][x1] + P[y1][x1]
  
  ## Phase 2: Rectangle Candidate Generation
  
  For each grid cell with positive net fish count:
  
  - Generate rectangles centered at cell midpoint
  - Size variations: 200x200, 400x400, 600x600, 800x800, 1000x1000
  - Position offsets: center ±50, ±100, ±150 in each direction
  - Clip all coordinates to [0, 100000]
  - Validate: 4 vertices, distinct, perimeter <= 400,000
  
  ## Phase 3: Fast Evaluation
  
  - Score each rectangle using prefix sums: O(1) per rectangle
  - Track top candidates
  
  ## Phase 4: Local Search
  
  For top 5 rectangles:
  - For each edge (x1,y1)-(x2,y2), try shifts ±10, ±20
  - Recompute score with prefix sums
  - Keep shift maximizing mackerels - sardines
  
  ## Phase 5: Multiple Restarts
  
  - Run 10 restarts with different seeds
  - Each restart: pick 5-8 random dense cells, generate rectangles, hill climb
  - Output single best valid rectangle
  
  ## Implementation Notes
  
  - Use std::set to verify vertex uniqueness
  - Prefix sum arrays sized 100002 x 100002 for full range
  - Total time: < 2.0s per evaluation
  - Prioritize rectangle diversity over hill climbing depth
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing direct rectangle search:
  
    1. Build 50x50 grid with prefix sums for O(1) scoring
  
    2. For dense cells, generate rectangles of sizes 200-1000 with ±150 offsets
  
    3. Score using prefix sums, hill climb top 5 with ±10,±20 shifts
  
    4. Run 10 restarts, output best valid rectangle
  
    Ensure <2.0s execution, valid 4-vertex output.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - need exact scoring for axis-aligned optimization.
  finish: End when you have encoded working direct rectangle search with prefix-sum scoring and diverse rectangle generation.
sampling:
  temperature: 0.9
  top_p: 0.85
  top_k: 15
  max_tokens: 8192
agent:
  max_iterations: 35
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 12000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares:
- name: diversity_push
  hook: before_model
  description: Encourage diverse rectangle generation by suggesting varied sizes and offsets
  implementation_py: "def before_model(hook_input):\n    return \"Generate diverse rectangles: sizes 200,400,600,800,1000 with offsets ±50,±100,±150, clip to bounds, use prefix sums for O(1) scoring.\""
