type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct rectangle search:

  1. Build 50x50 grid with prefix sums for O(1) scoring

  2. For dense cells, generate rectangles of sizes 200-1000 with ±150 offsets

  3. Score using prefix sums, hill climb top 5 with ±10,±20 shifts

  4. Run 10 restarts, output best valid rectangle

  Ensure <2.0s execution, valid 4-vertex output.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
