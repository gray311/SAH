type: tool
name: edit_solution
description: 'Generate C++ implementing stratified search: 1. Trivial baselines (100x100 square, 8-vertex
  octagon) 2. Basic rectangles (5-10 with random sizes/positions) 3. Sparse grid Laplacian flow (50x50
  grid at fish coords, 50 relax iterations) 4. Light hill climbing (±10 shifts, 2-3 rounds max) 5. Parallel
  restarts (5-8 independent rectangles with light hill climb) 6. Always output valid polygon, never exceed
  1.9s'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
