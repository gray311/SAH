type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing sardine-avoidance:

  1. Parse input and bin sardines by x-coordinate (e.g., 5000 bins of size 20)

  2. Identify x-ranges with NO sardines (sardine-free bands)

  3. Bin mackerels by x-coordinate, find mackerel-rich areas

  4. For overlapping regions, build simple rectangles: - y-range: pick 50-200 pixel vertical span in sardine-free
  zone - x-range: extend left/right while avoiding sardines, targeting mackerels

  5. Try 5-10 restarts with different seeds

  6. Output best valid rectangle (4-1000 vertices, perimeter < 400k)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
