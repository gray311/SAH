type: tool
name: compute_prefix_sums
description: Build 2D grid from fish positions and compute prefix sums for O(1) rectangle scoring. Returns
  grid stats and best rectangle found.
input_schema:
  type: object
  properties:
    search_area_x1:
      type: integer
      default: 0
    search_area_x2:
      type: integer
      default: 100000
    search_area_y1:
      type: integer
      default: 0
    search_area_y2:
      type: integer
      default: 100000
