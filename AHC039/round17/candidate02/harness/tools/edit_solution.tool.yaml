type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle sweep optimization: 1. Parse N mackerels
  and N sardines (type +1/-1) 2. Build 1000x1000 grid (cell_size=100) 3. Compute 2D prefix sums for O(1)
  rectangle queries 4. Sweep over all rectangle boundaries, track max M-S 5. Validate perimeter <= 400,000,
  vertices <= 1000, coords in [0,100000] 6. Output best polygon Ensure <2.0s execution, valid output format
  (m then vertices).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
