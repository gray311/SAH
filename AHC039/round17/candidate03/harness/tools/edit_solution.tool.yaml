type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing point-based sweep-line enumeration:

  1. Parse fish coordinates (N=5000 each) into sorted lists by x and y

  2. Quick pass: generate 10-20 candidate rectangles from random coordinate samples

  3. Deep pass: use coordinate compression on fish points to enumerate more candidates

  4. Try L-shapes and T-shapes by combining rectangles

  5. For each candidate, compute score using point-in-polygon test

  6. Return best polygon (4-1000 vertices, perimeter ≤400,000, integer coords)

  7. Ensure <2.0s execution time'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
