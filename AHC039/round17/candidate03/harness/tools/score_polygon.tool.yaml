type: tool
name: score_polygon
description: 'Score a candidate polygon by counting mackerels and sardines inside.

  Uses point-in-polygon test and returns (mackerels, sardines, score).

  Handles both rectangular and L-shaped polygons.'
input_schema:
  type: object
  properties:
    polygon:
      type: object
      properties:
        vertices:
          type: array
          items:
            type: object
            properties:
              x:
                type: integer
              y:
                type: integer
    simplify:
      type: boolean
      default: false
