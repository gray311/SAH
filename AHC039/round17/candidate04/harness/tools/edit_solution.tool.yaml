type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing Split-and-Dominance Search: 1. Build 200x200
  grid, count M/S per cell. 2. Find 3-6 top M-dense cells (M-S >= threshold). 3. From each, grow 4-directional
  corridors avoiding S > M+1. 4. Connect corridors into multi-lobed axis-aligned polygon. 5. Validate:
  4-1000 vertices, integer coords, perimeter <= 400000, no self-intersection. 6. Local edge optimization:
  shift edges +/-10..50, 2 refinement rounds. 7. 12 restarts with different seeds. Output best polygon.
  Ensure <2.0s execution, correct I/O format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
