type: tool
name: grid_corridor_builder
description: Given a seed cell and direction, build a maximal corridor by expanding in that direction.
  Avoids sardine-dense regions (S > M + 1). Returns corridor cells and final score.
input_schema:
  type: object
  properties:
    seed_x:
      type: integer
      description: Seed cell x-coordinate
    seed_y:
      type: integer
      description: Seed cell y-coordinate
    direction:
      type: string
      enum:
      - N
      - S
      - E
      - W
      description: Expansion direction
