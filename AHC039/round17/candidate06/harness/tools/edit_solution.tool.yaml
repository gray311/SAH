type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing fast rectangle search: 1. Parse mackerel positions
  from input 2. Group by proximity (5000 unit threshold) 3. For each cluster, create 1-2 rectangles by
  expanding central mackerel ±100-500 4. Try 3-5 total rectangles per run 5. Optional: refine edges with
  ±10, ±20 shifts 6. Output best valid rectangle (4-8 vertices) Ensure <1.5s execution for safety margin.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
