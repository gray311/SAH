type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing streamlined local search:

  1. Parse seed polygon, compute bounding box and center

  2. Build 100x100 grid, count M/S per cell, compute M-S score

  3. From seed center, grow 4-directional corridors (up to 50 cells) avoiding negative scores and high
  sardine density

  4. Convert corridors to rectangles, combine up to 4 into single polygon

  5. Single-round hill climbing: shift each outer edge ±5, ±10 units

  6. Run 5-7 restarts with ±2000 perturbations, output best

  Ensure <1.5s execution, valid output format (m then vertices).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
