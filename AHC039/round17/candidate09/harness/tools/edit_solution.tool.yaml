type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing fast rectangle-based optimization:

  1. Build 100x100 grid, count M/S per cell, compute M-S score

  2. Find top 10 cells with highest positive score

  3. For each, generate 5 rectangle sizes centered on cell

  4. Combine nearby rectangles into polygons

  5. Local hill climb with ±10..20 shifts

  6. 5-8 random restarts, output best polygon

  Ensure <1.5s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
