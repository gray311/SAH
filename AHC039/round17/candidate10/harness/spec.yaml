schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  CRITICAL STRATEGY: Direct coordinate-based clustering with tight bounding boxes.
  
  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):
  
  1. COORDINATE ANALYSIS:
     - Parse all mackerel and sardine coordinates from input
     - Sort by x and y coordinates
     - Identify dense mackerel clusters using spatial proximity
  
  2. CLUSTER-BASED POLYGON BUILDING:
     - Find connected components of mackerels (within distance threshold)
     - For each cluster, create a tight axis-aligned bounding box
     - Ensure vertices are integers and within [0, 100000]
  
  3. SARDINE AVOIDANCE:
     - For each bounding box candidate, check if it contains sardines
     - If yes, either shrink the box or skip it
     - If multiple boxes, consider whether their union avoids high-sardine regions
  
  4. POLYGON VALIDATION:
     - Ensure 4 <= vertices <= 1000
     - Ensure perimeter <= 400,000
     - Ensure no self-intersection (axis-aligned rectangles don't intersect if properly constructed)
     - Ensure all coordinates in [0, 100000]
  
  5. ENSEMBLE SEARCH:
     - Generate 5-10 different polygon candidates:
       * Individual mackerel bounding boxes
       * Union of nearby mackerel boxes
       * Large boxes covering dense regions
       * Random axis-aligned rectangles sampled to avoid sardines
     - Score each candidate by counting mackerels inside minus sardines inside
     - Output the best valid polygon
  
  6. SEARCH LOOP:
     - For each candidate generation method, try multiple seeds (10-20 seeds)
     - Use time-based search: allocate remaining time across different strategies
     - Prioritize strategies that have produced good scores before
  
  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ implementation
  - evaluate_solution: Run C++ program, get score
  - probe_solution: NOT useful for this task - need accurate scoring
  - finish: Submit when you have encoded working coordinate-based clustering

  Preserve EVOLVE-BLOCK markers, exact I/O format (m then vertices), and ensure <2.0s execution.

  KEY DIFFERENCE from seed: Direct coordinate analysis instead of grid approximation, tight bounding boxes around actual mackerel clusters, explicit sardine checking, ensemble search with multiple strategies.
skill_description: |
  Direct coordinate-based clustering. Parse fish coordinates, find dense mackerel clusters, build tight axis-aligned bounding boxes, check sardine presence, ensemble search with 5-10 strategies, coordinate-space search instead of grid.
skill_body: |
  # Direct Coordinate-Based Clustering Strategy
  
  ## Phase 1: Coordinate Parsing and Analysis
  - Parse all mackerel and sardine coordinates from input
  - Store in arrays for fast access
  - Sort by x and y for spatial queries
  
  ## Phase 2: Cluster Detection
  For each mackerel:
    - Check neighbors within distance threshold (e.g., 5000 units)
    - Mark as clustered if connected to existing cluster
    - Track cluster centers and extents
  
  ## Phase 3: Bounding Box Generation
  For each cluster:
    - Compute min_x, max_x, min_y, max_y
    - Create axis-aligned rectangle with these corners
    - Add 4 vertices to candidate list
  
  ## Phase 4: Sardine Check
  For each candidate rectangle:
    - Count sardines strictly inside (not on boundary)
    - Count mackerels inside (including boundary)
    - Compute score = mackerels - sardines + 1
    - If score > 0, keep as candidate
  
  ## Phase 5: Ensemble Search
  Generate multiple candidate polygons:
  1. Individual cluster bounding boxes
  2. Union of adjacent cluster boxes
  3. Large boxes covering top 10% densest mackerel regions
  4. Random axis-aligned rectangles (sample random coordinates, expand to ~500x500)
     - For each, check sardine count, reject if > mackerel count
  5. L-shaped polygons combining multiple clusters
  
  For each candidate:
    - Validate: 4-1000 vertices, perimeter <= 400000, coords in [0,100000]
    - Score by actual counting (not approximation)
  
  ## Phase 6: Time-Based Search
  - Allocate time across strategies:
    * 30%: Cluster-based bounding boxes
    * 25%: Individual box variations (shift corners ±100, ±200)
    * 20%: Large region boxes
    * 15%: Random rectangle sampling
    * 10%: L-shaped and multi-lobed combinations
  
  - For each allocation, generate 3-5 candidates
  - Score all, output best
  
  ## Phase 7: Final Validation
  - Ensure output format: m then m lines of "x y"
  - Ensure vertices are distinct
  - Ensure polygon is valid (non-self-intersecting)
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing direct coordinate-based clustering:
  
    1. Parse mackerel and sardine coordinates
  
    2. Find dense mackerel clusters (distance-based connectivity)
  
    3. For each cluster, create tight axis-aligned bounding box
  
    4. Check each box for sardine presence
  
    5. Generate ensemble: individual boxes, unions, large boxes, random rectangles
  
    6. Score by exact counting, output best valid polygon
  
    Ensure <2.0s execution, valid output format.'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  probe_solution: NOT useful - need accurate scoring to distinguish valid strategies.
  finish: End when you have submitted a working coordinate-based clustering harness with ensemble search.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
  max_tokens: 10240
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 12000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares: []
