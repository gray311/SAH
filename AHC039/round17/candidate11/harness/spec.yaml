schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):
  
  1. CLUSTER-BASED APPROACH (fast, focused):
     - Parse fish coordinates, group mackerels that are close together (within 2000 units)
     - For each cluster, try building minimal enclosing rectangles (4-8 vertices)
     - Score each rectangle using exact evaluation
   
  2. LOCAL SEARCH (key innovation):
     - Start with valid polygon (e.g., small rectangle capturing 1-2 mackerels)
     - For 8-10 iterations: try expanding edges outward by 50-500 units in 4 directions
     - Try shrinking edges inward by 10-100 units
     - Accept change if it improves score (simple greedy, no lookahead)
   
  3. PERIMETER CONSTRAINT HANDLING:
     - Track current perimeter during expansion
     - Only accept moves that keep perimeter <= 400,000
     - If stuck, reset to smaller polygon and retry with different seed
   
  4. MULTIPLE SEEDS:
     - Generate 8-12 candidate polygons from different mackerel pairs/points
     - Each seed: pick 2 random mackerels, build minimal rectangle between them
     - Run local search from each
   
  5. VALIDATION:
     - Ensure 4-1000 vertices, integer coords in [0,100000], no self-intersection
     - Use simple point-in-rectangle and edge-intersection checks
     - Output best valid polygon
   
  6. PERFORMANCE:
     - Total time < 2.0s per evaluation
     - Focus on speed: minimal data structures, avoid grid/KD-trees, simple arrays
     - Early termination if no improvement after 5 iterations
new_tools:
- name: propose_minimal_rect
  description: Given two mackerel points, propose a minimal rectangle with padding and return its perimeter and rough score estimate.
  input_schema:
    type: object
    properties:
      p1:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
      p2:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
      padding:
        type: integer
        default: 150
  implementation_py: |
    def run(ctx, args):
        p1 = args.get("p1")
        p2 = args.get("p2")
        padding = args.get("padding", 150)
        
        x1, y1 = p1["x"], p1["y"]
        x2, y2 = p2["x"], p2["y"]
        
        min_x = min(x1, x2) - padding
        max_x = max(x1, x2) + padding
        min_y = min(y1, y2) - padding
        max_y = max(y1, y2) + padding
        
        # Clamp to bounds
        min_x = max(0, min_x)
        max_x = min(100000, max_x)
        min_y = max(0, min_y)
        max_y = min(100000, max_y)
        
        if min_x >= max_x or min_y >= max_y:
            return {"valid": False, "error": "invalid rectangle"}
        
        w = max_x - min_x
        h = max_y - min_y
        perimeter = 2 * (w + h)
        
        if perimeter > 400000:
            return {"valid": False, "error": "perimeter exceeds limit"}
        
        return {
            "valid": True,
            "vertices": [
                (min_x, min_y), (max_x, min_y), (max_x, max_y), (min_x, max_y)
            ],
            "perimeter": int(perimeter),
            "width": w,
            "height": h
        }
remove_tools:
  - probe_solution
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based local search:

    1. Parse fish, group nearby mackerels into clusters

    2. For 8-12 seeds: pick 2 random mackerels, build minimal rectangle

    3. Local search: expand/shrink edges by 10-500 units, 8-10 iterations

    4. Validate: perimeter <= 400k, coords in range, no self-intersection

    5. Output best polygon, total time < 2.0s'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30). Each run has ~2.0s search window.
  finish: End when you have submitted a working cluster-based local search with multiple seeds and local edge refinement.
  probe_solution: NOT useful - full evaluation needed for accurate scoring.
skill_description: Cluster-based local search. Build minimal rectangles from mackerel pairs, then locally refine edges via simple expansion/shrinkage. Fast, avoids complex structures.
skill_body: |
  # Cluster-Based Local Search Strategy
  
  ## Core Idea
  
  Instead of complex grid analysis or multi-lobed structures, focus on simple rectangles around mackerel clusters with local edge refinement.
  
  ## Step-by-Step
  
  ### Step 1: Generate Seed Rectangles
  
  - Pick 8-12 pairs of mackerels randomly
  - For each pair, build minimal axis-aligned rectangle containing both
  - Add padding of 100-200 units to each side for flexibility
  
  ### Step 2: Local Edge Search
  
  For each seed rectangle (up to 8 vertices after padding):
  
  - Current perimeter must be <= 400,000
  
  - For each of 4 sides (left, right, top, bottom):
    * Try expanding outward by d in {50, 100, 200, 300, 500}
    * Try shrinking inward by d in {10, 20, 50, 100} (if still within bounds and non-negative width/height)
    * Evaluate each candidate
    * Keep best improvement
  
  - Do 8-10 such rounds of improvement
  
  ### Step 3: Validation
  
  - Ensure 4 <= vertices <= 1000
  - Integer coordinates in [0, 100000]
  - No self-intersection (axis-aligned rects are simple)
  - Perimeter <= 400,000
  
  ### Step 4: Best Selection
  
  - Track score for each candidate
  - Output single best valid polygon
  
  ## Key Success Factors
  
  - Simple rectangles are easier to validate and faster to compute
  - Local search makes steady improvements without expensive lookahead
  - Multiple seeds increase chance of finding good starting point
  - Avoid complex structures that exceed time limit
new_middlewares:
- name: simple_rect_reminder
  hook: before_model
  description: remind to use simple rectangles from mackerel pairs with local edge refinement
  implementation_py: |
    def before_model(hook_input):
        return "Generate 8-12 seed rectangles from mackerel pairs, then refine each edge by expanding/shrinking 10-500 units for 8-10 iterations. Keep best valid polygon."
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
  max_tokens: 8192
agent:
  max_iterations: 25
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 10000
