type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based local search:

  1. Parse fish, group nearby mackerels into clusters

  2. For 8-12 seeds: pick 2 random mackerels, build minimal rectangle

  3. Local search: expand/shrink edges by 10-500 units, 8-10 iterations

  4. Validate: perimeter <= 400k, coords in range, no self-intersection

  5. Output best polygon, total time < 2.0s'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
