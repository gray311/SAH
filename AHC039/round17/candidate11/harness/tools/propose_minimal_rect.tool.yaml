type: tool
name: propose_minimal_rect
description: Given two mackerel points, propose a minimal rectangle with padding and return its perimeter
  and rough score estimate.
input_schema:
  type: object
  properties:
    p1:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
    p2:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
    padding:
      type: integer
      default: 150
