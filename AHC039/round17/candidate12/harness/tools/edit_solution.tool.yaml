type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing bounding-box refinement:

  1. Parse mackerels, compute bounding box

  2. Start with 4-vertex rectangle

  3. Iteratively split edges at 0.25, 0.33, 0.5, 0.67, 0.75

  4. Use KD-tree for O(log N) fish counting

  5. Max 50 vertices, 5-8 restarts

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
