schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).

  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):

  1. CLUSTERING: 
     - Read all mackerel coordinates from input
     - Cluster mackerels using simple spatial grouping (group points within 5000 units)
     - For each cluster, compute the axis-aligned bounding box

  2. BOUNDING BOX CONSTRUCTION:
     - For each cluster's bounding box [min_x, max_x] x [min_y, max_y]:
       * Start with a rectangle covering all points in that cluster
       * Check if this rectangle captures most mackerels and few sardines

  3. SARDINE AVOIDANCE:
     - Before finalizing any polygon, query sardine positions in the proposed region
     - If a large sardine cluster overlaps (>30% sardines), split the polygon or offset it
     - Use coordinate-based checks (not grid approximation)

  4. POLYGON MEGALOMANIA:
     - Connect nearby bounding boxes with rectangular bridges (sharing edges when possible)
     - Or build a single large polygon covering multiple clusters if beneficial
     - Ensure: 4 <= vertices <= 1000, perimeter <= 400,000

  5. COORDINATE-FINE TUNING:
     - For each polygon edge, try expanding by ±10, ±20, ±30, ±40, ±50 units in outward direction
     - For each edge, try contracting by ±5, ±10, ±15, ±20 units in inward direction
     - Use fast point-in-polygon tests with pre-read sardine/mackerel positions
     - Keep modifications that increase (mackerels - sardines)

  6. BRUTE-FORCE LOCAL SEARCH:
     - For small polygons (<100 vertices), try vertex coordinate perturbations:
       * Each vertex: try ±10, ±20, ±30 in x and y (4 directions per vertex)
       * Limited to top 5-10 best variants per parent polygon

  7. MULTIPLE STRATEGIES:
     - Strategy A: Cluster-based bounding boxes (default)
     - Strategy B: Single large polygon covering ~80% area if mackerel density is high
     - Strategy C: Concentric rectangles (outer rectangle for mackerels, inner holes blocked by sardines)
     - Run all 3, pick best score

  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with complete C++ implementing clustering + bounding boxes + coordinate fine-tuning
  - evaluate_solution: Run C++ program, get score
  - probe_solution: NOT useful - need exact counts
  - finish: Submit when you have working clustering-based approach with coordinate tuning

  Key difference from seed: Use spatial clustering of mackerels + coordinate-based sardine exclusion + direct coordinate perturbations instead of grid corridors.
skill_description: Cluster mackerels spatially, build bounding boxes, exclude sardine clusters, fine-tune coordinates, multi-strategy exploration.
skill_body: |
  # Clustering-Based Polygon Construction

  ## Phase 1: Spatial Clustering
  - Read mackerel coordinates from input
  - Sort by x-coordinate, then group points within 5000-unit windows
  - Within each group, sort by y-coordinate, split into clusters of ~20 points
  - For each cluster, compute axis-aligned bounding box

  ## Phase 2: Bounding Box Construction  
  - For each cluster's bounding box [x1,y1] to [x2,y2]:
    * Create initial rectangle with 4 vertices
    * Count mackerels (all in cluster + nearby) and sardines inside
    * Score = mackerels - sardines

  ## Phase 3: Sardine Exclusion
  - Check sardine distribution in proposed polygon area
  - If sardine density > threshold, either:
    * Split into multiple disjoint rectangles (connected by thin bridges if needed)
    * Offset the bounding box toward lower-sardine areas
    * Make polygon irregular to avoid dense sardine regions

  ## Phase 4: Coordinate Fine-Tuning
  - For each edge of each rectangle:
    * Try outward expansions: +10, +20, +30, +40, +50 units
    * Try inward contractions: -5, -10, -15, -20 units  
    * Keep the best expansion/contraction per edge
  - Repeat 2 refinement rounds

  ## Phase 5: Vertex Perturbation (for small polygons)
  - For polygons with <100 vertices:
    * For each vertex, try 4 directional shifts: (±10, 0), (∓10, 0), (0, ±10), (0, ∓10)
    * Also try diagonal: (±10, ±10) for small perturbations
    * Evaluate each variant, keep top 5-10

  ## Phase 6: Multi-Strategy Evaluation
  - Strategy A: Cluster-based bounding boxes (default, 5-10 clusters)
  - Strategy B: Single large L-shaped polygon covering top 5 clusters
  - Strategy C: Concentric rectangle approach
  - Run all strategies, output best result

  ## Implementation Notes
  - Use efficient point-in-rectangle tests
  - Pre-compute sorted fish lists for O(log N) queries
  - Total time per eval: <2.0s, use multiple restarts (8-12) with different clusterings
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with C++ implementing: 1) spatial clustering of mackerels, 2) bounding box construction per cluster, 3) sardine exclusion checks, 4) coordinate fine-tuning (±5..50 edge shifts), 5) vertex perturbation for small polygons, 6) multi-strategy evaluation with 8-12 restarts'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30).
  probe_solution: NOT useful - need exact fish counts for accurate scoring.
  finish: Submit when you have working clustering + coordinate tuning approach.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
  max_tokens: 14336
agent:
  max_iterations: 35
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 18000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares: []
