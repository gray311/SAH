type: tool
name: count_fish_in_rect
description: Count mackerels and sardines in an axis-aligned rectangle by direct point-in-rectangle testing.
  Returns exact counts (not approximate).
input_schema:
  type: object
  properties:
    mackerels:
      type: object
      properties:
        count:
          type: integer
        coords:
          type: array
          items:
            type: object
            properties:
              x:
                type: integer
              y:
                type: integer
    sardines:
      type: object
      properties:
        count:
          type: integer
        coords:
          type: array
          items:
            type: object
            properties:
              x:
                type: integer
              y:
                type: integer
    min_x:
      type: integer
    max_x:
      type: integer
    min_y:
      type: integer
    max_y:
      type: integer
