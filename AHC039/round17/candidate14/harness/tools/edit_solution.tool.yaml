type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing bounding box clustering:

  1. Parse all fish coordinates from input

  2. Group mackerels by proximity (threshold=500) into clusters

  3. For each cluster, compute bounding box and try polygon variations (4-8 vertices)

  4. Count mackerels and sardines inside each polygon (point-in-rectangle test)

  5. Output best polygon with score = max(0, m - s + 1)

  Run 10-15 searches, ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
