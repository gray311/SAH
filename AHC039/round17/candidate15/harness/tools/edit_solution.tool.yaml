type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based rectangle formation:

  1. Parse mackerel coordinates, group into clusters using x-proximity (min_dist=150)

  2. For each cluster, create rectangle with 10-unit margin

  3. Count sardines inside each rectangle, filter out low-value ones

  4. Merge overlapping rectangles, compute final counts

  5. Output valid polygon, ensure <2.0s execution'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
