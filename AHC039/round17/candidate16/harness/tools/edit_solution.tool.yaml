type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing rectangle brute-force search:

  1. Read all fish positions

  2. Try all 1x1, 1x2, 2x1, 2x2, 3x3 rectangles around each mackerel

  3. For each candidate, count M and S using KD-tree

  4. Expand successful rectangles in 4 directions

  5. Try combining 2-3 non-overlapping rectangles

  6. Fallback: sample 100 random centers, try large rectangles

  7. Output best valid polygon (< 2.0s)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
