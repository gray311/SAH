type: tool
name: compute_cluster_score
description: 'Compute score for a grid cell (M - S) and a proposed bounding box (by reading points in
  it).

  Supports both grid-level queries and rectangle queries for refinement steps.'
input_schema:
  type: object
  properties:
    grid_r:
      type: integer
    grid_c:
      type: integer
    min_x:
      type: integer
      description: rectangle min x, or -1 if grid-only
    max_x:
      type: integer
      description: rectangle max x, or -1 if grid-only
    min_y:
      type: integer
      description: rectangle min y, or -1 if grid-only
    max_y:
      type: integer
      description: rectangle max y, or -1 if grid-only
