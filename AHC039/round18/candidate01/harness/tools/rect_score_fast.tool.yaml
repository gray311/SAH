type: tool
name: rect_score_fast
description: 'Fast rectangle score query: count mackerels and sardines in given rectangle, return M-S.

  Call this during hill climbing to evaluate shifted polygons.'
input_schema:
  type: object
  properties:
    min_x:
      type: integer
    max_x:
      type: integer
    min_y:
      type: integer
    max_y:
      type: integer
