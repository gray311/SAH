type: tool
name: finish
description: 'End when you''ve output evaluated solutions and exhausted your search. Try to submit at
  least 1 full evaluation

  and 15-20 probes. Multiple submissions work - only the last one scores.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
