type: tool
name: polygon_analyze
description: Analyze a polygon's geometric properties and fish coverage. Returns vertex count, perimeter,
  bounds, and estimates mackerel/sardine coverage based on polygon area and fish distribution. Provides
  actionable suggestions for vertex refinement.
input_schema:
  type: object
  properties:
    polygon:
      type: array
      description: List of vertices, each as [x, y] coordinate pair
      items:
        type: array
        items:
          type: integer
