type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing point-based cluster exploitation:

  1. Parse fish coordinates directly, group mackerels into clusters (500-unit radius)

  2. For each cluster, build axis-aligned rectangle around it

  3. Systematic vertex refinement: shift each vertex by ±1, ±2, ±5, ±10, ±20 units

  4. Use probe_solution to rank top 10 candidates (separate budget)

  5. Run full evaluate_solution on best 2-3 candidates

  6. 10-15 restarts with perturbations to cluster selection and rectangle sizing'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
