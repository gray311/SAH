type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based polygon optimization:

  1. Read fish coordinates, cluster mackerels by proximity (within 500 units)

  2. Build initial polygons around clusters (bounding boxes, combinations)

  3. Use KD-tree for fast O(log N) scoring

  4. Deep hill climbing with ±1..3 integer edge shifts, 5 rounds

  5. 10 restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
