type: tool
name: score_polygon
description: Score a polygon using KD-tree to count mackerels and sardines inside, plus O(1) validation
  of geometric constraints.
input_schema:
  type: object
  properties:
    polygon:
      type: object
      properties:
        vertices:
          type: array
          items:
            type: object
            properties:
              x:
                type: integer
              y:
                type: integer
    fish_data:
      type: object
      properties:
        mackerels:
          type: array
          items:
            type: object
            properties:
              x:
                type: integer
              y:
                type: integer
        sardines:
          type: array
          items:
            type: object
            properties:
              x:
                type: integer
              y:
                type: integer
