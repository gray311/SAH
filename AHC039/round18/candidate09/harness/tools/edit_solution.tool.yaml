type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing seed-based local search with simulated annealing:

  1. Build initial polygon from mackerel cluster bounding box

  2. Apply simulated annealing hill climbing (±10..30 shifts, T=50 cooling to 1)

  3. Run 8 restarts with corner perturbation

  4. Add lobe expansions for disconnected mackerel clusters

  5. Validate output (4-1000 vertices, coords in bounds, no self-intersection)

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
