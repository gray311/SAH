schema: h2spec/1.0
system_prompt: |
  You are a C++ polygon optimizer for axis-aligned fish capture. Goal: maximize (mackerels - sardines + 1).
  
  CRITICAL: Use mutation-based hill climbing on polygon vertices, NOT grid-based approaches.
  The seed already has KD-tree and polygon utilities - build on them.
  
  SEARCH METHOD (encodes in EVOLVE-BLOCK C++ code):
  
  1. PARSING: Extract N mackerels and N sardines from input, build KD-tree using seed's KDNode structure.
  
  2. BASE POLYGON: Generate 3-5 initial polygons with vertex counts 4, 8, 12, 16, 24. Use axis-aligned edges.
  
  3. HILL CLIMBING (Key innovation - mutation-based, not grid-based):
     - Round 1: Mutate each vertex by ±1, ±2, ±5 in x and y; test each variant
     - Round 2: Mutate edges by extending/shrinking 1-5 units
     - Round 3: Larger mutations ±10, ±15 then refine with ±1, ±2
     - Use KD-tree for O(log N) fish counting - fast enough for ~100 mutations
  
  4. SHAPES TO TRY:
     - Rectangle (4 vertices)
     - L-shape (6 vertices)  
     - Multi-lobed (8-20 vertices)
     - Bounding box of top fish clusters
  
  5. VALIDATION: Ensure 4-1000 vertices, perimeter ≤400000, coords in [0,100000], no self-intersection
  
  6. OUTPUT: Best polygon across all variants
  
  Tools:
  - edit_solution: Replace EVOLVE-BLOCK with mutation-based hill climber using KD-tree
  - evaluate_solution: Run C++ program, get full score (mackerels-sardines+1)
  - probe_solution: FAST - use KD-tree to approximate score without consuming eval budget; use this to rank mutation candidates
  - finish: Submit when mutation hill climber works

skill_description: Mutation-based hill climbing using KD-tree for fast scoring. Mutate vertices/edges in 3 rounds, try multiple polygon shapes, use probe for quick ranking.
skill_body: |
  # Mutation-Based Polygon Optimization with KD-Tree
  
  ## Overview
  Use the seed's existing KD-tree infrastructure for fast fish counting. 
  Perform mutation-based hill climbing instead of grid-based approaches.
  
  ## Phase 1: Build KD-Tree
  - Read N mackerels and N sardines
  - Use seed's KDNode structure and build_kdtree() function
  - Each node stores fish index and splits alternately by x/y
  
  ## Phase 2: Generate Candidates
  Generate 5 base polygons:
  1. Rectangle: bounding box covering all fish
  2. L-shape: two rectangles connected
  3. Multi-lobed: 8-16 vertices with protrusions
  4-5. Random axis-aligned polygons with 12-24 vertices
  
  ## Phase 3: Hill Climbing (3 Rounds)
  
  ### Round 1 - Vertex Mutation (Fine)
  For each vertex (x,y):
    Try: (x±1,y), (x±2,y), (x±5,y), (x,y±1), (x,y±2), (x,y±5)
    Score each with KD-tree query
    Keep best
  
  ### Round 2 - Edge Mutation (Medium)
  For each horizontal edge (y1,y2) at row y:
    Try extending/shrinking by 1,2,3,4,5 units
  For each vertical edge (x1,x2) at col x:
    Try extending/shrinking by 1,2,3,4,5 units
  Score with KD-tree, keep improvements
  
  ### Round 3 - Coarse then Refine
  Try larger mutations: ±10, ±15 on vertices
  Then refine promising variants with ±1, ±2
  
  ## Phase 4: Probe Before Final Eval
  - Use probe_solution to rank top 5-10 candidates cheaply
  - Only run full evaluate_solution on best 1-3 candidates
  
  ## Phase 5: Output
  - Pick best polygon by full evaluation
  - Output format: vertex count, then vertex coordinates
  
  ## Implementation Notes
  - Reuse: KDNode, build_kdtree, query_kdtree_rectangle, Point, XorShift RNG
  - Mutations per candidate: ~50-100 (fast with KD-tree)
  - Total time: <1.8s, leaving 0.15s safety margin
  - Use seed's timer: global_timer.elapsed() to monitor
