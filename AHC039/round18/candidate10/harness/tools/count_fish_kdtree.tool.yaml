type: tool
name: count_fish_kdtree
description: "Fast fish counting using KD-tree. Counts mackerels and sardines \nin axis-aligned rectangle\
  \ in O(log N) time. Returns (m, s, score)."
input_schema:
  type: object
  properties:
    rect_min_x:
      type: integer
    rect_max_x:
      type: integer
    rect_min_y:
      type: integer
    rect_max_y:
      type: integer
