type: tool
name: cluster_probe
description: "Fast approximate score for a small axis-aligned region. \nQuery a rectangle defined by (min_x,\
  \ min_y, max_x, max_y).\nReturns approximate (mackerels, sardines, score) using grid lookup.\nCall this\
  \ before building full polygons to filter promising regions."
input_schema:
  type: object
  properties:
    min_x:
      type: integer
    min_y:
      type: integer
    max_x:
      type: integer
    max_y:
      type: integer
