type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based small-rectangle search:


  1. Parse fish positions, use KD-tree (if seed has it) for spatial indexing


  2. Cluster mackerels within 200 units


  3. For each cluster, generate 3-5 small rectangle candidates (10-150 units)


  4. Use grid-based counting for fast mackerel/sardine estimation


  5. Pick top 3 candidates, output best one


  6. Ensure valid polygon: 4-1000 vertices, perimeter <= 400,000, integer coords


  Total time: < 2.0s with fast grid counting'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
