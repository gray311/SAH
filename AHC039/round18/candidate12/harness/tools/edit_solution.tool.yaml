type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing point-based cluster strategy:

  1. Parse all fish positions, use spatial hashing to cluster by proximity

  2. Identify mackerel-dense clusters (ratio >= 0.6) and sardine-dense regions to avoid

  3. Build diverse polygon candidates: minimal boxes, expanded boxes (±1-3 units), merged boxes, L-shapes

  4. Score each candidate, select best

  5. Local optimization: try edge shifts ±1,±2,±3,±5, repeat 3-5 rounds

  6. 8-12 diversified restarts with different cluster selections

  7. Output single best polygon, ensure valid format and constraints'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
