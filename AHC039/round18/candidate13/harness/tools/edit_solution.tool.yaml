type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct coordinate-based clustering:

  1. Parse mackerel/sardine coordinates directly from stdin

  2. Use 100x100 grid (cell_size=1000) to cluster mackerels

  3. For top 5-10 mackerel-dense cells, build minimal bounding boxes

  4. Combine bounding boxes into single polygon (union of rectangles)

  5. Local vertex optimization with ±10, ±20 shifts

  6. 10 random restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
