type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing bounded iterative search:

  1. Initialize with bounding box rectangle of all fish

  2. Run 5-8 iterations with 0.25s time budget each

  3. Per iteration: generate 3-5 variants (expand/contract/vertex-add/edge-shift)

  4. Score variants using 10x10 coarse grid heuristic (fast estimation)

  5. Keep top 2 valid variants per iteration

  6. Run 3 independent searches with different seeds

  7. Output best valid polygon

  Ensure <2.0s execution and valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
