type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing mackerel cluster rectangle packing: 1. Parse
  input (5000 mackerels + 5000 sardines) 2. Build KD-tree for O(log N) rectangle queries 3. Generate candidates:
  unit square, per-fish rectangles, cluster boxes, random seeds 4. Score each with m_count - s_count 5.
  Try local edge perturbations (±5, ±10) 6. Use probe to rank variants, full eval top 3 7. Output best
  polygon. Ensure <2.0s execution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
