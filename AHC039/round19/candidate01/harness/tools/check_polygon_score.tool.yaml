type: tool
name: check_polygon_score
description: 'Count fish inside a given polygon. Returns (mackerels_count - sardines_count + 1).

  Given polygon vertices, check each fish point against the polygon (point-in-polygon test),

  count mackerels (type=1) and sardines (type=-1), return max(0, mackerels - sardines + 1).

  Input format: {"vertices": [{"x": int, "y": int}, ...]} with at least 4 vertices.

  The polygon vertices should be in order (clockwise or counter-clockwise).

  Uses Ray-Casting algorithm for point-in-polygon test.

  Input schema: {"vertices": [{"x": int, "y": int}, ...]}

  Implementation: Reads task input file to get fish coordinates and types, applies point-in-polygon test.'
input_schema:
  type: object
  properties:
    vertices:
      type: array
      items:
        type: object
        properties:
          x:
            type: integer
          y:
            type: integer
