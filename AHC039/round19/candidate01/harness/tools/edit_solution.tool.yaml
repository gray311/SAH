type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing minimal bounding box approach: 1. Parse 2N fish
  positions from input

  2. Find bounding box of mackerels (min_x, max_x, min_y, max_y)

  3. Handle edge cases (collinear mackerels, single point)

  4. Build initial 4-vertex rectangle

  5. Local refinement: perturb each edge by ±10, ±20, ±30

  6. 5 restarts with coordinate perturbations

  7. Output best polygon'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
