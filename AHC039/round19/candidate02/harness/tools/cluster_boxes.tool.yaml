type: tool
name: cluster_boxes
description: 'Parse fish input, identify mackerel clusters (points within 5000 distance),

  build minimal axis-aligned bounding boxes around clusters, optionally combine

  adjacent clusters. Returns list of candidate polygons with estimated scores.


  Uses KD-tree for fast spatial lookups. Prioritizes boxes with high M/S ratio.'
input_schema:
  type: object
  properties:
    cluster_threshold:
      type: integer
      default: 5000
    max_boxes:
      type: integer
      default: 20
