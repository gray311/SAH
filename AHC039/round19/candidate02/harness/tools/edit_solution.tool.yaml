type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing mackerel-focused clustering:


  1. Parse mackerel and sardine coordinates from input


  2. Identify clusters using spatial proximity (distance threshold ~5000)


  3. For each cluster, build minimal axis-aligned bounding box


  4. Check sardine density inside each box (use KD-tree for fast query)


  5. Generate multiple diverse candidates: single large box, multi-cluster boxes, hybrids


  6. Rank candidates using probe if available, otherwise use fast estimation


  7. Output best valid polygon


  Ensure: <2.0s execution, valid output format, at least one polygon per eval.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
