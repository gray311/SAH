type: tool
name: count_fish_in_square
description: 'Count mackerels and sardines inside a square region. Given a square center and half-width,

  returns the counts of fish inside (inclusive of edges). Uses a spatial grid for efficient counting.

  Call this to evaluate candidate square sizes during binary search.'
input_schema:
  type: object
  properties:
    center_x:
      type: integer
    center_y:
      type: integer
    half_width:
      type: integer
    grid_size:
      type: integer
      default: 100
