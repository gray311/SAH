schema: h2spec/1.0
new_tools:
  - name: quick_rect_score
    description: |
      Quickly compute the exact mackerel - sardine count difference for any axis-aligned rectangle
      by scanning input lines and using prefix sums implicitly. Returns the score, cell bounds, and runtime warning if slow.
    input_schema:
      type: object
      properties:
        x_min:
          type: integer
        x_max:
          type: integer
        y_min:
          type: integer
        y_max:
          type: integer
    implementation_py: |
      def run(ctx, args):
          x_min = args.get("x_min", 0)
          x_max = args.get("x_max", 100000)
          y_min = args.get("y_min", 0)
          y_max = args.get("y_max", 100000)
          
          m_count = 0
          s_count = 0
          prog = ctx.get_program()
          for line in prog.splitlines():
              if "fish[" in line:
                  try:
                      content = line.split("fish[")[1].rstrip("]").strip()
                      parts = content.split(",")
                      if len(parts) >= 2:
                          x = int(parts[0].strip())
                          y = int(parts[1].strip())
                          rest = ""
                          if len(parts) > 2:
                              rest = parts[2].strip().split()[0] if parts[2].strip() else "1"
                          ftype = 1 if rest == "1" else (-1 if rest == "-1" else (1 if "mackerel" in line.lower() else -1))
                          if x_min <= x <= x_max and y_min <= y <= y_max:
                              if ftype == 1:
                                  m_count += 1
                              elif ftype == -1:
                                  s_count += 1
                  except:
                      pass
          
          score = max(0, m_count - s_count + 1)
          return {"score": score, "mackerels": m_count, "sardines": s_count, "x_min": x_min, "x_max": x_max, "y_min": y_min, "y_max": y_max}
