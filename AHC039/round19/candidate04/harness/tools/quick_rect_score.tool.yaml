type: tool
name: quick_rect_score
description: 'Quickly compute the exact mackerel - sardine count difference for any axis-aligned rectangle

  by scanning input lines and using prefix sums implicitly. Returns the score, cell bounds, and runtime
  warning if slow.'
input_schema:
  type: object
  properties:
    x_min:
      type: integer
    x_max:
      type: integer
    y_min:
      type: integer
    y_max:
      type: integer
