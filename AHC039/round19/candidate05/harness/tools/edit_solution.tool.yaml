type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing coordinate-space polygon construction:

  1. Parse input: extract mackerels and sardines into separate structures - Mackerels: sorted list for
  clustering - Sardines: hash set for O(1) point testing 2. Build candidate polygons from multiple strategies:
  - Single-fish bounding boxes - Cluster-based bounding boxes (radii 20, 50) - Sardine-aware edge refinement
  (expand/contract) - Multi-cluster merging 3. Evaluate each candidate by counting fish inside 4. Keep
  best polygon across all strategies 5. Validate output (4-1000 vertices, perimeter constraint, coord
  bounds) 6. Run 10-15 independent strategies, time-budgeted search'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
