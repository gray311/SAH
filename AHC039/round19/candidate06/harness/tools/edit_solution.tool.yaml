type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based rectangle construction: 1. Sort
  mackerels by x/y, find clusters via gap detection (>20000) 2. Build rectangles from cluster pairs (x_cluster,
  y_cluster) 3. Filter by score >= 2, combine adjacent rectangles 4. Coarse local search with ±500..1500
  expansions 5. 25 restarts with random gap thresholds and perturbations 6. Output best valid polygon,
  ensure <1.5s execution'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
