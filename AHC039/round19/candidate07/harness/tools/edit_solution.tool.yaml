type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing fine-grained vertex optimization:

  1. Detect mackerel clusters (within 500-1000 unit radius)

  2. Build initial rectangles around cluster bounding boxes

  3. Vertex-level optimization with ±1, ±2, ±3 shifts (24 candidates per vertex)

  4. Combine adjacent clusters, local search with edge flips

  5. 5-8 restarts, output best polygon

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
