type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing direct geometric clustering:

  1. Read fish coordinates, group mackerels into clusters (distance <= 2000) 2. Compute tight AABB for
  each cluster 3. Count sardines in each box using KD-tree 4. Keep clusters with positive (M-S) score
  5. Merge adjacent/overlapping rectangles 6. Local expansion/shrink (±50, ±100, ±150) 7. Combine into
  valid polygon (4-1000 vertices) 8. Run diversified search (different radii, strategies)

  Ensure <2.0s execution, valid output format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
