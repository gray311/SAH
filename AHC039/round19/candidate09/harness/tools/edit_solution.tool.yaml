type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based rectangle construction:

  1. Parse fish coordinates from input

  2. Cluster mackerels by proximity (distance <= 500)

  3. Build tight axis-aligned rectangles around significant clusters (5+ mackerels)

  4. Refine rectangle boundaries with ±1..±3 unit adjustments

  5. Try multi-rectangle unions (2-3 rectangles) if beneficial

  6. Run 10 restarts with random perturbations

  7. Output best valid polygon'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
