type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing fish-based cluster packing:

  1. Parse all fish positions (mackerels and sardines)

  2. Build KD-tree or fine grid (cell_size=50) for range queries

  3. Cluster mackerels by proximity (distance < 150)

  4. Generate rectangles around clusters with expansion delta=20

  5. Subtract conflicting sardines (count exact, not approximate)

  6. Greedy selection of non-overlapping rectangles by score

  7. Fine-grained edge refinement (±1..15 shifts, 2 rounds)

  8. Run 8 diverse strategies, output best

  Ensure <2.0s execution, valid output format (m then vertices).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
