type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with cluster-based optimization: 1. Read mackerel positions, spatial
  hash with 100x100 grid (cell=1000) 2. Group into clusters using Union-Find (proximity < 500) 3. For
  each cluster, compute axis-aligned bounding box 4. Generate candidates: single best cluster, top 3 merged,
  top 5 with corridors 5. Local search: edge expansions ±5..15, ear additions for uncovered mackerels
  6. 10-15 restarts with varied parameters, output best polygon'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
