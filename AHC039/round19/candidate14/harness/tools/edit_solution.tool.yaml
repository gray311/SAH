type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing cluster-based search:

  1. Build 100x100 grid (cell_size=1000), count M/S per cell

  2. Find top 10 cells with positive M-S score

  3. For each cell, build bounding box around all fish, expand by 200 units

  4. Deep hill climbing: 5 rounds, shifts ±50..300 units

  5. 25 restarts with adaptive step sizes, 20% acceptance of non-improving moves

  6. Use evaluate_solution for full scoring after promising shifts

  Ensure <2.0s execution, valid output format, perimeter <= 400000.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
