type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing local cluster-based polygon construction:

  1. Parse mackerel/sardine coordinates, cluster by spatial proximity

  2. For each cluster, build tight polygon (bounding box + edge expansions)

  3. Try combining multiple cluster polygons into valid shapes

  4. Score candidates by exact fish counting

  5. Run 30-40 restarts with diverse strategies

  6. Output best valid polygon (4-1000 vertices, perimeter <= 400,000)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
