    4. Merge rectangles via MST-based corridors

    5. Local search: expand/contract edges by ±50..200

    6. Try 8-12 different construction strategies

    Ensure <2.0s execution, valid output format (m then vertices).'
  evaluate_solution: Run C++ program. Returns score (mackerels-sardines+1), validity, and remaining evaluations (budget=30).
  probe_solution: NOT useful - full evaluation needed for accurate scoring.
  finish: End when you have encoded a working point-level clustering solution that beats the seed score of 2.48436.
