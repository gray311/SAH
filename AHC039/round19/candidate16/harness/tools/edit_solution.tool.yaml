type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with C++ implementing point-level clustering and rectangle construction:

  1. Cluster mackerels by spatial proximity (~10000 distance threshold)

  2. Compute tight bounding boxes per cluster

  3. Expand boundaries to exclude nearby sardines

  4. Merge rectangles via MST-based corridors

  5. Local search: expand/contract edges by ±50..200

  6. Try 8-12 different construction strategies

  Ensure <2.0s execution, valid output format (m then vertices).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
