type: tool
name: refine_rectangle
description: Refine a rectangle by expanding/shrinking edges to optimize mackerel capture while excluding
  sardines
input_schema:
  type: object
  properties:
    rect:
      type: object
      properties:
        min_x:
          type: integer
        max_x:
          type: integer
        min_y:
          type: integer
        max_y:
          type: integer
    shift:
      type: integer
      enum:
      - -200
      - -100
      - -50
      - 50
      - 100
      - 200
