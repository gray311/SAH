type: tool
name: hex_shell
description: Construct hexagonal shell packing for circle packing. Takes target_sum and max_shells as
  input, returns centers and radii.
input_schema:
  type: object
  properties:
    target_sum:
      type: number
      description: Target sum of radii to achieve
    max_shells:
      type: integer
      description: Maximum number of hexagonal shells to use
    _sah_py_path:
      type: string
      const: ./custom_tools/hex_shell.py
      description: Trusted dispatcher binding; omit from tool calls.
  required: []
  additionalProperties: false
