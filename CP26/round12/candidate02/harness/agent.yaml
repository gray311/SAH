type: agent
name: inner_h2_candidate
description: Candidate H2 generated by the outer loop (M_phi + H1).
max_context_tokens: 131072
system_prompt: ./prompt.md
system_prompt_type: file
tool_call_mode: structured
max_iterations: 36
retry_attempts: 2
retry_backoff_max_seconds: 30
timeout: 600
llm_config:
  model: qwen3.5-9b
  base_url: http://127.0.0.1:8800/v1
  api_key: EMPTY
  api_type: openai_chat_completion
  max_tokens: 8192
  temperature: 0.7
  top_p: 0.95
  extra_body:
    top_k: 20
  stream: false
sandbox_config:
  type: local
  work_dir: /tmp
tools:
- name: edit_solution
  yaml_path: ./tools/edit_solution.tool.yaml
  binding: inner.harness.tools.discovery:edit_solution
- name: evaluate_solution
  yaml_path: ./tools/evaluate_solution.tool.yaml
  binding: inner.harness.tools.discovery:evaluate_solution
- name: probe_solution
  yaml_path: ./tools/probe_solution.tool.yaml
  binding: inner.harness.tools.discovery:probe_solution
- name: finish
  yaml_path: ./tools/finish.tool.yaml
  binding: inner.harness.tools.discovery:finish
- name: quick_probe_k0
  yaml_path: ./tools/quick_probe_k0.tool.yaml
  binding: inner.harness.tools.custom_runtime:custom_tool
  extra_kwargs:
    _sah_py_path: ./custom_tools/quick_probe_k0.py
- name: quick_probe_k1
  yaml_path: ./tools/quick_probe_k1.tool.yaml
  binding: inner.harness.tools.custom_runtime:custom_tool
  extra_kwargs:
    _sah_py_path: ./custom_tools/quick_probe_k1.py
- name: quick_probe_k1b
  yaml_path: ./tools/quick_probe_k1b.tool.yaml
  binding: inner.harness.tools.custom_runtime:custom_tool
  extra_kwargs:
    _sah_py_path: ./custom_tools/quick_probe_k1b.py
stop_tools:
- finish
skills:
- ./skills/discovery-optimization
middlewares:
- import: middlewares.budget_reminder:BudgetReminderMiddleware
  params:
    remind_from_left: 3
- import: middlewares.stall_restart:StallRestartMiddleware
  params:
    stall_after: 8
    max_restarts: 2
- import: nexau.archs.main_sub.execution.middleware.long_tool_output:LongToolOutputMiddleware
  params:
    max_output_chars: 8000
    head_lines: 40
    tail_lines: 20
    head_chars: 4000
    tail_chars: 4000
    bypass_tool_names:
    - finish
    - LoadSkill
- import: nexau.archs.main_sub.execution.middleware.round_and_token_reminder:RoundAndTokenReminderMiddleware
  params:
    max_context_tokens: 131072
    desired_max_tokens: 8192
tracers:
- import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
