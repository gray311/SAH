type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. Two formats:

  (1) PREFERRED — targeted SEARCH/REPLACE diff blocks matching current program exactly

  (2) Full rewrite — complete new EVOLVE-BLOCK body


  Focus on vectorizing loops, pre-computing indices, and replacing manual min-finding with torch operations.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
