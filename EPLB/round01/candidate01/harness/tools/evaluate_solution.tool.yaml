type: tool
name: evaluate_solution
description: 'Run the algorithm and return combined_score (higher=better).

  Returns: combined_score, validity (1=valid, 0=invalid), error (if any), best_score_so_far, evaluations_left.


  Use: score improves → keep direction; score same/worse → try different optimization; validity=0 → fix
  bug.'
