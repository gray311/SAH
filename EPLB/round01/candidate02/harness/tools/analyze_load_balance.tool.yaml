type: tool
name: analyze_load_balance
description: 'Task-specific probe for expert parallelism load balancer optimization.

  Analyzes the current expert allocation algorithm without running the

  full evaluator. Returns load_balance_score (0-1, higher=better),

  execution_time_estimate_ms, and structural_notes about issues found.

  Executes in ~1-2s on CPU (fast!), does NOT consume evaluation budget,

  and can be called up to 30 times. Use this in EVERY iteration to

  quickly filter bad candidates before spending precious evals.'
