type: tool
name: edit_solution
description: "Change code in EVOLVE-BLOCK. Use targeted SEARCH/REPLACE or full rewrite.\nPreserve function\
  \ signatures. For algorithm optimizations, prefer full \nfunction-level rewrites over small diffs when\
  \ changing the approach.\n\nCommon patterns:\n- Loop replacement: nested for to vectorized index assignment\n\
  - Sort-and-distribute: sort descending, cumsum weights, assign packs\n- Pre-allocation: allocate final\
  \ tensor shapes once"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
