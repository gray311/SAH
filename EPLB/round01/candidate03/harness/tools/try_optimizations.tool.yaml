type: tool
name: try_optimizations
description: "Systematically test multiple algorithm optimization variants. \nFor expensive algorithm\
  \ search spaces, this tool explores 3-5 variants \nwith mini-runs, scores them via probe, and recommends\
  \ the best direction.\nCall when you have a working base algorithm but want to explore \nalgorithm families\
  \ systematically."
input_schema:
  type: object
  properties:
    base_approach:
      type: string
      default: current
      description: Base function name to optimize
    variant_families:
      type: array
      items:
        type: string
      description: List of optimization families to try, e.g. [vectorize, water-filling, precompute_stats,
        divide_conquer]
    num_trials:
      type: integer
      minimum: 3
      maximum: 10
      description: How many variants to synthesize and compare
