type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. For algorithmic improvements, send the complete new EVOLVE-BLOCK
  body as plain Python code.

  Preserve the fixed entry function rebalance_experts_hierarchical and all imports outside the block.

  Replace slow loops with vectorized PyTorch ops.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
