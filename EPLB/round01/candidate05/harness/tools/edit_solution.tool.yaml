type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. Use targeted SEARCH/REPLACE diffs

  for small changes, or full rewrites for major algorithmic redesigns. The fixed entry

  function and imports outside the block are preserved. Key areas to modify: the

  balanced_packing function''s O(n^2) loop, the expert assignment logic, and any

  inefficient constructions.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
