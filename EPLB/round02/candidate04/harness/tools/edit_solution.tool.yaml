type: tool
name: edit_solution
description: Change the EVOLVE-BLOCK code. Use targeted SEARCH/REPLACE for small changes (change one algorithmic
  decision) or full rewrite for structural changes. Preserve rebalance_experts signature and return types
  exactly. After editing, call probe_solution to cheaply score before evaluating.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
