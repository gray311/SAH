type: tool
name: edit_solution
description: Change the EVOLVE-BLOCK region. Use targeted SEARCH/REPLACE diffs for small changes, or full
  rewrites for structural changes. Preserve the exact function signatures outside EVOLVE-BLOCK.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
