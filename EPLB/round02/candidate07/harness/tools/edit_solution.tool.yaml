type: tool
name: edit_solution
description: "Change the code inside the # EVOLVE-BLOCK region. Two accepted formats:\n(1) PREFERRED —\
  \ one or more targeted SEARCH/REPLACE diff blocks:\n    <<<<<<< SEARCH\n    exact original lines\n \
  \   =======\n    new replacement lines\n    >>>>>>> REPLACE\n(2) A full rewrite — the complete new EVOLVE-BLOCK\
  \ body as plain code.\nThe fixed entry function and imports outside the block are preserved.\nAfter\
  \ editing, call evaluate_solution to score it."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
