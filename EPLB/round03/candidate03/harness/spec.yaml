schema: h2spec/1.0
system_prompt: |
  You are an expert performance engineer for MoE EPLB load balancing.
  Task: Improve rebalance_experts_hierarchical to achieve better load balance AND efficiency.
  
  Evaluator rewards: 1) lower load variance, 2) fewer operations/faster runtime.
  
  STRATEGY:
  1. Complete the stubbed rebalance_experts_hierarchical function
  2. Use hierarchical grouping: group by nodes first (NVLink faster), then GPUs
  3. Use torch.sort and vectorized ops instead of Python loops
  4. For small inputs, try multiple packings and pick best (bounded search)
  5. When budget_left < 4, call finish() immediately
  
  Function signature (MUST PRESERVE):
  weight: [num_moe_layers, num_logical_experts]
  num_physical_experts: int
  num_groups: int
  num_nodes: int (faster intra-node)
  num_gpus: int (must be multiple of num_nodes)
  
  Return: (physical_to_logical_map, logical_to_physical_map, logical_count)
  
  Use SEARCH/REPLACE diffs. Preserve all code outside your edits.
  After completing the function, use probe_solution to rank variants before full evals.
new_tools:
  - name: diagnose_load
    description: |
      Run the current algorithm on minimal input (4 layers, 16 experts)
      and return load variance, max load, and balance status.
      Costs NO evaluation budget. Use this after completing the function.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          import torch
          prog = ctx.get_program()
          
          if 'def rebalance_experts_hierarchical' not in prog:
              return {
                  "error": "Function not found - complete rebalance_experts_hierarchical first",
                  "load_variance": 1.0, "max_load": 1.0, "is_balanced": False
              }
          
          test_weight = torch.randn(4, 16).abs()
          test_weight = torch.softmax(test_weight, dim=-1)
          test_physical = 32
          test_groups = 4
          test_nodes = 2
          test_gpus = 8
          
          try:
              # Extract function
              lines = prog.split('\n')
              start = next(i for i, l in enumerate(lines) if 'def rebalance_experts_hierarchical(' in l)
              func_lines = []
              indent = len(lines[start]) - len(lines[start].lstrip())
              for i in range(start, len(lines)):
                  if i == start:
                      func_lines.append(lines[i])
                      continue
                  curr = len(lines[i]) - len(lines[i].lstrip()) if lines[i].strip() else float('inf')
                  if curr <= indent and lines[i].strip() and not lines[i].strip().startswith('#'):
                      break
                  func_lines.append(lines[i])
              func_code = '\n'.join(func_lines)
              
              namespace = {
                  'torch': torch, 'tuple': tuple, 'int': int, 'float': float,
                  'list': list, 'dict': dict, 'assert': assert, 'range': range,
                  'max': max, 'min': min, 'mean': torch.mean, 'var': torch.var,
                  'argmax': torch.argmax, 'sort': torch.sort, 'softmax': torch.softmax
              }
              
              # Find and exec function
              import re
              match = re.search(r'def rebalance_experts_hierarchical\([^)]*\):', func_code)
              if not match:
                  return {"error": "Could not find function definition", "load_variance": 1.0}
              
              start_match = func_code.find('def rebalance_experts_hierarchical(')
              end_match = func_code.find('\n\ndef ', start_match)
              if end_match == -1:
                  end_match = func_code.rfind(')')
              func_code = func_code[start_match:end_match]
              
              exec(func_code, namespace)
              
              result = namespace['rebalance_experts_hierarchical'](
                  test_weight, test_physical, test_groups, test_nodes, test_gpus
              )
              
              if isinstance(result, tuple) and len(result) >= 1:
                  map0 = result[0]
                  num_phys = map0.shape[1] if map0.ndim == 2 and map0.shape[1] > 0 else 32
                  loads = torch.zeros(num_phys, dtype=torch.float32)
                  if len(result) > 1:
                      map1 = result[1]
                      if map1.ndim == 2 and map1.shape[0] == 4 and map1.shape[1] == 4:
                          for i in range(4):
                              targets = map1[i]
                              for j in range(4):
                                  loads[targets[j]] += 1.0
                  
                  if loads.numel() > 0:
                      var = torch.var(loads).item()
                      mx = torch.max(loads).item()
                      return {
                          "load_variance": float(var),
                          "max_load": float(mx),
                          "avg_load": float(torch.mean(loads).item()),
                          "is_balanced": var < 1.0,
                          "recommendation": "var={:.4f}, balanced={}".format(var, var < 1.0)
                      }
              
              return {"error": "Unexpected result structure", "load_variance": 1.0}
              
          except Exception as e:
              return {"error": str(e)[:150], "load_variance": 1.0, "is_balanced": False}
new_skills:
  - name: eplb-hierarchical-balance
    description: |
      Complete MoE EPLB rebalancing with hierarchical grouping and vectorized ops.
      Group by nodes first (NVLink), then GPUs. Use torch.sort for speed.
    body: |
      # MoE EPLB Hierarchical Balancing Playbook
      
      ## Objective
      Complete rebalance_experts_hierarchical to:
      - Balance expert loads across physical replicas
      - Be efficient (use torch ops, avoid Python loops)
      
      ## Function Signature
      def rebalance_experts_hierarchical(
          weight: torch.Tensor,  # [num_moe_layers, num_logical_experts]
          num_physical_experts: int,
          num_groups: int,
          num_nodes: int,  # faster intra-node
          num_gpus: int
      ) -> tuple[physical_to_logical_map, logical_to_physical_map, logical_count]
      
      ## Implementation Steps
      
      1. **Hierarchical Grouping**:
         - Divide experts by num_nodes: experts_per_node = num_logical_experts // num_nodes
         - For each node, balance locally
         - Then balance across nodes using num_gpus
      
      2. **Efficient Packing** (based on seed's balanced_packing):
         - Sort weights per layer: sorted_idx = weight[i].sort(descending=True).indices
         - Pre-allocate pack_index and rank tensors
         - Use torch.argmin for tie-breaking (faster than Python min)
         - Avoid Python for-loops; use tensor indexing
      
      3. **Replication**:
         - Compute weight/logcnt ratio
         - Use argmax to find replication targets
         - Vectorize updates
      
      4. **Vectorized Patterns**:
         
         Bad: for i in range(num_layers): ...
         Good: all_sorted = torch.stack([weight[i].sort(...).indices for i in range(num_layers)])
         
         Bad: best = min(range(k), key=lambda x: weights[x])
         Good: best = torch.argmin(torch.tensor(weights))
      
      5. **Bounded Search** (optional):
         - For small inputs (< 32 experts), try k packings (k=3)
         - Pick lowest variance
         - Fast and improves quality
      
      ## Example Skeleton
      
      ```python
      def rebalance_experts_hierarchical(weight, num_physical_experts, num_groups, num_nodes, num_gpus):
          num_layers, num_logical = weight.shape
          
          # Hierarchical: group by node
          experts_per_node = num_logical // num_nodes
          node_groups = []
          for n in range(num_nodes):
              start = n * experts_per_node
              end = min((n+1) * experts_per_node, num_logical)
              node_groups.append(weight[:, start:end])
          
          # Balance within each node...
          # Then across nodes...
          
          return physical_to_logical_map, logical_to_physical_map, logical_count
      ```
      
      ## Tips
      - Use torch.sort, torch.argmin, torch.stack for vectorization
      - Pre-allocate all tensors
      - Complete ALL parameters
      - Use diagnose_load after completing to check balance
      - Use probe_solution before full evals to rank variants
new_middlewares:
  - name: probe_before_eval
    hook: before_model
    description: |
      Remind solver to use probe_solution for algorithm ranking before full evaluations.
    implementation_py: |
      def before_model(hook_input):
          left = hook_input.get("evaluations_left", 20)
          if left > 5:
              return "Evals remaining: use probe_solution to rank algorithm variants on small inputs before full evaluation."
          elif left <= 5:
              return "Budget low! Finish with best result. No more probing."
          return None
