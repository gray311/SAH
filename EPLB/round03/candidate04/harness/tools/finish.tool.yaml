type: tool
name: finish
description: End when budget exhausted or no improvement. For this task, call finish with a summary of
  the packing strategy that worked (e.g., \"greedy by weight with hierarchical grouping\").
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
