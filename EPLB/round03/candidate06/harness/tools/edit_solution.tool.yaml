type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. Use TARGETED SEARCH/REPLACE diffs (preferred)
  or full rewrite.

  For this task: modify the rebalance_experts_hierarchical or balanced_packing function logic, NOT the
  signature.

  Example SEARCH/REPLACE pattern:

  <<<<<<< SEARCH

  pack_items[p] += 1

  >>>>>>> REPLACE

  pack_items[p] = pack_items[p] + 1  # Add comment or small tweak

  After editing, call evaluate_solution to score.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
