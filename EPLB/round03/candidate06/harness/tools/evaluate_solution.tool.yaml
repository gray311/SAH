type: tool
name: evaluate_solution
description: 'Run the program and return combined_score (higher is better). Scores incorporate: load balance
  (lower variance) and efficiency (fewer ops).

  Returns: combined_score, validity, error, best_so_far, evaluations_left.

  With ~20 evaluations, be strategic: probe first, evaluate only top candidates.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
