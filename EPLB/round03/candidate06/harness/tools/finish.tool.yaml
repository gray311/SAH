type: tool
name: finish
description: 'End the session when: (1) budget exhausted, or (2) no improvement over best_so_far after
  3 attempts.

  Call finish with a 1-line summary: "Best score: X using Greedy+LocalSearch technique".'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
