type: tool
name: edit_solution
description: Change the code in the EVOLVE-BLOCK. Focus on vectorized torch operations, efficient data
  structures, smarter heuristics. Preserve the function signature.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
