type: tool
name: edit_solution
description: "Change the EVOLVE-BLOCK code. For this task: rewrite balanced_packing() to use vectorized\
  \ torch operations.\n\nFocus on replacing Python loops with:\n- torch.sort(), argsort() for ordering\n\
  - torch.div() or range arithmetic for pack assignment\n- Pre-allocated tensors instead of list appends\n\
  \nExample pattern:\nOLD: for group in indices: for p in valid: ...\nNEW: sorted_idx = weight[i].argsort(descending=True)\n\
  \     pack_idx = torch.arange(num_groups) // groups_per_pack\n\nAfter editing, call evaluate_solution\
  \ to score."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
