type: tool
name: finish
description: 'End session when: (1) budget exhausted, or (2) no improvement over best_so_far after 3 attempts.

  Summary format: "Best score: X using Vectorized-binning strategy"'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
