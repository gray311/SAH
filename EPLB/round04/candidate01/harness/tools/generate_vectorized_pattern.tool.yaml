type: tool
name: generate_vectorized_pattern
description: 'Generate a specific vectorized pattern for balanced_packing. Choose from: (1) simple rank
  assignment, (2) weight-aware scatter, (3) bin-exhaustion with tensor ops.'
input_schema:
  type: object
  properties:
    pattern_type:
      type: string
      enum:
      - rank-assignment
      - weight-scatter
      - bin-exhaustion
