type: tool
name: edit_solution
description: 'Change EVOLVE-BLOCK code. For balanced_packing, you may provide FULL rewrite (it is core
  to improvement).

  Use SEARCH/REPLACE for targeted edits. Preserve function signature exactly.

  When rewriting balanced_packing, return complete function with three outputs: pack_index, rank_in_pack.

  Example full rewrite structure returns pack_index and rank_in_pack tensors.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
