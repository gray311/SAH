type: tool
name: edit_solution
description: "Change balanced_packing() or replicate_experts() to FULLY VECTORIZED implementation.\n\n\
  Do NOT make incremental edits. Write a COMPLETE new function that:\n- Uses torch.argsort() instead of\
  \ sorting loop\n- Pre-allocates all tensors with torch.zeros() or torch.full()\n- Uses // and % for\
  \ index computation\n- Avoids all Python for-loops over groups/items\n- Preserves exact function signature\n\
  \nExample pattern:\nbalanced_packing(weight, num_packs):\n    num_layers, num_groups = weight.shape\n\
  \    groups_per_pack = num_groups // num_packs\n    \n    if groups_per_pack == 1:\n        pack_index\
  \ = torch.arange(num_groups, dtype=torch.int64, device=weight.device).view(1, -1).expand(num_layers,\
  \ -1)\n        rank_in_pack = torch.zeros_like(weight, dtype=torch.int64)\n        return pack_index,\
  \ rank_in_pack\n    \n    sorted_indices = torch.argsort(-weight, dim=-1)\n    pack_index = (sorted_indices\
  \ // groups_per_pack) % num_packs\n    rank_in_pack = sorted_indices % groups_per_pack\n    \n    return\
  \ pack_index, rank_in_pack"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
