type: tool
name: finish
description: "End session when: (1) all 20 evals used, or (2) after replacing both functions with vectorized\
  \ versions.\n  Summary format: Best score: X using vectorized balanced_packing+replicate_experts replacing\
  \ O(n2) loops with O(n log n) torch.ops"
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
