type: tool
name: finish
description: 'End session. Call after:

  - Evaluating your best variant (and it improved on seed)

  - Exhausting budget with no improvement

  - Confirming no further improvements possible'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
