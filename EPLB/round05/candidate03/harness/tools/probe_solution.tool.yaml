type: tool
name: probe_solution
description: 'Cheap approximate evaluation (~10s). Use to rank YOUR variants.


  Strategy:

  1. Probe 3-5 variants with different implementations

  2. Check probe scores - they should show ~same load variance, ~different runtime

  3. Pick top 2 by runtime

  4. Evaluate those 2 with evaluate_solution

  5. Call finish after evaluation


  Probe scores are approximate but consistent. Use them to avoid wasting eval budget.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
