type: tool
name: edit_solution
description: 'Rewrite balanced_packing() using Phase 1 vectorized FFD.

  Key changes:

  1. Use argsort to sort once per layer

  2. Track pack_items and pack_weights as tensors

  3. Use torch.argmin on stacked [items, weight] for greedy selection

  4. Map results back to original order

  Preserve function signature and imports.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
