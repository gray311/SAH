type: tool
name: edit_solution
description: 'Edit EVOLVE-BLOCK. REWRITE balanced_packing() using: sorted_idx = weight.argsort(dim=-1,
  descending=True); pack_idx = sorted_idx // groups_per_pack; rank_in_pack = sorted_idx % groups_per_pack

  DO NOT use Python for-loops over groups or packs. Preserve function signature.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
