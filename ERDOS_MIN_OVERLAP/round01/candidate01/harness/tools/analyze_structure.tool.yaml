type: tool
name: analyze_structure
description: 'Analyze the current Erdos optimizer configuration and report key diagnostics.

  Call this ONCE at the start to understand your baseline before making changes.

  It examines num_intervals, penalty_strength, and reports on constraint satisfaction.

  Then suggests optimal num_intervals for better resolution and recommends if

  hyperparameters should be adjusted. Useful for planning coarse-to-fine exploration.'
