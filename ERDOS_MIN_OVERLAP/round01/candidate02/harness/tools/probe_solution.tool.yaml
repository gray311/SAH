type: tool
name: probe_solution
description: 'Run a cheap probe on the CURRENT program. Accepts a dict of args specifying:

  - `init_pattern` (optional): "random", "sinusoidal", "piecewise", or a list of initial values

  - `num_intervals` (optional): override the default, e.g., 50, 100, 200

  - `learning_rate` (optional): override default, e.g., 0.01, 0.1

  - `num_steps` (optional): override default, e.g., 500, 1000 (probe uses few steps)

  - `penalty_strength` (optional): override default

  The tool internally runs a fast optimization with few iterations and returns an

  approximate score. Use this to test 3-5 variants before full evaluation. Returns

  dict with approximate_combined_score and a note about the probe nature of the score.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
