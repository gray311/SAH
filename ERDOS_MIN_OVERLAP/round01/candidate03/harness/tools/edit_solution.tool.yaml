type: tool
name: edit_solution
description: 'Change the code inside the # EVOLVE-BLOCK region. Preferred: SEARCH/REPLACE diffs for targeted
  changes. Alternatively, full rewrite of the EVOLVE-BLOCK body. The fixed entry function and imports
  outside are preserved.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
