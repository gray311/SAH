type: tool
name: edit_solution
description: 'Change the code in the EVOLVE-BLOCK region. Format options:

  1. TARGETED SEARCH/REPLACE: Locate exact lines to change and provide diff blocks

  2. FULL REWRITE: Provide complete new EVOLVE-BLOCK body

  The fixed entry function (run) and imports outside the block are preserved.

  After editing, call evaluate_solution to score.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
