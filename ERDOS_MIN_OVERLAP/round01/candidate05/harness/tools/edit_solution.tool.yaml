type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK region. Use targeted SEARCH/REPLACE for small changes, or full rewrite
  for structural changes. Keep imports and entry function unchanged.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
