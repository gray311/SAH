type: tool
name: edit_solution
description: 'Change the code in EVOLVE-BLOCK. Use SEARCH/REPLACE diffs or full rewrites. Preserve the
  entry function signature: returns (final_h_values, c5_bound, num_intervals). The internal implementation
  may change significantly.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
