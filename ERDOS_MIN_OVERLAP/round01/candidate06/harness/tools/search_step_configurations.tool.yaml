type: tool
name: search_step_configurations
description: 'Run multiple bounded internal searches over step function parameterizations. Tests: (1)
  coordinate descent optimizing each interval height directly in [0,1], (2) grid search over reduced subspace
  of intervals, (3) alternating pattern initializations, (4) uniform + constraint-satisfying adjustments.
  Returns the best h configuration and its objective score.'
