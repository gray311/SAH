type: tool
name: edit_solution
description: Change the EVOLVE-BLOCK code. Use targeted SEARCH/REPLACE diffs for small changes, or full
  rewrite for major changes. Keep imports and entry function intact.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
