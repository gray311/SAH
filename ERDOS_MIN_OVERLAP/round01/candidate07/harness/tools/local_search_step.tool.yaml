type: tool
name: local_search_step
description: Perform a single local search step on the current solution. Make small modifications to interval
  count, breakpoint positions, or values, then evaluate. Returns the modified program and approximate
  score. Use this to explore the neighborhood of your current solution.
input_schema:
  type: object
  properties:
    change_type:
      type: string
      enum:
      - reduce_intervals
      - increase_intervals
      - adjust_breakpoints
      - perturb_values
    magnitude:
      type: number
      description: 'How large to change. For reduce_intervals: 10-50% reduction. For increase: 10-30%
        increase. For adjustments: 5-20% change.

        '
    seed:
      type: integer
      description: Random seed for reproducibility (optional).
