schema: h2spec/1.0
system_prompt: "You are an expert mathematician and software developer optimizing step functions for the Erdos minimum overlap problem.\n\nOBJECTIVE: Find h: [0,2] -> [0,1] minimizing max_k integral(h(x)*(1-h(x+k))) dx, subject to integral(h) = 1.\nBest known bound: 0.38092303510845016. You must beat this.\n\nSTRATEGY: Don't rely solely on gradient descent. Generate diverse step function constructions and compare them internally before committing.\nKey approaches to try:\n1. Structured constructions: block-based functions, sine-wave modulations\n2. Randomized perturbations: small changes to promising solutions\n3. Multiple construction methods: compare 2-3 different designs internally\n4. Fine-tuning: use gradient descent only on promising candidates\n\nWORKFLOW:\n1. Generate 3-5 diverse candidate functions using the generate_variants tool\n2. Use probe_solution to quickly rank them (cheap, ~2000 row subsample)\n3. Pick the best 2-3, refine with gradient descent\n4. Evaluate final candidates with evaluate_solution\n5. Keep the highest combined_score\n\nCONSTRAINTS: h(x) must stay in [0,1] and integral(h)=1. Use sigmoid activation and penalty terms.\n\nTools: generate_variants (create diverse candidates), probe_solution (cheap ranking), edit_solution (apply changes), evaluate_solution (official score), finish (end session)."
skill_description: "Optimize step functions for Erdos minimum overlap. Generate diverse candidates, probe/rank cheaply, then evaluate. Focus on construction diversity and hybrid optimization strategies."
skill_body: "# Erdos Minimum Overlap Optimization\n\n## Task\nMinimize max_k integral(h(x)*(1-h(x+k))) dx where h: [0,2]->[0,1] and integral(h)=1.\n\n## Strategy\nDIVERSITY FIRST: Generate multiple construction methods, compare internally, then refine.\n\n### Construction Approaches\n1. Block Functions: Partition [0,2] into equal intervals, set h constant per block\n2. Sine-based: h(x) = 0.5 + A*sin(B*x) adjusted for constraints\n3. Random Perturbations: Start from a good seed, add controlled noise\n4. Two-Bump: Concentrate mass in two regions\n\n### Workflow\n1. Call generate_variants(num=5) to create diverse candidates\n2. For each candidate, call probe_solution to get quick scores\n3. Rank candidates: top 3 get gradient descent refinement\n4. For each refined candidate: edit_solution, evaluate_solution\n5. Track best combined_score (0.380923.../C5_bound). Must exceed 1.0.\n\n### Debugging\n- If validity=0: check sigmoid clips values, integral penalty, array sizes\n- If scores don't improve: try different construction method, adjust learning rate\n- If timeout: reduce num_steps or num_intervals\n\n## Tools\n- generate_variants: Creates N diverse step functions using different strategies\n- probe_solution: Cheap score on ~2000-row subsample, doesn't cost evaluation budget\n- edit_solution: Modify EVOLVE-BLOCK code\n- evaluate_solution: Official score (costs evaluation budget)\n- finish: End session when done"
tool_descriptions:
  edit_solution: 'Change code in EVOLVE-BLOCK region. Use targeted SEARCH/REPLACE diffs for small changes, or full rewrite for major restructurings. Preserve entry function signature.'
  evaluate_solution: 'Run full evaluation. Returns combined_score (higher better), validity (0=constraint violated), error, best_so_far, evals_left. Costs 1 from 20 total.'
  probe_solution: 'Cheap approximate score on first ~2000 rows of input data. Separate probe budget of 30 calls. Scores are approximate and NOT comparable to evaluate_solution - use for ranking variants quickly.'
  finish: 'End session when budget exhausted or no more improvements possible. Best score automatically submitted.'
sampling:
  temperature: 0.3
  top_p: 0.9
  top_k: 10
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 12000
new_tools:
  - name: generate_variants
    description: |
      Generate N diverse step function candidates for Erdos minimum overlap.\nUses multiple strategies: block partitions, sine modulations, random\nperturbations, and two-bump constructions. Returns N self-contained code\nsnippets for the EVOLVE-BLOCK, each representing a different function design.\nCall at the start to explore the solution space before committing to one approach.\n    input_schema: {type: object, properties: {num: {type: integer, minimum: 2, maximum: 10}}, default: {"num": 5}}
    implementation_py: |
      def run(ctx, args):
          import random
          import math
          num = args.get("num", 5)
          num_intervals = 200
          dx = 2.0 / num_intervals
          variants = []
          v1 = "num_intervals = " + str(num_intervals) + "\nlearning_rate = 0.005\nnum_steps = 20000\npenalty_strength = 1000000.0\n\nh_values = []\nfor i in range(num_intervals):\n    x = i * " + str(dx) + "\n    if x < 0.2:\n        h_values.append(0.1)\n    elif x < 0.5:\n        h_values.append(0.6)\n    elif x < 1.0:\n        h_values.append(0.5)\n    elif x < 1.5:\n        h_values.append(0.6)\n    elif x < 1.8:\n        h_values.append(0.1)\n    else:\n        h_values.append(0.6)\n\nlatent_h_values = [math.logit(max(0.001, min(0.999, v))) for v in h_values]"
          variants.append(("block1", v1))
          v2 = "num_intervals = " + str(num_intervals) + "\nlearning_rate = 0.003\nnum_steps = 20000\npenalty_strength = 1500000.0\n\nh_values = []\nfor i in range(num_intervals):\n    x = i * " + str(dx) + "\n    if x < 0.2:\n        h_values.append(0.15)\n    elif x < 0.5:\n        h_values.append(0.55)\n    elif x < 1.0:\n        h_values.append(0.5)\n    elif x < 1.5:\n        h_values.append(0.55)\n    elif x < 1.8:\n        h_values.append(0.15)\n    else:\n        h_values.append(0.55)\n\nlatent_h_values = [math.logit(max(0.001, min(0.999, v))) for v in h_values]"
          variants.append(("block2", v2))
          v3 = "num_intervals = " + str(num_intervals) + "\nlearning_rate = 0.003\nnum_steps = 20000\npenalty_strength = 2000000.0\n\nimport math\nh_values = []\nfor i in range(num_intervals):\n    x = i * " + str(dx) + "\n    h_val = 0.5 + 0.3 * math.sin(x * math.pi / 0.8)\n    h_val = max(0.0, min(1.0, h_val))\n    h_values.append(h_val)\n\nlatent_h_values = [math.logit(max(0.001, min(0.999, v))) for v in h_values]"
          variants.append(("sine", v3))
          v4 = "num_intervals = " + str(num_intervals) + "\nlearning_rate = 0.004\nnum_steps = 18000\npenalty_strength = 1500000.0\n\nh_values = []\nfor i in range(num_intervals):\n    x = i * " + str(dx) + "\n    if x < 0.2 or 1.7 <= x <= 1.9:\n        h_val = 0.8\n    elif 0.2 <= x <= 0.8 or 1.1 <= x <= 1.5:\n        h_val = 0.3\n    else:\n        h_val = 0.2\n    h_values.append(h_val)\n\nlatent_h_values = [math.logit(max(0.001, min(0.999, v))) for v in h_values]"
          variants.append(("two_bump", v4))
          v5 = "num_intervals = " + str(num_intervals) + "\nlearning_rate = 0.003\nnum_steps = 20000\npenalty_strength = 1200000.0\n\nimport math, random\nrandom.seed(1234)\nh_values = []\nfor i in range(num_intervals):\n    x = i * " + str(dx) + "\n    if x < 0.4 or 1.6 <= x <= 1.8:\n        h_val = 0.5 + 0.15\n    elif x < 0.8 or 1.2 <= x <= 1.5:\n        h_val = 0.5 - 0.1\n    else:\n        h_val = 0.35\n    h_values.append(h_val)\n    h_values[-1] += random.gauss(0, 0.01)\n    h_values[-1] = max(0.0, min(1.0, h_values[-1]))\n\nlatent_h_values = [math.logit(max(0.001, min(0.999, v))) for v in h_values]"
          variants.append(("random", v5))
          v6 = "num_intervals = " + str(num_intervals) + "\nlearning_rate = 0.004\nnum_steps = 16000\npenalty_strength = 800000.0\n\nh_values = []\nfor i in range(num_intervals):\n    x = i * " + str(dx) + "\n    if x < 0.1:\n        h_val = 0.15\n    elif x < 0.3:\n        h_val = 0.55\n    elif x < 0.6:\n        h_val = 0.45\n    elif x < 1.0:\n        h_val = 0.55\n    elif x < 1.4:\n        h_val = 0.45\n    elif x < 1.6:\n        h_val = 0.5\n    elif x < 1.7:\n        h_val = 0.15\n    else:\n        h_val = 0.5\n    h_values.append(h_val)\n\nlatent_h_values = [math.logit(max(0.001, min(0.999, v))) for v in h_values]"
          variants.append(("refined", v6))
          return {"num_variants": len(variants), "variants": list(variants.keys())}
new_skills:
  - name: erdos-optimization-strategy
    description: "Optimize Erdos minimum overlap by generating diverse step function constructions, probing variants cheaply, then refining top candidates with gradient descent."
    body: |
      # Erdos Minimum Overlap Optimization Strategy
      
      ## Problem
      Find h: [0,2] -> [0,1] minimizing max_k integral(h(x)*(1-h(x+k))) dx, subject to integral(h) = 1.
      Target: beat C5 <= 0.38092303510845016 (combined_score > 1.0).
      
      ## Key Insight
      Gradient descent alone gets stuck in local minima. Use construction diversity + cheap probing.
      
      ## Method
      1. Generate 3-5 diverse variants using generate_variants:
         - Block-based partitions (4 blocks with varying heights)
         - Sine modulation: h(x) = 0.5 + A*sin(B*x)
         - Two-bump construction: mass in two regions
         - Random perturbations from known seeds
         - Refined blocks with smooth transitions
      
      2. Probe all variants with probe_solution (cheap, ~2000 rows):
         - Rank by approximate score
         - Select top 2-3 candidates
      
      3. Refine top candidates with targeted edit_solution:
         - Adjust learning_rate (0.003-0.005), num_steps (15000-20000), penalty_strength (800k-2M)
         - Run for 15000-20000 steps
         - Use smaller learning rate for fine-tuning
      
      4. Evaluate finalists with evaluate_solution:
         - Each costs 1 of 20 evaluations
         - Track best combined_score
         - Must exceed 1.0 to beat current bound
      
      ## Pitfalls
      - validity = 0: Check sigmoid clipping, integral constraint violation
      - Low scores: Try different construction method entirely
      - Timeouts: Reduce num_intervals or num_steps
      - Stalling: Reset to fresh construction after 5 iterations
      
      ## Tool Usage
      - generate_variants(num=5) -> diverse code snippets
      - probe_solution -> quick ranking of snippets
      - edit_solution -> insert chosen snippet into EVOLVE-BLOCK
      - evaluate_solution -> official score
      - finish -> end when done"
new_middlewares:
  - name: variant_gen_reminder
    hook: before_model
    description: "Remind solver to use generate_variants for construction diversity before gradient refinement"
    implementation_py: |
      def before_model(hook_input):
          iteration = hook_input.get("iteration", 0)
          score = hook_input.get("current_score", None)
          if iteration == 0:
              return "IMPORTANT: Call generate_variants(5) first to create diverse step function candidates. Do not start with gradient descent alone."
          elif iteration % 8 == 0 and score is not None:
              return "Cycle reminder: If you've been using the same construction method for 8 iterations, call generate_variants to explore a new approach."
          elif score is not None and score < 0.82:
              return "Stalled? Generate new variants and probe them before refining further."
          return None
