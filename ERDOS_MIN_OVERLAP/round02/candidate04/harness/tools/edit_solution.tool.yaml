type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK region. Implement structural search: generate discrete step functions
  with specified levels and breakpoints, then apply ONE-PASS gradient refinement (1000 steps), collect
  all candidates.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
