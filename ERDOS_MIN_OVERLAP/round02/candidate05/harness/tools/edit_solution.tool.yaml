type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK region. MUST implement multi-start strategy: generate 5-10 variants,
  short optimize each (5000 steps), probe top 3, full optimize best, evaluate. Keep imports and entry
  point.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
