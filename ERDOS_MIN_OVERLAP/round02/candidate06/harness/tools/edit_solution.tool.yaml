type: tool
name: edit_solution
description: 'Modify only the EVOLVE-BLOCK region. To change hyperparameters:

  1. Locate the Hyperparameters dataclass in lines 4-12

  2. Search/REPLACE just the numeric values (not the variable names)

  3. Change ONE parameter at a time (e.g., just penalty_strength)

  4. Keep imports and class structure unchanged'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
