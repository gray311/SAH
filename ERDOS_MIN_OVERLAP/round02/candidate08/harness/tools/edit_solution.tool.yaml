type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK. Preserve seed's 12-pattern initialization. Add adaptive training loop
  after optimizer init. Use SEARCH/REPLACE for targeted edits. Keep imports and entry function unchanged.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
