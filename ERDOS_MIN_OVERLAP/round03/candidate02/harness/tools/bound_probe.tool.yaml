type: tool
name: bound_probe
description: 'Fast approximate c5 bound using subsampled FFT. Returns an estimated c5_bound for a given
  h (after sigmoid). Does not consume the evaluation budget. Use this to quickly filter out weak candidates
  before optimization or full evaluation. Target: call before optimize and after optimization to rank
  candidates.'
input_schema:
  type: object
  properties:
    h:
      type: array
      description: latent vector (input to sigmoid)
      items:
        type: number
