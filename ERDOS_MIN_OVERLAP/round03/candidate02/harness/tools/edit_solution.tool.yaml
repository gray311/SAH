type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement bound_probe() and construct_structured_init().

  - bound_probe(h): Returns an approximate c5_bound using a subsampled FFT (e.g., N=800 with stride-2
  or subsampling 20% of intervals).

  - construct_structured_init(): Returns a dict with keys: bimodal_tight, triangular_3step, periodic_2,
  golomb_5, piecewise_const_2, piecewise_const_3.

  Integrate bound_probe into the optimization loop as a filter before full evaluation.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
