type: tool
name: edit_solution
description: Replace all gradient-based code with combinatorial construction evaluator. Implement exact
  step function generator and direct c5 computation via FFT. Enumerate (period_type, a, δ, N) tuples and
  report best c5_bound. Remove optax, jax.vmap, Adam optimizer.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
