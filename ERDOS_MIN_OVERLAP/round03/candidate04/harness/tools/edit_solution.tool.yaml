type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK. Call generate_hard_step_patterns() to get h arrays, edit _get_best_initialization
  to add hard_step mode, modify optimizer to use shorter runs and higher penalties. Always include probe_solution
  ranking.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
