type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK. Keep the ErdosOptimizer class intact. Add 3 blueprint functions outside
  the class. In _get_best_initialization, call these blueprints and try 2-3 random perturbations. Fine-tune
  each blueprint for 2000 steps before probing.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
