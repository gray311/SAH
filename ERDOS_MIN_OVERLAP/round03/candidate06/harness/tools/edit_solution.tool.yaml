type: tool
name: edit_solution
description: 'Edit EVOLVE-BLOCK to implement the two-peak asymmetric hypothesis:

  1. Replace _get_best_initialization with asymmetric bimodal at x=0.25, x=1.75

  2. Add width refinement loop: for w_left in [0.10,0.12,0.14], w_right in [0.16,0.18,0.20]

  3. Use probe_solution to rank all 9 width combinations

  4. Optimize top 2-3 with num_intervals=1600, lr=0.01, penalty=2000

  5. Evaluate best candidate'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
