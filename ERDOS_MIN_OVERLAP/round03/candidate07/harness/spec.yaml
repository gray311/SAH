    REMOVE all gradient descent code. REMOVE all latent vector optimization.
  evaluate_solution: |
    Run the discrete solver and return combined_score.
    combined_score = 0.38092303510845016 / c5_bound
    where c5_bound is computed from the best discrete step function found.
  probe_solution: |
    Compute c5 bound analytically using FFT (same as the solver's internal method).
    This is the PRIMARY search metric - used to rank variants during editing.
    Does NOT consume evaluation budget. Call this repeatedly during search.
    Returns the c5_bound value (lower is better).
  finish: |
    Called when you've exhausted search strategies. Summarize:
    - Best c5_bound found
    - Number of evaluations used
    - Key insight about what worked
