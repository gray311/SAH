type: tool
name: evaluate_best_candidate
description: 'Evaluate the best discrete step function configuration found.

  Computes c5_bound using FFT, returns combined_score.

  Used sparingly - only on top candidates.'
input_schema:
  type: object
  properties:
    config:
      type: object
      properties:
        h_values:
          type: array
          items:
            type: number
        break_points:
          type: array
          items:
            type: number
