type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK region. Implement internal_golomb_search() with internal parameter
  tuning over mark count, positions, kernels, and widths, then integrate results into phased optimization.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
