type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK. Implement analyze_structure_probe to generate 5 pure mathematical
  constructions with no noise, extract_best_construction to probe all and return the winner, and clean_optimize
  to optimize with tiny sigma=0.05 noise and integral normalization.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
