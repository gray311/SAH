type: tool
name: generate_step_specs
description: 'Generate 3-5 EXACT step function specifications for the Erdos problem. Each spec has sharp
  boundaries (no smoothing). Returns dict with keys: bimodal_sharp, triplateau, golomb_scaled, asym_steps,
  block_construct. Each value is a dict with: num_steps, positions (break points in [0,2)), values (heights
  in [0,1]), integral_raw (unnormalized integral). Uses pure step logic - NO Gaussians, NO sigmoid, NO
  noise.'
input_schema:
  type: object
  properties: {}
