type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK. Implement coarse-to-fine strategy with multiple optimizer variants.
  Change num_intervals (800 to 20 for coarse, 200 for refine, 800 for final). Use different optimizers
  per variant (SGD momentum, Adam coarse, L-BFGS). Run multiple seeds in parallel.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
