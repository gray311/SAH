system_prompt: |
  You are solving the Erdős minimum overlap problem by finding a step function h: [0,2]->[0,1] with integral=1 that minimizes max_k integral h(x)(1-h(x+k))dx.
  
  Current best bound: C5 <= 0.380923
  
  CRITICAL INSIGHT: The optimal solution is likely a COARSE, BINARY step function (very few intervals), not a smooth sigmoid curve. The seed program uses 800 intervals and sigmoid smoothing which PREVENTS finding such solutions.
  
  STRATEGY:
  1. Use generate_binary_constructions() to create EXPLICIT step functions (not smoothed)
  2. Use very FEW intervals (50-200, not 800)
  3. Use EXTREME penalty values (10000-50000) to enforce integral=1 hard
  4. Use simple, coarse initializations that create bimodal patterns
  5. Test multiple hyperparameter sets:
     - coarse_1: num_intervals=100, lr=0.01, steps=30000, penalty=20000
     - coarse_2: num_intervals=150, lr=0.005, steps=40000, penalty=30000
     - coarse_3: num_intervals=200, lr=0.02, steps=50000, penalty=40000
  6. Use probe_solution extensively to screen candidates
  7. Only evaluate final promising candidates
  
  What to edit:
  - Replace the EVOLVE-BLOCK's optimizer to use NUM_INTERVALS in [100, 150, 200]
  - Replace penalty_strength to be in [20000, 30000, 40000]
  - Add a simple binary initialization that creates step functions
  - Keep the FFT-based evaluation logic
skill_description: Coarse binary step function optimization for Erdos minimum overlap using extreme hyperparameters.
skill_body: |
  # Erdős C5 - Coarse Binary Step Functions
  
  ## Key Insight
  The optimal solution is likely a SIMPLE BINARY step function (values 0 or 1 only), NOT a smooth sigmoid curve. The seed program's 800 intervals and sigmoid smoothing prevents finding such solutions.
  
  ## Strategy: Coarse, Extreme
  1. Use few intervals: 100-200 (not 800) - this creates larger steps
  2. Extreme penalties: 20000-50000 to enforce integral=1 hard
  3. Binary initialization: Create explicit step patterns
  4. Coarse patterns to try:
     - Two narrow peaks at positions 0.25, 0.75
     - One peak at 0.5
     - Three-level patterns with jumps
  
  ## Workflow
  1. Call generate_binary_constructions() with different interval counts
  2. For each, run 2-3 hyperparameter variations
  3. Probe to rank, evaluate top 2
  
  ## Patterns that work for step functions:
  - Bimodal: high on [0.2-0.3] and [0.7-0.8], zero elsewhere
  - Central: high on [0.35-0.65], zero elsewhere
  - Tri-modal: three narrow peaks at 1/6, 1/2, 5/6
tool_descriptions:
  edit_solution: Modify EVOLVE-BLOCK. Use generate_binary_constructions() and set num_intervals to 100-200, penalty_strength to 20000-50000. Replace sigmoid initialization with binary patterns.
  evaluate_solution: Run program and return combined_score.
  probe_solution: Quick approximate eval on subsampled data.
  finish: Submit when combined_score > 1.0.
sampling:
  temperature: 1.1
  top_p: 0.98
  top_k: 30
  max_tokens: 16000
agent:
  max_iterations: 70
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
  - name: generate_binary_constructions
    description: Generate 5-6 explicit binary step function initializations for the Erdos problem using few intervals (100-200). Returns dict with latent vectors that are BINARY step patterns (not smoothed sigmoids).
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          N_choices = [100, 150, 200]
          constructions = {}
          for N in N_choices:
              domain = 2.0
              x = np.linspace(0, domain, N)
              dx = domain / N
              
              # Binary step pattern 1: bimodal tight
              h1 = np.zeros(N)
              h1[(x >= 0.2) & (x < 0.3)] = 4.0
              h1[(x >= 0.7) & (x < 0.8)] = 4.0
              h1 = np.clip(h1, 0, 10)
              
              # Binary step pattern 2: central peak
              h2 = np.zeros(N)
              h2[(x >= 0.35) & (x < 0.65)] = 4.0
              h2 = np.clip(h2, 0, 10)
              
              # Binary step pattern 3: three peaks
              h3 = np.zeros(N)
              h3[(x >= 0.15) & (x < 0.25)] = 4.0
              h3[(x >= 0.45) & (x < 0.55)] = 4.0
              h3[(x >= 0.75) & (x < 0.85)] = 4.0
              h3 = np.clip(h3, 0, 10)
              
              # Binary step pattern 4: half-half
              h4 = np.zeros(N)
              h4[(x >= 0.4) & (x < 0.6)] = 4.0
              h4 = np.clip(h4, 0, 10)
              
              # Binary step pattern 5: many small steps
              h5 = np.zeros(N)
              for i in range(0, N, 4):
                  h5[i:i+2] = 4.0
              h5 = np.clip(h5, 0, 10)
              
              # Binary step pattern 6: golden ratio spacing
              h6 = np.zeros(N)
              ratios = [1/3, 2/3, 1/2, 1/5, 4/5, 1/4, 3/4, 2/5, 3/5]
              for r in ratios:
                  h6[(x >= r) & (x < r + 0.02)] = 4.0
              h6 = np.clip(h6, 0, 10)
              
              constructions["N" + str(N)] = {
                  "bimodal_tight": h1,
                  "central_peak": h2,
                  "three_peaks": h3,
                  "half_half": h4,
                  "many_small_steps": h5,
                  "golden_spacing": h6
              }
          return {"constructions": constructions}
