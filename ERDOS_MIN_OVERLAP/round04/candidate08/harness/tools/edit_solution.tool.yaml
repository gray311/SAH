type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK. Use generate_binary_constructions() and set num_intervals to 100-200,
  penalty_strength to 20000-50000. Replace sigmoid initialization with binary patterns.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
