type: tool
name: edit_solution
description: 'Change ONLY hyperparameters: penalty_strength, base_learning_rate, num_intervals, seed_start,
  num_restarts, num_steps.

  Use SEARCH/REPLACE targeting lines like "penalty_strength: float = 1370.0". Never modify sigmoid, FFT,
  or constraint logic.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
