type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK code region. Preferred: targeted SEARCH/REPLACE diffs matching current
  code exactly. Format:


  <<<<<<< SEARCH

  exact lines to replace

  =======

  new implementation

  >>>>>>> REPLACE


  Alternative: full rewrite of EVOLVE-BLOCK as complete code block.


  Preserve the dataclass Hyperparameters, class structure, and any fixed imports. Only change the optimization
  logic inside the EVOLVE-BLOCK.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
