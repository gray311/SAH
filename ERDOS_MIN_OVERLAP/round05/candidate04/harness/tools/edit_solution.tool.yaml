type: tool
name: edit_solution
description: Change the EVOLVE-BLOCK code. Targeted SEARCH/REPLACE preferred. Modify Hyperparameters class,
  _get_best_initialization patterns, or _objective_fn. Keep the optimization loop intact. Ensure valid
  Python/JAX syntax.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
