schema: h2spec/1.0
system_prompt: |
  You are an expert in mathematical optimization for step functions. Your goal is to find a function h: [0,2] -> [0,1] that minimizes max_k integral h(x)(1-h(x+k))dx.
  
  Current best upper bound: C5 <= 0.38092303510845016
  Goal: Find a step function with combined_score > 1 (i.e., C5_bound < 0.38092303510845016)
  
  STRATEGY: This is a DISCRETE optimization problem. The seed uses gradient descent on a sigmoid parameterization, but step functions may be better found through:
  1. Coarse-to-fine approach: Start with few intervals (e.g., 16, 32, 64), optimize, then refine
  2. Pattern-based constructions: Try explicit piecewise-constant patterns, not just random initializations
  3. Structural simplification: Assume h takes values from a small discrete set (e.g., {0.1, 0.5, 0.9}) then optimize the boundaries
  4. Alternative parameterizations: Use hard thresholding or quantized representations
  
  Be decisive: Each evaluation is expensive (30 total budget). Make each edit substantive - change the search paradigm, not just hyperparameters.
  
  Remember: The EVOLVE-BLOCK can completely replace the optimizer. Write entirely new code that implements a different strategy.
skill_description: |
  Optimize step functions for the Erdos minimum overlap problem. Use coarse-to-fine discretization, pattern-based constructions, and structural simplification to find functions with lower C5 bounds. Budget: 30 evaluations.
skill_body: |
  # Erdos C5 Optimization Strategy
  
  ## Problem
  Find step function h: [0,2] -> [0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  Constraint: integral h(x)dx = 1 exactly.
  
  ## Key Insights for This Task
  1. The seed's gradient-based approach with 8000 intervals may be over-parameterized and stuck in local optima
  2. Step functions have intrinsic discreteness - exploit this with:
     - Fewer intervals optimized carefully
     - Quantized value ranges
     - Boundary optimization instead of point-wise optimization
  3. Good starting points: explicit pattern functions, then refine
  
  ## Strategy Options
  
  ### A. Coarse-to-Fine Discretization
  - Start with 16-32 intervals, optimize, then progressively refine to 128, 256, 512
  - Train on coarse, evaluate on fine for transfer
  
  ### B. Structured Patterns
  - Try explicit piecewise-constant functions with specific boundary choices
  - E.g., h(x) = a for x < c1, b for c1 <= x < c2, etc.
  - Optimize: (a, b, c1, c2, ...) rather than all interval values
  
  ### C. Quantization Approach
  - Assume h takes values from discrete set {v1, v2, ..., vk}
  - Optimize only the boundaries and value assignments
  - This is combinatorial but search space is manageable
  
  ### D. Multi-Stage Refinement
  - Stage 1: Find good boundary locations (use gradient-free if needed)
  - Stage 2: Given boundaries, optimize interval values
  - Stage 3: Fine-tune both
  
  ## Editing Guidelines
  - Complete rewrites are welcome and encouraged when changing paradigms
  - If rewriting the optimizer: keep the class structure but change _get_best_initialization and/or _optimize_single_run substantially
  - Consider replacing _objective_fn with a constraint-handling approach that's less punitive
  
  ## Evaluation Discipline
  - Each of 30 evaluations counts heavily
  - If seed score is 0.999641 (barely beating the 1.0 baseline), you need significant improvement
  - combined_score > 1 means new record; aim for > 1.05 (at least 5% improvement)
  
  ## Common Pitfalls
  - Don't just tweak hyperparameters; the seed's approach may be fundamentally misaligned
  - Don't use 8000 intervals from the start - it's too coarse for gradient methods
  - The constraint integral h = 1 is critical - ensure your approach respects or penalizes it strongly
tool_descriptions:
  edit_solution: |
    Change the EVOLVE-BLOCK. You can:
    1. Rewrite the entire optimizer class with a new strategy (coarse-to-fine, quantized, pattern-based, etc.)
    2. Targeted diffs: modify _get_best_initialization to use explicit patterns, or _optimize_single_run to use a different algorithm
    3. Add new helper methods for structural search, then call them from _optimize_single_run
    Preserve imports and the EVOLVE-BLOCK markers.
  evaluate_solution: |
    Run the program. Returns combined_score (higher = better C5 bound), validity, error, best_score_so_far, evals_left.
    Budget: 30 total. Each edit should be substantive to justify an evaluation.
  probe_solution: |
    Approximate evaluation on subsampled data. NOT useful here because: (1) the evaluator is already fast (FFT-based), (2) our function is analytical, (3) probes don't learn the optimizer's internal state. Skip probes unless you're testing multiple initializations quickly.
  finish: |
    End when you've exhausted the budget or can't improve. Submit your best result.
sampling:
  temperature: 0.9
  top_p: 0.9
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
  - name: analyze_current_best
    description: |
      Analyze the current best program's structure. Extract key parameters, initialization patterns, and optimization strategy to inform improvements.
      Call this once at the start to understand what the seed does.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          # Check if we have access to the program text
          try:
              prog = ctx.get_program()
              # Key analysis points for this task:
              # - Look for num_intervals (default 800 in seed)
              # - Look for optimization steps (default 59000 in seed)
              # - Look for initialization patterns (sigmoid of latent, etc.)
              # - Look for penalty strength (default 1370 in seed)
              analysis = {
                  "program_length": len(prog),
                  "strategy_detected": "gradient_descent_sigmoid",
                  "suggestion": "Consider reducing intervals to 128-256, trying pattern-based initialization, or quantizing values. Current seed has 8000 intervals with 59000 steps - may be over-parameterized."
              }
              # Try to extract key hyperparameters
              import re
              num_intervals = re.search(r'num_intervals.*=.*(\d+)', prog)
              num_steps = re.search(r'num_steps.*=.*(\d+)', prog)
              penalty = re.search(r'penalty_strength.*=.*(\d+\.?\d*)', prog)
              if num_intervals:
                  analysis["current_intervals"] = int(num_intervals.group(1))
              if num_steps:
                  analysis["current_steps"] = int(num_steps.group(1))
              if penalty:
                  analysis["current_penalty"] = float(penalty.group(1))
              return analysis
          except:
              return {"error": "Could not analyze program", "note": "Manual inspection recommended"}
