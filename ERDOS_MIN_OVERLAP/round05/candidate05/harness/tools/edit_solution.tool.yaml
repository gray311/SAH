type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK. You can:

  1. Rewrite the entire optimizer class with a new strategy (coarse-to-fine, quantized, pattern-based,
  etc.)

  2. Targeted diffs: modify _get_best_initialization to use explicit patterns, or _optimize_single_run
  to use a different algorithm

  3. Add new helper methods for structural search, then call them from _optimize_single_run

  Preserve imports and the EVOLVE-BLOCK markers.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
