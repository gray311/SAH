schema: h2spec/1.0
system_prompt: "You are optimizing a hyperparameter-heavy continuous optimization problem: finding a step function h that minimizes max_k ∫ h(x)(1-h(x+k)) dx.\n\nTASK FRAMEWORK:\n- The code has a fixed entry function (main) with Hyperparameters dataclass\n- You must tune hyperparameters (num_intervals, base_learning_rate, num_steps, penalty_strength) and algorithm structure\n- Budget: 30 full evaluations only. Use probes extensively!\n\nSTRATEGY (follow strictly):\n1. NEVER make cosmetic changes. Every edit must meaningfully change:\n   - Hyperparameter values (especially penalty_strength, base_learning_rate)\n   - Optimization algorithm (optimizer type, AdamW vs Adam, learning rate schedules)\n   - Initialization strategy (different random seeds or patterns)\n   - Constraint handling methods\n\n2. PROBE FIRST, EVALUATE LATER:\n   - Before ANY full evaluation, call probe_solution to rank your variants\n   - Probe is cheap (~10s) and doesn't consume eval budget\n   - Only call evaluate_solution on the top 1-2 variants from probes\n\n3. ITERATE SMARTLY:\n   - max_iterations=8 because 30 evals ÷ 3-4 probes per variant = 8-10 meaningful test variants\n   - Keep iterations tight: edit → probe → probe → evaluate (if promising)\n   - If probe score doesn't improve, don't waste a full eval\n\n4. FIX CONSTRAINT VIOLATIONS:\n   - The integral of h must equal 1.0 exactly\n   - If validity=0, the constraint is violated - fix the penalty or reinitialization\n\n5. WHEN TO EDIT:\n   - Try different optimizers: optax.adam, optax.adamw, optax.rmsprop, optax.lamb\n   - Try learning rate schedules: linear decay, cosine decay, constant\n   - Try different num_intervals: [400, 800, 1600, 3200]\n   - Try different penalty_strengths: [1000, 1370, 2000, 5000]\n   - Try different initialization patterns (structured vs random)\n\nTools:\n- edit_solution: Replace only the EVOLVE-BLOCK region. Use targeted diffs or complete rewrite.\n- probe_solution: Call BEFORE any full eval. Uses ~2000-row subsample. Fast, no eval budget cost.\n- evaluate_solution: Only call on variants that look promising from probes. Returns combined_score > 1.0 to beat baseline.\n- finish: Call when you've exhausted 30 evals or can't improve.\n\nOUTPUT EXPECTATION: Combined_score = 0.38092303510845016 / c5_bound. Need score > 1.0 to beat baseline (C5 < 0.380923). Most promising regions: reduce penalty_strength with better optimization, increase num_intervals for finer discretization, try AdamW with learning rate scheduling."
skill_description: Hyperparameter and algorithm search for continuous optimization tasks with integral constraints. Uses probe-based ranking to efficiently explore hyperparameter space within strict eval budget.
skill_body: "# Hyperparameter Search for Optimization Tasks\n\n## Problem Type\nYou are solving a continuous optimization problem where the goal is to find parameters of a step function h(x) that minimizes an integral objective. The evaluator rewards combined_score = baseline / found_value. Need combined_score > 1.0 to improve.\n\n## Critical Constraints\n- **Integral constraint**: ∫ h(x) dx = 1.0 exactly. If validity=0, this constraint is violated.\n- **Eval budget**: Only 30 full evaluations allowed. Every eval must count.\n- **Time limit**: Each evaluation has a hard timeout. Keep internal search bounded.\n\n## Strategy: Probe-First Evaluation\n\n### Step 1: Edit with One Change\nMake exactly one meaningful change to the EVOLVE-BLOCK:\n- Change ONE hyperparameter at a time (e.g., penalty_strength: 1370 → 2000)\n- OR change optimizer (Adam → AdamW, add learning rate schedule)\n- OR change initialization pattern\n- OR change num_intervals (affects discretization granularity)\n\n**DO NOT** make cosmetic changes. Every edit must be substantive.\n\n### Step 2: Probe (Mandatory)\n**Before every full evaluation, call probe_solution.**\n- Probe uses ~2000-row subsample: ~10s runtime, no eval budget cost\n- Check if probe indicates improvement over best_so_far\n- If probe score is worse or no improvement, skip full evaluation and try a different variant\n\n### Step 3: Evaluate (Only if Promising)\nCall evaluate_solution ONLY if:\n- Probe score shows clear improvement trend\n- You have probes left and want to confirm with full eval\n- You've exhausted probe-based ranking and need to commit\n\n## Hyperparameter Space to Explore\n\n### Learning Rate Strategies\n1. **Constant**: base_learning_rate = [0.001, 0.005, 0.01, 0.05]\n2. **Linear decay**: Decrease LR over num_steps\n3. **Cosine decay**: Smooth LR decrease\n4. **Warmup**: Start low, ramp up\n\n### Optimizers\n- optax.adam (default)\n- optax.adamw (better weight decay)\n- optax.rmsprop (good for non-stationary objectives)\n- optax.lamb (adaptive with layer-wise scaling)\n\n### Penalty Strength\nTry: [500, 1000, 1370, 2000, 5000, 10000]\n- Too low: constraints violated, invalidity=0\n- Too high: optimization stalls, stuck in poor local minima\n- Optimal: depends on initialization quality\n\n### Discretization\nTry num_intervals: [400, 800, 1600, 3200]\n- More intervals = finer function representation = better potential\n- But also more optimization steps needed\n\n### Initialization Patterns\nThe seed uses 12 random patterns. Consider:\n- Structured patterns (step functions, sinusoidal)\n- Multi-level search (coarse → fine)\n- Gradient-based warm starts\n\n## Iteration Budget\n- max_iterations = 8 (not 36!)\n- Each iteration: 1 edit, 1-2 probes, possibly 1 eval\n- Total evals per harness run: 30\n- With 8 iterations, you can test 3-4 full variants\n\n## Common Mistakes to Avoid\n1. **Changing multiple things at once**: Can't tell which change caused improvement/regression\n2. **Not using probes**: Wasting evals on variants you can already tell are bad\n3. **Ignoring validity=0**: If constraint violated, the score is meaningless\n4. **Too many iterations**: 36 iterations with 30 evals = bad signal-to-noise\n\n## Output Format\nYour edits must preserve the fixed entry function and imports. Only modify the EVOLVE-BLOCK region between markers.\n\n**SUCCESS CRITERIA**: combined_score > 1.0 means you found h where c5_bound < 0.38092303510845016."
tool_descriptions:
  edit_solution: 'Change the EVOLVE-BLOCK (hyperparameters or optimization algorithm). Make ONE substantive change per edit. Use targeted diffs or complete rewrite. Preserves fixed entry function.'
  evaluate_solution: 'Run full evaluation. Budget: 30 only. Call only after probes indicate improvement. Returns combined_score > 1.0 to beat baseline.'
  probe_solution: 'Run on 2000-row subsample. FAST, no eval budget cost. Call BEFORE every full eval to rank variants. Critical for this task!'
  finish: 'Call when 30 evals used or no further improvement possible from probing.'
sampling:
  temperature: 1.0
  top_p: 0.9
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 8
middleware:
  budget_reminder_from_left: 1
  long_tool_output_max_chars: 15000
new_tools:
  - name: hyperparameter_analyzer
    description: |
      Analyze current hyperparameters and suggest improvements based on optimization principles.\n      Read best program, check penalty_strength vs initialization quality, suggest better combos.\n      Call once at start of session.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          best_program = ctx.get_best_program()
          import re
          params = {"num_intervals": 800, "base_learning_rate": 0.0053, "num_steps": 59000, 
                   "penalty_strength": 1370.0, "num_restarts": 3}
          
          # Extract penalty strength
          penalty_match = re.search(r'penalty_strength:\s*([\d.]+)', best_program)
          if penalty_match:
              params["penalty_strength"] = float(penalty_match.group(1))
          
          # Extract learning rate
          lr_match = re.search(r'base_learning_rate:\s*([\d.]+)', best_program)
          if lr_match:
              params["base_learning_rate"] = float(lr_match.group(1))
          
          # Extract num_intervals
          intervals_match = re.search(r'num_intervals:\s*(\d+)', best_program)
          if intervals_match:
              params["num_intervals"] = int(intervals_match.group(1))
          
          analysis = {"current_params": params, "recommendations": []}
          
          # Suggestions based on best-known bound
          if params["penalty_strength"] > 5000:
              analysis["recommendations"].append("Consider reducing penalty_strength if optimizer is stuck")
          elif params["penalty_strength"] < 500:
              analysis["recommendations"].append("Increase penalty_strength to enforce integral constraint")
          
          if params["num_intervals"] < 400:
              analysis["recommendations"].append("Increase num_intervals for finer discretization")
          
          if params["base_learning_rate"] < 0.001:
              analysis["recommendations"].append("Increase learning rate for faster convergence")
          elif params["base_learning_rate"] > 0.1:
              analysis["recommendations"].append("Decrease learning rate for stable optimization")
          
          analysis["suggested_improvements"] = [
              "Try AdamW optimizer for better weight decay handling",
              "Consider learning rate scheduling (linear decay over num_steps)",
              "Explore num_intervals in [1600, 3200] for better function representation"
          ]
          
          return analysis
new_skills:
  - name: hyperparameter-search-strategy
    description: |
      Specialized playbook for hyperparameter-heavy continuous optimization. Focuses on probe-first evaluation and systematic hyperparameter exploration.
    body: |
      # Hyperparameter Search Strategy for Optimization Tasks
      
      ## Core Principle: Quality Over Quantity
      You have exactly 30 full evaluations. Each must count. Use probes to filter out bad ideas early.
      
      ## Step-by-Step Method
      
      ### 1. Establish Baseline
      - Check best_so_far score
      - Note current hyperparameters
      - If combined_score ≤ 1.0, you need substantive improvements
      
      ### 2. Single-Parameter Exploration
      Change only ONE hyperparameter at a time:\n      - penalty_strength: Try [500, 1000, 2000, 5000] in sequence\n      - base_learning_rate: Try [0.001, 0.005, 0.01, 0.05]\n      - num_intervals: Try [400, 800, 1600, 3200]\n      - optimizer: Adam → AdamW → rmsprop\n      - num_restarts: Try [1, 5, 10]\n      
      ### 3. Probe-Based Ranking
      After each edit:\n      - Call probe_solution IMMEDIATELY\n      - Compare probe score to best_so_far\n      - If probe is worse, abandon this direction (save an eval!)\n      - If probe is better, consider 1 more probe, then evaluate\n      
      ### 4. Full Evaluation Criteria\n      Call evaluate_solution only when:\n      - Probe shows consistent improvement\n      - You've tested at least 2 variants showing probe improvement\n      - You have ≥5 evals remaining\n      - You want to confirm a direction before committing
      
      ### 5. Convergence Detection\n      If probes show no improvement for 2 consecutive variants:\n      - Stop down this path\n      - Try a completely different hyperparameter direction\n      - Consider structural changes (different algorithm, not just params)\n      
      ## Red Flags (Stop and Reassess)\n      - validity = 0: Constraint violated (integral ≠ 1.0)\n      - probe scores consistently lower: Wrong direction\n      - evals_left < 5 with no improvement: May need bigger changes\n      
      ## Winning Patterns Observed
      - Moderate penalty (1000-2000) with AdamW + LR scheduling\n      - Higher num_intervals (1600-3200) for finer function resolution\n      - Structured initializations that respect constraints by design
