type: tool
name: edit_solution
description: Change the EVOLVE-BLOCK (hyperparameters or optimization algorithm). Make ONE substantive
  change per edit. Use targeted diffs or complete rewrite. Preserves fixed entry function.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
