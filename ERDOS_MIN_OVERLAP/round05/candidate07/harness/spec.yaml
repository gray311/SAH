schema: h2spec/1.0
system_prompt: "You are an expert in harmonic analysis, numerical optimization, and AI-driven mathematical discovery. Your task is to evolve and optimize a Python script to find a better **upper bound** for the Erdős minimum overlap problem constant C₅.\n\nThe program has a single editable region between `# EVOLVE-BLOCK-START` and `# EVOLVE-BLOCK-END`. Only that region is yours to change; everything outside it (imports and the fixed entry function) is frozen.\n\nMethod — a three-stage approach:\n1. **Stage 1: Initialize with high-quality patterns**. The seed already has 12 initialization patterns. DO NOT break them. Instead, add 3-4 MORE deterministic patterns: symmetric block functions, triangular waves, piecewise constant with specific ratios (1:2:3, 1:3:1, etc.). Each pattern should have integral(h)=1 exactly when sigmoided.\n2. **Stage 2: Validate before optimizing**. Before optimizing each restart, compute the constraint satisfaction exactly: integral(h) should be 1.0 (within 1e-6). If not, adjust by scaling. Only then optimize.\n3. **Stage 3: Early stopping with best-tracking**. Monitor during optimization: if best C5 bound in this run doesn't improve in 5000 steps, stop early and try a new restart. Keep the best C5 bound across all restarts.\n\nUse `probe_solution` to check approximate C5 of your initializations before full optimization. Call it once per restart pattern to rank them cheaply.\n\nKey insight: The C5 bound is max_k ∫ h(x)(1-h(x+k)) dx. Functions with **minimal self-overlap** and **maximal spread** perform best. Think: h concentrated in disjoint regions.\n\nWhen editing: preserve the existing 12 patterns EXACTLY. Add new patterns AFTER them, not by modifying them. Add the two-stage validation logic after the initialization loop.\n\nTool calls per turn: ONE call only — either `edit_solution` (with the next stage's changes) or `evaluate_solution` (to check your latest change). Do not call evaluate unless you just edited."
skill_description: "Optimize Erdős C5 bound by: (1) adding deterministic multi-scale initialization patterns, (2) enforcing integral=1 constraint exactly before optimization, (3) early-stopping runs that plateau. Use probe to rank initializations cheaply. Goal: beat C5 ≤ 0.38092303510845016."
skill_body: "# Erdős C5 Optimization Strategy\n\n## Goal\nMaximize combined_score = 0.38092303510845016 / c5_bound. Target: c5_bound < 0.380923 to get score > 1.\n\n## Problem\nMinimize: max_k ∫₀² h(x)(1-h(x+k)) dx\nwhere h: [0,2] → [0,1] and ∫₀² h(x) dx = 1 exactly.\n\n## Three-Stage Protocol\n\n### Stage 1: Enhanced Initialization\n**Preserve the seed's 12 patterns EXACTLY. Do not modify them.**\n\nAdd 4 new deterministic patterns after the seed's 12:\n\n```python\n# Pattern 12: Symmetric block (h concentrated in [0.5, 1.5])\nx = jnp.linspace(0, 2, N)\nlatent = jnp.where((x >= 0.5) & (x < 1.5), 10.0, -10.0)\n\n# Pattern 13: Two-block equal (h concentrated in [0,0.5] and [1.5,2])\nlatent = jnp.where((x < 0.5) | (x >= 1.5), 10.0, -10.0)\n\n# Pattern 14: Three-block (1:2:1 ratio)\nlatent = jnp.where((x < 0.5) | (x >= 1.5), 8.0, jnp.where((x >= 0.5) & (x < 1.5), -8.0, 0.0))\n\n# Pattern 15: Scaled sawtooth (smooth transition)\nx = jnp.linspace(0, 2, N)\nlatent = 4.0 * jnp.sin(jnp.pi * x) + 2.0\n```\n\nKey: Use large amplitudes (±8 to ±10) before sigmoid to ensure sharp step functions. The sigmoid will squash them to [0,1] while preserving the step structure.\n\n### Stage 2: Constraint Validation Gate\n**After selecting the best latent across all patterns, BEFORE optimizing, add:**\n\n```python\n# Validate integral constraint\nintegral_h = jnp.sum(h) * self.dx\nconstraint_violation = jnp.abs(integral_h - 1.0)\nif constraint_violation > 1e-6:\n    # Scale h to satisfy integral=1 exactly\n    scale_factor = 1.0 / integral_h\n    h = h * scale_factor\n    # Clamp to [0,1]\nh = jnp.clip(h, 0.0, 1.0)\n```\n\nPlace this right after the `_get_best_initialization` returns, before any optimization. This ensures every restart starts from a feasible point.\n\n### Stage 3: Early Stopping with Best Tracking\n**Modify `_optimize_single_run` to include:**\n\n```python\nbest_c5_in_run = jnp.inf\nplateau_counter = 0\npatience = 5000  # steps without improvement triggers early stop\n\nfor step in range(self.hypers.num_steps):\n    latent_h_values, opt_state, loss = train_step(latent_h_values, opt_state)\n    \n    # Track best C5 (objective without penalty)\n    c5_no_penalty = self._compute_c5_bound(latent_h_values)\n    if c5_no_penalty < best_c5_in_run:\n        best_c5_in_run = c5_no_penalty\n        plateau_counter = 0\n    else:\n        plateau_counter += 1\n    \n    # Early stop if plateaued\n    if plateau_counter >= patience:\n        break\n```\n\nThis prevents wasting 59k steps on a bad restart. If progress stalls, abandon and try a new seed.\n\n## Probe Strategy\nBefore full optimization of a new restart pattern:\n1. Call `probe_solution` on the raw h (before optimization)\n2. Check if probe C5 < 0.35 (promising threshold)\n3. If yes, invest full optimization. If no, skip.\n\nThis filters out unpromising patterns cheaply.\n\n## Editing Discipline\n- ONE edit per turn. Use SEARCH/REPLACE to add patterns after pattern 11.\n- Add constraint validation after `_get_best_initialization`.\n- Add early stopping logic inside `_optimize_single_run`.\n- Evaluate after each stage completes.\n\n## Final checklist\n- [ ] 16 patterns total (12 original + 4 new)\n- [ ] Constraint validation with scaling\n- [ ] Early stopping with plateau detection\n- [ ] Best C5 tracked across restarts\n- [ ] Probe used to filter unpromising restarts"
tool_descriptions:
  edit_solution: "Change the EVOLVE-BLOCK code. Preserve the seed's 12 patterns EXACTLY. Use SEARCH/REPLACE to add new patterns AFTER pattern 11. Add constraint validation and early stopping logic in separate edits. One tool call per turn."
  evaluate_solution: "Run the program and report combined_score. Returns combined_score (higher better), validity (0 if constraint violated), error, best_so_far, and evaluations_left. Call AFTER making an edit, or AFTER probe selection."
  probe_solution: "Cheap approximate C5 score on subsampled data (fast, ~10s, separate 30-probe budget). Scores are approximate and NOT comparable to full evaluate_solution scores. Use to rank initialization patterns: if probe C5 < 0.35, it's promising. Call once per new restart pattern before full optimization."
  finish: "End the session when budget exhausted or no further improvement possible."
sampling:
  temperature: 0.5
  top_p: 0.9
  top_k: 15
  max_tokens: 10240
agent:
  max_iterations: 45
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 6000
