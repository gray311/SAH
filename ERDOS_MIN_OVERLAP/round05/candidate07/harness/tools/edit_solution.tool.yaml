type: tool
name: edit_solution
description: Change the EVOLVE-BLOCK code. Preserve the seed's 12 patterns EXACTLY. Use SEARCH/REPLACE
  to add new patterns AFTER pattern 11. Add constraint validation and early stopping logic in separate
  edits. One tool call per turn.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
