type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. Format: targeted SEARCH/REPLACE diffs (preferred) or full
  rewrite.

  Focus on: (1) simpler/faster initialization, (2) structured step functions, (3) constraint enforcement.

  Keep changes testable within one evaluation.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
