type: tool
name: finish
description: 'End when: (1) 30 evals used, or (2) best score achieved and no better direction found.

  Submit your best solution - make it count!'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
