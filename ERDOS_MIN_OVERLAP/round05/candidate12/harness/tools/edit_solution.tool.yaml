type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. Format: SEARCH/REPLACE diffs (preferred) or full rewrite.
  Focus on mathematical improvements: initialization patterns, optimizer hyperparameters, or constraint
  handling. Keep changes targeted (one concept per edit).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
