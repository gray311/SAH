type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. For this constrained optimization task:

  - PREFERRED: targeted SEARCH/REPLACE of ONE hyperparameter or initialization pattern

  - Example: change base_learning_rate from 0.0053 to 0.008, adjust num_steps

  - NEVER rewrite the entire block unless making a major architectural change (rarely needed)

  - Always verify your edit preserves sigmoid(latent) and penalty structure'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
