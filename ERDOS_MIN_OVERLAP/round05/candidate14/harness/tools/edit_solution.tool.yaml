type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK code region. Use targeted SEARCH/REPLACE diffs or

  full rewrites. Keep imports and the fixed entry function unchanged. Each

  edit should implement one concrete hypothesis about step function construction.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
