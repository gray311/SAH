type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. Preferred: targeted SEARCH/REPLACE diffs modifying one parameter
  or function. Full rewrites acceptable for structural changes. Preserve imports and entry function. After
  editing, probe then evaluate.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
