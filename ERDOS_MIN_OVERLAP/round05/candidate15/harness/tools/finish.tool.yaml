type: tool
name: finish
description: End the session when you beat the seed (score > 0.999641) or cannot improve. Best program
  is submitted automatically.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
