type: tool
name: probe_solution
description: Cheap approximate evaluation on subsampled data (~10s runtime, separate budget of 30 probes).
  Returns approximate c5_bound - use to quickly filter bad candidates before spending full evals. Score
  is approximate and NOT comparable to evaluate_solution - use only for ranking your own variants.
