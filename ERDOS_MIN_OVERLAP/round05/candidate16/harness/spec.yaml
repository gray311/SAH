schema: h2spec/1.0
system_prompt: |
  You are a mathematical optimization expert tasked with improving a Python program that finds an upper bound for the Erdos minimum overlap constant C5.

  OBJECTIVE: Find a step function h: [0,2] -> [0,1] minimizing max_k integral(h(x)*(1-h(x+k))dx).
  Target: beat C5 <= 0.38092303510845016 (combined_score = target / found > 1.0 means success).

  CONSTRAINTS: h must be in [0,1], and integral(h) must equal exactly 1.0.

  METHOD: Use gradient-based optimization with strong penalty enforcement. The seed program uses 800 intervals, 59000 training steps, and multi-restart strategy. Do NOT reduce iterations or complexity - the FFT-based evaluation is fast enough.

  STRATEGY:
  1. Analyze: Check current c5_bound and constraint satisfaction. If constraint_loss is high, penalty_strength needs adjustment.
  2. Edit: Make targeted hyperparameter adjustments. Prefer increasing num_steps slightly, adjusting base_learning_rate in [0.003, 0.01], or fine-tuning penalty_strength in [1000, 2000].
  3. Evaluate: Score carefully. Each evaluation is precious (budget=30).
  4. Iterate: Build on successful patterns. If c5_bound improves, keep the approach.
  5. Finish: When unable to improve or budget exhausted.

  KEY INSIGHTS:
  - The optimizer uses JAX/AD for automatic differentiation
  - Penalty_strength=1370 enforces integral(h)=1.0 strictly
  - num_restarts=3 provides diversity in initialization
  - 800 intervals is appropriate for this resolution
  - Do not change the architecture or remove key components

  Always preserve the fixed entry function and EVOLVE-BLOCK contract. Make ONE substantive change per turn.
skill_description: |
  Mathematical optimization with constrained gradient descent. Use for discovery tasks requiring parameter tuning and constraint satisfaction.
skill_body: |
  Mathematical Optimization Playbook

  This task optimizes a step function h on [0,2] to minimize overlap integrals. The evaluator computes combined_score = target_bound / found_bound, where higher is better.

  Core Principles:
  1. Respect the architecture: The seed program's design (800 intervals, FFT-based evaluation, multi-restart) is sound. Do not simplify it excessively.
  2. Constraint satisfaction is critical: The integral of h must equal exactly 1.0. This is enforced by penalty_strength * (integral(h) - 1.0)^2. Watch for constraint_loss in evaluations.
  3. Gradual improvement: Make small hyperparameter changes. Large structural changes rarely help this mathematical optimization task.
  4. Use the full budget: 30 evaluations allow multiple iterations. Plan: 5-7 evaluations max per harness run.

  Optimization Strategies:
  Strategy A: Fine-tune learning rate
  If optimization converges slowly:
  - Try base_learning_rate: 0.004, 0.006, 0.008
  - Monitor: Does c5_bound decrease monotonically?

  Strategy B: Adjust penalty strength
  If constraint violation is suspected (validity=0 or high constraint_loss):
  - Try penalty_strength: 1200, 1500, 1800
  - Too high: optimization stalls. Too low: constraints violated.

  Strategy C: Increase optimization steps
  The FFT evaluation is fast (~10ms). You can afford:
  - num_steps: 65000, 70000
  - This gives more time for convergence without timeout risk.

  Strategy D: Add diversity via more restarts
  - num_restarts: 5, 7
  - Helps escape local minima in this non-convex landscape.

  Strategy E: Pattern-based initialization
  The _get_best_initialization tries 12 patterns including: random normal, sinusoidal, step functions.
  All are transformed via sigmoid to [0,1] then normalized.
  Do not remove patterns - diversity helps escape local minima.

  Editing Guidelines:
  - Use SEARCH/REPLACE diffs when making small changes
  - Only modify the EVOLVE-BLOCK region
  - Keep imports and dataclass definitions intact
  - Preserve the optimizer's JIT compilation

  Evaluation Interpretation:
  - combined_score > 1.0: SUCCESS (new upper bound found)
  - combined_score ~ 1.0: similar to seed (acceptable)
  - combined_score < 1.0: worse than seed (need better approach)
  - validity=0: constraint violated or program error

  Decision Tree:
  If combined_score > 1.0 but < best_so_far:
    Keep the approach, try to improve further

  If combined_score < 1.0 or validity=0:
    Diagnose: was it learning rate? penalty? or architecture change?
    Revert to best_so_far and try different parameter

  If all 30 evaluations used without > 1.0 score:
    Call finish with summary of what was tried
tool_descriptions:
  edit_solution: |
    Change the EVOLVE-BLOCK code. For this mathematical optimization task, prefer SEARCH/REPLACE diffs that adjust: num_intervals, base_learning_rate, num_steps, penalty_strength, num_restarts. Small changes are better than major rewrites.
  evaluate_solution: |
    Run the program and get combined_score (higher is better), validity (1=passed constraints, 0=failed), error text, best_so_far, and evaluations_left. Use FFT-based evaluation speed to justify multiple edits.
  finish: |
    End when budget exhausted or no improvement possible. Report best score and approach.
sampling:
  temperature: 0.3
  top_p: 0.8
  top_k: 15
  max_tokens: 6144
agent:
  max_iterations: 48
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 5000
remove_tools: [probe_solution]
new_skills:
  - name: constrained-optimization
    description: |
      Optimizing constrained mathematical functions with gradient descent. Use for tasks with hard constraints (integral=1, bounds [0,1]) and non-convex objectives. Key: strong penalty enforcement and gradual hyperparameter tuning.
    body: |
      Constrained Optimization with Gradient Descent

      Problem Structure:
      - Objective: Non-convex minimization (here: max overlap integral)
      - Constraints: Hard bounds [0,1] and equality constraint integral(h)=1.0
      - Solver: Adam optimizer with penalty method
      - Evaluation: FFT-based correlation computation (fast, ~10ms)

      Penalty Method:
      The constraint integral(h)=1.0 is enforced via:
      loss = objective + penalty_strength * (integral(h) - 1.0)^2

      Tuning guidelines:
      - penalty_strength: Start at 1370, adjust to [1000-2000]
      - If validity=0: penalty too low, increase it
      - If optimization stalls: penalty too high, decrease slightly

      Hyperparameter Tuning Order:
      1. First: base_learning_rate (most sensitive)
      2. Second: num_steps (use full budget, FFT is fast)
      3. Third: num_restarts (diversify initializations)
      4. Last: num_intervals (800 is already appropriate)

      Initialization Patterns:
      The seed uses 12 patterns including: random normal, sinusoidal, step functions.
      All are transformed via sigmoid to [0,1] then normalized.
      Do not remove patterns - diversity helps escape local minima.

      Evaluation Feedback:
      - combined_score > 1.0: found better bound (SUCCESS)
      - combined_score ~ 1.0: similar quality (continue tuning)
      - combined_score < 1.0: worse (revert and try different direction)
      - validity=0: constraint violated (check penalty_strength)

      Common Pitfalls:
      1. Reducing num_steps too much - need ~50k+ iterations
      2. Lowering penalty_strength below 1000 - constraints violated
      3. Changing architecture unnecessarily - the FFT approach is optimal
      4. Ignoring constraint_loss - watch for integral(h) != 1.0

      When to Stop:
      - Score > 1.0 and cannot improve further
      - 30 evaluations used without success
      - Diagnostics show fundamental constraint issues (unlikely with proper tuning)
new_tools:
  - name: analyze_constraint
    description: |
      Check the current best program's constraint satisfaction and hyperparameters without full evaluation. Reports key settings and optimization recommendations.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          # Lightweight analysis tool that examines the current best program
          # and provides diagnostic information about hyperparameters
          code = ctx.get_best_program()
          if not code or '# EVOLVE-BLOCK-START' not in code:
              return {
                  'note': 'No program found yet',
                  'num_steps': 59000,
                  'penalty_strength': 1370.0,
                  'base_learning_rate': 0.0053,
                  'recommendations': ['Use default values'],
                  'next_step': 'Proceed to evaluate_solution'
              }
          
          # Extract key hyperparameters from the code using regex
          import re
          
          try:
              num_steps_match = re.search(r'num_steps:\s*(\d+)', code)
              penalty_match = re.search(r'penalty_strength:\s*([\d.]+)', code)
              lr_match = re.search(r'base_learning_rate:\s*([\d.]+)', code)
              
              num_steps = int(num_steps_match.group(1)) if num_steps_match else 59000
              penalty = float(penalty_match.group(1)) if penalty_match else 1370.0
              lr = float(lr_match.group(1)) if lr_match else 0.0053
              
              # Give recommendations based on current values
              recommendations = []
              if num_steps < 60000:
                  recommendations.append('Consider increasing num_steps to 65000-70000')
              if penalty < 1200:
                  recommendations.append('Constraint may be violated - increase penalty_strength to 1500+')
              if penalty > 2000:
                  recommendations.append('Optimization may stall - reduce penalty_strength to 1500-')
              if lr < 0.003:
                  recommendations.append('Learning rate may be too low - try 0.005-0.008')
              if lr > 0.02:
                  recommendations.append('Learning rate may be unstable - reduce to 0.003-0.01')
              
              next_step = recommendations[0] if recommendations else 'Proceed to evaluate'
              
              return {
                  'num_steps': num_steps,
                  'penalty_strength': penalty,
                  'base_learning_rate': lr,
                  'num_intervals': 800,
                  'recommendations': recommendations if recommendations else ['Current settings appear reasonable'],
                  'next_step': next_step
              }
          except Exception as e:
              return {
                  'error': str(e),
                  'note': 'Could not parse program',
                  'num_steps': 59000,
                  'penalty_strength': 1370.0,
                  'base_learning_rate': 0.0053,
                  'recommendations': ['Use default values'],
                  'next_step': 'Proceed to evaluate_solution'
              }
new_middlewares:
  - name: constraint_reminder
    hook: before_model
    description: |
      Remind the solver to check constraint satisfaction before each edit. Critical for this task where validity=0 is common with poor penalty tuning.
    implementation_py: |
      def before_model(hook_input):
          best_score = hook_input.get('best_score', 0)
          if best_score < 1.0:
              return 'Constraint reminder: Ensure integral(h)=1.0 by checking penalty_strength. Watch for validity=0 in next evaluation. Consider using analyze_constraint tool before editing.'
          return None
