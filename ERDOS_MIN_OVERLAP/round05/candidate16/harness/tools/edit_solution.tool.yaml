type: tool
name: edit_solution
description: 'Change the EVOLVE-BLOCK code. For this mathematical optimization task, prefer SEARCH/REPLACE
  diffs that adjust: num_intervals, base_learning_rate, num_steps, penalty_strength, num_restarts. Small
  changes are better than major rewrites.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
