type: tool
name: construct_piecewise
description: 'Construct a piecewise constant step function h: [0,2]→[0,1] with specified intervals and
  heights.

  The function is defined as a list of (start, end, height) tuples.

  Returns the computed c5_bound (max overlap integral) and combined_score.

  This bypasses gradient descent entirely - builds candidates directly.


  Usage: Provide intervals that partition [0,2]. The tool:

  1. Validates h ∈ [0,1] and ∫h = 1

  2. Computes c5_bound via FFT-based correlation

  3. Returns {c5_bound: float, combined_score: float, valid: bool}


  Call this to generate explicit candidates like single/double/triple step functions.'
input_schema:
  type: object
  properties:
    intervals:
      type: array
      items:
        type: object
        properties:
          start:
            type: number
          end:
            type: number
          height:
            type: number
    num_intervals_for_fft:
      type: integer
      default: 800
