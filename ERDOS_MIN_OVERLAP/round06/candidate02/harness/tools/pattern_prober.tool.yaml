type: tool
name: pattern_prober
description: Quick feasibility check for piecewise-constant functions. Takes interval breakpoints and
  values, verifies constraints (h∈[0,1], integral=1), and returns approximate c5_bound. Use this BEFORE
  full evaluation to filter invalid constructions.
input_schema:
  type: object
  properties:
    breakpoints:
      type: array
      items:
        type: number
    values:
      type: array
      items:
        type: number
