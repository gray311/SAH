type: tool
name: edit_solution
description: 'Write COMPLETELY NEW code in the EVOLVE-BLOCK for a specific CONSTRUCTION TYPE.

  Examples:

  - Type A: Define h as piecewise constant with 1-3 breakpoints, adjust heights for integral=1

  - Type B: Create symmetric step function, compute its c5_bound directly

  - Type C: Build 3-region pattern, optimize just the breakpoints (not the whole function)


  Don''t edit the seed''s optimizer. Replace it with direct construction code.

  Keep class structure but change the _get_best_initialization or _objective_fn to BUILD solutions directly.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
