type: tool
name: construct_candidates
description: 'Generate a diverse set of structured step function candidates for the Erdős problem.

  Call this at the start to create initial solutions instead of relying on random gradient init.

  Returns a list of candidate h functions with different patterns.'
input_schema:
  type: object
  properties:
    num_candidates:
      type: integer
      default: 10
    num_intervals:
      type: integer
      default: 200
