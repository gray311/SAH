type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. For strategic changes, **complete rewrites are essential**.


  The seed program is too focused on gradient descent. Rewrite it to:

  - Use construct_candidates to generate structured step functions

  - Implement direct construction patterns (step, symmetric, piecewise)

  - Coarse discretization first, then refine'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
