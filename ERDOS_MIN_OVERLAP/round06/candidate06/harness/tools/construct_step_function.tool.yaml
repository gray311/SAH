type: tool
name: construct_step_function
description: 'Construct a piecewise constant step function h:[0,2]→[0,1] given breakpoint locations and
  heights.

  Ensures ∫h=1 by normalizing. Returns h discretized at 800 intervals.

  Use this to rapidly prototype candidate solutions.'
input_schema:
  type: object
  properties:
    breakpoints:
      type: array
      items:
        type: number
      description: Breakpoint positions in [0,2] (ascending, exclusive of 0, inclusive of 2)
    heights:
      type: array
      items:
        type: number
      description: Height of h on each interval [breakpoints[i], breakpoints[i+1]]
