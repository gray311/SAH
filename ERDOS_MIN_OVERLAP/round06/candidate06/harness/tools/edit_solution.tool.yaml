type: tool
name: edit_solution
description: "Replace the EVOLVE-BLOCK with an explicit step function constructor. \nDefine breakpoints\
  \ manually and construct h as piecewise constant.\nExample pattern: h = 1 on [0,a], 0 on [a,2-a], 1\
  \ on [2-a,2] where a=0.5.\nEnsure ∫h=1 and h∈[0,1]."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
