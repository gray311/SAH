type: tool
name: enumerate_heights
description: 'Enumerate height assignments for n intervals from given set, filter by ∫h≈1.

  Use for small n (3-10) to find optimal discrete patterns.'
input_schema:
  type: object
  properties:
    num_intervals:
      type: integer
      description: Intervals (3-10)
    heights:
      type: array
      description: Allowed values [0,0.5,1]
    domain:
      type: number
      default: 2.0
