type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK. For strategic changes, **complete rewrites preferred**.


  When rewriting: replace the entire ErdosOptimizer with a direct construction approach,

  or keep optimizer but add construct_candidate calls before optimization.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
