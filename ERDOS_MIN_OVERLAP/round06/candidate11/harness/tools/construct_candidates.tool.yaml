type: tool
name: construct_candidates
description: 'Generate 5-10 explicit piecewise constant candidate functions with FEW BREAKPOINTS (2-6).
  Each candidate:

  - Is a valid step function with values in [0,1]

  - Has integral exactly 1 over [0,2]

  - Returns the candidate h values discretized at num_intervals

  Call this FIRST to get valid starting points instead of relying on gradient initialization.'
