type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. **PREFERRED: COMPLETE REWRITES** that implement piecewise constant
  constructions with 2-6 breakpoints.


  Bad edits: Tiny hyperparameter tweaks to the 800-point gradient optimizer.

  Good edits: Rewrite from scratch to use explicit breakpoint structures (2-6 breakpoints, 5-10 parameters
  total).


  Example rewrite pattern:

  - Replace the multi-restart Adam optimizer with direct construction

  - Define 3-5 breakpoints explicitly

  - Optimize just breakpoint positions and heights

  - Start with num_intervals=100, then refine to 400-800'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
