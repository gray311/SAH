type: tool
name: edit_solution
description: 'COMPLETE REWRITES REQUIRED. Each edit should create a fundamentally new candidate

  step function based on mathematical construction principles.


  Examples of good edits:

  - Replace entire ErdosOptimizer class with a direct construction approach

  - Change to a different search strategy (evolutionary, simulated annealing)

  - Construct explicit step functions with specific breakpoints and heights

  - Use completely different optimization paradigms


  Bad edits: small parameter tweaks, minor initialization changes.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
