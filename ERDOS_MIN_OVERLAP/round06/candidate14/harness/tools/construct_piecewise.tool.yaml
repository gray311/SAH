type: tool
name: construct_piecewise
description: 'Directly construct a piecewise constant step function h and compute its c5_bound. Bypasses
  the optimizer''s latent space. Returns h_values, c5_bound, integral, valid.


  Use this when proposing direct construction strategies rather than optimizing from scratch.'
input_schema:
  type: object
  properties:
    strategy:
      type: string
      description: One of single_step, double_step, three_step, symmetric, concentrated, custom
    params:
      type: object
      description: Strategy-specific parameters. Empty for standard strategies.
