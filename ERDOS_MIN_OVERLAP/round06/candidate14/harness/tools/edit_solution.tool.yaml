type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. For direct construction strategies, complete rewrites are strongly
  preferred. Replace the entire optimizer with a construction-based approach.


  For coarse-to-fine or initialization changes, search/replace edits are acceptable.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
