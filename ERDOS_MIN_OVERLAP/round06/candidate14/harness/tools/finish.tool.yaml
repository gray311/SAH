type: tool
name: finish
description: 'End when: (a) combined_score > 1.0 (success!), (b) budget exhausted, or (c) no progress
  after 8-10 diverse strategy attempts. Best program auto-submitted.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
