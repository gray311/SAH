type: tool
name: probe_solution
description: 'NEW CAPABILITY: Fast approximate evaluation on subsampled data. Scores are approximate but
  consistent within the probe budget. Does NOT consume the main evaluation budget (separate budget of
  approximately 30 probes).


  USE THIS TOOL: Before spending a full evaluate, probe 3-5 candidate edits. This filters out bad directions
  quickly. Typical workflow: probe edit A, probe edit B, probe edit C, evaluate the best.


  Call this tool whenever you have a candidate edit you want to quickly assess.'
