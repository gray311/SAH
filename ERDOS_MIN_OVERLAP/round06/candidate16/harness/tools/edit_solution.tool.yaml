type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. Rewrite the optimization loop to use pattern-based search:

  1. Call gen_step_function with different pattern types

  2. For each pattern, compute c5_bound using FFT correlation

  3. Optionally run brief optimization on promising patterns

  4. Return the best result found


  DO NOT just tweak hyperparameters. Replace the multi-restart Adam loop with a

  pattern-generation-and-evaluation loop.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
