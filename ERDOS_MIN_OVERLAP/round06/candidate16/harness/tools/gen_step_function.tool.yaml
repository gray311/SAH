type: tool
name: gen_step_function
description: 'Generate a candidate step function h: [0,2]→[0,1] satisfying integral(h)=1.

  Supports multiple pattern types: two_step, three_step_symmetric, five_step, waveform, concentrated.

  Each returns numpy array of h values on a discretized grid (num_intervals points).

  All constraints satisfied.'
input_schema:
  type: object
  properties:
    pattern_type:
      type: string
      enum:
      - two_step
      - three_step_symmetric
      - five_step
      - waveform
      - concentrated
    num_intervals:
      type: integer
      minimum: 50
      maximum: 1000
    seed:
      type: integer
      default: 42
  required:
  - pattern_type
