type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. Implement one of the specific constructions from the skill.


  Recommended: Replace _get_best_initialization with direct piecewise assignment using jnp.where.


  Example edit:

  x = jnp.linspace(0, 2, N)

  h = jnp.where((x >= 0.5) & (x < 1.5), 1.0, 0.0)

  return h'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
