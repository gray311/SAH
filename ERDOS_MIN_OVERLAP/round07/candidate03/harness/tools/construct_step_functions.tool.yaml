type: tool
name: construct_step_functions
description: Generate N piecewise constant candidate functions with M intervals each. Returns N code snippets.
  Call this FIRST. Use max_intervals=5-10.
input_schema:
  type: object
  properties:
    n_candidates:
      type: integer
      default: 20
    max_intervals:
      type: integer
      default: 10
    seed:
      type: integer
      default: 42
