type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK. Start by calling construct_step_functions, then edit to generate multiple
  diverse step function candidates.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
