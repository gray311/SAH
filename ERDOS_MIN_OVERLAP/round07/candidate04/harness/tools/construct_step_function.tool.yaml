type: tool
name: construct_step_function
description: 'Create a valid step function with specified breakpoints and heights.

  Automatically enforces constraints: h∈[0,1] and ∫h=1 over [0,2].

  Returns the step function array and its integral verification.

  Use this to generate candidate solutions without gradient descent.

  Call with: num_intervals (e.g., 3, 5, 10), and optionally heights or breakpoints.'
input_schema:
  type: object
  properties:
    num_intervals:
      type: integer
      minimum: 1
      maximum: 1000
    heights:
      type: array
      items:
        type: number
      minItems: 1
      maxItems: 1000
    custom_breakpoints:
      type: array
      items:
        type: number
      minItems: 0
      maxItems: 1000
  required:
  - num_intervals
