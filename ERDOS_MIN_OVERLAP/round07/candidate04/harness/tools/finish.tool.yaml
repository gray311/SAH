type: tool
name: finish
description: 'End when you achieve combined_score > 1.0 or have exhausted ~30 evaluations.

  The solver should have found a valid step function with c5_bound < 0.38092303510845016.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
