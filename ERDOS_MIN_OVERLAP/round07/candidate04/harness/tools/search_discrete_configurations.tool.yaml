type: tool
name: search_discrete_configurations
description: 'Generate multiple candidate step functions by exploring different configurations.

  Tries several patterns: single-interval concentration, double-interval split, uniform, etc.

  Each candidate is validated for constraints and returned with its properties.

  Use this to quickly generate 10-50 candidates to probe/evaluate.'
input_schema:
  type: object
  properties:
    num_candidates:
      type: integer
      minimum: 1
      maximum: 100
    num_intervals:
      type: integer
      minimum: 2
      maximum: 500
  required: []
