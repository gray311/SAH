type: tool
name: edit_solution
description: 'Rewrite with COMPLETE program redesign. Simpler architectures, direct construction, explicit
  integral=1.

  Bad: tiny tweaks. Good: new program structure.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
