type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. For this task, **prefer constructing explicit step functions**
  over gradient-based refinement. Use the `generate_candidates` tool to create diverse structured candidates,
  then evaluate them directly.


  Only use gradient-based optimization if you have a promising candidate and want to refine it (coarse-to-fine
  approach).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
