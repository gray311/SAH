type: tool
name: edit_solution
description: Rewrite to use few intervals (10-50), direct step function construction. No latent optimization.
  Test 2-5 explicit patterns.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
