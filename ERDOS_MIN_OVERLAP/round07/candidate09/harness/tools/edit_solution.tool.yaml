type: tool
name: edit_solution
description: 'Rewrite the EVOLVE-BLOCK with a complete new optimizer implementation.


  **DO NOT** make surgical edits. Instead:

  1. Use generate_candidates to get 5 structured candidate edits

  2. Choose one candidate strategy (recommend: two symmetric humps)

  3. Implement that strategy completely

  4. Optionally combine strategies (e.g., coarse intervals + good initialization)


  Key changes to make:

  - num_intervals = 100-200 (start coarse)

  - num_steps = 10000-30000 (less overfitting)

  - penalty_strength = 200-600 (more flexible h)

  - num_restarts = 5-10 (more exploration)

  - New initialization: use sigmoid of piecewise constant latent'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
