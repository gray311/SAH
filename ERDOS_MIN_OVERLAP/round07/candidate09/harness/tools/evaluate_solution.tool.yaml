type: tool
name: evaluate_solution
description: 'Run and get combined_score. You have ~30 evaluations.


  Strategy:

  1. First eval: generate_candidates + evaluate best

  2. Next 2-3 evals: probe 3-5 candidate constructions

  3. Evaluate top 2 candidates fully

  4. Refine winner with more intervals/steps

  5. Stop when combined_score > 1.0 or budget exhausted'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
