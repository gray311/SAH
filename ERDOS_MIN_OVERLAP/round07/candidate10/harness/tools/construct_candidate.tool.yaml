type: tool
name: construct_candidate
description: 'Generate a diverse step function candidate for the Erdős C₅ problem.

  Constructs piecewise constant functions: uniform, symmetric, concentrated, multi_step.

  Ensures ∫h=1 over [0,2] and h∈[0,1].

  Returns a seed program with the generator pre-built.

  **When to use**: Call 3-5 times with different parameters. Do NOT rely solely on Adam.

  **Parameters**: n_intervals (50-200), style, steps (for multi_step).'
input_schema:
  type: object
  properties:
    n_intervals:
      type: integer
      description: Discretization resolution (50-200 recommended)
    style:
      type: string
      description: Construction style (uniform, symmetric, concentrated, multi_step)
    steps:
      type: integer
      description: Number of piecewise segments (for multi_step, 2-6)
