type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. Prefer complete rewrites that change the optimization strategy
  entirely.


  **For this task**: Try fundamentally different approaches - replace Adam with construction-based solver,
  change initialization, use fewer intervals.


  Keep class structure but rewrite the core optimization loop.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
