type: tool
name: finish
description: 'End when:

  - combined_score > 1.0 (new record!)

  - 25+ evaluations used with no improvement

  - You''ve exhausted diverse construction strategies'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
