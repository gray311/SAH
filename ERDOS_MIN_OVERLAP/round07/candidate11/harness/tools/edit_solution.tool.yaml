type: tool
name: edit_solution
description: Edit the EVOLVE-BLOCK to improve the optimizer. Use COMPLETE REWRITES for major strategy
  changes. When creating new candidate functions, ensure the integral constraint ∫_0^2 h(x)dx = 1 is satisfied.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
