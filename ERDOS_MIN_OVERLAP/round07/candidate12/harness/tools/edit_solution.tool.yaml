type: tool
name: edit_solution
description: 'COMPLETELY REWRITE the EVOLVE-BLOCK with a new approach. The seed''s multi-restart Adam
  is failing.


  Required: Change the optimization strategy fundamentally. Examples:

  - Direct piecewise-constant construction with fixed supports

  - Gradient descent on h values directly (not latent → sigmoid)

  - Different initialization patterns (step functions, alternating patterns)

  - Fewer intervals (50-200) with simpler optimization


  Do NOT: Change single lines, tweak hyperparameters slightly, or preserve seed architecture.


  Structure: Keep Hyperparameters and ErdosOptimizer class names, but rewrite all methods with new logic.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
