type: tool
name: probe_solution
description: 'Get an APPROXIMATE score for rapid ranking. Uses subsampled data (~10s runtime, separate
  budget of 30 probes).


  Scores are approximate and not comparable to evaluate_solution scores.


  **USE PROBE FIRST**: Before each evaluate_solution, call probe_solution to:

  1. Check if constraints are satisfied (h∈[0,1], ∫h=1)

  2. Get approximate c5_bound ranking

  3. Decide if this candidate merits a full evaluation


  This lets you test many constructions cheaply before spending real evaluations.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
