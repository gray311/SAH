type: tool
name: generate_candidate
description: 'Generate a candidate step function h and compute its c5_bound directly.

  Input: type of construction (''single_step'', ''double_step'', ''uniform_gap'', ''symmetric_triple'').

  Returns a dict with ''h_values'' (array of 800 floats in [0,1]), ''integral'' (sum), ''c5_bound'' (float).

  This bypasses the optimizer entirely for quick candidate testing.'
input_schema:
  type: object
  properties:
    construction_type:
      type: string
      enum:
      - single_step
      - double_step
      - uniform_gap
      - symmetric_triple
      - concentrated
    num_intervals:
      type: integer
      default: 800
