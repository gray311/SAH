type: tool
name: edit_solution
description: 'Replace the EVOLVE-BLOCK with complete candidate solutions.

  Use gen_candidates to get structured replacements.

  Do not patch the optimizer.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
