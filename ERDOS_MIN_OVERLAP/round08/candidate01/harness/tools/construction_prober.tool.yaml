type: tool
name: construction_prober
description: 'Internally generates MANY step function constructions. Call this FIRST to

  explore 50-200 different designs before evaluating. Returns designs with

  proxy scores. Use this to escape local optima via combinatorial search.'
input_schema:
  type: object
  properties:
    num_constructions:
      type: integer
      description: Number of designs to generate
      default: 200
    focus:
      type: string
      description: Focus area
      default: simple
