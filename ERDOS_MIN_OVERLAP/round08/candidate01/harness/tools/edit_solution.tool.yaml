type: tool
name: edit_solution
description: 'Rewrite the EVOLVE-BLOCK to implement a new step function construction.

  Focus on simple designs: few breakpoints, clear values. Complete rewrites

  are encouraged.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
