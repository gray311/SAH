type: tool
name: construct_candidates
description: 'Generate explicit piecewise constant candidate functions for C5 optimization.

  Creates diverse starting points with controlled integral constraint.


  Strategies available:

  - single_block: h equals 1 on [0,1], 0 elsewhere

  - double_block: h equals 0.5 on [0,0.5] and [1.5,2]

  - three_block: h equals one-third on three intervals of length two-thirds

  - symmetric_two: symmetric blocks around x equals 1

  - asymmetric_three: three blocks with asymmetric placement

  - random_piecewise: random piecewise with 5 to 10 intervals


  Returns a dictionary with candidates, each specifying intervals and heights.


  Call this at the start of each evaluation to generate diverse candidates.'
input_schema:
  type: object
  properties:
    num_candidates:
      type: integer
      description: Number of candidates to generate, default 10
    strategies:
      type: array
      items:
        type: string
      description: Strategies to use
      default:
      - single_block
      - double_block
      - three_block
      - symmetric_two
      - asymmetric_three
