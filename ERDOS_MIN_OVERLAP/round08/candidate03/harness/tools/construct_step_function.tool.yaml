type: tool
name: construct_step_function
description: "Generate a step function h with specified structural properties for Erdős overlap minimization.\n\
  Constructs candidate solutions with mathematical insights rather than random initialization.\n\nParameters:\n\
  \  - pattern_type: 'symmetric' | 'concentrated' | 'multi_scale' | 'boundary' | 'random'\n  - num_intervals:\
  \ int (default 800)\n  - concentration_center: float (for concentrated patterns, where to center mass\
  \ in [0,2])\n  - symmetry_axis: float (for symmetric patterns, axis of symmetry in [0,2])\n  \nReturns\
  \ a latent vector that when passed through sigmoid gives a valid h in [0,1]."
input_schema:
  type: object
  properties:
    pattern_type:
      type: string
      enum:
      - symmetric
      - concentrated
      - multi_scale
      - boundary
      - random
    num_intervals:
      type: integer
      default: 800
    concentration_center:
      type: number
      default: 1.0
    symmetry_axis:
      type: number
      default: 1.0
