type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to change optimizer hyperparameters, initialization strategies, or
  construction logic.

  For major strategy changes, prefer complete rewrites of the EVOLVE-BLOCK.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
