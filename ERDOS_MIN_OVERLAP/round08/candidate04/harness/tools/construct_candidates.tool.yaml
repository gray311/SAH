type: tool
name: construct_candidates
description: 'Generate diverse piecewise constant function templates for Erdős C₅ optimization.

  Create templates across multiple classes: single-step, double-step, symmetric,

  shifted blocks, sinusoidal mappings. Each template respects h∈[0,1] and ∫h=1.

  Call this when starting fresh or when stuck in local optima. Returns a dict with

  templates (each as {"name": str, "type": str, "h_values": list of N floats}) and

  optional precomputed scores if evaluator is callable.'
input_schema:
  type: object
  properties:
    num_intervals:
      type: integer
      description: Discretization resolution (use 100-200, not 800+)
    num_templates:
      type: integer
      description: Number of templates to generate (50-200)
    template_classes:
      type: array
      items:
        type: string
      description: Which template types to generate (single, double, symmetric, shifted, sinusoidal)
    seed:
      type: integer
      description: Random seed for reproducibility
  required: []
