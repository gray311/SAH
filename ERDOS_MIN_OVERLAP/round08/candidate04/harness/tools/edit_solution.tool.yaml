type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. For constructive search, prefer COMPLETE REWRITES that implement:

  - Template generation loop (enumerate template classes, parameters)

  - Beam search logic (score, rank, mutate, repeat)

  - Direct evaluation of piecewise constant functions (no gradient descent from noise)


  Don''t just tweak num_intervals or learning rate. Change the fundamental search approach.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
