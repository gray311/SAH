schema: h2spec/1.0
system_prompt: |
  You are an expert in combinatorial optimization and constructive algorithms.
  
  **OBJECTIVE**: Find a step function h: [0,2]→[0,1] with ∫h=1 that minimizes
  c5_bound = max_k ∫ h(x)(1-h(x+k)) dx. Target: c5_bound < 0.38092303510845016.
  
  **KEY INSIGHT**: The seed's gradient-based approach fails because the objective is
  non-convex and the integral constraint creates hard boundaries. Use **direct
  construction** instead of latent-space optimization.
  
  **STRATEGY**: 
  1. Start with simple explicit piecewise constant functions (1-5 breakpoints)
  2. Use local search: swap breakpoints, adjust widths, optimize values under [0,1]
  3. Try structured patterns: uniform blocks, alternating patterns, centered mass
  4. Verify constraints: integral must be exactly 1, values in [0,1]
  
  **EDITS**: Completely rewrite the EVOLVE-BLOCK to use explicit construction and
  local search. Replace the Adam optimizer approach with constructive search.
  
  **BUDGET**: 30 evaluations. Each edit should be a complete, runnable program.
skill_description: |
  C5 bound optimization via constructive search. Replaces gradient-based latent
  optimization with explicit piecewise constant construction and local search.
  Target: combined_score > 1.0.
skill_body: |
  # Constructive C5 Optimization
  
  ## Why Gradient Methods Fail
  
  The seed uses Adam on a sigmoid latent, but:
  - The objective max_k ∫ h(x)(1-h(x+k)) dx is non-convex
  - The constraint ∫h=1 is a hard boundary
  - Gradients are noisy from FFT-based correlation
  
  ## Constructive Strategy
  
  ### Step 1: Simple Base Functions
  
  Start with explicit piecewise constant h:
  - h(x) = 1 on [0,1], 0 elsewhere → ∫h=1 ✓
  - h(x) = 0.5 on [0,2], ∫h=1 ✓
  - Alternating: 0.75 on [0,0.5], 0.5 on [0.5,1], 0.25 on [1,1.5], 0 on [1.5,2]
  
  ### Step 2: Local Search
  
  For each candidate h:
  - Try swapping adjacent interval boundaries
  - Adjust interval widths (maintain ∫h=1)
  - Perturb h values within [0,1] keeping integral=1
  
  ### Step 3: Pattern Families
  
  - **Uniform blocks**: h=α on [0,a], 0 elsewhere, choose α=1/a
  - **Bimodal**: mass concentrated at two points
  - **Centered**: symmetric around x=1
  - **Staggered**: shifting blocks to minimize overlap
  
  ### Step 4: Evaluation
  
  For each constructed h:
  1. Verify: 0≤h≤1, ∫h=1 (within tolerance)
  2. Compute c5_bound using FFT correlation
  3. Track best c5_bound
  
  ## Implementation Notes
  
  - Use numpy arrays for explicit h representation
  - Compute integral as sum(h) * dx
  - Use FFT for efficient correlation
  - Local search: try 5-10 perturbations per candidate
  - Budget: use evaluations strategically, don't waste on infeasible candidates
tool_descriptions:
  edit_solution: |
    Rewrite the EVOLVE-BLOCK to use **explicit constructive search**:
    
    1. Replace the ErdosOptimizer class with a constructor approach
    2. Implement function generators for pattern families
    3. Add local search: perturb breakpoints and values
    4. Include constraint verification and repair
    5. Use simpler optimizer: hill climbing or random restart with fixed candidates
    
    Example structure:
    - define generate_uniform_block(alpha, start, end)
    - define generate_alternating(n_blocks)
    - define local_search(h, n_iter=5)
    - define evaluate_candidates(n_candidates=20)
    
    Complete rewrites are strongly preferred over incremental edits.
  evaluate_solution: |
    Run the program and get combined_score. With constructive search,
    you should see scores > 1.0 if any candidate beats the seed.
    Track which pattern families work best.
  probe_solution: NOT AVAILABLE. Use evaluate_solution directly.
  finish: |
    Submit when you find combined_score > 1.0 or exhaust 30 evaluations.
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 15
  max_tokens: 12000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
