type: tool
name: edit_solution
description: 'Rewrite the EVOLVE-BLOCK to use **explicit constructive search**:


  1. Replace the ErdosOptimizer class with a constructor approach

  2. Implement function generators for pattern families

  3. Add local search: perturb breakpoints and values

  4. Include constraint verification and repair

  5. Use simpler optimizer: hill climbing or random restart with fixed candidates


  Example structure:

  - define generate_uniform_block(alpha, start, end)

  - define generate_alternating(n_blocks)

  - define local_search(h, n_iter=5)

  - define evaluate_candidates(n_candidates=20)


  Complete rewrites are strongly preferred over incremental edits.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
