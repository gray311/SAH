type: tool
name: edit_solution
description: 'Rewrite the EVOLVE-BLOCK. Strategic changes require COMPLETE rewrites, not diffs.


  **Common rewrites that help:**

  - Replace entire _get_best_initialization method (use concrete patterns)

  - Modify Hyperparameters: reduce num_intervals to 200 initially

  - Add new candidate generation code before optimization

  - Change optimizer: try coordinate descent or Nelder-Mead


  **DO NOT:** Make surgical edits. The seed is stuck because its approach is fundamentally wrong.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
