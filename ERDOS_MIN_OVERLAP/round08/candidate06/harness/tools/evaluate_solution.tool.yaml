type: tool
name: evaluate_solution
description: 'Run and get combined_score. You have ~30 evaluations.


  **Use evals strategically:**

  - 1 eval: baseline (seed)

  - 1 eval: test concrete patterns (coarse 200 intervals)

  - 2-3 evals: refine best patterns (800 intervals)


  **If score ≤ 0.999641, try a completely different approach.**'
