type: tool
name: generate_pattern_candidates
description: 'Generate diverse step function candidates by trying specific mathematical patterns:

  single block, two blocks, uniform with shift, sine waves. Returns candidate h arrays

  that satisfy integral=1 (approximately). Use this to create multiple variants to eval.'
input_schema:
  type: object
  properties:
    num_candidates:
      type: integer
      default: 5
    num_intervals:
      type: integer
      default: 200
