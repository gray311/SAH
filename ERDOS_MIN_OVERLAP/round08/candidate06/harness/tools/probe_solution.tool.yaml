type: tool
name: probe_solution
description: 'Approximate evaluation on subsampled data. Separate budget of 30 probes.


  **Use probe_solution to:**

  - Rank multiple pattern candidates cheaply

  - Iterate on coarse discretization

  - Only confirm top candidates with evaluate_solution


  **Pattern:** Generate 10 patterns → probe all → eval top 3 → refine top 1.'
