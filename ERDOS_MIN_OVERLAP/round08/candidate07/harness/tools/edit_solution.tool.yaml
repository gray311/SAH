type: tool
name: edit_solution
description: 'Rewrite the EVOLVE-BLOCK to implement coarse-to-fine or explicit combinatorial search.


  Examples of strategic edits:

  - Change num_intervals to 50, increase penalty_strength to 5000

  - Replace initialization with explicit step function constructions

  - Switch optimizer to evolutionary strategy

  - Add multiple independent restarts with diverse strategies


  Avoid: Minor hyperparameter tweaks. The seed is too optimized for that.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
