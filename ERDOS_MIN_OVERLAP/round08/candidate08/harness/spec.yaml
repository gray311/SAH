schema: h2spec/1.0
system_prompt: |
  You are optimizing for the Erdős minimum overlap constant C5.
  Goal: Find c5_bound < 0.38092303510845016 to achieve combined_score > 1.0.
  
  **CRITICAL INSIGHT**: The seed's gradient-based Adam optimizer gets trapped in local optima (~0.999641 combined_score). To escape:
  
  1. **Use struct_generate_candidates** to create programs with DIFFERENT ansatz families:
     - Pure step functions (few breakpoints)
     - Sinusoidal mixtures
     - Piecewise constant with 2-5 segments
     - Non-gradient optimization (GA, SA)
  
  2. **Strategy**: Generate 3-5 diverse candidates, evaluate top 2-3, then refine the best.

new_tools:
  - name: struct_generate_candidates
    description: |
      Generate 3-10 candidate programs with different ansatz families.
      Each candidate uses a unique optimization strategy.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import jax
          import jax.numpy as jnp
          N = 800
          
          def make_step():
              h = jnp.zeros(N)
              h = h.at[0:400].set(1.0)
              h = h.at[400:800].set(0.0)
              h = h / (jnp.sum(h) * 2.0 / N)
              return h
          
          def make_sin():
              x = jnp.linspace(0, 2, N)
              latent = jnp.sin(3 * jnp.pi * x) * 0.8 + jnp.cos(5 * jnp.pi * x) * 0.4
              h = jax.nn.sigmoid(latent)
              h = h / (jnp.sum(h) * 2.0 / N)
              return h
          
          def make_piecewise():
              h = jnp.zeros(N)
              heights = [0.9, 0.2, 0.3, 0.1, 0.5]
              for i, hi in enumerate(heights):
                  s = int(i * N / 5)
                  e = int((i + 1) * N / 5)
                  h = h.at[s:e].set(hi)
              h = h / (jnp.sum(h) * 2.0 / N)
              return h
          
          def make_ga():
              key = jax.random.PRNGKey(42)
              pop_size = 20
              
              def random_h(key):
                  return jnp.clip(jax.random.uniform(key, (N,)) * 2.0 - 1.0, 0.0, 1.0)
              
              pop = [random_h(key) for _ in range(pop_size)]
              
              def fitness(h):
                  j_part = 1.0 - h
                  h_p = jnp.pad(h, (0, N))
                  j_p = jnp.pad(j_part, (0, N))
                  corr = jnp.fft.ifft(jnp.fft.fft(h_p) * jnp.conj(jnp.fft.fft(j_p))).real
                  c5 = jnp.max(corr * 2.0 / N)
                  int_h = jnp.sum(h) * 2.0 / N
                  return (1.0 - c5) * (1.0 + 0.1 * abs(int_h - 1.0))
              
              best_h, best_score = pop[0], fitness(pop[0])
              key, _ = jax.random.split(key)
              
              for _ in range(50):
                  selected = []
                  for _ in range(pop_size):
                      a, b = jax.random.choice(key, pop_size, replace=False).tolist()
                      selected.append(pop[a] if fitness(pop[a]) > fitness(pop[b]) else pop[b])
                  pop = selected
                  key, mut_key = jax.random.split(key)
                  for i in range(len(pop)):
                      pop[i] = jnp.clip(pop[i] + jax.random.normal(mut_key, (N,)) * 0.1, 0.0, 1.0)
                  for h in pop:
                      if fitness(h) > best_score:
                          best_score = fitness(h)
                          best_h = h
              return best_h / (jnp.sum(best_h) * 2.0 / N)
          
          def make_sa():
              key = jax.random.PRNGKey(123)
              h = jax.random.uniform(key, (N,)) * 2.0 - 1.0
              h = jnp.clip(h, 0.0, 1.0)
              
              def fitness(h):
                  j_part = 1.0 - h
                  h_p = jnp.pad(h, (0, N))
                  j_p = jnp.pad(j_part, (0, N))
                  corr = jnp.fft.ifft(jnp.fft.fft(h_p) * jnp.conj(jnp.fft.fft(j_p))).real
                  c5 = jnp.max(corr * 2.0 / N)
                  int_h = jnp.sum(h) * 2.0 / N
                  return (1.0 - c5) - 100.0 * abs(int_h - 1.0) ** 2
              
              best_h, best_score = h.copy(), fitness(h)
              temp = 10.0
              for _ in range(5000):
                  noise = jax.random.normal(key, (N,)) * 0.02
                  h_new = jnp.clip(h + noise, 0.0, 1.0)
                  score_new = fitness(h_new)
                  if score_new > best_score or jax.random.uniform(key) < jnp.exp((score_new - fitness(h)) / temp):
                      h = h_new
                      if score_new > best_score:
                          best_score = score_new
                          best_h = h.copy()
                  temp *= 0.998
              key, _ = jax.random.split(key)
              return best_h / (jnp.sum(best_h) * 2.0 / N)
          
          return {"candidates": ["make_step()", "make_sin()", "make_piecewise()", "make_ga()", "make_sa()"],
                  "note": "5 diverse strategies implemented: step-function, sinusoidal, piecewise-constant, genetic-algorithm, simulated-annealing"}

sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
new_skills:
  - name: structured-search-playbook
    description: |
      Playbook for escaping C5 local optima via structured candidate generation.
    body: |
      # C5 Optimization: Structured Search Playbook
      
      ## Problem: Local Optima Traps
      
      The seed's Adam optimizer with 12 initializations converges to ~0.999641 combined_score.
      This is a local optimum. Gradient-based methods from similar starts cannot escape.
      
      ## Solution: Structurally Diverse Generation
      
      ### Step 1: Generate Diverse Candidates
      
      Use struct_generate_candidates to create programs with DIFFERENT mathematical structures:
      
      - **Pure step functions**: h=1 on [0,1], h=0 elsewhere (integral=1 by construction)
      - **Sinusoidal mixtures**: sin/cos combinations with sigmoid activation
      - **Piecewise constant**: 3-5 segments with optimized heights
      - **Genetic algorithm**: Population-based search with crossover/mutation
      - **Simulated annealing**: Metropolis-Hastings-style optimization
      
      ### Step 2: Evaluate and Select
      
      - Evaluate each candidate with evaluate_solution
      - Select the 2-3 highest-scoring candidates
      - Analyze which ansatz family performed best
      
      ### Step 3: Refine the Winner
      
      - Keep the successful ansatz structure
      - Optimize hyperparameters: num_intervals, learning_rate, penalty_strength
      - Add small variations or alternative initializations
      
      ### Step 4: Constraint Enforcement
      
      Always ensure integral of h equals 1:
      - Pre-normalize in the ansatz construction
      - Post-normalize before evaluation
      
      ## Key Insights
      
      - The seed's 12 patterns all use sigmoid-softmax latent - try fundamentally different structures
      - Step functions (few breakpoints) may find better optima with less flexibility
      - Non-gradient methods explore the space differently than Adam
      - The objective landscape likely has multiple disconnected basins
      
      ## Success Criteria
      
      - combined_score > 1.0 means c5_bound < 0.38092303510845016
      - Focus on STRUCTURAL diversity, not hyperparameter tuning alone
new_middlewares:
  - name: diversify_reminder
    hook: before_model
    description: |
      When agent is stuck at seed-level performance, remind it to generate different candidates.
    implementation_py: |
      def before_model(hook_input):
          current_score = hook_input.get("current_combined_score", 0.0)
          best_score = hook_input.get("best_combined_score", 0.0)
          if current_score < 1.0 and best_score <= 0.999641 + 0.001:
              return "ALERT: Stuck at seed-level (~0.999641). USE struct_generate_candidates NOW to create programs with DIFFERENT structures: step functions, sinusoidal patterns, piecewise-constant, genetic algorithms, or simulated annealing. Generate 3-5 diverse candidates, evaluate top 2-3, refine the winner. Gradient descent is trapped - you need new ansatz families."
          return None
