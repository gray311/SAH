type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. For strategic changes, **complete rewrites are strongly preferred**.

  SEARCH/REPLACE diffs are fine for minor tweaks but won''t help much here.


  When rewriting: keep the same class structure (Hyperparameters, ErdosOptimizer), but change

  the initialization strategies, optimizer settings, or overall approach.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
