schema: h2spec/1.0
system_prompt: |
  You are an expert in harmonic analysis and mathematical construction. Your task is to find step functions h: [0,2]→[0,1] with ∫h=1 that minimize max_k ∫h(x)(1-h(x+k))dx.

  **OBJECTIVE**: Maximize combined_score = 0.38092303510845016 / c5_bound. Target: >1.0 (c5_bound < 0.380923)

  **CRITICAL INSIGHT**: The seed's gradient-based optimizer is trapped in local optima. You must use **explicit construction strategies**, not gradient descent.

  **STRATEGY**: Construct piecewise constant functions directly, then evaluate. Try:

  1. **Symmetric binary patterns**: h=1 on symmetric intervals, h=0 elsewhere (adjust height for ∫h=1)
     - e.g., h=0.5 on [0,0.4]∪[1.6,2], h=0 elsewhere (integral=0.8, scale to 1)
     - e.g., h=1 on [0.25,0.75] (integral=0.5, scale to 1: h=2 on this interval)

  2. **Multi-scale constructions**: Combine patterns at different scales
     - Base: single step h=2 on [0,0.5]
     - Refined: add smaller steps to reduce overlaps

  3. **Symmetric 3-part patterns**: h=a on [0,a], h=b on [a,1-a], h=a on [1-a,1] with a,b∈[0,1], ab≥1

  4. **Fourier-optimal patterns**: Functions whose autocorrelation is concentrated

  **CONSTRAINTS**: 
  - h must stay in [0,1] (this is hard: some constructions need h>1, which may be invalid)
  - ∫h over [0,2] must equal exactly 1
  - Test each construction's integral before submitting

  **EXECUTION**: 
  - Rewrite the EVOLVE-BLOCK with COMPLETE NEW CONSTRUCTION STRATEGIES
  - Don't use gradient descent on latent vectors
  - Try 5-10 different explicit constructions per evaluation
  - Keep code simple: define h as piecewise constant, compute c5_bound directly

  **PATTERN LIBRARY** (implement at least 3):
  - Single block: h=2 on [0,0.5], 0 elsewhere (integral=1)
  - Double block: h=1 on [0.25,0.75] scaled to integral=1
  - Symmetric triple: h=a on [0,a] and [1-a,1], h=b in middle
  - Concentrated: very narrow high-value regions

  Spend 5-10 evals exploring diverse constructions. You likely need to submit 20-30 complete rewrites to find something better than the seed.
tool_descriptions:
  edit_solution: |
    **COMPLETE REWRITES ONLY**. The seed's gradient-based approach fails. Replace the entire optimization strategy with explicit construction of step functions.
    
    Implement piecewise constant functions directly. Define h using conditional expressions or explicit breakpoints. Do NOT use sigmoid(latent) + Adam.

    Example structure:
    ```python
    def compute_c5_bound(h_values, dx):
        # Direct computation for step function
        ...
    
    # Generate multiple candidates
    candidates = [
        ("single_block", lambda: piecewise_constant([0.0, 0.5], [2.0, 0.0])),
        ("double_block", lambda: piecewise_constant([0.25, 0.75], [c, 0.0])),  # c computed for ∫h=1
        ...
    ]
    ```
    
    Compute c5_bound for each candidate, return the best. No gradient optimization.
  evaluate_solution: |
    Run the program. Expected output: combined_score, c5_bound, n_points. Score >1.0 means breakthrough.
  probe_solution: NOT AVAILABLE for this fast evaluator.
  finish: |
    Submit when you have exhausted diverse construction strategies (~20-30 rewrites) or found combined_score >1.0.
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 10000
new_tools:
  - name: construct_step_function
    description: |
      Generate a piecewise constant step function with specified breakpoints and values. Ensures integral constraint by scaling. Call this to create construction candidates instead of using gradient-based optimization.
    input_schema:
      type: object
      properties:
        breakpoints:
          type: array
          items:
            type: number
        values:
          type: array
          items:
            type: number
        target_integral:
          type: number
          default: 1.0
    implementation_py: |
      def run(ctx, args):
          breakpoints = args.get("breakpoints", [])
          values = args.get("values", [])
          target_int = args.get("target_integral", 1.0)
          
          if len(breakpoints) != len(values) or len(breakpoints) < 2:
              return {"error": "Invalid breakpoints/values"}
          
          # Sort breakpoints in [0, 2]
          sorted_bps = sorted([0.0] + breakpoints + [2.0])
          if len(sorted_bps) < 2:
              return {"error": "Need at least 2 breakpoints"}
          
          # Compute current integral
          intervals = [(sorted_bps[i], sorted_bps[i+1], values[i]) 
                      for i in range(len(sorted_bps)-1)]
          current_int = sum((b2-b1)*v1 for (b1,b2,v1) in intervals)
          
          if current_int == 0:
              return {"error": "Integral is zero, cannot normalize"}
          
          scale = target_int / current_int
          scaled_values = [v * scale for v in values]
          
          # Return piecewise definition
          intervals_str = []
          for i in range(len(sorted_bps)-1):
              b1, b2, v = sorted_bps[i], sorted_bps[i+1], scaled_values[i]
              intervals_str.append(f"[{b1:.4f}, {b2:.4f}): value={v:.4f}")
          
          return {
              "function": "piecewise_constant",
              "intervals": intervals_str,
              "integral": float(current_int * scale),
              "scaled_values": scaled_values,
              "note": f"Scaled from integral {current_int:.4f} to {target_int:.4f}"
          }
new_skills:
  - name: step-function-constructions
    description: |
      Expert methods for constructing step functions to minimize Erdős overlap. Use explicit piecewise definitions, not gradient optimization.
    body: |
      # Step Function Constructions for Erdős C5 Bound

      ## Why Gradient Descent Fails
      The objective max_k ∫h(x)(1-h(x+k))dx has many local optima. 
      Gradient descent from random starts gets trapped. We need explicit constructions.

      ## Construction Strategies

      ### 1. Single Block (Baseline)
      h = 2.0 on [0, 0.5], h = 0 elsewhere
      - Integral: 1.0 ✓
      - This is a natural starting point

      ### 2. Two Equal Blocks
      h = c on [0.25, 0.75], h = 0 elsewhere
      - Integral: c * 0.5 = 1.0 ⇒ c = 2.0
      - More spread out than single block

      ### 3. Symmetric Three-Block
      h = a on [0, a] ∪ [1-a, 1], h = b on [a, 1-a]
      - Integral: 2*a*a + b*(1-2*a) = 1.0
      - Choose a, then solve for b: b = (1 - 2*a²)/(1-2*a)
      - Try a = 0.1, 0.2, 0.25, etc.

      ### 4. Concentrated Mass
      h = 4.0 on [0, 0.25], h = 0 elsewhere
      - Integral: 1.0 ✓
      - Very concentrated, high peaks

      ### 5. Multi-Scale Construction
      Start with base pattern, add smaller features
      - h = 2.0 on [0, 0.5] (base)
      - Add h = c on [0.1, 0.2] with negative contribution elsewhere
      - This is complex; start simple first

      ### 6. Uniform Distribution (Upper Bound Check)
      h = 0.5 everywhere on [0, 2]
      - Integral: 1.0 ✓
      - Compute c5_bound to establish baseline

      ## Algorithm
      For each construction:
      1. Define breakpoints and raw values
      2. Compute integral, scale to make ∫h=1
      3. Verify 0 ≤ h ≤ 1 after scaling (some constructions violate this!)
      4. Compute c5_bound using FFT-based convolution
      5. Track the best c5_bound found

      ## Key Insight
      The optimal solution likely has a specific symmetric structure related to 
      the Fourier transform properties of the autocorrelation. Explore symmetric patterns first.
