type: tool
name: construct_step_function
description: Generate a piecewise constant step function with specified breakpoints and values. Ensures
  integral constraint by scaling. Call this to create construction candidates instead of using gradient-based
  optimization.
input_schema:
  type: object
  properties:
    breakpoints:
      type: array
      items:
        type: number
    values:
      type: array
      items:
        type: number
    target_integral:
      type: number
      default: 1.0
