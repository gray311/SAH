type: tool
name: edit_solution
description: "**COMPLETE REWRITES ONLY**. The seed's gradient-based approach fails. Replace the entire\
  \ optimization strategy with explicit construction of step functions.\n\nImplement piecewise constant\
  \ functions directly. Define h using conditional expressions or explicit breakpoints. Do NOT use sigmoid(latent)\
  \ + Adam.\n\nExample structure:\n```python\ndef compute_c5_bound(h_values, dx):\n    # Direct computation\
  \ for step function\n    ...\n\n# Generate multiple candidates\ncandidates = [\n    (\"single_block\"\
  , lambda: piecewise_constant([0.0, 0.5], [2.0, 0.0])),\n    (\"double_block\", lambda: piecewise_constant([0.25,\
  \ 0.75], [c, 0.0])),  # c computed for ∫h=1\n    ...\n]\n```\n\nCompute c5_bound for each candidate,\
  \ return the best. No gradient optimization."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
