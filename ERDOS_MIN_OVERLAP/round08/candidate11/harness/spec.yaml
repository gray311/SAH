schema: h2spec/1.0
system_prompt: |
  You are an expert in constructing step functions for the Erdős minimum overlap problem.

  **OBJECTIVE**: Maximize combined_score = 0.38092303510845016 / c5_bound
  where c5_bound is the maximum overlap integral. Target: c5_bound < 0.38092303510845016.

  **CONSTRAINTS**: h: [0,2] → [0,1], ∫h = 1 over [0,2].

  **WINNING STRATEGY**: Don't use gradient descent on 800-point discretizations. Instead:

  1. **Coarse construction**: Start with num_intervals=50, construct explicit piecewise constant functions
  2. **Explicit restart classes**: Try different structural patterns:
     - Concentrated mass: h=1 on [0,1], h=0 elsewhere (adjust for constraints)
     - Symmetric blocks: h constant on [0,a], [b,2] for various a,b
     - Multi-block patterns: h on [0,x1], [x2,x3], [x4,2] with different heights
     - Sine-wave approximations: h(x) ≈ 0.5 + 0.5*sin(π(x-1)) + noise
  3. **Iterative refinement**: Once you find a decent pattern with 50 intervals, refine to 200, then 800
  4. **Budget discipline**: With ~30 evals, try 5-8 different structural classes, not 30 small tweaks

  **EDIT GUIDANCE**: Complete rewrites of the EVOLVE-BLOCK are needed. Replace the Adam optimizer with explicit construction and optimization over breakpoint positions/values.

  **AGENCY**: You can completely redesign the optimizer class. Try evolutionary search over breakpoint configurations, or construct candidates explicitly and use local search.
skill_description: |
  C₅ bound optimization via constructive search. Focus on explicit step function designs rather than gradient descent. Targets combined_score > 1.0.
skill_body: |
  # Erdős C₅ Bound: Constructive Search Strategy

  ## Problem
  Minimize max_k ∫₀² h(x)(1-h(x+k))dx subject to h:[0,2]→[0,1], ∫h=1.

  ## Why Gradient Descent Fails
  - Many local minima in the landscape
  - Narrow feasible region from ∫h=1 constraint
  - Dense discretization (800 points) is too fine for global structure

  ## Winning Approach: Explicit Construction

  ### Step 1: Coarse-Grained Design
  - Use num_intervals=50 to 100
  - Design piecewise constant functions with few breakpoints
  - Optimize breakpoint positions and block heights

  ### Step 2: Structural Classes to Explore
  1. **Single block**: h=1 on [0,1], 0 elsewhere (baseline)
  2. **Split block**: h on [0,a] and [2-a,2] for various a∈[0.2,0.8]
  3. **Three-block**: h on [0,a], [b,c], [2-c,2] with different heights
  4. **Symmetric wave**: h(x) = 0.5 + 0.5*sigmoid(10*(x-1)) and variants
  5. **Concentrated peaks**: Narrow high-value regions separated by zeros

  ### Step 3: Implementation Strategy
  - Replace Adam with: evolutionary search over breakpoints OR explicit enumeration
  - Start with 50 intervals, find good c5_bound, then refine to 800
  - Use multiple independent searches from different structural seeds
  - Track best c5_bound across all searches

  ### Step 4: Hyperparameter Guidance
  - num_intervals: 50 (coarse), then 200, then 800 (refinement)
  - num_restarts: 10-20 different structural seeds
  - Don't rely on learning rate tuning; focus on search diversity

  ## Execution Plan
  1. Rewrite the optimizer to use explicit construction
  2. Start with 50 intervals and 10-15 structural restarts
  3. Try at least 3-4 different structural classes
  4. If promising, refine to 200-800 intervals
  5. Target: c5_bound < 0.38092303510845016 for combined_score > 1.0
tool_descriptions:
  edit_solution: |
    Rewrite the EVOLVE-BLOCK to implement constructive search:
    - Replace Adam optimizer with explicit pattern generation or evolutionary search
    - Start with num_intervals=50, optimize breakpoints/heights
    - Try multiple structural classes (single block, split block, multi-block, wave)
    - Use complete rewrites, not small patches
    - Consider using evolutionary algorithms or explicit enumeration over configurations
  evaluate_solution: |
    Run the program to get combined_score. With ~30 evals, each counts.
    Results should show c5_bound < 0.38092303510845016 for combined_score > 1.0.
  probe_solution: |
    NOT AVAILABLE for this fast JAX/NumPy evaluator. Use evaluate_solution directly.
  finish: |
    End when you achieve combined_score > 1.0 or exhaust ~30 evals.
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools:
  - name: suggest_construction
    description: |
      Suggest explicit step function constructions for Erdős C₅ problem.
      Provides breakpoint configurations and block heights for piecewise constant functions.
      Call when you need new structural seeds beyond the current search space.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          constructions = [
              {'breakpoints': [0, 1, 2], 'heights': [1.0, 0.0]},
              {'breakpoints': [0, 0.5, 1.5, 2], 'heights': [0.5, 0.0, 0.0, 0.5]},
              {'breakpoints': [0, 2/3, 4/3, 2], 'heights': [0.5, 0.0, 0.5]},
              {'breakpoints': [0, 0.3, 0.4, 1.6, 1.7, 2], 'heights': [0.0, 0.5, 0.0, 0.0, 0.5, 0.0]},
              {'breakpoints': [0, 1, 2], 'heights': [0.0, 0.5, 0.0]},
              {'breakpoints': [0, 0.4, 1.6, 2], 'heights': [0.4, 0.0, 0.6, 0.0]},
          ]
          return {'constructions': constructions, 'note': 'Try varying heights and breakpoint positions'}
new_skills:
  - name: constructive-search
    description: |
      Guide for constructive search in Erdős C₅ optimization.
      Use explicit pattern generation with few breakpoints instead of 800-parameter gradient descent.
      Start coarse (50 intervals), explore structural classes, then refine.
    body: |
      # Constructive Search for Erdős C₅ Bound

      ## Core Idea
      The optimal step function for the Erdős minimum overlap problem is likely a **combinatorial arrangement** with few breakpoints, not a smooth function found by gradient descent on 800 parameters.

      ## Why Gradient Descent Fails
      - Landscape has many local minima
      - The ∫h=1 constraint creates a narrow feasible region
      - 800 parameters is too many for effective gradient search
      - Small steps can't escape poor local optima

      ## Winning Strategy: Coarse-Grained Construction

      ### Step 1: Start with Coarse Discretization
      - Set num_intervals=50 (not 800!)
      - Design piecewise constant functions with 5-15 breakpoints
      - This reduces the search space to manageable combinatorial choices

      ### Step 2: Explore Structural Classes
      Systematically try different structural patterns:

      **1. Single Block**
      - h(x) = 1 for x ∈ [0, 1], 0 elsewhere
      - Baseline: c5_bound ≈ 0.380923

      **2. Split Blocks**
      - h on [0, a] and [2-a, 2] with equal height = a
      - Vary a ∈ [0.2, 0.8]
      - Symmetry may reduce maximum overlap

      **3. Multi-Block**
      - 3-5 blocks at different positions
      - Place to minimize pairwise overlap
      - Example: blocks on [0,0.2], [0.6,0.8], [1.2,1.4], [1.8,2.0]

      **4. Wave Patterns**
      - h(x) ≈ 0.5 + amplitude * sin(2π(x-1))
      - Or sigmoid-based smooth transitions
      - Helps explore the "middle ground" solutions

      **5. Concentrated Peaks**
      - Narrow high-value regions separated by zeros
      - Can achieve low overlap if peaks are well-separated

      ### Step 3: Optimization Within Each Class
      - **Don't use Adam** for parameter tuning
      - Instead: use small perturbations, evaluate, keep improvements (hill climbing)
      - Or: enumerate discrete choices (breakpoint positions, block heights)
      - Or: use evolutionary algorithms (random initialization, crossover, mutation)

      ### Step 4: Refinement Path
      Once you find a promising pattern with 50 intervals:
      1. Refine to 200 intervals (keep the same structure, more points per block)
      2. Further refine to 800 intervals for final answer
      3. Only then compute the definitive score

      ### Step 5: Budget Discipline
      - You have ~30 evaluations total
      - Try 5-8 different structural classes, not 30 small tweaks
      - If a class shows promise (combined_score improves), invest more evals
      - If not, move to the next class quickly

      ## Implementation Guidance

      ### Rewriting the Optimizer
      Replace the ErdosOptimizer class with something like:

      - Explicit candidate generation + local search
      - Evolutionary algorithm over breakpoint configurations
      - Grid search over structural parameters

      ### Key Changes
      1. **num_intervals**: Start at 50, not 800
      2. **Initializations**: Use explicit patterns, not random latent vectors
      3. **Optimization**: Use evolutionary/hill-climbing instead of Adam
      4. **Restarts**: 10-20 different structural seeds, not 12 random ones

      ## Expected Outcome
      By focusing on combinatorial construction rather than continuous optimization, you should be able to find solutions with c5_bound < 0.380923, achieving combined_score > 1.0.
new_middlewares:
  - name: budget_alert
    hook: before_model
    description: |
      Remind the agent to use constructive search and not waste evals on unproductive searches.
    implementation_py: |
      def before_model(hook_input):
          return "Focus on constructive search: explicit step function designs with few breakpoints. Start with num_intervals=50, try multiple structural classes (single block, split blocks, multi-block, wave). Don't rely on gradient descent. Use ~30 evals wisely: try 5-8 structural classes, not many small tweaks."
