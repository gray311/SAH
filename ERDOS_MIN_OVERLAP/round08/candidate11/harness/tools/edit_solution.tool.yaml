type: tool
name: edit_solution
description: 'Rewrite the EVOLVE-BLOCK to implement constructive search:

  - Replace Adam optimizer with explicit pattern generation or evolutionary search

  - Start with num_intervals=50, optimize breakpoints/heights

  - Try multiple structural classes (single block, split block, multi-block, wave)

  - Use complete rewrites, not small patches

  - Consider using evolutionary algorithms or explicit enumeration over configurations'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
