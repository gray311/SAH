type: tool
name: construct_candidate
description: 'Construct a candidate step function h directly without gradient descent.

  Specify the pattern type and parameters. Returns a JSON with the constructed h

  and its c5_bound (approximate). Call this to explore solution space systematically.'
input_schema:
  type: object
  properties:
    pattern:
      type: string
      description: 'Pattern type: "single_step", "double_step", "symmetric_3step", "concentrated_mass",

        "triangular", "sine_wave", "piecewise_constant"

        '
    num_intervals:
      type: integer
      description: Number of intervals (100-1000). Use 100-200 for coarse search, 500+ for refinement.
    params:
      type: object
      description: Pattern-specific parameters (see examples below)
