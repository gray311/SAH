type: tool
name: edit_solution
description: Surgical edits to the seed program. For strategic changes (new patterns, different optimizer),
  prefer constructing entirely new candidate solutions using construct_candidate instead.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
