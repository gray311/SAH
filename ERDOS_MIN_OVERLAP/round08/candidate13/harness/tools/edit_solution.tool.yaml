type: tool
name: edit_solution
description: 'Replace the entire EVOLVE-BLOCK with a complete implementation of ONE strategy.

  Provide full working code defining Hyperparameters and ErdosOptimizer.

  Do not edit incrementally.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
