schema: h2spec/1.0
system_prompt: |
  You are an expert in mathematical optimization for the Erdős minimum overlap problem.

  **OBJECTIVE**: Maximize combined_score = 0.38092303510845016 / c5_bound
  Find a step function h: [0,2]→[0,1] with ∫h=1 that minimizes max_k ∫ h(x)(1-h(x+k))dx.

  **CONSTRAINTS**: h∈[0,1], ∫_0^2 h(x)dx = 1

  **PROVEN STRATEGIES** (USE THESE CONCRETE APPROACHES):

  1. **Direct Construction with probe_solution**: 
     - Build piecewise constant functions analytically
     - Single step: h=1 on [0,1], 0 elsewhere (integral=1 ✓)
     - Double step: h=0.5 on [0,0.5]∪[1.5,2], 0 elsewhere
     - Symmetric 3-step: h=1/3 on [0,0.5]∪[1,1.5], 0 elsewhere
     - Call probe_solution to score before full evaluation

  2. **Coarse-to-fine refinement**:
     - Start with num_intervals=50, optimize briefly
     - Then 200, 500, 800 intervals
     - Use momentum/adaptive learning rates

  3. **Hybrid approach**: 
     - Manually design candidate breakpoints, optimize only the step heights
     - Keep num_intervals low (100-200) but optimize step values thoroughly

  **SEARCH PROCESS**:
  - First, construct 3-5 diverse candidates using direct construction
  - Probe each to rank them cheaply
  - Evaluate the top 2-3 candidates fully
  - If no improvement, try coarse-to-fine refinement
  - Stay within budget (~30 evals total)

  **KEY INSIGHT**: The seed's gradient descent gets stuck in local optima. 
  Direct construction of mathematically informed candidates + cheap probing = breakthrough.
new_tools:
  - name: construct_candidates
    description: |
      Generate 5 diverse mathematically informed step function candidates.
      Each satisfies h∈[0,1] and ∫h=1. Returns candidates with their initial c5_bound estimate.
      Call this ONCE at the start to get starting points.
    input_schema: {type: object, properties: {}}
    implementation_py: |
      def run(ctx, args):
          import math
          N = ctx.hypers.num_intervals
          dx = 2.0 / N
          
          candidates = []
          
          # Candidate 1: Single step on [0,1]
          h1 = jnp.zeros(N)
          h1[:N//2] = 1.0  # [0,1]
          candidates.append(("single_step_0_1", h1, None))
          
          # Candidate 2: Double step [0,0.5] and [1.5,2] with height 0.5
          h2 = jnp.zeros(N)
          h2[:N//4] = 0.5
          h2[3*N//4:] = 0.5  # [1.5, 2]
          candidates.append(("double_step_sym", h2, None))
          
          # Candidate 3: 3-step equal intervals [0,2/3], [2/3,4/3], [4/3,2]
          h3 = jnp.zeros(N)
          n_third = N // 3
          h3[:n_third] = 0.5
          h3[n_third:2*n_third] = 0.5
          candidates.append(("three_step_eq", h3, None))
          
          # Candidate 4: Concentrated at center [0.75, 1.25]
          h4 = jnp.zeros(N)
          h4[N//3:2*N//3] = 1.0
          candidates.append(("centered_block", h4, None))
          
          # Candidate 5: Sinusoidal-like: high in middle, low at edges
          h5 = jnp.zeros(N)
          for i in range(N):
              x = 2.0 * i / N
              if 0.25 <= x <= 1.75:
                  h5[i] = 1.0
          candidates.append(("wide_middle", h5, None))
          
          # Compute c5 for each candidate
          results = []
          for name, h, _ in candidates:
              h_padded = jnp.pad(h, (0, N))
              corr = jnp.fft.ifft(jnp.fft.fft(h_padded) * jnp.conj(jnp.fft.fft(h_padded))).real
              c5 = float(jnp.max(corr) * dx)
              results.append({"name": name, "c5_bound": c5, "h": h.tolist()})
          
          return {"candidates": results}
new_skills:
  - name: direct-construction-playbook
    description: |
      Build step functions directly from mathematical insights, not via gradient descent.
      Use simple piecewise constants that satisfy ∫h=1, then probe/rank them.
    body: |
      # Direct Construction Strategy for C5 Optimization

      ## Why Gradient Descent Fails Here
      The landscape has many local optima. The seed's Adam optimizer gets stuck.
      Better: construct informed candidates analytically.

      ## Construction Recipes

      ### 1. Single Step Function
      h(x) = 1 if x ∈ [0,1], else 0
      - Integral: 1×1 = 1 ✓
      - This is a baseline; often suboptimal but easy to compute

      ### 2. Symmetric Double Step
      h(x) = 0.5 if x ∈ [0,0.5] ∪ [1.5,2], else 0
      - Integral: 0.5×0.5 + 0.5×0.5 = 0.5 ✓ (need to scale)
      - Actually: h=1 on [0,0.5]∪[1.5,2] gives integral=1 ✓

      ### 3. Three Equal Steps
      Divide [0,2] into 3 parts, put h=1 on two parts
      - Integral: 1×(4/3) > 1, so use h=0.75 on two thirds

      ### 4. Concentrated Mass
      Place most of the mass in the center [0.75,1.25]
      - May reduce overlap with shifted versions

      ### 5. Sinusoidal Approximation
      h(x) ≈ 0.5 + 0.5×sin(π(x-1)) shifted to be positive
      - Discretize carefully to get ∫h=1

      ## Workflow
      1. Generate 3-5 candidates using these recipes
      2. Call probe_solution on each to get cheap scores
      3. Rank and evaluate top 2-3
      4. If needed, refine with gradient descent from promising starts

      ## Key Insight
      Direct construction > random initialization + gradient descent
      Mathematical structure beats brute force search
tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK. Use construct_candidates to get starting points.
    For major strategy changes, **complete rewrites** are preferred.
    When rewriting, keep Hyperparameters and ErdosOptimizer class structure.
    Change: initialization strategies, optimizer config, or use direct construction.
  evaluate_solution: |
    Run and get combined_score. You have ~30 evals.
    First use construct_candidates and probe_solution to filter, then evaluate top candidates.
  probe_solution: |
    Get a fast approximate c5_bound score. USE THIS BEFORE FULL EVALUATION.
    Call probe_solution for each candidate from construct_candidates to rank them cheaply.
    Only evaluate_solution the top 2-3 promising candidates.
  finish: |
    End when you find combined_score > 1.0 or exhaust budget.
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 15
  max_tokens: 12000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_middlewares:
  - name: probe_reminder
    hook: before_tool
    description: |
      Remind the solver to use probe_solution before evaluate_solution.
      This ensures cheap ranking of variants before spending full evals.
    implementation_py: |
      def before_tool(hook_input):
          current_tool = hook_input.get("current_tool", "")
          if current_tool == "evaluate_solution" and "probe_solution" not in hook_input.get("recent_tools", ""):
              return "💡 TIP: Call probe_solution first to cheaply rank candidates! Only evaluate the top 2-3."
          return None
