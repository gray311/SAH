type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. Use construct_candidates to get starting points.

  For major strategy changes, **complete rewrites** are preferred.

  When rewriting, keep Hyperparameters and ErdosOptimizer class structure.

  Change: initialization strategies, optimizer config, or use direct construction.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
