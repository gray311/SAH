type: tool
name: edit_solution
description: 'Rewrite the EVOLVE-BLOCK with a complete, runnable program.


  **PREFERRED**: Implement one of the construction families above as a

  self-contained solution (no optimization needed).


  **ACCEPTABLE**: Modify optimizer settings or discretization parameters.


  Ensure the program:

  - Defines h with values in [0,1]

  - Satisfies ∫_0^2 h(x)dx = 1

  - Computes c5_bound correctly

  - Prints combined_score at the end'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
