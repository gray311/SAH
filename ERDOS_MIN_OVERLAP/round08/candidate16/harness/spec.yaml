schema: h2spec/1.0
system_prompt: |
  You are an expert in mathematical optimization for the Erdos minimum overlap problem.

  OBJECTIVE: Maximize combined_score = 0.38092303510845016 / c5_bound
  Target: Find c5_bound < 0.38092303510845016 (combined_score > 1.0)

  CONSTRAINTS: h:[0,2]->[0,1], integral(h)=1, minimize max_k int h(x)(1-h(x+k))dx

  SEARCH STRATEGY: Try constructions in THIS ORDER (most promising first):

  1. Symmetric 3-level step: h=1.0 on [0,0.5] U [1,1.5], h=0 elsewhere
     - This gives c5_bound = 0.375 (known analytic result)
     - Modify slightly to optimize: adjust the on regions

  2. Optimized 2-level step: h=1 on [a,b], h=0 elsewhere, with integral=1
     - Single block gives c5_bound=0.5 (worse)
     - Try splitting: h=0.5 on [0,0.5] and [0.5+d,1+d] to reduce overlap

  3. Triangular-like pattern: Linear rise from 0 to 0.5, linear fall
     - h(x) = min(max(2*x, 0.5), 0.5) for x in [0,1], mirrored on [1,2]

  4. Cosine-based construction: h(x) = (1 + cos(pi*x))/2 on [0,2], scaled to integral=1

  5. Multi-periodic pattern: Use 2-3 different step heights with carefully chosen intervals

  For each construction:
  - Use num_intervals=200 for initial testing (faster eval)
  - If c5_bound < 0.38, try refining to num_intervals=800
  - Use simple gradient descent (Adam, lr=0.01) for 1000-2000 steps
  - Penalize integral constraint with weight 10000

  If a construction fails, try a different ONE before re-attempting.
  You have ~30 evaluations - spend them on diverse constructions, not iterative refinement.
skill_description: |
  C5 bound optimizer using targeted step-function constructions with gradient refinement.
  Focus on symmetric patterns, multi-level steps, and periodic constructions.
skill_body: |
  # C5 Bound Optimization: Targeted Construction Strategy

  ## Problem
  Minimize max_k int_0^2 h(x)(1-h(x+k))dx over h:[0,2]->[0,1] with int h=1.

  Current best: 0.38092303510845016 (C5 <= this value)

  ## Why Standard Gradient Descent Fails

  The objective is non-convex with many local optima. Random initializations get trapped.
  We need STRATEGIC constructions, not blind optimization.

  ## Recommended Constructions (Try in Order)

  ### Construction 1: Symmetric 3-Level (Baseline to beat)
  h = 1.0 on [0, 0.5] and [1, 1.5], h = 0 elsewhere
  - Expected c5_bound: ~0.375
  - Action: Start here, then perturb intervals

  ### Construction 2: Split Single Block
  h = 1 on [a, b] where (b-a) = 1
  - Try: [0,1], [0.25, 1.25], [0.5, 1.5], etc.
  - Shift to reduce self-overlap

  ### Construction 3: Triangular Wave
  h(x) = 2x for x in [0, 0.25], h(x) = 0.5 for x in [0.25, 0.75],
         h(x) = 1-2x for x in [0.75, 1.0], mirrored on [1,2]

  ### Construction 4: Cosine Symmetric
  h(x) = C * (1 + cos(pi * (x-1))) for x in [0,2], scaled to integral=1

  ### Construction 5: Three-Step Asymmetric
  h = a1 on [0, w1], a2 on [0.5, 0.5+w2], a3 on [1, 1+w3]
  Choose a1,a2,a3,w1,w2,w3 to minimize overlap

  ## Execution Protocol

  1. For each construction:
     - Set num_intervals = 200
     - Initialize h discretely as specified
     - Optimize for 1000-2000 steps with Adam (lr=0.01, penalty=10000)
     - Record c5_bound

  2. If c5_bound < 0.38:
     - Try num_intervals = 800 with same initialization
     - Try different optimizer settings (lr=0.001, steps=10000)

  3. If stuck at same score:
     - Try a DIFFERENT construction from the list
     - Do NOT spend 20 evals refining one construction

  4. Success criterion: combined_score > 1.0

  ## Important

  - Each evaluation is ~10-30 seconds
  - You have ~30 evaluations total
  - Diverse exploration beats deep refinement when starting from seed
  - The seeds multi-pattern initialization is too random; use STRUCTURED starts
tool_descriptions:
  edit_solution: |
    Rewrite the EVOLVE-BLOCK to implement ONE of the recommended constructions above.
    For structural changes, provide the COMPLETE new code (do not patch small sections).
    Keep Hyperparameters class but change: num_intervals, base_learning_rate, num_steps, penalty_strength.
    Completely rewrite _get_best_initialization() or _objective_fn() for new strategies.

  evaluate_solution: |
    Run program to get combined_score. With ~30 evals, try 3-5 diverse constructions.
    Stop early if you hit combined_score > 1.0.

  probe_solution: |
    Approximate evaluation on subsampled data (10x faster, 30-probe budget).
    Use this to quickly rank 5-10 construction variants before full evaluation.

  finish: |
    Submit when: combined_score > 1.0, or budget exhausted with no better constructions found.
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 15
  max_tokens: 8192
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
new_tools:
  - name: smart_initialization
    description: |
      Generate ONE of 5 pre-designed high-probability step functions for C5 optimization.
      Returns discretized h array and estimated c5_bound. Call once to start.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import jax.numpy as jnp
          N = ctx.hypers.num_intervals if hasattr(ctx, 'hypers') else 200
          domain = 2.0
          dx = domain / N

          def pattern1(x):
              result = jnp.where((x >= 0) & (x < 0.5), 1.0,
                                jnp.where((x >= 1.0) & (x < 1.5), 1.0, 0.0))
              return result

          x = jnp.linspace(0, 2, N)
          h = pattern1(x)
          integral = jnp.sum(h) * dx
          h_normalized = h / (integral / N)

          j_val = 1.0 - h_normalized
          h_padded = jnp.pad(h_normalized, (0, N))
          j_padded = jnp.pad(j_val, (0, N))
          corr_fft = jnp.fft.fft(h_padded) * jnp.conj(jnp.fft.fft(j_padded))
          correlation = jnp.fft.ifft(corr_fft).real
          c5_bound = float(jnp.max(correlation * dx))

          return {
              "pattern": "symmetric_3level",
              "h": h_normalized.tolist(),
              "c5_bound_estimate": c5_bound,
              "note": "Baseline construction. Perturb intervals to improve."
          }
