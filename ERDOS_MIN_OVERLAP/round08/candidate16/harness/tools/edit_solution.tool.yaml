type: tool
name: edit_solution
description: 'Rewrite the EVOLVE-BLOCK to implement ONE of the recommended constructions above.

  For structural changes, provide the COMPLETE new code (do not patch small sections).

  Keep Hyperparameters class but change: num_intervals, base_learning_rate, num_steps, penalty_strength.

  Completely rewrite _get_best_initialization() or _objective_fn() for new strategies.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
