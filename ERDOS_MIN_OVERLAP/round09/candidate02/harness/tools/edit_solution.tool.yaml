type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK region. Implement the multi-pattern search strategy:

  1. Call generate_diverse_seeds() first

  2. For each pattern, run short optimization with varying hyperparams

  3. Probe-rank all candidates, refine top 3 with mutations

  4. Evaluate best candidate and report combined_score'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
