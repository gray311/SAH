type: tool
name: analyze_correlation_spectrum
description: 'Analyze the FFT correlation of current solution to find where max overlap occurs and check
  integral constraint.

  Returns max_overlap_value, overlap_location, integral_value, integral_satisfied (bool), and 3-5 top
  overlap regions.

  Call this after every edit to diagnose what to change next.'
