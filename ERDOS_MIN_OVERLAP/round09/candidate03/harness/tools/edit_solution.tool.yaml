type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK region. Make SMALL, SINGLE changes only (one learning rate, one penalty,
  or one construction type at a time). Test with probe first.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
