type: tool
name: analyze_correlation_structure
description: 'Analyze the correlation structure of h to identify which lags dominate the maximum overlap.

  Returns the top 5 lags by overlap magnitude, their contribution to the max, and suggested

  parameter adjustments (peak positions, widths, heights) to reduce overlap at those lags.

  Call this on your best candidate BEFORE each major edit iteration.'
