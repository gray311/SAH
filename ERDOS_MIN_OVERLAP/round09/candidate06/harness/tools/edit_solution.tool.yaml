type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK region. Add hyperparameter grids and restart loops.

  Focus on num_steps, learning_rate, penalty_strength, and num_restarts variations.

  Keep the initialization code unchanged.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
