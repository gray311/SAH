type: tool
name: generate_one_construction
description: 'Generate EXACTLY ONE construction pattern with adjustable parameters.

  Returns a dict with keys: {pattern_name: latent_vector}.

  Available patterns: bimodal, periodic, golomb, triangular.

  Adjust peak widths (sigma) and amplitudes via params dict.'
input_schema:
  type: object
  properties:
    pattern:
      type: string
    sigma:
      type: number
    amplitude:
      type: number
