type: tool
name: gen_constrained_constructions
description: 'Generate 4-6 valid step function initializations for Erdos problem. Each construction satisfies:
  0≤h(x)≤1 and ∫₀²h(x)dx=1. Returns dict mapping construction names to h values (already sigmoid-transformed
  and integral-normalized). Types: bimodal_tight, triangular_3step, periodic_alternating, golomb_5, sawtooth_4level,
  plateau_3level.'
