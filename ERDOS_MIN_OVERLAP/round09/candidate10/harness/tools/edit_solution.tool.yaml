type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. Implement:

  1. Call analyze_constructions() at start

  2. Multi-restart loop: for each construction, run 3-5 perturbations

  3. Use probe_solution after each restart to rank locally

  4. Evaluate only the top candidate with evaluate_solution

  5. Ensure constraint satisfaction via penalty term'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
