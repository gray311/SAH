type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK region to change hyperparameters.

  Specifically:

  1. Update Hyperparameters dataclass with new values

  2. Optionally add a loop to try multiple restart configurations

  3. Ensure integral(h)=1 constraint is enforced via penalty

  4. Keep _objective_fn and _compute_c5_bound unchanged'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
