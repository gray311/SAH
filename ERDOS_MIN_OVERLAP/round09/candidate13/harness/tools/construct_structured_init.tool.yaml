name: construct_structured_init
description: 'Generate 3-4 mathematically principled step function initializations for the Erdos problem.

  Returns dict with keys: bimodal_tight, triangular_3step, periodic_2, golomb_5.

  Each value is a latent vector h such that sigmoid(h) is a valid initial step function.'
