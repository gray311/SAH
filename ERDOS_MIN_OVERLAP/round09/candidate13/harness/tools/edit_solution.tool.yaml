type: tool
name: edit_solution
description: Modify only the Hyperparameters dataclass or optimizer loop parameters. Keep the core optimization
  logic intact.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
