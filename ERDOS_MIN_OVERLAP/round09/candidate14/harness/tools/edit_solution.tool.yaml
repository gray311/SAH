type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK region. Change Hyperparameters fields:

  - num_intervals (600-1200): discretization resolution

  - base_learning_rate (0.001-0.02): optimizer step size

  - num_steps (30000-70000): total training iterations

  - penalty_strength (500-10000): constraint enforcement

  - num_restarts (1-5): how many random starts

  Return complete valid Python in EVOLVE-BLOCK format.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
