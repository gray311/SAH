type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to implement the bimodal construction.

  Use create_biformation() to generate the initial latent vector with two peaks

  at x=0.25 and x=0.75, then optimize with Adam optimizer.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
