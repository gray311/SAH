type: tool
name: edit_solution
description: 'Rewrite _optimize_single_run to implement a multi-restart loop:

  - Define 5 initialization functions with genuinely different structures

  - For each pattern, try 3 num_intervals values (5x3=15 attempts)

  - Each attempt: 2-phase optimization (3000+10000 steps) with varying LR/penalty

  - After each attempt, extract h and compute probe c5_bound

  - Track best 2 by probe score

  - Use evaluate_solution on top 2

  - Return best c5_bound from all attempts'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
