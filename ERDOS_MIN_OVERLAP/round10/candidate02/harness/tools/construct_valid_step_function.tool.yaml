type: tool
name: construct_valid_step_function
description: 'Generate mathematically principled step function h: [0,2]→[0,1] candidates.

  Returns dict with keys for different construction types (bimodal, triangular, periodic, Golomb).

  Each value is pre-processed to satisfy integral(h)=1 constraint.

  Use this to create diverse candidates without relying on gradient optimization.

  Call this early to explore the solution space before any evaluations.'
