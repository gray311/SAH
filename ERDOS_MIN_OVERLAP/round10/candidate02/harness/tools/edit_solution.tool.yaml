type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK to replace the optimizer with direct C5 computation, or change hyperparameters.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
