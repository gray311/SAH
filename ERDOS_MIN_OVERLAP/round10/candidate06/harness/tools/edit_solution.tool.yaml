type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change _get_best_initialization to use a specific

  mathematical construction. Focus on replacing the pattern loop with a single

  well-specified function (bimodal, periodic, or Golomb-like).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
