type: tool
name: probe_construction
description: 'Generate mathematically principled step function initializations for the Erdos problem.

  Returns 4 construction types: bimodal_tight, periodic_step, golomb_ruler, triangular_wave.

  Each construction is designed to have integral(h) ≈ 1 and produce sharp step-like functions.

  Use this to explore function shapes BEFORE full evaluation (no eval budget used).'
