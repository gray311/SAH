schema: h2spec/1.0
system_prompt: |
  You are solving the Erdos minimum overlap problem: find a step function h: [0,2] -> [0,1] minimizing max_k integral h(x)(1-h(x+k)) dx with integral(h)=1.
  
  Current best bound: C5 <= 0.38092303510845016
  
  **KEY INSIGHT**: The seed optimizer's 12 initialization patterns don't generate sufficiently diverse starting points. The optimizer gets stuck in local minima because it starts from similar initializations.
  
  **YOUR STRATEGY**: Use the construct_structured_init tool to generate diverse, mathematically principled initializations, then optimize each one separately. This is more effective than hyperparameter tuning.
  
  Steps:
  1. CALL construct_structured_init ONCE to get 4 diverse initializations
  2. For EACH initialization, EDIT to add a small random perturbation (to escape any symmetry)
  3. OPTIMIZE each initialization separately using the optimizer
  4. CALL evaluate_solution on the BEST result
  5. If no improvement, EDIT to try a DIFFERENT construction type from construct_structured_init
  
  Focus: INITIALIZATION DIVERSITY, not hyperparameter tuning.
skill_description: Diverse initialization search for Erdos optimizer using structured patterns.
skill_body: |
  # Erdos Minimum Overlap - Diverse Initialization Strategy
  
  ## Problem
  The seed optimizer uses 12 initialization patterns, but they're not diverse enough to escape local minima.
  
  ## Solution: Structured Initialization Search
  
  ### Step 1: Generate Diverse Initializations
  Call construct_structured_init to get 4 mathematically principled initializations:
  - bimodal_tight: Two narrow peaks at 0.25 and 0.75
  - triangular_3step: Three-level pattern
  - periodic_2: Alternating pattern
  - golomb_5: Optimal spacing pattern
  
  ### Step 2: Optimize Each Separately
  For EACH initialization:
  1. EDIT to add small random perturbation (noise level 0.1-0.3)
  2. OPTIMIZE using the optimizer (full training run)
  3. TRACK the best score
  
  ### Step 3: Evaluate Best
  CALL evaluate_solution on the best optimized initialization
  
  ### Step 4: If No Improvement
  EDIT to try a different construction from construct_structured_init
  Repeat from Step 2
  
  ## Why This Works
  - construct_structured_init generates INITIALIZATIONS, not just hyperparameters
  - Each initialization starts from a DIFFERENT region of the loss landscape
  - Optimizing from diverse starting points increases chance of finding global optimum
  
  ## Success Criteria
  - combined_score > 1.0 (c5_bound < 0.380923)
  - Document which construction achieved best result
tool_descriptions:
  edit_solution: Modify the EVOLVE-BLOCK to add random perturbations to initializations or try different construction types.
  evaluate_solution: Full evaluation, returns combined_score.
  probe_solution: Quick screening (use to check constraint satisfaction before full eval).
  finish: Submit when combined_score > 1.0 or all constructions exhausted.
sampling:
  temperature: 0.8
  top_p: 0.85
  top_k: 30
  max_tokens: 14000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
new_tools:
- name: construct_structured_init
  description: |
    Generate 4 mathematically principled initializations for the Erdos problem based on known optimal constructions.
    Returns dict with keys: bimodal_tight, triangular_3step, periodic_2, golomb_5.
    Each value is a latent vector where sigmoid(latent) is a valid initial step function.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import numpy as np
        N = 800
        domain = 2.0
        rng = np.random.default_rng(42)
        constructions = {}
        
        # bimodal_tight: Two narrow peaks at 0.25 and 0.75
        x = np.linspace(0, domain, N)
        a1, a2 = 0.25, 0.75
        bw1, bw2 = 0.12, 0.12
        latent = np.exp(-((x-a1)/bw1)**2 * 25) + np.exp(-((x-a2)/bw2)**2 * 25)
        constructions['bimodal_tight'] = latent
        
        # triangular_3step: Three-level triangular pattern
        x = np.linspace(0, domain, N)
        phases = np.array([0.0, 0.333, 0.666])
        levels = np.array([-5, -1, 5])
        latent = np.zeros(N)
        for p, l in zip(phases, levels):
            in_range = (x >= p) & (x < p + 0.333)
            latent = latent + l * in_range
        latent = latent + rng.normal(size=N) * 0.15
        constructions['triangular_3step'] = latent
        
        # periodic_2: Simple alternating pattern with asymmetry
        x = np.linspace(0, domain, N)
        periodic = 3.5 * (x < 0.4) - 2.5 * (x < 0.6)
        latent = periodic + rng.normal(size=N) * 0.1
        constructions['periodic_2'] = latent
        
        # golomb_5: Optimal spacing pattern from Golomb ruler
        x = np.linspace(0, domain, N)
        marks = np.array([0.0, 0.45, 0.75, 1.2, 1.65])
        kernel_widths = np.array([0.1, 0.12, 0.08, 0.11, 0.1])
        latent = np.zeros(N)
        for mark, kw in zip(marks, kernel_widths):
            latent = latent + 7.0 * np.exp(-((x-mark)/kw)**2 * 20)
        latent = latent + rng.normal(size=N) * 0.1
        constructions['golomb_5'] = latent
        
        return {"constructions": constructions, "keys_used": list(constructions.keys())}
new_skills:
- name: diverse-initialization-search
  description: |
    Use construct_structured_init to generate diverse initializations, optimize each separately, and track the best.
  body: |
    # Diverse Initialization Search for Erdos Optimizer
    
    ## Overview
    The key to improving the Erdos bound is not hyperparameter tuning, but generating DIVERSE initializations
    that start from different regions of the loss landscape.
    
    ## Step-by-Step Procedure
    
    ### 1. Generate Initializations
    Call construct_structured_init ONCE to get 4 initializations:
    - bimodal_tight: Two peaks at 0.25 and 0.75 (known good for this problem)
    - triangular_3step: Three-level pattern
    - periodic_2: Asymmetric periodic pattern
    - golomb_5: Optimal spacing from Golomb ruler
    
    ### 2. Optimize Each Initialization
    For EACH of the 4 initializations:
    
    a) EDIT the EVOLVE-BLOCK to:
       - Replace the initialization code with YOUR specific initialization
       - Add small random noise (scale 0.1-0.3) to break symmetry
       - Keep all optimizer hyperparameters the same
    
    b) OPTIMIZE: Run the optimizer to completion (59000 steps)
    
    c) TRACK: Record the final c5_bound
    
    ### 3. Evaluate the Best
    Pick the initialization with the LOWEST c5_bound and call evaluate_solution.
    
    ### 4. If No Improvement
    EDIT to try a DIFFERENT construction type from construct_structured_init
    Return to Step 2
    
    ## Key Principles
    - DIVERSITY > TUNING: Different initializations > better hyperparameters
    - OPTIMIZE EACH: Full optimization for each initialization
    - TRACK EVERYTHING: Record scores for all 4 initializations
    - ITERATE ON CONSTRUCTION: If one construction fails, try another
    
    ## Expected Outcome
    - Finding an initialization that leads to a c5_bound < 0.380923
    - This requires trying ALL 4 constructions before giving up
