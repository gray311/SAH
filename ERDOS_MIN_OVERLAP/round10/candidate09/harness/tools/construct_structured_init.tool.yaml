description: "Generate 4 mathematically principled step function initializations for the Erdos problem.\n\
  Returns bimodal_tight (peaks at 0.25, 0.75), triangular_3step (3-level), \nperiodic_2 (alternating),\
  \ and golomb_5 (optimal spacing pattern).\nEach is a latent vector where sigmoid(latent) is a valid\
  \ [0,1] step function."
