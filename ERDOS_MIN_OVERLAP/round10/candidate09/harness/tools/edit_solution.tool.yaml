type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK to change num_intervals, base_learning_rate, penalty_strength, num_steps,
  num_restarts, or use construct_structured_init.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
