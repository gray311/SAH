type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK region to add NEW initialization patterns in _get_best_initialization(),
  adjust hyperparameters, or refine existing code.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
