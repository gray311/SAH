type: tool
name: edit_solution
description: "Modify the EVOLVE-BLOCK region to change structure parameters or generate new initializations\
  \ \nusing generate_erdos_constructs. This tool edits the code that defines the optimization \nparameters\
  \ and initialization patterns."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
