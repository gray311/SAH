type: tool
name: generate_erdos_constructs
description: 'Generate 5-6 mathematically principled step function initializations for the Erdos problem.

  Each construction uses a different structural strategy (bimodal peaks, Golomb ruler spacing,

  finite field constructions, alternating patterns). Returns dict with keys indicating

  construction type, each containing a latent vector h where sigmoid(h) gives valid h(x) in [0,1].

  Call this when you need fundamentally new structures, not just parameter tweaks.'
