type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK to either directly construct a step function with explicit plateau
  values and positions, or change hyperparameters of the existing optimizer. Prefer constructive edits
  over hyperparameter tweaks when stuck.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
