type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK region to modify hyperparameters OR (preferred) add new mathematical

  initialization patterns to _get_best_initialization(). Focus on adding COMPLETELY NEW

  pattern families (piecewise, shifted, scaled, multi-level) rather than small tweaks.


  For new patterns, follow this template:

  - Add a new pattern type to the pattern loop (elif pattern == N:)

  - Define the latent construction mathematically

  - Ensure the pattern produces valid h values in [0,1] after sigmoid'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
