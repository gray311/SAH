type: tool
name: generate_structural_variants
description: 'Given a seed pattern function, generate 3-5 structural variants by applying

  transformations: scaling (x), shifting (x), amplitude modulation, and piecewise

  modifications. Returns dict with variant code blocks.'
input_schema:
  type: object
  properties:
    seed_pattern:
      type: string
      description: Current pattern code to vary
