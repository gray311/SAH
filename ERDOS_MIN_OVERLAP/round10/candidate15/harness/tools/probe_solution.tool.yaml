name: probe_solution
description: 'Quick approximate evaluation to screen initialization variants before full eval.

  Use probe to check: (1) constraint satisfaction (integral ≈ 1), (2) rank variants

  quickly. A score < 0.4 should be rejected. Use probe for ALL new pattern variants

  before calling evaluate_solution.'
