type: tool
name: construct_step_functions
description: 'Generate explicit step function candidates for the Erdos problem.

  Returns step definitions as dicts with keys: uniform, two_step_left, two_step_right,

  three_step_centered, four_step_even, weighted_two_step, bimodal_steps, triple_peak_steps.

  Each step function is defined by breakpoints (list of x values) and heights (list of values),

  ensuring integral equals exactly 1.'
input_schema:
  type: object
  properties: {}
