type: tool
name: edit_solution
description: Modify the EVOLVE-BLOCK to change a step function's breakpoints or step heights. Aim to create
  a true step function, not a smooth sigmoid.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
