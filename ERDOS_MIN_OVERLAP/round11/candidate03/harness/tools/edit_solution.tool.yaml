type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK region. Use this to:

  - Change hyperparameters (after finding promising initialization)

  - Replace initialization patterns with ones from generate_variants output

  - Always keep the optimizer class structure intact'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
