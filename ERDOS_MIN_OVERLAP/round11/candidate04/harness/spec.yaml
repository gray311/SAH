schema: h2spec/1.0
system_prompt: "You are solving the Erdos minimum overlap problem: minimize max_k integral h(x)(1-h(x+k)) dx for a step function h: [0,2] -> [0,1] with integral(h)=1.\n\nCurrent best bound: C5 <= 0.38092303510845016\n\nSTRATEGY: The seed program uses gradient descent which gets stuck in local minima. Instead, use COMBINATORIAL SEARCH:\n1. Generate structured step function candidates directly (not via latent optimization)\n2. Use probe_solution to quickly rank candidates (approximate evaluation)\n3. Evaluate promising candidates fully with evaluate_solution\n4. Refine successful patterns combinatorially (merge/split/shift regions)\n5. Track best c5_bound found; aim for combined_score > 1.0 (c5_bound < 0.3809)\n\nFocus: Generate diverse step function structures, evaluate them, and evolve the best pattern structurally."
skill_description: Combinatorial step function search for Erdos minimum overlap optimization.
skill_body: "# Erdos Minimum Overlap - Combinatorial Search Strategy\n\n## Problem\nMinimize max_k integral h(x)(1 - h(x+k)) dx subject to integral(h)=1 and h in [0,1].\n\n## Why Combinatorial Search Works\nThe seed optimizer uses gradient descent on a latent space, which struggles with step function landscapes.\nInstead, generate candidate step functions DIRECTLY (as binary/multistep functions) and search over their structure.\n\n## Strategy\n\n### Phase 1: Generate Structured Step Functions\nGenerate step functions with specific mathematical structures:\n- Single/multiple peaks of fixed width\n- Periodic patterns (2-period, 3-period, etc.)\n- Golomb ruler-inspired placements\n- Triangular/dual-peak configurations\n\n### Phase 2: Screen with Probe\nUse probe_solution to quickly rank candidates. Reject those with integral != 1 or c5_bound > 0.381.\n\n### Phase 3: Full Evaluation\nEvaluate top 5-10 candidates with evaluate_solution.\n\n### Phase 4: Structural Refinement\nFor promising candidates:\n- Merge adjacent regions\n- Split wide regions into narrower ones\n- Shift peaks to reduce overlap\n- Try different peak placements (0.2-0.8 range)\n\n### Key Insight\nThe optimal step function likely has a simple STRUCTURE (e.g., two peaks at specific locations). Find that structure through combinatorial search, not gradient descent."
tool_descriptions:
  edit_solution: Modify the EVOLVE-BLOCK to add new step function generation code or structural refinement logic.
  evaluate_solution: Run full evaluation, returns combined_score.
  probe_solution: Quick approximate evaluation to screen step function candidates before full eval.
  finish: Submit final solution when combined_score > 1.0.
sampling:
  temperature: 1.1
  top_p: 0.95
  top_k: 30
  max_tokens: 14000
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
new_tools:
- name: generate_step_functions
  description: "Generate 10-15 diverse structured step function candidates for the Erdos problem. Returns structured initializations that the solver can directly use instead of latent optimization. Each candidate has a specific mathematical form (bimodal, periodic, Golomb-based, etc.) that satisfies integral(h)=1 approximately."
  input_schema:
    type: object
    properties: {}
  implementation_py: "def run(ctx, args):\n    import numpy as np\n    N = ctx.get_best_program() != None and 800\n    if N is None:\n        N = 800\n    domain = 2.0\n    dx = domain / N\n    candidates = []\n    \n    # Candidate 1: Bimodal with adjustable separation\n    for sep in [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6]:\n        h = np.zeros(N)\n        peak_width = 0.15\n        for i in range(N):\n            x = i * dx\n            if (x >= sep - 0.075) and (x < sep + 0.075):\n                h[i] = 1.0\n            elif (x >= 1.0 - sep) and (x < 1.0 - sep + 0.075):\n                h[i] = 1.0\n        integral = h.sum() * dx\n        if abs(integral - 1.0) < 0.3:\n            h_norm = h * (1.0 / (h.sum() * dx))\n            candidates.append((h_norm, f\"bimodal_sep_{sep:.2f}\", integral))\n    \n    # Candidate 2: Tripeak pattern\n    x = np.linspace(0, domain, N)\n    for centers in [(0.2, 0.5, 0.8), (0.15, 0.5, 0.85), (0.1, 0.5, 0.9), (0.15, 0.45, 0.85)]:\n        h = np.zeros(N)\n        for c in centers:\n            for i in range(N):\n                if abs((i*dx) - c) < 0.12:\n                    h[i] = 1.0\n        integral = h.sum() * dx\n        if abs(integral - 1.0) < 0.3:\n            h_norm = h * (1.0 / (h.sum() * dx))\n            candidates.append((h_norm, f\"tripeak_{centers}\", integral))\n    \n    # Candidate 3: Periodic 2-period pattern with noise\n    x = np.linspace(0, domain, N)\n    periodic = np.zeros(N)\n    for i in range(N):\n        if x[i] < 0.5:\n            periodic[i] = 1.0 + np.random.normal(0, 0.05)\n        else:\n            periodic[i] = 0.0 + np.random.normal(0, 0.05)\n    periodic = np.clip(periodic, 0, 1)\n    integral = periodic.sum() * dx\n    if abs(integral - 1.0) < 0.2:\n        periodic_norm = periodic * (1.0 / (periodic.sum() * dx))\n        candidates.append((periodic_norm, \"periodic_2_noise\", integral))\n    \n    # Candidate 4: Golomb ruler inspired (5 marks)\n    marks = np.array([0.0, 0.5, 1.0, 1.5, 2.0])\n    kernel_widths = np.array([0.08, 0.06, 0.08, 0.06, 0.08])\n    h = np.zeros(N)\n    for mark, kw in zip(marks, kernel_widths):\n        for i in range(N):\n            if abs((i*dx) - mark) < kw * 0.45:\n                h[i] = 1.0\n    integral = h.sum() * dx\n    if abs(integral - 1.0) < 0.3:\n        h_norm = h * (1.0 / (h.sum() * dx))\n        candidates.append((h_norm, \"golomb_5\", integral))\n    \n    # Candidate 5: Narrow bimodal\n    for sep in [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65]:\n        h = np.zeros(N)\n        bw = 0.08\n        for i in range(N):\n            x = i * dx\n            if (x >= sep - bw*0.5) and (x < sep + bw*0.5):\n                h[i] = 1.0\n            elif (x >= 1.0 - sep) and (x < 1.0 - sep + bw*0.5):\n                h[i] = 1.0\n        integral = h.sum() * dx\n        if abs(integral - 1.0) < 0.3:\n            h_norm = h * (1.0 / (h.sum() * dx))\n            candidates.append((h_norm, f\"narrow_bimodal_sep_{sep:.2f}\", integral))\n    \n    return {\"candidates\": candidates[:15], \"count\": len(candidates)}"
new_skills:
- name: combinatorial-search
  description: Direct combinatorial search for step function structures, avoiding latent optimization.
  body: "# Combinatorial Search for Erdos Minimum Overlap\n\n## Core Idea\nGenerate step functions DIRECTLY as binary/multistep functions with specific structures. This avoids the limitations of gradient descent in latent space.\n\n## Step 1: Generate Candidate Structures\nGenerate step functions with mathematically motivated structures:\n- Bimodal: two peaks at positions (sep, 1-sep) for various sep in [0.2, 0.6]\n- Tripeak: three peaks at (a, 0.5, 1-a) for various a\n- Periodic: 2-period or higher periodic patterns\n- Golomb-inspired: peak placements based on optimal spacing\n\n## Step 2: Screen with Probe\nUse probe_solution to quickly compute approximate c5_bound. Accept only candidates with:\n- integral(h) ≈ 1.0 (within 5%)\n- c5_bound < 0.381 (approximate threshold)\n\n## Step 3: Full Evaluation\nEvaluate top 5-10 candidates with evaluate_solution to get exact c5_bound.\n\n## Step 4: Structural Refinement\nFor promising candidates, explore:\n- **Merge**: Combine two adjacent peaks into one\n- **Split**: Split a wide peak into narrower ones\n- **Shift**: Move peak positions by small deltas (±0.05)\n- **Narrow**: Reduce peak width (from 0.15 to 0.08, etc.)\n- **Peak count**: Try 1, 2, 3, 4 peaks at different configurations\n\n## Step 5: Iterative Search\nKeep track of best c5_bound. For each iteration:\n1. Generate new variants based on current best\n2. Screen with probe\n3. Evaluate promising ones\n4. Update best if improved\n\n## Key Heuristics\n- Peak positions should be in [0.15, 0.85] to avoid boundary effects\n- Two peaks symmetric around 0.5 is most promising\n- Peak width should be 0.08-0.15 for good overlap reduction\n- Avoid too many peaks (increases overlap)\n- Narrower peaks generally give better bounds"
new_middlewares:
- name: refocus_step_structures
  hook: before_model
  description: Remind solver to focus on step function structure when generating edits.
  implementation_py: "def before_model(hook_input):\n    if hook_input.get('iteration', 0) <= 5:\n        return None\n    return \"Remember: Generate DIRECT step function structures (binary/multistep), not latent vectors. Focus on peak positions and widths. Aim for integral=1. Try bimodal, tripeak, and periodic structures first.\""
