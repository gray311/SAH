type: tool
name: generate_step_functions
description: Generate 10-15 diverse structured step function candidates for the Erdos problem. Returns
  structured initializations that the solver can directly use instead of latent optimization. Each candidate
  has a specific mathematical form (bimodal, periodic, Golomb-based, etc.) that satisfies integral(h)=1
  approximately.
