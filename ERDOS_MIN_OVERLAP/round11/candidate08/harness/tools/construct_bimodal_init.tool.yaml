type: tool
name: construct_bimodal_init
description: 'Generate a latent vector that produces h with two narrow Gaussian peaks at x=0.25 and x=0.75.

  This is the mathematically principled initial condition for the Erdos problem - two symmetric

  narrow peaks minimize the maximum overlap. Returns the latent vector (not h itself).

  Call this ONCE to get your starting point, then optimize with edit_solution.'
input_schema:
  type: object
  properties:
    peak_width:
      type: number
      default: 0.15
      description: Width of each Gaussian peak (smaller = narrower)
    peak_height:
      type: number
      default: 10.0
      description: Amplitude of peaks before normalization
