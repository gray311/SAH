type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters or the initialization function.

  To use a single initialization: set num_restarts=1, seed_start=pattern_index, and

  optionally simplify _get_best_initialization to return only that pattern''s latent.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
