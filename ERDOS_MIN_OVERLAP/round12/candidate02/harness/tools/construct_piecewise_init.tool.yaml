type: tool
name: construct_piecewise_init
description: 'Generate piecewise constant initializations for the Erdos problem.

  Creates h(x) as a sequence of constant regions with explicit step locations.

  Returns dict with configurations keyed by pattern name, each containing step locations and heights.

  Useful for escaping the smooth-sigmoid local minima of the seed optimizer.'
input_schema:
  type: object
  properties:
    num_steps:
      type: integer
      description: Number of constant regions (2-5 recommended)
    seed:
      type: integer
      description: Random seed for initialization
    target_integral:
      type: number
      description: Target integral of h(x), must equal 1.0
