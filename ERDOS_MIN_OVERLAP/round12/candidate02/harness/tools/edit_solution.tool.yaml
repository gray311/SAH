type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters OR construct piecewise constant functions.

  For piecewise: define h(x) as a sequence of (start, height) pairs covering [0,2].

  Example: h(x) = 0 for x∈[0,0.5], h(x) = 2 for x∈[0.5,1], h(x) = 0 for x∈[1,2]

  Ensure integral(h) = 1 and h∈[0,1].'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
