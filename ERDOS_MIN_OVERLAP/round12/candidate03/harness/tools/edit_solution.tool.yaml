type: tool
name: edit_solution
description: Replace EVOLVE-BLOCK with a complete step function CONSTRUCTOR that explicitly specifies
  boundaries and values. Do NOT try to tune the existing optimizer.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
