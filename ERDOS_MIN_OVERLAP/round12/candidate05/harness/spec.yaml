schema: h2spec/1.0
system_prompt: |
  You are solving the Erdos minimum overlap problem: minimize max_k integral h(x)(1-h(x+k)) dx
  for a step function h: [0,2] -> [0,1] with integral(h)=1.

  Current best bound: C5 <= 0.38092303510845016

  CRITICAL INSIGHT: The goal is a TRUE STEP FUNCTION, not a smooth function.
  The seed program's multi-restart optimizer produces smooth h(x) via sigmoid(latent),
  which gives poor results. You must DIRECTLY CONSTRUCT step functions.

  Strategy: Generate h(x) as a piecewise-constant function with k jumps at positions [t_1, t_2, ..., t_{k-1}]
  where 0 < t_1 < t_2 < ... < t_{k-1} < 2.

  Steps:
  1. Call evaluate_solution on seed to establish baseline
  2. EDIT to create k-piece step functions:
     - Vary number of pieces: k = 2, 3, 4, 5, 6, 8, 10, 12, 16
     - For each k, generate random jump positions and compute level heights to satisfy integral(h)=1
     - Level heights are chosen from {0, 1} for binary, or fractions for multi-level
  3. For each candidate, use probe_solution to check integral constraint quickly
  4. Call evaluate_solution on candidates that pass probe
  5. Track best combined_score, continue generating new step configurations
  6. If stuck at smooth init, completely replace _get_best_initialization with piecewise step generator
  7. Keep iterating until combined_score > 1.0 or budget exhausted

  Focus: DIRECT STEP FUNCTION CONSTRUCTION, not hyperparameter tuning of smooth functions.
skill_description: |
  Generate and evaluate piecewise-constant step functions for the Erdos minimum overlap problem.
  Search over discrete configurations of jump locations and levels to find h with integral=1
  minimizing max_k integral h(x)(1-h(x+k)) dx.
skill_body: |
  # Erdos Minimum Overlap - Step Function Construction Strategy

  ## Core Idea
  Optimal h is a TRUE STEP FUNCTION (piecewise constant with jumps), not smooth.
  The seed's smooth initializations via sigmoid produce suboptimal results.

  ## Construction Method
  1. Choose number of pieces k (2 to 16)
  2. Generate k-1 random jump positions in (0, 2): 0 < t_1 < t_2 < ... < t_{k-1} < 2
  3. Assign levels h_i in [0,1] to each piece such that integral(h)=1
     - For binary: levels are 0 and 1; solve for proportions to get integral=1
     - For multi-level: use fractions like 0.25, 0.5, 0.75, 1.0
  4. Compute h(x) = sum_i h_i * indicator(x in [t_{i-1}, t_i))
  5. Evaluate C5 bound and check constraints

  ## Search Strategy
  - Start with k=2,3,4 simple cases
  - Systematically vary k and random seeds
  - Use probe_solution to quickly filter candidates violating integral constraint
  - Only full evaluate on feasible candidates
  - Track best h and report combined_score

  ## Success criteria
  combined_score > 1.0 means c5_bound < 0.38092303510845016
tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK to replace _get_best_initialization with a piecewise step function generator.
    Modify the optimizer to directly output step functions with k jumps.
  evaluate_solution: |
    Run full evaluation, returns combined_score = 0.38092303510845016 / c5_bound.
    Value > 1 means new record.
  probe_solution: |
    Quick check: compute integral(h) from step function to verify it equals 1 within tolerance.
    Fast for step functions.
  finish: |
    Submit final solution when combined_score > 1.0.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 30
  max_tokens: 14000
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
  - name: generate_step_configs
    description: |
      Generate k piecewise-constant step functions with random jump locations.
      Returns dict with k step configurations.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          num_pieces = args.get('num_pieces', 4)
          use_binary = args.get('use_binary_levels', True)
          seed = args.get('rng_seed', 123)
          N = 800
          domain = 2.0
          dx = domain / N
          rng = np.random.default_rng(seed)
          configs = []
          for i in range(5):
              jumps = np.sort(rng.uniform(0.1, 1.9, num_pieces-1))
              intervals = np.zeros(num_pieces)
              if num_pieces > 1:
                  intervals[0] = jumps[0]
                  for j in range(1, num_pieces-1):
                      intervals[j] = jumps[j+1] - jumps[j]
                  intervals[-1] = domain - jumps[-1]
              else:
                  intervals[0] = domain
              if use_binary:
                  target_len = 1.0
                  num_ones = target_len / dx
                  chosen = np.random.choice(num_pieces, size=int(num_ones), replace=False)
                  levels = np.zeros(num_pieces)
                  for idx in chosen:
                      levels[idx] = 1.0
              else:
                  levels = rng.uniform(0.1, 0.9, num_pieces)
                  current_integral = np.sum(levels * intervals)
                  if current_integral > 0:
                      levels = levels * (1.0 / current_integral)
                  levels = np.clip(levels, 0.01, 0.99)
              h_vals = levels
              latent = np.zeros(N)
              jump_starts = np.concatenate([[0], jumps[:-1]] + [domain])
              for piece_idx, (start, level) in enumerate(zip(jump_starts, levels)):
                  start_idx = int((start / domain) * N)
                  latent[start_idx:start_idx + 100] = np.log(level / (1 - level + 1e-10) + 1e-10)
              configs.append({
                  "jump_positions": jumps.tolist(),
                  "levels": levels.tolist(),
                  "estimated_integral": float(np.sum(h_vals) * dx)
              })
          return {"configs": configs}
