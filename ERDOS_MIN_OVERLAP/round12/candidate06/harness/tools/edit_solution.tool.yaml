type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK region. Primary edits:

  - num_intervals: 1600, 3200, 4000, 6400 (main search dimension)

  - base_learning_rate: 0.001, 0.003, 0.007, 0.01, 0.015

  - penalty_strength: 30, 100, 200, 500 (lower helps constraint)

  - num_steps: 30000, 59000, 100000, 200000'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
