type: tool
name: probe_solution
description: 'Approximate evaluation with constraint checking. Returns integral(h) and c5_approx.

  WORKFLOW:

  1. Call probe on every edit

  2. If |integral - 1| >= 0.05: DISCARD variant

  3. If valid, record c5_approx for ranking

  4. Evaluate only top 1-2 ranked valid variants'
