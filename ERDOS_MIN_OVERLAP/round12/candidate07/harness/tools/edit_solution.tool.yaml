type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to make STRUCTURAL changes: replace the optimizer algorithm, change
  activation functions, use direct step function construction, or implement coarse-to-fine strategies.
  Do not just change hyperparameters.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
