schema: h2spec/1.0
system_prompt: |
  You are solving the Erdos minimum overlap problem: find a step function h: [0,2] -> [0,1] with integral(h)=1 that minimizes max_k integral h(x)(1-h(x+k)) dx.

  Current best bound: C5 <= 0.38092303510845016

  KEY STRATEGY: Try MANY DIFFERENT step function CONSTRUCTIONS, not just hyperparameter tuning.

  Phase 1 - Diversity Search (use all 30 evals):
  1. Edit _get_best_initialization() to try COMPLETELY NEW construction strategies
  2. Examples to try:
     - bimodal functions with varying peak positions and widths
     - triangular wave patterns with different phase shifts
     - multi-level step functions (3-4 levels)
     - Gaussian mixture approximations
     - Golomb ruler-inspired constructions
     - Optimal transport-inspired piecewise constants
  3. Use probe_solution to quickly screen (~10s per variant, ~30 probes budget)
  4. Call evaluate_solution only on the top 2-3 most promising constructions
  5. If probe fails constraint (integral != 1), edit to fix before full eval

  Phase 2 - If no improvement after 10 evals:
  - Try replacing the ENTIRE optimizer with a greedy construction approach
  - Try coordinate ascent: fix most intervals, optimize one at a time
  - Try discretized optimal transport formulation

  Phase 3 - Fine-tuning (only if you found a good construction):
  - Use smaller learning rate (0.001-0.003)
  - Increase num_steps (100000+)
  - Fine-tune penalty_strength for constraint satisfaction

  CRITICAL: Don't waste evaluations on tiny hyperparameter changes. Focus on fundamentally DIFFERENT step function constructions.
new_tools:
- name: construct_structured_init
  description: |
    Generate 4 mathematically principled step function initializations:
    1. bimodal_tight: Two narrow peaks at 0.25 and 0.75
    2. triangular_3step: Three-level triangular pattern
    3. periodic_2: Simple alternating pattern
    4. golomb_5: Construct from optimal spacing pattern

    Use these constructions directly by editing _get_best_initialization() to sample from or combine these.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import numpy as np
        N = 800
        domain = 2.0
        dx = domain / N
        rng = np.random.default_rng(42)
        constructions = {}

        # bimodal_tight: Two narrow peaks at 0.25 and 0.75
        x = np.linspace(0, domain, N)
        a1, a2 = 0.25, 0.75
        bw1, bw2 = 0.15, 0.15
        latent = np.exp(-((x-a1)/bw1)**2 * 20) + np.exp(-((x-a2)/bw2)**2 * 20)
        latent = (latent - np.min(latent)) / (np.max(latent) - np.min(latent) + 1e-10)
        constructions['bimodal_tight'] = latent

        # triangular_3step: Three-level triangular pattern
        x = np.linspace(0, domain, N)
        phases = np.array([0.0, 0.333, 0.666])
        levels = np.array([-5, -2, 5])
        latent = np.zeros(N)
        for p, l in zip(phases, levels):
            in_range = (x >= p) & (x < p + 0.333)
            latent = latent + l * in_range
        latent = latent + rng.normal(size=N) * 0.2
        constructions['triangular_3step'] = latent

        # periodic_2: Simple alternating pattern
        x = np.linspace(0, domain, N)
        periodic = 2.0 * (x < 0.5) - 1.0
        latent = periodic * 4.0
        latent = latent + rng.normal(size=N) * 0.3
        constructions['periodic_2'] = latent

        # golomb_5: Construct from optimal spacing pattern
        x = np.linspace(0, domain, N)
        marks = np.array([0.0, 2*0.25, 2*0.625, 2*0.9375, 2*1.0])
        kernel_widths = np.array([0.08, 0.1, 0.09, 0.09, 0.1])
        latent = np.zeros(N)
        for mark, kw in zip(marks, kernel_widths):
            latent = latent + 6.0 * np.exp(-((x-mark)/kw)**2 * 15)
        latent = latent + rng.normal(size=N) * 0.2
        constructions['golomb_5'] = latent

        return {"constructions": constructions}
new_skills:
- name: diversification-search
  description: |
    For Erdos minimum overlap, the optimizer gets stuck in local optima. Use diverse step function constructions.
    Don't tune hyperparameters - try completely different initialization patterns.
  body: |
    # Diversification Search for Erdos Minimum Overlap
    
    ## Why Diversity Matters
    The seed optimizer uses gradient descent with 12 initialization patterns, but this is still a local search.
    To find the global optimum, you need to try fundamentally DIFFERENT step function constructions.

    ## Concrete Constructions to Try (edit _get_best_initialization):

    ### 1. Bimodal Constructions
    h(x) = sigmoid(A * exp(-((x-a)/bw1)^2) + B * exp(-((x-b)/bw2)^2))
    Vary: a, b, bw1, bw2 in [0.1, 0.9]
    Best when: C5 bound requires separation of mass

    ### 2. Multi-level Step Functions
    Divide [0,2] into 3-4 regions, assign different heights
    Example: h(x) = [0.2 if x<0.5, 0.8 if 0.5<=x<1.0, 0.2 if x>=1.0]
    Scale to satisfy integral(h)=1

    ### 3. Golomb Ruler Inspired
    Use optimal spacing marks: [0, 0.25, 0.625, 0.9375, 1.0]
    Construct Gaussian-like peaks at these marks
    Best when: Minimizing overlap between h and h shifted by k

    ### 4. Optimal Transport Inspired
    For target measure with 3 peaks at positions p1, p2, p3
    Construct h(x) = 1 / (1 + exp(-lambda(x-p_i))) for regions

    ### 5. Wave Combinations
    h(x) = sigmoid(a*sin(2*pi*x) + b*sin(4*pi*x) + c*cos(2*pi*x) + d)
    Vary coefficients to create asymmetric patterns

    ## Screening Strategy
    1. Generate 5-10 diverse constructions
    2. Use probe_solution to quickly check integral constraint and c5_bound
    3. Keep those with integral close to 1 and lowest c5_bound
    4. Full evaluate only on top 2-3

    ## When to Stop Diversity Search
    After using ~15 probes and ~5 full evaluations:
    - If best score > 1.0: SUCCESS
    - If stuck: Try replacing optimizer with coordinate ascent or greedy construction
new_middlewares:
- name: diversity_reminder
  hook: before_model
  description: |
    Remind solver to focus on diverse constructions, not hyperparameter tuning.
    This task requires finding fundamentally different step functions.
  implementation_py: |
    def before_model(hook_input):
        return "FOCUS: Try DIFFERENT step function CONSTRUCTIONS, not hyperparameter tuning. Edit _get_best_initialization with new patterns. Use probe_solution to screen 5-10 variants quickly, then evaluate top 2-3."
agent:
  max_iterations: 70
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 8000
