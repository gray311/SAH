type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK. To try a true step function: 1. Change _get_best_initialization to
  return a piecewise constant latent (not sigmoid) 2. Reduce num_intervals to 50-100 initially 3. Set
  num_steps=5000 and num_restarts=5 4. Try penalty_strength in [3, 10, 30, 100] 5. Consider changing the
  activation: h = jax.nn.tanh(latent) / 2 + 0.5 or h = jnp.clip(latent, 0, 1)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
