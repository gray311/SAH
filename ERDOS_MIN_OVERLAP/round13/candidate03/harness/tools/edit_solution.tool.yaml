type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK. To use a pre-normalized h: replace the optimizer''s initial_latent
  with a constant array of normalized values, or modify _get_best_initialization to return the normalized
  h directly (no sigmoid, no padding tricks).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
