type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters (num_intervals, base_learning_rate, num_steps,
  penalty_strength, num_restarts). Keep the core optimizer logic intact - only change the Hyperparameters
  class values. Example: change penalty_strength from 61.0 to 40.0 by editing just that line.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
