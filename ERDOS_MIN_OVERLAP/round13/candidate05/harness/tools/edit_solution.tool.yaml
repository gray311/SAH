type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change the initialization strategy.


  To use a single latent h_latent as the ONLY initialization:

  - Set num_restarts=1

  - Set seed_start=0

  - Replace _get_best_initialization to return h_latent directly

  - Remove the Gaussian/sigmoid pattern loop


  Example edit to use h_latent (shape (800,)):

  - Add: h_latent = <the latent values>

  - Change: initial_latent = h_latent (instead of _get_best_initialization(seed))'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
