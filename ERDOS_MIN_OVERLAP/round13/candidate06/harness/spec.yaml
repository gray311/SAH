schema: h2spec/1.0
system_prompt: |
  You are solving the Erdos minimum overlap problem: minimize max_k integral h(x)(1-h(x+k)) dx

  for a step function h: [0,2] -> [0,1] with integral(h)=1.

  Current best bound: C5 <= 0.38092303510845016

  STRATEGY: The seed program has 12 initialization patterns but uses fixed hyperparameters.

  The bottleneck is HYPERPARAMETER TUNING, not adding new patterns.

  Steps:

  1. EDIT hyperparameters in EVOLVE-BLOCK to explore:
     - num_intervals: try 400, 600, 1000, 1200 (larger = more resolution)
     - base_learning_rate: try 0.003, 0.01, 0.02 (wider range)
     - penalty_strength: try 20, 40, 100 (adjust constraint penalty)
     - num_steps: try 30000, 80000, 120000 (more steps = better optimization)
     - num_restarts: try 1, 5 (use single restart with good init, or more restarts)

  2. For EACH hyperparameter change, EDIT the seed to use num_restarts=1, seed_start=0

  3. Call probe_solution to check constraint satisfaction and c5_bound estimate

  4. Call evaluate_solution ONLY on candidates with c5_bound < 0.38 (actually beating seed)

  5. If no improvement after 10 evals, try combining: larger intervals + more steps + different learning rate

  Key insight: The 12 patterns are already diverse. We need better optimization settings.
skill_description: Tune hyperparameters (learning rate, penalty, intervals, steps) and use probes to screen before full evaluation.
skill_body: |
  # Hyperparameter Tuning Strategy for Erdos Optimizer

  ## Problem
  The seed optimizer has 12 good initialization patterns but fixed hyperparameters.

  ## Strategy

  ### Phase 1: Hyperparameter Exploration

  Edit the EVOLVE-BLOCK Hyperparameters class to try different settings:

  - num_intervals: 400, 600, 800, 1000, 1200 (larger = more precise c5 calculation)
  - base_learning_rate: 0.001, 0.003, 0.007, 0.01, 0.02 (wider exploration)
  - penalty_strength: 10, 30, 61, 100, 200 (adjust constraint enforcement)
  - num_steps: 30000, 59000, 80000, 120000 (more iterations for better optimization)
  - num_restarts: 1 (use single run with good initialization)

  ### Phase 2: Screen with Probes (Use All 30 Probes!)

  For each hyperparameter change:

  1. EDIT the seed to use num_restarts=1, seed_start=0

  2. Call probe_solution to check: constraint satisfaction, c5_bound estimate

  3. Skip if probe shows constraint violation or c5_bound >= 0.38

  4. Keep candidates with c5_bound < 0.37

  ### Phase 3: Evaluate Promising Candidates

  Call evaluate_solution on top 2-3 candidates from Phase 2.

  ## Why This Works
  - The 12 patterns already provide diversity
  - Better hyperparameters lead to better convergence
  - Probes let you screen hyperparameter combinations quickly
  - Focus on actual optimization quality, not new patterns
tool_descriptions:
  edit_solution: 'Modify the EVOLVE-BLOCK to change hyperparameters or initialization.

    To change hyperparameters: edit the Hyperparameters dataclass values.

    To use single restart: set num_restarts=1, seed_start=0.

    To try different initialization: set num_restarts=1 and pick one seed_start value (0-11).'
  evaluate_solution: Run full evaluation on a candidate program, returns combined_score.
  probe_solution: 'Quick approximate evaluation (500 intervals, 10s runtime).

    Returns estimate of c5_bound and constraint satisfaction.

    Use this to screen hyperparameter combinations before full evaluation.'
  finish: Submit when combined_score > 1.0.
sampling:
  temperature: 0.8
  top_p: 0.9
  top_k: 30
  max_tokens: 12000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 8000
new_tools: []
remove_tools: []
new_skills: []
