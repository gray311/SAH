type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters or initialization.

  To change hyperparameters: edit the Hyperparameters dataclass values.

  To use single restart: set num_restarts=1, seed_start=0.

  To try different initialization: set num_restarts=1 and pick one seed_start value (0-11).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
