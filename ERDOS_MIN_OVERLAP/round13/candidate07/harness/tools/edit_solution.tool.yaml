type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. To use a specific step function:

  - Replace _get_best_initialization to return a single piecewise constant function

  - Remove the sigmoid call or use it only if you want approximate steps

  - Ensure the integral of h over [0,2] equals exactly 1

  - Set num_restarts=1, seed_start=0 (only one initialization run)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
