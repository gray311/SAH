type: tool
name: construct_valid_step
description: 'Create a VALID piecewise constant step function h on [0,2] with integral(h)=1 guaranteed.


  PATTERNS:

  - two_step: h=1 on [0,a), h=0 elsewhere (a = integral value)

  - three_step: h=1 on [0,a1), h=0.5 on [a1,a2), h=0 on [a2,2]

  - five_step: 5 rectangular pulses at Golomb ruler positions [0, 0.5, 1.2, 1.6, 2.0]


  Output: h_values (N=800), breakpoints for reference.

  These are valid initializations ready for the optimizer!'
input_schema:
  type: object
  properties:
    pattern:
      type: string
      enum:
      - two_step
      - three_step
      - five_step
      default: two_step
    integral:
      type: number
      default: 1.0
