type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. To replace initialization:

  - Set initial_latent = sigmoid(your_valid_step_values * 2)

  - Replace _get_best_initialization to return this single latent

  - Keep num_restarts=1 to test just this one function'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
