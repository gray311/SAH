type: tool
name: edit_solution
description: 'Replace the _get_best_initialization method with custom code, or change hyperparameters.

  To replace the method: delete the entire class method and insert the tool''s suggested code.

  Set num_restarts=1 after replacing to use the single initialization.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
