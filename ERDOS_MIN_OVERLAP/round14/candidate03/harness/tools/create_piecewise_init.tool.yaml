type: tool
name: create_piecewise_init
description: 'Generate simple piecewise constant step functions with 2-10 segments.

  Each function satisfies integral(h)=1 over [0,2] and is passed through sigmoid to get h in [0,1].

  Use these as the ONLY initialization - they are structurally different from the seed''s Gaussian patterns.'
