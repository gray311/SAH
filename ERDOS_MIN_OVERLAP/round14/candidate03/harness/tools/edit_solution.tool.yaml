type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters or the initialization.


  TO CREATE A SIMPLE STEP FUNCTION:

  - Set num_intervals=10-20 (not 800!)

  - Replace _get_best_initialization with a simple piecewise definition

  - Set base_learning_rate=0.01, num_steps=5000-10000


  Never change the EVOLVE-BLOCK markers or evaluator code.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
