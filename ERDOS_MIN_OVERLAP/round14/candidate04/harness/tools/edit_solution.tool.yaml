type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters or the initialization function.

  To replace _get_best_initialization: EDIT the seed to replace the entire _get_best_initialization method
  with the piecewise constant version (see skill_body for exact code).

  To add local refinement: EDIT the seed to add a BINARY SEARCH over breakpoints after the initial construction.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
