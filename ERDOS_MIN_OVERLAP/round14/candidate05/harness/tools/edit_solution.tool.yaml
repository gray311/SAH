type: tool
name: edit_solution
description: 'Replace the ENTIRE EVOLVE-BLOCK optimizer with a hard-edged step function. Do NOT edit hyperparameters
  while keeping the latent loop—replace the latent-based code with a direct construction. Example pattern:
  - num_intervals=400 - h = np.array([...])  # hard edges, values in [0,1] - Compute c5_bound via FFT
  (as in seed) - return c5_bound'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
