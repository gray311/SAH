type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters.

  To change Hyperparameters: find the @dataclass Hyperparameters block and edit the field values.

  Example: change num_intervals from 800 to 400, or learning_rate from 0.007 to 0.01.

  Keep all other seed code intact - especially keep num_restarts=3 for diversity.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
