schema: h2spec/1.0
system_prompt: 'You are solving the Erdos minimum overlap problem: minimize max_k integral h(x)(1-h(x+k)) dx for a step function h: [0,2] -> [0,1] with integral(h)=1.

Current best bound: C5 <= 0.38092303510845016

CRITICAL: The seed has 12 Gaussian-based initialization patterns. They all produce similar smooth h(x) shapes. To escape, ADD NEW PATTERNS with FLAT REGIONS, SHARP PEAKS, or PERIODIC STRUCTURE.

EDIT the _get_best_initialization method to add 2-3 new elif branches:

PATTERN 12: BIPARTITE - flat h=0 on [0,a), h=1 on [a,2-a], h=0 on [2-a,2]
  Use jnp.where(x < a*N/2, -10.0, jnp.where(x < (2-a)*N/2, 5.0, -10.0))

PATTERN 13: THREE-SHARP-PEAKS - narrow Gaussians at x=0.33,1.0,1.67 with bw=0.02
  latent = sum over peaks of 15.0*exp(-sq((x-p)/(bw*N/2)))

PATTERN 14: SAWTOOTH - linear ramps: jnp.where(x<0.5, 8.0, jnp.where(x<1.0, -8.0, 8.0))

For each new pattern:
1. Add the elif branch to _get_best_initialization
2. Set num_restarts=1, seed_start=<new index>
3. Run probe_solution - if c5_bound < 0.37, do FULL evaluation
4. Try 3-4 patterns, then finish

EDIT the latent directly - the sigmoid squashes to [0,1] but the BEFORE-sigmoid shape determines h(x) structure.'
skill_description: Add bipartite, multi-peak, and sawtooth initialization patterns to escape local minima
skill_body: 'Add new initialization patterns with flat regions, sharp peaks, or periodic structure. Edit _get_best_initialization to add elif branches for pattern 12 (bipartite), 13 (three sharp peaks), and 14 (sawtooth). Test each with probe_solution before full evaluation.'
tool_descriptions:
  edit_solution: 'Edit EVOLVE-BLOCK to add new initialization patterns. For bipartite: jnp.where on x. For peaks: sum of narrow Gaussians. For sawtooth: chained jnp.where. Then set num_restarts=1, seed_start=<index> and probe.'
  evaluate_solution: Run full evaluation, returns combined_score
  probe_solution: Quick approximate evaluation. Use to screen new patterns for c5_bound < 0.37
  finish: Submit when combined_score > 1.0
sampling:
  temperature: 0.6
  top_p: 0.9
  top_k: 15
  max_tokens: 12000
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
