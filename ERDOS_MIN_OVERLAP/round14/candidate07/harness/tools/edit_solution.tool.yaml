type: tool
name: edit_solution
description: 'Edit EVOLVE-BLOCK to add new initialization patterns. For bipartite: jnp.where on x. For
  peaks: sum of narrow Gaussians. For sawtooth: chained jnp.where. Then set num_restarts=1, seed_start=<index>
  and probe.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
