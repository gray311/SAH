type: tool
name: edit_solution
description: "Modify the EVOLVE-BLOCK to change hyperparameters or replace the initialization function\
  \ with a SPECIFIC new pattern.\n\nTo use a single pattern: \n- Remove the _get_best_initialization()\
  \ loop over 12 patterns\n- Keep ONLY ONE pattern's latent generation (e.g., the bipartite pattern)\n\
  - Set num_restarts=3, num_steps=10000, penalty_strength=100\n- Ensure the latent is properly converted\
  \ to h = sigmoid(latent) with integral(h)=1"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
