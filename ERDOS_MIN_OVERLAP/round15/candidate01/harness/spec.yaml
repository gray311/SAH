schema: h2spec/1.0
system_prompt: |
  You are solving the Erdos minimum overlap problem: find a step function h: [0,2] -> [0,1] with integral(h)=1 that minimizes C5 = max_k integral h(x)(1-h(x+k))dx.
  
  Current best bound: C5 <= 0.38092303510845016
  Goal: Find h achieving C5 < 0.380923 (combined_score > 1.0).
  
  KEY INSIGHT: The seed optimizer uses continuous sigmoid functions and optimizes for many steps. 
  BUT the best solutions are likely COARSE step functions with few jumps.
  
  STRATEGY:
  1. FIRST: Use step_func_gen to create explicit piecewise constant functions with 3-7 jumps
  2. EDIT the seed to directly define h as a step function (replace sigmoid with piecewise constants)
  3. Use probe_solution to quickly compute C5 for each candidate (500 intervals, fast)
  4. Call evaluate_solution ONLY on candidates with probe C5 < 0.375
  5. If no improvement, try BINARY step functions (h only takes values 0 or 1)
  
  Focus on STRUCTURED step functions, not continuous optimizations. The seed's 12 patterns are all similar Gaussian shapes - they need fundamentally different structures.
  
  Step function template: Define h as sum of indicator functions over intervals [a_i, b_i] with heights v_i, ensuring integral = 1.
skill_description: |
  Generate explicit step functions with few jumps, screen with probes, evaluate only promising candidates.
skill_body: |
  # Step Function Strategy for Erdos Minimum Overlap
  
  ## Why Step Functions?
  The seed optimizer searches continuous functions. But the optimal C5 bound likely comes from a coarse step function with 3-7 jumps.
  
  ## Workflow
  
  ### Phase 1: Generate Coarse Step Functions
  
  Use step_func_gen to create 8-12 explicit step functions with different structures:
  - Binary: h in {0, 1}, total measure = 1
  - Three-part: high on [0,a], medium on [a,b], low on [b,2]
  - Symmetric around x=1
  - Asymmetric with jumps at "golden" locations
  
  ### Phase 2: Edit Seed to Use Step Functions
  
  For each step function:
  1. EDIT the seed's _objective_fn to directly compute h as a step function
  2. Set num_intervals to a smaller value (20-50) for fast evaluation
  3. Call probe_solution to estimate C5
  
  ### Phase 3: Probe Screening
  
  Use all 30 probes to screen candidates:
  - Check integral constraint (sum(h) * dx ≈ 1)
  - Check probe C5 < 0.375
  
  ### Phase 4: Full Evaluation
  
  Call evaluate_solution on top 2-3 candidates with probe C5 < 0.37
  
  ### Phase 5: Refine Binary Functions
  
  If binary functions work well, try different split points:
  - h = 1 on [0, 0.5], h = 0 elsewhere (C5 = 0.5)
  - h = 1 on [0.25, 0.75], h = 0 elsewhere
  - Weighted splits: h = v on [0,a], h = (1-v*a)/(1-a) on [a,2-a], h = 0 elsewhere
  
  ## Success Criteria
  - combined_score > 1.0
  - c5_bound < 0.38092303510845016
tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK to define h as an explicit step function.
    
    Template for h as step function:
    Define h using piecewise intervals and heights, ensuring integral = 1.
    Then modify _objective_fn to use this h directly instead of sigmoid(latent).
    
    Example: h = 2 on [0, 0.5], h = 0 on [0.5, 2] gives integral = 1.
  evaluate_solution: Run full evaluation, returns combined_score.
  probe_solution: |
    Quick approximate evaluation (500 intervals).
    Returns estimate of c5_bound and whether integral approx 1.
    
    Use to screen step function candidates quickly.
    A good step function should have probe C5 < 0.375.
  finish: Submit when combined_score > 1.0.
sampling:
  temperature: 1.0
  top_p: 0.9
  top_k: 15
  max_tokens: 12000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 8000
new_tools:
  - name: step_func_gen
    description: |
      Generate 8 explicit step function definitions for the Erdos problem.
      Each is a piecewise constant function h: [0,2] -> [0,1] with integral=1.
      Returns structured definitions suitable for editing into the seed.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          functions = {}
          
          # Binary: h = 1 on [0, 0.5]
          functions['binary_0_5'] = {
              'intervals': [(0.0, 0.5), (0.5, 2.0)],
              'heights': [2.0, 0.0],
              'description': 'h=1 on [0,0.5], h=0 elsewhere. integral=1.0'
          }
          
          # Binary shifted: h = 1 on [0.25, 0.75]
          functions['binary_0_25_0_75'] = {
              'intervals': [(0.0, 0.25), (0.25, 0.75), (0.75, 2.0)],
              'heights': [0.0, 4.0, 0.0],
              'description': 'h=1 on [0.25,0.75], h=0 elsewhere'
          }
          
          # Three-part: high-low-high pattern
          functions['three_part'] = {
              'intervals': [(0.0, 0.33), (0.33, 0.66), (0.66, 2.0)],
              'heights': [3.0, 0.0, 1.0],
              'description': 'h=3 on [0,0.33], h=0 on [0.33,0.66], h=1 on [0.66,2]'
          }
          
          # Asymmetric three-part
          functions['asymmetric_three'] = {
              'intervals': [(0.0, 0.5), (0.5, 1.5), (1.5, 2.0)],
              'heights': [2.0, 0.0, 2.0],
              'description': 'h=2 on [0,0.5], h=0 on [0.5,1.5], h=2 on [1.5,2]'
          }
          
          # Two-level with different weights
          functions['two_level_weighted'] = {
              'intervals': [(0.0, 0.4), (0.4, 1.0), (1.0, 2.0)],
              'heights': [2.5, 0.0, 2.5],
              'description': 'h=2.5 on [0,0.4], h=0 on [0.4,1.0], h=2.5 on [1.0,2]'
          }
          
          # Five-part symmetric
          functions['five_part_sym'] = {
              'intervals': [(0.0, 0.3), (0.3, 0.4), (0.4, 0.6), (0.6, 0.7), (0.7, 2.0)],
              'heights': [3.33, 0.0, 3.33, 0.0, 1.0],
              'description': 'symmetric five-part pattern'
          }
          
          # Six-part with 3 peaks
          functions['six_part_3peaks'] = {
              'intervals': [(0.0, 0.25), (0.25, 0.33), (0.33, 0.5), (0.5, 0.66), (0.66, 0.75), (0.75, 2.0)],
              'heights': [4.0, 0.0, 4.0, 0.0, 4.0, 1.0],
              'description': 'three peaks at 0.25, 0.5, 0.66'
          }
          
          # Seven-part fine-grained
          functions['seven_part'] = {
              'intervals': [(0.0, 0.2), (0.2, 0.3), (0.3, 0.4), (0.4, 0.6), (0.6, 0.7), (0.7, 0.8), (0.8, 2.0)],
              'heights': [5.0, 0.0, 5.0, 0.0, 5.0, 0.0, 2.0],
              'description': 'seven intervals with three peaks'
          }
          
          # Simple uniform: h=0.5 everywhere
          functions['uniform'] = {
              'intervals': [(0.0, 2.0)],
              'heights': [0.5],
              'description': 'h=0.5 constant. integral=1.0. C5 will be 0.5.'
          }
          
          # Golden ratio split: h=1.618 on [0, 0.618], h=0 elsewhere
          functions['golden'] = {
              'intervals': [(0.0, 0.618), (0.618, 2.0)],
              'heights': [1.618, 0.0],
              'description': 'Golden ratio split: h=1.618 on [0,0.618]'
          }
          
          # Triangle-like: high-medium-low-medium-high
          functions['triangle_like'] = {
              'intervals': [(0.0, 0.2), (0.2, 0.4), (0.4, 0.6), (0.6, 0.8), (0.8, 1.2)],
              'heights': [5.0, 0.0, 5.0, 0.0, 5.0],
              'description': 'triangle-like with 3 peaks'
          }
          
          return {"step_functions": functions, "count": len(functions)}
new_skills:
  - name: coarse-step-search
    description: |
      Search coarse step functions (3-7 jumps) with probe screening, then full evaluate.
      Focus on structured patterns, not continuous optimization.
    body: |
      # Coarse Step Function Search for Erdos Minimum Overlap
      
      ## Strategy
      
      The seed optimizer searches continuous functions. But better solutions likely come from COARSE step functions with few jumps (3-7 intervals).
      
      ## Workflow
      
      1. Use step_func_gen to get 8+ explicit step function definitions
      2. For each, EDIT the seed to define h as a step function directly (no sigmoid)
      3. Call probe_solution to quickly estimate C5 (500 intervals)
      4. Keep candidates with probe C5 < 0.375 and integral approx 1
      5. Call evaluate_solution on top 2-3 candidates
      6. If no improvement, try BINARY step functions (h in {0,1}) with different supports
      
      ## Key Insight
      
      The seed's 12 initialization patterns are all similar sigmoid shapes. They need COMPLETLY different structures. Step functions with few jumps are fundamentally different.
      
      ## Expected C5 Values
      
      - Binary h=1 on [0,0.5]: C5 = 0.5
      - Uniform h=0.5: C5 = 0.5
      - Optimized step function: C5 < 0.38 (target)
      
      Focus on finding step functions that distribute overlap evenly across all shifts k.
new_middlewares:
  - name: probe_step_functions
    hook: before_model
    description: |
      Before full evaluation, remind solver to use probe to screen step function candidates.
    implementation_py: |
      def before_model(hook_input):
          state = hook_input.get("state", {})
          probes_left = state.get("probes_left", 0)
          evals_left = state.get("evals_left", 0)
          
          if probes_left > 10:
              return (
                  "You have probes remaining. Use probe_solution to screen step function candidates.\n"
                  "Edit seed to use a step function, then probe before calling evaluate_solution.\n"
                  "Only spend full evaluations on candidates with probe C5 < 0.375.\n"
                  "You have 30 probes total - use them efficiently."
              )
          elif probes_left > 0 and evals_left > 3:
              return (
                  "Use remaining probes to screen new step function candidates.\n"
                  "Don't waste full evaluations until probe confirms C5 < 0.375."
              )
          return None
