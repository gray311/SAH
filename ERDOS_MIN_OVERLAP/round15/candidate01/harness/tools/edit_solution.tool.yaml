type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to define h as an explicit step function.


  Template for h as step function:

  Define h using piecewise intervals and heights, ensuring integral = 1.

  Then modify _objective_fn to use this h directly instead of sigmoid(latent).


  Example: h = 2 on [0, 0.5], h = 0 on [0.5, 2] gives integral = 1.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
