type: tool
name: create_piecewise_h
description: 'Generate ready-to-use h(x) step functions (not latents) for the Erdos optimizer.

  Each h(x) is: values in [0,1], integral over [0,2] = 1, 800 points.

  Patterns: piecewise_constant (3-5 breakpoints), golomb_5_marks (optimal spacing for 5 marks), golomb_7_marks,
  asymmetric_triangular, multi_peak_3.

  Output directly usable h vectors that bypass the seed''s sigmoid initialization.'
input_schema:
  type: object
  properties: {}
