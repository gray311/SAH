type: tool
name: edit_solution
description: 'Replace _get_best_initialization to return a COMPLETE h(x) vector (already in [0,1], integral~1).

  Pattern: - Delete old _get_best_initialization method - Add: def _get_best_initialization(self, seed:
  int) -> jnp.ndarray: return jnp.array(your_h_vector)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
