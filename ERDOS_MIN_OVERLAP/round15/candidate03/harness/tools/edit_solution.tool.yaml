type: tool
name: edit_solution
description: "Edit the EVOLVE-BLOCK to create hard step functions:\n1. Replace _get_best_initialization\
  \ with a function that returns 0/1 arrays at breakpoints\n2. In _objective_fn, use h directly instead\
  \ of sigmoid(latent)\n3. Set num_restarts=1 to focus on one pattern\n4. Increase learning rate to 0.01-0.02\n\
  \nExample edit:\nReplace:\n  h = jax.nn.sigmoid(latent)\nWith:\n  h = jnp.concatenate([jnp.ones(100),\
  \ jnp.zeros(100), jnp.ones(600)])\n  h = h / (jnp.sum(h) * dx)"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
