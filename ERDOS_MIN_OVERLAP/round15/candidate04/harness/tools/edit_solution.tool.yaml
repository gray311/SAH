type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to:

  1. Simplify _get_best_initialization to use a single pattern

  2. Add constraint enforcement: latent_scaled = latent / jnp.sum(latent)

  3. Or modify to run full optimization on one pattern (num_restarts=1, num_steps=59000)


  To use single pattern index i: set num_restarts=1, seed_start=i, and simplify _get_best_initialization
  to return only pattern i''s latent.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
