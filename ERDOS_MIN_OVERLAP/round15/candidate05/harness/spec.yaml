schema: h2spec/1.0
system_prompt: |
  Solve the Erdos minimum overlap problem by directly constructing and evaluating step functions using the FFT evaluator.

  Current best bound: C5 <= 0.38092303510845016
  Goal: Find h: [0,2] -> [0,1] with integral(h)=1 that minimizes max_k integral h(x)(1-h(x+k)) dx

  STRATEGY: The seed program runs 59000 training steps per evaluation - TOO SLOW. Instead, EDIT to:

  1. REPLACE _get_best_initialization with DIRECT CONSTRUCTION of candidate step functions (no training needed)
  2. REPLACE _objective_fn to ONLY return the FFT-based c5_bound (no penalty, no gradient)
  3. Replace the optimizer loop with a SIMPLE SEARCH: edit the code to iterate over many candidate constructions, each evaluated with the FFT in ~10ms
  4. Use EDIT to inject new candidate constructions (Golomb ruler, bipartite, multi-peak, etc.)
  5. Call probe_solution to verify constraint satisfaction (integral=1, range [0,1])
  6. Call evaluate_solution ONCE on the best candidate found

  Key insight: The FFT evaluator is INSTANTANT. Don't waste 59000 steps. Direct construction + FFT evaluation = thousands of candidates per eval budget.
skill_description: |
  Direct construction strategy: bypass slow training, directly construct and FFT-evaluate step function candidates.
skill_body: |
  # Direct Construction Strategy for Erdos Optimizer

  ## Critical Insight
  The seed's optimizer runs 59,000 training steps per evaluation. This is WASTEFUL because the FFT evaluator computes c5_bound in milliseconds.

  ## New Strategy
  1. EDIT to remove the optimizer: Replace the training loop with a direct search over candidate constructions
  2. DIRECT CONSTRUCTION: Create step functions analytically (Golomb ruler, bipartite, multi-peak)
  3. FFT EVALUATION ONLY: Each candidate evaluated via the FFT formula in ~10ms
  4. USE ALL 30 EVALUATION BUDGET to test hundreds of candidates

  ## Candidate Constructions
  Try these patterns (with integral normalization to ensure sum=1):

  - Golomb ruler: Points at optimal spacings for 5-7 marks
  - Bipartite: h=1 on [0,a] U [2-a,2], h=0 on [a,2-a]
  - Tri-modal: Three peaks at specific locations
  - Asymmetric: Different heights on different intervals
  - Sawtooth: Linear patterns that sum to 1

  ## Implementation Steps
  1. EDIT _get_best_initialization to RETURN A LIST of candidate latents (not just one best)
  2. EDIT the main loop to ITERATE over all candidates, computing FFT-based c5_bound for each
  3. Pick the best candidate and CALL evaluate_solution once
  4. If no improvement, EDIT to add a NEW construction type
tool_descriptions:
  edit_solution: |
    Replace the optimizer with direct construction. Keep the FFT evaluator (_compute_c5_bound), remove _objective_fn and training loop, replace with a loop over candidate constructions.
  evaluate_solution: |
    Run full evaluation on the best candidate found. Should be called once per iteration.
  probe_solution: |
    Quick approximate evaluation. Use to verify candidates before full eval.
  finish: |
    Submit when combined_score > 1.0.
sampling:
  temperature: 1.5
  top_p: 0.99
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 15000
new_tools:
  - name: construct_candidates
    description: |
      Generate 10 diverse step function constructions for the Erdos problem.

      Each construction produces a latent vector that, after sigmoid normalization,
      gives a step function h with integral(h) approximately 1.

      Patterns: Golomb ruler (5 marks), bipartite (two regions), tri-modal (3 peaks),
      asymmetric triangular, sawtooth, exponential decay, ramp, step-half,
      sinusoidal-biased, and piecewise-constant with 4 regions.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          N = 800
          domain = 2.0
          constructions = {}
          
          # 1. Golomb ruler for 5 marks: [0, 1, 4, 9, 11] scaled
          golomb_pos = np.array([0.0, 0.5, 1.6, 3.75, 4.4]) * 0.444
          golomb_pos = golomb_pos / golomb_pos.max() * 2.0
          h = np.zeros(N)
          for pos in golomb_pos:
              idx = int(pos * N)
              width = 20
              h[max(0, idx-width):min(N, idx+width)] = np.linspace(1, 0, 2*width)
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['golomb_5'] = h
          
          # 2. Bipartite: high on [0,a] U [2-a,2], low in middle
          a = 0.5
          h = np.ones(N)
          h[int(N*a):int(N*(2-a))] = 0.2
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['bipartite_a05'] = h
          
          # 3. Tri-modal: three peaks
          h = np.zeros(N)
          peaks = [150, 400, 650]
          for p in peaks:
              w = 80
              h[max(0,p-w):min(N,p+w)] = np.where(np.arange(2*w) > w, 0.0, 1.5)
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['tri_modal'] = h
          
          # 4. Asymmetric triangular
          h = np.zeros(N)
          h[:int(N*0.4)] = 2.0
          h[int(N*0.4):int(N*1.2)] = 0.8
          h[int(N*1.2):] = -0.5
          h = np.clip(h, 0, 5)
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['asym_tri'] = h
          
          # 5. Sawtooth
          h = np.zeros(N)
          h[:] = np.linspace(0, 3, N)
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['sawtooth'] = h
          
          # 6. Exponential decay from left
          x = np.linspace(0, 2, N)
          h = np.exp(-2 * x)
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['exp_decay'] = h
          
          # 7. Ramp function
          h = np.linspace(0.3, 1.7, N)
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['ramp'] = h
          
          # 8. Step at midpoint
          h = np.zeros(N)
          h[int(N*0.5):] = 1.5
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['step_mid'] = h
          
          # 9. Sinusoidal-biased
          x = np.linspace(0, 2, N)
          h = 0.5 + 0.5 * np.sin(2 * np.pi * x / 2)
          h = np.clip(h, 0.1, 0.99)
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['sin_bias'] = h
          
          # 10. Piecewise-constant with 4 regions
          regions = [0.25, 0.75, 1.5]
          h = np.zeros(N)
          h[:int(N*0.25)] = 1.2
          h[int(N*0.25):int(N*0.75)] = 0.4
          h[int(N*0.75):int(N*1.5)] = 0.9
          h[int(N*1.5):] = -0.3
          h = np.clip(h, 0, 3)
          h = h / (np.sum(h) * domain + 1e-10)
          constructions['pw4'] = h
          
          return {"constructions": constructions, "num_constructions": 10}
new_skills:
  - name: direct-construction-eval
    description: |
      Bypass slow training, directly construct and FFT-evaluate step function candidates. Use all 30 evals for this.
    body: |
      # Direct Construction + FFT Evaluation Strategy

      ## The Problem
      The seed optimizer runs 59,000 training steps per evaluation. This is 100-1000x slower than necessary.

      ## The Solution
      1. EDIT to remove the optimizer: Delete or comment out the training loop
      2. DIRECT CONSTRUCTION: Create step functions analytically
      3. FFT EVALUATION: Use _compute_c5_bound (the FFT function) to evaluate each candidate in ~10ms
      4. SEARCH LOOP: Edit the main code to iterate over 50-100 candidates
      5. BEST CANDIDATE: Pick the one with lowest c5_bound
      6. SINGLE EVALUATION: Call evaluate_solution once on the best candidate

      ## Example Edit Structure
      Instead of running 59000 training steps, do this:
      - Create candidate constructions
      - For each, compute FFT-based c5_bound in ~10ms
      - Pick the best candidate
      - Call evaluate_solution ONCE

      ## Why This Works
      - FFT evaluation: 10ms per candidate
      - 59000-step training: 30+ seconds per evaluation
      - Result: Test 3000+ candidates per evaluation budget
      - Even 10x worse than seed is possible with this approach
new_middlewares:
  - name: force_direct_search
    hook: before_model
    description: |
      Enforce direct construction search: remind solver to bypass optimizer and use FFT for rapid evaluation.
    implementation_py: |
      def before_model(hook_input):
          state = hook_input.get("state", {})
          evals_left = state.get("evals_left", 0)
          iters_left = state.get("iterations_left", 0)
          reminder = None
          if iters_left > 10 and evals_left > 5:
              reminder = (
                  "Use DIRECT CONSTRUCTION + FFT evaluation.\n"
                  "Remove the 59000-step optimizer loop.\n"
                  "Iterate over candidate constructions, compute FFT-based c5_bound for each (~10ms).\n"
                  "Pick best candidate, call evaluate_solution ONCE.\n"
                  "With this strategy, you can test thousands of candidates per eval budget."
              )
          elif evals_left <= 5 and reminder is None:
              reminder = (
                  "You have 5 evals left - use DIRECT CONSTRUCTION to test many candidates,\n"
                  "then call evaluate_solution ONCE on the best one."
              )
          return reminder
