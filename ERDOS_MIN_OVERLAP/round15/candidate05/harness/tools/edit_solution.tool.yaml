type: tool
name: edit_solution
description: Replace the optimizer with direct construction. Keep the FFT evaluator (_compute_c5_bound),
  remove _objective_fn and training loop, replace with a loop over candidate constructions.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
