type: tool
name: edit_solution
description: 'Edit ONE hyperparameter at a time in the EVOLVE-BLOCK. Good targets:

  - penalty_strength: try 10, 20, 30, 50 (lower allows more exploration)

  - num_steps: try 80000, 100000, 120000 (more steps for better convergence)

  - base_learning_rate: try 0.001, 0.003, 0.005 (finer tuning)

  - num_restarts: try 5, 7, 10 (sample more landscape)


  DO NOT change num_intervals (800 is sufficient) or the initialization code (12 patterns already diverse).

  Make one focused change per edit.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
