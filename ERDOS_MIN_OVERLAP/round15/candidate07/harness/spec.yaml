schema: h2spec/1.0
system_prompt: |
  You are solving the Erdos minimum overlap problem: minimize max_k integral h(x)(1-h(x+k)) dx
  for a step function h: [0,2] -> [0,1] with integral(h)=1.
  
  Current best bound: C5 <= 0.38092303510845016
  
  STRATEGY: The seed program has 12 diverse initializations but uses fixed hyperparameters.
  The optimization is the bottleneck - you must TUNE hyperparameters and try DIFFERENT optimizers.
  
  Steps:
  1. ANALYZE the current hyperparameters: lr=0.007, penalty=61.0, steps=59000, restarts=3
  
  2. VARY KEY PARAMETERS:
     - Try different learning rates: 0.001, 0.01, 0.005, 0.02
     - Try different penalty strengths: 10, 50, 100, 200
     - Try different step counts: 10000, 30000, 100000
     - Try different num_restarts: 1, 5, 10
  
  3. USE probe_solution to quickly check c5_bound and constraint satisfaction
  
  4. Call evaluate_solution on candidates with c5_bound < 0.375 AND constraint satisfied
  
  5. TRY DIFFERENT OPTIMIZERS: Change optax.adam to optax.adamw, optax.rmsprop, or optax.sgd
  
  6. USE LEARNING RATE SCHEDULES: Add warmup or decay to the optimizer
  
  7. MODIFY THE OBJECTIVE FUNCTION: Try different penalty formulations
  
  Focus on HYPERPARAMETER SEARCH and OPTIMIZER VARIATION, not creating new initializations.
  The seed's 12 initializations are already diverse - you need better optimization.
skill_description: |
  Tune hyperparameters and optimizer to find better solutions. Use probes to screen candidates before full evaluation.
skill_body: |
  # Erdos Minimum Overlap - Hyperparameter Optimization Strategy
  
  ## Problem
  
  The seed optimizer uses 12 initializations but has FIXED hyperparameters.
  To improve, we must systematically VARY these parameters.
  
  ## Key Hyperparameters to Tune
  
  ### Learning Rate (base_learning_rate)
  - Try: 0.001, 0.005, 0.01, 0.02, 0.05
  - Too low: slow convergence, stuck in local minima
  - Too high: oscillations, constraint violations
  
  ### Penalty Strength (penalty_strength)
  - Try: 10, 30, 61, 100, 200, 500
  - Too weak: integral constraint not satisfied
  - Too strong: optimizer struggles, poor C5 bound
  
  ### Number of Steps (num_steps)
  - Try: 10000, 30000, 59000, 100000, 200000
  - Too few: not converged
  - Too many: wasted budget, could be better initialization
  
  ### Number of Restarts (num_restarts)
  - Try: 1, 3, 5, 10
  - More restarts = better exploration but uses more eval budget
  
  ## Strategy
  
  ### Phase 1: Quick Parameter Sweep (Use ALL 30 Probes)
  
  1. Keep other params fixed, VARY ONE hyperparameter at a time
  2. For each candidate, call probe_solution to check:
     - Does integral(h) ≈ 1 (within 0.01)?
     - What is estimated c5_bound?
  3. Track which parameter values give best probe results
  
  ### Phase 2: Full Evaluation
  
  1. Take top 3 candidates from Phase 2 (c5_bound < 0.375 from probe)
  2. Call evaluate_solution on each
  3. Analyze results - which hyperparameters worked?
  
  ### Phase 3: Optimizer Variation
  
  1. If hyperparameter tuning doesn't help, try DIFFERENT optimizers:
     - optax.adamw (weight decay)
     - optax.rmsprop
     - optax.sgd
     - optax.adadelta
  2. Change the optimizer in the seed code
  
  ### Phase 4: Learning Rate Schedules
  
  1. Add learning rate decay or warmup
  2. Use optax schedule functions (e.g., optax.schedule.decay)
  
  ## Expected Outcome
  
  - Find hyperparameter combinations that achieve c5_bound < 0.37
  - Or discover optimizer strategies that converge better
  
  ## Key Insight
  
  The seed's initialization is GOOD (12 diverse patterns).
  The optimization is the bottleneck. TUNE IT.
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to change hyperparameters or optimizer.
    
    To change learning rate: set base_learning_rate = 0.01 (example)
    
    To change penalty: set penalty_strength = 100
    
    To change optimizer: replace optax.adam with optax.adamw, optax.rmsprop, etc.
    
    To add restarts: set num_restarts = 10
    
    To change steps: set num_steps = 100000
  evaluate_solution: Run full evaluation on a candidate program, returns combined_score.
  probe_solution: |
    Quick approximate evaluation (500 intervals, 10s runtime).
    
    Returns estimate of c5_bound and constraint satisfaction.
    
    Use this to screen MANY hyperparameter combinations before full evaluation.
    Check integral constraint and c5_bound estimate.
  finish: Submit when combined_score > 1.0.
sampling:
  temperature: 0.5
  top_p: 0.9
  top_k: 10
  max_tokens: 8000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares: []
