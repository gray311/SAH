type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters or optimizer.


  To change learning rate: set base_learning_rate = 0.01 (example)


  To change penalty: set penalty_strength = 100


  To change optimizer: replace optax.adam with optax.adamw, optax.rmsprop, etc.


  To add restarts: set num_restarts = 10


  To change steps: set num_steps = 100000'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
