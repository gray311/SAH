type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters or add new initialization patterns.


  CRITICAL: When testing new patterns, set num_steps = 5000 (not 59000) and num_restarts = 1.

  This allows quick screening of many candidates.


  To use a single initialization pattern:

  - Set num_restarts = 1

  - Set seed_start = pattern_index

  - Or replace _get_best_initialization to return ONLY that pattern''s latent

  - Set num_steps = 5000 for screening


  Example edit for "three-finger" pattern:'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
