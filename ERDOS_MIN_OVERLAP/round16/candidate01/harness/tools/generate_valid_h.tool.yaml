type: tool
name: generate_valid_h
description: 'Generate 4 valid step functions h: [0,2]->[0,1] that satisfy integral(h)=1 exactly.

  Each h is already in [0,1] and normalized. Return as dict with keys: h_golomb, h_bipartite, h_triplet,
  h_triangular.

  These are ready to use as the h array in the seed (no sigmoid needed).'
input_schema:
  type: object
  properties: {}
