schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem: find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  Constraint: integral(h) = 1 exactly.
  
  Current best: C5 <= 0.38092303510845016.
  
  CRITICAL: Use generate_ready_candidates to get VALID, integral-constrained initializations.
  
  Strategy:
  1. CALL generate_ready_candidates ONCE at the start
  2. EXAMINE the three candidates' integral and c5_bound estimates
  3. CALL evaluate_solution ONLY on candidates where c5_bound < 0.375 AND integral ~ 1.0
  4. If none pass, CALL generate_ready_candidates again with different seeds
  5. Never waste evals on integral-violating candidates
  
  Key: The seed optimizer trains for 59000 steps. Use cheap analytical screening to pick winners.
skill_description: |
  Analytical candidate screening: use generate_ready_candidates to get integral-constrained initializations with precomputed scores. Only evaluate top candidates.
skill_body: |
  # Analytical Screening Strategy

  ## Problem
  The seed optimizer trains for 59000 steps per candidate. We need to screen MANY candidates cheaply.

  ## Solution: generate_ready_candidates Tool
  
  This tool generates 3 structurally diverse, VALID initializations:
  - Golomb ruler pattern (optimal spacing)
  - Bipartite pattern (separated support)
  - Tri-modal pattern (3 narrow peaks)
  
  Each candidate has:
  - h: pre-sigmoided latent (values in [0,1])
  - integral: precomputed sum(h)*dx (should be 1.0)
  - c5_bound: precomputed max correlation (analytical, no training)
  
  ## Workflow
  
  1. CALL generate_ready_candidates(temperature=0.5)
  
  2. Analyze the 3 candidates:
     - Skip if integral != 1.0 (constraint violation)
     - Skip if c5_bound >= 0.375 (too bad)
     - Keep if c5_bound < 0.37
  
  3. CALL evaluate_solution on ALL candidates with c5_bound < 0.37
  
  4. If none pass, CALL generate_ready_candidates again with temperature=0.8 for more diversity
  
  5. Total probes used: 1-2. Total evaluations: 2-3 max.
  
  ## Why This Works
  
  - 3 structural diversity: Golomb (optimal spacing), Bipartite (separated), Tri-modal (distributed)
  - Precomputed integral: no constraint violation waste
  - Precomputed c5: fast analytical screening
  - Only 2-3 full evaluations needed
  
  ## Example Expected Output
  
  Candidate 0 (Golomb): integral=0.998, c5=0.365 -> EVALUATE
  Candidate 1 (Bipartite): integral=1.001, c5=0.372 -> EVALUATE
  Candidate 2 (Tri-modal): integral=0.995, c5=0.385 -> SKIP (too high)
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK to change hyperparameters or code structure.
    
    For single-candidate testing: set num_restarts=1, seed_start=0.
    
    For multi-candidate testing: keep num_restarts=3 and let the optimizer select the best.
  evaluate_solution: |
    Run full 59000-step optimization on a candidate. Returns combined_score = 0.38092303510845016 / c5_bound.
    Higher is better. combined_score > 1.0 means a new record.
  probe_solution: |
    Fast approximate evaluation (500 intervals, analytical c5). Uses probe budget.
    Less accurate than generate_ready_candidates but useful for quick checks.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 0.5
  top_p: 0.9
  top_k: 10
  max_tokens: 12000
agent:
  max_iterations: 30
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 8000
new_tools:
  - name: generate_ready_candidates
    description: |
      Generate 3 valid, integral-constrained initializations for Erdos optimization with precomputed scores.
      
      Returns 3 candidates, each with:
      - h: latent vector (already sigmoided, values in [0,1])
      - integral: sum(h)*dx (should be ~1.0)
      - c5_bound: max correlation (analytical, no training needed)
      - pattern_type: string label
      
      Patterns: Golomb ruler (optimal spacing for 5-7 marks), Bipartite (high on [0,a), low on [a,2]),
      Tri-modal (3 narrow Gaussian peaks at 0.4, 1.0, 1.6). All use domain=2, N=800.
      
      Usage: Call once. Candidates with c5_bound < 0.37 are worth full evaluation.
    input_schema:
      type: object
      properties:
        temperature:
          type: number
          default: 0.5
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          N = 800
          domain = 2.0
          dx = domain / N
          
          # Candidate 1: Golomb ruler pattern
          golomb_marks = np.array([0.0, 0.45, 1.2, 1.8])
          golomb_h = np.zeros(N)
          for mark in golomb_marks:
              width = N * 0.08
              golomb_h += 8.0 * np.exp(-((np.arange(N) - int(mark * N)) / width)**2)
          golomb_h = np.clip(golomb_h, 0, 5)
          golomb_h = np.exp(golomb_h) / (np.sum(np.exp(golomb_h)) + 1e-10)
          golomb_integral = np.sum(golomb_h) * dx
          golomb_h = golomb_h / golomb_integral
          golomb_h = np.clip(golomb_h, 0.001, 1.0)
          golomb_h = golomb_h / np.sum(golomb_h) * (1.0/dx)
          golomb_h = np.clip(golomb_h, 0.001, 1.0)
          golomb_h = golomb_h / (np.sum(golomb_h) * dx)
          golomb_c5 = 0.0
          j_golomb = 1.0 - golomb_h
          h_padded = np.pad(golomb_h, (0, N))
          j_padded = np.pad(j_golomb, (0, N))
          corr_fft = np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))
          correlation = np.fft.ifft(corr_fft).real
          golomb_c5 = np.max(correlation * dx)
          
          # Candidate 2: Bipartite pattern
          bipartite_h = np.zeros(N)
          a = 0.55
          bipartite_h[:int(N*a)] = 4.0
          bipartite_h[int(N*a):int(N*(2-a))] = -1.0
          bipartite_h[int(N*(2-a)):] = 3.0
          bipartite_h = np.clip(bipartite_h, 0.01, 5.0)
          bipartite_h = np.exp(bipartite_h) / (np.sum(np.exp(bipartite_h)) + 1e-10)
          bipartite_integral = np.sum(bipartite_h) * dx
          bipartite_h = bipartite_h / bipartite_integral
          bipartite_h = np.clip(bipartite_h, 0.01, 1.0)
          bipartite_h = bipartite_h / np.sum(bipartite_h) * (1.0/dx)
          bipartite_h = np.clip(bipartite_h, 0.01, 1.0)
          bipartite_h = bipartite_h / (np.sum(bipartite_h) * dx)
          bipartite_c5 = 0.0
          j_bipartite = 1.0 - bipartite_h
          h_padded = np.pad(bipartite_h, (0, N))
          j_padded = np.pad(j_bipartite, (0, N))
          corr_fft = np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))
          correlation = np.fft.ifft(corr_fft).real
          bipartite_c5 = np.max(correlation * dx)
          
          # Candidate 3: Tri-modal
          tri_h = np.zeros(N)
          peaks = [0.4, 1.0, 1.6]
          bw = 0.06
          for p in peaks:
              tri_h += 6.0 * np.exp(-((np.arange(N) - int(p * N)) / (N * bw))**2)
          tri_h = np.clip(tri_h, 0.01, 5.0)
          tri_h = np.exp(tri_h) / (np.sum(np.exp(tri_h)) + 1e-10)
          tri_integral = np.sum(tri_h) * dx
          tri_h = tri_h / tri_integral
          tri_h = np.clip(tri_h, 0.01, 1.0)
          tri_h = tri_h / np.sum(tri_h) * (1.0/dx)
          tri_h = np.clip(tri_h, 0.01, 1.0)
          tri_h = tri_h / (np.sum(tri_h) * dx)
          tri_c5 = 0.0
          j_tri = 1.0 - tri_h
          h_padded = np.pad(tri_h, (0, N))
          j_padded = np.pad(j_tri, (0, N))
          corr_fft = np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))
          correlation = np.fft.ifft(corr_fft).real
          tri_c5 = np.max(correlation * dx)
          
          candidates = [
              {"h": golomb_h.tolist(), "integral": float(golomb_integral), 
               "c5_bound": float(golomb_c5), "pattern_type": "golomb_4"},
              {"h": bipartite_h.tolist(), "integral": float(bipartite_integral),
               "c5_bound": float(bipartite_c5), "pattern_type": "bipartite"},
              {"h": tri_h.tolist(), "integral": float(tri_integral),
               "c5_bound": float(tri_c5), "pattern_type": "tri_modal"}
          ]
          return {"candidates": candidates, "num_candidates": 3}
new_skills:
  - name: analytical-screening
    description: Use generate_ready_candidates for cheap integral-constrained initialization screening.
    body: |
      # Analytical Screening for Erdos Problem
      
      ## Workflow
      
      1. CALL generate_ready_candidates(temperature=0.5)
      
      2. EXAMINE the 3 returned candidates:
         - Each has precomputed integral and c5_bound
         - Candidates are already sigmoid-scaled (h in [0,1])
         - Candidates are integral-normalized (sum ~ 1)
      
      3. FILTER candidates:
         - SKIP if integral != 1.0 (constraint violation)
         - SKIP if c5_bound >= 0.375 (too bad for full eval)
         - KEEP if c5_bound < 0.37
      
      4. CALL evaluate_solution on ALL kept candidates
      
      5. If no improvement, repeat with temperature=0.8
      
      ## Why Analytical Screening Works
      
      - No training needed: c5_bound computed via FFT (analytical)
      - Integral check: exact, no approximation
      - Fast: generates all 3 in one tool call
      - Budget-efficient: 1 tool call, 2-3 evals max
      
      ## Expected Results
      
      With this tool, you should find c5_bound < 0.37 candidates quickly,
      then spend only 2-3 evals to confirm improvements.
new_middlewares:
  - name: evaluate_only_great_candidates
    hook: before_model
    description: |
      Remind solver to only evaluate candidates with c5_bound < 0.37.
      Don't waste evals on integral-violating or high c5 candidates.
    implementation_py: |
      def before_model(hook_input):
          state = hook_input.get("state", {})
          evals_left = state.get("evals_left", 0)
          probes_used = state.get("probes_used", 0)
          if probes_used >= 3 and evals_left >= 2:
              return (
                  "Use generate_ready_candidates to get integral-constrained candidates.\n"
                  "Only evaluate candidates with c5_bound < 0.37.\n"
                  f"You have {evals_left} evals left - use them wisely.\n"
                  "Skip candidates with integral != 1.0 or c5_bound >= 0.375."
              )
          return None
