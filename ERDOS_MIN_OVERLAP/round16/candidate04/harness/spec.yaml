schema: h2spec/1.0
system_prompt: |
  Solve the Erdos minimum overlap problem by finding a step function h: [0,2]->[0,1]
  with integral(h)=1 that minimizes C5 = max_k integral h(x)(1-h(x+k)) dx.

  Current best bound: 0.38092303510845016. Goal: c5_bound < 0.380923.

  THE PROBLEM: The seed program's 12 initialization patterns are all Gaussian/sigmoid
  shapes that DO NOT satisfy integral(h)=1 exactly. The weak penalty (61.0) lets
  the optimizer drift, wasting all 59000 steps on constraint violations.

  THE SOLUTION: Build a piecewise-constant initialization that SATISFIES
  integral(h)=1 by ALGEBRAIC CONSTRUCTION, then optimize it.

  MATH FOR 3-PIECE CONSTRUCTION:
    Define: h=0 on [0,a], h=b on [a,c], h=1 on [c,2]
    Integral = a*0 + (c-a)*b + (2-c)*1 = (c-a)*b + 2-c
    Set equal to 1: (c-a)*b + 2-c = 1
    Solve for b: b = (1 - (2-c)) / (c-a) = (c-1) / (c-a)
    Choose any a < c such that b in [0,1]:
      - Try a=0.3, c=1.5: b = (1.5-1)/(1.5-0.3) = 0.5/1.2 = 0.4167 ✓
      - Try a=0.2, c=1.8: b = (1.8-1)/(1.8-0.2) = 0.8/1.6 = 0.5 ✓

  WORKFLOW (ONLY 3 EVALUATIONS NEEDED):
  1. EDIT seed: Replace _get_best_initialization with the piecewise function above
     using the math that guarantees integral=1 exactly.
  2. EDIT seed: Set num_restarts=1, seed_start=0 (use only THIS initialization)
  3. CALL evaluate_solution ONCE to get real c5_bound
  4. If c5_bound >= 0.38, CHOOSE DIFFERENT breakpoints (a,c) and repeat

  CRITICAL: The piecewise function is ALREADY constraint-satisfying. The optimizer
  just needs to refine the SHAPE of h within each piece. Do NOT waste time with
  probes or screening. Just build, edit, evaluate, repeat.
