type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to change hyperparameters.


  To test a hyperparameter combo:

  - Set num_intervals, base_learning_rate, num_steps, penalty_strength, num_restarts

  - Keep the seed''s _get_best_initialization (it already tries 12 patterns)

  - Set num_restarts=3 to use the built-in diversity


  Example: Set num_restarts=3, penalty_strength=30, base_learning_rate=0.01, num_intervals=400'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
