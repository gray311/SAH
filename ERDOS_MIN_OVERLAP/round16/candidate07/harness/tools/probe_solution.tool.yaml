name: probe_solution
description: 'Quick approximate evaluation (500 intervals, 10s runtime).

  Returns estimate of c5_bound and constraint satisfaction.


  Use this to screen hyperparameter combinations:

  - Check if integral(h) ≈ 1 (constraint)

  - Check c5_bound estimate

  - Use ALL 30 probes to test many hyperparameter combos


  Only call evaluate_solution on top 3-5 candidates with c5_bound < 0.36'
