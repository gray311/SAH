type: tool
name: pattern_modifier
description: 'Generate a new pattern variant by modifying parameters of the seed''s 15 patterns.


  Takes parameters like:

  - pattern_id: which pattern to modify (0-14)

  - mod_type: one of ''narrow_peaks'', ''wider_peaks'', ''shift_peaks'', ''adjust_threshold'', ''add_mark'',
  ''remove_mark''

  - mod_value: the new value for the modification


  Returns a new initial h array (already sigmoid-converted, integral-normalized)

  with updated pattern parameters.


  Usage:

  - Call pattern_modifier with a pattern_id and mod_type

  - EDIT the seed code with the new parameters

  - Call evaluate_solution to train the new variant'
input_schema:
  type: object
  properties:
    pattern_id:
      type: integer
      default: 12
    mod_type:
      type: string
      default: narrow_peaks
    mod_value:
      type: number
      default: 0.5
