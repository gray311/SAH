type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters. The seed optimizer accepts num_intervals,
  base_learning_rate, num_steps, penalty_strength, num_restarts.


  For hyperparameter testing: set num_restarts=1 and run single configs quickly for analysis.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
