type: tool
name: hyperparameter_sweep
description: 'Systematically test 9 hyperparameter configurations for the Erdos optimizer.


  Varies: num_intervals (200, 400, 800), base_learning_rate (0.001, 0.006, 0.02),

  penalty_strength (30, 60, 120). Each config runs a quick 1000-step optimization

  and returns the best c5 bound found.


  Returns a dict with "configurations" key containing 9 entries, each with:

  - config_id: integer

  - num_intervals, base_learning_rate, penalty_strength, num_steps

  - c5_best: best bound found in 1000 steps

  - combined_score_estimate: 0.38092303510845016 / c5_best


  Usage: Call once, pick best config, edit_solution to apply it, evaluate_solution once.'
input_schema:
  type: object
  properties: {}
