type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK. To change candidate generation: 1. Simplify _get_best_initialization
  - remove complex pattern selection 2. Add a simple function generator that tries multiple random structures
  3. Ensure integral constraint is respected (use sigmoid normalization) 4. Use different seeds for each
  run to get diverse samples

  Example: Replace _get_best_initialization with a function that generates random candidates with different
  support widths and peak locations.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
