type: tool
name: edit_solution
description: "Modify EVOLVE-BLOCK to improve the Erdos optimizer.\n\nOptions:\n1. Hyperparameter changes:\
  \ num_intervals (400-1200), base_learning_rate (0.001-0.02), \n   num_steps (10000-100000), penalty_strength\
  \ (10-100), num_restarts (1-5)\n\n2. New initialization patterns: Add to _get_best_initialization method:\n\
  \   - Different Golomb ruler patterns (try more marks at different positions)\n   - Bipartite with different\
  \ split points (a in [0.3, 0.7])\n   - Multi-peak patterns (3-5 peaks at different locations)\n   -\
  \ Wave patterns with different frequencies\n\n3. Objective function modifications: Change how correlation\
  \ is computed.\n\nKeep code syntactically valid. Always use probe_solution first!"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
