type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters or code structure.

  For hyperparameter search: set num_restarts=1, num_steps=10000 to test configs quickly.

  Focus on: num_intervals (400-1200), learning_rate (0.001-0.02), penalty_strength (10-200).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
