schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem: find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

  Constraint: integral(h) = 1 exactly.

  Current best: C5 <= 0.38092303510845016.

  The seed optimizer trains for 59000 steps per candidate. This is too slow to trial-and-error.

  Strategy:

  1. DIRECTLY EDIT the EVOLVE-BLOCK to change hyperparameters: try num_intervals in [32, 64, 128, 256] and num_steps in [3000, 15000, 30000, 59000]

  2. For each hyperparameter config, set num_restarts=1 and run one 59000-step optimization

  3. Compare c5_bound values across configs. The optimizer needs more exploration of the search space (coarse grids first, then fine grids)

  4. Only after finding a config that beats the seed, then try more aggressive configs

  5. Focus on structural changes to the objective function or loss landscape, not just random init seeds

  Key: The seed pattern-based init is the bottleneck. We need to find better INITIALIZATIONS that already have low c5_bound, then train them. Use coarse-to-fine grid search.
skill_description: |
  Direct hyperparameter search: try different num_intervals (grid resolution) and num_steps (training duration). Coarse grids (32-128 intervals) let us quickly find promising architectures. Fine grids (256+) refine the solution. Train each candidate with num_restarts=1 to isolate the effect of hyperparameters.
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK to change hyperparameters: num_intervals, base_learning_rate, num_steps, penalty_strength, num_restarts, seed_start.

    For grid search: set num_restarts=1 and change num_intervals to one of [32, 64, 128, 256].

    For refinement: once a promising config is found (c5 < 0.37), use num_restarts=3 with num_intervals=256+ and num_steps=59000.
  evaluate_solution: |
    Run full 59000-step optimization on a candidate. Returns combined_score = 0.38092303510845016 / c5_bound.

    Higher is better. combined_score > 1.0 means a new record.
  probe_solution: |
    Fast approximate evaluation (500 intervals, analytical c5). Uses probe budget.

    Less accurate than full evaluation but useful for quick checks.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 40
  max_tokens: 16000
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools: []
new_skills: []
new_middlewares: []
