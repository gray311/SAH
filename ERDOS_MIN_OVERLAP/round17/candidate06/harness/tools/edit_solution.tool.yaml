type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters: num_intervals, base_learning_rate, num_steps,
  penalty_strength, num_restarts, seed_start.


  For grid search: set num_restarts=1 and change num_intervals to one of [32, 64, 128, 256].


  For refinement: once a promising config is found (c5 < 0.37), use num_restarts=3 with num_intervals=256+
  and num_steps=59000.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
