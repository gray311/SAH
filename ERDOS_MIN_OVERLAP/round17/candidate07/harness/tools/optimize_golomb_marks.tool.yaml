type: tool
name: optimize_golomb_marks
description: 'Exhaustively search 5-mark Golomb ruler placements on domain [0,2].

  Discretizes domain to 200 buckets, searches all C(200,5) combinations (impractical), so uses greedy
  hill-climbing: start from [50,100,150,175,195], then iteratively perturb each mark by ±1 bucket, keeping
  improvements. Returns the best 5 marks (as floats in [0,2]) with their analytical c5_bound computed
  via FFT on N=800 intervals.'
input_schema:
  type: object
  properties:
    num_marks:
      type: integer
      default: 5
      description: number of marks to optimize
