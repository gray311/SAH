type: tool
name: create_structural_init
description: 'Generate 4 diverse structural initializations: wavelet bands, Fourier modes, piecewise linear
  ramps, multi-scale bumps. Each integral-normalized and in [0,1]. Returns c5_bound estimate via FFT.'
input_schema:
  type: object
  properties:
    scale_variety:
      type: boolean
      default: true
