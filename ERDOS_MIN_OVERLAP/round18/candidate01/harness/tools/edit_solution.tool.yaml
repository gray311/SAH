type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters or code structure.


  For single-candidate testing: set num_restarts=1, seed_start=0.


  For hyperparameter sweep: vary num_intervals (200/400/800), base_learning_rate (0.002/0.006/0.01), num_steps
  (50000/100000).


  For pattern changes: modify _get_best_initialization to try simpler patterns (fewer seeds, fixed offsets).


  Keep mutations SMALL (EVOLVE-BLOCK only).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
