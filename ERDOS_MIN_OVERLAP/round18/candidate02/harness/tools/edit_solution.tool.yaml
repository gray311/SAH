type: tool
name: edit_solution
description: 'Modify Hyperparameters or optimizer code. For exploration: increase num_intervals to 1600.
  For single tests: num_restarts=1.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
