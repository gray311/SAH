type: tool
name: systematic_scan
description: 'Generate 6 integral-normalized candidates with systematic multi-peak patterns. Each candidate
  has precomputed c5_bound via FFT. All have integral=1.0 exactly.

  Patterns: - 2 peaks at 1/3 and 2/3 spacing (0.667, 1.333) - 3 peaks at equal spacing (0.6, 1.0, 1.4)
  - 3 peaks at optimized spacing (0.5, 1.0, 1.5) - 4 peaks at quarter spacing (0.5, 1.0, 1.5, 2.0) - Gaussian
  peaks at optimized locations - Flat-top peaks with controlled width

  Usage: Call with temperature and num_peaks. Filter candidates with c5_bound < 0.36 for full evaluation.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.5
    num_peaks:
      type: integer
      default: 3
    peak_spacing:
      type: string
      default: equal
