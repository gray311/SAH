type: tool
name: edit_solution
description: 'Modify Hyperparameters. For best results: set num_restarts=5, num_intervals=800, num_steps=50000.
  Use generate_extra_restarts to get diverse patterns.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
