type: tool
name: generate_extra_restarts
description: 'Generate 10 diverse initializations for Erdos optimization. Extends seed''s 15 patterns
  with additional construction types.


  Each candidate has: h (latent), integral (should be ~1.0), c5_bound (analytical, no training).


  Pattern types: piecewise-constant, piecewise-linear, random-blocks, delta-bumps, checkerboard, sparse-Golomb,
  extended-tri-modal, plateau, valley, and mixed patterns.


  Usage: Call once with temperature=0.8. Merge with seed''s best 15, then run optimizer with num_restarts=5.
  Only evaluate candidates with c5_bound < 0.365.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.8
    num_patterns:
      type: integer
      default: 10
