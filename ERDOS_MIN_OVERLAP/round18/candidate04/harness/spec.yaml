schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem: find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

  Constraint: integral(h) = 1 exactly.

  Current best: C5 <= 0.38092303510845016 (combined_score > 1 means improvement).

  CRITICAL: The seed optimizer trains for 59000 steps and uses sophisticated patterns.

  STRATEGY:

  1. EDIT hyperparameters or add new patterns to _get_best_initialization

  2. CALL evaluate_solution ONCE per edited candidate (it runs the full optimizer)

  3. Test 1-3 variations, pick the best. If combined_score > 1, call finish.

  Key: Run the actual optimizer. Do NOT skip it with fake candidates.
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK to change hyperparameters or code structure.

    Hyperparameters:
    - num_intervals: 800-1600
    - base_learning_rate: 0.001-0.02
    - num_steps: 50000-150000
    - penalty_strength: 20-100

    Code edits: Add new patterns to _get_best_initialization (where clauses, piecewise functions).
  evaluate_solution: |
    Run full 59000-step JAX+optax optimization. Returns combined_score = 0.38092303510845016 / c5_bound.

    Each call runs ONE optimization (3 restarts internally). Budget: 30 evals.

    After editing, CALL evaluate_solution.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 50
  max_tokens: 16000
agent:
  max_iterations: 25
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools: []
new_skills: []
new_middlewares: []
remove_tools:
  - probe_solution
