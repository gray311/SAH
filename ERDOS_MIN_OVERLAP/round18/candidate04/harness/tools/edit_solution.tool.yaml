type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters or code structure.


  Hyperparameters:

  - num_intervals: 800-1600

  - base_learning_rate: 0.001-0.02

  - num_steps: 50000-150000

  - penalty_strength: 20-100


  Code edits: Add new patterns to _get_best_initialization (where clauses, piecewise functions).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
