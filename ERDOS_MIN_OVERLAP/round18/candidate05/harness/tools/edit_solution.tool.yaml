type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to modify:

  - Hyperparameters: change ONE parameter at a time

  - _get_best_initialization: add 1-2 new patterns after existing 15

  - Latent initialization: multiply normal samples by scale factor


  Each edit gets 1 eval. Only keep edits that improve combined_score.


  Common productive edits:

  - num_intervals: 800->1000->1200 (higher resolution)

  - num_steps: 100000->80000 or 100000->150000

  - penalty_strength: 60->80->100->150

  - num_restarts: 3->5->8->10

  - Add pattern 16 (dense Golomb)

  - Add pattern 17 (two blobs)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
