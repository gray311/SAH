type: tool
name: jump_to_pattern
description: 'Generate a VALID step function with a specific structural pattern.

  Integral is guaranteed to be 1.0 by construction (heights are normalized).


  Structures: two-level, three-level, golomb, sinusoidal


  Returns: h (array), c5_bound (analytical score), integral (should be 1.0).'
input_schema:
  type: object
  properties:
    structure:
      type: string
      enum:
      - two-level
      - three-level
      - golomb
      - sinusoidal
      default: two-level
    seed:
      type: integer
      default: 0
