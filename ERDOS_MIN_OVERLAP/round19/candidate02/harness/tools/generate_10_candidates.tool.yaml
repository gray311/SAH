type: tool
name: generate_10_candidates
description: 'Generate 10 diverse candidates: random normals, uniform, sinusoidal, threshold,

  Golomb ruler, bipartite, tri-modal, wave patterns with varying seeds.

  Each has precomputed integral and c5_bound. Filter by c5 < 0.37.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.8
