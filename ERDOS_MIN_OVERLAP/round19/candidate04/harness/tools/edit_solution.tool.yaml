type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK. SHORTEN training (num_steps=3000-5000), reduce penalty (10-20), try
  num_intervals=50-200, or change optimizer.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
