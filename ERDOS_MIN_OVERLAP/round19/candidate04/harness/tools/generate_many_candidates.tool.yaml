type: tool
name: generate_many_candidates
description: 'Generate 12 diverse pattern-based initializations for Erdos optimization.

  Patterns include: random normals, uniform, sinusoidal, threshold patterns,

  Golomb ruler, bipartite, tri-modal, and variations with different seeds.


  Each candidate has precomputed integral and c5_bound (analytical, no training).


  Call once per batch. Filter candidates with c5_bound < 0.36 for full evaluation.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.7
