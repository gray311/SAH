type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to add new patterns to _get_best_initialization.


  To add a pattern, insert a new pattern block after the last existing pattern (Pattern 14).

  Use the example pattern template above, changing the center value.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
