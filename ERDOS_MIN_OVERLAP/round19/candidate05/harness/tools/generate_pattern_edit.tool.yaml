type: tool
name: generate_pattern_edit
description: 'Generate a Python code snippet to insert into _get_best_initialization.

  The snippet implements a new pattern variation for the Erdos optimizer.

  Call with pattern_type and center, then use output with edit_solution.'
input_schema:
  type: object
  properties:
    pattern_type:
      type: string
      default: concentrated_peak
    center:
      type: number
      default: 0.5
