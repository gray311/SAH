type: tool
name: edit_solution
description: 'Do NOT use edit_solution for gradient descent optimization.

  The seed optimizer''s gradient descent STALLS near the current solution.


  Instead, generate entirely NEW candidates using generate_structured_patterns.

  Each call produces a COMPLETE candidate with a different analytical pattern.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
