type: tool
name: generate_structured_patterns
description: "Generate 8 diverse, analytical pattern-based initializations for Erdos optimization.\nThese\
  \ patterns are STANDALONE constructions from combinatorial design theory - NOT gradients\nof current\
  \ solutions. This allows exploration of completely different regions of the search space.\n\nPattern\
  \ types: Golomb ruler (5-7 marks), Bipartite split, Tri-modal (3 peaks), \nBi-modal (2 peaks), Uniform\
  \ flat, Step function, Sparse peaks, Sinusoidal + offset.\n\nEach candidate has precomputed integral\
  \ and c5_bound (analytical).\n\nCall with a specific pattern type, or use the default (golomb_5) for\
  \ first batch."
input_schema:
  type: object
  properties:
    pattern_type:
      type: string
      enum:
      - golomb_5
      - golomb_7
      - bipartite
      - tri_modal
      - bi_modal
      - sparse_4
      - uniform
      - step
      - sinusoidal
      - piecewise_5
      - threshold_3
      - multi_scale
      default: golomb_5
