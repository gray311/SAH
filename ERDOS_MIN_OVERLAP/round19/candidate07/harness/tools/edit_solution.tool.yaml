type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change ONE hyperparameter at a time.


  Recommended changes (change only ONE field per edit):

  - num_intervals: [400, 800, 1200, 1600, 2000] - affects resolution

  - base_learning_rate: [0.001, 0.005, 0.01, 0.02, 0.05] - affects convergence speed

  - penalty_strength: [10.0, 30.0, 50.0, 80.0, 100.0] - affects constraint satisfaction

  - num_steps: [30000, 59000, 90000, 120000] - affects optimization depth

  - num_restarts: [1, 2] - save budget


  Change only ONE field at a time. Keep all other fields at seed defaults.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
