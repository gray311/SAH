type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to completely REPLACE ErdosOptimizer with a step-function generator.

  Keep the run() and _run_one_candidate() structure, but change the candidate generation to be combinatorial:
  - Generate step functions with N=4,6,8,10,12,16 - Use rational breakpoints: e.g., [0, 2/5, 4/5, 1, 6/5,
  8/5, 2] - Assign binary/ternary levels, scale to integral=1

  Do NOT change training loop hyperparameters - the seed optimizer is already well-tuned for smooth curves.
  We need different REPRESENTATION.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
