type: tool
name: generate_step_candidates
description: 'Generate 12 step-function candidates with diverse breakpoint structures and level patterns.

  Each candidate has precomputed analytical c5_bound and is scaled to integral=1.

  Use for rapid screening before full evaluation.'
input_schema:
  type: object
  properties:
    target_c5:
      type: number
      default: 0.36
