type: tool
name: score_pattern
description: 'Compute approximate c5_bound for a short pattern description WITHOUT training.

  Parses pattern keywords (bipartite, tri-modal, golomb) and generates an h(x).

  Returns integral, c5_bound_approx, and validity status.

  Use this for fast pattern exploration before full evaluation.'
input_schema:
  type: object
  properties:
    pattern_type:
      type: string
      description: One of bipartite, tri_modal, golomb, gaussian
    peak_positions:
      type: array
      items:
        type: number
      description: Peak center positions (optional, auto-generated if not provided)
    num_peaks:
      type: integer
      default: 2
      description: Number of peaks (1-5)
