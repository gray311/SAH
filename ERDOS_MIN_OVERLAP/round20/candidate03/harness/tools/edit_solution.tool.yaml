type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK. For single-candidate testing: set num_restarts=1 and change ONE hyperparameter
  at a time.

  For the seed baseline: keep num_restarts=3, seed_start=0, and all original values.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
