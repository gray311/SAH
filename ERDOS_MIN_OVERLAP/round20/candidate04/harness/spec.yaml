schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem: find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  Constraint: integral(h) = 1 exactly.
  
  Current best: C5 <= 0.38092303510845016.
  
  Goal: Beat seed score (c5_bound < 0.380923).
  
  CRITICAL: The seed optimizer already has 15 pattern variations. It STUCK at seed score.
  Don't just add MORE pattern variations - they won't help.
  
  NEW STRATEGY: Edit the optimizer's core algorithm structure, not just patterns.
  
  1. First: Use probe_solution to test SMALL changes (one or two hyperparam changes)
     to confirm the evaluator responds to edits.
  
  2. Then: Try completely different optimization approaches:
     - Change optimizer type (Adam -> SGD, or different learning rate schedules)
     - Change discretization (fewer intervals, different domain handling)
     - Change the C5 computation method (use convolution theorem differently)
     - Add explicit constraint enforcement during optimization
  
  3. Don't evaluate all at once - use 1-2 evals per iteration, learn from feedback.
  
  4. If edits fail, try a MINIMAL edit: change only num_intervals or learning_rate.
  
  5. Track what changes work (probe) before committing to full evaluations.
  
  Key: Structural algorithm changes, not pattern enumeration.
skill_description: |
  Edit optimizer algorithm structure. Test small changes with probe_solution. Focus on algorithm-level changes (optimizer type, learning schedule, discretization), not pattern variations.
skill_body: |
  # Structural Algorithm Editing Strategy
  
  ## Problem
  The seed optimizer uses gradient descent with 15 pattern variations but STUCK at seed score.
  Adding MORE pattern variations won't help - they all use the same flawed optimization approach.
  
  ## Solution: Structural Algorithm Changes
  
  ### What to Edit
  
  1. Hyperparameters: Test each one individually with probe:
     - num_intervals: 800 -> 400, 1600 (coarser/finer)
     - base_learning_rate: 0.0062 -> 0.01, 0.001, 0.05
     - penalty_strength: 61.0 -> 100.0, 10.0, 200.0
     - num_restarts: 3 -> 1, 5, 10
  
  2. Optimizer changes: Edit the optimizer class to try:
     - Different optimization algorithms
     - Different initialization strategies
     - Constraint enforcement methods
  
  3. Architecture changes: 
     - Change how h is constructed from latent
     - Modify the correlation computation
     - Add preprocessing/postprocessing steps
  
  ### Workflow
  
  1. PROBE one hyperparameter change (e.g., num_intervals=1600)
     - Use probe_solution to test
     - Check if c5_bound changes from seed value
  
  2. If probe shows improvement: EDIT the program to make that change permanent
  
  3. If probe shows no change: EDIT a different hyperparameter
  
  4. If all hyperparams fail: EDIT the optimizer class structure
  
  5. After successful edit: EVALUATE to confirm improvement
  
  6. Repeat with next change
  
  ## Why This Works
  
  - probe_solution is fast (~500 intervals), lets us iterate quickly
  - Structural changes (algorithm, not patterns) can genuinely improve results
  - One change at a time isolates what works
  - Don't waste evals on unproven changes
  
  ## Expected Flow
  
  1. Probe: num_intervals=1600 -> c5=0.379 -> EDIT (PERMANENT)
  2. Probe: base_learning_rate=0.01 -> c5=0.378 -> EDIT
  3. Evaluate solution with both changes -> score > 1.0
  4. If successful, submit
  
  ## Tools
  
  - probe_solution: Fast test of single change
  - edit_solution: Make change permanent
  - evaluate_solution: Full evaluation only after edits confirm improvement
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK to make ONE structural algorithm change at a time.
    
    For hyperparams: Change num_intervals, base_learning_rate, penalty_strength, or num_restarts.
    
    For algorithms: Change optimizer type, modify initialization, add constraints.
    
    Rule: Make ONE change per edit, not multiple. Test with probe first.
  evaluate_solution: |
    Run full optimization on the EDITED program. Returns combined_score.
    
    Higher is better. Combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record!).
    
    Use only AFTER probing shows the change is beneficial.
  probe_solution: |
    Fast approximate evaluation using 500 intervals. ~10s runtime.
    
    Use to TEST single changes BEFORE making permanent edits.
    
    Check if c5_bound decreases (improves) from seed value 0.380923.
    
    Separate probe budget available - does not count against evals.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
    Or when you've exhausted changes with no improvement.
sampling:
  temperature: 0.3
  top_p: 0.95
  top_k: 10
  max_tokens: 12000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 5000
