type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to make ONE structural algorithm change at a time.


  For hyperparams: Change num_intervals, base_learning_rate, penalty_strength, or num_restarts.


  For algorithms: Change optimizer type, modify initialization, add constraints.


  Rule: Make ONE change per edit, not multiple. Test with probe first.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
