type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to replace the training loop with analytical scoring.


  Critical change: Replace the 59000-step optimizer with direct FFT-based c5 computation.


  The edit should:

  - Remove or comment out the _train_step and training loop

  - Use the existing _compute_c5_bound method (already FFT-based)

  - Generate candidates using pattern-based initialization only

  - Score candidates analytically before any training'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
