type: tool
name: gen_candidates
description: 'Generate 10 diverse structural patterns for Erdos optimization. Each pattern is:

  - Structurally distinct (Golomb ruler, bipartite, tri-modal, threshold, wave, etc.)

  - Pre-computed with FFT-based analytical c5_bound (instant, no training)

  - Pre-normalized to have integral ~ 1.0


  Patterns include:

  - Golomb ruler (optimal spacing)

  - Bipartite (two separated regions)

  - Tri-modal (three narrow peaks)

  - Threshold patterns (step functions at different positions)

  - Sinusoidal/wave patterns

  - Random normal with different seeds


  Call once per iteration. Filter candidates with c5_bound < 0.35 for full evaluation.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.9
    num_candidates:
      type: number
      default: 10
