schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem: find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  Constraint: integral(h) = 1 exactly.
  
  Current best: C5 <= 0.38092303510845016.
  
  Goal: Beat seed score of 0.999968 (c5_bound < 0.380923).
  
  Strategy:
  
  1. EDIT the seed program's hyperparameters: try REDUCED num_intervals (200-400) for faster evaluation, LOW penalty_strength (10-20) for easier constraint satisfaction, and INCREASED num_steps (80000-120000) for better optimization.
  
  2. EDIT to add GRID SEARCH: systematically vary hyperparameters across multiple restarts. Test combinations of: num_intervals=[200,400], penalty_strength=[10,30,61,100], num_steps=[59000,80000,120000].
  
  3. For each hyperparameter set, CALL generate_candidates(3) to get 3 diverse initializations with integral=1.0.
  
  4. CALL evaluate_solution on the BEST candidate from each hyperparameter set.
  
  5. Use seed's existing pattern variations (15 patterns) - don't change them, just tune hyperparameters around them.
  
  6. Key insight: The seed optimizer already works well - we need to FIND BETTER HYPERPARAMETERS, not invent new patterns.
  
  7. Budget: Use 10-15 evals for hyperparameter grid search.
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK to change hyperparameters.
    
    To reduce intervals: set num_intervals=200 or 400
    To adjust penalty: set penalty_strength=10 or 30
    To increase steps: set num_steps=80000 or 120000
    
    Example edit for (intervals=400, penalty=30, steps=80000):
    Replace num_intervals: int = 800 with num_intervals: int = 400
    Replace penalty_strength: float = 61.0 with penalty_strength: float = 30.0
    Replace num_steps: int = 59000 with num_steps: int = 80000
  evaluate_solution: |
    Run full optimization with current hyperparameters. Returns combined_score = 0.38092303510845016 / c5_bound.
    Higher is better. combined_score > 1.0 means a new record.
  probe_solution: |
    Fast approximate evaluation (500 intervals, 500 intervals, analytical c5). Uses probe budget.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools:
  - name: generate_candidates
    description: |
      Generate 3 diverse pattern-based initializations for Erdos optimization.
      Each candidate has h (pre-sigmoided, integral=1.0) and precomputed c5_bound.
      
      Call with num_candidates=3. Candidates will be valid program edits to the EVOLVE-BLOCK.
      
      Patterns used: Golomb ruler, bipartite, tri-modal, and 3 random seeds.
    input_schema:
      type: object
      properties:
        num_candidates:
          type: integer
          default: 3
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          N = 800
          domain = 2.0
          dx = domain / N
          
          def compute_c5(h):
              j_val = 1.0 - h
              h_padded = np.pad(h, (0, N))
              j_padded = np.pad(j_val, (0, N))
              corr_fft = np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))
              correlation = np.fft.ifft(corr_fft).real
              return np.max(correlation * dx)
          
          def normalize(h):
              integral = np.sum(h) * dx
              return h / integral
          
          candidates = []
          
          # Pattern: Golomb ruler with fixed marks
          np.random.seed(42)
          marks = [0.0, 0.4, 0.8, 1.2, 1.6]
          golomb_h = np.zeros(N)
          for m in marks:
              golomb_h += 8.0 * np.exp(-((np.linspace(0, 2, N) - m) / 0.15)**2)
          golomb_h = normalize(np.clip(golomb_h, 0.001, 5.0))
          c5 = compute_c5(golomb_h)
          candidates.append({"h": golomb_h.tolist(), "integral": float(np.sum(golomb_h) * dx),
                           "c5_bound": float(c5), "pattern_type": "golomb_fixed"})
          
          # Pattern: Bipartite with random split
          np.random.seed(123)
          x = np.linspace(0, 2, N)
          a = 0.5 + np.random.rand() * 0.2
          bipartite_h = np.where(x < a, 3.0, -3.0)
          bipartite_h = bipartite_h + np.random.normal(0, 0.3, N)
          bipartite_h = normalize(np.clip(1.0 / (1.0 + np.exp(-bipartite_h)), 0.001, 1.0))
          c5 = compute_c5(bipartite_h)
          candidates.append({"h": bipartite_h.tolist(), "integral": float(np.sum(bipartite_h) * dx),
                           "c5_bound": float(c5), "pattern_type": "bipartite_rand"})
          
          # Pattern: Tri-modal with random peaks
          np.random.seed(456)
          x = np.linspace(0, 2, N)
          peaks = [0.4 + np.random.rand()*0.1, 1.0 + np.random.rand()*0.05, 1.6 + np.random.rand()*0.1]
          peaks = [max(0.1, min(1.9, p)) for p in peaks]
          tri_h = np.zeros(N)
          for p in peaks:
              tri_h += 6.0 * np.exp(-((x - p) / 0.15)**2)
          tri_h = normalize(np.clip(tri_h, 0.001, 5.0))
          c5 = compute_c5(tri_h)
          candidates.append({"h": tri_h.tolist(), "integral": float(np.sum(tri_h) * dx),
                           "c5_bound": float(c5), "pattern_type": "tri_modal_rand"})
          
          # Pattern: Random seed 1
          np.random.seed(789)
          latent = np.random.normal(0, 1.0, N)
          h = normalize(np.clip(1.0 / (1.0 + np.exp(-latent)), 0.001, 1.0))
          c5 = compute_c5(h)
          candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                           "c5_bound": float(c5), "pattern_type": "random_seed1"})
          
          return {"candidates": candidates, "num_candidates": len(candidates)}
