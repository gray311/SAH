type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters.


  To reduce intervals: set num_intervals=200 or 400

  To adjust penalty: set penalty_strength=10 or 30

  To increase steps: set num_steps=80000 or 120000


  Example edit for (intervals=400, penalty=30, steps=80000):

  Replace num_intervals: int = 800 with num_intervals: int = 400

  Replace penalty_strength: float = 61.0 with penalty_strength: float = 30.0

  Replace num_steps: int = 59000 with num_steps: int = 80000'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
