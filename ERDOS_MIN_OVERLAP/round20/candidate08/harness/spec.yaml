schema: h2spec/1.0
system_prompt: 'Erdos minimum overlap problem (C5): Find step function h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

CONSTRAINT: integral(h) = 1 exactly.

Current best bound: C5 <= 0.38092303510845016 (combined_score = 1.0)
GOAL: Beat this with combined_score > 1.0.

STRATEGY - HYPERPARAMETER SEARCH:

The seed optimizer trains for 59000 steps with 3 restarts. We need to explore:
1. Fewer restarts (1-2) to budget more steps per restart
2. Different penalty_strength (5-200) - higher penalties push toward [0,1] constraints
3. Different num_intervals (200-2000) - resolution affects accuracy
4. Different base_learning_rate (0.001-0.02) - step size tuning

METHOD:
1. Edit EVOLVE-BLOCK to change ONE hyperparameter at a time
2. Run single evaluation (num_restarts=1) for each edit
3. Track best combined_score
4. Use 2-3 evals per iteration, ~10-15 iterations to exhaust budget

EDIT PRIORITY ORDER:
- First: Change num_restarts to 1 (saves budget for longer training)
- Second: Increase penalty_strength (forces valid [0,1] constraints)
- Third: Adjust base_learning_rate
- Fourth: Change num_intervals

IMPORTANT: Always verify edits compile before evaluating. Use edit_solution to make focused single-parameter changes.'
skill_description: Hyperparameter search for Erdos C5 optimization. Edit seed program to test different configurations with single evaluations.
skill_body: '# Hyperparameter Search Strategy\n\n## Understanding the Problem\n\nThe seed optimizer uses 59000 training steps with 3 restarts. With only 30 eval budget, we cannot train many candidates.\n\n## Strategy: Systematic Hyperparameter Search\n\n### Key Hypotheses to Test:\n\n1. **Fewer restarts, longer training**: num_restarts=1 allows full 59k steps per candidate. With 3 restarts, effective budget is ~20k steps.\n\n2. **Higher penalty_strength**: Forces h(x) to [0,1] range. Seed uses 61.0. Try 100-500.\n\n3. **Learning rate tuning**: base_learning_rate=0.0062 may be suboptimal. Try 0.01-0.03.\n\n4. **Resolution (num_intervals)**: 800 may be too coarse. Try 1600 for higher precision.\n\n## Workflow\n\n1. CALL edit_solution to change ONE hyperparameter\n2. Set num_restarts=1, seed_start=0 (single evaluation)\n3. CALL evaluate_solution and record combined_score\n4. Compare to current best, keep improvements\n5. Repeat with different parameters\n\n## Editing Rules\n\n- Change only ONE field per edit\n- Keep other critical fields from seed (num_steps=59000, domain=[0,2])\n- Ensure integral constraint handling is preserved\n\n## Expected Outcomes\n\nBy exhaustively searching hyperparameter space, we should find configurations that beat the seed score. The seed may be stuck in local optimum from default hyperparameters.'
tool_descriptions:
  edit_solution: 'Modify the EVOLVE-BLOCK Hyperparameters dataclass. Change ONE field at a time.\n\nFormat: Update only the desired field value in the dataclass.\n\nExample: Change num_restarts from 3 to 1:\n```python\nnum_restarts: int = 1\n```\n\nThen call evaluate_solution with num_restarts=1 for single evaluation.'
  evaluate_solution: 'Run the optimizer on current EVOLVE-BLOCK code. Returns combined_score = 0.38092303510845016 / c5_bound.\n\nHigher score = better. Score > 1.0 means c5_bound < 0.380923 (new record).'
  probe_solution: 'Approximate evaluation (faster but approximate). Use for quick ranking of similar candidates.'
  finish: 'Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).'
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools: []
remove_tools: []
new_skills: []
