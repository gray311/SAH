type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK Hyperparameters dataclass. Change ONE field at a time.\n\nFormat:
  Update only the desired field value in the dataclass.\n\nExample: Change num_restarts from 3 to 1:\n```python\nnum_restarts:
  int = 1\n```\n\nThen call evaluate_solution with num_restarts=1 for single evaluation.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
