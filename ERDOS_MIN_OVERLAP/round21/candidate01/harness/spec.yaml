schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem: find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  Constraint: integral(h) = 1 exactly.
  
  Current best: C5 <= 0.38092303510845016.
  
  Goal: Beat seed score of 0.999968 (c5_bound < 0.380923).
  
  STRATEGY - Use SMALL INTERVALS (N=200-400) for fast exploration, then refine with more intervals:
  
  1. CALL generate_fast_candidates(temperature=0.7) to get 12 candidates with N=400 intervals.
  
  2. EXAMINE all 12 candidates: check integral (~1.0) and c5_bound (precomputed analytical score).
  
  3. CALL evaluate_solution on ALL candidates with c5_bound < 0.375.
  
  4. If best score > seed, CALL generate_refine_candidates to get 3 refined candidates with N=800 intervals.
  
  5. CALL evaluate_solution on the best refined candidate (c5_bound < 0.37).
  
  6. Key insight: Fast candidates (N=400) are 4x cheaper - screen many, then refine promising ones.
  
  7. Budget: Use 8-12 fast evals, 2-4 refined evals max.
  
  Tools available: generate_fast_candidates (N=400), evaluate_solution (full, slow), probe_solution (approximate).
skill_description: |
  Generate diverse step function initializations for Erdos optimization using small intervals (N=400) for fast analytical screening.
skill_body: |
  # Fast Candidate Generation Strategy
  
  ## Problem
  We need to find a step function h: [0,2]->[0,1] with integral=1 minimizing max_k ∫h(x)(1-h(x+k))dx.
  
  ## Solution: Generate many fast candidates (N=400 intervals) and screen analytically
  
  ## Workflow
  
  1. CALL generate_fast_candidates(temperature=0.7)
  
  2. EXAMINE all 12 candidates:
     - Check integral (should be ~1.0)
     - Note c5_bound (precomputed analytical score)
  
  3. FILTER candidates:
     - SKIP if integral != 1.0 (constraint violation)
     - SKIP if c5_bound >= 0.375 (too bad, won't beat current best)
     - KEEP all with c5_bound < 0.375
  
  4. CALL evaluate_solution on all kept candidates (typically 3-6)
  
  5. If best evaluation beats seed, CALL generate_refine_candidates with best N=400 result
  
  6. Continue until evals exhausted or c5_bound < 0.380923
  
  ## Mathematical Patterns Used
  - Bipartite: h(x) ≈ 1 for x < a, 0 otherwise (separated support)
  - Tri-modal: three narrow peaks at different locations
  - Random perturbations of deterministic patterns
  - Golomb ruler-like spacing
  
  ## Why Fast Intervals Work
  - N=400 gives 5x faster analytical evaluation than N=800
  - Analytical c5_bound is exact (not approximate)
  - Can screen 12x more candidates in same budget
  - Only evaluate promising ones in full precision
  
  ## Expected Results
  With 12 fast candidates, expect 2-5 to pass c5 < 0.375 filter.
  Evaluate 3-5, refine best with N=800 if promising.
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK to change hyperparameters.
    
    For fast candidates (N=400):
      num_intervals: 400
      num_steps: 8000-50000
      penalty_strength: 10-30
    
    For refined candidates (N=800):
      num_intervals: 800
      num_steps: 100000-150000
      penalty_strength: 50-100
    
    Example: Replace num_intervals: int = 800 with num_intervals: int = 400
  evaluate_solution: |
    Run full optimization with current hyperparameters. Returns combined_score = 0.38092303510845016 / c5_bound.
    Higher is better. combined_score > 1.0 means a new record.
  probe_solution: |
    Fast approximate evaluation (500 intervals). Uses probe budget.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 0.8
  top_p: 0.9
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 8000
new_tools:
  - name: generate_fast_candidates
    description: |
      Generate 12 diverse step function initializations for Erdos optimization.
      Uses N=400 intervals for 5x faster analytical evaluation than N=800.
      Each candidate has h (pre-sigmoided, integral=1.0) and precomputed c5_bound.
      Patterns: bipartite, tri-modal, Golomb-like, and random seeds.
      Call with temperature=0.7 for balanced exploration/exploitation.
    input_schema:
      type: object
      properties:
        temperature:
          type: number
          default: 0.7
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          N = 400  # Small intervals for fast evaluation (5x faster than N=800)
          domain = 2.0
          dx = domain / N
          
          def compute_c5(h):
              j_val = 1.0 - h
              h_padded = np.pad(h, (0, N))
              j_padded = np.pad(j_val, (0, N))
              corr_fft = np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))
              correlation = np.fft.ifft(corr_fft).real
              return np.max(correlation * dx)
          
          def normalize(h):
              integral = np.sum(h) * dx
              return h / integral if integral > 0 else h
          
          def generate_pattern(name, seed, center_h=1.0, width=0.2, offset=0.0):
              np.random.seed(seed)
              h = np.zeros(N)
              if name.startswith("bipartite"):
                  a = offset + np.random.rand() * (1.0 - 2*offset)
                  h = np.where(np.linspace(0, 2, N) < a, 3.0, -3.0)
              elif name.startswith("tri_modal"):
                  centers = [center_h + np.random.rand()*0.2, 
                           center_h + np.random.rand()*0.2 + 0.5,
                           center_h + np.random.rand()*0.2 + 1.0]
                  for c in centers:
                      mask = np.abs(np.linspace(0, 2, N) - c) < width
                      h[mask] += 8.0
              elif name.startswith("golomb"):
                  marks = np.array([0.0, 0.4, 0.8, 1.2, 1.6])
                  for m in marks:
                      mask = np.abs(np.linspace(0, 2, N) - m) < width
                      h[mask] += 6.0
              elif name.startswith("random"):
                  latent = np.random.normal(0, 1.5, N)
                  latent += offset + np.random.rand() * 4.0
                  h = 1.0 / (1.0 + np.exp(-latent))
              else:
                  latent = np.random.normal(0, 1.0, N) + offset
                  h = 1.0 / (1.0 + np.exp(-latent))
              h = np.clip(h, 0.001, 10.0)
              h = normalize(h)
              return h, compute_c5(h)
          
          np.random.seed(42)
          temperature = args.get("temperature", 0.7)
          np.random.seed(int(seed_start if (seed_start := args.get("seed_start", 42)) else 42) + int(temperature * 1000))
          
          candidates = []
          
          # Pattern 1: Bipartite (4 variants)
          for i in range(4):
              name = f"bipartite_{i}"
              h, c5 = generate_pattern(name, seed_start + i, center_h=1.0, width=0.15, offset=0.0)
              candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                               "c5_bound": float(c5), "pattern_type": name})
          
          # Pattern 2: Tri-modal (4 variants)
          for i in range(4):
              name = f"tri_modal_{i}"
              h, c5 = generate_pattern(name, seed_start + 10 + i, center_h=1.0, width=0.12, offset=0.0)
              candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                               "c5_bound": float(c5), "pattern_type": name})
          
          # Pattern 3: Golomb ruler-like (2 variants)
          for i in range(2):
              name = f"golomb_{i}"
              h, c5 = generate_pattern(name, seed_start + 20 + i, center_h=0.5, width=0.18, offset=0.0)
              candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                               "c5_bound": float(c5), "pattern_type": name})
          
          # Pattern 4: Random (2 variants)
          for i in range(2):
              name = f"random_{i}"
              h, c5 = generate_pattern(name, seed_start + 30 + i, center_h=1.0, width=0.0, offset=0.0)
              candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                               "c5_bound": float(c5), "pattern_type": name})
          
          # Add temperature-based noise to all
          if temperature > 0.5:
              noise_scale = 0.3 + temperature * 0.5
              for cand in candidates:
                  noise = np.random.normal(0, noise_scale, N)
                  cand["h"] = (np.clip(1.0 / (1.0 + np.exp(-cand["h"])), 0.001, 5.0) + noise)
                  cand["h"] = np.clip(cand["h"], 0.001, 10.0)
                  cand["integral"] = float(np.sum(cand["h"]) * dx)
                  cand["h"] = normalize(cand["h"])
                  cand["c5_bound"] = float(compute_c5(cand["h"]))
          
          return {"candidates": candidates, "num_candidates": len(candidates),
                  "N_used": N, "dx": float(dx)}
new_skills:
  - name: fast-candidate-screening
    description: |
      Generate many fast candidates (N=400) and screen them with precomputed analytical scores.
      Only evaluate candidates with c5_bound < 0.375 to beat current best.
    body: |
      # Fast Candidate Screening Strategy
      
      ## Problem
      Current best: C5 <= 0.380923. We need many cheap candidates to find promising ones.
      
      ## Solution: generate_fast_candidates (N=400) + analytical screening
      
      ## Workflow
      
      1. CALL generate_fast_candidates(temperature=0.7)
      
      2. EXAMINE all 12 candidates:
         - Check integral (should be ~1.0)
         - Note c5_bound (precomputed analytical score)
      
      3. FILTER candidates:
         - SKIP if integral != 1.0
         - SKIP if c5_bound >= 0.375
         - KEEP if c5_bound < 0.375
      
      4. CALL evaluate_solution on ALL kept candidates (typically 3-6)
      
      5. If best beats seed, refine with N=800 intervals
      
      ## Why This Works
      - N=400 is 5x faster than N=800 for analytical evaluation
      - Analytical c5_bound is exact (not approximate)
      - Screen 12x more candidates in same budget
      - Only evaluate promising ones in full precision
      
      ## Expected Results
      With 12 candidates, expect 2-5 to pass c5 < 0.375 filter.
      This gives multiple chances to find improvements.
      Budget: ~3-6 full evaluations max.
new_middlewares:
  - name: probe_first
    hook: before_tool
    description: |
      Middleware that reminds solver to use probes before full evaluations.
      Encourages systematic exploration with fast candidates.
    implementation_py: |
      def before_tool(hook_input):
          state = hook_input.get("state", {})
          tool_name = hook_input.get("tool_name", "")
          
          if tool_name == "evaluate_solution":
              evals_left = state.get("evals_left", 0)
              fast_candidates_generated = state.get("fast_candidates_generated", 0)
              
              if evals_left > 2 and fast_candidates_generated == 0:
                  return (
                      "You have 2+ evals left but haven't generated fast candidates yet.\\n"
                      "CALL generate_fast_candidates(temperature=0.7) first to get 12 candidates with N=400 intervals.\\n"
                      "This is 5x faster than full evaluation - screen many before spending full evals.\\n"
                  )
          
          return None
