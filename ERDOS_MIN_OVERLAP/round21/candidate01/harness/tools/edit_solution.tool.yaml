type: tool
name: edit_solution
description: "Modify EVOLVE-BLOCK to change hyperparameters.\n\nFor fast candidates (N=400):\n  num_intervals:\
  \ 400\n  num_steps: 8000-50000\n  penalty_strength: 10-30\n\nFor refined candidates (N=800):\n  num_intervals:\
  \ 800\n  num_steps: 100000-150000\n  penalty_strength: 50-100\n\nExample: Replace num_intervals: int\
  \ = 800 with num_intervals: int = 400"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
