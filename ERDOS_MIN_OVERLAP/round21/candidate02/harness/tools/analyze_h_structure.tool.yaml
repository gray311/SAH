type: tool
name: analyze_h_structure
description: 'Quick prototype tool. Runs 10-step SGD on 50-interval grid to generate a candidate h.

  Computes analytical c5 bound (no training, no constraint penalty). Fast (~3-5s).

  Use this to screen many structures before expensive full eval.

  Only proceed to evaluate_solution if c5_bound < 0.375.'
input_schema:
  type: object
  properties:
    max_c5_threshold:
      type: number
      default: 0.375
