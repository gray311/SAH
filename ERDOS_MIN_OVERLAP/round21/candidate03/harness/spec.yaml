schema: h2spec/1.0
system_prompt: 'Erdos minimum overlap problem: find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

  Constraint: integral(h) = 1 exactly.

  Current best: C5 <= 0.38092303510845016.

  Goal: Beat seed score of 0.999968 (c5_bound < 0.380923).

  Strategy:

  CRITICAL: The seed optimizer is FAILING because it uses num_intervals=800 (too many intervals) and penalty_strength=61 (too high). This makes the optimization extremely slow and hard to satisfy constraints.

  1. EDIT to REDUCE num_intervals to 100-200 (faster evaluation, coarser discretization).

  2. EDIT to REDUCE penalty_strength to 5-20 (easier constraint satisfaction).

  3. EDIT to INCREASE num_steps to 200000-500000 (more iterations for coarse grids).

  4. Use seed''s pattern variations but with the NEW hyperparameters.

  5. Call generate_candidates(3) with the edited hyperparameters, then evaluate_solution on each.

  6. Iterate: if no improvement, try different hyperparameter combinations (intervals=[100,150,200], penalty=[5,10,15,20], steps=[200000,300000,500000]).

  7. Budget: Use all 30 evals to exhaust the hyperparameter grid.'
skill_description: 'Generate diverse pattern-based initializations for Erdos optimization with precomputed analytical scores.'
skill_body: '# Pattern Initialization Strategy

## Problem
The seed optimizer has poor hyperparameters: 800 intervals (slow), penalty=61 (hard constraints).

## Solution: Use generate_candidates Tool

This tool generates 3 structurally diverse initializations with precomputed c5_bound:
- Golomb ruler pattern (optimal spacing)
- Bipartite pattern (separated support)  
- Tri-modal pattern (3 narrow peaks)

Each candidate has precomputed integral and c5_bound (no training needed).

## Workflow

1. CALL generate_candidates(temperature=0.7, num_candidates=3)

2. EXAMINE candidates:
   - Skip if integral != 1.0 (constraint violation)
   - Skip if c5_bound >= 0.375 (too bad)
   - Keep if c5_bound < 0.36

3. CALL evaluate_solution on ALL candidates with c5_bound < 0.36

4. If none pass, CALL generate_candidates again with temperature=0.9 for more diversity

## Why This Works
- 3 structural diversity: Golomb, Bipartite, Tri-modal
- Precomputed scores: no wasted evaluations
- Budget-efficient: 1 tool call, 2-3 evals max'
tool_descriptions:
  edit_solution: 'Modify EVOLVE-BLOCK hyperparameters for faster, easier optimization.

  REDUCE num_intervals: 800 -> 100 or 150 or 200

  REDUCE penalty_strength: 61 -> 5 or 10 or 15 or 20

  INCREASE num_steps: 59000 -> 200000 or 300000 or 500000

  Example edit for (intervals=150, penalty=10, steps=300000):

  Replace num_intervals: int = 800 with num_intervals: int = 150

  Replace penalty_strength: float = 61.0 with penalty_strength: float = 10.0

  Replace num_steps: int = 59000 with num_steps: int = 300000'
  evaluate_solution: 'Run full optimization with current hyperparameters. Returns combined_score = 0.38092303510845016 / c5_bound. Higher is better. combined_score > 1.0 means a new record.'
  probe_solution: 'Fast approximate evaluation (200 intervals, analytical c5). Uses probe budget.'
  finish: 'Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).'
sampling:
  temperature: 1.2
  top_p: 0.9
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 8000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares: []
