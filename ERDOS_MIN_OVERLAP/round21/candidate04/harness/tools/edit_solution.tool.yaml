type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters or optimizer architecture.\n\nTo propose step
  functions:\n- Edit _get_best_initialization to directly construct h (not latent + sigmoid)\n- Use jnp.where(x
  < threshold, 1.0, 0.0) for step functions\n- Ensure sum(h) * dx == 1.0 by dividing by integral\n\nTo
  change hyperparameters:\n- num_intervals: 200-400 (lower = faster, coarser discretization)\n- penalty_strength:
  10-20 (lighter constraint enforcement)\n- num_steps: 10000-50000 (SHORTER training, since we use simple
  patterns)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
