type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change initialization patterns or hyperparameters.


  To modify patterns: edit the _get_best_initialization method - change frequencies, amplitudes, thresholds,
  Golomb marks.


  Example - change Golomb marks:

  Replace:

  marks = jnp.array([0.0, 0.4, 0.8, 1.2, 1.6])

  With:

  marks = jnp.array([0.0, 0.5, 1.0, 1.5])


  Example - change wave pattern (Pattern 2):

  Replace:

  latent = latent + jnp.sin(2 * jnp.pi * x) * 2.0 + jnp.cos(4 * jnp.pi * x) * 1.0

  With:

  latent = latent + jnp.sin(3 * jnp.pi * x) * 2.5 + jnp.cos(5 * jnp.pi * x) * 1.5'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
