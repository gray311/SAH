schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem: Find a step function h: [0,2]->[0,1] that MINIMIZES max_k integral h(x)(1-h(x+k))dx.

  Constraint: integral(h) over [0,2] must equal exactly 1.0.

  Current best upper bound: C5 <= 0.38092303510845016 (seed score = 1.0).

  GOAL: Find h with c5_bound < 0.38092303510845016 to achieve combined_score > 1.0.

  STRATEGY: STRUCTURAL SEARCH, NOT HYPERPARAMETER TUNING

  The seed optimizer uses hyperparameters (800 intervals, 61 penalty, 120000 steps) that are already reasonable.
  DO NOT waste evaluations tuning these. Instead:

  1. CALL generate_structural_candidates(5) to get 5 fundamentally different function patterns:
     - Pattern A: Piecewise constant with 3 segments (threshold at 1/3, 2/3)
     - Pattern B: Two-block structure (low on [0,a], high on [a,2-a], low on [2-a,2])
     - Pattern C: Sinusoidal-modulated: h(x) = sigmoid(a*sin(2*pi*x) + b*sin(4*pi*x) + c)
     - Pattern D: Quadratic-modulated: h(x) = sigmoid(a*(x-1)^2 + b)
     - Pattern E: Multi-peak: h(x) = sigmoid(sum of 3-4 Gaussian bumps)

  2. For each pattern, CALL evaluate_solution ONCE to get the true score.

  3. ANALYZE which structural pattern performs best, then:
     - CALL edit_solution to modify that pattern (adjust threshold positions, number of peaks, frequencies)
     - CALL evaluate_solution again

  4. Key insight: Different structural patterns explore DIFFERENT regions of function space.
     The seed's 15 patterns are all variations of similar structures (sigmoid-modulated with noise).
     You need patterns with QUALITATIVELY DIFFERENT shapes.

  5. Budget: Use evals to test diverse structures, not to iterate on a single pattern.

  6. Finish when combined_score > 1.0 (c5_bound < 0.380923).
skill_description: |
  Generate fundamentally different structural patterns for the Erdos function.
  Patterns must have qualitatively different shapes: piecewise, sinusoidal, multi-peak, etc.
  This enables exploration of diverse regions of function space.
skill_body: |
  # Structural Diversity Strategy

  ## Problem
  The seed optimizer generates functions using sigmoid(modulation + noise). All 15 seed patterns
  are variations of this single family. We need to explore DIFFERENT function families.

  ## Solution: Structural Pattern Library

  Generate candidates from these fundamentally different structures:

  ### Pattern 1: Piecewise-Constant (3 blocks)
  h(x) = 0 for x in [0, 1/3], c for x in [1/3, 2/3], 0 for x in [2/3, 2]
  Normalize so integral = 1. This creates a "centered blob" function.

  ### Pattern 2: Two-Block with Offset
  h(x) = a for x in [0, a], b for x in [a, 2-a], a for x in [2-a, 2]
  Adjust a and the levels so integral = 1. Creates asymmetric coverage.

  ### Pattern 3: Sinusoidal (1 frequency)
  h(x) = sigmoid(A*sin(pi*x) + B) with A > 1 to create clear peaks/troughs.

  ### Pattern 4: Sinusoidal (2 frequencies)
  h(x) = sigmoid(A*sin(2*pi*x) + B*sin(4*pi*x) + C) - creates more complex oscillations.

  ### Pattern 5: Quadratic Bump
  h(x) = sigmoid(A*(x-1)^2 + B) - creates a single centered peak.

  ### Pattern 6: Multi-Gaussian
  h(x) = sigmoid(sum_{i=1..k} exp(-(x-xi)^2/sigma^2)) for k=3,4 peaks.

  ## Workflow

  1. CALL generate_structural_candidates(patterns=["piecewise3", "twoblock", "sin1freq", "sin2freq", "quadbump"])

  2. EXAMINE all 5 candidates:
     - Verify integral ≈ 1.0
     - Note the c5_bound (precomputed)

  3. CALL evaluate_solution on ALL candidates with integral ≈ 1.0 and c5_bound < 0.38

  4. If any achieve combined_score > 1.0, CALL finish immediately.

  5. If none beat seed, pick the BEST performer and CALL edit_solution to:
     - Vary the structural parameters (threshold positions, frequencies, amplitudes)
     - CALL evaluate_solution again

  6. Repeat steps 1-5 until budget exhausted or score > 1.0.

  ## Why This Works

  - Structural diversity: Each pattern family has different global shape properties
  - The seed's 15 patterns are all "sigmoid + modulation + noise" - you need to break this mold
  - Testing 5 diverse structures with 1 full eval each = 5 evals to find good directions
tool_descriptions:
  edit_solution: 'Modify the EVOLVE-BLOCK to change hyperparameters or the function generation code.

  To change hyperparameters:
    - Change num_intervals (default: 800, can reduce to 400 for faster evals)
    - Change penalty_strength (default: 61.0, can reduce to 20-30)
    - Change num_steps (default: 120000, can reduce to 60000-80000)

  To modify the function generator code:
    - Change threshold positions in piecewise patterns
    - Change frequencies in sinusoidal patterns
    - Change number of peaks in multi-peak patterns
    - Change Gaussian parameters (centers, widths)

  Example: Change from 3-peak to 4-peak function by modifying the number of Gaussians in the sum.'
  evaluate_solution: 'Run full optimization with current EVOLVE-BLOCK code.
  
  Returns combined_score = 0.38092303510845016 / c5_bound.
  
  combined_score > 1.0 means you beat the seed (c5_bound < 0.38092303510845016).'
  probe_solution: 'Fast approximate evaluation (subsampled data, ~10s vs minutes).
  
  Returns approximate combined_score. Not comparable to full scores.
  
  Use probe_solution to quickly rank many structural candidates before full evaluation.'
  finish: 'Call finish(summary) when combined_score > 1.0 (c5_bound < 0.38092303510845016).
  
  The summary should describe what structural pattern worked best.'
sampling:
  temperature: 1.5
  top_p: 0.9
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 10000
new_tools:
- name: generate_structural_candidates
  description: |
    Generate 5 fundamentally different structural patterns for the Erdos function.
    Patterns are qualitatively different: piecewise-constant, sinusoidal, multi-peak, etc.
    Each candidate has h (pre-sigmoided), integral (should be 1.0), and precomputed c5_bound.
    
    Patterns generated:
    1. Piecewise-constant with 3 segments (low-high-low)
    2. Two-block with offset (symmetric low-high-low)
    3. Single-frequency sinusoidal modulation
    4. Two-frequency sinusoidal modulation
    5. Single quadratic bump
    
    All candidates have integral pre-normalized to 1.0.
  input_schema:
    type: object
    properties:
      num_candidates:
        type: integer
        default: 5
  implementation_py: |
    def run(ctx, args):
        import numpy as np
        N = 800
        domain = 2.0
        dx = domain / N
        x = np.linspace(0, 2, N)
        
        def compute_c5(h):
            j_val = 1.0 - h
            h_padded = np.pad(h, (0, N))
            j_padded = np.pad(j_val, (0, N))
            corr_fft = np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))
            correlation = np.fft.ifft(corr_fft).real
            return float(np.max(correlation * dx))
        
        def normalize(h):
            integral = np.sum(h) * dx
            return h / integral
        
        candidates = []
        
        # Pattern 1: Piecewise-constant 3-block (low-high-low)
        np.random.seed(42)
        h = np.zeros(N)
        h[100:300] = 3.0
        h[300:700] = -0.5
        h[700:800] = 0.5
        h = normalize(np.clip(h, 0.001, 5.0))
        c5 = compute_c5(h)
        candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                          "c5_bound": float(c5), "pattern": "piecewise3"})
        
        # Pattern 2: Two-block with offset
        np.random.seed(123)
        h = np.zeros(N)
        h[0:200] = 2.0
        h[200:600] = -1.0
        h[600:800] = 1.5
        h = normalize(np.clip(h, 0.001, 5.0))
        c5 = compute_c5(h)
        candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                          "c5_bound": float(c5), "pattern": "twoblock"})
        
        # Pattern 3: Single-frequency sinusoidal
        np.random.seed(456)
        A = 2.0 + np.random.rand()
        B = np.random.uniform(-0.5, 0.5)
        h = 1.0 / (1.0 + np.exp(-(A * np.sin(np.pi * x) + B)))
        h = normalize(np.clip(h, 0.001, 1.0))
        c5 = compute_c5(h)
        candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                          "c5_bound": float(c5), "pattern": "sin1freq"})
        
        # Pattern 4: Two-frequency sinusoidal
        np.random.seed(789)
        A = 1.5 + np.random.rand()
        B = np.random.uniform(-0.5, 0.5)
        C = np.random.uniform(-0.3, 0.3)
        h = 1.0 / (1.0 + np.exp(-(A * np.sin(2 * np.pi * x) + B * np.sin(4 * np.pi * x) + C)))
        h = normalize(np.clip(h, 0.001, 1.0))
        c5 = compute_c5(h)
        candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                          "c5_bound": float(c5), "pattern": "sin2freq"})
        
        # Pattern 5: Quadratic bump
        np.random.seed(101)
        A = 3.0 + np.random.rand() * 2
        B = np.random.uniform(0.3, 0.7)
        h = 1.0 / (1.0 + np.exp(-A * (x - 1.0)**2 + B))
        h = normalize(np.clip(h, 0.001, 1.0))
        c5 = compute_c5(h)
        candidates.append({"h": h.tolist(), "integral": float(np.sum(h) * dx),
                          "c5_bound": float(c5), "pattern": "quadbump"})
        
        return {"candidates": candidates, "num_candidates": len(candidates)}
new_skills:
- name: structural-search-playbook
  description: |
    Explore fundamentally different function structures for Erdos optimization.
    Use generate_structural_candidates to get diverse patterns, then evaluate each.
    Don't stay in one structural family - sample broadly!
  body: |
    # Structural Search Playbook

    ## Core Principle

    The seed optimizer generates functions using the same structural template
    (sigmoid(modulation + noise)). All 15 seed patterns are variations of this
    single family. To beat the seed, we must explore DIFFERENT structural families.

    ## Pattern Families to Explore

    1. **Piecewise-constant**: Functions that are constant over intervals
       - 3-block (low-high-low), 4-block, etc.
       - Key parameter: threshold positions

    2. **Sinusoidal modulation**: Functions modulated by sine waves
       - Single frequency: h(x) = sigmoid(A*sin(pi*x) + B)
       - Multiple frequencies: h(x) = sigmoid(sum of sines)
       - Key parameters: frequencies, amplitudes, phases

    3. **Polynomial-modulated**: Functions with polynomial shapes
       - Quadratic bump: h(x) = sigmoid(A*(x-c)^2 + B)
       - Higher-order polynomials

    4. **Multi-peak (Gaussian sum)**: Sum of localized bumps
       - h(x) = sigmoid(sum_i exp(-(x-xi)^2/sigma^2))
       - Key parameters: number of peaks, centers, widths

    5. **Ramp/linear**: Functions with linear regions
       - h(x) = sigmoid(A*x + B) for monotonic shapes
       - h(x) = sigmoid(A*abs(x-c) + B) for V-shapes

    ## Workflow

    1. CALL generate_structural_candidates(patterns=[list of desired patterns])

    2. EXAMINE the output:
       - Check each candidate's integral (should be ~1.0)
       - Note the precomputed c5_bound

    3. FILTER: Keep only candidates with integral ≈ 1.0 and c5_bound < 0.375

    4. EVALUATE: CALL evaluate_solution on each kept candidate

    5. ANALYZE: Which structural pattern performed best?
       - Piecewise? Sinusoidal? Multi-peak?
       - What parameters worked well?

    6. ITERATE: CALL edit_solution to modify the winning pattern:
       - Change the structural parameters
       - Vary threshold positions, frequencies, amplitudes
       - CALL evaluate_solution again

    7. If no pattern beats seed, try a NEW structural family you haven't explored.

    ## Example Iterations

    Iteration 1:
      - Generate 5 patterns (piecewise, sin1, sin2, quad, multi-peak)
      - Evaluate all 5
      - Best: piecewise-3 with c5_bound=0.378 -> combined_score=1.001

    Iteration 2:
      - Edit piecewise pattern: change thresholds to [1/4, 1/2, 3/4]
      - Evaluate: c5_bound=0.382 (worse)

    Iteration 3:
      - Try new family: ramp functions h(x) = sigmoid(A*x + B)
      - Evaluate best ramp: c5_bound=0.375 -> combined_score=1.018 (BEAT SEED!)
      - CALL finish
tool_descriptions:
  edit_solution: 'Modify EVOLVE-BLOCK to change hyperparameters or function generation.

  Key edits:
  - Change num_intervals: 800 -> 400 (faster evals)
  - Change penalty_strength: 61.0 -> 20.0 (easier constraint satisfaction)
  - Change num_steps: 120000 -> 80000 (faster but may under-optimize)

  To change function structure:
  - Modify threshold positions in piecewise functions
  - Change frequencies in sinusoidal functions
  - Adjust number of Gaussians in multi-peak functions
  - Change polynomial coefficients in quadratic functions'
