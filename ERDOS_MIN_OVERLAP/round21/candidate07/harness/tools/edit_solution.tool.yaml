type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters or function generation.

  Key edits: - Change num_intervals: 800 -> 400 (faster evals) - Change penalty_strength: 61.0 -> 20.0
  (easier constraint satisfaction) - Change num_steps: 120000 -> 80000 (faster but may under-optimize)

  To change function structure: - Modify threshold positions in piecewise functions - Change frequencies
  in sinusoidal functions - Adjust number of Gaussians in multi-peak functions - Change polynomial coefficients
  in quadratic functions'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
