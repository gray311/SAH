type: tool
name: edit_solution
description: 'Modify exactly ONE structural parameter in the EVOLVE-BLOCK.


  Valid edits only:

  - Change threshold in "jnp.where(x < a, ...)" for a specific a value

  - Change mark array in "jnp.array([...])" for Golomb-like patterns

  - Change peak values in tri-modal patterns


  Invalid edits:

  - Changing num_intervals, penalty_strength, num_steps

  - Adding new patterns

  - Modifying sigmoid/activation functions

  - Changing the optimizer loop structure


  Example valid edit:

  Replace "x < 0.5" with "x < 0.3"


  Example valid edit:

  Replace "[0.0, 0.4, 0.8, 1.2, 1.6]" with "[0.0, 0.35, 0.7, 1.05, 1.4]"'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
