type: tool
name: probe_structural_change
description: 'Probe a specific structural change without full evaluation.

  Checks if the edited pattern maintains integral=1.0 and computes approximate c5_bound.

  Call this BEFORE evaluate_solution to quickly filter bad edits.'
input_schema:
  type: object
  properties:
    edit_desc:
      type: string
      description: Description of the structural edit made
    current_c5:
      type: number
      description: Current best c5_bound
