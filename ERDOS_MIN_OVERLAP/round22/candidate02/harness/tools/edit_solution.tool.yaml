type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters for ERFOS optimization.\n\nFaster configuration (RECOMMENDED):\n-
  num_intervals: 100-200 (seed uses 800)\n- penalty_strength: 5-20 (seed uses 61)\n- num_steps: 10000-30000
  (seed uses 120000)\n\nStandard configuration:\n- num_intervals: 400\n- penalty_strength: 30\n- num_steps:
  80000\n\nExample edit for fast search:\nReplace num_intervals: int = 800 with num_intervals: int = 150\nReplace
  penalty_strength: float = 61.0 with penalty_strength: float = 10.0\nReplace num_steps: int = 120000
  with num_steps: int = 20000'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
