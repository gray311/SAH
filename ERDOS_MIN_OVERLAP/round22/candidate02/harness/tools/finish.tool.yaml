type: tool
name: finish
description: Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).\nIf score stays at 1.00001,
  you havent beaten the seed.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
