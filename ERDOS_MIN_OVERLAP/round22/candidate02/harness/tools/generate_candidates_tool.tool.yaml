type: tool
name: generate_candidates_tool
description: 'Generate 12 diverse pattern-based initializations for Erdos optimization.\n\nReturns:\n-
  h: pre-sigmoided step function (integral ~1.0)\n- c5_bound: precomputed analytical score (no training
  needed)\n- pattern_type: which pattern generated this candidate\n- integral: sum(h)*dx\n\nPatterns:\n1.
  Bipartite (separated support at random split)\n2. Tri-modal (3 narrow Gaussian peaks)\n3. Golomb ruler
  (optimal spacing)\n4-12. Random seeds with different latents\n\nScreen by c5_bound < 0.37 before training.\n\nThis
  tool saves the budget: we screen 12 candidates analytically (0 training) instead of training all 12
  (12 full trains). Then we train only the 3-6 best.'
input_schema:
  type: object
  properties:
    num_candidates:
      type: integer
      default: 12
