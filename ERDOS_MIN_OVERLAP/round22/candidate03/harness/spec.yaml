schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem: find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  Constraint: integral(h) = 1 exactly.
  
  Current best: C5 <= 0.38092303510845016.
  
  Goal: Beat seed score of 1.00001 (c5_bound < 0.380923).
  
  KEY INSIGHT: The seed program uses only 3 restarts. This is TOO FEW to escape local optima.
  
  STRATEGY:
  
  1. EDIT the seed program's num_restarts from 3 to 15 (or higher). More restarts = better chance of finding good baselines.
  
  2. Keep num_intervals=800 (higher resolution is important for accurate c5 computation).
  
  3. Keep penalty_strength=61 (strong constraint enforcement needed).
  
  4. After editing, CALL evaluate_solution to test the improved restart count.
  
  5. If no improvement, try even higher restart counts (20, 30, 50).
  
  6. Budget: Use evals to explore restart counts: 15, 25, 40, 50, 75, 100.
skill_description: |
  High-restart optimization strategy.
  
  Generate diverse initializations via multiple restarts and select the best one.
  
  Key: num_restarts determines how many random seeds we try.
  
  Call evaluate_solution after editing num_restarts to compare.
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK to change parameters.
    
    To increase restarts: set num_restarts=15 or 20 or 30 or 50
    
    Example edit for num_restarts=20:
    Replace num_restarts: int = 3 with num_restarts: int = 20
    
    To adjust intervals: set num_intervals=800 (keep high)
    
    To adjust penalty: set penalty_strength=61 (keep strong)
  evaluate_solution: |
    Run full optimization with current hyperparameters. Returns combined_score = 0.38092303510845016 / c5_bound.
    
    Higher is better. combined_score > 1.0 means a new record.
  probe_solution: |
    Fast approximate evaluation (500 intervals). Uses probe budget.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  max_tokens: 16384
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools: []
new_skills: []
new_middlewares: []
