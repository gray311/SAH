type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change parameters.


  To increase restarts: set num_restarts=15 or 20 or 30 or 50


  Example edit for num_restarts=20:

  Replace num_restarts: int = 3 with num_restarts: int = 20


  To adjust intervals: set num_intervals=800 (keep high)


  To adjust penalty: set penalty_strength=61 (keep strong)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
