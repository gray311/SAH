type: tool
name: edit_solution
description: "Edit EVOLVE-BLOCK for discrete step function approach.\nOPTION 1: Replace ErdosOptimizer\
  \ with direct step construction:\ndef optimize_discrete(N=50, pattern=\"bipartite\", seed=0):\n    domain,\
  \ dx = 2.0, 2.0/N\n    h = np.zeros(N)\n    if pattern == \"bipartite\":\n        m = N // 4\n     \
  \   h[:m] = 2.0; h[m:] = 0.0\n    elif pattern == \"tri_modal\":\n        peaks = [0.2+np.random.rand()*0.4,\
  \ 0.6+np.random.rand()*0.4, 1.0+np.random.rand()*0.4]\n        for p in peaks: h += 5.0 * jnp.exp(-((jnp.linspace(0,\
  \ 2, N) - p) / 0.2)**2)\n    h = h / jnp.sum(h) * 1.0 / dx\n    return h\nOPTION 2: Tuning seed optimizer:\n\
  - num_intervals: 100\n- penalty_strength: 5.0\n- num_steps: 20000\n- num_restarts: 10"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
