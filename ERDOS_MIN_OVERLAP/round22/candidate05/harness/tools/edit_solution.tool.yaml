type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters.


  For rapid multi-candidate search:

  - num_intervals: 400 (reduces eval time ~2x)

  - num_steps: 2000 (rapid convergence, allows many candidates)

  - penalty_strength: 10.0 (gentle constraint, easier opt)


  Example:

  Replace num_intervals: int = 800 with num_intervals: int = 400

  Replace num_steps: int = 120000 with num_steps: int = 2000

  Replace penalty_strength: float = 61.0 with penalty_strength: float = 10.0'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
