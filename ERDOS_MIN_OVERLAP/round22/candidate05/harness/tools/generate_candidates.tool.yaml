type: tool
name: generate_candidates
description: 'Generate 3 diverse pattern-based initializations for Erdos optimization.

  Each candidate has h (pre-sigmoided, integral=1.0) and precomputed c5_bound.


  Call with num_candidates=3. Candidates will be valid program edits to the EVOLVE-BLOCK.


  Patterns used: Golomb ruler, bipartite, tri-modal, and 3 random seeds.'
input_schema:
  type: object
  properties:
    num_candidates:
      type: integer
      default: 3
