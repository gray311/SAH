type: tool
name: generate_step_functions
description: 'Generate 5 diverse TRUE STEP FUNCTIONS (piecewise constant) with coarse discretization.

  Each has hard thresholds (h in {0, 0.5, 1.0}) and precomputed c5_bound using analytical method.

  Call with grid_size=20, 30, or 40.'
input_schema:
  type: object
  properties:
    grid_size:
      type: integer
      default: 30
