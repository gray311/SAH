schema: h2spec/1.0
system_prompt: |
  Task: Find step function h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx
  
  CONSTRAINT: integral(h) over [0,2] must equal 1.0 exactly
  
  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0)
  Goal: Beat this by finding h with c5_bound < 0.380923 (combined_score > 1.0)
  
  CRITICAL INSIGHT: The seed program uses GRADIENT-BASED optimization which is WRONG for this problem.
  Gradient descent gets stuck in local minima for this non-convex combinatorial objective.
  
  SOLUTION: EDIT to use DIRECT CONSTRUCTIVE SEARCH:
  1. Generate STEP FUNCTIONS directly (piecewise constant), NOT sigmoid latents
  2. Use SPECIFIC mathematical constructions:
     - Step function with flat regions (not Gaussian pulses)
     - Multiple discrete threshold values
     - Construct patterns with known good overlap properties
  3. Minimal or NO optimization - just evaluate the constructed step function
  4. Use num_intervals=200-400 (coarse enough for step functions, fast evaluation)
  
  EDIT STRATEGY:
  - Change the optimizer to directly construct step functions
  - Remove gradient-based training; use direct evaluation
  - Use step function generation with explicit thresholds
  - Keep num_intervals low (200-400) for speed
  - Remove penalty_strength (or set very low) since we construct valid h directly
  
  PRIORITY: Find ONE construction that beats 0.380923. Don't chase small improvements.
  
  BUDGET: 30 evaluations. Use them wisely - don't waste on gradient optimization.
skill_description: |
  Construct step functions directly for Erdos optimization using mathematical patterns.
  Avoid gradient-based optimization; use direct construction with explicit thresholds.
  Screen candidates with precomputed analytical scores before full evaluation.
tool_descriptions:
  edit_solution: |
    EDIT to change the optimizer from gradient-based to direct construction.
    
    KEY CHANGES:
    1. Remove gradient-based training loop
    2. Directly construct step function h using thresholds
    3. Use sigmoid to smooth but ensure step-like behavior
    4. Remove or reduce optimization steps drastically
    
    Example: Replace the ErdosOptimizer with direct construction:
    
    Instead of training latent with SGD, construct h directly:
    h = np.concatenate([np.ones(n1)*a, np.zeros(n2)])
    Normalize so integral = 1.0
    
    Remove penalty_strength or set to 0.1
    Reduce num_steps to 100-1000 (or remove optimization entirely)
    
    Use num_intervals=200-400 for efficient evaluation
  
  evaluate_solution: |
    Run the program. Returns combined_score = 0.38092303510845016 / c5_bound.
    Score > 1.0 means c5_bound < 0.38092303510845016 (new record).
  
  probe_solution: Fast approximate evaluation using subsampled data.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 1.2
  top_p: 0.9
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools: []
remove_tools: []
