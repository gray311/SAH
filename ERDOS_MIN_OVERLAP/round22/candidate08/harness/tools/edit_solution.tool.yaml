type: tool
name: edit_solution
description: "Edit the EVOLVE-BLOCK to generate a new pattern-based initialization.\n\nChange ONLY the\
  \ pattern generation section (after \"_get_best_initialization\").\nKeep the optimizer loop, FFT computation,\
  \ and constraint satisfaction intact.\n\nCommon edits:\n- Replace Golomb marks array with custom peaks\n\
  - Change threshold patterns (jnp.where conditions)\n- Modify tri-modal centers and weights\n- Try single\
  \ broad Gaussian vs. narrow peaks\n\nPreserve:\n- latent clipping and normalization\n- sigmoid activation\n\
  - FFT-based c5 computation\n- Pattern selection logic (select best by lowest c5_bound)\n\nExample: Replace\
  \ Golomb pattern (lines with \"marks = jnp.array\") with:\n\"peaks = jnp.array([0.4, 1.0, 1.6])\n for\
  \ p in peaks:\n     mask = jnp.abs(x - p) < 0.08\n     latent = latent.at[mask].set(4.5)\""
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
