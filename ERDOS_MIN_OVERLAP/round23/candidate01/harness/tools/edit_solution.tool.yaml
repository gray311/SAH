type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK to change hyperparameters or code structure. Use this to modify num_restarts,
  seed_start, or optimizer parameters.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
