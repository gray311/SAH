schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem: find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  Constraint: integral(h) = 1 exactly.
  
  Current best: C5 <= 0.38092303510845016.
  
  Strategy:
  1. CALL compute_analytical_c5(h_array) ON your proposed h to get exact precomputed c5_bound
  2. CALL compute_analytical_c5 ON the seed optimizer's best_initialization patterns (Golomb, bipartite, tri-modal)
  3. Only CALL evaluate_solution on candidates where c5_bound < 0.37 (use 5-7 marks for Golomb)
  4. If no improvement after 3 evaluations, TRY DIFFERENT PATTERNS: asymmetric bipartite (a=0.4, 0.45, 0.5), 5-peak patterns
  
  Key: The seed's _get_best_initialization uses 15 patterns. You must call compute_analytical_c5 to screen ALL of them before evaluating.
skill_description: |
  Use compute_analytical_c5 for exact precomputed c5_bound. Screen 15 seed patterns, evaluate only c5 < 0.37.
skill_body: |
  # Analytical Screening for Erdos Minimum Overlap
  
  ## Critical Insight
  The seed optimizer has 15 pre-built initialization patterns. Most have c5_bound > 0.37.
  You MUST call compute_analytical_c5 on each pattern BEFORE evaluating.
  
  ## Workflow
  
  1. CALL compute_analytical_c5 with the seed's best_initialization pattern:
     - Try Golomb with 5-7 marks: [0.0, 0.4, 0.8, 1.2, 1.6] or [0.0, 0.45, 1.0, 1.45, 1.9]
     - Try asymmetric bipartite: h = sigmoid(4*x - 2) or h = sigmoid(3*(x-0.5))
     - Try tri-modal with 5 peaks: centers at 0.35, 0.65, 1.0, 1.35, 1.65
  
  2. FOR EACH PATTERN, call compute_analytical_c5:
     - Get h from sigmoid(latent)
     - Normalize so sum(h)*dx = 1.0
     - Compute c5 = max_k integral h(x)(1-h(x+k))dx via FFT
     - SKIP if c5 >= 0.375 (too bad for full eval)
  
  3. CALL evaluate_solution ONLY on candidates with c5 < 0.36
  
  4. If no improvement after 2-3 evals, try DIFFERENT parameter settings:
     - More/smaller peaks
     - Different spacing
     - Asymmetric designs
  
  ## Why This Works
  - compute_analytical_c5 gives EXACT c5_bound (matches seed's FFT implementation)
  - Screen 15+ patterns cheaply before spending eval budget
  - Only evaluate the genuinely promising candidates
  
  ## Expected Output from compute_analytical_c5
  {"h": [...], "integral": 1.0, "c5_bound": 0.362, "normalized": true}
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK hyperparameters or code structure.
    For single-candidate testing: set num_restarts=1, seed_start=0.
    For multi-candidate: keep num_restarts=3.
    Key hyperparameters: num_intervals (800), base_learning_rate (0.006), num_steps (59000), penalty_strength (60.0), num_restarts (3).
  evaluate_solution: |
    Run full 59000-step optimization. Returns combined_score = 0.38092303510845016 / c5_bound.
    Higher is better. combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).
    Budget: 30 evaluations total.
  probe_solution: |
    Fast approximate evaluation (500 intervals). Uses probe budget (30 probes).
    Less accurate than compute_analytical_c5 but useful for quick checks.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 30
  max_tokens: 14000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 8000
new_tools:
  - name: compute_analytical_c5
    description: |
      Compute exact c5_bound for candidate h using seed's FFT implementation.
      Input: h array, num_intervals=800, domain=2.0
      Output: c5_bound (exact), integral, normalized flag.
      Call on ALL patterns before evaluate_solution. Only evaluate if c5 < 0.37.
    input_schema:
      type: object
      properties:
        h:
          type: array
          items:
            type: number
        num_intervals:
          type: integer
          default: 800
        domain:
          type: number
          default: 2.0
    implementation_py: |
      def run(ctx, args):
          import jax
          import jax.numpy as jnp
          import numpy as np
          
          h_array = np.array(args.get("h", []), dtype=np.float64)
          N = args.get("num_intervals", 800)
          domain = args.get("domain", 2.0)
          dx = domain / N
          
          # Sigmoid activation (matches seed)
          h = 1.0 / (1.0 + np.exp(-h_array))
          h = np.clip(h, 1e-6, 1.0 - 1e-6)
          
          # Normalize to integral = 1 (matches seed)
          integral = np.sum(h) * dx
          if integral < 1e-8:
              return {"c5_bound": float("inf"), "integral": float(integral), "normalized": False}
          h_normalized = h / integral
          
          # Compute c5_bound using FFT (exact seed implementation)
          h_padded = np.pad(h_normalized, (0, N))
          j_func = 1.0 - h_padded
          j_padded = np.pad(j_func, (0, N))
          
          h_fft = np.fft.fft(h_padded)
          j_fft = np.fft.fft(j_padded)
          corr_fft = h_fft * np.conj(j_fft)
          correlation = np.fft.ifft(corr_fft).real
          c5_bound = np.max(correlation * dx)
          
          return {"c5_bound": float(c5_bound), "integral": float(integral), "normalized": True}
remove_tools: []
new_skills:
  - name: seed-pattern-screening
    description: |
      Screen the seed's 15 initialization patterns using compute_analytical_c5.
      Evaluate only patterns with c5 < 0.37.
    body: |
      # Seed Pattern Screening for Erdos Minimum Overlap
      
      ## The Seed Has 15 Pre-built Patterns
      The seed optimizer's _get_best_initialization generates 15 patterns:
      1. Random normal
      2. Random uniform (-2,2)
      3. Sin/cos combination
      4. Scaled normal (scale=1.5)
      5. Scaled uniform (scale=2.0)
      6. Bipartite (x>0.5 -> 3.0, else -3.0)
      7. Bipartite (x<1.0 -> 3.0, else -3.0)
      8. Scaled normal (scale=0.5)
      9. Bipartite (x<2/3 -> 3.0, else -3.0)
      10. Bipartite (0.5<=x<1.0 -> 3.0, else -1.0)
      11. Bipartite (0.25<=x<=1.75 -> 2.5, else -2.5)
      12. Golomb ruler (marks at 0.0, 0.4, 0.8, 1.2, 1.6)
      13. Bipartite (x<0.6 -> 3.0, else -3.0)
      14. Tri-modal (3 peaks at 0.4, 1.0, 1.6)
      15. Random normal + noise
      
      ## Screening Workflow
      1. FOR EACH PATTERN, generate latent and compute h = sigmoid(latent)
      2. CALL compute_analytical_c5 for each pattern
      3. RECORD c5_bound for each
      4. SELECT patterns with c5 < 0.37 for full evaluation
      5. CALL evaluate_solution on selected patterns
      
      ## Golomb Ruler Optimization
      The seed's Golomb pattern (pattern 12) uses 5 marks. You can improve by:
      - Using 7 marks: [0.0, 0.35, 0.7, 1.05, 1.4, 1.75, 2.0] (but 2.0 is at boundary)
      - Adjusting spacing for 5 marks: [0.0, 0.4, 0.8, 1.2, 1.6] or [0.0, 0.45, 1.0, 1.45, 1.9]
      
      ## Expected Success Rate
      With compute_analytical_c5, you should identify 1-3 patterns with c5 < 0.37.
      Evaluate those with evaluate_solution. Combined score > 1.0 means success.
new_middlewares:
  - name: force_analytical_screening
    hook: before_model
    description: |
      Force solver to use compute_analytical_c5 before any evaluate_solution.
      Prevents wasting evals on unscreened candidates.
    implementation_py: |
      def before_model(hook_input):
          state = hook_input.get("state", {})
          action = hook_input.get("action", {})
          
          # Check if trying to evaluate without screening
          if action.get("tool_call") == "evaluate_solution":
              if "screened_candidates" not in state:
                  return (
                      "ERROR: You must CALL compute_analytical_c5 first!\\n"
                      "Generate candidates, screen with compute_analytical_c5,\\n"
                      "only then evaluate candidates with c5_bound < 0.37.\\n"
                      "Do NOT call evaluate_solution without screening."
                  )
          
          # Remind to screen remaining patterns
          patterns_left = state.get("patterns_left", 15)
          if patterns_left > 0 and "evaluated_count" not in state:
              return (
                  f"Patterns remaining: {patterns_left}\\n"
                  "Use compute_analytical_c5 to screen each pattern.\\n"
                  "Only evaluate if c5 < 0.37."
              )
          
          return None
