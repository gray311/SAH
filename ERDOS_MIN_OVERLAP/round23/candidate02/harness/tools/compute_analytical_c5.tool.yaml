type: tool
name: compute_analytical_c5
description: 'Compute exact c5_bound for candidate h using seed''s FFT implementation.

  Input: h array, num_intervals=800, domain=2.0

  Output: c5_bound (exact), integral, normalized flag.

  Call on ALL patterns before evaluate_solution. Only evaluate if c5 < 0.37.'
input_schema:
  type: object
  properties:
    h:
      type: array
      items:
        type: number
    num_intervals:
      type: integer
      default: 800
    domain:
      type: number
      default: 2.0
