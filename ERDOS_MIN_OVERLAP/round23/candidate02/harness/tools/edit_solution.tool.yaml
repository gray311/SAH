type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters or code structure.

  For single-candidate testing: set num_restarts=1, seed_start=0.

  For multi-candidate: keep num_restarts=3.

  Key hyperparameters: num_intervals (800), base_learning_rate (0.006), num_steps (59000), penalty_strength
  (60.0), num_restarts (3).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
