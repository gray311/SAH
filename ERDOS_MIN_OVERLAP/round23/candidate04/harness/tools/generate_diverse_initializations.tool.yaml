type: tool
name: generate_diverse_initializations
description: "Generate 3 structurally diverse latent initialization vectors for the Erdos optimizer.\n\
  \nReturns 3 latent vectors (values in [-5, 5]) with DIFFERENT support structures:\n- Candidate 1: Sparse\
  \ concentrated pattern (energy in narrow region)\n- Candidate 2: Bimodal pattern (two separated peaks)\n\
  - Candidate 3: Trimodal or multi-modal pattern (3+ peaks)\n\nThese are passed to the optimizer's sigmoid\
  \ activation. The optimizer handles:\n- Sigmoid to [0,1]\n- Integral constraint satisfaction via gradient\
  \ descent\n- 59000-step training to minimize C5\n\nUsage: Call once. Evaluate all 3 candidates fully.\n\
  input_schema:\n  type: object\n  properties:\n    temp:\n      type: number\n      default: 0.8"
input_schema:
  type: object
  properties: {}
