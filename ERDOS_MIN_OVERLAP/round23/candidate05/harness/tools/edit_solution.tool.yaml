type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change optimizer hyperparameters or code structure.


  Key changes to make:

  - Increase num_restarts from 3 to 5 (more exploration)

  - Adjust initialization patterns to be more diverse

  - Try different num_intervals (400, 800, 1600)

  - Try different base_learning_rate and penalty_strength combinations

  - For single-candidate testing: set num_restarts=1


  The seed optimizer''s _get_best_initialization method generates 15 patterns - ensure all are tested.


  If analytical screening doesn''t help, directly edit the optimizer to change patterns, learning rates,
  or penalty strengths.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
