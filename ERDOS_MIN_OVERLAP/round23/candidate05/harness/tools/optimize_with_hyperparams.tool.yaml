type: tool
name: optimize_with_hyperparams
description: 'Directly edit the seed optimizer to test specific hyperparameter configurations.


  This tool generates edited versions of the EVOLVE-BLOCK with:

  - Different num_restarts values (1, 3, 5)

  - Different num_intervals (400, 800, 1600)

  - Different base_learning_rate (0.003, 0.006, 0.01)

  - Different penalty_strength (30, 60, 120)


  Call this tool to generate diverse optimizer variants, then evaluate each.


  Strategy: Generate 3-5 variants with different hyperparams, evaluate all fully.


  Why this helps: The current harness relies on analytical screening which may be inaccurate. Direct hyperparameter
  exploration lets us test configurations that might yield better results.'
input_schema:
  type: object
  properties:
    variant_id:
      type: integer
      default: 0
      description: Which variant to generate (0-4 for different configurations)
