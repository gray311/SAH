type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters.


  For parallel testing: change num_restarts, base_learning_rate, num_steps, seed_start, or num_intervals.


  Always keep EVOLVE-BLOCK markers intact.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
