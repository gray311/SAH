type: tool
name: edit_solution
description: 'Edit EVOLVE-BLOCK to change num_restarts, seed_start, or num_intervals.


  For candidate generation:

  - num_restarts=1, seed_start=X (X=1,2,3) explores different random seeds

  - num_restarts=3, seed_start=0 uses all 3 restarts

  - num_restarts=2, seed_start=1 uses 2 restarts


  For performance testing:

  - num_intervals=200 (faster, but coarser)

  - num_intervals=800 (default, accurate)


  Template: change lines in Hyperparameters dataclass.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
