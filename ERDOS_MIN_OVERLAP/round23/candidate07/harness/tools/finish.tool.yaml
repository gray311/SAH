type: tool
name: finish
description: 'Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).


  Provide summary: which num_restarts/seed_start worked, the achieved c5_bound, and why it''s an improvement.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
