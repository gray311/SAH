schema: h2spec/1.0
system_prompt: 'Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].

Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).

GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).

RECOMMENDED STRATEGY:
1. START with seed hyperparameters: num_intervals=800, base_learning_rate=0.006, num_steps=59000, penalty_strength=60.0, num_restarts=3

2. FIRST, test single-restart variants (num_restarts=1) to find good initializations quickly:
   - Try patterns: Golomb [0,0.4,0.8,1.2,1.6], Bipartite [0,0.5,1], Tri-modal [0.4,1.0,1.6]
   - Use probe_solution to check c5_bound before full eval

3. THEN, if no success, TUNE hyperparameters:
   - Vary num_intervals: 400, 800, 1600, 3200 (larger N = finer grid)
   - Vary base_learning_rate: 0.001, 0.005, 0.01, 0.02
   - Vary penalty_strength: 20, 40, 80, 120 (stronger constraint on integral)
   - Vary num_steps: 30000, 60000, 100000

4. USE probe_solution to screen candidates cheaply before full evaluate_solution

5. PATTERN INSIGHTS:
   - Golomb ruler patterns (well-spaced marks) minimize overlap
   - Bipartite patterns (step at a point) may be good baseline
   - Tri-modal with 3 narrow peaks can distribute mass effectively

6. EVALUATE ONLY when combined_score > 0.999 (i.e., c5_bound < 0.381)
   - Full evaluation is expensive (59000 steps)
   - Use probe to filter bad candidates

7. If stuck, restart with different hyperparameter combinations or different pattern seeds.'
skill_description: 'Systematic hyperparameter optimization for Erdos C5 minimization. Use probe_solution for cheap screening, then evaluate promising candidates. Focus on tuning: num_intervals (resolution), base_learning_rate (step size), penalty_strength (integral constraint), num_steps (training duration), num_restarts (initialization diversity).'
skill_body: '# Hyperparameter Optimization for Erdos Problem\n\n## Strategy\n\nThe seed optimizer trains for 59000 steps. We need to find hyperparameters that yield c5_bound < 0.380923.\n\n## Step 1: Quick Screening with probe_solution\n\n1. CALL edit_solution to change ONE hyperparameter at a time\n2. CALL probe_solution to get approximate c5_bound (cheap, uses probe budget)\n3. Keep candidates with c5_bound < 0.382 (allow some margin for full eval)\n4. CALL evaluate_solution only on best candidates\n\n## Step 2: Systematic Search\n\n### Hyperparameter grid to try:\n\n**num_intervals (grid resolution):**\n- 400: Coarse, faster training\n- 800: Seed default\n- 1600: Finer, may capture more structure\n- 3200: Very fine, but slower\n\n**base_learning_rate:**\n- 0.001: Conservative, stable training\n- 0.005: Seed default\n- 0.01: Aggressive\n- 0.02: Very aggressive\n\n**penalty_strength:**\n- 20: Weak integral constraint (may violate)\n- 40: Moderate\n- 60: Seed default\n- 80+: Strong constraint (enforces integral=1)\n\n**num_steps:**\n- 30000: Short, may not converge\n- 59000: Seed default\n- 80000: Longer training\n- 120000: Very long\n\n**num_restarts:**\n- 1: Fast single initialization (good for testing patterns)\n- 3: Seed default\n- 5: More diversity\n\n## Step 3: Pattern-Based Edits\n\n### Pattern 12 (Golomb ruler-like):\nmarks = [0.0, 0.4, 0.8, 1.2, 1.6]  # 5 equally spaced marks\n\n### Pattern 14 (Tri-modal):\npeaks = [0.4, 1.0, 1.6]  # 3 narrow peaks\n\n### Pattern 5 (Bipartite):\nx < 0.5: high, x >= 0.5: low\n\n## Workflow\n\n1. Start with seed (num_restarts=3, all other defaults)\n2. If no improvement, try single patterns with num_restarts=1, num_steps=30000\n3. Use probe_solution to screen\n4. Evaluate top candidates with evaluate_solution\n5. If stuck, vary one hyperparameter at a time\n6. Track best combined_score\n\n## Expected Outcome\n\nWith systematic hyperparameter search, we should find c5_bound < 0.380923.\nKey: Use probe_solution to avoid wasting evals on bad candidates.'
tool_descriptions:
  edit_solution: 'Modify EVOLVE-BLOCK hyperparameters systematically.\n\nFor single-candidate testing: set num_restarts=1, num_steps=30000-60000.\n\nFor diversity: keep num_restarts=3-5.\n\nFor fine-grained search: increase num_intervals to 1600 or 3200.\n\nFor stronger integral constraint: increase penalty_strength to 80-120.\n\nFor exploration: try base_learning_rate in [0.001, 0.005, 0.01, 0.02].\n\nKey: Test ONE hyperparameter change at a time to understand impact.'
  evaluate_solution: 'Full 59000-step optimization. Returns combined_score = 0.38092303510845016 / c5_bound.\n\nHigher is better. combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).\n\nUse probe_solution first to filter candidates with c5_bound < 0.382.'
  probe_solution: 'Fast approximate evaluation (500 intervals, analytical c5). Uses probe budget.\n\nApproximate but much cheaper than full eval. Good for screening many candidates.\n\nUse probe to find candidates with c5_bound < 0.382, then evaluate them fully.\n\nBudget: separate from eval budget, typically 30 probes available.'
  finish: 'Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).'
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 30
  max_tokens: 14000
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools: []
new_skills: []
new_middlewares:
- name: probe_before_eval
  hook: before_model
  description: 'Remind solver to use probe_solution before expensive evaluate_solution'
  implementation_py: 'def before_model(hook_input):\n    state = hook_input.get("state", {})\n    evals_left = state.get("evals_left", 0)\n    probes_left = state.get("probes_left", 30)\n    probes_used = 30 - probes_left\n    if evals_left > 0 and probes_left > 0:\n        return (\n            f"You have {evals_left} full evaluations left and {probes_left} probes remaining.\\n"\n            "Before calling evaluate_solution, call probe_solution to check approximate c5_bound.\\n"\n            "Only evaluate if probe shows c5_bound < 0.382 (allow margin below 0.3809).\\n"\n            "This saves expensive evals on clearly bad candidates." if probes_used < 15 else\n            f"Probes running low ({probes_left} left). Use them wisely before final evaluations." if probes_used >= 15 else None\n        )'
