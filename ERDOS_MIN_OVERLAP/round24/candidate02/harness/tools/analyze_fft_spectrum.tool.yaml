type: tool
name: analyze_fft_spectrum
description: 'Analyze the FFT spectrum of the current h function to diagnose overlap issues.

  Returns: peak_locations (where h has high energy), energy_spectrum (magnitude per frequency band), max_overlap_index
  (which k gives worst correlation), and overlap_pattern (qualitative description).


  Call this AFTER generating candidates fail, to understand WHY current h performs poorly.


  Usage: Call when Phase 1 (generate_ready_candidates) yields no improvement.'
input_schema:
  type: object
  properties:
    max_freq:
      type: number
      default: 10
