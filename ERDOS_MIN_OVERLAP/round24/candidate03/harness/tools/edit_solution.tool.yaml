type: tool
name: edit_solution
description: "Modify EVOLVE-BLOCK to create DIRECT STEP FUNCTIONS.\n\nFor discrete step functions:\n \
  \ - Set num_intervals=800\n  - Use a step function h that takes VALUES 0, 0.25, 0.5, 0.75, or 1.0\n\
  \  - Ensure integral(h) = 1 (sum of blocks * width = 1)\n\nFor latent optimization:\n  - Use existing\
  \ patterns from _get_best_initialization\n  - Adjust num_restarts=3-5, num_steps=30000-60000\n\nKEY:\
  \ Create step functions where h is a step function, not a smooth sigmoid curve."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
