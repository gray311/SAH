type: tool
name: generate_discrete_structures
description: "Generate 5 integral=1 step functions with analytical c5 scoring.\n\nReturns 5 candidates,\
  \ each with:\n  - h: step function as array of 800 values (pure step, no sigmoid)\n  - integral: exact\
  \ sum(h)*dx (should be 1.0)\n  - c5_bound: max correlation (analytical FFT, no training)\n  - pattern_type:\
  \ description of structure\n\nPatterns: 3-block, 5-block, asymmetric, bipartite, tri-modal. All use\
  \ domain=2, N=800.\nIntegral constraint satisfied by construction. c5_bound computed via FFT (no training).\n\
  \nUsage: Call once. Candidates with c5_bound < 0.375 are worth full evaluation."
input_schema:
  type: object
  properties:
    seed:
      type: integer
      default: 42
