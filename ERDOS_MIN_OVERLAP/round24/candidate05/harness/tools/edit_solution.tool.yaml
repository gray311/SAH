type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. PRIMARY TARGET: num_restarts (set to 10, 15, or 20).\n\nOther valid
  changes:\n- num_intervals: 400, 800, 1600\n- base_learning_rate: 0.001, 0.005, 0.01\n- penalty_strength:
  40, 60, 80\n- num_steps: 30000, 59000, 80000\n\nCRITICAL: When testing patterns, SET num_restarts=10+
  (NOT 1).\nThe seed uses 15 pattern variations internally. Higher restarts = better exploration.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
