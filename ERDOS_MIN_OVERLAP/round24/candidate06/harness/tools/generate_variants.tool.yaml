type: tool
name: generate_variants
description: 'Generate 5 structurally diverse initialization patterns for Erdos C5 optimization. Returns
  5 candidates with h (latent vector, sigmoid-scaled [0,1]), pattern_type, integral, and c5_bound (approximate
  max overlap via analytical FFT).


  Pattern designs: Golomb-7 (7 marks at [0.0, 0.33, 0.66, 1.0, 1.33, 1.66, 1.99]), Tri-modal-3 (3 Gaussians
  at [0.3, 1.0, 1.7], width=0.12), Bipartite-var (step at a=0.45), Multi-peak-4 (4 peaks at [0.25, 0.65,
  1.05, 1.45]), Golomb-5-shifted (5 marks at [0.1, 0.5, 0.9, 1.3, 1.7]).


  All use domain=[0,2], N=800. Integral normalized to 1.0 via normalization. Usage: Call ONCE at start.
  Use probe_solution for screening.'
input_schema:
  type: object
  properties: {}
