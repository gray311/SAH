type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK parameters for additional training or different pattern seeds. Use only
  when analytical screening finds no good candidates. Typically change num_restarts, num_steps, or seed_start.
  Keep num_intervals=800 unless you suspect resolution issues.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
