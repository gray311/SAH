type: tool
name: construct_step_functions
description: "Generate 5 exact piecewise-constant step functions with integral=1.\nEach has precomputed\
  \ c5_bound via FFT. Returns h values ready to evaluate immediately.\nNo training needed - these are\
  \ analytically constructed candidates.\nPatterns: (1) 5 Gaussians at [0.5,1.5,0.8,1.2,1.0] (truncated\
  \ to [0,2]), \n(2) 4 Gaussians at [0.25,0.75,1.25,1.75], \n(3) Uniform on [0,1] then 0 on [1,2] (integral=1),\n\
  (4) Three Gaussians at [0.4,1.0,1.6], \n(5) Concentrated at 0.8 (narrow Gaussian).\nAll normalized to\
  \ integral=1 exactly. All h in [0,1]."
input_schema:
  type: object
  properties:
    seed:
      type: integer
      default: 42
