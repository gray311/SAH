type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters. Start with: num_intervals=800, num_steps=30000,

  penalty_strength=100, num_restarts=1. Then tune base_learning_rate (0.01, 0.02) and num_intervals (800,
  1600).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
