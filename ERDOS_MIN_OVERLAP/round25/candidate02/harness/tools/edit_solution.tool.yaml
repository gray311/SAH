type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters. ONLY use after analytical candidates are exhausted.

  For secondary search: set num_restarts=1, num_steps=30000, num_intervals=800 (keep seed settings).

  Vary ONE hyperparameter at a time.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
