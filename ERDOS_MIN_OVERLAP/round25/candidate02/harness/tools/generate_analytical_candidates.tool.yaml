type: tool
name: generate_analytical_candidates
description: 'Generate 5-8 integral-constrained step functions with guaranteed integral=1

  and precomputed c5_bound via FFT.


  Returns candidates with h values in [0,1], exact integral normalization,

  and c5_bound scores for quick filtering.


  Pattern types:

  - Golomb-4: 4 marks at [0, 0.4, 0.8, 1.2] (N=800, width=0.08)

  - Golomb-5: 5 marks at [0, 0.4, 0.8, 1.2, 1.6] (optimal spacing)

  - Bipartite: 3 variants with split points a=0.3, 0.5, 0.7

  - Tri-modal: 3 Gaussian peaks at [0.4, 1.0, 1.6], width=0.2

  - Uniform-2: 2 blocks with mass splits for a=0.4, 0.5, 0.6


  All candidates are:

  - Sigmoid-scaled to [0,1]

  - Integral-normalized to exactly 1.0

  - c5_bound precomputed (no training needed)


  Usage: Call ONCE. Filter c5_bound < 0.380, evaluate the rest. Expected: 1-2

  candidates with c5_bound < 0.375.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.5
