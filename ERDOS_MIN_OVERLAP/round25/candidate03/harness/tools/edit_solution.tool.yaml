type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters. Use ONLY if step function approach fails.


  For seed optimizer tuning:

  - num_restarts: 1 (fast), 3 (seed), 5 (more diversity)

  - num_steps: 30000 (short), 59000 (seed), 80000 (longer)

  - penalty_strength: 20 (weak), 40 (moderate), 60 (seed), 80+ (strong integral constraint)

  - base_learning_rate: 0.001 (conservative), 0.005 (seed), 0.01 (aggressive)

  - num_intervals: 400 (coarse), 800 (seed), 1600 (fine), 3200 (very fine)


  Key: Use this ONLY after step functions are exhausted.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
