type: tool
name: evaluate_solution
description: 'Full evaluation of a step function or trained program.

  Returns combined_score = 0.38092303510845016 / c5_bound.


  combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).


  For step functions: c5_bound is exact (FFT on discrete function).

  For trained programs: c5_bound from full training.


  Use after enumerate_step_functions generates candidates.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
