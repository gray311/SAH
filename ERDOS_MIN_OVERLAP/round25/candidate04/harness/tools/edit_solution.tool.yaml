type: tool
name: edit_solution
description: 'Modify PATTERN PARAMETERS in the EVOLVE-BLOCK. DO NOT change num_intervals, learning_rate,
  num_steps, or penalty_strength.


  MODIFY ONLY pattern parameters in _get_best_initialization:

  - Golomb marks: try [0.0, 0.33, 0.66, 1.33, 1.66], [0.0, 0.5, 1.0, 1.5], etc.

  - Tri-modal peaks: try [0.25, 1.0, 1.75], [0.2, 0.7, 1.0, 1.7], or [0.3, 1.0, 1.7]

  - Bipartite split: change threshold 0.5 to 0.4, 0.6, or 0.7


  Each edit should change ONE pattern parameter. Keep num_restarts=1, num_steps=30000 for quick testing.
  Use probe_solution to screen.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
