type: tool
name: generate_ready_candidates
description: 'Generate 3 integral-constrained initializations. Each candidate has integral=1 exactly.


  Patterns: Golomb ruler (optimal spacing), Bipartite (step function), Tri-modal (3 narrow Gaussian peaks).

  All use domain=2, N=800.


  Usage: Call once. Filter: keep only if c5_bound < 0.375. Then evaluate those.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.5
