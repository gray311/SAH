type: tool
name: edit_solution
description: 'Modify hyperparameters.


  FOR ANALYTICAL SCREENING: Use generate_ready_candidates (no edit needed!).


  FOR SMALL TRAINING: set num_steps=5000-20000, num_restarts=1-3.


  FOR VARYING RESOLUTION: change num_intervals to 400, 800, 1600.


  FOR INTEGRAL CONSTRAINT: change penalty_strength to 40-120.


  CRITICAL: Use analytical screening FIRST! Only train if patterns fail.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
