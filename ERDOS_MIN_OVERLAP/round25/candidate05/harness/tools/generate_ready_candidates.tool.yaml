type: tool
name: generate_ready_candidates
description: 'Generate 3 candidates using the seed''s 15 initialization patterns analytically.


  Each candidate uses pattern 12 (Golomb), 14 (Tri-modal), or 5 (Bipartite):

  - Calls _get_best_initialization(seed) with that pattern

  - Applies sigmoid, normalizes to integral=1

  - Computes c5_bound via FFT (NO TRAINING!)


  Returns 3 candidates with h, integral (~1.0), c5_bound, pattern_type.


  Usage: Call ONCE at the start. Candidates with c5_bound < 0.375 are worth full evaluation.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.5
