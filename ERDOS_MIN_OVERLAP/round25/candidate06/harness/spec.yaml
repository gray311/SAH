schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].
  
  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).
  
  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).
  
  KEY INSIGHT: The seed program has HARDCODED pattern parameters that can be IMPROVED:
  - Golomb pattern (pattern 12): marks = [0.0, 0.4, 0.8, 1.2, 1.6] - try different spacings
  - Bipartite pattern (pattern 5): threshold a = 0.5 - try a in [0.3, 0.6, 0.7]
  - Tri-modal pattern (pattern 14): peaks = [0.4, 1.0, 1.6] - try [0.3, 0.9, 1.5], [0.2, 1.0, 1.8]
  
  STRATEGY:
  1. CALL pattern_analyzer to test different pattern configurations (marks, peaks, thresholds)
  2. EDIT the EVOLVE-BLOCK to change hardcoded pattern parameters
  3. Use probe_solution to quickly filter promising patterns
  4. Only evaluate fully when combined_score shows real improvement (> 0.9995)
  5. Focus on FINE-TUNING pattern parameters, not training hyperparameters
  
  PATTERNS TO EXPLORE:
  - Golomb: Try marks at [0.0, 0.35, 0.7, 1.05, 1.4], [0.0, 0.3, 0.6, 0.9, 1.2], [0.0, 0.4, 0.8, 1.2, 1.6]
  - Bipartite: Try a = 0.4, 0.5, 0.6, 0.7
  - Tri-modal: Try peak triples [0.3, 0.9, 1.5], [0.25, 1.0, 1.75], [0.35, 1.05, 1.65]
  
  PATTERN 12 (Golomb) and PATTERN 14 (Tri-modal) are most promising.
  PATTERN 5 (Bipartite) gives baseline performance.
  
  Call pattern_analyzer FIRST to see current pattern performance, then edit to improve.
  
  Evaluate ONLY when combined_score > 0.9995 (c5_bound < 0.3805).
new_tools:
- name: pattern_analyzer
  description: |
    Analyze and evaluate 5 pattern configurations: Golomb variants, Bipartite variants, Tri-modal variants.
    Returns score (c5_bound) for each, identifies best configuration, and suggests edits to try.
    Usage: Call once at start. Best pattern determines focus of editing.
  input_schema:
    type: object
    properties:
      focus:
        type: string
        default: "all"
        enum: ["golomb", "bipartite", "tri_modal", "all"]
  implementation_py: |
    def run(ctx, args):
        import numpy as np
        N = 800
        domain = 2.0
        dx = domain / N
        
        def compute_c5(h_arr):
            h = np.array(h_arr, dtype=np.float64)
            j_val = 1.0 - h
            h_padded = np.pad(h, (0, N))
            j_padded = np.pad(j_val, (0, N))
            corr_fft = np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))
            correlation = np.fft.ifft(corr_fft).real
            return np.max(correlation * dx)
        
        results = []
        
        # Golomb variants
        golomb_marks_list = [
            [0.0, 0.35, 0.7, 1.05, 1.4],
            [0.0, 0.3, 0.6, 0.9, 1.2],
            [0.0, 0.4, 0.8, 1.2, 1.6],
            [0.0, 0.25, 0.5, 0.75, 1.0],
            [0.0, 0.33, 0.66, 1.0, 1.33]
        ]
        for marks in golomb_marks_list:
            latent = np.zeros(N)
            for m in marks:
                width = N * 0.08
                mask = np.abs(np.arange(N) - int(m * N)) < width
                latent[mask] = 4.0
            latent -= 2.0
            h = np.clip(jax.nn.sigmoid(latent), 0.001, 1.0)
            h = h / np.sum(h) * (1.0/dx)  # normalize to integral 1
            c5 = compute_c5(h)
            results.append({"type": "golomb", "marks": marks, "c5": float(c5)})
        
        # Bipartite variants
        bipartite_a_list = [0.4, 0.5, 0.6, 0.7]
        for a in bipartite_a_list:
            latent = np.zeros(N)
            x = np.linspace(0, 2, N)
            latent[x < a] = 4.0
            latent[x >= a] = -1.0
            h = np.clip(jax.nn.sigmoid(latent), 0.001, 1.0)
            h = h / np.sum(h) * (1.0/dx)
            c5 = compute_c5(h)
            results.append({"type": "bipartite", "a": a, "c5": float(c5)})
        
        # Tri-modal variants
        tri_peaks_list = [
            [0.3, 0.9, 1.5],
            [0.25, 1.0, 1.75],
            [0.35, 1.05, 1.65],
            [0.2, 1.0, 1.8],
            [0.4, 1.0, 1.6]
        ]
        for peaks in tri_peaks_list:
            latent = np.zeros(N)
            for p in peaks:
                bw = 0.06
                mask = np.abs(np.arange(N) - int(p * N)) < N * bw
                latent[mask] = 4.0
            latent -= 2.0
            h = np.clip(jax.nn.sigmoid(latent), 0.001, 1.0)
            h = h / np.sum(h) * (1.0/dx)
            c5 = compute_c5(h)
            results.append({"type": "tri_modal", "peaks": peaks, "c5": float(c5)})
        
        best = min(results, key=lambda x: x["c5"])
        return {
            "results": results,
            "best": best,
            "best_type": best["type"],
            "best_c5": best["c5"],
            "best_params": best["marks"] if best["type"] == "golomb" else ({"a": best["a"]} if best["type"] == "bipartite" else {"peaks": best["peaks"]})
        }
sampling:
  temperature: 1.2
  top_p: 0.98
  top_k: 30
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_skills:
- name: pattern-mutation-strategy
  description: |
    Directly edit pattern parameters (marks, peaks, thresholds) in the seed code. Focus on Golomb ruler and tri-modal patterns.
  body: |
    # Pattern Mutation Strategy for Erdos C5
    
    ## Why Pattern Parameters Matter
    
    The seed program has HARDCODED pattern parameters. Small changes can significantly improve c5_bound.
    
    ## Pattern 12: Golomb Ruler (MOST PROMISING)
    
    Current: marks = [0.0, 0.4, 0.8, 1.2, 1.6]
    
    Try editing to:
    - [0.0, 0.35, 0.7, 1.05, 1.4]  # smaller spacing
    - [0.0, 0.3, 0.6, 0.9, 1.2]  # even tighter
    - [0.0, 0.25, 0.5, 0.75, 1.0]  # quarter spacing
    - [0.0, 0.333, 0.667, 1.0, 1.333]  # thirds
    
    Key insight: Golomb rulers minimize overlaps when marks are WELL SPACED.
    
    ## Pattern 14: Tri-Modal
    
    Current: peaks = [0.4, 1.0, 1.6]
    
    Try editing to:
    - [0.3, 0.9, 1.5]  # spread wider
    - [0.25, 1.0, 1.75]
    - [0.35, 1.05, 1.65]  # slightly offset from center
    - [0.2, 1.0, 1.8]
    
    Key insight: Peaks should NOT be too close to [0.5] where overlap is worst.
    
    ## Pattern 5: Bipartite (Baseline)
    
    Current: a = 0.5
    
    Try: a = 0.4, 0.45, 0.55, 0.6
    
    ## Workflow
    
    1. CALL pattern_analyzer to see current baseline performance
    2. EDIT the EVOLVE-BLOCK to change ONE pattern parameter at a time
    3. CALL probe_solution to check if improvement
    4. If c5_bound < 0.375 (combined_score > 1.002), CALL evaluate_solution
    5. Repeat with different patterns
    
    ## What NOT to do
    
    - Don't change num_intervals, learning_rate, penalty_strength (training hyperparameters)
    - These affect how the optimizer TRAINS, but we need to change the PATTERNS themselves
    - Focus on marks, peaks, thresholds - the actual construction parameters
