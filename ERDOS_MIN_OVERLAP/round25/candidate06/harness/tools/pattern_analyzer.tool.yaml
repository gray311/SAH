type: tool
name: pattern_analyzer
description: 'Analyze and evaluate 5 pattern configurations: Golomb variants, Bipartite variants, Tri-modal
  variants.

  Returns score (c5_bound) for each, identifies best configuration, and suggests edits to try.

  Usage: Call once at start. Best pattern determines focus of editing.'
input_schema:
  type: object
  properties:
    focus:
      type: string
      default: all
      enum:
      - golomb
      - bipartite
      - tri_modal
      - all
