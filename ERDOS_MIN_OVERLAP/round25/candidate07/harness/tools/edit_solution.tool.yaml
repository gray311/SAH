type: tool
name: edit_solution
description: 'Rarely needed. Use generate_ready_candidates + modify_best_pattern instead.

  Only use for extreme cases: changing num_intervals to 1000/1600/2560.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
