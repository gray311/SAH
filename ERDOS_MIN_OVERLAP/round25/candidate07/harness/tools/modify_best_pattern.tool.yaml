type: tool
name: modify_best_pattern
description: 'Take a candidate h and generate 3 refined variants with improved pattern structure.


  Input: candidate h (latent vector)


  Modifications:

  - Gaussian smoothing: convolve h with Gaussian to smooth peaks

  - Peak sharpening: narrow the high-value regions

  - Phase modulation: apply sinusoidal modulation


  Returns 3 new candidates with h values, integral, analytical c5_bound (via FFT),

  and modification_type label.


  Call this on the candidate with LOWEST c5_bound from generate_ready_candidates.

  Analytical c5_bound < 0.37 after modification is worth full evaluation.'
input_schema:
  type: object
  properties:
    h:
      type: array
      description: Latent vector (values in [0,1])
    temperature:
      type: number
      description: Exploration level (0.3-1.5)
      default: 0.5
