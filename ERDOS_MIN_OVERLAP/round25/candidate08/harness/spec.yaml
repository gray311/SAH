schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].

  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).

  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).

  CRITICAL STRATEGY: The seed optimizer trains for 59000 steps via gradient descent, but this often gets stuck.
  Instead of tuning hyperparameters, INSTANTIATE HAND-CRAFTED PATTERNS that minimize overlap analytically:

  PATTERN 1 (Two-step): h(x) = 1 on [0,1), h(x) = 0 on [1,2] - uniform split
  PATTERN 2 (Three-step): h(x) = 1 on [0,1/3) U [2/3,2], h(x) = 0 on [1/3,2/3] - concentrated mass
  PATTERN 3 (Five-step Golomb): h = 1 on [0,0.4) U [0.6,0.8) U [1.0,1.2) U [1.4,1.6) U [1.8,2.0], h = 0 elsewhere
  PATTERN 4 (Four-step): h = 1 on [0,0.5) U [0.5,1.0), h = 0 on [1.0,2.0] - half-half-one
  PATTERN 5 (Symmetric three): h = 1 on [0,0.333) U [0.666,1.0) U [1.333,2.0], h = 0 in between

  For each pattern:
  1. CALL edit_solution to replace h with your step function (use manual h array assignment)
  2. CALL probe_solution to verify integral=1 and c5_bound < 0.37
  3. If c5_bound < 0.37, CALL evaluate_solution for final score

  After testing 3-5 patterns, if no improvement, THEN try hyperparameter tuning (num_intervals=400/800/1600,
  penalty_strength=40/80/120, num_steps=30000/59000/80000).

  KEY: PATTERNS beat hyperparameter tuning. The FFT-based evaluation is analytical - good candidates
  should be found in O(1) probes. Aim for c5_bound <= 0.36.
skill_description: |
  Handcrafted pattern search for Erdos C5. Use explicit step functions (two-step, three-step, Golomb ruler) that concentrate or spread mass to minimize overlap. Evaluate each pattern with probe_solution before full evaluation.
tool_descriptions:
  edit_solution: |
    Replace h with a MANUAL step function array. Use np.zeros and assign blocks:\n\n  h = np.zeros(num_intervals, dtype=float)\n  h[start:end] = 1.0  # set interval to high\n  \n  Example: for two-step pattern on [0,1):\n  h[:int(num_intervals/2)] = 1.0\n  \n  Example: for three-step pattern:\n  h[:int(num_intervals/3)] = 1.0\n  h[int(2*num_intervals/3):] = 1.0\n\n  Ensure integral approx 1.0 (sum(h) * 2/num_intervals approx 1.0). If not, scale: h = h / sum(h) * (num_intervals/2)
  evaluate_solution: |
    Full optimization with training. Use ONLY after probe confirms c5_bound < 0.37. Returns combined_score > 1.0 if c5_bound < 0.38092303510845016. Budget: 60 evaluations total.
  probe_solution: |
    Fast analytical c5_bound using FFT on the discretized function. Uses 500 intervals internally. Returns approximate c5_bound. BUDGET: 30 probes available separately. Strategy: Probe 5-10 patterns, evaluate top 1-3 with combined_score.
  finish: |
    Call when combined_score > 1.0.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 25
  max_tokens: 16000
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 10000
new_tools: []
new_skills: []
