type: tool
name: edit_solution
description: 'Replace h with a MANUAL step function array. Use np.zeros and assign blocks:\n\n  h = np.zeros(num_intervals,
  dtype=float)\n  h[start:end] = 1.0  # set interval to high\n  \n  Example: for two-step pattern on [0,1):\n  h[:int(num_intervals/2)]
  = 1.0\n  \n  Example: for three-step pattern:\n  h[:int(num_intervals/3)] = 1.0\n  h[int(2*num_intervals/3):]
  = 1.0\n\n  Ensure integral approx 1.0 (sum(h) * 2/num_intervals approx 1.0). If not, scale: h = h /
  sum(h) * (num_intervals/2)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
