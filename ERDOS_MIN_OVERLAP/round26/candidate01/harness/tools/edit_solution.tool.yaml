type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK. For pattern evaluation: set num_intervals=800, num_restarts=1,
  num_steps=3000, penalty_strength=60.0. This runs quick training from a pattern.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
