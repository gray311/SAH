type: tool
name: pattern_evaluator
description: Construct and analytically evaluate discrete step function patterns for Erdos C5 minimization.
  Generates 3-5 patterns (Golomb ruler, tri-modal, bipartite) with precomputed integral (normalized to
  1.0) and c5_bound via FFT. Returns candidates ready for full evaluation. No training needed - purely
  analytical. Use this to screen patterns before calling evaluate_solution. Filter by c5_bound < 0.378.
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.3
