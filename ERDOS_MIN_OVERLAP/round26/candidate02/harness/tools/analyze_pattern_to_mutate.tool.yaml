type: tool
name: analyze_pattern_to_mutate
description: 'Analyze the current step function h and identify which pattern structure to mutate for improvement.


  Returns analysis including:

  - h visualization summary (where is mass concentrated?)

  - suggested mutation type: perturb marks, widen/narrow peaks, shift threshold

  - specific mutation parameters (new marks, new peak locations, etc.)

  - rationale for why this mutation should help reduce overlap


  Call this BEFORE editing to ensure mutations are targeted, not random.'
input_schema:
  type: object
  properties:
    focus:
      type: string
      default: auto
      enum:
      - auto
      - reduce_overlap
      - increase_separation
