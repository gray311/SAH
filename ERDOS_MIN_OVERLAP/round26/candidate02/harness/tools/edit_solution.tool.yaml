type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK pattern definitions or hyperparameters.


  FOR PATTERN MUTATIONS (preferred):

  - Edit Golomb marks: marks = np.array([0.0, 0.38, 0.75, 1.15, 1.58])

  - Edit tri-modal peaks: peaks = [0.42, 1.0, 1.58], bw = 0.12

  - Edit bipartite threshold: a = 0.45


  FOR HYPERPARAMETER TUNING (secondary):

  - num_intervals: 400, 800, 1600, 3200

  - base_learning_rate: 0.001, 0.005, 0.01, 0.02

  - penalty_strength: 20, 40, 60, 80, 120

  - num_steps: 30000, 59000, 80000


  PRIORITY: Mutate patterns first, only tune hyperparameters after pattern optimization.

  USE analyze_pattern_to_mutate to get specific mutation suggestions.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
