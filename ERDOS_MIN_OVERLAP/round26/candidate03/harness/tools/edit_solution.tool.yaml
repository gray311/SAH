type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK for gradient training. ONLY use after smart_pattern_generator

  identifies promising candidates. Edit ONE parameter at a time:

  - num_intervals: 400, 800, 1600 (grid resolution)

  - base_learning_rate: 0.001, 0.003, 0.006, 0.01

  - penalty_strength: 30, 60, 100 (integral constraint)

  - num_steps: 30000, 59000, 100000'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
