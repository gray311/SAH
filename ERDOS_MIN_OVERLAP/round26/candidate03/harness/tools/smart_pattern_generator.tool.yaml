type: tool
name: smart_pattern_generator
description: 'Generate 3 diverse, integral-constrained initializations for Erdos C5 using

  analytical FFT-based scoring. All outputs normalized to integral=1.


  Returns candidates with: h (latent), integral (~1.0), c5_bound (analytical),

  pattern_type (label). Filter to c5_bound < 0.378, then evaluate.


  Pattern families: Golomb rulers (5-mark, 4-mark), bipartite split (a=0.45),

  tri-modal (3 Gaussian peaks at [0.4,1.0,1.6]), multi-Gaussian (4 peaks),

  quadratic (parabolic mass), inverted quadratic (edge-concentrated).'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.7
