type: tool
name: edit_solution
description: 'For step-function construction, focus on CHANGING THE NUMBER OF STEPS:

  - Change num_intervals to create coarser/finer discretization

  - With N=1600 (1.25 per unit), steps are at multiples of 1.25

  - With N=400 (5 per unit), steps are at multiples of 5


  Do NOT tune learning_rate, penalty_strength, or num_steps. These don''t help structural exploration.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
