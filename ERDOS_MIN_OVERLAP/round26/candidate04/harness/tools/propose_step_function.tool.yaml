type: tool
name: propose_step_function
description: '**NEW TOOL: Generate explicit step-function candidates with structure.**


  Creates 5 diverse step functions that naturally minimize overlap:

  1. uniform_steps: h constant on [0,0.2), [0.2,0.6), [0.6,1.4), [1.4,2]

  2. delta_peaks: narrow peaks at [0.4, 1.0, 1.6] with spacing that avoids overlap

  3. bipartite: h=0.8 on [0,0.5), h=0.2 on [0.5,2]

  4. tri-bipartite: high-low-high pattern at [0,0.3), [0.3,0.7), [0.7,2]

  5. sinusoidal_steps: sin/cos-modulated step heights


  All candidates are pre-normalized to integral(h)=1 and values in [0,1].


  Usage: Call once to generate 5 candidates. Then CALL probe_solution on each.

  Returns: {candidates: [{h: array, integral: float, c5_bound: float, pattern: string}], ...}'
input_schema:
  type: object
  properties:
    num_intervals:
      type: number
      default: 800
    temperature:
      type: number
      default: 0.5
