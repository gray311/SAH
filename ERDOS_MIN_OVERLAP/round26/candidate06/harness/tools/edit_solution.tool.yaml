type: tool
name: edit_solution
description: 'Modify the seed program EVOLVE-BLOCK. Focus on pattern definitions (5, 12, 14) or hyperparameters.
  Make SPECIFIC changes (e.g., change mark positions, peak locations, or split points). For single testing:
  num_restarts=1, num_steps=30000. For exploration: try different pattern values.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
