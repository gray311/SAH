type: tool
name: edit_solution
description: 'Modify hyperparameters for pattern screening. For Stage 1: use screen_all_patterns tool.
  For Stage 2: num_restarts=1, num_steps=10000. For Stage 3: num_steps=59000. Use small num_steps to screen
  patterns quickly, then only fully train promising ones.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
