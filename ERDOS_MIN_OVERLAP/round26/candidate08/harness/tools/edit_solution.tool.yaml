type: tool
name: edit_solution
description: 'Edit EVOLVE-BLOCK for pattern parameterization:

  **For Golomb ruler (Pattern 12)**: Change marks = [0.0, 0.4, 0.8, 1.2, 1.6] to [0.0, 0.3, 0.6, 0.9,
  1.2] or [0.0, 0.5, 1.0, 1.5]

  **For Bipartite (Pattern 5)**: Change split point: x = jnp.where(x < 0.3, 4.0, -4.0) or x = jnp.where(x
  < 0.4, 3.0, -3.0)

  **For Tri-modal (Pattern 14)**: Change peak positions: centers = [0.3, 1.0, 1.7] or centers = [0.2,
  0.8, 1.4]

  **For Single-restart**: Set num_restarts=1, num_steps=50000 for quick evaluation

  **For Fine-grained**: Increase num_intervals to 1600

  **For Stronger constraint**: Increase penalty_strength to 80-120'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
