type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK for training hyperparameters.

  Only use AFTER identifying a good pattern with test_pattern_direct.


  Key hyperparameters:

  - num_restarts: 1 (use single good pattern) vs 3 (diversity)

  - num_steps: 30000 (fast test) to 100000 (full search)

  - base_learning_rate: 0.001, 0.005, 0.01, 0.02

  - penalty_strength: 40, 60, 80, 120

  - num_intervals: 400, 800, 1600, 3200'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
