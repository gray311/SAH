type: tool
name: pattern_mutation_generator
description: 'Generate 3-4 pattern variants from seed''s 15 patterns: Golomb-4 (marks at 0,0.4,0.8,1.2),
  Golomb-5 (0,0.4,0.8,1.2,1.6), Tri-modal-3 (peaks at 0.4,1.0,1.6), Bipartite (high on [0,0.5)). Each
  returns h (already integral-normalized), c5_bound (analytical, max correlation), and integral (should
  be ~1.0). Skip variants with integral != 1.0.'
input_schema:
  type: object
  properties:
    num_variants:
      type: number
      default: 4
