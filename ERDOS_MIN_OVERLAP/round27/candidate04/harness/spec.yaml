schema: h2spec/1.0
system_prompt: |
  ERFDOS C5 PROBLEM: Direct construction of step function h.

  CURRENT BEST: c5_bound = 0.380923 (combined_score = 1.0)
  GOAL: Find h with c5_bound < 0.380923 (combined_score > 1.0)

  CRITICAL INSIGHT: The seed optimizer trains for 59000 steps but STUCK at seed score.
  This means gradient-based training is NOT finding improvements.
  
  NEW STRATEGY: Direct constructive editing of h arrays using mathematical patterns.

  PHASE 1: Try DIRECT initializations (no training needed):
  - Modify pattern initializations in _get_best_initialization or create new ones
  - Focus on patterns that naturally minimize overlap: alternating high-low blocks
  - Try: periodic patterns, sparse spikes, bipartite with different split points

  PHASE 2: If no direct construction works, THEN try hyperparameter tuning

  KEY RULES:
  1. Call edit_solution to CHANGE THE PATTERN CODE directly, not hyperparameters
  2. Prefer creating new pattern initializations over training
  3. Use probe_solution to quickly test new pattern ideas
  4. Try BOTH: modifying existing patterns AND adding completely new ones
  5. Remember: h must be in [0,1] and integral must equal 1

  Example direct edits:
  - Change marks = [0,0.4,0.8,1.2,1.6] to marks = [0, 1, 2] (coarser spacing)
  - Change bipolar pattern: h = jnp.where(x < 0.5, 0.9, 0.1) instead of sigmoid
  - Try h = jnp.array([0.5, 0.5, 1.0, 1.0]) normalized

  USE evaluate_solution only when combined_score > 0.999
skill_description: |
  Direct constructive pattern search for Erdos C5 problem. Focus on editing pattern initializations to create new candidate h arrays without training. Key: modify the _get_best_initialization patterns directly using mathematical insight about minimizing max_k integral h(x)(1-h(x+k)).
skill_body: |
  # Direct Pattern Construction for Erdos C5
  
  ## Understanding the Problem
  
  We want to minimize: max_k integral_{x in [0,2-k]} h(x)(1-h(x+k)) dx
  
  Key insight: The seed optimizer uses gradient descent on sigmoid(latent) which may get stuck.
  Direct pattern construction bypasses training entirely.
  
  ## Pattern Design Principles
  
  ### 1. Alternating Patterns (Best Hope)
  h(x) = 1 on [0,a), h(x) = 0 on [a,2-a), h(x) = 1 on [2-a,2]
  - Minimizes overlap with shifts where h overlaps 1-h
  
  ### 2. Sparse Peak Patterns  
  h has narrow peaks at strategic locations, zero elsewhere
  - Peaks at 0, 1, 2 (periodic) may minimize cross-correlation
  
  ### 3. Coarse-Grained Patterns
  Use fewer intervals (100-400) with broad steps
  - Simpler structure may avoid local minima
  
  ## Action Plan
  
  1. CALL edit_solution to MODIFY _get_best_initialization patterns:
     - Change pattern 12 (Golomb): marks = [0, 0.5, 1, 1.5] instead of [0,0.4,0.8,1.2,1.6]
     - Change pattern 5 (Bipartite): x < 0.5 -> h=0.9, x>=0.5 -> h=0.1 (bypass sigmoid)
     - ADD new pattern: h = jnp.where(x < 0.33, 0.9, jnp.where(x < 0.66, 0.1, 0.9))
  
  2. For each EDITED pattern:
     - Make h values in [0,1] explicitly
     - Normalize so integral(h) = 1 (multiply by 1.0/sum(h)*N)
     - Call probe_solution to check c5_bound
  
  3. If probe shows c5_bound < 0.375:
     - Call evaluate_solution for final score
  
  4. If stuck after 2-3 pattern edits, try HYPERPARAMETER tuning (num_intervals=100, num_steps=10000)
  
  ## Critical Edits to Try
  
  ### Edit A: Bipartite with high-low-high
  Pattern 5: latent = jnp.where(x < 0.4, 8.0, jnp.where(x < 1.6, -8.0, 8.0))
  
  ### Edit B: Three equal blocks
  Pattern NEW: latent = jnp.where((x >= 0) & (x < 2/3), 4.0, 
                       jnp.where((x >= 2/3) & (x < 4/3), -4.0, 4.0))
  
  ### Edit C: Alternating pairs
  Pattern NEW: latent = jnp.where((x >= 0) & (x < 0.5), 5.0,
                       jnp.where((x >= 0.5) & (x < 1.0), -5.0,
                       jnp.where((x >= 1.0) & (x < 1.5), 5.0, -5.0)))
  
  Remember: The seed optimizer TRAINING loop is the problem. 
  BREAK the loop by providing better INITIAL h directly.
tool_descriptions:
  edit_solution: |
    Edit pattern initializations to create direct candidates.
    
    STRATEGY: Modify _get_best_initialization to output BETTER h values WITHOUT training.
    
    Examples:
    - Pattern 5 (Bipartite): Change to alternating h=0.9, h=0.1 pattern
    - Pattern 12 (Golomb): Change marks to coarser spacing [0, 0.5, 1.0]
    - Add Pattern 15: h = 0.5 + 0.5*sin(2*pi*x) (uniform-like)
    - Add Pattern 16: h has 2 narrow peaks at x=0.6, x=1.4
    
    Key: Make h values explicitly in [0,1] and normalize integral to 1.
  evaluate_solution: Full evaluation. Returns combined_score > 1.0 if c5_bound < 0.380923.
  probe_solution: Fast approximate c5_bound check. Use to filter before full eval.
  finish: Submit when combined_score > 1.0.
sampling:
  temperature: 0.5
  top_p: 0.9
  top_k: 10
  max_tokens: 16000
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 10
  long_tool_output_max_chars: 15000
remove_tools: []
new_tools: []
new_skills: []
new_middlewares: []
