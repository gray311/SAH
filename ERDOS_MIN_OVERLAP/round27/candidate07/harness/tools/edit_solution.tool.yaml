  \ to TRY ALL patterns, not just return best:\n\nFor pattern in [12, 14, 5, 0, 8, 9]:  # Key patterns\n\
  \    latent = _get_best_initialization(seed + pattern)\n    h = jax.nn.sigmoid(latent)\n    Train each\
