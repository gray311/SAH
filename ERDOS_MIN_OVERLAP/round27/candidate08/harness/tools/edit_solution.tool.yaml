type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change hyperparameters for the optimizer.


  Common changes:

  - num_intervals: 400 (fast), 800 (default), 1600 (fine)

  - base_learning_rate: 0.001 (conservative), 0.005 (default), 0.01 (aggressive)

  - penalty_strength: 40 (weak), 60 (default), 100 (strong)

  - num_steps: 30000 (fast), 59000 (default), 80000 (long)

  - num_restarts: 1 (single init), 3 (default)


  Only use after you have a good initial h with c5_bound < 0.375.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
