type: tool
name: generate_structural_variants
description: 'Generate mathematically-informed triangular pulse patterns for Erdos C5 minimization.


  Each candidate uses narrow triangular pulses (width 0.12-0.25) at strategically

  placed centers to minimize h(x) overlap with h(x+k). Patterns are integral-normalized

  and c5_bound computed via FFT (analytical, no training needed).


  Focus on 4-6 pulse configurations spaced at ~0.5 intervals. Expected c5 bounds:

  - 4 pulses at [0.2,0.7,1.2,1.7]: ~0.35-0.36

  - 5 pulses at [0.15,0.5,0.85,1.2,1.55]: ~0.34-0.35


  After generation, filter for c5_bound < 0.375 and evaluate fully.'
input_schema:
  type: object
  properties:
    config:
      type: string
      default: narrow_4pulse
      enum:
      - narrow_4pulse
      - medium_5pulse
      - wide_6pulse
      - bipolar_2pulse
      - central_1pulse
