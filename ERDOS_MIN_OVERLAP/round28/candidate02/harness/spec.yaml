schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].

  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).

  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).

  STRATEGY: 
  1. CALL validate_patterns FIRST to check if proposed patterns are structurally valid (h in [0,1], integral=1)
  2. If validation passes, try TRAINING with: num_restarts=1, num_steps=30000 (fast test)
  3. Use probe_solution to check c5_bound < 0.375 before full eval
  4. For pattern construction: Golomb ruler marks at [0.0, 0.4, 0.8, 1.2, 1.6], Bipartite at x=0.5, Tri-modal peaks at [0.4, 1.0, 1.6]
  5. EVALUATE ONLY when combined_score > 0.999
  6. Key insight: Start with SIMPLE patterns, not complex training. The optimizer may overfit.
skill_description: |
  Analyze Erdos C5 patterns structurally before training. Use validate_patterns to check validity, then train simple variants with fast iteration.
skill_body: |
  # Analytical Pattern Validation for Erdos Problem

  ## Step 1: Validate Patterns

  1. CALL validate_patterns with your proposed pattern (e.g., "golomb_5", "bipartite_0.5", "tri_0.4_1.0_1.6")

  2. EXAMINE the returned struct_c5_bound:
     - If struct_c5_bound >= 0.382, SKIP this pattern (will fail full eval)
     - If struct_c5_bound < 0.375, proceed to training
     - If struct_c5_bound in [0.375, 0.382), consider trying variant

  3. VALIDATION CHECKS:
     - Pattern must be integral-normalized (sum(h) * dx = 1.0)
     - Pattern must have h in [0,1] for ALL intervals
     - Pattern must use N=800 intervals (domain width 2.0)

  ## Step 2: Fast Training Loop

  1. Set num_restarts=1 (single initialization)
  2. Set num_steps=30000 (quick convergence test)
  3. Set penalty_strength=80 (strong integral constraint)
  4. Set num_intervals=800 (standard)

  5. CALL edit_solution with your validated pattern code
  6. CALL probe_solution to check c5_bound
  7. If probe c5_bound < 0.375, call evaluate_solution

  ## Step 3: Pattern Templates

  ### Golomb Ruler (5 marks):
  marks = [0.0, 0.4, 0.8, 1.2, 1.6]
  h[i] = gaussian_peak(i, center=mark, width=0.08) normalized

  ### Bipartite (half-half):
  h[i] = 0.8 if x < 0.5 else 0.2 (normalized to integral=1)

  ### Tri-modal (3 peaks):
  peaks = [0.4, 1.0, 1.6]
  h[i] = sum of 3 Gaussians at peaks, normalized

  ## Workflow

  1. CALL validate_patterns("pattern_name")
  2. If struct_c5_bound < 0.375, proceed
  3. CALL edit_solution with pattern code
  4. CALL probe_solution
  5. If good, CALL evaluate_solution
  6. Report best combined_score
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK with validated pattern code. Use simple, analytic patterns first. 
    Set num_restarts=1, num_steps=30000 for fast testing.
  evaluate_solution: |
    Full 59000-step optimization. Returns combined_score > 1.0 means c5_bound < 0.38092303510845016.
    Use probe_solution first to filter candidates with c5_bound < 0.375.
  probe_solution: |
    Fast approximate evaluation (500 intervals). Use to filter candidates with c5_bound < 0.375.
    Budget: separate from eval budget, typically 30 probes available.
sampling:
  temperature: 1.2
  top_p: 0.9
  top_k: 15
  max_tokens: 12000
agent:
  max_iterations: 35
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 8000
new_tools:
  - name: validate_patterns
    description: |
      Analyze a pattern's structural c5_bound analytically WITHOUT training.

      Input: pattern_name (string)

      Patterns: golomb_5, bipartite, tri_3, random_uniform

      Returns struct_c5_bound (analytical max overlap), is_valid (h in [0,1] and integral=1), integral.

      Use before training: if struct_c5_bound < 0.375, pattern is worth training.

      This avoids wasting 59000 steps on invalid patterns.
    input_schema:
      type: object
      properties:
        pattern_name:
          type: string
          default: golomb_5
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          N = 800
          domain = 2.0
          dx = domain / N

          def make_h(pattern_name, marks=None, step_pos=None, peaks=None):
              h = np.zeros(N)
              if pattern_name == 'golomb_5' and marks is not None:
                  for m in marks:
                      center = int(m * N)
                      width = int(N * 0.15)
                      h += np.exp(-((np.arange(N) - center) ** 2) / (2 * width ** 2))
              elif pattern_name == 'bipartite' and step_pos is not None:
                  pos = int(step_pos * N)
                  h[:pos] = 4.0
                  h[pos:] = -1.0
              elif pattern_name == 'tri_3' and peaks is not None:
                  for p in peaks:
                      center = int(p * N)
                      width = int(N * 0.1)
                      h += np.exp(-((np.arange(N) - center) ** 2) / (2 * width ** 2))
              elif pattern_name == 'random_uniform':
                  h = np.ones(N) * 0.5
              else:
                  h = np.random.randn(N) * 0.3 + 0.5

              # Normalize to integral=1
              h = np.clip(h, 0.001, 5.0)
              integral = np.sum(h) * dx
              if integral > 0:
                  h = h / integral
              h = np.clip(h, 0.001, 1.0)
              integral = np.sum(h) * dx
              return h

          pattern_name = args.get('pattern_name', 'golomb_5')
          marks = [0.0, 0.4, 0.8, 1.2, 1.6] if pattern_name == 'golomb_5' else None
          step_pos = 0.5 if pattern_name == 'bipartite' else None
          peaks = [0.4, 1.0, 1.6] if pattern_name == 'tri_3' else None

          h = make_h(pattern_name, marks, step_pos, peaks)
          integral = np.sum(h) * dx

          j = 1.0 - h
          h_padded = np.pad(h, (0, N))
          j_padded = np.pad(j, (0, N))
          corr_fft = np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))
          correlation = np.fft.ifft(corr_fft).real
          struct_c5 = np.max(correlation * dx)

          is_valid = (0.001 <= np.min(h) and np.max(h) <= 1.0 and abs(integral - 1.0) < 0.01)

          return {"pattern_name": pattern_name, "struct_c5_bound": float(struct_c5),
                  "is_valid": is_valid, "integral": float(integral),
                  "recommendation": "PROCEED" if struct_c5 < 0.375 else "SKIP"}
new_skills:
  - name: validate-before-train
    description: |
      Always validate patterns analytically before training. Use validate_patterns to filter.
    body: |
      # Validate Before Training

      ## Critical Rule

      NEVER call edit_solution followed by evaluate_solution without first calling validate_patterns.

      ## Workflow

      1. CALL validate_patterns("pattern_name")
      2. Check struct_c5_bound:
         - If >= 0.382: SKIP (pattern fundamentally flawed)
         - If in [0.375, 0.382): TRY WITH LOW CONFIDENCE
         - If < 0.375: PROCEED to training
      3. If valid, CALL edit_solution with pattern code
      4. CALL probe_solution (fast)
      5. If probe good, CALL evaluate_solution

      ## Why This Matters

      - Training 59000 steps on invalid patterns wastes the budget
      - validate_patterns is O(1) - instant feedback
      - Most seed patterns have struct_c5_bound ~ 0.38-0.40 (useless)
      - Only patterns with struct_c5_bound < 0.375 are worth training

      ## Expected Gain

      With validate_patterns, you should find c5_bound < 0.37 candidates in 3-5 evals instead of 20+
