type: tool
name: validate_patterns
description: 'Analyze a pattern''s structural c5_bound analytically WITHOUT training.


  Input: pattern_name (string)


  Patterns: golomb_5, bipartite, tri_3, random_uniform


  Returns struct_c5_bound (analytical max overlap), is_valid (h in [0,1] and integral=1), integral.


  Use before training: if struct_c5_bound < 0.375, pattern is worth training.


  This avoids wasting 59000 steps on invalid patterns.'
input_schema:
  type: object
  properties:
    pattern_name:
      type: string
      default: golomb_5
