type: tool
name: edit_solution
description: 'Edit hyperparameters and pattern code to test SINGLE pattern variants.


  For single-pattern testing:

  - Set num_restarts=1 (do not waste on other patterns)

  - Set num_steps=20000-30000 (quick validation)

  - Modify EVOLVE-BLOCK to use ONLY the target pattern (remove other pattern attempts)

  - Keep num_intervals=800 for now, increase only if needed


  Pattern examples to extract:

  - Pattern 12 (Golomb): marks = [0.0, 0.4, 0.8, 1.2, 1.6]

  - Pattern 14 (Tri-modal): peaks = [0.4, 1.0, 1.6]

  - Pattern 13 (Bipartite): threshold at x < 0.5


  Key: Test ONE pattern at a time. If it works, mutate it.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
