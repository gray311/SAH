type: tool
name: extract_patterns
description: 'Extract and analyze the 14 pattern initializations from the seed optimizer code.

  Returns detailed analysis of each pattern''s structure, key parameters, and estimated c5_bound.


  Patterns analyzed:

  - Pattern 12: Golomb ruler (marks at 0.0, 0.4, 0.8, 1.2, 1.6)

  - Pattern 14: Tri-modal (peaks at 0.4, 1.0, 1.6)

  - Pattern 13: Bipartite (threshold at 0.5)

  - Pattern 11: Wide region (0.25 to 1.75)

  - Pattern 10: Middle region (0.5 to 1.0)


  For each pattern, returns:

  - pattern_name: String label

  - key_features: List of structural characteristics

  - est_c5: Approximate c5_bound (0.37-0.385 range expected)

  - mutation_suggestions: List of parameter variations to try


  Usage: Call once at start to understand the pattern landscape. Then select promising patterns for focused
  testing.'
input_schema:
  type: object
  properties:
    focus_pattern:
      type: string
      description: Optional pattern name to focus on (e.g., golomb, tri_modal, bipartite)
      default: ''
