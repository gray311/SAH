type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters. For coarse search: vary num_intervals in [400,800,1600,3200],
  penalty_strength in [30,60,100,150], base_learning_rate in [0.003,0.006,0.012].\n\nFor fine search:
  vary one parameter at a time from the best candidate found so far.\n\nFor pattern testing: set num_restarts=1,
  num_steps=30000, and edit initialization code directly.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
