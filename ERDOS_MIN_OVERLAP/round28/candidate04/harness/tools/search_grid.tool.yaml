type: tool
name: search_grid
description: 'Enumerate hyperparameter combinations with analytical pre-screening. Returns diverse candidates
  for Erdos optimization.\n\nCall search_grid(coarse=True) for 4-6 diverse candidates (num_intervals:
  400/800/1600/3200, penalty_strength: 30/60/100/150, base_learning_rate: 0.003/0.006/0.012). Each has
  estimated c5_bound from analytical estimate.\n\nCall search_grid(coarse=False) for finer search (8-12
  candidates with smaller steps).\n\nCandidates with estimated_c5 < 0.382 are worth full evaluation.'
input_schema:
  type: object
  properties:
    coarse:
      type: boolean
      default: true
