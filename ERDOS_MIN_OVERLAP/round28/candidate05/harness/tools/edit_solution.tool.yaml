type: tool
name: edit_solution
description: "Modify EVOLVE-BLOCK hyperparameters OR pattern parameters.\n\nFor pattern-based search:\
  \ use generate_pattern_candidates instead.\n\nFor hyperparameter tuning (Phase 2):\n- Change ONE parameter\
  \ at a time\n- Try: num_intervals in [400, 800, 1600], base_learning_rate in [0.001, 0.005, 0.01],\n\
  \  penalty_strength in [20, 40, 60, 80], num_steps in [30000, 59000, 80000]\n\nKey: Do NOT just hyperparameter-tune\
  \ the seed pattern. Use fresh patterns first."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
