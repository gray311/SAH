schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].

  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).

  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).

  CRITICAL STRATEGY: The seed optimizer has 15 patterns but all converge to similar solutions.
  YOU MUST TRY NEW PATTERNS, not just tune hyperparameters.

  PATTERN-SEARCH WORKFLOW:
  1. CALL generate_patterns to get 3-5 novel initializations (Gaussian, sparse spikes, triangular, etc.)
  2. For EACH pattern: 
     - EDIT to use that pattern with num_restarts=1, num_steps=30000
     - CALL probe_solution to check c5_bound (~10s, cheap)
     - If c5_bound < 0.375, CALL evaluate_solution for full validation
  3. If no pattern yields c5_bound < 0.375, try different pattern templates
  4. ONLY tune hyperparameters AFTER finding a promising pattern direction

  WHY THIS WORKS: New patterns explore different regions of the solution space.
  Hyperparameter tuning on a bad pattern will never find the optimum.
  Fast training (30000 steps) lets you screen many patterns quickly.
  Use probe to filter before wasting full evaluations.
skill_description: |
  Pattern-based search for Erdos C5 minimization. Generate novel initializations (Gaussian peaks, sparse spikes, triangular), train quickly (30000 steps), screen with probe, validate with evaluate. Don't just tune hyperparameters - explore NEW solution structures.
skill_body: |
  # Novel Pattern Search for Erdos C5 Problem

  ## Why We Need New Patterns

  The seed optimizer tries 15 patterns but all converge to similar local optima. To find c5_bound < 0.380923, we MUST explore fundamentally different initialization structures.

  ## Pattern Generation

  1. CALL generate_patterns() to get novel initializations:
     - Gaussian peaks at various positions
     - Sparse spike patterns (few high-value regions)
     - Triangular distributions
     - Asymmetric distributions
     - Multi-modal patterns (4+ peaks)

  2. Each returned pattern has precomputed c5_bound (analytical)
  3. Keep patterns with c5_bound < 0.38 (already promising)

  ## Fast Training & Screening

  1. EDIT pattern: set num_restarts=1 (one initialization), num_steps=30000 (fast)
  2. CALL probe_solution (cheap, ~10s) to check if training improves the pattern
  3. If probe shows c5_bound < 0.375, CALL evaluate_solution for final validation

  ## Pattern Exploration Strategy

  - Start with 3-5 different pattern types from generate_patterns
  - For each, run fast training + probe + (maybe) full eval
  - This lets you screen 10+ different pattern structures in 20 evals
  - Then DOUBLE DOWN on the best pattern type, try variations

  ## Common Pitfalls

  - DON'T just tune hyperparameters on the same pattern
  - DON't skip probe - waste evals on bad patterns
  - DON't use num_steps=59000 for all patterns - too slow for screening
  - DO try at least 3-5 different pattern types before giving up

  ## Expected Workflow

  1. generate_patterns -> get 3 patterns
  2. Train each with 30000 steps -> probe all 3
  3. Pick best -> evaluate -> if <0.375, REPORT SUCCESS
  4. If no success, try different pattern templates
  5. If STILL stuck, try hyperparameter tuning on the best pattern
tool_descriptions:
  edit_solution: |
    Modify the optimizer to train a specific pattern.

    For FAST pattern screening:
      - num_restarts=1 (single initialization)
      - num_steps=30000 (fast, ~15s training)
      - Use patterns from generate_patterns or seed patterns 5,12,14

    For FULL validation:
      - Keep other hyperparameters sensible (num_intervals=800, lr=0.006)
      - Use the improved pattern from fast training

    Key: Train quickly to screen many patterns, not just one.
  evaluate_solution: |
    Full 59000-step optimization. Returns combined_score = 0.38092303510845016 / c5_bound.

    Higher is better. combined_score > 1.0 means c5_bound < 0.380923 (new record).

    Use ONLY after probe shows c5_bound < 0.375. Each full eval consumes 1 of 60 evaluations.
  probe_solution: |
    Fast approximate evaluation (500 intervals). Uses probe budget.

    Approximate but much cheaper than full eval (10s vs minutes). Good for screening many training runs.

    Use probe to filter training candidates with c5_bound < 0.375 before calling evaluate.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 1.5
  top_p: 0.9
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 15000
new_tools:
  - name: generate_patterns
    description: |
      Generate 3-5 novel Erdos optimization initializations with analytical c5 scoring.

      Returns patterns:
      1. Gaussian peaks: bell curves at positions like [0.5, 1.5]
      2. Sparse spikes: high at 3-5 positions, zero elsewhere
      3. Triangular: peak at center, linear decay
      4. Asymmetric bimodal: different shapes on left/right of domain
      5. Multi-modal: 4-5 narrow peaks spread across domain

      All patterns:
      - Integral-normalized (sum(h)*dx = 1.0)
      - Values clipped to [0,1]
      - Precomputed c5_bound via FFT (no training needed)

      Strategy: Find patterns with c5_bound < 0.375, then train them fast (30000 steps) and validate.
    input_schema:
      type: object
      properties:
        seed:
          type: number
          default: 42
        num_patterns:
          type: integer
          default: 5
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          N = 800
          domain = 2.0
          dx = domain / N
          
          seed = args.get("seed", 42)
          np.random.seed(seed)
          
          candidates = []
          
          # Pattern 1: Gaussian peaks at 0.5 and 1.5
          g1 = np.zeros(N)
          for center in [0.5 * N, 1.5 * N]:
              std = N * 0.04
              g1 += np.exp(-0.5 * ((np.arange(N) - center) / std)**2)
          g1 = np.clip(g1, 1e-6, 100)
          g1 = np.exp(g1) / (np.sum(np.exp(g1)) + 1e-10)
          g1 = g1 / (np.sum(g1) * dx)
          g1 = np.clip(g1, 1e-4, 1.0)
          j1 = 1.0 - g1
          corr = np.fft.fft(g1) * np.conj(np.fft.fft(j1))
          c5 = np.max(np.fft.ifft(corr).real * dx)
          candidates.append({"h": g1.tolist(), "c5_bound": float(c5), "pattern": "gaussian_2peaks"})
          
          # Pattern 2: Sparse spikes (3 high regions)
          s2 = np.zeros(N)
          for mark in [N/3, N/2, 2*N/3]:
              width = N * 0.025
              s2 += 20.0 * np.exp(-((np.arange(N) - mark) / width)**2)
          s2 = np.clip(s2, 1e-6, 100)
          s2 = np.exp(s2) / (np.sum(np.exp(s2)) + 1e-10)
          s2 = s2 / (np.sum(s2) * dx)
          s2 = np.clip(s2, 1e-4, 1.0)
          j2 = 1.0 - s2
          corr = np.fft.fft(s2) * np.conj(np.fft.fft(j2))
          c5 = np.max(np.fft.ifft(corr).real * dx)
          candidates.append({"h": s2.tolist(), "c5_bound": float(c5), "pattern": "sparse_3spikes"})
          
          # Pattern 3: Triangular (single peak at center)
          t3 = np.zeros(N)
          peak = N / 2
          for i in range(N):
              t3[i] = 1.0 - abs(i - peak) / (N / 2)
          t3 = np.maximum(t3, 0.1)
          t3 = np.exp(t3) / (np.sum(np.exp(t3)) + 1e-10)
          t3 = t3 / (np.sum(t3) * dx)
          t3 = np.clip(t3, 1e-4, 1.0)
          j3 = 1.0 - t3
          corr = np.fft.fft(t3) * np.conj(np.fft.fft(j3))
          c5 = np.max(np.fft.ifft(corr).real * dx)
          candidates.append({"h": t3.tolist(), "c5_bound": float(c5), "pattern": "triangular"})
          
          # Pattern 4: Asymmetric bimodal (high on left, low on right)
          a4 = np.zeros(N)
          split = N * 0.7
          a4[:int(split)] = 10.0
          a4[int(split):] = 0.5
          a4 = np.clip(a4, 1e-6, 100)
          a4 = np.exp(a4) / (np.sum(np.exp(a4)) + 1e-10)
          a4 = a4 / (np.sum(a4) * dx)
          a4 = np.clip(a4, 1e-4, 1.0)
          j4 = 1.0 - a4
          corr = np.fft.fft(a4) * np.conj(np.fft.fft(j4))
          c5 = np.max(np.fft.ifft(corr).real * dx)
          candidates.append({"h": a4.tolist(), "c5_bound": float(c5), "pattern": "asymmetric_bimodal"})
          
          # Pattern 5: Multi-modal (4 narrow peaks)
          m5 = np.zeros(N)
          for center in [N * 0.25, N * 0.5, N * 0.75, N]:
              width = N * 0.02
              m5 += 25.0 * np.exp(-((np.arange(N) - center) / width)**2)
          m5 = np.clip(m5, 1e-6, 100)
          m5 = np.exp(m5) / (np.sum(np.exp(m5)) + 1e-10)
          m5 = m5 / (np.sum(m5) * dx)
          m5 = np.clip(m5, 1e-4, 1.0)
          j5 = 1.0 - m5
          corr = np.fft.fft(m5) * np.conj(np.fft.fft(j5))
          c5 = np.max(np.fft.ifft(corr).real * dx)
          candidates.append({"h": m5.tolist(), "c5_bound": float(c5), "pattern": "quad_modal"})
          
          return {"candidates": candidates, "num_candidates": len(candidates), "patterns": [c["pattern"] for c in candidates]}
new_skills:
  - name: pattern-screening-workflow
    description: |
      Use generate_patterns to find novel initializations, train fast (30000 steps), probe to screen, evaluate top candidates.
    body: |
      # Pattern-First Search Workflow

      ## Core Principle

      The seed optimizer's 15 patterns all converge to similar solutions. To find c5_bound < 0.380923, you MUST explore NEW pattern structures.

      ## Step 1: Generate Novel Patterns

      CALL generate_patterns(seed=42, num_patterns=5) to get 5 diverse initializations:
      - gaussian_2peaks: Bell curves at 0.5 and 1.5
      - sparse_3spikes: 3 narrow high regions
      - triangular: Single peak at center
      - asymmetric_bimodal: High on [0,0.7], low on [1.3,2]
      - quad_modal: 4 narrow peaks at 0.25, 0.5, 0.75, 1.0

      ## Step 2: Quick Analytical Filtering

      Examine the returned c5_bound values:
      - SKIP patterns with c5_bound >= 0.38 (not promising)
      - KEEP patterns with c5_bound < 0.375 (worth training)

      ## Step 3: Fast Training & Probe

      For each kept pattern:
      1. EDIT to set that pattern's latent values
      2. Set num_restarts=1, num_steps=30000
      3. CALL probe_solution
      4. If c5_bound < 0.372, proceed to full eval

      ## Step 4: Full Validation

      CALL evaluate_solution on the best probed candidate.
      If combined_score > 1.0, you have a new record!

      ## Budget Management

      - 60 full evals budget
      - Use probe to filter: only 2-3 full evals needed if you screen 5 patterns well
      - Fast training (30000 steps) lets you train 5 patterns in one iteration

      ## Expected Outcome

      With this workflow, you should find c5_bound < 0.375 within 3-5 evals,
      potentially reaching combined_score > 1.0.
