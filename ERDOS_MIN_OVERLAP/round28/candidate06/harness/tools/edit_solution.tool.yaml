type: tool
name: edit_solution
description: "Modify the optimizer to train a specific pattern.\n\nFor FAST pattern screening:\n  - num_restarts=1\
  \ (single initialization)\n  - num_steps=30000 (fast, ~15s training)\n  - Use patterns from generate_patterns\
  \ or seed patterns 5,12,14\n\nFor FULL validation:\n  - Keep other hyperparameters sensible (num_intervals=800,\
  \ lr=0.006)\n  - Use the improved pattern from fast training\n\nKey: Train quickly to screen many patterns,\
  \ not just one."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
