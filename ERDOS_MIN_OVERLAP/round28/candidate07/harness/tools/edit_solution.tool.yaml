type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to create new pattern initializations.


  For Golomb patterns: change the marks array (e.g., 5 marks at [0,0.4,0.8,1.2,1.6]).


  For bipartite patterns: change the split point a (e.g., a=0.4 or a=0.6).


  For multi-modal patterns: change peak positions (e.g., 4 peaks at [0.3,0.8,1.2,1.7]).


  For block patterns: add sequential blocks with different values, then normalize.


  Key: Focus on STRUCTURAL changes, not hyperparameter tuning. The structure of h matters more than training
  details.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
