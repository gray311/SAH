type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters. Change ONE parameter at a time.


  For quick screening: num_steps=5000, num_restarts=1.

  For full search: num_steps=59000, num_restarts=3.


  Key parameters to tune:

  - base_learning_rate: [0.001, 0.005, 0.01, 0.02]

  - penalty_strength: [20, 40, 60, 80, 120]

  - num_steps: [5000, 10000, 30000, 59000, 80000]

  - num_intervals: [400, 800, 1600, 3200]

  - num_restarts: [1, 3, 5, 10]


  Always keep other parameters at seed defaults unless testing them.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
