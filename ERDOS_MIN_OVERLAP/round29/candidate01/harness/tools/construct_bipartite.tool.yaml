type: tool
name: construct_bipartite
description: 'Construct a bipartite step function: h(x) = 1 for x < a, 0 for x >= a.

  Automatically sets a = 0.5 to satisfy integral(h) = 1 exactly.

  Returns h as a discretized array and precomputed c5_bound via FFT.

  Use this as an initial point for the optimizer.'
input_schema:
  type: object
  properties:
    a:
      type: number
      default: 0.5
