type: tool
name: construct_multipeak
description: 'Construct a multi-peak step function with n peaks at specified positions.

  Each peak is a narrow rectangle. Automatically scales to satisfy integral(h) = 1.

  Choose n and positions strategically to minimize overlap (e.g., well-separated).

  Returns discretized h and precomputed c5_bound.'
input_schema:
  type: object
  properties:
    n_peaks:
      type: integer
      default: 3
    peak_positions:
      type: array
      items:
        type: number
      default:
      - 0.4
      - 1.0
      - 1.6
    peak_width:
      type: number
      default: 0.08
