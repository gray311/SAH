type: tool
name: construct_sparse
description: 'Construct a sparse step function: mostly zeros with a few narrow high peaks.

  Sparse functions minimize overlap because peaks rarely align for different k.

  Automatically scales to satisfy integral(h) = 1.

  Returns discretized h and precomputed c5_bound.'
input_schema:
  type: object
  properties:
    num_spikes:
      type: integer
      default: 5
    spike_positions:
      type: array
      items:
        type: number
      default:
      - 0.1
      - 0.3
      - 0.7
      - 1.3
      - 1.9
    spike_height:
      type: number
      default: 20.0
    spike_width:
      type: number
      default: 0.04
