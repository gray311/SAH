type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to set initial h values. Use analytical constructions to set good
  starting points. Format: h = list of values on [0,2] with integral = 1.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
