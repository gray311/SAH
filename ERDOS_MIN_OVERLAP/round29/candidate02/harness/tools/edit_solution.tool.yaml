type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK''s initial latent space values and/or hyperparameters.


  To seed the optimizer: set initial_latent to a list of 800 floats (the latent values).

  The optimizer will sigmoid-normalize them to get h(x) with integral=1.


  For hyperparameter tuning: adjust num_intervals, base_learning_rate, penalty_strength, num_steps.


  Key: Set ONE change at a time, then evaluate.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
