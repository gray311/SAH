type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters. For refinement: keep num_restarts=1, num_steps=10000-20000
  (fast training).

  For full search: num_restarts=3-5, num_steps=50000-59000.

  For fine-grained: increase num_intervals to 1600.

  For stronger constraint: penalty_strength 60-100.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
