schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].
  
  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).
  
  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).
  
  KEY INSIGHT: The optimal solution is likely a SIMPLE STEP FUNCTION (constant on intervals), not a smooth sigmoid.
  The seed program's gradient-based optimization gets stuck because it starts from smooth initializations.
  
  STRATEGY:
  1. FIRST, USE discrete_step_search to generate step functions with 2-10 intervals (TRUE step functions, not smooth)
  2. Each step function has a fixed shape (e.g., "up" step, "down" step, "up-down" step)
  3. CALL probe_solution on each to get approximate C5 bounds
  4. CALL evaluate_solution on the BEST 1-2 candidates (those with c5_bound < 0.375)
  5. If no success, THEN try the seed's gradient optimization with different seeds
  
  EVALUATE ONLY when c5_bound < 0.375 (combined_score > 1.01)
  Use discrete_step_search to get true step functions, not smooth sigmoids.
skill_description: Generate true step functions (constant on intervals) with 2-10 steps, screen with probe_solution, evaluate top candidates.
  Focus on step function diversity (single step, double step, up-down patterns) with exact integral constraint.
skill_body: |
  # Step-Function Search for Erdos C5
  
  ## Core Principle
  The optimal C5 minimizer is likely a TRUE STEP FUNCTION (constant on intervals), not a smooth sigmoid.
  The seed program's gradient optimization gets stuck because it starts from smooth initializations.
  
  ## Step-by-Step Workflow
  
  1. CALL discrete_step_search(num_steps=5)
     - Generates step functions with 5 intervals
     - Each has precomputed c5_bound via FFT
     - Patterns include: single step up, single step down, up-down, multiple steps
  
  2. SCREEN with probe_solution
     - Run probe on each candidate
     - Keep those with c5_bound < 0.375
  
  3. EVALUATE top 1-2 candidates
     - Call evaluate_solution on best candidates
     - If combined_score > 1.0, finish with summary
     - If combined_score <= 1.0, continue
  
  4. If no improvement, REPEAT with different num_steps (2, 3, 7, 10)
  
  5. Only AFTER exhausting step functions, use gradient optimization
  
  ## Avoid Common Mistakes
  - Do NOT call evaluate_solution on c5_bound > 0.375
  - Do NOT use gradient optimization before trying step functions
  - Do NOT call discrete_step_search more than 2x (budget limited)
  - ALWAYS use probe_solution before full evaluation
tool_descriptions:
  edit_solution: 'Modify EVOLVE-BLOCK parameters for gradient optimization. Only use this AFTER step function search fails.
    Try num_restarts=5-10, num_steps=30000-60000, num_intervals=400-1600.'
  evaluate_solution: Full 59000-step optimization. Returns combined_score = 0.38092303510845016 / c5_bound.
    Higher is better. combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).
  probe_solution: Fast approximate evaluation (500 intervals, analytical c5). Uses probe budget.
    Use probe to find candidates with c5_bound < 0.375, then evaluate them fully.
  finish: Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
new_tools:
  - name: discrete_step_search
    description: |
      Generate true step functions (constant on intervals) for Erdos C5 optimization.
      Each candidate has precomputed c5_bound via FFT (no training needed).
      
      Patterns: 
      - Single step up (0 to 1 at position a)
      - Single step down (1 to 0 at position a)
      - Up-down (two steps)
      - Multi-step (3-10 steps with various shapes)
      
      All functions satisfy integral(h)=1 and h in [0,1].
      
      Use probe_solution to screen. Evaluate candidates with c5_bound < 0.375.
    input_schema:
      type: object
      properties:
        num_steps:
          type: integer
          default: 5
          minimum: 2
          maximum: 10
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          N = args.get("num_steps", 5)
          domain = 2.0
          dx = domain / N
          
          def compute_c5(h_arr):
              h_padded = np.pad(h_arr, (0, N))
              j_padded = np.pad(1.0 - h_arr, (0, N))
              corr = np.fft.ifft(np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))).real
              return np.max(corr * dx)
          
          def normalize_and_clip(h_arr):
              h_norm = h_arr / (np.sum(h_arr) * dx)
              h_norm = np.clip(h_norm, 0.001, 1.0)
              h_norm = h_norm / (np.sum(h_norm) * dx)
              return h_norm
          
          candidates = []
          
          # Pattern 1: Single step up at position 0.5
          h1 = np.zeros(N)
          h1[:int(N*0.5)] = 1.0
          h1 = normalize_and_clip(h1)
          candidates.append({"h": h1.tolist(), "c5_bound": float(compute_c5(h1)), "pattern": "single_up_0.5"})
          
          # Pattern 2: Single step up at position 0.3
          h2 = np.zeros(N)
          h2[:int(N*0.3)] = 1.0
          h2 = normalize_and_clip(h2)
          candidates.append({"h": h2.tolist(), "c5_bound": float(compute_c5(h2)), "pattern": "single_up_0.3"})
          
          # Pattern 3: Single step down at position 0.7
          h3 = np.zeros(N)
          h3[int(N*0.7):] = 1.0
          h3 = normalize_and_clip(h3)
          candidates.append({"h": h3.tolist(), "c5_bound": float(compute_c5(h3)), "pattern": "single_down_0.7"})
          
          # Pattern 4: Up-down (high at [0,a], low at [a,1-a], high at [1-a,1])
          h4 = np.zeros(N)
          h4[:int(N*0.3)] = 1.0
          h4[int(N*0.3):int(N*0.7)] = 0.5
          h4[int(N*0.7):] = 1.0
          h4 = normalize_and_clip(h4)
          candidates.append({"h": h4.tolist(), "c5_bound": float(compute_c5(h4)), "pattern": "up_down"})
          
          # Pattern 5: Multi-step (num_steps intervals with varying heights)
          step_heights = [0.8, 1.0, 0.6, 1.0, 0.9]  # Sum should be 1 when normalized
          h5 = np.zeros(N)
          for i, height in enumerate(step_heights):
              start_idx = int(i * N / len(step_heights))
              end_idx = int((i+1) * N / len(step_heights))
              h5[start_idx:end_idx] = height
          h5 = normalize_and_clip(h5)
          candidates.append({"h": h5.tolist(), "c5_bound": float(compute_c5(h5)), "pattern": f"multi_step_{N}"})
          
          # Pattern 6: Up-down with 3 steps
          h6 = np.zeros(N)
          h6[:int(N*0.25)] = 0.0
          h6[int(N*0.25):int(N*0.5)] = 1.0
          h6[int(N*0.5):int(N*0.75)] = 0.0
          h6[int(N*0.75):] = 1.0
          h6 = normalize_and_clip(h6)
          candidates.append({"h": h6.tolist(), "c5_bound": float(compute_c5(h6)), "pattern": "up_down_3step"})
          
          return {"candidates": candidates, "num_candidates": len(candidates)}
