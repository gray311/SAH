type: tool
name: discrete_step_search
description: "Generate true step functions (constant on intervals) for Erdos C5 optimization.\nEach candidate\
  \ has precomputed c5_bound via FFT (no training needed).\n\nPatterns: \n- Single step up (0 to 1 at\
  \ position a)\n- Single step down (1 to 0 at position a)\n- Up-down (two steps)\n- Multi-step (3-10\
  \ steps with various shapes)\n\nAll functions satisfy integral(h)=1 and h in [0,1].\n\nUse probe_solution\
  \ to screen. Evaluate candidates with c5_bound < 0.375."
input_schema:
  type: object
  properties:
    num_steps:
      type: integer
      default: 5
      minimum: 2
      maximum: 10
