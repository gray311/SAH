type: tool
name: edit_solution
description: Modify EVOLVE-BLOCK parameters for gradient optimization. Only use this AFTER step function
  search fails. Try num_restarts=5-10, num_steps=30000-60000, num_intervals=400-1600.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
