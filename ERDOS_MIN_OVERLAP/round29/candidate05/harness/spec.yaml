schema: h2spec/1.0
system_prompt: |
  Erdos C5: Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx with integral(h)=1.

  CURRENT BEST: c5 <= 0.38092303510845016 (combined_score = 1.0)
  GOAL: Find c5 < 0.38092303510845016 (combined_score > 1.0)

  KEY INSIGHT: The current ErdosOptimizer uses fixed hyperparameters that may be suboptimal. 
  Instead of generating diverse patterns and hoping training improves them, use a COARSE-TO-FINE 
  SEARCH STRATEGY: train on coarse grids (400-800 intervals) first to find general structure, 
  then refine on finer grids (1600-3200). This reduces early training noise and helps find 
  better local optima.

  STRATEGY:
  1. FIRST: Train with coarse discretization (num_intervals=400, num_steps=15000) to find rough h(x)
  2. THEN: Fine-tune with finer discretization (num_intervals=1600, num_steps=45000) 
  3. TRY DIFFERENT INITIALIZATIONS: Use multiple restarts with varied initial h(x) (not just random)
  4. ADAPTIVE HYPERPARAMETERS: If training stalls (no improvement in last 5000 steps), adjust lr or penalty

  EVALUATION: Use probe_solution to screen candidates before full evaluation. Only evaluate when 
  c5_bound < 0.375 (combined_score > 1.01).


  When editing: TEST COARSE-TO-FINE by setting num_intervals=400, num_steps=15000 first. Then refine.
  NEVER jump directly to num_intervals=800 with full budget - coarse search first!


  Hyperparameters to try:
  - num_intervals: 400 (coarse), 800, 1600, 3200 (fine)
  - base_learning_rate: 0.001 (coarse), 0.005, 0.01 (fine)
  - penalty_strength: 30 (coarse), 60, 100 (fine)
  - num_steps: 15000 (coarse), 30000, 45000, 60000 (fine)
  - num_restarts: 5 (more restarts for coarse search)


  Evaluate ONLY when combined_score > 1.01 (c5_bound < 0.375)
skill_description: |
  Coarse-to-fine search for Erdos C5: Train on coarse grids (400 intervals) to find general h(x) structure, 
  then refine on finer grids (1600-3200). Use multiple restarts with varied initializations. 
  Screen with probe_solution, evaluate only promising candidates (c5_bound < 0.375).
skill_body: |
  # Coarse-to-Fine Search for Erdos C5
  
  ## Phase 1: Coarse Search (Find General Structure)
  
  1. EDIT with coarse parameters:
     - num_intervals = 400
     - num_steps = 15000
     - base_learning_rate = 0.001
     - penalty_strength = 30
     - num_restarts = 5
  
  2. RUN training and get initial h(x) from the best result
  
  3. CALL probe_solution on the initial h(x) to check c5_bound
  
  4. If c5_bound < 0.38, PROCEED to Phase 2. Otherwise, try different coarse parameters.
  
  ## Phase 2: Fine-Tuning (Refine the Solution)
  
  1. EDIT with fine parameters:
     - num_intervals = 1600 (or 3200 if you have budget)
     - num_steps = 45000 (or 60000 for more exploration)
     - base_learning_rate = 0.005 (or 0.01 for more exploration)
     - penalty_strength = 60 (or 100 for stronger constraint)
     - num_restarts = 3
  
  2. Use the h(x) from Phase 1 as initialization (by editing to preserve good structure)
  
  3. RUN training with fine parameters
  
  4. CALL probe_solution to screen
  
  5. CALL evaluate_solution if c5_bound < 0.375
  
  ## Phase 3: If Stuck
  
  If no improvement after coarse-to-fine:
  - Try DIFFERENT coarse parameters (lr=0.005, penalty=60)
  - Try DIFFERENT restart strategies (increased diversity in initial h(x))
  - Consider: The current ErdosOptimizer may need fundamentally different approach
  
  ## Key Rules
  - ALWAYS start with coarse search (num_intervals=400) before fine search
  - NEVER jump to fine parameters without coarse search
  - Use probe_solution to screen before full evaluation
  - Only evaluate when c5_bound < 0.375 (combined_score > 1.01)
  - Track best c5_bound across all phases
tool_descriptions:
  edit_solution: |
    Edit hyperparameters for COARSE-TO-FINE SEARCH.
    
    COARSE SEARCH (Phase 1):
      - num_intervals: 400
      - num_steps: 15000
      - base_learning_rate: 0.001
      - penalty_strength: 30
      - num_restarts: 5
    
    FINE TUNING (Phase 2):
      - num_intervals: 1600 (or 3200)
      - num_steps: 45000 (or 60000)
      - base_learning_rate: 0.005 (or 0.01)
      - penalty_strength: 60 (or 100)
      - num_restarts: 3
    
    TESTING: Test coarse parameters FIRST, then refine with fine parameters.
    NEVER jump directly to fine parameters without coarse search!
    
    For single candidate: num_restarts=1, num_steps=15000-45000.
    For diversity: num_restarts=5 for coarse search.
    
    Remember: COARSE-TO-FINE is the key strategy for this task.
    Start coarse, then refine fine.
  evaluate_solution: |
    Full evaluation. Returns combined_score = 0.38092303510845016 / c5_bound.
    
    Higher is better. combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).
    
    Use probe_solution first to filter candidates with c5_bound < 0.375.
    Only evaluate when c5_bound < 0.375 (combined_score > 1.01).
  probe_solution: |
    Fast approximate evaluation (500 intervals, analytical c5).
    
    Uses separate probe budget (typically 30 probes available).
    
    Screen candidates with c5_bound < 0.375 before full evaluation.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 25
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 10
  long_tool_output_max_chars: 10000
new_tools: []
new_skills: []
new_middlewares: []
