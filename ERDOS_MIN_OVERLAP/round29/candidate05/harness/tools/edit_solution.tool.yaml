type: tool
name: edit_solution
description: "Edit hyperparameters for COARSE-TO-FINE SEARCH.\n\nCOARSE SEARCH (Phase 1):\n  - num_intervals:\
  \ 400\n  - num_steps: 15000\n  - base_learning_rate: 0.001\n  - penalty_strength: 30\n  - num_restarts:\
  \ 5\n\nFINE TUNING (Phase 2):\n  - num_intervals: 1600 (or 3200)\n  - num_steps: 45000 (or 60000)\n\
  \  - base_learning_rate: 0.005 (or 0.01)\n  - penalty_strength: 60 (or 100)\n  - num_restarts: 3\n\n\
  TESTING: Test coarse parameters FIRST, then refine with fine parameters.\nNEVER jump directly to fine\
  \ parameters without coarse search!\n\nFor single candidate: num_restarts=1, num_steps=15000-45000.\n\
  For diversity: num_restarts=5 for coarse search.\n\nRemember: COARSE-TO-FINE is the key strategy for\
  \ this task.\nStart coarse, then refine fine."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
