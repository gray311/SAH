type: tool
name: edit_solution
description: "Modify optimizer hyperparameters: num_intervals (400-3200), base_learning_rate (0.001-0.02),\
  \ \npenalty_strength (40-120), num_steps (30000-60000). Only use after structural search fails."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
