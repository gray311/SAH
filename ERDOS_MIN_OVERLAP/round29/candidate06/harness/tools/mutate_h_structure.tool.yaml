type: tool
name: mutate_h_structure
description: 'Generate structurally different step functions by mutating an input h. Operations:

  - shift: move all values left/right by delta

  - split: divide a wide peak region into two narrower peaks

  - merge: combine two nearby peaks

  - add_peak: insert a new narrow peak

  - remove_peak: eliminate a peak region


  All outputs satisfy integral(h)=1 and h in [0,1]. Use probe_solution to screen.'
input_schema:
  type: object
  properties:
    original_h:
      type: array
      items:
        type: number
    mutation_type:
      type: string
      enum:
      - shift
      - split
      - merge
      - add_peak
      - remove_peak
      - random_mixture
    mutation_param:
      type: number
      default: 0.1
  required:
  - original_h
