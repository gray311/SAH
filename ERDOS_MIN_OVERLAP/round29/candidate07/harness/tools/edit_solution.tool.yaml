type: tool
name: edit_solution
description: Modify hyperparameters for faster exploration. Use num_intervals=400-600 for speed, num_restarts=5-7
  for diversity. Try base_learning_rate in [0.001, 0.003, 0.006, 0.01]. Keep num_steps=59000.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
