schema: h2spec/1.0
system_prompt: 'Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].

  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).

  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).

  KEY INSIGHT: The optimizer needs mathematically-informed initializations, not just hyperparameter tuning.

  STRATEGY:

  1. FIRST, USE generate_c5_candidates to create diverse, integral-constrained initializations with known C5 constructions (Golomb rulers, bipartite, triangular, multi-peak).

  2. CALL evaluate_solution directly on each candidate from generate_c5_candidates (no probe needed - these are high-quality initializations).

  3. If combined_score <= 1.0, THEN refine hyperparameters to systematically tune num_intervals, learning_rate, and penalty_strength.

  4. NEVER waste evals on random latents - always use structured, mathematically-informed patterns first.

  5. Use coarse-to-fine refinement: start with num_intervals=200 for faster evaluation, then increase to 800 for final optimization.

  6. Track c5_bound across all candidates and report the best.'
skill_description: Generate mathematically-informed C5 initializations via generate_c5_candidates, evaluate best candidate, then refine hyperparameters if needed. Focus on known constructions (Golomb, bipartite, triangular) with exact integral constraint.
skill_body: '# Erdos C5 Optimization Strategy

## Phase 1: Mathematical Initialization (MOST IMPORTANT)

1. CALL generate_c5_candidates()
   - This generates 10 diverse, integral-constrained initial step functions
   - Uses known C5 constructions: Golomb ruler (4-7 marks), Bipartite (threshold), Triangular (single peak), Multi-peak (2-4 peaks), Gaussian, Uniform
   - All satisfy integral(h)=1 and h in [0,1]
   - Each has num_intervals=200 for faster evaluation

2. EXAMINE the candidates:
   - Call evaluate_solution on ALL candidates (they are high-quality initializations)
   - Track the best combined_score

3. If best combined_score > 1.0, FINISH with the summary

## Phase 2: Hyperparameter Refinement (only if Phase 1 fails)

If all candidates have combined_score <= 1.0:

1. Test different hyperparameters:
   - num_intervals: 400, 800, 1600 (coarse to fine)
   - base_learning_rate: 0.001, 0.005, 0.01
   - penalty_strength: 40, 80, 120
   - num_steps: 30000, 60000

2. For each combination:
   - Set num_restarts=1 for focused search
   - Test ONE hyperparameter at a time
   - Track best result

3. If still no improvement, try num_intervals=3200 for very fine search

## Key Rules

- ALWAYS use generate_c5_candidates FIRST (these are high-quality initializations)
- NEVER call evaluate_solution on random latents
- If stuck, refine hyperparameters systematically
- Track best c5_bound across ALL candidates'
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK hyperparameters systematically.
    
    For single-candidate testing: set num_restarts=1, num_steps=30000-60000.
    
    For coarse-to-fine: start with num_intervals=200, then increase to 400, 800, 1600.
    
    For stronger integral constraint: increase penalty_strength to 80-120.
    
    For exploration: try base_learning_rate in [0.001, 0.005, 0.01, 0.02].
    
    For multi-restart: keep num_restarts=3-5 with diverse seeds.
    
    Key: Test ONE hyperparameter change at a time to understand impact.
  evaluate_solution: |
    Full optimization. Returns combined_score = 0.38092303510845016 / c5_bound.
    
    Higher is better. combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).
    
    Use generate_c5_candidates to get high-quality initializations before calling this.
  probe_solution: |
    Fast approximate evaluation (500 intervals, analytical c5). Uses probe budget.
    
    Approximate but much cheaper than full eval. Good for screening many candidates.
    
    Use probe to find candidates with c5_bound < 0.382, then evaluate them fully.
    
    Budget: separate from eval budget, typically 30 probes available.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
new_tools:
  - name: generate_c5_candidates
    description: |
      Generate 10 diverse, integral-constrained initial step functions for Erdos C5 optimization using known mathematical constructions.
      
      Candidates: Golomb ruler (4, 5, 6 marks at optimal spacing), Bipartite (thresholds at 0.3, 0.4, 0.5, 0.6), Triangular (centered at 0.5), Multi-peak (2, 3, 4 peaks at optimal locations), Gaussian (centered), Uniform (constant).
      
      All functions satisfy integral(h)=1 and h in [0,1].
      
      Each candidate uses num_intervals=200 for faster evaluation.
      
      Use evaluate_solution on each candidate. Best result determines next step.
    input_schema:
      type: object
      properties:
        temperature:
          type: number
          default: 1.0
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          N = 200
          domain = 2.0
          dx = domain / N
          
          def compute_c5(h_arr):
              h_padded = np.pad(h_arr, (0, N))
              j_padded = np.pad(1.0 - h_arr, (0, N))
              corr = np.fft.ifft(np.fft.fft(h_padded) * np.conj(np.fft.fft(j_padded))).real
              return float(np.max(corr * dx))
          
          def normalize_to_integral(h_arr):
              current_int = np.sum(h_arr) * dx
              if current_int > 0:
                  h_arr = h_arr / current_int
              return h_arr
          
          candidates = []
          
          # Golomb ruler patterns (4, 5, 6 marks)
          for num_marks in [4, 5, 6]:
              marks = np.linspace(0.2, 1.8, num_marks)
              h_arr = np.zeros(N)
              for mark in marks:
                  width = N * 0.25
                  h_arr += 4.0 * np.exp(-((np.arange(N) - int(mark * N)) / width)**2)
              h_arr = normalize_to_integral(h_arr)
              c5 = compute_c5(h_arr)
              candidates.append({"h": h_arr.tolist(), "c5_bound": c5, "pattern": f"golomb_{num_marks}_marks"})
          
          # Bipartite patterns (different thresholds)
          for threshold in [0.3, 0.4, 0.5, 0.6]:
              h_arr = np.zeros(N)
              h_arr[:int(N * threshold)] = 2.0
              h_arr[int(N * threshold):] = -1.0
              h_arr = normalize_to_integral(h_arr)
              c5 = compute_c5(h_arr)
              candidates.append({"h": h_arr.tolist(), "c5_bound": c5, "pattern": f"bipartite_a={threshold}"})
          
          # Triangular pattern (single peak at center)
          h_arr = np.zeros(N)
          peak_width = N * 0.2
          h_arr[N//2 - int(peak_width/2):N//2 + int(peak_width/2)] = 15.0
          h_arr = normalize_to_integral(h_arr)
          c5 = compute_c5(h_arr)
          candidates.append({"h": h_arr.tolist(), "c5_bound": c5, "pattern": "triangular_centered"})
          
          # Multi-peak patterns
          for num_peaks in [2, 3, 4]:
              centers = np.linspace(0.3, 1.7, num_peaks)
              h_arr = np.zeros(N)
              for center in centers:
                  width = N * 0.15
                  h_arr += 8.0 * np.exp(-((np.arange(N) - int(center * N)) / width)**2)
              h_arr = normalize_to_integral(h_arr)
              c5 = compute_c5(h_arr)
              candidates.append({"h": h_arr.tolist(), "c5_bound": c5, "pattern": f"multi_{num_peaks}_peaks"})
          
          # Gaussian pattern
          h_arr = np.exp(-((np.arange(N) - N/2) / (N * 0.15))**2)
          h_arr = normalize_to_integral(h_arr)
          c5 = compute_c5(h_arr)
          candidates.append({"h": h_arr.tolist(), "c5_bound": c5, "pattern": "gaussian_centered"})
          
          # Uniform pattern
          h_arr = np.ones(N) * 0.5
          h_arr = normalize_to_integral(h_arr)
          c5 = compute_c5(h_arr)
          candidates.append({"h": h_arr.tolist(), "c5_bound": c5, "pattern": "uniform"})
          
          return {"candidates": candidates, "num_candidates": 10}
