type: tool
name: generate_c5_candidates
description: 'Generate 10 diverse, integral-constrained initial step functions for Erdos C5 optimization
  using known mathematical constructions.


  Candidates: Golomb ruler (4, 5, 6 marks at optimal spacing), Bipartite (thresholds at 0.3, 0.4, 0.5,
  0.6), Triangular (centered at 0.5), Multi-peak (2, 3, 4 peaks at optimal locations), Gaussian (centered),
  Uniform (constant).


  All functions satisfy integral(h)=1 and h in [0,1].


  Each candidate uses num_intervals=200 for faster evaluation.


  Use evaluate_solution on each candidate. Best result determines next step.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 1.0
