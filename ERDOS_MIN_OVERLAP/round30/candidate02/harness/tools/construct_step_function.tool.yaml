type: tool
name: construct_step_function
description: Construct a step function h with specified architecture (num_steps, step_locations, step_values)
  that satisfies integral(h)=1 exactly. Each step function has a precomputed c5_bound via FFT. Returns
  the step function parameters and its approximate C5 bound. Use this to systematically explore different
  architectural choices for step functions rather than relying on the seed's random pattern generation.
input_schema:
  type: object
  properties:
    num_steps:
      type: integer
      description: Number of steps in the step function (1-20 recommended). Lower num_steps means simpler
        function.
      default: 5
    step_locations:
      type: array
      description: The x-coordinates where steps occur in [0, 2]. Should have num_steps + 1 values including
        endpoints.
      items:
        type: number
      default:
      - 0.0
      - 0.5
      - 1.0
      - 1.5
      - 2.0
    temperature:
      type: number
      description: Sampling temperature for initial step value exploration
      default: 0.5
