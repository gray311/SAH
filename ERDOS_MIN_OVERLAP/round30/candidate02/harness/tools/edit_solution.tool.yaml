type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters systematically.\n\nFor single-candidate testing: set
  num_restarts=1, num_steps=30000-60000.\n\nFor diversity: keep num_restarts=3-5.\n\nFor fine-grained
  search: increase num_intervals to 1600 or 3200.\n\nFor stronger integral constraint: increase penalty_strength
  to 80-120.\n\nFor exploration: try base_learning_rate in [0.001, 0.005, 0.01, 0.02].\n\nKey: Test ONE
  hyperparameter change at a time.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
