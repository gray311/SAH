type: tool
name: edit_solution
description: 'Apply a code diff to the EVOLVE-BLOCK. Use best_pattern_to_code to generate the edit, then
  apply it. For single-candidate testing: set num_restarts=1, num_steps=30000-60000. For diversity: keep
  num_restarts=3-5. For fine-grained search: increase num_intervals to 1600 or 3200. For stronger integral
  constraint: increase penalty_strength to 80-120.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
