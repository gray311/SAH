type: tool
name: edit_solution
description: 'Modify hyperparameters. For local_optimize refinement: keep num_intervals=800.

  For global search: increase num_intervals to 1600. For stronger integral constraint: penalty_strength=80-120.

  Test ONE change at a time.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
