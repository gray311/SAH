type: tool
name: analyze_pattern_effect
description: 'Compute approximate c5_bound for a perturbed seed pattern.

  Takes pattern type (golomb, bipartite, triangular, multi_peak, random)

  and specific parameters (marks for Golomb, threshold for bipartite, etc.).

  Returns estimated c5_bound using FFT on 500 intervals (cheap probe).

  Use this to rapidly screen pattern variations before full evaluation.'
input_schema:
  type: object
  properties:
    pattern_type:
      type: string
      enum:
      - golomb
      - bipartite
      - triangular
      - multi_peak
      - random
    marks:
      type: array
      items:
        type: number
    threshold:
      type: number
    peak_width:
      type: number
    num_peaks:
      type: integer
    distribution:
      type: string
