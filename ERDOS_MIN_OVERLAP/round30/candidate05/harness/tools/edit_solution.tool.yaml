type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK hyperparameters ONE at a time.


  For pattern perturbation approach:

  - Keep num_restarts=3-5 (to try multiple initializations per pattern)

  - Test num_intervals in [400, 800, 1600]

  - Test penalty_strength in [40, 61, 100, 150]

  - Test base_learning_rate in [0.001, 0.004, 0.01]


  For single pattern testing:

  - Set num_restarts=1, num_steps=30000-60000


  Key: Test ONE parameter change per edit to understand its effect.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
