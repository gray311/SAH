type: tool
name: explore_neighbors
description: 'Make targeted, systematic edits to a candidate step function to explore local neighborhoods.

  Use this after initial pattern generation when you have a promising candidate but want to refine it.

  Strategies: (1) Shift peak positions by +/- dx, (2) Split a peak into two smaller peaks,

  (3) Merge adjacent peaks, (4) Adjust threshold positions in bipartite patterns, (5) Add/remove small
  peaks.

  Always normalize to maintain integral=1 and clip to [0,1]. Use probe_solution to screen variants.'
input_schema:
  type: object
  properties:
    strategy:
      type: string
      description: 'Edit strategy: ''shift_peak'', ''split_peak'', ''merge_peaks'', ''adjust_threshold'',
        ''add_peak'', ''remove_peak'''
      default: shift_peak
    magnitude:
      type: number
      description: How aggressively to edit (0.1-0.5). Smaller = more conservative.
      default: 0.2
    num_variants:
      type: integer
      description: Number of variants to generate (2-10).
      default: 5
