schema: h2spec/1.0
system_prompt: 'Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].

Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).

GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).

KEY INSIGHT: The optimizer needs DIVERSE TRAINING RUNS with varied seeds and hyperparameters, not just pattern generation.

STRATEGY:

1. FIRST, VARY TRAINING HYPERPARAMETERS (num_intervals, learning_rate, penalty_strength) across multiple runs

2. Use DIFFERENT SEEDS (seed_start) for each run to get diverse initializations from the optimizer''s internal patterns

3. Use LOWER num_intervals (200-400) for faster evaluation to explore more candidates within budget

4. Call probe_solution on multiple hyperparameter configurations before full evaluation

5. ONLY evaluate configs with c5_bound < 0.375 (combined_score > 1.01)

Avoid: Don''t waste evals on similar hyperparameters. Use seed diversity to get fundamentally different functions.'
skill_description: Tune hyperparameters and seeds for JAX-based optimizer. Use low num_intervals for speed. Call probe on multiple configs, evaluate best. Focus on seed diversity and penalty_strength variations.
skill_body: '# Erdos C5 Optimization: Hyperparameter & Seed Tuning\n\n## Core Strategy\nThe optimizer has built-in diverse initializations (15+ patterns). Use DIFFERENT SEEDS and HYPERPARAMETERS to activate them.\n\n## Step-by-Step Workflow\n\n1. VARY NUM_INTERVALS (200, 400, 800)\n   - Lower intervals = faster evaluation = more exploration\n   - Try 200 first for quick screening\n\n2. VARY PENALTY_STRENGTH (40, 80, 120)\n   - Affects integral constraint enforcement\n   - Test multiple values across different intervals\n\n3. USE DIFFERENT SEEDS (seed_start)\n   - Each seed gives different initialization from _get_best_initialization\n   - Run 3-5 different seeds per hyperparameter config\n\n4. SCREEN WITH probe_solution\n   - Run probe on multiple configs\n   - Keep those with c5_bound < 0.375\n\n5. EVALUATE TOP 2-3 candidates\n   - Full training (59000 steps)\n   - If combined_score > 1.0, finish\n\n6. If no improvement, try:\n   - Different base_learning_rate (0.001, 0.005, 0.01)\n   - Different num_steps (30000, 60000)\n\n## Key Rules\n- Always vary seed_start across runs\n- Use low num_intervals (200-400) for screening\n- NEVER evaluate without probing first\n- Track which (interval, penalty, seed) combo worked best'
tool_descriptions:
  edit_solution: 'Modify training hyperparameters for JAX optimizer.\n\nFor rapid screening: set num_intervals=200-400, num_steps=30000, num_restarts=3.\n\nFor quality: num_intervals=800-1600, num_steps=60000, penalty_strength=40-120.\n\nAlways vary seed_start across runs to get different initializations from _get_best_initialization.\n\nTry: num_intervals in [200, 400, 800], penalty_strength in [40, 80, 120], seed_start in [0, 1, 2, 3, 4].\n\nVary ONE hyperparameter at a time to understand impact.'
  evaluate_solution: Full 59000-step optimization with JAX/FFT evaluator. Returns combined_score = 0.38092303510845016 / c5_bound.\n\nHigher is better. combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).\n\nUse probe_solution first to filter configs with c5_bound < 0.375.
  probe_solution: 'Fast approximate evaluation (500 intervals, analytical c5). Uses probe budget.\n\nApproximate but much cheaper than full eval. Good for screening many hyperparameter configs.\n\nUse probe to find configs with c5_bound < 0.375, then evaluate them fully.\n\nBudget: separate from eval budget, typically 30 probes available.'
  finish: Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 0.6
  top_p: 0.85
  top_k: 15
  max_tokens: 8000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 6
  long_tool_output_max_chars: 6000
new_tools: []
new_skills: []
new_middlewares: []
