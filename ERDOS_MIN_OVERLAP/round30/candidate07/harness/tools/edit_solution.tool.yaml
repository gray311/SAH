type: tool
name: edit_solution
description: 'Modify training hyperparameters for JAX optimizer.\n\nFor rapid screening: set num_intervals=200-400,
  num_steps=30000, num_restarts=3.\n\nFor quality: num_intervals=800-1600, num_steps=60000, penalty_strength=40-120.\n\nAlways
  vary seed_start across runs to get different initializations from _get_best_initialization.\n\nTry:
  num_intervals in [200, 400, 800], penalty_strength in [40, 80, 120], seed_start in [0, 1, 2, 3, 4].\n\nVary
  ONE hyperparameter at a time to understand impact.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
