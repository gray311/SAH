description: 'Fast approximate evaluation (500 intervals, analytical c5). Uses probe budget.\n\nApproximate
  but much cheaper than full eval. Good for screening many hyperparameter configs.\n\nUse probe to find
  configs with c5_bound < 0.375, then evaluate them fully.\n\nBudget: separate from eval budget, typically
  30 probes available.'
