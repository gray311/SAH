type: tool
name: mutate_best_pattern
description: 'Take the best pattern candidate and create 3 refined variants using domain-specific mutations.


  Mutations:

  - Peak width adjustment: ±10% of original width

  - Peak center shift: ±0.1 units in [0,2]

  - Amplitude modification: ±0.2 from original


  All variants satisfy integral(h)=1 and h in [0,1].

  Each variant has precomputed c5_bound via FFT (instant, no training).


  Call this AFTER identifying the best pattern from search_patterns.

  Use probe_solution to screen the 3 variants, then evaluate the best.'
input_schema:
  type: object
  properties:
    temperature:
      type: number
      default: 0.5
    mutation_magnitude:
      type: number
      default: 0.1
