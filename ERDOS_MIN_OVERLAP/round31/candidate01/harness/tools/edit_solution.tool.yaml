type: tool
name: edit_solution
description: Modify the step_function_generator parameters. Use step_positions to specify where jumps
  occur, and step_heights to set the values. The generator ensures integral=1.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
