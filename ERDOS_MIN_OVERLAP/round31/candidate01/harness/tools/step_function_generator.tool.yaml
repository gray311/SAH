type: tool
name: step_function_generator
description: 'Generate a valid step function h: [0,2]->[0,1] with integral(h)=1 exactly.

  Creates diverse patterns: bipartite (single threshold), multi-modal (multiple peaks), or sparse (few
  steps).

  Each function satisfies the integral constraint by construction.

  Use this to create candidates from scratch, bypassing the seed''s broken optimizer.'
input_schema:
  type: object
  properties:
    pattern_type:
      type: string
      enum:
      - bipartite
      - multi_modal
      - sparse
    threshold_or_peaks:
      type: array
      items:
        type: number
    n_steps:
      type: integer
      minimum: 2
