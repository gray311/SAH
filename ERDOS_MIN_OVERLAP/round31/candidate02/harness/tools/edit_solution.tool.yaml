type: tool
name: edit_solution
description: 'Modify the h array. Use targeted_h_optimizer to generate mutations, then edit_solution to
  apply them.

  For spread_peaks: create multiple narrow peaks at positions that reduce overlap at problematic k.

  For asymmetric: create a step function with different thresholds for x < 1 and x > 1.

  Maintain integral(h)=1 and h in [0,1].'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
