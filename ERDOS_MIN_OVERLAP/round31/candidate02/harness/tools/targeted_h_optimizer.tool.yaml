type: tool
name: targeted_h_optimizer
description: 'Generate a new h array optimized to reduce overlap at specific k values.

  Uses strategies: spread_peaks (multiple separated narrow peaks), asymmetric (left/right threshold),
  bimodal (two peaks).

  Preserves integral(h)=1 and h in [0,1].'
input_schema:
  type: object
  properties:
    problematic_k:
      type: array
      items:
        type: integer
    strategy:
      type: string
      enum:
      - spread_peaks
      - asymmetric
      - bimodal
  default:
    problematic_k: []
    strategy: spread_peaks
