type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to adjust targeted_mutations parameters.

  For structure preservation: set preserve_structure=true to maintain region boundaries.

  For mutation strategy: try "bipartite" for single threshold, "tri-modal" for 3 peaks, or "uniform-noise"
  for small random changes.

  For integral constraint: use penalty_strength=80-120 to enforce integral(h)=1.

  For h range: use penalty_strength=50-80 for h in [0,1] constraint.

  Key: Generate DIVERSE structures that are CONSTRUCTION-GUARANTEED to satisfy constraints.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
