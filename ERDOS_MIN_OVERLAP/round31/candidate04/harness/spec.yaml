schema: h2spec/1.0
system_prompt: |
  Erdos C5 problem: Find step function h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  CONSTRAINTS: integral(h)=1, h in [0,1].
  
  CURRENT BEST: c5_bound = 0.38092303510845016 (combined_score=1.0)
  GOAL: Find c5_bound < 0.38092303510845016 (combined_score > 1.0)
  
  SEARCH STRATEGY:
  1. Edit the EVOLVE-BLOCK to replace the multi-restart optimization with simpler gradient descent
  2. Key hyperparameter changes:
     - num_intervals: 800 -> 200 (faster evaluation)
     - base_learning_rate: 0.004 -> 0.001 (more stable)
     - num_steps: 120000 -> 50000 (focus on quality)
     - penalty_strength: 61.0 -> 30.0 (less constraint)
     - num_restarts: 3 -> 5 (more trials per eval)
  3. Use gradient descent on sigmoid-transformed latent vector
  4. Each restart uses different random seed and hyperparameters
  5. Return best c5_bound across all restarts
  
  TOOL USAGE:
  - edit_solution: Apply the hyperparameter changes above
  - evaluate_solution: Check if combined_score > 1.0
  - probe_solution: Optional fast screening (c5_bound < 0.375)
skill_description: Replace multi-restart optimization with simpler gradient descent and more restarts.
skill_body: "# Simple Gradient Descent for Erdos C5\n\n## Strategy\nMake targeted hyperparameter changes to enable more diverse restarts.\n\n## Required Changes\n1. num_intervals: 800 -> 200 (faster, sufficient resolution)\n2. base_learning_rate: 0.004 -> 0.001 (more stable)\n3. num_steps: 120000 -> 50000 (focus on quality)\n4. penalty_strength: 61.0 -> 30.0 (less constraint, more exploration)\n5. num_restarts: 3 -> 5 (more trials)\n\n## Process\n1. Find the Hyperparameters dataclass in the EVOLVE-BLOCK\n2. Replace each value with the new value above using SEARCH/REPLACE\n3. Ensure the optimizer loop uses updated parameters\n4. Edit and evaluate\n\n## Why This Works\n- More restarts (5 vs 3) increases chance of finding good initialization\n- Lower learning rate avoids divergence\n- Fewer steps but more restarts trades speed for diversity\n- Lower penalty allows optimizer to explore more freely"
sampling:
  temperature: 0.3
  top_p: 0.9
  top_k: 10
  max_tokens: 4000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 5000
tool_descriptions:
  edit_solution: |
    Replace hyperparameters in the Hyperparameters dataclass:
    - num_intervals: 800 -> 200
    - base_learning_rate: 0.004 -> 0.001
    - num_steps: 120000 -> 50000
    - penalty_strength: 61.0 -> 30.0
    - num_restarts: 3 -> 5
    
    Make SEARCH/REPLACE edits to each field.
  evaluate_solution: |
    Full 59000-step optimization with 5 restarts. Returns combined_score = 0.38092303510845016 / c5_bound.
    Higher > 1.0 means new record. Use probe first if available to screen candidates with c5_bound < 0.375.
  probe_solution: |
    Fast approximate evaluation (500 intervals). Uses probe budget. Screen candidates with c5_bound < 0.375 before full eval.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
