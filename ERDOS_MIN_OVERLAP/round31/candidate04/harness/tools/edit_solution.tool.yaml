type: tool
name: edit_solution
description: 'Replace hyperparameters in the Hyperparameters dataclass:

  - num_intervals: 800 -> 200

  - base_learning_rate: 0.004 -> 0.001

  - num_steps: 120000 -> 50000

  - penalty_strength: 61.0 -> 30.0

  - num_restarts: 3 -> 5


  Make SEARCH/REPLACE edits to each field.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
