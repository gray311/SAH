type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to use mutation_generator output.

  Replace the h array generation with a call to mutation_generator, then extract the returned h values.

  Ensure integral(h)=1 and h in [0,1].'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
