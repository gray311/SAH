type: tool
name: mutation_generator
description: 'Generate concrete candidate functions for the Erdos C5 problem.


  mutation_type options:

  - "bipartite": Single threshold h(x)=1 if x<th else 0. Adjust threshold to satisfy integral(h)=1.

  - "multi_modal": 2-3 peaks at specified locations. Heights and widths tuned for integral=1.

  - "spread_peaks": Many narrow peaks spread across [0,2].


  Each mutation preserves h in [0,1] and integral(h)=1 (or is invalid).

  Use this to create diverse, structurally different candidates.'
input_schema:
  type: object
  properties:
    mutation_type:
      type: string
      enum:
      - bipartite
      - multi_modal
      - spread_peaks
    params:
      type: object
      properties:
        threshold:
          type: number
        centers:
          type: array
          items:
            type: number
        num_peaks:
          type: integer
    num_intervals:
      type: integer
