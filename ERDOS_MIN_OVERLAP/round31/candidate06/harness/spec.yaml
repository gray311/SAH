schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap (C5): Find h: [0,2]->[0,1] step function minimizing max_k integral h(x)(1-h(x+k))dx.
  
  CONSTRAINTS: integral(h)=1 exactly; h values in [0,1].
  
  Current best: C5 <= 0.38092303510845016 (combined_score = 1.00001).
  GOAL: Find h with combined_score > 1.0.
  
  STRATEGY: Diversity-first search with constraint satisfaction.
  
  1. Generate diverse step function candidates using generate_candidates (at least 5-7 different structural types).
  2. Ensure each candidate satisfies: values in [0,1] and integral = 1 (use sigmoid + scaling).
  3. Call probe_solution on each candidate to screen for c5_bound < 0.381.
  4. Call evaluate_solution on the 2-3 best probe candidates.
  5. If no improvement after 2-3 rounds, try different candidate generation strategies.
  
  KEY: The seed program uses 800 intervals with sigmoid activation. Your mutations must preserve the program structure but change the h array values to create valid step functions with integral=1.
skill_description: |
  Generate diverse step function candidates with integral=1 constraint. Use sigmoid(latent) scaling to ensure values in [0,1]. Try multiple structural patterns: bipartite, multimodal, piecewise constant, and random with constraint enforcement.
skill_body: |
  # Diversity-First Strategy for Erdos C5
  
  ## Step 1: Generate Diverse Candidates
  
  CALL generate_candidates to create 5-7 different step function structures:
  - Bipartite: single threshold at a fraction of the domain
  - Trimodal: three peaks separated by ~2/5 of domain each
  - Piecewise: 3-4 segments with different heights
  - Golomb-like: sparse peaks at specific locations
  - Random-constrained: random latent, scaled to integral=1
  
  ## Step 2: Probe Screening
  
  For each candidate, CALL probe_solution to get approximate c5_bound.
  Keep candidates with c5_bound < 0.381 (about 10-15% of candidates).
  
  ## Step 3: Full Evaluation
  
  CALL evaluate_solution on the best 2-3 probe candidates.
  If any achieves combined_score > 1.0, CALL finish.
  
  ## Step 4: Iterate
  
  If no improvement, repeat Step 1 with different structural patterns.
  
  ## Critical Rules
  - Always use generate_candidates to create VALID candidates (integral=1, values in [0,1])
  - Use probe to screen before full evaluation
  - Evaluate only candidates with c5_bound < 0.381
  - Don't tune hyperparameters until you find viable candidate structures
tool_descriptions:
  edit_solution: |
    Replace the EVOLVE-BLOCK to set new h array values from generate_candidates.
    Keep all other program structure intact (class definitions, methods, imports).
    The h array should be a numpy array of 800 floats in [0,1] with integral exactly 1.
  evaluate_solution: |
    Full optimization run. Returns combined_score = 0.38092303510845016 / c5_bound.
    combined_score > 1.0 means new record (c5_bound < 0.38092303510845016).
  probe_solution: |
    Fast approximate evaluation (500 intervals, analytical c5).
    Approximate but cheap. Use to screen many candidates.
    Keep candidates with c5_bound < 0.381 for full evaluation.
  finish: |
    Submit when combined_score > 1.0.
sampling:
  temperature: 1.1
  top_p: 0.9
  top_k: 50
  max_tokens: 16000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
new_tools:
  - name: generate_candidates
    description: |
      Generate multiple diverse step function candidates for the Erdos C5 problem.
      Each candidate is a valid h array (values in [0,1], integral=1) with a different structural pattern.
      
      Generate at least 5 candidates with these patterns:
      1. Bipartite: h(x) = sigmoid(k1*x + k2) with scaling to integral=1
      2. Trimodal: three peaks at domain positions
      3. Piecewise-3: three segments with different heights
      4. Golomb-like: sparse peaks at specific locations
      5. Random-constrained: random latent, sigmoid, scale to integral=1
      
      Each candidate must be a numpy array of 800 floats.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          import math
          
          N = 800
          domain = 2.0
          dx = domain / N
          domain_vals = np.linspace(0, domain, N)
          
          candidates = []
          
          # Pattern 1: Bipartite (single threshold)
          thresh = 0.7
          latent = np.where(domain_vals < thresh, 3.0, -3.0)
          latent = latent + 0.5 * np.random.randn(N)
          h1 = 1.0 / (1.0 + np.exp(-latent / 5.0))
          h1 = h1 * 4.0 * dx  # scale to integral ~ 1
          h1 = h1 / (np.sum(h1) * dx)  # normalize
          candidates.append(h1)
          
          # Pattern 2: Trimodal (three peaks)
          centers = [0.5, 1.0, 1.5]
          latent2 = np.zeros(N)
          for c in centers:
              mask = np.abs(domain_vals - c) < 0.12
              latent2[mask] = 4.0
          latent2 -= 2.0
          h2 = 1.0 / (1.0 + np.exp(-latent2 / 5.0))
          h2 = h2 * 4.0 * dx
          h2 = h2 / (np.sum(h2) * dx)
          candidates.append(h2)
          
          # Pattern 3: Piecewise-3
          latent3 = np.zeros(N)
          seg1 = np.where(domain_vals < 0.66, 3.5, 0.0)
          seg2 = np.where((domain_vals >= 0.66) & (domain_vals < 1.33), 3.5, 0.0)
          seg3 = np.where(domain_vals >= 1.33, 3.5, 0.0)
          latent3 = seg1 + seg2 + seg3
          latent3 -= 1.5
          h3 = 1.0 / (1.0 + np.exp(-latent3 / 5.0))
          h3 = h3 * 4.0 * dx
          h3 = h3 / (np.sum(h3) * dx)
          candidates.append(h3)
          
          # Pattern 4: Golomb-like (sparse peaks)
          marks = [0.0, 0.4, 0.8, 1.2, 1.6]
          latent4 = np.zeros(N)
          for m in marks:
              mask = np.abs(domain_vals - m) < 0.1
              latent4[mask] = 4.0
          latent4 -= 2.5
          h4 = 1.0 / (1.0 + np.exp(-latent4 / 5.0))
          h4 = h4 * 4.0 * dx
          h4 = h4 / (np.sum(h4) * dx)
          candidates.append(h4)
          
          # Pattern 5: Random with constraint
          np.random.seed(42)
          latent5 = np.random.randn(N) * 2.0
          h5 = 1.0 / (1.0 + np.exp(-latent5 / 5.0))
          h5 = h5 * 4.0 * dx
          h5 = h5 / (np.sum(h5) * dx)
          candidates.append(h5)
          
          return {"candidates": [c.tolist() for c in candidates]}
new_skills:
  - name: diversity-first-search
    description: |
      Use generate_candidates to create diverse step functions, probe to screen, then evaluate the best.
      Focus on structural diversity rather than hyperparameter tuning.
    body: |
      # Diversity-First Search for Erdos C5
      
      ## Workflow
      
      1. CALL generate_candidates (once per iteration)
         - Creates 5 diverse step function structures
         - Each satisfies: values in [0,1], integral = 1
      
      2. CALL probe_solution on each candidate
         - Screen for c5_bound < 0.381
         - Keep top 3-5 candidates
      
      3. CALL evaluate_solution on best 2-3 candidates
         - If combined_score > 1.0, CALL finish
      
      4. If no improvement, repeat from Step 1
      
      ## Key Points
      
      - generate_candidates handles constraint satisfaction (integral=1, values in [0,1])
      - Use probe to efficiently screen many candidates
      - Focus on structural diversity (bipartite, trimodal, piecewise, etc.)
      - Don't waste evaluations on candidates with c5_bound >= 0.381
new_middlewares:
  - name: candidate_diversity_reminder
    hook: before_model
    description: |
      Remind solver to use generate_candidates for structural diversity before hyperparameter tuning.
    implementation_py: |
      def before_model(hook_input):
          history = hook_input.get("history", [])
          
          # Check if generate_candidates has been called recently
          gen_candidates_count = sum(1 for t in history if "generate_candidates" in str(t.get("tools_used", [])))
          
          if gen_candidates_count == 0:
              return "First call: CALL generate_candidates to create diverse step function candidates before evaluating anything."
          
          if gen_candidates_count >= 1:
              return "You've called generate_candidates. Now CALL probe_solution to screen the candidates."
          
          return None
