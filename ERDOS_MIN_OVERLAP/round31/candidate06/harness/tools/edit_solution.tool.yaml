type: tool
name: edit_solution
description: 'Replace the EVOLVE-BLOCK to set new h array values from generate_candidates.

  Keep all other program structure intact (class definitions, methods, imports).

  The h array should be a numpy array of 800 floats in [0,1] with integral exactly 1.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
