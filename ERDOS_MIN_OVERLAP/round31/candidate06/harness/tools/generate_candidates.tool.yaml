type: tool
name: generate_candidates
description: 'Generate multiple diverse step function candidates for the Erdos C5 problem.

  Each candidate is a valid h array (values in [0,1], integral=1) with a different structural pattern.


  Generate at least 5 candidates with these patterns:

  1. Bipartite: h(x) = sigmoid(k1*x + k2) with scaling to integral=1

  2. Trimodal: three peaks at domain positions

  3. Piecewise-3: three segments with different heights

  4. Golomb-like: sparse peaks at specific locations

  5. Random-constrained: random latent, sigmoid, scale to integral=1


  Each candidate must be a numpy array of 800 floats.'
input_schema:
  type: object
  properties: {}
