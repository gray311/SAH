type: tool
name: edit_solution
description: "Make targeted structural changes to h:\n\nMUTATION TEMPLATES (choose one, don't mix randomly):\\\
  \n\n1. peak_shift: Shift a peak by delta_x (±0.1 to ±0.3)\\\n   Format: {{\"type\": \"peak_shift\",\
  \ \"peak_index\": int, \"delta_x\": float}}\\\n\n2. peak_split: Split peak i into two at positions p1,\
  \ p2 with heights h1, h2\\\n   Format: {{\"type\": \"peak_split\", \"peak_index\": int, \"positions\"\
  : [float, float], \"heights\": [float, float]}}\\\n\n3. plateau_adjust: Change h in [x1, x2] from old_h\
  \ to new_h, adjust elsewhere\\\n   Format: {{\"type\": \"plateau_adjust\", \"start\": float, \"end\"\
  : float, \"old_h\": float, \"new_h\": float}}\\\n\n4. localized_perturb: Add delta_h to h in [x1, x2],\
  \ re-normalize\\\n   Format: {{\"type\": \"localized_perturb\", \"start\": float, \"end\": float, \"\
  delta_h\": float}}\\\n\nIMPORTANT: After any edit, you MUST re-normalize h to ensure:\\n- h values in\
  \ [0,1]\\n- integral(h) = 1.0 exactly\\n\\nUse sigmoid transformation if working with latent, then L2\
  \ projection for integral constraint."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
