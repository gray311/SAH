type: tool
name: probe_solution
description: 'Fast approximate evaluation on 500 intervals (10s vs minutes for full eval).

  Separate budget of ~30 probes available.


  Call probe_solution BEFORE evaluate_solution to screen candidates.

  Keep candidates with c5_bound < 0.382, evaluate only the best 1-2.


  Approximate scores are NOT comparable to full scores, but good for ranking.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
