schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].

  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).

  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).

  STRATEGY:

  1. Call compact_analysis ONCE to get a lightweight summary of current best's correlation structure

  2. Use simple_targeted_mutations to create 3 diverse mutations focusing on reducing overlap

  3. Call probe_solution on each to quickly screen (target c5_bound < 0.385)

  4. Evaluate the best 1-2 candidates fully

  5. If no improvement, try different mutation types: spread_peaks, bipartite, localized

  KEY: Keep outputs short to fit token budget. Only call analysis once. Focus on diversity.

tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK. Use compact_analysis output to guide mutation. Keep edits concise.

  evaluate_solution: |
    Full 59000-step optimization. Returns combined_score. combined_score > 1.0 means c5_bound < 0.38092303510845016.

  probe_solution: |
    Fast approximate evaluation (500 intervals). Target c5_bound < 0.385 to be promising.

sampling:
  temperature: 0.3
  top_p: 0.8
  top_k: 15
  max_tokens: 4000
agent:
  max_iterations: 75
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 5000
new_tools:
  - name: compact_analysis
    description: |
      Lightweight correlation summary. Returns top 3 problematic k values and their overlap scores.
      Call ONCE at start. Kept minimal to save tokens.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import re
          import numpy as np
          h = ctx.get_best_program()
          if not h:
              return {"error": "No program"}
          # Simple extraction
          try:
              # Look for h = array([...])
              m = re.search(r'h\s*=\s*(array|np\.array)\s*\(([^)]+)\)', h, re.IGNORECASE)
              if not m:
                  return {"error": "Could not find h array"}
              h_vals = np.array([float(x.strip()) for x in m.group(2).split(',')])
              N = len(h_vals)
              dx = 2.0 / N
              h_p = np.pad(h_vals, (0, N))
              j_p = np.pad(1.0 - h_vals, (0, N))
              corr = np.fft.ifft(np.fft.fft(h_p) * np.conj(np.fft.fft(j_p))).real
              overlap = corr * dx
              top_idx = np.argsort(overlap)[-3:][::-1]
              return {"top_k": [int(i) for i in top_idx], "overlap": [float(overlap[i]) for i in top_idx]}
          except:
              return {"error": "Analysis failed", "note": "fallback to random mutations"}
  - name: simple_targeted_mutations
    description: |
      Generate 3 diverse mutations targeting specific k values if provided, otherwise random diverse structures.
      Preserves integral constraint.
    input_schema:
      type: object
      properties:
        target_k:
          type: array
          items:
            type: integer
        mutation_type:
          type: string
          enum:
            - spread
            - bipartite
            - localized
    implementation_py: |
      def run(ctx, args):
          import jax
          import jax.numpy as jnp
          import numpy as np
          target_k = args.get("target_k", [])
          mtype = args.get("mutation_type", "spread")
          hypers_str = ctx.get_best_program()
          # Extract num_intervals from seed
          N = 800
          key = jax.random.PRNGKey(42)
          
          def make_pattern(k_list):
              x = jnp.linspace(0, 2, N)
              latent = jnp.zeros(N)
              for k in k_list:
                  latent = latent + jnp.sin(2 * jnp.pi * k * x) * 1.0
              latent = latent + jax.random.normal(key, (N,)) * 0.5
              return latent
          
          if mtype == "bipartite":
              key, subkey = jax.random.split(key)
              x = jnp.linspace(0, 2, N)
              threshold = jax.random.uniform(subkey) + 0.5
              latent = jnp.where(x < threshold, 3.0, -3.0)
          elif mtype == "localized":
              key, subkey = jax.random.split(key)
              center = jax.random.uniform(subkey, minval=0.2, maxval=1.8)
              width = jax.random.uniform(subkey, minval=0.1, maxval=0.3)
              latent = jnp.zeros(N)
              mask = jnp.abs(x - center) < width
              latent = latent.at[mask].set(3.0)
              latent = latent.at[~mask].set(-2.0)
          else:  # spread
              num_peaks = jax.random.randint(key, (1,), 2, 5)[0]
              centers = jnp.linspace(0.2, 1.8, num_peaks)
              latent = jnp.zeros(N)
              for c in centers:
                  latent = latent + jnp.where(jnp.abs(x - c) < 0.15, 3.0, -2.0)
          
          latent = latent + jax.random.normal(key, (N,)) * 0.3
          h = jax.nn.sigmoid(latent)
          j_val = 1.0 - h
          h_p = jnp.pad(h, (0, N))
          j_p = jnp.pad(j_val, (0, N))
          corr = jnp.fft.ifft(jnp.fft.fft(h_p) * jnp.conj(jnp.fft.fft(j_p))).real
          obj = jnp.max(corr * (2.0 / N))
          
          # Clip and normalize
          h = jnp.clip(h, 0.0, 1.0)
          total = jnp.sum(h)
          if total > 0:
              h = h / total
          h = jnp.clip(h, 0.0, 1.0)
          
          return {"h_str": f"array({', '.join([f'{v:.4f}' for v in h[:20]] + ['...'] if len(h) > 20 else [f'{v:.4f}' for v in h]))",
                  "mutation_type": mtype, "target_k": target_k}
new_skills:
  - name: compact-search-strategy
    description: Use compact analysis, generate 3 diverse mutations, probe all, evaluate best. Keep it simple.
    body: |
      # Compact Search for Erdos C5

      ## Step 1: Initial Analysis (ONCE ONLY)
      Call compact_analysis to get top 3 problematic k values.
      Do NOT call again - save tokens.

      ## Step 2: Generate Mutations
      Call simple_targeted_mutations with:
      - mutation_type: "spread" (first try)
      - target_k: [k1, k2, k3] from analysis (or empty if no analysis)

      ## Step 3: Screen with Probes
      Call probe_solution on each mutation (aim for c5_bound < 0.385)

      ## Step 4: Evaluate Best
      Call evaluate_solution on 1-2 best probes

      ## If No Improvement:
      Try mutation_type: "bipartite", then "localized"

      ## Key Rules:
      - Call compact_analysis ONCE at start only
      - Generate 3 mutations, probe all, evaluate best 1-2
      - Keep outputs short to fit token budget
      - Diverse mutation types improve coverage
new_middlewares:
  - name: analysis_once_reminder
    hook: before_model
    description: Remind solver to call compact_analysis only once at start
    implementation_py: |
      def before_model(hook_input):
          history = hook_input.get("history", [])
          calls = [h.get("tools_used", []) for h in history]
          if not calls:
              return "Call compact_analysis ONCE at the very start to get top 3 k values."
          if "compact_analysis" in str(calls):
              compact_count = sum(1 for c in calls if "compact_analysis" in c)
              if compact_count >= 1:
                  return "compact_analysis already called. Now generate mutations with simple_targeted_mutations."
          return None
