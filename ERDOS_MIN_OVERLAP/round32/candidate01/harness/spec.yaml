schema: h2spec/1.0
system_prompt: |
  Erdos C5 Optimization: Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  CONSTRAINT: integral(h) = 1 exactly.
  h values in [0,1].
  
  Current best: C5 <= 0.38092303510845016.
  GOAL: Find h achieving c5_bound < 0.38092303510845016.
  
  STRATEGY:
  1. CALL generate_initial_step_function to create valid h with integral=1
  2. Use generate_correlation_profile to find problematic shifts
  3. Modify h at those shifts using localized edits
  4. Use probe_solution to screen candidates (c5_bound < 0.375)
  
  KEY: Start with VALID initializations. Use generate_initial_step_function.
skill_description: |
  Use generate_initial_step_function to create valid h with integral=1.
skill_body: |
  # Erdos C5 - Valid Initialization Strategy
  
  ## Step 1: Generate Valid Initial h
  1. CALL generate_initial_step_function to get h with integral(h)=1
  2. CALL probe_solution on candidate
  3. CALL evaluate_solution if c5_bound < 0.375
  
  ## Critical Rules
  - ALWAYS start with generate_initial_step_function
  - Ensure integral(h)=1
  - Probe before full evaluation
tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK. Use generate_initial_step_function for valid starts.
  evaluate_solution: |
    Full evaluation. Score > 1.0 means new record.
  probe_solution: |
    Fast approximate evaluation. Use to screen candidates with c5_bound < 0.375.
  finish: |
    Call when combined_score > 1.0.
new_tools:
  - name: generate_initial_step_function
    description: |
      Generate diverse valid step functions h: [0,2]->[0,1] with integral(h)=1 exactly.
      Creates different shapes: bipartite, multi-modal, Golomb-like.
      Call this to get valid starting points.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          import random
          
          num_intervals = 800
          domain = 2.0
          dx = domain / num_intervals
          
          candidates = []
          
          # Type 1: Bipartite
          threshold = np.random.uniform(0.3, 0.7)
          h = np.where(np.linspace(0, 2, num_intervals) < threshold, 1.0, 0.0)
          integral = np.sum(h) * dx
          h = h / (integral / num_intervals)
          h = np.clip(h, 0, 1)
          candidates.append(h)
          
          # Type 2: Two peaks
          peak1 = np.random.uniform(0.2, 0.5)
          peak2 = np.random.uniform(1.5, 1.8)
          width = np.random.uniform(0.1, 0.2)
          h = np.zeros(num_intervals)
          h[np.abs(np.linspace(0, 2, num_intervals) - peak1) < width] = 1.0
          h[np.abs(np.linspace(0, 2, num_intervals) - peak2) < width] = 1.0
          integral = np.sum(h) * dx
          h = h / (integral / num_intervals)
          h = np.clip(h, 0, 1)
          candidates.append(h)
          
          # Type 3: Three peaks
          centers = [np.random.uniform(0.2, 0.4), 
                    np.random.uniform(0.8, 1.0),
                    np.random.uniform(1.4, 1.6)]
          width = np.random.uniform(0.1, 0.15)
          h = np.zeros(num_intervals)
          for c in centers:
              h[np.abs(np.linspace(0, 2, num_intervals) - c) < width] = 1.0
          integral = np.sum(h) * dx
          h = h / (integral / num_intervals)
          h = np.clip(h, 0, 1)
          candidates.append(h)
          
          chosen = random.choice(candidates)
          return {
              "h": chosen.tolist(),
              "num_intervals": num_intervals,
              "integral_check": float(np.sum(chosen) * dx),
              "type": random.choice(["bipartite", "two_peaks", "three_peaks"])
          }
sampling:
  temperature: 0.8
  top_p: 0.9
  top_k: 30
  max_tokens: 12000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 6
  long_tool_output_max_chars: 8000
remove_tools: []
