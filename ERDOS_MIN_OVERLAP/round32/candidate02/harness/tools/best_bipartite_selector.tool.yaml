type: tool
name: best_bipartite_selector
description: 'From a list of bipartite candidates (with their thresholds), select the best ones

  by computing c5_bound for each using a fast approximation.


  This is a METATool that helps the solver decide which bipartite candidates

  are worth evaluating.


  Input: list of (threshold, h_array) pairs, optionally with precomputed probe scores.

  Output: ranked list of candidates, recommendation of which to evaluate.'
input_schema:
  type: object
  properties:
    candidates:
      type: array
      items:
        type: object
        properties:
          threshold:
            type: number
          h:
            type: array
            items:
              type: number
    probe_scores:
      type: array
      items:
        type: number
