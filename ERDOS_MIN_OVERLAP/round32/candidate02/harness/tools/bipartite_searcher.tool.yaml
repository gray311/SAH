type: tool
name: bipartite_searcher
description: 'Generate bipartite (two-level) step function candidates.

  For a threshold t, creates h(x) = 1 if x < t, h(x) = 0 if x >= t.

  The integral constraint integral(h)=1 means t should be ~1.0, but we try t in [0.7, 1.3].


  This is the PRIMARY strategy for Erdos C5: bipartite functions naturally minimize overlap.


  Parameters:

  - num_thresholds: number of thresholds to try (default 10)

  - threshold_range: range [t_min, t_max] for thresholds (default [0.7, 1.3])

  return: list of h arrays, one for each threshold'
input_schema:
  type: object
  properties:
    num_thresholds:
      type: integer
      default: 10
    threshold_range:
      type: object
      properties:
        min:
          type: number
          default: 0.7
        max:
          type: number
          default: 1.3
