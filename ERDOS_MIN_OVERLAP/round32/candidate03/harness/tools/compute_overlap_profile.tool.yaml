type: tool
name: compute_overlap_profile
description: 'Compute the full overlap profile for the current best program.

  Returns overlap values for ALL k shifts from 0 to 799 (for 800 intervals).

  Identifies the k value with maximum overlap and the top 5 problematic shifts.


  This tool evaluates the program directly and returns computational results,

  not source code analysis. Use this to understand which shift k causes the

  worst overlap, then design step functions that minimize overlap at that k.'
input_schema:
  type: object
  properties: {}
