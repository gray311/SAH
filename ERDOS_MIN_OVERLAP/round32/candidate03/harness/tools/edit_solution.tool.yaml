type: tool
name: edit_solution
description: 'Create step functions with narrow separated peaks.


  Structure: h(x) = sum of rectangular pulses

  - Each pulse: 1.0 in [center-width/2, center+width/2], 0.0 elsewhere

  - Sum of widths must equal 1.0 (for integral constraint)

  - Place pulses to minimize overlap at problematic k values


  Example: Two pulses of width 0.25 at x=0.5 and x=1.5

  h = array([1.0]*(50) + [0.0]*(1000) + [1.0]*(50) + [0.0]*(1000))

  (assuming 50 intervals per unit width for 800 total intervals)'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
