type: tool
name: edit_solution
description: 'Modify optimizer to use SIMPLIFIED initializations.


  For bipartite: Set latent = sigmoid(k*(x - a)) with single threshold a.


  For trimodal: Set latent as sum of 3 localized peaks.


  For symmetric: Set latent symmetric around x=1.


  Set penalty_strength=100 to enforce integral(h)=1.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
