schema: h2spec/1.0
system_prompt: |
  Erdos C5 Problem: Find step function h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  CONSTRAINTS: integral(h) = 1 exactly, h values in [0,1].
  
  Current best: C5 <= 0.38092303510845016 (combined_score = 1.00001).
  GOAL: Find h achieving combined_score > 1.0 (c5_bound < 0.380923).
  
  SEARCH STRATEGY:
  
  The seed program uses sophisticated patterns but may be stuck in a local optimum.
  Try these diverse mutation types directly:
  
  1. PEAK_SPACING: Create h with peaks at positions that are NOT multiples of small integers
     (avoid k=0.5, k=1.0 alignments). Try peaks at [0.3, 0.7, 1.3, 1.7] or [0.25, 0.75, 1.25, 1.75].
  
  2. ASYMMETRIC_BIPARTITE: Use threshold at non-symmetric points like x=0.3 or x=0.4
     (current seed uses x=0.5, x=1.0 which may align badly with shifts).
  
  3. MULTI_SCALE: Combine coarse structure with fine ripples. Example:
     Base: threshold at x=0.4; Fine: add small sine wave h(x) += 0.1*sin(10*pi*x)
  
  4. GAP_STRATEGY: Create regions where h=0 (no overlap possible there)
     Pattern: h=1 on [0,0.3] U [1.4, 2.0], h=0 on (0.3, 1.4)
     Normalize to integral=1: h=1 on [0,0.333] U [1.333, 2.0]
  
  5. FREQUENCY_SHIFTED: Use higher frequency base
     h(x) = sigmoid(3*pi*x - 1.5) shifted to have integral=1
  
  For each edit:
  - Ensure integral(h) = 1 exactly (adjust peak widths or values)
  - Keep h in [0,1]
  - Test with probe first if available
  
  Use edit_solution to implement these patterns. Call evaluate_solution when you believe
  you have a promising candidate.
skill_description: Search Erdos C5 with diverse structural mutations including peak_spacing asymmetric_bipartite multi_scale gap_strategy and frequency_shifted. Use probe to screen then evaluate for final scoring.
skill_body: |
  # Erdos C5 - Diverse Structural Search
  
  ## Strategy
  Avoid the seed's patterns which may be locally optimal. Try structurally different functions.
  
  ## Mutation Types to Try
  
  ### 1. Peak Spacing (non-harmonic)
  PEAK POSITIONS that avoid simple fractions:
  - [0.3, 0.7, 1.3, 1.7] (offset from 0.5, 1.0)
  - [0.25, 0.75, 1.25, 1.75]
  - [0.27, 0.54, 0.81, 1.08, 1.35, 1.62, 1.89] (1/4 spacing)
  
  Why: Current seed may be optimized for k=0.5, k=1.0 overlaps. Break this symmetry.
  
  ### 2. Asymmetric Bipartite
  Single threshold at NON-SYMMETRIC points:
  - threshold at x = 0.3: h=1 on [0, 0.3], h=0 on (0.3, 2]
    Scale to integral=1: h=1 on [0, 0.5] (since integral over [0,2] = 2*a = 1 => a=0.5)
    Try a = 0.4, 0.45, 0.35, 0.55
  
  ### 3. Multi-Scale (coarse + fine)
  Base structure + small perturbations:
  - h_base = sigmoid(pairs_step_function)
  - h = h_base + 0.1*sin(8*pi*x)  (high frequency ripple)
  - Ensure h stays in [0,1] by clipping
  
  ### 4. Gap Strategy (zeros allowed)
  Create hard zeros:
  - h(x) = 1 on [0, 0.333] U [1.333, 2.0], 0 elsewhere
    This gives peaks with gaps where overlap is zero
  
  ### 5. Frequency Shifted
  Use higher or different frequency:
  - h(x) = sigmoid(2*pi*x - pi)  (period 1, shifted)
  - h(x) = sigmoid(4*pi*x - 2*pi) (period 0.5, shifted)
  
  ## Implementation Steps
  1. Decide mutation type
  2. Write EVOLVE-BLOCK code implementing h(x)
  3. Ensure integral(h) = 1 (adjust accordingly)
  4. Ensure h in [0,1]
  5. If probe_solution available, call it first
  6. Call evaluate_solution on promising candidates
  7. If combined_score > 1.0, finish()
  
  ## Key Insight
  The seed program's 15 patterns are all variations on similar themes.
  Try fundamentally different structures that the seed hasn't explored.
tool_descriptions:
  edit_solution: |
    Edit the EVOLVE-BLOCK to implement ONE of the diverse mutation strategies:
    - peak_spacing: peaks at non-harmonic positions like [0.3, 0.7, 1.3, 1.7]
    - asymmetric_bipartite: single threshold at x in [0.3, 0.6] (not 0.5)
    - multi_scale: base step + small sine wave perturbation
    - gap_strategy: hard zeros in the middle (h=0 on some intervals)
    - frequency_shifted: higher frequency sigmoid patterns
    
    Ensure: integral(h) = 1, h in [0,1]. Adjust peak widths or number of peaks to satisfy integral constraint.
  evaluate_solution: |
    Full evaluation. combined_score = 0.38092303510845016 / c5_bound.
    combined_score > 1.0 means new record.
    Use probe_solution first to screen candidates.
  probe_solution: |
    Fast approximate evaluation on subsampled data.
    Use this to quickly screen 3-5 candidates before full evaluation.
    Keep candidates with c5_bound < 0.382 for full eval.
  finish: |
    Submit when combined_score > 1.0.
sampling:
  temperature: 1.0
  top_p: 0.8
  top_k: 50
  max_tokens: 16000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 10000
