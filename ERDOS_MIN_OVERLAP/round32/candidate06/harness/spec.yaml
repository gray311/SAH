schema: h2spec/1.0
system_prompt: |
  Erdos C5 problem: Find step function h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  CONSTRAINTS: integral(h) = 1 exactly, h values in [0,1].
  Current best: C5 <= 0.3809 (combined_score = 1.0).
  GOAL: Achieve combined_score > 1.0.
  
  KEY STRATEGY: Use step functions with SEPARATED narrow peaks.
  - The optimal solution likely has 3-5 narrow peaks (delta-like) spread across [0,2]
  - Peaks should be at positions where they don't overlap with shifted versions
  - Try these constructions:
    * 3 equally spaced narrow peaks at positions 0.4, 1.0, 1.6 (width ~0.15 each)
    * 4 equally spaced narrow peaks at 0.3, 0.8, 1.3, 1.8 (width ~0.12 each)
    * 2 peaks at 0.5 and 1.5 (width ~0.2 each)
    * Uniform distribution (single wide plateau from 0 to 2)
    - Use sigmoid activations on sharp latent transitions
  - Start with 4-6 narrow peaks (width 0.1-0.2), then refine
  
  APPROACH:
  1. Modify the EVOLVE-BLOCK to create a step function with NARROW, SEPARATED peaks
  2. Use simple threshold/sigmoid functions to create sharp transitions
  3. Space peaks to minimize overlap at all shifts k
  4. Ensure integral = 1 by adjusting peak heights/widths
  5. Evaluate and iterate
```
skill_description: Create step functions with narrow separated peaks to minimize overlap.
skill_body: |
  # Erdos C5 - Narrow Peak Strategy
  
  ## Core Idea
  The optimal solution uses NARROW, SEPARATED peaks. Wider functions create more overlap with their shifts.
  
  ## Step-by-Step Construction
  
  1. **Choose peak positions**: Pick 3-5 positions spread across [0,2]
     - Examples: [0.4, 1.0, 1.6] or [0.3, 0.8, 1.3, 1.8] or [0.5, 1.5]
     - Spacing should be ~0.5-0.7 to avoid overlap with shifts
  
  2. **Create narrow peaks**: For each position, create a narrow region
     - Use sigmoid: h = 1 / (1 + exp(-10 * (x - peak_pos)))
     - Width should be ~0.1-0.2 (steepness parameter ~5-10)
  
  3. **Scale to integral = 1**: Adjust peak heights so integral(h) = 1
     - If you have N peaks of width w and height H, integral ≈ N * w * H
     - Set H = 1 / (N * w) to get integral = 1
  
  4. **Combine peaks**: Sum the individual peak functions
     - h(x) = sum over i of: sigmoid(-10 * (x - pos_i)) + sigmoid(10 * (x - pos_i))
  
  5. **Evaluate and refine**: Check c5_bound, adjust peak spacing/width
  
  ## Example Code Pattern
  ```python
  def create_step_function(peak_positions, steepness=10.0, width=0.15):
      h = jnp.zeros(N)
      for pos in peak_positions:
          left = jnp.maximum(0, sigmoid(-steepness * (jnp.arange(N) * dx - pos)))
          right = jnp.maximum(0, sigmoid(steepness * (jnp.arange(N) * dx - pos) - width))
          h += left + right
      # Scale to integral = 1
      total_integral = jnp.sum(h) * dx
      h = h / total_integral
      return h
  ```
  
  ## Trial Sequence
  - First: 3 peaks at [0.4, 1.0, 1.6], width=0.15
  - Second: 4 peaks at [0.3, 0.8, 1.3, 1.8], width=0.12
  - Third: 2 peaks at [0.5, 1.5], width=0.2
  - Fourth: Uniform (single plateau)
  - Fifth: Refine best candidate with narrower peaks
tool_descriptions:
  edit_solution: |
    Modify EVOLVE-BLOCK to create step functions with NARROW SEPARATED PEAKS.
    
    Start with a simple construction:
    - 3-5 narrow peaks (width 0.1-0.2) using sigmoid functions
    - Positions: try [0.4, 1.0, 1.6] or [0.3, 0.8, 1.3, 1.8] or [0.5, 1.5]
    - Scale to integral = 1
    
    Example: Replace the complex initialization patterns with a simple narrow-peak constructor.
    - Use sigmoid(steepness * (x - position)) for sharp transitions
    - Steepness ~5-10 for width ~0.1-0.2
    
    Key: Simpler = better. Avoid the 14+ complex patterns that all produce similar wide functions.
  evaluate_solution: |
    Full evaluation. Returns combined_score = 0.380923 / c5_bound.
    combined_score > 1.0 means c5_bound < 0.380923 (new record).
  probe_solution: |
    Fast approximate evaluation. Use to screen multiple peak configurations before full eval.
    Test different numbers of peaks (3, 4, 5) and positions.
  finish: |
    Submit when combined_score > 1.0.
