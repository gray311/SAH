schema: h2spec/1.0
system_prompt: |
  Erdos C5 problem: Find h: [0,2]->[0,1] with integral(h)=1 that minimizes max_k integral h(x)(1-h(x+k))dx.
  
  Current best: c5_bound = 0.38092303510845016 (combined_score = 1.0).
  GOAL: Achieve combined_score > 1.0 (c5_bound < 0.38092303510845016).
  
  STRATEGY: HYPERPARAMETER SEARCH
  
  1. EDIT Hyperparameters in the code directly:
     - Try increasing penalty_strength to 80, 100, 150 (stricter integral constraint)
     - Try decreasing base_learning_rate to 0.001, 0.0005 (more stable optimization)
     - Try increasing num_intervals to 1000, 1500 (finer discretization)
     - Try increasing num_steps to 200000 (more optimization steps)
  
  2. CALL probe_solution on each candidate to check c5_bound quickly (target < 0.382)
  
  3. CALL evaluate_solution only on candidates with c5_bound < 0.382
  
  4. STOP when combined_score > 1.0
  
  KEY: The seed program already has a working optimizer. We need to TUNE its hyperparameters, not rewrite the algorithm from scratch. Focus on EDITING the Hyperparameters class values, not adding new functions.
skill_description: Hyperparameter tuning with varied penalty, learning rate, interval count, and step count.
tool_descriptions:
  edit_solution: |
    Edit the Hyperparameters class in the code. Change values like:
    - penalty_strength: try 80, 100, 120, 150 (higher = stricter integral=1 constraint)
    - base_learning_rate: try 0.001, 0.002, 0.0005 (lower = more stable)
    - num_intervals: try 1000, 1200, 1500 (higher = finer discretization)
    - num_steps: try 180000, 200000 (more = longer optimization)
    
    Edit ONE parameter at a time. Make a complete replacement of the Hyperparameters class.
  evaluate_solution: |
    Full evaluation. Returns combined_score = 0.38092303510845016 / c5_bound.
    combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).
  probe_solution: |
    Fast approximate evaluation. Target c5_bound < 0.382 before full eval.
    Use this to screen hyperparameter candidates cheaply.
sampling:
  temperature: 0.3
  top_p: 0.9
  top_k: 10
  max_tokens: 8000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares: []
