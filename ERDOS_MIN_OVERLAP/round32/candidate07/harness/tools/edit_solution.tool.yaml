type: tool
name: edit_solution
description: 'Edit the Hyperparameters class in the code. Change values like:

  - penalty_strength: try 80, 100, 120, 150 (higher = stricter integral=1 constraint)

  - base_learning_rate: try 0.001, 0.002, 0.0005 (lower = more stable)

  - num_intervals: try 1000, 1200, 1500 (higher = finer discretization)

  - num_steps: try 180000, 200000 (more = longer optimization)


  Edit ONE parameter at a time. Make a complete replacement of the Hyperparameters class.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
