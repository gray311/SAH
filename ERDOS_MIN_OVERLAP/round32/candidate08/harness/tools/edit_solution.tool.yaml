type: tool
name: edit_solution
description: 'Modify Hyperparameters class in EVOLVE-BLOCK.


  Change ONE parameter at a time for systematic search.


  penalty_strength: 80-150 range

  num_intervals: 400-1600 range

  base_learning_rate: 0.001-0.01 range

  num_steps: 40000-200000 range

  num_restarts: 1-10 range


  Use hyperparameter_tuner to suggest which parameter to change.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
