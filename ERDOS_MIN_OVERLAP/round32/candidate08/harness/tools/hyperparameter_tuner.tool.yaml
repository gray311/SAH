type: tool
name: hyperparameter_tuner
description: 'Suggest hyperparameter mutations for Erdos optimizer.

  Analyzes current hyperparameters and suggests which to change next.


  Priorities:

  1. penalty_strength (80-150, especially 100, 120, 140)

  2. num_intervals (400-1600)

  3. base_learning_rate (0.001-0.01)

  4. num_steps (40k-200k)

  5. num_restarts (1-10)


  Use BEFORE editing to get systematic suggestions.'
input_schema:
  type: object
  properties: {}
