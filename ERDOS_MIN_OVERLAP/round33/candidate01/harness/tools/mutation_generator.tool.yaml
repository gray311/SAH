type: tool
name: mutation_generator
description: "Generate ACTUAL edit commands to modify h values to reduce overlap at specific shift k.\n\
  \nThis tool:\n1. Parses the current h array from the program\n2. For each target_shift k, computes which\
  \ h indices contribute most to overlap[k]\n3. Returns specific edit statements (search/replace) that:\n\
  \   - Narrow peaks (reduce overlap at small k)\n   - Shift h locally (disrupt overlap patterns)\n  \
  \ - Flatten h in problematic regions\n\nEach edit preserves integral(h)=1 and keeps h in [0,1].\n\n\
  Use this to turn correlation analysis into CONCRETE edits."
input_schema:
  type: object
  properties:
    target_shifts:
      type: array
      items:
        type: integer
    mutation_type:
      type: string
      enum:
      - narrow_peak
      - shift_local
      - flatten_region
    intensity:
      type: number
      minimum: 0.1
      maximum: 1.0
    width:
      type: number
      minimum: 0.05
      maximum: 0.5
