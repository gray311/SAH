type: tool
name: edit_solution
description: 'Generate a structured step function by calling step_function_generator with a pattern.

  For bipartite: set threshold to optimize overlap.

  For multi_peak: specify number of peaks and their positions.

  For golomb: specify mark positions.


  The generated h will automatically have integral=1 and values in [0,1].


  Then edit the EVOLVE-BLOCK to replace the seed''s random initialization with this h.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
