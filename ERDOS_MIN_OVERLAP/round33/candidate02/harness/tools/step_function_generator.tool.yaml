type: tool
name: step_function_generator
description: 'Generate a structured step function with integral(h) = 1 and h in [0,1].


  Patterns:

  - "bipartite": h(x) = 1 for x < threshold, 0 otherwise. threshold = 0.5 ensures integral=1 over [0,2].

  - "multi_peak": k narrow peaks of equal width and height, positioned to minimize overlap. Total mass
  = 1.

  - "golomb": sparse marks at positions [0, 0.4, 0.8, 1.2, 1.6] or similar Golomb ruler-like positions.


  The function returns h as a numpy array that can be edited into the EVOLVE-BLOCK.'
input_schema:
  type: object
  properties:
    pattern:
      type: string
      enum:
      - bipartite
      - multi_peak
      - golomb
    num_peaks:
      type: integer
      default: 3
    threshold:
      type: number
      default: 0.5
