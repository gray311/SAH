type: tool
name: edit_solution
description: 'Construct a step function from a template (bipartite, tripartite, golomb, peaks).

  The EVOLVE-BLOCK should generate discrete step functions, not latent variables.

  Example: h = np.concatenate([np.ones(100), np.zeros(300)]) for bipartite.

  Ensure integral(h) = 1 (sum(h) * dx = 1).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
