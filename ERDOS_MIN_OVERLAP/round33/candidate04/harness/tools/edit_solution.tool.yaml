type: tool
name: edit_solution
description: "Write a COMPLETELY NEW solver with different architecture from the seed.\n\nARCHITECTURE\
  \ IDEAS:\n- Coarse-to-fine: Optimize with 10-20 intervals first, then refine\n- Explicit plateaus: h\
  \ as sum of rectangular functions with positions and heights as variables\n- Symmetric patterns: h symmetric\
  \ around x=1 or two symmetric peaks\n- Sparse peaks: Only 3-5 narrow peaks at strategic positions\n\n\
  CRITICAL: \n- Preserve: h in [0,1], integral(h)=1, compute c5_bound correctly\n- Change: The search\
  \ algorithm and/or h structure\n- Keep it SIMPLE and TESTABLE\n\nDo NOT just change hyperparameters.\
  \ Write a different solver."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
