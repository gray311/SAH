type: tool
name: construct_step_function
description: 'Generates a complete step function program from a mathematical family.


  Strategies:

  - "threshold": Single step at position p. h(x)=1 for x<p, h(x)=0 for x>=p, scaled to integral=1.

  - "two_threshold": Two steps creating a plateau. h(x)=1 on [0,a] and [b,2], h(x)=0 on [a,b], scaled
  to integral=1.

  - "symmetric": Symmetric step function around x=1.0, e.g., h(x)=1 on [0,a] and [2-a,2].

  - "multi_peak": Multiple narrow peaks separated by zeros.


  The tool generates a COMPLETE Python program with the step function defined, properly normalized.

  This bypasses the need to analyze and perturb - construct better solutions from known families.'
input_schema:
  type: object
  properties:
    strategy:
      type: string
      enum:
      - threshold
      - two_threshold
      - symmetric
      - multi_peak
    position:
      type: number
      description: 'For threshold/two_threshold/symmetric: the key position(s).

        For threshold: cutoff position p in (0,2)

        For two_threshold: two positions a, b in (0,2) with a < b

        For symmetric: half-width a in (0,1)

        For multi_peak: center positions of peaks

        '
