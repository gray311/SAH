type: tool
name: edit_solution
description: 'Not needed for this strategy. Use construct_step_function instead, which generates complete
  programs.


  If you must edit, change only the EVOLVE-BLOCK to modify step positions or heights.

  But prefer construct_step_function which handles this automatically.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
