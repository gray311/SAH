type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to use structured step function patterns.


  To generate a new candidate:

  - Call step_function_generator with pattern_type="bipolar" or "tripolar"

  - Use the returned h_array to replace the current h generation code


  Structure your mutations as:

  1. Generate h from step_function_generator

  2. Normalize to integral=1

  3. Ensure h is in [0,1]


  Example mutation pattern:

  h = np.array([float(x) for x in step_function_generator(pattern_type="tripolar", seed=42)["h_array"].split(",")])

  h = h / (h.sum() * 2.0 / 800)  # Normalize to integral=1'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
