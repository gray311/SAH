type: tool
name: step_function_generator
description: 'Generate diverse step function candidates using mathematical patterns.


  Pattern families:

  1. Bipartite: Single threshold function

  2. Bipolar: Two peaks with specified positions

  3. Tripolar: Three peaks (often symmetric)

  4. Four-modal: Four peaks with controlled spacing

  5. Golomb-inspired: Peaks from Golomb ruler sequences


  Each pattern is normalized to have integral=1 over [0,2].

  This tool generates COMPLETE step functions ready for evaluation.'
input_schema:
  type: object
  properties:
    pattern_type:
      type: string
      enum:
      - bipartite
      - bipolar
      - tripolar
      - four-modal
      - golomb
    seed:
      type: integer
      default: 42
