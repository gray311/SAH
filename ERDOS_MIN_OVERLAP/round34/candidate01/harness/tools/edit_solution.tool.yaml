type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to adjust structure_inspired_mutations parameters.


  For targeting specific shifts: set target_shifts to the problematic k values from correlation_analyzer.


  For mutation strategy: try "spread_peaks" to create multiple separated peaks, or "bipartite" for single
  threshold.


  For integral constraint: increase penalty_strength to 80-120.


  Key: Mutations should be STRUCTURED based on correlation analysis, not random.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
