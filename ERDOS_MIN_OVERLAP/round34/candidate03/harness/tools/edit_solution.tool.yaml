type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to change h(x) definition.\n\nTry DIFFERENT PATTERNS:\n- "uniform":
  h = 0.5\n- "bipartite": h = 1 if x < t else 0 (t=1 for integral=1)\n- "multi_modal": multiple narrow
  peaks, e.g., three peaks of width 1/3\n- "golomb": narrow marks at [0.0, 0.4, 0.8, 1.2, 1.6] with width
  0.2\n- "sinusoidal_peak": peaks at sin(2πx) maxima\n\nConstraints: h in [0,1], integral(h)=1.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
