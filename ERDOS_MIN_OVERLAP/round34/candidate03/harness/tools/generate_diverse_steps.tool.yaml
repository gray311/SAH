type: tool
name: generate_diverse_steps
description: 'Generate diverse step-function candidates for Erdos C5 problem.\n\nThis tool creates H functions
  with different STRUCTURES:\n- "uniform": h=0.5 everywhere\n- "bipartite": single threshold at t=1\n-
  "multi_modal": k narrow peaks with total width=1\n- "golomb": 5 narrow marks at [0,0.4,0.8,1.2,1.6]
  width=0.2 each\n- "sinusoidal": peaks at sin(2πx) maxima\n\nAll candidates have integral(h)=1 and h
  in [0,1].\nUse this to generate initial diverse candidates instead of sigmoid(latent) approach.'
input_schema:
  type: object
  properties:
    num_candidates:
      type: integer
      default: 5
    pattern_types:
      type: array
      items:
        type: string
        enum:
        - uniform
        - bipartite
        - multi_modal
        - golomb
        - sinusoidal
