type: tool
name: edit_solution
description: Edit the program to use a new step function construction. Use the exact formulas above. For
  JAX implementation, use ctx.stage_edit to replace the EVOLVE-BLOCK with your new construction. Ensure
  h values are in [0,1] and integral(h) = 1 exactly. After editing, call probe_solution to check c5_bound
  before evaluating.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
