type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK to implement one of the 7 diverse initialization families:\n  - bipartite:
  h=1 on [0,1], h=0 elsewhere (explicit array of 800 1.0s then 800 0.0s)\n  - dual_peak: two narrow sigmoids
  at 0.2 and 1.8 with sigma=0.08, scale for integral=1\n  - golomb_4peak: four sigmoids at [0.25,0.75,1.25,1.75],
  sigma=0.06, scale\n  - anti_periodic: h=0.5 on [0,0.4] and [1.6,2], h=1 on [0.4,1.6], scale by 0.5\n  -
  piecewise_3: h=1 on [0,0.2], h=0.5 on [0.2,1.8], h=0 on [1.8,2], scale by 0.909\n  - high_low_high:
  h=1 on [0,0.25] and [1.75,2], h=0 in middle, scale\n  - tri_modal: three sigmoids at [0.35,0.95,1.65],
  sigma=0.07, scale\n  \n  For mutations: narrow sigma by 0.8, shift center by +0.12 or -0.12, or add
  small bump.\n  Always re-normalize to ensure integral(h)=1.\n  \n  Key: Use EXPLICIT arrays or formula-based
  code, not random initialization.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
