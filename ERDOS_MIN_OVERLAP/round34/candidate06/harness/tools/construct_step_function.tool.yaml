type: tool
name: construct_step_function
description: 'Generate a step function h: [0,2]->[0,1] with specified structure that satisfies integral(h)=1.


  Structure types:

  - "bipartite": single threshold (h=1 for x<t, h=0 otherwise)

  - "bimodal": two narrow peaks separated by gap

  - "trimodal": three narrow peaks at specified positions

  - "sparse": non-zero on very small total-width intervals


  Returns h as a discretized array with 800 intervals.


  All outputs satisfy: values in [0,1] and integral over [0,2] equals 1.'
input_schema:
  type: object
  properties:
    structure:
      type: string
      enum:
      - bipartite
      - bimodal
      - trimodal
      - sparse
    params:
      type: object
      description: Structure-specific parameters
      properties:
        threshold:
          type: number
          description: For bipartite, threshold t where h=1 for x < t*2
        peak_positions:
          type: array
          items:
            type: number
          description: For multi-modal, positions of peaks in [0,2]
        peak_widths:
          type: array
          items:
            type: number
          description: For multi-modal, widths of each peak (sum must be <= 1)
        total_width:
          type: number
          description: For sparse, total width of non-zero regions (must be <= 1)
  required:
  - structure
  - params
