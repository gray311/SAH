type: tool
name: edit_solution
description: 'Modify the step function construction. Focus on creating structured h functions:

  - Bipartite: single threshold region

  - Multi-modal: 2-4 narrow peaks with gaps

  - Sparse: very small non-zero intervals


  To create multi-modal: define peak positions and widths, ensure sum of widths = 1.

  Example: peaks at [0.3, 1.0, 1.7] with widths [0.15, 0.3, 0.15] -> sum=0.6, scale to 1.


  Always verify the integral constraint (sum of widths for height=1 regions must equal 1).'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
