schema: h2spec/1.0
system_prompt: |
  Erdos C5 minimization: Find step function h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].
  
  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).
  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).
  
  STRATEGY (GREY HYPERPARAMETER SEARCH):
  
  1. The seed program has EVOLVE-BLOCK with Hyperparameters and ErdosOptimizer.
  
  2. Try concrete edits to these hyperparameters:
     - num_intervals: try 400, 600, 1000, 1600, 2000, 4000
     - penalty_strength: try 10, 20, 30, 40, 50, 80, 100, 150
     - base_learning_rate: try 0.001, 0.002, 0.005, 0.01
     - num_steps: try 60000, 90000, 150000, 200000
     - num_restarts: try 5, 10
  
  3. Also try different initialization patterns in _get_best_initialization():
     - Bipartite: h = sigmoid where(x < 0.5, a, -a) for different a
     - Multi-modal: 3-4 narrow peaks at strategic locations
     - Uniform-ish: shifted uniform distributions
  
  4. Use probe_solution to quickly screen candidates (c5_bound < 0.375 is promising)
  5. Only call evaluate_solution on the best 1-2 candidates
  
  6. Keep editing cycles short: 2-3 edits max, then evaluate best.
  
  Key: Direct parameter editing, not abstract analysis.
skill_description: Greedy hyperparameter search editing num_intervals penalty_strength learning_rate num_steps num_restarts and initialization patterns
skill_body: "# Greedy Hyperparameter Search for Erdos C5\n\n## Core Strategy\nEdit the EVOLVE-BLOCK's Hyperparameters and initialization patterns directly.\n\n## Step 1: Parameter Exploration\nTry these hyperparameter combinations:\n\n### num_intervals (resolution):\n- 400, 600, 1000, 1600, 2000, 4000\n- Higher = finer discretization but slower\n- Start with 600-1000\n\n### penalty_strength (integral constraint enforcement):\n- 10, 20, 30, 40, 50, 80, 100, 150\n- Higher = stronger constraint but may hurt optimization\n- Try 30-50 as starting point\n\n### base_learning_rate:\n- 0.001, 0.002, 0.005, 0.01\n- Lower = more stable, higher = faster but unstable\n- Try 0.002-0.005\n\n### num_steps:\n- 60000, 90000, 150000, 200000\n- More steps = better optimization but costs budget\n- Try 90000-150000\n\n### num_restarts:\n- 5, 10, 15\n- More restarts = better global search\n- Try 5-10\n\n## Step 2: Initialization Pattern Variations\nModify _get_best_initialization() to try:\n\n### Bipartite:\nh = sigmoid(latent) where latent = a*x + b\n- Try different slopes and offsets\n- Ensure integral(h) approx 1\n\n### Multi-modal (3-4 peaks):\nh = sum of 3-4 narrow Gaussian-like peaks\n- Peak locations: [0.3, 1.0, 1.7], [0.2, 0.8, 1.2, 1.8]\n- Width: 0.05-0.1\n- Heights: scale to integral = 1\n\n### Uniform-ish:\nh = sigmoid((x - c) / s) - shifted sigmoid\n- Try different centers c in [0.2, 0.5, 0.7, 1.0, 1.3, 1.6]\n- Try different scales s\n\n## Step 3: Greedy Search Loop\n1. Start from seed\n2. Pick ONE parameter to edit (e.g., num_intervals = 600)\n3. Call probe_solution to estimate c5_bound\n4. If c5_bound < 0.375, call evaluate_solution\n5. If improved, use that as new seed and repeat\n6. If no improvement after 2-3 edits, try a different parameter\n\n## Key Rules\n- Edit ONE hyperparameter at a time\n- Use probe_solution to screen\n- Evaluate only promising candidates\n- Keep edits simple and concrete"
tool_descriptions:
  edit_solution: |
    Edit Hyperparameters class or _get_best_initialization() method in EVOLVE-BLOCK.
    
    Hyperparameter edits:
    - num_intervals: 400, 600, 1000, 1600, 2000, 4000
    - penalty_strength: 10, 20, 30, 40, 50, 80, 100, 150
    - base_learning_rate: 0.001, 0.002, 0.005, 0.01
    - num_steps: 60000, 90000, 150000, 200000
    - num_restarts: 5, 10, 15
    
    Initialization edits:
    - Bipartite: h = sigmoid where(x < 0.5, a, -a)
    - Multi-modal: 3-4 narrow peaks at strategic locations
    - Uniform-ish: shifted sigmoid distributions
    
    Edit ONE parameter at a time. Keep changes simple.
  evaluate_solution: |
    Full 59000-step optimization. Returns combined_score = 0.38092303510845016 / c5_bound.
    
    Higher is better. combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).
    
    Only call this after probe_solution shows c5_bound < 0.375.
  probe_solution: |
    Fast approximate evaluation (500 intervals, analytical c5). Uses probe budget.
    
    Approximate but much cheaper than full eval. Good for screening many candidates.
    
    Use probe to find candidates with c5_bound < 0.375, then evaluate them fully.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
  max_tokens: 14000
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 10000
