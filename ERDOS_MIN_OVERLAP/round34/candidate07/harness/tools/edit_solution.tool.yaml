type: tool
name: edit_solution
description: 'Edit Hyperparameters class or _get_best_initialization() method in EVOLVE-BLOCK.


  Hyperparameter edits:

  - num_intervals: 400, 600, 1000, 1600, 2000, 4000

  - penalty_strength: 10, 20, 30, 40, 50, 80, 100, 150

  - base_learning_rate: 0.001, 0.002, 0.005, 0.01

  - num_steps: 60000, 90000, 150000, 200000

  - num_restarts: 5, 10, 15


  Initialization edits:

  - Bipartite: h = sigmoid where(x < 0.5, a, -a)

  - Multi-modal: 3-4 narrow peaks at strategic locations

  - Uniform-ish: shifted sigmoid distributions


  Edit ONE parameter at a time. Keep changes simple.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
