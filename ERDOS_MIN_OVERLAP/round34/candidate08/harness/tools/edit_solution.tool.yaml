type: tool
name: edit_solution
description: 'Edit the EVOLVE-BLOCK to completely replace the latent initialization with an analytic pattern.

  PATTERNS TO TRY: 1. Bipartite: h = sigmoid(10*(x - 0.5)) - single jump at 0.5 2. Multi-modal: h = sigmoid(5*np.sin(3*pi*x))
  - oscillating pattern 3. Golomb-ruler: h = 1 at marks [0, 0.4, 0.8, 1.2, 1.6] with small windows

  HOW TO EDIT: - Find the "best_initialization" method - REPLACE the entire latent construction with ONE
  of the above patterns - Do NOT add small random noise - use clean analytic expressions - Ensure integral(h)
  = 1 (the optimizer will handle normalization)

  DO NOT TOUCH: - num_intervals (keep at 800 or try 400/1600) - learning_rate, penalty_strength, num_steps
  - Only CHANGE the latent initialization pattern'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
