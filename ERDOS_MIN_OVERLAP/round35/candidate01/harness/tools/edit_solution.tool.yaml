type: tool
name: edit_solution
description: 'Modify the program to use a DIRECT step function definition instead of sigmoid latent space.

  To create a bipartite step: - Set h as a piecewise constant: h = 1 for x in [0, 0.5], h = 0 for x in
  [0.5, 2] - Use np.piecewise or direct indexing

  To create tri-partite: - h = 1 on [0, a], h = 0 on [a, b], h = 1 on [b, 2] - Ensure (a - 0) + (2 - b)
  = 1

  Parameters to vary: transition points a, b, plateau positions.

  Example edit: Replace the sigmoid+latent approach with direct np.piecewise construction.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
