type: tool
name: step_function_builder
description: "Directly construct step functions with specified plateau patterns.\n\nUse this to create\
  \ h with binary values (0 or 1) satisfying integral(h)=1.\n\nAvailable pattern types:\n- \"bipartite_left\"\
  : h=1 on [0, 0.5], h=0 on [0.5, 2]\n- \"bipartite_right\": h=0 on [0, 0.5], h=1 on [0.5, 2]  \n- \"\
  centered\": h=1 on [c-0.5, c+0.5] for chosen center c\n- \"two_plateaus_left\": h=1 on [0,a] U [b,2]\
  \ where a+(2-b)=1\n- \"alternating\": h=1 on multiple small intervals totaling length 1\n\nThe tool\
  \ generates complete EVOLVE-BLOCK code replacing the sigmoid approach."
input_schema:
  type: object
  properties:
    pattern:
      type: string
      enum:
      - bipartite_left
      - bipartite_right
      - centered
      - two_plateaus_left
      - alternating
    parameters:
      type: object
      description: Additional parameters (e.g., center position, plateau lengths)
      properties: {}
