type: tool
name: search_step_functions
description: 'Generate diverse step function candidates with integral(h) = 1 exactly.

  Creates binary arrays (0 or 1) on [0,2] with exactly 1.0 total measure.


  Strategy options:

  - uniform_k_widths: N evenly spaced intervals, each with value 0 or 1, exactly N_ON intervals = 1.0

  - clustered_peaks: Concentrate ON intervals in specific regions

  - alternating: Short on/off patterns


  Use parameter "strategy" to choose generation mode. Call this ONCE at start to generate diverse initializations.'
input_schema:
  type: object
  properties:
    strategy:
      type: string
      enum:
      - uniform_k_widths
      - clustered_peaks
      - alternating
    num_samples:
      type: integer
      default: 5
    num_on_intervals:
      type: integer
      default: 400
