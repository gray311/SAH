type: tool
name: generate_step_function_template
description: 'Generate a ready-to-use h array with integral=1 and h in [0,1].

  Templates: bipartite (single threshold), two_peak, three_peak,

  golomb (maximally separated peaks), broad_plateau.

  Returns JSON with h_values array.

  Call to generate diverse initial step functions.'
input_schema:
  type: object
  properties:
    template_type:
      type: string
      enum:
      - bipartite
      - two_peak
      - three_peak
      - golomb
      - broad_plateau
    num_intervals:
      type: integer
      default: 800
    seed:
      type: integer
      default: 42
