schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.

  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].

  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).

  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).

  SEARCH STRATEGY (CRITICAL - FOLLOW STEP BY STEP):

  1. GENERATE DIVERSE INITIAL PATTERNS:
     a. Bipartite (threshold at x=a for a in [0.25, 0.5, 0.75, 1.0, 1.25, 1.5])
     b. Multi-modal (3-4 narrow peaks at different positions)
     c. Golomb ruler-like (marks at 0.0, 0.4, 0.8, 1.2, 1.6 with width 0.12)
     d. Uniform with perturbations
     e. Sinusoidal-based (sin/cos combinations)

  2. FOR EACH PATTERN:
     - Normalize to satisfy integral(h) = 1 exactly
     - Clamp h values to [0,1]
     - CALL probe_solution to get approximate c5_bound
     - Keep only patterns with c5_bound < 0.385

  3. RANK PROBED PATTERNS BY c5_bound
     - Select top 3 patterns
     - CALL evaluate_solution on each
     - If any achieves combined_score > 1.0, finish immediately

  4. IF NO PATTERN WORKS (all evaluations fail):
     - Try small targeted perturbations on the seed pattern
     - Focus on regions where correlation_analyzer identifies high overlap
     - Use structure_inspired_mutations with target_shifts from analysis

  5. NEVER TUNE hyperparameters before testing diverse patterns

  KEY INSIGHT: The seed pattern likely has a specific structure that can be improved by systematic exploration, not random parameter tuning.
skill_description: |
  Generate diverse step function patterns (bipartite, multi-modal, Golomb-like), probe them cheaply, evaluate the best. Do random hyperparameter tuning only after exhausting pattern-based approaches.
skill_body: |
  # Erdos C5 - Pattern Exploration Strategy

  ## Phase 1: Generate Diverse Patterns

  Create 10-15 diverse initial step functions:

  ### Bipartite Patterns
  For threshold values a = 0.25, 0.33, 0.4, 0.5, 0.6, 0.75, 0.8, 0.9, 1.0, 1.25, 1.5:
  h(x) = 1.0 if x < a, else 0.0
  Then scale to ensure integral = 1.

  ### Multi-modal Patterns (3 peaks)
  For peak centers in [(0.2, 0.8, 1.6), (0.3, 0.9, 1.7), (0.25, 0.75, 1.5), (0.35, 0.85, 1.65)]:
  h(x) = sum of Gaussian-like bumps at each center, clamped to [0,1]
  Normalize to integral = 1.

  ### Golomb Ruler Pattern
  h(x) = 4.0 for x in [0.0-0.12, 0.4-0.52, 0.8-0.92, 1.2-1.32, 1.6-1.72], 0 elsewhere
  Scale to integral = 1.

  ### Sinusoidal Patterns
  h(x) = sigmoid(a*sin(2*pi*x/b) + c) where (a,b,c) vary
  Ensure integral = 1 by scaling.

  ## Phase 2: Probe and Filter

  1. For EACH pattern:
     - Call probe_solution
     - Record approximate c5_bound
     - Keep patterns with c5_bound < 0.385

  2. Sort kept patterns by c5_bound (ascending)

  3. Select TOP 3 patterns

  ## Phase 3: Full Evaluation

  1. For each of the top 3 patterns:
     - Call evaluate_solution
     - Record combined_score

  2. If ANY combined_score > 1.0:
     - Call finish with summary of best pattern

  3. If NONE work:
     - Proceed to Phase 4 (targeted perturbations)

  ## Phase 4: Targeted Perturbations (Only if Phase 3 fails)

  1. If seed program is still best:
     - Call correlation_analyzer to find problematic k values
     - Call structure_inspired_mutations with target_shifts=[problematic k]
     - Generate 3-5 mutations
     - Probe each, evaluate best 1-2

  ## Critical Rules
  - ALWAYS generate diverse patterns FIRST
  - NEVER tune hyperparameters before testing patterns
  - Use probe to screen, evaluate to confirm
  - Stop as soon as combined_score > 1.0
tool_descriptions:
  edit_solution: |
    Edit EVOLVE-BLOCK to implement a specific pattern.

    Pattern types to implement:
    - bipartite(a): h(x)=1 if x<a else 0, scaled to integral=1
    - gaussian_peaks(centers, widths): sum of Gaussians at given centers
    - golomb(marks): 1 at marks±width, 0 elsewhere, scaled
    - sinusoidal(a,b,c): sigmoid(a*sin(2*pi*x/b)+c), scaled

    After editing, call probe_solution to check feasibility.

    Key: integral(h) must be exactly 1, h in [0,1] for all x.
  evaluate_solution: |
    Full optimization with 59000 steps. Returns combined_score.

    combined_score = 0.38092303510845016 / c5_bound.
    combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).

    Only call this after probe_solution confirms c5_bound < 0.385.
  probe_solution: |
    Fast approximate evaluation (500 intervals). Returns c5_bound.

    Use to screen multiple pattern candidates quickly.
    Keep candidates with c5_bound < 0.385 for full evaluation.
  finish: |
    Call finish when combined_score > 1.0.

    Include in summary:
    - Best c5_bound found
    - Pattern type that achieved it
    - Key insight about what worked
sampling:
  temperature: 1.1
  top_p: 0.9
  top_k: 30
  max_tokens: 16000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 10000
new_tools: []
new_skills: []
new_middlewares: []
