schema: h2spec/1.0
system_prompt: |
  Erdos C5 problem: Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  Constraints: integral(h)=1 exactly, h in [0,1].
  
  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).
  Goal: combined_score > 1.0 (c5_bound < 0.38092303510845016).
  
  STRATEGY:
  1. Create structurally different h functions using edit_solution
  2. Types to try: bipartite threshold, multi-peak (3-5 separated), piecewise constant, Gaussian
  3. For each: probe_solution first (target c5 < 0.380), then evaluate_solution
  4. Preserve class structure, focus on function form not hyperparameters
  5. Finish when combined_score > 1.0
skill_description: |
  Create diverse structural mutations (bipartite, multi-peak, step, Gaussian) using edit_solution.
  Screen with probe_solution before full evaluation.
skill_body: |
  Available tools: edit_solution, evaluate_solution, probe_solution, finish.
  
  Step 1: Read seed - ErdosOptimizer with _get_best_initialization (15+ sigmoid patterns),
           _compute_c5_bound (FFT correlation).
  
  Step 2: Create 4 mutation types:
    (A) Bipartite: h = sigmoid(10*(t-x)) for threshold t
    (B) Multi-peak: 3-5 narrow peaks at x0,x1,x2 separated by 0.3-0.4
    (C) Step-function: piecewise constant with 3-5 steps, values in [0,1]
    (D) Gaussian: h = sigmoid(-5*(x-center)^2) + offset
  
  Step 3: For each mutation:
    - Call probe_solution (keep if c5_bound < 0.380)
    - Call evaluate_solution on promising candidates
  
  Step 4: Avoid just tuning hyperparameters - change function form entirely.
  
  Key insight: seed uses sigmoid(latent) framework - break out with binary-ish,
  multi-modal, or piecewise functions.
tool_descriptions:
  edit_solution: |
    Edit EVOLVE-BLOCK with new function forms. Try bipartite threshold, 3-5 separated peaks,
    piecewise constant steps, or Gaussian from center. Preserve ErdosOptimizer class.
    Focus on FUNCTION STRUCTURE, not hyperparameters.
  evaluate_solution: |
    Full optimization. combined_score = 0.38092303510845016 / c5_bound.
    Score > 1.0 means new record.
  probe_solution: |
    Fast approximate evaluation. Separate budget. Screen mutations - target c5_bound < 0.380.
  finish: |
    Submit when combined_score > 1.0.
sampling:
  temperature: 0.9
  top_p: 0.98
  top_k: 30
  max_tokens: 16000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 8
  long_tool_output_max_chars: 10000
