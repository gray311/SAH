type: tool
name: edit_solution
description: 'Edit EVOLVE-BLOCK with new function forms. Try bipartite threshold, 3-5 separated peaks,

  piecewise constant steps, or Gaussian from center. Preserve ErdosOptimizer class.

  Focus on FUNCTION STRUCTURE, not hyperparameters.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
