schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap C5: Optimize h: [0,2]->[0,1] to minimize max_k integral h(x)(1-h(x+k))dx.
  Constraints: integral(h)=1, h in [0,1]. Current best C5=0.38092303510845016.
  GOAL: Achieve c5_bound < 0.38092303510845016 (combined_score > 1.0).
  
  METHOD: Use probe_solution AGGRESSIVELY. The seed has 800 intervals + 120k steps (slow).
  Strategy: 
  1) Generate 5-10 sparse step functions (5-10 non-zero intervals) - SIMPLER than seed.
  2) Probe EACH with probe_solution (fast, 500 intervals).
  3) Keep only candidates with c5_bound < 0.381.
  4) Evaluate best 1-2 with evaluate_solution.
  
  Sparse patterns to try:
  - 2 narrow peaks separated by >=1.0
  - 3 narrow peaks
  - Alternating pulses with long gaps
  - Single wide peak
  
  Always probe BEFORE evaluating. Seed is overcomplicated; simpler is better.
sampling:
  temperature: 0.9
  top_p: 0.99
  top_k: 50
  max_tokens: 16384
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 8000
new_tools:
- name: generate_sparse_candidates
  description: |
    Generate 5 sparse step functions with 2-5 narrow peaks, integral equals 1. Each has values in 0 to 1 only, h in [0,1]. Patterns include: 2 peaks separated by 1.0 or more, 3 peaks, asymmetric distribution, single wide peak. Use these to probe cheaply before full evaluation.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import numpy as np
        N = 800
        domain = 2.0
        dx = domain / N
        
        cand1 = np.zeros(N)
        cand1[0:4] = 1.0
        cand1[361:365] = 1.0
        cand1 = cand1 * (1.0 / (8 * dx))
        
        cand2 = np.zeros(N)
        cand2[0:3] = 1.0
        cand2[400:403] = 1.0
        cand2[797:800] = 1.0
        cand2 = cand2 * (1.0 / (9 * dx))
        
        cand3 = np.zeros(N)
        cand3[0:5] = 1.0
        cand3[600:605] = 1.0
        cand3 = cand3 * (1.0 / (10 * dx))
        
        cand4 = np.zeros(N)
        cand4[200:400] = 1.0
        cand4 = cand4 * (1.0 / (200 * dx))
        
        cand5 = np.zeros(N)
        cand5[0] = 1.0
        cand5[300] = 1.0
        cand5[400] = 1.0
        cand5[500] = 1.0
        cand5[700] = 1.0
        cand5 = cand5 * (1.0 / (5 * dx))
        
        return {"cand1": cand1, "cand2": cand2, "cand3": cand3, "cand4": cand4, "cand5": cand5, "note": "Sparse step functions with integral equals 1"}
