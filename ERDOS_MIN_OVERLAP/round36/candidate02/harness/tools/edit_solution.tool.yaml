type: tool
name: edit_solution
description: 'Modify the step function template or hyperparameters.


  To change template structure:

  - Edit the h assignment to create different shapes (single peak, dual peaks, boundary-concentrated,
  etc.)

  - Adjust the thresholds or peak positions


  To change hyperparameters:

  - Modify num_intervals, penalty_strength, num_steps, base_learning_rate in Hyperparameters

  - Try extreme values: num_intervals=256 or 2048, penalty_strength=40 or 120, num_steps=60000 or 200000


  Key: Change the TEMPLATE SHAPE first, then tune hyperparameters secondarily.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
