type: tool
name: generate_step_templates
description: 'Generate diverse step function templates with different structures.


  Creates syntactically valid Python code for h(x) with these patterns:

  - bipartite: single threshold at position t

  - dual_peaks: two narrow peaks at positions a, b

  - tri_modal: three narrow peaks

  - boundary_concentrated: peaks near 0 or 2

  - ruler_like: peaks at positions that minimize mutual overlap


  Each template is:

  - A complete, valid assignment h = jnp.where(...) or sum of rectangles

  - Normalized to have integral(h)=1 over [0,2]

  - Clipped to [0,1] range

  - Ready for immediate optimization


  Call this ONCE to get 8 different template structures to try.'
input_schema:
  type: object
  properties: {}
