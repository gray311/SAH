schema: h2spec/1.0
system_prompt: |
  Erdos minimum overlap problem (C5): Find h: [0,2]->[0,1] minimizing max_k integral h(x)(1-h(x+k))dx.
  
  CONSTRAINT: integral(h) = 1 exactly. h values in [0,1].
  
  Current best: C5 <= 0.38092303510845016 (combined_score = 1.0).
  
  GOAL: Find h achieving c5_bound < 0.38092303510845016 (combined_score > 1.0).
  
  STRATEGY:
  
  1. FIRST, generate valid step functions using generate_bipartite_step or generate_multimodal_step
     - Bipartite: single threshold at position t in [0,2], h(x) = 1 if x < t else 0
     - The threshold t must satisfy: t * 1 + (2-t) * 0 = 1, so t = 1.0
     - But we can have multiple thresholds: sum of (width_i * height_i) = 1
  
  2. Use generate_bipartite_step to create a threshold function at t=1.0 (single peak)
     - This is mathematically guaranteed to satisfy integral(h) = 1
     - Then refine this solution
  
  3. Identify high-overlap shifts using evaluate_solution
  4. Create mutations to reduce overlap at those specific k values
  
  5. Use probe_solution to screen candidates before full evaluation
  
  6. Only evaluate when c5_bound < 0.375
  
  KEY INSIGHT: Start with analytically valid step functions (bipartite, multimodal) rather than
  trying to mutate complex neural network-like solutions. Simple geometric shapes often beat
  complex patterns for this integral minimization problem.
  
new_tools:
- name: generate_bipartite_step
  description: |
    Generate a bipartite step function h: [0,2]->[0,1] that satisfies integral(h)=1 exactly.
    
    A bipartite step function has the form:
      h(x) = 1 for x in [0, t1], 
            v1 for x in [t1, t2], 
            v2 for x in [t2, t2+delta], ...
    
    The parameters (thresholds, heights, widths) are generated such that the integral equals 1.
    
    This tool creates mathematically valid candidates from scratch, avoiding parsing issues
    with existing programs. Call this when you need to explore new solution structures.
    
    For a simple single-peak bipartite: h(x) = 1 for x in [0,1], h(x) = 0 otherwise.
    Integral = 1*1 + (2-1)*0 = 1. ✓
    
    For multi-level: adjust heights and widths to maintain integral=1.
  input_schema:
    type: object
    properties:
      num_levels:
        type: integer
        default: 2
      style:
        type: string
        enum: ["single_peak", "two_peaks", "plateau", "step_down"]
  implementation_py: |
    def run(ctx, args):
        import numpy as np
        
        num_levels = args.get("num_levels", 2)
        style = args.get("style", "single_peak")
        
        domain = 2.0
        t = np.linspace(0, domain, num_levels + 1)
        widths = t[1:] - t[:-1]
        
        # Ensure widths are positive and sum to domain
        widths = widths / widths.sum() * domain
        
        # Generate heights based on style
        if style == "single_peak":
            heights = np.array([1.0, 0.0])
            if num_levels > 2:
                heights = np.concatenate([[1.0], [0.0] * (num_levels - 1)])
        elif style == "two_peaks":
            heights = np.array([0.5, 1.0, 0.5, 0.0])
            if num_levels == 2:
                heights = np.array([1.0, 0.5])
            elif num_levels == 3:
                heights = np.array([0.5, 1.0, 0.5])
        elif style == "plateau":
            heights = np.array([0.5, 1.0, 1.0, 0.0])
            if num_levels == 2:
                heights = np.array([0.5, 1.0])
            elif num_levels == 3:
                heights = np.array([0.5, 1.0, 0.5])
        elif style == "step_down":
            heights = np.array([1.0, 0.5, 0.0])
            if num_levels == 2:
                heights = np.array([1.0, 0.5])
        
        integral = np.sum(widths * heights)
        
        if integral != 1.0 and integral > 0:
            heights = heights * (1.0 / integral)
            heights = np.clip(heights, 0.0, 1.0)
        
        integral = np.sum(widths * np.clip(heights, 0, 1))
        heights = heights * (1.0 / integral) if integral > 0 else np.ones(num_levels) / num_levels
        heights = np.clip(heights, 0.0, 1.0)
        
        N = 800
        x = np.linspace(0, domain, N)
        
        if style == "single_peak":
            h = np.where(x < 1.0, 1.0, 0.0)
        elif style == "two_peaks":
            h = np.zeros(N)
            h[x < 0.5] = 0.5
            h[(x >= 0.5) & (x < 1.5)] = 1.0
            h[x >= 1.5] = 0.5
        elif style == "plateau":
            h = np.zeros(N)
            h[x < 0.5] = 0.5
            h[(x >= 0.5) & (x < 1.5)] = 1.0
            h[x >= 1.5] = 0.5
        elif style == "step_down":
            h = np.zeros(N)
            h[x < 0.5] = 1.0
            h[(x >= 0.5) & (x < 1.0)] = 0.5
            h[x >= 1.0] = 0.0
        else:
            h = np.where(x < 1.0, 1.0, 0.0)
        
        integral_h = np.trapz(h, x)
        if integral_h > 0:
            h = h * (1.0 / integral_h)
            h = np.clip(h, 0.0, 1.0)
        
        return {
            "h_array": h.astype(str).tolist(),
            "num_levels": num_levels,
            "style": style,
            "integral_check": float(integral_h),
            "note": f"Generated {style} bipartite step function with integral={integral_h:.6f}"
        }

- name: generate_multimodal_step
  description: |
    Generate multimodal step functions with multiple peaks separated to reduce overlap.
    
    For the Erdos C5 problem, spreading peaks apart can reduce max_k overlap.
    This tool creates functions with peaks at user-specified positions.
    
    Example: peaks at [0.4, 1.0, 1.6] with heights adjusted to satisfy integral=1.
    
    This complements generate_bipartite_step by exploring more complex geometric structures.
  input_schema:
    type: object
    properties:
      peak_positions:
        type: array
        items:
          type: number
        minItems: 2
        maxItems: 5
      peak_heights:
        type: array
        items:
          type: number
        minItems: 1
        maxItems: 5
  implementation_py: |
    def run(ctx, args):
        import numpy as np
        
        peak_positions = args.get("peak_positions", [0.4, 1.0, 1.6])
        peak_heights = args.get("peak_heights", [1.0, 1.0, 1.0])
        
        domain = 2.0
        N = 800
        x = np.linspace(0, domain, N)
        
        # Create Gaussian-like peaks
        sigma = 0.15
        h = np.zeros(N)
        for pos, height in zip(peak_positions, peak_heights):
            h += height * np.exp(-((x - pos) ** 2) / (2 * sigma ** 2))
        
        # Ensure values in [0,1]
        h = np.clip(h, 0.0, 1.0)
        
        # Calculate integral
        integral_h = np.trapz(h, x)
        
        # Scale to satisfy integral=1
        if integral_h > 0:
            h = h * (1.0 / integral_h)
            h = np.clip(h, 0.0, 1.0)
        
        return {
            "h_array": h.astype(str).tolist(),
            "peak_positions": [float(p) for p in peak_positions],
            "peak_heights": [float(h) for h in peak_heights],
            "integral_check": float(np.trapz(h, x)),
            "note": f"Generated {len(peak_positions)}-peak multimodal function"
        }

skill_description: |
  Use generate_bipartite_step or generate_multimodal_step to create valid step functions
  from scratch, then refine them. Always start with analytically valid candidates rather than
  mutating complex existing programs.
  
  Bipartite functions (single threshold at t=1.0) are mathematically guaranteed to satisfy
  integral(h)=1. Multimodal functions with separated peaks can reduce overlap at specific k values.
  
  Strategy: Generate diverse step function templates -> evaluate -> pick best -> refine.

skill_body: |
  # Erdos C5 - Step Function Generation Strategy
  
  ## Phase 1: Generate Valid Step Functions
  
  1. CALL generate_bipartite_step with different styles:
     - style="single_peak": Creates h(x)=1 for x in [0,1], 0 otherwise
     - style="two_peaks": Two symmetric peaks at [0.5, 1.0]
     - style="plateau": Flat top in the middle
     - style="step_down": Decreasing steps from 1 to 0
  
  2. CALL generate_multimodal_step with peak_positions=[0.4, 1.0, 1.6]
     - Three peaks spread across [0,2] to reduce overlap
     - This can be better than single/bipartite for C5 minimization
  
  3. Examine the generated h arrays and their integral checks
  
  ## Phase 2: Evaluate and Refine
  
  1. CALL evaluate_solution on the best generated candidate
  2. If combined_score <= 1.0, generate new variants:
     - Modify peak positions (try [0.25, 1.0, 1.75] instead of [0.4, 1.0, 1.6])
     - Adjust peak heights (try [0.8, 1.0, 0.8] instead of [1.0, 1.0, 1.0])
     - Add/remove peaks
  
  3. Use probe_solution to screen new variants before full evaluation
  
  ## Phase 3: Targeted Improvements
  
  If the seed optimizer already has a program:
  1. Analyze its structure
  2. Generate step functions that are structurally different
  3. Compare and keep the best
  
  ## Key Rules
  - ALWAYS start with step function GENERATION, not mutation
  - Ensure integral(h) = 1 before evaluation
  - Keep h values in [0,1]
  - Multi-peak functions often beat single-peak for C5
  - Try peak positions that are NOT symmetric if single peak fails

tool_descriptions:
  edit_solution: |
    Modify the EVOLVE-BLOCK to adjust parameters in generate_bipartite_step or generate_multimodal_step.
    For generate_bipartite_step:
    - Change num_levels to create more or fewer segments
    - Change style to try different geometric patterns
    For generate_multimodal_step:
    - Move peak_positions closer together or farther apart
    - Adjust peak_heights to create asymmetric patterns
    Generate fundamentally different function shapes, not just tweak hyperparameters.
  evaluate_solution: |
    Full evaluation returning combined_score = 0.38092303510845016 / c5_bound.
    Higher is better. combined_score > 1.0 means c5_bound < 0.38092303510845016 (new record).
    Call this ONCE per promising candidate generated by generate_bipartite_step or generate_multimodal_step.
  probe_solution: |
    Fast approximate evaluation. Use this to screen multiple step function variants before calling evaluate_solution.
    Budget: separate from eval budget, typically 30 probes available.
    Use probe to find candidates with c5_bound < 0.385 before spending full evaluations.
  finish: |
    Submit when combined_score > 1.0 (c5_bound < 0.38092303510845016).
    Summary should note which step function style (bipartite/multimodal) achieved the best score.

sampling:
  temperature: 0.8
  top_p: 0.9
  top_k: 15
  max_tokens: 12000
agent:
  max_iterations: 80
middleware:
  budget_reminder_from_left: 6
  long_tool_output_max_chars: 8000
new_tools: []
new_skills: []
new_middlewares: []
