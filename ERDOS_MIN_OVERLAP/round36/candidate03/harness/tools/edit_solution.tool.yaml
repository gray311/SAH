type: tool
name: edit_solution
description: 'Modify the EVOLVE-BLOCK to adjust parameters in generate_bipartite_step or generate_multimodal_step.

  For generate_bipartite_step:

  - Change num_levels to create more or fewer segments

  - Change style to try different geometric patterns

  For generate_multimodal_step:

  - Move peak_positions closer together or farther apart

  - Adjust peak_heights to create asymmetric patterns

  Generate fundamentally different function shapes, not just tweak hyperparameters.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
