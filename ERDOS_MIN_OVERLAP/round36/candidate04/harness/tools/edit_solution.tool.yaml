type: tool
name: edit_solution
description: "Replace the ENTIRE h array in the EVOLVE-BLOCK with a new step function.\n\nStep function\
  \ format: h = np.array([...]) where each value is 0 or 1 (or close).\n\nTo create N peaks of width w:\
  \ \n- Total width constraint: N * w = 1.0\n- Choose peak positions carefully to avoid overlap at problematic\
  \ shifts\n\nExample for 2 peaks of width 0.5:\nh = np.zeros(800)\nh[100:300] = 1.0  # peak 1\nh[500:700]\
  \ = 1.0  # peak 2\n\nKey: Each edit should create a COMPLETELY NEW step function structure."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
