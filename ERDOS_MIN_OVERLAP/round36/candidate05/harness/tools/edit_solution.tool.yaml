type: tool
name: edit_solution
description: 'Modify EVOLVE-BLOCK Hyperparameters. To change initialization: modify _get_best_initialization
  patterns (thresholds, peak positions). To adjust resolution: change num_intervals (100 for probe, 800
  for final). To tune: adjust penalty_strength (100+ for low-res, 61 for final), num_steps (5000 for probe,
  120000 for final). Key: VARY pattern parameters, don''t add random noise.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
