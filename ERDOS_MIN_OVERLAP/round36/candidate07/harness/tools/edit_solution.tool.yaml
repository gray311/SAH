type: tool
name: edit_solution
description: 'Use EDIT_DIRECT to manually craft a new h array with SPECIFIED peak configuration.

  Format: h = array((v0, v1, ..., v799)) where N = num_intervals.


  Structure: Create NARROW peaks (width ~10-20 values) at strategic positions:

  - 3 peaks at x = 0.0, 0.667, 1.333 (separation 2/3)

  - 2 peaks at x = 0.0, 1.333 (separation 4/3)

  - 4 peaks at x = 0.0, 0.5, 1.0, 1.5


  Each peak: value ~1.0 at center, decays to ~0.1 at edges over ~10-15 values.


  CRITICAL: Ensure sum(h) * (2.0/N) = 1.0 (integral constraint).

  - Calculate total mass = 1.0

  - If 3 peaks, each contributes ~0.33 to integral

  - Peak height ~ 1.0 / (peak_width * dx) where dx = 2.0/N


  Avoid sigmoid parameterization - directly specify h values.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
