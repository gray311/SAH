type: tool
name: probe_solution
description: 'FAST approximate determinant evaluation using subsampled rows. Computes determinant on a
  subsample of the matrix data (fast, ~10s vs minutes for full eval). Scores are approximate and NOT comparable
  to evaluate_solution, but RANKING of strategies is reliable: if A probes higher than B, A likely evaluates
  higher. Use this to quickly compare: different construction methods, seeds, annealing schedules. Only
  call evaluate_solution when probe_solution indicates a promising variant. With 20 evaluation budget,
  use probe_solution to prune bad strategies.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
