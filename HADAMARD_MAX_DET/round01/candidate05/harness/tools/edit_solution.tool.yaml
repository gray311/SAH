type: tool
name: edit_solution
description: 'Change the code inside # EVOLVE-BLOCK region. Use SEARCH/REPLACE for targeted edits

  or full rewrite for major construction changes. Preserve imports and run_code() interface.

  Key changes: construction method, initialization strategy, hill-climbing parameters.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
