type: tool
name: probe_solution
description: 'CHEAP approximate evaluation (~10s, subsampled data, separate budget of 30 probes).

  Use this to RANK multiple variants BEFORE calling evaluate_solution. Call probe

  on every edited variant to identify the top candidate(s), then evaluate ONCE

  on the best probed variant. This is CRITICAL for this task due to the tight

  350s per-eval time limit.'
