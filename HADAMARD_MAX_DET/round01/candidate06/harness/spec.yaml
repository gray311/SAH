schema: h2spec/1.0
system_prompt: |
  You are an expert Hadamard matrix optimization specialist. Maximize |det(H)| for a 29×29 matrix with entries ±1.
  
  Key insight: For prime n≡3 mod 4 (n=29), use **Paley construction** from quadratic residues.
  Secondary strategy: Start from Sylvester (n=32) and delete 3 rows/cols, or random perturbations.
  
  Method:
  1. Call hadamard_probe FIRST to cheaply rank 3-5 different construction strategies
  2. Pick the top 1-2 probes and FULL evaluate them
  3. For each good base, do targeted hill climbing (500-1000 iterations with smart perturbations)
  4. Always try Paley construction for n=29 (quadratic residues)
  5. Use multiple random seeds and keep the best
  
  Budget discipline: With ~20 full evals, plan: 1 full eval of Paley baseline, 2-3 full evals of best probe-ranked variants, then refine.
skill_description: |
  Hadamard matrix optimization: maximize |det(H)| for 29×29 ±1 matrix. Use Paley construction, systematic search, and probe-based variant ranking under fixed evaluation budget.
skill_body: |
  # Hadamard Matrix Optimization (n=29)
  
  ## Objective
  Maximize |det(H)| where H is 29×29 with entries ±1.
  
  ## Construction Strategies (try all in probe phase)
  
  1. **Paley Construction (prime n≡3 mod 4)**:
     - H[0,0]=1
     - H[i,j] = 1 if (i-j mod 29) is quadratic residue, else -1
     - Quadratic residues mod 29: {1,4,5,6,7,9,13,16,20,22,23,24,25,28}
  
  2. **Sylvester truncation**: Start with n=32 Hadamard, remove 3 rows/cols
  3. **Random with many seeds**: Generate 10-20 random matrices, hill climb each
  
  ## Search Protocol
  **PHASE 1 - PROBE (cheap, up to 30 calls)**:
  - Implement 3-5 different constructions in parallel
  - Use hadamard_probe on each (fast, separate budget)
  - Keep top 2 by probe score
  
  **PHASE 2 - FULL EVAL (budget-limited, ~20 calls)**:
  - Full evaluate top 2 from Phase 1
  - For the winner, refine with targeted hill climbing
  
  **PHASE 3 - REFINEMENT**:
  - Modify only the best-performing components
  - Use larger perturbations, more iterations (1000-2000)
  - Keep the best final result
  
  ## Perturbation Schedule (for hill climbing)
  - Start: flip 1 random entry, accept if |det| increases
  - Later: flip 2-3 entries, use simulated annealing acceptance
  - Always maintain ±1 entries
  
  ## Bareiss Determinant
  Use the provided integer-preserving Bareiss algorithm. Never use float det() - precision issues.
  
  ## Probes vs Full Eval
  - hadamard_probe: fast (~10s), approximate, 30-call budget, separate from eval budget
  - evaluate_solution: slow (~350s), exact, ~20-call budget
  
  **Never call evaluate_solution more than 5-8 times on the same variant**. Use probes to filter.
tool_descriptions:
  edit_solution: |
    Change the EVOLVE-BLOCK code. Preferred format: targeted SEARCH/REPLACE diffs.
    For Hadamard tasks, always include the Paley construction as a baseline.
    Preserve all imports and the run_code() function outside EVOLVE-BLOCK.
  evaluate_solution: |
    Run full evaluation. Returns (combined_score, validity, error, best_score, evals_left).
    With ~20 total budget, prioritize: 1) Paley baseline, 2) best probe-ranked variant.
    After full eval of a variant, spend remaining probes on refinements of the winner.
  probe_solution: |
    Cheap approximate evaluator on subsampled data. Fast (~10s), separate budget (30 calls).
    NOT comparable to evaluate_solution scores - use ONLY for internal ranking when full evaluation is slow.
  finish: |
    End and submit best result. Call when: 1) eval budget exhausted, 2) no improvement after probe screening.
sampling:
  temperature: 0.9
  top_p: 0.9
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 5
  long_tool_output_max_chars: 12000
new_tools:
  - name: hadamard_probe
    description: |
      Approximate Hadamard score for n=29 using subsampling. Fast (~10s), separate 30-call budget.
      Use to quickly rank multiple construction strategies (Paley, Sylvester truncation, random starts)
      before spending precious full evaluations. NOT comparable to evaluate_solution scores.
      Call this FIRST when you have multiple candidate constructions - probe all, pick top 1-2 for full eval.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          import random
          
          def det_bareiss(A):
              size = len(A)
              if size == 0:
                  return 1
              M = [row.copy() for row in A]
              for k in range(size - 1):
                  if M[k][k] == 0:
                      for i in range(k + 1, size):
                          if M[i][k] != 0:
                              M[k], M[i] = M[i], M[k]
                              break
                      else:
                          return 0
                  for i in range(k + 1, size):
                      for j in range(k + 1, size):
                          num = M[i][j] * M[k][k] - M[i][k] * M[k][j]
                          den = M[k - 1][k - 1] if k > 0 else 1
                          M[i][j] = num // den
              return M[-1][-1]
          
          def hill_climb(A, iters=500, seed=42):
              rng = random.Random(seed)
              curr = [row.copy() for row in A]
              det_curr = det_bareiss(curr)
              best_det = det_curr
              best_mat = [row.copy() for row in curr]
              for t in range(iters):
                  i, j = rng.randrange(29), rng.randrange(29)
                  curr[i][j] = -curr[i][j]
                  new_det = det_bareiss(curr)
                  T = 0.5 / (1.0 + t * 0.001)
                  if abs(new_det) >= abs(det_curr) or (rng.random() < np.exp((abs(new_det) - abs(det_curr)) / max(1.0, T * abs(det_curr)))):
                      det_curr = new_det
                      if abs(det_curr) > abs(best_det):
                          best_det = det_curr
                          best_mat = [row.copy() for row in curr]
                  else:
                      curr[i][j] = -curr[i][j]
              return best_det
          
          try:
              prog = ctx.get_program()
              
              # Generate Paley construction
              n = 29
              residues = {1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}
              matrix = [[1]]
              for i in range(1, n):
                  row = [1 if (i-j) % n in residues else -1 for j in range(n)]
                  matrix.append(row)
              
              # Subsample to 5x5 for fast probe
              idx = np.random.RandomState(42).choice(n, size=(5, n), replace=False)
              sampled = np.array(matrix)[idx]
              probe_det = det_bareiss(sampled)
              approx_score = abs(probe_det) / (n**2)
              
              # Quick hill climb on sampled
              sampled_list = sampled.tolist()
              probed_det = det_bareiss(sampled_list)
              sampled_list = hill_climb(sampled_list, iters=100, seed=123)
              sampled_final = np.array(sampled_list)
              probed_det = det_bareiss(sampled_final)
              approx_score = abs(probed_det) / (n**2)
              
              return {
                  "method": "paley_probe",
                  "probe_score": float(approx_score),
                  "det": probed_det,
                  "note": "Subsampled Paley + hill climb"
              }
          except Exception as e:
              return {"note": f"probe failed: {str(e)}", "probe_score": 0.0}
remove_tools: []
new_skills:
  - name: hadamard-optimization
    description: |
      Hadamard matrix construction for n=29. Use Paley (quadratic residues) as primary method.
      Systematic workflow: probe multiple constructions (Paley, Sylvester, random), fully eval top 2,
      then refine with hill climbing. Always use hadamard_probe before full eval.
    body: |
      # Hadamard Matrix Optimization (n=29)
      
      ## Construction Strategies
      
      ### 1. Paley Construction (PRIMARY METHOD)
      - H[0,0]=1
      - For i,j: H[i,j] = 1 if (i-j mod 29) in quadratic residues, else -1
      - Quadratic residues mod 29: {1,4,5,6,7,9,13,16,20,22,23,24,25,28}
      - This is the MOST important baseline - implement correctly!
      
      ### 2. Sylvester Truncation
      - Start with n=32 Sylvester Hadamard (recursive Kronecker product)
      - Remove 3 rows and 3 columns to get 29×29
      - Try different removal combinations
      
      ### 3. Random Multiple Starts
      - Generate 10-20 random ±1 matrices
      - Apply hill climbing (500-1000 iterations each)
      
      ## Search Workflow
      
      **PHASE 1: Probe (cheap, up to 30 calls)**
      1. Implement Paley construction
      2. Implement Sylvester truncation (try 3-5 truncations)
      3. Implement random + hill climb (2-3 variants)
      4. Call hadamard_probe on each variant
      5. Pick top 1-2 by probe score
      
      **PHASE 2: Full Evaluation (~20 calls)**
      1. Full evaluate top 2 from Phase 1
      2. For the winner, create 2-3 refinements
      3. Probe refinements, full eval best
      
      **PHASE 3: Refinement**
      1. Take the best full-eval result
      2. Apply targeted perturbations (flip 2-3 entries)
      3. Run 1000-2000 hill climbing iterations
      4. Final full eval, then finish
      
      ## Key Parameters
      - Hill climbing iterations: 500 (probe) to 2000 (full)
      - Temperature: start 0.5, decay 0.001 per iteration
      - Bareiss determinant: mandatory, never use numpy det()
      
      ## Budget Discipline
      - Use hadamard_probe FIRST to rank variants
      - Only FULL EVAL the top 1-2 probe-ranked variants
      - Never call evaluate_solution more than 5-8 times on same variant
