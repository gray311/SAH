type: tool
name: edit_solution
description: 'Change code in # EVOLVE-BLOCK-START to # EVOLVE-BLOCK-END. Two formats: (1) PREFERRED —
  SEARCH/REPLACE diffs matching current program exactly, or (2) full rewrite as complete code. Only modify
  the EVOLVE-BLOCK; imports and run_code() outside are frozen. After editing, call evaluate_solution.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
