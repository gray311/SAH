type: tool
name: edit_solution
description: Change code in EVOLVE-BLOCK. Use SEARCH/REPLACE or full rewrite. Only modify the EVOLVE-BLOCK.
  Keep code under 150s. After editing, call evaluate_solution or probe_solution.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
