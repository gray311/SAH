type: tool
name: finish
description: End session when no improvement or budget exhausted. Call finish AFTER you have used probe_solution
  to rank 2-3 variants and evaluated the winner.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
