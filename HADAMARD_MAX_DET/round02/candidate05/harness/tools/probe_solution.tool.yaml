type: tool
name: probe_solution
description: 'Cheap approximate scoring on subsampled data (~10s vs ~200s). Does NOT consume eval budget.
  Separate probe budget of 30. Scores are approximate but reliable for ranking. Use to: (1) rank multiple
  variants before full eval, (2) quickly test parameter changes, (3) confirm direction before expensive
  eval. Ideal for Hadamard optimization where you need to compare construction methods.'
