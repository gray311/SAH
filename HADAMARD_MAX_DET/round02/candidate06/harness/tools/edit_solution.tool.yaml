type: tool
name: edit_solution
description: "Change code in # EVOLVE-BLOCK-START to # EVOLVE-BLOCK-END. \nPREFERRED: Provide FULL working\
  \ code (not partial diffs). \nThe executor will replace the entire EVOLVE-BLOCK with your code.\nMust\
  \ import numpy, use correct Paley construction, use numpy.linalg.det for search."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
