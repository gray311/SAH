type: tool
name: edit_solution
description: "Change code in # EVOLVE-BLOCK-START to # EVOLVE-BLOCK-END. \nFormat: (1) SEARCH/REPLACE\
  \ diffs matching current code exactly, OR (2) full rewrite of construct_hadamard_matrix function.\n\
  Only modify EVOLVE-BLOCK; imports and run_code() outside are frozen.\nAfter editing, call evaluate_solution\
  \ to score.\n\nCRITICAL: Ensure your search uses proxy scoring (numpy trace(A^T @ A)) inside loops,\n\
  and only calls exact Bareiss determinant ONCE per search (not inside loops).\nTotal time per evaluation\
  \ must stay <200s."
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
