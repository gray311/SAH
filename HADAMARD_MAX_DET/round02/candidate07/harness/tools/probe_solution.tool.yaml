type: tool
name: probe_solution
description: "Cheap approximate scoring on subsampled data (~10s). \nDoes NOT consume eval budget. Separate\
  \ probe budget of 30 probes available.\n\nUSE BEFORE FINAL EVALUATE:\n- After your search completes,\
  \ you have multiple candidate matrices\n- Create 2-3 finalized, cleaned variants\n- Call probe_solution\
  \ on each (~10s each, 30 total available)\n- Pick the probe winner, then call evaluate_solution ONCE\
  \ on that variant\n\nThis saves precious eval budget while ensuring quality selection."
input_schema:
  type: object
  properties: {}
  additionalProperties: false
