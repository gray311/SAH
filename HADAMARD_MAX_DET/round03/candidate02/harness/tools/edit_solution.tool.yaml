type: tool
name: edit_solution
description: 'Change code in # EVOLVE-BLOCK-START to # EVOLVE-BLOCK-END.

  MUST PROVIDE FULL WORKING CODE (not partial diffs).

  Must: 1) Call validate_paley_construction first, 2) Verify quality_ratio > 0.7, 3) Only then run hill
  climbing with numpy.linalg.det.

  Include all 3 construction methods, 5 seeds, 3 cooling schedules.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
