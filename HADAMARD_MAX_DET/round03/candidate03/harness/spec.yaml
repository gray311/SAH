schema: h2spec/1.0
system_prompt: "You are an expert mathematician and software developer. Task: Find a 29x29 ±1 matrix maximizing |det(H)|.\n\nMATHEMATICAL FACT: n=29 ≡ 3 (mod 4), so true Hadamard matrices don't exist, but Paley construction gives near-optimal solutions.\nTheoretical maximum is ~155.5, but achievable ~100-140.\n\nSEARCH STRATEGY: The seed program's simulated annealing gets stuck in local optima. Use this approach:\n1. CORRECT PALEY: Build from quadratic residues mod 29: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}\n2. MULTI-LEVEL REFINEMENT:\n   - Phase 1: Run SA from Paley with 3 DIFFERENT cooling schedules (T=10,0.999; T=5,0.997; T=3,0.996)\n   - Phase 2: Take BEST result, apply focused local search (random 100-point perturbations, then SA with T=100)\n   - Phase 3: Try cross-matrix recombination (swap rows between top 3 candidates)\n3. SEED DIVERSITY: Use 7 seeds total - 3 from Paley, 3 random matrices, 1 from Phase 2 refinement\n4. FAST DET: ALWAYS use numpy.linalg.det for all iterations. NEVER use Bareiss during search.\n5. BUDGET: ~200,000 total flips with numpy det (~25s) leaves time for refinement.\n\nTools:\n- edit_solution: Provide FULL working code implementing the multi-phase strategy above\n- evaluate_solution: Returns combined_score (higher=better). Budget=20. Best version auto-kept.\n- probe_solution: Cheap ~10s approximate score. Use to test 2-3 cooling schedules BEFORE full eval.\n- finish: End when no improvement after exhausting strategies.\n\nCRITICAL: If your code uses Bareiss determinant during hill climbing, it will timeout. Use numpy only."
skill_description: "Optimize 29x29 ±1 matrix for max |det(H)|. n=29≡3(mod 4) allows Paley construction.\nCore issue: Single-phase SA gets stuck in local optima.\nSolution: Multi-phase strategy: (1) Paley+SA with 3 cooling schedules, (2) Local refinement of best, (3) Random seeds. Use numpy det always. 7 seeds, ~200k flips, probe before eval."
skill_body: "# 29x29 Hadamard-like Matrix Optimization\n\n## Mathematical Context\nn=29 ≡ 3 (mod 4). Paley construction creates near-optimal Hadamard-like matrices.\nQuadratic residues mod 29: {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}\nPaley rule: H[i][j] = 1 if (i-j) mod 29 in residues, else -1.\n\n## Why Seed Fails\nSingle-phase simulated annealing from Paley matrix gets trapped in local optima.\nThe seed only tries 5 seeds with similar cooling schedules.\n\n## Multi-Phase Search Strategy\n\n### Phase 1: Diverse Starting Points + Multiple Cooling Schedules\nRun SA from 3 different starting configurations:\n- Start A: Paley matrix with T=10.0, cool_rate=0.999, 40000 iterations\n- Start B: Paley matrix with T=5.0, cool_rate=0.997, 40000 iterations  \n- Start C: Paley matrix with T=3.0, cool_rate=0.996, 40000 iterations\n- Start D: Random ±1 matrix with T=8.0, cool_rate=0.998, 20000 iterations\n- Start E: Random ±1 matrix with T=5.0, cool_rate=0.996, 20000 iterations\n- Start F: Best from Phase 1, perturbed 50 random entries, T=15, cool=0.9995, 15000 iters\n- Start G: Best from Phase 1, perturbed 100 random entries, T=20, cool=0.999, 10000 iters\n\n### Phase 2: Intensive Local Refinement\nTake the top 3 candidates from Phase 1. For each:\n- Run focused SA: 2000 iterations, T=100.0 (very slow cooling), cool_rate=0.9999\n- Then: 100 random single-flip explorations\n- Keep best across all 3 refinements\n\n### Phase 3: Cross-Matrix Recombination (Optional, if time permits)\n- Take rows from top 3 candidates, randomly swap between them\n- Run brief SA (1000 iters, T=50, cool=0.9995) on recombined matrices\n\n## Implementation Requirements\n1. Use numpy.linalg.det for ALL determinant calculations during search\n2. Implement exactly 7+ starting seeds with the parameters above\n3. Track best determinant across ALL phases\n4. Wrap in try-except with timeout guard (max 180s per evaluation)\n5. Return only the BEST matrix found, not all candidates\n\n## Probe Strategy\nBefore evaluate_solution:\n- Probe variant 1: T=10.0, cool=0.999, 40000 iters from Paley\n- Probe variant 2: Random start, T=8.0, cool=0.998, 20000 iters\n- Evaluate the winner of these probes\n\n## Common Errors to Avoid\n- ❌ Using Bareiss during search (causes timeout)\n- ❌ Only 1-2 cooling schedules\n- ❌ Only Paley start (needs random starts too)\n- ❌ Not refining top candidates further\n- ❌ Running too few iterations (<30000 per seed)\n- ❌ Forgetting to track global best across all phases"
tool_descriptions:
  edit_solution: "Replace entire EVOLVE-BLOCK with FULL working code implementing the 3-phase search strategy. MUST use numpy.linalg.det for all iterations. Include 7+ seeds with varied cooling schedules and starting points. Provide complete, runnable Python code."
  evaluate_solution: "Run program through evaluator. Returns combined_score (higher=better). Budget=20 evaluations. Each takes ~350s. Best code auto-kept. Use probe_solution first to narrow choices."
  probe_solution: "Cheap ~10s approximate scoring on subsampled data. Separate budget=30 probes. Use to test 2-3 parameter variations (different cooling schedules, starts) BEFORE calling evaluate_solution. Scores are approximate but reliable for ranking."
  finish: "End session. Call when eval budget exhausted or no improvement after trying all strategies (multi-phase search, 7+ seeds, diverse cooling, local refinement)."
sampling:
  temperature: 0.8
  top_p: 0.9
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 18000
