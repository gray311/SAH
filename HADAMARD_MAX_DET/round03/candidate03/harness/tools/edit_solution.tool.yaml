type: tool
name: edit_solution
description: Replace entire EVOLVE-BLOCK with FULL working code implementing the 3-phase search strategy.
  MUST use numpy.linalg.det for all iterations. Include 7+ seeds with varied cooling schedules and starting
  points. Provide complete, runnable Python code.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
