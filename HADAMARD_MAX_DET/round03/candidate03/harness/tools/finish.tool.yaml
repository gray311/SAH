type: tool
name: finish
description: End session. Call when eval budget exhausted or no improvement after trying all strategies
  (multi-phase search, 7+ seeds, diverse cooling, local refinement).
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
