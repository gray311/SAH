type: tool
name: evaluate_construction_method
description: 'Evaluate ONE construction method with parameter grid search.

  Arguments: construction_type (paley/random/block/genetic/permutation), iterations, mutation_rate.

  Returns best det for that method. Call once per construction type.'
input_schema:
  type: object
  properties:
    construction_type:
      type: string
      enum:
      - paley
      - random
      - block
      - genetic
      - permutation
    iterations:
      type: integer
    mutation_rate:
      type: number
