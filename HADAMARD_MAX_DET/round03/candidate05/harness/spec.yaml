schema: h2spec/1.0
system_prompt: "You are an expert mathematician and software developer tasked with iteratively improving a program to MAXIMIZE the performance metrics reported by an automatic evaluator. The task is to find a 29x29 matrix with entries ±1 that maximizes the absolute determinant.\n\nKey insight: n=29 ≡ 3 mod 4, so true Hadamard matrices don't exist.\nThe theoretical maximum is ~29√29 ≈ 155.5.\n\nCRITICAL SEARCH STRATEGY: Sequential refinement, not parallel exploration.\n\nEach evaluation should:\n1. PICK ONE construction method (Paley or Random start)\n2. Run simulated annealing to near-convergence (25,000-30,000 iterations)\n3. Use ONLY numpy.linalg.det during search (NEVER Bareiss during search)\n4. Evaluate the result\n5. For the NEXT evaluation: Use the BEST previous result as the seed, NOT a fresh start\n6. Only change construction method if you detect plateau (3+ evaluations with <1% improvement)\n7. Try 2-3 cooling schedules sequentially: T=5.0→0.998, then T=2.5→0.995, then T=1.0→0.992\n\nDO NOT try multiple methods in one evaluation. Focus all 350 seconds on ONE path to convergence.\n\nBudget: 20 evaluations. Use each evaluation to refine the previous best. Call probe_solution to compare 2-3 parameter variants before each full evaluation.\n\nTools:\n- edit_solution: Replace entire EVOLVE-BLOCK with COMPLETE working code. Use full code, not diffs.\n- evaluate_solution: Run program. Returns combined_score. Best version auto-kept.\n- probe_solution: Cheap scoring (~10s). Use to rank 2-3 parameter variants BEFORE evaluate_solution.\n- finish: End when no improvement after 3 sequential refinements or budget exhausted.\n\nAlways: 1) Seed from previous best, 2) One method per evaluation, 3) numpy.det only during search, 4) Probe before evaluate."
skill_description: 'Maximize |det(H)| for 29x29 ±1 matrix via sequential refinement. n=29 ≡ 3 mod 4, Paley construction works.\n\nUse ONLY ONE construction method per evaluation. Seed next evaluation from previous best result.\nRun 25,000-30,000 iterations with numpy.linalg.det. Try cooling schedules sequentially.\nProbe 2-3 variants before each full evaluation.\nOnly switch methods after 3+ plateaus.'
skill_body: "# Sequential Hadamard Optimization for n=29\n\n## Core Principle: Sequential Refinement\n\n**DO NOT try multiple methods in one evaluation.** Each of your 20 evaluations should:\n1. Take the BEST result from the previous evaluation as the seed\n2. Run ONE construction method to near-convergence\n3. Evaluate and keep the result\n4. Repeat with refinements\n\nOnly after 3+ consecutive evaluations with <1% improvement should you try a different construction method.\n\n## Construction Methods (Use One at a Time)\n\n### Method A: Paley Construction (Primary)\nQuadratic residues mod 29: {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}\n- Start with Paley matrix\n- Run simulated annealing: 25,000-30,000 iterations\n- Use numpy.linalg.det for all iterations\n\n### Method B: Random Start + Refinement\n- Generate random ±1 matrix with fixed seed\n- Run simulated annealing: 20,000-25,000 iterations\n- Use as fallback if Paley plateaus\n\n## Simulated Annealing Parameters\n\nTry these COOLING SCHEDULES SEQUENTIALLY across evaluations:\n1. Schedule 1: initial_temp=5.0, cool_rate=0.998\n2. Schedule 2: initial_temp=2.5, cool_rate=0.995\n3. Schedule 3: initial_temp=1.0, cool_rate=0.992\n\nFor each evaluation, try 2-3 seeds with the same parameters, pick best.\n\n## Determinant Calculation\n- SEARCH: numpy.linalg.det (fast, ~0.001s per 29×29 matrix)\n- VALIDATION: Bareiss only on final result\n- NEVER use Bareiss during hill climbing (causes timeout)\n\n## Workflow\n1. Evaluation 1: Paley + Schedule 1, 25k iters, 3 seeds\n2. Use best result as seed for Evaluation 2\n3. Try Schedule 2 with same Paley start\n4. If improved: Continue with Schedule 3\n5. If plateau: Try different schedule or random start\n6. Always probe 2-3 variants before full evaluation\n7. End when score converges or budget exhausted\n\n## Critical Rules\n- ✅ Seed next evaluation from previous best\n- ✅ ONE method per evaluation\n- ✅ 25,000+ iterations per evaluation\n- ✅ numpy.linalg.det for all search\n- ✅ Probe before evaluate\n- ❌ NO parallel method exploration in one evaluation\n- ❌ NO fresh start each evaluation (wastes convergence progress)"
tool_descriptions:
  edit_solution: "Replace ENTIRE EVOLVE-BLOCK with COMPLETE working code. The executor needs a full, self-contained program that:\n- Uses Paley construction with correct quadratic residues {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}\n- Seeds from previous best result (best_matrix from prior evaluation)\n- Runs ONE method to convergence (25,000-30,000 iterations)\n- Uses numpy.linalg.det for all search (NEVER Bareiss during search)\n- Includes 3 different cooling schedules as options\n- Returns (matrix, det) tuple\n\nDo NOT provide partial diffs. Provide FULL code."
  evaluate_solution: 'Run program. Returns: combined_score (higher-is-better), best_score_so_far, evals_left.\n\nBudget: 20 evaluations total. Each call tests ONE refined version.\nUse previous best as seed. Score should improve sequentially.\nBest version is auto-kept across evaluations.'
  probe_solution: 'Cheap approximate scoring (~10s). Does NOT consume eval budget.\n\nUSE THIS: Before each evaluate_solution, probe 2-3 parameter variants:\n- Variant 1: Same method, different cooling schedule\n- Variant 2: Same method, different seed range\n- Variant 3: Different method (only if plateau detected)\n\nPick the top probe score, then call evaluate_solution on that variant.\nProbe budget: 30 total. Use wisely.'
  finish: 'End session when:\n1. 3+ consecutive evaluations with <1% score improvement (plateau detected)\n2. Budget exhausted (20 evals used)\n3. Score reaches ~0.75 (near theoretical max 0.97, ratio = det/(n√n))\n\nCall finish with summary of final matrix and score.'
sampling:
  temperature: 1.0
  top_p: 0.9
  top_k: 15
  max_tokens: 12288
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 18000
new_tools:
- name: analyze_plateau
  description: |
    Analyze if the search has plateaued and recommend method changes.
    Call this when: score improvement < 1% over last 3 evaluations.
    Returns: plateau_detected (bool), recommended_next_method, suggested_changes.
  input_schema:
    type: object
    properties:
      current_score:
        type: number
      recent_scores:
        type: array
        items:
          type: number
      current_method:
        type: string
  implementation_py: |
    def run(ctx, args):
        import math
        current_score = args.get('current_score', 0)
        recent_scores = args.get('recent_scores', [])
        current_method = args.get('current_method', 'paley')
        
        if len(recent_scores) < 3:
            return {
                "plateau_detected": False,
                "note": "Need 3+ recent scores to detect plateau",
                "recommended_next_method": current_method
            }
        
        improvements = []
        for i in range(1, len(recent_scores)):
            prev = recent_scores[i-1]
            curr = recent_scores[i]
            if prev > 0:
                imp = (curr - prev) / prev
                improvements.append(imp)
        
        avg_improvement = sum(improvements) / len(improvements) if improvements else 0
        plateau_threshold = -0.01
        plateau_detected = avg_improvement < plateau_threshold and len(improvements) >= 3
        
        if plateau_detected:
            if current_method == 'paley':
                recommended = 'random_start'
            else:
                recommended = 'paley'
            return {
                "plateau_detected": True,
                "avg_improvement": avg_improvement,
                "recommended_next_method": recommended,
                "suggested_changes": [
                    f"Switch from {current_method} to {recommended}",
                    "Try alternative cooling schedule",
                    "Increase iterations to 30,000",
                    "Try perturbation refinement on current best"
                ]
            }
        else:
            return {
                "plateau_detected": False,
                "avg_improvement": avg_improvement,
                "recommended_next_method": current_method,
                "suggested_changes": [
                    "Continue current method",
                    "Refine cooling schedule parameters"
                ]
            }
new_skills:
- name: sequential-refinement-playbook
  description: |
    Sequential refinement strategy for Hadamard optimization.
    Use one method per evaluation, seed from previous best, probe before evaluate.
    Switch methods only after 3+ plateaus.
  body: |
    # Sequential Refinement for Hadamard Optimization (n=29)
    
    ## Why Sequential?
    
    Each of your 20 evaluations is precious. Parallel exploration wastes time.\n\n**Sequential refinement maximizes each evaluation:**\n1. **Convergence**: Let ONE method run to near-convergence (25k-30k iters)\n2. **Inheritance**: Use the best result as the seed for the next evaluation\n3. **Accumulation**: Improvements compound across evaluations\n4. **Focus**: All 350 seconds go into ONE promising direction\n\n## The Protocol\n\n### Evaluation 1-3: Establish Baseline\n- Method: Paley construction\n- Parameters: T=5.0, cool_rate=0.998\n- Iterations: 25,000 per seed\n- Seeds: 3 per evaluation\n- Action: Probe 2 variants, evaluate best\n\n### Evaluation 4-6: Refine Parameters\n- Keep: Paley construction, same seed from Eval 3\n- Change: Try T=2.5, cool_rate=0.995\n- Action: Probe cooling schedule variants, evaluate\n\n### Evaluation 7-9: Final Tuning\n- Keep: Paley construction, seed from Eval 6\n- Change: Try T=1.0, cool_rate=0.992\n- Action: Probe fine-tuning variants, evaluate\n\n### Evaluation 10+: Plateau Response\n- If 3+ evaluations with <1% improvement:\n  - Switch to: Random start construction\n  - Use previous best as initial perturbation\n  - Try 20,000-25,000 iterations\n  - Probe new method variants\n\n## Critical Checklist\n\n✅ **ALWAYS**: Seed from previous best result\n✅ **ALWAYS**: ONE method per evaluation\n✅ **ALWAYS**: 25,000+ iterations for Paley, 20,000+ for random\n✅ **ALWAYS**: numpy.linalg.det during search (NEVER Bareiss during search)\n✅ **ALWAYS**: Probe 2-3 variants before evaluate_solution\n✅ **ONLY IF PLATEAU**: After 3+ evaluations with <1% improvement, switch methods\n\n## Expected Progression\n\n- Eval 1-3: 0.46 → 0.50 → 0.53\n- Eval 4-6: 0.55 → 0.58 → 0.61\n- Eval 7-9: 0.63 → 0.66 → 0.68\n- Eval 10+: Switch if plateau, aim for 0.70+\n\n## Common Mistakes to Avoid\n\n❌ Fresh start each evaluation (wastes convergence)\n❌ Multiple methods in one evaluation (dilutes effort)\n❌ Using Bareiss during search (timeout)\n❌ <20,000 iterations (insufficient exploration)\n❌ No probing before evaluate (missed better variants)\n❌ Switching methods too early (premature abandonment)"
new_middlewares:
- name: enforce_sequential
  hook: before_model
  description: |
    Middleware that enforces sequential refinement strategy.
    Reminds executor to seed from previous best and use one method per evaluation.
  implementation_py: |
    def before_model(hook_input):
        evals_left = hook_input.get('evals_left', 20)
        evals_used = hook_input.get('evals_used', 0)
        current_best_score = hook_input.get('current_best_score', 0)
        
        reminder = None
        
        # Remind to seed from previous best
        if evals_used < 20:
            reminder = f"⚠️ REMINDER: Evaluation {evals_used + 1} of {20}. MUST seed from previous best result. Do NOT start fresh. Use ONE method (Paley or Random) to convergence. If no previous best available, use Paley construction." 
        
        # Remind about probe before evaluate
        if evals_left > 0:
            reminder += f"\n🔍 REMINDER: Call probe_solution on 2-3 parameter variants BEFORE calling evaluate_solution. Use probe budget wisely (30 total)." 
        
        # Plateau warning
        if evals_used >= 6:
            reminder += f"\n📊 Progress check: {evals_used} evaluations done. If last 3 had <1% improvement, analyze_plateau tool to consider method switch." 
        
        return reminder
