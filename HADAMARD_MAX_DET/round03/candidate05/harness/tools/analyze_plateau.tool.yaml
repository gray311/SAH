type: tool
name: analyze_plateau
description: 'Analyze if the search has plateaued and recommend method changes.

  Call this when: score improvement < 1% over last 3 evaluations.

  Returns: plateau_detected (bool), recommended_next_method, suggested_changes.'
input_schema:
  type: object
  properties:
    current_score:
      type: number
    recent_scores:
      type: array
      items:
        type: number
    current_method:
      type: string
