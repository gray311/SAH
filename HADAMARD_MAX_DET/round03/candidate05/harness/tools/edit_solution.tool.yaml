type: tool
name: edit_solution
description: 'Replace ENTIRE EVOLVE-BLOCK with COMPLETE working code. The executor needs a full, self-contained
  program that:

  - Uses Paley construction with correct quadratic residues {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23,
  24, 25, 28}

  - Seeds from previous best result (best_matrix from prior evaluation)

  - Runs ONE method to convergence (25,000-30,000 iterations)

  - Uses numpy.linalg.det for all search (NEVER Bareiss during search)

  - Includes 3 different cooling schedules as options

  - Returns (matrix, det) tuple


  Do NOT provide partial diffs. Provide FULL code.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
