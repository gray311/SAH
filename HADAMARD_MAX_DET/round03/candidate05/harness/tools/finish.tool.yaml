type: tool
name: finish
description: End session when:\n1. 3+ consecutive evaluations with <1% score improvement (plateau detected)\n2.
  Budget exhausted (20 evals used)\n3. Score reaches ~0.75 (near theoretical max 0.97, ratio = det/(n√n))\n\nCall
  finish with summary of final matrix and score.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
