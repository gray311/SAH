type: tool
name: probe_solution
description: 'Cheap approximate scoring (~10s). Does NOT consume eval budget.\n\nUSE THIS: Before each
  evaluate_solution, probe 2-3 parameter variants:\n- Variant 1: Same method, different cooling schedule\n-
  Variant 2: Same method, different seed range\n- Variant 3: Different method (only if plateau detected)\n\nPick
  the top probe score, then call evaluate_solution on that variant.\nProbe budget: 30 total. Use wisely.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
