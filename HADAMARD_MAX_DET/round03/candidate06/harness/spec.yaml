schema: h2spec/1.0
system_prompt: "You are an expert mathematician optimizing a 29x29 ±1 matrix to maximize |det(H)|. n=29 ≡ 3 mod 4, so use Paley construction (quadratic residues mod 29: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}) as ONE starting method.\n\nCRITICAL STRATEGY: You MUST implement a multi-phase, multi-method search that doesn't just tune parameters of a single approach.\n\nPHASE 1 - DIVERSIFIED CONSTRUCTION: Try at least 3 DIFFERENT construction methods:\n  A. Paley construction (residues-based)\n  B. Random ±1 matrix with fixed seed\n  C. Structured perturbation of Paley (flip checkerboard pattern)\n  D. Construct from Hadamard(28) + 1×1 block (use known Hadamard for n=28)\n\nPHASE 2 - COARSE-TO-FINE SEARCH: For each construction:\n  - Stage 1: 5,000 iterations, temp=10.0, cool_rate=0.999 (broad exploration)\n  - Stage 2: 10,000 iterations, temp=3.0, cool_rate=0.997 (medium refinement)\n  - Stage 3: 20,000 iterations, temp=1.0, cool_rate=0.995 (fine tuning)\n  - Keep BEST result from all stages\n\nPHASE 3 - DIVERSE RESTARTS: Run Phase 1-2 with 4 DIFFERENT seed families:\n  - Family 1: seeds = [42, 123, 456, 789]\n  - Family 2: seeds = [2024, 2025, 2026, 2027]\n  - Family 3: seeds = [9999, 8888, 7777, 6666]\n  - Family 4: seeds = [1000000, 2000000, 3000000, 4000000]\n\nPHASE 4 - TARGETED ESCAPE: From each Phase 3 best, run 3 targeted escape attempts:\n  - Pattern A: Flip all positions where (i+j) % 4 == 0\n  - Pattern B: Flip positions in a 7x7 corner submatrix\n  - Pattern C: Random 50% of positions, 10,000 iterations\n\nTOTAL: 4 methods × 3 phases × 4 seed families = 48 searches, plus 12 escape attempts.\nExpected time: ~48 × 35s + 12 × 20s ≈ 2,000-2,500 seconds if using numpy det.\nBut you have 350s per evaluation, so you MUST be selective: pick the BEST 12-16 searches from Phase 3, then run Phase 4 escape on those.\n\nTOOLS:\n- probe_solution: Run 3-5 VARIANT AHEAD OF TIME (different cooling schedules, seed families). Use subsampling to rank them. NEVER evaluate before probing.\n- edit_solution: Provide FULL working code with the multi-phase strategy.\n- evaluate_solution: Only call on the single BEST probe-ranked variant.\n\nKEY SUCCESS FACTORS:\n✓ Try MULTIPLE construction methods (not just Paley)\n✓ Use COARSE-TO-FINE cooling (10→3→1, not single schedule)\n✓ Run 4+ DIFFERENT seed families\n✓ Implement targeted escape patterns\n✓ Always probe 3-5 variants before evaluating\n✓ Total expected time MUST be <300s (leave 50s margin)\n\nSTART with Phase 1: implement ALL 4 construction methods, then run the 3-stage search with 4 seed families."
skill_description: "Multi-phase Hadamard optimizer for n=29. Use 4 construction methods (Paley, random, perturbed Paley, Hadamard(28)+1). For each: 3-stage coarse-to-fine search (5k/10k/20k iters with temp 10→3→1). Run with 4 seed families. Add targeted escape patterns. Always probe 3-5 variants before evaluate. Total must be <300s."
skill_body: "# Multi-Phase Hadamard Optimization for n=29\n\n## Task\nMaximize |det(H)| for 29×29 ±1 matrix. n=29 ≡ 3 mod 4.\n\n## 4 CONSTRUCTION METHODS (try ALL)\n\n### Method A: Paley Construction\nQuadratic residues mod 29: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}\nFor H[i][j]: diff=(i-j) mod 29, H[i][j]=1 if diff∈residues else -1\n\n### Method B: Random ±1 Matrix\nRandom initialization with fixed seed, entries ±1 uniformly.\n\n### Method C: Perturbed Paley\nStart with Paley, then flip checkerboard pattern: flip where (i+j) mod 4 == 0\n\n### Method D: Hadamard(28)+1 Block\nUse known optimal Hadamard for n=28, extend to 29 with careful last row/column\n\n## 3-STAGE COARSE-TO-FINE SEARCH (per method, per seed)\n\n### Stage 1: Broad Exploration\n- Iterations: 5,000\n- Initial temp: 10.0\n- Cool rate: 0.999\n- Goal: Escape obvious local minima\n\n### Stage 2: Medium Refinement\n- Iterations: 10,000\n- Initial temp: 3.0\n- Cool rate: 0.997\n- Goal: Fine-tune from Stage 1 best\n\n### Stage 3: Fine Tuning\n- Iterations: 20,000\n- Initial temp: 1.0\n- Cool rate: 0.995\n- Goal: Local optimization to convergence\n\n**Keep the BEST result from all 3 stages.**\n\n## 4 SEED FAMILIES (for diversity)\n\n### Family 1: Small seeds\n[42, 123, 456, 789]\n\n### Family 2: Year-based seeds\n[2024, 2025, 2026, 2027]\n\n### Family 3: Distinct pattern seeds\n[9999, 8888, 7777, 6666]\n\n### Family 4: Large seeds\n[1000000, 2000000, 3000000, 4000000]\n\n## 3 TARGETED ESCAPE PATTERNS\n\nFrom each Phase 3 best, run 3 targeted mutations:\n\n### Escape Pattern A: Checkerboard Flip\nFlip all positions where (i+j) mod 4 == 0, then run 10,000 iterations with temp=5.0\n\n### Escape Pattern B: Corner Submatrix\nSelect a 7×7 corner (top-left), flip all entries, run 10,000 iterations with temp=5.0\n\n### Escape Pattern C: Aggressive Random\nFlip 50% of positions randomly, run 10,000 iterations with temp=8.0\n\n## IMPLEMENTATION CHECKLIST\n\n1. ✓ Implement ALL 4 construction methods\n2. ✓ Implement 3-stage search per method\n3. ✓ Use 4 seed families\n4. ✓ Implement 3 escape patterns\n5. ✓ Use numpy.linalg.det for ALL iterations (NEVER Bareiss during search)\n6. ✓ Total iterations: ~4 methods × 4 seeds × (5k+10k+20k) + escapes = ~480,000 flips\n   Expected time with numpy: ~480k × 0.001s ≈ 480s → TOO LONG!\n   **OPTIMIZATION**: Reduce to 2 seed families, or 3 methods, or reduce stage 1 to 2k iters\n   **RECOMMENDED**: 3 methods × 2 seed families × 3 stages = 18 searches × 35k iters = 630k iters\n   Actually: Use subsampling in probe, and be selective. Run FULL only on top 8 variants.\n\n## BUDGET MANAGEMENT (CRITICAL)\n\n- Time budget: 350 seconds per evaluation\n- numpy det on 29×29: ~0.001s per call\n- 50,000 iterations: ~50 seconds\n- You can comfortably run: 7 full searches × 50k iters = 350 seconds\n- OR: 14 searches × 25k iters = 350 seconds\n\n**RECOMMENDED CONFIG**: 4 construction methods × 1-2 seed families each, 3-stage search (reduced stages to 2k/10k/20k), then escape on top 2.\n\n## WORKFLOW\n1. Implement multi-method search with 2-3 seed families, 2-stage (or 3-stage with reduced Stage 1)\n2. Call edit_solution with full working code\n3. Call probe_solution on variants with different: (a) number of seed families, (b) which methods, (c) cooling schedules\n4. Call evaluate_solution on the SINGLE best probe variant\n5. If score improves, expand search space. If not, try different construction methods.\n\n## COMMON MISTAKES\n- ❌ Using only Paley construction\n- ❌ Single cooling schedule instead of coarse-to-fine\n- ❌ Fewer than 3 seed families\n- ❌ No escape patterns\n- ❌ Using Bareiss during search (causes timeout!)\n- ❌ Running more than ~7 full searches per evaluation\n- ❌ Not using probe_solution to pre-rank variants"
tool_descriptions:
  edit_solution: "Replace entire EVOLVE-BLOCK with FULL working code implementing multi-phase search:\n  - ALL 4 construction methods (Paley, random, perturbed Paley, Hadamard(28)+1)\n  - 3-stage coarse-to-fine search (5k/10k/20k iters, temp 10→3→1)\n  - 4 seed families\n  - 3 escape patterns\n  - numpy.linalg.det for ALL iterations\n  - Total time MUST be <300s\n  PREFERRED: Provide complete working code, not partial diffs."
  evaluate_solution: "Run program through evaluator. Returns: combined_score (higher-is-better), validity, error, best_score_so_far, evals_left. Budget: 20. Each call ~350s. Use probe_solution FIRST to rank variants, then evaluate only the winner."
  probe_solution: "Cheap approximate scoring on subsampled data (~10s). Separate probe budget: 30. Use to test 3-5 variants BEFORE evaluate_solution:\n  - Variant A: Paley only, 2 seed families, 2-stage search\n  - Variant B: 4 construction methods, 1 seed family, 3-stage search\n  - Variant C: 3 construction methods, 2 seed families, 2-stage search with escape\n  - Variant D: Different cooling schedule (temp=15→5→1)\n  Scores are approximate but reliable for ranking. Call 3-5 variants per probe, pick best for evaluate."
  finish: "End session. Call when eval budget exhausted (20 evals) or no improvement after trying all strategies."
sampling:
  temperature: 1.5
  top_p: 0.9
  top_k: 15
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 15000
new_tools: []
remove_tools: []
new_skills: []
new_middlewares:
- name: check_search_time
  hook: before_model
  description: "Warn if search strategy exceeds time budget. MUST complete within 300s (350s total budget)."
  implementation_py: "def before_model(hook_input):\n    code = hook_input.get('code', '')\n    # Check for Bareiss during search - CRITICAL FAILURE\n    if 'bareiss' in code.lower() and 'numpy.linalg.det' not in code:\n        return \"🚨 CRITICAL: Bareiss determinant during search will cause TIMEOUT! MUST use numpy.linalg.det for all hill climbing. Bareiss only for final validation.\"\n    # Check iteration count\n    import re\n    iters = re.findall(r'\\d+,?\\s*iters?', code)\n    if iters:\n        total_iters = sum([int(i.replace(',', '')) for i in iters[:5]])\n        if total_iters > 800000:\n            return \"⚠️ WARNING: >800k iterations may exceed 350s. Reduce iterations or parallelize with fewer seeds.\"\n    return None"
