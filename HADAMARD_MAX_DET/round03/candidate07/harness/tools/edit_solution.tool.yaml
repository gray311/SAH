type: tool
name: edit_solution
description: 'Replace the entire EVOLVE-BLOCK with COMPLETE working code. Must:

  - Use scipy.linalg.det for stable determinant computation OR numpy with object dtype

  - Implement correct Paley construction with quadratic residues {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22,
  23, 24, 25, 28}

  - Run 5 seeds × 30,000 iterations with 4 cooling schedules

  - Use probe_solution to rank before evaluating

  Do NOT provide partial diffs - give the full function.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
