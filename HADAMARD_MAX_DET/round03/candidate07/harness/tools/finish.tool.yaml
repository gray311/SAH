type: tool
name: finish
description: 'End session. Call when: (1) eval budget exhausted (20 evals), or (2) no improvement after
  trying all strategies including: different determinant methods, more seeds, different constructions,
  perturbations.'
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
