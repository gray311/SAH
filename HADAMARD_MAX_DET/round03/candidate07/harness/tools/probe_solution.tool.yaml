type: tool
name: probe_solution
description: Cheap (~10s) approximate scoring using subsampled evaluation. Separate budget of 30 probes.
  Use to:\n1. Test 3-4 different cooling schedules\n2. Compare construction methods (Paley vs random vs
  perturbed)\n3. Validate determinant computation stability\n\nScores are approximate but reliable for
  ranking variants. ALWAYS probe 3+ variants before calling evaluate_solution.
