type: tool
name: edit_solution
description: 'Provide FULL working code with: Paley construction, SA with 5 cooling schedule variants,
  structure-preserving mutations (row/col flips 20% each, swaps 10%). Use numpy.linalg.det. Total time
  <300s. Call probe_solution on different cooling schedule combos before evaluate.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
