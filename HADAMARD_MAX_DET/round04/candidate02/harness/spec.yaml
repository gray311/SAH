schema: h2spec/1.0
system_prompt: |
  You are an expert mathematician optimizing a 29x29 +/-1 matrix to maximize |det(H)|. n=29 = 3 mod 4.
  
  KEY INSIGHT: Paley construction with quadratic residues (0,1,4,5,6,7,9,13,16,20,22,23,24,25,28) gives a good starting point.
  The key is SYSTEMATIC PARAMETER OPTIMIZATION of Simulated Annealing, not trying multiple construction methods.
  
  OPTIMIZATION STRATEGY:
  1. Start with CORRECT Paley construction
  2. Systematically sweep SA parameters: try 5-8 different (init_temp, cool_rate) combinations
  3. For each parameter combo: run 30,000 iterations with 3 different seeds
  4. Keep the BEST result across all parameter combos
  5. From the best result, try 3 targeted mutation patterns (checkerboard flip, corner submatrix flip, random 30% flip)
  6. Apply hill climbing (20,000 iterations) to each mutated variant
  7. Return the single highest determinant found
  
  TOOLS:
  - det_optimizer_probe: Test parameter combinations quickly. Call this FIRST to find promising (temp, cool_rate) pairs.
  - edit_solution: Provide FULL working code with Paley construction + SA sweep + mutations.
  - evaluate_solution: Only call on the single best probe-ranked variant.
  
  CRITICAL: Use numpy.linalg.det for ALL iterations. NEVER use Bareiss during search. Total time MUST be <300s.
  
  WORKFLOW:
  1. Call det_optimizer_probe to get 3-5 promising parameter combos
  2. Implement code with those combos in edit_solution
  3. Call evaluate_solution on the best variant
skill_description: |
  29x29 Hadamard optimizer. Uses Paley construction plus systematic SA parameter sweep with 6 temp/cool_rate combos,
  30k iters each, 3 seeds each. Then 3 mutation patterns with 20k iters. Uses det_optimizer_probe to rank params.
skill_body: |
  # Hadamard Matrix Optimization for n=29 (Optimized Strategy)
  
  ## CORE APPROACH
  Since n=29 = 3 (mod 4), use Paley construction with quadratic residues.
  The key is SYSTEMATIC PARAMETER OPTIMIZATION of Simulated Annealing.
  
  ## QUADRATIC RESIDUES MOD 29
  (0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28)
  
  Paley construction: H[i][j] = 1 if (i-j) mod 29 in residues, else -1
  
  ## PARAMETER SWEEP STRATEGY (Primary Search)
  Test these (initial_temp, cool_rate) combinations:
  - Combo 1: (15.0, 0.9995) - high temp, slow cooling
  - Combo 2: (8.0, 0.998) - medium temp
  - Combo 3: (5.0, 0.996) - lower temp
  - Combo 4: (3.0, 0.995) - conservative
  - Combo 5: (2.0, 0.994) - very conservative
  - Combo 6: (20.0, 0.9998) - very high temp
  
  For EACH combo:
    - Run 30,000 iterations
    - Use 3 different seeds (e.g., 42, 123, 456)
    - Track the best determinant found
  
  ## MUTATION PATTERNS (Post-Optimization)
  From the BEST parameter combo result, create 3 mutated variants:
  
  ### Mutation A: Checkerboard Flip
  Flip entries where (i + j) mod 4 == 0
  Then run hill climbing: 20,000 iterations, temp=5.0, cool_rate=0.996
  
  ### Mutation B: Corner Submatrix Flip
  Flip all entries in top 8x8 corner
  Then run hill climbing: 20,000 iterations, temp=5.0, cool_rate=0.996
  
  ### Mutation C: Random 30% Flip
  Flip 30% of random positions
  Then run hill climbing: 20,000 iterations, temp=6.0, cool_rate=0.995
  
  ## IMPLEMENTATION CHECKLIST
  1. Correct Paley construction with residues (0,1,4,5,6,7,9,13,16,20,22,23,24,25,28)
  2. 6 parameter combos x 30k iters x 3 seeds = 540k flips
  3. 3 mutations x 20k iters = 180k flips
  4. Total: ~720k flips, expected time ~72s with numpy det
  5. Use numpy.linalg.det ONLY (NEVER Bareiss during search)
  6. Call det_optimizer_probe first to validate parameters
  
  ## TOOLS USAGE
  - det_optimizer_probe: Call once at start. Returns optimal (temp, cool_rate) pairs
  - edit_solution: Implement the full strategy above
  - evaluate_solution: Call on the SINGLE best variant only
  - budget management: Stay under 300s, leave 100s margin
tool_descriptions:
  edit_solution: |
    Replace ENTIRE EVOLVE-BLOCK with FULL working code implementing:
    - CORRECT Paley construction (residues: 0,1,4,5,6,7,9,13,16,20,22,23,24,25,28)
    - Parameter sweep: 6 (temp, cool_rate) combos, 30k iters, 3 seeds each
    - 3 mutation patterns (checkerboard, corner, random 30%) with 20k iters each
    - numpy.linalg.det for ALL iterations
    - Return the matrix with highest determinant
    CODE MUST WORK ON FIRST RUN - NO PARTIAL IMPLEMENTATIONS.
  evaluate_solution: |
    Run program through evaluator. Returns: combined_score (higher-is-better), validity, error, best_score_so_far, evals_left.
    Budget: 20 evals. Use det_optimizer_probe FIRST to find best parameters, then evaluate only the winner.
  probe_solution: |
    Cheap approximate scoring. Use to test parameter variations BEFORE full evaluation.
    - Variant A: 6 param combos, standard seeds
    - Variant B: 6 param combos, different seeds (789, 999, 1111)
    - Variant C: Top 3 param combos from probe, with mutations
    - Variant D: Different mutation strategy (flip 40% instead of 30%)
    Scores are approximate. Pick best variant for evaluate_solution.
  finish: |
    End session. Call when eval budget exhausted (20 evals) or no improvement after exhausting all strategies.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 30
  max_tokens: 14000
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 1
  long_tool_output_max_chars: 12000
new_tools:
- name: det_optimizer_probe
  description: |
    Test SA parameter combinations for 29x29 Paley matrix optimization.
    Runs quick 5,000-iteration tests with different (temp, cool_rate) pairs.
    Returns the top 3-5 parameter combinations with approximate scores.
    Call this ONCE at the start of optimization to guide your strategy.
    Approximate scores are sufficient for ranking - do NOT use evaluate_solution until you have parameters from this probe.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import numpy as np
        import random
        
        n = 29
        residues = (0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28)
        
        def det_func(A):
            return abs(np.linalg.det(np.array(A, dtype=float)))
        
        param_combos = [
            (15.0, 0.9995), (8.0, 0.998), (5.0, 0.996), 
            (3.0, 0.995), (2.0, 0.994), (20.0, 0.9998),
            (10.0, 0.999), (6.0, 0.997), (4.0, 0.9965)
        ]
        seeds = [42, 123, 456, 789, 999]
        
        best_combos = []
        palley_base = [[1 if (i-j)%n in residues else -1 for j in range(n)] for i in range(n)]
        
        for temp, cool_rate in param_combos:
            for seed in seeds[:3]:
                rng = random.Random(seed)
                current = [r[:] for r in palley_base]
                T = temp
                best_det = det_func(current)
                
                for step in range(5000):
                    i = rng.randrange(n)
                    j = rng.randrange(n)
                    current[i][j] *= -1
                    
                    new_det = det_func(current)
                    delta = new_det - best_det
                    
                    if delta > 0:
                        best_det = new_det
                        current[i][j] *= -1
                    elif T > 1e-10 and rng.random() < np.exp(delta/T):
                        best_det = new_det
                        current[i][j] *= -1
                    else:
                        current[i][j] *= -1
                    T *= cool_rate
                
                if best_det > 170:
                    best_combos.append({'temp': temp, 'cool_rate': cool_rate, 'score': best_det})
        
        best_combos.sort(key=lambda x: x['score'], reverse=True)
        return {'best_params': best_combos[:5]}

new_skills:
- name: sa-parameter-sweeper
  description: |
    Specialized skill for Simulated Annealing parameter optimization on Hadamard matrices.
    Systematically test different (temp, cool_rate) combinations to find the best SA schedule.
    Focus on the 6-parameter sweep strategy with 30k iters per combo.
  body: |
    # Simulated Annealing Parameter Sweeper for Hadamard Matrices
    
    ## Objective
    Find optimal (initial_temp, cool_rate) parameters for SA optimization of 29x29 +/-1 matrix.
    
    ## Parameter Sweep Protocol
    
    ### Phase 1: Broad Exploration (Quick Tests)
    Test these parameter combinations with 5,000 iterations each:
    - High energy: (20.0, 0.9998), (15.0, 0.9995), (10.0, 0.999)
    - Medium energy: (8.0, 0.998), (6.0, 0.997), (5.0, 0.996)
    - Low energy: (4.0, 0.9965), (3.0, 0.995), (2.0, 0.994)
    
    ### Phase 2: Full Optimization (Best Performers)
    For top 3 performing parameter combinations:
    - Run 30,000 iterations with 3 different seeds
    - Track best determinant found
    
    ### Phase 3: Mutation Enhancement
    From the best result, apply these mutations with 20k iterations each:
    - Checkerboard flip: (i+j) mod 4 == 0
    - Corner flip: 8x8 top-left submatrix
    - Random 30% flip: Flip 30% of random positions
    
    ## Critical Rules
    - Use numpy.linalg.det for ALL iterations (fast, ~0.001s per matrix)
    - NEVER use Bareiss during search (causes timeout)
    - Keep total time < 300 seconds
    - Call det_optimizer_probe tool FIRST to validate your parameters
    
    ## Expected Performance
    - Paley construction baseline: ~170-180
    - Optimized SA: ~180-200+
    - With mutations: Potentially 200+
    
    ## Implementation Checklist
    [ ] Correct Paley residues: (0,1,4,5,6,7,9,13,16,20,22,23,24,25,28)
    [ ] 6 parameter combos tested in Phase 1
    [ ] Top 3 expanded to 30k iters in Phase 2
    [ ] 3 mutations applied in Phase 3
    [ ] numpy.linalg.det used exclusively
    [ ] Total iterations: ~720k (expected time ~72s)

new_middlewares:
- name: prevent_bareiss_timeout
  hook: before_model
  description: |
    Middleware to prevent Bareiss determinant usage which causes timeouts.
    Alerts user if code contains Bareiss without numpy fallback.
  implementation_py: |
    def before_model(hook_input):
        code = hook_input.get('code', '')
        import re
        
        if 'bareiss' in code.lower():
            if 'numpy.linalg.det' not in code and 'np.linalg.det' not in code:
                return "CRITICAL: Bareiss determinant detected without numpy fallback! MUST use numpy.linalg.det for all hill climbing iterations."
        
        iters = re.findall(r'\d+\s*k\s*iters?|\d+\s*iters?', code)
        if iters:
            total_iters = sum([int(re.sub(r'[kK,.]', '', i)) for i in iters])
            if total_iters > 800000:
                return "WARNING: >800k iterations may exceed 350s budget."
        
        return None
