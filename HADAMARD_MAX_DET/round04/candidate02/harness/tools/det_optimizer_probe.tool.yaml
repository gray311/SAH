type: tool
name: det_optimizer_probe
description: 'Test SA parameter combinations for 29x29 Paley matrix optimization.

  Runs quick 5,000-iteration tests with different (temp, cool_rate) pairs.

  Returns the top 3-5 parameter combinations with approximate scores.

  Call this ONCE at the start of optimization to guide your strategy.

  Approximate scores are sufficient for ranking - do NOT use evaluate_solution until you have parameters
  from this probe.'
input_schema:
  type: object
  properties: {}
