type: tool
name: edit_solution
description: 'Replace ENTIRE EVOLVE-BLOCK with FULL working code implementing:

  - CORRECT Paley construction (residues: 0,1,4,5,6,7,9,13,16,20,22,23,24,25,28)

  - Parameter sweep: 6 (temp, cool_rate) combos, 30k iters, 3 seeds each

  - 3 mutation patterns (checkerboard, corner, random 30%) with 20k iters each

  - numpy.linalg.det for ALL iterations

  - Return the matrix with highest determinant

  CODE MUST WORK ON FIRST RUN - NO PARTIAL IMPLEMENTATIONS.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
