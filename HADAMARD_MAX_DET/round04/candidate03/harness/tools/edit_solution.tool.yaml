type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with complete, working code implementing: Paley base construction +
  10-seed simulated annealing search (15k iters each, T=8.0, cool=0.9975). Use numpy.linalg.det for ALL
  determinant calculations. Runtime must be <200s.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
