type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with complete Paley-only optimizer: correct quadratic residues, run
  100 restarts with Schedule A (temp=8.0, cool=0.996, 15k iters) and 100 restarts with Schedule B (temp=2.0,
  cool=0.997, 15k iters), then apply checkerboard perturbation (flip where (i+j)%4==0) and run 10k iters
  with temp=5.0, cool=0.995. Use numpy.linalg.det everywhere. Total must be <300 seconds.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
