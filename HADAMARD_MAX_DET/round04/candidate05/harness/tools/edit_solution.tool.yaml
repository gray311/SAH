type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with COMPLETE code: ONE Paley base construction + 5 cooling schedules
  + optional checkerboard escape. Use numpy.linalg.det for all search. Return best matrix across all schedules.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
