schema: h2spec/1.0
system_prompt: "You are an expert optimizing a 29x29 ±1 matrix to maximize |det(H)|. The seed uses Paley construction which produces a local optimum. YOU MUST CHANGE THE CONSTRUCTION METHOD.\n\nPRIMARY STRATEGY: RANDOM INITIALIZATION + AGGRESSIVE SIMULATED ANNEALING\n1. Initialize matrix RANDOMLY with ±1 entries (not Paley)\n2. Run simulated annealing with 100,000 iterations, initial_temp=20.0, cool_rate=0.9995\n3. Use numpy.linalg.det for all iterations (fast ~0.001s per det)\n4. Total time: ~100k × 0.001s + overhead ≈ 100-150s (under 350s budget)\n5. Return the matrix with highest determinant found\n\nWHY THIS WORKS: Random initialization explores the space differently than Paley, potentially finding better local optima. The aggressive temperature and many iterations allow escape from suboptimal regions.\n\nCONSTRAINTS: - MUST use random initialization (not Paley) - MUST use numpy.linalg.det (not Bareiss) - Total iterations 80k-150k - Time < 350s\n\nTOOLS: edit_solution (provide full working code), evaluate_solution (call once on your best result)."
skill_description: "Random initialization + aggressive SA for n=29. 100k iters, temp=20.0, cool=0.9995. Use numpy det. Time < 350s."
skill_body: "# Random Initialization + Aggressive Simulated Annealing for n=29\n\n## CRITICAL CHANGE FROM SEED\nThe seed uses Paley construction which is deterministic and produces a local optimum. You MUST use RANDOM initialization.\n\n## Algorithm\n1. Create 29x29 matrix with random ±1 entries (use random.randint(0,2)*2-1)\n2. Define det_func: return abs(np.linalg.det(matrix.astype(float)))\n3. Simulated annealing loop:\n   - T = 20.0 (aggressive start)\n   - cool_rate = 0.9995 (slow cooling for exploration)\n   - iterations = 100,000\n   - Randomly flip one entry per iteration\n   - Accept if better, or with prob exp(delta/T)\n   - Track best matrix and its determinant\n4. Return best matrix\n\n## Why Random Initialization?\nPaley construction produces a specific structure. Random initialization explores completely different regions of the solution space.\n\n## Time Budget\n- 100,000 iterations × 0.001s/det ≈ 100s\n- Python overhead ≈ 50s\n- Total ≈ 150s (well under 350s)\n\n## Implementation Notes\n- Import random, numpy\n- Use random.seed(42) for reproducibility in the code\n- Use numpy.linalg.det (fast, numerical)\n- DO NOT use Bareiss (too slow)\n- DO NOT use Paley construction\n- Return the matrix (not the determinant)\n\n## Expected Score Improvement\nRandom initialization + 100k iters should find matrices with higher determinant than the Paley seed (det ≈ 319.83, normalized score 0.531724).\n"
tool_descriptions:
  edit_solution: "Replace EVOLVE-BLOCK with COMPLETE working code implementing: random 29x29 ±1 matrix initialization + simulated annealing (100k iters, temp=20.0, cool_rate=0.9995, numpy.linalg.det). Return the matrix. MUST NOT use Paley construction. MUST be self-contained and runnable."
  evaluate_solution: "Run your code. Returns combined_score (higher-is-better). You should have run your algorithm internally during edit_solution and returned a pre-optimized matrix."
  probe_solution: "Cheap approximate evaluation on subsampled data. For this task, focus your full evaluation on getting the best possible matrix during edit_solution. Probe not essential but can test different temps/iters."
  finish: "End session when you have a good matrix."
sampling:
  temperature: 0.8
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 10000
new_tools:
- name: check_matrix_structure
  description: "Analyze the current matrix and report if it has structure (like Paley) or is truly random. Returns: is_random (bool), has_pattern (bool), pattern_type (str or null).\nCall this to verify your initialization is random."
  input_schema:
    type: object
    properties: {}
  implementation_py: "def run(ctx, args):\n    import numpy as np\n    import random\n    matrix = ctx.get_program()\n    # Check if matrix is ±1 entries\n    vals = np.array(matrix, dtype=float)\n    if not np.all(np.abs(vals) == 1.0):\n        return {\"error\": \"Matrix must have ±1 entries\"}\n    # Check for Paley-like structure\n    residues = {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}\n    n = 29\n    is_paley = True\n    for i in range(n):\n        for j in range(n):\n            diff = (i - j) % n\n            if vals[i,j] != (1 if diff in residues else -1):\n                is_paley = False\n                break\n        if not is_paley:\n            break\n    # Check randomness: count row patterns\n    unique_rows = len(np.unique(vals, axis=0))\n    is_random = unique_rows > n * 0.7  # 70% unique rows suggests randomness\n    has_pattern = is_paley or unique_rows < n * 0.3\n    if has_pattern:\n        pattern_type = \"paley\" if is_paley else \"highly_structured\"\n    else:\n        pattern_type = \"random\"\n    return {\"is_random\": is_random, \"has_pattern\": has_pattern, \"pattern_type\": pattern_type, \"unique_rows\": unique_rows}"
new_skills:
- name: random-hadamard-strategy
  description: "Use random initialization instead of Paley. 100k iterations with temp=20.0, cool=0.9995. numpy det only."
  body: "# Random Hadamard Strategy for n=29\n\n## KEY INSIGHT: Random beats Paley for this task\nThe seed's Paley construction produces a local optimum (det ≈ 319.83). Random initialization explores different regions of the ±1 matrix space.\n\n## IMPLEMENTATION\n1. **Random Initialization**: Create 29x29 matrix with random ±1 entries\n   ```python\n   matrix = [[random.randint(0,2)*2-1 for j in range(29)] for i in range(29)]\n   ```\n\n2. **Aggressive Simulated Annealing**:\n   - Initial temperature: 20.0 (high for exploration)\n   - Cooling rate: 0.9995 (slow cooling)\n   - Iterations: 100,000\n   - Random single-flip mutation per iteration\n   - Accept improvements, sometimes accept worse with prob exp(delta/T)\n\n3. **Determinant Calculation**:\n   - Use numpy.linalg.det (fast, ~0.001s per 29x29)\n   - Track the matrix with highest |det|\n\n4. **Time Budget**:\n   - 100k iters × 0.001s/det ≈ 100s\n   - Python overhead ≈ 50s\n   - Total ≈ 150s (< 350s limit)\n\n## Why This Works\n- Random init: Different starting point than Paley\n- High temp: Escape local optima\n- Slow cooling: Fine-grained search\n- Many iterations: Thorough exploration\n\n## Common Mistakes to Avoid\n- ❌ Using Paley construction (same as seed)\n- ❌ Using Bareiss determinant (too slow)\n- ❌ Too few iterations (< 50k)\n- ❌ Too low initial temp (< 10.0)\n- ❌ Too fast cooling (cool_rate > 0.999)\n- ❌ Not tracking best matrix during search\n\n## Expected Outcome\nShould find matrices with |det| > 319.83, giving score > 0.531724.\n"
new_middlewares:
- name: enforce_random_init
  hook: before_model
  description: "Check that code uses random initialization, not Paley. Warn if Paley detected."
  implementation_py: "def before_model(hook_input):\n    code = hook_input.get('code', '')\n    import re\n    # Check for Paley construction (bad)\n    if 'paley' in code.lower() or 'quadratic_residues' in code.lower():\n        return \"🚫 CRITICAL: Using Paley construction! You MUST use RANDOM initialization. The seed already uses Paley - you need a DIFFERENT approach.\"\n    # Check for random initialization (good)\n    if 'random' in code.lower() and ('randint' in code.lower() or 'choice' in code.lower()):\n        return \"✅ Good: Using random initialization\"\n    # Check for np.array with random values\n    if 'np.random' in code.lower():\n        return \"✅ Good: Using numpy random\"\n    return None"
