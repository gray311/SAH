type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with COMPLETE working code implementing: random 29x29 ±1 matrix initialization
  + simulated annealing (100k iters, temp=20.0, cool_rate=0.9995, numpy.linalg.det). Return the matrix.
  MUST NOT use Paley construction. MUST be self-contained and runnable.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
