type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with FULL working code:

  - Paley construction with correct residues

  - Simulated annealing with 5 seeds, 3 cooling schedules

  - numpy.linalg.det for ALL iterations

  - 20k iterations per seed per schedule

  - Return best matrix across all searches

  - Total runtime must be <300s'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
