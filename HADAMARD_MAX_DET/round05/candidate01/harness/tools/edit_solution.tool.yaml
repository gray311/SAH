type: tool
name: edit_solution
description: 'Replace entire EVOLVE-BLOCK with working Paley construction + simulated annealing code:

  - Correct Paley residues: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}

  - 50,000 iterations, T=10 to 1, cool_rate=0.9985

  - 3 seeds [42,123,456]

  - numpy.linalg.det for all calculations

  - Return complete working code that runs in <300s'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
