type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with code that:

  1. Calls generate_paley_variants() to get 5 matrices

  2. Runs 5000-iteration SA on each (T=10.0, cool=0.998)

  3. Picks top 2, runs 20000-iteration SA (T=3.0, cool=0.997)

  4. Returns the best matrix

  5. Uses numpy.linalg.det exclusively'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
