type: tool
name: edit_solution
description: Replace EVOLVE-BLOCK with code that implements Paley construction, SA function, parameter
  grid search (8 variants), escape patterns, and runs quick_local_search first to rank. Output only the
  final best matrix.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
