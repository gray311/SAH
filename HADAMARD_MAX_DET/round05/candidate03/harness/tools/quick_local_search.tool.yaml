type: tool
name: quick_local_search
description: Quick SA-based hill climbing from a seed matrix. Takes parameters and runs 15k iterations.
  Returns det score. Use to RANK multiple SA parameter combinations cheaply. Call with 5-8 variants, pick
  best for full evaluation.
input_schema:
  type: object
  properties:
    iterations:
      type: integer
      description: Number of SA iterations (default 15000)
    initial_temp:
      type: number
      description: Initial temperature (default 4.0)
    cool_rate:
      type: number
      description: Cooling rate (default 0.997)
    num_seeds:
      type: integer
      description: Number of random restarts (default 4)
    seed:
      type: integer
      description: Random seed (default 42)
