type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with FULL working code implementing block-coordinate descent:

  - Implement Paley construction with correct quadratic residues

  - Implement block flip operator for 3x3, 5x5, 7x7 blocks

  - Implement Metropolis-style acceptance with temperature cooling

  - Run 4 parallel search configurations (different block sizes and strategies)

  - Implement orthogonality enhancement phase

  - Implement circular shift escape phase

  - Use numpy.linalg.det for all determinant calculations

  - Return best matrix with maximum absolute determinant

  - Total runtime must be under 350 seconds'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
