schema: h2spec/1.0
system_prompt: "You are an expert mathematician optimizing a 29x29 ±1 matrix to maximize |det(H)|. n=29 ≡ 3 mod 4.\n\nCRITICAL: Use ONLY ONE construction method per evaluation - correct Paley construction with quadratic residues {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}.\n\nSTRATEGY: Multi-stage hill climbing WITHIN TIME BUDGET (max 250s, leave 100s margin):\n\nPHASE 1 - Multiple Cooling Schedules (BREADTH):\n  Run 3 COMPLETE searches with different cooling schedules:\n  - Schedule A: T=8.0, cool_rate=0.995, 5000 iters\n  - Schedule B: T=3.0, cool_rate=0.997, 15000 iters  \n  - Schedule C: T=1.0, cool_rate=0.998, 20000 iters\n  Keep BEST result across all 3 schedules.\n\nPHASE 2 - Seed Diversity (DEPTH):\n  For the BEST schedule from Phase 1, run with 3 DIFFERENT SEEDS:\n  - Seed 1: 42\n  - Seed 2: 12345\n  - Seed 3: 9998877\n  Keep overall BEST.\n\nPHASE 3 - Targeted Escape (REFINEMENT):\n  From Phase 2 best, run 2 targeted escapes:\n  - Escape A: Flip 100 random positions, run 5000 iters with T=10.0, cool_rate=0.999\n  - Escape B: Flip checkerboard pattern where (i+j)%4==0, run 5000 iters with T=5.0, cool_rate=0.997\n\nTOTAL WORKFLOW: 3 schedules × 3 seeds + 2 escapes = 11 complete searches\nExpected time: ~10-12 searches × 20s = 220-240 seconds (within 250s budget)\n\nTOOLS:\n- probe_solution: Test 2-3 cooling schedule variations BEFORE full evaluation. Use subsampling to rank schedules.\n- edit_solution: Provide COMPLETE working code implementing exactly the workflow above.\n- evaluate_solution: Call ONLY once with the single best probe-ranked variant.\n\nCRITICAL SUCCESS FACTORS:\n✓ Implement ONLY Paley construction (no random matrices, no perturbed variants)\n✓ Use 3 cooling schedules with COMPLETE searches (don't truncate)\n✓ Use 3 seeds per best schedule (not 4+ families)\n✓ Run targeted escapes on the BEST result only\n✓ Total time MUST be <250s (enforce in code with progress printing)\n✓ Use numpy.linalg.det for ALL iterations (fast, reliable for search)\n✓ Print progress every 5000 iterations so you can verify completion\n\nSTART by implementing the 3-schedule, 3-seed workflow with 2 escape attempts. Call edit_solution with complete code."
skill_description: "29x29 Hadamard optimizer using ONLY Paley construction. 3 cooling schedules (8.0/3.0/1.0), 3 seeds per schedule, 2 escape patterns. Total ~11 searches, <250s runtime. Probe cooling schedules before evaluate."
skill_body: "# 29x29 Hadamard Matrix Optimization\n\n## Task\nMaximize |det(H)| for 29×29 ±1 matrix using Paley construction.\n\n## CORRECT PALEY CONSTRUCTION\nQuadratic residues mod 29: {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}\nFor H[i][j]: diff = (i - j) % 29; H[i][j] = 1 if diff in residues else -1\n\n## WORKFLOW (11 searches, ~240s total)\n\n### PHASE 1: Three Cooling Schedules (9 searches)\nFor EACH of 3 schedules, run 3 seeds:\n\nSchedule A (Broad): T=8.0, cool_rate=0.995, iterations=5000\nSchedule B (Medium): T=3.0, cool_rate=0.997, iterations=15000\nSchedule C (Fine): T=1.0, cool_rate=0.998, iterations=20000\n\nSeeds per schedule: [42, 12345, 9998877]\n\nTrack best_det and best_matrix across all 9 searches.\n\n### PHASE 2: Two Escape Attempts (2 searches)\nFrom best_matrix above:\n\nEscape A: Flip 100 random positions → run hill climb T=10.0, cool_rate=0.999, iters=5000\nEscape B: Flip checkerboard where (i+j)%4==0 → run hill climb T=5.0, cool_rate=0.997, iters=5000\n\n### PHASE 3: Selection\nReturn the matrix with highest |det| across all 11 searches.\n\n## IMPLEMENTATION DETAILS\n\n- Use numpy.linalg.det for ALL determinant calculations (fast, ~0.001s per call)\n- Total iterations: ~9×20000 + 2×5000 = 190000 flips\n- Expected time: ~12-14 searches × 20s = 240s (within 250s budget)\n- Print \"Completed search N/M\" every 5000 iterations for progress tracking\n- Use random.seed(seed) for reproducibility\n\n## PROBE STRATEGY\nBefore full evaluation:\n1. Call probe_solution with 3 variants: (A) Schedule A only, (B) Schedule B only, (C) Schedule C only\n2. Pick best probe result\n3. Run full evaluation on that variant\n\n## CRITICAL CONSTRAINTS\n- Total runtime MUST be <250 seconds\n- Use ONLY Paley construction (no random initialization)\n- numpy.linalg.det for all iterations (never Bareiss during search)\n- Complete all 11 searches before returning\n- Print progress every 5000 iterations\n"
tool_descriptions:
  edit_solution: "Replace EVOLVE-BLOCK with COMPLETE working code implementing:\n  1. Correct Paley construction with residues {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}\n  2. Three cooling schedules: (8.0/0.995/5000), (3.0/0.997/15000), (1.0/0.998/20000)\n  3. Three seeds per schedule: [42, 12345, 9998877]\n  4. Two escape patterns on best result\n  5. numpy.linalg.det for ALL iterations\n  6. Progress printing every 5000 iterations\n  7. Total time <250s enforcement\n  Provide FULL working code, not partial edits."
  evaluate_solution: 'Run through evaluator. Returns combined_score, validity, error, best_score_so_far, evals_left. Budget: 20 evals (~350s each). Use probe_solution FIRST to rank cooling schedule variants, then evaluate only the winner.'
  probe_solution: "Cheap approximate scoring on subsampled data (~10s). Budget: 30 probes. Use to test 3 COOLING SCHEDULE variants BEFORE evaluate_solution:\n  - Variant A: Schedule A only (T=8.0, 0.995, 5000 iters, seed=42)\n  - Variant B: Schedule B only (T=3.0, 0.997, 15000 iters, seed=42)\n  - Variant C: Schedule C only (T=1.0, 0.998, 20000 iters, seed=42)\n  Scores are approximate but reliable for ranking. Pick best for evaluate."
  finish: "End session. Call when eval budget exhausted (20 evals) or after trying 2-3 different cooling schedule strategies with no improvement."
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 30
  max_tokens: 12288
agent:
  max_iterations: 40
middleware:
  budget_reminder_from_left: 3
  long_tool_output_max_chars: 10000
new_tools:
- name: validate_paley_construction
  description: "Verify Paley construction produces valid ±1 matrix and compute initial determinant. Returns: matrix shape, entry validation (all ±1?), det value, and residuals (|i-j|%29 vs expected).\nCall this ONCE at program start to validate your Paley residues are correct.\nThis is a SAFE, fast check that doesn't consume evaluation budget."
  input_schema:
    type: object
    properties: {}
  implementation_py: "def run(ctx, args):\n    import numpy as np\n    n = 29\n    residues = {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}\n    H = np.zeros((n, n), dtype=int)\n    for i in range(n):\n        for j in range(n):\n            diff = (i - j) % n\n            H[i, j] = 1 if diff in residues else -1\n    # Validate: all entries must be ±1\n    valid_entries = np.all(np.abs(H) == 1)\n    det_val = abs(np.linalg.det(H.astype(float)))\n    # Check diagonal and symmetry\n    on_diagonal = all(abs(H[i,i]) == 1 for i in range(n))\n    return {\n        \"n\": n,\n        \"matrix_shape\": list(H.shape),\n        \"all_entries_pm1\": bool(valid_entries),\n        \"det_value\": float(det_val),\n        \"on_diagonal_pm1\": bool(on_diagonal),\n        \"residues_used\": sorted(list(residues)),\n        \"validation_passed\": valid_entries and on_diagonal\n    }"
new_skills:
- name: paley-hadamard-n29
  description: Specialized skill for n=29 Hadamard using ONLY correct Paley construction. 3 cooling schedules, 3 seeds, 2 escapes. Validate construction first. Total ~240s.
  body: "# Paley Hadamard Optimization for n=29\n\n## Task\nMaximize |det(H)| for 29×29 matrix with entries ±1.\nSince 29 ≡ 3 (mod 4), use Paley construction with quadratic residues.\n\n## PALEY CONSTRUCTION (MUST BE CORRECT)\nQuadratic residues mod 29: {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}\n\nFor each entry:\n  diff = (i - j) % 29\n  H[i][j] = 1 if diff in residues else -1\n\n**VERIFY FIRST**: Use validate_paley_construction tool to confirm your residues are correct.\n\n## WORKFLOW (11 searches, ~240s total)\n\n### PHASE 1: Three Cooling Schedules (9 searches)\nRun 3 COMPLETE hill-climbing searches with different schedules:\n\n| Schedule | Temp | Cool Rate | Iterations | Goal |\n|----------|------|-----------|------------|------|\n| A | 8.0 | 0.995 | 5000 | Broad exploration |\n| B | 3.0 | 0.997 | 15000 | Medium refinement |\n| C | 1.0 | 0.998 | 20000 | Fine tuning |\n\nFor each schedule, run with 3 seeds: [42, 12345, 9998877]\nKeep the BEST result across all 9 searches.\n\n### PHASE 2: Two Targeted Escapes (2 searches)\nFrom Phase 1 best:\n\n1. **Escape A**: Flip 100 random positions → hill climb T=10.0, cool=0.999, iters=5000\n2. **Escape B**: Flip checkerboard where (i+j)%4==0 → hill climb T=5.0, cool=0.997, iters=5000\n\n### PHASE 3: Selection\nReturn matrix with highest |det|.\n\n## IMPLEMENTATION CHECKLIST\n\n1. ✓ Start with CORRECT Paley construction (residues verified)\n2. ✓ Use numpy.linalg.det for ALL iterations (never Bareiss in search)\n3. ✓ Implement exactly 3 cooling schedules with correct parameters\n4. ✓ Run 3 seeds per schedule (not 4+)\n5. ✓ Print progress every 5000 iterations\n6. ✓ Total time <250 seconds (leaves 100s margin)\n7. ✓ Use probe_solution to test schedules before full evaluation\n8. ✓ Implement 2 escape patterns on best result\n9. ✓ Track best_det and best_matrix across all searches\n\n## CRITICAL CONSTRAINTS\n- ONLY Paley construction (no random matrices, no perturbations during initialization)\n- numpy.linalg.det for search (fast, reliable)\n- Complete all 11 searches before returning\n- Time budget: max 250s\n- Use probe_solution to rank cooling schedules\n\n## SAMPLE OUTPUT FORMAT\nPrint to stdout:\n- \"=== Paley Construction Validation ===\"\n- \"Residues: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}\"\n- \"Phase 1: Starting search A-1 (Schedule A, seed 42)\"\n- \"Completed search A-1 in 3.2s, det=0.XXXXXX\"\n- \"Phase 2: Starting Escape A from best\"\n- \"Final best det: 0.XXXXXX from search C-3\"\n"
new_middlewares:
- name: enforce_time_budget
  hook: before_tool
  description: "Enforce strict time budget before each tool call. Returns warning if code exceeds 240s expected runtime. Blocks excessive iterations."
  implementation_py: "def before_tool(hook_input):\n    code = hook_input.get('code', '')\n    import re\n    # Extract iteration counts\n    iters = re.findall(r'\\d+\\s*(?:iters?|iterations?|iters?_per)', code, re.IGNORECASE)\n    total_iters = sum(int(i.strip()) for i in iters)\n    # Check if total iterations would exceed budget\n    # Rough estimate: 29x29 det = 0.001s, so 100k iters = 100s\n    estimated_time = total_iters * 0.0001  # conservative estimate\n    if estimated_time > 240:\n        return f\"⚠️ WARNING: Estimated time {estimated_time:.0f}s exceeds 240s budget. Reduce iterations or parallelize fewer searches.\"\n    # Check for Bareiss during search\n    if 'bareiss' in code.lower():\n        if 'numpy.linalg.det' not in code:\n            return \"❌ ERROR: Bareiss determinant used without numpy.linalg.det fallback. This will cause timeout.\"\n    return None"
