type: tool
name: finish
description: End session. Call when eval budget exhausted (20 evals) or after trying 2-3 different cooling
  schedule strategies with no improvement.
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
