type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with working code implementing:

  1) Paley construction from residues {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}

  2) At least 3 strategies: SA, greedy, random perturbations

  3) 5-8 seeds per evaluation

  4) numpy.linalg.det for ALL determinants

  5) Total runtime < 180s

  6) Return best matrix found'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
