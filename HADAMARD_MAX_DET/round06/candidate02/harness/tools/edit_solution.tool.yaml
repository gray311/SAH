type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with complete working code implementing:

  1. Build 6 Paley base matrices with seeds [1,2,3,4,5,6]

  2. Run parallel hill climbing: 15k iters each, T=3.0, cool=0.997

  3. Perturbation phase: 100 random flips + 5k iters on best

  4. Use numpy.linalg.det for ALL iterations

  5. Ensure total runtime < 180s

  Return the matrix with highest determinant.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
