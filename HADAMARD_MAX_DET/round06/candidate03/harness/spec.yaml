schema: h2spec/1.0
system_prompt: |
  You are optimizing a 29x29 ±1 matrix to maximize |det(H)|.
  n=29 ≡ 3 mod 4, so true Hadamard matrices don't exist, but we can find near-optimal solutions.

  SEARCH STRATEGY: Use multi-phase exploration with probing.

  PHASE 1: Test different construction methods
    - Paley construction with residues {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
    - Random ±1 initialization
    - Structured patterns (checkerboard, cyclic shifts of Paley)

  PHASE 2: For each construction, do hill climbing
    - Use numpy.linalg.det for FAST evaluation during search
    - Run 5,000-15,000 iterations per construction variant
    - Try 3-5 random seeds per construction

  PHASE 3: Use probe_solution to compare strategies
    - Test 3-5 variant configurations with probe_solution
    - Select the best for full evaluate_solution
    - Probe is cheap (~10s) and doesn't use evaluation budget

  CRITICAL: Call probe_solution FIRST to test different strategies, then evaluate only the winner.

  NEVER use Bareiss during search (too slow). Use numpy.linalg.det only.
  Expected time per variant: <30 seconds.
skill_description: |
  Multi-phase Hadamard optimizer: test multiple constructions (Paley, random, structured),
  hill-climb each with numpy.det, use probe_solution to rank variants, evaluate only the best.
skill_body: |
  # Multi-Phase Hadamard Matrix Optimizer for n=29

  ## PHASE 1: Construction Methods
  Test these initialization strategies:

  A. Paley Construction (recommended first):
     Residues mod 29: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
     For H[i][j]: diff = (i-j) mod 29
       H[i][j] = 1 if diff in residues, else -1

  B. Random Initialization:
     Fill matrix with random ±1 entries

  C. Structured Perturbation:
     Start with Paley, flip 10-20% of entries randomly

  ## PHASE 2: Hill Climbing for Each Construction
  For each construction method:
    - Run 3-5 different random seeds
    - For each seed: 5,000-10,000 simulated annealing iterations
    - Temperature: start at 3.0, cool by 0.996 per iteration
    - Use numpy.linalg.det for ALL determinant calculations during search
    - Track best determinant found

  Simulated Annealing Parameters:
    - Flip one random element at each iteration
    - Accept if delta > 0, or with probability exp(delta/T) if delta < 0
    - After acceptance, update best if new > best

  ## PHASE 3: Strategy Selection with Probing
  Use probe_solution to test 3-5 variant configurations:
    - Variant 1: Paley + 5k iters, T=3.0, cool=0.996, 3 seeds
    - Variant 2: Random init + 10k iters, T=2.0, cool=0.997, 3 seeds
    - Variant 3: Perturbed Paley + 5k iters, T=3.0, cool=0.995, 3 seeds

  Call probe_solution on these variants, pick the winner, then call evaluate_solution on it.

  ## CRITICAL RULES
  - Use numpy.linalg.det for ALL determinants during search (NOT Bareiss)
  - Total search time must be < 350 seconds
  - Use probe_solution BEFORE evaluate_solution to save budget
  - Try 3-5 construction methods in parallel, pick the best
  - Expected iterations per variant: 5,000-10,000 (NOT 100,000)
tool_descriptions:
  edit_solution: |
    Replace EVOLVE-BLOCK with FULL working code implementing:
    1. Multiple construction methods (Paley, random, perturbed Paley)
    2. For each: 3-5 seeds with 5,000-10,000 SA iterations
    3. Use numpy.linalg.det for ALL determinants
    4. Return the matrix with highest determinant
    Total runtime must be < 300 seconds. Provide complete working code.
  evaluate_solution: |
    Run program through evaluator. Returns combined_score. Budget: 20 evals.
    Use probe_solution FIRST to rank variants, then evaluate only the winner.
  probe_solution: |
    Cheap approximate scoring on subsampled data (~10s). Separate probe budget: 30.
    Use to test 3-5 variant configurations with different parameters:
    - V1: Paley, 5k iters, T=3.0, cool=0.996, 3 seeds
    - V2: Random, 10k iters, T=2.0, cool=0.997, 3 seeds
    - V3: Perturbed Paley, 5k iters, T=3.0, cool=0.995, 3 seeds
    - V4: Paley, 10k iters, T=2.5, cool=0.996, 3 seeds
    - V5: Different cooling (T=5.0, cool=0.998)
    Scores rank variants; call probe on 3-5 variants, pick best for evaluate.
  finish: |
    End when budget exhausted (20 evals) or no improvement after exploring strategies.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 40
  max_tokens: 14000
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 12000
new_tools:
  - name: scan_construction_space
    description: |
      Rapidly test multiple construction methods and SA parameters.
      Returns ranking of variants by approximate det (using probe internally).
      Call this early to identify promising strategies.
    input_schema:
      type: object
      properties: {}
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          import random

          results = []
          n = 29
          residues = {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}
          
          for t_start in [2.0, 3.0, 5.0]:
              for cool_rate in [0.995, 0.996, 0.997]:
                  for seeds in [3, 5]:
                      best_det = 0
                      for s in range(seeds):
                          rng = random.Random(1000000 + s)
                          cur = np.zeros((n, n), dtype=int)
                          for i in range(n):
                              for j in range(n):
                                  diff = (i - j) % n
                                  cur[i, j] = 1 if diff in residues else -1
                          T = t_start
                          for _ in range(5000):
                              i, j = rng.randrange(n), rng.randrange(n)
                              cur[i, j] *= -1
                              nd = abs(np.linalg.det(cur.astype(float)))
                              if nd > best_det:
                                  best_det = nd
                          cur = np.zeros((n, n), dtype=int)
                          for i in range(n):
                              for j in range(n):
                                  diff = (i - j) % n
                                  cur[i, j] = 1 if diff in residues else -1
                      results.append({"type": "paley", "temp": t_start, 
                                    "cool": cool_rate, "seeds": seeds, "det": best_det})
          
          results.sort(key=lambda x: x["det"], reverse=True)
          return {"rankings": results[:10]}
new_skills:
  - name: hadamard-multi-construction
    description: |
      Specialized skill: Test multiple constructions (Paley, random, perturbed),
      use numpy.det for fast search, probe before evaluate, focus on hill-climbing.
    body: |
      # Hadamard Matrix Multi-Construction Optimizer for n=29

      ## Key Insight
      Since n=29 ≡ 3 (mod 4), true Hadamard matrices don't exist.
      Best strategy: test multiple construction methods + hill climb.

      ## Construction Methods to Test

      1. PALEY CONSTRUCTION (mathematically grounded)
         Residues mod 29: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
         H[i][j] = 1 if (i-j) mod 29 in residues, else -1

      2. RANDOM INITIALIZATION
         Fill matrix with random ±1 entries

      3. PERTURBED PALEY
         Start with Paley, flip 10-20% of entries randomly

      ## Hill Climbing Strategy
      For EACH construction method:
        - Run 3-5 different random seeds
        - Per seed: 5,000-10,000 simulated annealing iterations
        - Temperature: 2.0-5.0, cool rate: 0.995-0.997
        - Use numpy.linalg.det for ALL determinants during search
        - Accept if delta > 0, or with prob exp(delta/T)

      ## Workflow (CRITICAL ORDER)
      1. Implement multi-construction code with above methods
      2. Call probe_solution on 3-5 variant configurations
      3. Pick the best from probe results
      4. Call evaluate_solution on the winner
      5. If no improvement, try: more iterations, different seeds

      ## Time Budget
      - Total per evaluation: < 300 seconds
      - Iterations per variant: 5,000-10,000 (NOT 100,000!)
      - Use probe to avoid wasting evaluate budget on poor variants

      ## Determinant Calculation
      - SEARCH PHASE: ALWAYS use numpy.linalg.det (fast)
      - NEVER use Bareiss during hill climbing (causes timeout)
      - Bareiss only acceptable for final validation if needed
new_middlewares:
  - name: monitor_compute_usage
    hook: before_model
    description: |
      Warn if code uses Bareiss during search or exceeds iteration budget.
      Ensures fast numpy.det is used and total iterations are reasonable.
    implementation_py: |
      def before_model(hook_input):
          code = hook_input.get('code', '')
          if 'bareiss' in code.lower():
              return "WARNING: Bareiss detected! MUST use numpy.linalg.det for search phase."
          import re
          iters = re.findall(r'\d+,?\s*iters?\s*[=:]?\s*\d+', code)
          total = 0
          for m in iters:
              nums = re.findall(r'\d+', m)
              for n in nums:
                  total += int(n)
          if total > 500000:
              return "WARNING: >500k iterations may timeout. Reduce iterations."
          return None
