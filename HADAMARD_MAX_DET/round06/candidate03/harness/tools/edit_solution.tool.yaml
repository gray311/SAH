type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with FULL working code implementing:

  1. Multiple construction methods (Paley, random, perturbed Paley)

  2. For each: 3-5 seeds with 5,000-10,000 SA iterations

  3. Use numpy.linalg.det for ALL determinants

  4. Return the matrix with highest determinant

  Total runtime must be < 300 seconds. Provide complete working code.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
