type: tool
name: probe_solution
description: 'Cheap approximate scoring on subsampled data (~10s). Separate probe budget: 30.

  Use to test 3-5 variant configurations with different parameters:

  - V1: Paley, 5k iters, T=3.0, cool=0.996, 3 seeds

  - V2: Random, 10k iters, T=2.0, cool=0.997, 3 seeds

  - V3: Perturbed Paley, 5k iters, T=3.0, cool=0.995, 3 seeds

  - V4: Paley, 10k iters, T=2.5, cool=0.996, 3 seeds

  - V5: Different cooling (T=5.0, cool=0.998)

  Scores rank variants; call probe on 3-5 variants, pick best for evaluate.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
