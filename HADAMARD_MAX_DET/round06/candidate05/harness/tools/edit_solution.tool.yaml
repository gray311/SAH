type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with complete working code implementing:

  - Multiple construction methods: Paley, random, perturbed Paley

  - Parameter exploration: vary T, cooling rate, iterations, num_seeds

  - Use numpy.linalg.det for ALL determinants

  - Code must complete in <300 seconds

  - Return the matrix with highest determinant found'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
