type: tool
name: probe_solution
description: 'Cheap approximate scoring (separate budget: 30 probes).

  Use to test DIFFERENT construction methods and parameter combinations BEFORE evaluate:

  - Vary construction: Paley vs random vs perturbed Paley

  - Vary temperature: 1.0, 2.5, 5.0, 10.0

  - Vary cooling rate: 0.992, 0.995, 0.997, 0.998, 0.999

  - Vary iterations per seed: 10000, 25000, 50000, 75000, 100000

  - Vary num_seeds: 3, 5, 8, 12

  Score is approximate but reliable for ranking variants.

  Call 5-10 probes per evaluation, pick best for evaluate.'
