type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with complete program implementing ONE variant from Phase 1. Variant
  must:

  - Use numpy.linalg.det (never Bareiss for search)

  - Implement SA with specified iterations, T, cool_rate, seeds

  - Return 29x29 +-1 matrix

  - Complete code must run in < 200 seconds'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
