type: tool
name: fast_rank
description: Compute |det(H)| for a given 29x29 +-1 matrix using numpy.linalg.det. Returns float determinant
  value. Use for quick comparison of candidate matrices within a single run (not across runs). Fast (~0.001s
  per matrix).
input_schema:
  type: object
  properties:
    matrix:
      type: object
      description: 29x29 matrix as list of lists
