type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with COMPLETE working code implementing:

  1. EXACT Paley construction with residues {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}

  2. 500 seeds in range 4000-4499

  3. Your chosen SA parameters: iterations per seed, starting T, cool_rate

  4. Use numpy.linalg.det for ALL determinant calculations

  5. Return the matrix with highest determinant found


  Example structure:

  - construct_hadamard_matrix(n=29, iterations_per_seed=25000, T_start=10.0, cool_rate=0.997)

  - Seeds: range(4000, 4500)

  - SA loop: flip random element, compute det, accept/reject based on SA rules

  - Track best matrix across all 500 seeds'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
