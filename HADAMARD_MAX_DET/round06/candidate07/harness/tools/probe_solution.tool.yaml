type: tool
name: probe_solution
description: 'Cheap approximate scoring on subsampled data (~10s, separate 30-probe budget).

  Use this to test 5-10 parameter variations BEFORE spending a full evaluation.


  Test variations in:

  - iterations_per_seed: 15k, 20k, 25k, 30k, 35k

  - T_start: 3, 5, 10, 15, 20

  - cool_rate: 0.995, 0.996, 0.997, 0.998, 0.999


  Run each variation with only 200 iterations per seed (fast), pick best for full eval.'
