type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with COMPLETE code implementing:

  1. Generate 12-15 perturbed Paley residue sets (flip 1-3 bits)

  2. Build Paley matrix from each residue set

  3. Apply 25k SA iterations to each (T=3.0, alpha=0.9965)

  4. Track best determinant across all variants

  5. Use numpy.linalg.det exclusively

  6. Return the best matrix'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
