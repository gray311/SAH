type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with COMPLETE working code:

  - Call generate_variants() once at start (get 5 diverse matrices) - Implement SA refinement for each
  variant (10-30 seeds, 5k-10k iters) - Call perturb_best() with your overall best to generate perturbed
  variants - Use numpy.linalg.det for ALL determinant calculations - Track best |det| across all methods
  and perturbed variants - Return the globally best matrix

  Time budget: <180s. Total flips: ≤800,000. NO Bareiss in search.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
