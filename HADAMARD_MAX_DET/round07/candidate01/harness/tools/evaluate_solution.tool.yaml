type: tool
name: evaluate_solution
description: 'Run your code and return combined_score. Budget: 20 evals total.

  Expected time: 60-150 seconds (5 constructions × 10-30 seeds × 5k-10k iters × numpy det).

  Strategy: - Evals 1-3: Test different construction combinations - Evals 4-8: Refine winners from evals
  1-3, try perturb_best on best - Evals 9-14: Aggressive perturbation search from your best - Evals 15-20:
  Combine all strategies, push to limit

  If score improves >10%, try: more seeds, slightly more iterations, different T/cool combo.'
input_schema:
  type: object
  properties: {}
  additionalProperties: false
