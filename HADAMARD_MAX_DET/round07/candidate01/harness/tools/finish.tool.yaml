type: tool
name: finish
description: End session. Call when eval budget exhausted (20 evals) or when perturb_best search plateaus
  (3 consecutive evals with <1% improvement).
input_schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      description: One line on the final approach and best score.
  required:
  - summary
  additionalProperties: false
