type: tool
name: generate_variants
description: 'Generate 4-5 diverse starting matrices using DIFFERENT construction heuristics.

  This gives you actual NEW search starting points beyond just Paley construction.

  Call this ONCE at the start to get diverse seeds for your construction competition.


  Methods included:

  - Paley (quadratic residues mod 29)

  - Random ±1 matrix

  - Thue-Morse sequence based

  - Low-discrepancy lattice pattern

  - Structured block diagonal


  Each variant returns a 29x29 ±1 matrix ready for SA refinement.'
