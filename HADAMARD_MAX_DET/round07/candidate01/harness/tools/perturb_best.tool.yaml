type: tool
name: perturb_best
description: 'Given a best matrix, generate perturbed variants by flipping random entries.

  This helps escape local optima within a promising region.

  Call this with your current best from a previous evaluation.


  Parameters:

  - num_flips: how many random entries to flip per variant (default 5-20)

  - num_variants: how many perturbed versions to generate (default 5-10)


  Each variant is ready for quick SA refinement (10-50 seeds, 2k-5k iters).'
input_schema:
  type: object
  properties:
    best_matrix:
      type: array
      description: 29x29 array of ±1 (flattened or 2D list)
    num_flips:
      type: integer
      default: 10
    num_variants:
      type: integer
      default: 5
