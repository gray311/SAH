type: tool
name: edit_solution
description: "Replace EVOLVE-BLOCK with COMPLETE working code implementing:\n\n1. EXACT Paley construction\
  \ with residues {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}\n\n2. Generate 6 starting matrices:\n   - 3\
  \ perturbed Paley (flip 5, 10, 15 entries)\n   - 2 random ±1 matrices\n   - 1 original Paley\n\n3. Run\
  \ SA on each with different parameters:\n   - Perturbed Paley: T=3.0, 2000 iters, cool=0.995\n   - Random\
  \ moderate: T=5.0, 2000 iters, cool=0.997\n   - Random aggressive: T=15.0, 2000 iters, cool=0.998\n\
  \   - Original Paley: T=3.0, 2000 iters, cool=0.997\n\n4. Use numpy.linalg.det for ALL determinant calculations\n\
  \n5. Track best matrix across all 6 chains\n\nExample structure:\n- Define construct_paley_matrix(n,\
  \ residues)\n- Define create_perturbed_paley(paly, num_flips)\n- Define create_random_matrix(n)\n- Define\
  \ sa_run(start_mat, T, iters, cool_rate, seed)\n- In main: generate 6 starts, run 6 SAs in parallel,\
  \ return best"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
