type: tool
name: test_diverse_starts
description: 'Rapidly test whether diverse starting matrices (perturbed Paley + random)

  beat single-seed SA. Call ONCE early to validate the multi-chain approach.


  Returns test results for 4 strategies:

  - Single Paley SA (baseline)

  - Perturbed Paley (5 flips)

  - Perturbed Paley (15 flips)

  - Random start SA


  Each strategy runs 100 iterations with numpy.det. If any strategy

  shows significantly better determinants than seed, pursue that approach.'
input_schema:
  type: object
  properties: {}
