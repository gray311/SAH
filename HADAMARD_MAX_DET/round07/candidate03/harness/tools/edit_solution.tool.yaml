type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with COMPLETE working code implementing MULTIPLE construction methods
  (at least 3): random initialization, Paley construction, and greedy construction. Run 3-5 independent
  searches with different starting matrices and SA parameters. Return the BEST result across all searches.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
