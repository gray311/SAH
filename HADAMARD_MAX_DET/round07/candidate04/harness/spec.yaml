With multiple constructions + better SA params, expect score 0.60-0.65.'
new_middlewares:
  - name: prevent_seed_overhead
    hook: before_model
    description: 'Prevent harness from using too many seeds or too few iterations. Force efficient configs.'
    implementation_py: 'def before_model(hook_input):
        code = hook_input.get("code", "")
        import re
        # Check seed count
        seed_range = re.findall(r"range\\([^,]+,\\s*(\\d+)\\)", code)
        if seed_range:
            num_seeds = seed_range[0]
            if int(num_seeds) > 100:
                return "Warning: >100 seeds is inefficient. Use 3-30 seeds with 50k-200k iterations each."
        # Check total iterations
        iters = re.findall(r"(\\d+)\\s*(?:iters?|iterations)", code)
        total = sum(int(i) for i in iters[:10])
        if total > 500000:
            return "Warning: >500k iterations may timeout. Reduce to 300k-400k total."
        # Check if using numpy for det during search
        if "numpy" in code and "linalg.det" not in code:
            return "Warning: Ensure you use numpy.linalg.det for all determinant calculations."
        return None'
