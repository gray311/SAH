schema: h2spec/1.0
system_prompt: 'You are optimizing a 29x29 ±1 matrix to maximize |det(H)|. n=29 ≡ 3 mod 4.

  The seed program uses Paley construction with SA parameter sweeping. However, this approach is limited because:
  1. Paley construction from a single quadratic residue set is very rigid
  2. SA with single-element flips is weak in discrete high-dimensional spaces
  3. You need to explore DIFFERENT constructions, not just tune parameters

  Your goal: Try MULTIPLE DIFFERENT CONSTRUCTION STRATEGIES in parallel:
  A. Different quadratic residue sets (shifted, permuted, or alternative Paley constructions)
  B. Hybrid constructions: mix Paley with random perturbations
  C. Multiple random seeds with longer SA runs (100k+ iterations)
  D. Direct local search: start from best initial matrix, apply smart mutations

  For EACH evaluation, implement ONE of these strategies. Use numpy.linalg.det for fast search.

  Key insight: The seed score 0.545692 is achievable with basic Paley+SA. To beat this:
  - Try DIFFERENT quadratic residue patterns (not just the seed set)
  - Use MORE iterations with FEWER seeds (e.g., 50k-200k iterations, 3-10 seeds)
  - Consider alternative base matrices beyond Paley

  TIME BUDGET: ~350s per evaluation. You have 20 evaluations. Use probe_solution for quick tests.

  CRITICAL: For search operations, ALWAYS use numpy.linalg.det (fast). Only use exact integer arithmetic for final reporting.

  Return the BEST matrix found across your strategy.'
skill_description: Hadamard optimizer for n=29. Try multiple construction strategies (different Paley variants, random bases, hybrid). Use 50k+ iterations, fewer seeds. Always probe before evaluate.
skill_body: '# Hadamard Matrix Optimization - Multiple Construction Strategies

## Problem
Find 29x29 ±1 matrix maximizing |det(H)|. n=29 ≡ 3 mod 4.

## Seed score: 0.545692 (Paley construction with SA)
This is too low. We need better strategies.

## Strategy 1: Multiple Quadratic Residue Sets
Instead of ONE residue set, try SEVERAL and pick the best:
- Residue set A: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28} (seed)
- Residue set B: Shift by k: try k=1,2,3,5,7 (add k to each residue mod 29)
- Residue set C: Complementary residues (all non-residues)

For each set, run SA with: 100,000 iterations, 5 seeds, T=10.0, cool=0.996

## Strategy 2: Hybrid Paley + Random
Start with Paley, then apply random perturbations:
- Take seed Paley matrix
- Randomly flip 5-10% of entries
- Run SA from this perturbed base: 100k iterations, 3 seeds
- Repeat 10 times with different perturbations

## Strategy 3: Extended SA with Fewer Seeds
Trade off: 200,000 iterations, 3 seeds
- This covers 600k total flips (vs 7.5M in seed)
- Each SA run takes ~5 seconds
- 3 runs = 15 seconds total

## Strategy 4: Determinant-Gradient Local Search
Start from seed Paley, then:
1. Evaluate all single flips (29*29=841 candidates) - use numpy.det
2. Flip top 50 candidates
3. Evaluate these, flip top 20
4. Repeat 3 rounds, keep best
5. Run 10k SA iterations from best

## Implementation Template
def construct_hadamard_matrix(n=29, strategy="multiple", **kwargs):
    # Choose construction method based on strategy
    # For strategy="multiple": try 3 different residue sets
    # For strategy="extended": 200k iters, 3 seeds
    # For strategy="local": gradient-based improvement
    # ... (implement chosen strategy)
    return best_matrix

## Key Parameters to Try
- Iterations per SA run: 50k, 100k, 200k (seed uses 15k)
- Number of seeds: 3, 5, 10 (seed uses 500 - too many!)
- Starting temperature: T=5.0, 10.0, 15.0 (seed uses 5.0)
- Cool rate: 0.995, 0.996, 0.998 (seed uses 0.9955)
- Total flips: aim for 300k-500k (not 7.5M)

## Why Seed Fails
1. 500 seeds × 15k = 7.5M flips takes 75s - too much time
2. Many seeds converge to same local optimum
3. SA with single flips is weak in discrete space
4. Paley construction itself may be suboptimal

## Tool Usage
1. probe_solution: Test 2-3 strategies quickly (10k iters each)
2. evaluate_solution: Run full strategy (100k+ iters)
3. edit_solution: Provide complete working code

## Expected Improvement
With better strategies, expect score 0.60-0.65 vs seed 0.545.'
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with COMPLETE working code implementing ONE strategy from:
    1. Multiple quadratic residue sets (seed, shifted, complementary)
    2. Hybrid Paley + random perturbations
    3. Extended SA: 200k iterations, 3 seeds, T=10, cool=0.996
    4. Local search + SA from seed
    
    Use numpy.linalg.det for ALL determinant calculations. Run 50k-200k iterations total (not 7.5M).
    Use fewer seeds (3-10) with more iterations per seed.
    
    Example structure for strategy="extended":
    - construct_hadamard_matrix(n=29, iterations_per_seed=100000, T_start=10.0, cool_rate=0.996)
    - Seeds: range(5000, 5030) - only 30 seeds, but 100k each = 3M flips, ~15 seconds total
    - SA loop with numpy.linalg.det
    - Return best matrix'
  evaluate_solution: 'Run your code and return combined_score. Budget: 20 evals total.
    Each call should complete in <350s (use 50k-200k total iterations).
    Use probe_solution FIRST to test strategies.'
  probe_solution: 'Cheap approximate scoring on subsampled data (~10s, separate 30-probe budget).
    Use this to test DIFFERENT CONSTRUCTION STRATEGIES, not just parameters.
    
    Test:
    - Different residue sets (shifted, complementary)
    - Extended SA: 50k iters, 3 seeds
    - Local search from seed
    
    Run each with 10k iterations, pick best for full eval.'
  finish: End session. Call when eval budget exhausted or clear optimum found.
sampling:
  temperature: 1.2
  top_p: 0.95
  top_k: 25
  max_tokens: 16384
agent:
  max_iterations: 60
middleware:
  budget_reminder_from_left: 1
  long_tool_output_max_chars: 12000
new_tools:
  - name: test_construction
    description: 'Test a construction strategy quickly. Returns approximate det and time estimate.
      Call this to test: shifted residue sets, hybrid constructions, extended SA configs.
      Use 5000-10000 iterations per test.'
    input_schema:
      type: object
      properties:
        strategy:
          type: string
          description: 'Strategy: "shifted", "hybrid", "extended_sa", "local_search"'
        shift:
          type: integer
          description: 'For shifted residues: shift amount (0-28). Default: 0'
        num_shifts:
          type: integer
          description: 'Number of shift values to test (1-10). Default: 3'
        iterations:
          type: integer
          description: 'Iterations per seed (5000-20000). Default: 10000'
        num_seeds:
          type: integer
          description: 'Number of seeds (3-10). Default: 5'
    implementation_py: 'def run(ctx, args):
        import numpy as np
        import random
        n = 29
        residues = {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}
        best_det = 0
        best_mat = None
        strategy = args.get("strategy", "shifted")
        shift = args.get("shift", 0)
        num_shifts = args.get("num_shifts", 3)
        iters = args.get("iterations", 10000)
        num_seeds = args.get("num_seeds", 5)
        
        for s in range(shift, shift + num_shifts):
            shifted_residues = {(r + s) % n for r in residues}
            # Build Paley with shifted residues
            paly = [[1 if (i-j)%n in shifted_residues else -1 for j in range(n)] for i in range(n)]
            
            # Quick SA
            rng = random.Random(42 + s)
            cur = [row[:] for row in paly]
            T_val = 10.0
            cd = abs(np.linalg.det(np.array(cur, dtype=float)))
            for _ in range(iters):
                i, j = rng.randrange(n), rng.randrange(n)
                cur[i][j] *= -1
                nd = abs(np.linalg.det(np.array(cur, dtype=float)))
                delta = nd - cd
                if delta >= 0:
                    cd = nd
                elif T_val > 1e-15 and rng.random() < np.exp(delta/T_val):
                    cd = nd
                else:
                    cur[i][j] *= -1
                if nd > best_det:
                    best_det, best_mat = nd, [row[:] for row in cur]
        return {"strategy": strategy, "best_det": float(best_det), "estimated_time": num_shifts * iters * 0.001 * 10}'
