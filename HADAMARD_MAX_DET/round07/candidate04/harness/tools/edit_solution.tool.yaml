type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with COMPLETE working code implementing ONE strategy from: 1. Multiple
  quadratic residue sets (seed, shifted, complementary) 2. Hybrid Paley + random perturbations 3. Extended
  SA: 200k iterations, 3 seeds, T=10, cool=0.996 4. Local search + SA from seed

  Use numpy.linalg.det for ALL determinant calculations. Run 50k-200k iterations total (not 7.5M). Use
  fewer seeds (3-10) with more iterations per seed.

  Example structure for strategy="extended": - construct_hadamard_matrix(n=29, iterations_per_seed=100000,
  T_start=10.0, cool_rate=0.996) - Seeds: range(5000, 5030) - only 30 seeds, but 100k each = 3M flips,
  ~15 seconds total - SA loop with numpy.linalg.det - Return best matrix'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
