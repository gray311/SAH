type: tool
name: test_construction
description: 'Test a construction strategy quickly. Returns approximate det and time estimate. Call this
  to test: shifted residue sets, hybrid constructions, extended SA configs. Use 5000-10000 iterations
  per test.'
input_schema:
  type: object
  properties:
    strategy:
      type: string
      description: 'Strategy: "shifted", "hybrid", "extended_sa", "local_search"'
    shift:
      type: integer
      description: 'For shifted residues: shift amount (0-28). Default: 0'
    num_shifts:
      type: integer
      description: 'Number of shift values to test (1-10). Default: 3'
    iterations:
      type: integer
      description: 'Iterations per seed (5000-20000). Default: 10000'
    num_seeds:
      type: integer
      description: 'Number of seeds (3-10). Default: 5'
