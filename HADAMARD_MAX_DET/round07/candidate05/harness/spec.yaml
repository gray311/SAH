schema: h2spec/1.0
system_prompt: |
  You are optimizing a 29x29 ±1 matrix to maximize |det(H)|.
  
  ### CRITICAL INSIGHT
  The seed program's SA approach (10M flips over 500 seeds) is inefficient. SA makes tiny
  improvements but gets stuck. Instead, use a **multi-construction pipeline**:
  
  1. **Construct**: Build 3-5 different starting matrices using:
     - Paley construction (seed is correct)
     - Random ±1 matrix
     - Block-pattern construction (4x4 repeating blocks)
     - Permutation-based construction
  
  2. **Refine each with STRUCTURED operations** (not random flips):
     - Swap entire rows/columns (preserves determinant magnitude)
     - Flip 2x2 blocks: flip H[i,j], H[i+1,j], H[i,j+1], H[i+1,j+1] together
     - "Cyclic shift" rows to break local patterns
  
  3. **Evaluate** each refined matrix directly (no SA loop needed)
  
  4. **Return** the matrix with highest |det|
  
  ### Time budget
  - 20 evals available, 350s per eval
  - With 3 constructions × ~50 refinement steps × det(~0.001s), total ~15-30s per eval
  - Well under budget
  
  ### DO NOT use SA
  - SA with 10k+ iterations wastes budget
  - Random flips don't respect Hadamard structure
  - Better to try different CONSTRUCTIONS and pick best
  
  ### Tool usage
  - edit_solution: Provide FULL working code with multi-construction pipeline
  - probe_solution: Test 2-3 construction types quickly (10 iterations each)
  - evaluate_solution: Run full pipeline and return best matrix
skill_description: |
  Hadamard optimizer for n=29. Multi-construction pipeline: build 3-5 matrices via
  Paley, random, and block patterns; refine each with row swaps and 2x2 block flips;
  pick best. DO NOT use SA with many iterations. Use numpy.linalg.det for all scoring.
skill_body: |
  # Hadamard Matrix Construction Pipeline - Multi-Strategy Approach
  ## Problem
  Maximize |det(H)| for 29x29 matrix with entries ±1.
  
  ## Why SA Fails
  - SA makes tiny random flips (one element at a time)
  - 10M flips needed to escape local optimum
  - Waste of time when we have 20 evals
  
  ## Better Approach: Multi-Construction Pipeline
  
  ### Strategy 1: Paley Construction (seed's approach)
  Quadratic residues mod 29: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
  For H[i][j]: diff = (i-j) mod 29; H[i][j] = 1 if diff in residues else -1
  
  ### Strategy 2: Random Construction
  Generate 29x29 matrix with random ±1 entries.
  
  ### Strategy 3: Block-Pattern Construction  
  Create base 4x4 pattern, repeat and adapt to 29x29.
  
  ### Strategy 4: Permuted Paley
  Take Paley matrix, permute rows/columns randomly, then refine.
  
  ## Refinement Operations (apply to EACH construction)
  
  Operation A: Row/Column Swap
  - Swap row i with row j; swap col i with col j
  - Preserves |det| exactly
  - Breaks local patterns
  
  Operation B: 2x2 Block Flip
  - Flip 4 elements in a 2x2 block: H[r,c], H[r+1,c], H[r,c+1], H[r+1,c+1]
  - Changes det but respects local structure
  - Try at 10 different positions
  
  Operation C: Cyclic Row Shift
  - Shift all rows cyclically by k positions
  - Breaks symmetry
  
  ## Algorithm
  
  Build 4 different constructions. For each:
  - Apply 50 refinement steps using random operations from {A, B, C}
  - Track best determinant
  
  Total: 4 constructions × 50 refinements = 200 operations
  Time: 200 × 0.001s per det + overhead ≈ 30s, well under 350s budget
  
  DO NOT use simulated annealing with 10k+ iterations.
  DO NOT use Bareiss during search (causes timeout).
  Use numpy.linalg.det for ALL determinant calculations.
  
  Return the single best matrix across all constructions.
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with COMPLETE multi-construction pipeline code:
  
  1. Define 4 construction functions: paly(), random(), block(), permute_paley()
  2. Define 3 refinement functions: swap_rows(), swap_cols(), flip_2x2()
  3. Main loop: for each of 4 constructions, apply 50 refinements
  4. Use numpy.linalg.det for ALL determinant calculations
  5. Return the single best matrix
  
  DO NOT use simulated annealing with 10k+ iterations.'
  evaluate_solution: 'Run your multi-construction code and return combined_score.
  
  Your code should build 3-4 different matrices, refine each with ~50 operations,
  and return the best one. Total time should be < 200 seconds.'
  probe_solution: 'Cheap approximate scoring using multi-construction approach.
  
  Test 2-3 construction types with 10 refinements each to identify promising approach.
  Then use evaluate_solution for the winner with 50 refinements per construction.'
  finish: End session when you have found a strong matrix or exhausted budget.
sampling:
  temperature: 1.3
  top_p: 0.9
  top_k: 15
  max_tokens: 16000
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 15000
new_tools:
- name: analyze_paley
  description: |
    Compute and validate Paley construction for n=29. Returns the base matrix
    and its determinant to verify correctness before refinement.
    Call once at start to establish baseline.
  input_schema:
    type: object
    properties: {}
  implementation_py: |
    def run(ctx, args):
        import numpy as np
        n = 29
        residues = {0, 1, 4, 5, 6, 7, 9, 13, 16, 20, 22, 23, 24, 25, 28}
        H = np.zeros((n, n), dtype=int)
        for i in range(n):
            for j in range(n):
                diff = (i - j) % n
                H[i, j] = 1 if diff in residues else -1
        det_val = abs(np.linalg.det(H))
        return {"paley_matrix": H.tolist(), "det": float(det_val), "n": n}
new_skills:
- name: hadamard-pipeline
  description: |
    Specialized skill for n=29 Hadamard construction. Uses multi-construction pipeline
    (Paley, random, block, permuted) with structural refinements (row swaps, 2x2 block
    flips, cyclic shifts). NO simulated annealing. 3-4 constructions times 50 refinements each.
  body: |
    # Hadamard Construction Pipeline - Multi-Strategy
    
    ## Goal
    Maximize |det(H)| for 29x29 ±1 matrix using diverse constructions, NOT SA.
    
    ## Constructions to Try
    ### 1. Paley Construction
    Quadratic residues mod 29: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
    H[i][j] = 1 if (i-j) mod 29 in residues else -1
    
    ### 2. Random Matrix
    Generate 29x29 with random +/-1 entries.
    
    ### 3. Block Pattern
    Create a 4x4 pattern and extend to 29x29.
    
    ### 4. Permuted Paley
    Take Paley, randomly permute rows and columns, then flatten.
    
    ## Refinement Operations (50 per construction)
    
    Op A: Swap Row i with Row j
    Swap rows i and j, recompute det.
    
    Op B: Swap Col i with Col j
    Swap columns i and j, recompute det.
    
    Op C: Flip 2x2 Block
    Pick random position (r,c), flip H[r][c], H[r+1][c], H[r][c+1], H[r+1,c+1]
    Recompute det.
    
    ## Algorithm
    
    best_score = 0
    best_matrix = None
    
    Try 4 constructions. For each:
      For step in 0..49:
        Pick random op from {A, B, C}
        Apply op to current matrix
        det = abs(numpy.linalg.det(matrix))
        if det > best_score:
          best_score = det
          best_matrix = matrix
    
    Return best_matrix
    
    ## Key Rules
    - NO simulated annealing loops with 10k+ iterations
    - Exactly 50 refinements per construction
    - 4 constructions total = 200 total refinements
    - Each refinement: 1 op + 1 det computation (~0.001s)
    - Total time: ~30s, well under 350s
    - Use numpy.linalg.det, NOT Bareiss
tool_descriptions:
  edit_solution: 'Replace EVOLVE-BLOCK with COMPLETE multi-construction pipeline:
  
  - Define 4 construction functions
  - Define refinement operations (swap rows, swap cols, flip 2x2)
  - Main loop: for each of 4 constructions, apply 50 refinements
  - Track best determinant across all
  - Return single best matrix
  
  DO NOT use SA with 10k+ iterations.'
  evaluate_solution: 'Run multi-construction pipeline and return combined_score.
  
  Code should build 3-4 matrices, apply ~200 total refinement operations,
  return best. Time should be < 200s.'
  probe_solution: 'Test 2-3 constructions with 10 refinements each.
  Identify best construction type for full evaluation.'
  finish: End session when strong matrix found or budget exhausted.
new_middlewares:
- name: forbid_sa
  hook: before_tool
  description: |
    Block simulated annealing patterns that waste iterations.
    Require multi-construction approach with ~200 total refinements max.
  implementation_py: |
    def before_tool(hook_input):
        code = hook_input.get("code", "")
        import re
        if re.search(r"for\s+\w+\s+in\s+range\([^)]*10\d{3}", code):
            return "BLOCKED: SA with 10k+ iterations wastes budget. Use multi-construction pipeline with ~200 total refinements max."
        if re.search(r"for\s+\w+\s+in\s+range\([^)]*20\d{3}", code):
            return "BLOCKED: SA with 20k+ iterations wastes budget."
        return None
