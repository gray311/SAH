type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with COMPLETE multi-construction pipeline:

  - Define 4 construction functions - Define refinement operations (swap rows, swap cols, flip 2x2) -
  Main loop: for each of 4 constructions, apply 50 refinements - Track best determinant across all - Return
  single best matrix

  DO NOT use SA with 10k+ iterations.'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
