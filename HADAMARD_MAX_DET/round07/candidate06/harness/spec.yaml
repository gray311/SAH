schema: h2spec/1.0
system_prompt: |
  You are optimizing a 29x29 ±1 matrix to maximize |det(H)|. n=29 ≡ 3 mod 4.

  CRITICAL INSIGHT: The seed program uses a 500-seed sweep which is TOO SLOW and traps you in a local optimum. 
  With only 20 evaluations, you cannot afford to run 500 seeds each time. 

  YOUR NEW STRATEGY:
  1. REDUCE SEEDS DRASTICALLY: Use only 3-5 seeds per evaluation (NOT 500). This makes each evaluation ~15x faster.
  2. TRY MULTIPLE CONSTRUCTIONS IN PARALLEL: Within one evaluation, implement and compare:
     - Paley construction with quadratic residues {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
     - Random ±1 initialization
     - Perturbed Paley (flip 5-10 random entries)
     - Try 2-3 different quadratic residue patterns
  3. Use the BEST construction from your parallel search as the "result"
  4. Use simulated annealing with 10k-20k iterations per construction (faster, still good)
  5. Use numpy.linalg.det for ALL determinant calculations during search

  Why this works: With 3-5 seeds and parallel construction testing, each evaluation completes in ~10-15 seconds instead of ~75 seconds. 
  This lets you try 30-40 different total evaluations, exploring many more construction strategies before budget runs out.

  The seed score 0.545692 comes from ONE construction strategy (Paley + 500 seeds). By testing many strategies with fewer seeds, 
  you're likely to find a better construction entirely, not just optimize the same one.

  Return the BEST matrix found across all your construction experiments.
skill_description: |
  Hadamard optimizer for n=29. Use 3-5 seeds max, parallel construction testing (Paley, random, perturbed), 
  10k-20k iterations per construction. Fast evaluations (~15s) enable exploring many more strategies.
skill_body: |
  # Hadamard Matrix Optimization for n=29 - Multi-Construction Strategy
  
  ## CRITICAL CHANGE: Few Seeds, Many Constructions
  
  The seed's 500-seed approach is TOO EXPENSIVE. You only have 20 evaluations total.
  **Use 3-5 seeds per evaluation** and test MULTIPLE constructions in parallel.
  
  ## Construction Strategies to Try (implement ALL in one evaluation):
  
  ### Strategy A: Paley Construction
  Quadratic residues mod 29: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
  H[i][j] = 1 if (i-j) mod 29 in residues else -1
  
  ### Strategy B: Random Initialization
  Random ±1 matrix, then hill climb from there
  
  ### Strategy C: Perturbed Paley
  Start with Paley, flip 5-10 random entries, then hill climb
  
  ### Strategy D: Alternative Residue Patterns
  Try different quadratic residue subsets or patterns
  
  ## For EACH strategy:
  - Run 3-5 SA seeds with 10,000-15,000 iterations each
  - Use numpy.linalg.det for fast scoring
  - Track the best matrix from this strategy
  
  ## Final Result:
  Return the BEST matrix across all strategies you tested.
  
  ## Why This Works:
  - 500 seeds × 15k iters × ~0.001s/det = ~75 seconds per eval (TOO SLOW)
  - 5 seeds × 15k iters × ~0.001s/det = ~15 seconds per eval (MUCH BETTER)
  - With 15s evals, you can do 30+ evaluations, exploring 3x more strategies
  
  ## Tool Usage:
  - edit_solution: Provide COMPLETE code implementing ALL 4 strategies in parallel
  - probe_solution: Test different iteration counts (10k vs 15k) quickly
  - evaluate_solution: Run full parallel search with best parameters

tool_descriptions:
  edit_solution: |
    Replace EVOLVE-BLOCK with COMPLETE working code that:
    
    1. Implements 4 parallel construction strategies (Paley, Random, Perturbed Paley, Alternative Residues)
    2. For each strategy: run 3-5 SA seeds with 10k-15k iterations each
    3. Use numpy.linalg.det for ALL determinant calculations
    4. Track and return the BEST matrix across all strategies
    
    Example structure:
    - define all 4 construction methods
    - for seed in range(3, 8):  # 5 seeds
        for strategy in [paley, random, perturbed, alt_residues]:
            result = sa_seeding(strategy, seed, 12000)
            if result.det > best.det: best = result
    - return best.matrix
  evaluate_solution: |
    Run your parallel construction search. Budget: 20 evals total.
    Each call takes ~15 seconds (5 seeds × 4 strategies × 12k iters).
    With 20 evals, you can explore 80 different parameter/construction combinations.
  probe_solution: |
    Quick test of iteration counts (10k vs 15k) or seed counts (3 vs 5) on one strategy.
    Run with 2k iterations per seed to validate your construction works correctly.
  finish: |
    End session. Call when you've tested 15-20 different evaluation runs with varied strategies.
sampling:
  temperature: 1.2
  top_p: 0.9
  top_k: 15
  max_tokens: 16000
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 10000
new_tools:
  - name: test_construction
    description: |
      Quick test of a single construction strategy with minimal seeds.
      Validates that your construction produces valid ±1 matrices and computes determinant correctly.
      Call this FIRST to verify your code works before full evaluation.
    input_schema:
      type: object
      properties:
        strategy:
          type: string
          description: One of "paley", "random", "perturbed", "alt_residues"
        seeds:
          type: integer
          default: 2
          description: Number of SA seeds to run
        iterations:
          type: integer
          default: 2000
          description: Iterations per seed
    implementation_py: |
      def run(ctx, args):
          import numpy as np
          n = 29
          strategy = args.get("strategy", "paley")
          seeds = args.get("seeds", 2)
          iters = args.get("iterations", 2000)
          
          if strategy == "paley":
              residues = {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
              def construct():
                  return [[1 if (i-j)%n in residues else -1 for j in range(n)] for i in range(n)]
          elif strategy == "random":
              def construct():
                  return [[random.choice([1, -1]) for _ in range(n)] for _ in range(n)]
          elif strategy == "perturbed":
              residues = {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
              def construct():
                  H = [[1 if (i-j)%n in residues else -1 for j in range(n)] for i in range(n)]
                  import random
                  flips = random.sample([(i,j) for i in range(n) for j in range(n)], 5)
                  for i,j in flips:
                      H[i][j] *= -1
                  return H
          elif strategy == "alt_residues":
              import random
              choices = [(0,14), (1,14), (2,14), (3,14), (4,14), (5,14)]
              r = random.Random(42)
              selected = r.sample(choices, 6)
              residues = {diff for diff in selected for _ in range(15)} | {0, 1, 4, 5, 6, 7}
              residues = set([(i-j)%n for i in range(n) for j in range(n)] if (i-j)%n <= 14 else None)
              residues = {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
              def construct():
                  return [[1 if (i-j)%n in residues else -1 for j in range(n)] for i in range(n)]
          else:
              return {"error": f"Unknown strategy: {strategy}"}
          
          rng = random.Random(12345)
          best_det = 0
          best_matrix = None
          
          for s in range(seeds):
              mat = construct()
              det_val = abs(np.linalg.det(np.array(mat, dtype=float)))
              if det_val > best_det:
                  best_det = det_val
                  best_matrix = [row[:] for row in mat]
          
          return {
              "strategy": strategy,
              "seeds_run": seeds,
              "iterations_per_seed": iters,
              "best_det": float(best_det),
              "best_matrix_size": f"{len(best_matrix)}x{len(best_matrix[0]) if best_matrix else 0}"
          }
new_skills:
  - name: n29-multi-construction-search
    description: |
      Specialized skill for n=29 Hadamard optimization using parallel construction testing.
      Implements 4 strategies in parallel with 3-5 seeds each, 10k-15k iterations per seed.
      Uses numpy.linalg.det for fast search, completes each eval in ~15 seconds.
    body: |
      # Multi-Construction Hadamard Search for n=29
      
      ## OVERVIEW
      Test 4 construction strategies in parallel with 3-5 seeds each, 12k iterations per seed.
      Total: ~5 seeds × 4 strategies × 12k iters = 240k operations per eval.
      Time: ~15 seconds per eval (vs 75s with 500 seeds).
      
      ## FOUR CONSTRUCTION STRATEGIES
      
      ### 1. Paley Construction (Baseline)
      Quadratic residues mod 29: {0,1,4,5,6,7,9,13,16,20,22,23,24,25,28}
      H[i][j] = 1 if (i-j) mod 29 in residues else -1
      
      ### 2. Random Initialization
      Random ±1 matrix, hill climb from there. Good for escaping local optima.
      
      ### 3. Perturbed Paley
      Start with Paley, flip 5-10 random entries. Tests sensitivity to initialization.
      
      ### 4. Alternative Residue Patterns
      Try different quadratic residue selections. May find better patterns.
      
      ## EXECUTION PLAN (per evaluation):
      
      Initialize:
      - n = 29
      - best_overall_det = 0
      - best_overall_matrix = None
      
      For seed in range(3, 8):  # 5 seeds
          seed_rand = Random(seed)
          
          # Strategy 1: Paley
          paley_mat = build_paley()
          for iter in range(12000):
              result = sa_hillclimb(paley_mat, seed_rand, iters=1)
              det = abs(np.linalg.det(np.array(result, dtype=float)))
              if det > best_overall_det:
                  best_overall_det = det
                  best_overall_matrix = result
          
          # Strategy 2: Random
          rand_mat = build_random()
          for iter in range(12000):
              result = sa_hillclimb(rand_mat, seed_rand, iters=1)
              det = abs(np.linalg.det(np.array(result, dtype=float)))
              if det > best_overall_det:
                  best_overall_det = det
                  best_overall_matrix = result
          
          # Strategy 3: Perturbed Paley
          pert_mat = build_perturbed_paley()
          for iter in range(12000):
              result = sa_hillclimb(pert_mat, seed_rand, iters=1)
              det = abs(np.linalg.det(np.array(result, dtype=float)))
              if det > best_overall_det:
                  best_overall_det = det
                  best_overall_matrix = result
      
      Return best_overall_matrix
      
      ## DETINENT CALCULATION:
      - ALWAYS use numpy.linalg.det for SEARCH
      - ~0.001s per 29×29 matrix
      - NEVER use Bareiss during search (causes timeout)
      
      ## EXPECTED OUTCOME:
      With 20 evaluations × 4 strategies × 5 seeds, you explore 400 construction paths.
      Even with 12k iterations each, this covers much more search space than 500 seeds on one strategy.
      
      ## CHECKLIST:
      - ✅ 4 strategies implemented (Paley, Random, Perturbed, Alt)
      - ✅ 3-5 seeds per evaluation
      - ✅ 10k-15k iterations per seed per strategy
      - ✅ numpy.linalg.det for all scoring
      - ✅ Track best across all strategies
      - ✅ Return only the best matrix
new_middlewares:
  - name: warn_many_seeds
    hook: before_model
    description: |
      Warn if user tries to use 500+ seeds. Enforce the new strategy of 3-5 seeds.
      This prevents the common mistake of reverting to the old slow approach.
    implementation_py: |
      def before_model(hook_input):
          code = hook_input.get('code', '')
          import re
          # Check for large seed range
          seed_ranges = re.findall(r'range\(\d+, (\d+)\)', code)
          if seed_ranges:
              seed_count = int(seed_ranges[-1]) - int(seed_ranges[0])
              if seed_count > 100:
                  return f"\U0001F6A8 WARNING: {seed_count} seeds is TOO MANY! Each eval will timeout.\n\
                  MUST use 3-5 seeds max. With 20 evals total, you need fast evaluations.\n\
                  Implement 4 construction strategies (Paley, Random, Perturbed, Alt) in parallel instead."
          # Check for 500 seeds
          if '500' in code or 'range(4000, 4500)' in code:
              return "\U0001F6A8 ERROR: 500 seeds violates the new strategy! Use 3-5 seeds.\n\
                  Implement parallel construction testing instead of massive seed sweep.\n\
                  Each eval must complete in < 20 seconds."
          return None
