type: tool
name: edit_solution
description: "Replace EVOLVE-BLOCK with COMPLETE working code that:\n\n1. Implements 4 parallel construction\
  \ strategies (Paley, Random, Perturbed Paley, Alternative Residues)\n2. For each strategy: run 3-5 SA\
  \ seeds with 10k-15k iterations each\n3. Use numpy.linalg.det for ALL determinant calculations\n4. Track\
  \ and return the BEST matrix across all strategies\n\nExample structure:\n- define all 4 construction\
  \ methods\n- for seed in range(3, 8):  # 5 seeds\n    for strategy in [paley, random, perturbed, alt_residues]:\n\
  \        result = sa_seeding(strategy, seed, 12000)\n        if result.det > best.det: best = result\n\
  - return best.matrix"
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
