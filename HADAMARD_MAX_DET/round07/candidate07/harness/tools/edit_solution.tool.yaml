type: tool
name: edit_solution
description: 'Replace EVOLVE-BLOCK with COMPLETE working code implementing:


  1. Multiple base construction strategies (Paley+perturbation, random init, etc.)

  2. For each strategy: generate base matrix, run SA hill climbing

  3. Track best matrix across ALL strategies in this evaluation

  4. Return the overall best matrix


  VARY between evaluations:

  - perturbation_fraction: 0.05, 0.10, 0.15

  - perturbation_seed: different each eval (0, 100, 200, etc.)

  - seed range: 0-500, 500-1000, 1000-1500, etc.

  - SA parameters: iterations, T, cool_rate


  Example structure with parallel strategies:

  - Construct: paley_matrix(perturbation_seed, perturbation_fraction)

  - Construct: random_matrix(seed)

  - For each strategy: run SA, track best

  - Return: best across all strategies'
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Either SEARCH/REPLACE diff block(s) to apply to the current program, or the full replacement
        body for the EVOLVE-BLOCK region.
  required:
  - code
  additionalProperties: false
