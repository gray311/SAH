type: tool
name: probe_solution
description: 'Cheap approximate scoring on subsampled data (~10s, separate 30-probe budget).


  Use this to test 3-5 DIFFERENT construction strategies BEFORE spending a full evaluation.


  Test variations in:

  - Base construction: paley+5%, paley+10%, paley+15%, random, perturbed

  - perturbation_seed: 0, 100, 200, 300, 400

  - SA iterations: 500, 1000, 2000


  Run each strategy with 500-1000 iterations per seed (fast), pick 1-2 best for full eval.'
