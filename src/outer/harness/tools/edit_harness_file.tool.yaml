type: tool
name: edit_harness_file
description: >-
  Modify one existing H2 file by replacing old_text exactly once. This is the
  preferred way to make a targeted change after `cat`. It fails if old_text is
  missing or ambiguous, so the proposer never edits an unseen location.
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Relative path to an existing mutable H2 file.
    old_text:
      type: string
      description: Exact current text that must occur once.
    new_text:
      type: string
      description: Replacement text; use an empty string to remove the match.
  required: [path, old_text, new_text]
  additionalProperties: false
