type: agent
name: adaptive_v1_context_coordinator
description: >-
  Adaptive-only context analyst. Delegates bounded, read-only analysis to the
  performance and design analyzers, then returns one concise JSON brief for the
  standalone Adaptive V1 H1 proposer.
max_context_tokens: 16384
max_iterations: 3
max_running_subagents: 2
system_prompt: ./system.md
system_prompt_type: file
tool_call_mode: structured
timeout: 600

sandbox_config:
  type: local
  work_dir: /tmp

llm_config:
  model: qwen3.5-9b
  base_url: http://127.0.0.1:8800/v1
  api_key: EMPTY
  api_type: openai_chat_completion
  max_tokens: 1024
  temperature: 0.0
  stream: false

sub_agents:
  - name: performance_analyzer
    config_path: ./performance_analyzer/agent.yaml
  - name: design_analyzer
    config_path: ./design_analyzer/agent.yaml

tracers:
  - import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
