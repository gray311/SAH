type: agent
name: design_analyzer
description: >-
  Read-only specialist for compact Adaptive harness evidence. Summarizes tested
  fields, duplicate or invalid patterns, preserved capabilities, and distinct
  unexplored design directions without producing a harness spec.
max_context_tokens: 12288
# NexAU checks the cap after the first model call; 2 is the minimum that lets
# a tool-free child return that first response instead of a limit error.
max_iterations: 2
system_prompt: ./system.md
system_prompt_type: file
# This read-only specialist has no tools. XML mode avoids asking the provider
# for an empty structured-tool surface while preserving ordinary final text.
tool_call_mode: xml
timeout: 600

sandbox_config:
  type: local
  work_dir: /tmp

llm_config:
  model: qwen3.5-9b
  base_url: http://127.0.0.1:8800/v1
  api_key: EMPTY
  api_type: openai_chat_completion
  max_tokens: 1536
  temperature: 0.0
  stream: false
