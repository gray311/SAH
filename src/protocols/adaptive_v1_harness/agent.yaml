type: agent
name: adaptive_v1_outer_proposer
description: >-
  Adaptive v1 H1 — a fixed NexAU outer proposer. Each fresh Agent run emits
  exactly one sparse JSON harness action; deterministic protocol code validates
  and compiles that action into a full SAH H2 NexAU package.
max_context_tokens: 131072
system_prompt: ./system.md
system_prompt_type: file
system_prompt_suffix: "\n"
tool_call_mode: structured
# NexAU treats the final configured iteration as a pre-call hard stop. Two
# iterations therefore allow exactly one text-only model response; with no
# tools the executor exits immediately after that first response.
max_iterations: 2
retry_attempts: 2
retry_backoff_max_seconds: 30
timeout: 600

llm_config:
  model: qwen3.5-9b
  base_url: http://127.0.0.1:8800/v1
  api_key: EMPTY
  api_type: openai_chat_completion
  max_tokens: 2048
  temperature: 0.8
  top_p: 1.0
  stream: false

sandbox_config:
  type: local
  work_dir: /tmp

tools: []
stop_tools: []
skills: []
middlewares: []

tracers:
  - import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
