type: agent
name: adaptive_v1_h1_proposer
description: >-
  Adaptive-only NexAU H1. Receives one bounded analyst brief and emits one
  native SAH h2spec/1.0 candidate through the shared validator and submitter.
max_context_tokens: 32768
system_prompt: ./system.md
system_prompt_type: file
tool_call_mode: structured
max_iterations: 8
retry_attempts: 2
timeout: 600

llm_config:
  model: qwen3.5-9b
  base_url: http://127.0.0.1:8800/v1
  api_key: EMPTY
  api_type: openai_chat_completion
  max_tokens: 4096
  temperature: 1.0
  top_p: 0.95
  stream: false

sandbox_config:
  type: local
  work_dir: /tmp

tools:
  - name: validate_spec
    yaml_path: ../../outer/harness/tools/validate_spec.tool.yaml
    binding: outer.harness.tools.design:validate_spec
  - name: submit_spec
    yaml_path: ../../outer/harness/tools/submit_spec.tool.yaml
    binding: outer.harness.tools.design:submit_spec

stop_tools: [submit_spec]

skills:
  - ../../outer/harness/skills/harness-design

middlewares:
  - import: outer.harness.middlewares.submit_reminder:SubmitReminderMiddleware
    params:
      remind_from_iteration: 6
      max_iterations: 8
  - import: nexau.archs.main_sub.execution.middleware.long_tool_output:LongToolOutputMiddleware
    params:
      max_output_chars: 6000
      head_lines: 30
      tail_lines: 20
      head_chars: 3000
      tail_chars: 3000
      bypass_tool_names: [submit_spec, LoadSkill]

tracers:
  - import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
