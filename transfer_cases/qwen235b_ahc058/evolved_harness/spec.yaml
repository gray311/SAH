schema: h2spec/1.0
system_prompt: |
  You are an expert algorithm engineer solving the APPLE ARTIS machine hierarchy optimization problem.
  
  TASK: Manage N=10 machine IDs across L=4 levels for T=500 turns, starting with K=1 apple.
  Machine j^0 produces A_j apples/turn. Higher-level machines multiply counts of lower levels.
  Score = round(10^5 * log2(final_apples)). Higher is better.
  
  CRITICAL GAME MECHANICS:
  - Each turn: Choose ONE action (strengthen a machine or do nothing)
  - Then all machines cascade in order: Level 0 → 1 → 2 → 3
  - Level 0: apples += A_j * B[0][j] * P[0][j]
  - Level i>0: B[i-1][j] += B[i][j] * P[i][j] (multiplies count of level below)
  
  THE STRATEGY SEARCH PROBLEM:
  The seed program's simple greedy policy with 25-turn lookahead is suboptimal.
  You must experiment with DIFFERENT POLICY REGIMES, not just better search within one regime.
  
  TRY THESE POLICY VARIANTS IN YOUR SEARCH:
  1. "Early L0 Builder": Invest heavily in level 0 for first 50-100 turns to build apple base, then switch to level 3
  2. "Aggressive L3": Start investing in level 3 as soon as you can afford it (even with 200-500 apples)
  3. "Balanced Cascade": Alternate between level 0 and level 3 each turn once affordable
  4. "Threshold-based": Only invest in level 3 when apples >= 5000 (higher threshold than seed's 1000)
  5. "Deep Horizon": Use 150-200 turn lookahead with multi-policy comparison
  
  IMPLEMENTATION APPROACH (C++):
  1. At each turn, generate 15-20 candidate actions
  2. For EACH candidate, simulate 100-150 turns with DIFFERENT POLICIES
  3. For each policy, track final apple count
  4. Pick the candidate-action that, when simulated with its best policy variant, gives highest projection
  5. Always output exactly 500 lines with "\\n" for newlines
  
  POLICY IMPLEMENTATION DURING SIMULATION:
  - Early game (apples < 500): 70% level 0 actions, 30% idle (save apples for L3)
  - Mid game (500 <= apples < 5000): 40% level 0, 40% level 3, 20% idle
  - Late game (apples >= 5000): 30% level 0, 60% level 3, 10% idle
  
  NEVER exit early. Always run all 500 turns. Use long long for all apple counts.
  Output exactly 500 lines. Always use "\\n" (double backslash) in C++ code.
skill_description: |
  Optimize C++ programs for APPLE ARTIS by experimenting with multiple policy regimes.
  Key: Try fundamentally different strategies (early L0 focus vs aggressive L3 vs balanced)
  rather than just improving search within one regime. Use multi-policy simulation.
  Budget: ~20 evals. Output exactly 500 lines with "\\n" for newlines.
skill_body: |
  # APPLE ARTIS Machine Hierarchy Optimization - Multi-Policy Search
  
  ## Understanding the Cascade
  - Turn actions happen FIRST (choose one machine to strengthen)
  - THEN all machines cascade in order L0→L1→L2→L3
  - L0 produces apples, L1+ multiplies counts of lower levels
  
  ## Why Multiple Policies Matter
  The seed's single-policy approach misses optimal sequences. You MUST try:
  - Early L0 builders (safe, builds apple base)
  - Aggressive L3 investors (high reward if affordable)
  - Balanced/cycle policies (exploit cascade timing)
  
  ## Multi-Policy Search Algorithm
  1. Generate 15-20 candidate actions from current state
  2. For EACH candidate:
     - Simulate 100-150 turns with 3-4 different policies
     - Policy 1: If apples < 500 → 70% L0, 30% idle; if 500-5000 → 40% L0/40% L3; if > 5000 → 30% L0/60% L3
     - Policy 2: Aggressive L3 - invest in L3 as soon as affordable (apples >= 200)
     - Policy 3: Conservative - only L3 when apples >= 5000
     - Track which policy gives highest final apples
  3. Pick candidate whose best policy variant gives highest projection
  4. Execute that action, repeat for 500 turns
  
  ## Implementation Checklist
  - Use long long everywhere (apples grow exponentially!)
  - Output exactly 500 lines with "\\n" (double backslash)
  - Never exit early - simulate all turns even if no action possible
  - Try at least 3 different policies per candidate simulation
  
  ## Common Pitfalls
  - Don't stick to one policy - the optimal depends on apple count and timing
  - Don't use too short lookahead (25 turns) - need 100+ for multi-policy comparison
  - Don't forget cascade timing - L3 investments compound after L0 has built base
  - Check affordability before each action - never let apples go negative
tool_descriptions:
  edit_solution: |
    Change the C++ code in the EVOLVE-BLOCK. Modify CPP_CODE to implement a multi-policy
    search algorithm. For each turn, generate candidate actions and simulate each with
    3-4 different policy variants (early-L0, aggressive-L3, balanced, conservative).
    Pick the action-action+policy combination that projects highest final apples.
    Preserve EVOLVE-BLOCK markers. Output exactly 500 lines with "\\n".
  evaluate_solution: |
    Run the C++ program and get combined_score. Higher is better.
    Budget: ~20 total evaluations. Use multi-policy search in code to improve each eval.
  probe_solution: |
    Cheap approximate evaluation using subsampled data (~10s, separate budget).
    Use to filter candidate actions before full evaluation. Still use multi-policy search
    within each candidate's simulation to find the best policy variant.
    Scores are approximate but consistent for ranking.
  finish: |
    End when no further improvement is possible after 20 evaluations. Provide summary
    of best policy variant discovered.
sampling:
  temperature: 0.9
  top_p: 0.95
  top_k: 30
  max_tokens: 16384
agent:
  max_iterations: 50
middleware:
  budget_reminder_from_left: 2
  long_tool_output_max_chars: 8000
new_tools: []
new_skills: []
new_middlewares: []
