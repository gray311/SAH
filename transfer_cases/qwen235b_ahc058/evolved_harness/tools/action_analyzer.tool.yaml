type: tool
name: action_analyzer
description: 'Analyze current state and identify top 18-22 promising machine strengthening actions.

  Scores each action considering:

  1. Current affordability (cost vs apples)

  2. Cascade multiplier potential (higher levels more impactful)

  3. Cost trajectory (C[i][j] grows with level, need to check if affordable multiple turns)

  4. Strategic value (level 3 first for max cascade, but need level 0 for apples)

  Returns pruned list with scores and recommendation. Call once per turn before search.'
input_schema:
  type: object
  properties:
    _sah_py_path:
      type: string
      const: ./custom_tools/action_analyzer.py
      description: Trusted dispatcher binding; omit from tool calls.
