schema: h2spec/1.0
system_prompt: 'You are an expert mathematician at circle packing for n=26 circles in a unit square.


  TASK: Maximize the sum of radii of 26 circles in a unit square.


  SEED SCORE: 0.947992


  GOAL: Beat 0.947992 significantly - aim for 2.635 (AlphaEvolve optimal)


  KEY INSIGHT: The seed uses a SQUARE GRID (non-staggered). Hexagonal (staggered) packing achieves higher
  density.


  CRITICAL GEOMETRIC RULES FOR HEXAGONAL PACKING:

  - Row y-coordinates: [0.10, 0.30, 0.50, 0.70, 0.90] (spread evenly)

  - Horizontal spacing: 0.1667 (tighter than seed)

  - STAGGERING: Odd rows (1, 3) must be offset by HALF the horizontal spacing (0.0833)

  - Even rows (0, 2, 4): x_start = 0.05

  - Odd rows (1, 3): x_start = 0.0833

  - Total circles must be exactly 26 (row_counts = [5,5,5,5,6] or [6,5,5,5,5])


  SEARCH STRATEGY:


  1. FIRST: Call hexagonal_construction tool to get the COMPLETE construct_packing() code

  2. VERIFY: Check the generated code has correct hexagonal staggering (odd rows offset) AND correct cumulative
  indexing

  3. PROBE: Test with probe_solution before full evaluation

  4. EVALUATE: Only evaluate the top 1 variant with evaluate_solution


  FAILURE PATTERNS TO AVOID:

  - DONT manually write hexagonal code - use the tool

  - DONT forget to offset odd rows by 0.0833

  - DONT use 0.20 spacing (too loose)

  - DONT use buggy indexing like row_idx * num_rows + i (use cumulative)

  - DONT generate just a helper function - get the FULL construct_packing() code


  SUCCESS CHECKS:

  - Score > 0.950 (must beat seed)

  - Code is complete construct_packing() from the tool

  - Hexagonal staggering applied (odd rows offset by 0.0833)

  - Horizontal spacing = 0.1667

  - Use probe_solution before evaluate_solution


  # Repaired mounted-tool runtime contract

  The mounted hexagonal_construction tool directly stages the complete EVOLVE-BLOCK replacement. Do not
  copy its output or call edit_solution immediately afterward; call probe_solution on the staged program,
  then evaluate_solution if the probe is valid.


  # Available H2 components

  Tools: edit_solution, evaluate_solution, probe_solution, finish, hexagonal_construction

  Skills: discovery-optimization, hex-pack-complete-guide

  Middleware: indexing_reminder, complete_tool_reminder, BudgetReminderMiddleware, StallRestartMiddleware,
  LongToolOutputMiddleware, RoundAndTokenReminderMiddleware

  Tools and skills are selected when relevant; middleware runs automatically.'
skill_description: Complete hexagonal circle packing construction with proper integration.
skill_body: 'HEXAGONAL CIRCLE PACKING FOR N=26 - COMPLETE INTEGRATION

  PROBLEM: Square grid wastes 20%+ space. Hexagonal packing achieves ~90.69% density.

  SOLUTION: Use hexagonal_construction TOOL to get COMPLETE construct_packing() code.

  THE TOOL DOES IT ALL:

  - The hexagonal_construction tool generates the FULL construct_packing() function - It includes build_hexagonal_grid()
  internally with CORRECT cumulative indexing - It includes compute_max_radii() for overlap handling -
  It returns (centers, radii, sum_radii) just like the seed

  CORRECT HEXAGONAL STRUCTURE:

  1. Row y = [0.10, 0.30, 0.50, 0.70, 0.90] 2. spacing = 0.1667 (not 0.20!) 3. row_counts = [5, 5, 5,
  5, 6] (or permutations) 4. Even rows (0,2,4): x_start = 0.05 5. Odd rows (1,3): x_start = 0.0833 (offset
  by half-spacing) 6. CUMULATIVE INDEXING: Track running total, use centers[cumulative], cumulative +=
  1

  STAGGERING EXPLAINED: - Row 0 (even): 5 circles at x = 0.05, 0.2167, 0.3833, 0.55, 0.7167 - Row 1 (odd):
  5 circles at x = 0.0833, 0.25, 0.4167, 0.5833, 0.75 - This creates hexagonal closest packing pattern

  TOOL USAGE - CRITICAL:

  1. Call hexagonal_construction(row_counts=[5,5,5,5,6]) 2. The tool returns COMPLETE code for construct_packing()
  3. REPLACE the entire EVOLVE-BLOCK with this code 4. DO NOT write any code yourself - use the tool

  VERIFICATION CHECKS:

  - [ ] Generated code is a complete construct_packing() function - [ ] It contains build_hexagonal_grid()
  helper - [ ] It uses cumulative indexing (cumulative += 1 pattern) - [ ] Odd rows have x_start = 0.0833
  - [ ] Horizontal spacing = 0.1667

  PROBING STRATEGY:

  - ALWAYS use probe_solution first (cheap, 30 budget) - Test the generated code - Only call evaluate_solution
  if probe_score > 0.95

  COMMON MISTAKES:

  - Trying to merge tool output with existing code (WRONG!) - Not getting the FULL construct_packing()
  from the tool - Forgetting that odd rows need the 0.0833 offset - Using 0.20 spacing instead of 0.1667
  - Using buggy indexing: row_idx * 5 + i (ALWAYS use cumulative)'
tool_descriptions:
  edit_solution: 'Replace the EVOLVE-BLOCK with the COMPLETE construct_packing() code from hexagonal_construction
    tool.

    CRITICAL: The tool generates the FULL function - use it as-is. Do not modify or merge with existing
    code.

    Expected output: (centers, radii, sum_radii) where sum_radii should exceed 2.6 for optimal packing.'
  evaluate_solution: 'Full evaluation. Budget: 30 total evaluations. Use only after probe_solution confirms
    the construction works and scores > 0.95.'
  probe_solution: 'Fast approximate evaluation (~10s). 30-probe budget available.

    STRATEGY:

    - Call this FIRST after generating hexagonal code

    - A good hexagonal construction should score > 0.95

    - Only call evaluate_solution if probe shows promising results

    - Use probes to quickly test different row_counts permutations'
  finish: End session when optimized or budget exhausted.
sampling:
  temperature: 1.1
  top_p: 0.9
  top_k: 20
  max_tokens: 16000
agent:
  max_iterations: 200
middleware:
  budget_reminder_from_left: 5
  stall_after: 8
  max_restarts: 2
  long_tool_output_max_chars: 8000
new_skills:
- name: hex-pack-complete-guide
  description: Complete guide to hexagonal circle packing with the hexagonal_construction tool.
  body: 'COMPLETE GUIDE: Hexagonal Circle Packing with Tool Integration

    OBJECTIVE: Beat seed score 0.947992 using hexagonal (staggered) packing.

    THE TOOL IS YOUR FRIEND: The hexagonal_construction tool generates the ENTIRE construct_packing()
    function ready to use. No code writing required - just call the tool and replace EVOLVE-BLOCK.

    STEP-BY-STEP WORKFLOW:

    1. CALL THE TOOL: hexagonal_construction(row_counts=[5,5,5,5,6])

    2. COPY OUTPUT: Take the complete code from the tool response

    3. REPLACE EVOLVE-BLOCK: Paste into edit_solution. It must be the ONLY code in the block.

    4. PROBE: Use probe_solution to check the score (should be > 0.95)

    5. EVALUATE (if probe is good): Use evaluate_solution for final score

    WHY HEXAGONAL IS BETTER: - Square grid (seed): circles in perfect rows, 20% wasted space - Hexagonal:
    odd rows shifted by half-spacing, ~90.69% density - For n=26 in unit square, hexagonal can reach sum_radii
    ~2.635

    CORRECT PARAMETERS: - spacing = 0.1667 (not 0.20!) - x_start even rows = 0.05 - x_start odd rows =
    0.0833 - row_y = [0.10, 0.30, 0.50, 0.70, 0.90] - row_counts = [5,5,5,5,6]

    CUMULATIVE INDEXING (CRITICAL): The tool uses cumulative indexing: cumulative = 0 for each row: for
    each circle in row: centers[cumulative] = [x, y] cumulative += 1

    This is DIFFERENT from the buggy seed pattern: centers[row_idx * num_rows + i]  # WRONG!

    PROBING FIRST: - Always use probe_solution before evaluate_solution - Probe is cheap (10s vs minutes),
    has 30 budget - Evaluate only if probe shows promise

    TROUBLESHOOTING:

    Score still low? - Verify you used the COMPLETE code from the tool - Check odd rows have x_start =
    0.0833 - Check spacing = 0.1667 - Verify cumulative indexing is present

    Tool output looks wrong? - The tool should generate construct_packing() with build_hexagonal_grid()
    inside - If you see just build_hexagonal_grid() without construct_packing(), you did it wrong

    Remember: The tool does everything. Just call it, copy, paste, probe, evaluate.'
new_middlewares:
- name: indexing_reminder
  hook: before_model
  description: generated middleware indexing_reminder
  implementation_py: "def before_model(hook_input):\n    history = hook_input.get(\"history\", [])\n \
    \   current_best = hook_input.get(\"current_best_score\", 0.0)\n    budget_left = hook_input.get(\"\
    evaluations_remaining\", 30)\n    \n    reminder = None\n    \n    # Check if model might use buggy\
    \ indexing\n    if \"row_idx * num_rows\" in str(history) or \"row_idx * 5\" in str(history):\n  \
    \      reminder = \"CRITICAL BUG: Using buggy indexing! Use cumulative indexing instead: cumulative\
    \ += 1 pattern.\"\n    \n    elif \"cumulative\" not in str(history) and current_best <= 0.947992:\n\
    \        reminder = \"INDEXING CHECK: Did you verify cumulative indexing (cumulative += 1)? Buggy\
    \ row_idx*num_rows indexing fails.\"\n    \n    elif current_best <= 0.947992 and budget_left > 10:\n\
    \        reminder = \"STILL AT SEED? Try hexagonal_construction tool with correct cumulative indexing.\"\
    \n    \n    return reminder"
- name: complete_tool_reminder
  hook: before_model
  description: generated middleware complete_tool_reminder
  implementation_py: "def before_model(hook_input):\n    history = hook_input.get(\"history\", [])\n \
    \   \n    reminder = None\n    \n    # Check if model is trying to manually write code instead of\
    \ using tool\n    if \"construct_packing\" in str(history) and \"def build_hexagonal\" in str(history):\n\
    \        if len([h for h in history if \"hexagonal_construction\" in str(h)]) == 0:\n            reminder\
    \ = \"USE THE TOOL: Call hexagonal_construction() first! It generates complete construct_packing()\
    \ code.\"\n    \n    # Check if model is trying to merge tool output\n    if \"merge\" in str(history).lower()\
    \ or \"append\" in str(history).lower():\n        reminder = \"DO NOT MERGE: The tool output is the\
    \ COMPLETE construct_packing(). Replace EVOLVE-BLOCK entirely.\"\n    \n    return reminder"
new_tools:
- name: hexagonal_construction
  description: Validate a 26-circle staggered row pattern and directly stage a complete, deterministic
    solver that searches several row layouts, solves optimal radii by linear programming, and refines
    center coordinates. Call probe_solution next.
  input_schema:
    type: object
    properties:
      row_counts:
        type: array
        items:
          type: integer
          minimum: 1
        minItems: 4
        maxItems: 7
        description: Positive row counts summing exactly to 26.
      refinement_passes:
        type: integer
        enum:
        - 1
        - 2
        default: 1
        description: One pass is faster; two performs a longer coordinate refinement.
    additionalProperties: false
  implementation_py: "def run(ctx, args):\n    row_counts = args.get(\"row_counts\", [4, 5, 4, 5, 4, 4])\n\
    \    if not isinstance(row_counts, list) or not 4 <= len(row_counts) <= 7:\n        return {\"status\"\
    : \"rejected\", \"error\": \"row_counts must contain 4-7 rows\"}\n    if not all(isinstance(value,\
    \ int) and value > 0 for value in row_counts):\n        return {\"status\": \"rejected\", \"error\"\
    : \"row counts must be positive integers\"}\n    if sum(row_counts) != 26:\n        return {\"status\"\
    : \"rejected\", \"error\": \"row counts must sum to 26\"}\n    passes = args.get(\"refinement_passes\"\
    , 1)\n    if not isinstance(passes, int) or passes < 1 or passes > 2:\n        return {\"status\"\
    : \"rejected\", \"error\": \"refinement_passes must be 1 or 2\"}\n    template = '\"\"\"Deterministic\
    \ n=26 staggered-layout search with LP radius refinement.\"\"\"\\nimport numpy as np\\n\\n\\ndef _optimal_radii(centers):\\\
    n    n = len(centers)\\n    border = np.min(np.column_stack((centers, 1.0 - centers)), axis=1)\\n\
    \    try:\\n        from scipy.optimize import linprog\\n        rows, limits = [], []\\n        for\
    \ i in range(n):\\n            for j in range(i + 1, n):\\n                row = np.zeros(n)\\n  \
    \              row[i] = row[j] = 1.0\\n                rows.append(row)\\n                limits.append(float(np.linalg.norm(centers[i]\
    \ - centers[j])))\\n        result = linprog(-np.ones(n), A_ub=np.asarray(rows),\\n              \
    \           b_ub=np.asarray(limits), bounds=[(0.0, float(v)) for v in border],\\n                \
    \         method=\"highs\")\\n        if result.success:\\n            return np.maximum(result.x\
    \ - 2e-8, 0.0)\\n    except Exception:\\n        pass\\n    radii = border.copy()\\n    for _ in range(25):\\\
    n        for i in range(n):\\n            for j in range(i + 1, n):\\n                distance = float(np.linalg.norm(centers[i]\
    \ - centers[j]))\\n                excess = radii[i] + radii[j] - distance\\n                if excess\
    \ > 0:\\n                    cut_i = min(radii[i], 0.5 * excess + 1e-9)\\n                    radii[i]\
    \ -= cut_i\\n                    radii[j] = max(0.0, radii[j] - (excess - cut_i + 1e-9))\\n    return\
    \ np.maximum(radii - 2e-8, 0.0)\\n\\n\\ndef _layout(counts, spacing, margin, phase):\\n    ys = np.linspace(margin,\
    \ 1.0 - margin, len(counts))\\n    points = []\\n    for row, (count, y) in enumerate(zip(counts,\
    \ ys)):\\n        start = 0.5 - 0.5 * (count - 1) * spacing\\n        if row % 2:\\n            start\
    \ += phase * spacing\\n        end = start + (count - 1) * spacing\\n        if start <= 0.002 or\
    \ end >= 0.998:\\n            return None\\n        points.extend((start + k * spacing, y) for k in\
    \ range(count))\\n    return np.asarray(points, dtype=float)\\n\\n\\ndef _score(centers):\\n    radii\
    \ = _optimal_radii(centers)\\n    return float(np.sum(radii)), radii\\n\\n\\ndef construct_packing():\\\
    n    requested = __ROW_COUNTS__\\n    patterns = [requested, [4, 5, 4, 5, 4, 4], [5, 4, 5, 4, 4, 4],\\\
    n                [5, 5, 5, 5, 6], [6, 5, 5, 5, 5]]\\n    unique, seen = [], set()\\n    for counts\
    \ in patterns:\\n        key = tuple(counts)\\n        if key not in seen and sum(key) == 26:\\n \
    \           seen.add(key)\\n            unique.append(list(key))\\n    # A validity-safe 5x5 anchor\
    \ plus one tiny corner circle matches the strong\\n    # historical 2.502 family; the staggered/LP\
    \ search below can improve it.\\n    anchor = np.asarray([(0.1 + 0.2 * x, 0.1 + 0.2 * y)\\n      \
    \                   for y in range(5) for x in range(5)] + [(0.002, 0.002)])\\n    best_sum, best_radii\
    \ = _score(anchor)\\n    best_centers = anchor.copy()\\n    for counts in unique:\\n        for spacing\
    \ in np.linspace(0.17, 0.225, 6):\\n            for margin in (0.06, 0.08, 0.10, 0.12):\\n       \
    \         for phase in (-0.25, 0.0, 0.25):\\n                    centers = _layout(counts, float(spacing),\
    \ margin, phase)\\n                    if centers is None or centers.shape != (26, 2):\\n        \
    \                continue\\n                    value, radii = _score(centers)\\n                \
    \    if value > best_sum:\\n                        best_sum, best_centers, best_radii = value, centers.copy(),\
    \ radii\\n    for _ in range(__REFINEMENT_PASSES__):\\n        for step in (0.012, 0.006, 0.003):\\\
    n            for i in range(26):\\n                for dim in (0, 1):\\n                    for direction\
    \ in (-1.0, 1.0):\\n                        trial = best_centers.copy()\\n                       \
    \ trial[i, dim] += direction * step\\n                        if not 0.002 < trial[i, dim] < 0.998:\\\
    n                            continue\\n                        value, radii = _score(trial)\\n  \
    \                      if value > best_sum + 1e-9:\\n                            best_sum, best_centers,\
    \ best_radii = value, trial, radii\\n    best_radii = np.maximum(best_radii - 2e-8, 0.0)\\n    return\
    \ best_centers, best_radii, float(np.sum(best_radii))\\n'\n    code = template.replace(\"__ROW_COUNTS__\"\
    , repr(row_counts))\n    code = code.replace(\"__REFINEMENT_PASSES__\", str(passes))\n    staged =\
    \ ctx.stage_edit(code)\n    ctx.log(\"hexagonal_construction staged a complete 26-circle LP-refined\
    \ solver\")\n    return {\n        \"status\": \"staged\",\n        \"row_counts\": row_counts,\n\
    \        \"refinement_passes\": passes,\n        \"candidate_code_chars\": len(code),\n        \"\
    stage_result\": str(staged)[:400],\n        \"next_action\": \"Call probe_solution, then evaluate_solution\
    \ if valid. Do not copy or retype the code.\"\n    }\n"
