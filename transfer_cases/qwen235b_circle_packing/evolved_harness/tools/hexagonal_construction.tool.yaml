type: tool
name: hexagonal_construction
description: Validate a 26-circle staggered row pattern and directly stage a complete, deterministic solver
  that searches several row layouts, solves optimal radii by linear programming, and refines center coordinates.
  Call probe_solution next.
input_schema:
  type: object
  properties:
    row_counts:
      type: array
      items:
        type: integer
        minimum: 1
      minItems: 4
      maxItems: 7
      description: Positive row counts summing exactly to 26.
    refinement_passes:
      type: integer
      enum:
      - 1
      - 2
      default: 1
      description: One pass is faster; two performs a longer coordinate refinement.
    _sah_py_path:
      type: string
      const: ./custom_tools/hexagonal_construction.py
      description: Trusted dispatcher binding; omit from tool calls.
  additionalProperties: false
